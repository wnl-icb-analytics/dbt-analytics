name: dbt Code Quality

on:
  # No branch filter: stacked PRs target feature branches, and the
  # hardcoded-references check is required on main, so every layer must run it.
  # Static checks only - no secrets.
  pull_request:
  # Required checks must also report on merge-queue candidates or queued PRs
  # cannot merge.
  merge_group:
    types: [checks_requested]

# Static checks only - the token never needs more than checkout.
permissions:
  contents: read

jobs:
  hardcoded-references:
    name: No Hardcoded Table References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get changed files
        id: changed
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          # Via env, not inline template expansion: a branch name can contain
          # shell metacharacters.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # merge_group has no base_ref; diff against the candidate's base SHA.
          BASE="${MERGE_GROUP_BASE_SHA:-origin/$BASE_REF}"
          # Pass the list as a file: a large diff exceeds the 128 KB limit on one
          # env var or argument.
          { git diff --name-only "$BASE"...HEAD | grep -E '\.(sql)$' | grep -E '^(models|macros|analyses)/' || true; } > "$RUNNER_TEMP/changed_files.txt"
          if [ -s "$RUNNER_TEMP/changed_files.txt" ]; then echo 'any=true' >> "$GITHUB_OUTPUT"; fi
      - name: Run check
        if: steps.changed.outputs.any == 'true'
        run: |
          mapfile -t files < "$RUNNER_TEMP/changed_files.txt"
          bash scripts/ci/check_hardcoded_refs.sh "${files[@]}" | tee result.txt
          cat result.txt >> $GITHUB_STEP_SUMMARY
          grep -q "^FAILED" result.txt && exit 1 || exit 0

  staging-references:
    name: Raw/Source References Only in Staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get changed files
        id: changed
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          # Via env, not inline template expansion: a branch name can contain
          # shell metacharacters.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # merge_group has no base_ref; diff against the candidate's base SHA.
          BASE="${MERGE_GROUP_BASE_SHA:-origin/$BASE_REF}"
          # Pass the list as a file: a large diff exceeds the 128 KB limit on one
          # env var or argument.
          { git diff --name-only "$BASE"...HEAD | grep -E '\.sql$' | grep -E '^models/' || true; } > "$RUNNER_TEMP/changed_files.txt"
          if [ -s "$RUNNER_TEMP/changed_files.txt" ]; then echo 'any=true' >> "$GITHUB_OUTPUT"; fi
      - name: Run check
        if: steps.changed.outputs.any == 'true'
        run: |
          mapfile -t files < "$RUNNER_TEMP/changed_files.txt"
          bash scripts/ci/check_staging_refs.sh "${files[@]}" | tee result.txt
          cat result.txt >> $GITHUB_STEP_SUMMARY
          grep -q "^FAILED" result.txt && exit 1 || exit 0

  model-descriptions:
    name: Model Descriptions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml
      - name: Get changed files
        id: changed
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          # Via env, not inline template expansion: a branch name can contain
          # shell metacharacters.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # merge_group has no base_ref; diff against the candidate's base SHA.
          BASE="${MERGE_GROUP_BASE_SHA:-origin/$BASE_REF}"
          # Pass the list as a file: a large diff exceeds the 128 KB limit on one
          # env var or argument.
          { git diff --name-only "$BASE"...HEAD | grep -E '\.sql$' | grep -E '^models/' || true; } > "$RUNNER_TEMP/changed_files.txt"
          if [ -s "$RUNNER_TEMP/changed_files.txt" ]; then echo 'any=true' >> "$GITHUB_OUTPUT"; fi
      - name: Run check
        if: steps.changed.outputs.any == 'true'
        run: |
          mapfile -t files < "$RUNNER_TEMP/changed_files.txt"
          python3 scripts/ci/check_model_descriptions.py "${files[@]}" | tee result.txt
          cat result.txt >> $GITHUB_STEP_SUMMARY
          grep -q "^FAILED" result.txt && exit 1 || exit 0

  model-tests:
    name: Model Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Get changed files
        id: changed
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          # Via env, not inline template expansion: a branch name can contain
          # shell metacharacters.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # merge_group has no base_ref; diff against the candidate's base SHA.
          BASE="${MERGE_GROUP_BASE_SHA:-origin/$BASE_REF}"
          # Pass the list as a file: a large diff exceeds the 128 KB limit on one
          # env var or argument.
          { git diff --name-only "$BASE"...HEAD | grep -E '\.sql$' | grep -E '^models/' || true; } > "$RUNNER_TEMP/changed_files.txt"
          if [ -s "$RUNNER_TEMP/changed_files.txt" ]; then echo 'any=true' >> "$GITHUB_OUTPUT"; fi
      - name: Run check
        if: steps.changed.outputs.any == 'true'
        run: |
          mapfile -t files < "$RUNNER_TEMP/changed_files.txt"
          bash scripts/ci/check_model_tests.sh "${files[@]}" | tee result.txt
          cat result.txt >> $GITHUB_STEP_SUMMARY
          grep -q "^FAILED" result.txt && exit 1 || exit 0

  cluster-tests:
    name: Cluster Existence Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml
      - name: Get changed files
        id: changed
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          # Via env, not inline template expansion: a branch name can contain
          # shell metacharacters.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # merge_group has no base_ref; diff against the candidate's base SHA.
          # YAML changes are included so removing a test from a model is caught.
          BASE="${MERGE_GROUP_BASE_SHA:-origin/$BASE_REF}"
          # Pass the list as a file: a large diff exceeds the 128 KB limit on one
          # env var or argument.
          { git diff --name-only "$BASE"...HEAD | grep -E '\.(sql|yml|yaml)$' | grep -E '^models/' || true; } > "$RUNNER_TEMP/changed_files.txt"
          if [ -s "$RUNNER_TEMP/changed_files.txt" ]; then echo 'any=true' >> "$GITHUB_OUTPUT"; fi
      - name: Run check
        if: steps.changed.outputs.any == 'true'
        run: |
          mapfile -t files < "$RUNNER_TEMP/changed_files.txt"
          python3 scripts/ci/check_cluster_tests.py "${files[@]}" | tee result.txt
          cat result.txt >> $GITHUB_STEP_SUMMARY
          grep -q "^FAILED" result.txt && exit 1 || exit 0
