name: dbt Code Quality

on:
  # No branch filter: stacked PRs target feature branches, and the
  # hardcoded-references check is required on main, so every layer must run it.
  # Static checks only - no secrets.
  pull_request:
  # Required checks must also report on merge-queue candidates or queued PRs
  # cannot merge.
  merge_group:
    types: [checks_requested]

# Static checks only - the token never needs more than checkout.
permissions:
  contents: read

jobs:
  hardcoded-references:
    name: No Hardcoded Table References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get changed files
        id: changed
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          # Via env, not inline template expansion: a branch name can contain
          # shell metacharacters.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # merge_group has no base_ref; diff against the candidate's base SHA.
          BASE="${MERGE_GROUP_BASE_SHA:-origin/$BASE_REF}"
          {
            echo 'files<<CHANGED_FILES_EOF'
            git diff --name-only "$BASE"...HEAD | grep -E '\.(sql)$' | grep -E '^(models|macros|analyses)/' || true
            echo 'CHANGED_FILES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Run check
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          mapfile -t files <<< "$CHANGED_FILES"
          bash scripts/ci/check_hardcoded_refs.sh "${files[@]}" | tee result.txt
          cat result.txt >> $GITHUB_STEP_SUMMARY
          grep -q "^FAILED" result.txt && exit 1 || exit 0

  staging-references:
    name: Raw/Source References Only in Staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get changed files
        id: changed
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          # Via env, not inline template expansion: a branch name can contain
          # shell metacharacters.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # merge_group has no base_ref; diff against the candidate's base SHA.
          BASE="${MERGE_GROUP_BASE_SHA:-origin/$BASE_REF}"
          {
            echo 'files<<CHANGED_FILES_EOF'
            git diff --name-only "$BASE"...HEAD | grep -E '\.sql$' | grep -E '^models/' || true
            echo 'CHANGED_FILES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Run check
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          mapfile -t files <<< "$CHANGED_FILES"
          bash scripts/ci/check_staging_refs.sh "${files[@]}" | tee result.txt
          cat result.txt >> $GITHUB_STEP_SUMMARY
          grep -q "^FAILED" result.txt && exit 1 || exit 0

  model-descriptions:
    name: Model Descriptions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml
      - name: Get changed files
        id: changed
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          # Via env, not inline template expansion: a branch name can contain
          # shell metacharacters.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # merge_group has no base_ref; diff against the candidate's base SHA.
          BASE="${MERGE_GROUP_BASE_SHA:-origin/$BASE_REF}"
          {
            echo 'files<<CHANGED_FILES_EOF'
            git diff --name-only "$BASE"...HEAD | grep -E '\.sql$' | grep -E '^models/' || true
            echo 'CHANGED_FILES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Run check
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          mapfile -t files <<< "$CHANGED_FILES"
          python3 scripts/ci/check_model_descriptions.py "${files[@]}" | tee result.txt
          cat result.txt >> $GITHUB_STEP_SUMMARY
          grep -q "^FAILED" result.txt && exit 1 || exit 0

  model-tests:
    name: Model Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Get changed files
        id: changed
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          # Via env, not inline template expansion: a branch name can contain
          # shell metacharacters.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # merge_group has no base_ref; diff against the candidate's base SHA.
          BASE="${MERGE_GROUP_BASE_SHA:-origin/$BASE_REF}"
          {
            echo 'files<<CHANGED_FILES_EOF'
            git diff --name-only "$BASE"...HEAD | grep -E '\.sql$' | grep -E '^models/' || true
            echo 'CHANGED_FILES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Run check
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          mapfile -t files <<< "$CHANGED_FILES"
          bash scripts/ci/check_model_tests.sh "${files[@]}" | tee result.txt
          cat result.txt >> $GITHUB_STEP_SUMMARY
          grep -q "^FAILED" result.txt && exit 1 || exit 0
