# Check pull request titles against Conventional Commits.
#
# Scopes are optional. When present they are not restricted, so a new domain
# does not need a workflow edit. Automated source-sync pull requests skip the
# check.

name: Pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            perf
            ci
          ignoreLabels: |
            source-sync
