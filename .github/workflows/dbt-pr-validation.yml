# dbt PR Validation Workflow
#
# Required merge-queue check for dbt changes. Pull-request events report the
# check without materialising models; the existing compile workflow gives fast
# feedback on each dbt commit. Once "Merge when ready" is selected, merge_group
# validates the exact candidate GitHub would merge into main:
#
#   1. dbt compile against production metadata (ci-prod).
#   2. dbt build of state:modified nodes in Snowflake DEV - the same selection
#      the post-merge deploy will run (minus downstream), against the same
#      deployed-state manifest. This is a dress rehearsal of the deploy: nodes
#      merged but not yet deployed (e.g. behind a [skip deploy] or an
#      in-flight deploy) stay selected on every candidate until a deploy
#      publishes them, exactly as the next deploy will build them. It also
#      means config-only changes (dbt_project.yml etc.) get a real DEV build,
#      not just a compile.
#
# Queue runs NEVER publish the manifest - only production deploys advance
# deploy state. When no state manifest exists, falls back to building the
# candidate's directly changed nodes (bounded; never a full project build).
#
# Uses --defer --favor-state against the last deployed manifest (from the
# DBT_ARTIFACTS stage): unselected parents resolve to prod relations, so
# validation does not depend on the DEV__ mirror being complete or fresh.
#
# Prerequisites:
#   - Snowflake secrets: SNOWFLAKE_ACCOUNT, SNOWFLAKE__USERNAME,
#     SNOWFLAKE__PRIVATE_KEY, SNOWFLAKE__PASSPHRASE
#   - DBT_ADMIN role with USAGE on WH_WNL_ENGINEERING_M and WH_WNL_OLIDS_L
#     (eFI2 history models)

name: dbt PR Validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  # Required checks must handle merge_group or queued PRs cannot merge.
  merge_group:
    types: [checks_requested]

jobs:
  validate-models:
    name: Validate Changed Models
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      # Merge candidates share DEV relations, so validate them serially. PR
      # status-only runs remain independent and cancel when superseded.
      group: ${{ github.event_name == 'merge_group' && 'dbt-pr-validation-merge-queue' || format('dbt-pr-validation-{0}', github.event.pull_request.number || github.ref_name) }}
      cancel-in-progress: ${{ github.event_name != 'merge_group' }}
    permissions:
      contents: read
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE__USERNAME }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE__PASSPHRASE }}
      SNOWFLAKE_ROLE: DBT_ADMIN
      SNOWFLAKE_WAREHOUSE: WH_WNL_ENGINEERING_M
      # The eFI2 history models expand observations across 60 month-ends. A
      # merge candidate builds them into DEV from empty, so route them off the
      # Medium warehouse here as well as on the monthly refresh in
      # dbt-scheduled.yml.
      EFI2_HISTORY_WAREHOUSE: WH_WNL_OLIDS_L
    steps:
      - name: Report PR-side queue gate
        if: github.event_name == 'pull_request'
        run: |
          echo "Runtime dbt validation is deferred to GitHub's merge queue."
          echo "No models are materialised for this pull-request event."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fallback selection (no state manifest) and diagnostics: lets a failed
      # candidate see at a glance whether a failing node came from this PR's
      # own files or was inherited un-deployed state.
      - name: Map changed files to nodes
        id: changes
        if: github.event_name != 'pull_request'
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE_SHA="$MERGE_GROUP_BASE_SHA"
          else
            # A manual run may target any branch; compare that branch with main.
            BASE_SHA=$(git merge-base origin/main HEAD)
          fi
          echo "Comparing $BASE_SHA...HEAD"

          # Get changed .sql files directly
          SQL_FILES=$(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD -- 'models/**/*.sql')

          # Get changed .yml/.yaml files and find associated .sql models
          YML_FILES=$(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD -- 'models/**/*.yml' 'models/**/*.yaml')

          # Get changed macro files
          MACRO_FILES=$(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD -- 'macros/**/*.sql')

          # Get changed seeds and snapshots (selected by name, like models)
          SEED_FILES=$(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD -- 'seeds/**/*.csv')
          SNAPSHOT_FILES=$(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD -- 'snapshots/**/*.sql')

          # For each yml file, find a corresponding sql file with the same base
          # name. Also retain the YAML path selector so tests in shared files
          # such as schema.yml are not silently missed.
          YML_DERIVED_SQL=""
          for yml in $YML_FILES; do
            dir=$(dirname "$yml")
            base=$(basename "$yml" .yml)
            base=$(basename "$base" .yaml)
            if [ -f "$dir/$base.sql" ]; then
              YML_DERIVED_SQL="$YML_DERIVED_SQL $dir/$base.sql"
            fi
          done

          # For each changed macro, find models that reference it
          MACRO_DERIVED_SQL=""
          for macro_file in $MACRO_FILES; do
            macro_name=$(basename "$macro_file" .sql)
            echo "Searching for models using macro: $macro_name"
            matching_models=$(grep -rl "{{ *$macro_name(" models/ --include="*.sql" 2>/dev/null || true)
            if [ -n "$matching_models" ]; then
              MACRO_DERIVED_SQL="$MACRO_DERIVED_SQL $matching_models"
              echo "  Found: $matching_models"
            fi
          done

          # Combine, deduplicate, and reduce runnable resources to node names.
          # YAML path selectors retain tests/configuration from shared files.
          CHANGED=$(echo "$SQL_FILES $YML_DERIVED_SQL $MACRO_DERIVED_SQL $SEED_FILES $SNAPSHOT_FILES" | tr ' ' '\n' | sort -u | tr '\n' ' ')
          SELECT=$(
            {
              for f in $CHANGED; do basename "$f" | sed 's/\.[^.]*$//'; done
              for f in $YML_FILES; do echo "path:$f"; done
            } | sort -u | tr '\n' ' '
          )
          COUNT=$(echo "$SELECT" | wc -w)
          echo "select=$SELECT" >> $GITHUB_OUTPUT
          echo "node_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Found $COUNT changed nodes: $SELECT"
          [ -n "$YML_FILES" ] && echo "YML changes detected - included associated models" || true
          [ -n "$MACRO_FILES" ] && echo "Macro changes detected - included models that use them" || true

      - name: Install dbt Fusion
        if: github.event_name != 'pull_request'
        run: |
          # Latest Fusion, unpinned - matches the VS Code extension.
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh -s -- --target x86_64-unknown-linux-gnu --update
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/dbt" --version

      - name: Write Snowflake private key
        if: github.event_name != 'pull_request'
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE__PRIVATE_KEY }}
        run: |
          mkdir -p ~/.snowflake
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$HOME/.snowflake/rsa_key.p8" >> "$GITHUB_ENV"

      - name: Install dbt packages
        if: github.event_name != 'pull_request'
        run: dbt deps

      - name: Compile against production metadata
        if: github.event_name != 'pull_request'
        run: dbt compile --target ci-prod --profiles-dir .

      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6
        if: github.event_name != 'pull_request'
        with:
          version: "0.6.x"

      - name: Fetch state manifest
        id: state
        if: github.event_name != 'pull_request'
        run: uv run --with snowflake-connector-python python .github/scripts/fetch_dbt_state.py

      - name: Validate in Snowflake DEV
        if: github.event_name != 'pull_request'
        env:
          NODE_COUNT: ${{ steps.changes.outputs.node_count }}
          PR_SELECT: ${{ steps.changes.outputs.select }}
          HAS_STATE: ${{ steps.state.outputs.has_state }}
        run: |
          if [ "$HAS_STATE" != "true" ]; then
            # No deployed baseline (first activation / stage wiped): fall back
            # to the candidate's directly changed nodes - bounded, and never
            # silently a full-project build.
            if [ "$NODE_COUNT" = "0" ]; then
              echo "No state manifest and no changed dbt files - nothing to validate"
              exit 0
            fi
            echo "No state manifest - falling back to $NODE_COUNT directly changed nodes: $PR_SELECT"
            read -r -a pr_select_args <<< "$PR_SELECT"
            dbt build --target dev --select "${pr_select_args[@]}" --profiles-dir .
            exit 0
          fi

          # Rehearse the deploy: build exactly what state:modified selects
          # against the deployed baseline (the post-merge deploy runs the same
          # selection, plus downstream). Pre-count so an empty selection -
          # e.g. a workflow-only PR in steady state - skips cleanly.
          set +e
          RAW_LS=$(dbt ls --target dev --select state:modified --state state --output name --profiles-dir .)
          LS_EXIT=$?
          set -e
          # Keep only bare node names (sources print dotted); drops any log
          # lines mixed into stdout.
          SELECTED=$(echo "$RAW_LS" | grep -E '^[A-Za-z0-9_.]+$' | sort -u || true)
          if [ "$LS_EXIT" -ne 0 ]; then
            # Never let a listing hiccup skip validation - build and let dbt
            # report the real problem.
            echo "dbt ls failed (exit $LS_EXIT) - proceeding to build state:modified"
          elif [ -z "$SELECTED" ] && [ "$NODE_COUNT" = "0" ]; then
            # Only trust an empty listing when this PR changed no dbt files;
            # skipping is then correct regardless of how ls formats output.
            echo "Nothing modified versus deployed state - skipping DEV build"
            exit 0
          elif [ -z "$SELECTED" ]; then
            # This PR changed dbt files, so an empty listing means the output
            # parsing failed, not that nothing changed - distrust it and build.
            echo "dbt ls returned no parseable nodes but this PR changed $NODE_COUNT dbt nodes - proceeding to build state:modified"
          else
            SELECTED_COUNT=$(echo "$SELECTED" | wc -w)
            OWN=""; OTHER=""
            for node in $SELECTED; do
              case " $PR_SELECT " in
                *" $node "*) OWN="$OWN $node" ;;
                *) OTHER="$OTHER $node" ;;
              esac
            done
            echo "state:modified selected $SELECTED_COUNT nodes"
            [ -n "$OWN" ] && echo "  from this PR's changed files:$OWN"
            # Approximate: includes un-deployed changes from earlier merges,
            # plus nodes this PR affects indirectly (configs, renamed tests).
            [ -n "$OTHER" ] && echo "  not directly from this PR's files (inherited un-deployed state or indirect):$OTHER"
          fi
          # Unselected parents resolve to prod relations from the deployed
          # manifest; --favor-state stops stale DEV__ leftovers winning. The
          # single --state flag serves both the selector and the defer.
          dbt build --target dev --select state:modified --defer --state state --favor-state --profiles-dir .

      - name: Cleanup credentials
        if: always() && github.event_name != 'pull_request'
        run: rm -f ~/.snowflake/rsa_key.p8
