version: 2
macros:
  - name: navigation_build_warehouse
    description: >-
      Runtime hook selecting WH_WNL_OLIDS_L for an initial or full-refresh build when
      the active target role is DBT_ADMIN. Incremental builds and other users retain
      their configured warehouse. The post-hook restores the target warehouse.
    arguments:
      - name: restore
        type: boolean
        description: Restore target.warehouse when true; defaults to false.
