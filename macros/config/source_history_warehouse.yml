version: 2
macros:
  - name: source_history_warehouse
    description: >-
      Use WH_WNL_OLIDS_L for an initial or full-refresh source history build when
      the active dbt role is DBT_ADMIN. Other roles retain the configured target
      warehouse. Call with restore=true afterwards to restore the target warehouse.
      Hook evaluation avoids caching full-refresh flags during partial parsing.
    arguments:
      - name: restore
        type: boolean
        description: Restore the warehouse configured in the dbt target.
