macros:
  - name: set_lifecycle_tag
    description: >
      Sets the DATA_LAKE.CONTROL.LIFECYCLE_STATUS tag on the model's object so Snowsight shows it as
      legacy. Use as a post-hook; the tag is lost when dbt replaces the object, so it must run on every
      build. Put the replacement and any retirement date in the model description.
    arguments:
      - name: status
        type: string
        description: Tag value. Only 'LEGACY' is allowed by the tag.
