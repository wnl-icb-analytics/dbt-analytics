macros:
  - name: calculate_diabetes_triple_target
    description: >-
      National Diabetes Audit treatment targets for diabetes register members at the build date or
      each of the last 60 completed month-ends. Uses the latest HbA1c and blood pressure in the 15
      calendar months ending in the reporting month and statin orders in the same period. Shared by
      fct_person_diabetes_triple_target and its _by_month variant.
    arguments:
      - name: reference
        type: string
        description: current or by_month.
