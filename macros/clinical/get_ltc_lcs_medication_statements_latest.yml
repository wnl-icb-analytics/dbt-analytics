
macros:
  - name: get_ltc_lcs_medication_statements_latest
    description: >
      Returns the most recent medication statement per person and valueset.
      Filters by LTC/LCS valueset IDs or friendly names. Orders by statement_date descending
      with nulls last, date_recorded descending with nulls last, then medication_statement_id descending.
      Same-day records use EMIS save time; result values do not break ties.


    arguments:
      - name: valuesets
        type: string
        description: >
          Comma-separated valueset IDs or friendly names to filter by.
          Can be passed as 'VS001,VS002' or "'VS001','VS002'"
