version: 2

macros:
  - name: get_ltc_lcs_htn_bp_control
    description: >
      Generates the LTC LCS ICS_HTN_21 hypertension BP control outcome for a supplied date
      window. Returns one row per hypertension register member not
      excluded for age 90+, end of life care, care home or latest moderate/severe frailty
      finding, with their latest date-linked clinic/home BP reading in the window and a flag for being below the
      NICE target (under 80: clinic < 140/90, home/ABPM < 135/85; 80+: clinic < 150/90,
      home/ABPM < 145/85). BP and frailty rank by raw clinical date, save time and ID.
      Values must be >=1; no plausibility fallback applies. Frailty excludes only the two finding
      codes. Consumers filter is_active. Shared by rolling and financial-year variants.
    arguments:
      - name: window_start
        type: string
        description: SQL date expression for the inclusive start of the BP lookup window (e.g. "dateadd(month, -12, current_date())").
      - name: window_end
        type: string
        description: SQL date expression for the inclusive end of the BP lookup window (e.g. "current_date()").
