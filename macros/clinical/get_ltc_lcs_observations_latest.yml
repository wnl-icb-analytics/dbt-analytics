
macros:
  - name: get_ltc_lcs_observations_latest
    description: >
      Returns the most recent observation per person and valueset.
      Filters by LTC/LCS valueset IDs or friendly names. Orders by clinical_effective_date descending
      with nulls last, date_recorded descending with nulls last, then observation_id descending.
      Same-day records use EMIS save time; result values do not break ties.


    arguments:
      - name: valuesets
        type: string
        description: >
          Comma-separated valueset IDs or friendly names to filter by.
          Can be passed as 'VS001,VS002' or "'VS001','VS002'"
      - name: match_paths
        type: string
        description: Both mapped and source matches by default; accepts mapped or source alone.
      - name: emis_local_exact
        type: boolean
        description: >
          False by default. When true, local list roots match exactly without
          rejecting local descriptions of listed public concepts.
