macros:
  - name: ltc_lcs_permitted_mapped_codes
    description: >
      Shared P2 mapped-code permissions for LTC LCS observation and medication
      matchers, one row per value set and SNOMED CT code. Public and equivalent
      EMIS-local roots permit their translated concept. Children require
      include_children to be true. Other local roots permit exact source matches
      only, handled by the calling matcher. Refset members remain eligible.
      Permissions are intersected with the supplied expansion to retain its
      exception subtraction and specialised expansion rules. Public-only sets
      retain their existing expansion.
    arguments:
      - name: valuesets_quoted
        type: string
        description: Normalised value-set tokens rendered as quoted SQL literals.
      - name: valuesets_upper_quoted
        type: string
        description: The same tokens in upper case for matching friendly names.
  - name: get_ltc_lcs_latest_record_in_set
    description: >
      Keeps each person's latest observation from the inclusion value sets, then
      checks whether that observation belongs to a test value set. Both pools
      inherit the shared P2 root permissions. Same-day ordering uses EMIS save
      time, then observation ID.
    arguments:
      - name: inclusion_valuesets
        type: string
        description: Comma-separated value-set IDs or friendly names forming the pool.
      - name: test_valuesets
        type: string
        description: Comma-separated value-set IDs or friendly names the kept record must match.
