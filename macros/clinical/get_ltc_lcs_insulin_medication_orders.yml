version: 2
macros:
  - name: get_ltc_lcs_insulin_medication_orders
    description: >
      Insulin prescription issues for LTC LCS, one row per medication order. Uses the OpenSAFELY
      Insulin Medication dm+d list plus descendants of SNOMED 39487003 (Product containing insulin)
      to cover current products absent from that list. Excludes insulin needles and injection devices.
      Returns person_id and the source clinical date as order_date.
