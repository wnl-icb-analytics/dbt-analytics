
macros:
  - name: get_latest_events
    description: >
      Returns the most recent event per partition using Snowflake QUALIFY.
      Does not add a tie-break.


    arguments:
      - name: from_table
        type: string
        description: Source table or CTE to select from

      - name: partition_by
        type: string | list
        description: Column(s) to partition by. Default 'person_id'

      - name: order_by
        type: string | list
        description: >
          Column or expression, or a list of them. direction is applied to each term
          that has no explicit ASC/DESC/NULLS clause. Pass several columns as a list,
          not a comma-separated string. Default 'clinical_effective_date'.

      - name: direction
        type: string
        description: Sort direction (ASC or DESC). Default 'DESC'
