macros:
  - name: snomed_history_predecessors
    description: >
      Adds retired SNOMED predecessors from the NHS England history substitution table.
      Ambiguous predecessors need every listed successor in the same cluster.
      Codes direct in any requested cluster are excluded from history matches.
    arguments:
      - name: cluster_codes
        type: string
        description: CTE name containing mapped_concept_code, cluster_id and the carry columns.
      - name: carry_columns
        type: list
        description: Columns copied from cluster_codes after mapped_concept_code and cluster_id, in list order.
