
macros:
  - name: get_medication_orders
    description: >
      Retrieves standardised medication order data filtered by either BNF code or cluster
      ID. Person comes from the source staging person_id. The patient's sk_patient_id is
      attached when present and is null otherwise.
    arguments:
      - name: bnf_code
        type: string
        description: BNF code prefix to filter medications by (e.g. '0205' for beta blockers)

      - name: cluster_id
        type: string
        description: Cluster ID to filter medications by (e.g. 'AF_MEDICATIONS' for atrial fibrillation drugs)
      - name: include_history
        type: boolean
        description: >
          Adds retired SNOMED predecessors via the NHS England history substitution table. Ambiguous predecessors are included only when every successor is in the same cluster; a code that is direct in any requested cluster is never added to another.
    meta:
      tests:
        - test_get_medication_orders
