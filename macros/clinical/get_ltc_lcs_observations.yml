
macros:
  - name: get_ltc_lcs_observations
    description: >
      Retrieves observations filtered by LTC/LCS valueset IDs or friendly names.
      Public roots and equivalent EMIS-local roots permit their translated concept,
      plus descendants only when include_children is true. Other local roots match
      the original source code only. Incoming local descriptions can still match
      a public concept permitted by another root. Existing expansions and their
      exception subtraction remain the limit on mapped membership.


    arguments:
      - name: valuesets
        type: string
        description: >
          Comma-separated valueset IDs or friendly names to filter by.
          Can be passed as 'VS001,VS002' or "'VS001','VS002'"
      - name: match_paths
        type: string
        description: >
          Both mapped and exact source matches by default. 'mapped' omits exact
          source matches. Legacy 'source' calls also use permitted mapped matches
          under P2, so 'source' has the same behaviour as 'both'.
      - name: include_date_recorded
        type: boolean
        description: >
          Defaults to false. When true, also returns date_recorded, the time the
          record was saved in EMIS, for ordering records on the same clinical date.
