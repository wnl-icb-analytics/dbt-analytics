
macros:
  - name: get_ltc_lcs_observations
    description: >
      Retrieves observations filtered by LTC/LCS valueset IDs or friendly names.
      Joins to expanded concepts and valuesets reference data.


    arguments:
      - name: valuesets
        type: string
        description: >
          Comma-separated valueset IDs or friendly names to filter by.
          Can be passed as 'VS001,VS002' or "'VS001','VS002'"
      - name: emis_local_exact
        type: boolean
        description: >
          Defaults to false. When true, EMIS-local codes in namespace 1000006
          match only their original source code. Other roots retain their mapped
          concepts and permitted descendants within the existing expanded value set.
      - name: include_date_recorded
        type: boolean
        description: >
          Defaults to false. When true, also returns date_recorded, the time the
          record was saved in EMIS, for ordering records on the same clinical date.
