version: 2
macros:
  - name: get_ltc_lcs_bp_latest_by_setting
    description: >
      LTC LCS BP evidence, one row per person as at the supplied date. Links XML components by
      calendar date before ranking by clinical date, save time and observation ID. By default only the
      home-setting wrapper ranks before linking. Consumers apply threshold tests afterwards.
      Clinic/home pools require positive inputs and retain values outside usual
      plausibility ranges. Diabetes keeps its own BP_COD and component pools.
    arguments:
      - name: as_at
        type: string
        description: Inclusive SQL clinical-date cutoff. Defaults to current_date().
      - name: ckd_pg2
        type: boolean
        description: >
          Use CKD PG2's nested XML order. Select the deepest systolic before its
          date-linked diastolic parent. Clinic setting tests the latest combined
          diastolic; home setting tests the latest home diastolic's linked chain
          without a later-clinic veto. Defaults to false for existing consumers.
