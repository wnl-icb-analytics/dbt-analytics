version: 2
macros:
  - name: get_ltc_lcs_bp_latest_by_setting
    description: >
      LTC LCS BP evidence, one row per person as at the supplied date. Ranks XML component pools
      by clinical date, save time and observation ID, links by calendar date, then leaves threshold
      tests to consumers. Clinic/home pools require positive inputs and retain values outside usual
      plausibility ranges. Diabetes keeps its own BP_COD and component pools.
    arguments:
      - name: as_at
        type: string
        description: Inclusive SQL clinical-date cutoff. Defaults to current_date().
