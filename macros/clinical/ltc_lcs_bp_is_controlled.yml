version: 2
macros:
  - name: ltc_lcs_bp_is_controlled
    description: >
      LTC LCS risk-group BP control at the supplied clinic/home thresholds. Tests the latest setting,
      same-date component links, values >=1 and a reading strictly after the window start.
    arguments:
      - name: clinic_systolic
        type: string
        description: Inclusive clinic systolic limit in mmHg.
      - name: clinic_diastolic
        type: string
        description: Inclusive clinic diastolic limit in mmHg.
      - name: home_systolic
        type: string
        description: Inclusive home/ABPM systolic limit in mmHg.
      - name: home_diastolic
        type: string
        description: Inclusive home/ABPM diastolic limit in mmHg.
      - name: window_start
        type: string
        description: Exclusive SQL lower date bound. Defaults to 12 months before today.
