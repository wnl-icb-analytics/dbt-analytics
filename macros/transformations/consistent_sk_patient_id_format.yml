macros:
  - name: consistent_sk_patient_id_format
    description: >
      Coerces a patient surrogate-key expression. Set to VARCHAR. Use for all sk_patient_id
      columns in commissioning staging models so a future switch to numeric keys can
      be made in one place by updating this macro. If doing this check keys are still canonical
      (should be flagged via testing)

    arguments:
      - name: column
        type: string
        description: Column or SQL expression supplying the patient surrogate key