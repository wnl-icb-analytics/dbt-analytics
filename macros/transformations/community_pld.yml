macros:
  - name: community_pld_provider_codes
    description: >
      Distinct type-41 organisation codes from stg_dictionary_dbo_organisation.
      Staging models left join it on the normalised provider code: a match keeps
      the full code, otherwise the first three characters are kept, matching
      clean_organisation_id without its per-row subquery. Null input stays null.
  - name: community_pld_provider_input
    description: Supplied provider code (provider, then legacy, then file metadata), trimmed and upper-cased.
  - name: community_pld_provider_code
    description: >
      Cleaned provider code for a row joined to community_pld_provider_codes: the
      full code for a type-41 organisation, otherwise its first three characters.
