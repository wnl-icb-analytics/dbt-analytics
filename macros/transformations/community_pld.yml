macros:
  - name: community_pld_provider_codes
    description: >
      One cleaned code per distinct supplied community provider code, including
      a null mapping. Reuses clean_organisation_id before joining the mapping
      to the full feed, so the organisation lookup does not group contact or
      referral rows. The source must be the raw model used by its staging model.
    arguments:
      - name: raw_model
        type: string
        description: Raw community model with the three provider-code inputs.
