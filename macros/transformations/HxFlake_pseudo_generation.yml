
macros:
  - name: hxflake_pseudo_generation
    description: >
      Generates an HxFlake pseudonym in XX-XXX-XXX format from a patient surrogate key for re-id API use


    arguments:
      - name: sk_patient_id
        type: string
        description: Universal commissioning data patient ID

  - name: hxflake_to_sk_patient_id
    description: >
      Recovers sk_patient_id (as varchar) from an HxFlake pseudonym. Inverse of
      hxflake_pseudo_generation while sk_patient_id is below 16^8, the largest value
      eight hex digits can hold. Returns null for a malformed pseudonym.
    arguments:
      - name: hx_flake
        type: string
        description: HxFlake pseudonym in XX-XXX-XXX format
