version: 2

macros:
  - name: age_band_nhs
    description: >
      NHS age band for an age already supplied in years, such as a source-derived age at an event. Uses the
      labels of age_band_nhs in calculate_age_attributes (0-4, 5-14, 15-24 ... 75-84, 85+), and Unknown for a
      null or negative age. Use calculate_age_attributes when a birth date is available.
    arguments:
      - name: age
        type: string
        description: Expression giving age in whole years.
