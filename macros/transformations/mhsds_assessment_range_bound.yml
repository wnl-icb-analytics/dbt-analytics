version: 2
macros:
  - name: mhsds_assessment_range_bound
    description: >-
      Extract one signed numeric bound from a complete ETOS assessment range.
      Distinguishes the range separator from either bound's minus sign. Returns
      null for an enumerated response or unsupported range notation. Does not
      define or change a clinical threshold.
    arguments:
      - name: value
        type: string
        description: SQL expression containing the published range.
      - name: bound
        type: string
        description: minimum or maximum.
