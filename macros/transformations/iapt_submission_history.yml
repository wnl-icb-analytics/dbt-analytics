version: 2
macros:
  - name: iapt_unseen_submission
    description: >-
      Select a complete accepted submission when it is absent from the retained
      IAPT source history. Changes within an already retained submission are
      reconciled by the monthly full refresh.
    arguments:
      - name: submission_id
        type: string
        description: SQL expression for the accepted submission identifier.
  - name: iapt_remove_withdrawn_submissions
    description: >-
      Remove source versions withdrawn from the shared accepted-submission
      snapshot, including replacements with no rows in this source table.
      An empty snapshot does not trigger deletion and fails the snapshot test.
