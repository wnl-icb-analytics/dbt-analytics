
macros:
  - name: generate_schema_name
    description: >
      dbt override for schema name generation from model folder paths.
      Staging uses the source-system folder, OLIDS uses DOMAIN_SUBDOMAIN, and other
      modelling, reporting, and reference models use their domain folder.
    arguments:
      - name: custom_schema_name
        type: string
        description: Custom schema name from config

      - name: node
        type: any
        description: dbt node object (provided by dbt)
