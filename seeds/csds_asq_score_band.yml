version: 2
seeds:
- name: csds_asq_score_band
  description: One national ASQ-3 score-band code and label from C612D45 in the CYP612CodedAssessmentContact
    worksheet of CSDS ETOS v1.6.10. These label the supplied band, without recalculating the score or threshold.
  config:
    meta:
      owner:
        name: Eddie Davison
    column_types:
      code: varchar(2)
      description: varchar(100)
      specification_version: varchar(20)
      source_worksheet: varchar(50)
      source_url: varchar(500)
  columns:
  - name: code
    description: ASQ-3 dimension and band code as supplied by CSDS.
    data_tests: [not_null, unique]
  - name: description
    description: National band label published in ETOS.
    data_tests: [not_null]
  - name: specification_version
    description: CSDS ETOS version supplying the definition.
  - name: source_worksheet
    description: ETOS worksheet holding the permitted values.
  - name: source_url
    description: Public NHS England Digital location of the ETOS workbook.
