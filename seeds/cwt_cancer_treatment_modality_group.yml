version: 2
seeds:
  - name: cwt_cancer_treatment_modality_group
    description: >-
      Categories treatment modality codes to modality groups. Mapping is maintained in-house seperately to the descriptions the modality codes map to.
    config:
      meta:
        owner:
          name: Jake Kealey
      column_types:
        code: varchar(2)
        treatment_group: varchar(60)
    columns:
      - name: code
        description: Treatment modality code
        data_tests: [not_null, unique]
      - name: treatment_group
        description: Treatment modality group name
        data_tests: [not_null]