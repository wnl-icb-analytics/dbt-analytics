version: 2

seeds:
  - name: nhse_service_codes_by_year_v38
    description: |
      NHS E Service Codes by Year v38. This is a curated list of NHS E service codes, including the year they were active and their corresponding service names. It is used for mapping and analysis of healthcare services over time.
    config:
      column_types:
        service_code: varchar(16)
        service_name: varchar(255)
        year_active: integer
      meta:
        owner:
          name: DataTeamLead
    columns:
      - name: service_code
        description: Unique identifier for the NHS E service.
        tests:
          - unique
          - not_null
      - name: service_name
        description: Full name of the NHS E service.
      - name: year_active
        description: The year in which the service code was active.