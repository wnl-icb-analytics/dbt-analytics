version: 2

seeds:
  - name: nhse_mh_currency_icd10_groups_2627
    description: >
      Three-character ICD-10 range mappings for 2026/27 mental health
      currencies. Grain: one row per ICD-10 range start.
    config:
      meta:
        owner:
          name: Eddie Davison
      column_types:
        icd10_range_start: varchar(10)
        icd10_range_end: varchar(10)
        population_category: varchar(20)
    columns:
      - name: icd10_range_start
        description: Inclusive ICD-10 range start.
        data_tests:
          - not_null
          - unique
      - name: icd10_range_end
        description: Inclusive ICD-10 range end.
      - name: population_category
        description: Mapped population category.
