version: 2

seeds:
  - name: nhse_mh_currency_referral_reasons_2627
    description: >
      MHS101 primary referral reason mappings for 2026/27 mental health
      currencies. Codes 09 and 28 are substance misuse and are absent because
      they were removed from these currencies. Grain: one row per referral
      reason code.
    config:
      meta:
        owner:
          name: Eddie Davison
      column_types:
        prim_reason_referral_mh: varchar(10)
        population_category: varchar(20)
    columns:
      - name: prim_reason_referral_mh
        description: MHS101 primary reason for referral code.
        data_tests:
          - not_null
          - unique
      - name: population_category
        description: Mapped population category or cannot_classify.
