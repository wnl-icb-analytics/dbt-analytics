version: 2

seeds:
  - name: mhsds_diagnosis_scheme_supplement
    description: >
      MHSDS diagnosis-scheme labels absent from UKHFD. Code 07 is ICD-11 in
      ETOS v6.0.7.1, MHS601/MHS604/MHS605 Diagnosis Scheme In Use. This seed
      supplies a label, not a rule about when a submitted diagnosis was valid.
    config:
      column_types:
        code: varchar(2)
    columns:
      - name: code
        data_tests: [not_null, unique]
      - name: description
        data_tests: [not_null]
