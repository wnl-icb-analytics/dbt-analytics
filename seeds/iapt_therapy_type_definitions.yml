version: 2
seeds:
  - name: iapt_therapy_type_definitions
    description: >-
      NHS Talking Therapies (IAPT data set) therapy types from the "Therapy
      Types" sheet of the IAPT v2 terminology mapping guidance v3.4. One row per
      SNOMED CT concept that IDS202 Coded Procedure should use for a nationally
      reported therapy, with its intensity group and v1.5 national code. Regenerate
      with scripts/reference/generate_iapt_therapy_type_seed.py. User guidance
      v1.6.1 p53 also lists 1129481000000107 Behavioural couple therapy, which the
      workbook does not; it is not added here.
    config:
      column_types:
        snomed_code: varchar(18)
        legacy_therapy_type_code: varchar(2)
    columns:
      - name: snomed_code
        description: SNOMED CT concept for the therapy.
        data_tests: [not_null, unique]
      - name: snomed_preferred_term
        description: Preferred term printed in the workbook.
      - name: therapy_type_category
        description: Low Intensity, High Intensity or Employment Support.
      - name: legacy_therapy_type_code
        description: IAPT v1.5 national therapy type code. Null for concepts new or amended in v2.0.
      - name: legacy_therapy_type_description
        description: IAPT v1.5 national code definition, or the workbook name for a new concept.
      - name: source_row
        description: One-based row in the Therapy Types worksheet.
