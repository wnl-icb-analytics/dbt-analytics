version: 2

seeds:
  - name: nhse_mh_currency_population_groups_2627
    description: >
      NHSE mental health currency population groups for 2026/27. Grain: one row
      per population category.
    config:
      meta:
        owner:
          name: Eddie Davison
      column_types:
        population_category: varchar(20)
        currency_group: varchar(10)
        population_name: varchar(100)
        available_to_cyp: boolean
    columns:
      - name: population_category
        description: Population category used in currency grouping.
        data_tests:
          - not_null
          - unique
      - name: currency_group
        description: Three-character currency group.
        data_tests:
          - not_null
          - unique
      - name: population_name
        description: Population group name.
      - name: available_to_cyp
        description: Whether the category can classify a child or young person.
