version: 2
seeds:
  - name: iapt_assessment_scale_definitions
    description: >-
      Public routine outcome measure metadata from the NHS Talking Therapies
      (IAPT data set) TOS "ROM Mapping" sheets, v2.0.26 and ETOS v2.1.22. One row
      per concept, published value and specification version. Generated by
      scripts/reference/generate_iapt_assessment_seed.py; do not edit by hand.
      Published "not available" and "Not Applicable" values are marked as
      non-score responses. The specification version records where a definition
      was published, not which revision a provider implemented. This is reference
      metadata, not submitted assessment data or permission to use a licensed tool.
    config:
      column_types:
        concept_code: varchar(18)
        published_value: varchar(100)
        response_description: varchar(4000)
        decimal_places: varchar(20)
        specification_version: varchar(20)
        is_non_score_response: boolean
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [concept_code, published_value, specification_version]
    columns:
      - name: concept_code
        description: SNOMED CT observable concept ID published for the measure.
        data_tests: [not_null]
      - name: published_value
        description: Enumerated response code or verbatim published numeric range.
      - name: response_description
        description: Published response meaning; null for ranges without a label.
      - name: decimal_places
        description: Published RANGE_SCORE, the decimal places accepted without a warning. More decimals still flow.
      - name: collection_start_date
        description: Published collection start date of the tool.
      - name: specification_version
        description: >-
          Specification publishing the row. Revisions changed definitions within a
          data set version: TOS 2.0.27 (January 2021, not extracted) changed the
          Diabetes Distress Scale from the 17-102 total shown in 2.0.26 to the 1-6
          mean shown in 2.1.22.
      - name: source_row
        description: One-based row in the ROM Mapping worksheet of the named specification.
      - name: is_non_score_response
        description: >-
          True when the published meaning is not a score: "Not Applicable", or the
          WSAS work value 9, which the guidance says "indicates the score is not
          available" (ROM Mapping row 47 in v2.0.26, row 49 in v2.1.22).
