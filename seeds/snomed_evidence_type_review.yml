seeds:
  - name: snomed_evidence_type_review
    description: Reviewed examples of SNOMED activity evidence types and their interpretation. No patient data or exhaustive national-list membership.
    config:
      column_types:
        snomed_code: varchar(32)
        evidence_type: varchar(32)
        basis: varchar(500)
    columns:
      - name: snomed_code
        data_tests: [unique, not_null]
      - name: evidence_type
        data_tests: [not_null]
      - name: basis
        description: Reason this code has the reviewed activity meaning.
        data_tests: [not_null]
