version: 2
models:
- name: stg_iapt_referral_history
  description: One NHS Talking Therapies referral as reported in one accepted submission. Open referrals are
    resubmitted every month, so a referral has one row per reported month. Dates are kept as submitted; NHS England
    pathway derivations are those supplied with that submission. Latest-version selection happens in
    fct_iapt_referral.
  config:
    meta:
      owner:
        name: Eddie Davison
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - submission_id
        - referral_id
  columns:
  - name: submission_id
    data_tests:
    - not_null
  - name: referral_id
    description: Provider-qualified referral identifier (Unique_ServiceRequestID).
    data_tests:
    - not_null
  - name: person_id
    description: IAPT Person_ID on this version. Can differ between versions of the same referral.
  - name: source_of_referral_iapt
    description: Warehouse IAPT referral source field. v2.1 submits IAPT referral source codes; v2.0 mental health
      referral source codes are copied into this field too. Read with dataset_version.
  - name: source_of_referral_mh
    description: Warehouse mental health referral source field. v2.0 submits mental health referral source codes;
      v2.1 IAPT referral source codes are copied into this field too. Read with dataset_version.
  - name: onset_date
    description: Year and month of symptom onset as supplied, format YYYY-MM.
  - name: therapy_type_first
    description: NHS England first therapy type (I101D32), a SNOMED CT procedure concept or IET followed by the
      internet-enabled therapy programme text.
  - name: therapy_type_last
    description: NHS England last therapy type (I101D33), in the same form as therapy_type_first.
  - name: use_quarter_referral_flag
    description: NHS England UseQuarterReferral_Flag (I101D13), TRUE on the latest monthly version of the pathway
      within its financial quarter.
  - name: primary_presenting_complaint
    description: Earlier name of the NHS England presenting complaint higher-category derivation, not a code.
  - name: secondary_presenting_complaint
    description: Earlier name of the NHS England presenting complaint lower-category derivation, not a code.
