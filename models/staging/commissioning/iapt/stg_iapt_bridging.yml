version: 2
models:
- name: stg_iapt_bridging
  description: One IAPT Person_ID with its pseudonymised NHS number key. Person_ID is only comparable within the IAPT
    data set; sk_patient_id is the cross-system key. Blank and placeholder '1' pseudonyms are nulled.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: person_id
    description: IAPT pseudonymised Person_ID.
    data_tests:
    - unique
    - not_null
  - name: sk_patient_id
    description: Pseudonymised NHS number key shared across datasets; null when the bridge has no usable value or has conflicting usable keys.
