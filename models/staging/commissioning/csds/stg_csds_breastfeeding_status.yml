version: 2
models:
- name: stg_csds_breastfeeding_status
  description: One accepted CYP610 breastfeeding status, recorded at a care activity. ETOS permits one status
    per activity, the most recently recorded. There is no submitted observation date; dmic_observation_date
    is a separate warehouse-derived date.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: cyp610_unique_id
    description: Source table row identifier within an accepted submission.
    data_tests:
    - not_null
    - unique
  - name: unique_submission_id
    description: Accepted source submission supplying this occurrence.
