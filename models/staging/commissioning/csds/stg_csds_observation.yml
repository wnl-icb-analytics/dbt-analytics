version: 2
models:
- name: stg_csds_observation
  description: One accepted CYP611 weight, height or length observation row, recorded at a care activity.
    ETOS defines the units as kilograms, metres and centimetres. There is no submitted observation date;
    dmic_observation_date is a separate warehouse-derived date.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: cyp611_unique_id
    description: Source table row identifier within an accepted submission.
    data_tests:
    - not_null
    - unique
  - name: person_weight
    description: Weight in kilograms.
  - name: person_height_in_metres
    description: Height in metres.
  - name: person_length_in_centimetres
    description: Length of a baby in centimetres.
  - name: unique_submission_id
    description: Accepted source submission supplying this occurrence.
