version: 2
models:
- name: stg_csds_previous_diagnosis_history
  description: One CYP601 previous diagnosis row from an accepted CSDS submission. Providers restate medical
    history every month, so the same diagnosis repeats across reporting periods.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: cyp601_unique_id
    description: Source table row identifier, unique across accepted submissions.
    data_tests:
    - not_null
    - unique
  - name: unique_submission_id
    description: Accepted source submission supplying this occurrence.
- name: stg_csds_previous_diagnosis
  description: Latest accepted CYP601 previous diagnosis for each person, provider, diagnosis scheme, code and
    diagnosis date, the ETOS derivation key plus the scheme. A missing diagnosis date is part of the
    key. Rows missing another key field keep each source occurrence.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: source_record_id
    description: ETOS record key, with a source-row fallback when a required key field is missing.
    data_tests:
    - not_null
    - unique
  - name: cyp601_unique_id
    description: Source row of the selected accepted occurrence.
  - name: first_reported_period_end_date
    description: Earliest accepted reporting period containing this key.
  - name: last_reported_period_end_date
    description: Latest accepted reporting period containing this key.
  - name: accepted_source_record_count
    description: Number of accepted source rows represented by the selected occurrence.
