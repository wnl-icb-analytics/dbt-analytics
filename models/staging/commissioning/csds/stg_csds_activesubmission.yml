version: 2
models:
- name: stg_csds_activesubmission
  description: One accepted CSDS submission with its reporting period and header metadata. The accepted-file
    feed determines replacement; receipt time is delivery metadata, not clinical time.
  config:
    meta:
      owner:
        name: Emily Baldwin
  columns:
  - name: unique_submission_id
    description: Unique identifier at the documented model grain.
    data_tests:
    - unique
    - not_null
  - name: csds_version
    description: Submitted dataset version. Null if the accepted header is absent.
  - name: source_file_received_at
    description: Timestamp the file was received by the submission portal.
  - name: reporting_period_end_date
    description: Last date of the submitted reporting month.
