version: 2
models:
  - name: stg_csds_activity_assessment
    description: One accepted assessment occurrence linked directly to a care activity. There is no submitted assessment date; dmic_observation_date is a separate warehouse-derived date.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: cyp612_unique_id
        description: Source table row identifier within an accepted submission.
        data_tests: [not_null, unique]
      - name: unique_submission_id
        description: Accepted source submission supplying this occurrence.
      - name: asq_score_band
        description: Supplied ASQ-3 dimension and band code (CSDS ETOS C612D45), not a recalculated classification.
          Null when absent; labelled in fct_csds_clinical_record.
