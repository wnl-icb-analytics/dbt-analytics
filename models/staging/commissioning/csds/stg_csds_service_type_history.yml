version: 2
models:
- name: stg_csds_service_type_history
  description: One delivered CYP102 service/team row in an accepted submission, at cyp102_unique_id grain.
    Includes all reporting periods and legitimate nullable team identifiers. Repeated submission/referral/team
    keys remain distinct source deliveries; latest logical relationships are published separately.
  config:
    meta:
      owner:
        name: Emily Baldwin
  columns:
  - name: unique_service_request_identifier
    description: Supplied provider-qualified service request identifier.
  - name: service_request_identifier
    description: Local service request identifier as supplied by the provider.
  - name: care_professional_team_local_identifier
    description: Local team identifier. Null is a legitimate unspecified team key and is retained.
  - name: unique_care_professional_team_local_identifier
    description: Source-derived provider-qualified team identifier; the local team identifier defines
      the documented relationship key.
  - name: service_or_team_type_referred_to_community_care
    description: Supplied community service/team type. Different team relationships for a referral remain
      separate.
  - name: referral_closure_date
    description: Date this service/team closed its referral. Other teams can remain open under the overarching
      referral.
  - name: referral_rejection_date
    description: Date this service/team rejected its referral; null when not supplied.
  - name: referral_closure_reason
    description: Supplied reason this team closed its referral.
  - name: referral_rejection_reason
    description: Supplied reason this team rejected its referral.
  - name: cyp102_unique_id
    description: Identifier of one delivered CYP102 source row.
    data_tests:
    - unique
    - not_null
  - name: person_id
    description: CSDS person identifier supplied on this row. It is not replaced by the parent person.
  - name: unique_submission_id
    description: Accepted submission identifier for this service/team source row.
  - name: organisation_code_provider
    description: Supplied provider organisation code.
  - name: organisation_identifier_code_of_provider
    description: Provider organisation identifier used to namespace submitted local identifiers.
  - name: effective_from
    description: Date and time the submission portal received the file; not the time of care.
  - name: record_start_date
    description: Supplied reporting-period validity start, not referral or activity time.
  - name: record_end_date
    description: Supplied reporting-period validity end. Null denotes no successor in the source derivation,
      not clinical discharge.
  - name: reporting_period_start_date
    description: First date of the source reporting period; delivery context, not clinical event time.
  - name: reporting_period_end_date
    description: Last date of the source reporting period; delivery context, not clinical event time.
  - name: file_type
    description: Supplied submission file type.
  - name: csds_version
    description: Dataset version from the submission header.
