version: 2

models:
  - name: stg_slam_latest_submission
    description: |
      Latest-submission lookup for the 4 SLAM feeds: one row per selected file for each provider, file site,
      financial year and activity month. The stg_*_latest views join it back to rows.

      Files restate whole periods, so for each (site, recipient) stream the latest upload is the provider's
      current statement and earlier files are dropped. Parallel contracts sent to different recipients are
      kept. The latest upload is the latest file plus same-stream files loaded in the 12 hours before it.
      Where a slice keeps several files, the stg_*_latest views keep the latest file's rows per commissioner x
      POD x treatment function, which also absorbs streams consolidated under one recipient.

      Files are ordered by whether most of their rows belong to the activity FY, then by ISL load time
      (META_FILE_REGISTRY.CREATED_DATETIME). A stream is retired when a later stream restates it under a new
      recipient code (>= 80% of its content weight under the same commissioner codes, month totals within 10%)
      or a reviewed recode lists it. Content weight is absolute actual price for LSACM and row count otherwise;
      month totals are signed actual price for LSACM.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - feed
              - meta_file_id
              - meta_batch_id
              - dv_provider_code
              - submission_site_code
              - dv_financial_year
              - dv_financial_month
    columns:
      - name: feed
        description: Registry feed literal (LSACM / LSPLCM / LSDrPLCM / LSDePLCM).
        data_tests:
          - not_null
      - name: dv_provider_code
        description: Dictionary-cleaned provider ODS code.
      - name: submission_site_code
        description: Provider site token from the file name (meta_provider_code, e.g. RAL00, RAP00). Separate sites are separate streams.
      - name: submission_recipient_code
        description: Recipient (coordinating commissioner) code of the selected file. Different recipients are parallel contracts.
      - name: dv_financial_year
        description: Activity financial year 'YYYYYY'.
      - name: dv_financial_month
        description: Activity financial month, 1 = April.
      - name: meta_file_id
        description: Selected file id.
        data_tests:
          - not_null
      - name: meta_batch_id
        description: Selected batch id.
      - name: submission_loaded_at
        description: When ISL processed the selected file; the ordering used to find the latest upload.
      - name: submission_file_name
        description: Original provider file name of the selected file.
      - name: is_in_file_financial_year
        description: True when most of the file's rows belong to this financial year. Files restating another year rank below that year's own files.
      - name: files_in_slice
        description: Selected files for this provider, site, FY and month. Above 1 means parallel contracts or complementary parts; the stg_*_latest views then keep the latest file per content group.
      - name: omitted_commissioner_count
        description: |
          Commissioners carried by any earlier upload of the stream for this month that the selected upload no
          longer carries. Treated as withdrawn by the provider; non-zero values mark slices worth checking.
          Set on the stream's latest file only, so it can be summed.
      - name: omitted_commissioner_actual_price
        description: LSACM actual price of the omitted commissioners at their latest earlier statement. Set on the stream's latest file only. Null for patient-level feeds.
      - name: retired_recipient_codes
        description: Recipient streams at this site and month retired as restated under a new recipient code. Comma separated; repeated on every file of the slice; null when none.
