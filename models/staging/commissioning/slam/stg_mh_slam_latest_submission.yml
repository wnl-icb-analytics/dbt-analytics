version: 2

models:
  - name: stg_mh_slam_latest_submission
    description: |
      Latest-submission lookup for the MH Local SLAM datasets: the file
      holding the current provider statement per (dataset, provider,
      commissioner, FY, month) slice. Ranking by META_FILE_REGISTRY load time
      with file/batch tiebreaks, per month-slice so split submissions resolve.
      The commissioner is in the slice key so a narrowly-scoped resubmission
      for another commissioner cannot supersede the full-NWL file. Consumed by
      the stg_mh_*_latest views.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - dataset
              - dv_provider_code
              - dv_commissioner
              - dv_financial_year
              - dv_financial_month
    columns:
      - name: dataset
        description: Which MH Local SLAM dataset the slice belongs to.
        data_tests:
          - accepted_values:
              arguments:
                values: ['MH_NONAPC', 'MH_APC', 'MH_REFERRALS']
      - name: dv_provider_code
        description: Cleaned provider ODS code (slice key; matches the staging models' provider_code).
      - name: dv_commissioner
        description: Commissioner code (slice key; coalesce of commissioner_code and dlp_commissioner_code). NULL for the pre-spec referral layouts, which form their own slice.
      - name: dv_financial_year
        description: Financial year 'YYYYYY' (slice key).
      - name: dv_financial_month
        description: Financial month 1-12 (slice key).
      - name: meta_file_id
        description: Winning file id for the slice.
      - name: meta_batch_id
        description: Winning batch id for the slice.
      - name: submission_loaded_at
        description: When ISL loaded the winning file (META_FILE_REGISTRY.CREATED_DATETIME).
      - name: submission_file_name
        description: Original file name of the winning submission.
