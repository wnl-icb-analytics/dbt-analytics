models:
  - name: stg_sus_apc_spell_episodes_clinical_coding_procedure_opcs
    description: >-
      SUS APC episode procedures at one row per recorded procedure position. Identical
      source replays with the same code and procedure date are retained once. Conflicting
      codes or dates at the same position remain visible and fail the grain test.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - primarykey_id
              - episodes_id
              - opcs_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: procedure_id
        description: Stable procedure slot key from the spell, episode and procedure position.
      - name: procedure_date
        description: Supplied procedure date. Null when absent or unparseable; not replaced with the admission date.
      - name: primarykey_id
        description: Primary key from main APC spell (FK)
        tests:
          - not_null
      - name: episodes_id
        description: Episode identifier within the spell
        tests:
          - not_null
      - name: opcs_id
        description: OPCS procedure identifier within the episode
        tests:
          - not_null
      - name: rownumber_id
        description: Row number for ordering procedures
        tests:
          - not_null
      - name: code
        description: OPCS-4 procedure code
