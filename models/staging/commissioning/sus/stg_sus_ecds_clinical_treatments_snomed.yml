models:
  - name: stg_sus_ecds_clinical_treatments_snomed
    description: SUS A&E clinical treatments (SNOMED CT)
    config:
      meta:
        owner:
          name: Emily Baldwin
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - primarykey_id
              - snomed_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: primarykey_id
        description: Primary key from main A&E attendance (FK)
        tests:
          - not_null
      - name: snomed_id
        description: Unique identifier for this treatment entry
        tests:
          - not_null
      - name: rownumber_id
        description: Sequence number for ordering treatments within an attendance
        tests:
          - not_null
      - name: code
        description: SNOMED CT treatment code
      - name: date
        description: Date the treatment was given, where recorded.
      - name: time
        description: Time the treatment was given, where recorded.
