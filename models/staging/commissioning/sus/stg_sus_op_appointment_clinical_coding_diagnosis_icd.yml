models:
  - name: stg_sus_op_appointment_clinical_coding_diagnosis_icd
    description: >
      SUS outpatient appointment diagnoses coded in ICD-10, one row per
      diagnosis entry within an appointment. diagnosis_id is keyed on
      primarykey_id and icd_id. Codes are cleaned by clean_icd10_code, which
      removes trailing X or dash filler and puts a dot after the third
      character. Repeated codes within an entry are collapsed to one row.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: diagnosis_id
        description: Unique identifier for this diagnosis entry
        tests:
          - not_null
          - unique
      - name: primarykey_id
        description: Primary key from main outpatient appointment (FK)
        tests:
          - not_null
      - name: icd_id
        description: ICD diagnosis identifier within the appointment
        tests:
          - not_null
      - name: rownumber_id
        description: Row number for ordering diagnoses
        tests:
          - not_null
      - name: code
        description: ICD-10 diagnosis code