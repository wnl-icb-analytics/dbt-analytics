models:
  - name: stg_sus_ecds_emergency_care
    description: >-
      Urgent and Emergency Care (UEC) attendances from SUS data, with one row per
      source attendance. Provider and conveying ambulance trust codes retain
      their full value when present in organisation dictionary type 41;
      otherwise they use the first three characters. Null codes remain null.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: primarykey_id
        description: Unique identifier for the attendance (PRIMARYKEY_ID)
        tests:
          - not_null
          - unique
      - name: patient_usual_address_postcode_pseudo
        description: Pseudonymised postcode value supplied by SUS; usually partial and sometimes a special pseudo postcode.
      - name: patient_usual_address_lsoa_11
        description: >-
          Patient LSOA 2011 of residence supplied by SUS. Populated across the
          full history, so use it for trends that span April 2024.
      - name: patient_usual_address_lsoa_21
        description: >-
          Patient LSOA 2021 of residence. Supplied by SUS+ for attendances
          from April 2026; earlier attendances fall back to the data lake's
          derived ECDS table (dmicLSOA2021), matched on the record's import.
          The two sources agree where both exist. Reliable for
          attendances from 1 April 2024 (about 97% populated); mostly null for
          earlier attendances.
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
