models:
  - name: stg_sus_ecds_clinical_coded_findings
    description: >-
      SUS ECDS coded findings, one row per finding slot within an emergency attendance.
      Retains the SNOMED CT code and the supplied time the finding was recorded.
    config:
      meta:
        owner:
          name: Emily Baldwin
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - primarykey_id
              - coded_findings_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: source_record_id
        description: Stable clinical slot key from the attendance and source code position.
      - name: primarykey_id
        description: Primary key from main A&E attendance (FK)
        tests:
          - not_null
      - name: coded_findings_id
        description: Unique identifier for this coded finding entry
        tests:
          - not_null
      - name: rownumber_id
        description: Sequence number for ordering findings within an attendance
        tests:
          - not_null
      - name: code
        description: SNOMED CT coded finding
      - name: recorded_at
        description: Supplied coded finding timestamp, the time the finding was recorded. Null when absent.
      - name: recorded_date
        description: Calendar date of the supplied coded finding timestamp. Null when absent.
      - name: recorded_time
        description: Clock time of the supplied coded finding timestamp. Null when absent.