models:
- name: stg_sus_op_appointment
  description: Outpatient appointments from SUS data, with one row per source appointment. Provider codes
    retain their full value when present in organisation dictionary type 41; otherwise they use the first
    three characters. Null codes remain null.
  config:
    meta:
      owner:
        name: EddieDavison92
  columns:
  - name: source_received_at
    description: Recorded interchange receipt date used to detect new deliveries. It is not a clinical date.
  - name: primarykey_id
    description: Unique identifier for the appointment (PRIMARYKEY_ID)
    tests:
    - not_null
    - unique
  - name: unique_booking_reference_number
    description: Pseudonymised UBRN supplied on the SUS record, preserved with its original presentation.
      Recorded reference agreement alone does not prove patient identity or causality.
  - name: booking_reference_issuer
    description: Issuer supplied for the UBRN. Null when not recorded.
  - name: appointment_commissioning_service_agreement_commissioner
    description: Commissioner organisation code supplied with the SUS+ appointment. Null means no code was supplied.
  - name: appointment_commissioning_service_agreement_is_commissioner_recognised
    description: SUS+-supplied indicator that the supplied commissioner code was recognised. Null means SUS+ supplied no indicator.
  - name: appointment_commissioning_service_agreement_commissioner_derived
    description: Submitted service-agreement commissioner code after SUS+ reference-data validation. From 2021-22 it normally matches the supplied code; older five-character codes may be shortened to three characters.
  - name: appointment_commissioning_commissioner_assignment_commissioner
    description: Commissioner Assignment Method organisation code for the appointment. Null means SUS+ supplied no CAM commissioner.
  - name: appointment_commissioning_commissioner_assignment_flowchart_reference
    description: SUS+ Commissioner Assignment Method flowchart reference supporting the CAM commissioner. Null means no reference was supplied.
  - name: appointment_care_professional_consultant
    description: >-
      Care-professional code supplied with the appointment, trimmed and upper
      case. Blank values and the literal text none become null. Default codes
      include C9999998, CD999998, D9999998, M9999998, N9999998 and H9999998.
      From 2025-26, CDS 6.3 may supply a bare seven-digit registration number
      instead of the earlier C-prefixed GMC code, so one professional may have
      different codes across that change.
  - name: appointment_consultation_medium
    description: Submitted NHS DD Consultation Medium Used code, labelled by `nhs_dd_consultation_medium_used`.
      It is not a Consultation Mechanism code.
      Null when not recorded.
  - name: appointment_patient_residence_derived_lsoa_11
    description: Patient LSOA 2011 of residence supplied by SUS+. Populated across the full history, so use
      it for trends that span April 2024.
  - name: appointment_patient_residence_derived_lsoa_21
    description: Patient LSOA 2021 of residence from the data lake's derived outpatient table
      (dmicLSOA2021), matched on the record's import. Populated for appointments from 1 April 2024
      (about 98%); mostly null for earlier appointments. About 2% of values from April 2024 lie in a
      different local authority from the LSOA 2011.
  tests:
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 1
