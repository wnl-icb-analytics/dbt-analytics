models:
- name: stg_sus_op_appointment
  description: Outpatient appointments from SUS data, with one row per source appointment. Provider codes
    retain their full value when present in organisation dictionary type 41; otherwise they use the first
    three characters. Null codes remain null.
  config:
    meta:
      owner:
        name: EddieDavison92
  columns:
  - name: primarykey_id
    description: Unique identifier for the appointment (PRIMARYKEY_ID)
    tests:
    - not_null
    - unique
  - name: unique_booking_reference_number
    description: Pseudonymised UBRN supplied on the SUS record, preserved with its original presentation.
      Recorded reference agreement alone does not prove patient identity or causality.
  - name: booking_reference_issuer
    description: Issuer supplied for the UBRN. Null when not recorded.
  - name: appointment_patient_residence_derived_lsoa_11
    description: Patient LSOA 2011 of residence supplied by SUS+. Populated across the full history, so use
      it for trends that span April 2024.
  - name: appointment_patient_residence_derived_lsoa_21
    description: Patient LSOA 2021 of residence from the data lake's derived outpatient table
      (dmicLSOA2021), matched on the record's import. Populated for appointments from 1 April 2024
      (about 98%); mostly null for earlier appointments. About 2% of values from April 2024 lie in a
      different local authority from the LSOA 2011.
  tests:
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 1
