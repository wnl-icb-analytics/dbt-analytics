        description: 'As supplied in source field Number_Unbundled_Non_Priced_HRGs.'
      - name: number_unbundled_priced_hr_gs
        data_type: NUMBER
        description: 'As supplied in source field Number_Unbundled_Priced_HRGs.'
      - name: excluded_episodes_in_hospital_provider_spell
        data_type: NUMBER
        description: 'As supplied in source field Excluded_Episodes_in_Hospital_Provider_Spell.'
      - name: number_ss_cs
        data_type: NUMBER
        description: 'As supplied in source field Number_SSCs.'
      - name: number_bpt_indicators
        data_type: NUMBER
        description: 'As supplied in source field Number_BPT_Indicators.'
      - name: pb_r_spell_trimpoint_days
        data_type: NUMBER
        description: 'As supplied in source field PbR_Spell_Trimpoint_Days.'
      - name: pb_r_days_beyond_trimpoint
        data_type: NUMBER
        description: 'As supplied in source field PbR_Days_Beyond_Trimpoint.'
      - name: spell_acc_length_of_stay
        data_type: NUMBER
        description: "Critical-care duration counted as distinct calendar days across included spell episodes for this care type. Overlap across care types is possible, so do not sum ACC, NCC and PCC values to derive the adjustment; use the final adjusted length of stay instead. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: spell_ncc_length_of_stay
        data_type: NUMBER
        description: "Critical-care duration counted as distinct calendar days across included spell episodes for this care type. Overlap across care types is possible, so do not sum ACC, NCC and PCC values to derive the adjustment; use the final adjusted length of stay instead. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: spell_pcc_length_of_stay
        data_type: NUMBER
        description: "Critical-care duration counted as distinct calendar days across included spell episodes for this care type. Overlap across care types is possible, so do not sum ACC, NCC and PCC values to derive the adjustment; use the final adjusted length of stay instead. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: spell_primary_diagnosis
        data_type: TEXT
        description: 'As supplied in source field Spell_Primary_Diagnosis.'
      - name: spell_dominant_procedure
        data_type: TEXT
        description: 'As supplied in source field Spell_Dominant_Procedure.'
      - name: primary_procedure_code
        data_type: TEXT
        description: 'As supplied in source field Primary_Procedure_Code.'
      - name: significant_specialised_service_code
        data_type: TEXT
        description: 'As supplied in source field Significant_Specialised_Service_Code.'
      - name: specialised_service_code_1
        data_type: TEXT
        description: 'As supplied in source field Specialised_Service_Code_1.'
      - name: specialised_service_code_2
        data_type: TEXT
        description: 'As supplied in source field Specialised_Service_Code_2.'
      - name: specialised_service_code_3
        data_type: TEXT
        description: 'As supplied in source field Specialised_Service_Code_3.'
      - name: bpt_indicator_1
        data_type: TEXT
        description: 'As supplied in source field BPT_Indicator_1.'
      - name: bpt_indicator_1_action
        data_type: TEXT
        description: 'As supplied in source field BPT_Indicator_1_Action.'
      - name: tariff_initial_amount_national
        data_type: NUMBER
        description: "Initial national tariff amount for the activity, before subsequent price adjustments. It depends on HRG and relevant admission/spell, short-stay and best-practice rules. This is a national price component, not actual provider cost. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: tariff_service_adjustment_national
        data_type: NUMBER
        description: "National price adjustment for specialised services, added before MFF. From 2017-18 it reflects PSS Grouper output; through 2016-17 it uses the specialised-service adjustment factor associated with the most significant service code. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: tariff_long_stay_rate_national
        data_type: NUMBER
        description: "National excess-bed-day price per day from the applicable tariff reference data. A rate rather than a duration or total payment. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: tariff_long_stay_payment_national
        data_type: NUMBER
        description: "National excess-bed-day payment component calculated from excess days and the applicable per-day rate. It is part of the overall price, not an additional count of bed days. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: aggregate_un_bundled_adjustment_national
        data_type: NUMBER
        description: 'As supplied in source field Aggregate_UnBundled_Adjustment_National.'
      - name: applied_mff_elective
        data_type: NUMBER
        description: 'As supplied in source field Applied_MFF_Elective.'
      - name: applied_mff_non_elective
        data_type: NUMBER
        description: 'As supplied in source field Applied_MFF_Non_Elective.'
      - name: mff_adjustment
        data_type: NUMBER
        description: 'As supplied in source field MFF_Adjustment.'
      - name: tariff_pre_mff_adjusted_national
        data_type: NUMBER
        description: "National price subtotal after applicable adjustments and before multiplication by the market forces factor (MFF). Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: tariff_total_payment_national
        data_type: NUMBER
        description: "Final calculated national payment including applicable top-ups, adjustments and MFF. It is a calculated national price, not actual provider cost or evidence of an agreed local invoice. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: pb_r_final_tariff
        data_type: NUMBER
        description: "Final national price. The national extract combines the initial tariff with applicable unbundled unit/guide amounts and, for APC, excess-bed-day payment, then applies MFF. EM uses initial tariff times MFF. This is a calculated price, not actual provider cost. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: final_tariff_applied
        data_type: TEXT
        description: 'As supplied in source field Final_Tariff_Applied.'
