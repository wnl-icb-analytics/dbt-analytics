      - name: applicable_date
        data_type: TIMESTAMP_NTZ
        description: "CDS applicable date: the update event, or nearest equivalent, that caused the need to exchange the CDS record. It is not the activity date used for period reconciliation. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: extract_date
        data_type: TIMESTAMP_NTZ
        description: "CDS extract date supplied with the record. Do not assume it is the Snowflake load timestamp or the activity date. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
