      - name: activity_period
        data_type: NUMBER
        description: "Numeric PBR activity-period value supplied as ActivityPeriod. Its encoding, period basis and special or null meanings are not yet confirmed by the source owner. It is not documented as interchangeable with applicable_date, extract_date or an encounter event date."
