      - name: applicable_costing_period
        data_type: TEXT
        description: "Formatted national costing period, for example M01 - Apr 2016. It is derived from the activity date: spell discharge for APC, delivery for Other Delivery, appointment for OP and arrival for EM. It is distinct from the separate numeric ActivityPeriod field. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
