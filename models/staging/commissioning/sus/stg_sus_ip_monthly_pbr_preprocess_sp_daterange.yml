        data_type: NUMBER
        description: 'As supplied in source field SK_EncounterID.'
        data_tests:
          - not_null
          - unique
      - name: sk_patient_id
        data_type: VARCHAR
        description: "Pseudonymised NHS-number key shared with the established SUS OBTs. Normalised to trimmed text; blank values and the unknown-patient placeholder 1 become null. Leading zeroes are preserved."
      - name: sus_version
        data_type: TEXT
        description: 'As supplied in source field SUS_Version.'
      - name: spell_identifier
        data_type: NUMBER
