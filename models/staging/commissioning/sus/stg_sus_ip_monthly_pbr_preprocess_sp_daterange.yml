        data_type: TEXT
        description: 'As supplied in source field GP_Practice_Code_Original_Data.'
      - name: gp_practice_code_derived
        data_type: TEXT
        description: 'As supplied in source field GP_Practice_Code_Derived.'
      - name: referrer_code
        data_type: TEXT
        description: 'As supplied in source field Referrer_Code.'
      - name: referring_organisation_code
        data_type: TEXT
        description: 'As supplied in source field Referring_Organisation_Code.'
      - name: duration_of_elective_wait
        data_type: NUMBER
        description: "Elective waiting duration in days from the original decision to admit to admission at the treating provider. National values are 0-8887; 9998 means not applicable and 9999 means not known/decision date unavailable. These special values are not ordinary durations. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: intended_management
        data_type: TEXT
        description: 'As supplied in source field Intended_Management.'
      - name: decided_to_admit_date
        data_type: TIMESTAMP_NTZ
        description: 'As supplied in source field Decided_To_Admit_Date.'
      - name: length_of_stay_hospital_provider_spell
        data_type: NUMBER
        description: "Unadjusted hospital-provider spell duration in days between admission and discharge, spanning the constituent episodes. The national extract does not populate this for Other Birth or Other Delivery records. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: pb_r_final_adjusted_length_of_stay
        data_type: NUMBER
        description: "PbR grouping duration in days: sum the adjusted durations of non-excluded episodes in the spell, subtracting rehabilitation, specialist palliative care and derived critical-care days from each episode. Each adjusted episode duration is floored at zero. This differs from unadjusted spell duration. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: number_of_commissioners_in_pb_r_spell
        data_type: NUMBER
        description: 'As supplied in source field Number_of_Commissioners_in_PbR_Spell.'
      - name: number_diagnosis
        data_type: NUMBER
