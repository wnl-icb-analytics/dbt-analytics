version: 2

models:
  - name: stg_mhsds_mhactperiod
    description: >-
      Mental Health Act legal-status periods reported by providers. Each row is one MHSDS
      legal-status period, using its newest accepted version. NHSD codes distinguish informal
      admission, detention, guardianship and unknown or not-applicable status. The reporting
      legal-status table supplies the labels and the rules for identifying current detention.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: mhs401_uniq_id
        description: Identifier of the retained source row; changes on resubmission.
      - name: uniq_mh_act_episode_id
        description: Unique Mental Health Act episode identifier.
        data_tests:
          - unique
          - not_null
      - name: person_id
        description: MHSDS person identifier.
      - name: nhsd_legal_status
        description: NHSD-derived legal-status code, distinct from the submitted legal_status_code.
      - name: legal_status_code
        description: Submitted LegalStatusCode classification, trimmed and upper-cased without NHSD recoding.
          Null for a blank submission.
      - name: legal_status_class_period_start_reason
        description: Submitted reason for the start of this legal-status assignment period, trimmed and
          upper-cased. Null when blank; labels are supplied by the reporting fact.
      - name: legal_status_class_period_end_reason
        description: Submitted reason for the end of this legal-status assignment period, trimmed and
          upper-cased. Null when blank; an absent reason does not establish that the period remains open.
      - name: mental_cat
        description: Submitted Mental Health Act 2007 mental category, trimmed and upper-cased.
          Describes the primary reason for detention, not a diagnosis. Null when blank.
      - name: start_date_mh_act_legal_status_class
        description: >-
          Legal-status period start date, as a date. Source values before 1901
          are Excel-epoch missing-value sentinels and are null here.
      - name: end_date_mh_act_legal_status_class
        description: >-
          Legal-status period end date, as a date. Null while the period is
          open. Source values before 1901 are Excel-epoch missing-value
          sentinels and are null here.
      - name: start_time_mh_act_legal_status_class
        description: Legal-status period start time.
      - name: end_time_mh_act_legal_status_class
        description: Legal-status period end time.
      - name: expiry_date_mh_act_legal_status_class
        description: >-
          Legal-status period expiry date, as a date. Source values before 1901
          are Excel-epoch missing-value sentinels and are null here.
      - name: expiry_time_mh_act_legal_status_class
        description: Recorded clock time when the legal-status classification expires. Null when not
          supplied; midnight is retained when supplied.
      - name: org_id_prov
        description: Provider organisation code.
      - name: unique_local_patient_id
        description: Provider-local patient identifier.
      - name: uniq_submission_id
        description: Accepted submission containing the retained period version.
      - name: reporting_period_end_date
        description: >
          Reporting period recorded on the retained legal-status record, which
          is the one from the newest accepted submission containing the period.
      - name: effective_from
        description: Time the retained source file was received.
