version: 2

models:
  - name: stg_mhsds_servicetype
    description: >
      MHSDS service types for referral currency grouping. Grain: one row per
      uniq_serv_req_id. Population: all referrals in MHS101. Time semantics:
      where a referral has more than one submitted service type, the newest
      reporting period is retained, followed by the latest received submission
      within that period. Team type resolution order: MHS102 (DMIC-derived),
      then MHS902 team details via the MHS102 team id and submission, then the
      v6 ServTeamType on MHS101 — ~23% of referrals have no MHS102 row and
      only the MHS101 field; the MHS902 arm recovers a ~0.05% residual.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: uniq_serv_req_id
        description: Unique service request identifier.
        data_tests:
          - not_null
          - unique
      - name: person_id
        description: MHSDS person identifier.
      - name: serv_team_type_ref_to_mh
        description: Service team type referred to code.
      - name: serv_team_int_age_group
        description: Service team intended age group.
      - name: service_type_name
        description: Service type name.
      - name: org_id_prov
        description: Provider organisation code.
      - name: uniq_submission_id
        description: MHSDS submission identifier.
