version: 2
models:
- name: stg_mhsds_group_session
  description: >-
    MHS301 group session records from accepted provider submissions. Each row is one submitted
    source record. Repeated reports across periods remain available for historical analysis and
    later version selection. Source dates before 1901 are missing-date markers and are shown as
    null.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: mhs301_uniq_id
    description: Identifier of the accepted source record.
    data_tests:
    - not_null
    - unique
