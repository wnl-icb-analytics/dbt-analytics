version: 2

models:
  - name: stg_mhsds_referral_assessment
    description: >-
      Accepted MHS606 clinical source records. One row per submitted record
      across accepted provider reporting periods. Repeated clinical items
      remain here; cross-period revision selection belongs in modelling.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: mhs606_uniq_id
        description: Unique accepted source-row identifier; changes on resubmission.
        data_tests: [not_null, unique]
      - name: uniq_serv_req_id
        description: Recorded provider-qualified service request identifier.
      - name: coded_ass_tool_type
        description: SNOMED CT observable identifying an assessment question, dimension or total score.
      - name: pers_score
        description: Submitted score text. May be fractional or non-numeric.
      - name: ass_tool_comp_timestamp
        description: Stored assessment completion timestamp; original offset and precision are unavailable.
      - name: ass_tool_comp_date
        description: Separate source-pipeline assessment completion date.
      - name: care_prof_local_id
        description: Submitted care professional local identifier.
      - name: uniq_care_prof_local_id
        description: Source-derived provider-qualified care professional identifier.
      - name: org_id_prov
        description: Provider organisation code.
      - name: person_id
        description: MHSDS national person identifier; may change between submissions.
      - name: uniq_submission_id
        description: Accepted submission containing the source row.
      - name: uniq_month_id
        description: Source reporting-month identifier.
      - name: record_number
        description: Source record number, retained for tracing and deterministic selection.
      - name: row_number
        description: Source row position, retained for deterministic selection.
      - name: reporting_period_start_date
        description: Start of the accepted reporting period.
      - name: reporting_period_end_date
        description: End of the accepted reporting period.
      - name: effective_from
        description: Time the source file was received.
      - name: dmic_date_added
        description: Time the source row was loaded.
      - name: dmic_dataset
        description: Source MHSDS specification version.
