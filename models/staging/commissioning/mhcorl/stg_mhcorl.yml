version: 2

models:
  - name: stg_mhcorl
    description: |
      MHCORL SDL feed (provider monthly mental-health activity submissions,
      originally spreadsheet uploads remapped by the SDL pipeline), cleaned.
      Grain: one row per source row. Scope: FY2022/23 onwards.

      MHCORL carries several datasets with different grains; dv_dataset labels
      each row:
        * community: contacts / appointments (RRP00 NONIP files, RKL00
          APPOINTMENTS, RV300 NON_IP outpatient and community files, RNK00
          appointment-level MHCO dataset, RAT00 spell-level currency rows).
        * inpatient: ward stays and occupied bed days (RRP00 IP files, RKL00
          INPATIENTS, RV300 IP / APC files, RAT00 OBD currency rows).
        * liaison: liaison-psychiatry referrals (RKL00 LPS year-to-date files,
          RV300 LIAISON PSYCHIATRY files).
      Filter on dv_dataset before counting or summing.

      Providers: RRP00 (BEH, now NLFT; ~40% of rows), RV300 (CNWL, to
      September 2023), RKL00 (West London, to November 2023), RNK00 (Tavistock
      and Portman), RAT00 (NELFT). Only RRP00, RNK00 and RAT00 still submit.

      Cleaning: best-populated provider sibling column picked per field; dates
      parsed across the provider formats; gender and ethnicity mapped to the
      project's label sets and the NHS ethnic category code; GP practice
      validated to a 6-character ODS code; financial period from the stated
      DLP or reporting value, else the stated activity month or the contact
      date, else the file name.

      Cumulative restatement feed (RAT00 Flex/Freeze resubmissions, RKL00 LPS
      year-to-date files, per-commissioner RNK00 / RV300 files): summing
      across files double-counts. Report from stg_mhcorl_latest for the
      current statement per (dataset, provider, commissioner, FY, month).

      Incremental (pure append of new files); full-refresh after an upstream
      SDL rebuild.
    config:
      meta:
        owner:
          name: Eddie Davison
    # Provenance convention: "Pipeline" = added by the SDL ingest (reliable);
    # "Derived" = computed/parsed/mapped here; "As supplied" = provider value
    # passed through unchanged (sometimes coalesced across sibling columns, but
    # the value itself is not altered).
    columns:
      # -- SDL pipeline keys --------------------------------------------------
      - name: meta_sk_row_id
        description: Pipeline. Surrogate row key (1:1 with source).
        data_tests:
          - not_null
          - unique
      - name: meta_file_id
        description: Pipeline. Source file id; joins to META_FILE_REGISTRY with meta_batch_id.
        data_tests:
          - not_null
      - name: meta_row_id
        description: Pipeline. Row id within the source file.
      - name: meta_batch_id
        description: Pipeline. Load batch id.
      - name: meta_partition_date
        description: |
          Pipeline. DSCRO submission period encoded as a date: the year is the
          financial-year start year and the month is the financial month
          (1 = April), so 2024-01-01 is FY2024/25 month 1 (April 2024). Not a
          calendar month; use dv_financial_year / dv_financial_month for
          time series.
        data_tests:
          - not_null
      - name: meta_provider_code
        description: Pipeline. Provider ODS code assigned by the SDL ingest (5-character site form, e.g. RRP00).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['RRP00', 'RNK00', 'RV300', 'RAT00', 'RKL00']
      - name: meta_recipient_code
        description: Pipeline. Recipient (commissioner / DSCRO) code the file was submitted to.
      - name: meta_version_id
        description: Pipeline. Source layout version hash (md5 of the file's column headers).
      - name: dv_recipient_code
        description: Pipeline. Responsible commissioner (sub-ICB / CCG) code derived by the SDL pipeline for the row.

      # -- Reporting period (derived) ----------------------------------------
      - name: dv_financial_year
        description: Derived. Financial year as 'YYYYYY' (e.g. 202526 = FY2025/26), matching the other SDL feeds. Stated DLP or provider value, else derived from the activity month or contact date, else the file name.
      - name: dv_financial_month
        description: Derived. Financial month 1 (April) - 12 (March). Same precedence as dv_financial_year.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
                inclusive: true
      - name: dv_financial_period_source
        description: Derived. Which source resolved the period - 'stated', 'derived_from_activity_date' (stated activity month or contact date) or 'derived_from_file_name'. NULL where none could.
        data_tests:
          - accepted_values:
              arguments:
                values: ['stated', 'derived_from_activity_date', 'derived_from_file_name']
          # Nulls are expected (a few blank rows); warn so the count is
          # surfaced, not failed.
          - not_null:
              config:
                severity: warn

      # -- DLP standard submission fields ------------------------------------
      - name: dlp_flex_or_freeze
        description: Derived. Submission flag standardised to 'Flex' or 'Freeze' from DLP_FLEXOR_FREEZE, the pre-DLP FLEX_OR_FREEZE column or RAT00's DV_IS_FREEZE; other values -> NULL. Empty for RKL00 and RV300, which never sent the flag.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Flex', 'Freeze']
      - name: dlp_commissioner_code
        description: As supplied. DLP header commissioner code (RRP00, RNK00 and RAT00 from 2024).
      - name: dlp_baseline_financial_month
        description: As supplied. DLP baseline financial month.

      # -- Dataset and organisation ------------------------------------------
      - name: dv_dataset
        description: Derived. Which MHCORL dataset the row belongs to - 'community', 'inpatient' or 'liaison' - from the submission file name, the provider's dataset column and RAT00's OBD currency. See the model description for what each provider sends under each label.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['community', 'inpatient', 'liaison']
      - name: provider_code
        description: Derived. Provider ODS trust code (e.g. RRP) from the pipeline provider code, cleaned as in the other SDL staging models. The supplied PROVIDER_CODE is not used - it is empty or a non-trust code in several layouts.
        data_tests:
          - not_null
      - name: commissioner_code
        description: As supplied. Row-level commissioner code (COMMISSIONER_CODE, else the CCG column the liaison layouts use). Mostly 3-character CCG / sub-ICB codes.
      - name: commissioner_name
        description: As supplied. Commissioner name for commissioner_code. RRP00 only; empty for the other providers.
      - name: site_code
        description: As supplied. Treatment site code (RKL00, RNK00, RAT00 only).

      # -- Patient ------------------------------------------------------------
      - name: local_patient_id
        description: As supplied. Provider-local patient identifier (HOSPITAL_NUMBER for RNK00 / RAT00, PATIENT_KEY for RKL00 liaison). Not sent by RRP00 or RV300.
      - name: sk_patient_id
        description: Pipeline. Pseudonymised NHS-number-derived key (SK_PATIENT_ID_NHS_NUMBER); matches sk_patient_id in the other staging models. ~99% populated.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: sk_patient_id_local_hash
        description: Pipeline. A different, locally derived hash (the bare SK_PATIENT_ID column) with no overlap with sk_patient_id. Do not join on it across datasets; only useful for within-provider linking.
      - name: dv_year_of_birth
        description: Derived. Year of birth (pipeline-pseudonymised DV_YEAROF_BIRTH cast to number). RAT00 and RKL00 only.
      - name: partial_postcode
        description: Pipeline. Partial (pseudonymised) postcode.
      - name: lsoa
        description: Pipeline. LSOA of residence.
      - name: gender
        description: Derived. Male / Female / Not specified / Not known / Indeterminate / Other, mapped from 25+ provider variants of GENDER (SEX for RV300 liaison). Unrecognised local codes (RAT00 sends 3, 4, 6, 7) map to 'Not known'; blanks and header text to NULL.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Male', 'Female', 'Not specified', 'Not known', 'Indeterminate', 'Other']
      - name: ethnic_category_code
        description: Derived. NHS ethnic category national code (A-S, Z, 99) from the code columns or free-text ethnicity via nhs_ethnicity_category_code. RV300's BME / NON BME aggregations cannot be mapped and are NULL.
        data_tests:
          - accepted_values:
              arguments:
                values: ['A','B','C','D','E','F','G','H','J','K','L','M','N','P','R','S','Z','99','0']
      - name: ethnicity_17
        description: Derived. NHS 17+1 ethnic category label for ethnic_category_code.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'White: British'
                  - 'White: Irish'
                  - 'White: Any other White background'
                  - 'Mixed: White and Black Caribbean'
                  - 'Mixed: White and Black African'
                  - 'Mixed: White and Asian'
                  - 'Mixed: Any other Mixed background'
                  - 'Asian or Asian British: Indian'
                  - 'Asian or Asian British: Pakistani'
                  - 'Asian or Asian British: Bangladeshi'
                  - 'Asian or Asian British: Any other Asian background'
                  - 'Black or Black British: Caribbean'
                  - 'Black or Black British: African'
                  - 'Black or Black British: Any other Black background'
                  - 'Other Ethnic Groups: Chinese'
                  - 'Other Ethnic Groups: Any other ethnic group'
                  - 'Not stated'
                  - 'Not known'
      - name: ethnicity_6
        description: Derived. Broad ethnic group for ethnic_category_code - White / Mixed / Asian or Asian British / Black or Black British / Other Ethnic Groups / Unknown.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'White'
                  - 'Mixed'
                  - 'Asian or Asian British'
                  - 'Black or Black British'
                  - 'Other Ethnic Groups'
                  - 'Unknown'
      - name: gp_practice_code
        description: Derived. Registered GP practice ODS code, validated to 1 letter + 5 digits (a 3-digit branch suffix is stripped; '999' and other values -> NULL). Coalesced from GP_PRACTICE_CODE, GENERAL_PRACTICE_CODE and REGISTERED_GP.
      - name: gp_code
        description: As supplied. GP (practitioner) code, 8 characters (RRP00, RKL00, RAT00).

      # -- Service / team / contract -----------------------------------------
      - name: team_code
        description: As supplied. Team code (TEAM_CODE, else LPS_TEAM_CODE). RRP00 and RKL00 liaison only.
      - name: team_name
        description: As supplied. Team name, coalesced from TEAM_NAME / LPS_TEAM_NAME / LPSTEAMNAME / TEAM.
      - name: service_group
        description: As supplied. Provider service grouping (e.g. Adult, CAMHS, Older Adult). Not sent by RRP00.
      - name: service_line
        description: As supplied. Service line or description (SERVICE_LINE for RAT00 / RNK00, SERVICE_DESCRIPTION for RKL00 / RV300).
      - name: pod_code
        description: As supplied. Point-of-delivery code (RAT00, RNK00).
      - name: pod_description
        description: As supplied. Point-of-delivery description (POD_DESCRIPTION, else POD_NAME).
      - name: contract_type
        description: As supplied. Contract type or line (RKL00 block / CPC, RNK00 per-borough contract lines).
      - name: finance_category
        description: As supplied. RRP00 finance category (Adult Community, CAMHS, Older People Community, IAPT, Adults Inpatients, MH Liaison, Others).
      - name: costing_code_description
        description: As supplied. RRP00 costing code description.
      - name: currency
        description: As supplied. RAT00 / RNK00 activity currency (Treatment, Assessment, Contact, Waiting, OBD).

      # -- Referral -------------------------------------------------------------
      - name: referral_id
        description: As supplied. Referral identifier (RKL00 REFERRAL_UNIQUE_ID, RV300 REFERRAL_SSID, else REFERRAL_REFERENCE). Liaison layouts only.
      - name: referral_date
        description: Derived. Referral date, parsed from REFERRAL_DATE / DATE_OF_REFERRAL / DATEOFREFERRAL / the liaison referral datetimes.
      - name: source_of_referral
        description: As supplied. Source of referral text or local code, coalesced from SOURCE_OF_REFERRAL / REFERRAL_SOURCE / REFERRALSOURCE.
      - name: referral_priority
        description: As supplied. Liaison referral priority (Emergency / Urgent / Routine and RKL00's timed variants).

      # -- Contact / appointment ------------------------------------------------
      - name: appointment_id
        description: As supplied. RNK00 appointment identifier.
      - name: contact_date
        description: |
          Derived. Care contact / appointment date, parsed from CONTACT_DATE /
          CONTACTDATE / the liaison first-contact datetimes. Handles UK, ISO,
          DD-Mon-YY, SQL Server AM/PM and Excel serial forms; Excel time
          artefacts ('00:00.0') yield NULL. RNK00 and RAT00 do not supply a
          contact date (their START_DATE is a spell date, not the in-month
          activity date).
      - name: contact_type
        description: As supplied. Contact / consultation type (First, Follow-up, Assessment, Treatment ...), coalesced from CONSULTATION_TYPE / CONTACT_TYPE / FIRST_FOLLOW_UP.
      - name: consultation_medium
        description: As supplied. Consultation medium text (Face to face, Telephone, Video ...). RRP00 community only.
      - name: contact_setting
        description: As supplied. Contact setting, coalesced from CONTACTSETTING and the liaison first-contact setting columns (RKL00, RV300).
      - name: appointment_type
        description: As supplied. Appointment type (Outpatient / Community / Follow-up consultation ... or provider codes). Not sent by RRP00.
      - name: appointment_outcome
        description: As supplied. Appointment outcome code (RNK00, RAT00).
      - name: patient_seen
        description: As supplied. Liaison 'patient seen' flag (Yes / No).
      - name: duration_of_contact_minutes
        description: Derived. Contact duration in minutes, cast to number. RRP00 community only.
      - name: appointment_sequence_id
        description: As supplied. RRP00 appointment sequence id.
      - name: in_month_activity_actual
        description: Derived. RNK00's provider-reported in-month activity count (can be fractional), cast to number. RNK00 only.
      - name: total_activity
        description: Derived. RKL00 / RV300 total activity count for the row, cast to number.

      # -- Inpatient / spell ----------------------------------------------------
      - name: spell_id
        description: As supplied. Spell identifier (SPELL_ID for RNK00 / RAT00, CARE_SPELL_ID for RKL00).
      - name: ward_code
        description: As supplied. Ward code (RRP00 inpatient).
      - name: ward_name
        description: As supplied. Ward name (WARD_NAME, else WARD).
      - name: episode_start_date
        description: Derived. Ward stay / episode start date, parsed from EPISODE_START_DATE / WARD_START_DATE / ADMISSION_DATE. Inpatient rows only.
      - name: episode_end_date
        description: Derived. Ward stay / episode end date (NULL while open), parsed from EPISODE_END_DATE / WARD_END_DATE.
      - name: occupied_bed_days
        description: Derived. Occupied bed days for the row's month (OCCUPIED_BED_DAYS for RRP00, OBD for RKL00), cast to number. Provider counting conventions differ.
      - name: leave_days
        description: Derived. Leave days in the month (RKL00 inpatient), cast to number.
      - name: discharge_date
        description: Derived. Discharge date, parsed from DISCHARGE_DATE / DISCHARGE_DATE_TIME.
      - name: discharge_reason
        description: As supplied. Discharge reason (RAT00).
      - name: activity_month
        description: Derived. Provider-stated activity month (first day) where the layout has one (RKL00 and RV300); NULL for the DLP-header layouts, which state the period as financial year and month instead.

      # -- Raw period (traceability) -------------------------------------------
      - name: financial_year_raw
        description: As supplied. Financial year string before parsing (DLP_FINANCIAL_YEAR, else FINANCIAL_YEAR, else FIN_YEAR) in the provider's own format ('2023', '2023/2024', '2023-2024' or '2023_24').
      - name: financial_month_raw
        description: As supplied. Financial month string before parsing (DLP_FINANCIAL_MONTH, else REPORTING_MONTH).

    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 5000000
