models:
  - name: stg_c_ltcs_status_log
    description: "C-LTCS status log. One row per patient action."
    config:
      meta:
        owner:
          name: Emily Baldwin

    columns:
      - name: patient_id
        data_type: varchar
        description: "Unique patient identifier from commissioning data [sk_patient_id]"
        tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: varchar

      - name: area_code
        data_type: varchar
        description: "Area code at time of status log"

      - name: intervention_date
        data_type: date
        description: "Intervention date captured for the status log entry"

      - name: action
        data_type: varchar
        description: "Action recorded in the status log"

      - name: action_date
        data_type: timestamp_ntz
        description: "Timestamp of the action"

      - name: detail
        data_type: varchar
        description: "Detail text associated with the status log entry"

      - name: intervention_name
        data_type: varchar
        description: "Name of the intervention associated with the status row"

      - name: stream_action
        data_type: varchar
        description: "CDC stream action captured from the source system"

      - name: is_update
        data_type: boolean
        description: "Flag indicating whether this CDC event is an update"

      - name: replicated_at
        data_type: timestamp_ntz
        description: "Timestamp when this row was replicated into the source stream"

      - name: source_row_id
        data_type: varchar
        description: "Source-system row identifier for traceability"