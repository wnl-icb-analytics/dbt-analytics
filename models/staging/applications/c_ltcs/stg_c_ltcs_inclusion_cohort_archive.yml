models:
  - name: stg_c_ltcs_inclusion_cohort_archive
    description: "C-LTCS inclusion cohort archive. One row per cohort event record."
    config:
      meta:
        owner:
          name: Emily Baldwin

    columns:
      - name: patient_id
        data_type: varchar
        description: "Unique patient identifier from commissioning data [sk_patient_id]"
        tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: varchar

      - name: area_code
        data_type: varchar
        description: "Area code associated with the cohort event"

      - name: practice_code
        data_type: varchar
        description: "Practice code associated with the cohort event"

      - name: cohort_event
        data_type: varchar
        description: "Event label captured for the cohort archive row"

      - name: is_active
        data_type: boolean
        description: "Flag indicating whether the cohort record is currently active"

      - name: event_written_at
        data_type: timestamp_ntz
        description: "Timestamp when the cohort event was written to the source table"
