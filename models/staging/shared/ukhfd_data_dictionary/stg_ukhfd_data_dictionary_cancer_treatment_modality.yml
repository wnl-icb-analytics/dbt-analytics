models:
  - name: stg_ukhfd_data_dictionary_cancer_treatment_modality
    description: >
      Modality of the cancer treatment block.

      Source: UKHFD.Data_Dictionary.dim_Cancer_Treatment_Modality_SCD
      (source 'ukhfd_cwt_data_dictionary' in models/sources/manual_ukhfd.yml)
      via raw_ukhfd_data_dictionary_cancer_treatment_modality.
    config:
      meta:
        owner:
          name: Jake Kealey
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: main_code_text
        data_tests:
          - unique
          - not_null
      - name: main_description
        data_tests:
          - not_null
      - name: treatment_group
        data_tests:
          - not_null
