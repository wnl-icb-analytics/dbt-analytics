version: 2

models:
  - name: stg_ukhfd_mental_health_act_legal_status_classification
    description: >
      Mental Health Act legal status classification codes and descriptions
      from the UKHFD data dictionary. One row per code, latest version only.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: legal_status_code
        description: Mental Health Act legal status classification code.
        data_tests:
          - unique
          - not_null
      - name: legal_status_desc
        description: Description of the classification.
        data_tests:
          - not_null
