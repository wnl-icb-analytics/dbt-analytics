version: 2

models:
  - name: stg_ukhfd_pss_summary_of_id_code_sets
    description: >
      Prescribed specialised services identification rule reference data from
      the UKHFD Summary Of ID Code Sets source. One row represents one source
      identification rule record. Via
      raw_ukhfd_pss_summary_of_id_code_sets.
    config:
      meta:
        owner:
          name: Jake Kealey
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: admimeth_apc_only
        description: Admission method values used by APC-only rules.
      - name: attended_nac_only
        description: Attendance NAC values used by NAC-only rules.
      - name: classpat_apc_only
        description: Patient classification values used by APC-only rules.
      - name: cs_num_use_of_equal_sign_exclusion_apc_only
        description: APC-only CS number equality exclusion rule.
      - name: commissioned_by
        description: Commissioning organisation or category for the rule.
      - name: created_date
        description: Date on which the source record was created.
      - name: file_name
        description: Name of the source file from which the record was imported.
      - name: flag_number
        description: Identifier of the identification rule flag.
      - name: icd10_and_opcs4_combination_required
        description: Whether an ICD-10 and OPCS-4 combination is required.
      - name: icd10_qualifiers
        description: ICD-10 qualifiers for the identification rule.
      - name: icd10_triggering_position
        description: ICD-10 position that triggers the identification rule.
      - name: icd10_triggers_count
        description: Number of ICD-10 triggers required by the rule.
      - name: import_date
        description: Date on which the source record was imported.
      - name: mainspef_count
        description: Number of main specialty values used by the rule.
      - name: npo_c_category
        description: National Programme of Care category for the rule.
      - name: new_service_lines
        description: New service lines associated with the identification rule.
      - name: no_of_identification_rules
        description: Number of identification rules represented by the record.
      - name: opcs4_and_opcs4_combination_required
        description: Whether an OPCS-4 and OPCS-4 combination is required.
      - name: opcs4_triggering_position
        description: OPCS-4 position that triggers the identification rule.
      - name: opcs4_triggers_count
        description: Number of OPCS-4 triggers required by the rule.
      - name: opcs_qualifiers
        description: OPCS qualifiers for the identification rule.
      - name: ps_flag
        description: Prescribed specialised services flag for the rule.
      - name: prescribed_service_line
        description: Prescribed specialised service line associated with the rule.
      - name: provider_eligibility_count
        description: Number of provider eligibility conditions for the rule.
      - name: qualifying_age
        description: Qualifying age for the identification rule.
      - name: qualifying_age_check
        description: Qualifying age check applied by the rule.
      - name: qualifying_gender
        description: Qualifying gender for the identification rule.
      - name: refsourc_nac_only
        description: Reference source values used by NAC-only rules.
      - name: service_line_hierarchy
        description: Service line hierarchy associated with the rule.
      - name: setting
        description: Care setting associated with the identification rule.
      - name: sub_rule_number
        description: Sub-rule number within the identification rule.
      - name: tretspef_count
        description: Number of treatment specialty values used by the rule.
      - name: unique_column
        description: Source-defined column used to identify the rule record.