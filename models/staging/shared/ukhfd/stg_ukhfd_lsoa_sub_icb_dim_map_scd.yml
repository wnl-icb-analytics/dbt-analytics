version: 2

models:
  - name: stg_ukhfd_lsoa_sub_icb_dim_map_scd
    description: |
      Mapping table including LSOA, Sub-ICB 
      as well as the local authority and ICB geographies.
    config:
      meta:
        owner:
          name: Jake Kealey
    columns:
      - name: lsoa_code
        description: LSOA code (2021 schema) from source mapping.

      - name: sub_icb_location_code
        description: Sub-ICB location code as provided by the source mapping.

      - name: sub_icb_location_ods_code
        description: Sub-ICB ODS code where available.

      - name: icb_code
        description: Integrated Care Board (ICB) code derived from mapping.

      - name: icb_ods_code
        description: ICB ODS code where available.

      - name: local_authority_district_code
        description: Local authority district code associated with the LSOA.

      - name: in_source_data
        description: Flag (1/0) indicating presence in the source dataset.

      - name: effective_snapshot_date
        description: Snapshot date for the SCD record.

      - name: is_latest
        description: Boolean flag indicating whether this row is the latest SCD record.

      - name: effective_from
        description: SCD effective-from date for the record.

      - name: effective_to
        description: SCD effective-to date for the record (null for current rows).

    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1