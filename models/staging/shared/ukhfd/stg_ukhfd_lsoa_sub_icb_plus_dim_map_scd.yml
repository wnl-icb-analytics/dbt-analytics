version: 2

models:
  - name: stg_ukhfd_lsoa_sub_icb_plus_dim_map_scd
    description: |
      Mapping between LSOA and sub-ICB and higher NHS geography dimensions.
      ICB Name and Local Authority name were introduced via joins for usability.

    config:
      meta:
        owner:
          name: Jake Kealey

    columns:
      - name: lsoa_code
        description: Lower Super Output Area code.
        data_tests:
          - unique
          - not_null

      - name: lsoa_code_year
        description: LSOA code year for the source geography.

      - name: sub_icb_code
        description: Sub-ICB code for the LSOA mapping.

      - name: sub_icb_code_year
        description: Sub-ICB code year for the source geography.

      - name: sub_icb_ods_code
        description: Sub-ICB ODS code for the mapping.

      - name: sub_icb_ods_code_year
        description: Sub-ICB ODS code year for the source geography.

      - name: icb_name
        description: ICB name joined from the ONS geography dictionary.

      - name: icb_code
        description: Integrated Care Board code for the LSOA mapping.

      - name: icb_code_year
        description: ICB code year for the source geography.

      - name: icb_ods_code
        description: ICB ODS code for the mapping.

      - name: icb_ods_code_year
        description: ICB ODS code year for the source geography.

      - name: nhser_code
        description: NHS England region code associated with the mapping.

      - name: nhser_code_year
        description: NHS England region code year for the source geography.

      - name: nhser_ods_code
        description: NHS England region ODS code associated with the mapping.

      - name: nhser_ods_code_year
        description: NHS England region ODS code year for the source geography.

      - name: lad_name
        description: Local authority district name joined from the ONS geography dictionary.

      - name: lad_code
        description: Local authority district code associated with the mapping.

      - name: lad_code_year
        description: Local authority district code year for the source geography.

      - name: effective_snapshot_date
        description: Effective snapshot date for the mapping record.

      - name: is_latest
        description: Flag indicating whether the row is the latest version in the SCD history.

      - name: effective_from
        description: Effective-from date for the mapping record.

      - name: effective_to
        description: Effective-to date for the mapping record where applicable.