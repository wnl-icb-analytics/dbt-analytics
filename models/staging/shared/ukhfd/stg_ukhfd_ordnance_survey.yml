version: 2
models:
  - name: stg_ukhfd_ordnance_survey_lsoa_2011
    description: One row per LSOA on 2011 boundaries in England and Wales, with its ONS name.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: lsoa_code_2011
        description: ONS LSOA code on 2011 boundaries.
        data_tests: [unique, not_null]
      - name: lsoa_name_2011
        description: ONS LSOA name on 2011 boundaries.
  - name: stg_ukhfd_ordnance_survey_lsoa_2021
    description: One row per LSOA on December 2021 boundaries in England and Wales, with its ONS name.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: lsoa_code_2021
        description: ONS LSOA code on 2021 boundaries.
        data_tests: [unique, not_null]
      - name: lsoa_name_2021
        description: ONS LSOA name on 2021 boundaries.
