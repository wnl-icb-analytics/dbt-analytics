models:
  - name: stg_ukhfd_emergency_care_department_type
    description: >
      Current UKHFD emergency care department type descriptions. One row per
      department type code.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: department_type
        description: Emergency care department type code.
        data_tests:
          - unique
          - not_null
      - name: department_type_desc
        description: Current UKHFD description of the department type.
        data_tests:
          - not_null
