models:
  - name: stg_dictionary_ecds_comorbidity
    description: >
      ECDS comorbidity codes from the ETOS reference data, one row per
      ecds_unique_id and valid_from version, including retired entries. Maps
      SNOMED CT codes to ECDS descriptions. Use valid_to and dv_is_active to
      select current entries.
    config:
      meta:
        owner:
          name: Emily Baldwin
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ecds_unique_id
              - valid_from
    columns:
      - name: ecds_unique_id
        description: ECDS unique identifier (part of composite key with valid_from)
        tests:
          - not_null
      - name: snomed_code
        description: SNOMED CT code
        tests:
          - not_null
      - name: valid_from
        description: Valid from date (part of composite key with ecds_unique_id)
        tests:
          - not_null