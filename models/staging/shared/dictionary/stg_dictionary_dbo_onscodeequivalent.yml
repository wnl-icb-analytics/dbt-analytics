models:
- name: stg_dictionary_dbo_onscodeequivalent
  description: >-
    Supplied geography codes, names, status and dates from Dictionary ONSCodeEquivalent.
    Includes terminated codes. One row per supplied geography-code definition.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: geography_code
    data_tests:
    - unique
    - not_null
  - name: geography_name
    description: Geography name supplied by Dictionary.
