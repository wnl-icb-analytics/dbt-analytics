version: 2

models:
  - name: stg_dictionary_ers_priority
    description: >-
      e-RS priority dictionary entries, one row per supplied code with its
      meaning and display label. Includes all supplied codes without a
      current-status restriction. Contact: jonathan.linney@nhs.net
    config:
      meta:
        owner:
          name: Jonathan Linney
    columns:
      - name: code
        data_type: varchar
        description: "Priority code"
        tests:
          - unique
          - not_null
      - name: meaning
        data_type: varchar
        description: "Priority meaning/label"
      - name: display
        data_type: varchar
        description: "Priority display text"