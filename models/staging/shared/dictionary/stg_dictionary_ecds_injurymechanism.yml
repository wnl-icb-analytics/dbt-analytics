version: 2

models:
  - name: stg_dictionary_ecds_injurymechanism
    description: ECDS injury mechanism reference dictionary.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: ecds_unique_id
        description: ECDS dictionary identifier; not unique across all source versions and code assignments.
        data_tests:
          - not_null
      - name: snomed_code
        description: SNOMED CT code used to join the dictionary to ECDS activity.
        data_tests:
          - unique
          - not_null
      - name: snomed_uk_preferred_term
        description: Human-readable UK preferred SNOMED term.
      - name: ecds_description
        description: ECDS-specific description of the code.
      - name: ecds_group1
        description: High-level ECDS grouping for the code.
