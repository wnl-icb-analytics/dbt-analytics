version: 2

models:
  - name: stg_dictionary_snomed_ref_set_complex_map
    description: >
      SNOMED CT complex-map members. One row per map member, retaining group,
      priority, rule and advice. Consumers select the reference set and policy.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: id
        description: Unique complex-map member identifier.
        data_tests: [not_null, unique]
      - name: referenced_component_id
        description: Source SNOMED CT concept identifier.
      - name: ref_set_id
        description: Reference set defining the mapping.
      - name: active
        description: Whether this map member is active.
      - name: map_target
        description: Target code in the destination coding system.
      - name: map_group
        description: Mapping group number.
      - name: map_priority
        description: Priority within the mapping group.
      - name: map_rule
        description: Rule governing application of this map member.
      - name: map_advice
        description: Advice supplied with this map member.
