models:
  - name: stg_dictionary_snomed_concept
    description: Deduplicated SNOMED CT concepts for reusable preferred-term lookups.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: snomed_code
        description: SNOMED CT concept identifier.
        data_tests:
          - unique
          - not_null
      - name: preferred_term
        description: Preferred human-readable term for the SNOMED CT concept.
      - name: is_active
        description: Whether the concept is active in the source terminology.
      - name: last_updated
        description: Date or timestamp the source concept was last updated.
