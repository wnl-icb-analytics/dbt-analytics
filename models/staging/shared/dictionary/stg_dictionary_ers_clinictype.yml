version: 2

models:
  - name: stg_dictionary_ers_clinictype
    description: "Staging model for eRS clinic type dictionary. 1:1 passthrough from raw layer, no joins.\nContact: jonathan.linney@nhs.net"
    config:
      meta:
        owner:
          name: Jonathan Linney
    columns:
      - name: code
        data_type: varchar
        description: "Clinic type code"
        tests:
          - unique
          - not_null
      - name: meaning
        data_type: varchar
        description: "Clinic type meaning/label"
      - name: display
        data_type: varchar
        description: "Clinic type display text"