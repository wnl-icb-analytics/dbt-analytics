models:
  - name: stg_dictionary_dbo_ethnicitycode
    description: >-
      Ethnicity dictionary entries from Dictionary.dbo.EthnicityCode. One row per
      ethnicity mapping, code-system value, description and priority. A source
      code may have several descriptions or map to several ethnicity identifiers.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_ethnicity_id
              - ethnicity_code_type
              - ethnic_category_code
              - ethnic_group_code
              - ic_code
              - pds_ethnic_category_code
              - read_code
              - sde_code
              - snomed_code
              - description
              - priority
    columns:
      - name: ethnicity_code_type
        description: Code-system column populated on this row, such as EthnicCategoryCode, ReadCode or Snomed.
        data_tests:
          - not_null
      - name: ethnic_category_code
        description: NHS Census category code where ethnicity_code_type is EthnicCategoryCode.
      - name: description
        description: Dictionary description for the code value on this row.
