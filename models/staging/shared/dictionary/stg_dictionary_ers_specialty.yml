version: 2

models:
  - name: stg_dictionary_ers_specialty
    description: >-
      e-RS specialty dictionary entries, one row per supplied code with its
      meaning and display label. Includes all supplied codes without a
      current-status restriction. The 2WW referral mapping uses display labels
      rather than code values. Contact: jonathan.linney@nhs.net
    config:
      meta:
        owner:
          name: Jonathan Linney
    columns:
      - name: code
        data_type: varchar
        description: "Specialty code"
        tests:
          - unique
          - not_null
      - name: meaning
        data_type: varchar
        description: "Specialty meaning/label (used as TFC_CODE downstream in int_ers_action_base)"
      - name: display
        data_type: varchar
        description: "Specialty display text (joined downstream against the 2WW specialty name mapping function output, not against code)"