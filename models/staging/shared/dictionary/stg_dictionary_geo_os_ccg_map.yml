models:
  - name: stg_dictionary_geo_os_ccg_map
    description: >-
      NHS organisation boundary geometry from Dictionary.Geo.OS_CCG_Map.
      One row represents one available organisation boundary record.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: sk_organisation_id
        description: Dictionary organisation surrogate key used to resolve the CCG.
        data_tests:
          - not_null
      - name: geom
        description: Organisation boundary geometry in British National Grid coordinates.
        data_tests:
          - not_null
      - name: date_created
        description: Source creation timestamp.
      - name: date_updated
        description: Source update timestamp.
