models:
- name: stg_dictionary_ers_service
  description: One e-RS service retained by Dictionary, including services whose effective period has
    ended. The extract supplies one retained definition per service, not successive versions.
  config:
    meta:
      owner:
        name: Jonathan Linney
  columns:
  - name: service_id
    data_tests:
    - unique
    - not_null
  - name: service_name
    description: Latest retained service name.
  - name: beg_effective_dt
    description: Start of the supplied service definition period.
  - name: end_effective_dt
    description: End of the supplied service definition period, where supplied.
