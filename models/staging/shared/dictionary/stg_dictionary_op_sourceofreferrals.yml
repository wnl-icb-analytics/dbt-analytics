models:
  - name: stg_dictionary_op_sourceofreferrals
    description: Outpatient source of referrals reference data
    config:
      meta:
        owner:
          name: Jake Kealey
    columns:
      - name: sk_source_of_referral
        description: Primary key - surrogate key for source of referral
        tests:
          - unique
          - not_null
      - name: bk_source_of_referral_code
        description: Business key - source of referral code
        tests:
          - not_null
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
