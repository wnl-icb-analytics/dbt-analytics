version: 2
models:
- name: stg_fact_patient_factprofile
  description: >-
    Patient demographic profiles from FactProfile, one row per supplied
    patient, data-source and profile-period record. Includes gender and
    ethnicity identifiers, date of birth and date of death. All supplied
    periods are retained; a patient can have several profiles across sources
    or time.
  config:
    meta:
      owner:
        name: Jonathan Linney
  tests:
    - dbt_expectations.expect_table_row_count_to_be_between:
        arguments:
          min_value: 1