version: 2
models:
- name: stg_reference_geo_neighbourhood_ward
  description: 'WNL electoral ward (2025) to neighbourhood (INT) lookup, one row per
    ward, covering every ward in the 13 WNL boroughs. Maintained in the primary care
    org manager app; it defines each neighbourhood. Codes and names use the canonical
    REFERENCE scheme (e.g. BAR01 / "Barnet East").'
  config:
    meta:
      owner:
        name: Jonathan Linney
  columns:
    - name: ward_code
      description: Electoral ward 2025 code (WD25CD)
      data_tests:
        - unique
        - not_null
    - name: ward_name
      description: Electoral ward 2025 name
    - name: neighbourhood_code
      description: Neighbourhood (INT) code, canonical REFERENCE scheme (e.g. BAR01)
      data_tests:
        - not_null
    - name: neighbourhood_name
      description: Neighbourhood (INT) name
