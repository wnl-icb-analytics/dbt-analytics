version: 2
models:
  - name: stg_reference_primary_care_neighbourhood
    description: >-
      WNL neighbourhoods (Integrated Neighbourhood Teams) curated in the
      primary care org manager app. One row per neighbourhood.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: neighbourhood_code
        description: Neighbourhood code - 3-letter borough code plus number, e.g. BAR01.
        data_tests:
          - unique
          - not_null
      - name: neighbourhood_code_legacy
        description: Superseded WNL N-code, kept for legacy joins.
      - name: is_active
        description: Whether the neighbourhood is in use.
