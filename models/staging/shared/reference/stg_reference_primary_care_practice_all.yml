models:
  - name: stg_reference_primary_care_practice_all
    description: >-
      One current reference row per GP practice, including practice, Sub-ICB,
      borough, PCN and neighbourhood attributes.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: practice_code
        description: GP practice ODS code.
        data_tests:
          - unique
          - not_null
      - name: practice_name
        description: GP practice name.
      - name: sub_icb_code
        description: Sub-ICB code associated with the practice.
      - name: sub_icb_name
        description: Sub-ICB name associated with the practice.
      - name: geographic_borough_name
        description: Geographic borough associated with the practice.
      - name: pcn_name
        description: PCN name associated with the practice.
      - name: neighbourhood_name
        description: Neighbourhood associated with the practice.
