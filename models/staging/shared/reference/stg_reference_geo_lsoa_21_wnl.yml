models:
  - name: stg_reference_geo_lsoa_21_wnl
    description: >-
      Curated list of WNL 2021 Lower Layer Super Output Areas and their
      population-weighted centroid coordinates. One row per LSOA 2021.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: lsoa_2021_code
        description: ONS 2021 Lower Layer Super Output Area code.
        data_tests:
          - unique
          - not_null
      - name: lsoa_2021_name
        description: ONS 2021 Lower Layer Super Output Area name.
      - name: latitude
        description: Latitude of the LSOA centroid in WGS84 coordinates.
        data_tests:
          - not_null
      - name: longitude
        description: Longitude of the LSOA centroid in WGS84 coordinates.
        data_tests:
          - not_null
