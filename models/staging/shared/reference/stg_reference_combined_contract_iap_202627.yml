models:
  - name: stg_reference_combined_contract_iap_202627
    description: >-
      Combined Contract IAP 2026-27 reference lookup table for analyst-managed
      contract monitoring data. One row represents a contract monitoring record
      for a provider, commissioner, service and tariff combination.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: financial_month
        description: Financial month covered by the record.
      - name: financial_year
        description: Financial year covered by the record.
      - name: data_set_created
        description: Date the source data set was created.
      - name: provider_code
        description: Provider organisation code.
      - name: commissioner_code
        description: Commissioner code for the contract record.
      - name: commissioned_service_category_code
        description: Commissioned service category code.
      - name: service_code
        description: Service code.
      - name: point_of_delivery_code
        description: Point of delivery code.
      - name: tariff_code
        description: Tariff code.
      - name: contract_monitoring_planned_activity
        description: Planned activity value recorded in contract monitoring.
      - name: contract_monitoring_planned_price
        description: Planned price value recorded in contract monitoring.
      - name: source_provider
        description: Provider that supplied the source record.
      - name: source_file
        description: Source file name or extract identifier for the record.
      - name: type
        description: Record type or source classification.
      - name: contract_type
        description: Contract type classification for the record.
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
