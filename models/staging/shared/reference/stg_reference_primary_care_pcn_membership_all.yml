models:
  - name: stg_reference_primary_care_pcn_membership_all
    description: 'WNL GP practices with PCN membership, health borough, and registered local authority. May hold more than one row per practice; consumers pick one (prefer Active practice status)'
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: practice_code
        description: GP practice ODS code
        data_tests:
          - not_null
      - name: practice_name
        description: GP practice name
      - name: practice_status
        description: practice status (Active or closed variants)
      - name: pcn_code
        description: primary care network ODS code
      - name: pcn_name
        description: primary care network name
      - name: health_borough_name
        description: Legacy CCG area used as the health borough; distinct from the registered local authority
        data_tests:
          - not_null
      - name: registered_borough_name
        description: Local authority associated with the practice registration
