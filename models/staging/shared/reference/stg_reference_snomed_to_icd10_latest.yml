version: 2

models:
  - name: stg_reference_snomed_to_icd10_latest
    description: >-
      SNOMED CT to ICD-10 cross-maps from the latest retained NHS TRUD release, one row per
      supplied mapping entry. Map group, priority, rule and advice govern interpretation. A
      concept can have several mappings.
    config:
      meta:
        owner:
          name: Jake Kealey
    columns:
      - name: snomed_concept_id
        description: "SNOMED CT concept identifier"
        data_tests:
          - not_null
      - name: snomed_term
        description: "SNOMED CT preferred term"
      - name: icd10_code
        description: "ICD-10 code"
        data_tests:
          - not_null
      - name: icd10_term
        description: "ICD-10 code description"
      - name: map_group
        description: "Map group identifier for grouping related mappings"
      - name: map_priority
        description: "Priority of the mapping (lower values indicate higher priority)"
      - name: map_rule
        description: "Map rule code describing the mapping relationship"
      - name: map_advice
        description: "Advice associated with the mapping"
      - name: map_block
        description: "Map block identifier"
      - name: effective_time
        description: "Effective date/time of the mapping"
      - name: release_id
        description: "Release identifier of the reference data"
