models:
  - name: stg_nhsd_snomed_sct_description
    description: One SNOMED CT description in the NHS Digital reporting model, retaining preferred terms, fully specified names and synonyms.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: id
        description: Unique description identifier; a concept has several descriptions.
        data_tests: [unique, not_null]
      - name: concept_id
        description: SNOMED CT concept described by this term.
      - name: description_type
        description: Reporting-model designation, P for preferred term, F for fully specified name and S for synonym. Null for descriptions without a designation.
      - name: active
        description: Whether the description is active, independently of the concept status.
