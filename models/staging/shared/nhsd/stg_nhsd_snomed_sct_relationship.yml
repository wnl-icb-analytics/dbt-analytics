models:
  - name: stg_nhsd_snomed_sct_relationship
    description: One SNOMED CT defining relationship in the NHS Digital reporting model, including its active status and characteristic type.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: id
        description: SNOMED CT relationship identifier.
        data_tests: [unique, not_null]
      - name: source_id
        description: Concept defined by the relationship.
      - name: destination_id
        description: Target concept or attribute value.
      - name: type_id
        description: SNOMED CT relationship type, including is-a and context attributes.
      - name: characteristic_type_id
        description: Distinguishes stated from inferred relationships.
