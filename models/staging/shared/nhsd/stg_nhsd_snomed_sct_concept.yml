models:
  - name: stg_nhsd_snomed_sct_concept
    description: One SNOMED CT concept in the NHS Digital reporting model, including inactive historical concepts.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: id
        description: SNOMED CT concept identifier.
        data_tests: [unique, not_null]
      - name: active
        description: Current active status. An inactive concept remains a recognised historical code.
      - name: effective_time
        description: Effective time of the retained concept definition.
