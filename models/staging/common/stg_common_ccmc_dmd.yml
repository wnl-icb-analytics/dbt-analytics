models:
  - name: stg_common_ccmc_dmd
    description: >
      CCMS dm+d codelist, each row mapping a CCMS condition to a dm+d product
      with its preferred term. Rows are not filtered or deduplicated. Used by
      the in-house CCMS pipeline under modelling/olids/risk_stratification.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: conditionid
        description: CCMS condition identifier.
        tests:
          - not_null
      - name: conditionname
        description: CCMS condition name.
      - name: productid
        description: dm+d product code mapped to the condition.
        tests:
          - not_null
      - name: primaryterm
        description: dm+d preferred term for the product.
