models:
  - name: stg_common_ccmc_snomed
    description: >
      CCMS SNOMED codelist, each row mapping a CCMS condition to a SNOMED CT
      concept with its preferred term. Rows are not filtered or deduplicated.
      Used by the in-house CCMS pipeline under
      modelling/olids/risk_stratification.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: conditionid
        description: CCMS condition identifier.
        tests:
          - not_null
      - name: conditionname
        description: CCMS condition name.
      - name: conceptid
        description: SNOMED concept code mapped to the condition.
        tests:
          - not_null
      - name: primaryterm
        description: SNOMED preferred term for the concept.
