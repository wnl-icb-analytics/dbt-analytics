models:
  - name: stg_common_aicentre_vocab
    description: >
      AI Centre OMOP-style concept vocabulary (DATA_LAKE__NCL.COMMON.AICENTRE_VOCAB),
      used to attach descriptions to coded activity (ICD-10, OPCS-4, SNOMED).
      Migrated from stg_aic_base_athena_concept (AIC_DEV.BASE_ATHENA__CONCEPT).
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: concept_id
        description: Primary key - concept identifier
        data_tests:
          - unique
          - not_null
      - name: concept_code
        description: Concept code (e.g., ICD10 code)
      - name: vocabulary_id
        description: Vocabulary identifier (e.g., ICD10, SNOMED)
