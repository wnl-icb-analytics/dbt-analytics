version: 2

models:
  - name: stg_lpf_encounter
    description: |
      Staging layer for local provider flow encounter data.
      One row per encounter_id, holding the latest submitted version.
      Removes deleted records and null encounter_id values.
      Source: raw_lpf_encounter

    config:
      meta:
        owner:
          name: Data Team

    columns:
      - name: encounter_id
        description: Provider identifier for the encounter. One row per value.
        data_tests:
          - unique
          - not_null

      - name: metadata_record_ingestion_timestamp
        description: Timestamp when the record was ingested.
        data_tests:
          - not_null
