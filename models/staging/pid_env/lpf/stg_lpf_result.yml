version: 2

models:
  - name: stg_lpf_result
    description: |
      Staging layer for local provider flow result data.
      One row per result_id, holding the latest submitted version.
      Removes deleted records and null result_id values.
      Source: raw_lpf_result

    config:
      meta:
        owner:
          name: Data Team

    columns:
      - name: result_id
        description: Provider identifier for the result. One row per value.
        data_tests:
          - unique
          - not_null

      - name: metadata_record_ingestion_timestamp
        description: Timestamp when the record was ingested.
        data_tests:
          - not_null
