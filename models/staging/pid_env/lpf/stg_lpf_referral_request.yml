version: 2

models:
  - name: stg_lpf_referral_request
    description: |
      Staging layer for local provider flow referral request data.
      One row per referral_request_id, holding the highest-version submission that is not deleted (ingestion time, then file row, break ties).
      Removes deleted records and null referral_request_id values.
      Source: raw_lpf_referral_request

    config:
      meta:
        owner:
          name: Data Team

    columns:
      - name: referral_request_id
        description: Provider identifier for the referral request. One row per value.
        # Grain holds by construction (row_number = 1 per key). Each test re-runs
        # the full dedup over the source, so these run in the monthly build only.
        data_tests:
          - unique:
              config:
                tags: ['monthly-full']
          - not_null:
              config:
                tags: ['monthly-full']

      - name: metadata_record_ingestion_timestamp
        description: Timestamp when the record was ingested.
