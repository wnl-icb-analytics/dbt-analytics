version: 2

models:
  - name: stg_lpf_immunisation
    description: |
      Staging layer for local provider flow immunisation data.
      One row per immunisation_id, holding the latest submitted version.
      Removes deleted records and null immunisation_id values.
      Source: raw_lpf_immunisation

    config:
      meta:
        owner:
          name: Data Team

    columns:
      - name: immunisation_id
        description: Provider identifier for the immunisation. One row per value.
        data_tests:
          - unique
          - not_null

      - name: metadata_record_ingestion_timestamp
        description: Timestamp when the record was ingested.
        data_tests:
          - not_null
