version: 2

models:
  - name: stg_lpf_demographics
    description: |
      Staging layer for local provider flow demographics data.
      One row per person_id, holding the latest submitted version.
      Removes deleted records and null person_id values.
      Source: raw_lpf_demographics

    config:
      meta:
        owner:
          name: Data Team

    columns:
      - name: person_id
        description: Provider identifier for the person. One row per value.
        data_tests:
          - unique
          - not_null

      - name: metadata_record_ingestion_timestamp
        description: Timestamp when the record was ingested.
        data_tests:
          - not_null
