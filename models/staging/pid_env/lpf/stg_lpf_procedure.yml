version: 2

models:
  - name: stg_lpf_procedure
    description: |
      Staging layer for local provider flow procedure data.
      One row per procedure_id, holding the latest submitted version.
      Removes deleted records and null procedure_id values.
      Source: raw_lpf_procedure

    config:
      meta:
        owner:
          name: Data Team

    columns:
      - name: procedure_id
        description: Provider identifier for the procedure. One row per value.
        data_tests:
          - unique
          - not_null

      - name: metadata_record_ingestion_timestamp
        description: Timestamp when the record was ingested.
        data_tests:
          - not_null
