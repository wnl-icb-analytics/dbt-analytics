models:
  - name: stg_cltcs_ptl
    description: >
      C-LTCS EMIS patient tracking list with MDT outcomes, one row per source
      row, excluding rows without an sk_patient_id. sk_patient_id should be
      unique, but duplicates only raise a warning.
    config:
      meta:
        owner:
          name: em-baldwin
    columns:
      - name: sk_patient_id
        data_type: varchar
        description: Pseudonymised NHS number (surrogate key for patient)
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn
