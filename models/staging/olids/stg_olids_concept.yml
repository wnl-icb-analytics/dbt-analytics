models:
  - name: stg_olids_concept
    description: Terminology and coding concepts used throughout OLIDS. Static reference table.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: concept_id
        description: Primary key (UUID) replacing the removed `id` column.
        tests:
          - unique
          - not_null
      - name: system
        description: Coding system or terminology (e.g., SNOMED CT, Read, ICD-10)
      - name: code
        description: Code value within the system
      - name: display
        description: Human-readable display text for the code
      - name: is_mapped
        description: Boolean indicating if this concept has been mapped to a standard terminology
      - name: use_count
        description: Number of times this concept is used in the dataset
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1