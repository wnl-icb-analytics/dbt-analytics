models:
  - name: stg_olids_episode_of_care
    description: Episodes of care tracking patient care pathways over time. Deduplicated by id and filtered to exclude deleted records.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: id
        description: Primary key - unique identifier for this episode of care
        tests:
          - unique
          - not_null
      - name: publisher_organisation_id
        description: Foreign key to organisation.id - data controller organisation that published the record
      - name: provider_organisation_id
        description: Foreign key to organisation.id - organisation delivering the episode of care
      - name: patient_id
        description: Foreign key to patient.id
      - name: person_id
        description: Foreign key to person.id - person-level identifier
      - name: episode_type_source_concept_id
        description: Foreign key to concept.id - type of episode of care
      - name: episode_type_code
        description: Code value for the episode type concept
      - name: episode_type_display
        description: Display name for the episode type concept
      - name: episode_type_source_code
        description: Source code for the episode type concept (from concept map)
      - name: episode_type_source_display
        description: Source display name for the episode type concept (from concept map)
      - name: episode_status_source_concept_id
        description: Foreign key to concept.id - status of the episode (planned, active, onhold, finished, cancelled)
      - name: episode_status_code
        description: Code value for the episode status concept
      - name: episode_status_display
        description: Display name for the episode status concept
      - name: episode_status_source_code
        description: Source code for the episode status concept (from concept map)
      - name: episode_status_source_display
        description: Source display name for the episode status concept (from concept map)
      - name: episode_of_care_start_date
        description: Start date of the episode of care
      - name: episode_of_care_end_date
        description: End date of the episode of care
      - name: care_manager_practitioner_in_role_id
        description: Foreign key to practitioner_in_role.id - care manager responsible for the episode
      - name: lds_id
        description: LDS system identifier
      - name: publisher_organisation_code
        description: ODS code of the data controller organisation that published the record
      - name: lds_datetime_first_acquired
        description: "Datetime when the source record was first acquired by LDS (post-2026 OLIDS rename — was lds_datetime_source_record_acquired)"
      - name: lds_datetime_update_acquired
        description: "Datetime when the source record update was acquired by LDS (post-2026 OLIDS rename — was lds_datetime_source_record_updated)"
      - name: lds_start_datetime
        description: LDS datetime stamp from which the record version was correct - used for deduplication to get the latest record
      - name: lds_is_deleted
        description: Deletion flag - records with TRUE are filtered out in this staging layer
      - name: lds_source_record_id
        description: LDS assigned unique identifier for the source record version
      - name: care_manager_organisation_id
        description: "Foreign key to organisation.id — the organisation responsible for managing care during this episode. New in the 2026 OLIDS schema realignment (issue #747)."
      - name: care_manager_organisation_code
        description: "ODS code of the care-manager organisation. New in the 2026 OLIDS schema realignment (issue #747)."
      - name: author_organisation_id
        description: "Foreign key to organisation.id — the organisation that authored this episode-of-care record. New in the 2026 OLIDS schema realignment (issue #747)."
    tests:
      # the registration spine filters episode_type_source_code = 'Regular'
      # (2.76M of 2.88M episodes); a literal change would empty registrations
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1500000
            row_condition: "episode_type_source_code = 'Regular'"
          config:
            severity: error
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1