models:
  - name: stg_olids_medication_statement
    description: Medication statements representing current or historical medication use. Deduplicated by id and
      filtered to exclude deleted records and GP2GP transfer copies. A copy is the second version of a
      transferred patient history, held on the patient record at the new practice. The original on the
      earlier record is kept, so each event is counted once.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: id
        description: Primary key - unique identifier for this medication statement
        tests:
          - unique
          - not_null
      - name: provider_organisation_id
        description: Foreign key to organisation.id - organisation managing the statement
      - name: person_id
        description: Foreign key to person.id - person-level identifier
      - name: patient_id
        description: Foreign key to patient.id
      - name: encounter_id
        description: Foreign key to encounter.id - encounter when statement was recorded
      - name: practitioner_id
        description: Foreign key to practitioner.id - practitioner who recorded the statement
      - name: observation_id
        description: Foreign key to observation.id - related observation
      - name: allergy_intolerance_id
        description: Foreign key to allergy_intolerance.id - related allergy
      - name: diagnostic_order_id
        description: Foreign key to diagnostic_order.id - related diagnostic order
      - name: referral_request_id
        description: Foreign key to referral_request.id - related referral
      - name: authorisation_type_source_concept_id
        description: Foreign key to concept.id - type of authorisation (acute, repeat, automatic, etc.)
      - name: authorisation_type_source_code
        description: Source code for the authorisation type concept (from concept map)
      - name: authorisation_type_source_display
        description: Source display name for the authorisation type concept (from concept map)
      - name: authorisation_type_code
        description: Code value for the authorisation type concept (target/mapped code)
      - name: authorisation_type_display
        description: Display name for the authorisation type concept (target/mapped display)
      - name: clinical_effective_date_precision_source_concept_id
        description: Foreign key to concept.id - precision of the clinical effective date
      - name: date_precision_code
        description: Code value for the date precision concept
      - name: date_precision_display
        description: Display name for the date precision concept
      - name: date_precision_source_code
        description: Source code for the date precision concept (from concept map)
      - name: date_precision_source_display
        description: Source display name for the date precision concept (from concept map)
      - name: medication_statement_source_concept_id
        description: Foreign key to concept.id - source concept for the medication
      - name: mapped_concept_id
        description: Foreign key to concept.id - mapped standardized concept for the medication
      - name: mapped_concept_code
        description: Code of the mapped medication concept
      - name: mapped_concept_display
        description: Display text of the mapped medication concept
      - name: source_code
        description: Source code for the medication statement concept
      - name: source_display
        description: Source display name for the medication statement concept
      - name: source_system
        description: Source system for the medication statement concept
      - name: target_system
        description: Target system for the mapped concept
      - name: clinical_effective_date
        description: Date the medication statement was clinically effective
      - name: cancellation_date
        description: Date the medication statement was cancelled
      - name: dose
        description: Dosage instructions as text
      - name: quantity_value_description
        description: Text description of the quantity
      - name: quantity_value
        description: Numeric quantity value
      - name: quantity_unit
        description: Unit of measure for the quantity
      - name: medication_name
        description: Name of the medication
      - name: bnf_reference
        description: British National Formulary reference code
      - name: age_at_event
        description: Patient age in years at time of statement
      - name: age_at_event_baby
        description: Patient age in months for babies (0-24 months)
      - name: age_at_event_neonate
        description: Patient age in days for neonates (0-28 days)
      - name: issue_method
        description: Method of issue (acute, repeat, etc.)
      - name: date_recorded
        description: Date the record was entered into the system
      - name: is_active
        description: Boolean indicating if the medication statement is currently active
      - name: is_confidential
        description: Boolean indicating if the record is marked as confidential
      - name: is_deleted
        description: Boolean indicating if the clinical record has been deleted
      - name: expiry_date
        description: Date when the medication statement expires
      - name: lds_id
        description: LDS system identifier
      - name: publisher_organisation_code
        description: "ODS code of the publisher organisation (post-2026 OLIDS rename — was record_owner_organisation_code)"
      - name: lds_datetime_first_acquired
        description: Datetime when data was acquired by LDS
      - name: lds_start_datetime
        description: LDS datetime stamp from which the record version was correct - used for deduplication to get the latest record
      - name: is_gp2gp_import
        description: True when dbt-OLIDS infers the record arrived by GP2GP transfer. The event is dated before the
          latest Regular registration start and was recorded within 30 days of it. This is a timing
          signature, so a small share may be entries made by the new practice, such as new-patient checks.
      - name: lds_is_deleted
        description: Deletion flag - records with TRUE are filtered out in this staging layer
      - name: lds_source_record_id
        description: LDS assigned unique identifier for the source record version
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1