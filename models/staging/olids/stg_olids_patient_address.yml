models:
  - name: stg_olids_patient_address
    description: Patient address history linking patients to plain postcodes. Deleted records are excluded.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: id
        description: Primary key - unique identifier for this patient address record
        tests:
          - unique
          - not_null
      - name: patient_id
        description: Foreign key to patient.id
      - name: address_type_source_concept_id
        description: Foreign key to concept.id - type of address (home, temporary, work, etc.)
      # REVIEW: plain postcode replaces the removed postcode hash.
      - name: postcode_hash
        description: Pseudonymised postcode hash (source POSTCODE column)
      - name: is_home_address
        description: True for a home address
      - name: start_date
        description: Start date of the patient living at this address
      - name: end_date
        description: End date of the patient living at this address
      - name: person_id
        description: Foreign key to person.id - person-level identifier
      - name: publisher_organisation_code
        description: "ODS code of the publisher organisation (post-2026 OLIDS rename — was record_owner_organisation_code)"
      - name: lds_transform_datetime
        description: Datetime when the row was transformed
      - name: lds_is_deleted
        description: Soft-delete flag
      - name: lds_source_record_id
        description: LDS assigned unique identifier for the source record version
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
