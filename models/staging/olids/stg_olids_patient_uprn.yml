models:
  - name: stg_olids_patient_uprn
    description: >
      OLIDS patient address matches to Unique Property Reference Numbers, one
      row per source row, linked to patient_address by patient_address_id. The
      source has no deletion flag or record metadata, so rows are not
      deduplicated or filtered for deletion.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: postcode_quality
        description: Quality indicator for postcode
      - name: qualifier
        description: Qualifier for the address match
      - name: classification
        description: Property classification code
      - name: algorithm
        description: Algorithm used for address matching
      - name: match_pattern
        description: Pattern used for the address match
      - name: publisher_organisation_code
        description: "ODS code of the publisher organisation (post-2026 OLIDS rename — was record_owner_organisation_code)"
      - name: patient_address_id
        description: "Foreign key to patient_address.id — links this UPRN match to the patient_address record it was matched against. New in the 2026 OLIDS schema realignment (issue #747)."
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 1