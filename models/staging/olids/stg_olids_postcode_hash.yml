models:
  # REVIEW: retained for hash-keyed consumers, but person geography now uses plain postcode.
  - name: stg_olids_postcode_hash
    description: Hashed postcodes linked to geographical and administrative areas.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: postcode_hash
        description: Primary key - hashed postcode value
        tests:
          - unique
          - not_null
      - name: primary_care_organisation
        description: Primary care organisation code for the postcode area
      - name: local_authority_organisation
        description: Local authority organisation code for the postcode area
      - name: yr_2011_lsoa
        description: 2011 Lower Super Output Area code
      - name: yr_2011_msoa
        description: 2011 Middle Super Output Area code
      - name: yr_2021_lsoa
        description: 2021 Lower Super Output Area code
      - name: yr_2021_msoa
        description: 2021 Middle Super Output Area code
      - name: outcode
        description: Postcode outcode
      - name: ward
        description: Ward code
      - name: version
        description: Lookup version
      - name: last_updated
        description: Lookup update datetime
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
