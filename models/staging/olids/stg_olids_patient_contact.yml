models:
  - name: stg_olids_patient_contact
    description: Patient contact information including next of kin and emergency contacts. Deduplicated by id and filtered to exclude deleted records.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: id
        description: Primary key - unique identifier for this patient contact
        tests:
          - unique
          - not_null
      - name: person_id
        description: Foreign key to person.id - person who is the contact
      - name: patient_id
        description: Foreign key to patient.id - patient this contact relates to
      - name: contact_type_source_concept_id
        description: Foreign key to concept.id - type of contact (next of kin, emergency contact, etc.)
      - name: start_date
        description: Start date of this contact relationship
      - name: end_date
        description: End date of this contact relationship
      - name: lds_id
        description: LDS system identifier
      - name: publisher_organisation_code
        description: "ODS code of the publisher organisation (post-2026 OLIDS rename — was record_owner_organisation_code)"
      - name: lds_datetime_first_acquired
        description: Datetime when data was acquired by LDS
      - name: lds_start_datetime
        description: LDS datetime stamp from which the record version was correct - used for deduplication to get the latest record
      - name: lds_is_deleted
        description: Deletion flag - records with TRUE are filtered out in this staging layer
      - name: lds_source_record_id
        description: LDS assigned unique identifier for the source record version
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1