models:
  - name: stg_olids_appointment
    description: >-
      One current patient-associated appointment from the filtered OLIDS patient
      spine. Upstream removes duplicate IDs and requires a patient and scheduled
      start time. Staging excludes deleted records and missing person IDs.
      Blocked slots, all current statuses and all recorded contexts remain included.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: id
        description: Primary key - unique identifier for this appointment
        tests:
          - unique
          - not_null
      - name: provider_organisation_id
        description: Foreign key to organisation.id - organisation where appointment took place
      - name: patient_id
        description: Foreign key to patient.id
      - name: person_id
        description: Foreign key to person.id - person-level identifier
      - name: practitioner_in_role_id
        description: Foreign key to practitioner_in_role.id - practitioner role for the appointment
      - name: schedule_id
        description: Foreign key to schedule.id - schedule slot used
      - name: start_date
        description: Start datetime of the appointment
      - name: planned_duration_mins
        description: Planned duration of the appointment in minutes
      - name: actual_duration_mins
        description: Actual duration of the appointment in minutes
      - name: status_source_concept_id
        description: Foreign key to concept.id - status of the appointment (booked, arrived, fulfilled, cancelled, etc.)
      - name: appointment_status_code
        description: Code value for the appointment status concept
      - name: appointment_status_display
        description: Display name for the appointment status concept
      - name: appointment_status_source_code
        description: Source code for the appointment status concept (from concept map)
      - name: appointment_status_source_display
        description: Source display name for the appointment status concept (from concept map)
      - name: patient_wait_mins
        description: Patient wait time in minutes
      - name: patient_delay_mins
        description: Patient delay time in minutes
      - name: datetime_booked
        description: Datetime when the appointment was booked
      - name: datetime_sent_in
        description: Datetime when the patient was sent in
      - name: datetime_left
        description: Datetime when the patient left
      - name: cancelled_date
        description: Date when the appointment was cancelled, if applicable
      - name: appointment_type
        description: Type of appointment
      - name: age_at_event
        description: Patient age in years at time of appointment
      - name: age_at_event_baby
        description: Patient age in months for babies (0-24 months)
      - name: age_at_event_neonate
        description: Patient age in days for neonates (0-28 days)
      - name: booking_method_source_concept_id
        description: Foreign key to concept.id - method used to book the appointment
      - name: booking_method_code
        description: Code value for the booking method concept
      - name: booking_method_display
        description: Display name for the booking method concept
      - name: booking_method_source_code
        description: Source code for the booking method concept (from concept map)
      - name: booking_method_source_display
        description: Source display name for the booking method concept (from concept map)
      - name: contact_mode_source_concept_id
        description: Foreign key to concept.id - mode of contact (face-to-face, telephone, video, etc.)
      - name: contact_mode_code
        description: Code value for the contact mode concept
      - name: contact_mode_display
        description: Display name for the contact mode concept
      - name: contact_mode_source_code
        description: Source code for the contact mode concept (from concept map)
      - name: contact_mode_source_display
        description: Source display name for the contact mode concept (from concept map)
      - name: is_blocked
        description: Boolean indicating if the appointment slot is blocked
      - name: national_slot_category_name
        description: National category name for the appointment slot
      - name: context_type
        description: Context appointment_type of the appointment
      - name: service_setting
        description: Service setting where the appointment takes place
      - name: national_slot_category_description
        description: National category description for the appointment slot
      - name: csds_care_contact_identifier
        description: CSDS care contact identifier
      - name: lds_id
        description: LDS system identifier
      - name: publisher_organisation_code
        description: "ODS code of the publisher organisation (post-2026 OLIDS rename — was record_owner_organisation_code)"
      - name: lds_datetime_first_acquired
        description: Datetime when data was acquired by LDS
      - name: lds_start_datetime
        description: LDS datetime stamp from which the record version was correct - used for deduplication to get the latest record
      - name: lds_is_deleted
        description: Deletion flag - records with TRUE are filtered out in this staging layer
      - name: lds_source_record_id
        description: LDS assigned unique identifier for the source record version
      - name: publisher_organisation_id
        description: "Foreign key to organisation.id — the publisher (data-producer) organisation for this appointment record. New in the 2026 OLIDS schema realignment (issue #747)."
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
