models:
  - name: stg_olids_patient_person
    description: >
      OLIDS patient-to-person links, one row per patient_id and person_uuid
      pair, including links flagged as deleted in lds_is_deleted. Rows with a
      null patient_id, person_uuid or person_id are excluded. The source id
      column is retained but is not the key.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: patient_id
        description: Foreign key to patient.id. Part of the natural primary key.
        data_tests:
          - not_null
      - name: person_uuid
        description: Person UUID — part of the natural primary key, distinct from person_id.
        data_tests:
          - not_null
      - name: person_id
        description: Foreign key to person.id.
        data_tests:
          - not_null
      - name: lds_source_record_id
        description: LDS assigned unique identifier for the source record version
      - name: lds_is_deleted
        description: Deletion flag from LDS
      - name: lds_source_record_id_person
        description: "LDS source-record identifier for the linked person (post-2026 OLIDS rename — was lds_record_id_person)"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - patient_id
              - person_uuid
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1