models:
  - name: stg_olids_enriched_concept_map
    description: |
      Enriched view of concept_map: deduplicated and back-filled by the
      upstream ENRICHED_CONCEPT_MAP feed so consumers don't have to handle
      the known duplicate-row and missing-concept issues in raw concept_map
      directly. This is the preferred join target for downstream models that
      need code mappings.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: source_concept_id
        description: Foreign key to concept.concept_id - source concept being mapped from
      - name: target_concept_id
        description: Foreign key to concept.concept_id - target concept being mapped to
      - name: source_code
        description: Source concept code
      - name: source_display
        description: Source concept display name
      - name: source_system
        description: Source concept system
      - name: target_code
        description: Target concept code
      - name: target_display
        description: Target concept display name
      - name: target_system
        description: Target concept system
      - name: is_primary
        description: Boolean indicating if this is the primary mapping for the source concept
      - name: equivalence
        description: Mapping equivalence type (equivalent, equal, wider, subsumes, narrower, specializes, inexact, unmatched, disjoint)
      - name: equivalence_rank
        description: Source-supplied equivalence rank for the concept mapping
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
