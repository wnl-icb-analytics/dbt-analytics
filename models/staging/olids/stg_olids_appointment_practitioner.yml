models:
  - name: stg_olids_appointment_practitioner
    description: Junction table linking appointments to practitioners. Excludes deleted records. One row per source record; no deduplication by id is applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: id
        description: Primary key - unique identifier for this appointment-practitioner link
        tests:
          - not_null
      - name: appointment_id
        description: Foreign key to appointment.id
      - name: practitioner_id
        description: Foreign key to practitioner.id
      - name: publisher_organisation_code
        description: "ODS code of the publisher organisation (post-2026 OLIDS rename — was record_owner_organisation_code)"
      - name: lds_transform_datetime
        description: Datetime the record was transformed by the LDS
      - name: lds_is_deleted
        description: Deletion flag - records with TRUE are filtered out in this staging layer
      - name: lds_source_record_id
        description: LDS assigned unique identifier for the source record version
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1