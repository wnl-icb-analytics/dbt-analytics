models:
  - name: stg_olids_schedule_practitioner
    description: Junction table linking schedules to practitioners. Excludes records flagged as deleted at source; no deduplication by id is applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: id
        description: Primary key - unique identifier for this schedule-practitioner link
        tests:
          - unique
          - not_null
      - name: schedule_id
        description: Foreign key to schedule.id
      - name: practitioner_id
        description: Foreign key to practitioner.id
      - name: publisher_organisation_code
        description: "ODS code of the publisher organisation (post-2026 OLIDS rename — was record_owner_organisation_code)"
      - name: lds_transform_datetime
        description: Datetime the record was last transformed by LDS
      - name: lds_is_deleted
        description: Deletion flag - records with TRUE are filtered out in this staging layer
      - name: lds_source_record_id
        description: LDS assigned unique identifier for the source record version
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1