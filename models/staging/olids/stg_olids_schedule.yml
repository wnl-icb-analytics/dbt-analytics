models:
  - name: stg_olids_schedule
    description: Practitioner schedules and availability for appointments. Deduplicated by id and filtered to exclude deleted records.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: id
        description: Primary key - unique identifier for this schedule
        tests:
          - unique
          - not_null
      - name: location_id
        description: Foreign key to location.id - location where schedule applies
      - name: location_name
        description: 'Name / text label for the location (post-2026 OLIDS rename — was the column named `location` at source)'
      - name: practitioner_id
        description: Foreign key to practitioner.id - practitioner whose schedule this is
      - name: start_date
        description: Start datetime of the schedule
      - name: end_date
        description: End datetime of the schedule
      - name: type
        description: Type of schedule
      - name: name
        description: Name or description of the schedule
      - name: is_private
        description: Boolean indicating if this is a private schedule
      - name: publisher_organisation_code
        description: "ODS code of the publisher organisation (post-2026 OLIDS rename — was record_owner_organisation_code)"
      - name: lds_is_deleted
        description: Deletion flag - records with TRUE are filtered out in this staging layer
      - name: lds_source_record_id
        description: LDS assigned unique identifier for the source record version
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1