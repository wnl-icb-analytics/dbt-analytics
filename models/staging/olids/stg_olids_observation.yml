models:
  - name: stg_olids_observation
    description: One record from the expanded OLIDS observation feed, including native observations,
      allergy records and referral requests. Excludes records marked deleted and records without a
      person identifier. Does not deduplicate separate source entities into clinical occurrences.
      Source entities identify delivery tables; clinical meaning follows the recorded code.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: id
        description: Conformed observation identifier. Native observation IDs remain unchanged; allergy and referral
          request IDs include their source entity in the upstream UUID derivation. Use this field to join
          the expanded observation feed.
        tests:
          - not_null
      - name: source_entity
        description: Original OLIDS entity, observation, allergy_intolerance or referral_request.
      - name: source_record_id
        description: Original UUID within source_entity, including the unchanged native observation ID.
          Distinct from lds_source_record_id. Pair with source_entity when tracing an original record.
      - name: allergy_medication_name
        description: Medication name recorded on the source allergy record. Null for other entities or
          when absent; does not describe a prescription or medication order.
      - name: patient_id
        description: Foreign key to patient.id
      - name: person_id
        description: Foreign key to person.id - person-level identifier
      - name: encounter_id
        description: Foreign key to encounter.id - encounter when observation was made
      - name: practitioner_id
        description: Foreign key to practitioner.id - practitioner who made the observation
      - name: parent_observation_id
        description: Foreign key to observation.id - parent observation if this is a sub-observation
      - name: clinical_effective_date
        description: Date the observation was clinically effective
      - name: clinical_effective_date_precision_source_concept_id
        description: Foreign key to concept.id - precision of the clinical effective date
      - name: result_value
        description: Recorded numeric observation result. Null on allergy and referral request rows; no measurement is inferred.
      - name: result_units_source_concept_id
        description: Foreign key to concept.id - unit of measure for the result value
      - name: result_date
        description: Date the result was obtained
      - name: result_text
        description: Recorded observation result text. Allergy medication names are retained separately.
      - name: is_problem
        description: Source problem flag. Null on allergy and referral request rows, where this observation-specific flag is not supplied.
      - name: is_review
        description: Boolean indicating if this is a review record
      - name: problem_end_date
        description: Date the problem ended, if applicable
      - name: observation_source_concept_id
        description: Foreign key to concept.id - source concept for the observation type
      - name: source_code
        description: Source code for the observation concept
      - name: source_display
        description: Source display name for the observation concept
      - name: source_system
        description: Source system for the observation concept
      - name: target_system
        description: Target system for the mapped concept
      - name: age_at_event
        description: Patient age in years at time of observation
      - name: age_at_event_baby
        description: Patient age in months for babies (0-24 months)
      - name: age_at_event_neonate
        description: Patient age in days for neonates (0-28 days)
      - name: episodicity_source_concept_id
        description: Foreign key to concept.id - episodicity classification (first, new, review)
      - name: is_primary
        description: Boolean indicating if this is the primary observation
      - name: date_recorded
        description: Date the record was entered into the system
      - name: is_problem_deleted
        description: Boolean indicating if the associated problem has been deleted
      - name: is_confidential
        description: Source confidentiality flag. Null when unavailable, including referral requests; null does not mean false.
      - name: lds_is_deleted
        description: Deletion flag from LDS
      - name: publisher_organisation_code
        description: "ODS code of the publisher organisation (post-2026 OLIDS rename — was record_owner_organisation_code)"
      - name: mapped_concept_id
        description: Foreign key to concept.id - mapped standardized concept
      - name: mapped_concept_code
        description: Code of the mapped concept
      - name: mapped_concept_display
        description: Display text of the mapped concept
      - name: result_unit_code
        description: Code for the result unit
      - name: result_unit_display
        description: Display text for the result unit
      - name: lds_transform_datetime
        description: Transformation timestamp supplied by the original OLIDS entity.
      - name: lds_source_record_id
        description: LDS assigned unique identifier for the source record version
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
