models:
  - name: ptr_fct_mhsds_clinical_record
    description: >
      Partner copy of fct_mhsds_clinical_record, published to local authority partners.
      No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY row
      access policy on sk_patient_id, which partner_mapping links to a borough partner
      role when the patient is registered with a practice in, or resident in, that
      borough. Rows without an sk_patient_id, or whose patient has no in-area registered
      or residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR
      to match the policy; all other columns are as in fct_mhsds_clinical_record.
      Recorded clinical evidence across the accepted MHSDS history. Each row is a
      diagnosis, presenting complaint, assessment response or populated clinical
      component of a care activity. Different diagnosis codes and person IDs remain
      separate. Repeated fully identified diagnoses use their latest accepted version;
      undated diagnoses and referral/activity assessment responses remain separate
      source occurrences. Historical clustering responses use the latest version for
      each source assessment and concept. Labels and response-status fields distinguish
      recognised, missing and unmatched values. These rows are clinical items, not
      visits, completed questionnaires or clinically current conditions.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: source_record_id
        description: >
          Unique clinical-item key for cross-source drill-down to this fact. Equal to
          clinical_record_id; use originating_source_record_id for the original source
          occurrence.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
