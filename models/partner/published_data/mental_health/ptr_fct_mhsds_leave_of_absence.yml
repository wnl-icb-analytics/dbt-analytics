models:
  - name: ptr_fct_mhsds_leave_of_absence
    description: >
      Partner copy of fct_mhsds_leave_of_absence, published to local authority partners.
      No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY row
      access policy on sk_patient_id, which partner_mapping links to a borough partner
      role when the patient is registered with a practice in, or resident in, that
      borough. Rows without an sk_patient_id, or whose patient has no in-area registered
      or residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR
      to match the policy; all other columns are as in fct_mhsds_leave_of_absence.
      Recorded periods of leave of absence. Each row is one provider, ward stay and
      leave start date/time, using the latest accepted version. Records with incomplete
      identifying details remain separate. These are recorded leave periods, not a
      statement of current whereabouts. Different leave types are kept in separate
      tables and are not automatically deducted from inferred occupancy or bed-day
      counts.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.

      - name: leave_of_absence_id
        description: >
          Unique identifier at the documented model grain.
        data_tests:
          - unique
          - not_null

      - name: hospital_provider_spell_source_record_id
        description: >
          Submitted hospital provider spell source record id.

      - name: ward_stay_source_record_id
        description: >
          Submitted ward stay source record id.

      - name: leave_start_date
        description: >
          Submitted leave start date.

      - name: leave_end_date
        description: >
          Submitted leave end date.

      - name: leave_start_time
        description: >
          Submitted leave start time.

      - name: leave_end_time
        description: >
          Submitted leave end time.

      - name: leave_end_reason_code
        description: >
          Submitted leave end reason code.

      - name: escorted_leave_code
        description: >
          Submitted escorted leave code.

      - name: leave_end_reason_description
        description: >
          National label, including historical codes; null when no definition matches.

      - name: escorted_leave_description
        description: >
          National label, including historical codes; null when no definition matches.

      - name: n_accepted_source_records
        description: >
          Accepted submitted versions of this identity across all periods, including
          repeats.

      - name: is_identity_incomplete
        description: >
          A required identity component is missing; the source row is retained
          separately.

      - name: first_submission_period_end_date
        description: >
          First accepted reporting period containing this identity, not the clinical
          start date.

      - name: reporting_period_end_date
        description: >
          Period of the accepted source evidence; may be later than the clinical event.

      - name: source_file_received_at
        description: >
          Source file receipt timestamp, not a clinical time.
