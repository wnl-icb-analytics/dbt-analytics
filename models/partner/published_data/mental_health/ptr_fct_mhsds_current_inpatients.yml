models:
  - name: ptr_fct_mhsds_current_inpatients
    description: >
      Partner copy of fct_mhsds_current_inpatients, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_current_inpatients. Current inpatient evidence under the shared
      occupancy rules. Each row is one retained open interval, including intervals
      without a recorded person ID. Identified people have at most one retained open
      interval. Undischarged spells remain open only when last reported within two
      calendar months of the latest staged spell period; later admissions and overlaps
      can change the retained interval. This describes the available feed, not live ward
      occupancy. Evidence dates and duration calculation dates are separate. Currency
      classifications are available in fct_mhsds_currency_current_inpatients.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: occupancy_interval_id
        description: >
          Established spell number used by encounter and currency models; one retained
          occupancy interval.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
