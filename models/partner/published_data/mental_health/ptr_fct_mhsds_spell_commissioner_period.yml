models:
  - name: ptr_fct_mhsds_spell_commissioner_period
    description: >
      Partner copy of fct_mhsds_spell_commissioner_period, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_spell_commissioner_period. Commissioner responsibility recorded during a
      hospital admission. Each row is one provider, spell, commissioner and assignment
      start date. Multiple or overlapping assignments remain included; the table does
      not choose one commissioner for the whole admission. It uses the latest accepted
      version of each assignment and preserves separate source records when identifying
      details are incomplete.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: spell_commissioner_period_id
        description: >
          Unique identifier at the documented model grain.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
