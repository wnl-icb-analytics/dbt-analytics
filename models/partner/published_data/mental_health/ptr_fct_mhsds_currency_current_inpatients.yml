models:
  - name: ptr_fct_mhsds_currency_current_inpatients
    description: >
      Partner copy of fct_mhsds_currency_current_inpatients, published to local
      authority partners. No SQL filter: partner roles see only rows allowed by the
      PARTNER_POLICY row access policy on sk_patient_id, which partner_mapping links to
      a borough partner role when the patient is registered with a practice in, or
      resident in, that borough. Rows without an sk_patient_id, or whose patient has no
      in-area registered or residence borough, are visible to no partner. sk_patient_id
      is cast to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_currency_current_inpatients. Current inpatient evidence under the shared
      occupancy rules, with costing classifications. Each row is one retained open
      spell, including spells without a recorded person ID. Identified people have at
      most one retained open spell. Undischarged spells must be reported within two
      calendar months of the latest staged spell period. Overlaps and later admissions
      determine the retained spell. This reflects a delayed monthly feed, not live bed
      occupancy; last_submission_period_end_date shows the spell's evidence date. Days
      in bed accrue to the run date. Use fct_mhsds_current_inpatients for the general
      census without currency classifications.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: uniq_hosp_prov_spell_num
        description: >
          Hospital provider spell identifier.
        data_tests:
          - unique
          - not_null

      - name: uniq_serv_req_id
        description: >
          Unique service request identifier.

      - name: person_id
        description: >
          Recorded MHSDS person. Null when unidentified; uniq_hosp_prov_spell_num still
          identifies the spell.

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.

      - name: provider_organisation_code
        description: >
          Provider organisation code.

      - name: provider_organisation_name
        description: >
          Provider organisation name.

      - name: source_derived_icb_commissioner_code
        description: >
          ICB commissioner code derived in the source feed.

      - name: source_derived_icb_commissioner_name
        description: >
          Current organisation name for the source-derived ICB commissioner code.

      - name: commissioner_icb_code
        description: >
          Commissioner ICB code resolved for currency reporting.

      - name: commissioner_icb_name
        description: >
          Current organisation name for the currency commissioner code.

      - name: is_wnl_commissioner
        description: >
          TRUE for a recognised current or predecessor WNL commissioner; otherwise
          FALSE.

      - name: hospital_provider_spell_start_date
        description: >
          Hospital provider spell start date.

      - name: days_in_bed
        description: >
          Days from admission to the run date.

      - name: months_in_bed
        description: >
          Whole calendar months from admission to the run date.

      - name: last_submission_period_end_date
        description: >
          End of the last active reporting period carrying the spell; the active feed
          runs about 6 weeks behind the run date.

      - name: age_at_admission
        description: >
          MHSDS-derived age at admission.

      - name: is_cyp
        description: >
          Whether age at admission is under 18. A spell with no recorded age is
          classified as adult, so read this with has_known_age_at_admission.

      - name: has_known_age_at_admission
        description: >
          Whether an age at admission was recorded. False identifies the spells
          classified as adult through the fallback rather than a known age. Most
          accepted spells carry no recorded age.

      - name: mental_health_admitted_patient_classification_type_code
        description: >
          Latest ward-stay mental health admitted patient classification type code.

      - name: mental_health_admitted_patient_classification_type_description
        description: >
          Published description for the admitted patient classification type.

      - name: setting_code
        description: >
          Inpatient setting suffix.

      - name: setting_name
        description: >
          Inpatient setting name.

      - name: icd10_3
        description: >
          Latest three-character ICD-10 code.

      - name: icd10_3_description
        description: >
          Published description for the ICD-10 code.

      - name: diagnosis_category
        description: >
          Diagnosis population category.

      - name: winning_tier
        description: >
          Classification tier that resolved the currency group.

      - name: currency_group
        description: >
          Currency population group.

      - name: currency_code
        description: >
          Inpatient currency code.
