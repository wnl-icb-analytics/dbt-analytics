models:
  - name: ptr_fct_mhsds_currency_current_inpatients
    description: >
      Partner copy of fct_mhsds_currency_current_inpatients, published to local
      authority partners. No SQL filter: partner roles see only rows allowed by the
      PARTNER_POLICY row access policy on sk_patient_id, which partner_mapping links to
      a borough partner role when the patient is registered with a practice in, or
      resident in, that borough. Rows without an sk_patient_id, or whose patient has no
      in-area registered or residence borough, are visible to no partner. sk_patient_id
      is cast to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_currency_current_inpatients. Current inpatient evidence under the shared
      occupancy rules, with costing classifications. Each row is one retained open
      spell, including spells without a recorded person ID. Identified people have at
      most one retained open spell. Undischarged spells must be reported within two
      calendar months of the latest staged spell period. Overlaps and later admissions
      determine the retained spell. This reflects a delayed monthly feed, not live bed
      occupancy; last_submission_period_end_date shows the spell's evidence date. Days
      in bed accrue to the run date. Use fct_mhsds_current_inpatients for the general
      census without currency classifications.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: uniq_hosp_prov_spell_num
        description: >
          Hospital provider spell identifier.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
