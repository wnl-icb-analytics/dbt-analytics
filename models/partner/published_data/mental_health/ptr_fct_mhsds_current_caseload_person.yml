models:
  - name: ptr_fct_mhsds_current_caseload_person
    description: >
      Partner copy of fct_mhsds_current_caseload_person, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_current_caseload_person. People with at least one recorded open referral
      in the dataset's latest accepted month. Each row is one identifiable person and
      provider, with counts of open referrals and those without recorded attendance.
      Includes waiting, community and inpatient referrals. Count distinct person_id
      across providers because a person can appear at several providers. Open referrals
      without a person ID remain in fct_mhsds_current_caseload_referral. The table
      describes recorded caseload, not confirmed active treatment. Eddie Davison owns
      the definition.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.

      - name: caseload_person_provider_id
        description: >
          Person and provider key.
        data_tests:
          - unique
          - not_null

      - name: evidence_date
        description: >
          Dataset latest accepted reporting month. Providers without evidence in this
          month are excluded, not assumed to have discharged patients.

      - name: n_open_referrals
        description: >
          Open referrals for this person/provider at the evidence date.

      - name: days_since_last_attended_contact
        description: >
          Days since last attended contact on any currently open referral; null when
          none is evidenced.
