models:
  - name: ptr_fct_mhsds_currency_referral_summary
    description: >
      Partner copy of fct_mhsds_currency_referral_summary, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_currency_referral_summary. Referral care measures with the 2026/27 NHS
      England costing classifications. Each row is one recorded referral. General care
      and access measures come from fct_mhsds_referral_summary; this table adds currency
      service, setting and population groups. The service type chosen for costing can
      differ from the recorded primary or additional teams.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: source_record_id
        description: >
          Referral key shared with the general referral summary.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
