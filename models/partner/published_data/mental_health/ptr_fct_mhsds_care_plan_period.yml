models:
  - name: ptr_fct_mhsds_care_plan_period
    description: >
      Partner copy of fct_mhsds_care_plan_period, published to local authority partners.
      No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY row
      access policy on sk_patient_id, which partner_mapping links to a borough partner
      role when the patient is registered with a practice in, or resident in, that
      borough. Rows without an sk_patient_id, or whose patient has no in-area registered
      or residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR
      to match the policy; all other columns are as in fct_mhsds_care_plan_period. Care
      plans reported by providers in each accepted period. Each row is one MHS008 plan
      record in a reporting period. Creation, revision and implementation dates are kept
      separate. A plan record does not by itself confirm implementation or patient
      agreement; agreements are available in fct_mhsds_care_plan_agreement.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: care_plan_period_id
        description: >
          Unique identifier at the documented model grain.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
