models:
  - name: ptr_fct_mhsds_restrictive_intervention_type
    description: >
      Partner copy of fct_mhsds_restrictive_intervention_type, published to local
      authority partners. No SQL filter: partner roles see only rows allowed by the
      PARTNER_POLICY row access policy on sk_patient_id, which partner_mapping links to
      a borough partner role when the patient is registered with a practice in, or
      resident in, that borough. Rows without an sk_patient_id, or whose patient has no
      in-area registered or residence borough, are visible to no partner. sk_patient_id
      is cast to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_restrictive_intervention_type. Types of restrictive intervention
      recorded during incidents. Each row is one provider-qualified intervention
      occurrence using its latest accepted version. Several occurrences can belong to
      the same incident. Injury fields describe submitted evidence; a missing value does
      not mean there was no injury. Records with incomplete identifying details remain
      separate. Count incidents from the incident table, not from this table.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: restrictive_intervention_type_id
        description: >
          Unique identifier at the documented model grain.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
