models:
  - name: ptr_fct_mhsds_discharge_readiness_period
    description: >
      Partner copy of fct_mhsds_discharge_readiness_period, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_discharge_readiness_period. Periods when a patient was recorded as
      clinically ready for discharge, with the reported reason for delay. Each row is
      one provider, hospital spell, readiness start date and delay reason. A changed
      reason can start another period. The end date can mean the patient stopped being
      ready without being discharged. Duration is the difference between recorded dates,
      not a count of delayed occupied bed days. The latest accepted version is used;
      records with incomplete identifying details remain separate.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.

      - name: discharge_readiness_period_id
        description: >
          Unique identifier at the documented model grain.
        data_tests:
          - unique
          - not_null

      - name: hospital_provider_spell_source_record_id
        description: >
          Submitted hospital provider spell source record id.

      - name: referral_source_record_id
        description: >
          Submitted referral source record id.

      - name: readiness_start_date
        description: >
          Submitted readiness start date.

      - name: readiness_end_date
        description: >
          Submitted readiness end date.

      - name: delay_reason_code
        description: >
          Submitted delay reason code.

      - name: delay_attribution_code
        description: >
          Submitted delay attribution code.

      - name: responsible_organisation_code
        description: >
          Submitted responsible organisation code.

      - name: delay_reason_description
        description: >
          National label, including historical codes; null when no definition matches.

      - name: delay_attribution_description
        description: >
          National label, including historical codes; null when no definition matches.

      - name: n_accepted_source_records
        description: >
          Accepted submitted versions of this identity across all periods, including
          repeats.

      - name: is_identity_incomplete
        description: >
          A required identity component is missing; the source row is retained
          separately.

      - name: first_submission_period_end_date
        description: >
          First accepted reporting period containing this identity, not the clinical
          start date.

      - name: reporting_period_end_date
        description: >
          Period of the accepted source evidence; may be later than the clinical event.

      - name: source_file_received_at
        description: >
          Source file receipt timestamp, not a clinical time.
