models:
  - name: ptr_fct_mhsds_discharge_readiness_period
    description: >
      Partner copy of fct_mhsds_discharge_readiness_period, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_discharge_readiness_period. Periods when a patient was recorded as
      clinically ready for discharge, with the reported reason for delay. Each row is
      one provider, hospital spell, readiness start date and delay reason. A changed
      reason can start another period. The end date can mean the patient stopped being
      ready without being discharged. Duration is the difference between recorded dates,
      not a count of delayed occupied bed days. The latest accepted version is used;
      records with incomplete identifying details remain separate.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: discharge_readiness_period_id
        description: >
          Unique identifier at the documented model grain.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
