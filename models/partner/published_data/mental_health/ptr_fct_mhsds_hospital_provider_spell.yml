models:
  - name: ptr_fct_mhsds_hospital_provider_spell
    description: >
      Partner copy of fct_mhsds_hospital_provider_spell, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_hospital_provider_spell. Admissions and discharges as recorded by
      providers. Each row is the latest submitted version of one provider-qualified
      hospital spell. A missing discharge date means no discharge was recorded; it does
      not prove current occupancy. This table retains recorded spells before overlap
      removal or inferred closure, and does not apply currency or costing rules. If a
      provider reuses a spell identifier, the earlier record is treated as a version of
      that spell rather than a separate admission.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: source_record_id
        description: >
          Stable spell join key; the MHSDS provider-qualified hospital provider spell
          identifier.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
