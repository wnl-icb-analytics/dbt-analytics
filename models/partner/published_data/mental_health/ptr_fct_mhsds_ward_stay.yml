models:
  - name: ptr_fct_mhsds_ward_stay
    description: >
      Partner copy of fct_mhsds_ward_stay, published to local authority partners. No SQL
      filter: partner roles see only rows allowed by the PARTNER_POLICY row access
      policy on sk_patient_id, which partner_mapping links to a borough partner role
      when the patient is registered with a practice in, or resident in, that borough.
      Rows without an sk_patient_id, or whose patient has no in-area registered or
      residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR to
      match the policy; all other columns are as in fct_mhsds_ward_stay. Recorded stays
      on individual wards. Each row is the latest accepted version of one MHSDS ward-
      stay identifier, with ward movement and classification details. Ward capacity is
      held separately in fct_mhsds_ward_capacity_period. This table does not infer
      inpatient occupancy. If the source reuses a ward-stay identifier, the earlier
      record is treated as a version rather than a separate stay.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: source_record_id
        description: >
          Stable ward-stay join key; the MHSDS provider-qualified unique ward-stay
          identifier.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
