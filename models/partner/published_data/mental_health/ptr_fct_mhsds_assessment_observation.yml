models:
  - name: ptr_fct_mhsds_assessment_observation
    description: >
      Partner copy of fct_mhsds_assessment_observation, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_assessment_observation. Responses and scores recorded in referral,
      activity and historical clustering assessments. Each row is an accepted MHS606 or
      MHS607 response occurrence, or the latest MHS802 response for a provider, source
      assessment and concept. Repeated monthly clustering submissions are treated as
      versions, with their source counts retained. Missing links and unknown responses
      remain visible. A row can be one question or dimension rather than a whole
      questionnaire. Use the instance and score-change tables for response groups and
      comparisons over time.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.

      - name: assessment_observation_id
        description: >
          Unique clinical-item key of the accepted assessment occurrence.
        data_tests:
          - unique
          - not_null

      - name: assessment_context
        description: >
          referral_assessment, activity_assessment or historical clustering_assessment.

      - name: assessment_concept_code
        description: >
          Submitted SNOMED assessment observable or tool code.

      - name: assessment_concept_description
        description: >
          Authoritative label where available.

      - name: assessment_recorded_at
        description: >
          Referral completion, supported activity time, or the same-submission
          clustering parent completion. Null when no supported clinical time exists.

      - name: submitted_response
        description: >
          Unmodified source response text.

      - name: assessment_score_numeric
        description: >
          Numeric score only for a recognised enumerated or in-range response. Null for
          non-score, unmatched or missing responses.

      - name: assessment_response_status
        description: >
          Existing response interpretation, including known_non_score,
          enumerated_response, within_published_range and unmatched states.

      - name: assessor_id
        description: >
          Source-derived assessor identifier where supplied. No inference from activity
          staff links.

      - name: submission_id
        description: >
          Accepted submission containing this observation.

      - name: source_assessment_id
        description: >
          Historical clustering assessment identifier; null when the source does not
          supply an instance identifier.

      - name: is_assessment_parent_linked
        description: >
          Historical MHS802 has a same-submission MHS801 parent; null for other
          contexts.

      - name: is_assessment_parent_person_consistent
        description: >
          Historical response and same-submission parent person identifiers agree; null
          when not comparable.

      - name: has_person_identifier_changed
        description: >
          Historical response versions include more than one non-null national person
          identifier. These observations are excluded from descriptive score pairing.

      - name: accepted_source_record_count
        description: >
          Number of accepted source rows represented by this observation. Historical
          clustering can represent repeated monthly versions.
