models:
  - name: ptr_fct_mhsds_assessment_observation
    description: >
      Partner copy of fct_mhsds_assessment_observation, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_assessment_observation. Responses and scores recorded in referral,
      activity and historical clustering assessments. Each row is an accepted MHS606 or
      MHS607 response occurrence, or the latest MHS802 response for a provider, source
      assessment and concept. Repeated monthly clustering submissions are treated as
      versions, with their source counts retained. Missing links and unknown responses
      remain visible. A row can be one question or dimension rather than a whole
      questionnaire. Use the instance and score-change tables for response groups and
      comparisons over time.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: assessment_observation_id
        description: >
          Unique clinical-item key of the accepted assessment occurrence.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
