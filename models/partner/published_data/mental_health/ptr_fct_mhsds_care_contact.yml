models:
  - name: ptr_fct_mhsds_care_contact
    description: >
      Partner copy of fct_mhsds_care_contact, published to local authority partners. No
      SQL filter: partner roles see only rows allowed by the PARTNER_POLICY row access
      policy on sk_patient_id, which partner_mapping links to a borough partner role
      when the patient is registered with a practice in, or resident in, that borough.
      Rows without an sk_patient_id, or whose patient has no in-area registered or
      residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR to
      match the policy; all other columns are as in fct_mhsds_care_contact. Recorded
      patient contacts, including attended appointments, non-attendance and
      cancellations. Each row is one referral/contact pair using its latest accepted
      version. Cancelled contacts retain their scheduled date; pre-1901 missing-date
      markers are null. Contacts remain when their referral is absent. Team details come
      from the contact's submission: an explicit contact team takes precedence, with the
      primary referral team used for version 6 records without one. Later changes to a
      referral's person ID do not reassign the contact.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: source_record_id
        description: >
          Stable key generated from the service request and care contact identifiers.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
