models:
  - name: ptr_fct_mhsds_social_circumstance_observation
    description: >
      Partner copy of fct_mhsds_social_circumstance_observation, published to local
      authority partners. No SQL filter: partner roles see only rows allowed by the
      PARTNER_POLICY row access policy on sk_patient_id, which partner_mapping links to
      a borough partner role when the patient is registered with a practice in, or
      resident in, that borough. Rows without an sk_patient_id, or whose patient has no
      in-area registered or residence borough, are visible to no partner. sk_patient_id
      is cast to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_social_circumstance_observation. Social and personal circumstances
      recorded for patients. Each row is one accepted MHS011 observation, with a
      description where the SNOMED code has a matching reference. Repeated submissions
      remain separate. The recorded date describes the observation; it does not
      establish the whole period during which the circumstance applied.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: social_circumstance_observation_id
        description: >
          Unique identifier at the documented model grain.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
