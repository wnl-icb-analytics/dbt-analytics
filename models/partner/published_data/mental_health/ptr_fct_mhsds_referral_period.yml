models:
  - name: ptr_fct_mhsds_referral_period
    description: >
      Partner copy of fct_mhsds_referral_period, published to local authority partners.
      No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY row
      access policy on sk_patient_id, which partner_mapping links to a borough partner
      role when the patient is registered with a practice in, or resident in, that
      borough. Rows without an sk_patient_id, or whose patient has no in-area registered
      or residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR
      to match the policy; all other columns are as in fct_mhsds_referral_period.
      Referral state in each accepted submission. Each row is one referral and
      submission. A referral is open at period end if it was received by that date and
      has no rejection or discharge by that date. Attendance uses records whose contact
      date and reporting period are both no later than the selected period end. Later
      accepted corrections can revise historical results. An open referral with no
      attendance provides evidence of waiting, but does not establish eligibility for a
      national waiting list or target. Attendance follows the same referral ID when
      national person IDs change, with differences flagged.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: referral_period_id
        description: >
          Key for the referral and accepted submission.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
