models:
  - name: ptr_fct_mhsds_person_summary
    description: >
      Partner copy of fct_mhsds_person_summary, published to local authority partners.
      No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY row
      access policy on sk_patient_id, which partner_mapping links to a borough partner
      role when the patient is registered with a practice in, or resident in, that
      borough. Rows without an sk_patient_id, or whose patient has no in-area registered
      or residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR
      to match the policy; all other columns are as in fct_mhsds_person_summary. Summary
      of the MHSDS evidence available for each identifiable person. Each row is one
      MHSDS person ID, including people recorded only in clinical, legal-status or other
      modelled evidence. Use it to select cohorts and compare recorded referrals,
      contacts, diagnoses, current caseload and inpatient evidence. The as_of_date is
      the latest accepted dataset period; individual providers can be older. Recent-
      contact measures exclude dates after that date. Diagnosis counts count records,
      not clinically current conditions. No qualifying evidence gives zero or false;
      missing clinical values and patient indicators remain null. National ID changes
      can split one person's history across rows.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: person_id
        description: >
          Non-null MHSDS person identifier from any documented evidence family. National
          matching changes can assign different IDs to the same individual over time.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
