models:
  - name: ptr_fct_mhsds_accommodation_observation
    description: >
      Partner copy of fct_mhsds_accommodation_observation, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_accommodation_observation. Accommodation circumstances reported for
      patients. Each row is one accepted MHS003 record in a provider reporting period.
      Repeated reports remain present and do not represent new accommodation episodes.
      Older accommodation status and newer accommodation type are separate fields. Where
      the type field contains an older status code, the historical label is supplied and
      the label basis identifies that choice; no modern category is inferred. Unknown or
      unmatched values do not mean unsettled accommodation.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: accommodation_observation_id
        description: >
          Unique identifier at the documented model grain.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
