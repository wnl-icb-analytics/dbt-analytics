models:
  - name: ptr_fct_mhsds_accommodation_observation
    description: >
      Partner copy of fct_mhsds_accommodation_observation, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_accommodation_observation. Accommodation circumstances reported for
      patients. Each row is one accepted MHS003 record in a provider reporting period.
      Repeated reports remain present and do not represent new accommodation episodes.
      Older accommodation status and newer accommodation type are separate fields. Where
      the type field contains an older status code, the historical label is supplied and
      the label basis identifies that choice; no modern category is inferred. Unknown or
      unmatched values do not mean unsettled accommodation.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.

      - name: accommodation_observation_id
        description: >
          Unique identifier at the documented model grain.
        data_tests:
          - unique
          - not_null

      - name: legacy_accommodation_status_code
        description: >
          Submitted legacy accommodation status code.

      - name: accommodation_type_code
        description: >
          Submitted accommodation type code.

      - name: settled_accommodation_code
        description: >
          Submitted settled accommodation code.

      - name: legacy_status_recorded_date
        description: >
          Submitted legacy status recorded date.

      - name: type_recorded_date
        description: >
          Submitted type recorded date.

      - name: accommodation_start_date
        description: >
          Submitted accommodation start date.

      - name: accommodation_end_date
        description: >
          Submitted accommodation end date.

      - name: legacy_accommodation_status_description
        description: >
          National label, including historical codes; null when no definition matches.

      - name: accommodation_type_description
        description: >
          National label, including historical codes; null when no definition matches.

      - name: settled_accommodation_description
        description: >
          National label, including historical codes; null when no definition matches.

      - name: reporting_period_end_date
        description: >
          Period of the accepted source evidence; may be later than the clinical event.

      - name: source_file_received_at
        description: >
          Source file receipt timestamp, not a clinical time.

      - name: accommodation_type_label_basis
        description: >
          accommodation_type for a current type-list match, legacy_accommodation_status
          for an exact historical-list match, or code_missing/code_unmatched. A
          historical label does not assert validity for the submitted version.
