models:
  - name: ptr_fct_mhsds_referral_to_treatment_period
    description: >
      Partner copy of fct_mhsds_referral_to_treatment_period, published to local
      authority partners. No SQL filter: partner roles see only rows allowed by the
      PARTNER_POLICY row access policy on sk_patient_id, which partner_mapping links to
      a borough partner role when the patient is registered with a practice in, or
      resident in, that borough. Rows without an sk_patient_id, or whose patient has no
      in-area registered or residence borough, are visible to no partner. sk_patient_id
      is cast to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_referral_to_treatment_period. Referral-to-treatment clocks reported by
      providers. Each row is one accepted MHS104 record in a reporting period, with the
      clock's dates, measurement type and status. A submitted clock is different from
      the interval between referral and first recorded contact. Repeated period records
      remain present, so counts of populated start and end dates are counts of submitted
      evidence, not distinct clocks starting or ending. The specification allows earlier
      starts but expects submitted end dates within the reporting month. A missing end
      date does not prove the person is still waiting. Check date and status
      completeness by provider and period. The table does not decide national waiting-
      list eligibility or target compliance.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: referral_to_treatment_period_id
        description: >
          Unique identifier at the documented model grain.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
