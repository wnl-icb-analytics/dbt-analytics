models:
  - name: ptr_fct_mhsds_current_caseload_referral
    description: >
      Partner copy of fct_mhsds_current_caseload_referral, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_current_caseload_referral. Open referrals recorded in the dataset's
      latest accepted month. Each row is one referral, including referrals awaiting
      first attendance and those receiving community or inpatient care. Providers whose
      latest submission is older are excluded here; their evidence remains in
      fct_mhsds_latest_provider_caseload_referral. Exclusion does not mean discharge.
      This is a monthly view of recorded open referrals, not a live list or a clinical
      judgement of active treatment. Eddie Davison owns the recorded-state definition.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: referral_period_id
        description: >
          Unique open referral-period key.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
