models:
  - name: ptr_fct_mhsds_restrictive_intervention_incident
    description: >
      Partner copy of fct_mhsds_restrictive_intervention_incident, published to local
      authority partners. No SQL filter: partner roles see only rows allowed by the
      PARTNER_POLICY row access policy on sk_patient_id, which partner_mapping links to
      a borough partner role when the patient is registered with a practice in, or
      resident in, that borough. Rows without an sk_patient_id, or whose patient has no
      in-area registered or residence borough, are visible to no partner. sk_patient_id
      is cast to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_restrictive_intervention_incident. Recorded incidents involving
      restrictive interventions. Each row is one incident identified within its
      provider, using its latest accepted version. An incident can have several
      intervention types in fct_mhsds_restrictive_intervention_type, so count incidents
      before joining those details. The table uses the version 6 MHS505 incident source
      and does not combine the retired intervention source. Records with incomplete
      identifying details remain separate.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: restrictive_intervention_incident_id
        description: >
          Unique identifier at the documented model grain.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
