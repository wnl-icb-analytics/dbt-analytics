models:
  - name: ptr_fct_mhsds_diagnosis
    description: >
      Partner copy of fct_mhsds_diagnosis, published to local authority partners. No SQL
      filter: partner roles see only rows allowed by the PARTNER_POLICY row access
      policy on sk_patient_id, which partner_mapping links to a borough partner role
      when the patient is registered with a practice in, or resident in, that borough.
      Rows without an sk_patient_id, or whose patient has no in-area registered or
      residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR to
      match the policy; all other columns are as in fct_mhsds_diagnosis. Previous,
      provisional, primary and secondary diagnoses recorded in MHSDS. Each row is one
      retained diagnosis evidence item from the shared clinical-record table. Includes
      records with missing dates, descriptions, person details or other links. Repeated
      versions of the same fully identified item are reduced to the latest accepted
      version; different codes and people remain separate. Use this table to describe
      recorded diagnosis evidence, not to decide which diagnosis is clinically current.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.

      - name: diagnosis_record_id
        description: >
          Unique clinical-item key for the retained diagnosis evidence.
        data_tests:
          - unique
          - not_null

      - name: diagnosis_role
        description: >
          previous_diagnosis, provisional_diagnosis, primary_diagnosis or
          secondary_diagnosis.

      - name: diagnosis_code
        description: >
          Submitted clinical code, interpreted using the accompanying coding scheme.

      - name: diagnosis_description
        description: >
          Authoritative clinical label where available; null for missing or unmatched
          evidence.

      - name: diagnosis_recorded_at
        description: >
          Recorded diagnosis time, or previous-diagnosis discussion time for MHS601.
          Read clinical_time_basis and precision; null for undated evidence.

      - name: coding_scheme_description
        description: >
          Authoritative description of the source coding scheme.

      - name: person_id
        description: >
          Person recorded on the diagnosis, never replaced by the referral person.

      - name: accepted_source_record_count
        description: >
          Number of accepted submitted occurrences represented by this retained clinical
          item.
