models:
  - name: ptr_fct_mhsds_currency_bed_days
    description: >
      Partner copy of fct_mhsds_currency_bed_days, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_currency_bed_days. Costing classifications and proxy costs for inpatient
      bed days. Each row is one classified hospital spell and fiscal year. Spells
      crossing fiscal years are split, with each night allocated to the year in which it
      starts. These are currency-based estimates, not actual provider expenditure.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: uniq_hosp_prov_spell_num
        description: >
          Hospital provider spell identifier.

      - name: fiscal_year_start
        description: >
          Fiscal year start.

      - name: uniq_serv_req_id
        description: >
          Unique service request identifier.

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.

      - name: person_id
        description: >
          MHSDS person identifier.

      - name: provider_organisation_code
        description: >
          Provider organisation code.

      - name: provider_organisation_name
        description: >
          Current organisation name for the provider code.

      - name: source_derived_icb_commissioner_code
        description: >
          ICB commissioner code derived in the source feed.

      - name: source_derived_icb_commissioner_name
        description: >
          Current organisation name for the derived ICB commissioner code.

      - name: commissioner_icb_code
        description: >
          Commissioner ICB code resolved for currency reporting.

      - name: commissioner_icb_name
        description: >
          Current organisation name for the currency commissioner code.

      - name: is_wnl_commissioner
        description: >
          TRUE for a recognised current or predecessor WNL commissioner; otherwise
          FALSE.

      - name: currency_group
        description: >
          Currency population group.

      - name: currency_code
        description: >
          NHSE inpatient currency code.

      - name: pricing_currency_code
        description: >
          Code used to resolve a bed-day price. MAZ99 spells use the matching MBU98
          setting because MAZ99 has no published bed-day price.

      - name: hospital_provider_spell_start_date
        description: >
          Hospital provider spell start date.

      - name: hospital_provider_spell_end_date
        description: >
          Derived hospital provider spell end date; null while open.

      - name: bed_days_from_date
        description: >
          First night counted in this row's bed_days.

      - name: bed_days_to_date
        description: >
          Day after the last night counted in this row's bed_days (exclusive, so
          bed_days = bed_days_to_date - bed_days_from_date).

      - name: bed_days
        description: >
          Bed days allocated to the fiscal year.

      - name: unit_price_2627_gbp
        description: >
          Resolved 2026/27 price in GBP.

      - name: price_source
        description: >
          Price fallback that supplied the bed-day price.

      - name: mff_factor
        description: >
          Provider Market Forces Factor.

      - name: gdp_deflator_ratio_applied
        description: >
          Activity-year GDP deflator divided by the 2026/27 deflator.

      - name: proxy_cost
        description: >
          Price multiplied by bed days, MFF, and GDP deflator ratio.

      - name: hospital_provider_spell_end_date_source
        description: >
          Source of the hospital provider spell end date.

      - name: is_cyp
        description: >
          Whether age at admission is under 18.

      - name: winning_tier
        description: >
          Classification tier that ended the cascade.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - uniq_hosp_prov_spell_num
              - fiscal_year_start
