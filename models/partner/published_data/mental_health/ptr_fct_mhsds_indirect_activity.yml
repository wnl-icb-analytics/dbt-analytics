models:
  - name: ptr_fct_mhsds_indirect_activity
    description: >
      Partner copy of fct_mhsds_indirect_activity, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_indirect_activity. Care carried out for a patient without the patient
      being present. Each row is one accepted MHS204 record, with submitted duration,
      procedures, findings, professional and referral/team details from the same
      submission. Records from repeated reporting periods remain separate, so totals
      count submitted occurrences rather than proven distinct events across all time.
      Eddie Davison owns the definition.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: indirect_activity_id
        description: >
          Accepted MHS204 source occurrence identifier. Repeated monthly evidence is
          retained because no stable cross-submission activity identifier is supplied.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
