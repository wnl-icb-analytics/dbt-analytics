models:
  - name: ptr_fct_mhsds_community_treatment_order
    description: >
      Partner copy of fct_mhsds_community_treatment_order, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_community_treatment_order. Recorded community treatment orders (CTOs). A
      CTO under section 17A of the Mental Health Act allows an eligible detained patient
      to leave hospital for treatment in the community under conditions, with a power of
      recall. Each row is one provider, legal-status period and order start date, using
      the latest accepted version. Renewals update expiry rather than create a new
      order. Recalls are recorded separately. An order is not an ordinary community
      referral or proof of continuous inpatient detention. A missing end date or future
      expiry alone does not establish current legal status. Incomplete identifying
      details retain separate source records.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: community_treatment_order_id
        description: >
          Unique identifier at the documented model grain.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
