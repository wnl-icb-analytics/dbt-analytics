models:
  - name: ptr_fct_mhsds_community_treatment_order_recall
    description: >
      Partner copy of fct_mhsds_community_treatment_order_recall, published to local
      authority partners. No SQL filter: partner roles see only rows allowed by the
      PARTNER_POLICY row access policy on sk_patient_id, which partner_mapping links to
      a borough partner role when the patient is registered with a practice in, or
      resident in, that borough. Rows without an sk_patient_id, or whose patient has no
      in-area registered or residence borough, are visible to no partner. sk_patient_id
      is cast to VARCHAR to match the policy; all other columns are as in
      fct_mhsds_community_treatment_order_recall. Returns to hospital for treatment
      under a community treatment order. Each row is one provider, legal-status period
      and recall start date/time, using the latest accepted version. Several recalls can
      occur during the same order and remain separate. The underlying order permits
      community treatment under conditions with a power of recall; the recall is a
      separate period. Missing times remain unknown, and incomplete identifying details
      retain separate source records.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: community_treatment_order_recall_id
        description: >
          Unique identifier at the documented model grain.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
