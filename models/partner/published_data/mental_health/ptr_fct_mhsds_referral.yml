models:
  - name: ptr_fct_mhsds_referral
    description: >
      Partner copy of fct_mhsds_referral, published to local authority partners. No SQL
      filter: partner roles see only rows allowed by the PARTNER_POLICY row access
      policy on sk_patient_id, which partner_mapping links to a borough partner role
      when the patient is registered with a practice in, or resident in, that borough.
      Rows without an sk_patient_id, or whose patient has no in-area registered or
      residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR to
      match the policy; all other columns are as in fct_mhsds_referral. Recorded
      referrals to mental health services or teams. Each row is one service request,
      using its latest accepted version across the available history. Includes referrals
      with missing person details. Dates are retained when a time was not supplied;
      pre-1901 missing-date markers are shown as null. Use fct_mhsds_referral_period for
      state at a particular reporting period, and fct_mhsds_currency_referral_summary
      for costing classifications.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: source_record_id
        description: >
          Stable referral join key; the MHSDS unique service request identifier.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
