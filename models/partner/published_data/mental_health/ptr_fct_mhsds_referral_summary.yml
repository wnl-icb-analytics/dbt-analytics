models:
  - name: ptr_fct_mhsds_referral_summary
    description: >
      Partner copy of fct_mhsds_referral_summary, published to local authority partners.
      No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY row
      access policy on sk_patient_id, which partner_mapping links to a borough partner
      role when the patient is registered with a practice in, or resident in, that
      borough. Rows without an sk_patient_id, or whose patient has no in-area registered
      or residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR
      to match the policy; all other columns are as in fct_mhsds_referral_summary. Care
      and access measures for each recorded referral. Each row is one latest service
      request, with counts of contacts, submitted indirect activity, recorded hospital
      spells and team relationships. Referrals with missing person details remain
      included. Records that cannot be linked to a referral remain available in their
      own detailed tables. The measures are calculated before they are joined, so
      several contacts and teams do not multiply each other. Time to first attendance
      describes recorded evidence; it is not a national waiting-time compliance measure.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: source_record_id
        description: >
          Stable referral join key; the MHSDS unique service request identifier.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
