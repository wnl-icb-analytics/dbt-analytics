models:
  - name: ptr_dim_csds_person_provider_period
    description: >
      Partner copy of dim_csds_person_provider_period, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      dim_csds_person_provider_period. Demographics and residence recorded for a person
      by a CSDS provider in a reporting period. Each row is one identifiable person,
      provider and accepted period, using the newest submitted record in that period and
      flagging conflicting records. Use it for historical breakdowns by age, gender,
      ethnicity, residence or deprivation; join on person_provider_period_id from the
      referral period and caseload facts. Residence local authority resolves 2011 LSOA
      codes supplied in the 2021 field. Differences between providers stay separate.
      Rows without a person ID are excluded.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: person_provider_period_id
        description: >
          Key for the person, provider and reporting period end.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
