models:
  - name: ptr_fct_csds_referral_summary
    description: >
      Partner copy of fct_csds_referral_summary, published to local authority partners.
      No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY row
      access policy on sk_patient_id, which partner_mapping links to a borough partner
      role when the patient is registered with a practice in, or resident in, that
      borough. Rows without an sk_patient_id, or whose patient has no in-area registered
      or residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR
      to match the policy; all other columns are as in fct_csds_referral_summary. Care
      and access measures for each recorded CSDS referral. Each row is one latest
      referral from fct_csds_referral, with its state in the provider's latest
      submission and counts of contacts by attendance, care activities, service teams
      and referral-to-treatment clocks. Each measure is aggregated before joining, so
      several contacts and teams do not multiply each other. Referrals without a person
      bridge remain. Time to first attendance describes recorded evidence, not a
      national waiting-time measure. Replaces the retiring int_csds_*_summary models.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: source_record_id
        description: >
          Provider-qualified referral identifier, as in fct_csds_referral.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
