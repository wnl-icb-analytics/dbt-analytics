models:
  - name: ptr_fct_csds_referral
    description: >
      Partner copy of fct_csds_referral, published to local authority partners. No SQL
      filter: partner roles see only rows allowed by the PARTNER_POLICY row access
      policy on sk_patient_id, which partner_mapping links to a borough partner role
      when the patient is registered with a practice in, or resident in, that borough.
      Rows without an sk_patient_id, or whose patient has no in-area registered or
      residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR to
      match the policy; all other columns are as in fct_csds_referral. One latest
      reported CSDS service request across all accepted reporting periods. Includes open
      and discharged referrals, with no 2021 cutoff or attendance filter. Referrals
      without a person bridge remain. One-to-many teams are separate. Missing discharge
      does not establish current activity.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: source_record_id
        description: >
          National provider-qualified referral identifier, stable across accepted
          revisions.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
