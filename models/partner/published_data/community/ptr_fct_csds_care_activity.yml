models:
  - name: ptr_fct_csds_care_activity
    description: >
      Partner copy of fct_csds_care_activity, published to local authority partners. No
      SQL filter: partner roles see only rows allowed by the PARTNER_POLICY row access
      policy on sk_patient_id, which partner_mapping links to a borough partner role
      when the patient is registered with a practice in, or resident in, that borough.
      Rows without an sk_patient_id, or whose patient has no in-area registered or
      residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR to
      match the policy; all other columns are as in fct_csds_care_activity. One accepted
      CSDS CYP202 activity occurrence per submission and activity identifier. Preserves
      all source activities, including unbridged people and unmatched parent
      identifiers. Contact context comes from the same submission, never from an
      unrelated latest occurrence. Activities are child detail and do not emit separate
      healthcare events. Delivery timestamps are not clinical activity dates. Native
      clinical codes, schemes, values and units remain together. Clinical labels use the
      supplied coding scheme; source codes and values are not rewritten.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: source_record_id
        description: >
          Surrogate key of submission and activity identifier.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
