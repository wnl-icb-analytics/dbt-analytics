models:
  - name: ptr_fct_csds_clinical_record
    description: >
      Partner copy of fct_csds_clinical_record, published to local authority partners.
      No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY row
      access policy on sk_patient_id, which partner_mapping links to a borough partner
      role when the patient is registered with a practice in, or resident in, that
      borough. Rows without an sk_patient_id, or whose patient has no in-area registered
      or residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR
      to match the policy; all other columns are as in fct_csds_clinical_record. CSDS
      clinical history, one row per retained coded immunisation, accepted referral or
      activity assessment occurrence, or populated care-activity component. Includes
      accepted history for all ages. Repeated complete immunisation keys use the latest
      accepted row; unknown people retain individual immunisation occurrences. Equal
      assessment scores on different dates remain present. These records are clinical
      items, not encounters. Missing labels, identities, times and parents remain
      visible.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: source_record_id
        description: >
          Unique clinical-item key for cross-source drill-down to this fact. Equal to
          clinical_record_id; use originating_source_record_id for the original source
          occurrence.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
