models:
  - name: ptr_fct_csds_care_contact
    description: >
      Partner copy of fct_csds_care_contact, published to local authority partners. No
      SQL filter: partner roles see only rows allowed by the PARTNER_POLICY row access
      policy on sk_patient_id, which partner_mapping links to a borough partner role
      when the patient is registered with a practice in, or resident in, that borough.
      Rows without an sk_patient_id, or whose patient has no in-area registered or
      residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR to
      match the policy; all other columns are as in fct_csds_care_contact. One latest
      reported CSDS referral and care contact. Includes attended, cancelled, DNA and
      unknown attendance records from all accepted reporting periods. Contact
      identifiers are reused across referrals, so the key includes referral. Unlinked
      contacts and person-conflicting referral links remain visible; parent context is
      not substituted.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: source_record_id
        description: >
          Hash of referral and contact identifiers, stable across accepted revisions of
          that pair.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
