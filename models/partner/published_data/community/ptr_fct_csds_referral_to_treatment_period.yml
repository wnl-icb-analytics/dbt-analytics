models:
  - name: ptr_fct_csds_referral_to_treatment_period
    description: >
      Partner copy of fct_csds_referral_to_treatment_period, published to local
      authority partners. No SQL filter: partner roles see only rows allowed by the
      PARTNER_POLICY row access policy on sk_patient_id, which partner_mapping links to
      a borough partner role when the patient is registered with a practice in, or
      resident in, that borough. Rows without an sk_patient_id, or whose patient has no
      in-area registered or residence borough, are visible to no partner. sk_patient_id
      is cast to VARCHAR to match the policy; all other columns are as in
      fct_csds_referral_to_treatment_period. Referral-to-treatment and response-time
      clocks reported by CSDS providers. Each row is one accepted CYP104 record in a
      reporting period. A clock (referral and start date) repeats each month it is
      reported, so filter is_latest_clock_record to count clocks. For the two-hour
      urgent community response use is_two_hour_response_clock (type 05; type 06 is the
      two-day standard), the latest record of each stopped clock with a valid wait,
      grouped by end month as nationally. National figures also exclude rejected and
      acute-origin referrals, which this table keeps. A missing end date does not prove
      the person is still waiting.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: referral_to_treatment_period_id
        description: >
          CYP104 source row identifier.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
