models:
  - name: ptr_fct_csds_current_caseload_referral
    description: >
      Partner copy of fct_csds_current_caseload_referral, published to local authority
      partners. No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY
      row access policy on sk_patient_id, which partner_mapping links to a borough
      partner role when the patient is registered with a practice in, or resident in,
      that borough. Rows without an sk_patient_id, or whose patient has no in-area
      registered or residence borough, are visible to no partner. sk_patient_id is cast
      to VARCHAR to match the policy; all other columns are as in
      fct_csds_current_caseload_referral. Open CSDS referrals recorded in the dataset's
      latest accepted month. Each row is one referral, including those awaiting a first
      attended contact. Providers whose latest submission is older are excluded; their
      evidence remains in fct_csds_latest_provider_caseload_referral. Exclusion does not
      mean discharge. This is recorded caseload, not a live list or confirmed active
      treatment.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: referral_period_id
        description: >
          Key for the referral and accepted submission.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.
