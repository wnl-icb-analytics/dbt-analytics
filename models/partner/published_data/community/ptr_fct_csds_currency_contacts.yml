models:
  - name: ptr_fct_csds_currency_contacts
    description: >
      Partner copy of fct_csds_currency_contacts, published to local authority partners.
      No SQL filter: partner roles see only rows allowed by the PARTNER_POLICY row
      access policy on sk_patient_id, which partner_mapping links to a borough partner
      role when the patient is registered with a practice in, or resident in, that
      borough. Rows without an sk_patient_id, or whose patient has no in-area registered
      or residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR
      to match the policy; all other columns are as in fct_csds_currency_contacts.
      Costed CSDS community contact currencies. Grain: one row per
      unique_service_request_identifier and unique_care_contact_identifier; providers
      reuse local contact identifiers across referrals. Population: all classified
      CYP201 contacts. Time semantics: each contact is allocated to the fiscal year
      containing care_contact_date and rebased from 2026/27 with the GDP deflator.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: unique_service_request_identifier
        description: >
          Unique service request identifier.

      - name: unique_care_contact_identifier
        description: >
          Unique care contact identifier.

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.

      - name: person_id
        description: >
          CSDS person identifier.

      - name: org_id_prov
        description: >
          Provider organisation code.

      - name: care_contact_date
        description: >
          Care contact date.

      - name: dm_icb_commissioner
        description: >
          Derived ICB commissioner code.

      - name: dm_sub_icb_commissioner
        description: >
          Derived sub-ICB commissioner code.

      - name: practice_code
        description: >
          GP practice code at or nearest to contact.

      - name: practice_attribution
        description: >
          Method used to assign the GP practice.

      - name: practice_name
        description: >
          GP practice name.

      - name: practice_metadata_source
        description: >
          Where practice context resolved - the WNL PCN membership lookup or the
          national ODS practice dimension (name only).

      - name: pcn_code
        description: >
          Populated for practices in the WNL PCN membership lookup only - out-of-area
          registrations (about a third of contacts, as providers serve other ICBs) carry
          practice_code but null PCN fields.

      - name: pcn_name
        description: >
          Primary care network name.

      - name: practice_registered_borough
        description: >
          Borough where the GP practice is registered.

      - name: lsoa21_residence
        description: >
          2021 LSOA code for latest submitted residence.

      - name: residence_borough
        description: >
          Borough for latest submitted residence.

      - name: sub_icb_of_residence
        description: >
          Sub-ICB location code of latest submitted residence.

      - name: fiscal_year_start
        description: >
          Fiscal year containing the care contact date.

      - name: attendance_status
        description: >
          Care contact attendance status.

      - name: is_costed_attendance
        description: >
          Whether the attendance is priced.

      - name: age_category
        description: >
          Adult or CYP currency age category.

      - name: currency_code
        description: >
          Community contact currency code.

      - name: currency_source
        description: >
          Currency classification source.

      - name: unit_price_2627_gbp
        description: >
          Resolved 2026/27 price in GBP.

      - name: price_source
        description: >
          Price resolution source.

      - name: mff_factor
        description: >
          Provider Market Forces Factor.

      - name: proxy_cost
        description: >
          Price multiplied by MFF and GDP deflator ratio, or zero for uncosted
          attendance.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - unique_service_request_identifier
              - unique_care_contact_identifier
