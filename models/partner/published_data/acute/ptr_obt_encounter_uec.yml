models:
  - name: ptr_obt_encounter_uec
    description: >
      Partner copy of obt_encounter_uec, published to local authority partners. No SQL
      filter: partner roles see only rows allowed by the PARTNER_POLICY row access
      policy on sk_patient_id, which partner_mapping links to a borough partner role
      when the patient is registered with a practice in, or resident in, that borough.
      Rows without an sk_patient_id, or whose patient has no in-area registered or
      residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR to
      match the policy; all other columns are as in obt_encounter_uec. Urgent and
      emergency care encounters from SUS data. One row represents one ECDS attendance.
      Current PCN, neighbourhood and health borough fields describe the latest
      maintained mapping for the practice submitted on the attendance, not its
      membership at the attendance date.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: visit_occurrence_id
        description: >
          Primary key for the encounter within SUS
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy.

      - name: source
        description: >
          Commissioning data source

      - name: local_patient_identifier
        description: >
          Trust-provided patient id.

      - name: organisation_id
        description: >
          Organisation ID (type 41) of the provider, if invalid code trimmed to 3
          characters

      - name: organisation_name
        description: >
          Provider organisation name

      - name: site_id
        description: >
          Site identifier

      - name: site_name
        description: >
          Site name

      - name: pod
        description: >
          Point-of-delivery grouping derived from ECDS emergency care department type:
          01 = AE-T1 (24-hour consultant-led emergency department), 02 = AE-Other (other
          or single-specialty emergency department), 03 = UCC (urgent treatment centre),
          04 = WiC (walk-in centre), 05 = SDEC (same day emergency care), and all other
          values = Others.

      - name: department_type
        description: >
          Submitted ECDS Emergency Care Department Type code. This is separate from
          Attendance Category.

      - name: department_type_desc
        description: >
          Current UKHFD description of the submitted Emergency Care Department Type
          code.

      - name: start_date
        description: >
          Date of arrival at urgent care department

      - name: start_time
        description: >
          Time of arrival at urgent care department

      - name: end_date
        description: >
          Date of departure at urgent care department

      - name: end_time
        description: >
          Time of departure at urgent care department

      - name: duration
        description: >
          Time to urgent care department discharge from arrival, in minutes

      - name: chief_complaint_code
        description: >
          Chief complaint code of patient for the encounter

      - name: chief_complaint_desc
        description: >
          Chief complaint SNOMED description of patient for the encounter

      - name: chief_complaint_ecds_group1
        description: >
          Chief complaint ECDS group 1 description of patient for the encounter

      - name: is_injury_related
        description: >
          Flag for an injury related encounter

      - name: acuity
        description: >
          Clinical acuity code of the encounter

      - name: acuity_desc
        description: >
          Human-readable SNOMED CT UK preferred term for the clinical acuity code.

      - name: primary_diagnosis_code_snomed
        description: >
          The first listed diagnosis SNOMED code, considered to be the most important /
          significant.

      - name: primary_diagnosis_desc_snomed
        description: >
          The first listed diagnosis SNOMED description, considered to be the most
          important / significant.

      - name: primary_diagnosis_code_icd10
        description: >
          The first listed diagnosis ICD-10 code, considered to be the most important /
          significant.

      - name: primary_diagnosis_desc_icd10
        description: >
          The first listed diagnosis ICD-10 description, considered to be the most
          important / significant.

      - name: primary_diagnosis_desc_ecds_group1
        description: >
          The first listed diagnosis ECDS group 1 description, considered to be the most
          important / significant.

      - name: primary_treatment
        description: >
          First treatment SNOMED code recorded in encounter

      - name: primary_treatment_desc_snomed
        description: >
          First treatment SNOMED description recorded in encounter

      - name: primary_treatment_desc_ecds_group1
        description: >
          First treatment ECDS group 1 description recorded in encounter

      - name: primary_investigation
        description: >
          First investigation SNOMED code recorded in encounter

      - name: primary_investigation_desc_snomed
        description: >
          First investigation SNOMED description recorded in encounter

      - name: primary_investigation_desc_ecds_group1
        description: >
          First investigation ECDS group 1 description recorded in encounter

      - name: arrival_mode_code
        description: >
          Arrival mode SNOMED code

      - name: arrival_mode_desc
        description: >
          Arrival mode SNOMED description

      - name: discharge_destination_code
        description: >
          Discharge destination SNOMED code

      - name: discharge_destination_desc
        description: >
          Discharge destination SNOMED description

      - name: main_specialty_code
        description: >
          Allocated specialty code for the attendance: 180, emergency medicine

      - name: main_specialty_name
        description: >
          Allocated specialty name for the attendance: Emergency Medicine

      - name: hrg_code
        description: >
          Health resource group code associated with the encounter

      - name: core_hrg_desc
        description: >
          HRG description associated with the encounter

      - name: core_hrg_chapter
        description: >
          HRG chapter key associated with the encounter

      - name: core_hrg_chapter_desc
        description: >
          HRG chapter description associated with the encounter

      - name: cost
        description: >
          National-pricing final price reported by SUS for the emergency care
          attendance. This is a submitted tariff/pricing value, not an accounting
          measure of the provider's actual cost of delivering care.

      - name: age_at_event
        description: >
          Patient age at arrival

      - name: gender_at_event
        description: >
          The gender of a person as specified by the person or inferred by observation.

      - name: gender_desc_at_event
        description: >
          Patient gender description at time of event

      - name: ethnicity_at_event
        description: >
          The ethnicity of a person, as specified by the person.

      - name: ethnicity_desc_at_event
        description: >
          Patient ethnicity description at time of event

      - name: postcode_id
        description: >
          Pseudonymised postcode value supplied by SUS. It is usually partial and can
          contain a special pseudo postcode; it is not a postcode dictionary key.

      - name: postcode_district_at_event
        description: >
          Patient postcode district at time of event

      - name: lsoa_11_at_event
        description: >
          Patient LSOA 2011 of residence at the time of the attendance. Populated across
          the full history, so use it for trends that span April 2024.

      - name: lsoa_21_at_event
        description: >
          Patient LSOA 2021 of residence at the time of the attendance. Reliable for
          attendances from 1 April 2024 (about 97% populated); mostly null for earlier
          attendances, so use lsoa_11_at_event for trends that span that date.

      - name: lad_at_event
        description: >
          Patient local authority district at time of event

      - name: imd_at_event
        description: >
          Deprivation decile supplied on the ECDS attendance. The source IMD release is
          not documented.

      - name: deprivation_decile_at_event
        description: >
          Numeric deprivation decile for reporting, where 1 is most deprived and 10 is
          least deprived. Uses the IMD 2025 decile of lsoa_21_at_event when that code is
          an England LSOA 2021 (populated from April 2024). Otherwise uses IMD 2025
          where every 2021 successor of the attendance LSOA 2011 has the same decile,
          then falls back to a valid decile supplied on the ECDS attendance. A fallback
          value is not necessarily from IMD 2025.

      - name: reg_practice_at_event
        description: >
          Registered GP practice code recorded on the attendance.

      - name: reg_practice_name_latest
        description: >
          Latest national UKHFD name for reg_practice_at_event. The name is not
          effective-dated to the attendance.

      - name: reg_practice_pcn_name_latest
        description: >
          Latest maintained PCN name for reg_practice_at_event; not historical
          membership.

      - name: reg_practice_neighbourhood_name_latest
        description: >
          Latest maintained integrated neighbourhood name for reg_practice_at_event; not
          historical membership.

      - name: reg_practice_health_borough_name_latest
        description: >
          Latest maintained WNL health borough for reg_practice_at_event; not historical
          membership.

      - name: is_mental_health_referral
        description: >
          True when any referred-to-service record for the attendance has the ECDS group
          Psychiatric. This records referral evidence; it is not the proposed local
          mental-health classification, whose first-referral or any-referral rule has
          not yet been agreed.

      - name: is_cyp_mental_health
        description: >
          True when the person was under 18 at arrival and the attendance meets the NHS
          England mental-health-related attendance definition in the Supplementary ECDS
          Analysis Technical Specification v3.3.

      - name: is_mental_health_related_attendance
        description: >
          True when the attendance has a chief complaint, injury intent or diagnosis
          code in the NHS England mental-health-related attendance definition in the
          Supplementary ECDS Analysis Technical Specification v3.3. This all-age flag
          includes suspected and confirmed diagnoses.

      - name: has_suspected_mental_health_diagnosis_only
        description: >
          True when the attendance has a diagnosis in the NHS England
          mental-health-related diagnosis list and none of those diagnoses is recorded
          as confirmed present. False also covers attendances without a diagnosis from
          that list.

      - name: discharge_destination_ecds_group1
        description: >
          ECDS group for the submitted discharge destination code.

      - name: discharge_destination_group
        description: >
          NHS England 2025 discharge destination group: Admitted, Non-admitted, Other or
          Unknown. Other includes mortuary, short stay, SDEC, hospital at home, transfer
          and hospice. Unknown covers missing and unmapped codes.

      - name: is_unplanned_attendance
        description: >
          True for the NHS England unplanned-attendance population: ECDS activity type
          01, 02, 03 or 04, excluding planned follow-ups and people recorded as dead on
          arrival. Department type supplies the activity type when the submitted
          activity type is missing, including for historical records. Missing attendance
          category or discharge status does not itself exclude a row.

      - name: attendance_count
        description: >
          Additive attendance measure. Usually 1; 0 for the agreed historical Totally
          streaming records that were also counted at a co-located ED.

      - name: over_12_hours_count
        description: >
          NHS England additive numerator for unplanned attendances with valid departure
          date and time and submitted duration greater than 720 minutes. Use
          is_unplanned_attendance with valid departure date and time as the denominator.

      - name: over_72_hours_count
        description: >
          Local additive measure. Counts an attendance when submitted duration is
          greater than 4,320 minutes; missing duration counts as 0.

      - name: assessed_within_15_minutes_count
        description: >
          Local additive measure. Counts an attendance when submitted initial assessment
          time is at or below 15 minutes; missing time counts as 0.

      - name: not_assessed_within_15_minutes_count
        description: >
          Local additive measure. Counts an attendance when submitted initial assessment
          time is above 15 minutes; missing time counts as 0.

      - name: visit_occurrence_type
        description: >
          Type of visit occurrence

      - name: cds_unique_identifier
        description: >
          Identifier assigned to the submitted CDS transaction; used for source
          traceability, not as the encounter grain.

      - name: provider_reference_number
        description: >
          Locally agreed provider/commissioner reference. Its population and meaning
          vary by provider; it is not comparable across providers and is not an ODS
          code.

      - name: initial_assessment_date
        description: >
          Date of the first formal clinical assessment in emergency care.

      - name: initial_assessment_time
        description: >
          Time of the first formal clinical assessment in emergency care.

      - name: initial_assessment_time_since_arrival
        description: >
          Source-reported elapsed time from arrival to initial assessment, in minutes.

      - name: seen_for_treatment_date
        description: >
          Date the patient was first seen by a clinical professional for treatment.

      - name: seen_for_treatment_time
        description: >
          Time the patient was first seen by a clinical professional for treatment.

      - name: seen_for_treatment_time_since_arrival
        description: >
          Source-reported elapsed time from arrival until first seen for treatment, in
          minutes.

      - name: decided_to_admit_date
        description: >
          Date the decision was made to admit the patient from emergency care.

      - name: decided_to_admit_time
        description: >
          Time the decision was made to admit the patient from emergency care.

      - name: decided_to_admit_time_since_arrival
        description: >
          Source-reported elapsed time from arrival to the decision to admit, in
          minutes.

      - name: clinically_ready_to_proceed_at
        description: >
          First time a clinician decided the patient no longer needed
          emergency-department care (ECDS v4 Clinically Ready To Proceed).

      - name: clinically_ready_to_proceed_time_since_arrival
        description: >
          Source-reported elapsed time from arrival until clinically ready to proceed,
          in minutes.

      - name: injury_intent_code
        description: >
          SNOMED CT code describing the intent associated with the injury.

      - name: injury_intent_desc
        description: >
          Human-readable UK preferred term for the injury intent code.

      - name: injury_mechanism_code
        description: >
          SNOMED CT code describing the mechanism that caused the injury.

      - name: injury_mechanism_desc
        description: >
          Human-readable UK preferred term for the injury mechanism code.

      - name: place_of_injury_code
        description: >
          SNOMED CT code describing the type of place where the injury occurred.

      - name: place_of_injury_desc
        description: >
          Human-readable UK preferred term for the place-of-injury code.

      - name: injury_date
        description: >
          Date on which the injury occurred; null when it was not recorded, including
          source placeholder 1900-01-01.

      - name: injury_time
        description: >
          Time at which the injury occurred, as recorded for the attendance.

      - name: disease_notification_code
        description: >
          ECDS disease-notification code recorded for the attendance.

      - name: attendance_category_code
        description: >
          ECDS attendance category: 1 unplanned first; 2 unplanned follow-up at this
          service; 3 unplanned follow-up at another service; 4 planned follow-up at this
          service; X dead on arrival.

      - name: attendance_category_desc
        description: >
          Human-readable description of the ECDS attendance category code.

      - name: is_arrival_planned
        description: >
          Whether arrival at the emergency care department was planned.

      - name: ambulance_incident_number
        description: >
          Ambulance incident number; linkage depends on the supplying ambulance dataset
          and identifier coverage.

      - name: conveying_ambulance_trust_code
        description: >
          Cleaned organisation code of the ambulance trust that conveyed the patient.

      - name: conveying_ambulance_trust_name
        description: >
          Human-readable name of the conveying ambulance trust.

      - name: ambulance_care_contact_identifier
        description: >
          Ambulance care-contact identifier; linkage depends on the supplying ambulance
          dataset and identifier coverage.

      - name: attendance_source_code
        description: >
          SNOMED CT code identifying the source that directed the patient to emergency
          care.

      - name: attendance_source_desc
        description: >
          Human-readable UK preferred term for the attendance source code.

      - name: attendance_source_organisation_site_identifier
        description: >
          Normalised organisation-site identifier for the source of the attendance.

      - name: attendance_source_organisation_name
        description: >
          Human-readable site or provider name for the source organisation.

      - name: discharge_status_code
        description: >
          SNOMED CT code describing the patient's status at discharge.

      - name: discharge_status_desc
        description: >
          Human-readable UK preferred term for the discharge status code.

      - name: discharge_follow_up_code
        description: >
          SNOMED CT code describing follow-up arranged after discharge.

      - name: discharge_follow_up_desc
        description: >
          Human-readable UK preferred term for the discharge follow-up code.

      - name: discharge_information_given_code
        description: >
          ECDS code describing discharge information provided to the patient.

      - name: decided_to_admit_treatment_function_code
        description: >
          Treatment function code associated with the decision to admit.

      - name: decided_to_admit_treatment_function_desc
        description: >
          Human-readable treatment function associated with the decision to admit.

      - name: receiving_site_id
        description: >
          Normalised identifier of the site expected to receive the patient after the
          decision to admit.

      - name: receiving_organisation_name
        description: >
          Human-readable site or provider name of the receiving organisation.

      - name: applicable_costing_period
        description: >
          National-pricing costing period supplied for the attendance.

      - name: residence_area_code_at_event
        description: >
          CCG or sub-ICB location code for the patient's residence postcode; not
          assigned payment responsibility.

      - name: residence_area_name_at_event
        description: >
          Human-readable name of the residence geography.

      - name: assigned_commissioner_code_at_event
        description: >
          Service-agreement commissioner code submitted for the attendance. This is not
          the ECDS Commissioner Assignment Method field.

      - name: assigned_commissioner_name_at_event
        description: >
          Latest dictionary name for the submitted service-agreement commissioner code.

      - name: patient_type_code_at_event
        description: >
          Source ECDS patient-type code, such as ADU or CHI.

      - name: patient_type_desc_at_event
        description: >
          Human-readable patient type at the attendance, with ADU represented as Adult
          and CHI as Child.

      - name: general_practitioner_code
        description: >
          Individual GP code; distinct from reg_practice_at_event, which identifies the
          GP practice.

      - name: financial_year
        description: >
          NHS financial year derived from start_date in YYYYYY format, for example
          202526.

      - name: financial_month
        description: >
          NHS financial month derived from start_date, where April is 1 and March is 12.

      - name: financial_month_name
        description: >
          Calendar month name for start_date, paired with the NHS financial month
          number.

      - name: week_end_date
        description: >
          Sunday at the end of the ISO week containing start_date.

      - name: expected_treatment_at
        description: >
          Expected treatment timestamp from the first source-sequenced
          expected-treatment record.

      - name: is_national_tariff_excluded
        description: >
          Whether the attendance was excluded from national tariff pricing.

      - name: national_tariff
        description: >
          National tariff amount before market-forces adjustment.

      - name: national_tariff_final_price
        description: >
          Final national-pricing amount; also exposed as cost for compatibility.

      - name: mff_factor
        description: >
          Market Forces Factor reported for the attendance.

      - name: mff_adjustment
        description: >
          Market Forces Factor monetary adjustment reported for the attendance.

      - name: uec_activity_type_code
        description: >
          Source ECDS activity type code for the urgent-care setting; distinct from pod
          and department_type.

      - name: uec_activity_type_desc
        description: >
          Current UKHFD description of the urgent and emergency care activity type code.

      - name: uec_site_label
        description: >
          Operational label for urgent treatment centres, walk-in centres and minor
          injuries units (for example UTC_NP), from organisation_uec_site joined on
          site, department type and arrival date. Null for emergency departments and
          sites not in the reference.

      - name: disease_notification_desc
        description: >
          Human-readable SNOMED CT preferred term for the disease-notification code.

      - name: discharge_information_given_desc
        description: >
          Human-readable SNOMED CT preferred term describing the discharge information
          given to the patient.

      - name: general_practitioner_name
        description: >
          Human-readable name for general_practitioner_code; remains null when the
          submitted code is absent from the governed GP reference.
