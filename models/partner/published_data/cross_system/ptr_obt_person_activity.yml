models:
  - name: ptr_obt_person_activity
    description: >
      Partner copy of obt_person_activity, published to local authority partners. No SQL
      filter: partner roles see only rows allowed by the PARTNER_POLICY row access
      policy on sk_patient_id, which partner_mapping links to a borough partner role
      when the patient is registered with a practice in, or resident in, that borough.
      Rows without an sk_patient_id, or whose patient has no in-area registered or
      residence borough, are visible to no partner. sk_patient_id is cast to VARCHAR to
      match the policy; all other columns are as in obt_person_activity. Combined
      person-level activity summary across recent GP, A&E, outpatient, and inpatient
      utilisation windows.

    config:
      meta:
        owner:
          name: Partner Manager

    columns:
      - name: sk_patient_id
        description: >
          Patient surrogate key stored as VARCHAR and matched exactly by the partner row
          access policy. One row per patient.
        data_tests:
          - unique
          - not_null

      - name: person_id
        description: >
          Unique person identifier from OLIDs, arbitrary choice

      - name: AE_ILL_12MO
        description: >
          Number of A&E attendances attended for illness in the last 12 months

      - name: AE_ILL_3MO
        description: >
          Number of A&E attendances attended for illness in the last 3 months

      - name: AE_ILL_1MO
        description: >
          Number of A&E attendances attended for illness in the last 1 month

      - name: AE_TOT_12MO
        description: >
          Number of A&E attendances attended in the last 12 months

      - name: AE_INJ_12MO
        description: >
          Number of A&E attendances attended for injury in the last 12 months

      - name: AE_T1_12MO
        description: >
          Number of A&E attendances attended via Type 1 A&E in the last 12 months

      - name: APC_3MO
        description: >
          Number of inpatient spells attended in the last 3 months

      - name: APC_1MO
        description: >
          Number of inpatient spells attended in the last 1 month

      - name: APC_12MO
        description: >
          Number of inpatient spells attended in the last 12 months

      - name: APC_LOS_12MO
        description: >
          Total length of stay for inpatient spells in the last 12 months

      - name: APC_NEL_12MO
        description: >
          Number of inpatient spells attended as non-elective (emergency) in the last 12
          months

      - name: OP_ATT_TOT_12MO
        description: >
          Number of outpatient appointments attended in the last 12 months

      - name: OP_ATT_TOT_3MO
        description: >
          Number of outpatient appointments attended in the last 3 months

      - name: OP_ATT_TOT_1MO
        description: >
          Number of outpatient appointments attended in the last 1 month

      - name: OP_ATT_FIRST_12MO
        description: >
          Number of outpatient appointments attended for the first time in the last 12
          months

      - name: OP_APP_TOT_12MO
        description: >
          Number of outpatient appointments booked in the last 12 months

      - name: OP_SPEC_12MO
        description: >
          Number of outpatient specialties where appointments were attended in the last
          12 months

      - name: OP_PROV_12MO
        description: >
          Number of outpatient providers where appointments were attended in the last 12
          months

      - name: OP_NUM_SPEC_2_PROV_12MO
        description: >
          Number of outpatient specialties where more than one provider was attended in
          the last 12 months

      - name: GP_ATT_TOT_12MO
        description: >
          Number of GP appointments attended in the last 12 months

      - name: GP_ATT_TOT_3MO
        description: >
          Number of GP appointments attended in the last 3 months

      - name: GP_ATT_TOT_1MO
        description: >
          Number of GP appointments attended in the last 1 month

      - name: GP_APP_TOT_12MO
        description: >
          Number of GP appointments booked in the last 12 months

      - name: GP_DNA_TOT_12MO
        description: >
          Number of GP appointments missed in the last 12 months
