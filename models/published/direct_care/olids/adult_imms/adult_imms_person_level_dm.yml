models:
  - name: adult_imms_person_level_dm
    description: One row per living, currently registered person aged 18+ with adult immunisation eligibility, holding vaccination detail by dose and demographics. Includes under-65s in programme cohorts, such as shingles and RSV.

    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - not_null