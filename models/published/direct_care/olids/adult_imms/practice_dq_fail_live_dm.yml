models:
  - name: practice_dq_fail_live_dm
    description: >
      Practices failing the EMIS registration data quality check, for the immunisation
      dashboards. One row per practice from emis_olids_reg_fail_direct_care: practices
      with no EMIS list size, or whose OLIDS regular registration count differs from the
      EMIS list size by 2% or more and by 5 or more people. issue_category gives the
      variance band. Practice Y03103 is excluded because it does not report through EMIS.
      May be empty when no practice fails.

    config:
      meta:
        owner:
          name: KateHomer55
    # Table may be empty when no practices fail DQ, so no row-count test.
    columns:
      - name: practice_code
        tests:
          - not_null