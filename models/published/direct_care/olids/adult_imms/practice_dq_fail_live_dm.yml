models:
  - name: practice_dq_fail_live_dm
    description: >
      Practices failing the EMIS registration data quality check, for the immunisation
      dashboards. One row per practice; empty when no practice fails. A practice fails with
      no EMIS list size, or when its OLIDS regular registration count differs from the EMIS
      list size by 2% or more and by 5 or more people. issue_category gives the variance
      band. Y03103 is excluded because it does not report through EMIS.

    config:
      meta:
        owner:
          name: KateHomer55
    # Table may be empty when no practices fail DQ, so no row-count test.
    columns:
      - name: practice_code
        tests:
          - not_null