models:
  - name: adult_imms_dose_count_dm
    description: >
      Monthly counts of people given PPV, shingles and RSV doses, for the adult immunisation
      dashboard. Each person counts once per dose, in the month of their latest dose. One
      row per dose, fiscal year, month, practice and combination of age band, 65+ and 75+
      flags, care home, immunosuppression, PPV risk group, pregnancy, ethnicity and IMD
      quintile. Doses are PPV dose 1, shingles doses 1 and 2 and RSV dose 1. Counts use the
      person's current practice. The population is everyone in dim_person_demographics
      currently aged 18+, including people no longer registered, with no 48-month or 60+
      restriction.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1