models:
  - name: adult_imms_dose_count_dm
    description: >
      Monthly counts of administered adult immunisations for the adult immunisation
      dashboard. View over int_adult_imms_dose_count_agg: one row per vaccination dose
      (PPV dose 1, shingles dose 1, shingles dose 2, RSV dose 1), fiscal year, month,
      practice and combination of age band, 65+ and 75+ flags, care home,
      immunosuppression, PPV risk group, pregnancy, ethnicity and IMD quintile;
      vaccination_count is the number of people. Each person counts once per dose type, in
      the month of their latest administered dose and against their current practice. The
      population is everyone in dim_person_demographics currently aged 18 or over,
      including people no longer registered; no 48-month or 60+ restriction is applied.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1