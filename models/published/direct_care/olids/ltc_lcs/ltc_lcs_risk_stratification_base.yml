models:
  - name: ltc_lcs_risk_stratification_base
    description: |-
      LTC LCS risk and MoC status, one row per adult MoC base member, Check & Test-only LR member or CYP-only asthma child at the build date. LR hypertension-only and LR adult-asthma-only people follow a Check & Test-only pathway (is_moc_check_test_only); filter is_in_moc_base for figures matching the EMIS MoC base. Includes inactive and deceased people; filter is_active in the published base. Next actions use observation-based EMIS work lists; future diary lists are unavailable.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
    columns:
      # ============================================================
      # Identifiers
      # ============================================================
      - name: person_id
        description: Unique person identifier
        data_tests:
          - not_null
          - unique
      - name: sk_patient_id
        description: Surrogate patient key used for linking to other datasets in the warehouse
      - name: hx_flake
        description: "HxFlake pseudonymised key (XX-XXX-XXX, 10 chars) for patient re-identification. Reversible transformation
          from sk_patient_id via dim_person_pseudo."
      - name: postcode_hash
        description: Hashed residential postcode
      - name: uprn_hash
        description: Hashed UPRN (Unique Property Reference Number)

      # ============================================================
      # Person status
      # ============================================================
      - name: is_active
        description: Current GP registration status
      - name: is_deceased
        description: Deceased flag

      # ============================================================
      # Demographics: core
      # ============================================================
      - name: gender
        description: |
          Person's gender. Four possible values: Female, Male, Indeterminate sex,
          Finding related to biological sex.
          Each person has exactly one gender value here — treat as a filter or
          group-by dimension, not a value to sum.
          To avoid double-counting or under-counting when splitting by gender:
          include all four categories (Female + Male + Indeterminate sex +
          Finding related to biological sex) — they sum to the total persons.
          Do NOT combine only Female + Male and compare that total to the full
          cohort; the small Indeterminate / Finding categories would be missed.
      - name: age
        description: Current age in years
      - name: age_band_5y
        description: "5-year age band (0-4, 5-9, 10-14, ..., 80-84, 85+)"
      - name: age_band_10y
        description: "10-year age band (0-9, 10-19, ..., 70-79, 80+)"
      - name: age_band_nhs
        description: "NHS standard age band (0-4, 5-14, 15-24, 25-34, 35-44, 45-54, 55-64, 65-74, 75-84, 85+)"
      - name: age_band_esp
        description: "ESP 2013 age band (<1, 1-4, 5-9, 10-14, ..., 85-89, 90+). Join key for age-standardised rate calculations."
      - name: age_life_stage
        description: "Life stage (Infant, Toddler, Child, Adolescent, Young Adult, Adult, Older Adult, Elderly, Very Elderly)"

      # ============================================================
      # Demographics: ethnicity
      # ============================================================
      - name: ethnicity_category
        description: "High-level ethnicity (Asian, Black, Mixed, Other, White, Unknown)"
      - name: ethnicity_subcategory
        description: Ethnicity subcategory (free-text from ethnicity reference data, e.g. 'Asian Indian', 'Black
          African')
      - name: ethnicity_granular
        description: Most detailed ethnicity classification (SNOMED-mapped granular label)

      # ============================================================
      # Demographics: language
      # ============================================================
      - name: main_language
        description: Main spoken language recorded for the person
      - name: language_type
        description: "Language type (Spoken, Sign, Other Communication Method, Not Recorded)"
      - name: interpreter_needed
        description: True if an interpreter is recorded as required
      - name: interpreter_type
        description: Interpreter service type / language (e.g. Polish, Romanian, British Sign Language)

      # ============================================================
      # Geography: residence
      # ============================================================
      - name: lsoa_code
        description: Residence LSOA 2021 code
      - name: lsoa_name
        description: Residence LSOA 2021 name
      - name: ward_code
        description: Residence electoral ward code
      - name: ward_name
        description: Residence electoral ward name
      - name: borough_resident
        description: London borough of residence (any of the 33 London boroughs, or non-London locations)
      - name: neighbourhood_resident
        description: "WNL Integrated Neighbourhood Team area covering the patient's residence, from the ward of the postcode (LSOA best-fit ward if the postcode ward is not in the ward lookup); null outside WNL"
      - name: icb_code_resident
        description: Residence ICB code
      - name: icb_resident
        description: Residence ICB name

      # ============================================================
      # Geography: GP practice registration
      # ============================================================
      - name: practice_code
        description: Registered GP practice code
      - name: practice_name
        description: Registered GP practice name
      - name: pcn_code
        description: Primary Care Network code
      - name: pcn_name
        description: Primary Care Network name
      - name: borough_registered
        description: "Borough of registered GP practice (Barnet, Camden, Enfield, Haringey, Islington — the 5 NCL boroughs)"
      - name: neighbourhood_registered
        description: "Integrated Neighbourhood Team area covering the registered GP practice"

      # ============================================================
      # Deprivation
      # ============================================================
      - name: imd_decile_25
        description: "IMD 2025 decile (1-10; 1 = most deprived, 10 = least deprived)"
      - name: imd_quintile_25
        description: "IMD 2025 quintile label (Most Deprived, Second Most Deprived, Third Most Deprived, Second Least Deprived,
          Least Deprived, Unknown)"

      # ============================================================
      # Age-standardisation weights (ESP 2013)
      # ============================================================
      - name: esp_weight
        description: |
          ESP 2013 population weight for the person's age_band_esp (out of 100,000 total).
          To compute an age-standardised rate (ASR, per 100,000):
            1. Within the cohort, group event counts and person-years by age_band_esp
            2. Work out the crude rate for each age band: rate_b = events_b / person_years_b
            3. ASR = SUM(rate_b * esp_weight_b) / 100000
          Or using esp_proportion: ASR = SUM(rate_b * esp_proportion_b). The result is one
          rate per 100,000 that is comparable across cohorts with different age profiles.
      - name: esp_proportion
        description: ESP 2013 weight as a proportion (esp_weight / 100,000). For an age-standardised rate, multiply each
          age band's crude rate by this and sum across age_band_esp.

      # ============================================================
      # Population health inclusion filters
      # ============================================================
      - name: has_learning_disability
        description: QOF Learning Disability register flag
      - name: has_severe_mental_illness
        description: QOF Severe Mental Illness register flag
      - name: is_currently_pregnant
        description: Currently pregnant flag
      - name: is_complex_adult
        description: True if the person is in the complex adults cohort (fct_person_complex_adults), regardless of their
          population segment. Membership needs a complexity and a utilisation criterion; 12-month activity windows end
          on the last completed month-end.
      - name: is_housebound
        description: True if the latest housebound status record is housebound; false if the latest record is no longer
          housebound or none is recorded

      # ============================================================
      # Risk stratification: per-condition
      # ============================================================
      - name: af_risk_group
        description: Highest AF risk group (HR/MR)
      - name: asthma_adult_risk_group
        description: Highest Asthma Adult risk group (HRC/HR/MR/LR)
      - name: asthma_cyp_risk_group
        description: CYP asthma risk. HR across the full CYP register; LR for CYP-only children not in HR.
      - name: chd_risk_group
        description: Highest CHD risk group (HRC/HR/MR)
      - name: ckd_risk_group
        description: Highest CKD risk group (HRC/HR/MR)
      - name: copd_risk_group
        description: Highest COPD risk group (HRC/HR/MR)
      - name: diabetes_risk_group
        description: Highest Diabetes risk group (HRC/HR/MR/MRa/MRb/LR)
      - name: hf_risk_group
        description: Highest Heart Failure risk group (HR/MR)
      - name: hypertension_risk_group
        description: Highest Hypertension risk group (HRC/HR/MRa/MRb/LR)
      - name: nafld_risk_group
        description: Highest NAFLD risk group (MR only)
      - name: pad_risk_group
        description: Highest PAD risk group (HRC/HR/MR)
      - name: stroke_tia_risk_group
        description: Highest Stroke/TIA risk group (HRC/HR/MR)

      # ============================================================
      # Risk stratification: overall
      # ============================================================
      - name: overall_risk_group
        description: Highest adult MoC risk group (HRC/HR/MR/LR), with MRa/MRb reported as MR and unstratified eligible
          members as LR. CYP-only asthma children carry their CYP HR/LR risk (EMIS CYPAST groups).
      - name: overall_risk_rank
        description: 'Stored risk rank: 1=HRC, 2=HR, 3=MR, 4=MRa/MRb, 5=LR. CYP-only HR/LR review risk uses 2/5. Monthly movement
          compares overall group ranks separately.'
      - name: in_any_risk_group
        description: True if person is in any condition risk group
      - name: number_of_ltc_lcs_conditions
        description: Number of LTC LCS condition registers the person is on (1-12)

      # ============================================================
      # MOC: pathway identity
      # ============================================================
      - name: moc_pathway
        description: 'Risk pathway: HRCS, HRS, MRS or LRS. CYP-only asthma children show HRS or LRS by CYP risk and follow the annual/desktop review steps (is_cyp_asthma_only). Check & Test-only people are LRS (is_moc_check_test_only).'
        data_tests: []
      - name: moc_risk_category
        description: Dashboard risk category (High Risk + Complex, High Risk, Medium Risk, or Low Risk)

      # ============================================================
      # MOC: activity flags + dates (last 12 months), in pathway order
      # ============================================================
      - name: moc_check_test_completed
        description: 'Actual C&T activity: C strictly after the annual anniversary for HRCS/HRS/MRS; inclusive for LRS,
          including Check & Test-only people. False for CYP-only people.'
      - name: moc_check_test_date
        description: Latest Check & Test appointment date
      - name: moc_remote_desktop_review_completed
        description: Annual review (MDT/desktop review code) in the last 12 months, any pathway. Kept for existing
          consumers; not a MoC stage. MR/LR stage 2 is care plan sharing.
        data_tests:
          - not_null
      - name: moc_remote_desktop_review_date
        description: Latest annual review date in the last 12 months, any pathway; null if none.
      - name: moc_remote_desktop_review_completed_12m
        description: Annual review in the last 12 months for MRS/LRS. Kept for existing consumers; not a MoC stage.
        data_tests: [not_null]
      - name: moc_remote_desktop_review_date_12m
        description: Latest annual review date in the last 12 months for MRS/LRS.
      - name: moc_remote_desktop_review_completed_fy
        description: Annual review since 1 April for MRS/LRS. Kept for existing consumers; not a MoC stage.
        data_tests: [not_null]
      - name: moc_remote_desktop_review_date_fy
        description: Latest annual review date since 1 April for MRS/LRS.
      - name: moc_re_engaged_after_decline
        description: Declined in the last 12 months, then a later C&T, care plan sharing, discussion or follow-up.
        data_tests:
          - not_null
      - name: moc_careplan_sharing_completed
        description: 'Actual sharing activity: S strictly after the annual anniversary for HRCS/HRS/MRS; inclusive for LRS.'
      - name: moc_careplan_sharing_date
        description: Latest care plan sharing date
      - name: moc_stage_2_completed
        description: C strictly after the annual anniversary and MDT or sharing for HRCS/HRS; sharing for MRS/LRS. MDT
          is inclusive; sharing is strict except in LRS.
      - name: moc_stage_2_date
        description: Latest qualifying MDT or sharing date for a completed HRCS/HRS stage 2; sharing date for MRS/LRS.
          Null if stage 2 is incomplete.
      - name: moc_discussion_completed
        description: Actual PCSP agreed event in the inclusive trailing 12 months. Declines do not count as activity.
      - name: moc_discussion_date
        description: Latest discussion appointment date
      - name: moc_followup_completed
        description: Actual PCSP review event in the inclusive trailing 12 months. Stage 4 completion also requires an
          agreed plan or a decline.
      - name: moc_followup_date
        description: Latest follow-up appointment date
      - name: moc_declined
        description: Model of Care declined event recorded in last 12 months (raw flag, stays true even if person later
          re-engages)
      - name: moc_declined_date
        description: Latest MoC declined date
      - name: moc_any_activity_12m
        description: Any actual adult MoC or applicable CYP review activity in its pathway window, including an adult
          decline.
      - name: moc_any_activity_fy
        description: 'Project financial-year measure, since 1 April: Project measure of actual adult MoC or applicable CYP
          review activity since 1 April, including an adult decline.'

      # ============================================================
      # MOC: named progression stages (12m and current FY to date)
      # ============================================================
      - name: moc_check_test_completed_12m
        description: 'Actual C&T activity: C strictly after the annual anniversary for HRCS/HRS/MRS; inclusive for LRS,
          including Check & Test-only people. False for CYP-only people.'
      - name: moc_check_test_date_12m
        description: Latest Check & Test date in the trailing 12 months
      - name: moc_check_test_completed_fy
        description: 'Project financial-year measure, since 1 April: Check & Test completed in the current financial year
          to date'
      - name: moc_check_test_date_fy
        description: 'Project financial-year measure, since 1 April: Latest Check & Test date in the current financial year
          to date'
      - name: moc_mdt_review_completed_12m
        description: Annual MDT review event in the inclusive trailing 12 months, HRCS/HRS only; separate from stage 2
          completion.
      - name: moc_mdt_review_date_12m
        description: Latest actual annual MDT review date within the inclusive trailing 12 months; null if absent.
      - name: moc_mdt_review_completed_fy
        description: 'Project financial-year measure, since 1 April: MDT Review completed in the current financial year to
          date for HRCS/HRS pathways'
      - name: moc_mdt_review_date_fy
        description: 'Project financial-year measure, since 1 April: Latest MDT Review date in the current financial year
          to date for HRCS/HRS pathways'
      - name: moc_careplan_sharing_completed_12m
        description: 'Actual sharing activity: S strictly after the annual anniversary for HRCS/HRS/MRS; inclusive for LRS.'
      - name: moc_careplan_sharing_date_12m
        description: Latest Care Plan Sharing date in its stage window, all adult pathways
      - name: moc_careplan_sharing_completed_fy
        description: 'Project financial-year measure, since 1 April: Care Plan Sharing completed in the current financial
          year to date, all adult pathways'
      - name: moc_careplan_sharing_date_fy
        description: 'Project financial-year measure, since 1 April: Latest Care Plan Sharing date in the current financial
          year to date, all adult pathways'
      - name: moc_discussion_completed_12m
        description: Actual PCSP agreed event in the inclusive trailing 12 months. Declines do not count as activity.
      - name: moc_discussion_date_12m
        description: Latest Discussion date in the trailing 12 months
      - name: moc_discussion_completed_fy
        description: 'Project financial-year measure, since 1 April: Discussion completed in the current financial year to
          date'
      - name: moc_discussion_date_fy
        description: 'Project financial-year measure, since 1 April: Latest Discussion date in the current financial year
          to date'
      - name: moc_followup_completed_12m
        description: Actual PCSP review event in the inclusive trailing 12 months. Stage 4 completion also requires an
          agreed plan or a decline.
      - name: moc_followup_date_12m
        description: Latest Follow-up date in the trailing 12 months
      - name: moc_followup_completed_fy
        description: 'Project financial-year measure, since 1 April: Follow-up completed in the current financial year to
          date'
      - name: moc_followup_date_fy
        description: 'Project financial-year measure, since 1 April: Latest Follow-up date in the current financial year to
          date'

      # ============================================================
      # MOC: progression summary
      # ============================================================
      - name: moc_stage_completed
        description: Highest adult stage reached by recorded activity (0-4). Decline-accepted EMIS completion is in
          moc_stage_3_completed and moc_stage_4_completed. Zero for CYP-only children.
      - name: moc_stage_completed_label
        description: Label for moc_stage_completed. MR/LR stage 2 is Care Plan Sharing. Annual Review
          or Desktop Review for CYP evidence; Not started if absent.
        data_tests: []
      - name: moc_stage_completed_code
        description: 'Code for completed-stage label: C&T, MDT, CPS, DISC, F/U, AR or DTR; null when not started.'
        data_tests: []
      - name: moc_pathway_status
        description: "Declined (latest MoC event is a decline), Cycle complete, In progress (any recorded MoC activity in its window)
          or Not started. Work-list position is in moc_requires_* and moc_next_action."
        data_tests: []
      - name: moc_next_action
        description: First observation-based work list in stage order; Annual Review or Desktop Review for CYP-only children. Null when no list selects
          the person. Future care-plan diaries are unavailable in OLIDS.
        data_tests: []
      - name: moc_next_action_code
        description: 'Code for next action: C&T, MDT, CPS, DISC, F/U, AR or DTR; null when no work list selects the person.'
        data_tests: []
      - name: moc_cycle_complete
        description: 'Project measure: adults need an agreed plan and review within 12 months, latest MoC event a review, and
          no observation-based work list; CYP-only asthma children need the annual review, plus the desktop review if HR;
          Check & Test-only people need the C&T.'

      # ============================================================
      # MOC: data quality - missing prior stages
      # ============================================================
      - name: moc_missing_check_test
        description: True if a later stage is recorded but Check & Test is absent in the last 12m
      - name: moc_missing_stage_2
        description: True if discussion or follow-up is recorded but stage 2 is absent in the last 12m
      - name: moc_missing_discussion
        description: True if follow-up is recorded but discussion is absent in the last 12m
      - name: moc_has_missing_priors
        description: True if the person has reached a later stage but is missing any earlier stage in the last 12m

      # ============================================================
      # MOC: stage durations (days)
      # ============================================================
      - name: moc_days_check_test_to_stage_2
        description: Days between check & test and stage 2 (null if either missing; negative if out of order)
      - name: moc_days_stage_2_to_discussion
        description: Days between stage 2 and discussion (null if either missing; negative if out of order)
      - name: moc_days_discussion_to_followup
        description: Days between discussion and follow-up (null if either missing; negative if out of order)
      - name: moc_days_check_test_to_followup
        description: End-to-end MOC cycle duration in days (check & test → follow-up)

      # ============================================================
      # MOC: expiry dates
      # ============================================================
      - name: moc_careplan_expires_date
        description: Last valid day of the inclusive PCSP-agreed 12-month window; null without valid activity. Accounts
          for leap-year clipping.
      - name: moc_next_expiry_date
        description: Earliest last valid day among currently qualifying pathway events. Strict windows expire before the
          anniversary; inclusive windows include it, with leap-year clipping.

      # ============================================================
      # Outcome: hypertension BP control
      # ============================================================
      - name: is_htn_bp_control_eligible
        description: In the ICS_HTN_21 outcome denominator. Count eligible active people for the denominator and htn_bp_controlled_rolling or _fy for the numerator.
        data_tests:
          - not_null
      - name: htn_bp_controlled_rolling
        description: "Current position (ICS_HTN_21): true if the last BP in the last 12 months is below the NICE target (clinic
          < 140/90, home/ABPM < 135/85; aged 80+ clinic < 150/90, home/ABPM < 145/85). Null outside the denominator: not on
          the HTN register, or excluded for age 90+, end of life care, care home or moderate/severe frailty. False if in the
          denominator with no reading in the window."
      - name: htn_bp_control_rolling_has_reading
        description: True if the person has a paired BP reading in the last 12 months. Null outside the ICS_HTN_21
          denominator.
      - name: htn_bp_control_rolling_bp_date
        description: Date of the last known paired BP reading in the trailing 12 months (null if none / outside the
          ICS_HTN_21 denominator)
      - name: htn_bp_control_rolling_systolic
        description: Systolic value (mmHg) of the last known reading in the trailing 12 months
      - name: htn_bp_control_rolling_diastolic
        description: Diastolic value (mmHg) of the last known reading in the trailing 12 months
      - name: htn_bp_controlled_fy
        description: "Current financial year (ICS_HTN_21): true if the last BP since 1 April is below the NICE target (as
          htn_bp_controlled_rolling). Null outside the denominator. False if in the denominator with no reading in the window."
      - name: htn_bp_control_fy_has_reading
        description: True if the person has a paired BP reading in the current FY. Null outside the ICS_HTN_21
          denominator.
      - name: htn_bp_control_fy_bp_date
        description: Date of the last known paired BP reading in the current FY (null if none / outside the ICS_HTN_21
          denominator)
      - name: htn_bp_control_fy_systolic
        description: Systolic value (mmHg) of the last known reading in the current FY
      - name: htn_bp_control_fy_diastolic
        description: Diastolic value (mmHg) of the last known reading in the current FY

      # ============================================================
      # Metadata
      # ============================================================
      - name: table_refresh_date
        description: Timestamp when the row was built
      - name: moc_mdt_review_completed
        description: Annual MDT review event in the inclusive trailing 12 months, HRCS/HRS only; separate from stage 2
          completion.
      - name: moc_mdt_review_date
        description: Latest actual annual MDT review date within the inclusive trailing 12 months; null if absent.
      - name: moc_stage_1_completed
        description: Adult pathway C&T completion, using its strict or inclusive annual window. Includes Check & Test-only
          people; false for CYP-only people.
      - name: moc_stage_3_completed
        description: 'Adult stage 3: agreed plan or decline in the inclusive trailing 12 months. No stage 1 or 2 prerequisite.'
      - name: moc_stage_4_completed
        description: 'Adult stage 4: decline, or both agreed plan and review in the inclusive trailing 12 months. No stage
          1 or 2 prerequisite.'
      - name: moc_requires_check_test
        description: Observation-based EMIS stage 1 list. Old C&T can require a new C&T despite a more recent decline.
          Check & Test-only people are listed when moc_check_test_completed is false.
      - name: moc_requires_stage_2
        description: Latest E in the inclusive trailing 12 months is C, strictly after the annual anniversary. Future
          diaries are unavailable.
      - name: moc_requires_mdt_review
        description: HRCS/HRS stage 2 list with no MDT strictly after the 12-month anniversary.
      - name: moc_requires_careplan_sharing
        description: MRS/LRS stage 2 list, or HRCS/HRS stage 2 list with MDT strictly after the anniversary and no
          sharing on or after it.
      - name: moc_requires_discussion
        description: Latest E in the inclusive trailing 12 months is S. Future diaries are unavailable.
      - name: moc_requires_followup
        description: Latest E is not D/R/C/S and latest E plus offered in the inclusive trailing 12 months is A. Future
          diaries are unavailable.
      - name: moc_ct_overdue
        description: Latest C strictly within 12 months, latest B is C, and C is more than 42 days old. B is C/A/R/D/O
          across all history.
      - name: moc_discussion_overdue
        description: No C on or before the 12-month anniversary, latest B is A, and A is more than 3 months old. B is
          C/A/R/D/O across all history.
      - name: cyp_annual_review_completed
        description: CYP-only annual asthma review strictly after the one-year anniversary. False for adult pathways.
      - name: cyp_requires_annual_review
        description: CYP-only person without an annual asthma review strictly after the one-year anniversary.
      - name: cyp_desktop_review_completed
        description: 'CYP-only HR: latest desktop review or latest annual review, after the annual anniversary
          with another AR/DTR in [review minus 3 months, review minus 1 day). Requires desktop review follows the HR description; see cyp_requires_desktop_review.'
      - name: cyp_annual_review_date
        description: Latest non-future CYP-only asthma annual review date; may be outside the completed window. Null for
          adult pathways or no event.
      - name: cyp_desktop_review_date
        description: Latest qualifying CYP-only HR desktop review or linked annual review date; null without completion
          or for other pathways.
      - name: is_in_moc_base
        description: In the full adult MoC base after the EMIS exclusions; use for figures matching EMIS MoC searches. False for CYP-only asthma and Check & Test-only rows.
      - name: moc_base_exclusion_reason
        description: Why the person is outside the full adult MoC - CYP asthma only, LR hypertension only or LR adult asthma only. Null for the MoC base.
      - name: is_cyp_asthma_only
        description: True for children on the CYP asthma register only (EMIS CYPAST pathway). Their MoC steps are the
          annual review and, for HR, the desktop review; adult stage columns are false for them.
      - name: is_moc_check_test_only
        description: True for LR hypertension-only and LR adult-asthma-only people. Outside the EMIS MoC base; the programme requires only the annual Check & Test, so other stage columns are false and the cycle completes with the C&T.
      - name: is_type_1_diabetes_hrc
        description: Qualifies for the separate EMIS Type 1 HRC rule; not added to diabetes_risk_group.
