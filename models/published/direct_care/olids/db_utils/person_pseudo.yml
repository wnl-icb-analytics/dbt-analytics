models:
  - name: person_pseudo
    description: >-
      Direct-care HxFlake pseudonyms for NCL OLIDS people with a mapped sk_patient_id,
      one row per person. hx_flake reversibly represents sk_patient_id in XX-XXX-XXX
      format for re-identification. People sharing a patient key can share a pseudonym.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Unique person identifier'
        tests:
          - not_null
          - unique

      - name: sk_patient_id
        description: 'Surrogate key for patient record used in pseudonym generation'
        tests:
          - not_null

      - name: hx_flake
        description: 'Pseudonymized hex key in format XX-XXX-XXX for patient re-identification. Note: Multiple person_ids may share the same hx_flake when they share the same sk_patient_id (patient fragmentation).'
        tests:
          - not_null
          - unique:
              config:
                severity: warn
                warn_if: ">100"