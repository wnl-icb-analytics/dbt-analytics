models:
  - name: metadata_refresh_dates
    description: >-
      OLIDS freshness dates and warehouse table metadata. One row represents either the
      global data-refresh metric or one base table identified by database, schema and table
      name. The global metric is the latest observation date before the build date and
      within the preceding three months represented at least 150 practices in dim_practice.
      Table rows cover all base tables in the direct-care published database and OLIDS_*
      schemas in reporting and modelling. last_altered_timestamp is Snowflake object
      metadata and does not prove when source records arrived.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: metric_type
        description: Type of metric (global_data_refresh or table_refresh)

      - name: database_name
        description: Snowflake database name (NULL for global metrics)

      - name: schema_name
        description: Snowflake schema name (NULL for global metrics)

      - name: table_name
        description: Table name (NULL for global metrics)

      - name: refresh_date
        description: Date when data was last refreshed (date portion of last_altered_timestamp for tables)

      - name: last_altered_timestamp
        description: Timestamp when table was last modified (from Snowflake metadata, NULL for global metrics)