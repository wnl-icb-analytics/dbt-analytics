models:
  - name: metadata_refresh_dates
    description: >-
      Data freshness and table metadata, one row for the NCL OLIDS refresh metric or for
      each warehouse base table. The refresh metric is the latest date in the preceding
      three months, before the build date, with observations from at least 150
      practices. Table rows cover the direct-care published database and OLIDS_* schemas
      in reporting and modelling. Snowflake modification timestamps describe table
      changes rather than source-data arrival.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: metric_type
        description: Type of metric (global_data_refresh or table_refresh)

      - name: database_name
        description: Snowflake database name (NULL for global metrics)

      - name: schema_name
        description: Snowflake schema name (NULL for global metrics)

      - name: table_name
        description: Table name (NULL for global metrics)

      - name: refresh_date
        description: Date when data was last refreshed (date portion of last_altered_timestamp for tables)

      - name: last_altered_timestamp
        description: Timestamp when table was last modified (from Snowflake metadata, NULL for global metrics)