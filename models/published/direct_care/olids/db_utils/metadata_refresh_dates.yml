models:
  - name: metadata_refresh_dates
    description: >-
      NCL OLIDS data freshness and warehouse table metadata. One row
      represents either the global data-refresh metric or one base table
      identified by database, schema and table name. The global metric is the
      latest date in the preceding three months, before the build date, on
      which at least 150 practices in dim_practice have an observation. Table
      rows cover all base tables in the direct-care published database and
      OLIDS_* schemas in reporting and modelling. last_altered_timestamp is
      Snowflake object metadata and does not prove when source records
      arrived. The NCL scope applies to the data-refresh metric; table
      metadata covers the configured warehouse databases and schemas.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: metric_type
        description: Type of metric (global_data_refresh or table_refresh)

      - name: database_name
        description: Snowflake database name (NULL for global metrics)

      - name: schema_name
        description: Snowflake schema name (NULL for global metrics)

      - name: table_name
        description: Table name (NULL for global metrics)

      - name: refresh_date
        description: Date when data was last refreshed (date portion of last_altered_timestamp for tables)

      - name: last_altered_timestamp
        description: Timestamp when table was last modified (from Snowflake metadata, NULL for global metrics)