models:
  - name: pds_olids_reg_pass_direct_care
    description: >
      Practices whose OLIDS registration count is within 2% of PDS or differs by fewer
      than 5 people. One row per practice. Use for inner joins to keep practices with
      validated registration data. Practices with no PDS count never pass. PDS counts are
      current registrations at open practices with ICB parent code 93C, for people with no
      death record or removal reason, after NHS number merger handling. OLIDS counts are
      current registrations from int_patient_registrations. match_quality is 'Excellent
      Match (<1%)' below 1% difference and 'Meets Criteria' otherwise.

    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 1
  - name: pds_olids_reg_fail_direct_care
    description: >
      Practices whose OLIDS registration count differs from PDS by at least 2% and at
      least 5 people, or that have no PDS count. One row per practice. Investigate before
      use. No PDS count means zero or missing, including OLIDS practices outside the PDS
      practice list. PDS counts are current registrations at open practices with ICB
      parent code 93C, for people with no death record or removal reason, after NHS number
      merger handling. OLIDS counts are current registrations from
      int_patient_registrations. issue_category is '20%+ Variance', '5-20% Variance' or
      '2-5% Variance' by absolute_percent_difference. Practices with no PDS count have
      absolute_percent_difference 0 and are labelled '2-5% Variance'.

    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
  - name: pds_olids_reg_comparison_all_direct_care
    description: |
      Complete PDS registration comparison for all practices with categorisation.

      Categories: Major Difference (≥20%), Minor Difference (5-20%), Good Match (<5%), No Data

      Methodology: PDS All Registration Types Comparison using merged NHS numbers

    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
  - name: emis_olids_reg_pass_direct_care
    description: |
      Practices passing EMIS Regular registration count validation.

      Use this for inner joins to filter datasets to practices with validated Regular registration data.

      Validation: <2% variance OR <5 persons difference
      Snapshot: Dynamic (from EMIS extract date)
      Registration Type: Regular only (excludes Temporary, Emergency, etc.)

    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
  - name: emis_olids_reg_fail_direct_care
    description: |
      Practices failing EMIS Regular registration count validation.

      These practices require investigation before use in analyses.

      Issue Categories: 2-5% Variance, 5-20% Variance, 20%+ Variance, Missing Data

      Validation: ≥2% variance AND ≥5 persons difference
      Snapshot: Dynamic (from EMIS extract date)
      Registration Type: Regular only

    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
  - name: emis_olids_reg_comparison_all_direct_care
    description: |
      Complete EMIS Regular registration comparison for all practices using acceptance criteria.

      Categories: Meets Criteria, 2-5% Variance, 5-20% Variance, 20%+ Variance, Missing Data

      Acceptance Criteria:
      - Aggregate: <1% variance across all practices
      - Per-practice: <2% variance OR <5 persons difference

      Snapshot: Dynamic (from EMIS extract date)
      Registration Type: Regular only

    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
  - name: emis_olids_reg_aggregate_validation_direct_care
    description: |
      Aggregate-level validation of OLIDS Regular registrations against EMIS list size.

      Returns a single row showing whether the overall system meets the <1% variance acceptance criteria.

      Acceptance Criteria: <1% variance in aggregate across all practices
      Snapshot: Dynamic (from EMIS extract date)

    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1