models:
  - name: childhood_imms_max_gp_vacc_child_dm
    description: >
      Latest recorded childhood immunisation date by practice. One row per practice
      borough, practice code and practice name (gp_name), from
      int_childhood_imms_person_level_child (currently registered children aged under 11).
      latest_vaccination_date is the latest date across the children's 6-in-1, MenB,
      rotavirus, PCV, Hib/MenC, MMR, MMRV and 4-in-1 dose dates; these dates include
      declined and contraindicated records as well as administrations. The model holds no
      completion metrics.

    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1