models:
  - name: childhood_imms_max_gp_vacc_child_dm
    description: >
      Latest recorded immunisation date per practice for registered children under 11. Dates
      include declines and contraindications, so this is not a completion metric. One row
      per practice borough, practice code and gp_name. latest_vaccination_date covers
      6-in-1, MenB, rotavirus, PCV, Hib/MenC, MMR, MMRV and 4-in-1 dose dates.

    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1