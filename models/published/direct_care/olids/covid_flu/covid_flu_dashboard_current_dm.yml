models:
  - name: covid_flu_dashboard_current_dm
    description: >-
      Direct-care COVID and flu dashboard data for reported campaigns starting
      on or after 1 September 2025. The OLIDS population comes from NCL GP
      records. One row per person, programme, campaign, risk group and
      subcohort from int_covid_flu_dashboard_current. Includes the campaign
      population and vaccination activity retained by fct_covid_flu_uptake,
      restricted to people with matching current demographics. Demographics,
      practice and school stages use current available records. Clinical risk
      flags apply to each programme and campaign. People can appear in several
      groups and campaigns, so rows must not be summed as distinct people.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null