models:
  - name: covid_flu_dashboard_current_dm
    description: >-
      Direct-care COVID and flu dashboard for OLIDS campaigns starting on or after 1
      September 2025. One row per person, programme, campaign, risk group and
      subcohort, with matching demographics. Population, eligibility, vaccination and
      risk flags follow each campaign's rules; demographics, practice and school stage
      use current records. People can appear in several groups and campaigns, so use
      distinct-person counts for headcounts.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null