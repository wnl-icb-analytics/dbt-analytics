models:
  - name: covid_flu_historic_2024_2026_dm
    description: >-
      Historical direct-care COVID and flu dashboard data, one row per person, programme,
      campaign, risk group and subcohort from int_covid_flu_historic_dashboard. Covers
      reported campaigns with a reference date on or before 30 June 2026. Eligibility and
      vaccination status follow each campaign's population and evidence rules in
      fct_covid_flu_uptake, including people who have since left a practice or died.
      Requires a matching current demographic record. Demographics, practice, school stages
      and housebound status are refreshed from current records, so this is not a frozen June
      2026 snapshot. Clinical risk flags apply to each programme and campaign.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null