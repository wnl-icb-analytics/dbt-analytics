models:
  - name: covid_flu_historic_2024_2026_dm
    description: >-
      Historical direct-care COVID and flu dashboard for NCL OLIDS campaigns with a
      reference date on or before 30 June 2026. One row per person, programme, campaign,
      risk group and subcohort, with matching demographics. Population, eligibility,
      vaccination and risk flags follow each campaign's rules, including people who have
      since left or died. Demographics, practice, school stage and housebound status use
      current records, so this is not a frozen June 2026 snapshot.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null