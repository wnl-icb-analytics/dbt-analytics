models:
  - name: cltcs_measurements
    description: >
      Biomarker measurements from the last 5 years for patients in cltcs_patient_list, one
      row per measurement_id and measurement_type. Types are HbA1c, systolic and diastolic
      blood pressure, eGFR, urine ACR, total and LDL cholesterol, eosinophil count and
      eosinophil percentage. HbA1c, eGFR, urine ACR and cholesterol keep only results
      flagged valid upstream. Blood pressure and eosinophil results have no validity filter.
      One row is kept per patient, type, date and value. HbA1c is reported in IFCC mmol/mol,
      and IFCC results are preferred over DCCT results on the same date.
    config:
      meta:
        owner:
          name: Emily Baldwin
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - measurement_id
              - measurement_type
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: patient_id
        data_type: number
        description: "Unique patient identifier from commissioning data [sk_patient_id]"

      - name: area_code
        data_type: varchar
        description: "Area code (PCN of registered GP practice in this context)"

      - name: measurement_id
        data_type: number
        description: "Unique measurement identifier from OLIDS data within the context of the measurement type [id]"

      - name: clinical_effective_date
        data_type: timestamp_ntz
        description: "Date of the measurement"

      - name: value
        data_type: number
        description: "Value of the measurement"

      - name: category
        data_type: varchar
        description: "Clinical category of the measurement"

      - name: colour_mapping
        data_type: number
        description: "Numeric colour mapping derived from category. Value 10 indicates an unmapped category."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<> 10"
              config:
                severity: warn

      - name: measurement_type
        data_type: varchar
        description: "Type of measurement"