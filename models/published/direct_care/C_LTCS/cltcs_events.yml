models:
  - name: cltcs_events
    description: "Event-level data for C-LTCS cohort over a rolling 2 years. SUS (AE, OP), GP appointments, and APC spells (sourced from int_sus_apc_imputed_spells for end-date imputation and dedup). One row per event."
    config:
      meta:
        owner:
          name: Emily Baldwin
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - event_type
              - event_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: patient_id
        data_type: number
        description: "Unique patient identifier from commissioning data [sk_patient_id]"
        data_tests:
          - not_null

      - name: area_code
        data_type: varchar
        description: "Area code (PCN of registered GP practice in this context)"
        data_tests:
          - not_null

      - name: event_start_date
        data_type: date
        description: "Start date of the event"
        data_tests:
          - not_null

      - name: event_end_date
        data_type: date
        description: "End date of the event. Never null: point events (OP, GP, AE with no departure) use the start date; APC spells use the discharge date, imputed from median duration where missing (see is_end_date_imputed)."
        data_tests:
          - not_null

      - name: event_type
        data_type: varchar
        description: "Type of event (e.g. SUS AE, APC, OP visit, GP Appointment)"
        data_tests:
          - not_null

      - name: event_detail
        data_type: varchar
        description: "Event-level detail (e.g. POD, admission method, slot category)"

      - name: event_id
        data_type: varchar
        description: "Event identifier (visit_occurrence_id or encounter_id from source)"
        data_tests:
          - not_null

      - name: is_end_date_imputed
        data_type: boolean
        description: "True when the source end date was missing and has been imputed (APC: from int_sus_apc_imputed_spells.dq_end_date; AE: no recorded departure). Point events (OP, GP) are always false. Used by the app to flag spells whose duration is estimated."
        data_tests:
          - not_null