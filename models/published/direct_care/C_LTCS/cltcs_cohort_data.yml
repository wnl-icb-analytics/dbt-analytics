
models:
  - name: cltcs_cohort_data
    description: "Expanded cohort-level dataset for C-LTCS. One row per eligible patient with trajectories, practice and demographic fields, condition flags, risk factors, activity, waiting list metrics, polypharmacy, care pathway gaps (per domain, group and item, from cltcs_gap_summary) and scores."
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: patient_id
        data_type: number
        description: "Unique patient identifier from commissioning data [sk_patient_id]"
        data_tests:
          - unique:
              config:
                severity: warn
                warn_if: ">1"
          - not_null

      - name: area_code
        data_type: varchar
        description: "C-LTCS local neighbourhood code of the patient's registered practice; shortlisted patients keep the shortlist area. Not a PCN code"

      - name: meets_original_criteria
        data_type: boolean
        description: "Whether the patient meets the original C-LTCS inclusion criteria, from cltcs_patient_list. Null means not assessed (patient's row came from the shortlist), not false."

      - name: meets_adults_with_complexity
        data_type: boolean
        description: "Whether the patient is in the Adults with Complexity cohort, from cltcs_patient_list. Null means not assessed (patient's row came from the shortlist), not false."

      - name: practice_code
        data_type: varchar
        description: "Current registered GP practice ODS code"

      - name: practice_name
        data_type: varchar
        description: "Current registered GP practice name"

      - name: age
        data_type: number
        description: "Patient age in years"

      - name: main_language
        data_type: varchar
        description: "Patient primary spoken language"

      - name: gender
        data_type: varchar
        description: "Patient gender"

      - name: ethnicity_category
        data_type: varchar
        description: "Patient ethnicity category"

      - name: main_language_flag
        data_type: number
        description: "Flag indicating main language is not English or Not Recorded (1=yes, 0=no)"

      - name: ae_encounters_sl
        data_type: array
        description: "18‑month sparkline array of A&E encounters"

      - name: ip_encounters_sl
        data_type: array
        description: "18‑month sparkline array of inpatient encounters"

      - name: op_encounters_sl
        data_type: array
        description: "18‑month sparkline array of outpatient encounters"

      - name: gp_encounters_sl
        data_type: array
        description: "18‑month sparkline array of GP encounters"

      - name: has_atrial_fibrillation
        data_type: boolean
        description: "Flag for atrial fibrillation"

      - name: has_asthma
        data_type: boolean
        description: "Flag for asthma"

      - name: has_cancer
        data_type: boolean
        description: "Flag for cancer"

      - name: has_coronary_heart_disease
        data_type: boolean
        description: "Flag for coronary heart disease"

      - name: has_chronic_kidney_disease
        data_type: boolean
        description: "Flag for chronic kidney disease"

      - name: has_copd
        data_type: boolean
        description: "Flag for COPD"

      - name: has_cyp_asthma
        data_type: boolean
        description: "Flag for CYP asthma"

      - name: has_dementia
        data_type: boolean
        description: "Flag for dementia"

      - name: has_depression
        data_type: boolean
        description: "Flag for depression"

      - name: has_diabetes
        data_type: boolean
        description: "Flag for diabetes"

      - name: has_epilepsy
        data_type: boolean
        description: "Flag for epilepsy"

      - name: has_familial_hypercholesterolaemia
        data_type: boolean
        description: "Flag for familial hypercholesterolaemia"

      - name: has_gestational_diabetes
        data_type: boolean
        description: "Flag for gestational diabetes"

      - name: has_frailty
        data_type: boolean
        description: "Flag for frailty"

      - name: has_heart_failure
        data_type: boolean
        description: "Flag for heart failure"

      - name: has_hypertension
        data_type: boolean
        description: "Flag for hypertension"

      - name: has_learning_disability
        data_type: boolean
        description: "Flag for learning disability"

      - name: has_learning_disability_under_14
        data_type: boolean
        description: "Learning disability for children under 14 (specialist settings cohort)"

      - name: has_nafld
        data_type: boolean
        description: "Flag for non‑alcoholic fatty liver disease"

      - name: has_non_diabetic_hyperglycaemia
        data_type: boolean
        description: "Flag for non‑diabetic hyperglycaemia"

      - name: has_obesity
        data_type: boolean
        description: "Flag for obesity"

      - name: has_osteoporosis
        data_type: boolean
        description: "Flag for osteoporosis"

      - name: has_peripheral_arterial_disease
        data_type: boolean
        description: "Flag for peripheral arterial disease"

      - name: has_palliative_care
        data_type: boolean
        description: "Flag for inclusion on palliative care register"

      - name: has_rheumatoid_arthritis
        data_type: boolean
        description: "Flag for rheumatoid arthritis"

      - name: has_severe_mental_illness
        data_type: boolean
        description: "Flag for severe mental illness"

      - name: has_stroke_tia
        data_type: boolean
        description: "Flag for stroke/TIA"

      - name: has_multiple_sclerosis
        data_type: boolean
        description: "Flag for multiple sclerosis"

      - name: has_osteoarthritis
        data_type: boolean
        description: "Flag for osteoarthritis"

      - name: has_parkinsons
        data_type: boolean
        description: "Flag for Parkinson's disease"

      - name: frailty_register_latest_severity
        data_type: varchar
        description: >
          Severity (Mild, Moderate or Severe) of the most recent coded frailty finding
          on the frailty register (fct_person_frailty_register). Null when the patient
          has never had a coded frailty severity. Check frailty_register_latest_date
          for how current it is.

      - name: frailty_register_latest_date
        data_type: date
        description: "Date of the most recent coded frailty severity on the frailty register. Null when there is none."

      - name: efi_date
        data_type: date
        description: >
          Date the eFI2 score and category were calculated to (end_date in
          fct_person_efi2). Null when the patient has no eFI2 score, for example
          under-65s.

      - name: rockwood_latest_date
        data_type: date
        description: >
          Date of the latest Rockwood Clinical Frailty Scale assessment
          (int_rockwood_latest), the assessment behind frailty_level and
          frailty_category. Null when there is none.

      - name: frailty_severity
        data_type: number
        description: >
          Combined frailty severity used in the C-LTCS frailty score, from
          cltcs_score_frailty: 0 fit or robust, 1 mild (Clinical Frailty Scale 4-5),
          2 moderate (CFS 6), 3 severe (CFS 7-9). A clinician assessment within 24
          months is used as recorded; an older one can be raised by eFI2; eFI2 alone
          is used only without a clinician assessment. Null when there is no evidence
          or the patient was not scored; null is not the same as fit.

      - name: frailty_evidence_source
        data_type: varchar
        description: >
          Evidence behind frailty_severity: clinical_current, clinical_stale,
          clinical_stale_efi2_higher, efi2_fallback or not_assessed. See
          cltcs_score_frailty. Null when the patient was not scored, for example rows
          from the shortlist.

      - name: clinical_frailty_assessed_date
        data_type: date
        description: >
          Date of the latest clinician frailty assessment (Rockwood or coded
          severity). Null when there is none. Assessments over 24 months old may need
          repeating.

      - name: has_unassessed_frailty_signal
        data_type: boolean
        description: >
          True when eFI2 is moderate or severe and there is no clinician frailty
          assessment (Rockwood or coded frailty severity) in the last 24 months, so a
          Clinical Frailty Scale assessment is suggested. Includes people never
          assessed and people whose last assessment is older than 24 months. eFI2
          covers patients aged 65 and over only, so younger patients are never
          flagged. This is an action prompt and does not feed the C-LTCS scores. Null
          when the patient was not scored, for example rows from the shortlist.

      - name: total_conditions
        data_type: number
        description: "Total count of long‑term conditions"

      - name: total_qof_conditions
        data_type: number
        description: "Total count of QOF long‑term conditions"

      - name: total_non_qof_conditions
        data_type: number
        description: "Total count of non‑QOF long‑term conditions"

      - name: cardiovascular_conditions
        data_type: number
        description: "Count of cardiovascular conditions"

      - name: respiratory_conditions
        data_type: number
        description: "Count of respiratory conditions"

      - name: mental_health_conditions
        data_type: number
        description: "Count of mental health conditions"

      - name: metabolic_conditions
        data_type: number
        description: "Count of metabolic conditions"

      - name: musculoskeletal_conditions
        data_type: number
        description: "Count of musculoskeletal conditions"

      - name: neurology_conditions
        data_type: number
        description: "Count of neurology conditions"

      - name: geriatric_conditions
        data_type: number
        description: "Count of geriatric conditions"

      - name: qadmissions_score_percent
        data_type: float
        description: >
          QAdmissions predicted risk of an emergency admission within one year, as a
          percentage (0-100), from qadmissions_predictions. Null when the patient was
          not scored: outside ages 18-100, sex not recorded as male or female, or
          inputs rejected. Any display of this score must show the ClinRisk
          disclaimer required by the QAdmissions licence (see
          qadmissions_input_features).

      - name: qadmissions_is_scored
        data_type: boolean
        description: >
          True when QAdmissions produced a score, false when it rejected the inputs.
          Null when the patient is outside the QAdmissions population.

      - name: smoking_status
        data_type: varchar
        description: "Latest recorded smoking status"

      - name: smoking_risk_sort_key
        data_type: number
        description: "Smoking risk sort key used in scoring"

      - name: bmi_category
        data_type: varchar
        description: "Latest BMI category"

      - name: bmi_value
        data_type: number
        description: "Latest BMI value"

      - name: bmi_risk_sort_key
        data_type: number
        description: "BMI risk sort key used in scoring"

      - name: alcohol_status
        data_type: varchar
        description: "Latest alcohol status"

      - name: alcohol_risk_sort_key
        data_type: number
        description: "Alcohol risk sort key used in scoring"

      - name: is_housebound
        data_type: boolean
        description: "Housebound status from dim_person_status_summary (false when not recorded)"

      - name: has_substance_misuse
        data_type: boolean
        description: "Latest illicit drug use record shows a misuse pattern (int_illicit_drug_use_latest; false when no record or 'Does not misuse drugs')"

      - name: is_currently_pregnant
        data_type: boolean
        description: "Flag indicating current pregnancy status"

      - name: asthma_testing_no_diagnosis
        data_type: boolean
        description: "Asthma management flag – testing without diagnosis"

      - name: asthma_diagnosis_no_testing
        data_type: boolean
        description: "Asthma management flag – diagnosis without testing"

      - name: asthma_diagnosis_no_act
        data_type: boolean
        description: "Asthma management flag – diagnosis without asthma control test"

      - name: asthma_salbutamol_only
