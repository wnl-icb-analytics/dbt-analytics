      - name: ae_tot_12mo
        data_type: number
        description: "Total A&E attendances in last 12 months"

      - name: ae_tot_3mo
        data_type: number
        description: "Total A&E attendances in last 3 months. Compared with a quarter of ae_tot_12mo, shows a recent rise in A&E use."

      - name: is_housebound
        data_type: boolean
        description: "Flag for housebound status, from dim_person_status_summary"

      - name: gp_att_tot_12mo
