models:
  - name: cltcs_observations
    description: >
      Coded GP observations, allergy records and referral requests for patients in the C-LTCS cohort. Rolling 1 year
      window with up to 100 most recent observations per patient when volume
      exceeds that cap. The cap applies across source entities, so a newer allergy or referral
      can displace an older observation. Sourced from stg_olids_observation (not concept-specific
      intermediate models). One row per retained source entity record. Snowflake table clustered
      on patient_id.
    config:
      meta:
        owner:
          name: Emily Baldwin
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - observation_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: patient_id
        data_type: number
        description: "Unique patient identifier from commissioning data [sk_patient_id]"
        data_tests:
          - not_null

      - name: area_code
        data_type: varchar
        description: "Area code (Neighbourhood of registered GP practice in this context)"
        data_tests:
          - not_null

      - name: olids_id
        data_type: varchar
        description: "Unique patient identifier from OLIDS data [person_id]"

      - name: observation_id
        data_type: varchar
        description: "Conformed observation identifier, unique across source entities [stg_olids_observation.id]"
        data_tests:
          - not_null
          - unique

      - name: source_entity
        description: Original OLIDS entity, observation, allergy_intolerance or referral_request.
      - name: source_record_id
        description: Original UUID within source_entity. Use observation_id to join the expanded
          observation feed; use this field with source_entity to trace the original record.
      - name: allergy_medication_name
        description: Medication name recorded on the source allergy record. Null for other entities or
          when absent. Retained separately from observation result text.

      - name: clinical_effective_date
        data_type: timestamp_ntz
        description: >
          Date of the observation. When the raw clinical_effective_date is later
          than date_recorded, date_recorded is used as a data quality fallback
          (mirrors the get_observations macro behaviour).
        data_tests:
          - not_null

      - name: mapped_concept_code
        data_type: varchar
        description: "Mapped concept code (typically SNOMED-CT) for the observation"

      - name: mapped_concept_display
        data_type: varchar
        description: "Human-readable display for the mapped concept code"

      - name: result_value
        data_type: number
        description: "Numeric result value where applicable (NULL for non-numeric observations)"

      - name: result_text
        data_type: varchar
        description: "Free-text result where applicable"

      - name: result_unit_display
        data_type: varchar
        description: "Display label for the unit of the result value (e.g. mmol/mol, mmHg)"

      - name: is_problem
        data_type: boolean
        description: >
          Source flag indicating whether the observation row represents a
          problem/diagnosis (TRUE). Null means the flag is unavailable or not applicable,
          including allergy and referral request rows. Retained unfiltered so consumers can
          decide whether to treat problem rows as duplicates of dated events.

      - name: episodicity_display
        data_type: varchar
        description: >
          Resolved display value for the observation episodicity concept
          (e.g. New, Review, Ended). Falls back to the raw episodicity_source_concept_id
          when no primary concept map match is found.

      - name: practitioner_title
        data_type: varchar
        description: "Title of the recording practitioner (e.g. Dr, Mrs)"

      - name: practitioner_first_name
        data_type: varchar
        description: "First name of the recording practitioner"

      - name: practitioner_last_name
        data_type: varchar
        description: "Last name of the recording practitioner"
