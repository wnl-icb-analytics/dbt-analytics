models:
  - name: cltcs_observations
    description: >
      Coded GP observations for patients in the C-LTCS cohort. Rolling 1 year
      window with up to 100 most recent observations per patient when volume
      exceeds that cap. Sourced from stg_olids_observation (not concept-specific
      intermediate models). One row per observation. Snowflake table clustered
      on patient_id.
    config:
      meta:
        owner:
          name: Emily Baldwin
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - observation_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: patient_id
        data_type: number
        description: "Unique patient identifier from commissioning data [sk_patient_id]"
        data_tests:
          - not_null

      - name: area_code
        data_type: varchar
        description: "Area code (Neighbourhood of registered GP practice in this context)"
        data_tests:
          - not_null

      - name: olids_id
        data_type: varchar
        description: "Unique patient identifier from OLIDS data [person_id]"

      - name: observation_id
        data_type: varchar
        description: "Unique observation identifier from OLIDS data [stg_olids_observation.id]"
        data_tests:
          - not_null
          - unique

      - name: clinical_effective_date
        data_type: timestamp_ntz
        description: >
          Date of the observation. When the raw clinical_effective_date is later
          than date_recorded, date_recorded is used as a data quality fallback
          (mirrors the get_observations macro behaviour).
        data_tests:
          - not_null

      - name: mapped_concept_code
        data_type: varchar
        description: "Mapped concept code (typically SNOMED-CT) for the observation"

      - name: mapped_concept_display
        data_type: varchar
        description: "Human-readable display for the mapped concept code"

      - name: result_value
        data_type: number
        description: "Numeric result value where applicable (NULL for non-numeric observations)"

      - name: result_text
        data_type: varchar
        description: "Free-text result where applicable"

      - name: result_unit_display
        data_type: varchar
        description: "Display label for the unit of the result value (e.g. mmol/mol, mmHg)"

      - name: is_problem
        data_type: boolean
        description: >
          Source flag indicating whether the observation row represents a
          problem/diagnosis (TRUE) rather than a discrete clinical event
          (FALSE / NULL). Retained unfiltered so downstream consumers can
          decide whether to treat problem rows as duplicates of dated events.

      - name: episodicity_display
        data_type: varchar
        description: >
          Resolved display value for the observation episodicity concept
          (e.g. New, Review, Ended). Falls back to the raw episodicity_source_concept_id
          when no primary concept map match is found.

      - name: practitioner_title
        data_type: varchar
        description: "Title of the recording practitioner (e.g. Dr, Mrs)"

      - name: practitioner_first_name
        data_type: varchar
        description: "First name of the recording practitioner"

      - name: practitioner_last_name
        data_type: varchar
        description: "Last name of the recording practitioner"

unit_tests:
  - name: cltcs_observations_preserves_placeholder_recorded_date
    model: cltcs_observations
    given:
      - input: ref('cltcs_patient_list')
        format: sql
        rows: |
          SELECT 'SYN_PAT'::VARCHAR AS patient_id, 'SYN_AREA'::VARCHAR AS area_code,
            -18008::NUMBER AS olids_id
      - input: ref('stg_olids_observation')
        format: sql
        rows: |
          SELECT 'SYN_CLTCS'::VARCHAR AS id, -18008::NUMBER AS person_id,
            DATEADD(day, -30, CURRENT_DATE())::TIMESTAMP_NTZ AS clinical_effective_date,
            '1899-12-31'::TIMESTAMP_NTZ AS date_recorded,
            'SYN_CODE'::VARCHAR AS mapped_concept_code,
            'Synthetic observation'::VARCHAR AS mapped_concept_display,
            NULL::NUMBER AS result_value, NULL::VARCHAR AS result_text,
            NULL::VARCHAR AS result_unit_display, NULL::BOOLEAN AS is_problem,
            NULL::VARCHAR AS episodicity_source_concept_id, NULL::VARCHAR AS practitioner_id
      - input: ref('stg_olids_practitioner')
        format: sql
        rows: |
          SELECT NULL::VARCHAR AS id, NULL::VARCHAR AS surname,
            NULL::VARCHAR AS first_name, NULL::VARCHAR AS title WHERE FALSE
      - input: ref('stg_olids_concept_map')
        format: sql
        rows: |
          SELECT NULL::VARCHAR AS source_concept_id, NULL::VARCHAR AS target_concept_id,
            NULL::BOOLEAN AS is_primary WHERE FALSE
      - input: ref('stg_olids_concept')
        format: sql
        rows: |
          SELECT NULL::VARCHAR AS concept_id, NULL::VARCHAR AS display WHERE FALSE
    expect:
      format: sql
      rows: |
        SELECT 'SYN_CLTCS'::VARCHAR AS observation_id,
          DATEADD(day, -30, CURRENT_DATE())::TIMESTAMP_NTZ AS clinical_effective_date
    overrides:
      macros:
        get_empty_subquery_sql: >
          SELECT NULL::VARCHAR AS observation_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date WHERE FALSE
