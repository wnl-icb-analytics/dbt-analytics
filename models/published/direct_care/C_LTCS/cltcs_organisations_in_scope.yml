
models:
  - name: cltcs_organisations_in_scope
    description: >
      Neighbourhood and practice information for C-LTCS participating areas. One row per
      practice in the C-LTCS local neighbourhood mapping whose local authority is Haringey,
      Barnet, Islington, Camden or Enfield.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: practice_code
        data_type: varchar
        description: "Current registered GP practice ODS code"
        data_tests:
          - unique
          - not_null

      - name: practice_name
        data_type: varchar
        description: "Current registered GP practice name"

      - name: borough_registered
        data_type: varchar
        description: "Registered borough for the GP practice"

      - name: active_patient_count
        data_type: number
        description: "Count of active registered patients for the GP practice"

      - name: area_code
        data_type: varchar
        description: "C-LTCS neighbourhood code for the practice, from the C-LTCS local neighbourhood mapping"

      - name: area_name
        data_type: varchar
        description: "C-LTCS neighbourhood name for the practice"

      - name: area_borough
        data_type: varchar
        description: "Local authority used to select the practice into scope"

      - name: practice_msoa
        data_type: varchar
        description: "MSOA for the GP practice location"

      - name: practice_latitude
        data_type: number
        description: "Latitude of the GP practice"

      - name: practice_longitude
        data_type: number
        description: "Longitude of the GP practice"
