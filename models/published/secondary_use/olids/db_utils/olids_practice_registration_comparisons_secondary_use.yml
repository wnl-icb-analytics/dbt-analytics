models:
  - name: pds_olids_reg_pass_secondary_use
    description: >
      Practices passing the PDS versus OLIDS registration count check. Counts cover all
      registered patients with no opt-outs applied; there is no patient key. A practice
      passes when its OLIDS count is within 2% of PDS or differs by fewer than 5 people.
      Use for inner joins to keep practices with validated registration data. Practices
      with no PDS count never pass. PDS counts are current registrations at open practices
      with ICB parent code 93C, for people with no death record or removal reason, after
      NHS number merger handling. OLIDS counts are current registrations from
      int_patient_registrations. match_quality is 'Excellent Match (<1%)' below 1%
      difference and 'Meets Criteria' otherwise. National Data Opt-out and Type 1 opt-outs
      are not applied.

    config:
      meta:
        custom_message: "Practice-level PDS and OLIDS registration counts; no patient key. National Data Opt-out and Type 1 opt-outs are NOT applied: counts include all registered patients."
        owner:
          name: Eddie Davison
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 1
  - name: pds_olids_reg_fail_secondary_use
    description: >
      Practices failing the PDS versus OLIDS registration count check. Counts cover all
      registered patients with no opt-outs applied; there is no patient key. A practice
      fails when its OLIDS count differs from PDS by at least 2% and at least 5 people, or
      it has no PDS count. Investigate before use. No PDS count means zero or missing,
      including OLIDS practices outside the PDS practice list. PDS counts are current
      registrations at open practices with ICB parent code 93C, for people with no death
      record or removal reason, after NHS number merger handling. OLIDS counts are current
      registrations from int_patient_registrations. issue_category is '20%+ Variance',
      '5-20% Variance' or '2-5% Variance' by absolute_percent_difference. Practices with
      no PDS count have absolute_percent_difference 0 and are labelled '2-5% Variance'.

    config:
      meta:
        custom_message: "Practice-level PDS and OLIDS registration counts; no patient key. National Data Opt-out and Type 1 opt-outs are NOT applied: counts include all registered patients."
        owner:
          name: Eddie Davison
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
  - name: pds_olids_reg_comparison_all_secondary_use
    description: |
      Complete PDS registration comparison for all practices with categorisation (Secondary Use).

      Categories: Major Difference (≥20%), Minor Difference (5-20%), Good Match (<5%), No Data
      Counts cover all registered patients with no opt-outs applied; there is no patient key.

      Methodology: PDS All Registration Types Comparison using merged NHS numbers

      Note: EMIS comparisons are NOT available in secondary_use layer as EMIS data
      cannot be joined to opt-out tables (no sk_patient_id).

    config:
      meta:
        custom_message: "Practice-level PDS and OLIDS registration counts; no patient key. National Data Opt-out and Type 1 opt-outs are NOT applied: counts include all registered patients."
        owner:
          name: Eddie Davison
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1