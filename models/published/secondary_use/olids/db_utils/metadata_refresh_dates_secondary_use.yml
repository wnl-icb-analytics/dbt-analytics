models:
  - name: metadata_refresh_dates_secondary_use
    description: >-
      Data freshness and table metadata for secondary use, one row for the OLIDS
      refresh metric or for each warehouse base table. The refresh metric is the
      latest date in the preceding three months, before the build date, with
      observations from at least 150 practices. Table rows cover the secondary-use
      published database and OLIDS_* schemas in reporting and modelling. Snowflake
      modification timestamps describe table changes rather than source-data arrival.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1