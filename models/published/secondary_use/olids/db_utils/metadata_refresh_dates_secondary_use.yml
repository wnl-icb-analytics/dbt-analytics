models:
  - name: metadata_refresh_dates_secondary_use
    description: >-
      OLIDS freshness dates and warehouse table metadata for secondary use. One row
      represents either the global data-refresh metric or one base table identified by
      database, schema and table name. The global metric is the latest observation date
      before the build date and within the preceding three months represented at least 150
      practices in dim_practice. Table rows cover all base tables in the secondary-use
      published database and OLIDS_* schemas in reporting and modelling.
      last_altered_timestamp is Snowflake object metadata and does not prove when source
      records arrived.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1