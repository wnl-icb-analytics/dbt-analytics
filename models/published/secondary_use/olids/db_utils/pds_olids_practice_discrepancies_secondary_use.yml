models:
  - name: pds_olids_practice_discrepancies_secondary_use
    description: |
      One row per practice with a significant discrepancy (>=20%) between current
      PDS and OLIDS registration counts, as defined by
      int_pds_olids_practice_registration_comparison. An empty view is valid when
      no practices meet this threshold.

    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: practice_code
        description: GP practice ODS code.
        data_tests:
          - not_null
          - unique
