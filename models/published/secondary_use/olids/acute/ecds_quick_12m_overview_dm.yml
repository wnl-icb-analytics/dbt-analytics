models:
  - name: ecds_quick_12m_overview_dm
    description: >
      Final model in publishing layer for ECDS Quick Reports, rolling 12m view. This model is used to provide a summary of acute encounters over the last 12 months, including key metrics such as attendance counts and breach counts, aggregated by various dimensions such as financial year, month, commissioner group, and provider.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1