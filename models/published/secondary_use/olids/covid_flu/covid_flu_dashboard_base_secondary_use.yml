models:
  - name: covid_flu_dashboard_base_secondary_use
    description: >
      Unfiltered copy of covid_flu_dashboard_base for secondary use. National Data Opt-out
      and Type 1 opt-outs are not applied. One row per person, campaign and risk group.
      Config meta states it is published under a Section 251 exemption as a HealtheIntent
      replacement dashboard and is approved for that purpose only. Covers campaigns with a
      reference date on or before 30 June 2026. Includes the hx_flake pseudonym from
      person_pseudo. Column definitions are on covid_flu_dashboard_base.

    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - not_null