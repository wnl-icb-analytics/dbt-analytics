models:
- name: ers_action
  description: One e-RS action code with its latest retained dictionary label. Codes absent from the maintained
    dictionary use their latest supplied action display by sequential action ID. name_source makes that
    fallback explicit. Historical codes remain available; no historical effective-date definitions are
    supplied.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: code
    data_tests:
    - unique
    - not_null
  - name: name
    description: Latest retained e-RS dictionary display.
  - name: name_source
    description: Whether the name comes from the maintained e-RS dictionary or the latest supplied action
      display for a code missing from it.
