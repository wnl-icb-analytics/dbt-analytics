version: 2

# NHS Data Model and Dictionary code lists used by admitted patient care and
# outpatient activity. Latest models hold one row per code ever published, with
# the newest UKHFD wording; history models hold every UKHFD revision.

models:
  - name: nhs_dd_admission_method
    description: >-
      NHS Data Model and Dictionary admission method codes. One row per code ever
      published, with the newest UKHFD definition. Retired codes remain for historical joins.
    config: &owner
      meta:
        owner:
          name: Eddie Davison
    columns: &latest_columns
      - name: code
        description: National code.
        data_tests: [not_null, unique]
      - name: description
        description: Newest published description for the code.
      - name: short_description
        description: Newest published description limited to 60 characters.
      - name: category
        description: Newest published category where supplied.
      - name: notes
        description: Newest published notes where supplied.
      - name: valid_from_date
        description: Date from which the selected definition is valid.
      - name: valid_to_date
        description: Last date on which the selected definition is valid; null when open-ended.
      - name: is_currently_valid
        description: TRUE when the code remains in the current published code set.
      - name: source_code_set_name
        description: NHS Data Model and Dictionary attribute used for the definition.
      - name: source_imported_at
        description: Timestamp when UKHFD imported the source publication.
      - name: definition_updated_at
        description: Timestamp from which the selected UKHFD definition revision applies.

  - name: nhs_dd_admission_method_history
    description: >-
      NHS Data Model and Dictionary admission method definition revisions from UKHFD.
      One row per code and UKHFD revision.
    config: *owner
    data_tests: &history_grain_test
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_code_set_name, code, source_effective_from_at]
    columns: &history_columns
      - name: source_code_set_name
        description: NHS Data Model and Dictionary attribute name.
        data_tests: [not_null]
      - name: code
        description: National code.
        data_tests: [not_null]
      - name: description
        description: Description in this definition revision.
      - name: short_description
        description: Description in this revision limited to 60 characters.
      - name: category
        description: Published category in this revision where supplied.
      - name: notes
        description: Published notes in this revision where supplied.
      - name: valid_from_date
        description: Date from which the definition is valid.
      - name: valid_to_date
        description: Last date on which the definition is valid; null when open-ended.
      - name: is_currently_valid
        description: TRUE when the code remains in the current published code set.
      - name: source_unique_key
        description: UKHFD key for the code definition.
      - name: source_imported_at
        description: Timestamp when UKHFD imported the source publication.
      - name: source_created_at
        description: Timestamp when UKHFD created the source row.
      - name: is_latest_definition
        description: TRUE for the newest UKHFD definition of the code, including retired codes.
      - name: source_effective_from_at
        description: Timestamp from which the UKHFD definition revision applies.
      - name: source_effective_to_at
        description: Timestamp until which the UKHFD definition revision applies; null for its newest revision.

  - name: nhs_dd_admission_source
    description: >-
      NHS Data Model and Dictionary admission source codes, combining Admission Source (from
      April 2022) with the retired Source Of Admission. One row per code ever published. Where
      a code is in both, the Admission Source definition is used. Legacy-only codes such as
      39, 41, 54, 65 and 85 remain for historical activity; UKHFD still marks them currently
      valid. Labels are the latest wording, not the wording at admission.
    config: *owner
    columns: *latest_columns

  - name: nhs_dd_admission_source_history
    description: >-
      Admission Source and retired Source Of Admission definition revisions from UKHFD.
      One row per source code set, code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: nhs_dd_patient_classification
    description: >-
      NHS Data Model and Dictionary patient classification codes for admitted patient care,
      such as ordinary admission and day case. One row per code ever published, with the
      newest UKHFD definition.
    config: *owner
    columns: *latest_columns

  - name: nhs_dd_patient_classification_history
    description: >-
      NHS Data Model and Dictionary patient classification definition revisions from UKHFD.
      One row per code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: nhs_dd_treatment_function
    description: >-
      NHS Data Model and Dictionary treatment function codes. One row per code ever published,
      with the newest UKHFD definition. Category holds the published specialty group. Retired
      codes remain for historical joins.
    config: *owner
    columns: *latest_columns

  - name: nhs_dd_treatment_function_history
    description: >-
      NHS Data Model and Dictionary treatment function definition revisions from UKHFD.
      One row per code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: nhs_dd_main_specialty
    description: >-
      NHS Data Model and Dictionary main specialty codes. One row per code ever published,
      with the newest UKHFD definition. Category holds the published specialty group. Retired
      codes remain for historical joins.
    config: *owner
    columns: *latest_columns

  - name: nhs_dd_main_specialty_history
    description: >-
      NHS Data Model and Dictionary main specialty definition revisions from UKHFD.
      One row per code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: nhs_dd_priority_type
    description: >-
      NHS Data Model and Dictionary priority type codes: routine, urgent and two week wait.
      One row per code ever published, with the newest UKHFD definition.
    config: *owner
    columns: *latest_columns

  - name: nhs_dd_priority_type_history
    description: >-
      NHS Data Model and Dictionary priority type definition revisions from UKHFD.
      One row per code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: nhs_dd_outpatient_attendance_outcome
    description: >-
      NHS Data Model and Dictionary outpatient attendance outcome codes, combining Out-Patient
      Attendance Outcome (from April 2022) with the older Outcome Of Attendance. One row per
      code; the current definition is used where a code is in both. Codes 1 to 3 keep their
      meaning: discharged, follow-up booked, follow-up to be booked. Codes 4 and 5 move or
      discharge the patient to a patient-initiated (personalised) follow-up pathway.
    config: *owner
    columns: *latest_columns

  - name: nhs_dd_outpatient_attendance_outcome_history
    description: >-
      Out-Patient Attendance Outcome and older Outcome Of Attendance definition revisions from
      UKHFD. One row per source code set, code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: nhs_dd_first_attendance
    description: >-
      NHS Data Model and Dictionary first attendance codes, which show whether an outpatient
      appointment is a first or follow-up attendance and whether it is face to face or remote.
      One row per code ever published, with the newest UKHFD definition.
    config: *owner
    columns: *latest_columns

  - name: nhs_dd_first_attendance_history
    description: >-
      NHS Data Model and Dictionary first attendance definition revisions from UKHFD.
      One row per code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: nhs_dd_attended_or_did_not_attend
    description: >-
      NHS Data Model and Dictionary attended or did not attend codes, covering attendance,
      late arrival, did not attend and cancellation by patient or provider. One row per code
      ever published, with the newest UKHFD definition.
    config: *owner
    columns: *latest_columns

  - name: nhs_dd_attended_or_did_not_attend_history
    description: >-
      NHS Data Model and Dictionary attended or did not attend definition revisions from UKHFD.
      One row per code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: nhs_dd_outpatient_source_of_referral
    description: >-
      NHS Data Model and Dictionary source of referral codes for outpatients. One row per code
      ever published, with the newest UKHFD definition. Retired codes such as 08 remain for
      historical joins.
    config: *owner
    columns: *latest_columns

  - name: nhs_dd_outpatient_source_of_referral_history
    description: >-
      NHS Data Model and Dictionary outpatient source of referral definition revisions from
      UKHFD. One row per code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: nhs_dd_person_stated_gender
    description: >-
      NHS Data Model and Dictionary person stated gender codes: 1 male, 2 female, 9
      indeterminate and X not known. One row per code, with the newest UKHFD definition.
      Used by ECDS. SUS admitted patient and outpatient data use nhs_dd_person_gender instead.
    config: *owner
    columns: *latest_columns

  - name: nhs_dd_person_gender
    description: >-
      NHS Data Model and Dictionary person gender codes: 0 not known, 1 male, 2 female and 9
      not specified. One row per code, with the newest UKHFD definition. Used by SUS admitted
      patient and outpatient data; ECDS uses nhs_dd_person_stated_gender instead.
    config: *owner
    columns: *latest_columns

  - name: nhs_dd_person_gender_history
    description: >-
      NHS Data Model and Dictionary person gender definition revisions from UKHFD. One row per
      code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: nhs_dd_person_stated_gender_history
    description: >-
      NHS Data Model and Dictionary person stated gender definition revisions from UKHFD.
      One row per code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: nhs_dd_ethnic_category
    description: >-
      Source NHS Data Model and Dictionary ethnic category code list. For analysis use
      `ethnicity_2001` (2001 groups) or `ethnicity_2021` (ONS Census 2021 groups) instead.
      One row per code: 16 ethnic categories, Z (not stated) and 99 (not known). Category
      holds the 2001 broad group and is null for Z and 99. Recorded values may carry
      trailing spaces; trim them before joining.
    config: *owner
    columns: *latest_columns

  - name: nhs_dd_ethnic_category_history
    description: >-
      Ethnic Category Code 2001 definition revisions from UKHFD, including revisions published
      under the earlier name Ethnic Category Code before June 2020. One row per source code
      set, code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns
