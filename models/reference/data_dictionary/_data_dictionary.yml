version: 2

models:
  - name: attendance_status
    description: >-
      One row per attendance-status code ever published. Uses the newest UKHFD
      definition for each code and retains retired codes for historical joins.
    config: &owner
      meta:
        owner:
          name: Eddie Davison
    columns: &default_columns
      - name: code
        description: National code.
        data_tests: [not_null, unique]
      - name: description
        description: Newest published description for the code.
      - name: short_description
        description: Newest published description limited to 60 characters.
      - name: category
        description: Newest published category where supplied.
      - name: notes
        description: Newest published notes where supplied.
      - name: valid_from_date
        description: Date from which the selected definition is valid.
      - name: valid_to_date
        description: Last date on which the selected definition is valid; null when open-ended.
      - name: is_currently_valid
        description: TRUE when the code remains in the current published code set.
      - name: source_code_set_name
        description: NHS Data Model and Dictionary attribute used for the definition.
      - name: source_imported_at
        description: Timestamp when UKHFD imported the source publication.
      - name: definition_updated_at
        description: Timestamp from which the selected UKHFD definition revision applies.

  - name: attendance_status_history
    description: >-
      Attendance-status definition revisions from UKHFD. One row per code and
      UKHFD revision. Use the source effective timestamps to reproduce historic
      dictionary wording; use valid dates to assess the published validity period.
    config: *owner
    data_tests: &history_grain_test
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_code_set_name, code, source_effective_from_at]
    columns: &history_columns
      - name: source_code_set_name
        description: NHS Data Model and Dictionary attribute name.
        data_tests: [not_null]
      - name: code
        description: National code.
        data_tests: [not_null]
      - name: description
        description: Description in this definition revision.
      - name: short_description
        description: Description in this revision limited to 60 characters.
      - name: category
        description: Published category in this revision where supplied.
      - name: notes
        description: Published notes in this revision where supplied.
      - name: valid_from_date
        description: Date from which the definition is valid.
      - name: valid_to_date
        description: Last date on which the definition is valid; null when open-ended.
      - name: is_currently_valid
        description: TRUE when the code remains in the current published code set.
      - name: source_unique_key
        description: UKHFD key for the code definition.
      - name: source_imported_at
        description: Timestamp when UKHFD imported the source publication.
      - name: source_created_at
        description: Timestamp when UKHFD created the source row.
      - name: is_latest_definition
        description: TRUE for UKHFD's newest definition of the code, including retired codes.
      - name: source_effective_from_at
        description: Timestamp from which the UKHFD definition revision applies.
      - name: source_effective_to_at
        description: Timestamp until which the UKHFD definition revision applies; null for its newest revision.

  - name: activity_location_type
    description: >-
      One row per activity-location-type code ever published. Uses the newest
      UKHFD definition for each code and retains retired codes for historical joins.
    config: *owner
    columns: *default_columns

  - name: activity_location_type_history
    description: >-
      Activity-location-type definition revisions from UKHFD. One row per code
      and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: consultation_mechanism
    description: >-
      One row per consultation-mechanism code ever published. Uses the newest
      UKHFD definition for each code and retains retired codes for historical joins.
    config: *owner
    columns: *default_columns

  - name: consultation_mechanism_history
    description: >-
      Consultation-mechanism definition revisions from UKHFD. One row per code
      and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: mhsds_source_of_referral
    description: >-
      One row per MHSDS source-of-referral code ever published. Current MHSDS
      definitions take precedence over the retired mental-health code set where
      codes overlap; legacy-only codes remain available for historical joins.
    config: *owner
    columns: *default_columns

  - name: mhsds_source_of_referral_history
    description: >-
      Current MHSDS and retired mental-health source-of-referral definition
      revisions from UKHFD. One row per source code set, code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: mhsds_service_or_team_type
    description: >-
      One row per mental-health service-or-team-type code ever published. Uses
      the newest UKHFD definition and retains retired codes for historical joins.
    config: *owner
    columns: *default_columns

  - name: mhsds_service_or_team_type_history
    description: >-
      Mental-health service-or-team-type definition revisions from UKHFD. One
      row per code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: mhsds_service_or_team_intended_age_group
    description: >-
      One row per mental health service or team intended-age code ever
      published. Uses the newest UKHFD definition and retains retired codes.
    config: *owner
    columns: *default_columns

  - name: mhsds_service_or_team_intended_age_group_history
    description: >-
      Mental health service or team intended-age definition revisions from
      UKHFD. One row per code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: language
    description: >-
      One row per ISO 639-1 language code or NHS communication-method
      extension, using the newest UKHFD definition.
    config: *owner
    columns: *default_columns

  - name: language_history
    description: >-
      ISO 639-1 language and NHS communication-method definition revisions
      from UKHFD. One row per source code set, code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: mental_health_admitted_patient_classification_type
    description: >-
      One row per mental health admitted patient classification type code ever
      published, using the newest UKHFD definition.
    config: *owner
    columns: *default_columns

  - name: mental_health_admitted_patient_classification_type_history
    description: >-
      Mental health admitted patient classification type revisions from UKHFD.
      One row per source code set, code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: csds_source_of_referral
    description: >-
      One row per community source-of-referral code ever published. Uses the
      newest UKHFD definition and retains retired codes for historical joins.
    config: *owner
    columns: *default_columns

  - name: csds_source_of_referral_history
    description: >-
      Community source-of-referral definition revisions from UKHFD. One row per
      code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns

  - name: csds_service_or_team_type
    description: >-
      One row per community service-or-team-type code ever published. Uses the
      newest UKHFD definition and retains retired codes for historical joins.
    config: *owner
    columns: *default_columns

  - name: csds_service_or_team_type_history
    description: >-
      Community service-or-team-type definition revisions from UKHFD. One row
      per code and UKHFD revision.
    config: *owner
    data_tests: *history_grain_test
    columns: *history_columns


  - name: mhsds_inpatient_code_lookup
    description: >-
      One row per MHSDS inpatient code set and code ever published. Uses the
      newest UKHFD definition and retains retired codes for historical joins.
    config: *owner
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [code_set_name, code]
    columns:
      - name: code_set_name
        description: Inpatient concept represented by the code.
        data_tests: [not_null]
      - name: code
        description: National code.
        data_tests: [not_null]
      - name: description
        description: Newest published description for the code.
      - name: source_code_set_name
        description: NHS Data Model and Dictionary attribute used for the definition.

  - name: mhsds_inpatient_code_lookup_history
    description: >-
      MHSDS inpatient code definition revisions from UKHFD. One row per code
      set, source code set, code and UKHFD revision.
    config: *owner
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - code_set_name
              - source_code_set_name
              - code
              - source_effective_from_at
    columns:
      - name: code_set_name
        description: Inpatient concept represented by the code.
        data_tests: [not_null]
      - name: source_code_set_name
        description: NHS Data Model and Dictionary attribute name.
        data_tests: [not_null]
      - name: code
        description: National code.
        data_tests: [not_null]
      - name: description
        description: Description in this definition revision.
      - name: source_effective_from_at
        description: Timestamp from which the UKHFD definition revision applies.

  - name: discharge_destination
    description: >-
      One row per discharge destination code ever published by UKHFD. Uses the
      latest definition in each source and prefers Destination Of Discharge over the
      legacy code set where codes overlap. Retired codes remain available for
      historical activity. Labels are the latest wording, not wording as at discharge.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns: *default_columns

  - name: discharge_destination_history
    description: >-
      Modern and legacy UKHFD discharge destination definition revisions. One row
      per source code set, code and UKHFD revision. Includes retired codes and
      all revisions; source effective timestamps describe definition history.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests: *history_grain_test
    columns: *history_columns

  - name: discharge_method
    description: >-
      One row per discharge method code ever published by UKHFD. Uses the
      latest definition in each source and prefers Method Of Discharge over the
      legacy code set where codes overlap. Retired codes remain available for
      historical activity. Labels are the latest wording, not wording as at discharge.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns: *default_columns

  - name: discharge_method_history
    description: >-
      Modern and legacy UKHFD discharge method definition revisions. One row
      per source code set, code and UKHFD revision. Includes retired codes and
      all revisions; source effective timestamps describe definition history.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests: *history_grain_test
    columns: *history_columns
