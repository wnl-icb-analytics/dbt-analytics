models:
- name: ons_geography
  description: >-
    One geography code with its latest retained Dictionary ONSCodeEquivalent name.
    Includes terminated and historical codes. Introduction and termination describe
    the code, not effective periods for previous names.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: code
    data_tests:
    - unique
    - not_null
  - name: name
    description: Latest retained Dictionary geography name.
  - name: introduced_date
    description: Supplied date the geography code was introduced.
  - name: terminated_date
    description: Supplied date the geography code was terminated; null if none is recorded.
