  - name: mhsds_diagnosis_scheme
    description: >-
      Each row is one diagnosis coding-scheme code, combining UKHFD historical codes with
      specification-backed MHSDS labels not yet held in UKHFD. Inclusion supplies a label, not
      validation for every MHSDS version.
    config: *owner
    columns:
      - name: code
        description: Diagnosis coding-scheme code.
        data_tests: [not_null, unique]
      - name: description
        description: UKHFD label or MHSDS ETOS supplement when absent from UKHFD.

