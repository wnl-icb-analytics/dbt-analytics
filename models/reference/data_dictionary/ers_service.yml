models:
- name: ers_service
  description: One e-RS service ID with its latest retained dictionary name and supplied definition period.
    Includes historical services without an active-date filter. Does not assign a historical provider
    or specialty from the current directory.
  config:
    meta:
      owner:
        name: Jonathan Linney
  columns:
  - name: service_id
    data_tests:
    - unique
    - not_null
  - name: service_name
    description: Latest retained service name.
  - name: effective_from_at
    description: Supplied start of the service definition period.
  - name: effective_to_at
    description: Supplied end of the service definition period; null when none was supplied.
