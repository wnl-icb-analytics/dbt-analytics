version: 2
models:
- name: ecds_observation_response
  description: Published categorical responses for ECDS coded observations, one row per observation SNOMED CT
    code and response value. Taken from the notes of the latest available ETOS release in ecds_measurement_code,
    where each permitted response is listed as Label = "value". Currently covers the ACVPU consciousness
    observation. Retired responses from earlier releases are not retained.
  config:
    meta:
      owner:
        name: Eddie Davison
    tags:
    - daily
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - observation_code
        - response_value
  columns:
  - name: observation_code
    description: ECDS coded observation SNOMED CT code.
  - name: response_value
    description: Case-sensitive response value submitted in the observation value field, such as A for ACVPU.
  - name: response_name
    description: Published response label from the ETOS notes.
  - name: source_file_name
    description: UKHFD source filename identifying the ETOS release.
