version: 2

models:
  - name: pss_service_line
    description: >-
      One row per PSS service-line number using the latest retained description
      from the newest available service-line hierarchy file. This keeps the
      current label for each service line and removes duplicate descriptions in
      the latest period when the source contains more than one matching value.
    config:
      meta:
        owner:
          name: Jake Kealey
    columns:
      - name: service_line_number_code
        description: Service-line number code.
        data_tests:
          - not_null
          - unique
      - name: service_line_number_desc
        description: Latest retained description for the service-line number.
