models:
- name: ers_patient_sex
  description: >-
    One e-RS patient sex code with its latest retained Dictionary.E-Referral.Gender
    label. Retains all dictionary codes. These application codes differ from
    national sex codes; no effective-date definition history is supplied.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: code
    description: e-RS application code supplied in PATIENT_SEX_CD.
    data_tests:
    - unique
    - not_null
  - name: name
    description: Latest retained e-RS dictionary display.
