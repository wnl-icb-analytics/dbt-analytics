version: 2

models:
  - name: pss_spec_comm
    description: >-
      One row per SPEC COMM (Specialised Commissioning) 
      chapter code with the corresponding description using the latest retained description.
    config:
      meta:
        owner:
          name: Jake Kealey
    columns:
      - name: spec_comm_code
        description: SPEC COMM chapter code.
        data_tests:
          - not_null
          - unique
      - name: spec_comm_desc
        description: Latest retained description for the spec comm code.
      - name: source_period
        description: >-
          The period of the source data used to derive the spec comm code and description.
