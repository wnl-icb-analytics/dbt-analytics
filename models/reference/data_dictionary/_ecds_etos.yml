  - name: ecds_investigation
    description: >-
      ECDS investigation codes from the ECDS ETOS code sets (NHS England via UKHFD).
      One row per SNOMED code ever published in the code set, including
      deprecated and retired codes for historical joins. Descriptions come from
      the newest release that lists the code as live. Includes Payment by Results category and CDS mappings used for HRG grouping.
    config: *owner
    columns:
      - name: snomed_code
        description: 'SNOMED CT concept ID as text, matching the text codes in SUS ECDS. Cast before joining to numeric code columns.'
        data_tests: [unique, not_null]
      - name: ecds_description
        description: 'ETOS display description from the newest release that lists the code as live. Null for codes published only as deprecated.'
      - name: snomed_uk_preferred_term
        description: 'SNOMED UK preferred term from the release that supplies the description, or the latest listing if the code was never live.'
      - name: snomed_fully_specified_name
        description: 'SNOMED fully specified name from the release that supplies the description. Uses snomed_description for releases before v3.1.0.'
      - name: ecds_group1
        description: 'ETOS top-level grouping of the code, e.g. Admitted or Discharged for discharge destination.'
      - name: pbr_category
        description: 'Payment by Results category, as published. A few historic values were converted to dates in the source spreadsheet.'
      - name: cds_code_mapping_used_for_hrg_grouping
        description: 'CDS code mapping used for HRG grouping.'
      - name: cds_investigation_mapping_used_for_hrg_grouping
        description: 'CDS A&E investigation code used for HRG grouping.'
      - name: ecds_unique_id
        description: 'ETOS identifier of the entry in the release that supplies the description. It can change between releases.'
      - name: valid_from_date
        description: 'Date from which the code is valid in ECDS, from the release that supplies the description.'
      - name: valid_to_date
        description: 'Last date the code is valid in ECDS, from the latest release that lists it; null while the code is live.'
      - name: is_in_latest_release
        description: 'TRUE when the latest ETOS release in UKHFD lists the code, including as deprecated.'
      - name: is_deprecated
        description: 'TRUE when the latest release that lists the code marks it as deprecated. Current codes have is_in_latest_release TRUE and is_deprecated FALSE.'
      - name: first_etos_version
        description: 'First ETOS release that lists the code.'
      - name: last_etos_version
        description: 'Latest ETOS release that lists the code.'

