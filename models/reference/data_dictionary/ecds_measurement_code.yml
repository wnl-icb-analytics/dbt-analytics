version: 2
models:
- name: ecds_measurement_code
  description: ECDS observation and assessment tool definitions from ecds_coded_observation and
    ecds_coded_assessment_tool_type. One row per record type and SNOMED CT code ever published.
    Uses the newest live definition, or the latest listing for a code never listed as live.
    Retains retired codes for historical labelling and the older SNOMED term fallback;
    blank code identifiers are excluded. Matching does not establish validity at the clinical event date.
  config:
    meta:
      owner:
        name: Eddie Davison
    tags:
    - daily
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - record_type
        - snomed_code
  columns:
  - name: record_type
    description: Observation or scored assessment ETOS code set.
    data_tests:
    - not_null
  - name: snomed_code
    description: Published SNOMED CT code.
    data_tests:
    - not_null
  - name: preferred_term
    description: Published UK preferred term, falling back to older term columns.
  - name: ecds_description
    description: ETOS description or mnemonic.
  - name: ecds_group1
    description: Published ECDS group 1, which can be an abbreviation.
  - name: notes
    description: Published code notes.
  - name: valid_from
    description: Code validity start recorded in that ETOS release.
  - name: source_file_name
    description: UKHFD source filename of the release supplying the definition, including an older live
      release when the code was later deprecated.
  - name: source_file_at
    description: Timestamp prefix of the UKHFD filename supplying the definition. Provenance only;
      the shared ECDS code lists select definitions by ETOS release date.
  - name: measurement_category
    description: Readable assessment family from the ETOS group or nationally named 4AT and Rockwood tools;
      observation categories use their published term. Null for unclassified tools.
