models:
  - name: csds_contact_code_lookup
    description: >-
      CSDS contact lookup entries with their supplied coded values and
      descriptions. One row per source lookup entry. All supplied entries
      remain available for joins; no additional current-status or
      reporting-period restriction is applied.
    config:
      meta:
        owner:
          name: JLinney
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1