models:
- name: ers_organisation
  description: One organisation code for e-RS analysis. Uses the shared UKHFD ODS, Dictionary and closed-archive
    names, then retains additional e-RS application organisation codes absent from that lookup. Includes
    historical codes with their latest retained name, not a historical name at action time.
  config:
    meta:
      owner:
        name: Jonathan Linney
  columns:
  - name: organisation_code
    data_tests:
    - unique
    - not_null
  - name: organisation_name
    description: Latest retained organisation name.
  - name: name_source
    description: Shared organisation lookup source or Dictionary.E-Referral for additional application
      organisation codes.
