models:
  - name: snomed_evidence_type
    description: >-
      Activity evidence type per SNOMED CT code in the dietary-review, medication-review,
      dental and weight-management lists used by OLIDS.
      National membership is unchanged. A referral procedure records a referral, not
      completion of the referred activity. Reviewed overrides take precedence over the
      automatic rule. Null means the code awaits review and raises a coverage warning;
      it does not establish an outcome. Started programmes record commencement, not
      programme completion.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: >-
              DM_DIET_REVIEW_COD, NUTRIASS_COD,
              NHSD_PRIMARY_CARE_DOMAIN_REFSETS/DIETITIAN_COD,
              SMI_LONGER_LIVES_MEDICINES_REVIEW, SMI_LONGER_LIVES_WEIGHT_MANAGEMENT,
              EXERCISEINT_COD, WTMGINT_COD, WTMGINTDEC_COD,
              SMI_LONGER_LIVES_DENTAL, ORALHEALTHREV_COD, ORALHEALTHINT_COD
    columns:
      - name: snomed_code
        description: SNOMED CT concept identifier, including historical codes.
        data_tests: [unique, not_null]
      - name: concept_name
        description: Fully specified name, falling back to the maintained list description.
      - name: semantic_tag
        description: SNOMED semantic tag; null for some retained historical descriptions.
      - name: evidence_type
        description: Activity meaning within the code, independent of the observation date or clinical outcome.
        data_tests:
          - accepted_values:
              arguments:
                values: [completed, requested_or_referred, advised, declined, finding, administrative]
      - name: is_offer
        description: True when wording records an offer rather than actual referral or intervention.
      - name: is_planned_or_awaited
        description: True for planned procedure context or planned or awaited wording; this does not establish activity or referral.
      - name: classification_basis
        description: Source of the classification or reason review is required.
