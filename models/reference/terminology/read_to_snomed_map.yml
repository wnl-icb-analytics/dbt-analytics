version: 2

models:
  - name: read_to_snomed_map
    description: >-
      National NHS Data Migration map from Read v2 and CTV3 to SNOMED CT,
      one current concept per Read code and term. TRUD via UKHFD, final release
      March 2020. Includes only active maps at the latest map effective date for
      each code and term; an inactive latest revision does not revive an older map.
      Filter on is_preferred_term for one concept per code; some CTV3 codes have
      only synonym maps and drop out under that filter. is_assured marks maps
      assured in the source. READ_CODE.snomed_ct_code comes from the legacy
      Dictionary and has one value per code; this map retains term-specific mappings.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [coding_system, read_code, read_term_code]
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [coding_system, read_code]
          config:
            where: is_preferred_term
    columns:
      - name: coding_system
        description: Source coding system, read_v2 or ctv3, matching READ_CODE.coding_system.
        data_tests:
          - accepted_values:
              arguments:
                values: [read_v2, ctv3]
      - name: read_code
        description: Five-character Read v2 code or CTV3 concept code. Outer whitespace is removed; case and dots remain significant.
      - name: read_term_code
        description: Read v2 term code, such as '00', or CTV3 term identifier. Retains the exact term variant within the coding system.
      - name: is_preferred_term
        description: True for Read v2 term code '00' or CTV3 term type P; null when the source CTV3 term type is missing. Filter to true for one concept per code.
      - name: snomed_concept_id
        description: Current mapped SNOMED CT concept identifier as text, supplied by NHS Data Migration.
        data_tests: [not_null]
      - name: snomed_description_id
        description: SNOMED CT description identifier as text for the mapped term.
      - name: is_assured
        description: Whether the source marks the map as assured; null when the source assurance flag is missing.
      - name: map_effective_date
        description: Latest map effective date for this coding system, code and term in the final March 2020 release.
