version: 2
sources:
- name: myria
  database: '"DATA_LAKE__NCL"'
  schema: '"MYRIA"'
  description: Project Myria (BEVC) canonical inputs - Doccla enrolled patients and
    the propensity-matched evaluation population. One row per patient per file; FILE_DATE
    identifies the upload. Loaded by MYRIA.LOAD_NEW_FILES().
  tables:
  - name: ENROLLED_PATIENTS
    identifier: '"ENROLLED_PATIENTS"'
    columns:
    - name: HX_ID
      data_type: TEXT
    - name: ACTIVATED_DATE
      data_type: DATE
    - name: ENROLLED_DATE
      data_type: DATE
    - name: ONBOARDED_DATE
      data_type: DATE
    - name: DISCHARGED_DATE
      data_type: DATE
    - name: FILE_DATE
      data_type: DATE
    - name: SOURCE_FILE
      data_type: TEXT
    - name: LOADED_AT
      data_type: TIMESTAMP_NTZ
  - name: MATCHED_PATIENTS
    identifier: '"MATCHED_PATIENTS"'
    columns:
    - name: PATIENT_ID
      data_type: TEXT
    - name: HEX_ID
      data_type: TEXT
    - name: ON_PDS_DEMOG
      data_type: NUMBER(38,0)
    - name: IS_MATCH_OLIDS
      data_type: NUMBER(38,0)
    - name: IS_ACTIVE
      data_type: NUMBER(38,0)
    - name: INACTIVE_REASON
      data_type: TEXT
    - name: DEATH_DATE
      data_type: DATE
    - name: FIRST_FILE_DATE
      data_type: DATE
    - name: LOCAL_AUTHORITY
      data_type: TEXT
    - name: ENROLLED
      data_type: NUMBER(38,0)
    - name: ENROLLED_DATE
      data_type: DATE
    - name: ONBOARDED
      data_type: NUMBER(38,0)
    - name: ONBOARDED_DATE
      data_type: DATE
    - name: DAYS_ONBOARDED
      data_type: NUMBER(38,1)
    - name: DISCHARGED
      data_type: NUMBER(38,0)
    - name: DISCHARGED_DATE
      data_type: TEXT
    - name: GENDER
      data_type: TEXT
    - name: AGE_YEARS
      data_type: NUMBER(38,1)
    - name: IMD_DECILE
      data_type: NUMBER(38,1)
    - name: IS_CARE_HOME
      data_type: NUMBER(38,0)
    - name: ETHNICITY_GROUP
      data_type: TEXT
    - name: MOST_RECENT_NEL_ADMISSION_DATE
      data_type: DATE
    - name: DAYS_SINCE_NEL_ADMISSION
