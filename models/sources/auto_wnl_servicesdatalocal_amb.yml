version: 2
sources:
- name: amb_wnl
  database: '"WNL_ServicesDataLocal"'
  schema: '"AMB"'
  description: LAS commissioning data
  tables:
  - name: Log_ProcessingEvent
    identifier: '"Log_ProcessingEvent"'
    columns:
    - name: SK_RowID
      data_type: NUMBER(38,0)
    - name: BatchId
      data_type: NUMBER(38,0)
    - name: FileID
      data_type: NUMBER(38,0)
    - name: StageID
      data_type: NUMBER(38,0)
    - name: ServiceCode
      data_type: TEXT
    - name: ProfileCode
      data_type: NUMBER(38,0)
    - name: FileName
      data_type: TEXT
    - name: OriginalFileName
      data_type: TEXT
    - name: Message
      data_type: TEXT
    - name: Status
      data_type: NUMBER(38,0)
    - name: RowCount
      data_type: NUMBER(38,0)
    - name: SourceColumnHeaders
      data_type: TEXT
    - name: ActualColCount
      data_type: NUMBER(38,0)
    - name: ExpectedColCount
      data_type: NUMBER(38,0)
    - name: LoaderJobName
      data_type: TEXT
    - name: DSPDisseminationDateTime
      data_type: TIMESTAMP_NTZ
    - name: FileSize
      data_type: NUMBER(38,0)
    - name: StartDate
      data_type: TIMESTAMP_NTZ
    - name: EndDate
      data_type: TIMESTAMP_NTZ
    - name: CreatedBy
      data_type: TEXT
    - name: CreatedDateTime
      data_type: TIMESTAMP_NTZ
    - name: LastUpdatedBy
      data_type: TEXT
    - name: LastUpdatedDateTime
      data_type: TIMESTAMP_NTZ
    - name: HeaderID
      data_type: NUMBER(38,0)
    - name: IsReProcessed
      data_type: BOOLEAN
