version: 2
sources:
- name: sus_commissioner_reference
  database: '"DATA_LAKE__NCL"'
  schema: '"ANALYST_MANAGED"'
  description: Date-effective commissioner attribution lookups migrated from the on-premises
    DBA database. These tables are loaded from the SUS Consolidated Handover files.
  tables:
  - name: practice_commissioner
    identifier: '"SUS_COMMISSIONER_PRACTICE"'
    columns:
    - name: SK_ORGANISATIONID_PRACTICE
      data_type: NUMBER(38,0)
    - name: ORGANISATIONCODE_PRACTICE
      data_type: TEXT
    - name: SK_ORGANISATIONID_COMMISSIONER
      data_type: NUMBER(38,0)
    - name: ORGANISATIONCODE_COMMISSIONER
      data_type: TEXT
    - name: PRACTICESTARTDATE
      data_type: DATE
    - name: PRACTICEENDDATE
      data_type: DATE
    - name: RELATIONSHIPSTARTDATE
      data_type: TIMESTAMP_NTZ
    - name: RELATIONSHIPENDDATE
      data_type: TIMESTAMP_NTZ
    - name: ISACTIVE
      data_type: BOOLEAN
    - name: ISPROXY
      data_type: BOOLEAN
  - name: lsoa_commissioner
    identifier: '"SUS_COMMISSIONER_LSOA"'
    columns:
    - name: OACODE
      data_type: TEXT
    - name: SK_OUTPUTAREAID
      data_type: NUMBER(38,0)
    - name: ORGANISATIONCODE_COMMISSIONER
      data_type: TEXT
    - name: SK_ORGANISATIONID
      data_type: NUMBER(38,0)
    - name: EFFECTIVEFROM
      data_type: DATE
    - name: EFFECTIVETO
      data_type: DATE
  - name: provider_commissioner
    identifier: '"SUS_COMMISSIONER_PROVIDER"'
    columns:
    - name: PROVIDERCODE
      data_type: TEXT
    - name: COMMISSIONERCODE
      data_type: TEXT
    - name: EFFECTIVEFROM
      data_type: DATE
    - name: EFFECTIVETO
      data_type: DATE
  - name: provider_postcode_commissioner
    identifier: '"SUS_COMMISSIONER_PROVIDER_POSTCODE"'
    columns:
    - name: PROVIDERCODE
      data_type: TEXT
    - name: COMMISSIONERCODE
      data_type: TEXT
    - name: EFFECTIVEFROM
      data_type: DATE
    - name: EFFECTIVETO
      data_type: DATE
