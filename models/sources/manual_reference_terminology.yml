version: 2

sources:
  - name: reference_terminology_curated
    database: '"REFERENCE"'
    schema: '"TERMINOLOGY"'
    description: Curated Primary Care Domain terminology releases from UKHFD
    tables:
      - name: pcd_refset_latest
        identifier: '"PCD_REFSET_LATEST"'
        description: Current active Primary Care Domain refset membership with release metadata
        columns:
          - name: CLUSTER_ID
            data_type: TEXT
          - name: CLUSTER_DESCRIPTION
            data_type: TEXT
          - name: SNOMED_CODE
            data_type: NUMBER(38,0)
          - name: SNOMED_CODE_DESCRIPTION
            data_type: TEXT
          - name: PCD_REFSET_ID
            data_type: TEXT
          - name: SERVICE_AND_RULESET
            data_type: TEXT
          - name: SNAPSHOT_DATE
            data_type: DATE
          - name: RELEASE_VERSION
            data_type: TEXT
          - name: SOURCE_FILE
            data_type: TEXT

      - name: pcd_refset_snapshots
        identifier: '"PCD_REFSET_SNAPSHOTS"'
        description: Primary Care Domain refset membership by release snapshot
        columns:
          - name: SNAPSHOT_DATE
            data_type: DATE
          - name: RELEASE_VERSION
            data_type: TEXT
          - name: SOURCE_FILE
            data_type: TEXT
          - name: CLUSTER_ID
            data_type: TEXT
          - name: CLUSTER_DESCRIPTION
            data_type: TEXT
          - name: SNOMED_CODE
            data_type: NUMBER(38,0)
          - name: SNOMED_CODE_DESCRIPTION
            data_type: TEXT
          - name: PCD_REFSET_ID
            data_type: TEXT
          - name: SERVICE_AND_RULESET
            data_type: TEXT
