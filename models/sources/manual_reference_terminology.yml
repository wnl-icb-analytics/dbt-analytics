version: 2
sources:
- name: reference_terminology_curated
  database: '"REFERENCE"'
  schema: '"TERMINOLOGY"'
  description: Curated Primary Care Domain terminology releases from UKHFD and combined clinical code sets
  tables:
  - name: pcd_refset_latest
    identifier: '"PCD_REFSET_LATEST"'
    description: Current active Primary Care Domain refset membership with release
      metadata
    columns:
    - name: CLUSTER_ID
      data_type: TEXT
    - name: CLUSTER_DESCRIPTION
      data_type: TEXT
    - name: SNOMED_CODE
      data_type: TEXT
    - name: SNOMED_CODE_DESCRIPTION
      data_type: TEXT
    - name: PCD_REFSET_ID
      data_type: TEXT
    - name: SERVICE_AND_RULESET
      data_type: TEXT
    - name: SNAPSHOT_DATE
      data_type: DATE
    - name: RELEASE_VERSION
      data_type: NUMBER(38,0)
    - name: SOURCE_FILE
      data_type: TEXT
  - name: pcd_refset_snapshots
    identifier: '"PCD_REFSET_SNAPSHOTS"'
    description: Primary Care Domain refset membership by release snapshot
    columns:
    - name: SNAPSHOT_DATE
      data_type: DATE
    - name: RELEASE_VERSION
      data_type: NUMBER(38,0)
    - name: SOURCE_FILE
      data_type: TEXT
    - name: CLUSTER_ID
      data_type: TEXT
    - name: CLUSTER_DESCRIPTION
      data_type: TEXT
    - name: SNOMED_CODE
      data_type: TEXT
    - name: SNOMED_CODE_DESCRIPTION
      data_type: TEXT
    - name: PCD_REFSET_ID
      data_type: TEXT
    - name: SERVICE_AND_RULESET
      data_type: TEXT
  - name: combined_codesets
    identifier: '"COMBINED_CODESETS"'
    description: Clinical code-set membership across maintained sources. Rebuilt by
      a Snowflake task, not dbt; staging provides one row per cluster, code and source
    columns:
    - name: CLUSTER_ID
      data_type: TEXT
    - name: CLUSTER_DESCRIPTION
      data_type: TEXT
    - name: CODE
      data_type: TEXT
    - name: CODE_DESCRIPTION
      data_type: TEXT
    - name: SOURCE
      data_type: TEXT
