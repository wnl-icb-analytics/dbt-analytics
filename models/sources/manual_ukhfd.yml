- name: ukhfd_ecds_data_dictionary
  database: '"UKHFD"'
  schema: '"Data_Dictionary"'
  description: National data dictionary reference dimensions.
  config:
    meta:
      domain: shared
      raw_prefix: raw_ukhfd
  tables:
  - name: emergency_care_department_type
    identifier: '"dim_Emergency_Care_Department_Type_SCD"'
    description: Emergency care department type codes and descriptions; Is_Latest
      marks the current row per code.
    columns:
    - name: Main_Code_Text
      quote: true
      data_type: TEXT
    - name: Main_Description
      quote: true
      data_type: TEXT
    - name: Is_Latest
      quote: true
      data_type: NUMBER(38,0)
    - name: Effective_From
      quote: true
      data_type: TIMESTAMP_NTZ
  - name: emergency_care_attendance_category
    identifier: '"dim_Emergency_Care_Attendance_Category_SCD"'
    description: Emergency care attendance category codes and descriptions; Is_Latest
      marks the current row per code.
    columns:
    - name: Main_Code_Text
      quote: true
      data_type: TEXT
    - name: Main_Description
      quote: true
      data_type: TEXT
    - name: Is_Latest
      quote: true
      data_type: NUMBER(38,0)
    - name: Effective_From
      quote: true
      data_type: TIMESTAMP_NTZ
  - name: uec_activity_type
    identifier: '"dim_Urgent_And_Emergency_Care_Activity_Type_SCD"'
    description: Urgent and emergency care activity type codes and descriptions; Is_Latest
      marks the current row per code.
    columns:
    - name: Main_Code_Text
      quote: true
      data_type: TEXT
    - name: Main_Description
      quote: true
      data_type: TEXT
    - name: Is_Latest
      quote: true
      data_type: NUMBER(38,0)
    - name: Effective_From
      quote: true
      data_type: TIMESTAMP_NTZ
  - name: mental_health_act_legal_status_classification
    identifier: '"dim_Mental_Health_Act_Legal_Status_Classification_Code_SCD"'
    description: Mental Health Act legal status classification codes and descriptions;
      Is_Latest marks the current row per code.
    columns:
    - name: Main_Code_Text
      quote: true
      data_type: TEXT
    - name: Main_Description
      quote: true
      data_type: TEXT
    - name: Is_Latest
      quote: true
      data_type: NUMBER(38,0)
