  - name: ukhfd_pbr
    database: '"UKHFD"'
    schema: '"PbR_v2"'
    description: NHS payment reference data collected by the UK Health Funding Dataset.
    config:
      meta:
        domain: shared
        raw_prefix: raw_ukhfd
    tables:
