version: 2

sources:
  - name: ukhfd_ecds_data_dictionary
    database: '"UKHFD"'
    schema: '"Data_Dictionary"'
    description: National data dictionary reference dimensions.
    config:
      meta:
        domain: shared
        raw_prefix: raw_ukhfd
    tables:
      - name: emergency_care_department_type
        identifier: '"dim_Emergency_Care_Department_Type_SCD"'
        description: Emergency care department type codes and descriptions; Is_Latest marks the current row per code.
        columns:
          - name: Main_Code_Text
            quote: true
          - name: Main_Description
            quote: true
          - name: Is_Latest
            quote: true
          - name: Effective_From
            quote: true
      - name: emergency_care_attendance_category
        identifier: '"dim_Emergency_Care_Attendance_Category_SCD"'
        description: Emergency care attendance category codes and descriptions; Is_Latest marks the current row per code.
        columns:
          - name: Main_Code_Text
            quote: true
          - name: Main_Description
            quote: true
          - name: Is_Latest
            quote: true
          - name: Effective_From
            quote: true
      - name: uec_activity_type
        identifier: '"dim_Urgent_And_Emergency_Care_Activity_Type_SCD"'
        description: Urgent and emergency care activity type codes and descriptions; Is_Latest marks the current row per code.
        columns:
          - name: Main_Code_Text
            quote: true
          - name: Main_Description
            quote: true
          - name: Is_Latest
            quote: true
          - name: Effective_From
            quote: true
      - name: mental_health_act_legal_status_classification
        identifier: '"dim_Mental_Health_Act_Legal_Status_Classification_Code_SCD"'
        description: Mental Health Act legal status classification codes and descriptions; Is_Latest marks the current row per code.
        columns:
          - name: Main_Code_Text
            quote: true
          - name: Main_Description
            quote: true
          - name: Is_Latest
            quote: true
          - name: Effective_From
            quote: true

  - name: ukhfd_geo
    database: '"UKHFD"'
    schema: '"Old_LSOA_To_New_LSOA_To_LAD"'
    description: ONS lookup bridging retired 2011 LSOAs to 2021 LSOAs and their LAD.
    config:
      meta:
        domain: shared
        raw_prefix: raw_ukhfd
    tables:
      - name: old_lsoa_to_new_lsoa_map
        identifier: '"dim_Map_SCD"'
        description: One row per (old LSOA, new LSOA) pair per snapshot; Is_Latest marks the current mapping.
        columns:
          - name: Old_LSOA_Code
            quote: true
          - name: New_LSOA_Code
            quote: true
          - name: LAD_Code
            quote: true
          - name: Is_Latest
            quote: true
          - name: Effective_From
            quote: true
          - name: Effective_To
            quote: true

  - name: ukhfd_ods
    database: '"UKHFD"'
    schema: '"ODS"'
    description: National ODS organisation reference dimensions.
    config:
      meta:
        domain: shared
        raw_prefix: raw_ukhfd
    tables:
      - name: all_gp_and_gdp_practices
        identifier: '"dim_All_GP_and_GDP_Practices_SCD"'
        description: All GP and general dental practices nationally (epraccur-style SCD); Is_Latest marks the current row per organisation.
        columns:
          - name: Organisation_Code
            quote: true
          - name: Organisation_Name
            quote: true
          - name: Postcode
            quote: true
          - name: Open_Date
            quote: true
          - name: Close_Date
            quote: true
          - name: Status_Code
            quote: true
          - name: Parent_Organisation_Code
            quote: true
          - name: Prescribing_Setting
            quote: true
          - name: Is_Latest
            quote: true
          - name: Effective_From
            quote: true
          - name: Effective_To
            quote: true

      - name: closed_organisations
        identifier: '"dim_Orgs_Closed_Since_1991_SCD"'
        description: ODS closed organisation and site archive since 1991, including historical revisions.
        columns:
          - name: Organisation_Code
            quote: true
          - name: Organisation_Name
            quote: true
          - name: National_Grouping_Code
            quote: true
          - name: High_Level_Health_Authority_Code
            quote: true
          - name: Address_Line_1
            quote: true
          - name: Address_Line_2
            quote: true
          - name: Address_Line_3
            quote: true
          - name: Address_Line_4
            quote: true
          - name: Address_Line_5
            quote: true
          - name: Postcode
            quote: true
          - name: Open_Date
            quote: true
          - name: Close_Date
            quote: true
          - name: Unused_Field_13
            quote: true
          - name: Organisation_Sub_Type_Code
            quote: true
          - name: Parent_Organisation_Code
            quote: true
          - name: Join_Parent_Date
            quote: true
          - name: Left_Parent_Date
            quote: true
          - name: Contact_Telephone_Number
            quote: true
          - name: Unused_Field_19
            quote: true
          - name: Unused_Field_20
            quote: true
          - name: Unused_Field_21
            quote: true
          - name: Amended_Record_Indicator
            quote: true
          - name: Wave_Number
            quote: true
          - name: Unused_Field_24
            quote: true
          - name: Unused_Field_25
            quote: true
          - name: Unused_Field_26
            quote: true
          - name: Unused_Field_27
            quote: true
          - name: In_Source_Data
            quote: true
          - name: Import_Date
            quote: true
          - name: Created_Date
            quote: true
          - name: Is_Latest
            quote: true
          - name: Effective_From
            quote: true
          - name: Effective_To
            quote: true
          - name: Char_8_ASCII_Index
            quote: true

  - name: ukhfd_demography
    database: '"UKHFD"'
    schema: '"Demography"'
    description: GP-registered patient counts from the NHS England "Patients Registered at a GP Practice" monthly publication.
    config:
      meta:
        domain: shared
        raw_prefix: raw_ukhfd
    tables:
      - name: registered_patients_by_gp_practice
        identifier: '"fact_No_Of_Patients_Regd_At_GP_Prac_Regions_5Yr_AgeBand"'
        description: Registered patient counts by organisation (GP practice, PCN, ICB and other geographies), sex and 5-year age band per monthly snapshot.
        columns:
          - name: Org_Type
            quote: true
          - name: Org_Code
            quote: true
          - name: ONS_Code
            quote: true
          - name: Sex
            quote: true
          - name: Age_Band
            quote: true
          - name: Number_Of_Patients
            quote: true
          - name: Effective_Snapshot_Date
            quote: true
          - name: DataSourceFileForThisSnapshot_Version
            quote: true
          - name: Report_Period_Length
            quote: true
          - name: Unique_ID
            quote: true
          - name: AuditKey
            quote: true

  - name: ukhfd_comm_allocations
    database: '"UKHFD"'
    schema: '"Comm_Allocations"'
    description: UK Health Funding Dataset commissioning allocation inputs.
    config:
      meta:
        domain: shared
        raw_prefix: raw_ukhfd
    tables:
      - name: weighted_regs_by_gp_practice_base
        identifier: '"fact_Weighted_Regs_By_GP_Practice_Base"'
