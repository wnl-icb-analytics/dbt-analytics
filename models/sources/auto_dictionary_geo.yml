version: 2
sources:
- name: dictionary_geo
  database: '"Dictionary"'
  schema: '"Geo"'
  description: NHS organisation boundary geometry used for geographic assignment
  tables:
  - name: OS_CCG_Map
    identifier: '"OS_CCG_Map"'
    columns:
    - name: SK_OrganisationID
      data_type: NUMBER(38,0)
    - name: geom_text
      data_type: TEXT
    - name: geom
      data_type: GEOMETRY
    - name: DateCreated
      data_type: TIMESTAMP_NTZ
    - name: DateUpdated
      data_type: TIMESTAMP_NTZ
