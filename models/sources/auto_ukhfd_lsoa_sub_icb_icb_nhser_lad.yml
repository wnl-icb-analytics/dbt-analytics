    - name: Object_ID
      data_type: TEXT
    - name: LSOA_Code
      data_type: TEXT
    - name: LSOA_Code_Year
      data_type: TEXT
    - name: Sub_ICB_Code
      data_type: TEXT
    - name: Sub_ICB_Code_Year
      data_type: TEXT
    - name: Sub_ICB_ODS_Code
      data_type: TEXT
    - name: Sub_ICB_ODS_Code_Year
      data_type: TEXT
    - name: ICB_Code
      data_type: TEXT
    - name: ICB_Code_Year
      data_type: TEXT
    - name: ICB_ODS_Code
      data_type: TEXT
    - name: ICB_ODS_Code_Year
      data_type: TEXT
    - name: NHSER_Code
      data_type: TEXT
    - name: NHSER_Code_Year
      data_type: TEXT
    - name: NHSER_ODS_Code
      data_type: TEXT
    - name: NHSER_ODS_Code_Year
      data_type: TEXT
    - name: LAD_Code
      data_type: TEXT
    - name: LAD_Code_Year
      data_type: TEXT
    - name: In_Source_Data
      data_type: NUMBER(38,0)
    - name: Effective_Snapshot_Date
      data_type: DATE
    - name: Is_Latest
      data_type: NUMBER(38,0)
    - name: Effective_From
      data_type: TIMESTAMP_NTZ
    - name: Effective_To
      data_type: TIMESTAMP_NTZ
