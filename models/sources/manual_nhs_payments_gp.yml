version: 2
sources:
- name: nhs_payments_gp
  database: '"DATA_LAKE__NCL"'
  schema: '"NHS_PAYMENTS_GP"'
  description: NHS Payments to General Practice - annual practice-level file
    (national). One row per practice per financial year; registered and
    Carr-Hill weighted list sizes plus total payments. FY 2015/16 onwards
    (earlier years lack the weighted column). Loaded by
    NHS_PAYMENTS_GP.INGEST_NHS_PAYMENTS_GP().
  tables:
  - name: PRACTICE_PAYMENTS
    identifier: '"PRACTICE_PAYMENTS"'
    columns:
    - name: FINANCIAL_YEAR
      data_type: TEXT
    - name: PRACTICE_CODE
      data_type: TEXT
    - name: PRACTICE_NAME
      data_type: TEXT
    - name: COMMISSIONER_CODE
      data_type: TEXT
    - name: COMMISSIONER_NAME
      data_type: TEXT
    - name: AVERAGE_REGISTERED_PATIENTS
      data_type: FLOAT
    - name: AVERAGE_WEIGHTED_PATIENTS
      data_type: FLOAT
    - name: TOTAL_NHS_PAYMENTS
      data_type: FLOAT
    - name: SOURCE_URL
      data_type: TEXT
    - name: _LOADED_AT
      data_type: TIMESTAMP_NTZ
