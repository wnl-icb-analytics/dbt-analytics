version: 2
sources:
- name: snomed_cluster_manager
  database: '"APPLICATIONS"'
  schema: '"SNOMED_CLUSTER_MANAGER"'
  description: SNOMED Cluster Manager app - expanded ECL code clusters
  tables:
  - name: ECL_CACHE
    description: Cached SNOMED CT expansion of Expression Constraint Language (ECL)
      definitions, one row per cluster ID and code, with refresh metadata
    columns:
    - name: CLUSTER_ID
      data_type: TEXT
    - name: CODE
      data_type: TEXT
    - name: DISPLAY
      data_type: TEXT
    - name: SYSTEM
      data_type: TEXT
    - name: LAST_REFRESHED
      data_type: TIMESTAMP_NTZ
    - name: ECL_EXPRESSION_HASH
      data_type: TEXT
