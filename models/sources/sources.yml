sources:
- name: c_ltcs
  database: '{{ ''PUBLISHED_REPORTING__DIRECT_CARE'' if target.name in [''prod'',
    ''snowflake-prod''] else (''DEV__PUBLISHED_REPORTING__DIRECT_CARE'' if target.name
    in [''dev'', ''snowflake-dev''] else target.name | upper | trim ~ ''__PUBLISHED_REPORTING__DIRECT_CARE'')
    }}'
  schema: '"C_LTCS"'
  description: C-LTCS tables
  tables:
  - name: STATUS_LOG
    identifier: STATUS_LOG
    columns:
    - name: PATIENT_ID
      data_type: TEXT
    - name: AREA_CODE
      data_type: TEXT
    - name: INTERVENTION_DATE
      data_type: DATE
    - name: ACTION
      data_type: TEXT
    - name: ACTION_DATE
      data_type: TIMESTAMP_NTZ
    - name: DETAIL
      data_type: TEXT
    - name: INTERVENTION_NAME
      data_type: TEXT
    - name: STREAM_ACTION
      data_type: TEXT
    - name: IS_UPDATE
      data_type: BOOLEAN
    - name: REPLICATED_AT
      data_type: TIMESTAMP_NTZ
    - name: SOURCE_ROW_ID
      data_type: TEXT
  - name: OP_OE_RATIO
    identifier: OP_OE_RATIO
    columns:
    - name: PATIENT_ID
      data_type: TEXT
    - name: OE_RATIO
      data_type: NUMBER(38,17)
    - name: PREDICTED
      data_type: NUMBER(38,1)
    - name: OP_ATT_TOT_12MO
      data_type: NUMBER(38,0)
  - name: CLTCS_INCLUSION_COHORT_ARCHIVE
    identifier: '"CLTCS_INCLUSION_COHORT_ARCHIVE"'
    columns:
    - name: PATIENT_ID
      data_type: TEXT
    - name: AREA_CODE
      data_type: TEXT
    - name: PRACTICE_CODE
      data_type: TEXT
    - name: COHORT_EVENT
      data_type: TEXT
    - name: IS_ACTIVE
      data_type: BOOLEAN
    - name: EVENT_WRITTEN_AT
      data_type: TIMESTAMP_NTZ
- name: pmct
  database: '"DATA_LAKE"'
  schema: '"PMCT"'
  description: Central Performance Analytics Team (PMCT)
  tables:
  - name: DiagnosticsMonthlySourceAppendReviseProvComm
    identifier: '"DiagnosticsMonthlySourceAppendReviseProvComm"'
    columns:
    - name: Period
      data_type: TEXT
    - name: Provider Parent Org Code
      data_type: TEXT
    - name: Provider Parent Name
      data_type: TEXT
    - name: Provider Org Code
      data_type: TEXT
    - name: Provider Org Name
      data_type: TEXT
    - name: Commissioner Parent Org Code
      data_type: TEXT
    - name: Commissioner Parent Name
      data_type: TEXT
    - name: Commissioner Org Code
      data_type: TEXT
    - name: Commissioner Org Name
      data_type: TEXT
    - name: Diagnostic Tests Sort Order
      data_type: FLOAT
    - name: Diagnostic Tests
      data_type: TEXT
    - name: 00 < 01 Week
      data_type: FLOAT
    - name: 01 < 02 Weeks
      data_type: FLOAT
    - name: 02 < 03 Weeks
      data_type: FLOAT
    - name: 03 < 04 Weeks
      data_type: FLOAT
    - name: 04 < 05 Weeks
      data_type: FLOAT
    - name: 05 < 06 Weeks
      data_type: FLOAT
    - name: 06 < 07 Weeks
      data_type: FLOAT
    - name: 07 < 08 Weeks
      data_type: FLOAT
    - name: 08 < 09 Weeks
      data_type: FLOAT
    - name: 09 < 10 Weeks
      data_type: FLOAT
    - name: 10 < 11 Weeks
      data_type: FLOAT
    - name: 11 < 12 Weeks
      data_type: FLOAT
    - name: 12 < 13 Weeks
      data_type: FLOAT
    - name: 13+ Weeks
      data_type: FLOAT
    - name: Total WL
      data_type: FLOAT
    - name: Waiting List Activity
      data_type: FLOAT
    - name: Planned Activity
      data_type: FLOAT
    - name: Unscheduled Activity
      data_type: FLOAT
    - name: Total Activity
      data_type: FLOAT
    - name: CreateTS
      data_type: TIMESTAMP_NTZ
- name: performance
  database: '"DATA_LAKE"'
  schema: '"PERFORMANCE"'
  description: Current Performance presentation feeds
  tables:
  - name: DiagnosticsMonthlySourceAppendReviseProvComm
    identifier: '"DiagnosticsMonthlySourceAppendReviseProvComm"'
    columns:
    - name: PERIOD
      data_type: TEXT
    - name: _INGESTED_AT
      data_type: TIMESTAMP_NTZ
- name: qadmissions
