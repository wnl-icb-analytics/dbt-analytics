version: 2
sources:
- name: ukhfd_lsoa_to_sub_icb
  database: '"UKHFD"'
  schema: '"LSOA_To_Sub_ICB"'
  description: Mapping between LSOA and Sub ICB geographies
  tables:
  - name: dim_Map_SCD
    identifier: '"dim_Map_SCD"'
    columns:
    - name: LSOA_Code
      data_type: TEXT
    - name: Sub_ICB_Location_Code
      data_type: TEXT
    - name: Sub_ICB_Location_ODS_Code
      data_type: TEXT
    - name: ICB_Code
      data_type: TEXT
    - name: ICB_ODS_Code
      data_type: TEXT
    - name: Local_Authority_District_Code
      data_type: TEXT
    - name: In_Source_Data
      data_type: NUMBER(38,0)
    - name: Effective_Snapshot_Date
      data_type: DATE
    - name: Is_Latest
      data_type: NUMBER(38,0)
    - name: Effective_From
      data_type: TIMESTAMP_NTZ
    - name: Effective_To
      data_type: TIMESTAMP_NTZ
