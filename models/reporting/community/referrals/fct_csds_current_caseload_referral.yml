version: 2
models:
- name: fct_csds_current_caseload_referral
  description: >-
    Open CSDS referrals recorded in the dataset's latest accepted month. Each row is one referral,
    including those awaiting a first attended contact. Providers whose latest submission is older are
    excluded; their evidence remains in fct_csds_latest_provider_caseload_referral. Exclusion does not
    mean discharge. This is recorded caseload, not a live list or confirmed active treatment.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: referral_period_id
    description: Key for the referral and accepted submission.
    data_tests:
    - unique
    - not_null
