version: 2
models:
- name: fct_csds_referral_summary
  description: >-
    Care and access measures for each recorded CSDS referral. Each row is one latest referral from
    fct_csds_referral, with its state in the provider's latest submission and counts of contacts by
    attendance, care activities, service teams and referral-to-treatment clocks. Each measure is
    aggregated before joining, so several contacts and teams do not multiply each other. Referrals
    without a person bridge remain. Time to first attendance describes recorded evidence, not a
    national waiting-time measure. Replaces the retiring int_csds_*_summary models.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: source_record_id
    description: Provider-qualified referral identifier, as in fct_csds_referral.
    data_tests:
    - unique
    - not_null
  - name: as_of_date
    description: Latest accepted reporting period in the dataset.
  - name: provider_latest_reporting_period_end_date
    description: The provider's latest accepted reporting period.
  - name: provider_months_behind_dataset
    description: Months between the provider's latest accepted period and the dataset's latest period.
  - name: is_provider_no_longer_submitting
    description: The provider's latest period is more than three months behind the dataset, so its referrals count as closed.
  - name: is_no_longer_submitted
    description: The referral is absent from its provider's latest submission, so it is treated as closed.
  - name: is_recorded_open
    description: Open in the provider's latest submission, with the provider still submitting. False for referrals or providers no longer submitted.
  - name: latest_recorded_access_state
    description: provider_no_longer_submitting, no_longer_submitted, or the state in the provider's latest submission (see fct_csds_referral_period).
  - name: has_no_team_in_submission
    description: No team row for this referral in its latest submission; it can still be open.
  - name: service_or_team_type_code
    description: Team type when all the referral's teams in its latest submission share one; null otherwise.
  - name: service_or_team_type_name
    description: Description of that team type.
  - name: n_contacts
    description: Latest referral/contact pairs under this referral, all attendance states.
  - name: n_attended_contacts
    description: Contacts with attendance code 5 or 6.
  - name: n_dna_contacts
    description: Contacts with code 3 (did not attend) or 7 (arrived late, not seen).
  - name: n_cancelled_contacts
    description: Contacts cancelled by the patient (2) or provider (4).
  - name: n_contacts_with_missing_attendance
    description: Contacts with no attendance code in either supplied field.
  - name: n_contacts_with_different_referral_person
    description: Contacts whose person differs from the latest referral's person.
  - name: attended_contact_minutes
    description: Sum of supplied clinical contact duration on attended contacts; null when none is supplied.
  - name: first_attended_contact_date
    description: Earliest attended contact date under this referral.
  - name: days_to_first_attended_contact
    description: Days from receipt to first attended contact; null when missing, before receipt, or when the referral predates the provider's CSDS feed.
  - name: is_received_before_provider_feed
    description: Received before the provider's first CSDS reporting month, so earlier contacts are not in the feed.
  - name: n_care_activities
    description: CYP202 activities submitted with the referral's latest contact rows.
  - name: n_service_team_relationships
    description: Latest service/team relationships under this referral.
  - name: n_service_team_types
    description: Distinct team types across those relationships.
  - name: n_rtt_clocks
    description: Distinct referral-to-treatment or response clocks (latest record of each).
