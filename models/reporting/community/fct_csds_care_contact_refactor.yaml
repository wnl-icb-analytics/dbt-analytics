# fct_csds_care_contact_refactor.yaml
version: 2
models:
- name: fct_csds_care_contact_refactor
  description: >-
    Legacy CSDS care-contact reporting from 1 April 2021 onwards. Each row represents a
    reported care contact with its available patient, provider, commissioner, practice,
    geography and service classifications. Care-contact identifiers are not unique in this
    output. Includes attended and non-attended contacts. Historical practice-code
    corrections and legacy organisation mappings are retained for comparison with the
    previous report.

  config:
    meta:
      owner:
        name: Jonathan Linney
  tests:
    - dbt_expectations.expect_table_row_count_to_be_between:
        arguments:
          min_value: 1
  columns:
    - name: primary_id
      description: Care contact identifier (not unique)
      tests:
        - not_null