# fct_csds_care_contact_refactor.yaml
version: 2
models:
- name: fct_csds_care_contact_refactor
  description: Community Services Data Set (CSDS) Care Contact model providing one row per care contact from April 2021 onwards. 
    Enriched with patient demographics, ethnicity, deprivation, GP registration, provider, commissioner, borough, PCN, neighbourhood 
    and service classification attributes for community activity reporting and analysis.
  config:
    meta:
      owner:
        name: Jonathan Linney
  tests:
    - dbt_expectations.expect_table_row_count_to_be_between:
        arguments:
          min_value: 1
  columns:
    - name: primary_id
      description: Care contact identifier (not unique)
      tests:
        - not_null