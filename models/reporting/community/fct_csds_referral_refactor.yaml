# fct_csds_referral_refactor.yaml
version: 2
models:
- name: fct_csds_referral_refactor
  description: Community Services Data Set (CSDS) referral fact table containing one record
    per unique service request. Enriched with provider, commissioner, GP practice,
    PCN, borough, neighbourhood, demographic, ethnicity, deprivation, referral
    pathway, waiting time, and referral status attributes to support operational,
    performance, equity, and population health reporting across West and North London
    and partner organisations. Includes referral activity from April 2021 onwards
    and applies standardised lookup, data quality, and enrichment logic for
    reporting consistency.
  config:
    meta:
      owner:
        name: Jonathan Linney
  tests:
    - dbt_expectations.expect_table_row_count_to_be_between:
        arguments:
          min_value: 1
  columns:
    - name: primary_id
      description: Referral record identifier (not unique)
      tests:
        - not_null