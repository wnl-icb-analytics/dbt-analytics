models:
  - name: fct_person_recent_activity_trajectories
    description: "18 month trajectories of A&E, inpatient, outpatient and GP activity
      for sparkline charts for current living residents or registrants according to PDS"
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: sk_patient_id
        data_type: varchar
        description: "Unique patient identifier"
        tests:
          - not_null
          - unique

      - name: ae_encounters_sl
        data_type: array
        description: "Count of A&E attendances per month in each of the 18 months
          prior to the last month ending"

      - name: ip_encounters_sl
        data_type: array
        description: "Count of inpatient admissions per month in each of the 18 months
          prior to the last month ending"

      - name: op_encounters_sl
        data_type: array
        description: "Count of outpatient attendances per month in each of the 18
          months prior to the last month ending"

      - name: gp_encounters_sl
        data_type: array
        description: "Count of GP appointments per month in each of the 18 months prior to the last month ending"
