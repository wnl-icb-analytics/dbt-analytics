version: 2
models:
- name: fct_person_healthcare_event
  description: One recorded source milestone per event, across the available OLIDS, MHSDS, CSDS, SUS and e-RS histories.
    Bookings, slots, contacts, referrals and inpatient transitions remain distinct. Missing person linkage or dates
    does not exclude a source record. This is a union of source evidence, not a count of unique real-world interactions
    or an inferred journey. The view is unordered; timeline queries should order by sk_patient_id, event_at and
    event_id, with nulls last. Midnight and period starts are sorting conventions; precision remains explicit.
  config:
    meta:
      owner:
        name: Eddie Davison
      custom_message: Includes OLIDS data. For secondary use, filter only the OLIDS branch through dim_person_secondary_use_allowed
        on source_person_id = person_id. Apply the relevant governance for every other source.
  columns:
  - name: sk_patient_id
    description: '{{ doc(''navigation_sk_patient_id'') }}'
  - name: event_at
    description: '{{ doc(''navigation_event_at'') }}'
  - name: event_date
    description: '{{ doc(''navigation_event_date'') }}'
  - name: event_time_precision
    description: '{{ doc(''navigation_event_time_precision'') }}'
  - name: event_type
    description: '{{ doc(''navigation_event_type'') }}'
  - name: event_name
    description: '{{ doc(''navigation_event_name'') }}'
  - name: source_dataset
    description: '{{ doc(''navigation_source_dataset'') }}'
  - name: care_setting
    description: '{{ doc(''navigation_care_setting'') }}'
  - name: care_setting_name
    description: '{{ doc(''navigation_care_setting_name'') }}'
  - name: original_code
    description: >-
      {{ doc('navigation_event_original_code') }}
  - name: original_code_name
    description: >-
      {{ doc('navigation_event_original_code_name') }}
  - name: original_coding_system
    description: >-
      {{ doc('navigation_event_original_coding_system') }}
  - name: snomed_code
    description: >-
      {{ doc('navigation_event_snomed_code') }}
  - name: snomed_code_name
    description: >-
      {{ doc('navigation_snomed_code_name') }}
  - name: snomed_mapping_method
    description: >-
      {{ doc('navigation_snomed_mapping_method') }}
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Recorded as SNOMED CT
          - OLIDS concept map
  - name: status_code
    description: '{{ doc(''navigation_status_code'') }}'
  - name: status_name
    description: '{{ doc(''navigation_status_name'') }}'
  - name: attendance_status_code
    description: '{{ doc(''navigation_attendance_code'') }}'
  - name: attendance_status_name
    description: '{{ doc(''navigation_attendance_name'') }}'
  - name: outcome_code
    description: '{{ doc(''navigation_outcome_code'') }}'
  - name: outcome_name
    description: '{{ doc(''navigation_outcome_name'') }}'
  - name: priority_code
    description: '{{ doc(''navigation_priority_code'') }}'
  - name: priority_name
    description: '{{ doc(''navigation_priority_name'') }}'
  - name: service_id
    description: Recorded e-RS service id. Action rows retain their own context; appointment slots use the latest
      observed action context.
  - name: service_name
    description: Recorded e-RS service name. Action rows retain their own context; appointment slots use the latest
      observed action context.
  - name: service_or_team_type_code
    description: '{{ doc(''navigation_service_or_team_type_code'') }}'
  - name: service_or_team_type_name
    description: '{{ doc(''navigation_service_or_team_type_name'') }}'
  - name: specialty_code
    description: '{{ doc(''navigation_specialty_code'') }}'
  - name: specialty_name
    description: '{{ doc(''navigation_specialty_name'') }}'
  - name: consultation_mechanism_code
    description: '{{ doc(''navigation_consultation_mechanism_code'') }}'
  - name: consultation_mechanism_name
    description: '{{ doc(''navigation_consultation_mechanism_name'') }}'
  - name: activity_location_type_code
    description: '{{ doc(''navigation_activity_location_type_code'') }}'
  - name: activity_location_type_name
    description: '{{ doc(''navigation_activity_location_type_name'') }}'
  - name: provider_organisation_code
    description: '{{ doc(''navigation_provider_organisation_code'') }}'
  - name: provider_organisation_name
    description: '{{ doc(''navigation_provider_organisation_name'') }}'
  - name: provider_code_authority
    description: '{{ doc(''navigation_provider_code_authority'') }}'
  - name: site_code
    description: '{{ doc(''navigation_site_code'') }}'
  - name: site_name
    description: '{{ doc(''navigation_site_name'') }}'
  - name: referring_organisation_code
    description: '{{ doc(''navigation_referring_organisation_code'') }}'
  - name: referring_organisation_name
    description: '{{ doc(''navigation_referring_organisation_name'') }}'
  - name: receiving_organisation_code
    description: '{{ doc(''navigation_receiving_organisation_code'') }}'
  - name: receiving_organisation_name
    description: '{{ doc(''navigation_receiving_organisation_name'') }}'
  - name: parent_record_type
    description: '{{ doc(''navigation_parent_record_type'') }}'
  - name: parent_record_id
    description: '{{ doc(''navigation_parent_record_id'') }}'
  - name: relationship_type
    description: '{{ doc(''navigation_relationship_type'') }}'
  - name: parent_model_name
    description: '{{ doc(''navigation_parent_model_name'') }}'
  - name: clinical_record_id
    description: '{{ doc(''navigation_clinical_record_id'') }}'
  - name: event_id
    description: '{{ doc(''navigation_event_id'') }}'
    data_tests:
    - unique
  - name: source_record_type
    description: '{{ doc(''navigation_source_record_type'') }}'
  - name: source_record_id
    description: '{{ doc(''navigation_source_record_id'') }}'
  - name: source_person_id
    description: '{{ doc(''navigation_source_person_id'') }}'
  - name: source_model_name
    description: '{{ doc(''navigation_source_model_name'') }}'
  - name: event_time_basis
    description: '{{ doc(''navigation_event_time_basis'') }}'
  - name: source_submission_period
    description: '{{ doc(''navigation_source_submission_period'') }}'
  - name: source_received_at
    description: '{{ doc(''navigation_source_received_at'') }}'
  data_tests:
  - navigation_time_consistency:
      arguments:
        record_id: event_id
        date_column: event_date
        at_column: event_at
        precision_column: event_time_precision
        at_is_sorting_anchor: true
  - navigation_snomed_method
