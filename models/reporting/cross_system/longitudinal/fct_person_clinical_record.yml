    description: '{{ doc(''navigation_medication_dose'') }}'
  - name: medication_quantity_value
    description: '{{ doc(''navigation_medication_quantity_value'') }}'
  - name: medication_quantity_unit
    description: '{{ doc(''navigation_medication_quantity_unit'') }}'
  - name: medication_duration_days
    description: '{{ doc(''navigation_medication_duration_days'') }}'
  - name: medication_authorisation_type_code
    description: '{{ doc(''navigation_medication_authorisation_type_code'') }}'
  - name: medication_authorisation_type_name
    description: '{{ doc(''navigation_medication_authorisation_type_name'') }}'
  - name: qualifier_code
    description: '{{ doc(''navigation_qualifier_code'') }}'
  - name: qualifier_name
    description: '{{ doc(''navigation_qualifier_name'') }}'
  - name: clinical_record_type_name
    description: '{{ doc(''navigation_clinical_record_type_name'') }}'
