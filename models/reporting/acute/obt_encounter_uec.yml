
models:
  - name: obt_encounter_uec
    description: "Reporting layer for urgent and emergency care encounters from SUS data."
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: visit_occurrence_id
        data_type: number
        description: "Primary key for the encounter within SUS"
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        data_type: varchar
        description: "Common commissioning patient identifier"

      - name: source
        data_type: varchar
        description: "Commissioning data source"

      - name: local_patient_identifier
        data_type: varchar
        description: "Trust-provided patient id."

      - name: organisation_id
        data_type: varchar
        description: "Organisation ID (type 41) of the provider, if invalid code trimmed to 3 characters"

      - name: organisation_name
        data_type: varchar
        description: "Provider organisation name"

      - name: site_id
        data_type: varchar
        description: "Site identifier"

      - name: site_name
        data_type: varchar
        description: "Site name"

      - name: pod
        data_type: varchar
        description: >-
          Point-of-delivery grouping derived from ECDS emergency care department
          type: 01 = AE-T1 (24-hour consultant-led emergency department),
          02 = AE-Other (other or single-specialty emergency department),
          03 = UCC (urgent treatment centre), 04 = WiC (walk-in centre),
          05 = SDEC (same day emergency care), and all other values = Others.

      - name: department_type
        data_type: varchar
        description: "Submitted ECDS Emergency Care Department Type code. This is separate from Attendance Category."

      - name: department_type_desc
        data_type: varchar
        description: "Current UKHFD description of the submitted Emergency Care Department Type code."

      - name: start_date
        data_type: date
        description: "Date of arrival at urgent care department"

      - name: start_time
        data_type: time
        description: "Time of arrival at urgent care department"
      
      - name: end_date
        data_type: date
        description: "Date of departure at urgent care department"

      - name: end_time
        data_type: time
        description: "Time of departure at urgent care department"
      
      - name: duration
        data_type: number
        description: "Time to urgent care department discharge from arrival, in minutes"

      - name: chief_complaint_code
        data_type: varchar
        description: "Chief complaint code of patient for the encounter"

      - name: chief_complaint_desc
        data_type: varchar
        description: "Chief complaint SNOMED description of patient for the encounter"

      - name: chief_complaint_ecds_group1
        data_type: varchar
        description: "Chief complaint ECDS group 1 description of patient for the encounter"

      - name: is_injury_related
        data_type: boolean
        description: "Flag for an injury related encounter"

      - name: acuity
        data_type: varchar
        description: "Clinical acuity code of the encounter"

      - name: acuity_desc
        data_type: varchar
        description: "Human-readable SNOMED CT UK preferred term for the clinical acuity code."

      - name: primary_diagnosis_code_snomed
        data_type: varchar
        description: "The first listed diagnosis SNOMED code, considered to be the most important / significant."

      - name: primary_diagnosis_desc_snomed
        data_type: varchar
        description: "The first listed diagnosis SNOMED description, considered to be the most important / significant."

      - name: primary_diagnosis_code_icd10
        data_type: varchar
        description: "The first listed diagnosis ICD-10 code, considered to be the most important / significant."

      - name: primary_diagnosis_desc_icd10
        data_type: varchar
        description: "The first listed diagnosis ICD-10 description, considered to be the most important / significant."

      - name: primary_diagnosis_desc_ecds_group1
        data_type: varchar
        description: "The first listed diagnosis ECDS group 1 description, considered to be the most important / significant."

      - name: primary_treatment
        data_type: varchar
        description: "First treatment SNOMED code recorded in encounter"

      - name: primary_treatment_desc_snomed
        data_type: varchar
        description: "First treatment SNOMED description recorded in encounter"

      - name: primary_treatment_desc_ecds_group1
        data_type: varchar
        description: "First treatment ECDS group 1 description recorded in encounter"

      - name: primary_investigation
        data_type: varchar
        description: "First investigation SNOMED code recorded in encounter"

      - name: primary_investigation_desc_snomed
        data_type: varchar
        description: "First investigation SNOMED description recorded in encounter"

      - name: primary_investigation_desc_ecds_group1
        data_type: varchar
        description: "First investigation ECDS group 1 description recorded in encounter"

      - name: arrival_mode_code
        data_type: varchar
        description: "Arrival mode SNOMED code"

      - name: arrival_mode_desc
        data_type: varchar
        description: "Arrival mode SNOMED description"

      - name: discharge_destination_code
        data_type: varchar
        description: "Discharge destination SNOMED code"

      - name: discharge_destination_desc
        data_type: varchar
        description: "Discharge destination SNOMED description"

      - name: main_specialty_code
        data_type: varchar
        description: "Allocated specialty code for the attendance: 180, emergency medicine"

      - name: main_specialty_name
        data_type: varchar
        description: "Allocated specialty name for the attendance: Emergency Medicine"

      - name: hrg_code
        data_type: varchar
        description: "Health resource group code associated with the encounter"

      - name: core_hrg_desc
        data_type: varchar
        description: "HRG description associated with the encounter"

      - name: core_hrg_chapter
        data_type: varchar
        description: "HRG chapter key associated with the encounter"

      - name: core_hrg_chapter_desc
        data_type: varchar
        description: "HRG chapter description associated with the encounter"

      - name: cost
        data_type: number
        description: >-
          National-pricing final price reported by SUS for the emergency care
          attendance. This is a submitted tariff/pricing value, not an accounting
          measure of the provider's actual cost of delivering care.

      - name: age_at_event
        data_type: number
        description: "Patient age at arrival"

      - name: gender_at_event
        data_type: varchar
        description: "The gender of a person as specified by the person or inferred by observation."

      - name: gender_desc_at_event
        data_type: varchar
        description: "Patient gender description at time of event"

      - name: ethnicity_at_event
        data_type: varchar
        description: "The ethnicity of a person, as specified by the person."

      - name: ethnicity_desc_at_event
        data_type: varchar
        description: "Patient ethnicity description at time of event"

      - name: postcode_id
        data_type: varchar
        description: "Pseudonymised postcode value supplied by SUS. It is usually partial and can contain a special pseudo postcode; it is not a postcode dictionary key."

      - name: postcode_district_at_event
        data_type: varchar
        description: "Patient postcode district at time of event"

      - name: lsoa_11_at_event
        data_type: varchar
        description: "Patient LSOA 2011 at time of event"

      - name: lad_at_event
        data_type: varchar
        description: "Patient local authority district at time of event"

      - name: imd_at_event
        data_type: varchar
        description: "Deprivation decile supplied on the ECDS attendance. The source IMD release is not documented."

      - name: deprivation_decile_at_event
        data_type: number
        description: >-
          Numeric deprivation decile for reporting, where 1 is most deprived
          and 10 is least deprived. Uses IMD 2025 where every 2021 successor
          of the attendance LSOA 2011 has the same decile, then falls back to a
          valid decile supplied on the ECDS attendance. A fallback value is not
          necessarily from IMD 2025.

      - name: reg_practice_at_event
        data_type: varchar
        description: "Registered GP practice code recorded on the attendance."

      - name: reg_practice_name_latest
        data_type: varchar
        description: "Latest national UKHFD name for reg_practice_at_event. The name is not effective-dated to the attendance."

      - name: visit_occurrence_type
        data_type: varchar
        description: "Type of visit occurrence"

      - name: cds_unique_identifier
        data_type: varchar
        description: "Identifier assigned to the submitted CDS transaction; used for source traceability, not as the encounter grain."
      - name: provider_reference_number
        data_type: varchar
        description: >-
          Locally agreed provider/commissioner reference. Its population and
          meaning vary by provider; it is not comparable across providers and is
          not an ODS code.
      - name: initial_assessment_date
        data_type: date
        description: "Date of the first formal clinical assessment in emergency care."
      - name: initial_assessment_time
        data_type: time
        description: "Time of the first formal clinical assessment in emergency care."
      - name: initial_assessment_time_since_arrival
        data_type: number
        description: "Source-reported elapsed time from arrival to initial assessment, in minutes."
      - name: seen_for_treatment_date
        data_type: date
        description: "Date the patient was first seen by a clinical professional for treatment."
      - name: seen_for_treatment_time
        data_type: time
        description: "Time the patient was first seen by a clinical professional for treatment."
      - name: seen_for_treatment_time_since_arrival
        data_type: number
        description: "Source-reported elapsed time from arrival until first seen for treatment, in minutes."
      - name: decided_to_admit_date
        data_type: date
        description: "Date the decision was made to admit the patient from emergency care."
      - name: decided_to_admit_time
        data_type: time
        description: "Time the decision was made to admit the patient from emergency care."
      - name: decided_to_admit_time_since_arrival
        data_type: number
        description: "Source-reported elapsed time from arrival to the decision to admit, in minutes."
      - name: clinically_ready_to_proceed_at
        data_type: timestamp_tz
        description: "First time a clinician decided the patient no longer needed emergency-department care (ECDS v4 Clinically Ready To Proceed)."
      - name: clinically_ready_to_proceed_time_since_arrival
        data_type: number
        description: "Source-reported elapsed time from arrival until clinically ready to proceed, in minutes."
      - name: injury_intent_code
        data_type: varchar
        description: "SNOMED CT code describing the intent associated with the injury."
      - name: injury_intent_desc
        data_type: varchar
        description: "Human-readable UK preferred term for the injury intent code."
      - name: injury_mechanism_code
        data_type: varchar
        description: "SNOMED CT code describing the mechanism that caused the injury."
      - name: injury_mechanism_desc
        data_type: varchar
        description: "Human-readable UK preferred term for the injury mechanism code."
      - name: place_of_injury_code
        data_type: varchar
        description: "SNOMED CT code describing the type of place where the injury occurred."
      - name: place_of_injury_desc
        data_type: varchar
        description: "Human-readable UK preferred term for the place-of-injury code."
      - name: injury_date
        data_type: date
        description: "Date on which the injury occurred; null when it was not recorded, including source placeholder 1900-01-01."
      - name: injury_time
        data_type: time
        description: "Time at which the injury occurred, as recorded for the attendance."
      - name: disease_notification_code
        data_type: varchar
        description: "ECDS disease-notification code recorded for the attendance."
      - name: attendance_category_code
        data_type: varchar
        description: "ECDS attendance category: 1 unplanned first; 2 unplanned follow-up at this service; 3 unplanned follow-up at another service; 4 planned follow-up at this service; X dead on arrival."
      - name: attendance_category_desc
        data_type: varchar
        description: "Human-readable description of the ECDS attendance category code."
      - name: is_arrival_planned
        data_type: boolean
        description: "Whether arrival at the emergency care department was planned."
      - name: ambulance_incident_number
        data_type: varchar
        description: "Ambulance incident number; linkage depends on the supplying ambulance dataset and identifier coverage."
      - name: conveying_ambulance_trust_code
        data_type: varchar
        description: "Cleaned organisation code of the ambulance trust that conveyed the patient."
      - name: conveying_ambulance_trust_name
        data_type: varchar
        description: "Human-readable name of the conveying ambulance trust."
      - name: ambulance_care_contact_identifier
        data_type: varchar
        description: "Ambulance care-contact identifier; linkage depends on the supplying ambulance dataset and identifier coverage."
      - name: attendance_source_code
        data_type: varchar
        description: "SNOMED CT code identifying the source that directed the patient to emergency care."
      - name: attendance_source_desc
        data_type: varchar
        description: "Human-readable UK preferred term for the attendance source code."
      - name: attendance_source_organisation_site_identifier
        data_type: varchar
        description: "Normalised organisation-site identifier for the source of the attendance."
      - name: attendance_source_organisation_name
        data_type: varchar
        description: "Human-readable site or provider name for the source organisation."
      - name: discharge_status_code
        data_type: varchar
        description: "SNOMED CT code describing the patient's status at discharge."
      - name: discharge_status_desc
        data_type: varchar
        description: "Human-readable UK preferred term for the discharge status code."
      - name: discharge_follow_up_code
        data_type: varchar
        description: "SNOMED CT code describing follow-up arranged after discharge."
      - name: discharge_follow_up_desc
        data_type: varchar
        description: "Human-readable UK preferred term for the discharge follow-up code."
      - name: discharge_information_given_code
        data_type: varchar
        description: "ECDS code describing discharge information provided to the patient."
      - name: decided_to_admit_treatment_function_code
        data_type: varchar
        description: "Treatment function code associated with the decision to admit."
      - name: decided_to_admit_treatment_function_desc
        data_type: varchar
        description: "Human-readable treatment function associated with the decision to admit."
      - name: receiving_site_id
        data_type: varchar
        description: "Normalised identifier of the site expected to receive the patient after the decision to admit."
      - name: receiving_organisation_name
        data_type: varchar
        description: "Human-readable site or provider name of the receiving organisation."
      - name: applicable_costing_period
        data_type: varchar
        description: "National-pricing costing period supplied for the attendance."
      - name: residence_area_code_at_event
        data_type: varchar
        description: "CCG or sub-ICB location code for the patient's residence postcode; not assigned payment responsibility."
      - name: residence_area_name_at_event
        data_type: varchar
        description: "Human-readable name of the residence geography."
      - name: assigned_commissioner_code_at_event
        data_type: varchar
        description: "Service-agreement commissioner code submitted for the attendance. This is not the ECDS Commissioner Assignment Method field."
      - name: assigned_commissioner_name_at_event
        data_type: varchar
        description: "Latest dictionary name for the submitted service-agreement commissioner code."
      - name: patient_type_code_at_event
        data_type: varchar
        description: "Source ECDS patient-type code, such as ADU or CHI."
      - name: patient_type_desc_at_event
        data_type: varchar
        description: "Human-readable patient type at the attendance, with ADU represented as Adult and CHI as Child."
      - name: general_practitioner_code
        data_type: varchar
        description: "Individual GP code; distinct from reg_practice_at_event, which identifies the GP practice."
      - name: financial_year
        data_type: varchar
        description: "NHS financial year derived from start_date in YYYYYY format, for example 202526."
      - name: financial_month
        data_type: number
        description: "NHS financial month derived from start_date, where April is 1 and March is 12."
      - name: financial_month_name
        data_type: varchar
        description: "Calendar month name for start_date, paired with the NHS financial month number."
      - name: week_end_date
        data_type: date
        description: "Sunday at the end of the ISO week containing start_date."
      - name: expected_treatment_at
        data_type: timestamp_tz
        description: "Expected treatment timestamp from the first source-sequenced expected-treatment record."
      - name: is_national_tariff_excluded
        data_type: boolean
        description: "Whether the attendance was excluded from national tariff pricing."
      - name: national_tariff
        data_type: number
        description: "National tariff amount before market-forces adjustment."
      - name: national_tariff_final_price
        data_type: number
        description: "Final national-pricing amount; also exposed as cost for compatibility."
      - name: mff_factor
        data_type: number
        description: "Market Forces Factor reported for the attendance."
      - name: mff_adjustment
        data_type: number
        description: "Market Forces Factor monetary adjustment reported for the attendance."
      - name: uec_activity_type_code
        data_type: varchar
        description: "Source ECDS activity type code for the urgent-care setting; distinct from pod and department_type."

      - name: uec_activity_type_desc
        data_type: varchar
        description: "Current UKHFD description of the urgent and emergency care activity type code."

      - name: uec_site_label
        data_type: varchar
        description: "Operational label for urgent treatment centres, walk-in centres and minor injuries units (for example UTC_NP), from organisation_uec_site joined on site, department type and arrival date. Null for emergency departments and sites not in the reference."
      - name: disease_notification_desc
        data_type: varchar
        description: "Human-readable SNOMED CT preferred term for the disease-notification code."

      - name: discharge_information_given_desc
        data_type: varchar
        description: "Human-readable SNOMED CT preferred term describing the discharge information given to the patient."

      - name: general_practitioner_name
        data_type: varchar
        description: "Human-readable name for general_practitioner_code; remains null when the submitted code is absent from the governed GP reference."
