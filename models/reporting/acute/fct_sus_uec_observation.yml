version: 2
models:
- name: fct_sus_uec_observation
  description: ECDS coded observations, one row per attendance and source observation sequence. Includes
    all delivered records without approval, value or date filtering. Values and units remain as reported.
    The feed includes initial observations and is not a complete series of measurements during the attendance.
    Unmatched attendances and codes are retained. Equal values and timestamps do not collapse distinct
    source sequences.
  config:
    tags:
    - daily
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: observation_id
    description: Surrogate key of ECDS record type, attendance and source sequence; grain of this model.
    data_tests:
    - unique
    - not_null
  - name: visit_occurrence_id
    description: Source attendance key; joins to obt_encounter_uec.
  - name: source_sequence
    description: Source sequence within the attendance, retained for ordering and provenance.
  - name: source_row_id
    description: Delivery row identifier, not the clinical key.
  - name: dmic_import_log_id
    description: Source import batch identifier.
  - name: sk_patient_id
    description: Pseudonymised patient key from the attendance; null where unavailable.
  - name: is_attendance_linked
    description: Whether the attendance is available in obt_encounter_uec.
  - name: attendance_date
    description: Arrival date from the attendance, not a substitute for the clinical timestamp.
  - name: organisation_id
    description: Attendance provider organisation code.
  - name: organisation_name
    description: Attendance provider organisation name.
  - name: site_id
    description: Attendance provider site code.
  - name: site_name
    description: Attendance provider site name.
  - name: observation_code
    description: Reported SNOMED CT observation code.
  - name: observation_description
    description: Latest available ETOS preferred term, falling back to the shared SNOMED CT reference.
      Null if unresolved.
  - name: measurement_category
    description: Readable ECDS measurement or assessment family. Null when the ETOS category cannot be
      resolved.
  - name: ecds_group1
    description: Published ECDS group 1 code.
  - name: code_description_source
    description: ecds_etos, snomed_ct, not_recorded or unmatched. Describes reference matching, not clinical
      validity.
  - name: is_code_approved
    description: Unmodified source approval flag; no approval is inferred from a reference match.
  - name: code_reference_file
    description: UKHFD ETOS filename for the code definition. Null if no ETOS match.
  - name: observation_value
    description: Unmodified reported measurement or categorical response.
  - name: observation_value_numeric
    description: Reported value parsed as NUMBER(38,9), rounded to nine decimal places. Null for absent
      or unparseable values; raw text remains authoritative. No unit conversion or clinical range validation.
  - name: value_parse_status
    description: not_recorded, numeric or non_numeric_or_out_of_range. Numeric parsing is not a clinical
      validity assessment.
  - name: observed_at
    description: When the observation was made or verified. Source TIMESTAMP_NTZ; the original timezone
      offset is unavailable.
  - name: ucum_unit_code
    description: Unmodified reported case-sensitive UCUM unit; missing units are not inferred.
  - name: unit_description
    description: Published label from the shared unit reference for an exact-case code or established
      alias. Null if unresolved.
  - name: unit_quantity
    description: Published kind of quantity from the matched unit reference; null if unresolved.
  - name: unit_match_status
    description: ucum_code, dictionary_symbol, known_alias, not_recorded or unmatched. Alias and dictionary
      matches do not certify UCUM validity.
  - name: categorical_value_description
    description: Published ACVPU response label for exact A, C, V, P or U after trimming whitespace. Null
      for other observations or unrecognised responses; raw text is retained.
  - name: resolved_unit_symbol
    description: Symbol from the matched reference. UCUM only when unit_definition_source is UKHFD UCUM.
      The reported value is not converted.
  - name: unit_definition_source
    description: 'Reference supplying the unit label and symbol: UKHFD UCUM or the warehouse unit dictionary.
      Null if unresolved.'
