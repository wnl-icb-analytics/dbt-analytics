models:
  - name: fct_sus_apc_monthly_spell
    description: "One row per supplied admitted-patient spell selected by dv_is_spell = 1. Retains all administrative categories and full available source history. Published separately in ACUTE_MONTHLY for monthly-feed analysis and reconciliation; not interchangeable with established ACUTE OBTs. This is activity-level data, not monthly aggregates. Refreshes on the monthly-full schedule and may lag daily/weekly data by about two months. Local derived fields with unconfirmed definitions are identified in their descriptions."
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: sk_encounter_id
        data_type: NUMBER
        description: 'Unique source encounter row identifier and model grain key.'
        data_tests:
          - not_null
          - unique
      - name: dv_extract_type
        data_type: TEXT
        description: 'As supplied in source field dv_Extract_Type.'
      - name: dv_query_id
        data_type: TEXT
        description: 'As supplied in source field dv_Query_ID.'
      - name: dv_fin_year
        data_type: TEXT
        description: 'As supplied in source field dv_FinYear.'
      - name: dv_fin_month
        data_type: NUMBER
        description: 'As supplied in source field dv_FinMonth.'
      - name: dv_activity_period_date
        data_type: NUMBER
        description: "Numeric activity-period value supplied as dv_Activity_Period_Date. The encoding, period basis and special or null meanings are not yet confirmed by the source owner. Do not interpret it as a calendar date without that definition. Reconciliation uses arrival, appointment, episode-end or spell-discharge dates for the relevant dataset."
      - name: generated_record_id
        data_type: TEXT
        description: 'As supplied in source field Generated_Record_ID.'
      - name: spell_identifier
        data_type: NUMBER
        description: 'Analytical spell linkage identifier. It is not unique in the source and is not the model key.'
      - name: unique_cds_identifier
        data_type: TEXT
        description: 'As supplied in source field Unique_CDS_Identifier.'
