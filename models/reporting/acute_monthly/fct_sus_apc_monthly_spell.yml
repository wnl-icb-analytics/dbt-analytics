      - name: tariff_total_payment_national
        data_type: NUMBER
        description: "Final calculated national payment including applicable top-ups, adjustments and MFF. It is a calculated national price, not actual provider cost or evidence of an agreed local invoice. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
