      - name: dv_mff_index_applied
        data_type: FLOAT
        description: 'As supplied in source field dv_MFF_Index_Applied.'
      - name: tariff_initial_amount_national
        data_type: NUMBER
        description: "Initial national tariff amount for the activity, before subsequent price adjustments. It depends on HRG and relevant admission/spell, short-stay and best-practice rules. This is a national price component, not actual provider cost. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: tariff_pre_mff_adjusted_national
        data_type: NUMBER
        description: "National price subtotal after applicable adjustments and before multiplication by the market forces factor (MFF). Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: applied_mff_national
        data_type: NUMBER
        description: 'As supplied in source field Applied_MFF_National.'
      - name: tariff_total_payment_national
        data_type: NUMBER
        description: "Final calculated national payment including applicable top-ups, adjustments and MFF. It is a calculated national price, not actual provider cost or evidence of an agreed local invoice. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
      - name: pbr_final_tariff
        data_type: FLOAT
        description: "Final national price, including applicable unbundled components and MFF and, for APC, excess-bed-day payment. This is a calculated price, not actual provider cost or proof of payment. Definition: NHS SUS+ extract specification v3.12; source values are retained without recalculation or monetary rescaling."
