models:
  - name: fct_sus_ae_monthly_attendance
    description: "One row per supplied A&E attendance. Retains all administrative categories and full available source history. Published separately in ACUTE_MONTHLY for monthly-feed analysis and reconciliation; not interchangeable with established ACUTE OBTs. This is activity-level data, not monthly aggregates. Refreshes on the monthly-full schedule and may lag daily/weekly data by about two months. Local derived fields with unconfirmed definitions are identified in their descriptions."
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: sk_encounter_id
        data_type: NUMBER
        description: 'Unique source encounter row identifier.'
        data_tests:
          - not_null
          - unique
      - name: dv_extract_type
        data_type: TEXT
        description: 'As supplied in source field dv_Extract_Type.'
      - name: dv_query_id
        data_type: TEXT
        description: 'As supplied in source field dv_Query_ID.'
      - name: dv_fin_year
        data_type: TEXT
        description: 'As supplied in source field dv_FinYear.'
      - name: dv_fin_month
        data_type: NUMBER
        description: 'As supplied in source field dv_FinMonth.'
      - name: dv_activity_period_date
        data_type: NUMBER
        description: "Numeric activity-period value supplied as dv_Activity_Period_Date. The encoding, period basis and special or null meanings are not yet confirmed by the source owner. Do not interpret it as a calendar date without that definition. Reconciliation uses arrival, appointment, episode-end or spell-discharge dates for the relevant dataset."
      - name: cds_record_type
        data_type: TEXT
        description: 'As supplied in source field CDS_Record_Type.'
      - name: generated_record_id
        data_type: TEXT
        description: 'As supplied in source field Generated_Record_ID.'
