      - name: submitted_commissioner_code
        data_type: TEXT
        description: "Commissioner code supplied in the monthly source. This does not apply the CAM-first assignment used by established OBTs; a filter on this field can select a different population."
      - name: residence_commissioning_area_code
        data_type: TEXT
        description: "Commissioning geography/type value supplied in source field organisation_code_pct_of_residence. The legacy source name does not establish a current PCT or SHA: code systems and meanings vary with source year and organisation changes. Retained for source reconciliation, not CAM assignment or a current organisational hierarchy."
