      Vaccination comes from the flu campaign status model. Personalised care
      adjustments are not applied. Secondary-use consumers must join
      DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-Out and Type
      1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind141
        indicator:
          id: "IND141"
          type: "MEASURE"
          category: "IMMUNISATION"
          clinical_domain: "Prevention"
          name_short: "COPD flu vaccination"
          description_short: "Flu vaccination in the most recent completed season for people with COPD"
          description_long: "NICE IND141 before personalised care adjustments. Contraindication exclusion applied."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND141"
    columns: *flu_columns

