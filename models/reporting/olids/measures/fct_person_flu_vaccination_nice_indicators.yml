models:
  - name: fct_person_flu_vaccination_ind131
    description: >
      NICE IND131 flu vaccination in coronary heart disease. One row per
      currently registered, living, non-test person on the CHD register,
      assessed on the build date, excluding a flu vaccination contraindication
      recorded in the preceding 12 months. The season window is the preceding 1 August to 31 March, read as the most recently completed season so the figure is stable through the year; measurement_period_start is that season's 1 August. Vaccination comes from the flu campaign status model.
      Personalised care adjustments are not applied. Secondary-use consumers
      must join DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-
      Out and Type 1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind131
        indicator:
          id: "IND131"
          type: "MEASURE"
          category: "IMMUNISATION"
          clinical_domain: "Prevention"
          name_short: "CHD flu vaccination"
          description_short: "Flu vaccination in the most recent completed season for people with coronary heart disease"
          description_long: "NICE IND131 before personalised care adjustments. Contraindication exclusion applied."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND131"
    columns: &flu_columns
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_vaccination_date
        description: Latest vaccination date in the season window; null when none
      - name: is_laiv
        description: Whether a vaccination in the window was the live attenuated nasal vaccine; null when none
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD

  - name: fct_person_flu_vaccination_ind141
