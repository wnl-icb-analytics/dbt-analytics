models:
  - name: fct_person_childhood_immunisation_ind215
    description: >
      NICE IND215 primary DTaP course. One row per currently registered baby
      whose eighth-month milestone falls in the preceding 12 months, assessed
      on the build date. The numerator requires three 6-in-1 doses before 8
      months of age. Children with a contraindicated code for the vaccine are
      excluded, as NICE specifies; anaphylaxis and immunocompromise are not
      separately modelled. Doses are distinct administration dates by vaccine
      group from the childhood immunisation events, with age windows measured
      from the approximate birth date. Personalised care adjustments are not
      applied. Secondary-use consumers must join
      DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-Out and Type
      1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind215
        indicator:
          id: "IND215"
          type: "MEASURE"
          category: "IMMUNISATION"
          clinical_domain: "Prevention"
          name_short: "DTaP 3 doses by 8 months"
          description_short: "Three 6-in-1 doses before 8 months for babies reaching 8 months in the preceding 12 months"
          description_long: "NICE IND215 before personalised care adjustments. Contraindication exclusion applied."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND215"
    columns: &childhood_columns
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: birth_date_approx
        description: Approximate birth date (mid-month)
      - name: milestone_date
        description: Date the child reached the indicator's milestone age, which falls in the preceding 12 months
      - name: doses_in_window
        description: Distinct administration dates for the indicator's vaccine within its age window
      - name: is_in_denominator
        description: Always true; every row is an eligible child before personalised care adjustments
      - name: is_in_numerator
        description: Whether the child received the required doses within the age window
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD

