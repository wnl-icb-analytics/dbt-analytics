        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind217
        indicator:
          id: "IND217"
          type: "MEASURE"
          category: "IMMUNISATION"
          clinical_domain: "Prevention"
          name_short: "DTaP/IPV and 2 MMR by 5 years"
          description_short: "Preschool booster and two MMR doses between 1 and 5 years for children reaching 5 in the preceding 12 months"
          description_long: "NICE IND217 before personalised care adjustments. Contraindication exclusion applied."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND217"
