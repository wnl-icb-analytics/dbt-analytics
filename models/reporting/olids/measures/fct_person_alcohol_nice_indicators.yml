      a listed long-term condition register whose latest positive alcohol
      screen falls in the preceding 2 years, assessed on the build date.
      People with an alcohol-related disease or disorder recorded are
      excluded. The numerator requires a brief intervention within 3 months
      after the latest positive screen. Personalised care adjustments are not
      applied. Secondary-use consumers must join
      DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-Out and Type
      1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind202
        indicator:
          id: "IND202"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "LTC alcohol intervention"
          description_short: "Brief intervention within 3 months of a positive alcohol screen for people with a listed long-term condition"
          description_long: "NICE IND202 before personalised care adjustments."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
