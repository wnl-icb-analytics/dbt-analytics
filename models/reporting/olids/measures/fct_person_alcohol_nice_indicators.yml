      disorder recorded are excluded. The numerator requires a FAST, AUDIT-C
      or AUDIT screen in the preceding 2 years. Personalised care adjustments
      are not applied. Secondary-use consumers must join
      DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-Out and Type
      1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind201
        indicator:
          id: "IND201"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "LTC alcohol screen"
          description_short: "Alcohol screening in the preceding 2 years for people with a listed long-term condition"
          description_long: "NICE IND201 before personalised care adjustments."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND201"
    columns: *alcohol_columns

  - name: fct_person_alcohol_ind202
    description: >
      NICE IND202 brief intervention after a positive screen in long-term
