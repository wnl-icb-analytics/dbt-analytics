  - name: fct_person_alcohol_nice_indicators
    description: >
      NICE IND196 to IND202 alcohol use status in a common interface. One row
      per person and indicator on the current reporting date. Indicator-
      specific views remain the source of each population definition.
      Personalised care adjustments are not applied. Secondary-use consumers
      must join DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-
      Out and Type 1 opt-out filtering. Feeds
      fct_person_nice_indicator_status.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person in the indicator denominator
      - name: indicator_id
        description: NICE indicator identifier
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND196', 'IND197', 'IND198', 'IND199', 'IND200', 'IND201', 'IND202']
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']
      - name: new_diagnosis_date
        description: Earliest qualifying new diagnosis date for the new-diagnosis indicators; null for others
      - name: latest_alcohol_screen_date
        description: Date of the latest alcohol screen; null if none
      - name: latest_positive_alcohol_screen_date
        description: Date of the latest positive screen; null if none
      - name: latest_intervention_after_positive_screen_date
        description: Date of the latest brief intervention within 3 months after the latest positive screen; null if none
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none

  - name: fct_person_alcohol_nice_indicators_snapshot_input
    description: >
      Thin snapshot-input projection of fct_person_alcohol_nice_indicators:
      person, indicator, current practice, latest qualifying record and
      outcome. Excludes reporting_date and measurement_period_start, which
      advance on every build, so the SCD2 snapshot versions only on genuine
      changes. Feeds fct_person_alcohol_nice_indicators_snapshot.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: indicator_id
        description: NICE indicator identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: current_practice_code
        description: ODS code of the current registration practice at the build.
      - name: latest_alcohol_screen_date
        description: Date of the latest alcohol screen at the build.
      - name: latest_positive_alcohol_screen_date
        description: Date of the latest positive screen at the build.
      - name: latest_intervention_after_positive_screen_date
        description: Date of the latest brief intervention after the latest positive screen at the build.
      - name: is_in_numerator
        description: Whether the person met the indicator at the build.
      - name: indicator_status
        description: Outcome label at the build.
