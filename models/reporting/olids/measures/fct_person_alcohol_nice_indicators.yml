models:
  - name: fct_person_alcohol_ind196
    description: >
      NICE IND196 alcohol screening at hypertension diagnosis. One row per
      currently registered, living, non-test person whose earliest
      hypertension diagnosis falls in the preceding 12 months, assessed on the
      build date. People with an alcohol-related disease or disorder recorded
      are excluded. The numerator requires a FAST, AUDIT-C or AUDIT screen
      within 3 months either side of the diagnosis date. Personalised care
      adjustments are not applied. Secondary-use consumers must join
      DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-Out and Type
      1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind196
        indicator:
          id: "IND196"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "New hypertension alcohol screen"
          description_short: "Alcohol screening within 3 months of a new hypertension diagnosis"
          description_long: "NICE IND196 before personalised care adjustments."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND196"
    columns: &alcohol_columns
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: new_diagnosis_date
        description: Earliest qualifying new diagnosis date for the new-diagnosis indicators; null for others
      - name: latest_alcohol_screen_date
        description: Date of the latest FAST, AUDIT-C or AUDIT screen; null if none
      - name: latest_alcohol_screen_tool
        description: Tool used for the latest screen
      - name: latest_alcohol_screen_score
        description: Score of the latest screen; null when unscored
      - name: latest_positive_alcohol_screen_date
        description: Date of the latest screen meeting the hazardous-drinking threshold; null if none
      - name: latest_intervention_after_positive_screen_date
        description: Date of the latest brief intervention within 3 months after the latest positive screen; null if none
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD

  - name: fct_person_alcohol_ind197
    description: >
      NICE IND197 brief intervention after a positive screen at hypertension
      diagnosis. One row per currently registered, living, non-test person
      whose earliest hypertension diagnosis and latest positive alcohol screen
      (FAST 3 or more, AUDIT-C 5 or more, or AUDIT 8 or more) both fall in the
      preceding 12 months, assessed on the build date. People with an alcohol-
      related disease or disorder recorded are excluded. The numerator
      requires a brief intervention within 3 months after the latest positive
      screen. Personalised care adjustments are not applied. Secondary-use
      consumers must join DIM_PERSON_SECONDARY_USE_ALLOWED to apply National
      Data Opt-Out and Type 1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind197
        indicator:
          id: "IND197"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "New hypertension alcohol intervention"
          description_short: "Brief intervention within 3 months of a positive alcohol screen for people newly diagnosed with hypertension"
          description_long: "NICE IND197 before personalised care adjustments."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND197"
    columns: *alcohol_columns

