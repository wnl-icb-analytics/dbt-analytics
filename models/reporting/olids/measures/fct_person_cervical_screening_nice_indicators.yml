models:
  - name: fct_person_cervical_screening_ind176
    description: >
      NICE IND176 cervical screening at 25 to 49. One row per currently
      registered, living, non-test woman aged 25 to 49, assessed on the build
      date. Women whose any unsuitable screening record are
      excluded as the nearest available reading of NICE's "without a cervix";
      adequacy of the sample is not recorded, so any completed screening
      record counts. Women with a non-response-to-invitations code in the
      preceding 12 months or a pregnancy code in the preceding 9 months are
      excluded, as NICE specifies. The numerator requires a completed
      screening record in the preceding 3.5 years. Personalised care
      adjustments are not applied. Secondary-use consumers must join
      DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-Out and Type
      1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind176
        indicator:
          id: "IND176"
          type: "MEASURE"
          category: "SCREENING"
          clinical_domain: "Prevention"
          name_short: "Cervical screening 25 to 49"
          description_short: "Cervical screening recorded in the preceding 3.5 years for women aged 25 to 49"
          description_long: "NICE IND176 before personalised care adjustments. Unsuitable, non-response and pregnancy exclusions applied."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND176"
    columns: &cervical_columns
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_completed_date
        description: Date of the latest completed cervical screening record, regardless of period; null if never screened
      - name: latest_screening_date
        description: Date of the latest cervical screening record of any type; null when none
      - name: latest_screening_date
        description: Date of the latest cervical screening record of any type
      - name: programme_status
        description: Programme status from the screening model (Up to Date, Overdue, Never Screened, Unsuitable, Unknown)
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD

