models:
  - name: fct_person_diabetes_triple_target
    description: >-
      National Diabetes Audit treatment targets (triple target) for current diabetes register
      members. One row per person on the build date.


      {{ doc('diabetes_triple_target_rules') }}
    config:
      meta:
        clinical_source: https://digital.nhs.uk/data-and-information/publications/statistical/national-diabetes-audit/report-1-care-processes-and-treatment-targets-2021-22-full-report/methodology-copy
        indicator:
          id: "DM_TRIPLE_TARGET"
          type: "MEASURE"
          category: "DIABETES_QUALITY"
          clinical_domain: "Cardiometabolic"
          name_short: "Diabetes Triple Target Achievement"
          description_short: "NDA treatment targets: HbA1c ≤58 mmol/mol, BP ≤140/80 mmHg and statin where indicated"
          description_long: >
            National Diabetes Audit treatment targets in the 15 calendar months ending in the
            reporting month: latest HbA1c at or below 58 mmol/mol, latest blood pressure at or
            below 140/80 mmHg, and a statin prescribed for people aged 40 to 80 or with CVD.
          is_qof: false
          source_column: "all_three_targets_met"
          usage_contexts:
            - "DIABETES_CARE_MONITORING"
          code_clusters:
            - cluster_id: "DM_COD"
              category: "INCLUSION"
            - cluster_id: "DMTYPE1_COD"
              category: "INCLUSION"
            - cluster_id: "DMTYPE2_COD"
              category: "INCLUSION"
            - cluster_id: "IFCCHBAM_COD"
              category: "CALCULATION"
            - cluster_id: "BP_COD"
              category: "CALCULATION"
          thresholds:
            - population_group: "DIABETES"
              threshold_type: "HBA1C_TARGET"
              threshold_value: "58"
              threshold_operator: "AT_OR_BELOW"
              threshold_unit: "mmol/mol"
              description: "NDA HbA1c treatment target"
              sort_order: 1
            - population_group: "DIABETES"
              threshold_type: "BP_TARGET_SYSTOLIC"
              threshold_value: "140"
              threshold_operator: "AT_OR_BELOW"
              threshold_unit: "mmHg"
              description: "NDA systolic blood pressure treatment target"
              sort_order: 2
            - population_group: "DIABETES"
              threshold_type: "BP_TARGET_DIASTOLIC"
              threshold_value: "80"
              threshold_operator: "AT_OR_BELOW"
              threshold_unit: "mmHg"
              description: "NDA diastolic blood pressure treatment target"
              sort_order: 3
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
    columns:
      - name: person_id
        description: Person on the diabetes register.
        data_tests:
          - not_null
      - name: reporting_date
        description: Build date on which the population and readings are assessed.
      - name: measurement_period_start
        description: "{{ doc('diabetes_triple_target_measurement_period_start') }}"
      - name: age
        description: Age in completed years on the build date, from the approximate birth date; null when unknown.
      - name: current_practice_code
        description: ODS code of the current registration practice.
      - name: current_practice_name
        description: Name of the current registration practice.
      - name: diabetes_type
        description: Type 1, Type 2 or Unknown from the diabetes register; Type 1 wins a same-day tie.
      - name: nda_diabetes_type
        description: "{{ doc('diabetes_triple_target_nda_diabetes_type') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['Type 1', 'Type 2 and other']
      - name: latest_hba1c_date
        description: "{{ doc('diabetes_triple_target_latest_hba1c_date') }}"
      - name: latest_hba1c_value
        description: "{{ doc('diabetes_triple_target_latest_hba1c_value') }}"
      - name: is_latest_hba1c_valid
        description: Latest HbA1c in the audit period is IFCC 20 to 200 mmol/mol or DCCT 3 to 20%, inclusive. False when none is recorded.
      - name: is_hba1c_recorded_in_period
        description: An HbA1c test is recorded in the audit period, including tests with missing or invalid results.
      - name: hba1c_in_target_range
        description: "{{ doc('diabetes_triple_target_hba1c_in_target_range') }}"
      - name: latest_bp_date
        description: "{{ doc('diabetes_triple_target_latest_bp_date') }}"
      - name: latest_systolic_value
        description: Systolic value in mmHg of the latest blood pressure in the audit period.
      - name: latest_diastolic_value
        description: Diastolic value in mmHg of the latest blood pressure in the audit period.
      - name: is_valid_bp
        description: Both latest blood pressure components are in the plausible range. False when none is recorded.
      - name: is_bp_recorded_in_period
        description: A complete blood pressure pair is recorded in the audit period.
      - name: bp_in_target_range
        description: "{{ doc('diabetes_triple_target_bp_in_target_range') }}"
      - name: has_cvd
        description: "{{ doc('diabetes_triple_target_has_cvd') }}"
      - name: is_statin_indicated
        description: "{{ doc('diabetes_triple_target_is_statin_indicated') }}"
      - name: latest_statin_order_date
        description: Latest statin or statin-combination order on or before the reporting date; null when none is recorded.
      - name: is_statin_prescribed_in_period
        description: A statin order is dated in the audit period.
      - name: is_statin_target_met
        description: "{{ doc('diabetes_triple_target_is_statin_target_met') }}"
      - name: all_three_targets_met
        description: "{{ doc('diabetes_triple_target_all_three_targets_met') }}"
        data_tests:
          - not_null
