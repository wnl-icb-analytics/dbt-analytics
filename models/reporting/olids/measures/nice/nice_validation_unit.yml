- name: nice_fix_ind101_same_day_and_before_mrc
  model: fct_person_copd_pulmonary_rehabilitation_ind101_by_month
  given:
  - input: ref('int_mrc_dyspnoea_all')
    format: sql
    rows: SELECT person_id, '2025-06-01'::DATE AS clinical_effective_date, 3 AS mrc_grade FROM (SELECT column1::NUMBER
      AS person_id, '2026-03-31'::DATE AS reporting_date, 50 AS age, '1976-01-01'::DATE AS birth_date_approx, 'SYNTHETIC'::VARCHAR
      AS practice_code, 'Synthetic practice'::VARCHAR AS practice_name FROM VALUES (-99101), (-99102))
  - input: ref('int_referral_pulmonary_rehab')
    format: sql
    rows: SELECT NULL::NUMBER AS person_id, NULL::DATE AS clinical_effective_date, NULL::VARCHAR AS pr_obs_type
      WHERE FALSE
  - input: ref('int_ltc_review_all')
    format: sql
    rows: SELECT NULL::NUMBER AS person_id, NULL::DATE AS clinical_effective_date, NULL::VARCHAR AS review_type
      WHERE FALSE
  - input: ref('int_nice_copd_observations_all')
    format: sql
    rows: SELECT column1::NUMBER AS person_id, column2::DATE AS event_date, 'PULREHAB_OFFERED_COD'::VARCHAR AS evidence_type
      FROM VALUES (-99101,'2025-06-01'),(-99102,'2025-05-31')
  expect:
    rows:
    - person_id: -99101
      latest_offer_date: '2025-06-01'
      is_in_numerator: true
    - person_id: -99102
      latest_offer_date: null
      is_in_numerator: false
  config:
    tags:
    - nice-validation
  overrides:
    macros:
      nice_reference_population: SELECT column1::NUMBER AS person_id, '2026-03-31'::DATE AS reporting_date, 50 AS
        age, '1976-01-01'::DATE AS birth_date_approx, 'SYNTHETIC'::VARCHAR AS practice_code, 'Synthetic practice'::VARCHAR
        AS practice_name FROM VALUES (-99101), (-99102)
      nice_register: SELECT person_id, reporting_date, '2020-01-01'::DATE AS earliest_diagnosis_date FROM (SELECT
        column1::NUMBER AS person_id, '2026-03-31'::DATE AS reporting_date, 50 AS age, '1976-01-01'::DATE AS birth_date_approx,
        'SYNTHETIC'::VARCHAR AS practice_code, 'Synthetic practice'::VARCHAR AS practice_name FROM VALUES (-99101),
        (-99102))
