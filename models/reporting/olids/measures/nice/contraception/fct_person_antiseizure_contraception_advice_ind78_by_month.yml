models:
- name: fct_person_antiseizure_contraception_advice_ind78_by_month
  description: Reproductive counselling. One row per active, living, non-test woman under 55 taking antiseizure
    medication at R. An EPILDRUG_COD order in (R minus six months, R] defines treatment, including users
    without epilepsy. has_epilepsy identifies EP register membership. Sterilisation or partial/complete
    hysterectomy through R excludes the woman. Achievement requires both contraception-topic advice (ECL_CACHE
    CONTRACEPTION_ADVICE_TOPIC_COD or PCD EPILCC_COD) and conception/pregnancy-topic advice (ECL_CACHE
    PREGNANCY_ADVICE_TOPIC_COD or PCD EPILPA_COD/EPILPCA_COD) in [R minus twelve months, R]. One record
    in both topic lists can meet both. Codes do not establish individual tailoring. Recalculated at 60
    completed month-ends with current rules and code lists. Registration and practice follow the monthly
    spine; current gender and test flags apply retrospectively. Later corrections can change earlier results.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind78
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: person_id
    description: Person in the denominator.
  - name: reporting_date
    description: Date used to assess eligibility and evidence.
  - name: measurement_period_start
    description: Reporting date minus twelve months. Advice includes this boundary.
  - name: latest_record_date
    description: Later of the two latest topic dates when both topics qualify; otherwise null.
  - name: is_in_denominator
    description: Always true.
  - name: is_in_numerator
    description: Whether the advice rule is met.
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD.
  - name: latest_asm_date
    description: Latest antiseizure order through the reporting date.
  - name: has_epilepsy
    description: Whether the woman belongs to the epilepsy register at the reporting date; all antiseizure
      users remain eligible.
  - name: latest_contraception_advice_date
    description: Latest contraception-topic advice in the inclusive twelve months to R; null means no
      qualifying evidence.
  - name: latest_pregnancy_advice_date
    description: Latest conception/pregnancy-topic advice in the inclusive twelve months to R; null means
      no qualifying evidence.
