models:
- name: fct_person_oral_patch_larc_advice_ind148
  description: LARC information. One row per active, living, non-test woman aged 54 or under with a practice-issued
    CONTRACEP_COC_RX, CONTRACEP_POP_RX or CONTRACEP_PATCH_RX order in (reporting date minus twelve months,
    reporting date]. Achievement requires LARC_ADV_COD in the inclusive twelve months to the reporting
    date. LARC advice and sexual-health exception exclusions have no available list and are not applied.
    Practice-issued means Electronic, Print or Handwritten; outside, OTC and missing issue methods do
    not count.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind148
      indicator:
        id: IND148
        type: MEASURE
        category: CONTRACEPTION
        clinical_domain: CONTRACEPTION
        name_short: LARC information for women using oral or patch contraception
        description_short: LARC information for women using oral or patch contraception
        description_long: LARC information. One row per active, living, non-test woman aged 54 or under
          with a practice-issued CONTRACEP_COC_RX, CONTRACEP_POP_RX or CONTRACEP_PATCH_RX order in (reporting
          date minus twelve months, reporting date]. Achievement requires LARC_ADV_COD in the inclusive
          twelve months to the reporting date. LARC advice and sexual-health exception exclusions have
          no available list and are not applied. Practice-issued means Electronic, Print or Handwritten;
          outside, OTC and missing issue methods do not count.
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND148
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: person_id
    description: Person in the denominator.
  - name: reporting_date
    description: Date used to assess eligibility and evidence.
  - name: measurement_period_start
    description: Reporting date minus twelve months. The prescription cohort excludes this boundary; advice
      has the window stated in the model description.
  - name: latest_record_date
    description: Latest qualifying advice date; null means the advice rule is not met.
  - name: is_in_denominator
    description: Always true.
  - name: is_in_numerator
    description: Whether the advice rule is met.
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD.
  - name: latest_oral_patch_date
    description: Latest practice-issued oral or patch order through the reporting date.
