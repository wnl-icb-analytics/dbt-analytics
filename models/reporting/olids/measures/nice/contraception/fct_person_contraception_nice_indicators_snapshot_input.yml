models:
- name: fct_person_contraception_nice_indicators_snapshot_input
  description: >-
    Contraception advice evidence for change history (IND116, IND117, IND124, IND148,
    IND149). One row per eligible person and indicator.


    Records practice, supporting evidence and achievement from the build date. Reporting date and
    measurement period start are omitted, so the passing of a day alone does not create a new
    version. Eligibility and achievement follow the individual measures.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
  columns:
