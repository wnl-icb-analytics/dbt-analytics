models:
- name: fct_person_contraception_nice_indicators_snapshot_input
  description: Current NICE contraception outcomes for snapshotting, one row per person and indicator.
    Assessment date and measurement-period start are omitted so daily builds do not create versions without
    a change in evidence, practice or outcome.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
