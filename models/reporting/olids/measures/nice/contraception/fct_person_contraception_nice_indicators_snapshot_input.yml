models:
- name: fct_person_contraception_nice_indicators_snapshot_input
  description: Current NICE contraception outcomes at the build date. One row per eligible, active, living,
    non-test woman and indicator. Assessment date and measurement-period start are omitted so daily builds
    do not create versions without a change in evidence, practice or outcome.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
  columns:
  - name: latest_contraception_advice_date
    description: Latest contraception-topic advice in the inclusive twelve months to R; null means no
      qualifying evidence.
  - name: latest_pregnancy_advice_date
    description: Latest conception/pregnancy-topic advice in the inclusive twelve months to R; null means
      no qualifying evidence.
  - name: has_epilepsy
    description: EP register membership for IND78; null for other indicators.
