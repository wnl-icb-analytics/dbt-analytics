models:
- name: fct_person_contraception_nice_indicators
  description: >-
    Contraception advice indicator results (IND116, IND117, IND124, IND148,
    IND149). One row per eligible person and indicator on the build date.


    People registered on the build date in each indicator's denominator. Eligibility,
    exclusions and achievement follow the individual measures. Supporting fields are null
    where an indicator does not provide them.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: current_practice_code
    description: "ODS code of the registration practice at the reporting date."
  - name: current_practice_name
    description: "Name of the registration practice at the reporting date."
  - name: latest_asm_date
    description: >-
      Latest antiseizure prescription on or before the reporting date; null if absent. Null when
      this field does not apply to the indicator.
  - name: latest_oral_patch_date
    description: >-
      Latest practice-issued oral or patch contraceptive prescription on or before the reporting
      date; null if absent. Null when this field does not apply to the indicator.
  - name: latest_ehc_date
    description: >-
      Latest practice-issued emergency hormonal contraception prescription on or before the
      reporting date. Null when this field does not apply to the indicator.
  - name: latest_non_specific_advice_date
    description: >-
      Latest general advice about long-acting reversible contraception from the prescription day to
      31 days afterwards, inclusive; null if absent. Null when this field does not apply to the
      indicator.
  - name: latest_written_advice_date
    description: >-
      Latest written advice or leaflet about long-acting reversible contraception from the
      prescription day to 31 days afterwards, inclusive; null if absent. Null when this field does
      not apply to the indicator.
  - name: latest_verbal_advice_date
    description: >-
      Latest verbal advice about long-acting reversible contraception from the prescription day to
      31 days afterwards, inclusive; null if absent. Null when this field does not apply to the
      indicator.
  - name: has_unknown_modality_advice
    description: >-
      True when method education with an unknown advice format occurs within the 31-day follow-up
      period. It does not count towards achievement. Null when this field does not apply to the
      indicator.
