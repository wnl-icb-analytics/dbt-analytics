models:
- name: fct_person_diabetes_contraception_advice_ind116
  description: >-
    Reproductive advice for women with diabetes (NICE IND116). One row per person in the
    denominator on the build date.


    People registered on the build date recorded as women aged 17 to 44 on the diabetes
    register. No exclusions apply. Achieved with pregnancy, conception or contraception
    advice in the 12 months before the build date. A single record counts; codes do not
    establish full topic coverage or tailoring to the woman's intentions. No personalised
    care adjustments are applied. Based on NICE NG3. Code lists: DM_COD (PCD);
    CONTRACEP_ADV_COD, LARC_ADV_COD (ECL cache); EPILCC_COD, EPILPA_COD, EPILPCA_COD
    (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind116
      indicator:
        id: IND116
        type: MEASURE
        category: CONTRACEPTION
        clinical_domain: CONTRACEPTION
        name_short: "Diabetes reproductive advice"
        description_short: "Reproductive advice for women with diabetes."
        description_long: >-
          People registered on the build date recorded as women aged 17 to 44 on the
          diabetes register. No exclusions apply. Achieved with pregnancy,
          conception or contraception advice in the 12 months before the build date.
          A single record counts; codes do not establish full topic coverage or
          tailoring to the woman's intentions. No personalised care adjustments are
          applied. Based on NICE NG3. Code lists: DM_COD (PCD); CONTRACEP_ADV_COD,
          LARC_ADV_COD (ECL cache); EPILCC_COD, EPILPA_COD, EPILPCA_COD (PCD).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND116
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: reporting_date
    description: "Build date used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "12 months before the reporting date, included in the advice window."
  - name: latest_record_date
    description: "Latest qualifying advice in the 12-month window; null if absent."
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "True when the person meets the achievement rules in the model description."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
