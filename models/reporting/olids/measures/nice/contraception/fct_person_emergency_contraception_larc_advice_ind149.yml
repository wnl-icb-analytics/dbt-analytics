models:
- name: fct_person_emergency_contraception_larc_advice_ind149
  description: LARC information after EHC. One row per active, living, non-test woman aged 54 or under
    with practice-issued CONTRACEP_EHC_RX in (reporting date minus twelve months, reporting date]. The
    latest qualifying issue anchors advice from the issue date through 31 days later, inclusive, capped
    at the build date. Achievement requires non-specific LARC advice or both written and verbal advice
    from LARC_ADV_COD. Modality comes from maintained code descriptions; generic method education has
    unknown modality and cannot achieve. Recent issues remain eligible with incomplete follow-up. No
    exclusions apply. Practice-issued means Electronic, Print or Handwritten; outside, OTC and missing
    issue methods do not count.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind149
      indicator:
        id: IND149
        type: MEASURE
        category: CONTRACEPTION
        clinical_domain: CONTRACEPTION
        name_short: LARC information after emergency hormonal contraception
        description_short: LARC information after emergency hormonal contraception
        description_long: LARC information after EHC. One row per active, living, non-test woman aged 54
          or under with practice-issued CONTRACEP_EHC_RX in (reporting date minus twelve months,
          reporting date]. The latest qualifying issue anchors advice from the issue date through 31 days
          later, inclusive, capped at the build date. Achievement requires non-specific LARC advice or
          both written and verbal advice from LARC_ADV_COD. Modality comes from maintained code
          descriptions; generic method education has unknown modality and cannot achieve. Recent issues
          remain eligible with incomplete follow-up. No exclusions apply. Practice-issued means
          Electronic, Print or Handwritten; outside, OTC and missing issue methods do not count.
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND149
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: person_id
    description: Person in the denominator.
  - name: reporting_date
    description: Date used to assess eligibility and evidence.
  - name: measurement_period_start
    description: Reporting date minus twelve months. The prescription cohort excludes this boundary; advice
      has the window stated in the model description.
  - name: latest_record_date
    description: Latest qualifying advice date; null means the advice rule is not met.
  - name: is_in_denominator
    description: Always true.
  - name: is_in_numerator
    description: Whether the advice rule is met.
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD.
  - name: latest_ehc_date
    description: Latest practice-issued emergency hormonal contraceptive issue through the reporting date.
  - name: latest_non_specific_advice_date
    description: Latest non-specific LARC advice in the issue follow-up window; null means none.
  - name: latest_written_advice_date
    description: Latest written LARC advice or leaflet in the issue follow-up window; null means none.
  - name: latest_verbal_advice_date
    description: Latest explicit verbal LARC advice in the issue follow-up window; null means none.
  - name: has_unknown_modality_advice
    description: Whether method education with unknown modality occurs in the follow-up window. It does
      not establish achievement.
