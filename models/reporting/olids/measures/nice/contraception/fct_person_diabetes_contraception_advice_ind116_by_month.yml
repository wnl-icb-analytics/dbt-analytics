models:
- name: fct_person_diabetes_contraception_advice_ind116_by_month
  description: >-
    Reproductive advice for women with diabetes (NICE IND116). One row per person in the
    denominator at each month-end.


    People registered at the month-end recorded as women aged 17 to 44 on the diabetes
    register. No exclusions apply. Achieved with pregnancy, conception or contraception
    advice in the 12 months before the month-end. A single record counts; codes do not
    establish full topic coverage or tailoring to the woman's intentions. No personalised
    care adjustments are applied. Based on NICE NG3. Recalculated for each of the last 60
    month-ends with current rules, code lists and records, so later corrections can change
    past months. Code lists: DM_COD (PCD); CONTRACEP_ADV_COD, LARC_ADV_COD (ECL cache);
    EPILCC_COD, EPILPA_COD, EPILPCA_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind116
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "12 months before the reporting date, included in the advice window."
  - name: latest_record_date
    description: "Latest qualifying advice in the 12-month window; null if absent."
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "True when the person meets the achievement rules in the model description."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
