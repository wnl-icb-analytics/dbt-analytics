          HYST2_COD. Achievement requires EPILCC_COD contraception advice, EPILPA_COD pregnancy advice
          or EPILPCA_COD pre-conception advice in the inclusive twelve months to reporting date. No personalised
          care adjustments apply. Recalculated for the last 60 completed month-ends using current rules
          and code lists. Registration and practice follow the monthly spine. Birth and death dates are
          approximate; current gender and test flags apply retrospectively. Diagnoses use clinical and
