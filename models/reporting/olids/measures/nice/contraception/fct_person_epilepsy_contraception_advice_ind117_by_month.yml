models:
- name: fct_person_epilepsy_contraception_advice_ind117_by_month
  description: >-
    Reproductive advice for women with epilepsy (NICE IND117). One row per person in the
    denominator at each month-end.


    People registered at the month-end recorded as women aged 18 to 44 with unresolved
    epilepsy and an antiseizure prescription in the last 6 months. Excludes sterilisation
    or partial or complete hysterectomy. Achieved with pregnancy, conception or
    contraception advice in the last 12 months. A single record counts; codes do not
    establish full topic coverage or tailoring to the woman's intentions. No personalised
    care adjustments are applied. Based on NICE NG217. Recalculated for each of the last
    60 month-ends with current rules, code lists and records, so later corrections can
    change past months. Code lists: EPIL_COD, EPILRES_COD (PCD); EPILDRUG_COD;
    CONTRACEP_ADV_COD, LARC_ADV_COD (ECL cache); EPILCC_COD, EPILPA_COD, EPILPCA_COD
    (PCD); STERIL_COD, HYST2_COD (OpenCodelists, NHSD primary care domain refsets).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind117
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "12 months before the reporting date, included in the advice window."
  - name: latest_record_date
    description: "Latest qualifying advice in the 12-month window; null if absent."
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "True when the person meets the achievement rules in the model description."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  - name: latest_asm_date
    description: "Latest antiseizure prescription on or before the reporting date; null if absent."
