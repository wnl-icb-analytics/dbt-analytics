models:
- name: fct_person_epilepsy_contraception_advice_ind117_by_month
  description: NICE IND117. One row per active, living, non-test woman aged 18 to 44 on the epilepsy register
    at reporting date. The register requires an unresolved diagnosis and an EPILDRUG_COD order in (reporting
    date minus six months, reporting date]. Sterilisation or hysterectomy recorded by reporting date excludes
    the person, using NHSD_PRIMARY_CARE_DOMAIN_REFSETS/STERIL_COD and HYST2_COD. Achievement requires
    EPILCC_COD contraception advice, EPILPA_COD pregnancy advice or EPILPCA_COD pre-conception advice
    in the inclusive twelve months to reporting date. No personalised care adjustments apply. Recalculated
    for the last 60 completed month-ends using current rules and code lists. Registration and practice
    follow the monthly spine. Birth and death dates are approximate; current gender and test flags apply
    retrospectively. Diagnoses use clinical and recorded dates; other evidence uses clinical dates through
    month-end. Later corrections can change earlier results.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind117
      indicator:
        id: IND117
        type: MEASURE
        category: CONTRACEPTION
        clinical_domain: CONTRACEPTION
        name_short: Epilepsy contraception advice
        description_short: NICE IND117. One row per active, living, non-test woman aged 18 to 44 on the
          epilepsy register at reporting date. The register requires an unresolved diagnosis and an EPILDRUG_COD
