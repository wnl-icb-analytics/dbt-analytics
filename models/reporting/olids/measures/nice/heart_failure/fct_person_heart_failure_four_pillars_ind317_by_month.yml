models:
- name: fct_person_heart_failure_four_pillars_ind317_by_month
  description: >-
    Four classes of heart failure medicines (NICE IND317). One row per person in the denominator
    at each month-end.


    People registered at the month-end with heart failure with reduced ejection fraction.
    Achieved with prescriptions for all four classes in the 6 months before the month-end: ACE
    inhibitor or angiotensin receptor blocker, any beta blocker, spironolactone or eplerenone,
    and any SGLT2 inhibitor. Finerenone does not count. The heart-failure-licensed beta blocker
    flag does not affect achievement. No personalised care adjustments are applied. Recalculated
    for each of the last 60 month-ends with current rules, code lists and records, so later
    corrections can change past months. Based on NICE NG106. Code lists: HF_COD, HFLVSD_COD,
    REDEJCFRAC_COD (PCD); 0205051, 0205052, 0204, 0202030S0, 0202030X0 (BNF); SGLT2I_RX; LBB_COD
    (NHS drug refset).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind317
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "6 months before the reporting date, included in the prescription window."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: practice_code
    description: "ODS code of the registration practice at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice at the reporting month-end."
  - name: latest_record_date
    description: >-
      Latest prescription date among the four required medicine classes on or before the reporting
      date; null if absent. It may be outside the treatment window and does not prove all four
      classes are present.
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when all required medicines are present; otherwise NOT_TREATED_IN_PERIOD."
  - name: latest_ras_order_date
    description: >-
      Latest ACE inhibitor or angiotensin receptor blocker prescription on or before the reporting
      date; null if absent. It may be outside the treatment window.
  - name: is_ras_in_period
    description: >-
      True when a prescription for ACE inhibitor or angiotensin receptor blocker falls in the 6
      months before the reporting date, including both boundaries.
  - name: latest_beta_blocker_order_date
    description: >-
      Latest beta blocker prescription on or before the reporting date; null if absent. It may be
      outside the treatment window.
  - name: is_beta_blocker_in_period
    description: >-
      True when a prescription for beta blocker falls in the 6 months before the reporting date,
      including both boundaries.
  - name: latest_hf_licensed_beta_blocker_order_date
    description: >-
      Latest heart-failure-licensed beta blocker prescription on or before the reporting date; null
      if absent. It may be outside the treatment window.
  - name: is_hf_licensed_beta_blocker_in_period
    description: >-
      True when a prescription for heart-failure-licensed beta blocker falls in the 6 months before
      the reporting date, including both boundaries.
  - name: latest_mra_order_date
    description: >-
      Latest spironolactone or eplerenone prescription on or before the reporting date; null if
      absent. It may be outside the treatment window.
  - name: is_mra_in_period
    description: >-
      True when a prescription for spironolactone or eplerenone falls in the 6 months before the
      reporting date, including both boundaries.
  - name: latest_sglt2_order_date
    description: >-
      Latest SGLT2 inhibitor prescription on or before the reporting date; null if absent. It may be
      outside the treatment window.
  - name: is_sglt2_in_period
    description: >-
      True when a prescription for SGLT2 inhibitor falls in the 6 months before the reporting date,
      including both boundaries.
