models:
- name: fct_person_heart_failure_nice_indicators_by_month
  description: >-
    Heart failure indicator results (IND192, IND317, IND318). One row per eligible person,
    indicator and month-end.


    People registered at the month-end in each indicator's denominator. Eligibility, exclusions
    and achievement follow the individual measures. Supporting fields are null where an
    indicator does not provide them. Recalculated for each of the last 60 month-ends with
    current rules, code lists and records, so later corrections can change past months.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
        - reporting_date
  columns:
  - name: has_reduced_ef_category
    description: >-
      True when a reduced ejection fraction category is known by the reporting date, including a
      category recorded before diagnosis. Null when this field does not apply to the indicator.
  - name: has_mildly_reduced_ef_category
    description: >-
      True when a mildly reduced ejection fraction category is known by the reporting date,
      including a category recorded before diagnosis. Null when this field does not apply to the
      indicator.
  - name: has_preserved_ef_category
    description: >-
      True when a preserved ejection fraction category is known by the reporting date, including a
      category recorded before diagnosis. Null when this field does not apply to the indicator.
