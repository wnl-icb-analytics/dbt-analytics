models:
- name: fct_person_heart_failure_confirmation_ind192_by_month
  description: >-
    Heart failure diagnosis confirmation (NICE IND192). One row per eligible member with heart failure
    diagnosed three to fifteen months ago and month-end. People must be registered, living and non-test.
    History is recalculated with current rules and code lists. Approximate age and practice follow the
    monthly spine. HF members whose earliest unresolved HF_COD diagnosis known by the reporting date is
    strictly after 15 months before and on or before three months before that date. ECOG_COD
    echocardiogram or specialist assessment must fall within the inclusive three months either side of
    entry, capped at the reporting date. Diagnoses on the resolution calendar date remain unresolved,
    matching the HF register. Personalised care adjustments and exception codes are not applied.
    Diagnoses use known dates; other evidence uses clinical or order dates through the reporting date.
    History covers the last 60 completed month-ends.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind192
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: person_id
    description: Person in the denominator.
  - name: reporting_date
    description: Assessment date; completed month-end in history.
  - name: measurement_period_start
    description: Start of the rolling cohort or treatment window, as described above.
  - name: age
    description: Age in years at the reporting date; historical birth dates are approximate.
  - name: practice_code
    description: ODS code of the registration practice at assessment.
  - name: practice_name
    description: Registration practice name at assessment.
  - name: latest_record_date
    description: Latest supporting evidence date through assessment; treatment measures may retain stale dates.
  - name: is_in_denominator
    description: Always true; personalised care adjustments are not applied.
  - name: is_in_numerator
    description: Whether every required component is met.
  - name: indicator_status
    description: ACHIEVED or the accepted reason for non-achievement.
  - name: diagnosis_date
    description: Earliest unresolved HF diagnosis known by assessment.
