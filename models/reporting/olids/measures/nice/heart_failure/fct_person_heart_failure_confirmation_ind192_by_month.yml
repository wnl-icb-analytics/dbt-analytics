models:
- name: fct_person_heart_failure_confirmation_ind192_by_month
  description: >-
    Heart failure diagnosis confirmation (NICE IND192). One row per person in the denominator at
    each month-end.


    People registered at the month-end on the heart failure register with an earliest unresolved
    diagnosis 3 to 15 months before the month-end, allowing confirmation to finish. Diagnosis
    must also be recorded by that date. A diagnosis on the resolution date remains unresolved.
    Achieved with an echocardiogram or specialist assessment within 3 months before or after
    diagnosis. No personalised care adjustments are applied. Recalculated for each of the last
    60 month-ends with current rules, code lists and records, so later corrections can change
    past months. Based on NICE NG106. Code lists: HF_COD, HFRES_COD, ECOG_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind192
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "15 months before the reporting date. Diagnoses on this boundary are excluded."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: practice_code
    description: "ODS code of the registration practice at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice at the reporting month-end."
  - name: latest_record_date
    description: >-
      Latest echocardiogram or specialist assessment from 3 months before to 3 months after
      diagnosis, inclusive; null if absent.
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  - name: diagnosis_date
    description: "Earliest unresolved heart failure diagnosis with clinical and recorded dates known by the reporting date."
