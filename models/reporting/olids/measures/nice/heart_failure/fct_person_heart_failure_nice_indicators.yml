models:
- name: fct_person_heart_failure_nice_indicators
  description: NICE heart failure results for IND317, IND192 and IND318. One row per eligible active, living,
    non-test person and indicator on the build date. Member measures define eligibility and treatment rules.
    Personalised care adjustments are not applied.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
  columns:
  - name: has_reduced_ef_category
    description: Any reduced EF category known by assessment for IND318; null for other indicators.
  - name: has_mildly_reduced_ef_category
    description: Any mildly reduced EF category known by assessment for IND318; null for other indicators.
  - name: has_preserved_ef_category
    description: Any preserved or normal EF category known by assessment for IND318; null for other indicators.
