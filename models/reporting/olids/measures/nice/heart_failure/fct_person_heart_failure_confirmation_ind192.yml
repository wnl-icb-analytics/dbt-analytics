models:
- name: fct_person_heart_failure_confirmation_ind192
  description: >-
    Heart failure diagnosis confirmation (NICE IND192). One row per eligible member with heart failure
    diagnosed three to fifteen months ago on the build date. People must be registered, living and
    non-test. HF members whose earliest unresolved HF_COD diagnosis known by the reporting date is
    strictly after 15 months before and on or before three months before that date. ECOG_COD
    echocardiogram or specialist assessment must fall within the inclusive three months either side of
    entry, capped at the reporting date. Diagnoses on the resolution calendar date remain unresolved,
    matching the HF register. Personalised care adjustments and exception codes are not applied.
    Diagnoses use known dates; other evidence uses clinical or order dates through the reporting date.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind192
      indicator:
        id: IND192
        type: MEASURE
        category: HEART_FAILURE
        clinical_domain: Cardiometabolic
        name_short: HF diagnosis confirmation
        description_short: HF diagnosis confirmation
        description_long: NICE IND192. One row per registered, living, non-test person in the denominator on
          the build date. HF members whose earliest unresolved HF_COD diagnosis known by the reporting date
          is strictly after 15 months before and on or before three months before that date. ECOG_COD echocardiogram
          or specialist assessment must fall within the inclusive three months either side of entry, capped
          at the reporting date. Diagnoses on the resolution calendar date remain unresolved, matching the
          HF register. Personalised care adjustments and exception codes are not applied. Diagnoses use known
          dates; other evidence uses clinical or order dates through the reporting date.
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND192
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: person_id
    description: Person in the denominator.
  - name: reporting_date
    description: Assessment date; completed month-end in history.
  - name: measurement_period_start
    description: Start of the rolling cohort or treatment window, as described above.
  - name: age
    description: Age in years at the reporting date; historical birth dates are approximate.
  - name: current_practice_code
    description: ODS code of the registration practice at assessment.
  - name: current_practice_name
    description: Registration practice name at assessment.
  - name: latest_record_date
    description: Latest supporting evidence date through assessment; treatment measures may retain stale dates.
  - name: is_in_denominator
    description: Always true; personalised care adjustments are not applied.
  - name: is_in_numerator
    description: Whether every required component is met.
  - name: indicator_status
    description: ACHIEVED or the accepted reason for non-achievement.
  - name: diagnosis_date
    description: Earliest unresolved HF diagnosis known by assessment.
