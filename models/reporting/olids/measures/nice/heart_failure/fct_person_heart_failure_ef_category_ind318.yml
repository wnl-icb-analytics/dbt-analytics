models:
- name: fct_person_heart_failure_ef_category_ind318
  description: Heart failure ejection-fraction recording. One row per active, living, non-test HF register
    member with entry on or after 1 April 2026. Entry is the earliest unresolved HF diagnosis known by assessment.
    Numerator is any HFREF_DX_COD, HFMREF_DX_COD, HFPEF_DX_COD or PCD REDEJCFRAC_COD known by assessment, including
    earlier category records. Numeric ejection fraction, generic systolic or diastolic HF and improved EF alone
    do not count. No personalised care adjustments apply. Assessed on the build date.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind318
      indicator:
        id: IND318
        type: MEASURE
        category: HEART_FAILURE
        clinical_domain: Cardiometabolic
        name_short: 'Heart failure: ejection fraction category'
        description_short: 'Heart failure: ejection fraction category'
        description_long: Heart failure ejection-fraction recording. One row per active, living, non-test HF
          register member with entry on or after 1 April 2026. Entry is the earliest unresolved HF diagnosis
          known by assessment. Numerator is any HFREF_DX_COD, HFMREF_DX_COD, HFPEF_DX_COD or PCD REDEJCFRAC_COD
          known by assessment, including earlier category records. Numeric ejection fraction, generic systolic
          or diastolic HF and improved EF alone do not count. No personalised care adjustments apply.
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND318
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: reporting_date
    description: Assessment date.
  - name: measurement_period_start
    description: 1 April 2026 for HF; earliest qualifying lifetime reading for IND260; 12 months before assessment
      for IND261.
  - name: latest_record_date
    description: Supporting achievement evidence date through assessment; null means no qualifying evidence.
  - name: is_in_denominator
    description: Always true.
  - name: is_in_numerator
    description: Whether the required category or assessment evidence exists.
  - name: diagnosis_date
    description: Earliest unresolved HF register-entry date known by assessment.
  - name: has_reduced_ef_category
    description: Any reduced category known by assessment.
  - name: has_mildly_reduced_ef_category
    description: Any mildly reduced category known by assessment.
  - name: has_preserved_ef_category
    description: Any preserved or normal category known by assessment.
