models:
- name: fct_person_heart_failure_ef_category_ind318
  description: >-
    Ejection fraction category recording in people newly diagnosed with heart failure (NICE
    IND318). One row per person in the denominator on the build date.


    People registered on the build date on the heart failure register with an earliest
    unresolved diagnosis from 1 April 2026. Achieved with a recorded reduced, mildly reduced
    or preserved ejection fraction category, even before diagnosis. Numeric ejection fraction,
    generic systolic or diastolic heart failure, and improved ejection fraction alone do not
    count. No personalised care adjustments are applied. Based on NICE NG106. Code lists:
    HF_COD, HFRES_COD, REDEJCFRAC_COD (PCD); HFREF_DX_COD, HFMREF_DX_COD, HFPEF_DX_COD (ECL
    cache).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind318
      indicator:
        id: IND318
        type: MEASURE
        category: HEART_FAILURE
        clinical_domain: Cardiometabolic
        name_short: "Heart failure ejection fraction"
        description_short: "Heart failure ejection fraction category recording."
        description_long: >-
          People registered on the build date on the heart failure register with an earliest
          unresolved diagnosis from 1 April 2026. Achieved with a recorded reduced, mildly
          reduced or preserved ejection fraction category, even before diagnosis. Numeric
          ejection fraction, generic systolic or diastolic heart failure, and improved
          ejection fraction alone do not count. No personalised care adjustments are applied.
          Based on NICE NG106. Code lists: HF_COD, HFRES_COD, REDEJCFRAC_COD (PCD);
          HFREF_DX_COD, HFMREF_DX_COD, HFPEF_DX_COD (ECL cache).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND318
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: reporting_date
    description: "Build date used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "1 April 2026, the first eligible diagnosis date."
  - name: latest_record_date
    description: "Latest qualifying ejection fraction category known by the reporting date; null if absent."
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: diagnosis_date
    description: "Earliest unresolved heart failure diagnosis with clinical and recorded dates known by the reporting date."
  - name: has_reduced_ef_category
    description: >-
      True when a reduced ejection fraction category is known by the reporting date, including a
      category recorded before diagnosis.
  - name: has_mildly_reduced_ef_category
    description: >-
      True when a mildly reduced ejection fraction category is known by the reporting date,
      including a category recorded before diagnosis.
  - name: has_preserved_ef_category
    description: >-
      True when a preserved ejection fraction category is known by the reporting date, including a
      category recorded before diagnosis.
