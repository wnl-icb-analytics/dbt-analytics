models:
- name: fct_person_myocardial_infarction_therapy_ind125_by_month
  description: >-
    Myocardial infarction therapy (NICE IND125). One row per eligible person with myocardial infarction
    in the financial year and month-end. People must be registered, living and non-test. History is
    recalculated with current rules and code lists. Approximate age and practice follow the monthly
    spine. People with MI_COD in the financial year to date, including 1 April and the reporting date.
    Achievement needs current ACE-I, or ARB with recorded ACE-I intolerance; aspirin plus a P2Y12
    inhibitor; statin; and a beta blocker when HFLVSD_COD or REDEJCFRAC_COD is known. Current treatment
    is an inclusive six-calendar-month window, matching built therapy measures. Aspirin includes
    OSAL_COD taken-treatment evidence. Temporary intolerance lasts 12 months; persistent intolerance
    stands. Lenient detail allows any ARB and any two antiplatelet BNF chemicals, including OTC aspirin
    when no aspirin order is current. Personalised care adjustments and exception codes are not applied.
    Diagnoses use known dates; other evidence uses clinical or order dates through the reporting date.
    History covers the last 60 completed month-ends.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind125
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: person_id
    description: Person in the denominator.
  - name: reporting_date
    description: Assessment date; completed month-end in history.
  - name: measurement_period_start
    description: Financial-year start for the MI cohort.
  - name: age
    description: Age in years at the reporting date; historical birth dates are approximate.
  - name: practice_code
    description: ODS code of the registration practice at assessment.
  - name: practice_name
    description: Registration practice name at assessment.
  - name: latest_record_date
    description: Latest supporting evidence date through assessment; treatment measures may retain stale dates.
  - name: is_in_denominator
    description: Always true; personalised care adjustments are not applied.
  - name: is_in_numerator
    description: Whether every required component is met.
  - name: indicator_status
    description: ACHIEVED or the accepted reason for non-achievement.
  - name: earliest_mi_date
    description: Earliest mi date.
  - name: latest_mi_date
    description: Latest mi date.
  - name: latest_mi_in_financial_year_date
    description: Latest mi in financial year date.
  - name: first_lvsd_date
    description: First lvsd date.
  - name: has_lvsd
    description: Has lvsd.
  - name: has_ace_inhibitor_intolerance
    description: Has ace inhibitor intolerance.
  - name: has_aspirin_intolerance
    description: Has aspirin intolerance.
  - name: latest_aspirin_record_date
    description: Latest aspirin record date.
  - name: latest_ace_inhibitor_order_date
    description: Latest order through assessment; null means none.
  - name: latest_arb_order_date
    description: Latest order through assessment; null means none.
  - name: latest_aspirin_order_date
    description: Latest order through assessment; null means none.
  - name: latest_p2y12_order_date
    description: Latest order through assessment; null means none.
  - name: latest_clopidogrel_order_date
    description: Latest order through assessment; null means none.
  - name: latest_antiplatelet_order_date
    description: Latest order through assessment; null means none.
  - name: latest_anticoagulant_order_date
    description: Latest order through assessment; null means none.
  - name: latest_statin_order_date
    description: Latest order through assessment; null means none.
  - name: latest_beta_blocker_order_date
    description: Latest order through assessment; null means none.
  - name: is_ace_inhibitor_in_period
    description: Whether this treatment has evidence in the inclusive six calendar months to assessment.
  - name: is_arb_in_period
    description: Whether this treatment has evidence in the inclusive six calendar months to assessment.
  - name: is_aspirin_in_period
    description: Whether this treatment has evidence in the inclusive six calendar months to assessment.
  - name: is_p2y12_in_period
    description: Whether this treatment has evidence in the inclusive six calendar months to assessment.
  - name: is_clopidogrel_in_period
    description: Whether this treatment has evidence in the inclusive six calendar months to assessment.
  - name: is_antiplatelet_in_period
    description: Whether this treatment has evidence in the inclusive six calendar months to assessment.
  - name: is_anticoagulant_in_period
    description: Whether this treatment has evidence in the inclusive six calendar months to assessment.
  - name: is_statin_in_period
    description: Whether this treatment has evidence in the inclusive six calendar months to assessment.
  - name: is_beta_blocker_in_period
    description: Whether this treatment has evidence in the inclusive six calendar months to assessment.
  - name: is_in_numerator_lenient
    description: Outcome with the documented lenient substitutions; does not affect the published numerator.
  - name: antiplatelet_chemical_count_in_period
    description: Number of distinct nine-character BNF chemical prefixes ordered in the inclusive six months to
      assessment. Strengths and products of one chemical count once. The IND125 lenient result also adds OTC aspirin
      when no aspirin order is current.
