models:
- name: fct_person_myocardial_infarction_therapy_ind126
  description: NICE IND126. One row per registered, living, non-test person in the denominator on the build
    date. People with any MI_COD strictly more than 12 months before the reporting date, including those with
    a later repeat MI. Achievement needs current ACE-I, or ARB with recorded ACE-I intolerance; aspirin, clopidogrel
    with aspirin intolerance, or oral anticoagulant; statin; and a beta blocker when HFLVSD_COD or REDEJCFRAC_COD
    is known. Current treatment is an inclusive six-calendar-month window, matching built therapy measures.
    Aspirin includes OSAL_COD taken-treatment evidence. Temporary intolerance lasts 12 months; persistent intolerance
    stands. Lenient detail allows any ARB and any antiplatelet or oral anticoagulant. Personalised care adjustments
    and exception codes are not applied. Diagnoses use known dates; other evidence uses clinical or order dates
    through the reporting date.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind126
      indicator:
        id: IND126
        type: MEASURE
        category: MYOCARDIAL_INFARCTION
        clinical_domain: Cardiometabolic
        name_short: Previous MI therapy
        description_short: Previous MI therapy
        description_long: NICE IND126. One row per registered, living, non-test person in the denominator on
          the build date. People with any MI_COD strictly more than 12 months before the reporting date, including
          those with a later repeat MI. Achievement needs current ACE-I, or ARB with recorded ACE-I intolerance;
          aspirin, clopidogrel with aspirin intolerance, or oral anticoagulant; statin; and a beta blocker
          when HFLVSD_COD or REDEJCFRAC_COD is known. Current treatment is an inclusive six-calendar-month
          window, matching built therapy measures. Aspirin includes OSAL_COD taken-treatment evidence. Temporary
          intolerance lasts 12 months; persistent intolerance stands. Lenient detail allows any ARB and any
          antiplatelet or oral anticoagulant. Personalised care adjustments and exception codes are not applied.
          Diagnoses use known dates; other evidence uses clinical or order dates through the reporting date.
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND126
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
