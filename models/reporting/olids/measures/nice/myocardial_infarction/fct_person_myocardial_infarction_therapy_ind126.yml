    description: Person in the denominator.
  - name: reporting_date
    description: Assessment date; completed month-end in history.
  - name: measurement_period_start
    description: Start of the rolling cohort or treatment window, as described above.
  - name: age
    description: Age in years at the reporting date; historical birth dates are approximate.
  - name: current_practice_code
    description: ODS code of the registration practice at assessment.
  - name: current_practice_name
    description: Registration practice name at assessment.
  - name: latest_record_date
    description: Latest supporting evidence date through assessment; treatment measures may retain stale dates.
  - name: is_in_denominator
    description: Always true; personalised care adjustments are not applied.
  - name: is_in_numerator
    description: Whether every required component is met.
  - name: indicator_status
    description: ACHIEVED or the accepted reason for non-achievement.
