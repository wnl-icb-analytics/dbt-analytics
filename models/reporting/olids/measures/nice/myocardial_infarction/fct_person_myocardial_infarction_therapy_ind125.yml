models:
- name: fct_person_myocardial_infarction_therapy_ind125
  description: >-
    Medicines after myocardial infarction in the financial year (NICE IND125). One row per
    person in the denominator on the build date.


    People registered on the build date with myocardial infarction in the financial year from 1
    April to the build date, rather than a rolling year. Achieved with an ACE inhibitor, or ARB
    with ACE inhibitor intolerance; aspirin and a P2Y12 inhibitor; a statin; and a beta blocker
    if left ventricular systolic dysfunction is recorded. Prescriptions or recorded aspirin
    treatment need to fall in the preceding 6 months. Temporary intolerance or contraindications
    last 12 months; persistent records do not expire. The separate alternative accepts any ARB
    and two antiplatelet chemicals, counting recorded aspirin separately without a recent
    aspirin prescription. It does not affect achievement. No personalised care adjustments are
    applied. Based on NICE NG185. Code lists: MI_COD, HFLVSD_COD, REDEJCFRAC_COD, OSAL_COD,
    XACE_COD, TXACE_COD, XSAL_COD, TXSAL_COD (PCD); 0205051, 0205052, 0209, 020802, 0212, 0204
    (BNF).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind125
      indicator:
        id: IND125
        type: MEASURE
        category: MYOCARDIAL_INFARCTION
        clinical_domain: Cardiometabolic
        name_short: "Recent heart attack medicines"
        description_short: "Medicines after myocardial infarction in the current financial year."
        description_long: >-
          People registered on the build date with myocardial infarction in the financial year
          from 1 April to the build date, rather than a rolling year. Achieved with an ACE
          inhibitor, or ARB with ACE inhibitor intolerance; aspirin and a P2Y12 inhibitor; a
          statin; and a beta blocker if left ventricular systolic dysfunction is recorded.
          Prescriptions or recorded aspirin treatment need to fall in the preceding 6 months.
          Temporary intolerance or contraindications last 12 months; persistent records do not
          expire. The separate alternative accepts any ARB and two antiplatelet chemicals,
          counting recorded aspirin separately without a recent aspirin prescription. It does
          not affect achievement. No personalised care adjustments are applied. Based on NICE
          NG185. Code lists: MI_COD, HFLVSD_COD, REDEJCFRAC_COD, OSAL_COD, XACE_COD, TXACE_COD,
          XSAL_COD, TXSAL_COD (PCD); 0205051, 0205052, 0209, 020802, 0212, 0204 (BNF).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND125
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: reporting_date
    description: "Build date used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "1 April at the start of the financial year containing the reporting date, included in the diagnosis cohort."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: current_practice_code
    description: "ODS code of the registration practice at the reporting date."
  - name: current_practice_name
    description: "Name of the registration practice at the reporting date."
  - name: latest_record_date
    description: >-
      Latest supporting prescription or aspirin treatment date on or before the reporting date; null
      if absent. It may be outside the treatment window and does not prove all required medicines
      are present.
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when all required medicines are present; otherwise NOT_TREATED_IN_PERIOD."
  - name: earliest_mi_date
    description: "Earliest myocardial infarction diagnosis with clinical and recorded dates known by the reporting date."
  - name: latest_mi_date
    description: "Latest myocardial infarction diagnosis with clinical and recorded dates known by the reporting date."
  - name: latest_mi_in_financial_year_date
    description: >-
      Latest myocardial infarction diagnosis from 1 April of the financial year containing the
      reporting date to that date, inclusive; null if absent.
  - name: first_lvsd_date
    description: >-
      Earliest left ventricular systolic dysfunction or reduced ejection fraction diagnosis known by
      the reporting date; null if absent.
  - name: has_lvsd
    description: >-
      True when left ventricular systolic dysfunction or reduced ejection fraction is known by the
      reporting date. A beta blocker is then required.
  - name: has_ace_inhibitor_intolerance
    description: >-
      True when ACE inhibitor intolerance or contraindication is recorded by the reporting date.
      Temporary records count for 12 months; persistent records have no expiry.
  - name: has_aspirin_intolerance
    description: >-
      True when aspirin intolerance or contraindication is recorded by the reporting date. Temporary
      records count for 12 months; persistent records have no expiry.
  - name: latest_aspirin_record_date
    description: >-
      Latest recorded aspirin treatment on or before the reporting date; null if absent. It may be
      outside the treatment window.
  - name: latest_ace_inhibitor_order_date
    description: >-
      Latest ACE inhibitor prescription on or before the reporting date; null if absent. It may be
      outside the treatment window.
  - name: latest_arb_order_date
    description: >-
      Latest ARB prescription on or before the reporting date; null if absent. It may be outside the
      treatment window.
  - name: latest_aspirin_order_date
    description: >-
      Latest aspirin prescription on or before the reporting date; null if absent. It may be outside
      the treatment window.
  - name: latest_p2y12_order_date
    description: >-
      Latest P2Y12 inhibitor prescription on or before the reporting date; null if absent. It may be
      outside the treatment window.
  - name: latest_clopidogrel_order_date
    description: >-
      Latest clopidogrel prescription on or before the reporting date; null if absent. It may be
      outside the treatment window.
  - name: latest_antiplatelet_order_date
    description: >-
      Latest antiplatelet prescription on or before the reporting date; null if absent. It may be
      outside the treatment window.
  - name: latest_anticoagulant_order_date
    description: >-
      Latest oral anticoagulant prescription on or before the reporting date; null if absent. It may
      be outside the treatment window.
  - name: latest_statin_order_date
    description: >-
      Latest statin prescription on or before the reporting date; null if absent. It may be outside
      the treatment window.
  - name: latest_beta_blocker_order_date
    description: >-
      Latest beta blocker prescription on or before the reporting date; null if absent. It may be
      outside the treatment window.
  - name: is_ace_inhibitor_in_period
    description: >-
      True when a prescription for ACE inhibitor falls in the 6 months before the reporting date,
      including both boundaries.
  - name: is_arb_in_period
    description: "True when a prescription for ARB falls in the 6 months before the reporting date, including both boundaries."
  - name: is_aspirin_in_period
    description: >-
      True when an aspirin prescription or recorded aspirin treatment falls in the 6 months before
      the reporting date, including both boundaries.
  - name: is_p2y12_in_period
    description: >-
      True when a prescription for P2Y12 inhibitor falls in the 6 months before the reporting date,
      including both boundaries.
  - name: is_clopidogrel_in_period
    description: >-
      True when a prescription for clopidogrel falls in the 6 months before the reporting date,
      including both boundaries.
  - name: is_antiplatelet_in_period
    description: >-
      True when a prescription for antiplatelet falls in the 6 months before the reporting date,
      including both boundaries.
  - name: is_anticoagulant_in_period
    description: >-
      True when a prescription for oral anticoagulant falls in the 6 months before the reporting
      date, including both boundaries.
  - name: is_statin_in_period
    description: >-
      True when a prescription for statin falls in the 6 months before the reporting date, including
      both boundaries.
  - name: is_beta_blocker_in_period
    description: >-
      True when a prescription for beta blocker falls in the 6 months before the reporting date,
      including both boundaries.
  - name: is_in_numerator_lenient
    description: >-
      Alternative result accepting any ARB and any two antiplatelet chemicals, plus recorded aspirin
      treatment when no aspirin prescription is recent. Other requirements are unchanged; it does
      not affect the main numerator.
  - name: antiplatelet_chemical_count_in_period
    description: >-
      Number of distinct antiplatelet chemicals prescribed in the 6 months before the reporting
      date, including both boundaries. Chemicals use the first nine characters of the BNF code;
      strengths and products of one chemical count once.
