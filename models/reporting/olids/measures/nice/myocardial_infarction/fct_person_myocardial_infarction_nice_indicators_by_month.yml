models:
- name: fct_person_myocardial_infarction_nice_indicators_by_month
  description: NICE myocardial infarction results for IND125, IND126. One row per eligible person and indicator
    at each of the last 60 completed month-ends, recalculated using current rules and code lists. Member measures
    define eligibility and treatment rules. Personalised care adjustments are not applied.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
        - reporting_date
  columns: []
