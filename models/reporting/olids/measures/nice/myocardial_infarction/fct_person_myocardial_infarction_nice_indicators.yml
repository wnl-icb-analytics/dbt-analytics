models:
- name: fct_person_myocardial_infarction_nice_indicators
  description: >-
    Myocardial infarction indicator results (IND125, IND126). One row per eligible person and
    indicator on the build date.


    People registered on the build date in each indicator's denominator. Eligibility, exclusions
    and achievement follow the individual measures. Supporting fields are null where an
    indicator does not provide them.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
  columns: []
