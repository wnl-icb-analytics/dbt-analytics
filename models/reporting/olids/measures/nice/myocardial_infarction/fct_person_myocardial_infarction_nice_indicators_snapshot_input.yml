models:
- name: fct_person_myocardial_infarction_nice_indicators_snapshot_input
  description: >-
    Myocardial infarction evidence for change history (IND125, IND126). One row per eligible person
    and indicator.


    Records practice, supporting evidence and achievement from the build date. Reporting date and
    measurement period start are omitted, so the passing of a day alone does not create a new
    version. Eligibility and achievement follow the individual measures.
    Labels join from def_indicator or the measure tables by indicator_id.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
  columns: []
