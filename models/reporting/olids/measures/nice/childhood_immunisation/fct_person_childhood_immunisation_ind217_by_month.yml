models:
- name: fct_person_childhood_immunisation_ind217_by_month
  description: >-
    Preschool booster and MMR vaccination by age 5 (NICE IND217). One row per person in
    the denominator at each month-end.


    People registered at the month-end whose fifth birthday, based on approximate birth
    date, fell in the last 12 months. Achieved with an explicit DTaP/IPV booster and at
    least two MMR or MMRV doses at ages 1 to 4. Doses count distinct administration or
    vaccine order dates. Excludes recorded vaccine contraindications as a substitute for
    confirmed anaphylaxis. Vaccination age uses recorded completed years where available,
    otherwise approximate birthdays. A generic 4-in-1 product alone does not establish a
    booster. NICE's separate immunocompromise exclusion is not fully applied. No
    personalised care adjustments are applied. Based on NICE NG218. Recalculated for each
    of the last 60 month-ends with current rules, code lists and records, so later
    corrections can change past months. Code lists: MMR and MMRV administration, drug and
    contraindication lists (CHILDHOOD_IMMS_CODES); DTAPIPVVACBOOST_COD, DTAPIPVCON_COD,
    DTPCON_COD (PCD); MMRVACDRUG_COD, MMRVVACDRUG_COD (NHS drug refset).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind217
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "NICE published indicator title."
  - name: reporting_date
    description: "Month-end used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Exclusive start of the 12-month milestone cohort."
  - name: age
    description: "Age in completed years on the reporting date; null when the birth date is missing."
  - name: condition_name
    description: "Short label for the denominator population."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
  - name: birth_date_approx
    description: "Approximate birth date, set to the middle of the recorded birth month."
  - name: milestone_date
    description: "Approximate date the child reached the required age milestone, in the 12-month eligibility window."
  - name: doses_in_window
    description: "Number of distinct vaccine administration or order dates in the indicator age window; for IND217 this counts MMR or MMRV doses only."
  - name: is_in_denominator
    description: "Always true; each row meets the documented eligibility and exclusion rules."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
