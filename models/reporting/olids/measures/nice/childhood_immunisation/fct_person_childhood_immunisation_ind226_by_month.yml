models:
- name: fct_person_childhood_immunisation_ind226_by_month
  description: >-
    MenB vaccination by 18 months (NICE IND226). One row per person in the denominator at
    each month-end.


    People registered at the month-end whose 18-month milestone, based on approximate
    birth date, fell in the last 12 months. Achieved with at least two primary meningitis
    B doses before age 1 and one booster from age 1 to before 18 months. Doses count
    distinct administration or vaccine order dates. Excludes recorded meningitis B vaccine
    contraindications. Vaccination age uses recorded completed years where available,
    otherwise approximate birthdays. The upper age limit uses approximate birth date. No
    personalised care adjustments are applied. Based on NICE NG218. Recalculated for each
    of the last 60 month-ends with current rules, code lists and records, so later
    corrections can change past months. Code lists: MenB administration, drug and
    contraindication lists (CHILDHOOD_IMMS_CODES).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind226
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "NICE published indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Exclusive start of the 12-month milestone cohort."
  - name: age
    description: "Age in completed years on the reporting date; null when the birth date is missing."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
  - name: birth_date_approx
    description: "Approximate birth date, set to the middle of the recorded birth month."
  - name: milestone_date
    description: "Approximate date the child reached the required age milestone, in the 12-month eligibility window."
  - name: doses_in_window
    description: "Number of distinct vaccine administration or order dates in the indicator age window, including zero when none. For IND217 this counts MMR or MMRV doses only; the booster is assessed separately."
  - name: is_in_denominator
    description: "Always true; each row meets the documented eligibility and exclusion rules."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  - name: primary_doses_by_12_months
    description: "Distinct MenB administration or order dates at recorded age 0; missing event age uses the approximate first birthday."
  - name: booster_doses_12_to_18_months
    description: "Distinct MenB administration or order dates at recorded age 1 and before approximate age 18 months; missing event age uses the approximate first birthday."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
