- name: nice_p13_current_ind226_previous_day_profile
  model: fct_person_childhood_immunisation_ind226
  given:
  - input: ref('dim_person_active_patients')
    format: sql
    rows: SELECT -13012::NUMBER AS person_id, 'SYNTHETIC'::VARCHAR AS current_practice_code, 'Synthetic
      practice'::VARCHAR AS current_practice_name
  - input: ref('dim_person_age')
    format: sql
    rows: SELECT -13012::NUMBER AS person_id, 1::NUMBER AS age, DATEADD(month,-18,CURRENT_DATE())::DATE
      AS birth_date_approx
  - input: ref('dim_person_demographics')
    format: sql
    rows: SELECT -13012::NUMBER AS person_id, 'Female'::VARCHAR AS gender
  - input: ref('int_childhood_immunisation_profile')
    format: sql
    rows: |-
      SELECT -13012::NUMBER AS person_id, DATEADD(day,-1,CURRENT_DATE())::DATE AS reporting_date,
      DATEADD(month,-18,CURRENT_DATE())::DATE AS birth_date_approx, 3::NUMBER(18,0) AS menb_doses_by_18_months,
      2::NUMBER(18,0) AS menb_primary_doses_by_12_months,
      1::NUMBER(18,0) AS menb_booster_doses_12_to_18_months, FALSE AS has_menb_contraindication
  expect:
    rows:
    - person_id: -13012
      doses_in_window: 3
      primary_doses_by_12_months: 2
      booster_doses_12_to_18_months: 1
      is_in_numerator: true
  config:
    tags:
    - monthly-full
    - nice-history
