- name: nice_p13_vaccine_windows_source_age_and_contraindication_dates
  model: int_childhood_immunisation_profile_by_month
  given:
  - input: ref('int_nice_reference_population_by_month')
    format: sql
    rows: |-
      SELECT -13010::NUMBER AS person_id, column1::DATE AS reporting_date, 1::NUMBER AS age,
          '2025-03-15'::DATE AS birth_date_approx, 'Female'::VARCHAR AS gender,
          'SYNTHETIC'::VARCHAR AS practice_code, 'Synthetic practice'::VARCHAR AS practice_name
      FROM VALUES ('2026-09-30'), ('2026-10-31')
  - input: ref('int_nice_childhood_immunisation_all')
    format: sql
    rows: |-
      SELECT -13010::NUMBER AS person_id, column1::DATE AS event_date, column2::NUMBER AS age_at_event,
          column3::VARCHAR AS vaccine_group, column4::VARCHAR AS event_type
      FROM VALUES
          ('2025-04-01', 0, 'ROTAVIRUS', 'Administration'),
          ('2025-04-01', 0, 'ROTAVIRUS', 'Administration_drug'),
          ('2025-08-29', 0, 'ROTAVIRUS', 'Administration'),
          ('2025-08-30', 0, 'ROTAVIRUS', 'Administration'),
          ('2025-04-01', 0, 'MENB', 'Administration'),
          ('2025-06-01', 0, 'MENB', 'Administration'),
          ('2025-11-15', 0, 'MENB', 'Administration'),
          ('2026-03-10', 1, 'MENB', 'Administration'),
          ('2026-03-10', 1, 'MENB', 'Administration_drug'),
          ('2026-09-15', 1, 'MENB', 'Administration'),
          ('2026-03-10', 1, 'MMR', 'Administration'),
          ('2026-09-15', 1, 'MMR', 'Administration'),
          ('2026-10-01', 1, 'MMR', 'Contraindicated'),
          ('2026-10-01', 1, 'MENB', 'Contraindicated')
  expect:
    rows:
    - person_id: -13010
      reporting_date: '2026-09-30'
      rotavirus_doses_by_24_weeks: 2
      menb_doses_by_8_months: 2
      menb_primary_doses_by_12_months: 3
      menb_booster_doses_12_to_18_months: 1
      mmr_doses_12_to_18_months: 1
      has_mmr_contraindication: false
      has_menb_contraindication: false
    - person_id: -13010
      reporting_date: '2026-10-31'
      rotavirus_doses_by_24_weeks: 2
      menb_doses_by_8_months: 2
      menb_primary_doses_by_12_months: 3
      menb_booster_doses_12_to_18_months: 1
      mmr_doses_12_to_18_months: 1
      has_mmr_contraindication: true
      has_menb_contraindication: true
  config:
    tags:
    - monthly-full
    - nice-history
