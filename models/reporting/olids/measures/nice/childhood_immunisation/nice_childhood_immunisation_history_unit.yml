unit_tests:
- name: nice_p13_ind216_cohort_dates_and_requirements
  model: fct_person_childhood_immunisation_ind216_by_month
  given:
  - input: ref('int_nice_reference_population_by_month')
    format: sql
    rows: |-
      SELECT column1::NUMBER AS person_id, column2::DATE AS reporting_date,
          1::NUMBER AS age, DATEADD(month, -18, '2026-08-28'::DATE)::DATE AS birth_date_approx,
          'Female'::VARCHAR AS gender, 'SYNTHETIC'::VARCHAR AS practice_code,
          'Synthetic practice'::VARCHAR AS practice_name
      FROM VALUES (-13001, '2026-07-31'), (-13001, '2026-08-28'), (-13001, '2026-09-30'),
          (-13001, '2027-08-28'), (-13002, '2026-09-30'), (-13003, '2026-09-30'), (-13004, '2026-09-30')
  - input: ref('int_childhood_immunisation_profile_by_month')
    format: sql
    rows: |-
      SELECT column1::NUMBER AS person_id, column2::DATE AS reporting_date,
          DATEADD(month, -18, '2026-08-28'::DATE)::DATE AS birth_date_approx,
          column3::NUMBER(18,0) AS mmr_doses_12_to_18_months,
          (column1 = -13002)::BOOLEAN AS has_mmr_contraindication
      FROM VALUES (-13001, '2026-07-31', 0), (-13001, '2026-08-28', 0),
          (-13001, '2026-09-30', 1), (-13001, '2027-08-28', 1),
          (-13002, '2026-09-30', 1), (-13003, '2026-09-30', 1),
          (-13004, '2026-09-30', 0)
  expect:
    rows:
    - person_id: -13001
      reporting_date: '2026-08-28'
      doses_in_window: 0
      is_in_numerator: false
    - person_id: -13001
      reporting_date: '2026-09-30'
      doses_in_window: 1
      is_in_numerator: true
    - person_id: -13003
      reporting_date: '2026-09-30'
      doses_in_window: 1
      is_in_numerator: true
    - person_id: -13004
      reporting_date: '2026-09-30'
      doses_in_window: 0
      is_in_numerator: false
  config:
    tags:
    - monthly-full
    - nice-history
