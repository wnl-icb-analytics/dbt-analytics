models:
  - name: fct_person_childhood_immunisation_ind215
    description: |
      NICE IND215 primary DTP vaccination. One row per currently registered, living,
      non-test baby whose eighth-month milestone falls in the preceding 12 months,
      assessed on the build date.

      Achieved with at least three DTP-containing doses before eight months of age. QOF
      v51 permits 4-, 5- and 6-in-1 administrations or vaccine orders. Doses count
      distinct administration or vaccine order dates, measured from the approximate birth
      date.

      Excludes recorded vaccine contraindications as a proxy for confirmed anaphylaxis.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind215
        indicator:
          id: "IND215"
          type: "MEASURE"
          category: "IMMUNISATION"
          clinical_domain: "Prevention"
          name_short: "DTaP 3 doses by 8 months"
          description_short: "Three DTP-containing doses before 8 months for babies reaching 8 months in the preceding 12 months"
          description_long: |
            NICE IND215 primary DTP vaccination. One row per currently registered, living,
            non-test baby whose eighth-month milestone falls in the preceding 12 months,
            assessed on the build date.

            Achieved with at least three DTP-containing doses before eight months of age.
            QOF v51 permits 4-, 5- and 6-in-1 administrations or vaccine orders. Doses
            count distinct administration or vaccine order dates, measured from the
            approximate birth date.

            Excludes recorded vaccine contraindications as a proxy for confirmed
            anaphylaxis.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND215"
    columns: &childhood_columns
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: birth_date_approx
        description: Approximate birth date (mid-month)
      - name: milestone_date
        description: Date the child reached the indicator's milestone age, which falls in the preceding 12 months
      - name: doses_in_window
        description: Distinct administration dates for the indicator's vaccine within its age window
      - name: is_in_denominator
        description: Always true; every row is an eligible child before personalised care adjustments
      - name: is_in_numerator
        description: Whether the child received the required doses within the age window
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD

  - name: fct_person_childhood_immunisation_ind216
    description: |
      NICE IND216 MMR vaccination by 18 months. One row per currently registered, living,
      non-test child whose 18-month milestone falls in the preceding 12 months, assessed
      on the build date.

      Achieved with at least one MMR or MMRV dose from 12 months up to, but not including,
      18 months of age. Doses count distinct administration or vaccine order dates,
      measured from the approximate birth date.

      Excludes recorded vaccine contraindications as a proxy for confirmed anaphylaxis.
      This coding does not fully identify the separate NICE exclusion for
      immunocompromised children.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind216
        indicator:
          id: "IND216"
          type: "MEASURE"
          category: "IMMUNISATION"
          clinical_domain: "Prevention"
          name_short: "MMR 1 dose by 18 months"
          description_short: "At least one MMR dose between 12 and 18 months for children reaching 18 months in the preceding 12 months"
          description_long: |
            NICE IND216 MMR vaccination by 18 months. One row per currently registered,
            living, non-test child whose 18-month milestone falls in the preceding 12
            months, assessed on the build date.

            Achieved with at least one MMR or MMRV dose from 12 months up to, but not
            including, 18 months of age. Doses count distinct administration or vaccine
            order dates, measured from the approximate birth date.

            Excludes recorded vaccine contraindications as a proxy for confirmed
            anaphylaxis. This coding does not fully identify the separate NICE exclusion
            for immunocompromised children.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND216"
    columns: *childhood_columns

  - name: fct_person_childhood_immunisation_ind217
    description: |
      NICE IND217 preschool DTaP/IPV and MMR vaccination. One row per currently
      registered, living, non-test child whose fifth birthday falls in the preceding 12
      months, assessed on the build date.

      Achieved with an explicitly coded DTaP/IPV booster and at least two MMR or MMRV
      doses from the first birthday up to, but not including, the fifth. A generic 4-in-1
      vaccine product does not establish booster administration. Doses count distinct
      administration or vaccine order dates, measured from the approximate birth date.

      Excludes recorded vaccine contraindications as a proxy for confirmed anaphylaxis.
      This coding does not fully identify the separate NICE exclusion for
      immunocompromised children.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind217
        indicator:
          id: "IND217"
          type: "MEASURE"
          category: "IMMUNISATION"
          clinical_domain: "Prevention"
          name_short: "DTaP/IPV and 2 MMR by 5 years"
          description_short: "Preschool booster and two MMR doses between 1 and 5 years for children reaching 5 in the preceding 12 months"
          description_long: |
            NICE IND217 preschool DTaP/IPV and MMR vaccination. One row per currently
            registered, living, non-test child whose fifth birthday falls in the preceding
            12 months, assessed on the build date.

            Achieved with an explicitly coded DTaP/IPV booster and at least two MMR or
            MMRV doses from the first birthday up to, but not including, the fifth. A
            generic 4-in-1 vaccine product does not establish booster administration.
            Doses count distinct administration or vaccine order dates, measured from the
            approximate birth date.

            Excludes recorded vaccine contraindications as a proxy for confirmed
            anaphylaxis. This coding does not fully identify the separate NICE exclusion
            for immunocompromised children.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND217"
    columns: *childhood_columns

