  - name: fct_person_childhood_immunisation_ind226
    description: |
      NICE IND226 MenB vaccination by 18 months. One row per currently registered, living,
      non-test child whose 18-month milestone falls in the preceding 12 months, assessed
      on the build date.

      Achieved with two primary MenB doses before 12 months and a booster from 12 months
      up to, but not including, 18 months. This age split is the local interpretation of
      primary and booster doses. Doses count distinct administration or vaccine order
      dates, measured from the approximate birth date.

      Excludes children with a contraindication record for the vaccine, as NICE specifies.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind226
        indicator:
          id: "IND226"
          type: "MEASURE"
          category: "IMMUNISATION"
          clinical_domain: "Prevention"
          name_short: "MenB 3 doses by 18 months"
          description_short: "Two primary MenB doses before 12 months and one booster from 12 months, all before 18 months of age. Contraindication exclusion applied."
          description_long: |
            NICE IND226 MenB vaccination by 18 months. One row per currently registered,
            living, non-test child whose 18-month milestone falls in the preceding 12
            months, assessed on the build date.

            Achieved with two primary MenB doses before 12 months and a booster from 12
            months up to, but not including, 18 months. This age split is the local
            interpretation of primary and booster doses. Doses count distinct
            administration or vaccine order dates, measured from the approximate birth
            date.

            Excludes children with a contraindication record for the vaccine, as NICE
            specifies.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND226"
    columns: *childhood_columns

  - name: fct_person_childhood_immunisation_nice_indicators
    description: |
      Current NICE childhood immunisation results. One row per eligible person and
      indicator, with eligibility assessed on the build date.

      Includes the family-specific evidence alongside the shared achievement status. Each
      indicator defines its own population, time window and exclusions.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person in the indicator denominator
      - name: indicator_id
        description: NICE indicator identifier
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND215', 'IND216', 'IND217', 'IND218', 'IND224', 'IND225', 'IND226']
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']
      - name: birth_date_approx
        description: Approximate birth date
      - name: milestone_date
        description: Date the child reached the indicator's milestone age
      - name: doses_in_window
        description: Distinct administration or vaccine order dates within the indicator's age window

  - name: fct_person_childhood_immunisation_nice_indicators_snapshot_input
    description: |
      NICE childhood immunisation results used for change history. One row per eligible
      person and indicator.

      Excludes build-date fields so a new reporting date alone does not create a history
      version. Clinical results and evidence retain the family definitions.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: primary_doses_by_12_months
        description: Distinct MenB administration dates before 12 months of age
      - name: booster_doses_12_to_18_months
        description: Distinct MenB administration dates from 12 months up to but not including 18 months of age
      - name: person_id
        description: Person identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: indicator_id
        description: NICE indicator identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: current_practice_code
        description: ODS code of the current registration practice at the build.
      - name: is_in_numerator
        description: Whether the person met the indicator at the build.
      - name: indicator_status
        description: Outcome label at the build.
      - name: milestone_date
        description: Date the child reached the milestone age.
      - name: doses_in_window
        description: Doses within the age window at the build.
