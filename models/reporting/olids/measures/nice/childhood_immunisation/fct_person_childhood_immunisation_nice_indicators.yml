models:
  - name: fct_person_childhood_immunisation_ind215
    description: >-
      DTP vaccination by 8 months (NICE IND215). One row per person in the denominator
      on the build date.


      People registered on the build date whose 8-month milestone, based on approximate
      birth date, fell in the last 12 months. Achieved with at least three diphtheria,
      tetanus and pertussis-containing doses before age 8 months. Doses count distinct
      administration or vaccine order dates. Excludes recorded vaccine contraindications
      as a substitute for confirmed anaphylaxis. No personalised care adjustments are
      applied. Based on NICE NG218. Code lists: DTaP/IPV/Hib/HepB/6-in-1 and
      dTaP/IPV/4-in-1 administration, drug and contraindication lists
      (CHILDHOOD_IMMS_CODES); 4IN1VAC_COD, 5IN1VAC_COD, 6IN1VAC_COD, DTPCON_COD,
      DTAPIPVCON_COD (PCD); 4IN1VACDRUG_COD, 5IN1VACDRUG_COD, 6IN1VACDRUG_COD (NHS drug
      refset).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind215
        indicator:
          id: "IND215"
          type: "MEASURE"
          category: "IMMUNISATION"
          clinical_domain: "Prevention"
          name_short: "DTP: three doses by 8 months"
          description_short: "DTP vaccination by 8 months."
          description_long: >-
            People registered on the build date whose 8-month milestone, based on
            approximate birth date, fell in the last 12 months. Achieved with at
            least three diphtheria, tetanus and pertussis-containing doses before
            age 8 months. Doses count distinct administration or vaccine order
            dates. Excludes recorded vaccine contraindications as a substitute for
            confirmed anaphylaxis. No personalised care adjustments are applied.
            Based on NICE NG218. Code lists: DTaP/IPV/Hib/HepB/6-in-1 and
            dTaP/IPV/4-in-1 administration, drug and contraindication lists
            (CHILDHOOD_IMMS_CODES); 4IN1VAC_COD, 5IN1VAC_COD, 6IN1VAC_COD,
            DTPCON_COD, DTAPIPVCON_COD (PCD); 4IN1VACDRUG_COD, 5IN1VACDRUG_COD,
            6IN1VACDRUG_COD (NHS drug refset).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND215"
    columns: &childhood_columns
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "NICE indicator identifier."
      - name: indicator_name
        description: "NICE published indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: reporting_date
        description: "Build date used to assess eligibility and achievement."
      - name: measurement_period_start
        description: "Exclusive start of the 12-month milestone cohort."
      - name: age
        description: "Age in completed years on the reporting date; null when the birth date is missing."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: current_practice_code
        description: "ODS code of the registration practice on the build date."
      - name: current_practice_name
        description: "Name of the registration practice on the build date."
      - name: birth_date_approx
        description: "Approximate birth date, set to the middle of the recorded birth month."
      - name: milestone_date
        description: "Approximate date the child reached the required age milestone, in the 12-month eligibility window."
      - name: doses_in_window
        description: "Number of distinct vaccine administration or order dates in the indicator age window, including zero when none. For IND217 this counts MMR or MMRV doses only; the booster is assessed separately."
      - name: is_in_denominator
        description: "Always true; each row meets the documented eligibility and exclusion rules."
      - name: is_in_numerator
        description: "Whether the person meets the documented achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."

  - name: fct_person_childhood_immunisation_ind216
    description: >-
      MMR vaccination by 18 months (NICE IND216). One row per person in the denominator
      on the build date.


      People registered on the build date whose 18-month milestone, based on approximate
      birth date, fell in the last 12 months. Achieved with at least one MMR or MMRV
      dose from age 12 months to before 18 months. Doses count distinct administration
      or vaccine order dates. Excludes recorded vaccine contraindications as a
      substitute for confirmed anaphylaxis. Vaccination age uses recorded completed
      years where available, otherwise approximate birthdays. The upper age limit uses
      approximate birth date. No separate immunocompromise exclusion is applied. No
      personalised care adjustments are applied. Based on NICE NG218. Code lists: MMR
      and MMRV administration, drug and contraindication lists (CHILDHOOD_IMMS_CODES);
      MMRVACDRUG_COD, MMRVVACDRUG_COD (NHS drug refset).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind216
        indicator:
          id: "IND216"
          type: "MEASURE"
          category: "IMMUNISATION"
          clinical_domain: "Prevention"
          name_short: "MMR: one dose by 18 months"
          description_short: "MMR vaccination by 18 months."
          description_long: >-
            People registered on the build date whose 18-month milestone, based on
            approximate birth date, fell in the last 12 months. Achieved with at least
            one MMR or MMRV dose from age 12 months to before 18 months. Doses count
            distinct administration or vaccine order dates. Excludes recorded vaccine
            contraindications as a substitute for confirmed anaphylaxis. Vaccination age
            uses recorded completed years where available, otherwise approximate
            birthdays. The upper age limit uses approximate birth date. No separate
            immunocompromise exclusion is applied. No personalised care adjustments are
            applied. Based on NICE NG218. Code lists: MMR and MMRV administration, drug
            and contraindication lists (CHILDHOOD_IMMS_CODES); MMRVACDRUG_COD,
            MMRVVACDRUG_COD (NHS drug refset).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND216"
    columns: *childhood_columns

  - name: fct_person_childhood_immunisation_ind217
    description: >-
      Preschool booster and two MMR doses by age 5 (NICE IND217). One row per person in
      the denominator on the build date.


      People registered on the build date whose fifth birthday, based on approximate
      birth date, fell in the last 12 months. Achieved with an explicit DTaP/IPV booster
      and at least two MMR or MMRV doses at ages 1 to 4. Doses count distinct
      administration or vaccine order dates. Excludes recorded vaccine contraindications
      as a substitute for confirmed anaphylaxis. Vaccination age uses recorded completed
      years where available, otherwise approximate birthdays. A generic 4-in-1 product
      alone does not establish a booster. No separate immunocompromise exclusion is
      applied. No personalised care adjustments are applied. Based on NICE NG218. Code
      lists: MMR and MMRV administration, drug and contraindication lists
      (CHILDHOOD_IMMS_CODES); DTAPIPVVACBOOST_COD, DTAPIPVCON_COD, DTPCON_COD (PCD);
      MMRVACDRUG_COD, MMRVVACDRUG_COD (NHS drug refset).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind217
        indicator:
          id: "IND217"
          type: "MEASURE"
          category: "IMMUNISATION"
          clinical_domain: "Prevention"
          name_short: "Preschool booster and two MMR doses"
          description_short: "Preschool booster and at least two MMR or MMRV doses, assessed after the fifth birthday."
          description_long: >-
            People registered on the build date whose fifth birthday, based on
            approximate birth date, fell in the last 12 months. Achieved with an
            explicit DTaP/IPV booster and at least two MMR or MMRV doses at ages 1 to 4.
            Doses count distinct administration or vaccine order dates. Excludes
            recorded vaccine contraindications as a substitute for confirmed
            anaphylaxis. Vaccination age uses recorded completed years where available,
            otherwise approximate birthdays. A generic 4-in-1 product alone does not
            establish a booster. No separate immunocompromise exclusion is applied. No
            personalised care adjustments are applied. Based on NICE NG218. Code lists:
            MMR and MMRV administration, drug and contraindication lists
            (CHILDHOOD_IMMS_CODES); DTAPIPVVACBOOST_COD, DTAPIPVCON_COD, DTPCON_COD
            (PCD); MMRVACDRUG_COD, MMRVVACDRUG_COD (NHS drug refset).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND217"
    columns: *childhood_columns

