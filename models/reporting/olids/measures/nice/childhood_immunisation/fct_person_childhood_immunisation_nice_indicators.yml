  - name: fct_person_childhood_immunisation_nice_indicators
    description: >-
      NICE childhood immunisation results. One row per person and indicator on the build date.


      Includes IND215, IND216, IND217, IND218, IND224, IND225, IND226, with the eligibility,
      exclusions and achievement rules documented for each indicator.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND215', 'IND216', 'IND217', 'IND218', 'IND224', 'IND225', 'IND226']
      - name: indicator_status
        description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']
      - name: birth_date_approx
        description: "Approximate birth date, set to the middle of the recorded birth month."
      - name: milestone_date
        description: "Approximate date the child reached the required age milestone, in the 12-month eligibility window."
      - name: doses_in_window
        description: "Number of distinct vaccine administration or order dates in the indicator age window, including zero when none. For IND217 this counts MMR or MMRV doses only; the booster is assessed separately."
      - name: primary_doses_by_12_months
        description: "Distinct MenB administration or order dates at recorded age 0; missing event age uses the approximate first birthday. Null for indicators other than IND226."
      - name: booster_doses_12_to_18_months
        description: "Distinct MenB administration or order dates at recorded age 1 and before approximate age 18 months; missing event age uses the approximate first birthday. Null for indicators other than IND226."

  - name: fct_person_childhood_immunisation_nice_indicators_snapshot_input
    description: >-
      NICE childhood immunisation results. One row per person and indicator.


      Includes IND215, IND216, IND217, IND218, IND224, IND225, IND226, with the eligibility,
      exclusions and achievement rules documented for each indicator. Records achievement and
      evidence used to track changes in clinical results.
      Labels join from def_indicator or the measure tables by indicator_id.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: primary_doses_by_12_months
        description: "Distinct MenB administration or order dates at recorded age 0; missing event age uses the approximate first birthday. Null for indicators other than IND226."
      - name: booster_doses_12_to_18_months
        description: "Distinct MenB administration or order dates at recorded age 1 and before approximate age 18 months; missing event age uses the approximate first birthday. Null for indicators other than IND226."
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - not_null
      - name: current_practice_code
        description: "ODS code of the registration practice on the build date."
      - name: is_in_numerator
        description: "Whether the person meets the documented achievement rule on the build date."
      - name: indicator_status
        description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
      - name: milestone_date
        description: "Approximate date the child reached the required age milestone, in the 12-month eligibility window."
      - name: doses_in_window
        description: "Number of distinct vaccine administration or order dates in the indicator age window, including zero when none. For IND217 this counts MMR or MMRV doses only; the booster is assessed separately."
