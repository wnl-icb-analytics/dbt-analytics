models:
- name: fct_person_childhood_immunisation_ind225_by_month
  description: >-
    MenB vaccination by 8 months (NICE IND225). One row per person in the denominator at
    each month-end.


    People registered at the month-end whose 8-month milestone, based on approximate birth
    date, fell in the last 12 months. Achieved with at least two meningitis B doses before
    age 8 months. Doses count distinct administration or vaccine order dates. Excludes
    recorded meningitis B vaccine contraindications. No personalised care adjustments are
    applied. Based on NICE NG218. Recalculated for each of the last 60 month-ends with
    current rules, code lists and records, so later corrections can change past months.
    Code lists: MenB administration, drug and contraindication lists
    (CHILDHOOD_IMMS_CODES).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind225
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "NICE published indicator title."
  - name: reporting_date
    description: "Month-end used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Exclusive start of the 12-month milestone cohort."
  - name: age
    description: "Age in completed years on the reporting date; null when the birth date is missing."
  - name: condition_name
    description: "Short label for the denominator population."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
  - name: birth_date_approx
    description: "Approximate birth date, set to the middle of the recorded birth month."
  - name: milestone_date
    description: "Approximate date the child reached the required age milestone, in the 12-month eligibility window."
  - name: doses_in_window
    description: "Number of distinct vaccine administration or order dates in the indicator age window; for IND217 this counts MMR or MMRV doses only."
  - name: is_in_denominator
    description: "Always true; each row meets the documented eligibility and exclusion rules."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
