models:
- name: fct_person_flu_vaccination_ind152_by_month
  description: >-
    Flu vaccination in several long-term conditions (NICE IND152). One row per person in the
    denominator at each month-end.


    People registered at the month-end on coronary heart disease, stroke, transient
    ischaemic attack, diabetes or COPD registers. Achieved with a flu vaccination record or
    vaccine order in the last completed 1 August to 31 March season. On 31 March the season
    ending that day is selected; earlier March dates use the preceding season. Diabetes
    register membership starts at 17. Vaccine contraindications remain included. No
    personalised care adjustments are applied. Recalculated for each of the last 60
    month-ends with current rules, code lists and records, so later corrections can change
    past months. Based on NICE NG103. Code lists: CHD_COD, STRK_COD, TIA_COD, DM_COD,
    DMTYPE1_COD, DMTYPE2_COD, DMRES_COD, COPDDIAG_COD, COPDPROC_COD, COPDRES_COD (PCD);
    FLUVAX_COD, LAIV_COD, FLURX_COD, LAIVRX_COD (UKHSA_FLU).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind152
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "NICE published indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Inclusive start of the assessed flu season, 1 August."
  - name: age
    description: "Age in completed years on the reporting date; null when the birth date is missing."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
  - name: latest_vaccination_date
    description: "Latest flu vaccination record or vaccine order date in the most recently completed 1 August to 31 March season; null when none."
  - name: is_laiv
    description: "Whether any vaccination record or vaccine order in the assessed season was for a live attenuated nasal vaccine; null when no qualifying evidence exists."
  - name: latest_record_date
    description: "Latest flu vaccination record or vaccine order date in the most recently completed 1 August to 31 March season; null when none."
  - name: is_in_denominator
    description: "Always true; each row meets the documented eligibility and exclusion rules."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
