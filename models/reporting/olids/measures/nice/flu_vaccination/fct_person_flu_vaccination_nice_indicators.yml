      season ending that day is selected; earlier March dates use the preceding season.
      Diabetes register membership starts at 17. Vaccine contraindications remain included.
      No personalised care adjustments are applied. Based on NICE NG103. Code lists:
      CHD_COD, STRK_COD, TIA_COD, DM_COD, DMTYPE1_COD, DMTYPE2_COD, DMRES_COD, COPDDIAG_COD,
      COPDPROC_COD, COPDRES_COD (PCD); FLUVAX_COD, LAIV_COD, FLURX_COD, LAIVRX_COD
      (UKHSA_FLU).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind152
        indicator:
          id: "IND152"
          type: "MEASURE"
          category: "IMMUNISATION"
          clinical_domain: "Prevention"
          name_short: "Flu vaccination: long-term conditions"
          description_short: "Flu vaccination for heart disease, stroke, diabetes or COPD."
          description_long: >-
            People registered on the build date on coronary heart disease, stroke, transient
            ischaemic attack, diabetes or COPD registers. Achieved with a flu vaccination
            record or vaccine order in the last completed 1 August to 31 March season. On 31
            March the season ending that day is selected; earlier March dates use the
            preceding season. Diabetes register membership starts at 17. Vaccine
            contraindications remain included. No personalised care adjustments are applied.
            Based on NICE NG103. Code lists: CHD_COD, STRK_COD, TIA_COD, DM_COD,
            DMTYPE1_COD, DMTYPE2_COD, DMRES_COD, COPDDIAG_COD, COPDPROC_COD, COPDRES_COD
            (PCD); FLUVAX_COD, LAIV_COD, FLURX_COD, LAIVRX_COD (UKHSA_FLU).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND152"
    columns: *flu_columns

