models:
  - name: fct_person_flu_vaccination_ind131
    description: >-
      Flu vaccination for people with coronary heart disease (NICE IND131). One row per
      person in the denominator on the build date.


      People registered on the build date on the coronary heart disease register. Achieved
      with a flu vaccination record or vaccine order in the last completed 1 August to 31
      March season. On 31 March the season ending that day is selected; earlier March dates
      use the preceding season. Persistent vaccine contraindications and temporary
      contraindications recorded in the preceding 12 months exclude them. No personalised
      care adjustments are applied. Based on NICE NG103. Code
      lists: CHD_COD, XFLU_COD, FLUEXPCON_COD (PCD); FLUVAX_COD, LAIV_COD, FLURX_COD,
      LAIVRX_COD (UKHSA_FLU).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind131
        indicator:
          id: "IND131"
          type: "MEASURE"
          category: "IMMUNISATION"
          clinical_domain: "Prevention"
          name_short: "Flu vaccination: heart disease"
          description_short: "Flu vaccination for people with coronary heart disease."
          description_long: >-
            People registered on the build date on the coronary heart disease register.
            Achieved with a flu vaccination record or vaccine order in the last completed 1
            August to 31 March season. On 31 March the season ending that day is selected;
            earlier March dates use the preceding season. Persistent vaccine
            contraindications and temporary contraindications recorded in the preceding 12
            months exclude them. No personalised care adjustments are applied. Based on NICE
            NG103. Code lists: CHD_COD, XFLU_COD, FLUEXPCON_COD (PCD); FLUVAX_COD, LAIV_COD,
            FLURX_COD, LAIVRX_COD (UKHSA_FLU).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND131"
    columns: &flu_columns
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "NICE indicator identifier."
      - name: indicator_name
        description: "NICE published indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: reporting_date
        description: "Build date used to assess eligibility and achievement."
      - name: measurement_period_start
        description: "Inclusive start of the assessed flu season, 1 August."
      - name: age
        description: "Age in completed years on the reporting date; null when the birth date is missing."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: current_practice_code
        description: "ODS code of the registration practice on the build date."
      - name: current_practice_name
        description: "Name of the registration practice on the build date."
      - name: latest_vaccination_date
        description: "Latest flu vaccination record or vaccine order date in the most recently completed 1 August to 31 March season; null when none."
      - name: is_laiv
        description: "Whether any vaccination record or vaccine order in the assessed season was for a live attenuated nasal vaccine; null when no qualifying evidence exists."
      - name: latest_record_date
        description: "Latest flu vaccination record or vaccine order date in the most recently completed 1 August to 31 March season; null when none."
      - name: is_in_denominator
        description: "Always true; each row meets the documented eligibility and exclusion rules."
      - name: is_in_numerator
        description: "Whether the person meets the documented achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."

