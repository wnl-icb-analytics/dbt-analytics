  - name: fct_person_flu_vaccination_nice_indicators
    description: >-
      NICE flu vaccination results. One row per person and indicator on the build date.


      Includes IND131, IND141, IND152, IND163, IND164, with the eligibility, exclusions and
      achievement rules documented for each indicator.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND131', 'IND141', 'IND152', 'IND163', 'IND164']
      - name: indicator_status
        description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']
      - name: latest_vaccination_date
        description: "Latest flu vaccination record or vaccine order date in the most recently completed 1 August to 31 March season; null when none."
      - name: is_laiv
        description: "Whether any vaccination record or vaccine order in the assessed season was for a live attenuated nasal vaccine; null when no qualifying evidence exists."
      - name: latest_record_date
        description: "Latest flu vaccination record or vaccine order date in the most recently completed 1 August to 31 March season; null when none."

  - name: fct_person_flu_vaccination_nice_indicators_snapshot_input
    description: >-
      NICE flu vaccination results. One row per person and indicator.


      Includes IND131, IND141, IND152, IND163, IND164, with the eligibility, exclusions and
      achievement rules documented for each indicator. Records achievement and evidence used to
      track changes in clinical results.
      Labels join from def_indicator or the measure tables by indicator_id.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - not_null
      - name: current_practice_code
        description: "ODS code of the registration practice on the build date."
      - name: is_in_numerator
        description: "Whether the person meets the documented achievement rule on the build date."
      - name: indicator_status
        description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
      - name: latest_vaccination_date
        description: "Latest flu vaccination record or vaccine order date in the most recently completed 1 August to 31 March season; null when none."
