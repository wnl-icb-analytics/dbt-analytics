models:
- name: fct_person_copd_nice_indicators_by_month
  description: >-
    Monthly NICE COPD results. One row per person and indicator at each month-end.


    Includes IND101, IND140, IND212, with the eligibility, exclusions and achievement
    rules documented for each indicator. Recalculated for each of the last 60 month-ends
    with current rules, code lists and records, so later corrections can change past
    months.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
        - reporting_date
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "NICE published indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Exclusive start of the indicator eligibility or evidence window."
  - name: age
    description: "Age in completed years on the reporting date; null when the birth date is missing."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: latest_record_date
    description: "Date of the latest qualifying evidence in the indicator window; null when none."
  - name: is_in_denominator
    description: "Always true; each row meets the documented eligibility and exclusion rules."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  - name: latest_fev1_date
    description: "Latest FEV1 record in the 12-month achievement window, with or without a numeric result; null when none. Null for indicators other than IND140."
  - name: latest_fev1_percent_date
    description: "Date of the latest valid FEV1 percentage-predicted result on or before the reporting date, with no expiry; null when none. Null for indicators other than IND212."
  - name: latest_fev1_percent
    description: "Latest valid FEV1 as a percentage of predicted, between 5 and 150 inclusive; below 30 establishes very severe COPD. Null when none. Null for indicators other than IND212."
  - name: latest_very_severe_code_date
    description: "Latest very severe COPD diagnosis known by the reporting date; null when none. Null for indicators other than IND212."
  - name: latest_spo2_value
    description: "Latest numeric oxygen saturation in the 12-month achievement window, in the recorded units; null when none. Null for indicators other than IND212."
  - name: diagnosis_date
    description: "Earliest COPD register diagnosis date. Null for indicators other than IND101."
  - name: mrc_date
    description: "First Medical Research Council breathlessness grade of at least 3 in the 15-month eligibility window. Null for indicators other than IND101."
  - name: latest_offer_date
    description: "Latest pulmonary rehabilitation offer, referral or recorded decline strictly after the qualifying breathlessness record and on or before the reporting date; null when none. Null for indicators other than IND101."
  - name: first_invitation_date
    description: "First COPD invitation in the 15-month eligibility window; null when none. Null for indicators other than IND101."
  - name: last_invitation_date
    description: "Last COPD invitation in the 15-month eligibility window; null when none. Null for indicators other than IND101."
  - name: latest_response_date
    description: "Latest COPD review strictly after the first invitation and on or before the reporting date; null when none. Null for indicators other than IND101."
  - name: is_excluded_invitation_non_response
    description: "Whether two invitations at least seven days apart had no subsequent review; always false for included people. Null for indicators other than IND101."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
