models:
- name: fct_person_bone_sparing_therapy_osteoporosis_ind91
  description: NICE IND91. People aged 50-74 with a fragility fracture on or after 1 April 2012 and DXA-confirmed
    osteoporosis, using the OST register known-date definition. A NHS_DRUG_REFSETS/BSADRUG_COD order in
    (R minus six months, R] achieves the indicator. Hospital therapy observations do not count. One row
    per eligible, currently registered, living, non-test person on the build date. Personalised care adjustments
    are not applied.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind91
      indicator:
        id: IND91
        type: MEASURE
        category: BONE_HEALTH
        clinical_domain: Musculoskeletal
        name_short: Bone-sparing therapy
        description_short: Bone-sparing medication ordered in six months after a qualifying fragility
          fracture
        description_long: NICE IND91. People aged 50-74 with a fragility fracture on or after 1 April
          2012 and DXA-confirmed osteoporosis, using the OST register known-date definition. A NHS_DRUG_REFSETS/BSADRUG_COD
          order in (R minus six months, R] achieves the indicator. Hospital therapy observations do not
          count. One row per eligible, currently registered, living, non-test person on the build date.
          Personalised care adjustments are not applied.
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND91
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: person_id
    description: Person in the indicator denominator at R.
  - name: indicator_id
    description: Published NICE indicator identifier.
  - name: indicator_name
    description: Published NICE indicator title.
  - name: reporting_date
    description: Date R used for population, age and evidence; build date for current, completed month-end
      for history.
  - name: measurement_period_start
    description: Exclusive start of the six-month medication-order window.
  - name: age
    description: Completed years at R from the approximate birth date.
  - name: condition_name
    description: Population used by the indicator.
  - name: current_practice_code
    description: Current registration practice ODS code.
  - name: current_practice_name
    description: Current registration practice name.
  - name: latest_bone_sparing_order_date
    description: Latest bone-sparing order on or before the reporting date; may be outside six months.
  - name: latest_record_date
    description: Qualifying order date in (R minus six months, R]; null without current treatment.
  - name: is_in_denominator
    description: Always true. Personalised care adjustments are not applied.
  - name: is_in_numerator
    description: Whether the achievement rule is met at R.
  - name: indicator_status
    description: ACHIEVED or the accepted reason the rule is not met.
