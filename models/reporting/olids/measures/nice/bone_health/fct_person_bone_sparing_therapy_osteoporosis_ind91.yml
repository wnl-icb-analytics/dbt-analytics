models:
- name: fct_person_bone_sparing_therapy_osteoporosis_ind91
  description: >-
    Bone-sparing treatment in osteoporosis, aged 50 to 74 (NICE IND91). One row per person in
    the denominator on the build date.


    People registered on the build date aged 50 to 74 with osteoporosis, a fragility fracture
    on or after 1 April 2012, and a bone density scan record or unrounded T-score at or below
    -2.5. A scan procedure record alone counts without a confirming scan result. Achieved with
    a bone-sparing prescription in the last 6 months or current hospital treatment. Hospital
    zoledronic acid and explicitly intravenous bisphosphonates cover 12 months; denosumab and
    other bone-sparing treatment cover 6 months. No personalised care adjustments are applied.
    Based on NICE TA464. Code lists: FF_COD, OSTEO_COD, DXA_COD, DXA2_COD, BSA_COD (PCD);
    BSADRUG_COD (NHS drug refset).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind91
      indicator:
        id: IND91
        type: MEASURE
        category: BONE_HEALTH
        clinical_domain: Musculoskeletal
        name_short: "Osteoporosis treatment, aged 50 to 74"
        description_short: "Bone-sparing treatment in osteoporosis, aged 50 to 74 (NICE IND91)."
        description_long: >-
          People registered on the build date aged 50 to 74 with osteoporosis, a fragility
          fracture on or after 1 April 2012, and a bone density scan record or unrounded
          T-score at or below -2.5. A scan procedure record alone counts without a confirming
          scan result. Achieved with a bone-sparing prescription in the last 6 months or
          current hospital treatment. Hospital zoledronic acid and explicitly intravenous
          bisphosphonates cover 12 months; denosumab and other bone-sparing treatment cover 6
          months. No personalised care adjustments are applied. Based on NICE TA464. Code
          lists: FF_COD, OSTEO_COD, DXA_COD, DXA2_COD, BSA_COD (PCD); BSADRUG_COD (NHS drug
          refset).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND91
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: person_id
    description: "Person identifier for someone in the indicator denominator."
  - name: indicator_id
    description: "Published NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Build date used to assess the population, age and evidence."
  - name: measurement_period_start
    description: "Exclusive start of the 6-month prescription window. Hospital treatment can cover 6 or 12 months."
  - name: age
    description: "Completed years on the build date, based on the approximate birth date; null when age is unknown."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: current_practice_code
    description: "ODS code of the current registration practice."
  - name: current_practice_name
    description: "Name of the current registration practice."
  - name: latest_bone_sparing_order_date
    description: "Latest bone-sparing drug prescription by the reporting date; it may be outside the 6-month treatment window. Null when never prescribed."
  - name: latest_hospital_therapy_date
    description: "Latest hospital bone-sparing treatment by the reporting date; it may be outside its 6- or 12-month coverage. Null when none is recorded."
  - name: latest_record_date
    description: "Latest prescription or hospital treatment date that establishes current bone-sparing treatment; null when no current treatment is recorded."
  - name: is_in_denominator
    description: "Always true. Every row belongs to the denominator before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the indicator achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
