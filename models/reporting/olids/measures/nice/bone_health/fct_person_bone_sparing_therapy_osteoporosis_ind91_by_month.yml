models:
- name: fct_person_bone_sparing_therapy_osteoporosis_ind91_by_month
  description: >-
    Bone-sparing treatment in osteoporosis, aged 50 to 74 (NICE IND91). One row per person in the
    denominator at the month-end.

    People registered at the month-end aged 50 to 74 with osteoporosis, a fragility fracture on or
    after 1 April 2012, and a coded DXA result of osteoporosis or an unrounded T-score at or below
    -2.5. Achieved with a bone-sparing prescription or therapy code. Coverage is 6 months, or 12 for
    a dm+d zoledronic acid 5 mg prescription. "Hospital therapy" includes zoledronic acid and
    denosumab prescriptions of any issue method, including practice-issued ones. Authorisation-only
    and cancelled statements supply no coverage; a later cancellation does not erase an issued
    prescription. Oncology doses count and are flagged in the therapy evidence model. No
    personalised care adjustments are applied. Based on NICE TA464. Recalculated for each of the
    last 60 month-ends with current rules, code lists and records, so later corrections can change
    past months. Code lists: FF_COD, OSTEO_COD, DXA_COD, DXA2_COD, BSA_COD (PCD); BSADRUG_COD (NHS
    drug refset).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind91
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: person_id
    description: "Person identifier for someone in the indicator denominator."
  - name: indicator_id
    description: "Published NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess the population, age and evidence."
  - name: measurement_period_start
    description: "Exclusive start of the 6-month treatment window. A dm+d zoledronic acid 5 mg prescription covers 12 months."
  - name: age
    description: "Completed years on the month-end, based on the approximate birth date; null when age is unknown."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
  - name: latest_bone_sparing_order_date
    description: "Latest bone-sparing drug prescription by the reporting date; it may be outside the 6-month treatment window. Null when never prescribed."
  - name: latest_hospital_therapy_date
    description: "Latest therapy code or zoledronic acid or denosumab prescription of any issue method, including practice-issued ones, by the reporting date. Coverage is 6 months, or 12 for a dm+d zoledronic acid 5 mg prescription. Includes flagged oncology doses. Excludes authorisation-only and cancelled statements. May be outside coverage; null when none is recorded."
  - name: latest_record_date
    description: "Latest prescription or therapy-code date that establishes current bone-sparing treatment. Coverage is 6 months, or 12 for a dm+d zoledronic acid 5 mg prescription. Includes practice-issued zoledronic acid and denosumab prescriptions and flagged oncology doses. Authorisation-only and cancelled statements supply no coverage. Null when no current treatment is recorded."
  - name: is_in_denominator
    description: "Always true. Every row belongs to the denominator before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the indicator achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
