- name: nice_ind176_current_previous_day_profile
  model: fct_person_cervical_screening_ind176
  given:
  - input: ref('dim_person_active_patients')
    format: sql
    rows: SELECT -12099::NUMBER AS person_id, 'SYNTHETIC'::VARCHAR AS current_practice_code, 'Synthetic practice'::VARCHAR
      AS current_practice_name
  - input: ref('dim_person_age')
    format: sql
    rows: SELECT -12099::NUMBER AS person_id, 30::NUMBER AS age, '1996-03-15'::DATE AS birth_date_approx
  - input: ref('dim_person_demographics')
    format: sql
    rows: SELECT -12099::NUMBER AS person_id, 'Female'::VARCHAR AS gender
  - input: ref('int_nice_cervical_screening_evidence')
    format: sql
    rows: SELECT -12099::NUMBER AS person_id, DATEADD(day,-1,CURRENT_DATE())::DATE AS reporting_date, DATEADD(month,-1,CURRENT_DATE())::TIMESTAMP_NTZ
      AS latest_completed_date, DATEADD(month,-1,CURRENT_DATE())::TIMESTAMP_NTZ AS latest_screening_date, 'Up to
      Date'::VARCHAR AS programme_status, NULL::TIMESTAMP_NTZ AS latest_non_response_date, NULL::TIMESTAMP_NTZ AS
      first_cervix_removal_date, FALSE AS is_currently_pregnant
  expect:
    rows:
    - person_id: -12099
      is_in_numerator: true
      indicator_status: ACHIEVED
