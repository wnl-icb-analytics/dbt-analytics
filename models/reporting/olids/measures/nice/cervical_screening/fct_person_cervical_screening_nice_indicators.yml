models:
  - name: fct_person_cervical_screening_ind176
    description: >-
      Cervical screening at ages 25 to 49 (NICE IND176). One row per person in the
      denominator on the build date.


      People registered on the build date recorded as female and aged 25 to 49. Achieved
      with an adequate cervical screening test in the 42 months before the build date.
      Excludes complete cervix removal and current pregnancy. A record of non-response
      to three invitations in those 42 months excludes unless an adequate test exists in
      that period. Pregnancy means a record in the last 9 months without delivery or
      outcome at the same or a later time. No personalised care adjustments are applied.
      Based on Public Health England NHS population screening reporting data definitions
      (2024). Code lists: SMEAR_COD, NOCX_COD, CSPCAINVITE_COD, PREG_COD, PREGDEL_COD
      (PCD); CSPU_COD, CSDEC_COD for programme status and screening history (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind176
        indicator:
          id: "IND176"
          type: "MEASURE"
          category: "SCREENING"
          clinical_domain: "Prevention"
          name_short: "Cervical screening, ages 25 to 49"
          description_short: "Cervical screening at ages 25 to 49."
          description_long: >-
            People registered on the build date recorded as female and aged 25 to 49.
            Achieved with an adequate cervical screening test in the 42 months before
            the build date. Excludes complete cervix removal and current pregnancy. A
            record of non-response to three invitations in those 42 months excludes
            unless an adequate test exists in that period. Pregnancy means a record in
            the last 9 months without delivery or outcome at the same or a later time.
            No personalised care adjustments are applied. Based on Public Health England
            NHS population screening reporting data definitions (2024). Code lists:
            SMEAR_COD, NOCX_COD, CSPCAINVITE_COD, PREG_COD, PREGDEL_COD (PCD); CSPU_COD,
            CSDEC_COD for programme status and screening history (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND176"
    columns: &cervical_columns
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "NICE indicator identifier."
      - name: indicator_name
        description: "NICE published indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: reporting_date
        description: "Build date used to assess eligibility and achievement."
      - name: measurement_period_start
        description: "Inclusive start of the 42-month screening window for IND176, or 66 months for IND177 and IND321."
      - name: age
        description: "Age in completed years on the reporting date; null when the birth date is missing."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: current_practice_code
        description: "ODS code of the registration practice on the build date."
      - name: current_practice_name
        description: "Name of the registration practice on the build date."
      - name: latest_completed_date
        description: "Latest adequate cervical screening test on or before the reporting date, including tests outside the achievement window; null when none."
      - name: latest_screening_date
        description: "Latest cervical screening record of any type on or before the reporting date; null when none."
      - name: programme_status
        description: "Unsuitable when an unsuitability record has no completed screening at the same or a later time; otherwise Never Screened, Up to Date or Overdue. Uses 1,277 days through age 49 and 2,007 days thereafter, so it can differ from indicator achievement. CSPU_COD supplies unsuitability."
      - name: latest_record_date
        description: "Latest adequate cervical screening test in the indicator achievement window; null when none."
      - name: is_in_denominator
        description: "Always true; each row meets the documented eligibility and exclusion rules."
      - name: is_in_numerator
        description: "Whether the person meets the documented achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."

