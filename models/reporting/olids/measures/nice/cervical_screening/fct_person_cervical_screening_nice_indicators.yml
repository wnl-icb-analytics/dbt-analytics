  - name: fct_person_cervical_screening_nice_indicators
    description: |
      Current NICE cervical screening results. One row per eligible person and indicator,
      with eligibility assessed on the build date.

      Includes the family-specific evidence alongside the shared achievement status. Each
      indicator defines its own population, time window and exclusions.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person in the indicator denominator
      - name: indicator_id
        description: NICE indicator identifier
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND176', 'IND177', 'IND321']
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']
      - name: latest_completed_date
        description: Date of the latest completed screening record; null if never screened
      - name: latest_screening_date
        description: Date of the latest cervical screening record of any type; null when none
      - name: programme_status
        description: Programme status from the screening model
      - name: latest_record_date
        description: Date of the latest completed screening in the period; null when none

  - name: fct_person_cervical_screening_nice_indicators_snapshot_input
    description: |
      NICE cervical screening results used for change history. One row per eligible person
      and indicator.

      Excludes build-date fields so a new reporting date alone does not create a history
      version. Clinical results and evidence retain the family definitions.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: indicator_id
        description: NICE indicator identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: current_practice_code
        description: ODS code of the current registration practice at the build.
      - name: is_in_numerator
        description: Whether the person met the indicator at the build.
      - name: indicator_status
        description: Outcome label at the build.
      - name: latest_completed_date
        description: Date of the latest completed screening at the build.
      - name: latest_screening_date
        description: Date of the latest cervical screening record of any type; null when none
