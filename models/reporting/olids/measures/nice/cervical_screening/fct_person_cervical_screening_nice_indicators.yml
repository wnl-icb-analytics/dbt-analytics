  - name: fct_person_cervical_screening_ind321
    description: >-
      Cervical screening at ages 25 to 64 (NICE IND321). One row per person in the
      denominator on the build date.


      People registered on the build date recorded as female and aged 25 to 64. Achieved
      with an adequate cervical screening test in the 66 months before the build date.
      Excludes complete cervix removal. Pregnancy and invitation non-response remain in
      the denominator. No personalised care adjustments are applied. Based on NHS
      England cervical screening programme overview (2025). Code lists: SMEAR_COD,
      NOCX_COD (PCD); CSPU_COD, CSDEC_COD, CSPCAINVITE_COD for programme status and
      screening history (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind321
        indicator:
          id: "IND321"
          type: "MEASURE"
          category: "SCREENING"
          clinical_domain: "Prevention"
          name_short: "Cervical screening, ages 25 to 64"
          description_short: "Cervical screening at ages 25 to 64."
          description_long: >-
            People registered on the build date recorded as female and aged 25 to 64.
            Achieved with an adequate cervical screening test in the 66 months before
            the build date. Excludes complete cervix removal. Pregnancy and invitation
            non-response remain in the denominator. No personalised care adjustments are
            applied. Based on NHS England cervical screening programme overview (2025).
            Code lists: SMEAR_COD, NOCX_COD (PCD); CSPU_COD, CSDEC_COD, CSPCAINVITE_COD
            for programme status and screening history (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND321"
    columns: *cervical_columns

  - name: fct_person_cervical_screening_nice_indicators
    description: >-
      NICE cervical screening results. One row per person and indicator on the build date.


      Includes IND176, IND177, IND321, with the eligibility, exclusions and achievement rules
      documented for each indicator.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND176', 'IND177', 'IND321']
      - name: indicator_status
        description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']
      - name: latest_completed_date
        description: "Latest adequate cervical screening test on or before the reporting date, including tests outside the achievement window; null when none."
      - name: latest_screening_date
        description: "Latest cervical screening record of any type on or before the reporting date; null when none."
      - name: programme_status
        description: "Unsuitable when an unsuitability record has no completed screening at the same or a later time; otherwise Never Screened, Up to Date or Overdue. Uses 1,277 days through age 49 and 2,007 days thereafter, so it can differ from indicator achievement. CSPU_COD supplies unsuitability."
      - name: latest_record_date
        description: "Latest adequate cervical screening test in the indicator achievement window; null when none."

  - name: fct_person_cervical_screening_nice_indicators_snapshot_input
    description: >-
      NICE cervical screening results. One row per person and indicator.


      Includes IND176, IND177, IND321, with the eligibility, exclusions and achievement rules
      documented for each indicator. Records achievement and evidence used to track changes in
      clinical results.
      Labels join from def_indicator or the measure tables by indicator_id.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - not_null
      - name: current_practice_code
        description: "ODS code of the registration practice on the build date."
      - name: is_in_numerator
        description: "Whether the person meets the documented achievement rule on the build date."
      - name: indicator_status
        description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
      - name: latest_completed_date
        description: "Latest adequate cervical screening test on or before the build date, including tests outside the achievement window; null when none."
      - name: latest_screening_date
        description: "Latest cervical screening record of any type on or before the build date; null when none."
