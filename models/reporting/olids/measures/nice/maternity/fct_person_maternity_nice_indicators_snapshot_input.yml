models:
- name: fct_person_maternity_nice_indicators_snapshot_input
  description: NICE maternity snapshot evidence. One row per eligible woman and indicator at the build
    date. Keeps delivery, qualifying enquiry, practice and outcome; excludes advancing assessment dates.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
  columns:
  - name: person_id
    description: Woman in the indicator denominator.
    data_tests:
    - not_null
  - name: indicator_id
    description: NICE indicator identifier.
  - name: delivery_date
    description: Earliest clinical date of the latest known delivery episode; starts the postpartum window.
  - name: latest_record_date
    description: Latest qualifying mental health enquiry date 4 to 16 weeks after delivery; null when
      none.
  - name: is_in_numerator
    description: Whether qualifying mental health enquiry evidence is present.
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD.
  - name: current_practice_code
    description: ODS code of the current registration practice.
