models:
- name: fct_person_maternity_nice_indicators_snapshot_input
  description: >-
    Postnatal mental health evidence for change history (IND178). One row per eligible person and
    indicator.


    Records practice, supporting evidence and achievement from the build date. Reporting date and
    measurement period start are omitted, so the passing of a day alone does not create a new
    version. Eligibility and achievement follow the individual measures.
    Labels join from def_indicator or the measure tables by indicator_id.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
    data_tests:
    - not_null
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: delivery_date
    description: >-
      First clinical date of the latest known delivery episode, used to assess the postnatal enquiry
      period. Null when this field does not apply to the indicator.
  - name: latest_record_date
    description: >-
      Supporting evidence date for the indicator. Its meaning follows the individual measure; a date
      alone does not prove achievement.
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  - name: current_practice_code
    description: "ODS code of the registration practice at the reporting date."
