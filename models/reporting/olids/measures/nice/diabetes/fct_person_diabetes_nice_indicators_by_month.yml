models:
- columns:
  - description: "Person identifier for someone in the indicator denominator."
    name: person_id
  - description: "Published NICE indicator identifier."
    name: indicator_id
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: reporting_date
    description: "Month-end used to assess the population, age and evidence."
  - name: measurement_period_start
    description: "Start date of the indicator measurement period; inclusion of this date depends on the indicator."
  - name: age
    description: "Completed years on the month-end, based on the approximate birth date; null when age is unknown."
  - name: condition_name
    description: "Short label for the indicator denominator population."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
  - name: is_in_denominator
    description: "Always true. Every row belongs to the denominator before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the indicator achievement rule on the reporting date."
  - description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
    name: indicator_status
  - description: "Evidence date retained by the indicator; see each measure for its test, referral or treatment rule. Null when no qualifying evidence is retained."
    name: latest_record_date
  - description: "Last HbA1c result in the measurement period, in IFCC mmol/mol after conversion where needed; null when absent or unusable. Null where the field does not apply to an indicator."
    name: latest_hba1c_value
  - description: "Inclusive upper HbA1c threshold in mmol/mol; null for indicators without an HbA1c target. Null where the field does not apply to an indicator."
    name: hba1c_threshold
  - description: "Systolic blood pressure from the selected complete reading, in mmHg; null when no complete reading is available. Null where the field does not apply to an indicator."
    name: latest_systolic_value
  - description: "Diastolic blood pressure from the selected complete reading, in mmHg; null when no complete reading is available. Null where the field does not apply to an indicator."
    name: latest_diastolic_value
  - description: "Latest coded frailty severity by the reporting date; null when none is recorded. Null where the field does not apply to an indicator."
    name: latest_frailty_severity
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
        - reporting_date
  description: >-
    Diabetes, non-diabetic hyperglycaemia and gestational diabetes NICE indicator results
    (IND81, IND88, IND89, IND111, IND120, IND134, IND135, IND136, IND137, IND160, IND165,
    IND171, IND172, IND173, IND179, IND180, IND249). One row per person, indicator and
    month-end.


    Each indicator uses its own denominator, evidence window and exclusions, described in
    the member measures. Clinical fields are null where they do not apply to an indicator.
    No personalised care adjustments are applied. Recalculated for each of the last 60
    month-ends with current rules, code lists and records, so later corrections can change
    past months.
  name: fct_person_diabetes_nice_indicators_by_month
