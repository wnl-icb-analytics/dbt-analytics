models:
- name: fct_person_diabetes_ras_therapy_ind134_by_month
  description: >-
    ACE inhibitor or ARB treatment in diabetes (NICE IND134). One row per person in the
    denominator at the month-end.


    People registered at the month-end on the diabetes register with recorded proteinuria
    or microalbuminuria. Achieved with an ACE inhibitor or angiotensin receptor blocker
    (ARB) prescription in the 6 months before the month-end. Excludes contraindications to
    both classes, each requiring a persisting record or a temporary contraindication in
    the last 12 months. No personalised care adjustments are applied. Based on NICE NG17.
    Recalculated for each of the last 60 month-ends with current rules, code lists and
    records, so later corrections can change past months. Code lists: PRT_COD, MAL_COD
    (PCD); 0205051, 0205052 (BNF); XACE_COD, TXACE_COD, XAII_COD, TXAII_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind134
  columns:
  - name: person_id
    description: "Person identifier for someone in the indicator denominator."
  - name: indicator_id
    description: "Published NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: reporting_date
    description: "Month-end used to assess the population, age and evidence."
  - name: measurement_period_start
    description: "Inclusive start of the indicator measurement period before the reporting date."
  - name: age
    description: "Completed years on the month-end, based on the approximate birth date; null when age is unknown."
  - name: condition_name
    description: "Short label for the indicator denominator population."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
  - name: latest_therapy_order_date
    description: "Date of the latest relevant medication prescription by the reporting date; it may be outside the treatment window. Null when never prescribed."
  - name: latest_therapy_class
    description: "ACE_INHIBITOR or ARB for the latest prescription; null when never prescribed."
  - name: latest_record_date
    description: "Date of qualifying evidence retained within the indicator measurement or follow-up window; null when none is recorded."
  - name: is_in_denominator
    description: "Always true. Every row belongs to the denominator before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the indicator achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
