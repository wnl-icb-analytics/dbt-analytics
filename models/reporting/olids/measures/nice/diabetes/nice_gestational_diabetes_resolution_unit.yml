unit_tests:
- name: nice_ind173_latest_known_diabetes_resolution
  model: fct_person_gestational_diabetes_hba1c_ind173_by_month
  given:
  - input: ref('int_nice_reference_population_by_month')
    format: sql
    rows: |-
      SELECT column1::NUMBER AS person_id,
          '2026-09-30'::DATE AS reporting_date,
          40 AS age,
          '1986-01-01'::DATE AS birth_date_approx,
          'Male' AS gender,
          'SYNTHETIC' AS practice_code,
          'Synthetic practice' AS practice_name
      FROM VALUES (-173309), (-173308), (-173307), (-173306), (-173305), (-173304), (-173303), (-173302), (-173301)
  - input: ref('fct_person_gestational_diabetes_register_by_month')
    format: sql
    rows: |-
      SELECT column1::NUMBER AS person_id,
          '2026-09-30'::DATE AS month_end_date,
          '2020-01-01'::TIMESTAMP_NTZ AS earliest_diagnosis_date,
          '2020-01-01'::TIMESTAMP_NTZ AS latest_diagnosis_date,
          40 AS age,
          '1986-01-01'::DATE AS birth_date_approx,
          'Male' AS gender,
          'SYNTHETIC' AS practice_code,
          'Synthetic practice' AS practice_name
      FROM VALUES (-173309), (-173308), (-173307), (-173306), (-173305), (-173304), (-173303), (-173302), (-173301)
  - input: ref('int_diabetes_diagnoses_all')
    format: sql
    rows: |-
      SELECT column1::NUMBER AS person_id, column2::TIMESTAMP_NTZ AS clinical_effective_date,
          column3::TIMESTAMP_NTZ AS date_recorded, column4::BOOLEAN AS is_diagnosis_code,
          column5::BOOLEAN AS is_resolved_code
      FROM VALUES
          (-173301, '2024-01-01', NULL, TRUE, FALSE),
          (-173301, '2024-02-01', NULL, FALSE, TRUE),
          (-173302, '2024-01-01 08:00:00', NULL, TRUE, FALSE),
          (-173302, '2024-01-01 18:00:00', NULL, FALSE, TRUE),
          (-173303, '2024-01-01', NULL, TRUE, FALSE),
          (-173304, '2024-01-01', NULL, TRUE, FALSE),
          (-173304, '2024-02-01', NULL, FALSE, TRUE),
          (-173304, '2024-03-01', NULL, TRUE, FALSE),
          (-173305, '2024-01-01', NULL, TRUE, FALSE),
          (-173305, '2026-09-01', NULL, TRUE, FALSE),
          (-173306, '2024-01-01', NULL, TRUE, FALSE),
          (-173306, '2026-10-01', NULL, FALSE, TRUE),
          (-173307, '2024-01-01', NULL, TRUE, FALSE),
          (-173307, '2024-02-01', '2026-10-01', FALSE, TRUE),
          (-173308, '2025-09-30', NULL, TRUE, FALSE),
          (-173309, '2024-01-01', NULL, TRUE, FALSE),
          (-173309, '2024-02-01', NULL, FALSE, TRUE),
          (-173309, '2025-01-01', '2026-10-01', TRUE, FALSE)
  - input: ref('int_nice_hba1c_evidence_by_month')
    format: sql
    rows: SELECT NULL::NUMBER AS person_id, NULL::DATE AS reporting_date, NULL::DATE AS latest_hba1c_date
      WHERE FALSE
  expect:
    rows:
    - person_id: -173301
      is_in_numerator: false
    - person_id: -173308
      is_in_numerator: false
    - person_id: -173309
      is_in_numerator: false
  config:
    tags:
    - monthly-full
    - nice-history
    - nice-qof-fixes
