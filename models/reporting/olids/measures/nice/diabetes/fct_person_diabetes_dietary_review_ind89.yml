models:
- name: fct_person_diabetes_dietary_review_ind89
  description: Diabetes dietary review. One row per registered, living, non-test diabetes register member
    assessed at the build date R. A NUTRIASS_COD nutrition assessment, NHSD_PRIMARY_CARE_DOMAIN_REFSETS
    DIETITIAN_COD contact or ECL_CACHE DM_DIET_REVIEW_COD review in (R - 15 months, R] qualifies. Advice,
    education, referrals, offers and declines alone do not qualify. Professional competence cannot be
    verified from these codes. No exclusions apply.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind89
      indicator:
        id: IND89
        type: MEASURE
        category: DIABETES_QUALITY
        clinical_domain: Cardiometabolic
        name_short: 'Diabetes: annual dietary review'
        description_short: A NUTRIASS_COD nutrition assessment, NHSD_PRIMARY_CARE_DOMAIN_REFSETS DIETITIAN_COD
          contact or ECL_CACHE DM_DIET_REVIEW_COD review in (R - 15 months, R] qualifies. Advice, education,
          referrals, offers and declines alone do not qualify. Professional competence cannot be verified
          from these codes. No exclusions apply.
        description_long: Diabetes dietary review. One row per registered, living, non-test diabetes register
          member at R. A NUTRIASS_COD nutrition assessment, NHSD_PRIMARY_CARE_DOMAIN_REFSETS DIETITIAN_COD
          contact or ECL_CACHE DM_DIET_REVIEW_COD review in (R - 15 months, R] qualifies. Advice, education,
          referrals, offers and declines alone do not qualify. Professional competence cannot be verified
          from these codes. No exclusions apply.
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND89
  columns:
  - name: person_id
    description: Person in the indicator denominator.
    data_tests:
