models:
- columns:
  - description: Person in the indicator denominator
    name: person_id
  - description: NICE indicator identifier
    name: indicator_id
  - description: Published NICE indicator name
    name: indicator_name
  - description: Completed month-end at which eligibility and evidence are assessed.
    name: reporting_date
  - description: Inclusive start of the measurement period before the reporting date
    name: measurement_period_start
  - description: Completed years at month-end from the approximate birth month.
    name: age
  - description: Population defining the indicator
    name: condition_name
  - description: ODS practice code at month-end under the monthly spine attribution.
    name: practice_code
  - description: Practice name at month-end under the monthly spine attribution.
    name: practice_name
  - description: Latest coded frailty severity; null when none
    name: latest_frailty_severity
  - description: Observation identifier of the last HbA1c in the period; null when none
    name: latest_hba1c_observation_id
  - description: Date of the last HbA1c in the period; null when none
    name: latest_record_date
  - description: Last HbA1c in the period in mmol/mol; null when none
    name: latest_hba1c_value
  - description: Whether the last HbA1c in the period is a valid IFCC result
    name: is_latest_hba1c_valid
  - description: Inclusive HbA1c threshold in mmol/mol
    name: indicator_threshold
  - description: Unit of the threshold
    name: threshold_unit
  - description: Always true; every row is an eligible person before personalised care adjustments
    name: is_in_denominator
  - description: Whether any HbA1c falls in the period
    name: is_hba1c_recorded_in_period
  - description: Whether the last HbA1c in the period is valid and at or below the threshold
    name: is_in_numerator
  - description: ACHIEVED, ABOVE_TARGET, NOT_ASSESSABLE (invalid last result) or NOT_RECORDED_IN_PERIOD
    name: indicator_status
  config:
    meta:
      clinical_source: https://www.nice.org.uk/indicators/ind135
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  description: "NICE IND135. HbA1c control at 64 mmol/mol in diabetes. One row per\nregistered,\
    \ living, non-test person on the diabetes register, assessed on\nthe completed month-end.\n\nAchievement\
    \ requires the last recorded HbA1c in the preceding 12 months to\nbe valid and at or below 64 mmol/mol.\
    \ A value-free or invalid last result\nis unassessable and is not replaced by an older result. A valid\
    \ result on the\nsame date takes precedence.\n\nPeople with fructosamine but no HbA1c test in the\
    \ period, or with maximum\ntolerated diabetes treatment recorded in the period, are excluded. There\
    \ is\nno frailty exclusion.\n\nPersonalised care adjustments are not applied.\n Recalculated for the\
    \ last 60 completed month-ends using today's rules and code lists. Registration and practice use the\
    \ existing monthly spine, with registration start inclusive and registration end and death exclusive.\
    \ Overlapping registrations retain the spine's current-registration priority. Birth and death dates\
    \ are approximate; missing birth dates prevent historical active rows. Current gender and test flags\
    \ apply retrospectively. Diagnosis state uses clinical and recorded dates; test and BP evidence use\
    \ their clinical dates through month-end. Later corrections can alter earlier results. Personalised\
    \ care adjustments are not applied."
  name: fct_person_diabetes_hba1c_ind135_by_month
