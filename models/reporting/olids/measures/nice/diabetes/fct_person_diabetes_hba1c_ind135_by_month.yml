models:
- columns:
  - description: "Person identifier for someone in the indicator denominator."
    name: person_id
  - description: "Published NICE indicator identifier."
    name: indicator_id
  - description: "Published NICE indicator title."
    name: indicator_name
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - description: "Month-end used to assess the population, age and evidence."
    name: reporting_date
  - description: "Inclusive start of the indicator measurement period before the reporting date."
    name: measurement_period_start
  - description: "Completed years on the month-end, based on the approximate birth date; null when age is unknown."
    name: age
  - description: "Short description of the people in the denominator."
    name: denominator_description
  - description: "ODS code of the registration practice at month-end."
    name: practice_code
  - description: "Name of the registration practice at month-end."
    name: practice_name
  - description: "Latest coded frailty severity by the reporting date; null when none is recorded."
    name: latest_frailty_severity
  - description: "Source observation identifier for the last HbA1c test in the measurement period; null when none is recorded."
    name: latest_hba1c_observation_id
  - description: "Date of the last HbA1c test in the measurement period, including tests with missing or invalid results; null when none is recorded."
    name: latest_record_date
  - description: "Last HbA1c result in the measurement period, in IFCC mmol/mol after conversion where needed. Invalid numeric results may remain present and do not achieve the indicator. Null when no test or convertible result is available."
    name: latest_hba1c_value
  - description: "Whether the selected HbA1c is valid: original IFCC 20 to 200 mmol/mol or DCCT 3 to 20%, inclusive. False when no test is recorded."
    name: is_latest_hba1c_valid
  - description: "Inclusive upper HbA1c threshold in mmol/mol."
    name: indicator_threshold
  - description: "Unit of the indicator threshold, mmol/mol for HbA1c."
    name: threshold_unit
  - description: "Always true. Every row belongs to the denominator before personalised care adjustments."
    name: is_in_denominator
  - description: "Whether an HbA1c test is recorded in the measurement period, including tests with missing or invalid results."
    name: is_hba1c_recorded_in_period
  - description: "Whether the person meets the indicator achievement rule on the reporting date."
    name: is_in_numerator
  - description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
    name: indicator_status
  config:
    meta:
      clinical_source: https://www.nice.org.uk/indicators/ind135
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  description: >-
    Diabetes HbA1c at or below 64 mmol/mol (NICE IND135). One row per person in the
    denominator at the month-end.


    People registered at the month-end aged 17 or over on the diabetes register. Achieved when
    the latest HbA1c test in the last 12 months has a valid result at or below 64 mmol/mol. A
    missing or invalid latest result is unassessable; no older result is substituted. Valid
    results take priority on the same day. Excludes fructosamine without HbA1c testing in that
    period, or maximum tolerated diabetes treatment recorded in that period. Frailty and blood
    test decline or exception codes do not exclude anyone. No personalised care adjustments
    are applied. Based on NICE NG17. Recalculated for each of the last 60 month-ends with
    current rules, code lists and records, so later corrections can change past months. Code
    lists: DM_COD, DMTYPE1_COD, DMTYPE2_COD, DMRES_COD, IFCCHBAM_COD, DCCTHBA1C_COD,
    SERFRUC_COD, DMMAX_COD (PCD).
  name: fct_person_diabetes_hba1c_ind135_by_month
