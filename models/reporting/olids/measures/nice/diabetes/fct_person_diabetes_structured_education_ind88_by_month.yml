models:
- name: fct_person_diabetes_structured_education_ind88_by_month
  description: >-
    Structured education referral after diabetes diagnosis (NICE IND88). One row per
    person in the denominator at the month-end.


    People registered at the month-end on the diabetes register first diagnosed 9 to 21
    months before the month-end, so every 9-month follow-up is complete. Achieved with a
    structured education referral from diagnosis to 9 months afterwards. Attendance or an
    offer alone does not count. No personalised care adjustments are applied. Based on
    NICE NG17. Recalculated for each of the last 60 month-ends with current rules, code
    lists and records, so later corrections can change past months. Code lists: DM_COD,
    DSEP_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind88
  columns:
  - name: person_id
    description: "Person identifier for someone in the indicator denominator."
  - name: indicator_id
    description: "Published NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: reporting_date
    description: "Month-end used to assess the population, age and evidence."
  - name: measurement_period_start
    description: "Exclusive start of the diagnosis cohort window; tests or referrals use the separate follow-up window described for the indicator."
  - name: age
    description: "Completed years on the month-end, based on the approximate birth date; null when age is unknown."
  - name: condition_name
    description: "Short label for the indicator denominator population."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
  - name: diagnosis_date
    description: "First recorded diagnosis date used to define the indicator population and follow-up window."
  - name: latest_record_date
    description: "Date of the first qualifying referral after diagnosis within the indicator follow-up window; null when none is recorded."
  - name: is_in_denominator
    description: "Always true. Every row belongs to the denominator before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the indicator achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
