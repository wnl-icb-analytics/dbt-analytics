  - name: fct_person_diabetes_bp_ind249
    description: >
      NICE IND249 blood pressure in diabetes. One row per currently
      registered, living, non-test person on the diabetes register aged 17 to
      79 without moderate or severe coded frailty, assessed on the build date.
      The numerator requires a reading in the preceding 12 months below 140/90
      mmHg in clinic or 135/85 mmHg using HBPM or ABPM. Personalised care
      adjustments are not applied. Secondary-use consumers must join
      DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-Out and Type
      1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind249
        indicator:
          id: "IND249"
          type: "MEASURE"
          category: "DIABETES_QUALITY"
          clinical_domain: "Cardiometabolic"
          name_short: "Diabetes BP control, no moderate or severe frailty"
          description_short: "Diabetes BP target achieved in the preceding 12 months for people aged 17 to 79 without moderate or severe frailty"
          description_long: "NICE IND249 before personalised care adjustments."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND249"
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_frailty_severity
        description: Latest coded frailty severity from the frailty register; null when none recorded
      - name: latest_bp_date
        description: Date of the latest valid paired blood pressure reading, regardless of period; null when none is recorded
      - name: latest_record_date
        description: Date of the latest reading when it falls in the period; null otherwise
      - name: latest_systolic_value
        description: Latest systolic blood pressure in mmHg
      - name: latest_diastolic_value
        description: Latest diastolic blood pressure in mmHg
      - name: is_home_bp_event
        description: Whether the latest reading was recorded using home monitoring
      - name: is_abpm_bp_event
        description: Whether the latest reading was recorded using ambulatory monitoring
      - name: applied_measurement_context
        description: Clinic or HBPM/ABPM context of the latest reading
      - name: indicator_systolic_threshold
        description: Exclusive systolic threshold in mmHg specified by this indicator
      - name: indicator_diastolic_threshold
        description: Exclusive diastolic threshold in mmHg specified by this indicator
      - name: is_bp_recorded_in_last_12m
        description: Whether the latest BP was recorded between measurement_period_start and the reporting date
      - name: is_latest_bp_within_indicator_target
        description: Whether the latest BP is below both indicator thresholds, regardless of recording date
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or the reason not achieved
