models:
  - name: fct_person_diabetes_hba1c_ind179
    description: |
      NICE IND179. HbA1c control at 58 mmol/mol in diabetes without moderate or
      severe frailty. One row per currently registered, living, non-test person on
      the diabetes register without moderate or severe frailty, assessed on the
      build date.

      Achievement requires the last recorded HbA1c in the preceding 12 months to
      be valid and at or below 58 mmol/mol. An invalid last result is unassessable
      and is not replaced by an older result.

      People with fructosamine but no HbA1c test in the period, or with maximum
      tolerated diabetes treatment recorded in the period, are excluded.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind179
        indicator:
          id: "IND179"
          type: "MEASURE"
          category: "DIABETES_QUALITY"
          clinical_domain: "Cardiometabolic"
          name_short: "Diabetes HbA1c 58, no moderate or severe frailty"
          description_short: "Last HbA1c in the preceding 12 months at or below 58 mmol/mol for people with diabetes without moderate or severe frailty"
          description_long: |
            NICE IND179. One row per currently registered, living, non-test person on the
            diabetes register without moderate or severe frailty, assessed on the build
            date.

            Achievement requires the last recorded HbA1c in the preceding 12 months to be
            valid and at or below 58 mmol/mol. An invalid last result is unassessable and
            is not replaced by an older result.

            People with fructosamine but no HbA1c test in the period, or with maximum
            tolerated diabetes treatment recorded in the period, are excluded.

            Measured before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND179"
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_frailty_severity
        description: Latest coded frailty severity from the frailty register; null when none recorded
      - name: latest_hba1c_observation_id
        description: Selected source observation; null when no HbA1c falls in the period
      - name: latest_record_date
        description: Date of the last recorded HbA1c in the period; null when none
      - name: latest_hba1c_value
        description: Last recorded HbA1c in IFCC mmol/mol, converted from DCCT where needed; null when none or unusable
      - name: is_latest_hba1c_valid
        description: Whether the last recorded HbA1c is within the plausible range; false when none
      - name: indicator_threshold
        description: Inclusive upper HbA1c threshold in mmol/mol for this indicator
      - name: threshold_unit
        description: mmol/mol
      - name: is_hba1c_recorded_in_period
        description: Whether any HbA1c falls in the period, including invalid results
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or the reason not achieved
