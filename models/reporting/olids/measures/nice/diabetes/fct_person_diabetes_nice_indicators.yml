  - name: fct_person_diabetes_bp_ind249
    description: |
      NICE IND249. Blood pressure control in diabetes without moderate or severe
      frailty. One row per currently registered, living, non-test person aged 17
      to 79 on the diabetes register without moderate or severe frailty, assessed
      on the build date.

      Achievement requires the latest blood pressure in the preceding 12 months to
      be below 140/90 mmHg in clinic or 135/85 mmHg at home or by ambulatory
      monitoring. Both components must be strictly below their thresholds.

      People outside the age range or with an unknown age are excluded.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind249
        indicator:
          id: "IND249"
          type: "MEASURE"
          category: "DIABETES_QUALITY"
          clinical_domain: "Cardiometabolic"
          name_short: "Diabetes BP control, no moderate or severe frailty"
          description_short: "Last BP below 140/90 clinic or 135/85 home or ambulatory in 12 months, diabetes age 17-79 without moderate or severe frailty"
          description_long: |
            NICE IND249. One row per currently registered, living, non-test person aged 17
            to 79 on the diabetes register without moderate or severe frailty, assessed on
            the build date.

            Achievement requires the latest blood pressure in the preceding 12 months to
            be below 140/90 mmHg in clinic or 135/85 mmHg at home or by ambulatory
            monitoring. Both components must be strictly below their thresholds.

            People outside the age range or with an unknown age are excluded.

            Measured before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND249"
