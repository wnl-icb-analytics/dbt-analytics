      General foot examinations, pulse checks, risk classifications and referrals alone
      do not count. A performed test counts despite a decline or unsuitability on the
      same day. No personalised care adjustments are applied. Based on NICE NG19. Code
      lists: FOOTEXAM_COD, FEDEC_COD, FEPU_COD (PCD).
