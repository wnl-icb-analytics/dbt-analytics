      diagnosis falls in the preceding 12 months, assessed on the build date.
      The numerator requires a structured education programme referral code
      (DSEP_COD) between the diagnosis date and 9 months after it. NICE anchors on entry to the diabetes register; the register has no entry date separate from the first diagnosis code, so that date is used. NICE frames
