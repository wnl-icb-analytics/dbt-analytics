      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind173
        indicator:
          id: "IND173"
          type: "MEASURE"
          category: "DIABETES_QUALITY"
          clinical_domain: "Cardiometabolic"
          name_short: "Gestational diabetes history HbA1c"
          description_short: "HbA1c testing after gestational diabetes (NICE IND173)."
          description_long: >-
            People registered on the build date on the gestational diabetes
            register whose latest episode was more than 12 months before the build
            date. Any diabetes diagnosis more than 12 months before that date
            excludes the person, even if subsequently resolved. Achieved with
            HbA1c testing in the last 12 months. No numeric result is needed. No
            personalised care adjustments are applied. Based on NICE NG3. Code
            lists: GESTDIAB_COD, DM_COD, IFCCHBAM_COD, DCCTHBA1C_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
