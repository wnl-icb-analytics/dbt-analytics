  - name: fct_person_diabetes_acr_ind111
    description: |
      NICE IND111. Urine albumin:creatinine ratio testing in diabetes. One row per
      currently registered, living, non-test person on the diabetes register,
      assessed on the build date.

      Achievement requires a urine albumin:creatinine ratio (ACR) test in the
      preceding 15 months. A numeric result is not required.

      Protein:creatinine ratio tests and albumin measurements without a creatinine
      ratio do not count.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind111
        indicator:
          id: "IND111"
          type: "MEASURE"
          category: "DIABETES_QUALITY"
          clinical_domain: "Cardiometabolic"
          name_short: "Diabetes ACR test"
          description_short: "Urine ACR recorded in the preceding 15 months for people with diabetes"
          description_long: |
            NICE IND111. One row per currently registered, living, non-test person on the
            diabetes register, assessed on the build date.

            Achievement requires a urine albumin:creatinine ratio (ACR) test in the
            preceding 15 months. A numeric result is not required.

            Protein:creatinine ratio tests and albumin measurements without a creatinine
            ratio do not count.

            Measured before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND111"
