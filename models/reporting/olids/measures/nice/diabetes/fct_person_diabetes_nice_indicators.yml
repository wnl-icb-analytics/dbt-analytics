  - name: fct_person_ndh_glycaemic_test_ind172
    description: |
      NICE IND172. Annual glycaemic monitoring in non-diabetic hyperglycaemia. One
      row per currently registered, living, non-test person aged 18 and over on
      the non-diabetic hyperglycaemia register without unresolved diabetes,
      assessed on the build date.

      Achievement requires an HbA1c or fasting plasma glucose test in the
      preceding 12 months.

      People under 18 or with an unknown age are excluded. This NICE population
      does not include gestational diabetes alone.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind172
        indicator:
          id: "IND172"
          type: "MEASURE"
          category: "DIABETES_QUALITY"
          clinical_domain: "Cardiometabolic"
          name_short: "NDH annual HbA1c or FPG"
          description_short: "HbA1c or fasting plasma glucose recorded in the preceding 12 months for people with non-diabetic hyperglycaemia"
          description_long: |
            NICE IND172. One row per currently registered, living, non-test person aged 18
            and over on the non-diabetic hyperglycaemia register without unresolved
            diabetes, assessed on the build date.

            Achievement requires an HbA1c or fasting plasma glucose test in the preceding
            12 months.

            People under 18 or with an unknown age are excluded. This NICE population does
            not include gestational diabetes alone.

            Measured before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND172"
    columns: *record_columns
  - name: fct_person_gestational_diabetes_hba1c_ind173
    description: |
      NICE IND173. Annual HbA1c testing after gestational diabetes. One row per
      currently registered, living, non-test person on the gestational diabetes
      register whose latest episode was more than 12 months ago, assessed on the
      build date.

      Achievement requires an HbA1c test in the preceding 12 months.

      The original NICE NM151 guidance resolves the current page's contradictory
      episode timing. The existing exclusion of any diabetes diagnosis more than
      12 months old remains, even if later resolved. The pilot authority
      previously cited for that separate exclusion has not been independently
      recovered.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind173
        indicator:
          id: "IND173"
          type: "MEASURE"
          category: "DIABETES_QUALITY"
          clinical_domain: "Cardiometabolic"
          name_short: "Gestational diabetes history HbA1c"
          description_short: "HbA1c recorded in the preceding 12 months for women whose latest gestational diabetes episode is more than 12 months old"
          description_long: |
            NICE IND173. One row per currently registered, living, non-test person on the
            gestational diabetes register whose latest episode was more than 12 months
            ago, assessed on the build date.

            Achievement requires an HbA1c test in the preceding 12 months.

            The original NICE NM151 guidance resolves the current page's contradictory
            episode timing. The existing exclusion of any diabetes diagnosis more than 12
            months old remains, even if later resolved. The pilot authority previously
            cited for that separate exclusion has not been independently recovered.

            Measured before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND173"
    columns: *record_columns
