      - name: condition_name
        description: "Short label for the indicator denominator population."
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: current_practice_name
        description: "Name of the current registration practice."
      - name: latest_record_date
        description: "Date of qualifying evidence retained within the indicator measurement or follow-up window; null when none is recorded."
      - name: is_in_denominator
