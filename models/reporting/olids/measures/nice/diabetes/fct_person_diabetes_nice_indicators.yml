      subsequently resolved. Achieved with HbA1c testing in the last 12 months. No
      numeric result is needed. No personalised care adjustments are applied. Based on
      NICE NG3. Code lists: GESTDIAB_COD, DM_COD, IFCCHBAM_COD, DCCTHBA1C_COD (PCD).
