models:
  - name: fct_person_diabetes_hba1c_ind179
    description: >-
      Diabetes HbA1c at or below 58 mmol/mol without moderate or severe frailty (NICE
      IND179). One row per person in the denominator on the build date.


      People registered on the build date on the diabetes register without moderate or
      severe frailty. Achieved when the latest HbA1c test in the last 12 months has a
      valid result at or below 58 mmol/mol. A missing or invalid latest result is
      unassessable; no older result is substituted. Valid results take priority on the
      same day. Excludes fructosamine without HbA1c testing in that period, or maximum
      tolerated diabetes treatment recorded in that period. No personalised care
      adjustments are applied. Based on NICE NG17. Code lists: DM_COD, DMTYPE1_COD,
      DMTYPE2_COD, DMRES_COD, IFCCHBAM_COD, DCCTHBA1C_COD, SERFRUC_COD, DMMAX_COD,
      MODFRAIL_COD, SEVFRAIL_COD (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind179
        indicator:
          id: "IND179"
          type: "MEASURE"
          category: "DIABETES_QUALITY"
          clinical_domain: "Cardiometabolic"
          name_short: "HbA1c 58, no moderate or severe frailty"
          description_short: "Diabetes HbA1c at or below 58 mmol/mol without moderate or severe frailty (NICE IND179)."
          description_long: >-
            People registered on the build date on the diabetes register without
            moderate or severe frailty. Achieved when the latest HbA1c test in the
            last 12 months has a valid result at or below 58 mmol/mol. A missing
            or invalid latest result is unassessable; no older result is
            substituted. Valid results take priority on the same day. Excludes
            fructosamine without HbA1c testing in that period, or maximum
            tolerated diabetes treatment recorded in that period. No personalised
            care adjustments are applied. Based on NICE NG17. Code lists: DM_COD,
            DMTYPE1_COD, DMTYPE2_COD, DMRES_COD, IFCCHBAM_COD, DCCTHBA1C_COD,
            SERFRUC_COD, DMMAX_COD, MODFRAIL_COD, SEVFRAIL_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND179"
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_hba1c_recorded_in_period or is_latest_hba1c_valid or (indicator_status = 'NOT_ASSESSABLE' and not is_in_numerator)"
    columns:
      - name: person_id
        description: "Person identifier for someone in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "Published NICE indicator identifier."
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: reporting_date
        description: "Build date used to assess the population, age and evidence."
      - name: measurement_period_start
        description: "Inclusive start of the indicator measurement period before the reporting date."
      - name: age
        description: "Completed years on the build date, based on the approximate birth date; null when age is unknown."
      - name: condition_name
        description: "Short label for the indicator denominator population."
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: current_practice_name
        description: "Name of the current registration practice."
      - name: latest_frailty_severity
        description: "Latest coded frailty severity by the reporting date; null when none is recorded."
      - name: latest_hba1c_observation_id
        description: "Source observation identifier for the last HbA1c test in the measurement period; null when none is recorded."
      - name: latest_record_date
        description: "Date of the last HbA1c test in the measurement period, including tests with missing or invalid results; null when none is recorded."
      - name: latest_hba1c_value
        description: "Last HbA1c result in the measurement period, in IFCC mmol/mol after conversion where needed; null when absent or unusable."
      - name: is_latest_hba1c_valid
        description: "Whether the last HbA1c in the measurement period has a usable result within the accepted range; false when no test is recorded."
      - name: indicator_threshold
        description: "Inclusive upper HbA1c threshold in mmol/mol."
      - name: threshold_unit
        description: "Unit of the indicator threshold, mmol/mol for HbA1c."
      - name: is_hba1c_recorded_in_period
        description: "Whether an HbA1c test is recorded in the measurement period, including tests with missing or invalid results."
      - name: is_in_denominator
        description: "Always true. Every row belongs to the denominator before personalised care adjustments."
      - name: is_in_numerator
        description: "Whether the person meets the indicator achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
