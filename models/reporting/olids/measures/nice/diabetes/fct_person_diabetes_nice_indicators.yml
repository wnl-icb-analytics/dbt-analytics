        indicator:
          id: "IND137"
          type: "MEASURE"
          category: "DIABETES_QUALITY"
          clinical_domain: "Cardiometabolic"
          name_short: "Diabetes retinal screening"
          description_short: "Retinal screening recorded in the preceding 12 months for people with diabetes"
          description_long: "NICE IND137 before personalised care adjustments."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND137"
    columns: *record_columns
  - name: fct_person_diabetes_foot_examination_ind160
    description: >
      NICE IND160 foot examination. One row per currently registered, living,
      non-test person on the diabetes register, assessed on the build date.
      The numerator requires a foot examination in the preceding 12 months
      covering both feet, or one foot where the other is absent or amputated.
      Declined or unsuitable records do not count. Personalised care
      adjustments are not applied. Secondary-use consumers must join
      DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-Out and Type
      1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind160
        indicator:
          id: "IND160"
          type: "MEASURE"
          category: "DIABETES_QUALITY"
          clinical_domain: "Cardiometabolic"
          name_short: "Diabetes foot examination"
          description_short: "Foot examination of both feet recorded in the preceding 12 months for people with diabetes"
          description_long: "NICE IND160 before personalised care adjustments."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND160"
    columns: *record_columns
  - name: fct_person_ndh_glycaemic_test_ind172
    description: >
      NICE IND172 glycaemic monitoring in non-diabetic hyperglycaemia. One row
      per currently registered, living, non-test person on the NDH register,
      assessed on the build date. The numerator requires an HbA1c or fasting
      plasma glucose test in the preceding 12 months. Personalised care
      adjustments are not applied. Secondary-use consumers must join
      DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-Out and Type
      1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind172
        indicator:
          id: "IND172"
          type: "MEASURE"
          category: "DIABETES_QUALITY"
          clinical_domain: "Cardiometabolic"
          name_short: "NDH annual HbA1c or FPG"
          description_short: "HbA1c or fasting plasma glucose recorded in the preceding 12 months for people with non-diabetic hyperglycaemia"
          description_long: "NICE IND172 before personalised care adjustments."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND172"
    columns: *record_columns
  - name: fct_person_gestational_diabetes_hba1c_ind173
    description: >
      NICE IND173 HbA1c after gestational diabetes. One row per currently
      registered, living, non-test person on the gestational diabetes register
      whose latest diagnosis is within the preceding 12 months, assessed on
      the build date; NICE excludes women diagnosed more than 12 months ago.
      The numerator requires an HbA1c test in the preceding 12 months.
      Personalised care adjustments are not applied. Secondary-use consumers
      must join DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-
      Out and Type 1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind173
        indicator:
          id: "IND173"
          type: "MEASURE"
          category: "DIABETES_QUALITY"
          clinical_domain: "Cardiometabolic"
          name_short: "Gestational diabetes HbA1c"
          description_short: "HbA1c recorded in the preceding 12 months for women with gestational diabetes diagnosed in that period"
          description_long: "NICE IND173 before personalised care adjustments."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND173"
    columns: *record_columns
  - name: fct_person_diabetes_nice_indicators
    description: >
      NICE IND179, IND180, IND249, IND111, IND137, IND160, IND172 and IND173
      status in a common interface. One row per person and indicator on the
      current reporting date. Indicator-specific views remain the source of
      each population definition. Personalised care adjustments are not
      applied. Secondary-use consumers must join
      DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-Out and Type
      1 opt-out filtering. Feeds fct_person_nice_indicator_status.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person in the indicator denominator
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_status
        description: ACHIEVED, ABOVE_TARGET, NOT_ASSESSABLE, NOT_RECORDED_IN_PERIOD
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'ABOVE_TARGET', 'NOT_ASSESSABLE', 'NOT_RECORDED_IN_PERIOD']
      - name: latest_record_date
        description: Date of the latest qualifying record for the indicator; null when none in the period
      - name: latest_hba1c_value
        description: Last recorded HbA1c in mmol/mol for IND179 and IND180; null for other indicators
      - name: hba1c_threshold
        description: Inclusive HbA1c threshold in mmol/mol for IND179 and IND180; null for other indicators
      - name: latest_systolic_value
        description: Latest systolic BP in mmHg for IND249; null for other indicators
      - name: latest_diastolic_value
        description: Latest diastolic BP in mmHg for IND249; null for other indicators
      - name: latest_frailty_severity
        description: Latest coded frailty severity for IND179, IND180 and IND249; null for other indicators
  - name: fct_person_diabetes_nice_indicators_snapshot_input
    description: >
      Thin snapshot-input projection of fct_person_diabetes_nice_indicators:
      person, indicator, current practice, the latest record and outcome.
      Excludes reporting_date and measurement_period_start, which advance on
      every build, so the SCD2 snapshot versions only on genuine changes.
      Feeds fct_person_diabetes_nice_indicators_snapshot.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: indicator_id
        description: NICE indicator identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: current_practice_code
        description: ODS code of the current registration practice at the build.
      - name: is_in_numerator
        description: Whether the person met the indicator at the build.
      - name: indicator_status
        description: Outcome label at the build.
      - name: latest_record_date
        description: Date of the latest qualifying record; null when none in the period.
      - name: latest_hba1c_value
        description: Last recorded HbA1c for the HbA1c indicators.
      - name: latest_systolic_value
        description: Latest systolic BP for IND249.
      - name: latest_diastolic_value
        description: Latest diastolic BP for IND249.
      - name: latest_frailty_severity
        description: Latest coded frailty severity for the frailty-split indicators.
