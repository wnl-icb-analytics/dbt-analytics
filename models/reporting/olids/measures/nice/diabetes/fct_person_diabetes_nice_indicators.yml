  - name: fct_person_diabetes_foot_examination_ind160
    description: >
      NICE IND160 foot examination. One row per currently registered, living,
      non-test person on the diabetes register, assessed on the build date.
      The numerator requires a foot examination in the preceding 12 months
      covering both feet, or one foot where the other is absent or amputated. Declined or unsuitable records do not count. NICE names testing of foot sensation with a 10 g monofilament; the PCD foot examination cluster used here (FOOTEXAM_COD, as in QOF) also holds pedal pulse, neuropathy and general foot screen codes, so any examination code counts. Personalised care
      adjustments are not applied. Secondary-use consumers must join
      DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-Out and Type
      1 opt-out filtering.
    config:
      meta:
        owner:
