      blood pressure, HbA1c, cholesterol, smoking status, foot examination, urine
      ACR and eGFR. The completed-process count shows how many are recorded.

      eGFR is required following NICE's February 2026 correction. Serum creatinine
      alone does not count. ACR and eGFR tests count without numeric results. A
      completed foot examination counts despite same-date or later declined,
      unsuitable or referral records.

