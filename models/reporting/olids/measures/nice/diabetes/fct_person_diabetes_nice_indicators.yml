      eight processes in the 12 months before the build date: HbA1c, blood pressure,
      total cholesterol, eGFR, urine ACR, foot examination, BMI and smoking status.
      HbA1c, eGFR and ACR tests need no numeric result; total cholesterol and BMI need
      valid results. A performed foot examination counts despite a later decline; one
      foot suffices if the other is absent or amputated. No personalised care
      adjustments are applied. Based on NICE NG28. Code lists: IFCCHBAM_COD,
      DCCTHBA1C_COD, BP_COD, SYSBP_COD, DIASBP_COD, HOMEAMBBP_COD, HOMEBP_COD, ABPM_COD,
      CHOL2_COD, EGFR_COD, NDAALB_COD, FOOTEXAM_COD, AMPL_COD, AMPR_COD, CONABL_COD,
      CONABR_COD, BMIVAL_COD, HEIGHT, WEIGHT, SMOK_COD, EXSMOK_COD, LSMOK_COD, NSMOK_COD
      (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind120
        indicator:
          id: "IND120"
          type: "MEASURE"
          category: "DIABETES_QUALITY"
          clinical_domain: "Cardiometabolic"
          name_short: "Diabetes eight care processes"
          description_short: "Eight care processes in diabetes (NICE IND120)."
          description_long: >-
            People registered on the build date on the diabetes register. Achieved
            with all eight processes in the 12 months before the build date:
            HbA1c, blood pressure, total cholesterol, eGFR, urine ACR, foot
            examination, BMI and smoking status. HbA1c, eGFR and ACR tests need no
            numeric result; total cholesterol and BMI need valid results. A
            performed foot examination counts despite a later decline; one foot
            suffices if the other is absent or amputated. No personalised care
            adjustments are applied. Based on NICE NG28. Code lists: IFCCHBAM_COD,
            DCCTHBA1C_COD, BP_COD, SYSBP_COD, DIASBP_COD, HOMEAMBBP_COD,
            HOMEBP_COD, ABPM_COD, CHOL2_COD, EGFR_COD, NDAALB_COD, FOOTEXAM_COD,
            AMPL_COD, AMPR_COD, CONABL_COD, CONABR_COD, BMIVAL_COD, HEIGHT,
            WEIGHT, SMOK_COD, EXSMOK_COD, LSMOK_COD, NSMOK_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND120"
    columns:
      - name: person_id
        description: "Person identifier for someone in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "Published NICE indicator identifier."
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: reporting_date
        description: "Build date used to assess the population, age and evidence."
      - name: measurement_period_start
        description: "Inclusive start of the indicator measurement period before the reporting date."
      - name: age
        description: "Completed years on the build date, based on the approximate birth date; null when age is unknown."
      - name: condition_name
        description: "Short label for the indicator denominator population."
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: current_practice_name
        description: "Name of the current registration practice."
      - name: care_processes_completed_count
        description: "Number of the eight diabetes care processes recorded in the last 12 months, from 0 to 8."
      - name: latest_record_date
        description: "Latest date among the recorded care processes when all eight are completed; null when the indicator is not achieved."
      - name: is_in_denominator
        description: "Always true. Every row belongs to the denominator before personalised care adjustments."
      - name: is_in_numerator
        description: "Whether the person meets the indicator achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']


  - name: fct_person_diabetes_nice_indicators
    description: >-
      Diabetes, non-diabetic hyperglycaemia and gestational diabetes NICE indicator
      results (IND81, IND88, IND89, IND111, IND120, IND134, IND135, IND136, IND137,
      IND160, IND165, IND171, IND172, IND173, IND179, IND180, IND249). One row per
      person, indicator and build date.


      Each indicator uses its own denominator, evidence window and exclusions, described
      in the member measures. Clinical fields are null where they do not apply to an
      indicator. No personalised care adjustments are applied.
    config:
      meta:
        owner:
          name: EddieDavison92
