      urine albumin:creatinine ratio (ACR) test in the 15 months before the build date.
      No numeric result is needed. Protein:creatinine ratio tests and albumin
      measurements without a creatinine ratio do not count. No personalised care
      adjustments are applied. Based on NICE NG17. Code lists: NDAALB_COD (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind111
