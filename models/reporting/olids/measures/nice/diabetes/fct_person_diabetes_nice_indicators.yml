    description: >
      NICE IND172 glycaemic monitoring in non-diabetic hyperglycaemia. One row per currently registered, living, non-test person aged 18 and over on the NDH register without an unresolved diabetes diagnosis, the two exclusions NICE lists, assessed on the build date. The numerator requires an HbA1c or fasting
      plasma glucose test in the preceding 12 months. Personalised care
      adjustments are not applied. Secondary-use consumers must join
