          id: "IND111"
          type: "MEASURE"
          category: "DIABETES_QUALITY"
          clinical_domain: "Cardiometabolic"
          name_short: "Diabetes ACR testing"
          description_short: "Urine albumin:creatinine ratio testing in diabetes (NICE IND111)."
          description_long: >-
            People registered on the build date on the diabetes register. Achieved
            with a urine albumin:creatinine ratio (ACR) test in the 15 months
            before the build date. No numeric result is needed. Protein:creatinine
            ratio tests and albumin measurements without a creatinine ratio do not
            count. No personalised care adjustments are applied. Based on NICE
            NG17. Code lists: NDAALB_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND111"
