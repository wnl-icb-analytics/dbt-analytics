  - name: fct_person_diabetes_nice_indicators
    description: |
      Current NICE diabetes indicator outcomes. One row per eligible person and
      indicator on the reporting date.

      Each indicator retains its own denominator, achievement rules and
      measurement period. The table includes clinical detail for the family;
      fields that do not apply to an indicator are null.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person in the indicator denominator
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_status
        description: ACHIEVED, ABOVE_TARGET, NOT_ASSESSABLE, NOT_RECORDED_IN_PERIOD; IND134 also uses NOT_TREATED_IN_PERIOD and NEVER_TREATED
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'ABOVE_TARGET', 'NOT_ASSESSABLE', 'NOT_RECORDED_IN_PERIOD', 'NOT_TREATED_IN_PERIOD', 'NEVER_TREATED']
      - name: latest_record_date
        description: Date of the latest qualifying record for the indicator; null when none in the period
      - name: latest_hba1c_value
        description: Last recorded HbA1c in mmol/mol for the HbA1c indicators; null for other indicators
      - name: hba1c_threshold
        description: Inclusive HbA1c threshold in mmol/mol for the HbA1c indicators; null for other indicators
      - name: latest_systolic_value
        description: Latest systolic BP in mmHg for IND249; null for other indicators
      - name: latest_diastolic_value
        description: Latest diastolic BP in mmHg for IND249; null for other indicators
      - name: latest_frailty_severity
        description: Latest coded frailty severity for the HbA1c and IND249 indicators; null for other indicators
