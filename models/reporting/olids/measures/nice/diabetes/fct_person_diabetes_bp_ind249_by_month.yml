models:
- columns:
  - description: Person in the indicator denominator
    name: person_id
  - description: NICE indicator identifier
    name: indicator_id
  - description: Published NICE indicator name
    name: indicator_name
  - description: Completed month-end at which eligibility and evidence are assessed.
    name: reporting_date
  - description: Inclusive start of the measurement period before the reporting date
    name: measurement_period_start
  - description: Completed years at month-end from the approximate birth month.
    name: age
  - description: Population defining the indicator
    name: condition_name
  - description: ODS practice code at month-end under the monthly spine attribution.
    name: practice_code
  - description: Practice name at month-end under the monthly spine attribution.
    name: practice_name
  - description: Latest coded frailty severity from the frailty register; null when none recorded
    name: latest_frailty_severity
  - description: Date of the latest complete blood pressure pair, regardless of period; null when none
      is recorded
    name: latest_bp_date
  - description: Date of the latest reading when it falls in the period; null otherwise
    name: latest_record_date
  - description: Whether the selected complete pair is plausible; null when no complete pair exists
    name: is_valid_bp
  - description: Latest systolic blood pressure in mmHg
    name: latest_systolic_value
  - description: Latest diastolic blood pressure in mmHg
    name: latest_diastolic_value
  - description: Whether the latest reading was recorded using home monitoring
    name: is_home_bp_event
  - description: Whether the latest reading was recorded using ambulatory monitoring
    name: is_abpm_bp_event
  - description: Clinic or HBPM/ABPM context of the latest reading
    name: applied_measurement_context
  - description: Exclusive systolic threshold in mmHg specified by this indicator
    name: indicator_systolic_threshold
  - description: Exclusive diastolic threshold in mmHg specified by this indicator
    name: indicator_diastolic_threshold
  - description: Whether the latest BP was recorded between measurement_period_start and the reporting
      date
    name: is_bp_recorded_in_last_12m
  - description: Whether the latest complete pair is valid and below both indicator thresholds, regardless
      of recording date
    name: is_latest_bp_within_indicator_target
  - description: Always true; every row is an eligible person before personalised care adjustments
    name: is_in_denominator
  - description: Whether the person meets the indicator on the reporting date
    name: is_in_numerator
  - description: ACHIEVED, ABOVE_TARGET, NOT_ASSESSABLE or NOT_RECORDED_IN_PERIOD
    name: indicator_status
  config:
    meta:
      clinical_source: https://www.nice.org.uk/indicators/ind249
      owner:
        name: EddieDavison92
  description: "NICE IND249. Blood pressure control in diabetes without moderate or severe\nfrailty. One\
    \ row per registered at the month-end, living, non-test person aged 17\nto 79 on the diabetes register\
    \ without moderate or severe frailty, assessed\non the completed month-end.\n\nAchievement requires\
    \ the latest complete blood pressure pair in the preceding 12 months to\nbe below 140/90 mmHg in clinic\
    \ or 135/85 mmHg at home or by ambulatory\nmonitoring. Both components must be strictly below their\
    \ thresholds.\n\nThe latest date with a complete systolic/diastolic pair is used. Incomplete\nsingle\
    \ components are ignored. On that date, valid pairs take precedence, with\nlowest systolic then lowest\
    \ diastolic selected because within-day order is\nunavailable. If no pair on that date is plausible\
    \ (systolic 40-350 mmHg and\ndiastolic 20-200 mmHg, inclusive), the result is NOT_ASSESSABLE, without\
    \ falling\nback to an older pair. Unparented components use date-level maxima of plausible\nvalues,\
    \ which may combine different readings. Each component uses its\nunfiltered maximum only when no plausible\
    \ value exists on that date.\n\nPeople outside the age range or with an unknown age are excluded.\n\
    \nPersonalised care adjustments are not applied.\n Recalculated for the last 60 completed month-ends\
    \ using today's rules and code lists. Registration and practice use the existing monthly spine, with\
    \ registration start inclusive and registration end and death exclusive. Overlapping registrations\
    \ retain the spine's current-registration priority. Birth and death dates are approximate; missing\
    \ birth dates prevent historical active rows. Current gender and test flags apply retrospectively.\
    \ Diagnosis state uses clinical and recorded dates; test and BP evidence use their clinical dates\
    \ through month-end. Later corrections can alter earlier results. Personalised care adjustments are\
    \ not applied."
  name: fct_person_diabetes_bp_ind249_by_month
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
