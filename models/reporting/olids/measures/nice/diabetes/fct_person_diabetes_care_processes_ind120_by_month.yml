models:
- name: fct_person_diabetes_care_processes_ind120_by_month
  description: >-
    Eight care processes in diabetes (NICE IND120). One row per person in the denominator
    at the month-end.


    People registered at the month-end on the diabetes register. Achieved with all eight
    processes in the 12 months before the month-end: HbA1c, blood pressure, total
    cholesterol, eGFR, urine ACR, foot examination, BMI and smoking status. HbA1c, eGFR
    and ACR tests need no numeric result; total cholesterol and BMI need valid results. A
    performed foot examination counts despite a later decline; one foot suffices if the
    other is absent or amputated. No personalised care adjustments are applied. Based on
    NICE NG28. Recalculated for each of the last 60 month-ends with current rules, code
    lists and records, so later corrections can change past months. Code lists:
    IFCCHBAM_COD, DCCTHBA1C_COD, BP_COD, SYSBP_COD, DIASBP_COD, HOMEAMBBP_COD, HOMEBP_COD,
    ABPM_COD, CHOL2_COD, EGFR_COD, NDAALB_COD, FOOTEXAM_COD, AMPL_COD, AMPR_COD,
    CONABL_COD, CONABR_COD, BMIVAL_COD, HEIGHT, WEIGHT, SMOK_COD, EXSMOK_COD, LSMOK_COD,
    NSMOK_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind120
  columns:
  - name: person_id
    description: "Person identifier for someone in the indicator denominator."
  - name: indicator_id
    description: "Published NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: reporting_date
    description: "Month-end used to assess the population, age and evidence."
  - name: measurement_period_start
    description: "Inclusive start of the indicator measurement period before the reporting date."
  - name: age
    description: "Completed years on the month-end, based on the approximate birth date; null when age is unknown."
  - name: condition_name
    description: "Short label for the indicator denominator population."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
  - name: care_processes_completed_count
    description: "Number of the eight diabetes care processes recorded in the last 12 months, from 0 to 8."
  - name: latest_record_date
    description: "Latest date among the recorded care processes when all eight are completed; null when the indicator is not achieved."
  - name: is_in_denominator
    description: "Always true. Every row belongs to the denominator before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the indicator achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
