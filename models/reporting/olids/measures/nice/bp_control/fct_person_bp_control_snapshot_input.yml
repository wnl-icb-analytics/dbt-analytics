models:
  - name: fct_person_bp_control_snapshot_input
    description: >-
      Blood pressure control results used to track changes. One row per person with a blood
      pressure reading and an applicable target.


      Records the latest valid general BP reading and a control flag based on the latest
      control-eligible evidence, which may be from a different date. Applied target values are not included. Age
      and time-since-reading fields are omitted so elapsed time alone does not create a new
      history version. Based on NICE NG136.
    config:
      meta:
        owner:
          name: Thomas Shallcross
    columns:
      - name: person_id
        description: "Identifier of the person with a blood pressure recording and an applicable target."
        data_tests:
          - unique
          - not_null
      - name: is_overall_bp_controlled
        description: "Whether both components of the latest control-eligible evidence are strictly below their context-specific patient targets. The evidence may be from a different date than latest_bp_date. NULL when control evidence is absent or invalid."
      - name: latest_systolic_value
        description: "Systolic value of the latest valid general BP reading in mmHg."
      - name: latest_diastolic_value
        description: "Diastolic value of the latest valid general BP reading in mmHg."
      - name: latest_bp_date
        description: "Clinical date of the latest valid general BP reading, also used for monitoring and recording completion."
