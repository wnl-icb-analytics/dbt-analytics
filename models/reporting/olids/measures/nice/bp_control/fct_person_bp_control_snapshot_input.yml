models:
  - name: fct_person_bp_control_snapshot_input
    description: >-
      Blood pressure control results used to track changes. One row per person with a blood
      pressure reading and an applicable target.


      Records the blood pressure, applied targets and control result from the build date. Age
      and time-since-reading fields are omitted so elapsed time alone does not create a new
      history version. Based on NICE NG136.
    config:
      meta:
        owner:
          name: Thomas Shallcross
    columns:
      - name: person_id
        description: "Identifier of the person with a blood pressure recording and an applicable target."
        data_tests:
          - unique
          - not_null
      - name: is_overall_bp_controlled
        description: "Whether both latest blood pressure values are strictly below their applied targets."
      - name: latest_systolic_value
        description: "Systolic blood pressure of the selected complete pair, in mmHg; null when no pair is recorded."
      - name: latest_diastolic_value
        description: "Diastolic blood pressure of the selected complete pair, in mmHg; null when no pair is recorded."
      - name: latest_bp_date
        description: "Date of the latest complete blood pressure pair through the reporting date; may precede the measurement window. Null when absent."
