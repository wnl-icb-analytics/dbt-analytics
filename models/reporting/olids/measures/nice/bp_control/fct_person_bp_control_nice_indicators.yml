models:
  - name: fct_person_bp_control_hypertension_ind239
    description: |
      NICE IND239 blood pressure control in hypertension. One row per currently
      registered, living, non-test person aged 79 or under on the hypertension register,
      assessed on the build date.

      Achievement requires the latest valid paired blood pressure reading in the preceding
      12 months to be strictly below 140/90 mmHg in clinic or 135/85 mmHg at home or on
      ambulatory monitoring. Both systolic and diastolic values must meet the target.

      The shared blood pressure input selects the lowest valid paired reading on each day.
      A newer incomplete or implausible reading does not replace an older valid pair. This
      input differs from a literal last-recorded-reading definition.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind239-hypertension-blood-pressure-79-years-and-under
        indicator:
          id: "IND239"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "Hypertension BP control, 79 and under"
          description_short: "Hypertension BP target achieved in the preceding 12 months for people aged 79 or under"
          description_long: |
            NICE IND239 blood pressure control in hypertension. One row per currently
            registered, living, non-test person aged 79 or under on the hypertension
            register, assessed on the build date.

            Achievement requires the latest valid paired blood pressure reading in the
            preceding 12 months to be strictly below 140/90 mmHg in clinic or 135/85 mmHg
            at home or on ambulatory monitoring. Both systolic and diastolic values must
            meet the target.

            The shared blood pressure input selects the lowest valid paired reading on
            each day. A newer incomplete or implausible reading does not replace an older
            valid pair. This input differs from a literal last-recorded-reading
            definition.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND239"
    columns: &indicator_columns
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Date on which age and the 12-month measurement period are assessed
      - name: measurement_period_start
        description: Inclusive start of the measurement period, 12 calendar months before the reporting date
      - name: age
        description: Age in years on the reporting date
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: condition_name
        description: Disease register defining the indicator population
      - name: latest_bp_date
        description: Date of the latest valid paired blood pressure reading; null when none is recorded
      - name: latest_systolic_value
        description: Latest systolic blood pressure in mmHg
      - name: latest_diastolic_value
        description: Latest diastolic blood pressure in mmHg
      - name: is_home_bp_event
        description: Whether the latest reading was recorded using home monitoring
      - name: is_abpm_bp_event
        description: Whether the latest reading was recorded using ambulatory monitoring
      - name: applied_measurement_context
        description: Clinic or HBPM/ABPM context of the latest reading
      - name: indicator_systolic_threshold
        description: Exclusive systolic threshold in mmHg specified by this indicator
      - name: indicator_diastolic_threshold
        description: Exclusive diastolic threshold in mmHg specified by this indicator
      - name: is_in_denominator
        description: Always true; every row represents a person in the unadjusted denominator
      - name: is_bp_recorded_in_last_12m
        description: Whether the latest BP was recorded between measurement_period_start and the reporting date
      - name: is_latest_bp_within_indicator_target
        description: Whether the latest BP is below both indicator thresholds, regardless of recording date
      - name: is_in_numerator
        description: Whether a BP in the preceding 12 months is below both indicator thresholds
      - name: indicator_status
        description: ACHIEVED, NOT_RECORDED_IN_PERIOD or ABOVE_TARGET

