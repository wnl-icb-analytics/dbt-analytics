models:
  - name: fct_person_bp_control_hypertension_ind239
    description: >-
      Blood pressure control in hypertension for people aged 79 or under (NICE IND239). One row per
      person in the denominator on the build date. People registered on the build date aged 79 or
      under on the hypertension register. Achieved when both values of the latest blood pressure
      context minima in the last 12 months are below 140/90 mmHg in clinic or 135/85 mmHg at home or
      on ambulatory monitoring. Incomplete readings are ignored; an invalid-only latest date is
      unassessable, with no older pair substituted. Validity and same-day selection rules are
      described under latest_systolic_value and latest_diastolic_value. No personalised care
      adjustments are applied. Based on NICE NG136. Code lists: BP_COD, SYSBP_COD, DIASBP_COD,
      HOMEBP_COD, ABPM_COD, HOMEAMBBP_COD; HYP_COD, HYPRES_COD (PCD). At the latest eligible date,
      any clinic, home or ambulatory context can meet its own strict NICE target. {{ doc('bp_control_evidence_rule') }}
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind239-hypertension-blood-pressure-79-years-and-under
        indicator:
          id: "IND239"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "Hypertension BP, 79 or under"
          description_short: "Blood pressure below the NICE target in hypertension, aged 79 or under"
          description_long: >-
            People registered on the build date aged 79 or under on the
            hypertension register. Achieved when both values of the latest
            blood pressure context minima in the last 12 months are below 140/90
            mmHg in clinic or 135/85 mmHg at home or on ambulatory monitoring.
            Incomplete readings are ignored; an invalid latest pair is
            unassessable, with no older pair substituted. Validity and same-day
            selection rules are described under latest_systolic_value and
            latest_diastolic_value. No personalised care adjustments are applied.
            Based on NICE NG136. Code lists: BP_COD, SYSBP_COD, DIASBP_COD,
            HOMEBP_COD, ABPM_COD, HOMEAMBBP_COD; HYP_COD, HYPRES_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND239"
    columns: &indicator_columns
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "NICE indicator identifier."
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: reporting_date
        description: "Build date used to assess eligibility and achievement."
      - name: measurement_period_start
        description: "Inclusive start of the indicator measurement period before the reporting date."
      - name: age
        description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: current_practice_name
        description: "Name of the current registration practice."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: latest_bp_date
        description: "Latest clinical date with eligible complete numeric control evidence. May precede the measurement window; null when absent."
      - name: is_valid_bp
        description: "Selected daily values have systolic 40 to 350 mmHg and diastolic 20 to 200 mmHg, inclusive, with systolic above diastolic. Null when no complete evidence exists."
      - name: latest_systolic_value
        description: "Independent minimum valid systolic in mmHg within the selected date and context. May come from a different reading to diastolic. Invalid-only dates retain the latest complete reading. Null when absent."
      - name: latest_diastolic_value
        description: "Independent minimum valid diastolic in mmHg within the selected date and context. May come from a different reading to systolic. Invalid-only dates retain the latest complete reading. Null when absent."
      - name: is_home_bp_event
        description: "Whether the selected daily minima use home evidence, with an average preferred on that date."
      - name: is_abpm_bp_event
        description: "Whether the selected daily minima use ABPM, preferring daytime, then unspecified, then 24-hour averages."
      - name: applied_measurement_context
        description: "CLINIC or HBPM_ABPM for the selected context. On the latest eligible date a context meeting this indicator target takes priority. Otherwise prefer valid clinic, home, then ambulatory evidence."
      - name: indicator_systolic_threshold
        description: "Systolic target in mmHg for this indicator and reading type. Achievement requires a value strictly below it; null when no eligible complete evidence exists."
      - name: indicator_diastolic_threshold
        description: "Diastolic target in mmHg for this indicator and reading type. Achievement requires a value strictly below it; null when no eligible complete evidence exists."
      - name: is_in_denominator
        description: "Always true; each row is eligible before personalised care adjustments."
      - name: is_bp_recorded_in_last_12m
        description: "Whether the latest eligible control date is in the preceding 12 months, including both boundary dates."
      - name: is_latest_bp_within_indicator_target
        description: "Whether the selected daily context minima are valid and strictly below both indicator targets, regardless of their date."
      - name: is_in_numerator
        description: "Whether the person meets the achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD', 'NOT_ASSESSABLE', 'ABOVE_TARGET']

