models:
- name: fct_person_bp_control_stroke_tia_ind243_by_month
  description: >-
    Blood pressure control in stroke or transient ischaemic attack for people aged 79 or under
    (NICE IND243). One row per person in the denominator at each month-end.


    People registered at the month-end aged 79 or under on the stroke or transient ischaemic
    attack register. Achieved when both values of the latest complete blood pressure pair in
    the last 12 months are below 140/90 mmHg in clinic or 135/85 mmHg at home or on ambulatory
    monitoring. Incomplete readings are ignored; an invalid latest pair is unassessable, with
    no older pair substituted. Validity and same-day selection rules are described under
    latest_systolic_value and latest_diastolic_value. No personalised care adjustments are
    applied. Based on NICE NG136. Recalculated for each of the last 60 month-ends with current
    rules, code lists and records, so later corrections can change past months. Code lists:
    BP_COD, SYSBP_COD, DIASBP_COD, HOMEBP_COD, ABPM_COD, HOMEAMBBP_COD; STRK_COD, TIA_COD
    (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind243-stroke-and-ischaemic-attack-blood-pressure-79-years-and-under
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Inclusive start of the indicator measurement period before the reporting date."
  - name: age
    description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
  - name: practice_code
    description: "ODS code of the registration practice attributed at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice attributed at the reporting month-end."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: latest_bp_date
    description: "Date of the latest complete blood pressure pair through the reporting date; may precede the measurement window. Null when absent."
  - name: is_valid_bp
    description: "Whether the selected complete pair has systolic 40 to 350 mmHg and diastolic 20 to 200 mmHg, inclusive; null when no pair exists."
  - name: latest_systolic_value
    description: "Systolic blood pressure of the selected complete pair, in mmHg; valid range 40 to 350, inclusive. On the latest date, valid pairs take priority, then the lowest systolic and diastolic values. Components without a shared reading identifier use the highest plausible value for each component on that date, or the highest recorded value if none is plausible, and may combine different readings. Null when no pair is recorded."
  - name: latest_diastolic_value
    description: "Diastolic blood pressure of the selected complete pair, in mmHg; valid range 20 to 200, inclusive. On the latest date, valid pairs take priority, then the lowest systolic and diastolic values. Components without a shared reading identifier use the highest plausible value for each component on that date, or the highest recorded value if none is plausible, and may combine different readings. Null when no pair is recorded."
  - name: is_home_bp_event
    description: "Whether the selected blood pressure pair has home monitoring evidence."
  - name: is_abpm_bp_event
    description: "Whether the selected blood pressure pair has ambulatory monitoring evidence."
  - name: applied_measurement_context
    description: "CLINIC for clinic readings or HBPM_ABPM for home or ambulatory readings; determines which target applies."
  - name: indicator_systolic_threshold
    description: "Systolic target in mmHg for this indicator and reading type. Achievement requires a value strictly below it; null when no pair exists."
  - name: indicator_diastolic_threshold
    description: "Diastolic target in mmHg for this indicator and reading type. Achievement requires a value strictly below it; null when no pair exists."
  - name: is_in_denominator
    description: "Always true; each row is eligible before personalised care adjustments."
  - name: is_bp_recorded_in_last_12m
    description: "Whether the selected complete pair was recorded in the 12 months before the reporting date, including both boundary dates."
  - name: is_latest_bp_within_indicator_target
    description: "Whether the selected complete pair is valid and strictly below both indicator targets, regardless of its date."
  - name: is_in_numerator
    description: "Whether the person meets the achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
