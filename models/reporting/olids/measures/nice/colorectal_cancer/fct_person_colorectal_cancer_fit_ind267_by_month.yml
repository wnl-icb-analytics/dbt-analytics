models:
- name: fct_person_colorectal_cancer_fit_ind267_by_month
  description: >-
    Faecal immunochemical testing before colorectal referral (NICE IND267). One row per
    person in the denominator at each month-end.


    People registered at the month-end with an urgent suspected colorectal cancer referral
    in the 12 months before the month-end. Only the latest referral is assessed, so this
    counts people rather than every referral in NICE's specification. Achieved with a
    faecal immunochemical test from 21 days before referral to referral day.
    Bowel-screening result codes are excluded; generic test codes cannot distinguish
    screening from diagnostic use. No personalised care adjustments are applied. Based on
    NICE DG56. Recalculated for each of the last 60 month-ends with current rules, code
    lists and records, so later corrections can change past months. Code lists:
    GICANREF_COD, FAECIMM_COD, COLCANSCREV_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind267
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "12 months before the reporting date. Referrals on this boundary are excluded."
  - name: latest_record_date
    description: "Latest faecal immunochemical test from 21 days before referral to referral day, inclusive; null if absent."
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "True when the person meets the achievement rules in the model description."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  - name: referral_date
    description: "Date of the latest urgent suspected colorectal cancer referral in the eligible period."
  - name: referral_id
    description: >-
      Observation identifier for the latest eligible referral. The highest identifier is retained
      when several referrals share that date.
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: practice_code
    description: "ODS code of the registration practice at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice at the reporting month-end."
