models:
- name: fct_person_colorectal_cancer_fit_ind267
  description: >-
    Faecal immunochemical testing before colorectal referral (NICE IND267). One row per
    person in the denominator on the build date.


    People registered on the build date with an urgent suspected colorectal cancer
    referral in the 12 months before the build date. Only the latest referral is assessed,
    so this counts people rather than every referral in NICE's specification. Achieved
    with a faecal immunochemical test from 21 days before referral to referral day.
    Bowel-screening result codes are excluded; generic test codes cannot distinguish
    screening from diagnostic use. No personalised care adjustments are applied. Based on
    NICE DG56. Code lists: GICANREF_COD, FAECIMM_COD, COLCANSCREV_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind267
      indicator:
        id: IND267
        type: MEASURE
        category: COLORECTAL_CANCER
        clinical_domain: COLORECTAL_CANCER
        name_short: "FIT before colorectal cancer referral"
        description_short: "Faecal immunochemical testing before colorectal referral."
        description_long: >-
          People registered on the build date with an urgent suspected colorectal
          cancer referral in the 12 months before the build date. Only the latest
          referral is assessed, so this counts people rather than every referral in
          NICE's specification. Achieved with a faecal immunochemical test from 21
          days before referral to referral day. Bowel-screening result codes are
          excluded; generic test codes cannot distinguish screening from diagnostic
          use. No personalised care adjustments are applied. Based on NICE DG56.
          Code lists: GICANREF_COD, FAECIMM_COD, COLCANSCREV_COD (PCD).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND267
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: reporting_date
    description: "Build date used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "12 months before the reporting date. Referrals on this boundary are excluded."
  - name: latest_record_date
    description: "Latest faecal immunochemical test from 21 days before referral to referral day, inclusive; null if absent."
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "True when the person meets the achievement rules in the model description."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  - name: referral_date
    description: "Date of the latest urgent suspected colorectal cancer referral in the eligible period."
  - name: referral_id
    description: >-
      Observation identifier for the latest eligible referral. The highest identifier is retained
      when several referrals share that date.
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: current_practice_code
    description: "ODS code of the registration practice at the reporting date."
  - name: current_practice_name
    description: "Name of the registration practice at the reporting date."
