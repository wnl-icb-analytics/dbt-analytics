models:
- name: fct_person_colorectal_cancer_fit_ind267
  description: NICE IND267 person-level adaptation. One row per active, living, non-test person with a
    GICANREF_COD urgent suspected colorectal cancer referral in (reporting date minus twelve months, reporting
    date]. Only the latest referral counts, with the highest observation id breaking same-day ties. Achievement
    requires a FAECIMM_COD FIT record between 21 days before that referral and the referral day, both
    inclusive. PCD COLCANSCREV_COD bowel-screening result codes are excluded from FIT evidence. Generic
    FIT codes cannot distinguish screening context. This counts people rather than every referral in the
    NICE specification. No personalised care adjustments apply.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind267
      indicator:
        id: IND267
        type: MEASURE
        category: COLORECTAL_CANCER
        clinical_domain: COLORECTAL_CANCER
        name_short: FIT before referral
        description_short: NICE IND267 person-level adaptation. One row per active, living, non-test person
          with a GICANREF_COD urgent suspected colorectal cancer referral in (reporting date minus twelve
          months, reporting date]. Only the latest referral counts, with the highest observation id breaking
          same-day ties. Achievement requires a FAECIMM_COD FIT record between 21 days before that referral
          and the referral day, both inclusive. PCD COLCANSCREV_COD bowel-screening result codes are excluded
          from FIT evidence. Generic FIT codes cannot distinguish screening context. This counts people
          rather than every referral in the NICE specification. No personalised care adjustments apply.
        description_long: NICE IND267 person-level adaptation. One row per active, living, non-test person
          with a GICANREF_COD urgent suspected colorectal cancer referral in (reporting date minus twelve
          months, reporting date]. Only the latest referral counts, with the highest observation id breaking
          same-day ties. Achievement requires a FAECIMM_COD FIT record between 21 days before that referral
          and the referral day, both inclusive. PCD COLCANSCREV_COD bowel-screening result codes are excluded
          from FIT evidence. Generic FIT codes cannot distinguish screening context. This counts people
          rather than every referral in the NICE specification. No personalised care adjustments apply.
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND267
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: reporting_date
    description: Date used for eligibility and evidence.
  - name: measurement_period_start
    description: Start of the stated cohort or evidence period; see the model description for boundary
      inclusion.
  - name: latest_record_date
    description: Latest qualifying evidence date; null when no qualifying evidence exists.
  - name: is_in_denominator
    description: Always true for every row.
  - name: is_in_numerator
    description: Whether the complete indicator rule is met.
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD.
  - name: referral_date
    description: Latest eligible referral clinical date.
  - name: referral_id
    description: Highest observation id on the latest referral day.
  - name: person_id
    description: Person in the indicator denominator.
  - name: indicator_id
    description: NICE indicator identifier.
  - name: indicator_name
    description: Published NICE indicator name.
  - name: age
    description: Completed years at reporting date, based on the approximate birth date.
  - name: current_practice_code
    description: Registration practice ODS code at reporting date.
  - name: current_practice_name
    description: Registration practice name at reporting date.
