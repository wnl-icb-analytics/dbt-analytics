models:
- name: fct_person_smoking_ind156_by_month
  description: >-
    Smoking status in the listed long-term conditions (NICE IND156). One row per person in
    the denominator at each month-end.


    People registered at the month-end on coronary heart disease, peripheral arterial
    disease, stroke, transient ischaemic attack, hypertension, diabetes, COPD, chronic
    kidney disease or asthma registers. The asthma arm uses the treatment-dependent QOF
    register. Achieved with smoking status in the 12 months before the month-end, or latest
    never-smoked status recorded after both the 25th birthday and earliest qualifying
    diagnosis if age reaches 26 by financial year-end. Birthdays use approximate birth
    dates. The ex-smoker allowance counts latest ex-smoker status recorded in three
    consecutive financial years with no smoker record since the first qualifying record.
    Smoking records require recorded age of at least 11. No personalised care adjustments
    are applied. Recalculated for each of the last 60 month-ends with current rules, code
    lists and records, so later corrections can change past months. Based on NICE NG209.
    Code lists: CHD_COD, PAD_COD, STRK_COD, TIA_COD, HYP_COD, HYPRES_COD, DM_COD,
    DMTYPE1_COD, DMTYPE2_COD, DMRES_COD, COPDDIAG_COD, COPDPROC_COD, COPDRES_COD, CKD_COD,
    CKD1AND2_COD, CKDRES_COD, AST_COD, ASTRES_COD, LSMOK_COD, EXSMOK_COD, NSMOK_COD,
    SMOK_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind156
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "NICE published indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Inclusive start of the 12-month achievement window, or 24 months for IND99."
  - name: age
    description: "Age in completed years on the reporting date; null when the birth date is missing."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
  - name: latest_smoking_status
    description: "Latest smoking status on or before the reporting date, with no expiry; null when none. Same-day priority is current smoker, ex-smoker, never smoked, then non-smoker with unknown history."
  - name: latest_smoking_status_date
    description: "Date of the latest smoking status on or before the reporting date; null when none."
  - name: latest_never_smoked_date
    description: "Latest explicit never-smoked record on or before the reporting date; null when none."
  - name: latest_smoking_intervention_date
    description: "Latest stop-smoking referral, drug treatment record or prescription on or before the reporting date, including evidence outside the achievement window; null when none."
  - name: is_status_recorded_in_period
    description: "Whether smoking status was recorded in the inclusive 12-month achievement window; null for indicators without this rule."
  - name: is_never_smoker_covered
    description: "Whether the latest status is Never Smoked and a never-smoked record follows both the 25th birthday and earliest listed diagnosis, with age 26 reached by 31 March of the reporting financial year; null for indicators without this rule."
  - name: latest_record_date
    description: "Latest qualifying smoking status or support date in the achievement window; can be null when achieved through the never-smoked exception or the three-year ex-smoker allowance."
  - name: is_in_denominator
    description: "Always true; each row meets the documented eligibility and exclusion rules."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
