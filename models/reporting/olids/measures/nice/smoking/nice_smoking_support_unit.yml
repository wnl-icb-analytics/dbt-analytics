- name: nice_smoking_candidates_asof_and_ties
  model: int_nice_smoking_evidence_by_month
  overrides:
    macros:
      nice_ltc_summary: SELECT NULL::NUMBER AS person_id, NULL::DATE AS reporting_date WHERE FALSE
  given:
  - input: ref('int_nice_reference_population_by_month')
    format: sql
    rows: 'SELECT column1::NUMBER AS person_id, column2::DATE AS reporting_date,

      column3::NUMBER AS age, ''1980-01-01''::DATE AS birth_date_approx,

      ''Female''::VARCHAR AS gender, ''SYNTHETIC''::VARCHAR AS practice_code,

      ''Synthetic practice''::VARCHAR AS practice_name FROM VALUES

      (-4101, ''2026-08-31'', 30), (-4101, ''2026-09-30'', 30),

      (-4102, ''2026-09-30'', 30), (-4103, ''2026-09-30'', 30),

      (-4104, ''2026-09-30'', 30), (-4105, ''2026-09-30'', 14),

      (-4106, ''2026-09-30'', 15)'
  - input: ref('int_smoking_status_all')
    format: sql
    rows: 'SELECT column1::NUMBER AS person_id, column2::VARCHAR AS id,

      column3::DATE AS clinical_effective_date, column4::VARCHAR AS source_cluster_id,

      column5::VARCHAR AS smoking_status, FALSE AS is_never_smoked_code FROM VALUES

      (-4101, ''1'', ''2026-08-01'', ''LSMOK_COD'', ''Current Smoker''),

      (-4101, ''2'', ''2026-09-01'', ''LSMOK_COD'', ''Current Smoker''),

      (-4101, ''3'', ''2026-10-01'', ''EXSMOK_COD'', ''Ex Smoker''),

      (-4102, ''3'', ''2026-09-30'', ''EXSMOK_COD'', ''Ex Smoker''),

      (-4102, ''2'', ''2026-09-30'', ''LSMOK_COD'', ''Current Smoker''),

      (-4103, ''1'', ''2026-09-30'', ''OTHER'', ''Ex Smoker''),

      (-4103, ''2'', ''2026-09-30'', ''OTHER'', ''Non Smoker''),

      (-4105, ''1'', ''2026-09-01'', ''LSMOK_COD'', ''Current Smoker''),

      (-4106, ''1'', ''2026-09-01'', ''LSMOK_COD'', ''Current Smoker'')'
  - input: ref('int_nice_smoking_support_all')
    format: sql
    rows: 'SELECT column1::NUMBER AS person_id, column2::DATE AS event_date

      FROM VALUES (-4101, ''2026-08-20''), (-4101, ''2026-09-20''), (-4101, ''2026-10-01''),

      (-4101, ''2026-08-20'')'
  expect:
    rows:
    - person_id: -4101
      reporting_date: '2026-08-31'
      latest_smoking_status: Current Smoker
      latest_smoking_intervention_date: '2026-08-20'
    - person_id: -4101
      reporting_date: '2026-09-30'
      latest_smoking_status: Current Smoker
      latest_smoking_intervention_date: '2026-09-20'
    - person_id: -4102
      reporting_date: '2026-09-30'
      latest_smoking_status: Current Smoker
      latest_smoking_intervention_date: null
    - person_id: -4103
      reporting_date: '2026-09-30'
      latest_smoking_status: Non Smoker
      latest_smoking_intervention_date: null
    - person_id: -4104
      reporting_date: '2026-09-30'
      latest_smoking_status: null
      latest_smoking_intervention_date: null
    - person_id: -4106
      reporting_date: '2026-09-30'
      latest_smoking_status: Current Smoker
      latest_smoking_intervention_date: null
  config:
    tags:
    - monthly-full
    - nice-history
    - nice-smoking-fixture
