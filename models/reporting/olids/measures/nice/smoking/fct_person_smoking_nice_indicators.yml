      disease or asthma registers. Schizophrenia, bipolar disorder and other psychoses count,
      including remission; lithium alone does not. Achieved with smoking status in the 12 months
      before the build date, or latest never-smoked status recorded after both the 25th birthday
      and earliest qualifying diagnosis if age reaches 26 by financial year-end. Birthdays use
      approximate birth dates. The three-year ex-smoker exception is not applied. Smoking
      records require recorded age of at least 11. No personalised care adjustments are applied.
      Based on NICE NG209. Code lists: CHD_COD, PAD_COD, STRK_COD, TIA_COD, HYP_COD, HYPRES_COD,
      DM_COD, DMTYPE1_COD, DMTYPE2_COD, DMRES_COD, COPDDIAG_COD, COPDPROC_COD, COPDRES_COD,
      CKD_COD, CKD1AND2_COD, CKDRES_COD, AST_COD, ASTRES_COD, MH_COD, LSMOK_COD, EXSMOK_COD,
      NSMOK_COD, SMOK_COD (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind97
        indicator:
          id: "IND97"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "Smoking status, includes mental illness"
          description_short: "Smoking status recorded for people with long-term conditions."
          description_long: >-
            People registered on the build date on coronary heart disease, peripheral arterial
            disease, stroke, transient ischaemic attack, hypertension, diabetes, COPD, chronic
            kidney disease or asthma registers. Schizophrenia, bipolar disorder and other
            psychoses count, including remission; lithium alone does not. Achieved with smoking
            status in the 12 months before the build date, or latest never-smoked status
            recorded after both the 25th birthday and earliest qualifying diagnosis if age
            reaches 26 by financial year-end. Birthdays use approximate birth dates. The
            three-year ex-smoker exception is not applied. Smoking records require recorded age
            of at least 11. No personalised care adjustments are applied. Based on NICE NG209.
            Code lists: CHD_COD, PAD_COD, STRK_COD, TIA_COD, HYP_COD, HYPRES_COD, DM_COD,
            DMTYPE1_COD, DMTYPE2_COD, DMRES_COD, COPDDIAG_COD, COPDPROC_COD, COPDRES_COD,
            CKD_COD, CKD1AND2_COD, CKDRES_COD, AST_COD, ASTRES_COD, MH_COD, LSMOK_COD,
            EXSMOK_COD, NSMOK_COD, SMOK_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND97"
    columns: *smoking_columns
