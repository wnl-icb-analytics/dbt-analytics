models:
  - name: fct_person_smoking_ind157
    description: |
      NICE IND157: LTC smokers offered support. One row per currently registered,
      living, non-test person on the coronary heart disease, peripheral arterial
      disease, stroke or TIA, hypertension, diabetes, COPD, chronic kidney disease or
      asthma register, whose latest smoking status is current smoker, assessed on the
      build date.

      Achievement requires a stop-smoking referral, a pharmacotherapy record or a
      pharmacotherapy prescription in the preceding 12 months. QOF v51 SMOK004 defines
      this evidence through REFERSSSA_COD, PHARM_COD and PHARMDRUG_COD. Generic advice
      and declined-care codes alone do not qualify.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind157
        indicator:
          id: "IND157"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "LTC smokers offered support"
          description_short: "Smoking cessation support offered in the preceding 12 months to current smokers with a listed long-term condition"
          description_long: |
            Currently registered, living, non-test people on the coronary heart disease,
            peripheral arterial disease, stroke or TIA, hypertension, diabetes, COPD,
            chronic kidney disease or asthma register, whose latest smoking status is
            current smoker.

            Achievement requires a stop-smoking referral, a pharmacotherapy record or a
            pharmacotherapy prescription in the preceding 12 months. QOF v51 SMOK004
            defines this evidence through REFERSSSA_COD, PHARM_COD and PHARMDRUG_COD.
            Generic advice and declined-care codes alone do not qualify.

            Assessed on the reporting date before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND157"
    columns: &smoking_columns
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_smoking_status
        description: Latest recorded smoking status
      - name: latest_smoking_status_date
        description: Date of the latest smoking status record
      - name: latest_never_smoked_date
        description: Date of the latest never-smoked record; null if none
      - name: latest_smoking_intervention_date
        description: Date of the latest smoking cessation support record; null if none
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD


  - name: fct_person_smoking_ind156
    description: |
      NICE IND156: LTC smoking status recorded. One row per currently registered,
      living, non-test person on the coronary heart disease, peripheral arterial
      disease, stroke or TIA, hypertension, diabetes, COPD, chronic kidney disease or
      asthma register, assessed on the build date.

      Achievement requires a smoking status record in the preceding 12 months. A person
      whose latest status is never smoked also qualifies without a recent record if they
      reach 26 by the current financial year end. Their never-smoked record must be
      after their 25th birthday and after their earliest qualifying diagnosis. The
      optional three-year ex-smoker exception is not applied.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind156
        indicator:
          id: "IND156"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "LTC smoking status recorded"
          description_short: "Smoking status recorded in the preceding 12 months for people with a listed long-term condition"
          description_long: |
            Currently registered, living, non-test people on the coronary heart disease,
            peripheral arterial disease, stroke or TIA, hypertension, diabetes, COPD,
            chronic kidney disease or asthma register.

            Achievement requires a smoking status record in the preceding 12 months. A
            person whose latest status is never smoked also qualifies without a recent
            record if they reach 26 by the current financial year end. Their
            never-smoked record must be after their 25th birthday and after their
            earliest qualifying diagnosis. The optional three-year ex-smoker exception
            is not applied.

            Assessed on the reporting date before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND156"
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_smoking_status
        description: Latest recorded smoking status
      - name: latest_smoking_status_date
        description: Date of the latest smoking status record
      - name: latest_never_smoked_date
        description: Date of the latest never-smoked record; null if none
      - name: latest_smoking_intervention_date
        description: Date of the latest smoking cessation support record; null if none
      - name: is_status_recorded_in_period
        description: Whether a smoking status was recorded in the period (IND156)
      - name: is_never_smoker_covered
        description: Whether a never-smoker reaching 26 by the end of the financial year is covered by a never-smoked record after their 25th birthday and after their earliest listed diagnosis (IND156)
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD

  - name: fct_person_smoking_nice_indicators
    description: |
      Smoking status and support NICE indicator results. One row per eligible person and
      indicator on the build date. Covers IND97, IND156, IND157.

      Each indicator retains its own population, evidence window and exclusions. The
      individual indicator models define these rules. Results feed the combined NICE
      indicator table and family history.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person in the indicator denominator
      - name: indicator_id
        description: NICE indicator identifier
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND156', 'IND157', 'IND97']
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']
      - name: latest_smoking_status
        description: Latest recorded smoking status
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none

  - name: fct_person_smoking_nice_indicators_snapshot_input
    description: |
      Current smoking NICE indicator evidence for change history. One row per person and
      indicator. Records the current practice, qualifying evidence and outcome.

      Reporting dates are omitted so a daily build alone does not create a new
      historical version. Changes to recorded evidence, practice or achievement can
      create a version in the family snapshot.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: indicator_id
        description: NICE indicator identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: current_practice_code
        description: ODS code of the current registration practice at the build.
      - name: latest_record_date
        description: Date of the latest qualifying record; null when none in the period.
      - name: is_in_numerator
        description: Whether the person met the indicator at the build.
      - name: indicator_status
        description: Outcome label at the build.
      - name: latest_smoking_status
        description: Latest recorded smoking status at the build.

  - name: fct_person_smoking_ind97
    description: |
      NICE IND97: LTC and SMI smoking status. One row per currently registered, living,
      non-test person on the coronary heart disease, peripheral arterial disease, stroke
      or TIA, hypertension, diabetes, COPD, chronic kidney disease or asthma register,
      or with an SMI diagnosis on the SMI register, assessed on the build date.

      Achievement requires a smoking status record in the preceding 12 months. A person
      whose latest status is never smoked also qualifies without a recent record if they
      reach 26 by the current financial year end. Their never-smoked record must be
      after their 25th birthday and after their earliest qualifying diagnosis. The
      optional three-year ex-smoker exception is not applied.

      SMI eligibility requires schizophrenia, bipolar affective disorder or another
      psychosis; lithium therapy alone does not qualify. IND156 is the later indicator
      that omits the SMI population.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind97
        indicator:
          id: "IND97"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "LTC and SMI smoking status"
          description_short: "Smoking status recorded in the preceding 12 months for people with a listed long-term condition or severe mental illness"
          description_long: |
            Currently registered, living, non-test people on the coronary heart disease,
            peripheral arterial disease, stroke or TIA, hypertension, diabetes, COPD,
            chronic kidney disease or asthma register, or with an SMI diagnosis on the
            SMI register.

            Achievement requires a smoking status record in the preceding 12 months. A
            person whose latest status is never smoked also qualifies without a recent
            record if they reach 26 by the current financial year end. Their
            never-smoked record must be after their 25th birthday and after their
            earliest qualifying diagnosis. The optional three-year ex-smoker exception
            is not applied.

            SMI eligibility requires schizophrenia, bipolar affective disorder or
            another psychosis; lithium therapy alone does not qualify. IND156 is the
            later indicator that omits the SMI population.

            Assessed on the reporting date before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND97"
    columns: *smoking_columns
