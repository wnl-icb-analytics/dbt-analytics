models:
  - name: fct_person_smoking_ind157
    description: >-
      Stop-smoking support offered to current smokers (NICE IND157). One row per person in the
      denominator on the build date.


      People registered on the build date whose latest smoking status is current smoker, on
      coronary heart disease, peripheral arterial disease, stroke, transient ischaemic attack,
      hypertension, diabetes, COPD, chronic kidney disease or asthma registers. Achieved with a
      stop-smoking referral, drug treatment record or prescription in the 12 months before the
      build date. Advice or declined care alone does not count. Smoking records require recorded
      age of at least 11. No personalised care adjustments are applied. Based on NICE NG209.
      Code lists: CHD_COD, PAD_COD, STRK_COD, TIA_COD, HYP_COD, HYPRES_COD, DM_COD, DMTYPE1_COD,
      DMTYPE2_COD, DMRES_COD, COPDDIAG_COD, COPDPROC_COD, COPDRES_COD, CKD_COD, CKD1AND2_COD,
      CKDRES_COD, AST_COD, ASTRES_COD, LSMOK_COD, EXSMOK_COD, NSMOK_COD, SMOK_COD,
      REFERSSSA_COD, PHARM_COD (PCD); PHARMDRUG_COD (NHS drug refset).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind157
        indicator:
          id: "IND157"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "Long-term condition smoking support"
          description_short: "Stop-smoking support offered to current smokers."
          description_long: >-
            People registered on the build date whose latest smoking status is current smoker,
            on coronary heart disease, peripheral arterial disease, stroke, transient ischaemic
            attack, hypertension, diabetes, COPD, chronic kidney disease or asthma registers.
            Achieved with a stop-smoking referral, drug treatment record or prescription in the
            12 months before the build date. Advice or declined care alone does not count.
            Smoking records require recorded age of at least 11. No personalised care
            adjustments are applied. Based on NICE NG209. Code lists: CHD_COD, PAD_COD,
            STRK_COD, TIA_COD, HYP_COD, HYPRES_COD, DM_COD, DMTYPE1_COD, DMTYPE2_COD, DMRES_COD,
            COPDDIAG_COD, COPDPROC_COD, COPDRES_COD, CKD_COD, CKD1AND2_COD, CKDRES_COD, AST_COD,
            ASTRES_COD, LSMOK_COD, EXSMOK_COD, NSMOK_COD, SMOK_COD, REFERSSSA_COD, PHARM_COD
            (PCD); PHARMDRUG_COD (NHS drug refset).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND157"
    columns: &smoking_columns
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "NICE indicator identifier."
      - name: indicator_name
        description: "NICE published indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: reporting_date
        description: "Build date used to assess eligibility and achievement."
      - name: measurement_period_start
        description: "Inclusive start of the 12-month achievement window, or 24 months for IND99."
      - name: age
        description: "Age in completed years on the reporting date; null when the birth date is missing."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: current_practice_code
        description: "ODS code of the registration practice on the build date."
      - name: current_practice_name
        description: "Name of the registration practice on the build date."
      - name: latest_smoking_status
        description: "Latest recorded smoking status on or before the reporting date; null when none."
      - name: latest_smoking_status_date
        description: "Date of the latest smoking status on or before the reporting date; null when none."
      - name: latest_never_smoked_date
        description: "Latest explicit never-smoked record on or before the reporting date; null when none."
      - name: latest_smoking_intervention_date
        description: "Latest stop-smoking referral, drug treatment record or prescription on or before the reporting date, including evidence outside the achievement window; null when none."
      - name: latest_record_date
        description: "Latest qualifying smoking status or support date in the achievement window; can be null when achieved through the never-smoked exception."
      - name: is_in_denominator
        description: "Always true; each row meets the documented eligibility and exclusion rules."
      - name: is_in_numerator
        description: "Whether the person meets the documented achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."


  - name: fct_person_smoking_ind156
    description: >-
      Smoking status recorded for people with long-term conditions (NICE IND156). One row per
      person in the denominator on the build date.


      People registered on the build date on coronary heart disease, peripheral arterial
      disease, stroke, transient ischaemic attack, hypertension, diabetes, COPD, chronic kidney
      disease or asthma registers. Achieved with smoking status in the 12 months before the
      build date, or latest never-smoked status recorded after both the 25th birthday and
      earliest qualifying diagnosis if age reaches 26 by financial year-end. Birthdays use
      approximate birth dates. The three-year ex-smoker exception is not applied. Smoking
      records require recorded age of at least 11. No personalised care adjustments are applied.
      Based on NICE NG209. Code lists: CHD_COD, PAD_COD, STRK_COD, TIA_COD, HYP_COD, HYPRES_COD,
      DM_COD, DMTYPE1_COD, DMTYPE2_COD, DMRES_COD, COPDDIAG_COD, COPDPROC_COD, COPDRES_COD,
      CKD_COD, CKD1AND2_COD, CKDRES_COD, AST_COD, ASTRES_COD, LSMOK_COD, EXSMOK_COD, NSMOK_COD,
      SMOK_COD (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind156
        indicator:
          id: "IND156"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "Long-term condition smoking status"
          description_short: "Smoking status recorded for people with long-term conditions."
          description_long: >-
            People registered on the build date on coronary heart disease, peripheral arterial
            disease, stroke, transient ischaemic attack, hypertension, diabetes, COPD, chronic
            kidney disease or asthma registers. Achieved with smoking status in the 12 months
            before the build date, or latest never-smoked status recorded after both the 25th
            birthday and earliest qualifying diagnosis if age reaches 26 by financial year-end.
            Birthdays use approximate birth dates. The three-year ex-smoker exception is not
            applied. Smoking records require recorded age of at least 11. No personalised care
            adjustments are applied. Based on NICE NG209. Code lists: CHD_COD, PAD_COD,
            STRK_COD, TIA_COD, HYP_COD, HYPRES_COD, DM_COD, DMTYPE1_COD, DMTYPE2_COD, DMRES_COD,
            COPDDIAG_COD, COPDPROC_COD, COPDRES_COD, CKD_COD, CKD1AND2_COD, CKDRES_COD, AST_COD,
            ASTRES_COD, LSMOK_COD, EXSMOK_COD, NSMOK_COD, SMOK_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND156"
    columns:
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "NICE indicator identifier."
      - name: indicator_name
        description: "NICE published indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: reporting_date
        description: "Build date used to assess eligibility and achievement."
      - name: measurement_period_start
        description: "Inclusive start of the 12-month achievement window, or 24 months for IND99."
      - name: age
        description: "Age in completed years on the reporting date; null when the birth date is missing."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: current_practice_code
        description: "ODS code of the registration practice on the build date."
      - name: current_practice_name
        description: "Name of the registration practice on the build date."
      - name: latest_smoking_status
        description: "Latest recorded smoking status on or before the reporting date; null when none."
      - name: latest_smoking_status_date
        description: "Date of the latest smoking status on or before the reporting date; null when none."
      - name: latest_never_smoked_date
        description: "Latest explicit never-smoked record on or before the reporting date; null when none."
      - name: latest_smoking_intervention_date
        description: "Latest stop-smoking referral, drug treatment record or prescription on or before the reporting date, including evidence outside the achievement window; null when none."
      - name: is_status_recorded_in_period
        description: "Whether smoking status was recorded in the inclusive 12-month achievement window; null for indicators without this rule."
      - name: is_never_smoker_covered
        description: "Whether a latest never-smoked status qualifies through a record after both the 25th birthday and earliest qualifying diagnosis, with age 26 reached by the financial year-end; null for indicators without this rule."
      - name: latest_record_date
        description: "Latest qualifying smoking status or support date in the achievement window; can be null when achieved through the never-smoked exception."
      - name: is_in_denominator
        description: "Always true; each row meets the documented eligibility and exclusion rules."
      - name: is_in_numerator
        description: "Whether the person meets the documented achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."

  - name: fct_person_smoking_nice_indicators
    description: >-
      NICE smoking results. One row per person and indicator on the build date.


      Includes IND97, IND98, IND99, IND156, IND157, with the eligibility, exclusions and
      achievement rules documented for each indicator.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND156', 'IND157', 'IND97', 'IND98', 'IND99']
      - name: indicator_status
        description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']
      - name: latest_smoking_status
        description: "Latest recorded smoking status on or before the reporting date; null when none."
      - name: latest_record_date
        description: "Latest qualifying smoking status or support date in the achievement window; can be null when achieved through the never-smoked exception."

  - name: fct_person_smoking_nice_indicators_snapshot_input
    description: >-
      NICE smoking results. One row per person and indicator.


      Includes IND97, IND98, IND99, IND156, IND157, with the eligibility, exclusions and
      achievement rules documented for each indicator. Records achievement and evidence used to
      track changes in clinical results.
      Labels join from def_indicator or the measure tables by indicator_id.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - not_null
      - name: current_practice_code
        description: "ODS code of the registration practice on the build date."
      - name: latest_record_date
        description: "Latest qualifying smoking status or support date in the achievement window; can be null when achieved through the never-smoked exception."
      - name: is_in_numerator
        description: "Whether the person meets the documented achievement rule on the build date."
      - name: indicator_status
        description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
      - name: latest_smoking_status
        description: "Latest recorded smoking status on or before the build date; null when none."

  - name: fct_person_smoking_ind97
    description: >-
      Smoking status recorded for people with long-term conditions (NICE IND97). One row per
