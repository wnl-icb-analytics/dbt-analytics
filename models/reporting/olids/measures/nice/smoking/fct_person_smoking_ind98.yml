models:
- name: fct_person_smoking_ind98
  description: >-
    Stop-smoking support for smokers with long-term conditions or severe mental illness
    (NICE IND98). One row per person in the denominator on the build date.


    People registered on the build date whose latest smoking status is current smoker,
    on coronary heart disease, peripheral arterial disease, stroke, transient ischaemic
    attack, hypertension, diabetes, COPD, chronic kidney disease or asthma registers.
    Schizophrenia, bipolar disorder and other psychoses count, including remission;
    lithium alone does not. Achieved with a stop-smoking referral, drug treatment record
    or prescription in the 12 months before the build date. Advice or declined care
    alone does not count. Smoking records require recorded age of at least 11. No
    personalised care adjustments are applied. Based on NICE NG209. Code lists: CHD_COD,
    PAD_COD, STRK_COD, TIA_COD, HYP_COD, HYPRES_COD, DM_COD, DMTYPE1_COD, DMTYPE2_COD,
    DMRES_COD, COPDDIAG_COD, COPDPROC_COD, COPDRES_COD, CKD_COD, CKD1AND2_COD,
    CKDRES_COD, AST_COD, ASTRES_COD, MH_COD, LSMOK_COD, EXSMOK_COD, NSMOK_COD, SMOK_COD,
    REFERSSSA_COD, PHARM_COD (PCD); PHARMDRUG_COD (NHS drug refset).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind98
      indicator:
        id: IND98
        type: MEASURE
        category: LIFESTYLE
        clinical_domain: Lifestyle
        name_short: "Smoking support includes mental illness"
        description_short: "Stop-smoking support for smokers with long-term conditions or severe mental illness."
        description_long: >-
          People registered on the build date whose latest smoking status is current smoker, on
          coronary heart disease, peripheral arterial disease, stroke, transient ischaemic
          attack, hypertension, diabetes, COPD, chronic kidney disease or asthma registers.
          Schizophrenia, bipolar disorder and other psychoses count, including remission;
          lithium alone does not. Achieved with a stop-smoking referral, drug treatment record
          or prescription in the 12 months before the build date. Advice or declined care alone
          does not count. Smoking records require recorded age of at least 11. No personalised
          care adjustments are applied. Based on NICE NG209. Code lists: CHD_COD, PAD_COD,
          STRK_COD, TIA_COD, HYP_COD, HYPRES_COD, DM_COD, DMTYPE1_COD, DMTYPE2_COD, DMRES_COD,
          COPDDIAG_COD, COPDPROC_COD, COPDRES_COD, CKD_COD, CKD1AND2_COD, CKDRES_COD, AST_COD,
          ASTRES_COD, MH_COD, LSMOK_COD, EXSMOK_COD, NSMOK_COD, SMOK_COD, REFERSSSA_COD,
          PHARM_COD (PCD); PHARMDRUG_COD (NHS drug refset).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND98
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
    data_tests:
    - not_null
    - unique
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "NICE published indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Build date used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Inclusive start of the 12-month achievement window, or 24 months for IND99."
  - name: age
    description: "Age in completed years on the reporting date; null when the birth date is missing."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: is_in_denominator
    description: "Always true; each row meets the documented eligibility and exclusion rules."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  - name: latest_record_date
    description: "Latest qualifying smoking status or support date in the achievement window; can be null when achieved through the never-smoked exception."
  - name: current_practice_code
    description: "ODS code of the registration practice on the build date."
  - name: current_practice_name
    description: "Name of the registration practice on the build date."
  - name: latest_smoking_status
    description: "Latest smoking status on or before the reporting date, with no expiry; null when none. Same-day priority is current smoker, ex-smoker, never smoked, then non-smoker with unknown history."
  - name: latest_smoking_status_date
    description: "Date of the latest smoking status on or before the reporting date; null when none."
  - name: latest_never_smoked_date
    description: "Latest explicit never-smoked record on or before the reporting date; null when none."
  - name: latest_smoking_intervention_date
    description: "Latest stop-smoking referral, drug treatment record or prescription on or before the reporting date, including evidence outside the achievement window; null when none."
