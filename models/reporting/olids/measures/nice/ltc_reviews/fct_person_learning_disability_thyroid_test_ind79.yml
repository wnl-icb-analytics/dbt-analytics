models:
- name: fct_person_learning_disability_thyroid_test_ind79
  description: >-
    Thyroid testing in adults with Down's syndrome (NICE IND79). One row per person in the
    denominator on the build date.


    People registered on the build date aged 18 or over on the learning disability register with
    Down's syndrome. Hypothyroidism excludes them. Achieved with a thyroid function test in the
    15 months before the build date. Numeric results are not required. Free T4 and T3 codes
    count without proof of TSH testing. No personalised care adjustments are applied. Based on
    NICE NG145. Code lists: LD_COD, DS_COD, THY_COD, TFT_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind79
      indicator:
        id: IND79
        type: MEASURE
        category: REVIEW
        clinical_domain: Learning disability
        name_short: "Down's syndrome thyroid test"
        description_short: "Thyroid testing in adults with Down's syndrome."
        description_long: >-
          People registered on the build date aged 18 or over on the learning disability
          register with Down's syndrome. Hypothyroidism excludes them. Achieved with a thyroid
          function test in the 15 months before the build date. Numeric results are not
          required. Free T4 and T3 codes count without proof of TSH testing. No personalised
          care adjustments are applied. Based on NICE NG145. Code lists: LD_COD, DS_COD,
          THY_COD, TFT_COD (PCD).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND79
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
    data_tests:
    - not_null
    - unique
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Build date used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "15 months before the reporting date, included in the test window."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  - name: latest_record_date
    description: "Latest thyroid function test in the 15-month window; null if absent."
  - name: current_practice_code
    description: "ODS code of the registration practice at the reporting date."
  - name: current_practice_name
    description: "Name of the registration practice at the reporting date."
  - name: downs_syndrome_diagnosis_date
    description: "Earliest Down's syndrome diagnosis with clinical and recorded dates known by the reporting date."
  - name: latest_thyroid_function_test_date
    description: >-
      Latest thyroid function test on or before the reporting date; null if absent. It may be
      outside the achievement window.
