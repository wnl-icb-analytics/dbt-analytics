models:
- name: fct_person_cancer_care_review_ind113_by_month
  description: >-
    Cancer care review within three months of diagnosis (NICE IND113). One row per person in
    the denominator at each month-end.


    People registered at the month-end on the cancer register with a latest new diagnosis 3 to
    18 months before the month-end, a 15-month cohort ending 3 months earlier so follow-up is
    complete, rather than NICE's preceding 15 months. Non-melanoma skin cancer is excluded.
    The diagnosis code supplies the clinical date; practice confirmation is not separately
    dated. Achieved with a review within 3 months from diagnosis. Two invitations at least 7
    days apart in that period exclude people if no review follows the first invitation by the
    month-end. Recalculated for each of the last 60 month-ends with current rules, code lists
    and records, so later corrections can change past months. Based on NICE CG138. Code lists:
    CAN_COD, MDRV_COD, CANINVITE_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind113
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "18 months before the reporting date, included in the diagnosis cohort."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  - name: latest_record_date
    description: "First cancer care review from diagnosis day to 3 months afterwards, inclusive; null if absent."
  - name: practice_code
    description: "ODS code of the registration practice at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice at the reporting month-end."
  - name: diagnosis_date
    description: >-
      Clinical date of the latest first or new cancer diagnosis in the eligible cohort.
      Practice receipt of confirmation is not separately dated.
  - name: latest_review_date
    description: >-
      First cancer care review on or after diagnosis and on or before the reporting date; null if
      absent. Late reviews are retained.
  - name: first_invitation_date
    description: >-
      First cancer review invitation from diagnosis day to 3 months afterwards, including both
      boundaries; null if absent.
  - name: last_invitation_date
    description: >-
      Last cancer review invitation from diagnosis day to 3 months afterwards, including both
      boundaries; null if absent.
  - name: is_excluded_invitation_non_response
    description: >-
      Always false for retained rows. People with two invitations at least 7 days apart and no
      review after the first invitation by the reporting date are excluded.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
