models:
- name: fct_person_rheumatoid_arthritis_review_ind110_by_month
  description: >-
    Annual review in rheumatoid arthritis (NICE IND110). One row per person in the denominator
    at each month-end.


    People registered at the month-end on the rheumatoid arthritis register, which starts at age
    16. Achieved with an annual review in the 15 months before the month-end. The code does not
    prove NICE's required face-to-face setting. Declines and repeated non-response do not
    exclude people. No personalised care adjustments are applied. Recalculated for each of the
    last 60 month-ends with current rules, code lists and records, so later corrections can
    change past months. Based on NICE NG100. Code lists: RARTH_COD, RARTHRVW_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind110
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "15 months before the reporting date, included in the review window."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: condition_name
    description: "Short label for the denominator population."
  - name: practice_code
    description: "ODS code of the registration practice at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice at the reporting month-end."
  - name: latest_review_date
    description: >-
      Latest review, care plan or health check on or before the reporting date; null if absent. It
      may be outside the achievement window.
  - name: latest_record_date
    description: >-
      Latest supporting evidence in the indicator window; null if absent. The model description
      gives the achievement rule.
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
