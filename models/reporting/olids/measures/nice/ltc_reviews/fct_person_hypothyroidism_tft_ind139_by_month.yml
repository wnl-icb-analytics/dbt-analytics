models:
- name: fct_person_hypothyroidism_tft_ind139_by_month
  description: NICE IND139. One row per eligible person and completed month-end. People on the hypothyroidism
    register. A thyroid function test in the inclusive preceding 12 months achieves the indicator. Recalculated
    at monthly refresh for the last 60 completed month-ends using today's rules and code lists. Registration
    and practice come from the existing monthly spine. Registration start is inclusive; registration end
    and death dates are exclusive. Overlapping registrations retain the spine's current-registration priority.
    Birth and death dates are approximate; missing birth dates prevent historical active rows. Current
    gender and test flags apply retrospectively. Register diagnosis state uses clinical and recorded dates.
    Review and test evidence uses its clinical date through month-end. Later corrections and current code-list
    changes can alter earlier results. Personalised care adjustments are not applied.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind139
  columns:
  - name: person_id
    description: Person in the indicator denominator
  - name: indicator_id
    description: NICE indicator identifier
  - name: indicator_name
    description: Published NICE indicator name
  - name: reporting_date
    description: Completed month-end used for eligibility and evidence. DATE; no current-day row.
  - name: measurement_period_start
    description: Inclusive start of the measurement period before the reporting date
  - name: age
    description: Completed years at month-end, calculated from the approximate birth month.
  - name: condition_name
    description: Population defining the indicator
  - name: practice_code
    description: ODS practice code at month-end under the monthly spine attribution.
  - name: practice_name
    description: Practice name at month-end under the monthly spine attribution.
  - name: latest_review_date
    description: Date of the latest review, care plan, health check or test record for the indicator;
      null when none
  - name: latest_record_date
    description: Review, check or test date within its measurement window; null when none. Supporting
      evidence alone does not establish all numerator components.
  - name: is_in_denominator
    description: Always true; every row is an eligible person before personalised care adjustments
  - name: is_in_numerator
    description: Whether the person meets the indicator on the reporting date
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
