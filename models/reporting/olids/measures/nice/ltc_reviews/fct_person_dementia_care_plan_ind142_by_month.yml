models:
- name: fct_person_dementia_care_plan_ind142_by_month
  description: >-
    Care planning or care plan review in dementia (NICE IND142). One row per person in the
    denominator at each month-end.


    People registered at the month-end on the dementia register. Achieved with a dementia care
    plan or plan review in the 12 months before the month-end, on or after first diagnosis. A
    new plan counts without a review; codes do not prove NICE's required face-to-face setting.
    No personalised care adjustments are applied. Recalculated for each of the last 60
    month-ends with current rules, code lists and records, so later corrections can change
    past months. Based on NICE NG97. Code lists: DEM_COD, DEMCP_COD, DEMCPRVW_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind142
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "12 months before the reporting date, included in the care plan window."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice at the reporting month-end."
  - name: latest_review_date
    description: >-
      Latest dementia care plan or plan review on or before the reporting date; null if
      absent. It may be older than the 12-month window or precede diagnosis.
      Latest dementia care plan or plan review on or before the reporting date; null if
      absent. It may be older than the 12-month window or precede diagnosis.
  - name: latest_record_date
    description: >-
      Latest dementia care plan or plan review in the 12-month window; null if absent. A plan
      before the first diagnosis does not achieve the indicator.
      Latest dementia care plan or plan review in the 12-month window; null if absent. A plan
      before the first diagnosis does not achieve the indicator.
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
