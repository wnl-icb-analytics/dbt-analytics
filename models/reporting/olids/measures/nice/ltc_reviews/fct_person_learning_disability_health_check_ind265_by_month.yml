models:
- name: fct_person_learning_disability_health_check_ind265_by_month
  description: >-
    Learning disability health check and action plan (NICE IND265). One row per person in the
    denominator at each month-end.


    People registered at the month-end of any age on the learning disability register. Achieved
    with a health check and health action plan in the 12 months before the month-end. The latest
    plan must be on or after the latest check, even if an earlier pair qualified. No
    personalised care adjustments are applied. Recalculated for each of the last 60 month-ends
    with current rules, code lists and records, so later corrections can change past months.
    Based on NICE NG96. Code lists: LD_COD, HLTHCHK_COD, HLTHAP_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind265
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "12 months before the reporting date, included in the check and plan windows."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: condition_name
    description: "Short label for the denominator population."
  - name: practice_code
    description: "ODS code of the registration practice at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice at the reporting month-end."
  - name: latest_review_date
    description: >-
      Latest review, care plan or health check on or before the reporting date; null if absent. It
      may be outside the achievement window.
  - name: latest_health_action_plan_date
    description: >-
      Latest learning disability health action plan on or before the reporting date; null if absent.
      It may be outside the achievement window.
  - name: latest_record_date
    description: >-
      Latest review or health check in the 12-month window; null if absent. A date does not prove
      the other numerator components are met.
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
