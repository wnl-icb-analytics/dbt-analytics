models:
  - name: fct_person_asthma_review_ind273
    description: >-
      Asthma review with an action plan and exacerbation count (NICE IND273). One row per person
      in the denominator on the build date.


      People registered on the build date aged 5 or over with an unresolved asthma diagnosis
      after any resolution; prescriptions are not required. Achieved with a review in the 12
      months before the build date, a written personalised action plan that day, and an
      exacerbation count recorded within the preceding month or on review day. The review code
      represents asthma control assessment. An earlier complete review counts despite a later
      incomplete review. No personalised care adjustments are applied. Based on NICE NG245. Code
      lists: AST_COD, ASTRES_COD, REV_COD, WRITPASTP_COD, ASTEXACB_COD (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind273
        indicator:
          id: "IND273"
          type: "MEASURE"
          category: "REVIEW"
          clinical_domain: "Respiratory"
          name_short: "Asthma review and action plan"
          description_short: "Asthma review with an action plan and exacerbation count."
          description_long: >-
            People registered on the build date aged 5 or over with an unresolved asthma
            diagnosis after any resolution; prescriptions are not required. Achieved with a
            review in the 12 months before the build date, a written personalised action plan
            that day, and an exacerbation count recorded within the preceding month or on review
            day. The review code represents asthma control assessment. An earlier complete
            review counts despite a later incomplete review. No personalised care adjustments
            are applied. Based on NICE NG245. Code lists: AST_COD, ASTRES_COD, REV_COD,
            WRITPASTP_COD, ASTEXACB_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND273"
    columns:
      - name: person_id
        description: "Person identifier for a member of the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "NICE indicator identifier."
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: reporting_date
        description: "Build date used to assess eligibility and evidence."
      - name: measurement_period_start
        description: "12 months before the reporting date, included in the review window."
      - name: age
        description: "Age in completed years at the reporting date, based on the approximate birth date."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: current_practice_code
        description: "ODS code of the registration practice at the reporting date."
      - name: current_practice_name
        description: "Name of the registration practice at the reporting date."
      - name: latest_review_date
        description: "Latest asthma review on or before the reporting date, including incomplete or older reviews; null if absent."
      - name: latest_record_date
        description: >-
          Latest complete asthma review in the 12-month window; null if absent. A later incomplete
          review does not cancel it.
      - name: is_in_denominator
        description: "Always true. Each row is an eligible member of the denominator."
      - name: is_in_numerator
        description: "Whether the person meets the documented achievement rule."
      - name: indicator_status
        description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']


