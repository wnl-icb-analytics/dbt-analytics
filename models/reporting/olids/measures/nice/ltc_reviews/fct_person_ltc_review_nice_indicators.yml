  - name: fct_person_depression_review_ind104
    description: >
      NICE IND104 depression review within 10 to 35 days. One row per
      currently registered, living, non-test person aged 18 and over whose
      latest first or new episode depression diagnosis falls in the preceding
      12 months, assessed on the build date. The numerator requires a
      depression review code (DEPRVW_COD) dated 10 to 35 days after that
      diagnosis. The 18-and-over floor comes from the QOF depression register, not the NICE page. Diagnoses with no episodicity are treated as new, as the register does. NICE frames the window as the preceding 1 April to 31 March;
      a rolling 12 months is used so the figure does not reset each April.
      People diagnosed in the last 35 days without a review count as not
      achieved. Personalised care adjustments are not applied. Secondary-use
      consumers must join DIM_PERSON_SECONDARY_USE_ALLOWED to apply National
      Data Opt-Out and Type 1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind104
        indicator:
          id: "IND104"
          type: "MEASURE"
          category: "REVIEW"
          clinical_domain: "Mental health"
          name_short: "Depression review 10 to 35 days"
          description_short: "Depression review 10 to 35 days after a new diagnosis in the preceding 12 months"
          description_long: "NICE IND104 before personalised care adjustments."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND104"
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
