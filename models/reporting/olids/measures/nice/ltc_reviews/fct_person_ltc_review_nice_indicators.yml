      levothyroxine prescribed in the preceding 6 months and no latest subclinical
      hypothyroidism diagnosis, without an added age restriction. Achieved with a thyroid
      function test in the 12 months before the build date. Numeric results are not
      required. No personalised care adjustments are applied. Based on the NICE clinical
      knowledge summary on hypothyroidism. Code lists: THY_COD, TFT_COD (PCD); subclinical
      hypothyroidism and levothyroxine code lists from the IND138 register.
