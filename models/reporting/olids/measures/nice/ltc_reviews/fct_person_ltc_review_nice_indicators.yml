models:
  - name: fct_person_asthma_review_ind273
    description: |
      NICE IND273: Asthma review. One row per currently registered, living, non-test
      person aged 5 and over on the asthma register, assessed on the build date.

      Achievement requires an asthma review in the preceding 12 months with a written
      personalised action plan on the same day. An exacerbation count must be recorded
      within the month before the review, including the review day but excluding the
      same date one month earlier. QOF v51 AST015 supplies these timing rules and uses
      the review code as evidence of asthma control assessment.

      An earlier complete review still qualifies when a later review lacks a required
      component.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind273
        indicator:
          id: "IND273"
          type: "MEASURE"
          category: "REVIEW"
          clinical_domain: "Respiratory"
          name_short: "Asthma review"
          description_short: "Asthma review with a personalised action plan and exacerbation count in the preceding 12 months"
          description_long: |
            Currently registered, living, non-test people aged 5 and over on the asthma
            register.

            Achievement requires an asthma review in the preceding 12 months with a
            written personalised action plan on the same day. An exacerbation count must
            be recorded within the month before the review, including the review day but
            excluding the same date one month earlier. QOF v51 AST015 supplies these
            timing rules and uses the review code as evidence of asthma control
            assessment.

            An earlier complete review still qualifies when a later review lacks a
            required component.

            Assessed on the reporting date before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND273"
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_review_date
        description: Date of the latest review, care plan, health check or test record for the indicator; null when none
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']


