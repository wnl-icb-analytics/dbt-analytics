models:
  - name: fct_person_asthma_review_ind273
    description: >
      NICE IND273 asthma annual review. One row per currently registered,
      living, non-test person aged 5 and over on the asthma register, assessed
      on the build date. The numerator requires an asthma review code (PCD
      REV_COD) in the preceding 12 months. NICE asks that the review covers
      asthma control, the number of exacerbations and a written action plan;
      the review code stands for those elements because they are not
      separately clustered. Children under 5 are excluded as NICE specifies.
      Personalised care adjustments are not applied. Secondary-use consumers
      must join DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-
      Out and Type 1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind273
        indicator:
          id: "IND273"
          type: "MEASURE"
          category: "REVIEW"
          clinical_domain: "Respiratory"
          name_short: "Asthma review"
          description_short: "Asthma review recorded in the preceding 12 months for people aged 5 and over on the asthma register"
          description_long: "NICE IND273 before personalised care adjustments."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND273"
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_review_date
        description: Date of the latest review, care plan, health check or test record for the indicator; null when none
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']


