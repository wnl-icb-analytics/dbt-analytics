  - name: fct_person_ltc_review_nice_indicators
    description: >-
      Long-term condition reviews indicator results (IND79, IND104, IND110, IND113, IND139,
      IND142, IND191, IND195, IND222, IND223, IND265, IND266, IND273). One row per eligible
      person and indicator on the build date.


      People registered on the build date in each indicator's denominator. Eligibility,
      exclusions and achievement follow the individual measures. Supporting fields are null
      where an indicator does not provide them. IND113 applies the invitation non-response
      exclusion.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: "Person identifier for a member of the indicator denominator."
        data_tests:
          - not_null
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND79', 'IND113', 'IND222', 'IND104', 'IND110', 'IND139', 'IND142', 'IND191', 'IND195', 'IND223', 'IND265', 'IND266', 'IND273']
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: reporting_date
        description: "Build date used to assess eligibility and evidence."
      - name: measurement_period_start
        description: >-
          Start of the diagnosis, prescription or evidence period for the indicator. Boundary
          inclusion is defined in the individual measure.
      - name: age
        description: "Age in completed years at the reporting date, based on the approximate birth date."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: current_practice_code
        description: "ODS code of the registration practice at the reporting date."
      - name: current_practice_name
        description: "Name of the registration practice at the reporting date."
      - name: latest_review_date
        description: >-
          Evidence date for the individual measure: the first review on or after cancer diagnosis or
          within the depression follow-up window, otherwise the latest condition-specific
          review, care plan, health check or thyroid test. Null if absent or not supplied by
          the indicator; late evidence may be retained.
      - name: latest_copd_exacerbation_count_date
        description: >-
          Latest record of the number of COPD exacerbations on or before the reporting date; null if
          absent. It may be outside the achievement window. Null when this field does not apply to
          the indicator.
      - name: latest_mrc_dyspnoea_date
        description: >-
          Latest MRC breathlessness assessment on or before the reporting date; null if absent. It
          may be outside the achievement window. Null when this field does not apply to the
          indicator.
      - name: latest_nyha_date
        description: >-
          Latest New York Heart Association functional assessment on or before the reporting date;
          null if absent. It may be outside the achievement window. Null when this field does not
          apply to the indicator.
      - name: latest_medication_review_date
        description: >-
          Latest general, heart failure or structured medication review on or before the reporting
          date; null if absent. It may be outside the achievement window. Null when this field does
          not apply to the indicator.
      - name: latest_health_action_plan_date
        description: >-
          Latest learning disability health action plan on or before the reporting date; null if
          absent. It may be outside the achievement window. Null when this field does not apply to
          the indicator.
      - name: has_ethnicity_recorded
        description: >-
          True when the ethnicity category at the reporting date is known. Missing, unknown and
          not-stated ethnicity give false. Null when this field does not apply to the indicator.
      - name: diagnosis_date
        description: "Diagnosis date used to assess the indicator, as defined in the model description."
      - name: latest_record_date
        description: >-
          Supporting evidence date for the indicator. Its meaning follows the individual measure; a
          date alone does not prove achievement.
      - name: is_in_denominator
        description: "Always true. Each row is an eligible member of the denominator."
      - name: is_in_numerator
        description: "Whether the person meets the documented achievement rule."
      - name: indicator_status
        description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']

      - name: first_invitation_date
        description: >-
          First cancer review invitation from diagnosis day to 3 months afterwards, including both
          boundaries; null if absent. Null when this field does not apply to the indicator.

      - name: last_invitation_date
        description: >-
          Last cancer review invitation from diagnosis day to 3 months afterwards, including both
          boundaries; null if absent. Null when this field does not apply to the indicator.

      - name: is_excluded_invitation_non_response
        description: >-
          Always false for retained rows. People with two invitations at least 7 days apart and no
          review after the first invitation by the reporting date are excluded. Null when this field
          does not apply to the indicator.

