      episode was diagnosed from 1 April of the current financial year to the reporting
      date, assessed on the build date.

      Achievement requires a depression review 10 to 35 days after that diagnosis,
      including both boundary days. People still within their review window count as not
      achieved until a review is recorded.

      QOF v51 supplies the adult population and treats interim annual extracts as
      cumulative from 1 April. The denominator restarts each April. Diagnoses with
      missing episodicity are treated as new, following the existing register.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind104
        indicator:
          id: "IND104"
          type: "MEASURE"
          category: "REVIEW"
          clinical_domain: "Mental health"
          name_short: "Depression review 10 to 35 days"
          description_short: "Depression review 10 to 35 days after a first or new episode diagnosed in the current financial year"
          description_long: |
            Currently registered, living, non-test people aged 18 and over whose latest
            first or new depression episode was diagnosed from 1 April of the current
            financial year to the reporting date.

            Achievement requires a depression review 10 to 35 days after that diagnosis,
            including both boundary days. People still within their review window count
            as not achieved until a review is recorded.

            QOF v51 supplies the adult population and treats interim annual extracts as
            cumulative from 1 April. The denominator restarts each April. Diagnoses with
            missing episodicity are treated as new, following the existing register.

            Assessed on the reporting date before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND104"
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: diagnosis_date
        description: Diagnosis date anchoring the indicator window; null when none
      - name: latest_review_date
        description: Date of the latest review, care plan, health check or test record for the indicator; null when none
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']


