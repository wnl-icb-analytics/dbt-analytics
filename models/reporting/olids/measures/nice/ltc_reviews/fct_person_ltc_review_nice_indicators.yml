          clinical_domain: "Cancer"
          name_short: "Cancer review within twelve months"
          description_short: "Cancer care review within twelve months of diagnosis."
          description_long: >-
            People registered on the build date on the cancer register with a latest new
            diagnosis 12 to 36 months before the build date, a 24-month cohort ending 12 months
            earlier so follow-up is complete, rather than NICE's preceding 24 months.
            Non-melanoma skin cancer is excluded. Achieved with a review within 12 months from
            diagnosis. The code does not prove use of NICE's required structured template. No
            personalised care adjustments are applied. Based on NICE CG138. Code lists: CAN_COD,
            MDRV_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND223"
    columns:
