models:
- name: fct_person_copd_review_ind191_by_month
  description: >-
    COPD review with breathlessness and exacerbation records (NICE IND191). One row per person
    in the denominator at each month-end.


    People registered at the month-end on the COPD register. Achieved with a COPD review, an
    exacerbation count and an MRC breathlessness assessment in the 12 months before the
    month-end. Dates can differ. No personalised care adjustments are applied. Recalculated for
    each of the last 60 month-ends with current rules, code lists and records, so later
    corrections can change past months. Based on NICE NG115. Code lists: COPD_COD, COPDRVW_COD,
    COPDEXACB_COD, MRC_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind191
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "12 months before the reporting date, included in each assessment window."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice at the reporting month-end."
  - name: latest_review_date
    description: >-
      Latest COPD review on or before the reporting date; null if absent. It may be outside
      the achievement window.
      Latest COPD review on or before the reporting date; null if absent. It may be outside
      the achievement window.
  - name: latest_copd_exacerbation_count_date
    description: >-
      Latest record of the number of COPD exacerbations on or before the reporting date; null if
      absent. It may be outside the achievement window.
  - name: latest_mrc_dyspnoea_date
    description: >-
      Latest MRC breathlessness assessment on or before the reporting date; null if absent. It may
      be outside the achievement window.
  - name: latest_record_date
    description: >-
      Latest COPD review in the 12-month window; null if absent. It does not prove
      breathlessness and exacerbation records are present.
      Latest COPD review in the 12-month window; null if absent. It does not prove
      breathlessness and exacerbation records are present.
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
