models:
- name: fct_person_cancer_care_review_ind113
  description: >-
    Cancer care review within three months of diagnosis (NICE IND113). One row per person in the
    denominator on the build date.


    People registered on the build date on the cancer register with a latest new diagnosis 3 to
    18 months before the build date, allowing review to finish. Non-melanoma skin cancer is
    excluded. Diagnosis means practice confirmation. Achieved with a review within 3 months from
    diagnosis. Two invitations at least 7 days apart in that period exclude people if no review
    follows the first invitation by the build date. Based on NICE CG138. Code lists: CAN_COD,
    MDRV_COD, CANINVITE_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind113
      indicator:
        id: IND113
        type: MEASURE
        category: REVIEW
        clinical_domain: Cancer
        name_short: "Cancer review within three months"
        description_short: "Cancer care review within three months of diagnosis."
        description_long: >-
          People registered on the build date on the cancer register with a latest new diagnosis
          3 to 18 months before the build date, allowing review to finish. Non-melanoma skin
          cancer is excluded. Diagnosis means practice confirmation. Achieved with a review
          within 3 months from diagnosis. Two invitations at least 7 days apart in that period
          exclude people if no review follows the first invitation by the build date. Based on
          NICE CG138. Code lists: CAN_COD, MDRV_COD, CANINVITE_COD (PCD).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND113
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
    data_tests:
    - not_null
    - unique
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: reporting_date
    description: "Build date used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "18 months before the reporting date, included in the diagnosis cohort."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: condition_name
    description: "Short label for the denominator population."
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  - name: latest_record_date
    description: "First cancer care review from diagnosis day to 3 months afterwards, inclusive; null if absent."
  - name: current_practice_code
    description: "ODS code of the registration practice at the reporting date."
  - name: current_practice_name
    description: "Name of the registration practice at the reporting date."
  - name: diagnosis_date
    description: "Latest first or new cancer diagnosis known by the reporting date within the eligible diagnosis cohort."
  - name: latest_review_date
    description: >-
      First cancer care review on or after diagnosis and on or before the reporting date; null if
      absent. Late reviews are retained.
  - name: first_invitation_date
    description: >-
      First cancer review invitation from diagnosis day to 3 months afterwards, including both
      boundaries; null if absent.
  - name: last_invitation_date
    description: >-
      Last cancer review invitation from diagnosis day to 3 months afterwards, including both
      boundaries; null if absent.
  - name: is_excluded_invitation_non_response
    description: >-
      Always false for retained rows. People with two invitations at least 7 days apart and no
      review after the first invitation by the reporting date are excluded.
