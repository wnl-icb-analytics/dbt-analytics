models:
- name: fct_person_cancer_support_ind222_by_month
  description: Cancer support discussion. One row per registered, living, non-test cancer register member
    with a new diagnosis in the preceding 12 months at each completed month-end. Latest cancer diagnosis
    known by R in (R - 12 months, R]. Non-melanoma skin cancer is outside the register. CANCER_SUPPORT_COD
    between diagnosis and three calendar months after it, capped at R, qualifies. A cancer care review
    alone does not qualify. People with an incomplete follow-up window remain eligible. Personalised care
    adjustments are not applied. History covers the last 60 completed month-ends and is recalculated at
    monthly refresh using current rules and code lists. Approximate birth/death dates and current gender/test
    flags limit historical interpretation. Diagnoses require clinical and recorded dates known by R; other
    evidence uses clinical dates through R. Later corrections can alter earlier results.
  config:
    meta:
      owner:
        name: EddieDavison92
  columns:
  - name: person_id
    description: Person in the indicator denominator.
  - name: indicator_id
    description: NICE indicator identifier.
  - name: indicator_name
    description: Published indicator subject.
  - name: reporting_date
    description: Completed month-end R. Recalculated for the last 60 completed month-ends using current
      rules and code lists.
  - name: measurement_period_start
    description: Exclusive lower boundary of the rolling eligibility or review window.
  - name: age
    description: Completed years at R.
  - name: condition_name
    description: Population defining the indicator.
  - name: practice_code
    description: ODS code of the registration practice at R.
  - name: practice_name
    description: Name of the registration practice at R.
  - name: diagnosis_date
    description: Latest cancer diagnosis known by R; anchors the three-month support window.
  - name: latest_record_date
    description: Latest qualifying evidence date in the specified window; null when no qualifying evidence
      exists.
  - name: is_in_denominator
    description: Always true for each eligible row.
  - name: is_in_numerator
    description: Whether qualifying evidence is present in the specified window.
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
