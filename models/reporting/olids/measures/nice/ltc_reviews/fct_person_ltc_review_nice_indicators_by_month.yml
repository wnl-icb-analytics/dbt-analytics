models:
- name: fct_person_ltc_review_nice_indicators_by_month
  description: >-
    Long-term condition reviews indicator results (IND79, IND104, IND110, IND113, IND139,
    IND142, IND191, IND195, IND223, IND265, IND266, IND273). One row per eligible
    person, indicator and month-end.


    People registered at the month-end in each indicator's denominator. Eligibility, exclusions
    and achievement follow the individual measures. Supporting fields are null where an
    indicator does not provide them. IND113 applies the invitation non-response exclusion.
    Recalculated for each of the last 60 month-ends with current rules, code lists and records,
    so later corrections can change past months.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
        - reporting_date
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: >-
      Start of the diagnosis, prescription or evidence period for the indicator. Boundary inclusion
      is defined in the individual measure.
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: condition_name
    description: "Short label for the denominator population."
  - name: practice_code
    description: "ODS code of the registration practice at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice at the reporting month-end."
  - name: latest_review_date
    description: >-
      Latest review, care plan or health check on or before the reporting date; null if absent. It
      may be outside the achievement window.
  - name: latest_copd_exacerbation_count_date
    description: >-
      Latest record of the number of COPD exacerbations on or before the reporting date; null if
      absent. It may be outside the achievement window. Null when this field does not apply to the
      indicator.
  - name: latest_mrc_dyspnoea_date
    description: >-
      Latest MRC breathlessness assessment on or before the reporting date; null if absent. It may
      be outside the achievement window. Null when this field does not apply to the indicator.
  - name: latest_nyha_date
    description: >-
      Latest New York Heart Association functional assessment on or before the reporting date; null
      if absent. It may be outside the achievement window. Null when this field does not apply to
      the indicator.
  - name: latest_medication_review_date
    description: >-
      Latest general, heart failure or structured medication review on or before the reporting date;
      null if absent. It may be outside the achievement window. Null when this field does not apply
      to the indicator.
  - name: latest_health_action_plan_date
    description: >-
      Latest learning disability health action plan on or before the reporting date; null if absent.
      It may be outside the achievement window. Null when this field does not apply to the
      indicator.
  - name: has_ethnicity_recorded
    description: >-
      True when the ethnicity category at the reporting date is known. Missing, unknown and
      not-stated ethnicity give false. Null when this field does not apply to the indicator.
  - name: diagnosis_date
    description: "Diagnosis date used to assess the indicator, as defined in the model description."
  - name: latest_record_date
    description: >-
      Supporting evidence date for the indicator. Its meaning follows the individual measure; a date
      alone does not prove achievement.
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  - name: first_invitation_date
    description: >-
      First cancer review invitation from diagnosis day to 3 months afterwards, including both
      boundaries; null if absent. Null when this field does not apply to the indicator.
  - name: last_invitation_date
    description: >-
      Last cancer review invitation from diagnosis day to 3 months afterwards, including both
      boundaries; null if absent. Null when this field does not apply to the indicator.
  - name: is_excluded_invitation_non_response
    description: >-
      Always false for retained rows. People with two invitations at least 7 days apart and no
      review after the first invitation by the reporting date are excluded. Null when this field
      does not apply to the indicator.
