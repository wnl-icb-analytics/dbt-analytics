models:
- name: fct_person_depression_review_ind104_by_month
  description: >-
    Review 10 to 35 days after a new depression diagnosis (NICE IND104). One row per person in
    the denominator at each month-end.


    People registered at the month-end aged 18 or over with a latest first or new depression
    episode in the rolling 12 months ending 35 days before the month-end. This replaces NICE's
    financial-year cohort so reviews can finish. Missing episode type means new. Achieved with a
    review 10 to 35 days after diagnosis. No personalised care adjustments are applied.
    Recalculated for each of the last 60 month-ends with current rules, code lists and records,
    so later corrections can change past months. Based on NICE NG222. Code lists: DEPR_COD,
    DEPRVW_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind104
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: >-
      Start of the 12-month diagnosis cohort ending 35 days before the reporting date. Diagnoses on
      the start date are excluded.
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice at the reporting month-end."
  - name: diagnosis_date
    description: "Latest first or new depression diagnosis known by the reporting date within the eligible diagnosis cohort."
  - name: latest_review_date
    description: "First depression review from 10 to 35 days after diagnosis, inclusive; null if absent."
  - name: latest_record_date
    description: "First depression review from 10 to 35 days after diagnosis, inclusive; null if absent."
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
