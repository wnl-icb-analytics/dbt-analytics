models:
- name: fct_person_depression_review_ind104_by_month
  description: NICE IND104. One row per eligible person, indicator and completed month-end. Adults aged
    18 and over whose latest first/new depression diagnosis known by month-end is in the financial year
    beginning 1 April. Review interval is [diagnosis plus 10 days, min(diagnosis plus 35 days, month-end)].
    People enter immediately without a grace period. The first qualifying review is reported. Resolution
    does not remove this diagnosis cohort. Recalculated at monthly refresh for the last 60 completed month-ends
    using today's rules and code lists. Registration and practice come from the existing monthly spine.
    Registration start is inclusive, end and death dates exclusive. Overlapping registrations retain the
    spine's current-registration priority. Birth and death dates are approximate; missing birth dates
    prevent historical active rows. Current gender and test flags apply retrospectively. Diagnosis state
    uses both clinical and recorded dates. Other evidence uses its clinical or order date through the
    month-end. Later corrections and current code-list changes can alter earlier results.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind104
  columns:
  - name: person_id
    description: Person in the indicator denominator
  - name: indicator_id
    description: NICE indicator identifier
  - name: indicator_name
    description: Published NICE indicator name
  - name: reporting_date
    description: Completed month-end at which eligibility and evidence are assessed. DATE; no current-day
      row.
  - name: measurement_period_start
    description: Inclusive start of the measurement period before the reporting date
  - name: age
    description: Completed years at the month-end, calculated from the approximate birth month.
  - name: condition_name
    description: Population defining the indicator
  - name: practice_code
    description: ODS practice code at the month-end under the monthly spine attribution.
  - name: practice_name
    description: Practice name at the month-end under the monthly spine attribution.
  - name: diagnosis_date
    description: Clinical date of the latest first/new diagnosis known by month-end, within the current financial year.
  - name: latest_review_date
    description: First depression review from 10 to 35 days after diagnosis, capped at the month-end. Null when none qualifies.
  - name: latest_record_date
    description: Same first qualifying review date as latest_review_date. Null when none qualifies.
  - name: is_in_denominator
    description: Always true; every row is an eligible person before personalised care adjustments
  - name: is_in_numerator
    description: Whether the person meets the indicator on the reporting date
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
