models:
- name: fct_person_heart_failure_review_ind195_by_month
  description: >-
    Heart failure review with function and medicines assessments (NICE IND195). One row per
    person in the denominator at each month-end.


    People registered at the month-end on the heart failure register. Achieved with a heart
    failure review, a New York Heart Association functional assessment and a medication review
    in the 12 months before the month-end. General, heart failure and structured medication
    reviews count. Dates can differ. No personalised care adjustments are applied. Recalculated
    for each of the last 60 month-ends with current rules, code lists and records, so later
    corrections can change past months. Based on NICE NG106. Code lists: HF_COD, HFRVW_COD,
    NYHA_COD, HFMEDRVW_COD, MEDRVW_COD, STRUCTMEDRVW_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind195
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "12 months before the reporting date, included in each review window."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice at the reporting month-end."
  - name: latest_review_date
    description: >-
      Latest review, care plan or health check on or before the reporting date; null if absent. It
      may be outside the achievement window.
  - name: latest_nyha_date
    description: >-
      Latest New York Heart Association functional assessment on or before the reporting date; null
      if absent. It may be outside the achievement window.
  - name: latest_medication_review_date
    description: >-
      Latest general, heart failure or structured medication review on or before the reporting date;
      null if absent. It may be outside the achievement window.
  - name: latest_record_date
    description: >-
      Latest review or health check in the 12-month window; null if absent. A date does not prove
      the other numerator components are met.
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
