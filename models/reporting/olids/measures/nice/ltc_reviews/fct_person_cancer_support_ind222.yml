models:
- name: fct_person_cancer_support_ind222
  description: Cancer support discussion. One row per registered, living, non-test cancer register member
    with a new diagnosis in the preceding 12 months, assessed at the build date R. Latest cancer diagnosis
    known by R in (R - 12 months, R]. Non-melanoma skin cancer is outside the register. CANCER_SUPPORT_COD
    between diagnosis and three calendar months after it, capped at R, qualifies. A cancer care review
    alone does not qualify. People with an incomplete follow-up window remain eligible. Personalised care
    adjustments are not applied.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind222
      indicator:
        id: IND222
        type: MEASURE
        category: REVIEW
        clinical_domain: Cancer
        name_short: 'Cancer: discussion of primary care support within 3 months'
        description_short: Latest cancer diagnosis known by R in (R - 12 months, R]. Non-melanoma skin
          cancer is outside the register. CANCER_SUPPORT_COD between diagnosis and three calendar months
          after it, capped at R, qualifies. A cancer care review alone does not qualify. People with an
          incomplete follow-up window remain eligible. Personalised care adjustments are not applied.
        description_long: Cancer support discussion. One row per registered, living, non-test cancer register
          member with a new diagnosis in the preceding 12 months at R. Latest cancer diagnosis known by
          R in (R - 12 months, R]. Non-melanoma skin cancer is outside the register. CANCER_SUPPORT_COD
          between diagnosis and three calendar months after it, capped at R, qualifies. A cancer care
          review alone does not qualify. People with an incomplete follow-up window remain eligible. Personalised
          care adjustments are not applied.
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND222
  columns:
  - name: person_id
    description: Person in the indicator denominator.
    data_tests:
    - not_null
    - unique
  - name: indicator_id
    description: NICE indicator identifier.
  - name: indicator_name
    description: Published indicator subject.
  - name: reporting_date
    description: Evaluation date R, the build date.
  - name: measurement_period_start
    description: Exclusive lower boundary of the rolling eligibility or review window.
  - name: age
    description: Completed years at R.
  - name: condition_name
    description: Population defining the indicator.
  - name: current_practice_code
    description: ODS code of the registration practice at R.
  - name: current_practice_name
    description: Name of the registration practice at R.
  - name: diagnosis_date
    description: Latest cancer diagnosis known by R; anchors the three-month support window.
  - name: latest_record_date
    description: Latest qualifying evidence date in the specified window; null when no qualifying evidence
      exists.
  - name: is_in_denominator
    description: Always true for each eligible row.
  - name: is_in_numerator
    description: Whether qualifying evidence is present in the specified window.
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD.
