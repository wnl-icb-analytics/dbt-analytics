models:
- name: fct_person_hypertension_nice_indicators
  description: NICE hypertension outcomes for IND121 and IND115. One row per eligible person and indicator
    on the build date. IND121 covers HTN register members over 18 first diagnosed in the financial year
    to date and requires an ACR test within three calendar months either side of diagnosis, capped at
    R. IND115 covers diagnoses from 1 April 2014 and requires any HOMEAMBBP_COD record within three calendar
    months up to diagnosis. Valued and value-free evidence count. Personalised care adjustments are not
    applied.
  config: &id001
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
  columns:
  - name: person_id
    description: Person in the indicator denominator.
  - name: indicator_id
    description: NICE indicator identifier.
  - name: indicator_name
    description: Published NICE indicator name.
  - name: reporting_date
    description: Evaluation date, a DATE.
  - name: measurement_period_start
    description: Inclusive financial-year cohort start for IND121 or inclusive 1 April 2014 cohort start
      for IND115. Evidence windows are relative to diagnosis.
  - name: age
    description: Completed years at R; history uses the approximate birth month.
  - name: condition_name
    description: Population defining the indicator.
  - name: is_in_denominator
    description: Always true. Rows contain eligible people only.
  - name: is_in_numerator
    description: Whether qualifying evidence falls within the indicator window through R.
  - name: indicator_status
    description: ACHIEVED when in the numerator, otherwise NOT_RECORDED_IN_PERIOD.
  - name: diagnosis_date
    description: Earliest hypertension diagnosis at R.
  - name: latest_acr_date
    description: Latest qualifying ACR test date for IND121; null for IND115 or no qualifying test.
  - name: latest_home_ambulatory_bp_date
    description: Latest qualifying monitoring date for IND115; null for IND121 or no qualifying record.
  - name: current_practice_code
    description: Practice ODS code at R.
  - name: current_practice_name
    description: Practice name at R.
- name: fct_person_hypertension_nice_indicators_by_month
  description: NICE hypertension outcomes for IND121 and IND115. One row per eligible person and indicator
    and completed month-end. Recalculated monthly for the last 60 completed month-ends using current rules
    and code lists. Registration and practice use the monthly spine, with start inclusive and end and
    death exclusive. Overlaps retain its current-registration priority. Birth and death dates are approximate;
    missing birth dates prevent historical active rows. Current gender and test flags apply retrospectively.
    Registers use clinical and recorded dates known by month-end. Other evidence uses corrected clinical
    dates through month-end. Later corrections and code-list changes can alter earlier results. IND121
    covers HTN register members over 18 first diagnosed in the financial year to date and requires an
    ACR test within three calendar months either side of diagnosis, capped at R. IND115 covers diagnoses
    from 1 April 2014 and requires any HOMEAMBBP_COD record within three calendar months up to diagnosis.
    Valued and value-free evidence count. Personalised care adjustments are not applied.
  config: *id001
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
        - reporting_date
  columns:
  - name: person_id
    description: Person in the indicator denominator.
  - name: indicator_id
    description: NICE indicator identifier.
  - name: indicator_name
    description: Published NICE indicator name.
  - name: reporting_date
    description: Evaluation date, a DATE.
  - name: measurement_period_start
    description: Inclusive financial-year cohort start for IND121 or inclusive 1 April 2014 cohort start
      for IND115. Evidence windows are relative to diagnosis.
  - name: age
    description: Completed years at R; history uses the approximate birth month.
  - name: condition_name
    description: Population defining the indicator.
  - name: is_in_denominator
    description: Always true. Rows contain eligible people only.
  - name: is_in_numerator
    description: Whether qualifying evidence falls within the indicator window through R.
  - name: indicator_status
    description: ACHIEVED when in the numerator, otherwise NOT_RECORDED_IN_PERIOD.
  - name: diagnosis_date
    description: Earliest hypertension diagnosis at R.
  - name: latest_acr_date
    description: Latest qualifying ACR test date for IND121; null for IND115 or no qualifying test.
  - name: latest_home_ambulatory_bp_date
    description: Latest qualifying monitoring date for IND115; null for IND121 or no qualifying record.
  - name: practice_code
    description: Practice ODS code at R.
  - name: practice_name
    description: Practice name at R.
- name: fct_person_hypertension_nice_indicators_snapshot_input
  description: NICE hypertension outcomes for IND121 and IND115. One row per eligible person and indicator
    on the build date. Snapshot input retains diagnosis, qualifying evidence, current practice and outcome;
    advancing dates are omitted. IND121 covers HTN register members over 18 first diagnosed in the financial
    year to date and requires an ACR test within three calendar months either side of diagnosis, capped
    at R. IND115 covers diagnoses from 1 April 2014 and requires any HOMEAMBBP_COD record within three
