models:
- name: fct_person_urine_acr_hypertension_ind121
  description: >-
    Urine albumin-to-creatinine ratio testing after hypertension diagnosis (NICE IND121). One
    row per person in the denominator on the build date.


    People registered on the build date aged over 18 on the hypertension register, first
    diagnosed 3 to 15 months before the build date. This rolling annual cohort replaces NICE's
    annual diagnosis period and allows follow-up to finish. Achieved with a urine
    albumin-to-creatinine ratio test within 3 calendar months before or after diagnosis. A
    numeric result is not required. No personalised care adjustments are applied. Based on NICE
    NG136. Code lists: NDAALB_COD, HYP_COD, HYPRES_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind121
      indicator:
        id: IND121
        type: MEASURE
        category: CARDIOVASCULAR
        clinical_domain: Cardiometabolic
        name_short: "Hypertension urine albumin test"
        description_short: "Urine albumin-to-creatinine ratio testing around a new hypertension diagnosis"
        description_long: >-
          People registered on the build date aged over 18 on the hypertension register, first
          diagnosed 3 to 15 months before the build date. This rolling annual cohort replaces
          NICE's annual diagnosis period and allows follow-up to finish. Achieved with a urine
          albumin-to-creatinine ratio test within 3 calendar months before or after diagnosis. A
          numeric result is not required. No personalised care adjustments are applied. Based on
          NICE NG136. Code lists: NDAALB_COD, HYP_COD, HYPRES_COD (PCD).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND121
  data_tests: []
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
    data_tests:
    - not_null
    - unique
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Build date used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Exclusive start of the diagnosis cohort, 15 months before the reporting date. The test window is relative to diagnosis."
  - name: age
    description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: is_in_denominator
    description: "Always true; each row is eligible before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
  - name: current_practice_code
    description: "ODS code of the current registration practice."
  - name: current_practice_name
    description: "Name of the current registration practice."
  - name: diagnosis_date
    description: "Earliest hypertension diagnosis known on the reporting date."
  - name: latest_acr_date
    description: "Latest urine albumin-to-creatinine ratio test date within 3 months before or after diagnosis; null when absent."
