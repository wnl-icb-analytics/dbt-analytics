models:
- name: fct_person_urine_acr_hypertension_ind121_by_month
  description: >-
    Urine ACR in hypertension (NICE IND121). One row per active, living, non-test HTN register member
    aged over 18 whose earliest hypertension diagnosis is in the financial year to date, from 1 April
    through R inclusive. Achievement requires an ACR test from three calendar months before diagnosis
    through the earlier of three months after diagnosis and R, inclusive. Uses the existing ACR
    classification within PCD NDAALB_COD; a numeric result is not required. Hypertension membership uses
    HYP_COD and HYPRES_COD. No grace period or personalised care adjustments apply. Recalculated monthly
    for the last 60 completed month-ends using current rules and code lists. Registration and practice
    use the monthly spine, with start inclusive and end and death exclusive. Overlaps retain its
    current-registration priority. Birth and death dates are approximate; missing birth dates prevent
    historical active rows. Current gender and test flags apply retrospectively. Registers use clinical
    and recorded dates known by month-end. Other evidence uses corrected clinical dates through
    month-end. Later corrections and code-list changes can alter earlier results.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind121
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: person_id
    description: Person in the indicator denominator.
  - name: indicator_id
    description: NICE indicator identifier.
  - name: indicator_name
    description: Published NICE indicator name.
  - name: reporting_date
    description: Evaluation date, a DATE.
  - name: measurement_period_start
    description: Inclusive 1 April start of the financial year containing R. The ACR evidence window is
      relative to diagnosis.
  - name: age
    description: Completed years at R; history uses the approximate birth month.
  - name: condition_name
    description: Population defining the indicator.
  - name: is_in_denominator
    description: Always true. Rows contain eligible people only.
  - name: is_in_numerator
    description: Whether qualifying evidence falls within the indicator window through R.
  - name: indicator_status
    description: ACHIEVED when in the numerator, otherwise NOT_RECORDED_IN_PERIOD.
  - name: practice_code
    description: Practice ODS code at R under the established population attribution.
  - name: practice_name
    description: Practice name at R under the established population attribution.
  - name: diagnosis_date
    description: Earliest hypertension diagnosis date on the register at R; monthly anchors must be known
      by R.
  - name: latest_acr_date
    description: Latest qualifying ACR test date within the diagnosis window and through R; null when
      none.
