models:
- name: fct_person_haematuria_test_hypertension_ind122_by_month
  description: Haematuria test in hypertension (NICE IND122). One row per person and month-end on the
    active, living, non-test HTN register, at any age, with earliest diagnosis in the financial year
    to date. Evidence is dated from three calendar months before diagnosis through the earlier of three
    months after diagnosis and R, inclusive. Uses ECL_CACHE URINE_BLOOD_TEST_COD, URINE_DIPSTICK_COD or URINALYSIS_RESULT_COD.
    Blood-specific evidence includes negative and trace results, red-cell microscopy and microscopic haematuria
    findings. Generic dipstick findings and method-unspecified urinalysis results also count, but do not prove
    the blood analyte. Blood-specific
    codes do not always encode the test method. Symptom-only haematuria, requests, declines and generic
    urinalysis headings are excluded by the lists. No grace period or personalised care adjustments apply.
    Recalculated for
    the last 60 completed month-ends. Registration and practice use the monthly spine; birth and death
    dates are approximate. Current gender and test flags apply retrospectively. Hypertension diagnosis
    and resolution must be known by month-end. Other evidence uses corrected clinical dates through R.
    Later corrections and code-list changes can alter earlier results.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind122
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: person_id
    description: Person in the indicator denominator.
  - name: indicator_id
    description: NICE indicator identifier.
  - name: indicator_name
    description: Published NICE indicator name.
  - name: reporting_date
    description: Evaluation date, a DATE.
  - name: measurement_period_start
    description: Inclusive 1 April start of the financial year containing R. Evidence windows are relative
      to diagnosis.
  - name: age
    description: Completed years at R; history uses the approximate birth month.
  - name: condition_name
    description: Population defining the indicator.
  - name: is_in_denominator
    description: Always true. Rows contain eligible people only.
  - name: is_in_numerator
    description: Whether qualifying evidence falls within the indicator window through R.
  - name: indicator_status
    description: ACHIEVED when in the numerator, otherwise NOT_RECORDED_IN_PERIOD.
  - name: practice_code
    description: Practice ODS code at R under the established population attribution.
  - name: practice_name
    description: Practice name at R under the established population attribution.
  - name: diagnosis_date
    description: Earliest hypertension diagnosis date on the register at R; monthly anchors must be known
      by R.
  - name: latest_haematuria_test_date
    description: Latest qualifying haematuria test date within the diagnosis window and through R; null
      when none.
  - name: has_blood_specific_test
    description: Whether URINE_BLOOD_TEST_COD evidence occurs in the same diagnosis window through R;
      false when absent. Generic dipstick and urinalysis result records do not set this flag; true does not prove the reagent-strip
      method.
