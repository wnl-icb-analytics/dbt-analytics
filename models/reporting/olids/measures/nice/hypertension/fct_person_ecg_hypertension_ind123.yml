models:
- name: fct_person_ecg_hypertension_ind123
  description: >-
    Resting ECG recording after hypertension diagnosis (NICE IND123). One row per person in the
    denominator on the build date.


    People registered on the build date of any age on the hypertension register, first diagnosed
    3 to 15 months before the build date. This rolling annual cohort replaces NICE's annual
    diagnosis period and allows follow-up to finish. Achieved with a resting ECG within 3
    calendar months before or after diagnosis. Generic resting ECGs count without proof of 12
    leads; explicit 12-lead evidence is reported separately. Requests, declines, ambulatory and
    exercise ECGs do not count. No personalised care adjustments are applied. Based on NICE
    NG136. Code lists: ECG_12LEAD_COD, ECG_GENERAL_COD (ECL_CACHE); HYP_COD, HYPRES_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind123
      indicator:
        id: IND123
        type: MEASURE
        category: CARDIOVASCULAR
        clinical_domain: Cardiometabolic
        name_short: "Hypertension ECG"
        description_short: "Resting ECG recording around a new hypertension diagnosis"
        description_long: >-
          People registered on the build date of any age on the hypertension register, first
          diagnosed 3 to 15 months before the build date. This rolling annual cohort replaces
          NICE's annual diagnosis period and allows follow-up to finish. Achieved with a resting
          ECG within 3 calendar months before or after diagnosis. Generic resting ECGs count
          without proof of 12 leads; explicit 12-lead evidence is reported separately. Requests,
          declines, ambulatory and exercise ECGs do not count. No personalised care adjustments
          are applied. Based on NICE NG136. Code lists: ECG_12LEAD_COD, ECG_GENERAL_COD
          (ECL_CACHE); HYP_COD, HYPRES_COD (PCD).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND123
  data_tests: []
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
    data_tests:
    - not_null
    - unique
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: reporting_date
    description: "Build date used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Start of the diagnosis period: 1 April 2014, inclusive, for IND115; 15 months before the reporting date, exclusive, for IND121 to IND123. Test windows are relative to diagnosis."
  - name: age
    description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
  - name: condition_name
    description: "Short label for the population in the indicator denominator."
  - name: is_in_denominator
    description: "Always true; each row is eligible before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
  - name: current_practice_code
    description: "ODS code of the current registration practice."
  - name: current_practice_name
    description: "Name of the current registration practice."
  - name: diagnosis_date
    description: "Earliest hypertension diagnosis known on the reporting date."
  - name: latest_ecg_date
    description: "Latest qualifying resting ECG date within the diagnosis window; null when absent or not applicable to the indicator."
  - name: has_12lead_ecg
    description: "Whether explicit 12-lead ECG evidence is recorded within the diagnosis window. Generic resting ECG records do not set this flag; null for other indicators."
