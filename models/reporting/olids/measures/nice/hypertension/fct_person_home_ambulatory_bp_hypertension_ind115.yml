models:
- name: fct_person_home_ambulatory_bp_hypertension_ind115
  description: >-
    Home or ambulatory blood pressure confirmation (NICE IND115). One row per person in the
    denominator on the build date.


    People registered on the build date of any age on the hypertension register, first diagnosed
    from 1 April 2014. Achieved with home or ambulatory blood pressure monitoring in the 3
    calendar months before diagnosis or on diagnosis day. Readings and procedures without
    numeric values count. No personalised care adjustments are applied. Based on NICE NG136.
    Code lists: HOMEAMBBP_COD, HYP_COD, HYPRES_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind115
      indicator:
        id: IND115
        type: MEASURE
        category: CARDIOVASCULAR
        clinical_domain: Cardiometabolic
        name_short: "Hypertension diagnosis confirmation"
        description_short: "Home or ambulatory blood pressure monitoring before hypertension diagnosis"
        description_long: >-
          People registered on the build date of any age on the hypertension register, first
          diagnosed from 1 April 2014. Achieved with home or ambulatory blood pressure
          monitoring in the 3 calendar months before diagnosis or on diagnosis day. Readings and
          procedures without numeric values count. No personalised care adjustments are applied.
          Based on NICE NG136. Code lists: HOMEAMBBP_COD, HYP_COD, HYPRES_COD (PCD).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND115
  data_tests: []
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
    data_tests:
    - not_null
    - unique
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Build date used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "1 April 2014, the inclusive start of the diagnosis cohort. The monitoring window is relative to diagnosis."
  - name: age
    description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: is_in_denominator
    description: "Always true; each row is eligible before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
  - name: current_practice_code
    description: "ODS code of the current registration practice."
  - name: current_practice_name
    description: "Name of the current registration practice."
  - name: diagnosis_date
    description: "Earliest hypertension diagnosis known on the reporting date."
  - name: latest_home_ambulatory_bp_date
    description: "Latest home or ambulatory blood pressure monitoring date in the 3 months before diagnosis, including diagnosis day; null when absent."
