models:
- name: fct_person_home_ambulatory_bp_hypertension_ind115
  description: >-
    Home or ambulatory BP confirmation in hypertension (NICE IND115). One row per active, living,
    non-test HTN register member whose earliest hypertension diagnosis is on or after 1 April 2014 and
    on or before R, with no age exclusion. Achievement requires any PCD HOMEAMBBP_COD observation from
    three calendar months before diagnosis through diagnosis, inclusive. Valued readings and value-free
    procedures both count. Hypertension membership uses HYP_COD and HYPRES_COD. No personalised care
    adjustments apply. Evaluated on the build date.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind115
      indicator:
        id: IND115
        type: MEASURE
        category: CARDIOVASCULAR
        clinical_domain: Cardiometabolic
        name_short: Hypertension confirmed by home or ambulatory BP
        description_short: Hypertension confirmed by home or ambulatory BP
        description_long: NICE IND115. One row per active, living, non-test HTN register member whose
          earliest hypertension diagnosis is on or after 1 April 2014 and on or before R, with no age
          exclusion. Achievement requires any PCD HOMEAMBBP_COD observation from three calendar months
          before diagnosis through diagnosis, inclusive. Valued readings and value-free procedures both
          count. Hypertension membership uses HYP_COD and HYPRES_COD. No personalised care adjustments
          apply. Evaluated on the build date.
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND115
  data_tests: []
  columns:
  - name: person_id
    description: Person in the indicator denominator.
    data_tests:
    - not_null
    - unique
  - name: indicator_id
    description: NICE indicator identifier.
  - name: indicator_name
    description: Published NICE indicator name.
  - name: reporting_date
    description: Evaluation date, a DATE.
  - name: measurement_period_start
    description: Inclusive 1 April 2014 diagnosis cohort boundary. The monitoring evidence window is relative
      to diagnosis.
  - name: age
    description: Completed years at R; history uses the approximate birth month.
  - name: condition_name
    description: Population defining the indicator.
  - name: is_in_denominator
    description: Always true. Rows contain eligible people only.
  - name: is_in_numerator
    description: Whether qualifying evidence falls within the indicator window through R.
  - name: indicator_status
    description: ACHIEVED when in the numerator, otherwise NOT_RECORDED_IN_PERIOD.
  - name: current_practice_code
    description: Practice ODS code at R under the established population attribution.
  - name: current_practice_name
    description: Practice name at R under the established population attribution.
  - name: diagnosis_date
    description: Earliest hypertension diagnosis date on the register at R; monthly anchors must be known
      by R.
  - name: latest_home_ambulatory_bp_date
    description: Latest qualifying home or ambulatory BP record date in the diagnosis window; null when
      none.
