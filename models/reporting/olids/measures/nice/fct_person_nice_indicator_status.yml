      - name: indicator_name
        description: >-
          Published NICE indicator title.
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: clinical_domain
        description: Clinical domain from the indicator catalogue classification.
      - name: clinical_subdomain
        description: Condition name or clinical topic from the indicator catalogue classification.
      - name: reporting_date
        description: >-
          Build date on which eligibility and evidence are assessed.
      - name: measurement_period_start
        description: >-
          Start date of the indicator's assessment period. Its duration and whether this
          boundary is included depend on the indicator.
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded.
      - name: current_practice_code
        description: ODS code of the current registration practice.
      - name: current_practice_name
        description: Name of the current registration practice.
      - name: is_in_denominator
        description: >-
          Always true. The person meets the population rules before personalised care
          adjustments.
      - name: is_in_numerator
        description: >-
          Whether the person meets the achievement rule on the reporting date.
      - name: indicator_status
        description: >-
          ACHIEVED means the person meets the achievement rule. Other values describe why
          they do not: ABOVE_TARGET, NOT_RECORDED_IN_PERIOD, NOT_ASSESSABLE,
          NOT_TREATED_IN_PERIOD, NEVER_TREATED, VKA_WITHOUT_DOAC_EXCEPTION,
          DOAC_WHERE_VKA_INDICATED or OUT_OF_RANGE. The indicator definition explains
          which reasons apply.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: &nice_indicator_status_values
                  - ACHIEVED
                  - ABOVE_TARGET
                  - NOT_RECORDED_IN_PERIOD
                  - NOT_ASSESSABLE
                  - NOT_TREATED_IN_PERIOD
                  - NEVER_TREATED
                  - VKA_WITHOUT_DOAC_EXCEPTION
                  - DOAC_WHERE_VKA_INDICATED
                  - OUT_OF_RANGE

  - name: fct_person_nice_indicator_status_by_month
    description: >-
      Monthly NICE indicator results. One row per eligible person, indicator and completed
      month-end.


      People must be registered, living and non-test at month-end and meet each indicator's
      population rules. Includes achieved and unachieved results; personalised care
      adjustments are not applied. Individual measures and family tables supply readings,
      thresholds, exclusions and code lists. Measures supply the published indicator statement
      and denominator label. The indicator catalogue supplies clinical classifications.
      Birth and death dates are approximate; missing birth dates exclude
      historical rows. Current gender and test flags apply retrospectively. Recalculated for
      each of the last 60 month-ends with current rules, code lists and records, so later
      corrections can change past months.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
              - reporting_date
    columns:
      - name: person_id
        description: Person in the indicator denominator at month-end.
      - name: indicator_id
        description: >-
          NICE indicator identifier used in the indicator catalogue.
        data_tests:
          - accepted_values:
              arguments:
                values: *nice_indicator_ids
      - name: indicator_name
        description: >-
          Published NICE indicator title.
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: clinical_domain
        description: Clinical domain from the current indicator catalogue classification.
      - name: clinical_subdomain
        description: Condition name or clinical topic from the current indicator catalogue classification.
      - name: reporting_date
        description: >-
          Completed month-end on which eligibility and evidence are assessed.
      - name: measurement_period_start
        description: >-
          Start date of the indicator's assessment period. Its duration and whether this
          boundary is included depend on the indicator.
      - name: age
        description: >-
          Age in completed years on the reporting date, calculated from the approximate
          birth month.
      - name: practice_code
        description: ODS code of the registration practice attributed at month-end.
      - name: practice_name
        description: Name of the registration practice attributed at month-end.
      - name: is_in_denominator
        description: >-
          Always true. The person meets the population rules before personalised care
          adjustments.
      - name: is_in_numerator
        description: >-
          Whether the person meets the achievement rule on the reporting date.
      - name: indicator_status
        description: >-
          ACHIEVED means the person meets the achievement rule. Other values describe why
          they do not: ABOVE_TARGET, NOT_RECORDED_IN_PERIOD, NOT_ASSESSABLE,
          NOT_TREATED_IN_PERIOD, NEVER_TREATED, VKA_WITHOUT_DOAC_EXCEPTION,
          DOAC_WHERE_VKA_INDICATED or OUT_OF_RANGE. The indicator definition explains
          which reasons apply.
        data_tests:
          - accepted_values:
              arguments:
                values: *nice_indicator_status_values
