models:
  - name: fct_person_nice_indicator_status
    description: >-
      Current NICE indicator results. One row per person and indicator in the denominator on
      the build date.


      People must be currently registered, living and non-test and meet each indicator's
      population rules. Includes achieved and unachieved results; personalised care
      adjustments are not applied. Individual measures and family tables supply readings,
      thresholds, exclusions and code lists. Measures supply the published indicator statement
      and denominator label. The indicator catalogue supplies clinical classifications.
      Reports counting individual care processes are outside this table.
      Shared measure columns are person_id, indicator_id, indicator_name,
      indicator_description, denominator_description, reporting_date,
      measurement_period_start, age, practice, is_in_denominator, is_in_numerator
      and indicator_status.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: >-
          Person in the indicator denominator on the build date.
        data_tests:
          - not_null
      - name: indicator_id
        description: >-
          NICE indicator identifier used in the indicator catalogue.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: &nice_indicator_ids
