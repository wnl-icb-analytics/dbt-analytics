models:
  - name: fct_person_shingles_vaccination_ind219
    description: >-
      Shingles vaccination by age 75 (NICE IND219). One row per person in the denominator on the
      build date.


      People registered on the build date whose approximate 75th birthday fell in the 12 months
      before the build date. Achieved with shingles vaccination between approximate 70th and
      75th birthdays. Immunosuppression uses the current autumn COVID campaign definition,
      assessed by its audit-end date, and excludes people with any immunosuppressive diagnosis,
      or treatment or chemotherapy in the preceding 6 months, or an immunosuppressive procedure
      in the preceding 3 years. This substitutes for a shingles-specific definition. NICE's
      anaphylaxis exclusion is not applied. No personalised care adjustments are applied. Based
      on the NICE Shingles clinical knowledge summary. Code lists: SHVACGP_COD, SHVACOHP_COD,
      SHVACGP1_COD, SHVACGP2_COD (PCD); IMMDX_COV_COD, IMMRX_COD, IMM_ADM_COD, DXT_CHEMO_COD
      (UKHSA_COVID).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind219
        indicator:
          id: "IND219"
          type: "MEASURE"
          category: "IMMUNISATION"
          clinical_domain: "Prevention"
          name_short: "Shingles vaccination by age 75"
          description_short: "Shingles vaccination by age 75."
          description_long: >-
            People registered on the build date whose approximate 75th birthday fell in the 12
            months before the build date. Achieved with shingles vaccination between approximate
            70th and 75th birthdays. Immunosuppression uses the current autumn COVID campaign
            definition, assessed by its audit-end date, and excludes people with any
            immunosuppressive diagnosis, or treatment or chemotherapy in the preceding 6 months,
            or an immunosuppressive procedure in the preceding 3 years. This substitutes for a
            shingles-specific definition. NICE's anaphylaxis exclusion is not applied. No
            personalised care adjustments are applied. Based on the NICE Shingles clinical
            knowledge summary. Code lists: SHVACGP_COD, SHVACOHP_COD, SHVACGP1_COD, SHVACGP2_COD
            (PCD); IMMDX_COV_COD, IMMRX_COD, IMM_ADM_COD, DXT_CHEMO_COD (UKHSA_COVID).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND219"
    columns:
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "NICE indicator identifier."
      - name: indicator_name
        description: "NICE published indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: reporting_date
        description: "Build date used to assess eligibility and achievement."
      - name: measurement_period_start
        description: "Exclusive start of the 12-month milestone cohort."
      - name: age
        description: "Age in completed years on the reporting date; null when the birth date is missing."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: current_practice_code
        description: "ODS code of the registration practice on the build date."
      - name: current_practice_name
        description: "Name of the registration practice on the build date."
      - name: seventy_fifth_birthday
        description: "Approximate 75th birthday in the 12-month eligibility window."
      - name: first_dose_70_to_75_date
        description: "Earliest shingles vaccination between the approximate 70th and 75th birthdays, including both dates; null when none."
      - name: latest_record_date
        description: "Earliest shingles vaccination between the approximate 70th and 75th birthdays, including both dates; null when none."
      - name: is_in_denominator
        description: "Always true; each row meets the documented eligibility and exclusion rules."
      - name: is_in_numerator
        description: "Whether the person meets the documented achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."

  - name: fct_person_shingles_vaccination_ind219_snapshot_input
    description: >-
      NICE shingles vaccination results. One row per person and indicator.


      Includes IND219, with the eligibility, exclusions and achievement rules documented for
      each indicator. Records achievement and evidence used to track changes in clinical
      results.
      Labels join from def_indicator or the measure tables by indicator_id.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - unique
          - not_null
      - name: current_practice_code
        description: "ODS code of the registration practice on the build date."
      - name: is_in_numerator
        description: "Whether the person meets the documented achievement rule on the build date."
      - name: indicator_status
        description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
      - name: first_dose_70_to_75_date
        description: "Earliest shingles vaccination between the approximate 70th and 75th birthdays, including both dates; null when none."
