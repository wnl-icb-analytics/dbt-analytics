models:
- name: fct_person_shingles_vaccination_ind219_by_month
  description: >-
    Shingles vaccination by age 75 (NICE IND219). One row per person in the denominator at each
    month-end.


    People registered at the month-end whose approximate 75th birthday fell in the 12 months
    before the month-end. Achieved with shingles vaccination between approximate 70th and 75th
    birthdays. Immunosuppression uses the current autumn COVID campaign definition, assessed by
    its audit-end date, and excludes people with any immunosuppressive diagnosis, or treatment
    or chemotherapy in the preceding 6 months, or an immunosuppressive procedure in the
    preceding 3 years. This substitutes for a shingles-specific definition. NICE's anaphylaxis
    exclusion is not applied. No personalised care adjustments are applied. Recalculated for
    each of the last 60 month-ends with current rules, code lists and records, so later
    corrections can change past months. Based on the NICE Shingles clinical knowledge summary.
    Code lists: SHVACGP_COD, SHVACOHP_COD, SHVACGP1_COD, SHVACGP2_COD (PCD); IMMDX_COV_COD,
    IMMRX_COD, IMM_ADM_COD, DXT_CHEMO_COD (UKHSA_COVID).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind219
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "NICE published indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Exclusive start of the 12-month milestone cohort."
  - name: age
    description: "Age in completed years on the reporting date; null when the birth date is missing."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
  - name: seventy_fifth_birthday
    description: "Approximate 75th birthday in the 12-month eligibility window."
  - name: first_dose_70_to_75_date
    description: "Earliest shingles vaccination between the approximate 70th and 75th birthdays, including both dates; null when none."
  - name: latest_record_date
    description: "Earliest shingles vaccination between the approximate 70th and 75th birthdays, including both dates; null when none."
  - name: is_in_denominator
    description: "Always true; each row meets the documented eligibility and exclusion rules."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
