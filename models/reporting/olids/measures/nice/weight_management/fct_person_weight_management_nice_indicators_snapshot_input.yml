models:
- name: fct_person_weight_management_nice_indicators_snapshot_input
  description: >-
    Weight management NICE indicator evidence for change history (IND319,
    IND320). One row per person and indicator in the build-date denominator.


    Retains practice, recorded evidence and achievement. Build-date fields are omitted so a
    daily date change alone does not create a new history version. No personalised care
    adjustments are applied.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
  columns:
  - name: person_id
    description: "Person identifier for someone in the indicator denominator."
  - name: indicator_id
    description: "Published NICE indicator identifier."
  - name: current_practice_code
    description: "ODS code of the current registration practice."
  - name: latest_bmi_date
    description: "Date of the latest valid recorded or calculated BMI in the 12 months before the reporting date, excluding the first day."
  - name: bmi_value
    description: "Body mass index in kg/m2."
  - name: is_recorded_white
    description: "Whether ethnicity is recorded as White on the reporting date. False includes missing or unknown ethnicity."
  - name: bmi_lower_threshold
    description: "Inclusive lower BMI threshold in kg/m2 for IND319: 25 if ethnicity is recorded as White, otherwise 23."
  - name: bmi_upper_threshold
    description: "Inclusive upper BMI threshold in kg/m2 for IND319: 29.9 if ethnicity is recorded as White, otherwise 27.4."
  - name: latest_weight_advice_date
    description: "Latest weight management advice from the selected measured BMI date to 90 days afterwards, inclusive, by the reporting date; null when none is recorded."
  - name: latest_record_date
    description: "Evidence date retained by the indicator; see each measure for its test, referral or treatment rule. Null when no qualifying evidence is retained."
  - name: is_in_numerator
    description: "Whether the person meets the indicator achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
