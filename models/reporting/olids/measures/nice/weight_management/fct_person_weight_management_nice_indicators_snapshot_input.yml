models:
- name: fct_person_weight_management_nice_indicators_snapshot_input
  description: Snapshot evidence for NICE weight management indicators. One row per eligible person and
    indicator; excludes advancing build-date fields.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
  columns:
  - name: person_id
    description: Person in the indicator denominator at R.
  - name: indicator_id
    description: Published NICE indicator identifier.
  - name: current_practice_code
    description: Current registration practice ODS code.
  - name: latest_bmi_date
    description: IND319 latest measured BMI in 12 months; IND320 latest valid recorded or calculated BMI
      through R, including older evidence.
  - name: bmi_value
    description: IND319 measured BMI in kg/m^2; null for IND320.
  - name: is_recorded_white
    description: Ethnicity is White in the demographic interval containing R, start inclusive and end
      exclusive. False includes missing and unknown ethnicity; null for IND320 in family outputs.
  - name: bmi_lower_threshold
    description: 'IND319 inclusive lower threshold in kg/m^2: 25 if White recorded, otherwise 23. Null
      for IND320.'
  - name: bmi_upper_threshold
    description: 'IND319 inclusive upper threshold in kg/m^2: 29.9 if White recorded, otherwise 27.4.
      Null for IND320.'
  - name: latest_weight_advice_date
    description: IND319 latest WTMGINT_COD advice from BMI date through day 90 inclusive, capped at R.
      Null for IND320.
  - name: latest_record_date
    description: Qualifying advice date for IND319 or qualifying BMI date for IND320; null without evidence
      in the relevant window.
  - name: is_in_numerator
    description: Whether the achievement rule is met at R.
  - name: indicator_status
    description: ACHIEVED or the accepted reason the rule is not met.
  - name: bmi_source
    description: Recorded BMI or calculated from weight and contributing height.
  - name: requires_lower_bmi_thresholds
    description: Higher-risk ethnicity known at R uses the shared NG246 lower thresholds. Unknown ethnicity
      uses standard thresholds.
  - name: bmi_category
    description: Shared ethnicity-adjusted obese class at R.
  - name: timely_referral_date
    description: Latest referral within 0 to 90 days inclusive after any qualifying BMI in the year, capped
      at R.
  - name: timely_offer_date
    description: Latest offer within the qualifying BMI follow-up window.
  - name: timely_decline_date
    description: Latest declined referral within the qualifying BMI follow-up window.
  - name: latest_referral_date
    description: Latest weight management referral in (R minus 24 months, R].
  - name: latest_attendance_date
    description: Latest attendance or commencement in (R minus twelve months, R].
  - name: latest_end_date
    description: Latest programme end in (R minus 24 months, R]; only ends later than attendance cancel
      the attendance proxy.
  - name: has_previous_referral
    description: Referral in the preceding 24 months. IND220 excludes only non-achievers with this flag.
  - name: is_currently_attending
    description: Attendance in the preceding twelve months with no later programme end. Both measures
      exclude only non-achievers with this flag.
  - name: has_hypertension
    description: Register membership for IND221; null for other indicators.
  - name: has_diabetes
    description: Register membership for IND221; null for other indicators.
