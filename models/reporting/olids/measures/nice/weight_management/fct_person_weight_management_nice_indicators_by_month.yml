models:
- name: fct_person_weight_management_nice_indicators_by_month
  description: >-
    Weight management NICE indicator results (IND220, IND221, IND319, IND320). One row per
    person, indicator and month-end.


    Each indicator uses its own denominator, evidence window and exclusions, described in the
    member measures. Clinical fields are null where they do not apply to an indicator. No
    personalised care adjustments are applied. Recalculated for each of the last 60 month-ends
    with current rules, code lists and records, so later corrections can change past months.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
        - reporting_date
  columns:
  - name: person_id
    description: "Person identifier for someone in the indicator denominator."
  - name: indicator_id
    description: "Published NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess the population, age and evidence."
  - name: measurement_period_start
    description: "Start date of the indicator measurement or diagnosis cohort period; inclusion of this date depends on the indicator."
  - name: age
    description: "Completed years on the month-end, based on the approximate birth date; null when age is unknown."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: latest_bmi_date
    description: "Latest BMI date retained by the indicator. IND319 uses measured BMI; IND220, IND221 and IND320 allow calculated BMI. For IND320 this can be outside the 12-month window; null when no valid BMI is recorded."
  - name: bmi_value
    description: "Body mass index in kg/m2. Null where the field does not apply to an indicator."
  - name: is_recorded_white
    description: "Whether ethnicity is recorded as White on the reporting date. False includes missing or unknown ethnicity. Null where the field does not apply to an indicator."
  - name: bmi_lower_threshold
    description: "Inclusive lower BMI threshold in kg/m2 for IND319: 25 if ethnicity is recorded as White, otherwise 23. Null where the field does not apply to an indicator."
  - name: bmi_upper_threshold
    description: "Inclusive upper BMI threshold in kg/m2 for IND319: 29.9 if ethnicity is recorded as White, otherwise 27.4. Null where the field does not apply to an indicator."
  - name: latest_weight_advice_date
    description: "Latest weight management advice from the selected measured BMI date to 90 days afterwards, inclusive, by the reporting date; null when none is recorded. Null where the field does not apply to an indicator."
  - name: latest_record_date
    description: "Evidence date retained by the indicator; see each measure for its test, referral or treatment rule. Null when no qualifying evidence is retained."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
  - name: is_in_denominator
    description: "Always true. Every row belongs to the denominator before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the indicator achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
  - name: bmi_source
    description: "Whether BMI was recorded directly or calculated from weight and height. Null where the field does not apply to an indicator."
  - name: requires_lower_bmi_thresholds
    description: "Whether any higher-risk ethnicity was recorded by the reporting date, even if followed by a White record. Uses the lower NG246 BMI thresholds; unknown ethnicity uses standard thresholds. Null where the field does not apply to an indicator."
  - name: bmi_category
    description: "Obesity class after applying the ethnicity thresholds used by the indicator. Null where the field does not apply to an indicator."
  - name: timely_referral_date
    description: "Latest weight management referral from any qualifying BMI date to 90 days afterwards, inclusive, by the reporting date; null when none is recorded. Null where the field does not apply to an indicator."
  - name: timely_offer_date
    description: "Latest weight management referral offer from any qualifying BMI date to 90 days afterwards, inclusive, by the reporting date; null when none is recorded. Null where the field does not apply to an indicator."
  - name: timely_decline_date
    description: "Latest declined weight management referral from any qualifying BMI date to 90 days afterwards, inclusive, by the reporting date; null when none is recorded. Null where the field does not apply to an indicator."
  - name: latest_referral_date
    description: "Latest weight management referral in the last 24 months, excluding the first day; null when none is recorded. Null where the field does not apply to an indicator."
  - name: latest_attendance_date
    description: "Latest weight management attendance or commencement in the last 12 months, excluding the first day; null when none is recorded. Null where the field does not apply to an indicator."
  - name: latest_end_date
    description: "Latest weight management programme end in the last 24 months, excluding the first day; null when none is recorded. Only an end later than attendance cancels current attendance. Null where the field does not apply to an indicator."
  - name: has_previous_referral
    description: "Whether a weight management referral is recorded in the last 24 months, excluding the first day. IND220 excludes people with this flag only if they have not achieved. Null where the field does not apply to an indicator."
  - name: is_currently_attending
    description: "Whether weight management attendance or commencement is recorded in the last 12 months without a later programme end. IND220 and IND221 exclude these people only if they have not achieved. Null where the field does not apply to an indicator."
  - name: has_hypertension
    description: "Whether the person belongs to the hypertension register on the reporting date. Null where the field does not apply to an indicator."
  - name: has_diabetes
    description: "Whether the person belongs to the diabetes register on the reporting date. Null where the field does not apply to an indicator."
