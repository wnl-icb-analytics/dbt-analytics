- name: nice_ind319_bmi_expiry_age_and_ethnicity_thresholds
  model: fct_person_weight_management_advice_overweight_ind319_by_month
  given:
  - input: ref('int_nice_reference_population_by_month')
    format: sql
    rows: |-
      SELECT people.column1::NUMBER AS person_id, dates.column1::DATE AS reporting_date,
          CASE WHEN people.column1 = -517 THEN 17 WHEN people.column1 = -518 THEN 40 ELSE 25 END AS age, '2001-01-15'::DATE AS birth_date_approx, 'Female'::VARCHAR AS gender,
          'SYNTHETIC'::VARCHAR AS practice_code, 'Synthetic practice'::VARCHAR AS practice_name
      FROM VALUES (-511), (-512), (-513), (-514), (-515), (-516), (-517), (-518), (-519), (-520) AS people
      CROSS JOIN (VALUES ('2026-09-30'), ('2026-10-31')) AS dates
  - input: ref('int_nice_weight_profile_by_month')
    format: sql
    rows: |-
      SELECT fixture.*, '2026-01-01'::DATE AS earliest_qualifying_bmi_date FROM (SELECT people.column1::NUMBER AS person_id, dates.column1::DATE AS reporting_date,
          people.column2::DATE AS bmi_date, people.column3::FLOAT AS bmi_value,
          people.column4::BOOLEAN AS is_recorded_white, NULL::DATE AS latest_weight_advice_date
      FROM VALUES (-511, '2025-09-30', 23, FALSE), (-512, '2026-09-30', 27.4, FALSE),
          (-513, '2026-10-01', 25, TRUE), (-514, '2026-09-30', 29.9, TRUE),
          (-515, '2026-09-30', 27.5, FALSE), (-516, '2026-09-30', 24.9, TRUE),
          (-517, '2026-09-30', 23, FALSE), (-518, '2026-09-30', 23, FALSE), (-519, '2026-09-30', 27.45, FALSE),
          (-520, '2026-09-30', 29.95, TRUE) AS people
      CROSS JOIN (VALUES ('2026-09-30'), ('2026-10-31')) AS dates) AS fixture
  expect:
    rows:
    - person_id: -511
      reporting_date: '2026-09-30'
      is_in_numerator: false
    - person_id: -512
      reporting_date: '2026-09-30'
      is_in_numerator: false
    - person_id: -514
      reporting_date: '2026-09-30'
      is_in_numerator: false
    - person_id: -512
      reporting_date: '2026-10-31'
      is_in_numerator: false
    - person_id: -513
      reporting_date: '2026-10-31'
      is_in_numerator: false
    - person_id: -514
      reporting_date: '2026-10-31'
      is_in_numerator: false
  config:
    tags:
    - monthly-full
    - nice-history
