models:
- name: fct_person_weight_management_advice_overweight_ind319_by_month
  description: >-
    Weight advice for overweight adults (NICE IND319). One row per eligible person aged 18 to 39 with a
    qualifying measured BMI and month-end. People must be registered, living and non-test. People aged
    18-39 whose latest measured BMIVAL_COD BMI in the inclusive preceding 12 months is 23-27.4 kg/m^2,
    or 25-29.9 if the demographic ethnicity at R is White. Unknown and unrecorded ethnicity use the
    lower range. WTMGINT_COD advice between the BMI date and day 90 inclusive achieves the indicator,
    capped at R. An invalid latest BMI is unassessable and excludes the person from the denominator. A
    later invalid or out-of-range BMI prevents fallback. BMI30_COD and calculated BMI do not qualify.
    Recalculated over the last 60 completed month-ends with current rules and code lists. Registration
    and practice follow the monthly spine. Birth and death dates are approximate; current gender and
    test flags apply retrospectively. Registers use clinical and recorded dates; other evidence uses
    corrected clinical or order dates. Later corrections can change earlier results. Personalised care
    adjustments are not applied.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind319
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: person_id
    description: Person in the indicator denominator at R.
  - name: indicator_id
    description: Published NICE indicator identifier.
  - name: indicator_name
    description: Published NICE indicator title.
  - name: reporting_date
    description: Date R used for population, age and evidence; build date for current, completed month-end
      for history.
  - name: measurement_period_start
    description: 'Start of the evidence window: inclusive for IND319 and IND320; exclusive for six-month
      bone treatment.'
  - name: age
    description: Completed years at R from the approximate birth date.
  - name: condition_name
    description: Population used by the indicator.
  - name: practice_code
    description: Registration practice ODS code at month-end under the monthly spine.
  - name: practice_name
    description: Registration practice name at month-end under the monthly spine.
  - name: latest_bmi_date
    description: Latest measured BMIVAL_COD BMI date within the inclusive preceding 12 months.
  - name: bmi_value
    description: Recorded BMI in kg/m^2. An invalid latest value excludes the person; no older value replaces it.
  - name: is_recorded_white
    description: Ethnicity is White in the demographic interval containing R, start inclusive and end
      exclusive. False includes missing and unknown ethnicity.
  - name: bmi_lower_threshold
    description: 'Inclusive BMI lower threshold: 25 if White recorded, otherwise 23 kg/m^2.'
  - name: bmi_upper_threshold
    description: 'Inclusive BMI upper threshold: 29.9 if White recorded, otherwise 27.4 kg/m^2.'
  - name: latest_weight_advice_date
    description: Latest WTMGINT_COD advice from BMI date through day 90 inclusive, capped at R.
  - name: latest_record_date
    description: Qualifying weight advice date; null without advice in the follow-up window.
  - name: is_in_denominator
    description: Always true. Personalised care adjustments are not applied.
  - name: is_in_numerator
    description: Whether the achievement rule is met at R.
  - name: indicator_status
    description: ACHIEVED or the accepted reason the rule is not met.
