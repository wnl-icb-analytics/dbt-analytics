- name: nice_weight_current_cohort_expiry_uses_evaluation_date
  model: int_nice_weight_management_referral_evidence
  given:
  - input: ref('fct_person_nice_obesity_register')
    format: sql
    rows: SELECT column1::NUMBER AS person_id, DATEADD(day, -5, CURRENT_DATE())::DATE AS reporting_date, DATEADD(day,
      column3, DATEADD(month, column2, CURRENT_DATE()))::DATE AS latest_bmi_date, 35::FLOAT AS bmi_value, 'recorded'
      AS bmi_source, FALSE AS requires_lower_bmi_thresholds, 'Obese Class I' AS bmi_category FROM VALUES (-9831,
      -6, 0), (-9832, -12, -1), (-9833, -4, 0)
  - input: ref('int_bmi_all')
    format: sql
    rows: SELECT column1::NUMBER AS person_id, column2::VARCHAR AS id, DATEADD(day, column4, DATEADD(month, column3,
      CURRENT_DATE()))::TIMESTAMP_NTZ AS clinical_effective_date, clinical_effective_date::DATE AS date_recorded,
      35::FLOAT AS bmi_value, 'recorded' AS bmi_source FROM VALUES (-9831, 'A', -12, -1), (-9831, 'B', -6, 0)
  - input: ref('int_nice_weight_management_events_all')
    format: sql
    rows: SELECT NULL::NUMBER AS person_id, NULL::DATE AS event_date, FALSE AS is_referral, FALSE AS is_offer, FALSE
      AS is_decline, FALSE AS is_attendance, FALSE AS is_end WHERE FALSE
  expect:
    format: sql
    rows: SELECT column1::NUMBER AS person_id, DATEADD(day, -5, CURRENT_DATE())::DATE AS reporting_date, DATEADD(day,
      column4, DATEADD(month, column3, CURRENT_DATE()))::DATE AS latest_bmi_date, 35::FLOAT AS bmi_value, 'recorded'
      AS bmi_source, FALSE AS requires_lower_bmi_thresholds, 'Obese Class I' AS bmi_category, IFF(column2 IS NULL,
      NULL, DATEADD(month, column2, CURRENT_DATE())::DATE) AS earliest_qualifying_bmi_date, NULL::DATE AS timely_referral_date,
      NULL::DATE AS timely_offer_date, NULL::DATE AS timely_decline_date, NULL::DATE AS latest_referral_date, NULL::DATE
      AS latest_attendance_date, NULL::DATE AS latest_end_date, FALSE AS has_previous_referral, FALSE AS is_currently_attending
      FROM VALUES (-9831, -6, -6, 0), (-9832, NULL, -12, -1), (-9833, -4, -4, 0)
  config:
    tags:
    - monthly-full
    - nice-history
  overrides:
    macros:
      get_observations: SELECT -9416::NUMBER AS person_id, '2026-01-01'::TIMESTAMP_NTZ AS clinical_effective_date,
        '2026-10-01'::DATE AS date_recorded, 'HEIGHT'::VARCHAR AS id, '180'::VARCHAR AS result_value, 18::NUMBER
        AS age_at_event
