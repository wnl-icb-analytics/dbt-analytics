models:
- name: fct_person_weight_management_nice_indicators
  description: >-
    Weight management NICE indicator results (IND319, IND320). One row per
    person, indicator and build date.


    Each indicator uses its own denominator, evidence window and exclusions, described in the
    member measures. Clinical fields are null where they do not apply to an indicator. No
    personalised care adjustments are applied.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
  columns:
  - name: person_id
    description: "Person identifier for someone in the indicator denominator."
  - name: indicator_id
    description: "Published NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: reporting_date
    description: "Build date used to assess the population, age and evidence."
  - name: measurement_period_start
    description: "Start date of the indicator measurement period; inclusion of this date depends on the indicator."
  - name: age
    description: "Completed years on the build date, based on the approximate birth date; null when age is unknown."
  - name: condition_name
    description: "Short label for the indicator denominator population."
  - name: latest_bmi_date
    description: "Latest BMI date retained by the indicator. IND319 uses measured BMI; IND320 allow calculated BMI. For IND320 this can be outside the 12-month window; null when no valid BMI is recorded."
  - name: bmi_value
    description: "Body mass index in kg/m2. Null where the field does not apply to an indicator."
  - name: is_recorded_white
    description: "Whether ethnicity is recorded as White on the reporting date. False includes missing or unknown ethnicity. Null where the field does not apply to an indicator."
  - name: bmi_lower_threshold
    description: "Inclusive lower BMI threshold in kg/m2 for IND319: 25 if ethnicity is recorded as White, otherwise 23. Null where the field does not apply to an indicator."
  - name: bmi_upper_threshold
    description: "Inclusive upper BMI threshold in kg/m2 for IND319: 29.9 if ethnicity is recorded as White, otherwise 27.4. Null where the field does not apply to an indicator."
  - name: latest_weight_advice_date
    description: "Latest weight management advice from the selected measured BMI date to 90 days afterwards, inclusive, by the reporting date; null when none is recorded. Null where the field does not apply to an indicator."
  - name: latest_record_date
    description: "Evidence date retained by the indicator; see each measure for its test, referral or treatment rule. Null when no qualifying evidence is retained."
  - name: current_practice_code
    description: "ODS code of the current registration practice."
  - name: current_practice_name
    description: "Name of the current registration practice."
  - name: is_in_denominator
    description: "Always true. Every row belongs to the denominator before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the indicator achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
