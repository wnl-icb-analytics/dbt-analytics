models:
- name: fct_person_weight_management_advice_overweight_ind319
  description: >-
    Weight management advice for adults with overweight (NICE IND319). One row per person in
    the denominator on the build date.


    People registered on the build date aged 18 to 39 with latest measured BMI in the
    preceding 12 months of 23 to 27.4 kg/m2 inclusive, or 25 to 29.9 for recorded White
    ethnicity. Unknown or missing ethnicity uses the lower range. People enter the cohort 90
    days after the earliest qualifying BMI in that period; a later BMI can still have an
    unfinished follow-up. Achieved with weight management advice within 90 days from the
    latest BMI. Invalid or out-of-range latest BMI excludes them without using an older
    result. Calculated BMI and obesity codes without measurements do not count. No
    personalised care adjustments are applied. Based on NICE NG246. Code lists: BMIVAL_COD,
    WTMGINT_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind319
      indicator:
        id: IND319
        type: MEASURE
        category: LIFESTYLE
        clinical_domain: Lifestyle
        name_short: "Weight advice, aged 18 to 39"
        description_short: "Weight management advice for adults aged 18 to 39 with overweight."
        description_long: >-
          People registered on the build date aged 18 to 39 with latest measured BMI in the
          preceding 12 months of 23 to 27.4 kg/m2 inclusive, or 25 to 29.9 for recorded White
          ethnicity. Unknown or missing ethnicity uses the lower range. People enter the
          cohort 90 days after the earliest qualifying BMI in that period; a later BMI can
          still have an unfinished follow-up. Achieved with weight management advice within 90
          days from the latest BMI. Invalid or out-of-range latest BMI excludes them without
          using an older result. Calculated BMI and obesity codes without measurements do not
          count. No personalised care adjustments are applied. Based on NICE NG246. Code
          lists: BMIVAL_COD, WTMGINT_COD (PCD).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND319
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: person_id
    description: "Person identifier for someone in the indicator denominator."
  - name: indicator_id
    description: "Published NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Build date used to assess the population, age and evidence."
  - name: measurement_period_start
    description: "Inclusive start of the indicator measurement period before the reporting date."
  - name: age
    description: "Completed years on the build date, based on the approximate birth date; null when age is unknown."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: current_practice_code
    description: "ODS code of the current registration practice."
  - name: current_practice_name
    description: "Name of the current registration practice."
  - name: latest_bmi_date
    description: "Date of the latest measured BMI in the 12-month measurement period, including both boundary dates."
  - name: bmi_value
    description: "Body mass index in kg/m2."
  - name: is_recorded_white
    description: "Whether ethnicity is recorded as White on the reporting date. False includes missing or unknown ethnicity."
  - name: bmi_lower_threshold
    description: "Inclusive lower BMI threshold in kg/m2 for IND319: 25 if ethnicity is recorded as White, otherwise 23."
  - name: bmi_upper_threshold
    description: "Inclusive upper BMI threshold in kg/m2 for IND319: 29.9 if ethnicity is recorded as White, otherwise 27.4."
  - name: latest_weight_advice_date
    description: "Latest weight management advice from the selected measured BMI date to 90 days afterwards, inclusive, by the reporting date; null when none is recorded."
  - name: latest_record_date
    description: "Date of qualifying evidence retained within the indicator measurement or follow-up window; null when none is recorded."
  - name: is_in_denominator
    description: "Always true. Every row belongs to the denominator before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the indicator achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
