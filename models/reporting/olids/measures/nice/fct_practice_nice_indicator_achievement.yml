models:
  - name: fct_practice_nice_indicator_achievement
    description: >-
      Current NICE achievement counts and percentages. One row per indicator and registration
      practice on the build date.


      The denominator counts people registered on the build date who meet the indicator
      population rules. The numerator counts those who meet its achievement rule. No
      personalised care adjustments are applied. Only practices with a denominator are included.
      Sum numerator and denominator for totals rather than averaging percentages. Practice
      names, PCN and borough use the current mapping. The published NICE statement can differ
      from the implemented rules; see the measure definition.
    config: &achievement_config
      meta:
        owner:
          name: EddieDavison92
    data_tests: &achievement_tests
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['indicator_id', 'practice_code', 'reporting_date']
      - dbt_utils.expression_is_true:
          arguments:
            expression: 'numerator <= denominator'
    columns: &achievement_columns
      - name: reporting_date
        description: Date of assessment; the build date for current results or a completed month-end for monthly results.
        data_tests:
          - not_null
      - name: indicator_id
        description: NICE indicator identifier in def_indicator.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('def_indicator')
                field: indicator_id
      - name: indicator_name
        description: Published NICE indicator title from the person status table.
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: programme
        description: Programme from the indicator catalogue; NICE for these results.
      - name: clinical_domain
        description: Clinical domain from the current catalogue classification.
      - name: clinical_subdomain
        description: Condition name or clinical topic from the current catalogue classification.
      - name: name_short
        description: Short catalogue label for reports.
      - name: practice_code
        description: >-
          ODS code of the registration practice attributed at the reporting date.

        data_tests:
          - not_null
      - name: practice_name
        description: Current practice name from dim_practice; null if the practice is not mapped.
      - name: pcn_code
        description: Current primary care network ODS code; null if not mapped.
      - name: pcn_name
        description: Current primary care network name; null if not mapped.
      - name: borough
        description: Current practice borough from dim_practice.borough_registered; null if not mapped.
      - name: denominator
        description: >-
          Number of people in the indicator denominator at the reporting date, before
          personalised care adjustments.

      - name: numerator
        description: >-
          Number of people in the denominator who meet the implemented achievement rule.

      - name: not_achieved
        description: Denominator minus numerator, including results with missing or unassessable evidence.
      - name: achievement_pct
        description: Numerator as a percentage of denominator, rounded to one decimal place.

  - name: fct_practice_nice_indicator_achievement_by_month
    description: >-
      Monthly NICE achievement counts and percentages. One row per indicator, registration
      practice and completed month-end.


      The denominator counts people registered at the month-end who meet the indicator
      population rules. The numerator counts those who meet its achievement rule. No
      personalised care adjustments are applied. Only practices with a denominator are included.
      Sum numerator and denominator for totals rather than averaging percentages. Practice
      names, PCN and borough use the current mapping. The published NICE statement can differ
      from the implemented rules; see the measure definition. Recalculated for each of the last
      60 month-ends with current rules, code lists and records, so later corrections can change
      past months.
    config: *achievement_config
    data_tests: *achievement_tests
    columns: *achievement_columns
