models:
  - name: fct_person_bmi_recording_ind320
    description: >-
      BMI recording in adults with long-term conditions (NICE IND320). One row per
      person in the denominator on the build date.


      People registered on the build date aged 18 or over with coronary heart disease,
      stroke or TIA, diabetes, non-diabetic hyperglycaemia, hypertension, peripheral
      arterial disease, heart failure, COPD, dyslipidaemia, learning disability,
      obstructive sleep apnoea or severe mental illness. Achieved with any valid
      recorded or calculated BMI of 10 to 150 kg/m2 in the last 12 months, despite a
      later invalid result. Calculations use the weight date and latest preceding adult
      height. Dyslipidaemia follows QOF v51.3, detailed under denominator_description.
      Non-diabetic hyperglycaemia only partly covers NICE's high-risk diabetes
      population because validated risk scores paired with raised glycaemia are
      unavailable. No personalised care adjustments are applied. Based on NICE NG246.
      Code lists: BMIVAL_COD, HEIGHT, WEIGHT, LDLCCHOL_COD, HDLCCHOL_COD, TRIGLYC_COD
      (PCD); 0212 (BNF).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind320
        indicator:
          id: "IND320"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "BMI recording in long-term conditions"
          description_short: "BMI recording in adults with long-term conditions (NICE IND320)."
          description_long: >-
            People registered on the build date aged 18 or over with coronary
            heart disease, stroke or TIA, diabetes, non-diabetic hyperglycaemia,
            hypertension, peripheral arterial disease, heart failure, COPD,
            dyslipidaemia, learning disability, obstructive sleep apnoea or severe
            mental illness. Achieved with any valid recorded or calculated BMI of
            10 to 150 kg/m2 in the last 12 months, despite a later invalid result.
            Calculations use the weight date and latest preceding adult height.
            Dyslipidaemia follows QOF v51.3, detailed under denominator_description.
            Non-diabetic hyperglycaemia only partly covers NICE's high-risk
            diabetes population because validated risk scores paired with raised
            glycaemia are unavailable. No personalised care adjustments are
            applied. Based on NICE NG246. Code lists: BMIVAL_COD, HEIGHT, WEIGHT,
            LDLCCHOL_COD, HDLCCHOL_COD, TRIGLYC_COD (PCD); 0212 (BNF).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND320"
    columns:
      - name: person_id
        description: "Person identifier for someone in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "Published NICE indicator identifier."
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: reporting_date
        description: "Build date used to assess the population, age and evidence."
      - name: measurement_period_start
        description: "Inclusive start of the indicator measurement period before the reporting date."
      - name: age
        description: "Completed years on the build date, based on the approximate birth date; null when age is unknown."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: current_practice_name
        description: "Name of the current registration practice."
      - name: latest_bmi_date
        description: "Latest valid recorded or calculated BMI date by the reporting date; it may be outside the 12-month measurement period. Null when none is recorded."
      - name: latest_record_date
        description: "Date of qualifying evidence retained within the indicator measurement or follow-up window; null when none is recorded."
      - name: is_in_denominator
        description: "Always true. Every row belongs to the denominator before personalised care adjustments."
      - name: is_in_numerator
        description: "Whether the person meets the indicator achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_ASSESSABLE', 'NOT_RECORDED_IN_PERIOD']

  - name: fct_person_bmi_recording_ind320_snapshot_input
    description: >-
      BMI recording NICE indicator evidence for change history (IND320). One row per
      person and indicator in the build-date denominator.


      Retains practice, recorded evidence and achievement. Build-date fields are omitted
      so a daily date change alone does not create a new history version. No
      personalised care adjustments are applied.
      Labels join from def_indicator or the measure tables by indicator_id.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: "Person identifier for someone in the indicator denominator."
        data_tests:
          - unique
          - not_null
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: latest_record_date
        description: "Evidence date retained by the indicator; see each measure for its test, referral or treatment rule. Null when no qualifying evidence is retained."
      - name: is_in_numerator
        description: "Whether the person meets the indicator achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
