models:
  - name: fct_person_bmi_recording_ind320
    description: |
      NICE IND320. Annual BMI recording for adults with specified long-term
      conditions. One row per currently registered, living, non-test person aged
      18 and over with CHD, stroke or TIA, diabetes, non-diabetic hyperglycaemia,
      hypertension, PAD, heart failure, COPD, dyslipidaemia, learning disability,
      obstructive sleep apnoea or severe mental illness, assessed on the build
      date.

      Achievement requires a recorded BMI value in the preceding 12 months.

      Dyslipidaemia follows QOF v51.3: lipid-lowering treatment in six months, or
      the latest result in 12 months with LDL at least 4.1 mmol/L, triglycerides
      at least 1.7 mmol/L, or HDL below 1.0 mmol/L for males or 1.3 mmol/L for
      females. Unknown sex cannot qualify through HDL alone. An invalid latest
      lipid result does not fall back to an older result. Non-diabetic
      hyperglycaemia represents NICE's high-risk diabetes population; a validated
      diabetes-risk score paired with raised glycaemia is not available.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind320
        indicator:
          id: "IND320"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "LTC BMI recorded"
          description_short: "BMI recorded in the preceding 12 months for people with a listed long-term condition"
          description_long: |
            NICE IND320. One row per currently registered, living, non-test person aged 18
            and over with CHD, stroke or TIA, diabetes, non-diabetic hyperglycaemia,
            hypertension, PAD, heart failure, COPD, dyslipidaemia, learning disability,
            obstructive sleep apnoea or severe mental illness, assessed on the build date.

            Achievement requires a recorded BMI value in the preceding 12 months.

            Dyslipidaemia follows QOF v51.3: lipid-lowering treatment in six months, or
            the latest result in 12 months with LDL at least 4.1 mmol/L, triglycerides at
            least 1.7 mmol/L, or HDL below 1.0 mmol/L for males or 1.3 mmol/L for females.
            Unknown sex cannot qualify through HDL alone. An invalid latest lipid result
            does not fall back to an older result. Non-diabetic hyperglycaemia represents
            NICE's high-risk diabetes population; a validated diabetes-risk score paired
            with raised glycaemia is not available.

            Measured before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND320"
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_bmi_date
        description: Date of the latest BMI value, regardless of period; null if none
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD

  - name: fct_person_bmi_recording_ind320_snapshot_input
    description: |
      Current NICE BMI indicator outcomes used to record changes over time. One
      row per person in the current indicator denominator.

      Keeps the current practice, qualifying evidence date and outcome. Build-date
      fields are excluded so a new snapshot version records a changed outcome or
      practice rather than the daily date change.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Person identifier; snapshot unique_key.
        data_tests:
          - unique
          - not_null
      - name: current_practice_code
        description: ODS code of the current registration practice at the build.
      - name: latest_record_date
        description: Date of the latest qualifying record; null when none in the period.
      - name: is_in_numerator
        description: Whether the person met the indicator at the build.
      - name: indicator_status
        description: Outcome label at the build.
