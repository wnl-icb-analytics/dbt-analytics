        '2025-01-15'::DATE AS birth_date_approx, 3::NUMBER(18,0) AS dtap_doses_by_8_months,
        FALSE AS has_dtap_contraindication
      FROM VALUES ('2026-08-31'), ('2026-09-30')
  expect:
