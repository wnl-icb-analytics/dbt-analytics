- name: nice_history_childhood_source_age_and_two_dates
  model: int_nice_childhood_immunisation_profile_by_month
  given:
  - input: ref('int_nice_reference_population_by_month')
    format: sql
    rows: |-
      SELECT -9015::NUMBER AS person_id, column1::DATE AS reporting_date, 1::NUMBER AS age,
        '2025-03-15'::DATE AS birth_date_approx, 'Female'::VARCHAR AS gender,
        'SYNTHETIC'::VARCHAR AS practice_code, 'Synthetic practice'::VARCHAR AS practice_name
      FROM VALUES ('2026-03-31'), ('2026-06-30')
  - input: ref('int_nice_childhood_immunisation_all')
    format: sql
    rows: |-
      -- Source age places the March event after the real first birthday, before the approximate one.
      SELECT -9015::NUMBER AS person_id, column1::DATE AS event_date, 1::NUMBER AS age_at_event,
        column2::VARCHAR AS vaccine_group, column3::VARCHAR AS event_type
      FROM VALUES ('2026-03-10', 'MMR', 'Administration'), ('2026-04-10', 'MMR', 'Administration'),
        ('2026-03-10', 'MENB', 'Administration'), ('2026-05-01', 'MENB', 'Contraindicated')
  expect:
    rows:
    - person_id: -9015
      reporting_date: '2026-03-31'
      mmr_doses_12_to_18_months: 1
      mmr_doses_1_to_5_years: 1
      menb_primary_doses_by_12_months: 0
      menb_booster_doses_12_to_18_months: 1
      has_menb_contraindication: false
    - person_id: -9015
      reporting_date: '2026-06-30'
      mmr_doses_12_to_18_months: 2
      mmr_doses_1_to_5_years: 2
      menb_primary_doses_by_12_months: 0
      menb_booster_doses_12_to_18_months: 1
      has_menb_contraindication: true
  config:
    tags: [monthly-full, nice-history]
- name: nice_history_childhood_milestone_leaves_cohort
  model: fct_person_childhood_immunisation_ind215_by_month
