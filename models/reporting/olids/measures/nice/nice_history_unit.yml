unit_tests:
- name: nice_history_depression_known_date_and_follow_up_cap
  model: fct_person_depression_review_ind104_by_month
  overrides:
    macros:
      nice_reference_dates: |-
        SELECT column1::DATE AS reporting_date FROM VALUES ('2026-03-31'), ('2026-04-30'), ('2026-09-30')
  given:
  - input: ref('int_nice_reference_population_by_month')
    format: sql
    rows: |-
      SELECT -9001::NUMBER AS person_id, '2026-03-31'::DATE AS reporting_date, 30::NUMBER AS age, '1996-06-15'::DATE AS birth_date_approx, 'Female'::VARCHAR AS gender, 'SYNTHETIC'::VARCHAR AS practice_code, 'Synthetic practice'::VARCHAR AS practice_name
      UNION ALL
      SELECT -9001::NUMBER AS person_id, '2026-04-30'::DATE AS reporting_date, 30::NUMBER AS age, '1996-06-15'::DATE AS birth_date_approx, 'Female'::VARCHAR AS gender, 'SYNTHETIC'::VARCHAR AS practice_code, 'Synthetic practice'::VARCHAR AS practice_name
      UNION ALL
      SELECT -9001::NUMBER AS person_id, '2026-09-30'::DATE AS reporting_date, 30::NUMBER AS age, '1996-06-15'::DATE AS birth_date_approx, 'Female'::VARCHAR AS gender, 'SYNTHETIC'::VARCHAR AS practice_code, 'Synthetic practice'::VARCHAR AS practice_name
      UNION ALL
      SELECT -9006::NUMBER AS person_id, '2026-09-30'::DATE AS reporting_date, 30::NUMBER AS age, '1996-06-15'::DATE AS birth_date_approx, 'Female'::VARCHAR AS gender, 'SYNTHETIC'::VARCHAR AS practice_code, 'Synthetic practice'::VARCHAR AS practice_name
  - input: ref('int_depression_diagnoses_all')
    format: sql
    rows: |-
      SELECT -9001::NUMBER AS person_id, 'D1'::VARCHAR AS id, '2026-03-20'::TIMESTAMP_NTZ AS clinical_effective_date, '2026-03-20'::DATE AS date_recorded, TRUE AS is_diagnosis_code, TRUE AS is_first_or_new_episode
      UNION ALL
      SELECT -9001::NUMBER AS person_id, 'D2'::VARCHAR AS id, '2026-02-20'::TIMESTAMP_NTZ AS clinical_effective_date, '2026-09-01'::DATE AS date_recorded, TRUE AS is_diagnosis_code, TRUE AS is_first_or_new_episode
      UNION ALL
      SELECT -9006::NUMBER AS person_id, 'D3'::VARCHAR AS id, '2026-09-01'::TIMESTAMP_NTZ AS clinical_effective_date, '2026-09-01'::DATE AS date_recorded, TRUE AS is_diagnosis_code, TRUE AS is_first_or_new_episode
      UNION ALL
      SELECT -9006::NUMBER AS person_id, 'D4'::VARCHAR AS id, '2026-08-01'::TIMESTAMP_NTZ AS clinical_effective_date, '2026-09-15'::DATE AS date_recorded, TRUE AS is_diagnosis_code, TRUE AS is_first_or_new_episode
  - input: ref('int_ltc_review_all')
    format: sql
    rows: |-
      SELECT -9001::NUMBER AS person_id, '2026-04-02'::TIMESTAMP_NTZ AS clinical_effective_date, 'DEPRESSION_REVIEW'::VARCHAR AS review_type
      UNION ALL
      SELECT -9006::NUMBER AS person_id, '2026-09-11'::TIMESTAMP_NTZ AS clinical_effective_date, 'DEPRESSION_REVIEW'::VARCHAR AS review_type
  expect:
    rows:
    - person_id: -9001
      reporting_date: '2026-03-31'
      diagnosis_date: '2026-03-20'
      latest_review_date: null
      is_in_numerator: false
    - person_id: -9006
      reporting_date: '2026-09-30'
      diagnosis_date: '2026-09-01'
      latest_review_date: '2026-09-11'
      is_in_numerator: true
  config:
    tags:
    - monthly-full
    - nice-history
