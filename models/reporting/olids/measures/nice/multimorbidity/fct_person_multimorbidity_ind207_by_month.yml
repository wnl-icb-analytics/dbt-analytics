models:
- name: fct_person_multimorbidity_ind207_by_month
  description: |-
    NICE IND207: Multimorbidity medication review. One row per registered at the month-end,
    living, non-test person with moderate or severe coded frailty, or conditions in
    four or more NICE IND207 multimorbidity categories, assessed on the reporting month-end.

    Achievement requires a structured medication review record in the preceding 12
    months. The code does not independently establish use of an assessment tool or
    shared decision making.

    Counts each category once using int_nice_multimorbidity_categories. Chronic pain
    requires four analgesic issues or four specified antiepileptic issues in the last
    12 months. The antiepileptic route requires no epilepsy diagnosis code at any date
    known by the reporting month-end, including diagnoses subsequently resolved.
    Constipation requires four laxative issues. Supplemental diagnoses include Crohn's
    disease, ulcerative colitis, unclassified inflammatory bowel disease,
    anorexia or bulimia, current substance misuse,
    bronchiectasis and the Bristol connective tissue disorder set.
    Diverticular disease has no source-backed code set and remains omitted. Existing
    register age/treatment restrictions and the alcohol flag's age floor remain.
    Lithium therapy without an SMI diagnosis does not count as mental health evidence.

    Personalised care adjustments are not applied.

    One row per eligible person, indicator and completed month-end across the last 60 completed months. Recalculated at monthly refresh with today's rules and code lists. Diagnosis and register state use clinical and recorded dates; other evidence uses clinical or order dates through the month-end. Later corrections can change earlier results. Registration starts are inclusive; end and death dates are exclusive. Practice follows the established monthly spine, including its current-registration priority for overlaps. Birth and death dates are approximate; missing birth dates prevent historical active rows. Current gender and test-patient flags apply retrospectively.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind207
  columns:
  - name: person_id
    description: Person in the indicator denominator
  - name: indicator_id
    description: NICE indicator identifier
  - name: indicator_name
    description: Published NICE indicator name
  - name: reporting_date
    description: Completed month-end used for eligibility and evidence. DATE; no current-day row.
  - name: measurement_period_start
    description: Inclusive start of the measurement period before the reporting date
  - name: age
    description: Completed years at the month-end from the approximate birth month.
  - name: condition_name
    description: Population defining the indicator
  - name: practice_code
    description: Practice ODS code at the reporting month-end under the established spine attribution.
  - name: practice_name
    description: Practice name at the reporting month-end under the established spine attribution.
  - name: ltc_count
    description: Number of distinct project long-term condition registers the person is on
  - name: multimorbidity_cluster_count
    description: Number of NICE IND207 categories represented, using int_nice_multimorbidity_categories
      for both indicators. Informational only for IND208.
  - name: latest_frailty_severity
    description: Latest coded frailty severity; null if none
  - name: latest_record_date
    description: Date of the latest qualifying record in the period; null when none
  - name: is_in_denominator
    description: Always true; every row is an eligible person before personalised care adjustments
  - name: is_in_numerator
    description: Whether the person meets the indicator at the reporting month-end
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
