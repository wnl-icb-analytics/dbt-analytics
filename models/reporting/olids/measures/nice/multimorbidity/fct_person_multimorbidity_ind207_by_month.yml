models:
- name: fct_person_multimorbidity_ind207_by_month
  description: >-
    Medication review with frailty or multimorbidity (NICE IND207). One row per person in the
    denominator on the month-end.


    People registered at the month-end with moderate or severe coded frailty, or at least four
    NICE multimorbidity categories, each counted once. Achieved with a structured medication
    review in the 12 months before the month-end; codes cannot prove an assessment tool or
    shared decision making. Chronic pain needs at least four analgesic prescriptions, or at
    least four qualifying antiepileptic prescriptions without any epilepsy history, including
    resolved diagnoses. Constipation needs at least four laxative prescriptions. Both use
    12-month windows. Crohn's disease, ulcerative colitis, unclassified inflammatory bowel
    disease, anorexia, bulimia, current substance misuse, bronchiectasis and connective tissue
    disorders count. Diverticular disease lacks a supported code list and is omitted. Register
    age and treatment restrictions apply; alcohol misuse starts at 16. Lithium alone without
    severe mental illness does not count. No personalised care adjustments are applied.
    Recalculated for each of the last 60 month-ends with current rules, code lists and records,
    so later corrections can change past months. Based on NICE NG56. Code lists:
    STRUCTMEDRVW_COD, CROHNS_COD, ULCCOLITIS_COD, EATDISORDER_COD, ILLSUB_COD (PCD);
    MULTIMORBIDITY_CONNECTIVE_TISSUE_DISORDER (BRISTOL); HAS_CF_OR_BRONCHIECTASIS (QCOVID);
    INFLAMMATORY_BOWEL_DISEASE_UNCLASSIFIED (OPENSAFELY); 5065, 5066, 5071 (CCMS); contributing
    disease register code lists.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind207
  columns:
  - name: person_id
    description: "Person identifier for someone in the indicator denominator."
  - name: indicator_id
    description: "Published NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess the population, age and evidence."
  - name: measurement_period_start
    description: "Inclusive start of the indicator measurement period before the reporting date."
  - name: age
    description: "Completed years on the month-end, based on the approximate birth date; null when age is unknown."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
  - name: ltc_count
    description: "Number of disease registers to which the person belongs on the reporting date; this differs from the number of multimorbidity categories."
  - name: multimorbidity_cluster_count
    description: "Number of NICE multimorbidity categories on the reporting date, counting each category once. Defines eligibility for IND207; information only for IND208."
  - name: latest_frailty_severity
    description: "Latest coded frailty severity by the reporting date; null when none is recorded."
  - name: latest_record_date
    description: "Date of qualifying evidence retained within the indicator measurement or follow-up window; null when none is recorded."
  - name: is_in_denominator
    description: "Always true. Every row belongs to the denominator before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the indicator achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
