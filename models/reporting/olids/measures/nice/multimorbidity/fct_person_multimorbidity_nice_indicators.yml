models:
  - name: fct_person_multimorbidity_ind207
    description: >-
      Medication review with frailty or multimorbidity (NICE IND207). One row per person in the
      denominator on the build date.


      People registered on the build date with moderate or severe coded frailty, or at least
      four NICE multimorbidity categories, each counted once. Achieved with a structured
      medication review in the 12 months before the build date; codes cannot prove an assessment
      tool or shared decision making. Chronic pain needs at least four analgesic prescriptions,
      or at least four qualifying antiepileptic prescriptions without any epilepsy history,
      including resolved diagnoses. Constipation needs at least four laxative prescriptions.
      Both use 12-month windows. Crohn's disease, ulcerative colitis, unclassified inflammatory
      bowel disease, anorexia, bulimia, current substance misuse, bronchiectasis and connective
      tissue disorders count. Diverticular disease lacks a supported code list and is omitted.
      Register age and treatment restrictions apply; alcohol misuse starts at 16. Lithium alone
      without severe mental illness does not count. No personalised care adjustments are
      applied. Based on NICE NG56. Code lists: STRUCTMEDRVW_COD, CROHNS_COD, ULCCOLITIS_COD,
      EATDISORDER_COD, ILLSUB_COD (PCD); MULTIMORBIDITY_CONNECTIVE_TISSUE_DISORDER (BRISTOL);
      HAS_CF_OR_BRONCHIECTASIS (QCOVID); INFLAMMATORY_BOWEL_DISEASE_UNCLASSIFIED (OPENSAFELY);
      5065, 5066, 5071 (CCMS); contributing disease register code lists.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind207
        indicator:
          id: "IND207"
          type: "MEASURE"
          category: "MULTIMORBIDITY"
          clinical_domain: "Geriatric"
          name_short: "Frailty or multimorbidity review"
          description_short: "Structured medication review with frailty or multimorbidity."
          description_long: >-
            People registered on the build date with moderate or severe coded frailty, or at
            least four NICE multimorbidity categories, each counted once. Achieved with a
            structured medication review in the 12 months before the build date; codes cannot
            prove an assessment tool or shared decision making. Chronic pain needs at least four
            analgesic prescriptions, or at least four qualifying antiepileptic prescriptions
            without any epilepsy history, including resolved diagnoses. Constipation needs at
            least four laxative prescriptions. Both use 12-month windows. Crohn's disease,
            ulcerative colitis, unclassified inflammatory bowel disease, anorexia, bulimia,
            current substance misuse, bronchiectasis and connective tissue disorders count.
            Diverticular disease lacks a supported code list and is omitted. Register age and
            treatment restrictions apply; alcohol misuse starts at 16. Lithium alone without
            severe mental illness does not count. No personalised care adjustments are applied.
            Based on NICE NG56. Code lists: STRUCTMEDRVW_COD, CROHNS_COD, ULCCOLITIS_COD,
            EATDISORDER_COD, ILLSUB_COD (PCD); MULTIMORBIDITY_CONNECTIVE_TISSUE_DISORDER
            (BRISTOL); HAS_CF_OR_BRONCHIECTASIS (QCOVID);
            INFLAMMATORY_BOWEL_DISEASE_UNCLASSIFIED (OPENSAFELY); 5065, 5066, 5071 (CCMS);
            contributing disease register code lists.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND207"
    columns: &multimorbidity_columns
      - name: person_id
        description: "Person identifier for someone in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "Published NICE indicator identifier."
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: reporting_date
        description: "Build date used to assess the population, age and evidence."
      - name: measurement_period_start
        description: "Inclusive start of the indicator measurement period before the reporting date."
      - name: age
        description: "Completed years on the build date, based on the approximate birth date; null when age is unknown."
      - name: condition_name
        description: "Short label for the indicator denominator population."
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: current_practice_name
        description: "Name of the current registration practice."
      - name: ltc_count
        description: "Number of disease registers to which the person belongs on the reporting date; this differs from the number of multimorbidity categories."
      - name: multimorbidity_cluster_count
        description: "Number of NICE multimorbidity categories on the reporting date, counting each category once. Defines eligibility for IND207; information only for IND208."
      - name: latest_frailty_severity
        description: "Latest coded frailty severity by the reporting date; null when none is recorded."
      - name: latest_record_date
        description: "Date of qualifying evidence retained within the indicator measurement or follow-up window; null when none is recorded."
      - name: is_in_denominator
        description: "Always true. Every row belongs to the denominator before personalised care adjustments."
      - name: is_in_numerator
        description: "Whether the person meets the indicator achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."

  - name: fct_person_multimorbidity_ind208
    description: >-
      Falls enquiry in older adults with frailty (NICE IND208). One row per person in the
      denominator on the build date.


      People registered on the build date aged 65 or over with moderate or severe coded frailty.
      Achieved with a falls discussion or risk assessment in the 12 months before the build
      date. Codes cannot prove enquiry covered the number and type of falls required by NICE. No
      personalised care adjustments are applied. Based on NICE NG249. Code lists: FALLSDISC_COD,
      FALRISKASS_COD, MODFRAIL_COD, SEVFRAIL_COD (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind208
        indicator:
          id: "IND208"
          type: "MEASURE"
          category: "MULTIMORBIDITY"
          clinical_domain: "Geriatric"
          name_short: "Frailty falls enquiry"
          description_short: "Falls enquiry for people aged 65 or over with frailty."
          description_long: >-
            People registered on the build date aged 65 or over with moderate or severe coded
            frailty. Achieved with a falls discussion or risk assessment in the 12 months before
            the build date. Codes cannot prove enquiry covered the number and type of falls
            required by NICE. No personalised care adjustments are applied. Based on NICE NG249.
            Code lists: FALLSDISC_COD, FALRISKASS_COD, MODFRAIL_COD, SEVFRAIL_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND208"
    columns: *multimorbidity_columns

  - name: fct_person_multimorbidity_nice_indicators
    description: >-
      Multimorbidity and frailty NICE indicator results (IND207, IND208). One row per person,
      indicator and build date.


      Each indicator uses its own denominator, evidence window and exclusions, described in the
      member measures. Clinical fields are null where they do not apply to an indicator. No
      personalised care adjustments are applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: "Person identifier for someone in the indicator denominator."
      - name: indicator_id
        description: "Published NICE indicator identifier."
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND207', 'IND208']
      - name: indicator_status
        description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']
      - name: ltc_count
        description: "Number of disease registers to which the person belongs on the reporting date; this differs from the number of multimorbidity categories. Null where the field does not apply to an indicator."
      - name: multimorbidity_cluster_count
        description: "Number of NICE multimorbidity categories on the reporting date, counting each category once. Defines eligibility for IND207; information only for IND208. Null where the field does not apply to an indicator."
      - name: latest_frailty_severity
        description: "Latest coded frailty severity by the reporting date; null when none is recorded. Null where the field does not apply to an indicator."
      - name: latest_record_date
        description: "Evidence date retained by the indicator; see each measure for its test, referral or treatment rule. Null when no qualifying evidence is retained."

  - name: fct_person_multimorbidity_nice_indicators_snapshot_input
    description: >-
      Multimorbidity and frailty NICE indicator evidence for change history (IND207, IND208).
      One row per person and indicator in the build-date denominator.


      Retains practice, recorded evidence and achievement. Build-date fields are omitted so a
      daily date change alone does not create a new history version. No personalised care
      adjustments are applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: "Person identifier for someone in the indicator denominator."
        data_tests:
          - not_null
      - name: indicator_id
        description: "Published NICE indicator identifier."
        data_tests:
          - not_null
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: latest_record_date
        description: "Evidence date retained by the indicator; see each measure for its test, referral or treatment rule. Null when no qualifying evidence is retained."
      - name: is_in_numerator
        description: "Whether the person meets the indicator achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
      - name: ltc_count
        description: "Number of disease registers to which the person belongs on the reporting date; this differs from the number of multimorbidity categories."
      - name: multimorbidity_cluster_count
        description: "Number of NICE multimorbidity categories on the reporting date, counting each category once. Defines eligibility for IND207; information only for IND208."
      - name: latest_frailty_severity
        description: "Latest coded frailty severity by the reporting date; null when none is recorded."
