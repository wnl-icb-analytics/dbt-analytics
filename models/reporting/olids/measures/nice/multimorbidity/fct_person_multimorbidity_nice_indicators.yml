models:
  - name: fct_person_multimorbidity_ind207
    description: |
      NICE IND207: Multimorbidity medication review. One row per currently registered,
      living, non-test person with moderate or severe coded frailty, or conditions in
      four or more NICE IND205 multimorbidity categories, assessed on the build date.

      Achievement requires a structured medication review record in the preceding 12
      months. The code does not independently establish use of an assessment tool or
      shared decision making.

      Category coverage is incomplete. Chronic pain, constipation, diverticular disease,
      inflammatory bowel disease, eating disorders, substance misuse, other inflammatory
      polyarthropathies, systemic connective tissue disorders and bronchiectasis are not
      modelled. Eligible people may therefore be missed. Lithium therapy without an SMI
      diagnosis does not count as a mental health condition.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind207
        indicator:
          id: "IND207"
          type: "MEASURE"
          category: "MULTIMORBIDITY"
          clinical_domain: "Geriatric"
          name_short: "Multimorbidity medication review"
          description_short: "Structured medication review in the preceding 12 months for people with frailty or multimorbidity (four or more condition clusters)"
          description_long: |
            Currently registered, living, non-test people with moderate or severe coded
            frailty, or conditions in four or more NICE IND205 multimorbidity
            categories.

            Achievement requires a structured medication review record in the preceding
            12 months. The code does not independently establish use of an assessment
            tool or shared decision making.

            Category coverage is incomplete. Chronic pain, constipation, diverticular
            disease, inflammatory bowel disease, eating disorders, substance misuse,
            other inflammatory polyarthropathies, systemic connective tissue disorders
            and bronchiectasis are not modelled. Eligible people may therefore be
            missed. Lithium therapy without an SMI diagnosis does not count as a mental
            health condition.

            Assessed on the reporting date before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND207"
    columns: &multimorbidity_columns
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: ltc_count
        description: Number of distinct project long-term condition registers the person is on
      - name: multimorbidity_cluster_count
        description: Number of NICE IND205 condition clusters the person has a condition in
      - name: latest_frailty_severity
        description: Latest coded frailty severity; null if none
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD

  - name: fct_person_multimorbidity_ind208
    description: |
      NICE IND208: Frailty asked about falls. One row per currently registered, living,
      non-test person aged 65 and over with moderate or severe coded frailty, assessed
      on the build date.

      Achievement requires a falls discussion or falls risk assessment record in the
      preceding 12 months.

      NICE requires enquiry about whether the person fell and the number and type of
      falls. The available discussion and assessment codes do not establish each element
      separately.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind208
        indicator:
          id: "IND208"
          type: "MEASURE"
          category: "MULTIMORBIDITY"
          clinical_domain: "Geriatric"
          name_short: "Frailty asked about falls"
          description_short: "Asked about falls in the preceding 12 months for people aged 65 and over with moderate or severe frailty"
          description_long: |
            Currently registered, living, non-test people aged 65 and over with moderate
            or severe coded frailty.

            Achievement requires a falls discussion or falls risk assessment record in
            the preceding 12 months.

            NICE requires enquiry about whether the person fell and the number and type
            of falls. The available discussion and assessment codes do not establish
            each element separately.

            Assessed on the reporting date before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND208"
    columns: *multimorbidity_columns

  - name: fct_person_multimorbidity_nice_indicators
    description: |
      Multimorbidity and frailty NICE indicator results. One row per eligible person and
      indicator on the build date. Covers IND207, IND208.

      Each indicator retains its own population, evidence window and exclusions. The
      individual indicator models define these rules. Results feed the combined NICE
      indicator table and family history.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person in the indicator denominator
      - name: indicator_id
        description: NICE indicator identifier
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND207', 'IND208']
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']
      - name: ltc_count
        description: Number of distinct project long-term condition registers the person is on
      - name: multimorbidity_cluster_count
        description: Number of NICE IND205 condition clusters the person has a condition in
      - name: latest_frailty_severity
        description: Latest coded frailty severity; null if none
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none

  - name: fct_person_multimorbidity_nice_indicators_snapshot_input
    description: |
      Current multimorbidity NICE indicator evidence for change history. One row per
      person and indicator. Records the current practice, qualifying evidence and
      outcome.

      Reporting dates are omitted so a daily build alone does not create a new
      historical version. Changes to recorded evidence, practice or achievement can
      create a version in the family snapshot.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: indicator_id
        description: NICE indicator identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: current_practice_code
        description: ODS code of the current registration practice at the build.
      - name: latest_record_date
        description: Date of the latest qualifying record; null when none in the period.
      - name: is_in_numerator
        description: Whether the person met the indicator at the build.
      - name: indicator_status
        description: Outcome label at the build.
      - name: ltc_count
        description: Number of LTC registers at the build.
      - name: multimorbidity_cluster_count
        description: Number of NICE IND205 condition clusters at the build.
      - name: latest_frailty_severity
        description: Latest coded frailty severity at the build.
