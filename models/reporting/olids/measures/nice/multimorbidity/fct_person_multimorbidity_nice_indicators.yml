models:
  - name: fct_person_multimorbidity_ind207
    description: >
      NICE IND207 medication review in multimorbidity. One row per currently registered, living, non-test person with moderate or severe coded frailty or with conditions in four or more of the NICE IND205 multimorbidity clusters, assessed on the build date. Clusters are mapped from the project registers; chronic pain, constipation, diverticular disease, inflammatory bowel disease, eating disorders and substance misuse are not modelled, so the register side is conservative. The numerator requires a
      structured medication review code in the preceding 12 months, the coded
      form of the structured, tool-informed, shared review NICE describes.
      Personalised care adjustments are not applied. Secondary-use consumers
      must join DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-
      Out and Type 1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind207
        indicator:
          id: "IND207"
          type: "MEASURE"
          category: "MULTIMORBIDITY"
          clinical_domain: "Geriatric"
          name_short: "Multimorbidity medication review"
          description_short: "Structured medication review in the preceding 12 months for people with frailty or multimorbidity (four or more condition clusters)"
          description_long: "NICE IND207 before personalised care adjustments. Multimorbidity as four or more NICE IND205 clusters from the project registers."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND207"
    columns: &multimorbidity_columns
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: ltc_count
        description: Number of distinct project long-term condition registers the person is on
      - name: multimorbidity_cluster_count
        description: Number of NICE IND205 condition clusters the person has a condition in
      - name: latest_frailty_severity
        description: Latest coded frailty severity; null if none
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD

  - name: fct_person_multimorbidity_ind208
    description: >
      NICE IND208 asking about falls. One row per currently registered,
      living, non-test person aged 65 and over with moderate or severe coded
      frailty, assessed on the build date. The numerator requires a record of a discussion about falls or a falls risk assessment in the preceding 12 months. NICE asks that the person was asked whether they fell and about the number and type of falls; those elements are not coded separately, so the discussion or assessment code stands for them. Personalised care
      adjustments are not applied. Secondary-use consumers must join
      DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-Out and Type
      1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind208
        indicator:
          id: "IND208"
          type: "MEASURE"
          category: "MULTIMORBIDITY"
          clinical_domain: "Geriatric"
          name_short: "Frailty asked about falls"
          description_short: "Asked about falls in the preceding 12 months for people aged 65 and over with moderate or severe frailty"
          description_long: "NICE IND208 before personalised care adjustments."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND208"
    columns: *multimorbidity_columns

  - name: fct_person_multimorbidity_nice_indicators
    description: >
      NICE IND207 and IND208 multiple long-term conditions status in a common
      interface. One row per person and indicator on the current reporting
      date. Indicator-specific views remain the source of each population
      definition. Personalised care adjustments are not applied. Secondary-use
      consumers must join DIM_PERSON_SECONDARY_USE_ALLOWED to apply National
      Data Opt-Out and Type 1 opt-out filtering. Feeds
      fct_person_nice_indicator_status.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person in the indicator denominator
      - name: indicator_id
        description: NICE indicator identifier
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND207', 'IND208']
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']
      - name: ltc_count
        description: Number of distinct project long-term condition registers the person is on
      - name: multimorbidity_cluster_count
        description: Number of NICE IND205 condition clusters the person has a condition in
      - name: latest_frailty_severity
        description: Latest coded frailty severity; null if none
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none

  - name: fct_person_multimorbidity_nice_indicators_snapshot_input
    description: >
      Thin snapshot-input projection of
      fct_person_multimorbidity_nice_indicators: person, indicator, current
      practice, latest qualifying record and outcome. Excludes reporting_date
      and measurement_period_start, which advance on every build, so the SCD2
      snapshot versions only on genuine changes. Feeds
      fct_person_multimorbidity_nice_indicators_snapshot.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: indicator_id
        description: NICE indicator identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: current_practice_code
        description: ODS code of the current registration practice at the build.
      - name: latest_record_date
        description: Date of the latest qualifying record; null when none in the period.
      - name: is_in_numerator
        description: Whether the person met the indicator at the build.
      - name: indicator_status
        description: Outcome label at the build.
      - name: ltc_count
        description: Number of LTC registers at the build.
      - name: multimorbidity_cluster_count
        description: Number of NICE IND205 condition clusters at the build.
      - name: latest_frailty_severity
        description: Latest coded frailty severity at the build.
