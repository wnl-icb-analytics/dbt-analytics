models:
- name: fct_person_atrial_fibrillation_nice_indicators_by_month
  description: >-
    Atrial fibrillation risk assessment and treatment results. One row per person,
    indicator and month-end.


    Includes NICE IND127, NICE IND128, NICE IND169, NICE IND247. Each indicator has its
    own denominator, measurement window and exclusions. Supporting evidence accompanies
    the achievement status. No personalised care adjustments are applied. Recalculated for
    each of the last 60 month-ends with current rules, code lists and records, so later
    corrections can change past months.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
        - reporting_date
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: reporting_date
    description: "Month-end used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Inclusive start of the indicator measurement period before the reporting date."
  - name: age
    description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
  - name: condition_name
    description: "Short label for the population in the indicator denominator."
  - name: practice_code
    description: "ODS code of the registration practice attributed at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice attributed at the reporting month-end."
  - name: latest_chadsvasc_score
    description: "Score from the latest CHA2DS2-VASc assessment through the reporting date, from 0 to 9; null when missing or invalid."
  - name: latest_chadsvasc_date
    description: "Date of the latest CHA2DS2-VASc assessment through the reporting date, including assessments without a valid score; null when no assessment is recorded."
  - name: latest_chads2_score
    description: "Score from the latest CHADS2 assessment before 1 April 2015, from 0 to 6; null when missing or invalid."
  - name: latest_anticoagulant_order_date
    description: "Date of the latest oral anticoagulant prescription through the reporting date; null when none is recorded."
  - name: latest_anticoagulant_type
    description: "Drug type of the latest oral anticoagulant prescription: DOAC means direct-acting oral anticoagulant and VKA means vitamin K antagonist; null when none is recorded."
  - name: latest_doac_order_date
    description: "Date of the latest direct-acting oral anticoagulant prescription through the reporting date; null when absent."
  - name: latest_vka_order_date
    description: "Date of the latest vitamin K antagonist prescription through the reporting date; null when absent."
  - name: is_doac_ineligible
    description: "Whether valvular atrial fibrillation is recorded by the reporting date, requiring a vitamin K antagonist for IND247."
  - name: has_doac_exception
    description: "Whether a vitamin K antagonist can count for IND247: DOAC contraindication or antiphospholipid syndrome at any time, DOAC declined in 12 months, or DOAC not indicated in 12 months with latest non-null time in therapeutic range at least 65% in 6 months, all through the reporting date."
  - name: latest_anticoagulant_review_date
    description: "Date of the latest anticoagulant medication review or atrial fibrillation annual review through the reporting date; null when absent."
  - name: is_in_denominator
    description: "Always true; each row is eligible before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
