models:
  - name: fct_person_atrial_fibrillation_ind128
    description: >-
      Anticoagulant treatment in atrial fibrillation (NICE IND128). One row per person in
      the denominator on the build date.


      People registered on the build date on the atrial fibrillation register with latest
      CHA2DS2-VASc at least 2, or no CHA2DS2-VASc assessment and latest CHADS2 at least 2
      recorded before 1 April 2015. Achieved with an oral anticoagulant prescription in the
      last 6 months. Excludes anticoagulant allergy, adverse reaction or persisting
      contraindication at any time, or contraindication or intolerance in the last 12
      months. An invalid latest score cannot be replaced with an older valid score. Resolved
      atrial fibrillation is excluded. No personalised care adjustments are applied. Based
      on NICE NG196. Code lists: AFIB_COD, AFIBRES_COD, CHADVASC_COD, CHAD_COD (PCD);
      ORANTICOAGADVERS_COD, XORANTICOAGGENCON_COD, TXORANTICOAGGENCON_COD (PCD); 020802
      (BNF).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind128-atrial-fibrillation-current-treatment-with-anticoagulation
        indicator:
          id: "IND128"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "Atrial fibrillation anticoagulation"
          description_short: "Anticoagulant treatment in atrial fibrillation in the last 6 months"
          description_long: >-
            People registered on the build date on the atrial fibrillation register with
            latest CHA2DS2-VASc at least 2, or no CHA2DS2-VASc assessment and latest CHADS2
            at least 2 recorded before 1 April 2015. Achieved with an oral anticoagulant
            prescription in the last 6 months. Excludes anticoagulant allergy, adverse
            reaction or persisting contraindication at any time, or contraindication or
            intolerance in the last 12 months. An invalid latest score cannot be replaced
            with an older valid score. Resolved atrial fibrillation is excluded. No
            personalised care adjustments are applied. Based on NICE NG196. Code lists:
            AFIB_COD, AFIBRES_COD, CHADVASC_COD, CHAD_COD (PCD); ORANTICOAGADVERS_COD,
            XORANTICOAGGENCON_COD, TXORANTICOAGGENCON_COD (PCD); 020802 (BNF).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND128"
    columns: &af_columns
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "NICE indicator identifier."
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: reporting_date
        description: "Build date used to assess eligibility and achievement."
      - name: measurement_period_start
        description: "Inclusive start of the indicator measurement period before the reporting date."
      - name: age
        description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: current_practice_name
        description: "Name of the current registration practice."
      - name: latest_chadsvasc_score
        description: "Score from the latest CHA2DS2-VASc assessment through the reporting date, from 0 to 9; null when missing or invalid."
      - name: latest_chadsvasc_date
        description: "Date of the latest CHA2DS2-VASc assessment through the reporting date, including assessments without a valid score; null when no assessment is recorded."
      - name: latest_chads2_score
        description: "Score from the latest CHADS2 assessment before 1 April 2015 and through the reporting date, from 0 to 6; null when absent, missing or invalid."
      - name: latest_anticoagulant_order_date
        description: "Date of the latest oral anticoagulant prescription through the reporting date; null when none is recorded."
      - name: latest_anticoagulant_type
        description: "Type of the latest oral anticoagulant prescription: DOAC means direct-acting oral anticoagulant, VKA means vitamin K antagonist, and OTHER_ANTICOAGULANT means another oral anticoagulant; null when none is recorded."
      - name: latest_doac_order_date
        description: "Date of the latest direct-acting oral anticoagulant prescription through the reporting date; null when absent."
      - name: latest_vka_order_date
        description: "Date of the latest vitamin K antagonist prescription through the reporting date; null when absent."
      - name: is_doac_ineligible
        description: "Whether valvular atrial fibrillation is recorded by the reporting date, requiring a vitamin K antagonist for IND247."
      - name: has_doac_exception
        description: "Whether a vitamin K antagonist can count for IND247: DOAC contraindication or antiphospholipid syndrome at any time, DOAC declined in 12 months, or DOAC not indicated in 12 months with latest non-null time in therapeutic range at least 65% in 6 months, all through the reporting date."
      - name: latest_anticoagulant_review_date
        description: "Date of the latest anticoagulant medication review or atrial fibrillation annual review through the reporting date; null when absent."
      - name: is_in_denominator
        description: "Always true; each row is eligible before personalised care adjustments."
      - name: is_in_numerator
        description: "Whether the person meets the achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."

  - name: fct_person_atrial_fibrillation_ind247
    description: >-
      Choice of anticoagulant in atrial fibrillation (NICE IND247). One row per person
      in the denominator on the build date.


      People registered on the build date on the atrial fibrillation register with
      latest CHA2DS2-VASc at least 2. Achieved with a direct-acting oral anticoagulant
      (DOAC) prescription in the last 6 months. Valvular atrial fibrillation requires a
      vitamin K antagonist; antiphospholipid syndrome permits either. A vitamin K
      antagonist also counts with any DOAC contraindication, a DOAC decline in the last
      12 months, or DOAC not-indicated in those 12 months plus latest non-null time in
      therapeutic range at least 65% in the last 6 months. No personalised care
      adjustments are applied. Based on NICE NG196. Code lists: AFIB_COD, AFIBRES_COD,
      CHADVASC_COD, DOACCON_COD, DOACDEC_COD, DOACNI_COD, ANTIPHOSYND_COD, TTR_COD
      (PCD); AF_VALVULAR_OBS (ECL cache); 020802 (BNF).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind247-atrial-fibrillation-doa-cs-and-vitamin-k-antagonists
        indicator:
          id: "IND247"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "Atrial fibrillation drug choice"
          description_short: "DOAC or vitamin K antagonist treatment in atrial fibrillation in the last 6 months"
          description_long: >-
            People registered on the build date on the atrial fibrillation
            register with latest CHA2DS2-VASc at least 2. Achieved with a
            direct-acting oral anticoagulant (DOAC) prescription in the last 6
            months. Valvular atrial fibrillation requires a vitamin K antagonist;
            antiphospholipid syndrome permits either. A vitamin K antagonist also
            counts with any DOAC contraindication, a DOAC decline in the last 12
            months, or DOAC not-indicated in those 12 months plus latest non-null
            time in therapeutic range at least 65% in the last 6 months. No
            personalised care adjustments are applied. Based on NICE NG196. Code
            lists: AFIB_COD, AFIBRES_COD, CHADVASC_COD, DOACCON_COD, DOACDEC_COD,
            DOACNI_COD, ANTIPHOSYND_COD, TTR_COD (PCD); AF_VALVULAR_OBS (ECL
            cache); 020802 (BNF).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND247"
    columns: *af_columns

  - name: fct_person_atrial_fibrillation_ind127
    description: >-
      Annual stroke risk assessment in atrial fibrillation (NICE IND127). One row per person
      in the denominator on the build date.


      People registered on the build date on the atrial fibrillation register. Achieved with
      a CHA2DS2-VASc assessment in the 12 months before the build date. Excludes people
      whose latest eligible stroke risk score is at least 2 and predates that period. Only
      the latest eligible assessment determines this exclusion; a later low or unscored
      assessment replaces an earlier high score. CHADS2 scores count only before 1 April
      2015. Resolved atrial fibrillation is excluded. No personalised care adjustments are
      applied. Based on NICE NG196. Code lists: AFIB_COD, AFIBRES_COD, CHADVASC_COD,
      CHAD_COD (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind127-atrial-fibrillation-annual-stroke-risk-assessment
        indicator:
          id: "IND127"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "Atrial fibrillation stroke risk"
          description_short: "Stroke risk assessment in atrial fibrillation in the last 12 months"
          description_long: >-
            People registered on the build date on the atrial fibrillation register.
            Achieved with a CHA2DS2-VASc assessment in the 12 months before the build date.
            Excludes people whose latest eligible stroke risk score is at least 2 and
            predates that period. Only the latest eligible assessment determines this
            exclusion; a later low or unscored assessment replaces an earlier high score.
            CHADS2 scores count only before 1 April 2015. Resolved atrial fibrillation is
            excluded. No personalised care adjustments are applied. Based on NICE NG196.
            Code lists: AFIB_COD, AFIBRES_COD, CHADVASC_COD, CHAD_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND127"
    columns: *af_columns

  - name: fct_person_atrial_fibrillation_ind169
    description: >-
      Anticoagulant review in atrial fibrillation (NICE IND169). One row per person in the
      denominator on the build date.


      People registered on the build date aged over 18 on the atrial fibrillation register
      with an oral anticoagulant prescription in the 6 months before the build date.
      Achieved with an anticoagulant medication review or atrial fibrillation annual review
      in the last 12 months. Neither review code proves completion of all NICE review
      elements. Resolved atrial fibrillation is excluded. No personalised care adjustments
      are applied. Based on NICE NG196. Code lists: AFIB_COD, AFIBRES_COD,
      ORANTICOAGREVW_COD, AFMON_COD (PCD); 020802 (BNF).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind169-atrial-fibrillation-review-of-anticoagulation
        indicator:
          id: "IND169"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "Atrial fibrillation treatment review"
          description_short: "Anticoagulant review in atrial fibrillation in the last 12 months"
          description_long: >-
            People registered on the build date aged over 18 on the atrial fibrillation
            register with an oral anticoagulant prescription in the 6 months before the
            build date. Achieved with an anticoagulant medication review or atrial
            fibrillation annual review in the last 12 months. Neither review code proves
            completion of all NICE review elements. Resolved atrial fibrillation is
            excluded. No personalised care adjustments are applied. Based on NICE NG196.
            Code lists: AFIB_COD, AFIBRES_COD, ORANTICOAGREVW_COD, AFMON_COD (PCD); 020802
            (BNF).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND169"
    columns: *af_columns

  - name: fct_person_atrial_fibrillation_nice_indicators
    description: >-
      Atrial fibrillation risk assessment and treatment results. One row per person and
      indicator in the denominator on the build date.


      Includes NICE IND127, NICE IND128, NICE IND169, NICE IND247. Each indicator has
      its own denominator, measurement window and exclusions. Supporting evidence
      accompanies the achievement status. No personalised care adjustments are applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND128', 'IND247', 'IND127', 'IND169']
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_TREATED_IN_PERIOD', 'NEVER_TREATED', 'VKA_WITHOUT_DOAC_EXCEPTION', 'DOAC_WHERE_VKA_INDICATED', 'NOT_RECORDED_IN_PERIOD']
      - name: latest_chadsvasc_score
        description: "Score from the latest CHA2DS2-VASc assessment through the reporting date, from 0 to 9; null when missing or invalid."
      - name: latest_anticoagulant_order_date
        description: "Date of the latest oral anticoagulant prescription through the reporting date; null when none is recorded."
      - name: latest_anticoagulant_review_date
        description: "Date of the latest anticoagulant medication review or atrial fibrillation annual review through the reporting date; null when absent."

  - name: fct_person_atrial_fibrillation_nice_indicators_snapshot_input
    description: >-
      Atrial fibrillation risk assessment and treatment results used to track changes. One row
      per person and indicator in the denominator on the build date.


      Records eligibility, achievement and supporting evidence before personalised care
      adjustments. Reporting-date fields are omitted so a date change alone does not create a
      new history version.
      Labels join from def_indicator or the measure tables by indicator_id.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - not_null
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: latest_chadsvasc_score
        description: "Score from the latest CHA2DS2-VASc assessment through the build date, from 0 to 9; null when missing or invalid."
      - name: latest_anticoagulant_order_date
        description: "Date of the latest oral anticoagulant prescription through the build date; null when none is recorded."
      - name: latest_anticoagulant_type
        description: "Type of the latest oral anticoagulant prescription: DOAC means direct-acting oral anticoagulant, VKA means vitamin K antagonist, and OTHER_ANTICOAGULANT means another oral anticoagulant; null when none is recorded."
      - name: latest_anticoagulant_review_date
        description: "Date of the latest anticoagulant medication review or atrial fibrillation annual review through the build date; null when absent."
      - name: is_in_numerator
        description: "Whether the person meets the achievement rule on the build date."
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
