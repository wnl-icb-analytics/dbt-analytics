models:
- name: fct_person_hiv_test_at_registration_ind210
  description: HIV testing at registration. One row per registered, living, non-test person aged 16+ whose
    registration started at least 3 and less than 15 months before R. Registration starts in (R -
    15 months, R - 3 months]. HIV_COD and AIDS_COD diagnoses known before registration exclude the person.
    A HIV_TEST_COD completed test from registration through three calendar months after it qualifies.
    NCL is treated as entirely high-prevalence, so no area gate applies. This assumption must be reviewed
    before widening geography. Mass registrations remain included.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind210
      indicator:
        id: IND210
        type: MEASURE
        category: REGISTRATION
        clinical_domain: HIV
        name_short: 'HIV: testing at registration'
        description_short: Registration starts in (R - 15 months, R - 3 months]. HIV_COD and AIDS_COD
          diagnoses known before registration exclude the person. A HIV_TEST_COD completed test from registration
          through three calendar months after it qualifies. NCL is treated as entirely high-prevalence,
          so no area gate applies. This assumption must be reviewed before widening geography. Mass registrations
          remain included.
        description_long: HIV testing at registration. One row per registered, living, non-test person
          aged 16+ whose registration started at least 3 and less than 15 months before R. Registration
          starts in (R - 15 months, R - 3 months]. HIV_COD and AIDS_COD diagnoses known before registration
          exclude the person. A HIV_TEST_COD completed test from registration through three calendar months
          after it qualifies. NCL is treated as entirely high-prevalence, so no area gate applies. This
          assumption must be reviewed before widening geography. Mass registrations remain included.
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND210
