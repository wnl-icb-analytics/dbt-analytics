models:
- name: fct_person_hiv_test_at_registration_ind210
  description: >-
    HIV testing within 3 months of GP registration (NICE IND210). One row per person in
    the denominator on the build date.


    People registered on the build date aged 16 or over who registered 3 to 15 months
    before the build date, so everyone has had 3 months to complete testing. Excludes
    HIV or AIDS diagnosed before registration when recorded before registration or the
    recording date is missing. Achieved with a completed HIV test within 3 calendar
    months from registration. North Central London is treated as a high-prevalence area
    without geographical restrictions. Mass registrations count. No personalised care
    adjustments are applied. Based on NICE NG60. Code lists: HIV_COD, AIDS_COD (PCD);
    HIV_TEST_COD (ECL_CACHE).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind210
      indicator:
        id: IND210
        type: MEASURE
        category: REGISTRATION
        clinical_domain: HIV
        name_short: "HIV testing at registration"
        description_short: "HIV testing within 3 months of GP registration."
        description_long: >-
          People registered on the build date aged 16 or over who registered 3 to 15
          months before the build date, so everyone has had 3 months to complete
          testing. Excludes HIV or AIDS diagnosed before registration when recorded
          before registration or the recording date is missing. Achieved with a
          completed HIV test within 3 calendar months from registration. North Central
          London is treated as a high-prevalence area without geographical restrictions.
          Mass registrations count. No personalised care adjustments are applied. Based
          on NICE NG60. Code lists: HIV_COD, AIDS_COD (PCD); HIV_TEST_COD (ECL_CACHE).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND210
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
    data_tests:
    - not_null
    - unique
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "NICE published indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Build date used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Exclusive start of the 15-month registration cohort."
  - name: age
    description: "Age in completed years on the reporting date; null when the birth date is missing."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: current_practice_code
    description: "ODS code of the registration practice on the build date."
  - name: current_practice_name
    description: "Name of the registration practice on the build date."
  - name: registration_start_date
    description: "Start of the registration attributed on the reporting date; the HIV testing window begins on this date."
  - name: latest_record_date
    description: "Latest completed HIV test date from registration through the date 3 calendar months later, including both dates; null when none."
  - name: is_in_denominator
    description: "Always true; each row meets the documented eligibility and exclusion rules."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
