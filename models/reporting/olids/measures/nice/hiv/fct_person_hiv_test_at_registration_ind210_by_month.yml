models:
- name: fct_person_hiv_test_at_registration_ind210_by_month
  description: HIV testing at registration. One row per registered, living, non-test person aged 16+ whose
    registration started at least 3 and less than 15 months before R. Registration starts in (R - 15 months,
    R - 3 months]. HIV_COD and AIDS_COD diagnoses known before registration exclude the person. A HIV_TEST_COD
    completed test from registration through three calendar months after it qualifies. NCL is treated
    as entirely high-prevalence, so no area gate applies. This assumption must be reviewed before widening
    geography. Mass registrations remain included. History covers the last 60 completed month-ends and
    is recalculated at monthly refresh using current rules and code lists. Approximate birth/death dates
    and current gender/test flags limit historical interpretation. Diagnoses require clinical and recorded
    dates known by R; other evidence uses clinical dates through R. Later corrections can alter earlier
    results.
  config:
    meta:
      owner:
        name: EddieDavison92
  columns:
  - name: person_id
    description: Person in the indicator denominator.
  - name: indicator_id
    description: NICE indicator identifier.
  - name: indicator_name
    description: Published indicator subject.
  - name: reporting_date
    description: Completed month-end R. Recalculated for the last 60 completed month-ends using current
      rules and code lists.
  - name: measurement_period_start
    description: Exclusive lower boundary of the rolling eligibility or review window.
  - name: age
    description: Completed years at R.
  - name: condition_name
    description: Population defining the indicator.
  - name: practice_code
    description: ODS code of the registration practice at R.
  - name: practice_name
    description: Name of the registration practice at R.
  - name: registration_start_date
    description: Start of the registration attributed at R. The testing window begins on this date.
  - name: latest_record_date
    description: Latest qualifying evidence date in the specified window; null when no qualifying evidence
      exists.
  - name: is_in_denominator
    description: Always true for each eligible row.
  - name: is_in_numerator
    description: Whether qualifying evidence is present in the specified window.
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
