models:
- name: fct_person_hiv_test_at_registration_ind210_snapshot_input
  description: >-
    NICE hiv results. One row per person and indicator.


    Includes IND210, with the eligibility, exclusions and achievement rules documented for each
    indicator. Records achievement and evidence used to track changes in clinical results.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
