models:
- name: fct_person_hiv_test_at_registration_ind210_snapshot_input
  description: >-
    HIV testing at GP registration (NICE IND210). One row per person in the denominator.


    Records registration, testing evidence, practice and achievement used to track
    changes. Labels join from def_indicator or the measure table by indicator_id.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
