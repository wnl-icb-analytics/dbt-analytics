models:
- name: fct_person_fh_assessment_recent_cholesterol_ind261
  description: >-
    Familial hypercholesterolaemia assessment.


    One row per active, living, non-test person with
    valid total cholesterol above 7.5 mmol/L in 12 months, any age. Readings are strictly after 12 months before
    and on or before assessment; any qualifying reading counts. FH_ASSESS_COD, PCD SBROOME_COD, DULIPID_COD,
    POSSFH_COD, FH_REFER_COD, PCD FHYPGEN_COD, SECONDARY_HYPERLIPID_COD or SECONDARY_HYPERLIPID_HX_COD count
    at any time through assessment. Generic REFLIPID_COD referrals do not count. Possible-FH codes and PCD
    FHYP_COD clinical diagnoses count as assessment at any time through R. FH-specific referral codes only exist
    from 2021. Genetic evidence includes coded testing without verifying a positive result. No personalised
    care adjustments apply. Assessed on the build date.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind261
      indicator:
        id: IND261
        type: MEASURE
        category: FH_ASSESSMENT
        clinical_domain: Cardiometabolic
        name_short: 'Lipid disorders: FH assessment and diagnosis (new readings)'
        description_short: 'Lipid disorders: FH assessment and diagnosis (new readings)'
        description_long: Familial hypercholesterolaemia assessment. One row per active, living, non-test person
          with valid total cholesterol above 7.5 mmol/L in 12 months, any age. Readings are strictly after
          12 months before and on or before assessment; any qualifying reading counts. FH_ASSESS_COD, PCD SBROOME_COD,
          DULIPID_COD, POSSFH_COD, FH_REFER_COD, PCD FHYPGEN_COD, SECONDARY_HYPERLIPID_COD or SECONDARY_HYPERLIPID_HX_COD
          count at any time through assessment. Generic REFLIPID_COD referrals do not count. Possible-FH codes
          and PCD FHYP_COD clinical diagnoses count as assessment at any time through R. FH-specific referral
          codes only exist from 2021. Genetic evidence includes coded testing without verifying a positive
          result.
          No personalised care adjustments apply.
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND261
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: reporting_date
    description: Assessment date.
  - name: measurement_period_start
    description: 1 April 2026 for HF; earliest qualifying lifetime reading for IND260; 12 months before assessment
      for IND261.
  - name: latest_record_date
    description: Supporting achievement evidence date through assessment; null means no qualifying evidence.
  - name: is_in_denominator
    description: Always true.
  - name: is_in_numerator
    description: Whether the required category or assessment evidence exists.
  - name: qualifying_reading_date
    description: Earliest qualifying lifetime reading for IND260; latest high reading in 12 months for IND261.
  - name: qualifying_cholesterol_value
    description: Total cholesterol in mmol/L at the selected qualifying reading.
  - name: has_qualifying_secondary_hyperlipidaemia
    description: Explicit secondary diagnosis strictly after the reading for IND260; diagnosis or personal
      history at any time through assessment for IND261.
  - name: first_fh_assessment_date
    description: First clinical FH assessment or coded possible-FH result through assessment; null means none.
  - name: first_clinical_fh_diagnosis_date
    description: First PCD FHYP_COD clinical FH diagnosis through R; null means none. Counts as clinical
      assessment even before the qualifying cholesterol reading.
  - name: first_fh_referral_date
    description: First FH-specific referral through assessment; generic lipid referrals do not count.
  - name: first_genetic_fh_date
    description: First PCD FHYPGEN_COD evidence through assessment; may represent genetic testing rather than
      a confirmed diagnosis.
  - name: latest_secondary_hyperlipidaemia_date
    description: Latest explicit secondary lipid diagnosis through assessment. IND260 requires this strictly
      after its earliest reading.
  - name: first_secondary_history_date
    description: First personal secondary-lipid history through assessment. IND261 only.
