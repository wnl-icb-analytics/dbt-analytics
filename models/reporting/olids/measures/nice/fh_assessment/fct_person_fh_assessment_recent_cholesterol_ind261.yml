models:
- name: fct_person_fh_assessment_recent_cholesterol_ind261
  description: >-
    Familial hypercholesterolaemia assessment after recent high cholesterol (NICE IND261). One
    row per person in the denominator on the build date.


    People registered on the build date of any age with valid total cholesterol above 7.5 mmol/L
    in the 12 months before the build date; reports the latest high reading. Achieved with
    recorded familial hypercholesterolaemia assessment, possible or clinical diagnosis, referral
    or genetic evidence, or secondary hyperlipidaemia diagnosis or personal history at any time.
    Genetic testing need not be positive. Generic lipid referrals do not count; familial
    referral codes began in 2021. No personalised care adjustments are applied. Based on NICE
    CG71. Code lists: CHOL2_COD, SBROOME_COD, DULIPID_COD, POSSFH_COD, FHYP_COD, FHYPGEN_COD
    (PCD); FH_ASSESS_COD, FH_REFER_COD, SECONDARY_HYPERLIPID_COD, SECONDARY_HYPERLIPID_HX_COD
    (ECL_CACHE).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind261
      indicator:
        id: IND261
        type: MEASURE
        category: FH_ASSESSMENT
        clinical_domain: Cardiometabolic
        name_short: "Recent cholesterol assessment"
        description_short: "Familial hypercholesterolaemia assessment after high cholesterol in the last 12 months"
        description_long: >-
          People registered on the build date of any age with valid total cholesterol above 7.5
          mmol/L in the 12 months before the build date; reports the latest high reading.
          Achieved with recorded familial hypercholesterolaemia assessment, possible or clinical
          diagnosis, referral or genetic evidence, or secondary hyperlipidaemia diagnosis or
          personal history at any time. Genetic testing need not be positive. Generic lipid
          referrals do not count; familial referral codes began in 2021. No personalised care
          adjustments are applied. Based on NICE CG71. Code lists: CHOL2_COD, SBROOME_COD,
          DULIPID_COD, POSSFH_COD, FHYP_COD, FHYPGEN_COD (PCD); FH_ASSESS_COD, FH_REFER_COD,
          SECONDARY_HYPERLIPID_COD, SECONDARY_HYPERLIPID_HX_COD (ECL_CACHE).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND261
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: reporting_date
    description: "Build date used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Exclusive start of the cholesterol reading window, 12 months before the reporting date."
  - name: latest_record_date
    description: "Latest of the first recorded familial assessment, clinical diagnosis, referral and genetic evidence dates and the qualifying secondary hyperlipidaemia dates; null without qualifying evidence. Repeated familial evidence does not update this date."
  - name: is_in_denominator
    description: "Always true; each row is eligible before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the achievement rule on the reporting date."
  - name: qualifying_reading_date
    description: "Date of the latest valid total cholesterol reading above 7.5 mmol/L in the 12-month window; lower subsequent readings do not replace it."
  - name: qualifying_cholesterol_value
    description: "Total cholesterol of the selected qualifying reading, in mmol/L."
  - name: has_qualifying_secondary_hyperlipidaemia
    description: "Whether secondary hyperlipidaemia diagnosis or personal history is recorded at any time through the reporting date, including before the high reading."
  - name: first_fh_assessment_date
    description: "First recorded familial hypercholesterolaemia assessment or possible diagnosis through the reporting date; null when absent."
  - name: first_clinical_fh_diagnosis_date
    description: "First clinical familial hypercholesterolaemia diagnosis through the reporting date; null when absent. Counts as assessment even before the qualifying cholesterol reading."
  - name: first_fh_referral_date
    description: "First referral for familial hypercholesterolaemia assessment through the reporting date; null when absent. Generic lipid referrals do not count."
  - name: first_genetic_fh_date
    description: "First genetic familial hypercholesterolaemia record through the reporting date; null when absent. Includes testing without confirmation of a positive result."
  - name: latest_secondary_hyperlipidaemia_date
    description: "Latest secondary hyperlipidaemia diagnosis through the reporting date; null when absent. A diagnosis before the qualifying high reading also counts for achievement."
  - name: first_secondary_history_date
    description: "First personal secondary hyperlipidaemia history record through the reporting date for IND261; null when absent or not supplied by the indicator."
