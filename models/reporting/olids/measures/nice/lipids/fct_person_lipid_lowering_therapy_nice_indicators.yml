models:
  - name: fct_person_lipid_lowering_therapy_ind230
    description: >-
      Lipid-lowering treatment for secondary prevention (NICE IND230). One row per person in the
      denominator on the build date.


      People registered on the build date on coronary heart disease, stroke, transient ischaemic
      attack or peripheral arterial disease registers. Any haemorrhagic stroke history excludes
      them, even with another qualifying condition. Achieved with a lipid-lowering prescription
      in the 6 months before the build date. Statins, statin combinations, ezetimibe, bempedoic
      acid, PCSK9 inhibitors, inclisiran, fibrates and bile acid sequestrants count; nicotinic
      acid and omega-3 do not. No personalised care adjustments are applied. Based on NICE
      NG238. Code lists: 0212 (BNF); CHD_COD, STRK_COD, TIA_COD, PAD_COD, HSTRK_COD (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind230-cardiovascular-disease-prevention-secondary-prevention-with-lipid-lowering-therapies
        indicator:
          id: "IND230"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "Secondary prevention lipid treatment"
          description_short: "Lipid-lowering treatment in the last 6 months for secondary prevention"
          description_long: >-
            People registered on the build date on coronary heart disease, stroke, transient
            ischaemic attack or peripheral arterial disease registers. Any haemorrhagic stroke
            history excludes them, even with another qualifying condition. Achieved with a
            lipid-lowering prescription in the 6 months before the build date. Statins, statin
            combinations, ezetimibe, bempedoic acid, PCSK9 inhibitors, inclisiran, fibrates and
            bile acid sequestrants count; nicotinic acid and omega-3 do not. No personalised
            care adjustments are applied. Based on NICE NG238. Code lists: 0212 (BNF); CHD_COD,
            STRK_COD, TIA_COD, PAD_COD, HSTRK_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND230"
    columns: &indicator_columns
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "NICE indicator identifier."
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: reporting_date
        description: "Build date used to assess eligibility and achievement."
      - name: measurement_period_start
        description: "Inclusive start of the indicator measurement period before the reporting date."
      - name: age
        description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
      - name: condition_name
        description: "Short label for the population in the indicator denominator."
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: current_practice_name
        description: "Name of the current registration practice."
      - name: latest_lipid_lowering_order_date
        description: "Date of the latest qualifying lipid-lowering prescription through the reporting date; null when none is recorded."
      - name: latest_lipid_lowering_class
        description: "Drug class of the latest qualifying lipid-lowering prescription; null when none is recorded."
      - name: latest_lipid_lowering_product
        description: "BNF product name of the latest qualifying lipid-lowering prescription; null when none is recorded."
      - name: is_latest_lipid_lowering_statin
        description: "Whether the latest qualifying lipid-lowering prescription contains a statin; null when none is recorded."
      - name: is_in_denominator
        description: "Always true; each row is eligible before personalised care adjustments."
      - name: is_in_numerator
        description: "Whether the person meets the achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."

