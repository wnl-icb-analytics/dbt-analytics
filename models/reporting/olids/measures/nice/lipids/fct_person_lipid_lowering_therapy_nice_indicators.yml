  - name: fct_person_lipid_lowering_therapy_ind277
    description: |
      NICE IND277 lipid-lowering treatment in type 1 diabetes. One row per currently
      registered, living, non-test person aged over 40 on the type 1 diabetes register,
      assessed on the build date.

      Achievement requires a statin or qualifying non-statin lipid-lowering prescription
      in the preceding six months.

      Any history of haemorrhagic stroke excludes the person. Where both diabetes types
      are recorded, the register classifies the person as type 1.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind277-diabetes-t1-dm-and-lipid-lowering-therapies
        indicator:
          id: "IND277"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "T1DM lipid-lowering therapy"
          description_short: "Lipid-lowering therapy prescribed in the preceding 6 months for people with type 1 diabetes aged over 40"
          description_long: |
            NICE IND277 lipid-lowering treatment in type 1 diabetes. One row per currently
            registered, living, non-test person aged over 40 on the type 1 diabetes
            register, assessed on the build date.

            Achievement requires a statin or qualifying non-statin lipid-lowering
            prescription in the preceding six months.

            Any history of haemorrhagic stroke excludes the person. Where both diabetes
            types are recorded, the register classifies the person as type 1.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND277"
    columns: *indicator_columns

  - name: fct_person_lipid_lowering_therapy_ind229
    description: |
      NICE IND229 lipid-lowering treatment for primary prevention. One row per currently
      registered, living, non-test person aged 25 to 84 with a last recorded
      cardiovascular disease (CVD) risk score of at least 10% and no established CVD,
      assessed on the build date.

      Achievement requires a statin or qualifying non-statin lipid-lowering prescription
      in the preceding six months.

      Established CVD includes coronary heart disease, peripheral arterial disease, stroke
      or TIA, including haemorrhagic stroke. Eligible numeric risk tools include QRISK,
      JBS and Framingham. An invalid last score does not fall back to an older score.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind229-cardiovascular-disease-prevention-primary-prevention-with-lipid-lowering-therapies
        indicator:
          id: "IND229"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "Primary prevention lipid-lowering therapy"
          description_short: "Lipid-lowering treatment in six months for ages 25 to 84 with last CVD risk at least 10% and no CVD"
          description_long: |
            NICE IND229 lipid-lowering treatment for primary prevention. One row per
            currently registered, living, non-test person aged 25 to 84 with a last
            recorded cardiovascular disease (CVD) risk score of at least 10% and no
            established CVD, assessed on the build date.

            Achievement requires a statin or qualifying non-statin lipid-lowering
            prescription in the preceding six months.

            Established CVD includes coronary heart disease, peripheral arterial disease,
            stroke or TIA, including haemorrhagic stroke. Eligible numeric risk tools
            include QRISK, JBS and Framingham. An invalid last score does not fall back to
            an older score.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND229"
    columns: *indicator_columns

  - name: fct_person_lipid_lowering_therapy_ind274
    description: |
      NICE IND274 lipid-lowering treatment in type 2 diabetes with raised CVD risk. One
      row per currently registered, living, non-test person aged 25 to 84 on the type 2
      diabetes register with a valid coded cardiovascular disease (CVD) risk score of at
      least 10% in the preceding 12 months, assessed on the build date.

      Achievement requires a statin or qualifying non-statin lipid-lowering prescription
      in the preceding six months.

      Excludes moderate or severe coded frailty and established CVD, including
      haemorrhagic stroke. Any qualifying score in the period counts; numeric tools
      include QRISK, JBS and Framingham.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind274-diabetes-lipid-lowering-therapies-for-primary-prevention-of-cvd-t2-dm-and-10-risk
        indicator:
          id: "IND274"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "T2DM primary prevention lipid-lowering therapy"
          description_short: "Lipid-lowering treatment in six months for type 2 diabetes aged 25 to 84 with CVD risk at least 10% in 12 months"
          description_long: |
            NICE IND274 lipid-lowering treatment in type 2 diabetes with raised CVD risk.
            One row per currently registered, living, non-test person aged 25 to 84 on the
            type 2 diabetes register with a valid coded cardiovascular disease (CVD) risk
            score of at least 10% in the preceding 12 months, assessed on the build date.

            Achievement requires a statin or qualifying non-statin lipid-lowering
            prescription in the preceding six months.

            Excludes moderate or severe coded frailty and established CVD, including
            haemorrhagic stroke. Any qualifying score in the period counts; numeric tools
            include QRISK, JBS and Framingham.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND274"
    columns: *indicator_columns

  - name: fct_person_lipid_lowering_therapy_ind275
    description: |
      NICE IND275 lipid-lowering treatment in diabetes aged 40 and over. One row per
      currently registered, living, non-test person aged 40 or over on the diabetes
      register without established cardiovascular disease (CVD) or moderate or severe
      coded frailty, assessed on the build date.

      Achievement requires a statin or qualifying non-statin lipid-lowering prescription
      in the preceding six months.

      CVD includes haemorrhagic stroke. Type 2 diabetes with a valid coded CVD risk score
      below 10% in the preceding three years is excluded unless a later score reaches 10%,
      following QOF v51 DM034. People without a risk score remain eligible.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind275-diabetes-lipid-lowering-therapies-for-primary-prevention-of-cvd-40-years-and-over
        indicator:
          id: "IND275"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "Diabetes 40 and over lipid-lowering therapy"
          description_short: "Lipid-lowering therapy prescribed in the preceding 6 months for people with diabetes aged 40 and over without CVD"
          description_long: |
            NICE IND275 lipid-lowering treatment in diabetes aged 40 and over. One row per
            currently registered, living, non-test person aged 40 or over on the diabetes
            register without established cardiovascular disease (CVD) or moderate or
            severe coded frailty, assessed on the build date.

            Achievement requires a statin or qualifying non-statin lipid-lowering
            prescription in the preceding six months.

            CVD includes haemorrhagic stroke. Type 2 diabetes with a valid coded CVD risk
            score below 10% in the preceding three years is excluded unless a later score
            reaches 10%, following QOF v51 DM034. People without a risk score remain
            eligible.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND275"
    columns: *indicator_columns

  - name: fct_person_lipid_lowering_therapy_ind287
    description: |
      NICE IND287 lipid-lowering treatment after a new diagnosis. One row per currently
      registered, living, non-test person aged 25 to 84 with newly recorded hypertension
      or type 2 diabetes and a valid coded cardiovascular disease (CVD) risk score of at
      least 10% in the preceding 12 months, assessed on the build date.

      Achievement requires a statin or qualifying non-statin lipid-lowering prescription
      in the preceding six months.

      Excludes established CVD, including haemorrhagic stroke, stage 3 to 5 chronic kidney
      disease, familial hypercholesterolaemia and type 1 diabetes. Any qualifying score in
      the period counts; numeric tools include QRISK, JBS and Framingham.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind287-cardiovascular-disease-prevention-lipid-lowering-therapy-for-people-newly-diagnosed-with-hypertension-or-t2-dm
        indicator:
          id: "IND287"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "New hypertension or T2DM lipid-lowering therapy"
          description_short: "Lipid-lowering therapy prescribed in the preceding 6 months for people newly diagnosed with hypertension or type 2 diabetes and a CVD risk score of 10% or more"
          description_long: |
            NICE IND287 lipid-lowering treatment after a new diagnosis. One row per
            currently registered, living, non-test person aged 25 to 84 with newly
            recorded hypertension or type 2 diabetes and a valid coded cardiovascular
            disease (CVD) risk score of at least 10% in the preceding 12 months, assessed
            on the build date.

            Achievement requires a statin or qualifying non-statin lipid-lowering
            prescription in the preceding six months.

            Excludes established CVD, including haemorrhagic stroke, stage 3 to 5 chronic
            kidney disease, familial hypercholesterolaemia and type 1 diabetes. Any
            qualifying score in the period counts; numeric tools include QRISK, JBS and
            Framingham.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND287"
    columns: *indicator_columns

  - name: fct_person_lipid_lowering_therapy_nice_indicators
    description: |
      NICE lipid-lowering treatment results for IND229, IND230, IND231, IND274, IND275,
      IND276, IND277 and IND287. One row per eligible person and indicator on the build
      date, with lipid-lowering prescriptions and achievement.

      Each indicator retains its own population, time window and clinical criteria. A
      person can appear for several indicators. These results feed the combined NICE
      indicator status model.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person in the indicator denominator
      - name: indicator_id
        description: NICE indicator identifier
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND230', 'IND231', 'IND276', 'IND277', 'IND229', 'IND274', 'IND275', 'IND287']
      - name: indicator_status
        description: ACHIEVED, NOT_TREATED_IN_PERIOD or NEVER_TREATED
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_TREATED_IN_PERIOD', 'NEVER_TREATED']

  - name: fct_person_lipid_lowering_therapy_nice_indicators_snapshot_input
    description: |
      Current NICE lipid-lowering treatment results prepared for history tracking. One row
      per eligible person and indicator for IND229, IND230, IND231, IND274, IND275,
      IND276, IND277 and IND287, with current practice, lipid-lowering prescriptions and
      achievement.

      The snapshot records changes to these fields. Rolling reporting dates are omitted so
      the passage of a day alone does not create a new version.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: indicator_id
        description: NICE indicator identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: current_practice_code
        description: ODS code of the current registration practice at the build.
      - name: latest_lipid_lowering_order_date
        description: Date of the most recent counted order; null if never treated.
      - name: latest_lipid_lowering_class
        description: Class of the most recent counted order.
      - name: is_in_numerator
        description: Whether a counted order falls in the six-month window at the build.
      - name: indicator_status
        description: Outcome label at the build.
