models:
  - name: fct_person_lipid_lowering_therapy_ind230
    description: |
      NICE IND230 lipid-lowering treatment for secondary prevention. One row per currently
      registered, living, non-test person on the coronary heart disease, stroke or TIA, or
      peripheral arterial disease register, assessed on the build date.

      Achievement requires a statin or qualifying non-statin lipid-lowering prescription
      in the preceding six months.

      Any history of haemorrhagic stroke excludes the person, including people with
      another qualifying cardiovascular condition.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind230-cardiovascular-disease-prevention-secondary-prevention-with-lipid-lowering-therapies
        indicator:
          id: "IND230"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "CVD lipid-lowering therapy"
          description_short: "Lipid-lowering therapy prescribed in the preceding 6 months for people with CVD"
          description_long: |
            NICE IND230 lipid-lowering treatment for secondary prevention. One row per
            currently registered, living, non-test person on the coronary heart disease,
            stroke or TIA, or peripheral arterial disease register, assessed on the build
            date.

            Achievement requires a statin or qualifying non-statin lipid-lowering
            prescription in the preceding six months.

            Any history of haemorrhagic stroke excludes the person, including people with
            another qualifying cardiovascular condition.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND230"
    columns: &indicator_columns
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the treatment window
      - name: measurement_period_start
        description: Inclusive start of the six-month treatment window, six calendar months before the reporting date
      - name: age
        description: Age in years on the reporting date
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_lipid_lowering_order_date
        description: Date of the most recent counted lipid-lowering order; null if never treated
      - name: latest_lipid_lowering_class
        description: Class of the most recent counted order; null if never treated
      - name: latest_lipid_lowering_product
        description: BNF product name of the most recent counted order; null if never treated
      - name: is_latest_lipid_lowering_statin
        description: Whether the most recent counted order contains a statin; null if never treated
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether a counted lipid-lowering order falls in the six-month window
      - name: indicator_status
        description: ACHIEVED, NOT_TREATED_IN_PERIOD or NEVER_TREATED

  - name: fct_person_lipid_lowering_therapy_ind231
