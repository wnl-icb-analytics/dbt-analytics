      transient ischaemic attack or peripheral arterial disease, including haemorrhagic stroke)
      excludes them. QRISK, JBS and Framingham count; an invalid latest score prevents use of an
      older score. Achieved with a lipid-lowering prescription in the 6 months before the build
      date. Statins, statin combinations, ezetimibe, bempedoic acid, PCSK9 inhibitors,
      inclisiran, fibrates and bile acid sequestrants count; nicotinic acid and omega-3 do not.
      No personalised care adjustments are applied. Based on NICE NG238. Code lists: 0212 (BNF);
