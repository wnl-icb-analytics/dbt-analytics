  - name: fct_person_lipid_lowering_therapy_nice_indicators
    description: >-
      Lipid-lowering treatment results. One row per person and indicator in the denominator on
      the build date.


      Includes NICE IND229, NICE IND230, NICE IND231, NICE IND274, NICE IND275, NICE IND276,
      NICE IND277, NICE IND287. Each indicator has its own denominator, measurement window and
      exclusions. Supporting evidence accompanies the achievement status. No personalised care
      adjustments are applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND230', 'IND231', 'IND276', 'IND277', 'IND229', 'IND274', 'IND275', 'IND287']
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_TREATED_IN_PERIOD', 'NEVER_TREATED']

  - name: fct_person_lipid_lowering_therapy_nice_indicators_snapshot_input
    description: >-
      Lipid-lowering treatment results used to track changes. One row per person and indicator
      in the denominator on the build date.


      Records eligibility, achievement and supporting evidence before personalised care
      adjustments. Reporting-date fields are omitted so a date change alone does not create a
      new history version.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - not_null
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: latest_lipid_lowering_order_date
        description: "Date of the latest qualifying lipid-lowering prescription through the build date; null when none is recorded."
      - name: latest_lipid_lowering_class
        description: "Drug class of the latest qualifying lipid-lowering prescription; null when none is recorded."
      - name: is_in_numerator
        description: "Whether the person meets the achievement rule on the build date."
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
