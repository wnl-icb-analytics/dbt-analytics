        indicator:
          id: "IND231"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "CKD lipid-lowering therapy"
          description_short: "Lipid-lowering therapy prescribed in the preceding 6 months for people on the CKD register"
          description_long: |
            NICE IND231 lipid-lowering treatment in chronic kidney disease. One row per
            currently registered, living, non-test person aged 18 or over on the stage 3
            to 5 chronic kidney disease register, assessed on the build date.

            Achievement requires a statin or qualifying non-statin lipid-lowering
            prescription in the preceding six months.

            Any history of haemorrhagic stroke excludes the person.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND231"
    columns: *indicator_columns

