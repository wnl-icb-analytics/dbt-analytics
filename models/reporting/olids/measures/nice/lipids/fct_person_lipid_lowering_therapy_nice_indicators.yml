      reverse exclusion. People without scores remain eligible. Achieved with a lipid-lowering
      prescription in the 6 months before the build date. Statins, statin combinations,
      ezetimibe, bempedoic acid, PCSK9 inhibitors, inclisiran, fibrates and bile acid
      sequestrants count; nicotinic acid and omega-3 do not. No personalised care adjustments
