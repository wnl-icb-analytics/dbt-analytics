          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "Primary prevention lipid treatment"
          description_short: "Lipid-lowering treatment in the last 6 months for primary prevention"
          description_long: >-
            People registered on the build date aged 25 to 84 with latest valid cardiovascular
