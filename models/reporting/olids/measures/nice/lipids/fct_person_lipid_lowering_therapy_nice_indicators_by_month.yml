models:
- name: fct_person_lipid_lowering_therapy_ind230_by_month
  description: >-
    Lipid-lowering treatment for secondary prevention (NICE IND230). One row per person in the
    denominator at each month-end.


    People registered at the month-end on coronary heart disease, stroke, transient ischaemic
    attack or peripheral arterial disease registers. Any haemorrhagic stroke history excludes
    them, even with another qualifying condition. Achieved with a lipid-lowering prescription in
    the 6 months before the month-end. Statins, statin combinations, ezetimibe, bempedoic acid,
    PCSK9 inhibitors, inclisiran, fibrates and bile acid sequestrants count; nicotinic acid and
    omega-3 do not. No personalised care adjustments are applied. Recalculated for each of the
    last 60 month-ends with current rules, code lists and records, so later corrections can
    change past months. Based on NICE NG238. Code lists: 0212 (BNF); CHD_COD, STRK_COD, TIA_COD,
    PAD_COD, HSTRK_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind230-cardiovascular-disease-prevention-secondary-prevention-with-lipid-lowering-therapies
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Inclusive start of the indicator measurement period before the reporting date."
  - name: age
    description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice attributed at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice attributed at the reporting month-end."
  - name: latest_lipid_lowering_order_date
    description: "Date of the latest qualifying lipid-lowering prescription through the reporting date; null when none is recorded."
  - name: latest_lipid_lowering_class
    description: "Drug class of the latest qualifying lipid-lowering prescription; null when none is recorded."
  - name: latest_lipid_lowering_product
    description: "BNF product name of the latest qualifying lipid-lowering prescription; null when none is recorded."
  - name: is_latest_lipid_lowering_statin
    description: "Whether the latest qualifying lipid-lowering prescription contains a statin; null when none is recorded."
  - name: is_in_denominator
    description: "Always true; each row is eligible before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
