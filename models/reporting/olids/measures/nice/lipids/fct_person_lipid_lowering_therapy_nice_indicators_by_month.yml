    bempedoic acid, PCSK9 inhibitors, inclisiran, fibrates and bile acid sequestrants count;
    nicotinic acid and omega-3 do not. No personalised care adjustments are applied.
    Recalculated for each of the last 60 month-ends with current rules, code lists and records,
    so later corrections can change past months. Based on NICE NG238. Code lists: 0212 (BNF);
    HYP_COD, HYPRES_COD, DM_COD, DMTYPE1_COD, DMTYPE2_COD, DMRES_COD, CHD_COD, STRK_COD,
    TIA_COD, PAD_COD, HSTRK_COD, CKD_COD, CKD1AND2_COD, CKDRES_COD, FHYP_COD, CVDRISKASS_COD,
    CVDASS2_COD, QRISKSCORE_COD (PCD).
