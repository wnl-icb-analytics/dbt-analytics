- name: fct_person_lipid_lowering_therapy_ind229_by_month
  description: >-
    Lipid-lowering treatment for primary prevention (NICE IND229). One row per person in the
    denominator at each month-end.


    People registered at the month-end aged 25 to 84 with latest valid cardiovascular risk of at
    least 10%. Established cardiovascular disease (coronary heart disease, stroke, transient
    ischaemic attack or peripheral arterial disease, including haemorrhagic stroke) excludes
    them. QRISK, JBS and Framingham count; an invalid latest score prevents use of an older
    score. Achieved with a lipid-lowering prescription in the 6 months before the month-end.
    Statins, statin combinations, ezetimibe, bempedoic acid, PCSK9 inhibitors, inclisiran,
    fibrates and bile acid sequestrants count; nicotinic acid and omega-3 do not. No
    personalised care adjustments are applied. Recalculated for each of the last 60 month-ends
    with current rules, code lists and records, so later corrections can change past months.
    Based on NICE NG238. Code lists: 0212 (BNF); CHD_COD, STRK_COD, TIA_COD, PAD_COD, HSTRK_COD,
    CVDRISKASS_COD, CVDASS2_COD, QRISKSCORE_COD (PCD).
