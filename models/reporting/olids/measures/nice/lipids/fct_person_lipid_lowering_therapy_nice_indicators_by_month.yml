models:
- name: fct_person_lipid_lowering_therapy_ind230_by_month
  description: NICE IND230. One row per eligible person and completed month-end. All populations are active,
    living and non-test at that date. CHD, stroke or TIA, or PAD register members, excluding any haemorrhagic-stroke
    history. Achievement requires a statin or qualifying non-statin lipid-lowering prescription in the
    inclusive preceding six calendar months. The latest prescription detail remains visible after treatment
    expires. Null prescription detail means no counted order by that date. Recalculated monthly for the
    last 60 completed month-ends using today's rules and code lists. Registers use clinical and recorded
    dates; other evidence uses its clinical or order date through the month-end. Later corrections can
    change earlier results. Registration and practice follow the existing monthly spine, including its
    current-registration priority for overlaps. Birth and death dates are approximate; missing birth dates
    prevent historical active rows. Current gender and test flags apply retrospectively. Personalised
    care adjustments are not applied.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind230-cardiovascular-disease-prevention-secondary-prevention-with-lipid-lowering-therapies
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: person_id
    description: Person in the indicator denominator
  - name: indicator_id
    description: NICE indicator identifier
  - name: indicator_name
    description: Published NICE indicator name
  - name: reporting_date
    description: Completed month-end used for eligibility and the treatment window
  - name: measurement_period_start
    description: Inclusive start of the six-month treatment window, six calendar months before the reporting
      date
  - name: age
    description: Completed years at the month-end from the approximate birth month.
  - name: condition_name
    description: Population defining the indicator
  - name: practice_code
    description: ODS code of the registration practice at the month-end
  - name: practice_name
    description: Name of the registration practice at the month-end
  - name: latest_lipid_lowering_order_date
    description: Date of the most recent counted lipid-lowering order; null if never treated
  - name: latest_lipid_lowering_class
    description: Class of the most recent counted order; null if never treated
  - name: latest_lipid_lowering_product
    description: BNF product name of the most recent counted order; null if never treated
  - name: is_latest_lipid_lowering_statin
    description: Whether the most recent counted order contains a statin; null if never treated
  - name: is_in_denominator
    description: Always true; every row is an eligible person before personalised care adjustments
  - name: is_in_numerator
    description: Whether a counted lipid-lowering order falls in the six-month window
  - name: indicator_status
    description: ACHIEVED, NOT_TREATED_IN_PERIOD or NEVER_TREATED
