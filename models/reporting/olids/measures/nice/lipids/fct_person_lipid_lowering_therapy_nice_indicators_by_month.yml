- name: fct_person_lipid_lowering_therapy_ind275_by_month
  description: >-
    Lipid-lowering treatment for diabetes aged 40 or over (NICE IND275). One row per person in
    the denominator at each month-end.


    People registered at the month-end aged 40 or over on the diabetes register. Moderate or
    severe coded frailty or established cardiovascular disease, including haemorrhagic stroke,
    excludes them. Type 2 diabetes with valid coded risk below 10% in the preceding 3 years
    excludes them unless a later score in that period reaches 10%; same-day high scores do not
    reverse exclusion. People without scores remain eligible. Achieved with a lipid-lowering
    prescription in the 6 months before the month-end. Statins, statin combinations, ezetimibe,
    bempedoic acid, PCSK9 inhibitors, inclisiran, fibrates and bile acid sequestrants count;
    nicotinic acid and omega-3 do not. No personalised care adjustments are applied.
    Recalculated for each of the last 60 month-ends with current rules, code lists and records,
    so later corrections can change past months. Based on NICE NG238. Code lists: 0212 (BNF);
    DM_COD, DMTYPE1_COD, DMTYPE2_COD, DMRES_COD, CHD_COD, STRK_COD, TIA_COD, PAD_COD, HSTRK_COD,
    CVDRISKASS_COD, CVDASS2_COD, QRISKSCORE_COD, MODFRAIL_COD, SEVFRAIL_COD (PCD).
