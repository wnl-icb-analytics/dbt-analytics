models:
  - name: fct_person_cholesterol_control_ind278
    description: >-
      Cholesterol control for secondary prevention (NICE IND278). One row per person in the
      denominator on the build date.


      People registered on the build date on coronary heart disease, stroke, transient ischaemic
      attack or peripheral arterial disease registers. Familial hypercholesterolaemia or any
      haemorrhagic stroke history excludes them, even with another qualifying condition.
      Achieved when the latest cholesterol result in the 12 months before the build date is
      valid and LDL at most 2.0 mmol/L or non-HDL at most 2.6. LDL takes priority on the same
      day. An invalid latest result is unassessable without using an older result. Missing units
      mean mmol/L and trigger review; review flags do not affect achievement. No personalised
      care adjustments are applied. Based on NICE NG238. Code lists: CHD_COD, STRK_COD, TIA_COD,
      PAD_COD, HSTRK_COD, FHYP_COD (PCD); LDLCCHOL_COD, NONHDLCCHOL_COD.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind278-cardiovascular-disease-prevention-cholesterol-treatment-target-secondary-prevention
        indicator:
          id: IND278
          type: MEASURE
          category: CARDIOVASCULAR
          clinical_domain: Cardiometabolic
          name_short: "Secondary prevention cholesterol"
          description_short: "Latest LDL at most 2.0 mmol/L or non-HDL at most 2.6 mmol/L for secondary prevention"
          description_long: >-
            People registered on the build date on coronary heart disease, stroke, transient
            ischaemic attack or peripheral arterial disease registers. Familial
            hypercholesterolaemia or any haemorrhagic stroke history excludes them, even with
            another qualifying condition. Achieved when the latest cholesterol result in the 12
            months before the build date is valid and LDL at most 2.0 mmol/L or non-HDL at most
            2.6. LDL takes priority on the same day. An invalid latest result is unassessable
            without using an older result. Missing units mean mmol/L and trigger review; review
            flags do not affect achievement. No personalised care adjustments are applied. Based
            on NICE NG238. Code lists: CHD_COD, STRK_COD, TIA_COD, PAD_COD, HSTRK_COD, FHYP_COD
            (PCD); LDLCCHOL_COD, NONHDLCCHOL_COD.
          is_qof: false
          source_column: is_in_numerator
          usage_contexts:
            - NICE_GUIDANCE
          sort_order: NICE_IND278
          thresholds:
            - population_group: CVD
              threshold_type: LDL_CHOLESTEROL
              threshold_value: '2.0'
              threshold_operator: AT_OR_BELOW
              threshold_unit: mmol/L
              description: Secondary prevention LDL cholesterol target
              sort_order: 1
            - population_group: CVD
              threshold_type: NON_HDL_CHOLESTEROL
              threshold_value: '2.6'
              threshold_operator: AT_OR_BELOW
              threshold_unit: mmol/L
              description: Secondary prevention non-HDL cholesterol target
              sort_order: 2
    columns:
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - unique
          - not_null
      - name: indicator_id
        description: "NICE indicator identifier."
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: reporting_date
        description: "Build date used to assess eligibility and achievement."
      - name: measurement_period_start
        description: "Inclusive start of the indicator measurement period before the reporting date."
      - name: age
        description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: current_practice_name
        description: "Name of the current registration practice."
      - name: has_chd
        description: "Whether the person is on the coronary heart disease register on the reporting date."
      - name: has_stroke_tia
        description: "Whether the person is on the stroke or transient ischaemic attack register on the reporting date."
      - name: has_pad
        description: "Whether the person is on the peripheral arterial disease register on the reporting date."
      - name: latest_lipid_observation_id
        description: "Source observation identifier of the selected LDL or non-HDL result in the 12-month window; null when no result is recorded."
      - name: latest_lipid_date
        description: "Clinical timestamp of the selected LDL or non-HDL result in the 12-month window; null when no result is recorded."
      - name: lipid_type
        description: "LDL cholesterol or Non-HDL cholesterol for the selected result; null when no result is recorded."
      - name: latest_lipid_value
        description: "Selected cholesterol value in mmol/L without rounding. Null for missing values, unsupported units or no result. Missing units are assumed to be mmol/L and flagged for review."
      - name: latest_lipid_recorded_value
        description: "Numeric value supplied by OLIDS before conversion; may differ from the original laboratory value. Null when no numeric result is available."
      - name: source_result_unit_display
        description: "Source unit label for the selected result; null when unavailable."
      - name: mapped_result_unit_display
        description: "Mapped unit label supplied by OLIDS for the selected result; null when unavailable."
      - name: conversion_factor
        description: "Multiplier used to convert the recorded value to mmol/L; null when units cannot be converted or no result is recorded."
      - name: plausibility_status
        description: "Whether the selected value is within the shared valid lipid range; null when no result is recorded in the 12-month window."
      - name: is_latest_lipid_review_required
        description: "Whether the selected result has a unit conversion, conflicting units, missing or unsupported units, or a plausibility concern; null when no result is recorded. The flag does not change achievement or select an older result; false does not prove accuracy."
      - name: unit_status
        description: "Unit interpretation of the selected cholesterol result; null when no result is recorded in the 12-month window."
      - name: indicator_threshold
        description: "Inclusive upper cholesterol target in mmol/L: 2.0 for LDL or 2.6 for non-HDL; null when no result is recorded."
      - name: threshold_unit
        description: "mmol/L, the unit for the cholesterol target and standardised result."
      - name: is_in_denominator
        description: "Always true; each row is eligible before personalised care adjustments."
      - name: is_lipid_recorded_in_last_12m
        description: "Whether an LDL or non-HDL result is recorded in the 12-month window, including both boundary dates and invalid results."
      - name: is_latest_lipid_valid
        description: "Whether the selected result is finite and within 0.1 to 20 mmol/L, inclusive. Convertible units are standardised and missing units are assumed to be mmol/L; false when no result exists."
      - name: is_in_numerator
        description: "Whether the person meets the achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'ABOVE_TARGET', 'NOT_ASSESSABLE', 'NOT_RECORDED_IN_PERIOD']
