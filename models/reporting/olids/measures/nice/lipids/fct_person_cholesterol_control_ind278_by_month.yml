models:
- name: fct_person_cholesterol_control_ind278_by_month
  description: NICE IND278. One row per eligible person, indicator and completed month-end. Eligible secondary-prevention
    CVD members excluding FH and haemorrhagic-stroke history. Latest LDL or non-HDL in the inclusive preceding
    12 months; LDL wins on a shared latest day, then timestamp and identifier. Invalid latest evidence
    remains unassessable. Targets are <=2.0 mmol/L LDL or <=2.6 mmol/L non-HDL. Out-of-window result fields
    are null. Recalculated at monthly refresh for the last 60 completed month-ends using today's rules
    and code lists. Registration and practice come from the existing monthly spine. Registration start
    is inclusive, end and death dates exclusive. Overlapping registrations retain the spine's current-registration
    priority. Birth and death dates are approximate; missing birth dates prevent historical active rows.
    Current gender and test flags apply retrospectively. Diagnosis state uses both clinical and recorded
    dates. Other evidence uses its clinical or order date through the month-end. Later corrections and
    current code-list changes can alter earlier results.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind278-cardiovascular-disease-prevention-cholesterol-treatment-target-secondary-prevention
  columns:
  - name: person_id
    description: Person in the unadjusted indicator denominator.
  - name: indicator_id
    description: NICE indicator identifier, IND278.
  - name: indicator_name
    description: Published NICE indicator name.
  - name: reporting_date
    description: Completed month-end at which eligibility and evidence are assessed. DATE; no current-day
      row.
  - name: measurement_period_start
    description: Inclusive start date, 12 calendar months before the reporting date.
  - name: age
    description: Completed years at the month-end, calculated from the approximate birth month.
  - name: practice_code
    description: ODS practice code at the month-end under the monthly spine attribution.
  - name: practice_name
    description: Practice name at the month-end under the monthly spine attribution.
  - name: has_chd
    description: Whether the person qualifies through the CHD register by the reporting date.
  - name: has_stroke_tia
    description: Whether the person qualifies through the stroke/TIA register by the reporting date.
  - name: has_pad
    description: Whether the person qualifies through the PAD register by the reporting date.
  - name: latest_lipid_observation_id
    description: Selected source observation identifier; null if no result is recorded in the period.
  - name: latest_lipid_date
    description: Clinical date of the selected result; null if no result is recorded in the period.
  - name: lipid_type
    description: LDL cholesterol or Non-HDL cholesterol; null if no result is recorded in the period.
  - name: latest_lipid_value
    description: Selected candidate conversion in mmol/L, without rounding. Check is_latest_lipid_review_required.
      Null for missing numeric values or unsupported units, and when no result is recorded. A result with
      no recorded unit is kept as mmol/L and flagged for review.
  - name: latest_lipid_recorded_value
    description: Numeric value received from OLIDS before our conversion. Null for a missing numeric value
      or no recent observation. Not guaranteed to be the original laboratory value.
  - name: source_result_unit_display
    description: Source unit concept label for the selected result. Null if unavailable.
  - name: mapped_result_unit_display
    description: Mapped unit label supplied by OLIDS for the selected result. Null if unavailable.
  - name: conversion_factor
    description: Multiplier applied to the recorded value. Null when units cannot be converted or no recent
      observation exists.
  - name: plausibility_status
    description: Validity status of the selected result against the shared lipid ranges. Within valid
      range means the result is assessable. Null when no recent observation exists.
  - name: is_latest_lipid_review_required
    description: Whether the selected result has a unit conversion, conflicting unit metadata, missing
      or unsupported units, or a numeric plausibility concern. Null when no recent observation exists.
      Does not change numerator membership or replace the selected observation with an older one. False
      is not verified accuracy.
  - name: unit_status
    description: Unit interpretation from the observation model; null if no result is recorded in the
      period.
  - name: indicator_threshold
    description: Inclusive upper threshold in mmol/L for the selected lipid type; null if no result is
      recorded.
  - name: threshold_unit
    description: Unit for the indicator threshold and standardised lipid value, mmol/L.
  - name: is_in_denominator
    description: Always true. Every row is an eligible person before personalised care adjustments.
  - name: is_lipid_recorded_in_last_12m
    description: Whether an LDL or non-HDL observation exists in the inclusive measurement period, including
      invalid results.
  - name: is_latest_lipid_valid
    description: Whether the selected result converts to a finite value within the inclusive 0.1-20 mmol/L
      range. Convertible units are standardised to mmol/L; absent units are assumed to be mmol/L. False
      when no result exists.
  - name: is_in_numerator
    description: Whether the last recorded result in the period is valid and at or below its inclusive
      target.
  - name: indicator_status
    description: ACHIEVED, ABOVE_TARGET, NOT_ASSESSABLE (latest result invalid) or NOT_RECORDED_IN_PERIOD.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
