models:
- name: fct_person_antithrombotic_therapy_ind94_by_month
  description: >-
    Antiplatelet treatment in peripheral arterial disease (NICE IND94). One row per person
    in the denominator at each month-end.


    People registered at the month-end on the peripheral arterial disease register without
    an oral anticoagulant prescription in the 15 months before the month-end. Achieved
    with an antiplatelet prescription, over-the-counter salicylate use or clopidogrel
    prophylaxis in those 15 months. This window also defines the anticoagulant exclusion;
    NICE gives no separate exclusion window. No personalised care adjustments are applied.
    Based on NICE CG147. Recalculated for each of the last 60 month-ends with current
    rules, code lists and records, so later corrections can change past months. Code
    lists: OSAL_COD, CLO_COD, ORANTICOAG_COD (PCD); 0209, 020802 (BNF); PAD_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind94-peripheral-arterial-disease-antiplatelets
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Inclusive start of the indicator measurement period before the reporting date."
  - name: age
    description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice attributed at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice attributed at the reporting month-end."
  - name: latest_antiplatelet_order_date
    description: "Date of the latest antiplatelet prescription through the reporting date; null when none is recorded."
  - name: latest_anticoagulant_order_date
    description: "Date of the latest oral anticoagulant prescription through the reporting date; null when none is recorded."
  - name: latest_anticoagulant_type
    description: "Drug type of the latest oral anticoagulant prescription: DOAC means direct-acting oral anticoagulant and VKA means vitamin K antagonist; null when none is recorded."
  - name: latest_antiplatelet_record_date
    description: "Date of the latest recorded over-the-counter salicylate use or clopidogrel prophylaxis through the reporting date; null when absent."
  - name: latest_anticoagulant_record_date
    description: "Date of the latest oral anticoagulant prophylaxis record through the reporting date; null when absent."
  - name: is_antiplatelet_in_period
    description: "Whether an antiplatelet prescription, over-the-counter salicylate use or clopidogrel prophylaxis record falls within the measurement period."
  - name: is_anticoagulant_in_period
    description: "Whether an oral anticoagulant prescription or prophylaxis record falls within the period for IND132 and IND133. IND94 uses prescriptions only and excludes people prescribed anticoagulants in its period."
  - name: is_in_denominator
    description: "Always true; each row is eligible before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
