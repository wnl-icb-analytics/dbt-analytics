models:
  - name: fct_person_antithrombotic_therapy_ind132
    description: |
      NICE IND132 antiplatelet or anticoagulant treatment in coronary heart disease. One
      row per currently registered, living, non-test person on the coronary heart disease
      register, assessed on the build date.

      Achievement requires antiplatelet or oral anticoagulant treatment recorded in the
      preceding 12 months. Prescriptions, recorded over-the-counter salicylate use and
      oral anticoagulant prophylaxis count.

      Excludes people only when salicylates, clopidogrel and oral anticoagulants are all
      contraindicated. Each class requires a persisting contraindication at any time or an
      expiring contraindication in 12 months, following QOF v51 CHD005.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind132-angina-and-coronary-heart-disease-anti-platelet-or-anticoagulation
        indicator:
          id: "IND132"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "CHD antiplatelet or anticoagulant"
          description_short: "Antiplatelet or anticoagulant use recorded in the preceding 12 months for people with coronary heart disease"
          description_long: |
            NICE IND132 antiplatelet or anticoagulant treatment in coronary heart disease.
            One row per currently registered, living, non-test person on the coronary
            heart disease register, assessed on the build date.

            Achievement requires antiplatelet or oral anticoagulant treatment recorded in
            the preceding 12 months. Prescriptions, recorded over-the-counter salicylate
            use and oral anticoagulant prophylaxis count.

            Excludes people only when salicylates, clopidogrel and oral anticoagulants are
            all contraindicated. Each class requires a persisting contraindication at any
            time or an expiring contraindication in 12 months, following QOF v51 CHD005.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND132"
    columns: &antithrombotic_columns
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_antiplatelet_order_date
        description: Date of the most recent antiplatelet order; null if never ordered
      - name: latest_anticoagulant_order_date
        description: Date of the most recent oral anticoagulant order; null if never ordered
      - name: latest_anticoagulant_type
        description: DOAC or VKA for the most recent oral anticoagulant order; null if never ordered
      - name: latest_antiplatelet_record_date
        description: Latest recorded OTC salicylate use from OSAL_COD; null if none
      - name: latest_anticoagulant_record_date
        description: Latest oral anticoagulant prophylaxis record from ORANTICOAG_COD; null if none
      - name: is_antiplatelet_in_period
        description: Whether an antiplatelet order or OTC salicylate record falls in the measurement period
      - name: is_anticoagulant_in_period
        description: Whether an oral anticoagulant order or prophylaxis record falls in the measurement period for IND132 and IND133. IND94 uses orders only and excludes these from its denominator
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or the reason not achieved
  - name: fct_person_antithrombotic_therapy_ind133
    description: |
      NICE IND133 antiplatelet or anticoagulant treatment after stroke or TIA. One row per
      currently registered, living, non-test person on the stroke or transient ischaemic
      attack (TIA) register with recorded non-haemorrhagic stroke or TIA, assessed on the
      build date.

      Achievement requires antiplatelet or oral anticoagulant treatment recorded in the
      preceding 12 months. Prescriptions, recorded over-the-counter salicylate use and
      oral anticoagulant prophylaxis count.

      Unspecified stroke alone does not qualify; a separate haemorrhagic stroke does not
      remove qualifying non-haemorrhagic stroke or TIA. Excludes contraindications to all
      four classes: salicylates, oral anticoagulants, clopidogrel and dipyridamole.
      Persisting contraindications count at any time and expiring contraindications for 12
      months.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind133-stroke-and-ischaemic-attack-anti-platelet-or-anticoagulation
        indicator:
          id: "IND133"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "Stroke/TIA antiplatelet or anticoagulant"
          description_short: "Antiplatelet or anticoagulant use recorded in the preceding 12 months for people with non-haemorrhagic stroke or TIA"
          description_long: |
            NICE IND133 antiplatelet or anticoagulant treatment after stroke or TIA. One
            row per currently registered, living, non-test person on the stroke or
            transient ischaemic attack (TIA) register with recorded non-haemorrhagic
            stroke or TIA, assessed on the build date.

            Achievement requires antiplatelet or oral anticoagulant treatment recorded in
            the preceding 12 months. Prescriptions, recorded over-the-counter salicylate
            use and oral anticoagulant prophylaxis count.

            Unspecified stroke alone does not qualify; a separate haemorrhagic stroke does
            not remove qualifying non-haemorrhagic stroke or TIA. Excludes
            contraindications to all four classes: salicylates, oral anticoagulants,
            clopidogrel and dipyridamole. Persisting contraindications count at any time
            and expiring contraindications for 12 months.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND133"
    columns: *antithrombotic_columns
  - name: fct_person_antithrombotic_therapy_ind94
    description: |
      NICE IND94 antiplatelet treatment in peripheral arterial disease. One row per
      currently registered, living, non-test person on the peripheral arterial disease
      register without an oral anticoagulant prescription in the preceding 15 months,
      assessed on the build date.

      Achievement requires an antiplatelet prescription or recorded over-the-counter
      salicylate use in the preceding 15 months.

      The 15-month window also defines current anticoagulant treatment for the exclusion.
      NICE does not specify a separate window for that exclusion.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind94-peripheral-arterial-disease-antiplatelets
        indicator:
          id: "IND94"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "PAD antiplatelet"
          description_short: "Antiplatelet use recorded in the preceding 15 months for people with peripheral arterial disease not on an anticoagulant"
          description_long: |
            NICE IND94 antiplatelet treatment in peripheral arterial disease. One row per
            currently registered, living, non-test person on the peripheral arterial
            disease register without an oral anticoagulant prescription in the preceding
            15 months, assessed on the build date.

            Achievement requires an antiplatelet prescription or recorded over-the-counter
            salicylate use in the preceding 15 months.

            The 15-month window also defines current anticoagulant treatment for the
            exclusion. NICE does not specify a separate window for that exclusion.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND94"
    columns: *antithrombotic_columns
  - name: fct_person_antithrombotic_therapy_nice_indicators
    description: |
      NICE antithrombotic treatment results for IND94, IND132 and IND133. One row per
      eligible person and indicator on the build date, with treatment dates, recorded use
      and achievement.

      Each indicator retains its own population, time window and clinical criteria. A
      person can appear for several indicators. These results feed the combined NICE
      indicator status model.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person in the indicator denominator
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_status
        description: ACHIEVED, NOT_TREATED_IN_PERIOD, NEVER_TREATED
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_TREATED_IN_PERIOD', 'NEVER_TREATED']
      - name: latest_antiplatelet_order_date
        description: Date of the most recent antiplatelet order; null if never ordered
      - name: latest_anticoagulant_order_date
        description: Date of the most recent oral anticoagulant order; null if never ordered
  - name: fct_person_antithrombotic_therapy_nice_indicators_snapshot_input
    description: |
      Current NICE antithrombotic treatment results prepared for history tracking. One row
      per eligible person and indicator for IND94, IND132 and IND133, with current
      practice, antiplatelet and anticoagulant prescription dates and achievement.

      The snapshot records changes to these fields. Rolling reporting dates are omitted so
      the passage of a day alone does not create a new version.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: indicator_id
        description: NICE indicator identifier; part of the snapshot unique_key.
        data_tests:
          - not_null
      - name: current_practice_code
        description: ODS code of the current registration practice at the build.
      - name: is_in_numerator
        description: Whether the person met the indicator at the build.
      - name: indicator_status
        description: Outcome label at the build.
      - name: latest_antiplatelet_order_date
        description: Date of the most recent antiplatelet order; null if never ordered.
      - name: latest_anticoagulant_order_date
        description: Date of the most recent oral anticoagulant order; null if never ordered.
