models:
  - name: fct_person_antithrombotic_therapy_ind132
    description: >-
      Antiplatelet or anticoagulant treatment in coronary heart disease (NICE IND132).
      One row per person in the denominator on the build date.


      People registered on the build date on the coronary heart disease register.
      Achieved with an antiplatelet or oral anticoagulant prescription, over-the-counter
      salicylate use, clopidogrel prophylaxis or oral anticoagulant prophylaxis in the
      12 months before the build date. Excludes people contraindicated to all three:
      salicylates, clopidogrel and oral anticoagulants. Persisting contraindications
      have no expiry; temporary contraindications count for 12 months. No personalised
      care adjustments are applied. Based on NICE NG185. Code lists: OSAL_COD, CLO_COD,
      ORANTICOAG_COD (PCD); 0209, 020802 (BNF); XSAL_COD, TXSAL_COD, XCLO_COD,
      TXCLO_COD, XORANTICOAG_COD, TXORANTICOAG_COD, XORANTICOAGGENCON_COD,
      TXORANTICOAGGENCON_COD (PCD); CHD_COD (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind132-angina-and-coronary-heart-disease-anti-platelet-or-anticoagulation
        indicator:
          id: "IND132"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "Coronary heart disease antithrombotics"
          description_short: "Antiplatelet or anticoagulant treatment in the last 12 months"
          description_long: >-
            People registered on the build date on the coronary heart disease
            register. Achieved with an antiplatelet or oral anticoagulant
            prescription, over-the-counter salicylate use, clopidogrel prophylaxis
            or oral anticoagulant prophylaxis in the 12 months before the build
            date. Excludes people contraindicated to all three: salicylates,
            clopidogrel and oral anticoagulants. Persisting contraindications have
            no expiry; temporary contraindications count for 12 months. No
            personalised care adjustments are applied. Based on NICE NG185. Code
            lists: OSAL_COD, CLO_COD, ORANTICOAG_COD (PCD); 0209, 020802 (BNF);
            XSAL_COD, TXSAL_COD, XCLO_COD, TXCLO_COD, XORANTICOAG_COD,
            TXORANTICOAG_COD, XORANTICOAGGENCON_COD, TXORANTICOAGGENCON_COD (PCD);
            CHD_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND132"
    columns: &antithrombotic_columns
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "NICE indicator identifier."
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: reporting_date
        description: "Build date used to assess eligibility and achievement."
      - name: measurement_period_start
        description: "Inclusive start of the indicator measurement period before the reporting date."
      - name: age
        description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
      - name: condition_name
        description: "Short label for the population in the indicator denominator."
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: current_practice_name
        description: "Name of the current registration practice."
      - name: latest_antiplatelet_order_date
        description: "Date of the latest antiplatelet prescription through the reporting date; null when none is recorded."
      - name: latest_anticoagulant_order_date
        description: "Date of the latest oral anticoagulant prescription through the reporting date; null when none is recorded."
      - name: latest_anticoagulant_type
        description: "Drug type of the latest oral anticoagulant prescription: DOAC means direct-acting oral anticoagulant and VKA means vitamin K antagonist; null when none is recorded."
      - name: latest_antiplatelet_record_date
        description: "Date of the latest recorded over-the-counter salicylate use or clopidogrel prophylaxis through the reporting date; null when absent."
      - name: latest_anticoagulant_record_date
        description: "Date of the latest oral anticoagulant prophylaxis record through the reporting date; null when absent."
      - name: is_antiplatelet_in_period
        description: "Whether an antiplatelet prescription, over-the-counter salicylate use or clopidogrel prophylaxis record falls within the measurement period."
      - name: is_anticoagulant_in_period
        description: "Whether an oral anticoagulant prescription or prophylaxis record falls within the period for IND132 and IND133. IND94 uses prescriptions only and excludes people prescribed anticoagulants in its period."
      - name: is_in_denominator
        description: "Always true; each row is eligible before personalised care adjustments."
      - name: is_in_numerator
        description: "Whether the person meets the achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
  - name: fct_person_antithrombotic_therapy_ind133
    description: >-
      Antiplatelet or anticoagulant treatment in stroke or transient ischaemic attack
      (NICE IND133). One row per person in the denominator on the build date.


      People registered on the build date on the stroke or transient ischaemic attack
      register with non-haemorrhagic stroke or transient ischaemic attack. Achieved with
      an antiplatelet or oral anticoagulant prescription, over-the-counter salicylate
      use, clopidogrel prophylaxis or oral anticoagulant prophylaxis in the last 12
      months. Unspecified stroke alone does not qualify; separate haemorrhagic stroke
      does not exclude. Excludes people contraindicated to all four: salicylates,
      clopidogrel, dipyridamole and oral anticoagulants. Persisting contraindications
      have no expiry; temporary contraindications count for 12 months. No personalised
      care adjustments are applied. Based on NICE NG128. Code lists: OSAL_COD, CLO_COD,
      ORANTICOAG_COD (PCD); 0209, 020802 (BNF); XSAL_COD, TXSAL_COD, XCLO_COD,
      TXCLO_COD, XORANTICOAG_COD, TXORANTICOAG_COD, XORANTICOAGGENCON_COD,
      TXORANTICOAGGENCON_COD (PCD); XDIPY_COD, TXDIPY_COD, STRK_COD, TIA_COD, OSTR_COD
      (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind133-stroke-and-ischaemic-attack-anti-platelet-or-anticoagulation
        indicator:
          id: "IND133"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "Stroke antithrombotic treatment"
          description_short: "Antiplatelet or anticoagulant treatment in the last 12 months"
          description_long: >-
            People registered on the build date on the stroke or transient
            ischaemic attack register with non-haemorrhagic stroke or transient
            ischaemic attack. Achieved with an antiplatelet or oral anticoagulant
            prescription, over-the-counter salicylate use, clopidogrel prophylaxis
            or oral anticoagulant prophylaxis in the last 12 months. Unspecified
            stroke alone does not qualify; separate haemorrhagic stroke does not
            exclude. Excludes people contraindicated to all four: salicylates,
            clopidogrel, dipyridamole and oral anticoagulants. Persisting
            contraindications have no expiry; temporary contraindications count
            for 12 months. No personalised care adjustments are applied. Based on
            NICE NG128. Code lists: OSAL_COD, CLO_COD, ORANTICOAG_COD (PCD); 0209,
            020802 (BNF); XSAL_COD, TXSAL_COD, XCLO_COD, TXCLO_COD,
            XORANTICOAG_COD, TXORANTICOAG_COD, XORANTICOAGGENCON_COD,
            TXORANTICOAGGENCON_COD (PCD); XDIPY_COD, TXDIPY_COD, STRK_COD,
            TIA_COD, OSTR_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND133"
    columns: *antithrombotic_columns
  - name: fct_person_antithrombotic_therapy_ind94
    description: >-
      Antiplatelet treatment in peripheral arterial disease (NICE IND94). One row per
      person in the denominator on the build date.


      People registered on the build date on the peripheral arterial disease register
      without an oral anticoagulant prescription in the 15 months before the build date.
      Achieved with an antiplatelet prescription, over-the-counter salicylate use or
      clopidogrel prophylaxis in those 15 months. This window also defines the
      anticoagulant exclusion; NICE gives no separate exclusion window. No personalised
      care adjustments are applied. Based on NICE CG147. Code lists: OSAL_COD, CLO_COD,
      ORANTICOAG_COD (PCD); 0209, 020802 (BNF); PAD_COD (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind94-peripheral-arterial-disease-antiplatelets
        indicator:
          id: "IND94"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "Peripheral artery antiplatelets"
          description_short: "Antiplatelet treatment in peripheral arterial disease in the last 15 months"
          description_long: >-
            People registered on the build date on the peripheral arterial disease
            register without an oral anticoagulant prescription in the 15 months
            before the build date. Achieved with an antiplatelet prescription,
            over-the-counter salicylate use or clopidogrel prophylaxis in those 15
            months. This window also defines the anticoagulant exclusion; NICE
            gives no separate exclusion window. No personalised care adjustments
            are applied. Based on NICE CG147. Code lists: OSAL_COD, CLO_COD,
            ORANTICOAG_COD (PCD); 0209, 020802 (BNF); PAD_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND94"
    columns: *antithrombotic_columns
  - name: fct_person_antithrombotic_therapy_nice_indicators
    description: >-
      Antiplatelet and anticoagulant treatment results. One row per person and indicator
      in the denominator on the build date.


      Includes NICE IND94, NICE IND132, NICE IND133. Each indicator has its own
      denominator, measurement window and exclusions. Supporting evidence accompanies
      the achievement status. No personalised care adjustments are applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
      - name: indicator_id
        description: "NICE indicator identifier."
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_TREATED_IN_PERIOD', 'NEVER_TREATED']
      - name: latest_antiplatelet_order_date
        description: "Date of the latest antiplatelet prescription through the reporting date; null when none is recorded."
      - name: latest_anticoagulant_order_date
        description: "Date of the latest oral anticoagulant prescription through the reporting date; null when none is recorded."
  - name: fct_person_antithrombotic_therapy_nice_indicators_snapshot_input
    description: >-
      Antiplatelet and anticoagulant treatment results used to track changes. One row per person
      and indicator in the denominator on the build date.


      Records eligibility, achievement and supporting evidence before personalised care
      adjustments. Reporting-date fields are omitted so a date change alone does not create a
      new history version.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - not_null
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: is_in_numerator
        description: "Whether the person meets the achievement rule on the build date."
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
      - name: latest_antiplatelet_order_date
        description: "Date of the latest antiplatelet prescription through the build date; null when none is recorded."
      - name: latest_anticoagulant_order_date
        description: "Date of the latest oral anticoagulant prescription through the build date; null when none is recorded."
