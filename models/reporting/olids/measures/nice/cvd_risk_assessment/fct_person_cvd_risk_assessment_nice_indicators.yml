models:
  - name: fct_person_cvd_risk_assessment_ind269
    description: >-
      Cardiovascular risk assessment in the general population (NICE IND269). One row
      per person in the denominator on the build date.


      People registered on the build date aged 45 to 84. Achieved with valid numeric
      QRISK, QRISK2 or QRISK3 in the last 5 years. Excludes type 1 diabetes, familial
      hypercholesterolaemia, CKD stage 3 to 5, lipid-lowering prescriptions in the last
      6 months, any valid QRISK of at least 20%, coronary heart disease and peripheral
      arterial disease. Stroke or transient ischaemic attack excludes only people
      without haemorrhagic stroke history. No personalised care adjustments are applied.
      Based on NICE NG238. Code lists: CVDRISKASS_COD, CVDASS2_COD, QRISKSCORE_COD,
      CHD_COD, STRK_COD, TIA_COD, PAD_COD, HSTRK_COD, CKD_COD, CKD1AND2_COD, CKDRES_COD,
      DM_COD, DMTYPE1_COD, DMTYPE2_COD, DMRES_COD, FHYP_COD (PCD); 0212 (BNF).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind269-cardiovascular-disease-prevention-risk-assessment-general-population
        indicator:
          id: "IND269"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "General cardiovascular risk"
          description_short: "QRISK assessment in the last 5 years for the general population"
          description_long: >-
            People registered on the build date aged 45 to 84. Achieved with valid
            numeric QRISK, QRISK2 or QRISK3 in the last 5 years. Excludes type 1
            diabetes, familial hypercholesterolaemia, CKD stage 3 to 5,
            lipid-lowering prescriptions in the last 6 months, any valid QRISK of
            at least 20%, coronary heart disease and peripheral arterial disease.
            Stroke or transient ischaemic attack excludes only people without
            haemorrhagic stroke history. No personalised care adjustments are
            applied. Based on NICE NG238. Code lists: CVDRISKASS_COD, CVDASS2_COD,
            QRISKSCORE_COD, CHD_COD, STRK_COD, TIA_COD, PAD_COD, HSTRK_COD,
            CKD_COD, CKD1AND2_COD, CKDRES_COD, DM_COD, DMTYPE1_COD, DMTYPE2_COD,
            DMRES_COD, FHYP_COD (PCD); 0212 (BNF).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND269"
    columns: &risk_assessment_columns
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "NICE indicator identifier."
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: reporting_date
        description: "Build date used to assess eligibility and achievement."
      - name: measurement_period_start
        description: "Inclusive start of the risk assessment window before the reporting date."
      - name: age
        description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: current_practice_name
        description: "Name of the current registration practice."
      - name: latest_risk_score
        description: "Latest valid QRISK score through the reporting date, in percent; null when absent."
      - name: latest_risk_score_date
        description: "Date of the latest valid QRISK score through the reporting date; null when absent."
      - name: latest_risk_assessment_date
        description: "Date of the latest cardiovascular risk assessment through the reporting date, scored or not; null when absent."
      - name: is_in_denominator
        description: "Always true; each row is eligible before personalised care adjustments."
      - name: is_in_numerator
        description: "Whether the person meets the achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."

  - name: fct_person_cvd_risk_assessment_ind270
    description: >-
      Cardiovascular risk assessment with modifiable risk factors (NICE IND270). One row per
      person in the denominator on the build date.


      People registered on the build date aged 43 to 84 who smoke, are on the obesity or
      hypertension register, or have a recorded hypercholesterolaemia diagnosis known by the
      reporting date. A high cholesterol reading alone does not qualify. Achieved with valid
      numeric QRISK, QRISK2 or QRISK3 in the last 3 years. Excludes type 1 diabetes,
      familial hypercholesterolaemia, CKD stage 3 to 5, lipid-lowering prescriptions in the
      last 6 months, any valid QRISK at least 20%, coronary heart disease and peripheral
      arterial disease. Stroke or transient ischaemic attack excludes only people without
      haemorrhagic stroke history. No personalised care adjustments are applied. Based on
      NICE NG238. Code lists: CVDRISKASS_COD, CVDASS2_COD, QRISKSCORE_COD, CHD_COD,
      STRK_COD, TIA_COD, PAD_COD, HSTRK_COD, CKD_COD, CKD1AND2_COD, CKDRES_COD, DM_COD,
      DMTYPE1_COD, DMTYPE2_COD, DMRES_COD, FHYP_COD, FNFHYP_COD, HYP_COD, HYPRES_COD,
      LSMOK_COD, EXSMOK_COD, NSMOK_COD (PCD); BMIVAL_COD; 0212 (BNF).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind270-cardiovascular-disease-prevention-risk-assessment-modifiable-risk-factors
        indicator:
          id: "IND270"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "Modifiable cardiovascular risk"
          description_short: "QRISK assessment in the last 3 years for people with risk factors"
          description_long: >-
            People registered on the build date aged 43 to 84 who smoke, are on the obesity
            or hypertension register, or have a recorded hypercholesterolaemia diagnosis
            known by the reporting date. A high cholesterol reading alone does not qualify.
            Achieved with valid numeric QRISK, QRISK2 or QRISK3 in the last 3 years.
            Excludes type 1 diabetes, familial hypercholesterolaemia, CKD stage 3 to 5,
            lipid-lowering prescriptions in the last 6 months, any valid QRISK at least 20%,
            coronary heart disease and peripheral arterial disease. Stroke or transient
            ischaemic attack excludes only people without haemorrhagic stroke history. No
            personalised care adjustments are applied. Based on NICE NG238. Code lists:
            CVDRISKASS_COD, CVDASS2_COD, QRISKSCORE_COD, CHD_COD, STRK_COD, TIA_COD,
            PAD_COD, HSTRK_COD, CKD_COD, CKD1AND2_COD, CKDRES_COD, DM_COD, DMTYPE1_COD,
            DMTYPE2_COD, DMRES_COD, FHYP_COD, FNFHYP_COD, HYP_COD, HYPRES_COD, LSMOK_COD,
            EXSMOK_COD, NSMOK_COD (PCD); BMIVAL_COD; 0212 (BNF).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND270"
    columns: *risk_assessment_columns

  - name: fct_person_cvd_risk_assessment_ind181
    description: >-
      Cardiovascular risk assessment in type 2 diabetes (NICE IND181). One row per person in
      the denominator on the build date.


      People registered on the build date aged 25 to 84 on the type 2 diabetes register
      without moderate or severe coded frailty or a statin prescription in the last 6 months.
      Achieved with cardiovascular risk assessment in the last 3 years; no numeric score or
      separate consultation record is needed. Excludes established cardiovascular disease,
      including haemorrhagic stroke, familial hypercholesterolaemia and CKD stage 3 to 5. No
      personalised care adjustments are applied. Based on NICE NG238. Code lists:
      CVDRISKASS_COD, CVDASS2_COD, QRISKSCORE_COD, CHD_COD, STRK_COD, TIA_COD, PAD_COD,
      HSTRK_COD, CKD_COD, CKD1AND2_COD, CKDRES_COD, DM_COD, DMTYPE1_COD, DMTYPE2_COD,
      DMRES_COD, FHYP_COD, MODFRAIL_COD, SEVFRAIL_COD (PCD); 0212 (BNF).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind181-diabetes-cvd-risk-assessment
        indicator:
          id: "IND181"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "Type 2 diabetes cardiovascular risk"
          description_short: "Cardiovascular risk assessment in type 2 diabetes in the last 3 years"
          description_long: >-
            People registered on the build date aged 25 to 84 on the type 2 diabetes register
            without moderate or severe coded frailty or a statin prescription in the last 6
            months. Achieved with cardiovascular risk assessment in the last 3 years; no
            numeric score or separate consultation record is needed. Excludes established
            cardiovascular disease, including haemorrhagic stroke, familial
            hypercholesterolaemia and CKD stage 3 to 5. No personalised care adjustments are
            applied. Based on NICE NG238. Code lists: CVDRISKASS_COD, CVDASS2_COD,
            QRISKSCORE_COD, CHD_COD, STRK_COD, TIA_COD, PAD_COD, HSTRK_COD, CKD_COD,
            CKD1AND2_COD, CKDRES_COD, DM_COD, DMTYPE1_COD, DMTYPE2_COD, DMRES_COD, FHYP_COD,
            MODFRAIL_COD, SEVFRAIL_COD (PCD); 0212 (BNF).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND181"
    columns: *risk_assessment_columns

  - name: fct_person_cvd_risk_assessment_ind161
    description: >-
      Cardiovascular risk assessment after a new diagnosis (NICE IND161). One row per person
      in the denominator on the build date.


      People registered on the build date aged 25 to 84 with first hypertension or type 2
      diabetes diagnosis 3 to 15 months before the build date, so follow-up is complete.
      Achieved with cardiovascular risk assessment within 3 calendar months before or after
      diagnosis; no numeric score or separate consultation record is needed. When both
      diagnoses qualify, the earlier is used. Excludes established cardiovascular disease,
      including haemorrhagic stroke, CKD stage 3 to 5, familial hypercholesterolaemia and type
      1 diabetes. No personalised care adjustments are applied. Based on NICE NG238. Code
      lists: CVDRISKASS_COD, CVDASS2_COD, QRISKSCORE_COD, CHD_COD, STRK_COD, TIA_COD, PAD_COD,
      HSTRK_COD, CKD_COD, CKD1AND2_COD, CKDRES_COD, DM_COD, DMTYPE1_COD, DMTYPE2_COD,
      DMRES_COD, FHYP_COD, HYP_COD, HYPRES_COD (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind161-cardiovascular-disease-prevention-cardiovascular-risk-assessment-for-people-newly-diagnosed-with-hypertension-or-t2-dm
        indicator:
          id: "IND161"
          type: "MEASURE"
          category: "CARDIOVASCULAR"
          clinical_domain: "Cardiometabolic"
          name_short: "New diagnosis cardiovascular risk"
          description_short: "Cardiovascular risk assessment around a new hypertension or type 2 diabetes diagnosis"
          description_long: >-
            People registered on the build date aged 25 to 84 with first hypertension or type
            2 diabetes diagnosis 3 to 15 months before the build date, so follow-up is
            complete. Achieved with cardiovascular risk assessment within 3 calendar months
            before or after diagnosis; no numeric score or separate consultation record is
            needed. When both diagnoses qualify, the earlier is used. Excludes established
            cardiovascular disease, including haemorrhagic stroke, CKD stage 3 to 5, familial
            hypercholesterolaemia and type 1 diabetes. No personalised care adjustments are
            applied. Based on NICE NG238. Code lists: CVDRISKASS_COD, CVDASS2_COD,
            QRISKSCORE_COD, CHD_COD, STRK_COD, TIA_COD, PAD_COD, HSTRK_COD, CKD_COD,
            CKD1AND2_COD, CKDRES_COD, DM_COD, DMTYPE1_COD, DMTYPE2_COD, DMRES_COD, FHYP_COD,
            HYP_COD, HYPRES_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND161"
    columns:
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "NICE indicator identifier."
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: reporting_date
        description: "Build date used to assess eligibility and achievement."
      - name: measurement_period_start
        description: "Exclusive diagnosis boundary 15 months before the reporting date; the assessment window is relative to diagnosis."
      - name: age
        description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: current_practice_name
        description: "Name of the current registration practice."
      - name: latest_risk_score
        description: "Latest valid QRISK score through the reporting date, in percent; null when absent."
      - name: latest_risk_score_date
        description: "Date of the latest valid QRISK score through the reporting date; null when absent."
      - name: latest_risk_assessment_date
        description: "Date of the latest cardiovascular risk assessment through the reporting date, scored or not; null when absent."
      - name: is_in_denominator
        description: "Always true; each row is eligible before personalised care adjustments."
      - name: is_in_numerator
        description: "Whether the person meets the achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
      - name: new_diagnosis_date
        description: "Earlier qualifying first hypertension or type 2 diabetes diagnosis date for IND161; null for other indicators."

  - name: fct_person_cvd_risk_assessment_nice_indicators
    description: >-
      Cardiovascular risk assessment and blood pressure recording results. One row per
      person and indicator in the denominator on the build date.


      Includes NICE IND108, NICE IND112, NICE IND161, NICE IND181, NICE IND269, NICE
      IND270. Each indicator has its own denominator, measurement window and exclusions.
      Supporting evidence accompanies the achievement status. No personalised care
      adjustments are applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND269', 'IND270', 'IND181', 'IND161', 'IND112', 'IND108']
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']
      - name: latest_risk_score
        description: "Latest valid QRISK score through the reporting date, in percent; null when absent. IND108 instead reports the latest QRISK2 or QRISK3 record's score, which is null when missing or outside 0 to 100."
      - name: latest_risk_assessment_date
        description: "Date of the latest cardiovascular risk assessment through the reporting date, scored or not; null when absent. IND108 selects QRISK2 or QRISK3 only."
      - name: latest_bp_date
        description: "Date of the latest complete blood pressure pair through the reporting date for IND112; may be older than 5 years. Null when absent or for risk assessment indicators."
      - name: new_diagnosis_date
        description: "Earlier qualifying first hypertension or type 2 diabetes diagnosis date for IND161; null for other indicators."

  - name: fct_person_cvd_risk_assessment_nice_indicators_snapshot_input
    description: >-
      Cardiovascular risk assessment and blood pressure recording results used to track changes.
      One row per person and indicator in the denominator on the build date.


      Records eligibility, achievement and supporting evidence before personalised care
      adjustments. Reporting-date fields are omitted so a date change alone does not create a
      new history version.
      Labels join from def_indicator or the measure tables by indicator_id.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - not_null
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: latest_risk_score
        description: "Latest valid QRISK score through the build date, in percent; null when absent. IND108 instead reports the latest QRISK2 or QRISK3 record's score, which is null when missing or outside 0 to 100."
      - name: latest_risk_assessment_date
        description: "Date of the latest cardiovascular risk assessment through the build date, scored or not; null when absent. IND108 selects QRISK2 or QRISK3 only."
      - name: latest_bp_date
        description: "Date of the latest complete blood pressure pair through the reporting date for IND112; may be older than 5 years. Null when absent or for risk assessment indicators."
      - name: is_in_numerator
        description: "Whether the person meets the achievement rule on the build date."
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
