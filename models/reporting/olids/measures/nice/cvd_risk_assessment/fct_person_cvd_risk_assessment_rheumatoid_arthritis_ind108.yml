models:
- name: fct_person_cvd_risk_assessment_rheumatoid_arthritis_ind108
  description: >-
    Cardiovascular risk assessment in rheumatoid arthritis (NICE IND108). One row per
    person in the denominator on the build date.


    People registered on the build date aged 30 to 84 on the rheumatoid arthritis
    register. Achieved with QRISK2 or QRISK3 assessment in the 15 months before the build
    date; no numeric score is needed. Generic QRISK, JBS and Framingham assessments do not
    count. Excludes coronary heart disease, stroke or transient ischaemic attack, and
    familial hypercholesterolaemia register members. Peripheral arterial disease, kidney
    disease, diabetes, frailty and treatment do not exclude anyone. No personalised care
    adjustments are applied. Based on NICE NG100. Code lists: CVDRISKASS_COD, CVDASS2_COD,
    QRISKSCORE_COD, RARTH_COD, CHD_COD, STRK_COD, TIA_COD, FHYP_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind108
      indicator:
        id: IND108
        type: MEASURE
        category: CARDIOVASCULAR
        clinical_domain: Cardiometabolic
        name_short: "Arthritis cardiovascular risk"
        description_short: "QRISK2 or QRISK3 assessment in rheumatoid arthritis in the last 15 months"
        description_long: >-
          People registered on the build date aged 30 to 84 on the rheumatoid
          arthritis register. Achieved with QRISK2 or QRISK3 assessment in the 15
          months before the build date; no numeric score is needed. Generic QRISK,
          JBS and Framingham assessments do not count. Excludes coronary heart
          disease, stroke or transient ischaemic attack, and familial
          hypercholesterolaemia register members. Peripheral arterial disease,
          kidney disease, diabetes, frailty and treatment do not exclude anyone. No
          personalised care adjustments are applied. Based on NICE NG100. Code
          lists: CVDRISKASS_COD, CVDASS2_COD, QRISKSCORE_COD, RARTH_COD, CHD_COD,
          STRK_COD, TIA_COD, FHYP_COD (PCD).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND108
  data_tests: []
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
    data_tests:
    - not_null
    - unique
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Build date used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Inclusive start of the 15-month QRISK2 or QRISK3 recording window before the reporting date."
  - name: age
    description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: is_in_denominator
    description: "Always true; each row is eligible before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
  - name: current_practice_code
    description: "ODS code of the current registration practice."
  - name: current_practice_name
    description: "Name of the current registration practice."
  - name: latest_risk_assessment_date
    description: "Date of the latest QRISK2 or QRISK3 assessment through the reporting date, with or without a score; null when absent. May precede the 15-month window."
  - name: latest_risk_score
    description: "Numeric score in percent from the latest QRISK2 or QRISK3 record; null when missing or outside 0 to 100. An invalid latest score does not permit use of an older score."
  - name: latest_risk_score_date
    description: "Date of the latest QRISK2 or QRISK3 record when its score is between 0 and 100, inclusive; otherwise null."
