models:
- name: fct_person_cvd_risk_assessment_ind270_by_month
  description: "NICE IND270 CVD risk assessment with a modifiable risk factor. One row per currently\n\
    registered, living, non-test person aged 43 to 84 who currently smokes, is on the\nobesity or hypertension\
    \ register, or has latest total cholesterol above 5 mmol/L,\nassessed at the month-end.\n\nAchievement\
    \ requires a valid numeric QRISK, QRISK2 or QRISK3 result in the preceding\nthree years. The cholesterol\
    \ threshold is a local proxy for hypercholesterolaemia\nthat NICE and QOF do not define.\n\nExcludes\
    \ type 1 diabetes, familial hypercholesterolaemia, stage 3 to 5 chronic\nkidney disease, lipid-lowering\
    \ treatment prescribed in six months and any valid\nQRISK score of at least 20%. Established CVD is\
    \ also excluded: coronary heart\ndisease, peripheral arterial disease, or stroke or TIA without haemorrhagic\
    \ stroke\nhistory.\n\nPersonalised care adjustments are not applied.\n Recalculated at monthly refresh\
    \ for the last 60 completed month-ends using today's rules and code lists. Registration and practice\
    \ use the existing monthly spine: start inclusive, end and death exclusive, with current-registration\
    \ priority for overlaps. Birth and death dates are approximate; missing birth dates prevent historical\
    \ active rows. Current gender and test flags apply retrospectively. Register and diagnosis state use\
    \ clinical and recorded dates. Other evidence uses clinical or order dates through the month-end.\
    \ Later corrections and code-list changes can alter earlier results. Personalised care adjustments\
    \ are not applied."
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind270-cardiovascular-disease-prevention-risk-assessment-modifiable-risk-factors
  columns:
  - name: person_id
    description: Person in the indicator denominator
  - name: indicator_id
    description: NICE indicator identifier
  - name: indicator_name
    description: Published NICE indicator name
  - name: reporting_date
    description: Completed month-end used for eligibility and evidence; DATE, with no current-day row.
  - name: measurement_period_start
    description: Inclusive start of the measurement period before the reporting date
  - name: age
    description: Completed years at month-end from the approximate birth month.
  - name: condition_name
    description: Population defining the indicator
  - name: practice_code
    description: Practice ODS code at the month-end under the monthly spine attribution.
  - name: practice_name
    description: Practice name at the month-end under the monthly spine attribution.
  - name: latest_risk_score
    description: Latest valid QRISK score in percent; null if none Selected through the month-end; stale
      detail remains available.
  - name: latest_risk_score_date
    description: Date of the latest valid QRISK score Selected through the month-end; stale detail remains
      available.
  - name: latest_risk_assessment_date
    description: Date of the latest CVD risk assessment record, scored or not Selected through the month-end;
      stale detail remains available.
  - name: is_in_denominator
    description: Always true; every row is an eligible person before personalised care adjustments
  - name: is_in_numerator
    description: Whether a risk assessment falls in the indicator's window
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
