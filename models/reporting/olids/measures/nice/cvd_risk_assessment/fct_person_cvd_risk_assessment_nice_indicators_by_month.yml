models:
- name: fct_person_cvd_risk_assessment_nice_indicators_by_month
  description: >-
    Cardiovascular risk assessment and blood pressure recording results. One row per
    person, indicator and month-end.


    Includes NICE IND108, NICE IND112, NICE IND161, NICE IND181, NICE IND269, NICE IND270.
    Each indicator has its own denominator, measurement window and exclusions. Supporting
    evidence accompanies the achievement status. No personalised care adjustments are
    applied. Recalculated for each of the last 60 month-ends with current rules, code
    lists and records, so later corrections can change past months.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
        - reporting_date
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Start of the indicator period. For shifted diagnosis periods, diagnoses on this date are excluded; IND112 also excludes evidence on this date. Other measurement windows include their start date."
  - name: age
    description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice attributed at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice attributed at the reporting month-end."
  - name: latest_risk_score
    description: "Latest valid QRISK score through the reporting date, in percent; null when absent. IND108 instead reports the latest QRISK2 or QRISK3 record's score, which is null when missing or outside 0 to 100."
  - name: latest_risk_score_date
    description: "Date of the latest valid QRISK score through the reporting date; null when absent. For IND108, date of the selected QRISK2 or QRISK3 record only when its score is valid."
  - name: latest_risk_assessment_date
    description: "Date of the latest cardiovascular risk assessment through the reporting date, scored or not; null when absent. IND108 selects QRISK2 or QRISK3 only."
  - name: is_in_denominator
    description: "Always true; each row is eligible before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
  - name: new_diagnosis_date
    description: "Earlier qualifying first hypertension or type 2 diabetes diagnosis date for IND161; null for other indicators."
  - name: latest_bp_date
    description: "Date of the latest complete blood pressure pair through the reporting date for IND112; may be older than 5 years. Null when absent or for risk assessment indicators."
