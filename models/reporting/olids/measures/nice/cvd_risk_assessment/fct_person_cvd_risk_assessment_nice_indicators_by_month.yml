models:
- name: fct_person_cvd_risk_assessment_nice_indicators_by_month
  description: 'NICE CVD prevention results for IND108, IND112, IND161, IND181, IND269 and IND270. One row per eligible person, indicator and completed
    month-end. Each member retains its population, measurement window, exclusions and detail columns.
    Recalculated at monthly refresh for the last 60 completed month-ends using today''s rules and code
    lists. Registration and practice use the existing monthly spine: start inclusive, end and death exclusive,
    with current-registration priority for overlaps. Birth and death dates are approximate; missing birth
    dates prevent historical active rows. Current gender and test flags apply retrospectively. Register
    and diagnosis state use clinical and recorded dates. Other evidence uses clinical or order dates through
    the month-end. Later corrections and code-list changes can alter earlier results. Personalised care
    adjustments are not applied.'
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
        - reporting_date
  columns:
  - name: person_id
    description: Person in the indicator denominator
  - name: indicator_id
    description: NICE indicator identifier
  - name: indicator_name
    description: Published NICE indicator name
  - name: reporting_date
    description: Completed month-end used for eligibility and evidence; DATE, with no current-day row.
  - name: measurement_period_start
    description: Start of the measurement or cohort period; IND112 excludes BP evidence on this boundary.
  - name: age
    description: Completed years at month-end from the approximate birth month.
  - name: condition_name
    description: Population defining the indicator
  - name: practice_code
    description: Practice ODS code at the month-end under the monthly spine attribution.
  - name: practice_name
    description: Practice name at the month-end under the monthly spine attribution.
  - name: latest_risk_score
    description: Latest valid QRISK score in percent through month-end. IND108 uses the selected latest
      QRISK2/3 record, with null for a missing or invalid score. Stale detail remains available.
  - name: latest_risk_score_date
    description: Date of the latest valid QRISK score through month-end. IND108 returns the selected
      QRISK2/3 record date only when its score is valid. Stale detail remains available.
  - name: latest_risk_assessment_date
    description: Latest CVD risk assessment date through month-end, scored or not. IND108 selects QRISK2/3
      only. Stale detail remains available.
  - name: is_in_denominator
    description: Always true; every row is an eligible person before personalised care adjustments
  - name: is_in_numerator
    description: Whether a risk assessment falls in the indicator's window
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD
  - name: new_diagnosis_date
    description: Earlier qualifying new diagnosis for IND161; null for other indicators.
  - name: latest_bp_date
    description: Latest complete paired BP date through month-end for IND112; null for other indicators.
