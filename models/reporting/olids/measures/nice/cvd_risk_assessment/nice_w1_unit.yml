          (-2, '2021-10-01', 'SYN_BP', 120, 80, TRUE, FALSE, FALSE, 'CLINIC'),
          (-3, '2026-09-30', 'SYN_BP', 120, 80, TRUE, FALSE, FALSE, 'CLINIC'),
