  - input: ref('int_nice_blood_pressure_all')
    rows: |-
      SELECT
          column1::NUMBER AS person_id,
          column2::DATE AS reading_date,
          column3::VARCHAR AS reading_id,
          column4::FLOAT AS systolic_value,
          column5::FLOAT AS diastolic_value,
