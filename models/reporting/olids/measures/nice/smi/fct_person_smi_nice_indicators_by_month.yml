models:
- name: fct_person_smi_nice_indicators_by_month
  description: One row per eligible person, NICE SMI indicator and completed month-end for the last 60
    completed months. Includes the fourteen existing SMI-family measures; lithium monitoring retains its
    independent therapy population. Each member keeps its documented population, evidence and window rules.
    Recalculated at monthly refresh using today's rules and code lists. Diagnosis state uses clinical
    and recorded dates; other evidence uses clinical or order dates through month-end. Practice follows
    the monthly spine, including its current-registration priority for overlapping registrations. Approximate
    birth and death dates, retrospective current gender and test flags, missing-birth-date exclusions
    and later source corrections limit historical interpretation. Supporting fields are null for members
    that do not emit them.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
        - reporting_date
  columns:
  - name: person_id
    description: Person in the indicator denominator
  - name: indicator_id
    description: NICE indicator identifier
  - name: indicator_name
    description: Published NICE indicator name
  - name: reporting_date
    description: Completed month-end at which eligibility and evidence are assessed. DATE; no current-day
      row.
  - name: measurement_period_start
    description: Inclusive start of the measurement period before the reporting date
  - name: age
    description: Completed years at month-end, calculated from the approximate birth month.
  - name: condition_name
    description: Population defining the indicator
  - name: practice_code
    description: Practice attribution at completed month-end under the existing monthly spine.
  - name: practice_name
    description: Practice attribution at completed month-end under the existing monthly spine.
  - name: latest_blood_pressure_date
    description: Date of the latest blood pressure reading; null when none; typed null for branches that
      do not emit it
  - name: latest_bmi_date
    description: Date of the latest BMI with a value; null when none; typed null for branches that do
      not emit it
  - name: latest_alcohol_record_date
    description: Date of the latest alcohol consumption record (units, usage status or screening tool);
      null when none; typed null for branches that do not emit it
  - name: latest_lipid_date
    description: Date of the latest lipid record counted by the indicator; null when none; typed null
      for branches that do not emit it
  - name: latest_cholesterol_hdl_ratio_date
    description: Date of the latest total cholesterol to HDL ratio with a value; null when none; typed
      null for branches that do not emit it
  - name: latest_glucose_or_hba1c_date
    description: Date of the latest HbA1c or blood glucose; null when none; typed null for branches that
      do not emit it
  - name: latest_smoking_status_date
    description: Date of the latest smoking status record; null when none; typed null for branches that
      do not emit it
  - name: checks_met_count
    description: Number of the six physical health checks recorded in the preceding 12 months, 0 to 6;
      typed null for branches that do not emit it
  - name: latest_smoking_status
    description: Latest recorded smoking status; null when none; typed null for branches that do not emit
      it
  - name: latest_lithium_level_date
    description: Date of the latest serum lithium record of any value; null when none; typed null for
      branches that do not emit it
  - name: latest_lithium_level
    description: Latest serum lithium in mmol/L; null when the latest record has no value; typed null
      for branches that do not emit it
  - name: latest_record_date
    description: Date of the latest qualifying record in the period; null when none
  - name: is_in_denominator
    description: Always true; every row is an eligible person before personalised care adjustments
  - name: is_in_numerator
    description: Whether the person meets the indicator on the reporting date
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD; IND87 also uses NOT_ASSESSABLE and OUT_OF_RANGE
