models:
- name: fct_person_lithium_renal_thyroid_monitoring_ind86
  description: 'NICE IND86. One row per eligible registered, living, non-test person on the build date.
    All current lithium users, regardless of SMI diagnosis. Uses the shared therapy definition: an order
    strictly after R minus six calendar months through R, with known-date caps and no later stop. Both
    CRE_COD and TFT_COD records must fall within the inclusive nine-month window through R. Records count
    without numeric results. TFT_COD includes free T4 and T3 and is a broader proxy for TSH.'
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind86
      indicator:
        id: IND86
        type: MEASURE
        category: REVIEW
        clinical_domain: Mental health
        name_short: 'Lithium therapy: creatinine and TSH monitoring'
        description_short: 'All current lithium users, regardless of SMI diagnosis. Uses the shared therapy
          definition: an order strictly after R minus six calendar months through R, with known-date caps
          and no later stop. Both CRE_COD and TFT_COD records must fall within the inclusive nine-month
          window through R. Records count without numeric results. TFT_COD includes free T4 and T3 and
          is a broader proxy for TSH.'
        description_long: 'NICE IND86. One row per eligible registered, living, non-test person on the
          build date. All current lithium users, regardless of SMI diagnosis. Uses the shared therapy
          definition: an order strictly after R minus six calendar months through R, with known-date caps
          and no later stop. Both CRE_COD and TFT_COD records must fall within the inclusive nine-month
          window through R. Records count without numeric results. TFT_COD includes free T4 and T3 and
          is a broader proxy for TSH.'
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND86
  columns:
  - name: person_id
    description: Person in the indicator denominator.
    data_tests:
    - not_null
    - unique
  - name: indicator_id
    description: NICE indicator identifier.
  - name: indicator_name
    description: Published NICE indicator name.
  - name: reporting_date
    description: Evaluation date R.
  - name: measurement_period_start
    description: Inclusive window start.
  - name: age
    description: Age in completed years at R.
  - name: condition_name
    description: Population defining the indicator.
  - name: is_in_denominator
    description: Always true for an eligible row.
  - name: is_in_numerator
    description: Whether the qualifying evidence is present at R.
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD.
  - name: latest_record_date
    description: Latest qualifying evidence date; null when not achieved.
