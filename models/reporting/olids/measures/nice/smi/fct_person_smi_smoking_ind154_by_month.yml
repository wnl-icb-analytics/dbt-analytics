models:
- name: fct_person_smi_smoking_ind154_by_month
  description: NICE IND154. One row per eligible person and completed month-end. People with an active
    SMI diagnosis. Achievement requires smoking status recorded in the inclusive preceding twelve months.
    A latest never-smoker status also qualifies when the approximate 26th birthday is on or before the
    end of the financial year containing the reporting date, and the never-smoked record is strictly after
    both the 25th birthday and earliest SMI diagnosis. The exception can achieve with a null latest_record_date.
    The optional ex-smoker exception is not applied. Recalculated at monthly refresh for the last 60 completed
    month-ends using today's rules and code lists. Registration and practice follow the existing monthly
    spine, including its current-registration priority for overlaps. Registration start is inclusive;
    registration end and death dates are exclusive. Birth and death dates are approximate; missing birth
    dates prevent historical active rows. Current gender and test flags apply retrospectively. Diagnosis
    state uses clinical and recorded dates. Other evidence uses its clinical or order date through month-end.
    Later corrections and current code-list changes can alter earlier results. Remission excludes SMI
    eligibility; independent lithium therapy does not establish SMI eligibility. Personalised care adjustments
    are not applied.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind154
  columns:
  - name: person_id
    description: Person in the indicator denominator
  - name: indicator_id
    description: NICE indicator identifier
  - name: indicator_name
    description: Published NICE indicator name
  - name: reporting_date
    description: Completed month-end at which eligibility and evidence are assessed. DATE; no current-day
      row.
  - name: measurement_period_start
    description: Inclusive start of the measurement period before the reporting date
  - name: age
    description: Completed years at month-end, calculated from the approximate birth month.
  - name: condition_name
    description: Population defining the indicator
  - name: practice_code
    description: ODS practice code at month-end.
  - name: practice_name
    description: Practice name at month-end under the monthly spine attribution.
  - name: latest_smoking_status
    description: Latest recorded smoking status; null when none
  - name: latest_smoking_status_date
    description: Date of the latest smoking status record; null when none
  - name: latest_record_date
    description: Date of the latest qualifying record in the period; null when none
  - name: is_in_denominator
    description: Always true; every row is an eligible person before personalised care adjustments
  - name: is_in_numerator
    description: Whether the person meets the indicator on the reporting date
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
