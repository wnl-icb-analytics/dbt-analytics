models:
- name: fct_person_lithium_renal_thyroid_monitoring_ind86_by_month
  description: >-
    Kidney and thyroid monitoring during lithium therapy (NICE IND86). One row per person in the
    denominator at each month-end.


    People registered at the month-end prescribed lithium in the 6 months before the month-end,
    without a later stop; a same-day stop does not exclude them. Prescriptions and stops must be
    known by that date. Mental illness diagnosis is not required. Achieved with creatinine and
    thyroid function tests in the preceding 9 months. Numeric results are not required. Free T4
    and T3 codes count without proof of TSH testing. No personalised care adjustments are
    applied. Recalculated for each of the last 60 month-ends with current rules, code lists and
    records, so later corrections can change past months. Based on NICE CG185. Code lists:
    LIT_COD; LITSTP_COD, CRE_COD, TFT_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind86
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "9 months before the reporting date, included in the test window."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: condition_name
    description: "Short label for the denominator population."
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  - name: latest_record_date
    description: "Later of the creatinine and thyroid function test dates when both fall in the 9-month window; otherwise null."
  - name: practice_code
    description: "ODS code of the registration practice at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice at the reporting month-end."
  - name: latest_creatinine_date
    description: >-
      Latest creatinine test record on or before the reporting date; null if absent. It may be
      outside the achievement window.
  - name: latest_thyroid_function_test_date
    description: >-
      Latest thyroid function test on or before the reporting date; null if absent. It may be
      outside the achievement window.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
