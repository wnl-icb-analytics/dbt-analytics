models:
- name: fct_person_smi_physical_health_ind248_by_month
  description: 'NICE IND248. One row per eligible person and completed month-end. People with an active
    SMI diagnosis. All six checks must be recorded in the inclusive preceding twelve months: valid-pair
    BP, valid BMI, alcohol consumption, lipids, blood glucose or HbA1c, and smoking status. BMI accepts
    recordings at any age or adult height/weight calculations on the weight date, with 10 to 150 kg/m2
    inclusive. Later invalid BMI evidence does not erase a valid recording. Alcohol units, usage status
    or screening tools count. Lipids include numeric lipid records and PCD NONVALCHOL_COD completed tests
    without a value. Glucose and HbA1c tests count without a numeric value. checks_met_count is 0 to 6;
    latest_record_date is null unless all six checks qualify. Recalculated at monthly refresh for the
    last 60 completed month-ends using today''s rules and code lists. Registration and practice follow
    the existing monthly spine, including its current-registration priority for overlaps. Registration
    start is inclusive; registration end and death dates are exclusive. Birth and death dates are approximate;
    missing birth dates prevent historical active rows. Current gender and test flags apply retrospectively.
    Diagnosis state uses clinical and recorded dates. Other evidence uses its clinical or order date through
    month-end. Later corrections and current code-list changes can alter earlier results. Remission excludes
    SMI eligibility; independent lithium therapy does not establish SMI eligibility. Personalised care
    adjustments are not applied.'
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind248
  columns:
  - name: person_id
    description: Person in the indicator denominator
  - name: indicator_id
    description: NICE indicator identifier
  - name: indicator_name
    description: Published NICE indicator name
  - name: reporting_date
    description: Completed month-end at which eligibility and evidence are assessed. DATE; no current-day
      row.
  - name: measurement_period_start
    description: Inclusive start of the measurement period before the reporting date
  - name: age
    description: Completed years at month-end, calculated from the approximate birth month.
  - name: condition_name
    description: Population defining the indicator
  - name: practice_code
    description: ODS practice code at month-end.
  - name: practice_name
    description: Practice name at month-end under the monthly spine attribution.
  - name: latest_blood_pressure_date
    description: Date of the latest blood pressure reading; null when none
  - name: latest_bmi_date
    description: Date of the latest valid recorded BMI at any age or adult calculated BMI; null when none
      is valid
  - name: latest_alcohol_record_date
    description: Date of the latest alcohol consumption record (units, usage status or screening tool);
      null when none
  - name: latest_lipid_date
    description: Date of the latest lipid record counted by the indicator; null when none
  - name: latest_glucose_or_hba1c_date
    description: Date of the latest HbA1c or blood glucose; null when none
  - name: latest_smoking_status_date
    description: Date of the latest smoking status record; null when none
  - name: checks_met_count
    description: Number of the six physical health checks recorded in the preceding 12 months, 0 to 6
  - name: latest_record_date
    description: Date of the latest qualifying record in the period; null when none
  - name: is_in_denominator
    description: Always true; every row is an eligible person before personalised care adjustments
  - name: is_in_numerator
    description: Whether the person meets the indicator on the reporting date
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
