models:
- name: fct_person_lithium_monitoring_ind87_by_month
  description: >-
    Serum lithium within the therapeutic range (NICE IND87). One row per person in the
    denominator at each month-end.


    People registered at the month-end prescribed lithium in the 6 months before the month-end,
    without a later stop; a same-day stop does not exclude them. Prescriptions and stops must be
    known by that date. Mental illness diagnosis is not required. Achieved when the latest serum
    lithium result in the preceding 4 months is 0.4 to 1.0 mmol/L inclusive. Missing values are
    unassessable; other values are out of range. NICE defines neither this local range nor
    latest-result selection. No personalised care adjustments are applied. Recalculated for each
    of the last 60 month-ends with current rules, code lists and records, so later corrections
    can change past months. Based on NICE CG185. Code lists: LIT_COD; LITSTP_COD (PCD);
    PINCER/LITH_LEV (OpenCodelists).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind87
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "4 months before the reporting date, included in the result window."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice at the reporting month-end."
  - name: latest_lithium_level_date
    description: >-
      Latest serum lithium record on or before the reporting date, regardless of its value; null if
      absent. It may be outside the achievement window.
  - name: latest_lithium_level
    description: >-
      Serum lithium value in mmol/L from the latest record on or before the reporting date; null if
      the record is absent or has no numeric value.
  - name: latest_record_date
    description: >-
      Latest serum lithium record in the 4 months before the reporting date, inclusive, regardless
      of its value; null if absent.
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: >-
      ACHIEVED for an in-range latest lithium result; NOT_RECORDED_IN_PERIOD if absent from the
      4-month window; NOT_ASSESSABLE if its value is missing; OUT_OF_RANGE otherwise.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
