models:
- name: fct_person_smi_glucose_ind159_by_month
  description: >-
    Glucose or HbA1c testing in severe mental illness (NICE IND159). One row per person in the
    denominator at each month-end.


    People registered at the month-end aged 18 or over with active schizophrenia, bipolar
    disorder or other psychosis. Remission or diabetes first diagnosed more than 12 months
    earlier excludes them. Achieved with a glucose or HbA1c test in the 12 months before the
    month-end, with or without a numeric value. No personalised care adjustments are applied.
    Recalculated for each of the last 60 month-ends with current rules, code lists and records,
    so later corrections can change past months. Based on NICE CG178. Code lists: MH_COD,
    MHREM_COD, FASPLASGLUC_COD, GLUC_COD, IFCCHBAM_COD, DCCTHBA1C_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind159
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "12 months before the reporting date, included in the test window."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: condition_name
    description: "Short label for the denominator population."
  - name: practice_code
    description: "ODS code of the registration practice at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice at the reporting month-end."
  - name: latest_glucose_or_hba1c_date
    description: >-
      Latest blood glucose or HbA1c test on or before the reporting date, with or without a numeric
      value; null if absent. It may be outside the achievement window.
  - name: latest_record_date
    description: >-
      Latest supporting evidence in the indicator window; null if absent. The model description
      gives the achievement rule.
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
