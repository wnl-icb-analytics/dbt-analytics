models:
- name: fct_person_smi_cvd_risk_assessment_ind150_by_month
  description: >-
    Cardiovascular risk assessment in severe mental illness (NICE IND150). One row per person in
    the denominator at each month-end.


    People registered at the month-end aged 25 to 84 with active schizophrenia, bipolar disorder
    or other psychosis. Remission, cardiovascular disease, chronic kidney disease, familial
    hypercholesterolaemia and type 1 diabetes exclude them. Achieved with a formal
    cardiovascular risk assessment or QRISK score in the 12 months before the month-end; QRISK3
    is not required. No personalised care adjustments are applied. Recalculated for each of the
    last 60 month-ends with current rules, code lists and records, so later corrections can
    change past months. Based on NICE NG238. Code lists: MH_COD, MHREM_COD, CVDRISKASS_COD,
    CVDASS2_COD, QRISKSCORE_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind150
  columns:
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: reporting_date
    description: "Month-end used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "12 months before the reporting date, included in the assessment window."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: condition_name
    description: "Short label for the denominator population."
  - name: practice_code
    description: "ODS code of the registration practice at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice at the reporting month-end."
  - name: latest_record_date
    description: >-
      Latest supporting evidence in the indicator window; null if absent. The model description
      gives the achievement rule.
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
