models:
  - name: fct_person_smi_physical_health_ind248
    description: |
      NICE IND248: SMI six health checks. One row per currently registered, living,
      non-test person with schizophrenia, bipolar affective disorder or another
      psychosis on the SMI register, including remission, assessed on the build date.

      Achievement requires all six checks in the preceding 12 months: blood pressure,
      BMI, alcohol consumption, lipid profile, blood glucose or HbA1c, and smoking
      status. Alcohol units, usage status or a screening tool qualify. Lipid evidence is
      a total cholesterol or cholesterol to HDL ratio result. Laboratory checks require
      a recorded value. checks_met_count ranges from 0 to 6.

      Lithium therapy without an SMI diagnosis does not qualify. NICE treats remission
      as a personalised care adjustment for IND248, so remitted people remain in this
      denominator.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind248
        indicator:
          id: "IND248"
          type: "MEASURE"
          category: "MENTAL_HEALTH"
          clinical_domain: "Mental health"
          name_short: "SMI six health checks"
          description_short: "All six SMI physical health checks recorded in the preceding 12 months"
          description_long: |
            Currently registered, living, non-test people with schizophrenia, bipolar
            affective disorder or another psychosis on the SMI register, including
            remission.

            Achievement requires all six checks in the preceding 12 months: blood
            pressure, BMI, alcohol consumption, lipid profile, blood glucose or HbA1c,
            and smoking status. Alcohol units, usage status or a screening tool qualify.
            Lipid evidence is a total cholesterol or cholesterol to HDL ratio result.
            Laboratory checks require a recorded value. checks_met_count ranges from 0
            to 6.

            Lithium therapy without an SMI diagnosis does not qualify. NICE treats
            remission as a personalised care adjustment for IND248, so remitted people
            remain in this denominator.

            Assessed on the reporting date before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND248"
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_blood_pressure_date
        description: Date of the latest blood pressure reading; null when none
      - name: latest_bmi_date
        description: Date of the latest BMI with a value; null when none
      - name: latest_alcohol_record_date
        description: Date of the latest alcohol consumption record (units, usage status or screening tool); null when none
      - name: latest_lipid_date
        description: Date of the latest lipid record counted by the indicator; null when none
      - name: latest_glucose_or_hba1c_date
        description: Date of the latest HbA1c or blood glucose; null when none
      - name: latest_smoking_status_date
        description: Date of the latest smoking status record; null when none
      - name: checks_met_count
        description: Number of the six physical health checks recorded in the preceding 12 months, 0 to 6
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']


