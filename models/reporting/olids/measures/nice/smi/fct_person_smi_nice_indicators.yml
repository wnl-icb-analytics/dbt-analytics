            The qualifying diagnosis for the never-smoker exception is the earliest SMI
            diagnosis. The active-diagnosis population follows the existing QOF mental
            health interpretation; NICE does not explicitly exclude remission here.

            Assessed on the reporting date before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND154"
