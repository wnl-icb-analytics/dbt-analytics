          name_short: "SMI smokers offered support"
          description_short: "Smoking cessation support offered in the preceding 12 months to current smokers with SMI"
          description_long: |
            Currently registered, living, non-test people with schizophrenia, bipolar
            affective disorder or another psychosis on the SMI register, excluding
