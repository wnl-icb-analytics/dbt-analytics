  - name: fct_person_smi_smoking_support_ind155
    description: |
      NICE IND155: SMI smokers offered support. One row per currently registered,
      living, non-test person with schizophrenia, bipolar affective disorder or another
      psychosis on the SMI register, excluding remission and lithium therapy without an
      SMI diagnosis, whose latest smoking status is current smoker, assessed on the
      build date.

      Achievement requires a stop-smoking referral, a pharmacotherapy record or a
      pharmacotherapy prescription in the preceding 12 months. QOF v51 SMOK004 defines
      this evidence through REFERSSSA_COD, PHARM_COD and PHARMDRUG_COD. Generic advice
      and declined-care codes alone do not qualify.

      The active-diagnosis population follows the existing QOF mental health
      interpretation; NICE does not explicitly exclude remission here.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind155
        indicator:
