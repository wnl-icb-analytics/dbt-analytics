          description_long: >-
            People registered on the build date with active schizophrenia, bipolar disorder or
            other psychosis; remission and lithium alone do not qualify. Achieved with smoking
            status in the 12 months before the build date, or latest never-smoked status
            recorded after the 25th birthday and first mental illness diagnosis if age reaches
            26 by financial year-end. The three-year ex-smoker exception is not applied. NICE
            does not explicitly exclude remission. No personalised care adjustments are applied.
            Based on NICE CG178. Code lists: MH_COD, MHREM_COD, SMOK_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
