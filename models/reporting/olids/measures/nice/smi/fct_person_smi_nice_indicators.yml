  - name: fct_person_lithium_monitoring_ind87
    description: >-
      Serum lithium within the therapeutic range (NICE IND87). One row per person in the
      denominator on the build date.


      People registered on the build date prescribed lithium in the 6 months before the build
      date, without a later stop; a same-day stop does not exclude them. Prescriptions and stops
      must be known by that date. Mental illness diagnosis is not required. Achieved when the
      latest serum lithium result in the preceding 4 months is 0.4 to 1.0 mmol/L inclusive.
      Missing values are unassessable; other values are out of range. NICE defines neither this
      local range nor latest-result selection. No personalised care adjustments are applied.
      Based on NICE CG185. Code lists: LIT_COD; LITSTP_COD (PCD); PINCER/LITH_LEV
      (OpenCodelists).
