  - name: fct_person_lithium_monitoring_ind87
    description: |
      NICE IND87: Lithium level in range. One row per currently registered, living,
      non-test person on lithium therapy according to the SMI register, based on
      prescriptions in the preceding 6 months and lithium-stopped records, assessed on
      the build date.

      Achievement requires the latest serum lithium record in the preceding 4 months to
      have a value between 0.4 and 1.0 mmol/L inclusive. A latest record without a
      numeric value is NOT_ASSESSABLE; a value outside the range is OUT_OF_RANGE.

      The numerical range and use of the latest result are existing local
      interpretations. NICE IND87 does not define a numerical range or clearly settle
      latest versus any qualifying result. The retired QOF MH010 rule is absent from
      v51, so v51 cannot resolve these choices.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind87
        indicator:
          id: "IND87"
          type: "MEASURE"
          category: "MENTAL_HEALTH"
          clinical_domain: "Mental health"
          name_short: "Lithium level in range"
          description_short: "Latest serum lithium in the preceding 4 months in the 0.4 to 1.0 mmol/L range"
          description_long: |
            Currently registered, living, non-test people on lithium therapy according
            to the SMI register, based on prescriptions in the preceding 6 months and
            lithium-stopped records.

            Achievement requires the latest serum lithium record in the preceding 4
            months to have a value between 0.4 and 1.0 mmol/L inclusive. A latest record
            without a numeric value is NOT_ASSESSABLE; a value outside the range is
            OUT_OF_RANGE.

            The numerical range and use of the latest result are existing local
            interpretations. NICE IND87 does not define a numerical range or clearly
            settle latest versus any qualifying result. The retired QOF MH010 rule is
            absent from v51, so v51 cannot resolve these choices.

            Assessed on the reporting date before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND87"
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_lithium_level_date
        description: Date of the latest serum lithium record of any value; null when none
      - name: latest_lithium_level
        description: Latest serum lithium in mmol/L; null when the latest record has no value
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED; NOT_RECORDED_IN_PERIOD when no serum lithium in the period; NOT_ASSESSABLE when the latest record has no value; OUT_OF_RANGE otherwise
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD', 'NOT_ASSESSABLE', 'OUT_OF_RANGE']


  - name: fct_person_smi_nice_indicators
    description: |
      Severe mental illness NICE indicator results. One row per eligible person and
      indicator on the build date. Covers IND82, IND83, IND84, IND85, IND87, IND143,
      IND150, IND154, IND155, IND158, IND159, IND213, IND214, IND248.

      Each indicator retains its own population, evidence window and exclusions. The
      individual indicator models define these rules. Results feed the combined NICE
      indicator table and family history.

      IND248 includes SMI remission before personalised care adjustments. IND87 covers
      lithium therapy. The other indicators use diagnosed SMI outside remission.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
      - name: indicator_id
        description: NICE indicator identifier
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND82', 'IND83', 'IND84', 'IND85', 'IND87', 'IND143', 'IND150', 'IND154', 'IND155', 'IND158', 'IND159', 'IND213', 'IND214', 'IND248']
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_blood_pressure_date
        description: Date of the latest blood pressure reading; null when none; typed null for branches that do not emit it
      - name: latest_bmi_date
        description: Date of the latest BMI with a value; null when none; typed null for branches that do not emit it
      - name: latest_alcohol_record_date
        description: Date of the latest alcohol consumption record (units, usage status or screening tool); null when none; typed null for branches that do not emit it
      - name: latest_lipid_date
        description: Date of the latest lipid record counted by the indicator; null when none; typed null for branches that do not emit it
      - name: latest_cholesterol_hdl_ratio_date
        description: Date of the latest total cholesterol to HDL ratio with a value; null when none; typed null for branches that do not emit it
      - name: latest_glucose_or_hba1c_date
        description: Date of the latest HbA1c or blood glucose; null when none; typed null for branches that do not emit it
      - name: latest_smoking_status_date
        description: Date of the latest smoking status record; null when none; typed null for branches that do not emit it
      - name: checks_met_count
        description: Number of the six physical health checks recorded in the preceding 12 months, 0 to 6; typed null for branches that do not emit it
      - name: latest_smoking_status
        description: Latest recorded smoking status; null when none; typed null for branches that do not emit it
      - name: latest_lithium_level_date
        description: Date of the latest serum lithium record of any value; null when none; typed null for branches that do not emit it
      - name: latest_lithium_level
        description: Latest serum lithium in mmol/L; null when the latest record has no value; typed null for branches that do not emit it
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD; IND87 also uses NOT_ASSESSABLE and OUT_OF_RANGE
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD', 'NOT_ASSESSABLE', 'OUT_OF_RANGE']

