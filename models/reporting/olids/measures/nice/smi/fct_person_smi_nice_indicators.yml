            People registered on the build date aged 18 or over with active schizophrenia,
            bipolar disorder or other psychosis. Remission excludes them, as does coronary heart
            disease, stroke, transient ischaemic attack or peripheral arterial disease first
            diagnosed more than 12 months earlier. Achieved with a numeric total cholesterol to
            HDL ratio in the 12 months before the build date. NICE does not specify these
            remission and disease exclusions. No personalised care adjustments are applied.
