  - name: fct_person_smi_care_plan_ind143
    description: |
      NICE IND143: SMI care plan. One row per currently registered, living, non-test
      person with schizophrenia, bipolar affective disorder or another psychosis on the
      SMI register, excluding remission and lithium therapy without an SMI diagnosis,
      assessed on the build date.

      Achievement requires a mental health care plan in the preceding 12 months. Where a
      remission code exists, the plan must be on or after the latest diagnosis;
      otherwise it must be on or after the first diagnosis. This implements the relapse
      rule using QOF v51 MH002.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind143
        indicator:
          id: "IND143"
          type: "MEASURE"
          category: "MENTAL_HEALTH"
          clinical_domain: "Mental health"
          name_short: "SMI care plan"
          description_short: "Mental health care plan recorded in the preceding 12 months for people with SMI"
          description_long: |
            Currently registered, living, non-test people with schizophrenia, bipolar
            affective disorder or another psychosis on the SMI register, excluding
            remission and lithium therapy without an SMI diagnosis.

            Achievement requires a mental health care plan in the preceding 12 months.
            Where a remission code exists, the plan must be on or after the latest
            diagnosis; otherwise it must be on or after the first diagnosis. This
            implements the relapse rule using QOF v51 MH002.

