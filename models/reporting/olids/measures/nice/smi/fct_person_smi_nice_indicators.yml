  - name: fct_person_smi_smoking_ind154
    description: |
      NICE IND154: SMI smoking status. One row per currently registered, living,
      non-test person with schizophrenia, bipolar affective disorder or another
      psychosis on the SMI register, excluding remission and lithium therapy without an
      SMI diagnosis, assessed on the build date.

      Achievement requires a smoking status record in the preceding 12 months. A person
      whose latest status is never smoked also qualifies without a recent record if they
      reach 26 by the current financial year end. Their never-smoked record must be
      after their 25th birthday and after their earliest qualifying diagnosis. The
      optional three-year ex-smoker exception is not applied.

      The qualifying diagnosis for the never-smoker exception is the earliest SMI
      diagnosis. The active-diagnosis population follows the existing QOF mental health
      interpretation; NICE does not explicitly exclude remission here.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind154
        indicator:
          id: "IND154"
          type: "MEASURE"
          category: "MENTAL_HEALTH"
          clinical_domain: "Mental health"
          name_short: "SMI smoking status"
          description_short: "Smoking status recorded in the preceding 12 months for people with SMI"
          description_long: |
            Currently registered, living, non-test people with schizophrenia, bipolar
            affective disorder or another psychosis on the SMI register, excluding
            remission and lithium therapy without an SMI diagnosis.

            Achievement requires a smoking status record in the preceding 12 months. A
            person whose latest status is never smoked also qualifies without a recent
            record if they reach 26 by the current financial year end. Their
            never-smoked record must be after their 25th birthday and after their
            earliest qualifying diagnosis. The optional three-year ex-smoker exception
