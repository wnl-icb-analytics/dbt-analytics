models:
- name: fct_person_nsaid_egfr_ind232
  description: >-
    eGFR testing with long-term oral NSAID use (NICE IND232). One row per person in the
    denominator on the build date.


    People registered on the build date outside the CKD register with oral non-steroidal
    anti-inflammatory drug (NSAID) prescriptions on at least 12 distinct days in the 24
    months before the build date. Several prescriptions on one day count once. Achieved
    with an eGFR test in the last 12 months. No numeric result is needed. No personalised
    care adjustments are applied. Based on NICE NG203. Code lists: EGFR_COD (PCD);
    ORALNSAIDDRUG_COD (NHS drug refset).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind232
      indicator:
        id: IND232
        type: MEASURE
        category: KIDNEY
        clinical_domain: Cardiometabolic
        name_short: "Long-term NSAID kidney testing"
        description_short: "eGFR testing with long-term oral NSAID use (NICE IND232)."
        description_long: >-
          People registered on the build date outside the CKD register with oral
          non-steroidal anti-inflammatory drug (NSAID) prescriptions on at least 12
          distinct days in the 24 months before the build date. Several
          prescriptions on one day count once. Achieved with an eGFR test in the
          last 12 months. No numeric result is needed. No personalised care
          adjustments are applied. Based on NICE NG203. Code lists: EGFR_COD (PCD);
          ORALNSAIDDRUG_COD (NHS drug refset).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND232
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: person_id
    description: "Person identifier for someone in the indicator denominator."
  - name: indicator_id
    description: "Published NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Build date used to assess the population, age and evidence."
  - name: measurement_period_start
    description: "Inclusive start of the 12-month eGFR test window. NSAID prescriptions use a separate 24-month window whose start is excluded."
  - name: age
    description: "Completed years on the build date, based on the approximate birth date; null when age is unknown."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: current_practice_code
    description: "ODS code of the current registration practice."
  - name: current_practice_name
    description: "Name of the current registration practice."
  - name: nsaid_issue_day_count
    description: "Number of distinct days with an oral NSAID prescription in the last 24 months, excluding the first day; at least 12."
  - name: latest_therapy_order_date
    description: "Latest oral NSAID prescription date in the 24-month period used to establish long-term use."
  - name: latest_record_date
    description: "Date of qualifying evidence retained within the indicator measurement or follow-up window; null when none is recorded."
  - name: is_in_denominator
    description: "Always true. Every row belongs to the denominator before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the indicator achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
