models:
- name: fct_person_ckd_new_diagnosis_egfr_ind233_by_month
  description: >-
    eGFR confirmation before kidney disease diagnosis (NICE IND233). One row per person in
    the denominator at the month-end.


    People registered at the month-end aged 18 or over on the CKD stage 3 to 5 register,
    first diagnosed in the 12 months before the month-end. Achieved with two numeric eGFR
    measurements at least 90 days apart, the second within 90 days before diagnosis. Tests
    on diagnosis day count; later tests do not. Tests during acute secondary-care episodes
    cannot be reliably excluded as NICE requires. No personalised care adjustments are
    applied. Based on NICE NG203. Recalculated for each of the last 60 month-ends with
    current rules, code lists and records, so later corrections can change past months.
    Code lists: CKD_COD, CKD1AND2_COD, CKDRES_COD, EGFR_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind233
  columns:
  - name: person_id
    description: "Person identifier for someone in the indicator denominator."
  - name: indicator_id
    description: "Published NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess the population, age and evidence."
  - name: measurement_period_start
    description: "Inclusive start of the indicator measurement period before the reporting date."
  - name: age
    description: "Completed years on the month-end, based on the approximate birth date; null when age is unknown."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
  - name: diagnosis_date
    description: "First recorded diagnosis date used to define the indicator population and follow-up window."
  - name: latest_egfr_value
    description: "Latest eGFR in mL/min/1.73 m2; null when absent or invalid."
  - name: latest_acr_value
    description: "Latest numeric urine albumin:creatinine ratio (ACR), in mg/mmol; null when absent or outside the accepted range."
  - name: latest_record_date
    description: "Second eGFR test date in the qualifying pair before diagnosis; null when no qualifying pair is recorded."
  - name: is_in_denominator
    description: "Always true. Every row belongs to the denominator before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the indicator achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
