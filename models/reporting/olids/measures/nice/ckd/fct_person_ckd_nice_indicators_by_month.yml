models:
- name: fct_person_ckd_nice_indicators_by_month
  description: |
    Monthly NICE CKD outcomes for all nine family indicators, including long-term oral NSAID users outside the CKD register. One row per eligible, active, living, non-test person, indicator and completed month-end. Each indicator retains its own denominator, threshold, status and measurement period. Detail fields that do not apply to a branch are typed nulls.

    Recalculated at monthly refresh for the last 60 completed month-ends using today's
    rules and code lists. Registration and practice use the existing monthly spine.
    Registration start is inclusive; registration end and death dates are exclusive.
    Overlapping registrations retain the spine's current-registration priority.
    Birth and death dates are approximate. Missing birth dates prevent historical
    active rows. Current gender and test flags apply retrospectively. CKD and other
    register states use clinical and recorded dates. Other evidence uses its corrected
    clinical or order date through month-end. Later corrections and code-list changes
    can alter earlier results. Personalised care adjustments are not applied.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
        - reporting_date
  columns:
  - name: person_id
    description: Person in the indicator denominator
  - name: indicator_id
    description: NICE indicator identifier
  - name: indicator_name
    description: Published NICE indicator name
  - name: reporting_date
    description: Completed month-end used for eligibility and evidence. DATE; no current-day row.
  - name: measurement_period_start
    description: Inclusive start of the measurement period before the reporting date
  - name: age
    description: Completed years at month-end from the approximate birth month.
  - name: condition_name
    description: Population defining the indicator
  - name: practice_code
    description: Practice ODS code at month-end under the monthly spine attribution.
  - name: practice_name
    description: Practice name at month-end under the monthly spine attribution.
  - name: latest_egfr_value
    description: Latest eGFR in ml/min/1.73m2; null when none; typed null for branches that do not emit
      it
  - name: latest_acr_value
    description: Latest urine ACR in mg/mmol; null when none; typed null for branches that do not emit
      it
  - name: latest_systolic_value
    description: Latest systolic BP in mmHg; null when none; typed null for branches that do not emit
      it
  - name: latest_diastolic_value
    description: Latest diastolic BP in mmHg; null when none; typed null for branches that do not emit
      it
  - name: latest_frailty_severity
    description: Latest coded frailty severity; null when none; typed null for branches that do not emit
      it
  - name: latest_therapy_order_date
    description: Date of the latest order of the counted therapy at any time; null when never ordered;
      typed null for branches that do not emit it
  - name: diagnosis_date
    description: Diagnosis date anchoring the indicator window; typed null for branches that do not emit
      it
  - name: latest_bp_date
    description: Date of the latest blood pressure reading at any time for the BP indicators; typed null
      for other branches
  - name: applied_measurement_context
    description: CLINIC or HBPM_ABPM for the latest reading for the BP indicators; typed null for other
      branches
  - name: indicator_systolic_threshold
    description: Exclusive systolic threshold in mmHg for the BP indicators; typed null for other branches
  - name: indicator_diastolic_threshold
    description: Exclusive diastolic threshold in mmHg for the BP indicators; typed null for other branches
  - name: nsaid_issue_day_count
    description: Distinct oral NSAID issue days in 24 months for IND232; null for other indicators.
  - name: latest_record_date
    description: Date of the latest qualifying record in the period; null when none
  - name: is_in_denominator
    description: Always true; every row is an eligible person before personalised care adjustments
  - name: is_in_numerator
    description: Whether the person meets the indicator on the reporting date
  - name: indicator_status
    description: ACHIEVED, NOT_RECORDED_IN_PERIOD, ABOVE_TARGET, NOT_ASSESSABLE, NOT_TREATED_IN_PERIOD
      or NEVER_TREATED
