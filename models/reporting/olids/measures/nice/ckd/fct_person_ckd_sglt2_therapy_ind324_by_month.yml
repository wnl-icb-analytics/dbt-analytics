models:
- name: fct_person_ckd_sglt2_therapy_ind324_by_month
  description: >-
    SGLT2 inhibitor treatment in kidney disease (NICE IND324). One row per person in the
    denominator at the month-end.


    People registered at the month-end aged 18 or over on the CKD stage 3 to 5 register
    with type 2 diabetes, or latest eGFR 20 to 44 mL/min/1.73 m2, or latest eGFR 45 to 59
    with latest urine ACR at least 22.6 mg/mmol. Outside type 2 diabetes, including
    unknown type, eligibility also requires an ACE inhibitor or ARB prescription in the
    last 6 months or contraindications to both. Latest eGFR below 20 excludes everyone;
    unknown eGFR permits type 2 diabetes. Achieved with an SGLT2 inhibitor prescription in
    the last 6 months; outside type 2 diabetes, ACE inhibitor or ARB treatment must
    precede or coincide with the latest SGLT2 prescription, unless both classes are
    contraindicated. No personalised care adjustments are applied. Based on NICE NG28.
    Recalculated for each of the last 60 month-ends with current rules, code lists and
    records, so later corrections can change past months. Code lists: CKD_COD,
    CKD1AND2_COD, CKDRES_COD, EGFR_COD, NDAALB_COD, SGLT2I_RX (PCD); 0205051, 0205052
    (BNF); XACE_COD, TXACE_COD, XAII_COD, TXAII_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind324
  columns:
  - name: person_id
    description: "Person identifier for someone in the indicator denominator."
  - name: indicator_id
    description: "Published NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess the population, age and evidence."
  - name: measurement_period_start
    description: "Inclusive start of the indicator measurement period before the reporting date."
  - name: age
    description: "Completed years on the month-end, based on the approximate birth date; null when age is unknown."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
  - name: latest_egfr_value
    description: "Latest eGFR in mL/min/1.73 m2; null when absent or invalid."
  - name: latest_acr_value
    description: "Latest numeric urine albumin:creatinine ratio (ACR), in mg/mmol; null when absent or outside the accepted range."
  - name: latest_therapy_order_date
    description: "Date of the latest relevant medication prescription by the reporting date; it may be outside the treatment window. Null when never prescribed."
  - name: is_treatment_sequence_met
    description: "Whether the person has type 2 diabetes, contraindications to both ACE inhibitors and ARBs, or a prescription for either class in the last 6 months on or before the latest SGLT2 prescription."
  - name: latest_record_date
    description: "Date of qualifying evidence retained within the indicator measurement or follow-up window; null when none is recorded."
  - name: is_in_denominator
    description: "Always true. Every row belongs to the denominator before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the indicator achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
