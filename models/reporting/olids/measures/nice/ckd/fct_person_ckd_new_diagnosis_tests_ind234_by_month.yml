models:
- name: fct_person_ckd_new_diagnosis_tests_ind234_by_month
  description: >-
    eGFR and ACR testing around kidney disease diagnosis (NICE IND234). One row per person in
    the denominator at the month-end.


    People registered at the month-end aged 18 or over on the CKD stage 3 to 5 register, first
    diagnosed in the 12-month period ending 90 days before the month-end. Everyone has
    completed 90 days of follow-up. This shifted cohort replaces NICE's preceding 12 months.
    Achieved with both eGFR and urine albumin:creatinine ratio (ACR) tests within 90 days
    before or after diagnosis. eGFR needs a numeric result; ACR does not. No personalised care
    adjustments are applied. Based on NICE NG203. Recalculated for each of the last 60
    month-ends with current rules, code lists and records, so later corrections can change
    past months. Code lists: CKD_COD, CKD1AND2_COD, CKDRES_COD, EGFR_COD, NDAALB_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind234
  columns:
  - name: person_id
    description: "Person identifier for someone in the indicator denominator."
  - name: indicator_id
    description: "Published NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess the population, age and evidence."
  - name: measurement_period_start
    description: "Exclusive start of the diagnosis cohort window; tests or referrals use the separate follow-up window described for the indicator."
  - name: age
    description: "Completed years on the month-end, based on the approximate birth date; null when age is unknown."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice at month-end."
  - name: practice_name
    description: "Name of the registration practice at month-end."
  - name: diagnosis_date
    description: "First recorded diagnosis date used to define the indicator population and follow-up window."
  - name: latest_egfr_value
    description: "eGFR from the latest numeric observation by the reporting date, in mL/min/1.73 m2, with no lookback limit. Null when absent or outside 1 to 200; a later invalid numeric result prevents fallback."
  - name: latest_acr_value
    description: "Latest numeric urine albumin:creatinine ratio (ACR) by the reporting date, in mg/mmol, with no lookback limit. Value-free tests are ignored. Null when no numeric test is recorded or its result is outside 0 to 9999.99."
  - name: latest_record_date
    description: "Later of the qualifying eGFR and ACR test dates around diagnosis; null unless both tests are recorded."
  - name: is_in_denominator
    description: "Always true. Every row belongs to the denominator before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the indicator achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
