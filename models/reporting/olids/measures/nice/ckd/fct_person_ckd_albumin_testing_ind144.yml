models:
  - name: fct_person_ckd_albumin_testing_ind144
    description: >-
      Urine albumin testing in kidney disease (NICE IND144). One row per person in the
      denominator on the build date.


      People registered on the build date aged 18 or over on the chronic kidney disease
      (CKD) stage 3 to 5 register. Achieved with a urine albumin:creatinine ratio (ACR)
      or protein:creatinine ratio (PCR) test in the 12 months before the build date. No
      numeric result is needed. Albumin measurements without a creatinine ratio do not
      count. No personalised care adjustments are applied. Based on NICE NG203. Code
      lists: CKD_COD, CKD1AND2_COD, CKDRES_COD, NDAALB_COD (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind144
        indicator:
          id: "IND144"
          type: "MEASURE"
          category: "KIDNEY"
          clinical_domain: "Cardiometabolic"
          name_short: "Kidney disease urine albumin testing"
          description_short: "Urine albumin testing in kidney disease (NICE IND144)."
          description_long: >-
            People registered on the build date aged 18 or over on the chronic
            kidney disease (CKD) stage 3 to 5 register. Achieved with a urine
            albumin:creatinine ratio (ACR) or protein:creatinine ratio (PCR) test
            in the 12 months before the build date. No numeric result is needed.
            Albumin measurements without a creatinine ratio do not count. No
            personalised care adjustments are applied. Based on NICE NG203. Code
            lists: CKD_COD, CKD1AND2_COD, CKDRES_COD, NDAALB_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND144"
    columns:
      - name: person_id
        description: "Person identifier for someone in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "Published NICE indicator identifier."
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: reporting_date
        description: "Build date used to assess the population, age and evidence."
      - name: measurement_period_start
        description: "Inclusive start of the indicator measurement period before the reporting date."
      - name: age
        description: "Completed years on the build date, based on the approximate birth date; null when age is unknown."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: current_practice_name
        description: "Name of the current registration practice."
      - name: latest_record_date
        description: "Date of the latest qualifying urine ACR or PCR test in the measurement period; null when none is recorded."
      - name: is_in_denominator
        description: "Always true. Every row belongs to the denominator before personalised care adjustments."
      - name: is_in_numerator
        description: "Whether the person meets the indicator achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']
