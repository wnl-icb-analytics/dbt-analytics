models:
  - name: fct_person_ckd_ras_therapy_ind263
    description: >
      NICE IND263 ACE inhibitor or ARB therapy in CKD with heavy albuminuria.
      One row per currently registered, living, non-test person on the CKD
      register whose latest urine ACR ratio is 70 mg/mmol or more and who is
      not on the diabetes register, assessed on the build date. The numerator
      requires an ACE inhibitor or ARB order in the preceding 6 calendar
      months. Personalised care adjustments are not applied. Secondary-use
      consumers must join DIM_PERSON_SECONDARY_USE_ALLOWED to apply National
      Data Opt-Out and Type 1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind263
        indicator:
          id: "IND263"
          type: "MEASURE"
          category: "KIDNEY"
          clinical_domain: "Cardiometabolic"
          name_short: "CKD ACR 70 on ACEi or ARB"
          description_short: "ACE inhibitor or ARB order in the preceding 6 months for people with CKD, ACR 70 or more and no diabetes"
          description_long: "NICE IND263 before personalised care adjustments."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND263"
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_egfr_value
        description: Latest eGFR in ml/min/1.73m2; null when none
      - name: latest_acr_value
        description: Latest urine ACR in mg/mmol; null when none
      - name: latest_therapy_order_date
        description: Date of the latest order of the counted therapy at any time; null when never ordered
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED, NOT_TREATED_IN_PERIOD (an order more than 6 months ago) or NEVER_TREATED
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_TREATED_IN_PERIOD', 'NEVER_TREATED']


