  - name: fct_person_ckd_bp_ind264
    description: >
      NICE IND264 blood pressure in CKD with heavy albuminuria. One row per
      currently registered, living, non-test person on the CKD register whose
      latest urine ACR ratio is 70 mg/mmol or more, without moderate or severe
      coded frailty, assessed on the build date. The numerator requires the
      latest blood pressure to fall in the preceding 12 months and to be below
      130/80 mmHg in clinic or 125/75 mmHg by home or ambulatory monitoring,
      both readings strictly below the threshold. Personalised care
      adjustments are not applied. Secondary-use consumers must join
      DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-Out and Type
      1 opt-out filtering.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind264
        indicator:
          id: "IND264"
          type: "MEASURE"
          category: "KIDNEY"
          clinical_domain: "Cardiometabolic"
          name_short: "CKD ACR 70 BP target"
          description_short: "Latest BP in the preceding 12 months below 130/80 clinic or 125/75 home for people with CKD and ACR 70 or more"
          description_long: "NICE IND264 before personalised care adjustments."
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND264"
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_frailty_severity
        description: Latest coded frailty severity; null when none
      - name: latest_acr_value
        description: Latest urine ACR in mg/mmol; null when none
      - name: latest_bp_date
        description: Date of the latest blood pressure reading at any time; null when none
      - name: latest_record_date
        description: Date of the latest blood pressure reading when it falls in the preceding 12 months; null otherwise
      - name: latest_systolic_value
        description: Latest systolic BP in mmHg; null when none
      - name: latest_diastolic_value
        description: Latest diastolic BP in mmHg; null when none
      - name: applied_measurement_context
        description: CLINIC or HBPM_ABPM for the latest reading; null when none
      - name: indicator_systolic_threshold
        description: Exclusive systolic threshold in mmHg applied to the latest reading; null when none
      - name: indicator_diastolic_threshold
        description: Exclusive diastolic threshold in mmHg applied to the latest reading; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the latest reading falls in the period and below both thresholds
      - name: indicator_status
        description: ACHIEVED, ABOVE_TARGET or NOT_RECORDED_IN_PERIOD
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'ABOVE_TARGET', 'NOT_RECORDED_IN_PERIOD']


