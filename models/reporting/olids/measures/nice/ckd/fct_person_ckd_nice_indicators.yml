  - name: fct_person_ckd_sglt2_therapy_ind324
    description: |
      NICE IND324. SGLT2 inhibitor treatment in eligible people with CKD. One row
      per currently registered, living, non-test person on the CKD register who
      has type 2 diabetes or meets the specified renal and treatment criteria,
      assessed on the build date.

      Achievement requires an SGLT2 inhibitor prescription in the preceding six
      calendar months. Outside type 2 diabetes, an ACE inhibitor or ARB
      prescription in those six months must be on or before the last SGLT2
      prescription, unless both classes are contraindicated.

      Outside type 2 diabetes, eligibility requires current ACE inhibitor or ARB
      treatment or contraindication to both, and eGFR 20-44 mL/min/1.73m2 or eGFR
      45-59 with ACR at least 22.6 mg/mmol. An unknown diabetes type follows this
      branch. A latest eGFR below 20 excludes everyone; an unknown eGFR does not
      exclude the type 2 diabetes branch. The published integer ranges and
      existing same-day prescription ordering are retained.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind324
        indicator:
          id: "IND324"
          type: "MEASURE"
          category: "KIDNEY"
          clinical_domain: "Cardiometabolic"
          name_short: "CKD on SGLT2 inhibitor"
          description_short: "SGLT2 inhibitor order in the preceding 6 months for eligible people with CKD"
          description_long: |
            NICE IND324. One row per currently registered, living, non-test person on the
            CKD register who has type 2 diabetes or meets the specified renal and
            treatment criteria, assessed on the build date.

            Achievement requires an SGLT2 inhibitor prescription in the preceding six
            calendar months. Outside type 2 diabetes, an ACE inhibitor or ARB prescription
            in those six months must be on or before the last SGLT2 prescription, unless
            both classes are contraindicated.

            Outside type 2 diabetes, eligibility requires current ACE inhibitor or ARB
            treatment or contraindication to both, and eGFR 20-44 mL/min/1.73m2 or eGFR
            45-59 with ACR at least 22.6 mg/mmol. An unknown diabetes type follows this
            branch. A latest eGFR below 20 excludes everyone; an unknown eGFR does not
            exclude the type 2 diabetes branch. The published integer ranges and existing
            same-day prescription ordering are retained.

            Measured before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND324"
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_egfr_value
        description: Latest eGFR in ml/min/1.73m2; null when none
      - name: latest_acr_value
        description: Latest urine ACR in mg/mmol; null when none
      - name: latest_therapy_order_date
        description: Date of the latest order of the counted therapy at any time; null when never ordered
      - name: is_treatment_sequence_met
        description: Whether a renin-angiotensin order in the preceding 6 months precedes the latest SGLT2 order (or both classes are contraindicated), or the person has type 2 diabetes
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED, NOT_TREATED_IN_PERIOD (an order more than 6 months ago or sequence not met) or NEVER_TREATED
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_TREATED_IN_PERIOD', 'NEVER_TREATED']


  - name: fct_person_ckd_bp_ind264
    description: |
      NICE IND264. Blood pressure control in CKD with heavy albuminuria. One row
      per currently registered, living, non-test person on the CKD register with a
      latest ACR of at least 70 mg/mmol and without moderate or severe frailty,
      assessed on the build date.

      Achievement requires the latest blood pressure in the preceding 12 months to
      be below 130/80 mmHg in clinic or 125/75 mmHg at home or by ambulatory
      monitoring. Both components must be strictly below their thresholds.

      Missing or invalid latest ACR values do not establish eligibility. An
      invalid latest ACR is not replaced by an older result.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind264
        indicator:
          id: "IND264"
          type: "MEASURE"
          category: "KIDNEY"
          clinical_domain: "Cardiometabolic"
          name_short: "CKD ACR 70 BP target"
          description_short: "Latest BP in the preceding 12 months below 130/80 clinic or 125/75 home for people with CKD and ACR 70 or more"
          description_long: |
            NICE IND264. One row per currently registered, living, non-test person on the
            CKD register with a latest ACR of at least 70 mg/mmol and without moderate or
            severe frailty, assessed on the build date.

            Achievement requires the latest blood pressure in the preceding 12 months to
            be below 130/80 mmHg in clinic or 125/75 mmHg at home or by ambulatory
            monitoring. Both components must be strictly below their thresholds.

            Missing or invalid latest ACR values do not establish eligibility. An invalid
            latest ACR is not replaced by an older result.

            Measured before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND264"
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_frailty_severity
        description: Latest coded frailty severity; null when none
      - name: latest_acr_value
        description: Latest urine ACR in mg/mmol; null when none
      - name: latest_bp_date
        description: Date of the latest blood pressure reading at any time; null when none
      - name: latest_record_date
        description: Date of the latest blood pressure reading when it falls in the preceding 12 months; null otherwise
      - name: latest_systolic_value
        description: Latest systolic BP in mmHg; null when none
      - name: latest_diastolic_value
        description: Latest diastolic BP in mmHg; null when none
      - name: applied_measurement_context
        description: CLINIC or HBPM_ABPM for the latest reading; null when none
      - name: indicator_systolic_threshold
        description: Exclusive systolic threshold in mmHg applied to the latest reading; null when none
      - name: indicator_diastolic_threshold
        description: Exclusive diastolic threshold in mmHg applied to the latest reading; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the latest reading falls in the period and below both thresholds
      - name: indicator_status
        description: ACHIEVED, ABOVE_TARGET or NOT_RECORDED_IN_PERIOD
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'ABOVE_TARGET', 'NOT_RECORDED_IN_PERIOD']


