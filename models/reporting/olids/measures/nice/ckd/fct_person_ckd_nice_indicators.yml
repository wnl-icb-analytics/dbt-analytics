  - name: fct_person_ckd_new_diagnosis_egfr_ind233
    description: |
      NICE IND233. eGFR confirmation before a new CKD diagnosis. One row per
      currently registered, living, non-test person whose first coded CKD stage 3
      to 5 diagnosis was in the preceding 12 months, assessed on the build date.

      Achievement requires two eGFR measurements at least 90 days apart. The
      second must be within 90 days before the diagnosis. Future-dated tests
      cannot count.

      The current measurement input requires recorded numeric results. It cannot
      reliably distinguish tests from acute secondary-care episodes, which NICE
      says should be excluded.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind233
        indicator:
          id: "IND233"
          type: "MEASURE"
          category: "KIDNEY"
          clinical_domain: "Cardiometabolic"
          name_short: "New CKD confirmed by eGFR"
          description_short: "Two eGFR measurements at least 90 days apart, the second within 90 days before a new CKD diagnosis"
          description_long: |
            NICE IND233. One row per currently registered, living, non-test person whose
            first coded CKD stage 3 to 5 diagnosis was in the preceding 12 months,
            assessed on the build date.

            Achievement requires two eGFR measurements at least 90 days apart. The second
            must be within 90 days before the diagnosis. Future-dated tests cannot count.

            The current measurement input requires recorded numeric results. It cannot
            reliably distinguish tests from acute secondary-care episodes, which NICE says
            should be excluded.

            Measured before personalised care adjustments.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
