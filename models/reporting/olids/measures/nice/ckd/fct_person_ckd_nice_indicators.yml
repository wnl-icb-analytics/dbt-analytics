  - name: fct_person_ckd_new_diagnosis_egfr_ind233
    description: >-
      eGFR confirmation before kidney disease diagnosis (NICE IND233). One row per
      person in the denominator on the build date.


      People registered on the build date aged 18 or over on the CKD stage 3 to 5
      register, first diagnosed in the 12 months before the build date. Achieved with
      two numeric eGFR measurements at least 90 days apart, the second within 90 days
      before diagnosis. Tests on diagnosis day count; later tests do not. Tests during
      acute secondary-care episodes cannot be reliably excluded as NICE requires. No
      personalised care adjustments are applied. Based on NICE NG203. Code lists:
      CKD_COD, CKD1AND2_COD, CKDRES_COD, EGFR_COD (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind233
        indicator:
          id: "IND233"
          type: "MEASURE"
          category: "KIDNEY"
          clinical_domain: "Cardiometabolic"
          name_short: "New kidney disease eGFR confirmation"
          description_short: "eGFR confirmation before kidney disease diagnosis (NICE IND233)."
          description_long: >-
            People registered on the build date aged 18 or over on the CKD stage 3
            to 5 register, first diagnosed in the 12 months before the build date.
            Achieved with two numeric eGFR measurements at least 90 days apart,
            the second within 90 days before diagnosis. Tests on diagnosis day
            count; later tests do not. Tests during acute secondary-care episodes
