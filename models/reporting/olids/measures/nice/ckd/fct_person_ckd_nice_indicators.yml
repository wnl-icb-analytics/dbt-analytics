  - name: fct_person_ckd_nice_indicators
    description: |
      Current NICE chronic kidney disease indicator outcomes. One row per eligible
      person and indicator on the reporting date.

      Each indicator retains its own denominator, achievement rules and
      measurement period. The table includes clinical detail for the family;
      fields that do not apply to an indicator are null.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
      - name: indicator_id
        description: NICE indicator identifier
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND130', 'IND144', 'IND233', 'IND234', 'IND235', 'IND263', 'IND264', 'IND324']
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: latest_egfr_value
        description: Latest eGFR in ml/min/1.73m2; null when none; typed null for branches that do not emit it
      - name: latest_acr_value
        description: Latest urine ACR in mg/mmol; null when none; typed null for branches that do not emit it
      - name: latest_systolic_value
        description: Latest systolic BP in mmHg; null when none; typed null for branches that do not emit it
      - name: latest_diastolic_value
        description: Latest diastolic BP in mmHg; null when none; typed null for branches that do not emit it
      - name: latest_frailty_severity
        description: Latest coded frailty severity; null when none; typed null for branches that do not emit it
      - name: latest_therapy_order_date
        description: Date of the latest order of the counted therapy at any time; null when never ordered; typed null for branches that do not emit it
      - name: diagnosis_date
        description: Diagnosis date anchoring the indicator window; typed null for branches that do not emit it
      - name: latest_bp_date
        description: Date of the latest blood pressure reading at any time for the BP indicators; typed null for other branches
      - name: applied_measurement_context
        description: CLINIC or HBPM_ABPM for the latest reading for the BP indicators; typed null for other branches
      - name: indicator_systolic_threshold
        description: Exclusive systolic threshold in mmHg for the BP indicators; typed null for other branches
      - name: indicator_diastolic_threshold
        description: Exclusive diastolic threshold in mmHg for the BP indicators; typed null for other branches
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED, NOT_RECORDED_IN_PERIOD, ABOVE_TARGET, NOT_TREATED_IN_PERIOD or NEVER_TREATED
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD', 'ABOVE_TARGET', 'NOT_TREATED_IN_PERIOD', 'NEVER_TREATED']

  - name: fct_person_ckd_nice_indicators_snapshot_input
    description: |
      Current NICE ckd indicators outcomes used to record changes over time. One
      row per person and indicator in the current indicator denominator.

      Keeps the current practice, qualifying evidence date and outcome. Build-date
      fields are excluded so a new snapshot version records a changed outcome or
      practice rather than the daily date change.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
      - name: indicator_id
        description: NICE indicator identifier
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: latest_egfr_value
        description: Latest eGFR in ml/min/1.73m2; null when not emitted
      - name: latest_acr_value
        description: Latest urine ACR in mg/mmol; null when not emitted
      - name: latest_systolic_value
        description: Latest systolic BP in mmHg; null when not emitted
      - name: latest_diastolic_value
        description: Latest diastolic BP in mmHg; null when not emitted
      - name: is_in_numerator
        description: Whether the person meets the indicator
      - name: indicator_status
        description: Status token for the indicator
