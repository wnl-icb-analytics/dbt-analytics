        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_TREATED_IN_PERIOD', 'NEVER_TREATED']


  - name: fct_person_ckd_bp_ind264
    description: >-
      Blood pressure control in kidney disease (NICE IND264). One row per person in the
      denominator on the build date.


      People registered on the build date aged 18 or over on the CKD stage 3 to 5 register
      with latest urine ACR at least 70 mg/mmol, without moderate or severe frailty. The
      latest numeric ACR has no lookback limit; value-free tests are ignored. An invalid
      numeric result excludes; no older numeric result is substituted. Achieved when both
      values of the latest complete blood pressure reading in the last 12 months are below
      130/80 mmHg in clinic or 125/75 mmHg at home or on ambulatory monitoring. Incomplete
      readings do not count; invalid latest readings are unassessable, with no older reading
      substituted. No personalised care adjustments are applied. Based on NICE NG203. Code
      lists: CKD_COD, CKD1AND2_COD, CKDRES_COD, NDAALB_COD (PCD); BP_COD, SYSBP_COD,
      DIASBP_COD, HOMEAMBBP_COD, HOMEBP_COD, ABPM_COD (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind264
        indicator:
          id: "IND264"
          type: "MEASURE"
          category: "KIDNEY"
          clinical_domain: "Cardiometabolic"
          name_short: "Kidney BP, ACR 70 or above"
          description_short: "Blood pressure control in kidney disease with ACR at least 70 mg/mmol."
          description_long: >-
            People registered on the build date aged 18 or over on the CKD stage 3 to 5
            register with latest urine ACR at least 70 mg/mmol, without moderate or severe
            frailty. The latest numeric ACR has no lookback limit; value-free tests are
            ignored. An invalid numeric result excludes; no older numeric result is
            substituted. Achieved when both values of the latest complete blood pressure
            reading in the last 12 months are below 130/80 mmHg in clinic or 125/75 mmHg at
            home or on ambulatory monitoring. Incomplete readings do not count; invalid latest
            readings are unassessable, with no older reading substituted. No personalised care
            adjustments are applied. Based on NICE NG203. Code lists: CKD_COD, CKD1AND2_COD,
            CKDRES_COD, NDAALB_COD (PCD); BP_COD, SYSBP_COD, DIASBP_COD, HOMEAMBBP_COD,
            HOMEBP_COD, ABPM_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND264"
    columns:
      - name: person_id
        description: "Person identifier for someone in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "Published NICE indicator identifier."
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: reporting_date
        description: "Build date used to assess the population, age and evidence."
      - name: measurement_period_start
        description: "Inclusive start of the indicator measurement period before the reporting date."
      - name: age
        description: "Completed years on the build date, based on the approximate birth date; null when age is unknown."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: current_practice_name
        description: "Name of the current registration practice."
      - name: latest_frailty_severity
        description: "Latest coded frailty severity by the reporting date; null when none is recorded."
      - name: latest_acr_value
        description: "Latest numeric urine albumin:creatinine ratio (ACR) by the reporting date, in mg/mmol, with no lookback limit. Value-free tests are ignored. Null when no numeric test is recorded or its result is outside 0 to 9999.99."
      - name: latest_bp_date
        description: "Date of the latest complete blood pressure reading by the reporting date; it may be outside the measurement period. Null when none is recorded."
      - name: latest_record_date
        description: "Date of the selected complete blood pressure reading in the 12-month measurement period; null when none is recorded in that period."
      - name: is_valid_bp
        description: "Whether the selected complete reading has systolic 40 to 350 mmHg and diastolic 20 to 200 mmHg, inclusive; null when no complete reading exists."
      - name: latest_systolic_value
        description: "Systolic blood pressure of the selected complete pair, in mmHg; valid range 40 to 350, inclusive. Null when no pair is recorded. An invalid latest pair is unassessable; an older pair is not substituted."
      - name: latest_diastolic_value
        description: "Diastolic blood pressure of the selected complete pair, in mmHg; valid range 20 to 200, inclusive. Null when no pair is recorded. An invalid latest pair is unassessable; an older pair is not substituted."
      - name: applied_measurement_context
        description: "CLINIC for the clinic target or HBPM_ABPM for the home or ambulatory target; null when no complete reading exists."
      - name: indicator_systolic_threshold
        description: "Systolic blood pressure threshold in mmHg; the value must be strictly below this threshold. Null when no complete reading exists."
      - name: indicator_diastolic_threshold
        description: "Diastolic blood pressure threshold in mmHg; the value must be strictly below this threshold. Null when no complete reading exists."
      - name: is_in_denominator
        description: "Always true. Every row belongs to the denominator before personalised care adjustments."
      - name: is_in_numerator
        description: "Whether the person meets the indicator achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the numerator rule is met; otherwise the reason it is not met."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'ABOVE_TARGET', 'NOT_ASSESSABLE', 'NOT_RECORDED_IN_PERIOD']


