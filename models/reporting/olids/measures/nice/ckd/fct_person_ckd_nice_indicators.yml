  - name: fct_person_ckd_sglt2_therapy_ind324
    description: >
      NICE IND324 SGLT2 inhibitors in CKD. One row per currently registered,
      living, non-test person on the CKD register with a latest eGFR of 20 or
      more (or none recorded) who either has type 2 diabetes, or has no type 2
      diabetes and is on ACE inhibitor or ARB therapy in the preceding 6
      months (or contraindicated to both) with a latest eGFR of 20 to 44, or
      of 45 to 59 with a latest urine ACR of 22.6 mg/mmol or more, assessed on
      the build date. The numerator requires an SGLT2 inhibitor order in the preceding 6 calendar months. NICE also asks that the renin-angiotensin treatment precede the last SGLT2 prescription; that ordering is not applied. An unknown diabetes type follows the non-type-2 branch. Personalised care adjustments are not
      applied. Secondary-use consumers must join
      DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-Out and Type
      1 opt-out filtering.
