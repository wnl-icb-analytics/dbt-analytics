models:
- name: fct_person_alcohol_ind202_by_month
  description: >-
    Alcohol brief intervention in a listed long-term condition (NICE IND202). One row per
    person in the denominator at each month-end.


    People registered at the month-end with coronary heart disease, atrial fibrillation,
    heart failure, stroke or transient ischaemic attack, diabetes or dementia, and a
    positive screen 3 to 24 months before the month-end. Positive means FAST at least 3 or
    AUDIT-C at least 5; full AUDIT alone does not qualify. Achieved with brief
    intervention within 3 calendar months after any qualifying screen. A later unmatched
    screen does not cancel achievement. Excludes any recorded alcohol-related disorder,
    regardless of age at that record. No personalised care adjustments are applied. Based
    on NICE NG238. Recalculated for each of the last 60 month-ends with current rules,
    code lists and records, so later corrections can change past months. Code lists:
    FAST_COD, AUDITC_COD (PCD); ALCOHOLINT_COD, ALCOHOL_MISUSE_DISORDERS; CHD_COD,
    AFIB_COD, AFIBRES_COD, HF_COD, HFRES_COD, STRK_COD, TIA_COD, DM_COD, DMTYPE1_COD,
    DMTYPE2_COD, DMRES_COD, DEM_COD (PCD).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind202
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Month-end used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Start of the indicator diagnosis or screening period. Shifted diagnosis periods exclude diagnoses on this date; other periods include it. Achievement windows are given in the model description."
  - name: age
    description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: practice_code
    description: "ODS code of the registration practice attributed at the reporting month-end."
  - name: practice_name
    description: "Name of the registration practice attributed at the reporting month-end."
  - name: latest_alcohol_screen_date
    description: "Date of the latest FAST, AUDIT-C or AUDIT screen through the reporting date; null when none is recorded."
  - name: latest_alcohol_screen_tool
    description: "FAST, AUDIT-C or AUDIT for the latest alcohol screen."
  - name: latest_alcohol_screen_score
    description: "Numeric score of the latest alcohol screen; null when unscored."
  - name: latest_positive_alcohol_screen_date
    description: "Date of the latest FAST score of at least 3 or AUDIT-C score of at least 5 through the reporting date; null when none is recorded."
  - name: latest_intervention_after_positive_screen_date
    description: "Latest brief intervention within 3 months after the latest positive alcohol screen and through the reporting date; null when absent. Earlier screen and intervention pairs can still achieve the indicator."
  - name: latest_record_date
    description: "Latest screen or brief intervention that meets the indicator rule; null when no qualifying evidence is recorded."
  - name: is_in_denominator
    description: "Always true; each row is eligible before personalised care adjustments."
  - name: is_in_numerator
    description: "Whether the person meets the achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
