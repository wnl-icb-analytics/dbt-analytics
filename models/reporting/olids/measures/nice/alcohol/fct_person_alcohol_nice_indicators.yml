  - name: fct_person_alcohol_ind200
    description: |
      NICE IND200 alcohol intervention in severe mental illness. One row per currently
      registered, living, non-test person with schizophrenia, bipolar affective disorder
      or another psychosis on the SMI register. A FAST score of at least 3 or an AUDIT-C
      score of at least 5 must be recorded in the preceding 12 months.

      Achieved when brief intervention is recorded from the date of any qualifying
      positive screen up to three calendar months later. Full AUDIT alone does not
      qualify.

      Interpretation: NICE does not specify the earliest or latest positive screen. Any
      qualifying screen and intervention pair counts; a later unmatched screen does not
      cancel achievement.

      Excludes people with a recorded alcohol-related disease or disorder. Lithium therapy
      without an SMI diagnosis does not qualify. Diagnosed people in remission remain
      eligible, preserving the existing SMI register scope; NICE does not specify a
      remission exclusion for IND200.

      Assessed on the build date. Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind200
        indicator:
          id: "IND200"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "SMI alcohol intervention"
          description_short: "Brief intervention within 3 months of a positive alcohol screen for people with severe mental illness"
          description_long: |
            NICE IND200 alcohol intervention in severe mental illness. One row per
            currently registered, living, non-test person with schizophrenia, bipolar
            affective disorder or another psychosis on the SMI register. A FAST score of
            at least 3 or an AUDIT-C score of at least 5 must be recorded in the preceding
            12 months.

            Achieved when brief intervention is recorded from the date of any qualifying
            positive screen up to three calendar months later. Full AUDIT alone does not
            qualify.

            Interpretation: NICE does not specify the earliest or latest positive screen.
            Any qualifying screen and intervention pair counts; a later unmatched screen
            does not cancel achievement.

            Excludes people with a recorded alcohol-related disease or disorder. Lithium
            therapy without an SMI diagnosis does not qualify. Diagnosed people in
            remission remain eligible, preserving the existing SMI register scope; NICE
            does not specify a remission exclusion for IND200.

            Assessed on the build date. Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND200"
    columns: *alcohol_columns

