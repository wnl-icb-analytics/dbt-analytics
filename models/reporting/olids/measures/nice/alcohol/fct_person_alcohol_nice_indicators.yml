  - name: fct_person_alcohol_nice_indicators
    description: >-
      Alcohol screening and brief intervention results. One row per person and indicator
      in the denominator on the build date.


      Includes NICE IND196, NICE IND197, NICE IND198, NICE IND199, NICE IND200, NICE
      IND201, NICE IND202. Each indicator has its own denominator, measurement window
      and exclusions. Supporting evidence accompanies the achievement status. No
      personalised care adjustments are applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - accepted_values:
              arguments:
                values: ['IND196', 'IND197', 'IND198', 'IND199', 'IND200', 'IND201', 'IND202']
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACHIEVED', 'NOT_RECORDED_IN_PERIOD']
      - name: new_diagnosis_date
        description: "First qualifying hypertension, depression or anxiety diagnosis date; null for indicators without a new-diagnosis population."
      - name: latest_alcohol_screen_date
        description: "Date of the latest FAST, AUDIT-C or AUDIT screen through the reporting date; null when none is recorded."
      - name: latest_positive_alcohol_screen_date
        description: "Date of the latest FAST score of at least 3 or AUDIT-C score of at least 5 through the reporting date; null when none is recorded."
      - name: latest_intervention_after_positive_screen_date
        description: "Latest brief intervention within 3 months after the latest positive alcohol screen and through the reporting date; null when absent. Earlier screen and intervention pairs can still achieve the indicator."
      - name: latest_record_date
        description: "Latest screen or brief intervention that meets the indicator rule; null when no qualifying evidence is recorded."

  - name: fct_person_alcohol_nice_indicators_snapshot_input
    description: >-
      Alcohol screening and brief intervention results used to track changes. One row per person
      and indicator in the denominator on the build date.


      Records eligibility, achievement and supporting evidence before personalised care
      adjustments. Reporting-date fields are omitted so a date change alone does not create a
      new history version.
      Labels join from def_indicator or the measure tables by indicator_id.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - indicator_id
    columns:
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
      - name: indicator_id
        description: "NICE indicator identifier."
        data_tests:
          - not_null
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: latest_alcohol_screen_date
        description: "Date of the latest FAST, AUDIT-C or AUDIT screen through the build date; null when none is recorded."
      - name: latest_positive_alcohol_screen_date
        description: "Date of the latest FAST score of at least 3 or AUDIT-C score of at least 5 through the build date; null when none is recorded."
      - name: latest_intervention_after_positive_screen_date
