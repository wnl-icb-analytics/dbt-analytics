      build date. No numeric score is needed; full AUDIT alone does not count. Excludes
      any recorded alcohol-related disorder, regardless of age at that record. No
      personalised care adjustments are applied. Based on NICE NG238. Code lists:
      FAST_COD, AUDITC_COD (PCD); ALCOHOLINT_COD, ALCOHOL_MISUSE_DISORDERS; CHD_COD,
      AFIB_COD, AFIBRES_COD, HF_COD, HFRES_COD, STRK_COD, TIA_COD, DM_COD, DMTYPE1_COD,
      DMTYPE2_COD, DMRES_COD, DEM_COD (PCD).
