          clinical_domain: "Lifestyle"
          name_short: "Hypertension alcohol intervention"
          description_short: "Brief alcohol intervention for people with hypertension"
          description_long: >-
            People registered on the build date first diagnosed with hypertension in the last
            12 months, with a positive alcohol screen at least 3 months before the build date,
            so follow-up has finished. Positive means FAST at least 3 or AUDIT-C at least 5;
            full AUDIT alone does not qualify. Achieved with brief intervention on the day of
            or within 3 calendar months after any positive screen. Excludes alcohol-related
            disorders recorded at any age. No personalised care adjustments are applied. Based
