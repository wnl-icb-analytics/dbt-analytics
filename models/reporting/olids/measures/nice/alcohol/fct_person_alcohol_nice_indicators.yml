      calendar months after any positive screen. Excludes alcohol-related disorders recorded
      at any age. No personalised care adjustments are applied. Based on NICE NG136. Code
      lists: FAST_COD, AUDITC_COD (PCD); ALCOHOLINT_COD, ALCOHOL_MISUSE_DISORDERS; HYP_COD,
      HYPRES_COD (PCD).
