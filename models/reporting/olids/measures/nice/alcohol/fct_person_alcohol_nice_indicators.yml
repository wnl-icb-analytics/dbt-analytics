      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind201
        indicator:
          id: "IND201"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "Long-term condition alcohol screen"
          description_short: "Alcohol screening in the last 2 years for people with a listed long-term condition"
          description_long: >-
            People registered on the build date with coronary heart disease,
            atrial fibrillation, heart failure, stroke or transient ischaemic
            attack, diabetes or dementia. Achieved with FAST or AUDIT-C screening
