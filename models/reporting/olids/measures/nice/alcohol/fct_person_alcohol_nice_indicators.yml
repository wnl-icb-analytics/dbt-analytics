          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "Depression or anxiety alcohol screen"
          description_short: "Alcohol screening around a new depression or anxiety diagnosis"
          description_long: >-
            People registered on the build date aged 10 or over with unresolved depression or
            anxiety first diagnosed 3 to 15 months before the build date, so the three-month
            follow-up has finished. This replaces NICE's preceding 12-month diagnosis period.
            Achieved with FAST or AUDIT-C screening within 3 calendar months before or after
