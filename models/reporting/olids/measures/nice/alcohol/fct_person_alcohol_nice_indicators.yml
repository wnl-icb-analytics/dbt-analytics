models:
  - name: fct_person_alcohol_ind196
    description: |
      NICE IND196 alcohol screening at hypertension diagnosis. One row per currently
      registered, living, non-test person first diagnosed with hypertension in the
      preceding 12 months, assessed on the build date.

      Achieved when FAST or AUDIT-C screening is recorded within three calendar months
      before or after diagnosis. A recorded assessment counts without a numeric score.
      Full AUDIT alone does not count.

      Excludes people with a recorded alcohol-related disease or disorder.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind196
        indicator:
          id: "IND196"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "New hypertension alcohol screen"
          description_short: "Alcohol screening within 3 months of a new hypertension diagnosis"
          description_long: |
            NICE IND196 alcohol screening at hypertension diagnosis. One row per currently
            registered, living, non-test person first diagnosed with hypertension in the
            preceding 12 months, assessed on the build date.

            Achieved when FAST or AUDIT-C screening is recorded within three calendar
            months before or after diagnosis. A recorded assessment counts without a
            numeric score. Full AUDIT alone does not count.

            Excludes people with a recorded alcohol-related disease or disorder.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND196"
    columns: &alcohol_columns
      - name: person_id
        description: Person in the indicator denominator
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: NICE indicator identifier
      - name: indicator_name
        description: Published NICE indicator name
      - name: reporting_date
        description: Build date used for eligibility and the measurement period
      - name: measurement_period_start
        description: Inclusive start of the measurement period before the reporting date
      - name: age
        description: Age in years on the reporting date; null when no birth date is recorded
      - name: condition_name
        description: Population defining the indicator
      - name: current_practice_code
        description: ODS code of the current registration practice
      - name: current_practice_name
        description: Name of the current registration practice
      - name: new_diagnosis_date
        description: Earliest qualifying new diagnosis date for the new-diagnosis indicators; null for others
      - name: latest_alcohol_screen_date
        description: Date of the latest FAST, AUDIT-C or AUDIT screen; null if none
      - name: latest_alcohol_screen_tool
        description: Tool used for the latest screen
      - name: latest_alcohol_screen_score
        description: Score of the latest screen; null when unscored
      - name: latest_positive_alcohol_screen_date
        description: Date of the latest FAST score of at least 3 or AUDIT-C score of at least 5; null if none
      - name: latest_intervention_after_positive_screen_date
        description: Date of the latest brief intervention within 3 months after the latest positive screen; null if none
      - name: latest_record_date
        description: Date of the latest qualifying record in the period; null when none
      - name: is_in_denominator
        description: Always true; every row is an eligible person before personalised care adjustments
      - name: is_in_numerator
        description: Whether the person meets the indicator on the reporting date
      - name: indicator_status
        description: ACHIEVED or NOT_RECORDED_IN_PERIOD

  - name: fct_person_alcohol_ind197
    description: |
      NICE IND197 alcohol intervention after hypertension diagnosis. One row per currently
      registered, living, non-test person first diagnosed with hypertension in the
      preceding 12 months who has a FAST score of at least 3 or an AUDIT-C score of at
      least 5, assessed on the build date.

      Achieved when brief intervention is recorded from the date of any qualifying
      positive screen up to three calendar months later. NICE sets no separate expiry for
      the positive screen.

      Interpretation: NICE does not specify the earliest or latest positive screen. Any
      qualifying screen and intervention pair counts; a later unmatched screen does not
      cancel achievement.

      Excludes people with a recorded alcohol-related disease or disorder.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind197
        indicator:
          id: "IND197"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "New hypertension alcohol intervention"
          description_short: "Brief intervention within 3 months of a positive alcohol screen for people newly diagnosed with hypertension"
          description_long: |
            NICE IND197 alcohol intervention after hypertension diagnosis. One row per
            currently registered, living, non-test person first diagnosed with
            hypertension in the preceding 12 months who has a FAST score of at least 3 or
            an AUDIT-C score of at least 5, assessed on the build date.

            Achieved when brief intervention is recorded from the date of any qualifying
            positive screen up to three calendar months later. NICE sets no separate
            expiry for the positive screen.

            Interpretation: NICE does not specify the earliest or latest positive screen.
            Any qualifying screen and intervention pair counts; a later unmatched screen
            does not cancel achievement.

            Excludes people with a recorded alcohol-related disease or disorder.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND197"
    columns: *alcohol_columns

  - name: fct_person_alcohol_ind198
    description: |
      NICE IND198 alcohol screening at depression or anxiety diagnosis. One row per
      currently registered, living, non-test person aged 10 or older first diagnosed with
      depression or anxiety in the preceding 12 months, assessed on the build date.

      Achieved when FAST or AUDIT-C screening is recorded within three calendar months
      before or after diagnosis. A recorded assessment counts without a numeric score.
      Full AUDIT alone does not count.

      Excludes people with a recorded alcohol-related disease or disorder. Eligibility
      follows the existing unresolved-diagnosis definitions. Depression includes ages 10
      to 17 as NICE specifies.

      Personalised care adjustments are not applied.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind198
        indicator:
          id: "IND198"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "New depression or anxiety alcohol screen"
          description_short: "Alcohol screening within 3 months of a new depression or anxiety diagnosis"
          description_long: |
            NICE IND198 alcohol screening at depression or anxiety diagnosis. One row per
            currently registered, living, non-test person aged 10 or older first diagnosed
            with depression or anxiety in the preceding 12 months, assessed on the build
            date.

            Achieved when FAST or AUDIT-C screening is recorded within three calendar
            months before or after diagnosis. A recorded assessment counts without a
            numeric score. Full AUDIT alone does not count.

            Excludes people with a recorded alcohol-related disease or disorder.
            Eligibility follows the existing unresolved-diagnosis definitions.
            Depression includes ages 10 to 17 as NICE specifies.

            Personalised care adjustments are not applied.
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND198"
    columns: *alcohol_columns

