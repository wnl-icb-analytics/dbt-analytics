models:
  - name: fct_person_alcohol_ind196
    description: >-
      Alcohol screening after hypertension diagnosis (NICE IND196). One row per person in the
      denominator on the build date.


      People registered on the build date with hypertension first diagnosed 3 to 15 months
      before the build date, so the three-month follow-up has finished. This replaces NICE's
      preceding 12-month diagnosis period. Achieved with FAST or AUDIT-C screening within 3
      calendar months before or after diagnosis. No numeric score is needed; full AUDIT alone
      does not count. Excludes any recorded alcohol-related disorder, regardless of age at
      that record. No personalised care adjustments are applied. Based on NICE NG136. Code
      lists: FAST_COD, AUDITC_COD (PCD); ALCOHOLINT_COD, ALCOHOL_MISUSE_DISORDERS; HYP_COD,
      HYPRES_COD (PCD).
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.nice.org.uk/indicators/ind196
        indicator:
          id: "IND196"
          type: "MEASURE"
          category: "LIFESTYLE"
          clinical_domain: "Lifestyle"
          name_short: "Hypertension alcohol screen"
          description_short: "Alcohol screening around a new hypertension diagnosis"
          description_long: >-
            People registered on the build date with hypertension first diagnosed 3 to 15
            months before the build date, so the three-month follow-up has finished. This
            replaces NICE's preceding 12-month diagnosis period. Achieved with FAST or AUDIT-C
            screening within 3 calendar months before or after diagnosis. No numeric score is
            needed; full AUDIT alone does not count. Excludes any recorded alcohol-related
            disorder, regardless of age at that record. No personalised care adjustments are
            applied. Based on NICE NG136. Code lists: FAST_COD, AUDITC_COD (PCD);
            ALCOHOLINT_COD, ALCOHOL_MISUSE_DISORDERS; HYP_COD, HYPRES_COD (PCD).
          is_qof: false
          source_column: "is_in_numerator"
          usage_contexts:
            - "NICE_GUIDANCE"
          sort_order: "NICE_IND196"
    columns: &completed_follow_up_columns
      - name: person_id
        description: "Identifier of the person in the indicator denominator."
        data_tests:
          - not_null
          - unique
      - name: indicator_id
        description: "NICE indicator identifier."
      - name: indicator_name
        description: "Published NICE indicator title."
      - name: indicator_description
        description: "NICE's published statement of the indicator."
      - name: reporting_date
        description: "Build date used to assess eligibility and achievement."
      - name: measurement_period_start
        description: "Start of the indicator diagnosis or screening period. Shifted diagnosis periods exclude diagnoses on this date; other periods include it. Achievement windows are given in the model description."
      - name: age
        description: "Age in completed years on the reporting date, calculated from the approximate birth date; null when unknown."
      - name: denominator_description
        description: "Short description of the people in the denominator."
      - name: current_practice_code
        description: "ODS code of the current registration practice."
      - name: current_practice_name
        description: "Name of the current registration practice."
      - name: new_diagnosis_date
        description: "First qualifying hypertension, depression or anxiety diagnosis date; null for indicators without a new-diagnosis population."
      - name: latest_alcohol_screen_date
        description: "Date of the latest FAST, AUDIT-C or AUDIT screen through the reporting date; null when none is recorded."
      - name: latest_alcohol_screen_tool
        description: "FAST, AUDIT-C or AUDIT for the latest alcohol screen; null when no screen is recorded."
      - name: latest_alcohol_screen_score
        description: "Numeric score of the latest alcohol screen; null when missing or outside the tool's valid range."
      - name: latest_positive_alcohol_screen_date
        description: "Date of the latest FAST score of at least 3 or AUDIT-C score of at least 5 through the reporting date; null when none is recorded."
      - name: latest_intervention_after_positive_screen_date
        description: "Latest brief intervention within 3 months after the latest positive alcohol screen and through the reporting date; null when absent. Earlier screen and intervention pairs can still achieve the indicator."
      - name: latest_record_date
        description: "Latest screen or brief intervention that meets the indicator rule; null when no qualifying evidence is recorded."
      - name: is_in_denominator
        description: "Always true; each row is eligible before personalised care adjustments."
      - name: is_in_numerator
        description: "Whether the person meets the achievement rule on the reporting date."
      - name: indicator_status
        description: "ACHIEVED when the indicator is met; otherwise the recorded reason it is not met."

  - name: fct_person_alcohol_ind197
    description: >-
      Alcohol brief intervention in hypertension (NICE IND197). One row per person in the
      denominator on the build date.


