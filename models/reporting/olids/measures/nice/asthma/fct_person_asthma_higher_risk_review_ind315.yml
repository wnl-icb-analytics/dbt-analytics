models:
- name: fct_person_asthma_higher_risk_review_ind315
  description: >-
    Annual review for people with higher-risk asthma (NICE IND315). One row per person in
    the denominator on the build date.


    People registered on the build date aged 6 or over with unresolved asthma and higher
    risk 12 to 24 months before the build date: at least six short-acting reliever
    inhalers, at least two distinct prednisolone prescription dates or a GP-recorded
    asthma admission. Hospital admissions and emergency visits without GP records do not
    count. Achieved with a review and written action plan on the same day in the last 12
    months, plus an exacerbation count in the month before review. Separate asthma
    control, inhaler technique and recent treatment are not required. No personalised care
    adjustments are applied. Based on NICE NG245. Code lists: AST_COD, ASTRES_COD (PCD);
    REV_COD, WRITPASTP_COD, ASTEXACB_COD, ASTADMSN_COD (PCD);
    OPENSAFELY/SABA_INHALER_MEDICATIONS (OpenCodelists); 0603020T0 (BNF).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind315
      indicator:
        id: IND315
        type: MEASURE
        category: ASTHMA
        clinical_domain: Respiratory
        name_short: "Higher-risk asthma annual review"
        description_short: "Annual review for people with higher-risk asthma."
        description_long: >-
          People registered on the build date aged 6 or over with unresolved asthma
          and higher risk 12 to 24 months before the build date: at least six
          short-acting reliever inhalers, at least two distinct prednisolone
          prescription dates or a GP-recorded asthma admission. Hospital admissions
          and emergency visits without GP records do not count. Achieved with a
          review and written action plan on the same day in the last 12 months, plus
          an exacerbation count in the month before review. Separate asthma control,
          inhaler technique and recent treatment are not required. No personalised
          care adjustments are applied. Based on NICE NG245. Code lists: AST_COD,
          ASTRES_COD (PCD); REV_COD, WRITPASTP_COD, ASTEXACB_COD, ASTADMSN_COD
          (PCD); OPENSAFELY/SABA_INHALER_MEDICATIONS (OpenCodelists); 0603020T0
          (BNF).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND315
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "NICE published indicator title."
  - name: reporting_date
    description: "Build date used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Start of the indicator cohort or evidence period; boundary inclusion follows the documented indicator rule."
  - name: age
    description: "Age in completed years on the reporting date; null when the birth date is missing."
  - name: condition_name
    description: "Short label for the denominator population."
  - name: is_in_denominator
    description: "Always true; each row meets the documented eligibility and exclusion rules."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  - name: latest_record_date
    description: "Date of the latest qualifying evidence in the indicator window; null when none."
  - name: current_practice_code
    description: "ODS code of the registration practice on the build date."
  - name: current_practice_name
    description: "Name of the registration practice on the build date."
  - name: risk_period_start
    description: "Exclusive start of the risk period, 24 months before the reporting date."
  - name: risk_period_end
    description: "Inclusive end of the risk period, 12 months before the reporting date."
  - name: saba_inhaler_count
    description: "Short-acting reliever inhalers in the risk period. Prescription quantities are divided by 60 for Accuhaler, 100 for Turbohaler and 200 otherwise, rounded to whole inhalers with at least one per matching prescription."
  - name: oral_steroid_course_count
    description: "Distinct prednisolone prescription dates in the risk period, used to estimate oral steroid courses."
  - name: latest_asthma_admission_date
    description: "Latest GP-recorded asthma admission in the risk period; null when none."
  - name: has_high_saba_use
    description: "Whether at least six short-acting reliever inhalers were prescribed in the risk period."
  - name: has_repeated_oral_steroids
    description: "Whether prednisolone was prescribed on at least two distinct dates in the risk period."
  - name: has_asthma_admission
    description: "Whether a GP-recorded asthma admission occurred in the risk period."
  - name: latest_review_date
    description: "Latest asthma review on or before the reporting date, including incomplete reviews and reviews outside the achievement window; null when none."
