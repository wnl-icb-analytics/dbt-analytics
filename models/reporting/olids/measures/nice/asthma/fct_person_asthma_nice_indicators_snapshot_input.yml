models:
- name: fct_person_asthma_nice_indicators_snapshot_input
  description: >-
    NICE asthma results. One row per person and indicator.


    Includes IND189, IND272, IND315, IND316, with the eligibility, exclusions and achievement
    rules documented for each indicator. Records achievement and evidence used to track changes
    in clinical results.
    Labels join from def_indicator or the measure tables by indicator_id.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule on the build date."
  - name: indicator_status
    description: "ACHIEVED when the achievement rule is met; otherwise NOT_TREATED_IN_PERIOD for IND316 or NOT_RECORDED_IN_PERIOD."
  - name: latest_record_date
    description: "Date of the latest qualifying evidence in the indicator window; null when none."
  - name: current_practice_code
    description: "ODS code of the registration practice on the build date."
  - name: saba_inhaler_count
    description: "Short-acting reliever inhalers in the risk period. Prescription quantities are divided by 60 for Accuhaler, 100 for Turbohaler and 200 otherwise, rounded to whole inhalers with at least one per matching prescription."
  - name: oral_steroid_course_count
    description: "Distinct prednisolone prescription dates in the risk period, used to estimate oral steroid courses."
  - name: latest_asthma_admission_date
    description: "Latest GP-recorded asthma admission in the risk period; null when none."
  - name: has_high_saba_use
    description: "Whether at least six short-acting reliever inhalers were prescribed in the risk period."
  - name: has_repeated_oral_steroids
    description: "Whether prednisolone was prescribed on at least two distinct dates in the risk period."
  - name: has_asthma_admission
    description: "Whether a GP-recorded asthma admission occurred in the risk period."
  - name: latest_review_date
    description: "Latest asthma review on or before the build date, including incomplete reviews and reviews outside the achievement window; null when none."
  - name: diagnosis_date
    description: "Earliest asthma diagnosis after the latest known resolution, using calendar dates."
  - name: feno_date
    description: "Latest exhaled nitric oxide test in the diagnosis test window; null when none."
  - name: reversibility_date
    description: "Latest bronchodilator reversibility test in the diagnosis test window; null when none."
  - name: pefr_variability_date
    description: "Latest peak-flow variability record in the diagnosis test window; counts regardless of spirometry availability. Null when none."
  - name: bronchial_challenge_date
    description: "Latest bronchial challenge test in the diagnosis test window; null when none."
  - name: skin_prick_date
    description: "Latest skin-prick test in the diagnosis test window; contributes to achievement at ages 5 to 16. Null when none."
  - name: ige_date
    description: "Latest immunoglobulin E test in the diagnosis test window; contributes at ages 5 to 16 only with an eosinophil count or full blood count. Null when none."
  - name: eosinophil_or_fbc_date
    description: "Latest eosinophil count or full blood count in the diagnosis test window; null when none."
  - name: latest_therapy_order_date
    description: "Latest maintenance and reliever therapy inhaler prescription in the 12-month achievement window; null when none."
  - name: latest_mart_date
    description: "Latest recorded maintenance and reliever therapy regimen on or before the build date, with no expiry; null when none."
