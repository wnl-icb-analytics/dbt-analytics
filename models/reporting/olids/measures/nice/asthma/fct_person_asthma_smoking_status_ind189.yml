models:
- name: fct_person_asthma_smoking_status_ind189
  description: >-
    Smoking status recorded for young people with asthma (NICE IND189). One row per person
    in the denominator on the build date.


    People registered on the build date aged 5 to 19 with unresolved asthma. Achieved with
    active or passive smoking status recorded in the 12 months before the build date.
    Positive and negative passive exposure records count; advice and family smoking alone
    do not. Recent asthma treatment is not required. No personalised care adjustments are
    applied. Based on NICE NG245. Code lists: AST_COD, ASTRES_COD (PCD); SMOK_COD (PCD);
    SMOKE_EXPOSURE_COD (ECL cache).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind189
      indicator:
        id: IND189
        type: MEASURE
        category: ASTHMA
        clinical_domain: Respiratory
        name_short: "Asthma smoking status, ages 5 to 19"
        description_short: "Smoking status recorded for young people with asthma."
        description_long: >-
          People registered on the build date aged 5 to 19 with unresolved asthma.
          Achieved with active or passive smoking status recorded in the 12 months
          before the build date. Positive and negative passive exposure records
          count; advice and family smoking alone do not. Recent asthma treatment is
          not required. No personalised care adjustments are applied. Based on NICE
          NG245. Code lists: AST_COD, ASTRES_COD (PCD); SMOK_COD (PCD);
          SMOKE_EXPOSURE_COD (ECL cache).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND189
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "NICE published indicator title."
  - name: reporting_date
    description: "Build date used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Start of the indicator cohort or evidence period; boundary inclusion follows the documented indicator rule."
  - name: age
    description: "Age in completed years on the reporting date; null when the birth date is missing."
  - name: condition_name
    description: "Short label for the denominator population."
  - name: is_in_denominator
    description: "Always true; each row meets the documented eligibility and exclusion rules."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the achievement rule is met; otherwise NOT_TREATED_IN_PERIOD for IND316 or NOT_RECORDED_IN_PERIOD."
  - name: latest_record_date
    description: "Date of the latest qualifying evidence in the indicator window; null when none."
  - name: current_practice_code
    description: "ODS code of the registration practice on the build date."
  - name: current_practice_name
    description: "Name of the registration practice on the build date."
