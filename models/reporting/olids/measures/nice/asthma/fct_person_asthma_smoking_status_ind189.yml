models:
- name: fct_person_asthma_smoking_status_ind189
  description: Smoking recording in asthma (NICE IND189). One row per active, living, non-test person
    aged 5 to 19 inclusive with an unresolved IND186 asthma diagnosis. SMOK_COD or SMOKE_EXPOSURE_COD
    recording in (R minus 12 months, R] qualifies, without the age-at-event restriction of the adult smoking-state
    model. SMOKE_EXPOSURE_COD includes positive and negative second-hand tobacco exposure status, excluding
    advice, history and risk alone. No recent-treatment requirement or personalised care adjustments.
    R is the build date.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind189
      indicator:
        id: IND189
        type: MEASURE
        category: ASTHMA
        clinical_domain: Respiratory
        name_short: Asthma smoking recording
        description_short: Smoking status recorded in 12 months for people with asthma aged 5 to 19.
        description_long: Smoking recording in asthma (NICE IND189). One row per active, living, non-test
          person aged 5 to 19 inclusive with an unresolved IND186 asthma diagnosis. SMOK_COD or SMOKE_EXPOSURE_COD
          recording in (R minus 12 months, R] qualifies, without the age-at-event restriction of the adult
          smoking-state model. SMOKE_EXPOSURE_COD includes positive and negative second-hand tobacco exposure
          status, excluding advice, history and risk alone. No recent-treatment requirement or personalised
          care adjustments. R is the build date.
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND189
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: person_id
    description: Person in the denominator.
  - name: indicator_id
    description: NICE indicator identifier.
  - name: indicator_name
    description: Published indicator name.
  - name: reporting_date
    description: Date at which eligibility and evidence are assessed.
  - name: measurement_period_start
    description: Start of the cohort or evidence period; see the model description for boundary inclusion.
  - name: age
    description: Completed years at reporting_date.
  - name: condition_name
    description: Population defining the indicator.
  - name: is_in_denominator
    description: Always true. Personalised care adjustments are not applied.
  - name: is_in_numerator
    description: Whether the person meets the numerator rule.
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD.
  - name: latest_record_date
    description: Latest qualifying evidence date; null when the numerator is not met.
  - name: current_practice_code
    description: ODS registration practice at reporting_date.
  - name: current_practice_name
    description: Registration practice name at reporting_date.
