models:
- name: fct_person_asthma_nice_indicators_by_month
  description: NICE asthma outcomes IND315, IND272 and IND189. One row per eligible person, indicator
    and reporting date; populations and evidence windows differ by indicator. Detail columns not used
    by an indicator are null.  Recalculated at monthly refresh for the last 60 completed month-ends with
    current rules and code lists. Monthly spine registration start is inclusive; registration end and
    death dates are exclusive. Approximate birth/death dates, overlap priority and current test/gender
    flags constrain history. Diagnosis and resolution use clinical and recorded known dates; other evidence
    uses clinical/order dates through R. Later corrections can change earlier results. Includes IND316
    MART-capable prescribing plus recorded MART regimen for higher-risk asthma aged 12+.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
        - reporting_date
  columns:
  - name: person_id
    description: Person in the denominator.
  - name: indicator_id
    description: NICE indicator identifier.
  - name: indicator_name
    description: Published indicator name.
  - name: reporting_date
    description: Date at which eligibility and evidence are assessed.
  - name: measurement_period_start
    description: Start of the cohort or evidence period; see the model description for boundary inclusion.
  - name: age
    description: Completed years at reporting_date.
  - name: condition_name
    description: Population defining the indicator.
  - name: is_in_denominator
    description: Always true. Personalised care adjustments are not applied.
  - name: is_in_numerator
    description: Whether the person meets the numerator rule.
  - name: indicator_status
    description: ACHIEVED, NOT_RECORDED_IN_PERIOD (no qualifying review, test or smoking record) or NOT_TREATED_IN_PERIOD (IND316: no MART prescription with a MART regimen code).
  - name: latest_record_date
    description: Latest qualifying evidence date; null when the numerator is not met.
  - name: practice_code
    description: ODS registration practice.
  - name: practice_name
    description: Registration practice name.
  - name: risk_period_start
    description: Exclusive start of the prior-year risk window.
  - name: risk_period_end
    description: Inclusive end of the prior-year risk window.
  - name: saba_inhaler_count
    description: Inhaler devices in the risk window. Doses divided by 60 for Accuhaler, 100 for Turbohaler,
      otherwise 200, rounded to whole devices with a minimum of one per matched order.
  - name: oral_steroid_course_count
    description: Distinct prednisolone order days in the risk window, used as a proxy for oral steroid
      courses.
  - name: latest_asthma_admission_date
    description: Latest GP-coded ASTADMSN_COD admission in the risk window; null when none.
  - name: has_high_saba_use
    description: At least six SABA inhalers in the risk window.
  - name: has_repeated_oral_steroids
    description: At least two distinct prednisolone order days in the risk window.
  - name: has_asthma_admission
    description: A GP-coded asthma admission in the risk window.
  - name: latest_review_date
    description: Latest review through reporting_date, including incomplete or stale reviews; null when
      never recorded.
  - name: diagnosis_date
    description: Earliest known asthma diagnosis after the latest known resolution, using calendar dates.
  - name: feno_date
    description: Latest FENO_COD record in the diagnosis test window; null when absent.
  - name: reversibility_date
    description: Latest ASTSPIR_COD bronchodilator reversibility record in the test window; null when
      absent.
  - name: pefr_variability_date
    description: Latest PEFRVAR_COD record in the test window; no spirometry-unavailability condition.
      Null when absent.
  - name: bronchial_challenge_date
    description: Latest BRONCCHALENG_COD record in the test window; null when absent.
  - name: skin_prick_date
    description: Latest SKINTEST_COD record in the test window; null when absent.
  - name: ige_date
    description: Latest IGE_COD record in the test window; null when absent.
  - name: eosinophil_or_fbc_date
    description: Latest EOS_COUNT or FBC_COD record in the test window; null when absent.
  - name: latest_therapy_order_date
    description: Latest MART-capable inhaler order in twelve months; null when none.
  - name: latest_mart_date
    description: Latest recorded MART regimen through R, without an expiry window.
