models:
- name: fct_person_asthma_objective_tests_ind272
  description: >-
    Objective tests around a new asthma diagnosis (NICE IND272). One row per person in
    the denominator on the build date.


    People registered on the build date aged 5 or over with unresolved asthma first
    diagnosed 3 to 15 months before the build date, using the first diagnosis after any
    resolution. All have had 3 months to complete testing. Achieved with a qualifying
    test within 3 calendar months before or after diagnosis: exhaled nitric oxide,
    bronchodilator reversibility, peak-flow variability or bronchial challenge. At ages
    17 or over, either an eosinophil count or full blood count also counts. At ages 5 to
    16, skin-prick testing alone, or immunoglobulin E with either blood test, also
    counts. Ages are assessed on the build date. Numeric results, diagnostic thresholds
    and recent treatment are not required. Peak-flow variability counts despite
    available spirometry. No personalised care adjustments are applied. Based on NICE
    NG245. Code lists: AST_COD, ASTRES_COD (PCD); FENO_COD, ASTSPIR_COD, PEFRVAR_COD,
    BRONCCHALENG_COD, SKINTEST_COD, IGE_COD, EOS_COUNT, FBC_COD (ECL cache).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind272
      indicator:
        id: IND272
        type: MEASURE
        category: ASTHMA
        clinical_domain: Respiratory
        name_short: "Asthma objective tests"
        description_short: "Objective tests around a new asthma diagnosis."
        description_long: >-
          People registered on the build date aged 5 or over with unresolved asthma
          first diagnosed 3 to 15 months before the build date, using the first
          diagnosis after any resolution. All have had 3 months to complete testing.
          Achieved with a qualifying test within 3 calendar months before or after
          diagnosis: exhaled nitric oxide, bronchodilator reversibility, peak-flow
          variability or bronchial challenge. At ages 17 or over, either an eosinophil
          count or full blood count also counts. At ages 5 to 16, skin-prick testing
          alone, or immunoglobulin E with either blood test, also counts. Ages are
          assessed on the build date. Numeric results, diagnostic thresholds and recent
          treatment are not required. Peak-flow variability counts despite available
          spirometry. No personalised care adjustments are applied. Based on NICE NG245.
          Code lists: AST_COD, ASTRES_COD (PCD); FENO_COD, ASTSPIR_COD, PEFRVAR_COD,
          BRONCCHALENG_COD, SKINTEST_COD, IGE_COD, EOS_COUNT, FBC_COD (ECL cache).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND272
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: person_id
    description: "Identifier of the person in the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "NICE published indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: reporting_date
    description: "Build date used to assess eligibility and achievement."
  - name: measurement_period_start
    description: "Exclusive start of the 15-month diagnosis cohort."
  - name: age
    description: "Age in completed years on the reporting date; null when the birth date is missing."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: is_in_denominator
    description: "Always true; each row meets the documented eligibility and exclusion rules."
  - name: is_in_numerator
    description: "Whether the person meets the documented achievement rule on the reporting date."
  - name: indicator_status
    description: "ACHIEVED when the achievement rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  - name: latest_record_date
    description: "Latest evidence date that satisfies an age-appropriate test rule within 3 calendar months either side of diagnosis; null when none. For immunoglobulin E with a blood test, this is the later date."
  - name: current_practice_code
    description: "ODS code of the registration practice on the build date."
  - name: current_practice_name
    description: "Name of the registration practice on the build date."
  - name: diagnosis_date
    description: "Earliest asthma diagnosis after the latest known resolution, or first diagnosis when no resolution is recorded."
  - name: feno_date
    description: "Latest exhaled nitric oxide test in the diagnosis test window; null when none."
  - name: reversibility_date
    description: "Latest bronchodilator reversibility test in the diagnosis test window; null when none."
  - name: pefr_variability_date
    description: "Latest peak-flow variability record in the diagnosis test window; counts regardless of spirometry availability. Null when none."
  - name: bronchial_challenge_date
    description: "Latest bronchial challenge test in the diagnosis test window; null when none."
  - name: skin_prick_date
    description: "Latest skin-prick test in the diagnosis test window; contributes to achievement at ages 5 to 16. Null when none."
  - name: ige_date
    description: "Latest immunoglobulin E test in the diagnosis test window; contributes at ages 5 to 16 only with an eosinophil count or full blood count. Null when none."
  - name: eosinophil_or_fbc_date
    description: "Latest eosinophil count or full blood count in the diagnosis test window; null when none."
