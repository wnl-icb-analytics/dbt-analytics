models:
- name: fct_person_dementia_baseline_tests_ind80_by_month
  description: NICE IND80 dementia baseline tests. One row per active, living, non-test person with a
    first known dementia diagnosis in the financial year to date. Achievement requires all eight baseline
    tests in the inclusive six months either side of diagnosis, capped at reporting date. FBC, calcium,
    glucose (including HbA1c), renal, liver, thyroid, B12 and folate tests use the lists documented in
    int_nice_dementia_baseline_tests_all. Numeric results are not required. No personalised care adjustments
    apply. Recalculated for the last 60 completed month-ends using current rules and code lists. Registration
    and practice follow the monthly spine. Birth and death dates are approximate; current gender and test
    flags apply retrospectively. Diagnoses use clinical and recorded dates; other evidence uses clinical
    dates through month-end. Later corrections can change earlier results. Lists are PCD FBC_COD, HB_COD,
    CALC_COD, GLUC_COD, IFCCHBAM_COD, DCCTHBA1C_COD, UE_COD, CRE_COD, EGFR_COD, LFT_COD and TFT_COD, and
    OPENCODELISTS ARDENS/B12_LEVEL and ARDENS/FOLATE_LEVEL.
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind80
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: reporting_date
    description: Date used for eligibility and evidence.
  - name: measurement_period_start
    description: Start of the stated cohort or evidence period; see the model description for boundary
      inclusion.
  - name: latest_record_date
    description: Latest qualifying evidence date; null when no qualifying evidence exists.
  - name: is_in_denominator
    description: Always true for every row.
  - name: is_in_numerator
    description: Whether the complete indicator rule is met.
  - name: indicator_status
    description: ACHIEVED or NOT_RECORDED_IN_PERIOD.
  - name: diagnosis_date
    description: First dementia diagnosis known by reporting date.
  - name: fbc_date
    description: Latest qualifying fbc test; null when absent.
  - name: calcium_date
    description: Latest qualifying calcium test; null when absent.
  - name: glucose_date
    description: Latest qualifying glucose test; null when absent.
  - name: renal_date
    description: Latest qualifying renal test; null when absent.
  - name: liver_date
    description: Latest qualifying liver test; null when absent.
  - name: thyroid_date
    description: Latest qualifying thyroid test; null when absent.
  - name: b12_date
    description: Latest qualifying b12 test; null when absent.
  - name: folate_date
    description: Latest qualifying folate test; null when absent.
  - name: person_id
    description: Person in the indicator denominator.
  - name: indicator_id
    description: NICE indicator identifier.
  - name: indicator_name
    description: Published NICE indicator name.
  - name: age
    description: Completed years at reporting date, based on the approximate birth date.
  - name: practice_code
    description: Registration practice ODS code at reporting date.
  - name: practice_name
    description: Registration practice name at reporting date.
