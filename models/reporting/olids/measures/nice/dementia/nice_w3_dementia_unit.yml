          (-93102::NUMBER, '2026-09-30'::DATE, '2014-04-01'::DATE, '2014-04-01'::DATE, '2014-04-01'::DATE, '2014-04-01'::DATE, '2014-04-01'::DATE, '2014-04-01'::DATE, '2014-04-01'::DATE, '2014-04-01'::DATE, '2014-04-01'::DATE, '2014-04-01'::DATE, TRUE::BOOLEAN),
          (-93103::NUMBER, '2026-09-30'::DATE, '2014-03-31'::DATE, '2014-03-31'::DATE, '2014-03-31'::DATE, '2014-03-31'::DATE, '2014-03-31'::DATE, '2014-03-31'::DATE, '2014-03-31'::DATE, '2014-03-31'::DATE, '2014-03-31'::DATE, '2014-03-31'::DATE, TRUE::BOOLEAN),
          (-93104::NUMBER, '2026-09-30'::DATE, '2026-09-30'::DATE, '2026-09-30'::DATE, '2026-09-30'::DATE, '2026-09-30'::DATE, '2026-09-30'::DATE, '2026-09-30'::DATE, '2026-09-30'::DATE, '2026-09-30'::DATE, '2026-09-30'::DATE, '2026-09-30'::DATE, TRUE::BOOLEAN)
