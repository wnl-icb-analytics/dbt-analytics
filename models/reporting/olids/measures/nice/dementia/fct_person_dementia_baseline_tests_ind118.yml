models:
- name: fct_person_dementia_baseline_tests_ind118
  description: >-
    Baseline blood tests before dementia diagnosis (NICE IND118). One row per person in
    the denominator on the build date.


    People registered on the build date on the dementia register first diagnosed on or
    after 1 April 2014. Achieved with all eight tests in the 12 months before diagnosis,
    including diagnosis day: full blood count, calcium, glucose, renal function, liver
    function, thyroid function, vitamin B12 and folate. Haemoglobin alone counts as full
    blood count; HbA1c counts as glucose. No numeric results are needed. No personalised
    care adjustments are applied. Code lists: DEM_COD, FBC_COD, HB_COD, CALC_COD,
    GLUC_COD, IFCCHBAM_COD, DCCTHBA1C_COD, UE_COD, CRE_COD, EGFR_COD, LFT_COD, TFT_COD
    (PCD); ARDENS/B12_LEVEL, ARDENS/FOLATE_LEVEL (OpenCodelists).
  config:
    meta:
      owner:
        name: EddieDavison92
      clinical_source: https://www.nice.org.uk/indicators/ind118
      indicator:
        id: IND118
        type: MEASURE
        category: DEMENTIA
        clinical_domain: DEMENTIA
        name_short: "Dementia baseline tests since 2014"
        description_short: "Baseline blood tests before dementia diagnosis."
        description_long: >-
          People registered on the build date on the dementia register first
          diagnosed on or after 1 April 2014. Achieved with all eight tests in the
          12 months before diagnosis, including diagnosis day: full blood count,
          calcium, glucose, renal function, liver function, thyroid function,
          vitamin B12 and folate. Haemoglobin alone counts as full blood count;
          HbA1c counts as glucose. No numeric results are needed. No personalised
          care adjustments are applied. Code lists: DEM_COD, FBC_COD, HB_COD,
          CALC_COD, GLUC_COD, IFCCHBAM_COD, DCCTHBA1C_COD, UE_COD, CRE_COD,
          EGFR_COD, LFT_COD, TFT_COD (PCD); ARDENS/B12_LEVEL, ARDENS/FOLATE_LEVEL
          (OpenCodelists).
        is_qof: false
        source_column: is_in_numerator
        usage_contexts:
        - NICE_GUIDANCE
        sort_order: NICE_IND118
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: reporting_date
    description: "Build date used to assess eligibility and evidence."
  - name: measurement_period_start
    description: "1 April 2014, the first eligible diagnosis date. Tests are assessed relative to diagnosis."
  - name: latest_record_date
    description: >-
      Latest of the eight test dates in the diagnosis-based period; null if all are absent. A date
      does not prove all eight tests are present.
  - name: is_in_denominator
    description: "Always true. Each row is an eligible member of the denominator."
  - name: is_in_numerator
    description: "True when the person meets the achievement rules in the model description."
  - name: indicator_status
    description: "ACHIEVED when the numerator rule is met; otherwise NOT_RECORDED_IN_PERIOD."
  - name: diagnosis_date
    description: "First dementia diagnosis with clinical and recorded dates known by the reporting date."
  - name: fbc_date
    description: >-
      Latest full blood count or haemoglobin test in the diagnosis-based period described above;
      null if absent. A numeric result is not required.
  - name: calcium_date
    description: >-
      Latest calcium test in the diagnosis-based period described above; null if absent. A numeric
      result is not required.
  - name: glucose_date
    description: >-
      Latest glucose or HbA1c test in the diagnosis-based period described above; null if absent. A
      numeric result is not required.
  - name: renal_date
    description: >-
      Latest renal function test in the diagnosis-based period described above; null if absent. A
      numeric result is not required.
  - name: liver_date
    description: >-
      Latest liver function test in the diagnosis-based period described above; null if absent. A
      numeric result is not required.
  - name: thyroid_date
    description: >-
      Latest thyroid function test in the diagnosis-based period described above; null if absent. A
      numeric result is not required.
  - name: b12_date
    description: >-
      Latest vitamin B12 test in the diagnosis-based period described above; null if absent. A
      numeric result is not required.
  - name: folate_date
    description: >-
      Latest folate test in the diagnosis-based period described above; null if absent. A numeric
      result is not required.
  - name: person_id
    description: "Person identifier for a member of the indicator denominator."
  - name: indicator_id
    description: "NICE indicator identifier."
  - name: indicator_name
    description: "Published NICE indicator title."
  - name: indicator_description
    description: "NICE's published statement of the indicator."
  - name: denominator_description
    description: "Short description of the people in the denominator."
  - name: age
    description: "Age in completed years at the reporting date, based on the approximate birth date."
  - name: current_practice_code
    description: "ODS code of the registration practice at the reporting date."
  - name: current_practice_name
    description: "Name of the registration practice at the reporting date."
