models:
  - name: dq_multiple_current_registrations
    description: >-
      OLIDS registrations for people with more than one registration marked current,
      one row per person and registration sequence. Repeated records at the same
      practice on the same date remain separate. Counts and overlap flags help
      distinguish concurrent practices from repeated records; inclusion alone does not
      confirm an error.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - registration_sequence
    columns:
      - name: person_id
        description: Unique person identifier with multiple registrations

      - name: registration_sequence
        description: Sequence of the registration within this person's complete practice history.

      - name: practice_id
        description: Practice identifier for this registration

      - name: practice_name
        description: Practice name for this registration

      - name: registration_start_date
        description: Start date of this registration

      - name: registration_end_date
        description: End date of this registration (NULL for current)

      - name: registration_status
        description: Status of this registration

      - name: current_registration_count
        description: Total number of current registrations for this person
