models:
  - name: dq_cholesterol_issues
    description: >
      One row per total cholesterol observation failing the shared validity rule.
      Includes concentrations outside 0.5 to 20 mmol/L, missing numeric results,
      and unsupported units. Results with no recorded unit are kept as mmol/L upstream and
      appear here only when the value fails the rule. Source observations with missing or
      future clinical dates are excluded upstream. Includes all people.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique person identifier

      - name: id
        description: Observation record identifier
        data_tests:
          - unique
          - not_null

      - name: clinical_effective_date
        description: Date of cholesterol measurement

      - name: cholesterol_value
        description: Cholesterol measurement value (mmol/L)

      - name: result_unit_display
        description: Unit of measurement

      - name: original_result_unit_display
        description: Recorded unit label before standardisation, including source concept fallback.

      - name: unit_status
        description: Whether the original unit was standard, converted, missing, mislabelled or unsupported.

      - name: concept_code
        description: Concept code for cholesterol measurement

      - name: concept_display
        description: Concept display name

      - name: source_cluster_id
        description: Source cluster identifier

      - name: is_cholesterol_out_of_range
        description: Whether cholesterol is outside valid range (0.5-20 mmol/L)

      - name: is_date_missing
        description: Whether clinical effective date is missing

      - name: is_future_date
        description: Whether measurement date is in the future

      - name: is_extreme_outlier
        description: Whether cholesterol is an extreme outlier (>15 mmol/L)

    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: CHOL2_COD