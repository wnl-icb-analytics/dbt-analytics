models:
  - name: dq_bmi_issues
    description: >-
      BMI records with a data-quality issue in NCL OLIDS, one row per recorded or
      calculated BMI record for people aged at least 18 at build or death. Selects BMI
      below 10 or above 150 kg/m², an upstream invalid-BMI flag, or missing or future
      dates; upstream date filtering normally leaves the date flags false. Calculated
      BMI requires adult height and weight measurements, while recorded BMI can predate
      adulthood. No current-registration filter applies.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique person identifier

      - name: id
        description: Observation record identifier

      - name: clinical_effective_date
        description: Date of BMI measurement

      - name: bmi_value
        description: >-
          Recorded or calculated BMI in kg/m².

      - name: result_unit_display
        description: Unit of measurement for BMI

      - name: concept_code
        description: Concept code for BMI measurement

      - name: concept_display
        description: Concept display name for BMI

      - name: source_cluster_id
        description: Source cluster identifier

      - name: result_value
        description: Original result value

      - name: bmi_category
        description: Original BMI category classification

      - name: is_bmi_out_of_range
        description: Whether BMI is outside valid range (10-150)

      - name: is_date_missing
        description: Whether clinical effective date is missing

      - name: is_future_date
        description: Whether measurement date is in the future

      - name: is_extreme_outlier
        description: >-
          BMI below 8 or above 100 kg/m². This flag alone does not select a record into
          this model.

      - name: bmi_category_with_issues
        description: BMI category including issue classifications

    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: BMIVAL_COD