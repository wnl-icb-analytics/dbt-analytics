models:
  - name: dq_bmi_issues
    description: >-
      BMI records with a data-quality issue, one row per retained recorded or
      calculated BMI record from int_bmi_all. The OLIDS population comes from
      NCL GP records. Includes people aged at least 18 in dim_person_age,
      without an active-registration restriction. Selects BMI below 10 or
      above 150 kg/m², missing or future dates, or an upstream invalid-BMI
      flag. Extreme-outlier flags use below 8 or above 100 kg/m² but do not
      independently select a record. Calculated BMI excludes height or weight
      recorded before age 18; recorded BMIVAL_COD values have no equivalent
      age-at-event restriction. Upstream filtering removes missing and future
      dates from both paths, so those date flags are normally false.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique person identifier

      - name: id
        description: Observation record identifier

      - name: clinical_effective_date
        description: Date of BMI measurement

      - name: bmi_value
        description: BMI measurement value

      - name: result_unit_display
        description: Unit of measurement for BMI

      - name: concept_code
        description: Concept code for BMI measurement

      - name: concept_display
        description: Concept display name for BMI

      - name: source_cluster_id
        description: Source cluster identifier

      - name: result_value
        description: Original result value

      - name: bmi_category
        description: Original BMI category classification

      - name: is_bmi_out_of_range
        description: Whether BMI is outside valid range (10-150)

      - name: is_date_missing
        description: Whether clinical effective date is missing

      - name: is_future_date
        description: Whether measurement date is in the future

      - name: is_extreme_outlier
        description: Whether BMI is an extreme outlier (<8 or >100)

      - name: bmi_category_with_issues
        description: BMI category including issue classifications

    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: BMIVAL_COD