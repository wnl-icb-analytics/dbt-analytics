models:
  - name: fct_person_medication_adherence
    description: >
      Person-grain medicines adherence snapshot per adherence drug class,
      aggregated across each person's qualifying refill chains (drugs, VTM
      grain). Snapshot cohort: repeat therapy active in the last year —
      chains need at least one repeat-authorised order AND supply extending
      into the last year (var medication_adherence_recency_years); NULL
      measures with drug_count 0 mean "no current repeat therapy in class".
      Two measure families available for comparison: *_pdc_corrected_* is
      PDC2 (last-order quirk fixed and supply right-censored at the
      observation date), *_pdc_* without _corrected is the faithful AIC
      measure (quirk included, unobserved future supply counted). See
      int_medication_adherence_pdc. Neither bounds exposure to the window
      frame, so overhang remains an upward bias that matters against
      thresholds such as 0.80. Per family and class:
      latest (each family's own most recent fully elapsed non-NULL window —
      the two families' latest readings can come from different windows) and
      overall (chain span within the 3-year processing horizon), aggregated
      across the person's chains, plus the number of contributing chains.
      NOTE: the model currently emits only the mean corrected columns; the
      min and faithful aggregations are present but commented out in the
      SQL. Drill-down lives in int_medication_adherence_pdc_windows. One row
      per person. No opt-out filter — secondary-use consumers must join
      DIM_PERSON_SECONDARY_USE_ALLOWED.
    config:
      meta:
        owner:
          name: em-baldwin
    columns:
      - name: person_id
        description: Person identifier; one row per person.
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: person_id
      - name: raas_latest_pdc_corrected_min
        description: RAAS — worst drug, corrected PDC, latest elapsed window.
      - name: raas_latest_pdc_corrected_mean
        description: RAAS — mean corrected PDC, latest elapsed windows.
      - name: raas_overall_pdc_corrected_min
        description: RAAS — worst drug, corrected overall PDC.
      - name: raas_overall_pdc_corrected_mean
        description: RAAS — mean corrected overall PDC.
      - name: raas_latest_pdc_min
        description: RAAS — worst drug, faithful PDC, latest elapsed window.
      - name: raas_latest_pdc_mean
        description: RAAS — mean faithful PDC, latest elapsed windows.
      - name: raas_overall_pdc_min
        description: RAAS — worst drug, faithful overall PDC.
      - name: raas_overall_pdc_mean
        description: RAAS — mean faithful overall PDC.
      - name: raas_drug_count
        description: RAAS — number of qualifying chains (distinct VTM codes).
      - name: beta_blocker_latest_pdc_corrected_min
        description: Beta-blockers — worst drug, corrected PDC, latest elapsed window.
      - name: beta_blocker_latest_pdc_corrected_mean
        description: Beta-blockers — mean corrected PDC, latest elapsed windows.
      - name: beta_blocker_overall_pdc_corrected_min
        description: Beta-blockers — worst drug, corrected overall PDC.
      - name: beta_blocker_overall_pdc_corrected_mean
        description: Beta-blockers — mean corrected overall PDC.
      - name: beta_blocker_latest_pdc_min
        description: Beta-blockers — worst drug, faithful PDC, latest elapsed window.
      - name: beta_blocker_latest_pdc_mean
        description: Beta-blockers — mean faithful PDC, latest elapsed windows.
      - name: beta_blocker_overall_pdc_min
        description: Beta-blockers — worst drug, faithful overall PDC.
      - name: beta_blocker_overall_pdc_mean
        description: Beta-blockers — mean faithful overall PDC.
      - name: beta_blocker_drug_count
        description: Beta-blockers — number of qualifying chains.
      - name: ccb_latest_pdc_corrected_min
        description: Calcium-channel blockers — worst drug, corrected PDC, latest elapsed window.
      - name: ccb_latest_pdc_corrected_mean
        description: Calcium-channel blockers — mean corrected PDC, latest elapsed windows.
      - name: ccb_overall_pdc_corrected_min
