models:
  - name: dim_valproate_araf_referral
    description: >-
      ARAF referral evidence for the valproate programme, one row per person with a referral
      coded in the REFERRAL category of stg_reference_valproate_prog_codes. Includes
      earliest and latest referral dates, identifiers and codes from referral requests and
      observations. Duplicate copies of the same referral are removed upstream. No
      current-registration or recent-valproate restriction is applied.

    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null