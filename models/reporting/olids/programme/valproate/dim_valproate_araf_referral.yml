models:
  - name: dim_valproate_araf_referral
    description: >-
      ARAF referral evidence for the OLIDS valproate programme, one row per person
      with a code in the programme's REFERRAL category. Covers referral requests and
      observations, with duplicate copies of the same referral removed. No
      current-registration or recent-valproate filter applies.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null