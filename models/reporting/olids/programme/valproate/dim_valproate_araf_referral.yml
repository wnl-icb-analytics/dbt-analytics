models:
  - name: dim_valproate_araf_referral
    description: 'ARAF referral events aggregation for valproate monitoring.

      One row per person with ARAF referral events including earliest and latest dates and event-ID traceability. Duplicate copies of the same referral are removed upstream, so each intended record contributes one ID.'

    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null