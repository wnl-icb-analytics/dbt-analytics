models:
  - name: dim_valproate_araf
    description: >-
      Annual Risk Acknowledgement Form (ARAF) evidence for the valproate programme, one row
      per person with an event in the ARAF category of stg_reference_valproate_prog_codes
      that meets its code-specific lookback rule. Includes old-form SNOMED code
      1366401000000107 and new-form code 2078951000000106. Contains earliest and latest
      event dates, form-specific dates and source identifiers and codes.
      latest_araf_overall_date is the later of the old and new form dates. This population
      is not restricted to current valproate recipients.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null