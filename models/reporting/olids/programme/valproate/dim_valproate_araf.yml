models:
  - name: dim_valproate_araf
    description: >-
      Annual Risk Acknowledgement Form (ARAF) evidence for the NCL OLIDS valproate
      programme, one row per person with a qualifying coded event. ARAF codes follow the
      programme reference list and code-specific lookback rules, including old-form
      SNOMED code 1366401000000107 and new-form code 2078951000000106. Current valproate
      prescribing is not required.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null