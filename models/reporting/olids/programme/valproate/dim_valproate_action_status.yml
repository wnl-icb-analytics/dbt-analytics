models:
  - name: dim_valproate_action_status
    description: >-
      Valproate programme action and priority for each person in
      dim_valproate_db_scope, one row per person not recorded as Male, aged 0
      to 55 inclusive, with a valproate order in the last six months. The
      OLIDS population comes from NCL GP records. Actions describe the
      programme's recorded pregnancy and safety documentation rules, not an
      independently confirmed clinical assessment. Pregnancy has first
      priority for Review or refer. Age 0 to 6 or recorded permanent absence
      of pregnancy risk gives No action required. Recorded PPP non-enrolment
      gives Keep under review. Otherwise missing PPP evidence or no current
      ARAF gives Review or refer; PPP enrolment with a current ARAF gives
      Consider expiry of ARAF. ARAF currency follows code-specific lookback
      rules in stg_reference_valproate_prog_codes. Priority 1 is pregnancy; 2
      to 4 are missing documentation ranked by learning disability, age 13 to
      55, then age 7 to 12. Priorities 6 to 8 rank complete documentation by
      learning disability, age 7 to 12, then age 13 to 55. PPP non-enrolment
      is priority 5 and low pregnancy risk is priority 9.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null