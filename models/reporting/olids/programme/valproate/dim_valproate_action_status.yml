models:
  - name: dim_valproate_action_status
    description: >-
      Valproate monitoring actions per person in OLIDS aged 0 to 55, not recorded as
      Male, with a valproate order in the last six months. Uses Pregnancy Prevention
      Programme (PPP) status, whether the Annual Risk Acknowledgement Form (ARAF) is
      up to date, and recorded pregnancy risk. Pregnancy has highest priority. These
      are programme rules, not an independent clinical assessment.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null
      - name: action
        description: >-
          Programme action. Pregnancy gives 'Review or refer'. Otherwise, ages 0 to 6
          or permanent absence of pregnancy risk give 'No action required'. Among
          remaining people, PPP non-enrolment gives 'Keep under review'. PPP enrolment
          with an up-to-date ARAF gives 'Consider expiry of ARAF'; missing PPP
          evidence or an absent or out-of-date ARAF gives 'Review or refer'. ARAF
          validity follows the code-specific lookback rules in dim_valproate_araf.
          Other unmatched cases give 'Review or refer'.
      - name: action_order
        description: >-
          Programme priority, with 1 highest and 9 lowest. Values are 1 pregnancy; 2
          missing documentation with learning disability; 3 missing documentation aged
          13 to 55; 4 missing documentation aged 7 to 12; 5 PPP non-enrolment; 6
          complete documentation with learning disability; 7 complete documentation
          aged 7 to 12; 8 complete documentation aged 13 to 55; 9 age 0 to 6 or
          permanent absence of pregnancy risk. Pregnancy, low-risk and PPP
          non-enrolment rules take precedence over documentation checks. Null if no
          rule matches.
