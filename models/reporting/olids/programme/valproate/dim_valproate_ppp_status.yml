models:
  - name: dim_valproate_ppp_status
    description: >-
      Pregnancy Prevention Programme (PPP) status for NCL OLIDS people with recorded
      evidence, one row per person. Status follows the selected latest event, with only
      'Yes - PPP enrolled' counted as enrolled. Undated records remain, and no
      current-registration or recent-valproate filter applies.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null