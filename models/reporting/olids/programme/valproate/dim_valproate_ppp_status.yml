models:
  - name: dim_valproate_ppp_status
    description: >-
      Pregnancy Prevention Programme (PPP) status for people with recorded PPP
      evidence, one row per person in int_ppp_status_all. The OLIDS population
      comes from NCL GP records. Status follows the selected latest event;
      undated records remain included. Only the selected 'Yes - PPP enrolled'
      status counts as enrolled. Includes the latest status and date, earliest
      and latest evidence dates, and source identifiers and codes. No
      current-registration or recent-valproate restriction is applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null