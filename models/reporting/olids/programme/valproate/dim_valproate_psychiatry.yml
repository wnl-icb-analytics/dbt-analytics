models:
  - name: dim_valproate_psychiatry
    description: >-
      Psychiatry evidence defined for the valproate programme, one row per
      person with an observation in the PSYCH category of
      stg_reference_valproate_prog_codes. The OLIDS population comes from NCL
      GP records. Contains earliest and latest event dates and the recorded
      identifiers and codes. No date, current-registration or recent-valproate
      restriction is applied.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null