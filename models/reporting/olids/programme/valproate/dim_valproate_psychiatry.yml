models:
  - name: dim_valproate_psychiatry
    description: >-
      Psychiatry evidence for the NCL OLIDS valproate programme, one row per person with
      an observation coded in the programme's PSYCH category. No date,
      current-registration or recent-valproate filter applies.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null