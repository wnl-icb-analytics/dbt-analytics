version: 2
models:
  - name: fct_person_ltc_lcs_risk_summary
    description: |-
      LTC LCS risk and MoC status, one row per eligible adult MoC or CYP-only asthma member at the build date. LR hypertension-only and LR adult-asthma-only people are excluded. Includes inactive and deceased people; filter is_active in the published base. Next actions use observation-based EMIS work lists; future diary lists are unavailable.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
    columns:
      - name: person_id
        description: Unique person identifier
        data_tests:
          - not_null
          - unique
      - name: number_of_ltc_lcs_conditions
        description: Number of LTC LCS condition registers the person is on (1-12)
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
      - name: af_risk_group
        description: Highest AF risk group (HR/MR) or null if not on AF register pathway
      - name: asthma_adult_risk_group
        description: Highest Asthma Adult risk group (HRC/HR/MR/LR) or null if not on adult asthma register pathway
      - name: asthma_cyp_risk_group
        description: CYP asthma HR across the full register; LR for CYP-only people not in HR. Null for unstratified
          CYP-plus-other people.
      - name: chd_risk_group
        description: Highest CHD risk group (HRC/HR/MR) or null if not on CHD register pathway
      - name: ckd_risk_group
        description: Highest CKD risk group (HRC/HR/MR) or null if not on CKD register pathway
      - name: copd_risk_group
        description: Highest COPD risk group (HRC/HR/MR) or null if not on COPD register pathway
      - name: diabetes_risk_group
        description: Highest Diabetes risk group (HRC/HR/MR/MRa/MRb/LR) or null if not on Diabetes register pathway
      - name: hf_risk_group
        description: Highest Heart Failure risk group (HR/MR) or null if not on HF register pathway
      - name: hypertension_risk_group
        description: Highest Hypertension risk group (HRC/HR/MRa/MRb/LR) or null if not on HTN register pathway
      - name: nafld_risk_group
        description: Highest NAFLD risk group (MR only) or null if not on NAFLD register pathway
      - name: pad_risk_group
        description: Highest PAD risk group (HRC/HR/MR) or null if not on PAD register pathway
      - name: stroke_tia_risk_group
        description: Highest Stroke/TIA risk group (HRC/HR/MR) or null if not on Stroke/TIA register pathway
      - name: overall_risk_group
        description: Highest adult MoC risk group (HRC/HR/MR/LR), with MRa/MRb reported as MR and unstratified eligible
          members as LR. CYP-only rows carry their separate asthma HR/LR review risk; use is_in_moc_base to select adult
          GROUP1-4.
        data_tests:
          - accepted_values:
              arguments:
                values: ['HRC', 'HR', 'MR', 'LR']
      - name: overall_risk_rank
        description: 'Stored risk rank: 1=HRC, 2=HR, 3=MR, 4=MRa/MRb, 5=LR. CYP-only HR/LR review risk uses 2/5. Monthly movement
          compares overall group ranks separately.'
      - name: in_any_risk_group
        description: True if stratified by a per-condition risk model, the Type 1 rule, or the CYP asthma pathway (always true for CYP-only rows)
        data_tests:
          - not_null
      - name: moc_check_test_completed
        description: 'Actual C&T activity: C strictly after the annual anniversary for HRCS/HRS/MRS; inclusive for LRS. False
          for CYP-only people.'
        data_tests:
          - not_null
      - name: moc_check_test_date
        description: Latest Check & Test date within its stage window; null if none in the window
      - name: moc_careplan_sharing_completed
        description: 'Actual sharing activity: S strictly after the annual anniversary for HRCS/HRS/MRS; inclusive for LRS.'
        data_tests:
          - not_null
      - name: moc_careplan_sharing_date
        description: Latest care plan sharing date within its stage window; null if none in the window
      - name: moc_discussion_completed
        description: Actual PCSP agreed event in the inclusive trailing 12 months. Declines do not count as activity.
        data_tests:
          - not_null
      - name: moc_discussion_date
        description: Latest discussion date in the last 12 months; null if none in the window
      - name: moc_followup_completed
        description: Actual PCSP review event in the inclusive trailing 12 months. Stage 4 completion also requires an
          agreed plan or a decline.
        data_tests:
          - not_null
      - name: moc_followup_date
        description: Latest follow-up date in the last 12 months; null if none in the window
      - name: moc_declined
        description: Model of Care declined event recorded in last 12 months (raw flag, regardless of later
          re-engagement)
        data_tests:
          - not_null
      - name: moc_declined_date
        description: Latest MoC declined date in the last 12 months; null if none in the window
      - name: moc_any_activity_12m
        description: Any actual adult MoC or applicable CYP review activity in its pathway window, including an adult
          decline.
        data_tests:
          - not_null
      - name: moc_any_activity_fy
        description: 'Project financial-year measure, since 1 April: Project measure of actual adult MoC or applicable CYP
          review activity since 1 April, including an adult decline.'
        data_tests:
          - not_null
      - name: moc_pathway
        description: 'EMIS pathway: HRCS, HRS, MRS or LRS. CYP-only asthma rows (is_in_moc_base false) show HRS or LRS by CYP risk and use the CYP review columns.'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - HRCS
                  - HRS
                  - MRS
                  - LRS
      - name: moc_risk_category
        description: Dashboard risk category (High Risk + Complex, High Risk, Medium Risk, or Low Risk)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['High Risk + Complex', 'High Risk', 'Medium Risk', 'Low Risk']
      - name: moc_check_test_completed_12m
        description: 'Actual C&T activity: C strictly after the annual anniversary for HRCS/HRS/MRS; inclusive for LRS. False
          for CYP-only people.'
        data_tests: [not_null]
      - name: moc_check_test_date_12m
        description: Latest Check & Test date in the trailing 12 months
      - name: moc_check_test_completed_fy
        description: 'Project financial-year measure, since 1 April: Check & Test completed in the current financial year
          to date'
        data_tests: [not_null]
      - name: moc_check_test_date_fy
        description: 'Project financial-year measure, since 1 April: Latest Check & Test date in the current financial year
          to date'
      - name: moc_mdt_review_completed_12m
        description: Annual MDT review event in the inclusive trailing 12 months, HRCS/HRS only; separate from stage 2
          completion.
        data_tests: [not_null]
      - name: moc_mdt_review_date_12m
        description: Latest actual annual MDT review date within the inclusive trailing 12 months; null if absent.
      - name: moc_mdt_review_completed_fy
        description: 'Project financial-year measure, since 1 April: MDT Review completed in the current financial year to
          date for HRCS/HRS pathways'
        data_tests: [not_null]
      - name: moc_mdt_review_date_fy
        description: 'Project financial-year measure, since 1 April: Latest MDT Review date in the current financial year
          to date for HRCS/HRS pathways'
      - name: moc_careplan_sharing_completed_12m
        description: 'Actual sharing activity: S strictly after the annual anniversary for HRCS/HRS/MRS; inclusive for LRS.'
        data_tests: [not_null]
      - name: moc_careplan_sharing_date_12m
        description: Latest Care Plan Sharing date in its stage window, all adult pathways
      - name: moc_careplan_sharing_completed_fy
        description: 'Project financial-year measure, since 1 April: Care Plan Sharing completed in the current financial
          year to date, all adult pathways'
        data_tests: [not_null]
      - name: moc_careplan_sharing_date_fy
        description: 'Project financial-year measure, since 1 April: Latest Care Plan Sharing date in the current financial
          year to date, all adult pathways'
      - name: moc_discussion_completed_12m
        description: Actual PCSP agreed event in the inclusive trailing 12 months. Declines do not count as activity.
        data_tests: [not_null]
      - name: moc_discussion_date_12m
        description: Latest Discussion date in the trailing 12 months
      - name: moc_discussion_completed_fy
        description: 'Project financial-year measure, since 1 April: Discussion completed in the current financial year to
          date'
        data_tests: [not_null]
      - name: moc_discussion_date_fy
        description: 'Project financial-year measure, since 1 April: Latest Discussion date in the current financial year
          to date'
      - name: moc_followup_completed_12m
        description: Actual PCSP review event in the inclusive trailing 12 months. Stage 4 completion also requires an
          agreed plan or a decline.
        data_tests: [not_null]
      - name: moc_followup_date_12m
        description: Latest Follow-up date in the trailing 12 months
      - name: moc_followup_completed_fy
        description: 'Project financial-year measure, since 1 April: Follow-up completed in the current financial year to
          date'
        data_tests: [not_null]
      - name: moc_followup_date_fy
        description: 'Project financial-year measure, since 1 April: Latest Follow-up date in the current financial year to
          date'
      - name: moc_stage_2_completed
        description: |-
          C strictly after the annual anniversary and MDT or sharing for HRCS/HRS; sharing for MRS/LRS. MDT is inclusive; sharing is strict except in LRS.
        data_tests:
          - not_null
      - name: moc_stage_completed
        description: Highest adult stage reached by recorded activity (0-4). Decline-accepted EMIS completion is in
          moc_stage_3_completed and moc_stage_4_completed. Zero for CYP-only pathways.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4]
      - name: moc_stage_completed_label
        description: |-
          Label for moc_stage_completed. MR/LR stage 2 is Care Plan Sharing. Annual Review or Desktop Review for CYP-only pathways; Not started if absent.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Not started
                  - Check & Test
                  - MDT Review
                  - Care Plan Sharing
                  - Discussion
                  - Follow-up
                  - Annual Review
                  - Desktop Review
      - name: moc_stage_completed_code
        description: 'Code for completed-stage label: C&T, MDT, CPS, DISC, F/U, AR or DTR; null when not started.'
        data_tests:
          - accepted_values:
              config:
                where: moc_stage_completed_code is not null
              arguments:
                values:
                  - C&T
                  - MDT
                  - CPS
                  - DISC
                  - F/U
                  - AR
                  - DTR
      - name: moc_pathway_status
        description: |-
          Declined (latest MoC event is a decline), Cycle complete, In progress (any recorded MoC activity in its window) or Not started. Work-list position is in moc_requires_* and moc_next_action.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Not started
                  - In progress
                  - Cycle complete
                  - Declined
      - name: moc_next_action
        description: |-
          First observation-based work list in stage order; Annual Review or Desktop Review for CYP-only children. Null when no list selects the person. Future care-plan diaries are unavailable in OLIDS.
        data_tests:
          - accepted_values:
              config:
                where: moc_next_action is not null
              arguments:
                values:
                  - Check & Test
                  - MDT Review
                  - Care Plan Sharing
                  - Discussion
                  - Follow-up
                  - Annual Review
                  - Desktop Review
      - name: moc_next_action_code
        description: 'Code for next action: C&T, MDT, CPS, DISC, F/U, AR or DTR; null when no work list selects the person.'
        data_tests:
          - accepted_values:
              config:
                where: moc_next_action_code is not null
              arguments:
                values:
                  - C&T
                  - MDT
                  - CPS
                  - DISC
                  - F/U
                  - AR
                  - DTR
      - name: moc_missing_check_test
        description: True if a later stage is recorded but Check & Test is absent in the last 12m
        data_tests:
          - not_null
      - name: moc_missing_stage_2
        description: True if discussion or follow-up is recorded but the pathway's stage 2 is absent in the last 12m
        data_tests:
          - not_null
      - name: moc_missing_discussion
        description: True if follow-up is recorded but discussion is absent in the last 12m
        data_tests:
          - not_null
      - name: moc_has_missing_priors
        description: True if the person has reached a later stage but is missing any earlier stage in the last 12m
        data_tests:
          - not_null
      - name: moc_cycle_complete
        description: 'Project measure: adults need an agreed plan and review within 12 months, latest MoC event a review, and
          no observation-based work list; CYP-only asthma children need the annual review, plus the desktop review if HR.'
        data_tests:
          - not_null
      - name: moc_stage_2_date
        description: Latest qualifying MDT or sharing date for a completed HRCS/HRS stage 2; sharing date for MRS/LRS.
          Null if stage 2 is incomplete.
      - name: moc_days_check_test_to_stage_2
        description: Days between check & test and stage 2. Null if either is missing; negative if stage 2 was recorded
          before check & test.
      - name: moc_days_stage_2_to_discussion
        description: Days between stage 2 and discussion. Null if either is missing; negative if out of order.
      - name: moc_days_discussion_to_followup
        description: Days between discussion and follow-up. Null if either is missing; negative if out of order.
      - name: moc_days_check_test_to_followup
        description: End-to-end cycle duration in days (check & test → follow-up). Null if either endpoint is missing.
      - name: moc_careplan_expires_date
        description: |-
          Last valid day of the inclusive PCSP-agreed 12-month window; null without valid activity. Accounts for leap-year clipping.
      - name: moc_next_expiry_date
        description: |-
          Earliest last valid day among currently qualifying pathway events. Strict windows expire before the anniversary; inclusive windows include it, with leap-year clipping.
      - name: table_refresh_date
        description: Timestamp when the row was built
        data_tests:
          - not_null
      - name: is_in_moc_base
        description: Eligible for adult MoC after EMIS exclusions. False for CYP-only asthma pathway rows.
      - name: moc_base_exclusion_reason
        description: CYP asthma only for CYP pathway rows; null for adult MoC. LR hypertension-only and LR
          adult-asthma-only rows are not published.
      - name: is_type_1_diabetes_hrc
        description: Qualifies for the separate EMIS Type 1 HRC rule; not added to diabetes_risk_group.
      - name: moc_mdt_review_completed
        description: Annual MDT review event in the inclusive trailing 12 months, HRCS/HRS only; separate from stage 2
          completion.
      - name: moc_mdt_review_date
        description: Latest actual annual MDT review date within the inclusive trailing 12 months; null if absent.
      - name: moc_remote_desktop_review_completed
        description: Annual review (MDT/desktop review code) in the last 12 months, any pathway. Kept for existing
          consumers; not a MoC stage. MR/LR stage 2 is care plan sharing.
        data_tests:
          - not_null
      - name: moc_remote_desktop_review_date
        description: Latest annual review date in the last 12 months, any pathway; null if none.
      - name: moc_remote_desktop_review_completed_12m
        description: Annual review in the last 12 months for MRS/LRS. Kept for existing consumers; not a MoC stage.
        data_tests: [not_null]
      - name: moc_remote_desktop_review_date_12m
        description: Latest annual review date in the last 12 months for MRS/LRS.
      - name: moc_remote_desktop_review_completed_fy
        description: Annual review since 1 April for MRS/LRS. Kept for existing consumers; not a MoC stage.
        data_tests: [not_null]
      - name: moc_remote_desktop_review_date_fy
        description: Latest annual review date since 1 April for MRS/LRS.
      - name: moc_re_engaged_after_decline
        description: Declined in the last 12 months, then a later C&T, care plan sharing, discussion or follow-up.
        data_tests:
          - not_null
      - name: moc_stage_1_completed
        description: Adult pathway C&T completion, using its strict or inclusive annual window. False for CYP-only
          people.
      - name: moc_stage_3_completed
        description: 'Adult stage 3: agreed plan or decline in the inclusive trailing 12 months. No stage 1 or 2 prerequisite.'
      - name: moc_stage_4_completed
        description: 'Adult stage 4: decline, or both agreed plan and review in the inclusive trailing 12 months. No stage
          1 or 2 prerequisite.'
      - name: moc_requires_check_test
        description: Observation-based EMIS stage 1 list. Old C&T can require a new C&T despite a more recent decline.
      - name: moc_requires_stage_2
        description: Latest E in the inclusive trailing 12 months is C, strictly after the annual anniversary. Future
          diaries are unavailable.
      - name: moc_requires_mdt_review
        description: HRCS/HRS stage 2 list with no MDT strictly after the 12-month anniversary.
      - name: moc_requires_careplan_sharing
        description: MRS/LRS stage 2 list, or HRCS/HRS stage 2 list with MDT strictly after the anniversary and no
          sharing on or after it.
      - name: moc_requires_discussion
        description: Latest E in the inclusive trailing 12 months is S. Future diaries are unavailable.
      - name: moc_requires_followup
        description: Latest E is not D/R/C/S and latest E plus offered in the inclusive trailing 12 months is A. Future
          diaries are unavailable.
      - name: moc_ct_overdue
        description: Latest C strictly within 12 months, latest B is C, and C is more than 42 days old. B is C/A/R/D/O
          across all history.
      - name: moc_discussion_overdue
        description: No C on or before the 12-month anniversary, latest B is A, and A is more than 3 months old. B is
          C/A/R/D/O across all history.
      - name: cyp_annual_review_completed
        description: CYP-only annual asthma review strictly after the one-year anniversary. False for adult pathways.
      - name: cyp_requires_annual_review
        description: CYP-only person without an annual asthma review strictly after the one-year anniversary.
      - name: cyp_requires_desktop_review
        description: 'CYP-only HR: annual review done, no completed desktop review, and the latest annual or desktop review
          was 3 or more months ago. Project rule from the EMIS HR description; the exported search selects no one.'
        data_tests:
          - not_null
      - name: cyp_desktop_review_completed
        description: 'CYP-only HR: latest desktop review or latest annual review, after the annual anniversary
          with another AR/DTR in [review minus 3 months, review minus 1 day). Requires desktop review follows the HR description; see cyp_requires_desktop_review.'
      - name: cyp_annual_review_date
        description: Latest non-future CYP-only asthma annual review date; may be outside the completed window. Null for
          adult pathways or no event.
      - name: cyp_desktop_review_date
        description: Latest qualifying CYP-only HR desktop review or linked annual review date; null without completion
          or for other pathways.
