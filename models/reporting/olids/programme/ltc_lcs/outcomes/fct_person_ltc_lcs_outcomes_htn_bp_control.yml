version: 2

models:
  - name: fct_person_ltc_lcs_outcomes_htn_bp_control
    description: |
      LTC LCS outcome ICS_HTN_21: hypertension register members whose last blood pressure in the last 12 months is below the NICE target. One row per person in the denominator.

      Implements EMIS search [ICS_HTN_21 v3_NICE] [*OC] % of people on HTN register with good
      controlled (2).

      Denominator: people on the hypertension register, excluding people
      aged 90 or over, with an end of life care code or a lives in care home code (ever), or
      whose latest mild/moderate/severe frailty record is the "Moderate frailty" or "Severe
      frailty" finding. A latest Clinical Frailty Scale code does not exclude. The EMIS library
      item OR'd with end of life care is not in the export and is not applied. The EMIS
      search also requires current registration; filter on is_active downstream for that.

      Numerator: the last paired reading dated after today minus 12 months is below target on
      both values:
        - under 80: clinic < 140/90, home/ABPM < 135/85
        - 80 and over: clinic < 150/90, home/ABPM < 145/85
      No ACR/CKD/diabetes target tightening. People with no reading in the window are
      uncontrolled (is_bp_controlled = false, has_bp_in_window = false). Logic lives in the
      get_ltc_lcs_htn_bp_control macro; the _fy and _fy_last variants use financial-year windows.
    config:
      meta:
        indicator:
          id: "LTC_LCS_OUTCOMES_HTN_BP_CONTROL"
          type: "OUTCOME"
          category: "OUTCOMES"
          clinical_domain: "Cardiovascular"
          name_short: "HTN BP control (rolling)"
          description_short: "Hypertension register members with BP below NICE target (last reading, rolling 12 months)"
          description_long: >
            Percentage of people on the hypertension register, excluding those aged 90+, at end
            of life, in a care home or with moderate/severe frailty, whose last blood pressure in
            the last 12 months is below the NICE target: clinic < 140/90 (< 150/90 aged 80+),
            home/ABPM < 135/85 (< 145/85 aged 80+).
          is_qof: false
          source_column: "is_bp_controlled"
          sort_order: "LTC_LCS_OUTCOME_001"
          usage_contexts:
            - "LTC_LCS_DASHBOARD"
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
    columns:
      - name: person_id
        description: Unique person identifier (one row per person in the ICS_HTN_21 denominator)
        data_tests:
          - not_null
          - unique
      - name: age
        description: Current age in years (from the hypertension register / dim_person_age); sets the age band for the targets
      - name: latest_bp_date
        description: Date of the last known paired BP reading within the window (null if none)
      - name: latest_systolic_value
        description: Systolic value (mmHg) of the last known paired reading in the window (null if none)
      - name: latest_diastolic_value
        description: Diastolic value (mmHg) of the last known paired reading in the window (null if none)
      - name: is_home_bp_event
        description: True if the reading was a home BP measurement; home/ABPM targets apply
      - name: is_abpm_bp_event
        description: True if the reading was an ABPM measurement; home/ABPM targets apply
      - name: systolic_threshold
        description: Systolic value (mmHg) the reading must be below. Under 80 - clinic 140, home/ABPM 135; 80 and over - clinic 150, home/ABPM 145. Clinic targets apply when there is no reading.
      - name: diastolic_threshold
        description: Diastolic value (mmHg) the reading must be below. Clinic 90, home/ABPM 85. Clinic target applies when there is no reading.
      - name: has_bp_in_window
        description: True if the person has at least one paired BP reading in the window
        data_tests:
          - not_null
      - name: is_bp_controlled
        description: True if the last reading in the window is below both the systolic and diastolic thresholds. False (not null) for people with no reading in the window.
        data_tests:
          - not_null
