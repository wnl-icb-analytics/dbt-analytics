models:
  - name: fct_ltc_lcs_population_summary
    description: >-
      LTC LCS case-finding counts for OLIDS, one row per ten-year age band, ethnicity,
      IMD 2019 quintile, registered borough and neighbourhood. Denominators cover
      people with demographics, an age band and a current registration with no end
      date. Unknown deprivation is quintile 0. Each indicator retains its own rules,
      and people can meet several indicators, so indicator counts are not
      distinct-person totals.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.at_least_one:
          column_name: age_band_10y
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - age_band_10y
              - ethnicity_category
              - imd_quintile
              - borough_registered
              - neighbourhood_registered
    columns:
      - name: age_band_10y
        tests:
          - not_null
