models:
  - name: fct_ltc_lcs_population_summary
    description: >-
      LTC LCS case-finding counts by ten-year age band, ethnicity, IMD 2019 quintile,
      registered borough and registered neighbourhood, one row per combination. Population
      denominators cover people with a demographic record, an age band and a current
      practice registration with no recorded end date. Indicator membership follows
      dim_ltc_lcs_cf_summary. Unknown deprivation is quintile 0. Contains individual
      indicator counts and rates against the full population in each group; a person can
      meet several indicators.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.at_least_one:
          column_name: age_band_10y
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - age_band_10y
              - ethnicity_category
              - imd_quintile
              - borough_registered
              - neighbourhood_registered
    columns:
      - name: age_band_10y
        tests:
          - not_null
