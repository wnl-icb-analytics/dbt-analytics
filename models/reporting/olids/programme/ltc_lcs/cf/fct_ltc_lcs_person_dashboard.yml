models:
  - name: fct_ltc_lcs_person_dashboard
    description: >-
      LTC LCS case-finding details for OLIDS people meeting at least one indicator,
      one row per person. Requires matching demographics and a current practice
      registration with no end date. Each indicator retains its condition-specific
      population, exclusions and thresholds; people with no triggered indicator have
      no row.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id
    columns:
      - name: person_id
        description: Unique person identifier
        tests:
          - not_null
          - unique

      - name: has_learning_disability
        description: QOF Learning Disability register flag (age ≥14 years with 
          LD diagnosis). For population health inclusion group filtering.

      - name: has_severe_mental_illness
        description: QOF Severe Mental Illness register flag (active SMI 
          diagnosis or recent lithium therapy). For population health inclusion 
          group filtering.

      - name: is_currently_pregnant
        description: Currently pregnant flag (non-male, pregnancy code within 
          last 9 months, no delivery code after). For population health 
          inclusion group filtering.
