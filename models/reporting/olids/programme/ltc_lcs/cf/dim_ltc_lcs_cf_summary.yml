models:
  - name: dim_ltc_lcs_cf_summary
    description: >
      LTC LCS case-finding flags at build date. One row per currently
      registered, living person, including people with no flags. Most searches
      exclude people on the LTC LCS registers (AF, CKD, CHD, hypertension, HF,
      stroke/TIA, PAD, NAFLD, diabetes; programme models or QOF register
      proxies) or with hyperlipidaemia ever; CYP asthma excludes the LTC LCS
      COPD, adult asthma and CYP asthma registers. Within each family, people
      meeting a higher-priority search's criteria are excluded from lower ones,
      before that search's final exclusions. CVD risk scores include any score
      in the programme risk-assessment list, such as QRISK. Blood pressure uses
      the latest systolic and diastolic readings separately across clinic and
      home/ABPM; same-day ties use the latest save time, then the lowest value.
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id
    config:
      meta:
        indicators:
          - id: "LTC_LCS_CF_AF_61"
            type: "CASE_FINDING"
            category: "AF"
            clinical_domain: "Cardiovascular Case Finding"
            name_short: "AF_61: AF-related prescribing"
            description_short: "Anticoagulant, cardiac glycoside, flecainide or propafenone prescribing"
            description_long: >
              Current repeat course of an oral anticoagulant, a cardiac
              glycoside such as digoxin, flecainide or propafenone, or an
              anticoagulant or protamine issued in the last 6 months.
              Excludes LTC LCS registers or hyperlipidaemia, a Health
              Check in the last 2 years, AF or flutter, DVT/PE or
              antiphospholipid syndrome, Long COVID or hypoplastic left
              heart ever, and AF excluded or confirmed in the last 3
              years.
            is_qof: false
            source_column: "in_af_61"
            sort_order: "LTC_LCS_AF_61"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_AF_62"
            type: "CASE_FINDING"
            category: "AF"
            clinical_domain: "Cardiovascular Case Finding"
            name_short: "AF_62: 65+, no pulse check"
            description_short: "Age 65+, no pulse check in the last 3 years"
            description_long: >
              Age 65 or over with no pulse rate or rhythm check in the
              last 3 years. Excludes LTC LCS registers or hyperlipidaemia,
              a Health Check in the last 2 years, people meeting AF_61
              criteria, and AF excluded or confirmed in the last 3 years.
            is_qof: false
            source_column: "in_af_62"
            sort_order: "LTC_LCS_AF_62"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_CKD_61"
            type: "CASE_FINDING"
            category: "CKD"
            clinical_domain: "Chronic Kidney Disease Case Finding"
            name_short: "CKD_61: Two eGFRs <60"
            description_short: "Latest two eGFRs <60 ml/min/1.73m², on different dates"
            description_long: >
              Age 17 or over whose latest two eGFR results, on different
              dates any interval apart, are both <60 ml/min/1.73m².
              Excludes LTC LCS registers or hyperlipidaemia, CKD stage
              codes ever, and CKD screening in the last 3 years.
            is_qof: false
            source_column: "in_ckd_61"
            sort_order: "LTC_LCS_CKD_61"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_CKD_62"
            type: "CASE_FINDING"
            category: "CKD"
            clinical_domain: "Chronic Kidney Disease Case Finding"
            name_short: "CKD_62: Two UACRs >4"
            description_short: "Latest two UACRs >4 mg/mmol, on different dates"
            description_long: >
              Age 17 or over whose latest two UACR results, on different
              dates any interval apart, are both >4 mg/mmol. Excludes LTC
              LCS registers or hyperlipidaemia, CKD stage codes ever,
              people meeting higher-priority CKD criteria, and CKD
              screening in the last 3 years.
            is_qof: false
            source_column: "in_ckd_62"
            sort_order: "LTC_LCS_CKD_62"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_CKD_63"
            type: "CASE_FINDING"
            category: "CKD"
            clinical_domain: "Chronic Kidney Disease Case Finding"
            name_short: "CKD_63: Latest UACR >70"
            description_short: "Latest UACR >70 mg/mmol"
            description_long: >
              Age 17 or over with latest UACR >70 mg/mmol, at any date.
              Excludes LTC LCS registers or hyperlipidaemia, CKD stage
              codes ever, people meeting higher-priority CKD criteria, and
              CKD screening in the last 3 years.
            is_qof: false
            source_column: "in_ckd_63"
            sort_order: "LTC_LCS_CKD_63"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_CKD_64"
            type: "CASE_FINDING"
            category: "CKD"
            clinical_domain: "Chronic Kidney Disease Case Finding"
            name_short: "CKD_64: At risk, no eGFR in 12m"
            description_short: "CKD risk factor, no eGFR in the last 12 months"
            description_long: >
              Age 17 or over with no eGFR in the last 12 months and a CKD
              risk factor: AKI or AKI risk in the last 3 years, an at-risk
              condition ever, lithium, sulfasalazine or non-topical
              tacrolimus issued in the last 6 months, or microscopic
              haematuria (latest record with no negative urine blood test
              or urine microscopy on or after it, or latest diagnosis with
              a UACR >30 mg/mmol on or after it). Excludes LTC LCS
              registers or hyperlipidaemia, people meeting higher-priority
              CKD criteria, and CKD screening in the last 3 years.
            is_qof: false
            source_column: "in_ckd_64"
            sort_order: "LTC_LCS_CKD_64"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_CVD_61"
            type: "CASE_FINDING"
            category: "CVD"
            clinical_domain: "Cardiovascular Disease Case Finding"
            name_short: "CVD_61: Risk ≥20%, no statin"
            description_short: "Latest CVD risk ≥20%, no statin in the last 12 months"
            description_long: >
              Age 40 to under 84 with latest CVD risk score ≥20% and no
              statin prescribed or recorded in the last 12 months.
              Excludes LTC LCS registers or hyperlipidaemia, palliative
              care, a Health Check in the last 2 years, statin unsuitable
              (adverse reaction, contraindication, intolerance or not
              indicated), statin declined in the last 5 years, and high
              CVD risk review declined in the last 3 years.
            is_qof: false
            source_column: "in_cvd_61"
            sort_order: "LTC_LCS_CVD_61"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_CVD_62"
            type: "CASE_FINDING"
            category: "CVD"
            clinical_domain: "Cardiovascular Disease Case Finding"
            name_short: "CVD_62: Risk 15-<20%, no statin"
            description_short: "Latest CVD risk ≥15% and <20%, no statin in the last 12 months"
            description_long: >
              Age 40 to under 84 with latest CVD risk score ≥15% and <20%
              and no statin prescribed or recorded in the last 12 months.
              Excludes LTC LCS registers or hyperlipidaemia, palliative
              care, a Health Check in the last 2 years, statin unsuitable
              (adverse reaction, contraindication, intolerance or not
              indicated), statin declined in the last 5 years, people
              meeting higher-priority CVD criteria, and high CVD risk
              review declined in the last 3 years.
            is_qof: false
            source_column: "in_cvd_62"
            sort_order: "LTC_LCS_CVD_62"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_CVD_63"
            type: "CASE_FINDING"
            category: "CVD"
            clinical_domain: "Cardiovascular Disease Case Finding"
            name_short: "CVD_63: On statin, non-HDL >2.5"
            description_short: "Latest CVD risk ≥10%, on a statin, non-HDL >2.5 mmol/L"
            description_long: >
              Age 40 to under 84 with latest CVD risk score ≥10%, a statin
              prescribed or recorded in the last 12 months, and latest
              non-HDL cholesterol >2.5 mmol/L. Excludes LTC LCS registers
              or hyperlipidaemia, palliative care, statin unsuitable
              (adverse reaction, contraindication, intolerance or not
              indicated), people meeting higher-priority CVD criteria, and
              high CVD risk review declined in the last 3 years.
            is_qof: false
            source_column: "in_cvd_63"
            sort_order: "LTC_LCS_CVD_63"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_CVD_64"
            type: "CASE_FINDING"
            category: "CVD"
            clinical_domain: "Cardiovascular Disease Case Finding"
            name_short: "CVD_64: Risk ≥10%, no statin"
            description_short: "Latest CVD risk ≥10%, no statin in the last 12 months"
            description_long: >
              Age 40 to under 84 with latest CVD risk score ≥10% and no
              statin prescribed or recorded in the last 12 months.
              Excludes LTC LCS registers or hyperlipidaemia, palliative
              care, statin unsuitable (adverse reaction, contraindication,
              intolerance or not indicated), statin declined in the last 5
              years, people meeting higher-priority CVD criteria, and high
              CVD risk review declined in the last 3 years.
            is_qof: false
            source_column: "in_cvd_64"
            sort_order: "LTC_LCS_CVD_64"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_CVD_65"
            type: "CASE_FINDING"
            category: "CVD"
            clinical_domain: "Cardiovascular Disease Case Finding"
            name_short: "CVD_65: Lower-intensity statin course"
            description_short: "Latest CVD risk ≥10%, on a statin course outside the high-intensity list"
            description_long: >
              Age 40 to under 84 with latest CVD risk score ≥10% and a
              current repeat statin course other than a listed
              high-intensity product. Excludes LTC LCS registers or
              hyperlipidaemia, palliative care, statin unsuitable (adverse
              reaction, contraindication, intolerance or not indicated),
              lipid-lowering therapy exceptions ever (such as declined or
              maximum tolerated dose), people meeting higher-priority CVD
              criteria, and high CVD risk review declined in the last 3
              years.
            is_qof: false
            source_column: "in_cvd_65"
            sort_order: "LTC_LCS_CVD_65"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_CVD_66"
            type: "CASE_FINDING"
            category: "CVD"
            clinical_domain: "Cardiovascular Disease Case Finding"
            name_short: "CVD_66: 75-<84, no risk score"
            description_short: "Age 75 to under 84, no CVD risk score in the last 5 years"
            description_long: >
              Age 75 to under 84 with no CVD risk score recorded in the
              last 5 years and no statin prescribed or recorded in the
              last 12 months. Excludes LTC LCS registers or
              hyperlipidaemia, palliative care, a Health Check in the last
              2 years, statin unsuitable (adverse reaction,
              contraindication, intolerance or not indicated), statin
              declined in the last 5 years, people meeting higher-priority
              CVD criteria, and high CVD risk review declined in the last
              3 years.
            is_qof: false
            source_column: "in_cvd_66"
            sort_order: "LTC_LCS_CVD_66"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_CYP_AST_61"
            type: "CASE_FINDING"
            category: "CYP_AST"
            clinical_domain: "Children and Young People Asthma Case Finding"
            name_short: "CYP_AST_61: Possible asthma"
            description_short: "Age 18 months to 17, asthma treatment or symptoms"
            description_long: >
              Age 18 months to under 18 with a bronchodilator, inhaled
              corticosteroid or asthma prophylaxis issued in the 12 months
              before today, or prednisolone, montelukast, suspected asthma
              or viral-induced wheeze in the last year. Excludes LTC LCS
              respiratory registers, current coded asthma, and respiratory
              disease screening in the last 3 years.
            is_qof: false
            source_column: "in_cyp_ast_61"
            sort_order: "LTC_LCS_CYP_AST_61"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_DM_61"
            type: "CASE_FINDING"
            category: "DM"
            clinical_domain: "Diabetes Mellitus Case Finding"
            name_short: "DM_61: HbA1c ≥48"
            description_short: "Latest HbA1c ≥48 mmol/mol"
            description_long: >
              Age 17 or over with latest HbA1c ≥48 mmol/mol. Excludes LTC
              LCS registers or hyperlipidaemia, a Health Check in the last
              2 years, diabetes resolved or in remission with no HbA1c
              since, and high diabetes risk annual review declined in the
              last 3 years.
            is_qof: false
            source_column: "in_dm_61"
            sort_order: "LTC_LCS_DM_61"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_DM_62"
            type: "CASE_FINDING"
            category: "DM"
            clinical_domain: "Diabetes Mellitus Case Finding"
            name_short: "DM_62: Gestational DM, no HbA1c in 12m"
            description_short: "Previous gestational diabetes, no HbA1c in the last 12 months"
            description_long: >
              Age 17 or over with gestational diabetes ever and no HbA1c
              in the last 12 months. Excludes LTC LCS registers or
              hyperlipidaemia, a Health Check in the last 2 years, people
              meeting higher-priority diabetes criteria, and high diabetes
              risk annual review declined in the last 3 years.
            is_qof: false
            source_column: "in_dm_62"
            sort_order: "LTC_LCS_DM_62"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_DM_63"
            type: "CASE_FINDING"
            category: "DM"
            clinical_domain: "Diabetes Mellitus Case Finding"
            name_short: "DM_63: HbA1c 46-<48, ≥1 year old"
            description_short: "Latest HbA1c ≥46 and <48 mmol/mol, at least 1 year old"
            description_long: >
              Age 17 or over whose latest HbA1c is ≥46 and <48 mmol/mol
              and at least 1 year old. Excludes LTC LCS registers or
              hyperlipidaemia, a Health Check in the last 2 years, people
              meeting higher-priority diabetes criteria, and high diabetes
              risk annual review declined in the last 3 years.
            is_qof: false
            source_column: "in_dm_63"
            sort_order: "LTC_LCS_DM_63"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_DM_64"
            type: "CASE_FINDING"
            category: "DM"
            clinical_domain: "Diabetes Mellitus Case Finding"
            name_short: "DM_64: High BMI, no HbA1c in 24m"
            description_short: "BMI ≥35 (≥32.5 BAME), no HbA1c in the last 2 years"
            description_long: >
              Age 17 or over with latest BMI ≥35 kg/m², or ≥32.5 kg/m²
              with any BAME ethnicity record, and no HbA1c in the last 2
              years. Excludes LTC LCS registers or hyperlipidaemia, a
              Health Check in the last 2 years, people meeting
              higher-priority diabetes criteria, and high diabetes risk
              annual review declined in the last 3 years.
            is_qof: false
            source_column: "in_dm_64"
            sort_order: "LTC_LCS_DM_64"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_DM_65"
            type: "CASE_FINDING"
            category: "DM"
            clinical_domain: "Diabetes Mellitus Case Finding"
            name_short: "DM_65: BMI 30-<35, no HbA1c in 24m"
            description_short: "BMI 30 to <35 (27.5 to <32.5 BAME), no HbA1c in the last 2 years"
            description_long: >
              Age 17 or over with latest BMI ≥30 and <35 kg/m², or ≥27.5
              and <32.5 kg/m² with any BAME ethnicity record, and no HbA1c
              in the last 2 years. Excludes LTC LCS registers or
              hyperlipidaemia, a Health Check in the last 2 years, people
              meeting higher-priority diabetes criteria, and high diabetes
              risk annual review declined in the last 3 years.
            is_qof: false
            source_column: "in_dm_65"
            sort_order: "LTC_LCS_DM_65"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_DM_66"
            type: "CASE_FINDING"
            category: "DM"
            clinical_domain: "Diabetes Mellitus Case Finding"
            name_short: "DM_66: HbA1c 42-<46, ≥1 year old"
            description_short: "Latest HbA1c ≥42 and <46 mmol/mol, at least 1 year old"
            description_long: >
              Age 17 or over whose latest HbA1c is ≥42 and <46 mmol/mol
              and at least 1 year old. Excludes LTC LCS registers or
              hyperlipidaemia, a Health Check in the last 2 years, people
              meeting higher-priority diabetes criteria, and high diabetes
              risk annual review declined in the last 3 years.
            is_qof: false
            source_column: "in_dm_66"
            sort_order: "LTC_LCS_DM_66"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_HF_61"
            type: "CASE_FINDING"
            category: "HF"
            clinical_domain: "Heart Failure Case Finding"
            name_short: "HF_61: Possible undiagnosed HF"
            description_short: "HF medicines, raised pro-BNP or cardiomyopathy with breathlessness"
            description_long: >
              Sacubitril/valsartan, ivabradine, eplerenone, dapagliflozin,
              empagliflozin, digoxin or spironolactone issued in the last
              3 months; latest pro-BNP >400 with no cardiology referral,
              HF excluded or normal/diastolic-dysfunction echo on or after
              it; latest pro-BNP in the last 2 years >2000 with no HF
              excluded on or after it; or cardiomyopathy with
              breathlessness, neither followed by HF excluded. Excludes
              LTC LCS registers or hyperlipidaemia, prior HF evidence and
              HF excluded in the last 3 years. Spironolactone alone
              doesn't count for females under 40 with hirsutism, acne or
              alopecia.
            is_qof: false
            source_column: "in_hf_61"
            sort_order: "LTC_LCS_HF_61"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_HTN_61"
            type: "CASE_FINDING"
            category: "HTN"
            clinical_domain: "Hypertension Case Finding"
            name_short: "HTN_61: Severely raised BP"
            description_short: "Clinic BP ≥180/120 or home/ABPM ≥170/115 mmHg"
            description_long: >
              Latest clinic BP ≥180 systolic or ≥120 diastolic, or
              home/ABPM ≥170 or ≥115 mmHg. Excludes LTC LCS registers or
              hyperlipidaemia, palliative care, a Health Check in the last
              2 years, any hypertension code (including resolved) or white
              coat hypertension, hypertension screening in the last 3
              years.
            is_qof: false
            source_column: "in_htn_61"
            sort_order: "LTC_LCS_HTN_61"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_HTN_62"
            type: "CASE_FINDING"
            category: "HTN"
            clinical_domain: "Hypertension Case Finding"
            name_short: "HTN_62: Stage 2 BP"
            description_short: "Clinic BP ≥160/100 or home/ABPM ≥150/95 mmHg"
            description_long: >
              Latest clinic BP ≥160 systolic or ≥100 diastolic, or
              home/ABPM ≥150 or ≥95 mmHg. Excludes LTC LCS registers or
              hyperlipidaemia, palliative care, a Health Check in the last
              2 years, any hypertension code (including resolved) or white
              coat hypertension, hypertension screening in the last 3
              years, and people meeting HTN_61 criteria.
            is_qof: false
            source_column: "in_htn_62"
            sort_order: "LTC_LCS_HTN_62"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_HTN_63"
            type: "CASE_FINDING"
            category: "HTN"
            clinical_domain: "Hypertension Case Finding"
            name_short: "HTN_63: Black ethnicity, stage 1 BP, risk"
            description_short: "Black ethnicity, stage 1 BP and a cardiometabolic risk factor"
            description_long: >
              Black ethnicity with latest clinic BP ≥140 systolic or ≥90
              diastolic, or home/ABPM ≥135 or ≥85 mmHg, and a risk factor:
              a CHD, stroke/TIA or PAD code not marked review or ended, a
              CKD or diabetes code, latest eGFR <60 ml/min/1.73m², or
              latest BMI >35 kg/m². Excludes LTC LCS registers or
              hyperlipidaemia, palliative care, a Health Check in the last
              2 years, any hypertension code (including resolved) or white
              coat hypertension, hypertension screening in the last 3
              years, and people meeting higher-priority hypertension
              criteria.
            is_qof: false
            source_column: "in_htn_63"
            sort_order: "LTC_LCS_HTN_63"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_HTN_65"
            type: "CASE_FINDING"
            category: "HTN"
            clinical_domain: "Hypertension Case Finding"
            name_short: "HTN_65: Stage 1 BP with risk"
            description_short: "Stage 1 BP with a CVD risk factor or Black ethnicity"
            description_long: >
              Latest clinic BP ≥140 systolic or ≥90 diastolic, or
              home/ABPM ≥135 or ≥85 mmHg, and a CHD, stroke/TIA or PAD
              code not marked review or ended, a CKD or diabetes code,
              latest eGFR <60 ml/min/1.73m², or Black ethnicity. Excludes
              LTC LCS registers or hyperlipidaemia, palliative care, a
              Health Check in the last 2 years, any hypertension code
              (including resolved) or white coat hypertension,
              hypertension screening in the last 3 years, and people
              meeting higher-priority hypertension criteria.
            is_qof: false
            source_column: "in_htn_65"
            sort_order: "LTC_LCS_HTN_65"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
          - id: "LTC_LCS_CF_HTN_66"
            type: "CASE_FINDING"
            category: "HTN"
            clinical_domain: "Hypertension Case Finding"
            name_short: "HTN_66: Stage 1 BP"
            description_short: "Stage 1 BP without higher-priority criteria"
            description_long: >
              Latest clinic BP ≥140 systolic or ≥90 diastolic, or
              home/ABPM ≥135 or ≥85 mmHg. At 80 and over, excludes people
              whose latest clinic BP is below both 150 and 90, or
              home/ABPM below both 145 and 85. Excludes LTC LCS registers
              or hyperlipidaemia, palliative care, a Health Check in the
              last 2 years, any hypertension code (including resolved) or
              white coat hypertension, hypertension screening in the last
              3 years, and people meeting higher-priority hypertension
              criteria.
            is_qof: false
            source_column: "in_htn_66"
            sort_order: "LTC_LCS_HTN_66"
            usage_contexts:
              - "LTC_LCS_DASHBOARD"
              - "CASE_FINDING_PROGRAMME"
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique person identifier
        tests:
          - not_null
          - unique
