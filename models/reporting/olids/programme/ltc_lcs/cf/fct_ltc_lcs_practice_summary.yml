models:
  - name: fct_ltc_lcs_practice_summary
    description: >-
      LTC LCS case-finding counts for NCL OLIDS, one row per practice with current
      registrants and matching demographics. Denominators include all such people whose
      registration has no end date. Reports indicator counts and the percentage and rate
      per 1,000 meeting any indicator. Each indicator retains its own rules, and people
      can meet several indicators, so indicator counts must not be summed as distinct
      people.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.at_least_one:
          column_name: practice_code
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - practice_code
              - pcn_code
              - borough_registered
              - neighbourhood_registered
    columns:
      - name: practice_code
        tests:
          - not_null
