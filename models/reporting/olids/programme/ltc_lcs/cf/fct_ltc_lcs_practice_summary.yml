models:
  - name: fct_ltc_lcs_practice_summary
    description: >-
      LTC LCS case-finding counts and population denominators, one row per practice
      represented by current registrants with demographic records. Only registrations with
      no recorded end date qualify. Population counts include all such registrants;
      case-finding counts follow the condition-specific rules in dim_ltc_lcs_cf_summary.
      Contains age, ethnicity and IMD 2019 breakdowns, individual indicator counts, and the
      percentage and rate per 1,000 people meeting any case-finding indicator. A person can
      meet several indicators, so indicator counts must not be summed as distinct people.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.at_least_one:
          column_name: practice_code
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - practice_code
              - pcn_code
              - borough_registered
              - neighbourhood_registered
    columns:
      - name: practice_code
        tests:
          - not_null
