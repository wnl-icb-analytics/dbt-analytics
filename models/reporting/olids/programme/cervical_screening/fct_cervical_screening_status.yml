models:
  - name: fct_cervical_screening_status
    description: >-
      Cervical screening programme status for women aged 25 to 64, one row per person,
      assessed on the build date. Includes inactive and deceased people. Status follows
      the QOF v51 CS005/CS006 rule order: cervix removal (NOCX_COD) at any time, then
      completed screening (SMEAR_COD) after the date 42 months (to age 49) or 66 months
      (from 50) before the build date, then unsuitability (CSPU_COD) in the same window,
      then current pregnancy. Pregnancy differs from QOF: it applies at all ages and uses
      fct_person_pregnancy_status (code in last 9 months, no later delivery), whereas
      QOF CS005 counts any pregnancy code in 12 months and CS006 has no pregnancy rule.

      History counts include each person, concept, clinical calendar date and
      recorded numeric value once. A null result is a value-free event, not a
      missing count. Different concepts or values on the same day remain distinct.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        data_tests:
          - not_null
          - unique
      - name: current_age
        description: 'Current age of the person in years'
      - name: is_screening_eligible
        description: 'Eligible for cervical screening: female, aged 25-64 and no complete
          cervix removal'
      - name: screening_interval_years
        description: 'Screening interval in years: 3.5 at ages 25-49, 5.5 at 50-64'
      - name: programme_status
        description: >-
          Programme status, first matching rule: Cervix Removed (any NOCX_COD record);
          Up to Date (completed screening within the interval); Unsuitable (CSPU_COD
          within the interval); Pregnant (currently pregnant); Never Screened; Overdue.
          Completed screening within the interval outranks unsuitability and pregnancy.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Cervix Removed', 'Up to Date', 'Unsuitable', 'Pregnant', 'Never Screened', 'Overdue']
      - name: latest_screening_type
        description: 'Type of the most recent screening observation'
      - name: latest_screening_date
        description: 'Date of the most recent screening observation'
      - name: latest_completed_date
        description: 'Date of the most recent completed screening (SMEAR_COD)'
      - name: next_screening_due_date
        description: 'Latest completed screening plus the QOF window (42 or 66 months); when the person leaves Up to Date, not a clinical recall date. Null without a completed screening or with cervix removal'
      - name: days_overdue
        description: 'Days past next_screening_due_date; populated only when programme_status is Overdue'
      - name: latest_unsuitable_date
        description: 'Latest unsuitability record (CSPU_COD or cervix removal NOCX_COD); null when none'
      - name: first_cervix_removal_date
        description: 'First complete cervix removal record (NOCX_COD); null when none'
      - name: is_currently_pregnant
        description: 'Currently pregnant per fct_person_pregnancy_status: pregnancy code in the last 9 months with no later delivery or outcome code'
      - name: never_screened
        description: 'Flag indicating person has never had a completed screening'
      - name: latest_is_completed
        description: 'Flag indicating if latest observation is a completed screening'
      - name: latest_is_unsuitable
        description: 'Flag indicating if latest observation marks person as unsuitable'
      - name: latest_is_declined
        description: 'Flag indicating if latest observation is a declined screening'
      - name: latest_is_non_response
        description: 'Flag indicating if latest observation is non-response to invitations'
      - name: total_completed_screenings
        description: Distinct completed screening readings by concept, clinical calendar date and recorded value, including null results.
      - name: total_unsuitable_records
        description: Distinct screening unsuitability readings by concept, clinical calendar date and recorded value, including null results.
      - name: total_declined_records
        description: Distinct screening decline readings by concept, clinical calendar date and recorded value, including null results.
      - name: total_non_response_records
        description: Distinct screening non-response readings by concept, clinical calendar date and recorded value, including null results.

unit_tests:
- name: cervical_screening_counts_distinct_readings
  model: fct_cervical_screening_status
  overrides:
    macros:
      get_empty_subquery_sql: SELECT NULL::NUMBER AS person_id, NULL::NUMBER AS total_completed_screenings, NULL::NUMBER AS total_declined_records, NULL::NUMBER AS total_unsuitable_records, NULL::NUMBER AS total_non_response_records WHERE FALSE
  given:
  - input: ref('int_cervical_screening_all')
    format: sql
    rows: |-
      SELECT column1::VARCHAR AS id, column2::NUMBER AS person_id,
          column3::TIMESTAMP_NTZ AS clinical_effective_date, column4::VARCHAR AS concept_code,
          column5::FLOAT AS result_value, TRUE::BOOLEAN AS is_completed_screening, FALSE::BOOLEAN AS is_declined_screening, FALSE::BOOLEAN AS is_unsuitable_screening, FALSE::BOOLEAN AS is_non_response_screening, FALSE::BOOLEAN AS is_cervix_removal
      FROM VALUES ('SYN_A', -145401, '2024-01-01 09:00:00', 'SYN_C', NULL),
      ('SYN_B', -145401, '2024-01-01 18:00:00', 'SYN_C', NULL),
      ('SYN_C', -145401, '2024-01-01', 'SYN_OTHER', NULL),
      ('SYN_D', -145401, '2024-01-02', 'SYN_C', NULL),
      ('SYN_E', -145401, '2024-01-01', 'SYN_C', 0),
      ('SYN_F', -145401, '2024-01-01', 'SYN_C', 1),
      ('SYN_G', -145402, '2024-01-01', 'SYN_C', NULL)
      UNION ALL
      SELECT column1::VARCHAR, -145402::NUMBER, '2024-03-01'::TIMESTAMP_NTZ,
          'SYN_DECLINE'::VARCHAR, NULL::FLOAT, FALSE::BOOLEAN, TRUE::BOOLEAN,
          FALSE::BOOLEAN, FALSE::BOOLEAN, FALSE::BOOLEAN
      FROM VALUES ('SYN_DECLINE_A'), ('SYN_DECLINE_B')
      UNION ALL
      SELECT column1::VARCHAR, -145402::NUMBER, '2024-03-01'::TIMESTAMP_NTZ,
          column2::VARCHAR, NULL::FLOAT, FALSE::BOOLEAN, FALSE::BOOLEAN,
          column3::BOOLEAN, NOT column3::BOOLEAN, FALSE::BOOLEAN
      FROM VALUES ('SYN_UNSUITABLE_A','SYN_UNSUITABLE',TRUE),
          ('SYN_UNSUITABLE_B','SYN_UNSUITABLE',TRUE),
          ('SYN_NON_RESPONSE_A','SYN_NON_RESPONSE',FALSE),
          ('SYN_NON_RESPONSE_B','SYN_NON_RESPONSE',FALSE)
  - input: ref('dim_person_demographics')
    format: sql
    rows: SELECT column1::NUMBER AS person_id, 'Female'::VARCHAR AS gender, 55::NUMBER AS age, TRUE::BOOLEAN
      AS is_active, FALSE::BOOLEAN AS is_deceased FROM VALUES (-145401), (-145402)
  - input: ref('int_cervical_screening_latest')
    format: sql
    rows: SELECT NULL::NUMBER AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::VARCHAR
      AS source_cluster_id, NULL::VARCHAR AS screening_observation_type, NULL::BOOLEAN AS is_completed_screening,
      NULL::BOOLEAN AS is_declined_screening, NULL::BOOLEAN AS is_unsuitable_screening, NULL::BOOLEAN
      AS is_non_response_screening WHERE FALSE
  - input: ref('fct_person_pregnancy_status')
    format: sql
    rows: SELECT NULL::NUMBER AS person_id, NULL::BOOLEAN AS is_currently_pregnant WHERE FALSE
  expect:
    rows:
    - person_id: -145401
      total_completed_screenings: 5
      total_declined_records: 0
      total_unsuitable_records: 0
      total_non_response_records: 0
    - person_id: -145402
      total_completed_screenings: 1
      total_declined_records: 1
      total_unsuitable_records: 1
      total_non_response_records: 1
