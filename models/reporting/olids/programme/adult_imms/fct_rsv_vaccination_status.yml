models:
  - name: fct_rsv_vaccination_status
    description: >
      RSV vaccination status for people in the current RSV cohorts, dose 1 only. One row
      per person in int_adult_imms_current_population (currently registered, not deceased,
      aged 18 or over) who is aged 75 or over, lives in a care home or is currently
      pregnant. vaccination_status is VACCINATION_ADMINISTERED from
      int_adult_imms_rsv_vaccination_given, VACCINATION_DECLINED from
      int_adult_imms_rsv_vaccination_declined, or NO_VACCINATION_RECORD. Records cover the
      RSV_1 (age), RSV_1B (care home) and RSV_1C (maternity) vaccine IDs, so maternity
      vaccinations are included. The 65 to 74 clinical risk cohort is not included.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        tests:
          - not_null
          - unique

