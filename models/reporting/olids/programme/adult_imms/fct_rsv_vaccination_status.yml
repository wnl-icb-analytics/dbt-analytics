models:
  - name: fct_rsv_vaccination_status
    description: >
      RSV dose 1 status for registered adults aged 75+, care home residents and pregnant
      people. One row per person. Excludes the 65 to 74 clinical risk cohort. The population
      is currently registered, living people aged 18+ in int_adult_imms_current_population
      who meet one of those criteria. vaccination_status is VACCINATION_ADMINISTERED,
      VACCINATION_DECLINED or NO_VACCINATION_RECORD. Records cover the RSV_1 age, RSV_1B
      care home and RSV_1C maternity vaccine IDs, so maternity vaccinations are included.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        tests:
          - not_null
          - unique

