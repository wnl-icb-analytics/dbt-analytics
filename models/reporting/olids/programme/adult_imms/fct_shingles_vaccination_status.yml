models:
  - name: fct_shingles_vaccination_status
    description: 'Shingles vaccination programme status for people who turned 65
      after 1st Sept 2023, people currently aged 70-79 (catch-up campaign) and
      immunosuppressed adults aged 18+. Multiple
      lines per person - dose 1 status and dose 2 status'
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        tests:
          - not_null

