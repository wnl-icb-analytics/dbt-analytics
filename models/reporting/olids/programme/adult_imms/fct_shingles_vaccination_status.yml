models:
  - name: fct_shingles_vaccination_status
    description: 'Shingles vaccination status for currently registered, living adults
      aged 70-79, born after 1 September 1957 and on or before 1 September 1958
      (approximate birth date), or immunosuppressed and aged 18+. Multiple rows per
      person: one per recorded dose and status; people with no record have one dose 1
      row.'
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        tests:
          - not_null

