
models:
  - name: fct_covid_uptake
    description: >-
      COVID vaccination uptake for NCL OLIDS, one row per person, reported campaign,
      eligible risk group and subcohort. Covers people registered and alive in the
      campaign population month, including all eligible people and non-eligible people
      with vaccination or decline evidence. Administration takes precedence over decline
      and no record; non-eligible people have no risk group. People can appear in
      several groups, so use distinct-person counts for headcounts.
    config:
      meta:
        indicator:
          id: "COVID_UPTAKE_COVERAGE"
          type: "PROGRAMME"
          category: "COVID"
          clinical_domain: "Programme Management"
          name_short: "COVID Uptake Coverage"
          description_short: "COVID vaccination uptake facts without demographics"
          description_long: >
            COVID vaccination uptake fact table combining eligibility determination
            with vaccination status to provide core uptake metrics. Focused on uptake
            business
            process without demographics. Supports programme monitoring and performance
            assessment. Join with dim_person_demographics for demographic analysis
            and
            published_reporting_direct_care.covid_flu_dashboard_base for dashboard
            consumption.
          is_qof: false
          source_column: "uptake_category"
          sort_order: "COVID_102_UPTAKE_COVERAGE"
          usage_contexts:
            - "COVID_REPORTING"
            - "COVID_AND_FLU_DASHBOARD"
          code_clusters:
            - cluster_id: "COVADM_COD"
              category: "INCLUSION"
            - cluster_id: "COVRX_COD"
              category: "INCLUSION"
            - cluster_id: "COVDECL_COD"
              category: "REFINEMENT"
          thresholds:
            - population_group: "NATIONAL_TARGET"
              threshold_type: "COVERAGE_RATE"
              threshold_value: "75"
              threshold_operator: "TARGET"
              threshold_unit: "percentage"
              description: "National COVID vaccination coverage target"
              sort_order: 1
            - population_group: "HIGH_RISK_GROUPS"
              threshold_type: "COVERAGE_RATE"
              threshold_value: "85"
              threshold_operator: "TARGET"
              threshold_unit: "percentage"
              description: "High-risk group coverage target"
              sort_order: 2

        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        description: COVID campaign identifier
        tests:
          - not_null

      - name: person_id
        description: Unique person identifier
        tests:
          - not_null

      - name: is_eligible
        description: Whether person is eligible for COVID vaccination

      - name: campaign_category
        description: Category of eligibility

      - name: risk_group
        description: Specific risk group classification

      - name: subcohort
        description: Subcohort classification for Covid Autumn 2024 campaign

      - name: eligibility_reason
        description: Reason for eligibility

      - name: rule_type
        description: Type of eligibility rule

      - name: vaccination_status
        description: Vaccination status

      - name: vaccination_date
        description: Date of vaccination (if vaccinated)

      - name: vaccinated
        description: >-
          True when a COVID vaccination was recorded on or after campaign start.

      - name: declined
        description: >-
          True when a COVID decline was recorded on or after the campaign's
          decline-tracking start.

      - name: eligible_no_record
        description: Whether eligible person has no vaccination record

      - name: uptake_category
        description: Categorised uptake status

      - name: days_to_vaccination
        description: Days from campaign start to vaccination

      - name: campaign_start_date
        description: Campaign start date

      - name: campaign_reference_date
        description: Campaign reference date for age calculations
