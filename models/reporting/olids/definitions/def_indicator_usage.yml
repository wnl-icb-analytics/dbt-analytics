models:
  - name: def_indicator_usage
    description: >-
      Declared reporting uses of clinical indicators. One row per indicator and usage context.


      Contexts identify dashboards, reports or programmes named in indicator metadata. An
      indicator without a declared context has no row; this table does not measure actual query
      activity.

    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: indicator_id
        description: >-
          Indicator identifier used to link to def_indicator.

        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('def_indicator')
                field: indicator_id
      - name: usage_context
        description: Where this indicator is used
        tests:
          - not_null

      - name: metadata_extracted_at
        description: >-
          Timestamp when the catalogue table was built from indicator metadata.

        tests:
          - not_null
