models:
  - name: def_indicator_thresholds
    description: >-
      Clinical thresholds declared in indicator metadata. One row per declared threshold for an
      indicator and population group.


      Values describe targets, diagnostic criteria or risk boundaries, with their comparison
      operator and unit. Only declared thresholds are included; source models can apply rules
      that are not listed here.

    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: indicator_id
        description: >-
          Indicator identifier used to link to def_indicator.

        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('def_indicator')
                field: indicator_id
      - name: population_group
        description: >-
          Population label to which the declared threshold applies, such as AGE_LT_80 or T2DM.

        tests:
          - not_null

      - name: threshold_type
        description: >-
          Declared purpose of the threshold, such as TARGET_UPPER or DIAGNOSIS_S1_CLINIC.

        tests:
          - not_null

      - name: threshold_value
        description: >-
          Threshold stored as text, including paired values such as 140/90; interpret with
          threshold_operator and threshold_unit.

        tests:
          - not_null

      - name: threshold_operator
        description: >-
          Declared comparison, such as BELOW, AT_OR_ABOVE or BETWEEN.

        tests:
          - not_null

      - name: threshold_unit
        description: Unit of measurement (mmHg, kg/m², score, percentage)
        tests:
          - not_null

      - name: description
        description: Human-readable description of the threshold
        tests:
          - not_null

      - name: sort_order
        description: >-
          Declared threshold ordering; otherwise its position in the indicator metadata.

        tests:
          - not_null

      - name: metadata_extracted_at
        description: >-
          Timestamp when the catalogue table was built from indicator metadata.
