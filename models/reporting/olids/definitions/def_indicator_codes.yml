models:
  - name: def_indicator_codes
    description: >-
      SNOMED codes listed in indicator metadata. One row per indicator, code-list identifier,
      code category and matching code-list record.


      Only code lists declared in indicator metadata are included. This is not a complete list
      of every code used by a source model. Code descriptions come from the reference code
      lists; missing or blank descriptions are replaced by a message containing the code.

    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: indicator_id
        description: >-
          Indicator identifier used to link to def_indicator.

        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('def_indicator')
                field: indicator_id
      - name: cluster_id
        description: Source cluster from reference data (e.g., DM_COD, DMRES_COD)
        tests:
          - not_null

      - name: code_category
        description: >-
          Declared purpose of the code list, such as INCLUSION, EXCLUSION or RESOLUTION.

        tests:
          - not_null

      - name: code_system
        description: >-
          SNOMED for every row.

        tests:
          - not_null

      - name: code
        description: The specific SNOMED code value
        tests:
          - not_null

      - name: code_description
        description: >-
          Reference description of the code; missing or blank descriptions are replaced by a
          message containing the code.

        tests:
          - not_null

      - name: metadata_extracted_at
        description: >-
          Timestamp when the catalogue table was built from indicator metadata.

        tests:
          - not_null
