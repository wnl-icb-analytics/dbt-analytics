
models:
  - name: def_indicator_summary
    description: >-
      Indicator definitions with declared uses and code counts. One row per indicator.


      Contains programme, clinical classification, display labels, source model and column,
      usage flags and counts of declared SNOMED inclusion and resolution codes. Indicators
      without declared uses have null usage fields and flags. Missing code counts are zero. Use
      def_indicator for the full definition.

    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: indicator_id
        description: >-
          Indicator identifier used to link to def_indicator.

        tests:
          - not_null
          - unique

      - name: indicator_type
        description: High-level indicator classification
        tests:
          - not_null

      - name: programme
        description: Programme that owns the indicator, from def_indicator.

      - name: clinical_domain
        description: >-
          Clinical domain from the indicator classification list or the long-term condition
          lookup.

      - name: clinical_subdomain
        description: >-
          Long-term condition name for condition-specific indicators; otherwise the
          classification topic.

      - name: category
        description: Indicator category for grouping
        tests:
          - not_null

      - name: name_short
        description: Brief display name
        tests:
          - not_null

      - name: description_short
        description: One-line description for tooltips
        tests:
          - not_null

      - name: source_model
        description: >-
          Name of the model that supplies the indicator flag or result.

        tests:
          - not_null

      - name: source_column
        description: >-
          Column in source_model that supplies the indicator flag or result.

        tests:
          - not_null

      - name: is_qof
        description: >-
          Whether the source definition has a Quality and Outcomes Framework correspondence.
          This does not make NICE results QOF payment measures.

        tests:
          - not_null

      - name: qof_indicator
        description: >-
          Corresponding QOF code; null when no QOF correspondence is declared. Retired codes can
          remain as references.

      - name: usage_contexts
        description: >-
          Declared usage contexts, sorted alphabetically and separated by commas; null when none
          are declared.

      - name: in_pop_health_dashboard
        description: >-
          True when Population Health Needs Dashboard use is declared; false for other declared
          uses, null when no uses are declared.

        tests:
          - not_null

      - name: in_qof
        description: >-
          True when QOF use is declared; false for other declared uses, null when no uses are
          declared.

        tests:
          - not_null

      - name: inclusion_code_count
        description: >-
          Number of distinct SNOMED inclusion codes in declared code lists; zero when none
          match.

        tests:
          - not_null

      - name: resolution_code_count
        description: >-
          Number of distinct SNOMED resolution codes in declared code lists; zero when none
          match.

        tests:
          - not_null

      - name: cluster_count
        description: >-
          Number of distinct declared code lists with matching SNOMED records; zero when none
          match.

        tests:
          - not_null

      - name: metadata_extracted_at
        description: >-
          Timestamp when the catalogue table was built from indicator metadata.

        tests:
          - not_null
