
models:
  - name: def_indicator
    description: >-
      Clinical indicator definitions, one row per indicator from model and column
      YAML metadata, with programme and clinical classification from indicator_classification.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: indicator_id
        description: Unique identifier for the indicator (e.g., COND_DM, 
          BRF_BMI)
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('indicator_classification')
                field: indicator_id

      - name: indicator_type
        description: High-level indicator classification

      - name: programme
        description: Programme that owns the indicator, from indicator_classification.
        data_tests:
          - not_null

      - name: clinical_domain
        description: >-
          Clinical domain from indicator_classification or its LTC condition lookup.
          YAML meta clinical_domain values are no longer used by the catalogue.
        data_tests:
          - not_null

      - name: clinical_subdomain
        description: LTC condition name for condition-specific indicators; otherwise the classification topic.
        data_tests:
          - not_null

      - name: category
        description: Indicator category for grouping and filtering

      - name: name_short
        description: Brief display name for dashboards and reports

      - name: description_short
        description: One-line description for tooltips and summary views

      - name: description_long
        description: Detailed definition including clinical criteria and logic
      - name: source_model
        description: dbt model containing this indicator's data

      - name: source_column
        description: Column name in the source model
      - name: is_qof
        description: Whether this is a Quality and Outcomes Framework indicator

      - name: qof_indicator
        description: Specific QOF indicator code (e.g., DM017, HYP001)

      - name: sort_order
        description: Sort key for consistent ordering in reports

      - name: metadata_extracted_at
        description: Timestamp when metadata was extracted from YAML
