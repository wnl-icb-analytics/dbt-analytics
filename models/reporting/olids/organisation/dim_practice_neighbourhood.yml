models:
  - name: dim_practice_neighbourhood
    description: >-
      Current borough and neighbourhood assignments for active NCL practices in
      practice_wnl_active, one row per practice code. Population is restricted to the NCL
      sub-ICB code configured by ncl_sub_icb(). Includes practice name, registered borough
      and maintained neighbourhood name and code.

    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: practice_code
        description: 'Practice ODS code'
        tests:
          - not_null
          - unique

      - name: practice_name
        description: 'Practice name'
        tests:
          - not_null

      - name: local_authority
        description: 'Local authority where practice is located for administrative
          boundary analysis'

      - name: neighbourhood_registered
        description: 'Practice neighbourhood grouping to support integrated neighbourhood programme (name)'
      
      - name: neighbourhood_code
        description: 'Practice neighbourhood grouping to support integrated neighbourhood programme (code)'
