models:
  - name: fct_organisation_active_patients
    description: >-
      Current active patient count per non-obsolete organisation in NCL OLIDS. Counts
      currently registered people who are not deceased or test patients, using the
      owning organisation on their patient record. Organisations with no qualifying
      people are excluded.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: organisation_id
        description: 'OLIDS internal organisation ID'
        tests:
          - not_null
          - unique

      - name: ods_code
        description: 'Organisation ODS code (NHS organisational code)'
        tests:
          - not_null

      - name: measure_id
        description: 'Standardised measure identifier (ORGANISATION_ACTIVE_LIST_SIZE)'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ORGANISATION_ACTIVE_LIST_SIZE']

      - name: active_patient_count
        description: 'Current number of active patients registered with this organisation'
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0