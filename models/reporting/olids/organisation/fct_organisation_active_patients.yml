models:
  - name: fct_organisation_active_patients
    description: >-
      Current active patient counts from NCL OLIDS GP records, one row per
      non-obsolete OLIDS organisation with at least one qualifying person.
      Counts people in dim_person_active_patients, which requires a current
      registration and excludes deceased and test patients. Attribution uses
      the patient record's owning organisation code. Organisations without
      qualifying people have no row. measure_id is
      ORGANISATION_ACTIVE_LIST_SIZE.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: organisation_id
        description: 'OLIDS internal organisation ID'
        tests:
          - not_null
          - unique

      - name: ods_code
        description: 'Organisation ODS code (NHS organisational code)'
        tests:
          - not_null

      - name: measure_id
        description: 'Standardised measure identifier (ORGANISATION_ACTIVE_LIST_SIZE)'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ORGANISATION_ACTIVE_LIST_SIZE']

      - name: active_patient_count
        description: 'Current number of active patients registered with this organisation'
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0