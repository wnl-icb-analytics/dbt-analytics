models:
  - name: dim_practice_active
    description: >-
      Operationally active GP practices in the London organisation catalogue
      in dim_practice, one row per OLIDS organisation identifier. ODS status
      must be Active and the practice end date must be absent or later than
      the build date. Includes the same organisation, PCN, commissioner,
      geography and practice fields as dim_practice. Catalogue inclusion does
      not establish OLIDS patient or activity coverage outside NCL.

    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: organisation_id
        description: 'OLIDS internal organisation ID for practice'
        tests:
          - not_null
          - unique

      - name: practice_code
        description: 'Practice ODS code'
        tests:
          - not_null

      - name: practice_name
        description: 'Cleaned practice name'
        tests:
          - not_null

      - name: is_active_practice
        description: 'Always TRUE in this model'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true]
