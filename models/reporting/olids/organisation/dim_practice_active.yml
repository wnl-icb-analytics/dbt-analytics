models:
  - name: dim_practice_active
    description: >-
      Active London GP practices from dim_practice, one row per selected OLIDS
      organisation ID. Requires ODS status Active and an end date that is absent or
      after the build date.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: organisation_id
        description: 'OLIDS internal organisation ID for practice'
        tests:
          - not_null
          - unique

      - name: practice_code
        description: 'Practice ODS code'
        tests:
          - not_null

      - name: practice_name
        description: 'Cleaned practice name'
        tests:
          - not_null

      - name: is_active_practice
        description: 'Always TRUE in this model'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true]
