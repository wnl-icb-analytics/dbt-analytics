models:
  - name: fct_person_polypharmacy_current
    description: |
      Current polypharmacy status per person.

      Grain: One row per person in dim_person with current polypharmacy medications

      Inclusion criteria:
      - People represented in dim_person
      - Persons with at least 1 current polypharmacy-scope medication
      - Repeat prescriptions only (authorisation_type = '182918009')
      - Polypharmacy-scope medications (via int_polypharmacy_medications_list)
      - Active supply (order date + duration >= today)

      Polypharmacy scope uses exclusion-based filtering:
      - Excludes most infections (except HIV and hepatitis antivirals)
      - Excludes vitamins, minerals, nutrition products
      - Excludes contraceptives, thyroid drugs, topicals
      - Excludes devices, dressings, appliances
      - See int_polypharmacy_medications_list for complete scope definition

      Polypharmacy thresholds:
      - Standard polypharmacy: 5+ medications
      - Severe/complex polypharmacy: 10+ medications

      Person-level snapshot for reporting. Join to demographic tables for population analysis.

    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Person identifier
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_person')
                field: person_id
      - name: medication_count
        description: Count of current polypharmacy-scope medications
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: medication_bnf_list
        description: Array of BNF codes for current medications
        data_tests:
          - not_null

      - name: medication_name_list
        description: Array of BNF medication names for current medications
        data_tests:
          - not_null

      - name: polypharmacy_status_date
        description: Earliest order date among current medications

      - name: is_polypharmacy_5plus
        description: Standard polypharmacy flag (5+ medications)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: is_polypharmacy_10plus
        description: Severe/complex polypharmacy flag (10+ medications)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: medication_count_band
        description: Medication count grouped into reporting bands (1-4, 5-9, 10-14, 15+)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1-4', '5-9', '10-14', '15+']

unit_tests:
- name: polypharmacy_reporting_preserves_person_population
  model: fct_person_polypharmacy_current
  given:
  - input: ref('dim_person')
    format: sql
    rows: |-
      select -18315::number person_id
  - input: ref('int_polypharmacy_current')
    format: sql
    rows: |-
      select column1::number person_id,5::number medication_count,array_construct('SYN_BNF') medication_bnf_list,
       array_construct('Synthetic medicine') medication_name_list,current_date()::date polypharmacy_status_date,
       true::boolean is_polypharmacy_5plus,false::boolean is_polypharmacy_10plus from values (-18315),(-18316)
  expect:
    format: sql
    rows: |-
      select -18315::number person_id,5::number medication_count
  overrides:
    macros:
      get_empty_subquery_sql: >-
        select null::number as person_id, null::number as medication_count where false
