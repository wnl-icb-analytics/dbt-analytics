models:
  - name: fct_person_polypharmacy_current
    description: |
      Estimated current repeat chemical count, one row per person in dim_person
      with at least one in-scope supply. Counts nine-character BNF chemicals in
      chapters 01 to 04 and 06 to 10. Brands, strengths and formulations count once;
      fixed combinations count once under their own chemical code, without splitting
      ingredients. Uses the local supply and cancellation rules in
      int_medication_orders_repeat_current. Five or more is a local threshold and
      ten or more supports medication review prioritisation. Bands are 1-4, 5-9,
      10-14 and 15+. These GP-issued repeat estimates differ from NHSBSA monthly acute
      and repeat dispensing comparators, whose thresholds are 8, 10, 15 and 20.
      Product arrays retain full BNF codes/names and can exceed the chemical count.

    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Person identifier
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_person')
                field: person_id
      - name: medication_count
        description: Count of distinct current nine-character BNF chemicals in scope
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: medication_bnf_list
        description: Array of BNF codes for current medications
        data_tests:
          - not_null

      - name: medication_name_list
        description: Array of BNF medication names for current medications
        data_tests:
          - not_null

      - name: polypharmacy_status_date
        description: Earliest order date among current medications

      - name: is_polypharmacy_5plus
        description: Local flag for at least five current BNF chemicals
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: is_polypharmacy_10plus
        description: Flag for at least ten current BNF chemicals, supporting medication review prioritisation
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: medication_count_band
        description: Medication count grouped into reporting bands (1-4, 5-9, 10-14, 15+)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1-4', '5-9', '10-14', '15+']

unit_tests:
- name: polypharmacy_reporting_preserves_person_population
  model: fct_person_polypharmacy_current
  given:
  - input: ref('dim_person')
    format: sql
    rows: |-
      select -18315::number person_id
  - input: ref('int_polypharmacy_current')
    format: sql
    rows: |-
      select column1::number person_id,5::number medication_count,array_construct('SYN_BNF') medication_bnf_list,
       array_construct('Synthetic medicine') medication_name_list,current_date()::date polypharmacy_status_date,
       true::boolean is_polypharmacy_5plus,false::boolean is_polypharmacy_10plus from values (-18315),(-18316)
  expect:
    format: sql
    rows: |-
      select -18315::number person_id,5::number medication_count
  overrides:
    macros:
      get_empty_subquery_sql: >-
        select null::number as person_id, null::number as medication_count where false
