models:
  - name: fct_person_medications_recent
    description: >-
      Prescribing in the 365 days to the build date in OLIDS, one row per person with
      a named medication order. Includes repeat and non-repeat orders, without a
      current-registration restriction. Distinct medicines use BNF names where
      available, otherwise recorded names. Active-ingredient counts exclude medicines
      without a dm+d Virtual Therapeutic Moiety (VTM) mapping.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: person_id
        description: Person identifier
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_person')
                field: person_id
      - name: medications_repeat
        description: Array of medication objects for medicines currently on repeat. A medicine is a current repeat when its latest repeat-authorised order (int_medication_orders_repeat_current) has not run out, based on order date plus duration (28 days if missing), and that order falls in the last year. Each object contains 'medication_name' only; prescription counts are omitted because only the latest repeat order is flagged. Empty array if none.
        data_tests:
          - not_null

      - name: medications_non_repeat
        description: Array of medication objects for last-year (365 days) medicines that are not current repeats, i.e. medications_recent_12mo with the medicines in medications_repeat removed (matched on medication name). Each object contains 'medication_name' and 'prescription_count' as in medications_recent_12mo. Empty array if none.
        data_tests:
          - not_null

      - name: medications_recent_30d
        description: Array of medication objects for prescriptions in last 30 days. Each object contains 'medication_name' and 'prescription_count'. Empty array if no medications in last 30 days.
        data_tests:
          - not_null

      - name: total_prescriptions_30d
        description: Total count of prescription orders in the last 30 days
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unique_medication_count_30d
        description: >-
          Distinct medicines prescribed in the last 30 days, using the BNF name where
          available, otherwise the recorded medication name.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unique_active_ingredient_count_30d
        description: Count of distinct active ingredients (VTMs) prescribed in the last 30 days. Medications without VTM mapping are excluded from this count.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: medications_recent_12mo
        description: Array of medication objects for prescriptions in last year (365 days). Each object contains 'medication_name' and 'prescription_count'. Empty array if no medications in last year.
        data_tests:
          - not_null

      - name: total_prescriptions_12mo
        description: Total count of prescription orders in the last year (365 days)
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unique_medication_count_12mo
        description: >-
          Distinct medicines prescribed in the last 365 days, using the BNF name where
          available, otherwise the recorded medication name.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unique_active_ingredient_count_12mo
        description: Count of distinct active ingredients (VTMs) prescribed in the last year (365 days). Medications without VTM mapping are excluded from this count.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unique_repeat_medication_count
        description: Count of distinct medication names in medications_repeat (current repeat medicines whose latest order is within the last year).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
