models:
  - name: fct_person_medications_recent
    description: >-
      Prescribing in the 365 days to the build date in OLIDS, one row per person in dim_person with
      a named medication order. Includes repeat and non-repeat orders, without a
      current-registration restriction. Distinct medicines use BNF names where
      available, otherwise recorded names. Active-ingredient counts exclude medicines
      without a dm+d Virtual Therapeutic Moiety (VTM) mapping.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: person_id
        description: Person identifier
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_person')
                field: person_id
      - name: medications_repeat
        description: >-
          Array of medication objects for current repeats whose latest repeat-authorised
          order (int_medication_orders_repeat_current) falls in the last year and has
          supply left. Supply uses recorded duration of 1 to 365 days or a local
          28-day fallback. Cancellation of the latest issue's authorisation ends
          supply from that date, even if an older authorisation's issue has supply
          left; cancellations of other authorisations are ignored; a later issue
          from an uncancelled authorisation restarts supply. Each object contains
          'medication_name' only; prescription counts are omitted because only the
          latest repeat order is flagged. Empty array if none.
        data_tests:
          - not_null

      - name: medications_non_repeat
        description: Array of medication objects for last-year (365 days) medicines that are not current repeats, i.e. medications_recent_12mo with the medicines in medications_repeat removed (matched on medication name). Each object contains 'medication_name' and 'prescription_count' as in medications_recent_12mo. Empty array if none.
        data_tests:
          - not_null

      - name: medications_recent_30d
        description: Array of medication objects for prescriptions in last 30 days. Each object contains 'medication_name' and 'prescription_count'. Empty array if no medications in last 30 days.
        data_tests:
          - not_null

      - name: total_prescriptions_30d
        description: Total count of prescription orders in the last 30 days
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unique_medication_count_30d
        description: >-
          Distinct medicines prescribed in the last 30 days, using the BNF name where
          available, otherwise the recorded medication name.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unique_active_ingredient_count_30d
        description: Count of distinct active ingredients (VTMs) prescribed in the last 30 days. Medications without VTM mapping are excluded from this count.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: medications_recent_12mo
        description: Array of medication objects for prescriptions in last year (365 days). Each object contains 'medication_name' and 'prescription_count'. Empty array if no medications in last year.
        data_tests:
          - not_null

      - name: total_prescriptions_12mo
        description: Total count of prescription orders in the last year (365 days)
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unique_medication_count_12mo
        description: >-
          Distinct medicines prescribed in the last 365 days, using the BNF name where
          available, otherwise the recorded medication name.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unique_active_ingredient_count_12mo
        description: Count of distinct active ingredients (VTMs) prescribed in the last year (365 days). Medications without VTM mapping are excluded from this count.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unique_repeat_medication_count
        description: Count of distinct medication names in medications_repeat (current repeat medicines whose latest order is within the last year).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

unit_tests:
- name: medications_recent_named_eligible_orders_in_person_population
  model: fct_person_medications_recent
  given:
  - input: ref('dim_person')
    format: sql
    rows: |-
      select -18315::number person_id
  - input: ref('int_medication_orders_repeat_current')
    format: sql
    rows: |-
      select null::number person_id,null::varchar mapped_concept_code,null::date latest_order_date where false
  - input: ref('stg_reference_bnf_latest')
    format: sql
    rows: |-
      select null::varchar snomed_code,null::varchar bnf_name,null::varchar vtm,null::varchar vtm_name where false
  - input: ref('stg_olids_medication_order')
    format: sql
    rows: |-
      select person::number person_id,'SYN_UNMAPPED'::varchar patient_id,'SYN_PRODUCT'::varchar mapped_concept_code,
       dateadd(day,days,current_date())::date clinical_effective_date,name::varchar medication_name,null::varchar statement_medication_name
       from (values (-18315,-10,'Synthetic named medicine'),(-18316,-10,'Synthetic named medicine'),
       (-18315,1,'Synthetic future medicine'),(-18315,-10,null)) v(person,days,name)
  expect:
    format: sql
    rows: |-
      select -18315::number person_id,1::number total_prescriptions_12mo,1::number total_prescriptions_30d
  overrides:
    macros:
      get_empty_subquery_sql: >-
        select null::number as person_id, null::number as total_prescriptions_12mo, null::number as total_prescriptions_30d where false
