models:
  - name: fct_person_smoking_status
    description: >
      Current and historical smoking status based on the latest smoking observation,
      with one row per person. This person attribute is not SMOK1_REG. SMOK1_REG is
      the QOF co-morbidity denominator for smoking indicators and is not implemented
      in this repository.
    config:
      meta:
        indicator:
          id: "BRF_SMOKING_STATUS"
          type: "RISK_FACTOR"
          category: "BEHAVIOURAL_RISK_FACTOR"
          clinical_domain: "Lifestyle"
          name_short: "Smoking Status"
          description_short: "Latest recorded smoking status, including non-smokers with unknown past history"
          description_long: >
            Latest recorded smoking status using LSMOK_COD, EXSMOK_COD, NSMOK_COD
            and SMOK_COD concept 405746006. Categories are Never Smoked, Ex-Smoker,
            Current Smoker and Non-Smoker (History Unknown). The last category
            records current non-smoking without establishing past history.
            Status-free pack-years and unknown-consumption records are excluded.
            On the same calendar date, current smoker, ex-smoker and never-smoked
            evidence take priority in that order over unknown-history non-smoker
            evidence. This is a person
            attribute, not SMOK1_REG. SMOK1_REG selects people with specified
            co-morbidities as the denominator for QOF smoking indicators and is not
            implemented here.
          is_qof: false
          source_column: "smoking_status"
          sort_order: "BRF_2_SMOKING"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
          code_clusters:
            - cluster_id: "LSMOK_COD"
              category: "INCLUSION"
            - cluster_id: "EXSMOK_COD"
              category: "INCLUSION"
            - cluster_id: "NSMOK_COD"
              category: "INCLUSION"
            - cluster_id: "SMOK_COD"
              category: "INCLUSION"
              description: "Only SNOMED CT 405746006, current non-smoker with unknown past history"
          thresholds:
            - population_group: "ALL"
              threshold_type: "CURRENT_SMOKER"
              threshold_value: "Current Smoker"
              threshold_operator: "EQUALS"
              threshold_unit: "status"
              description: "Current smoking status - active risk requiring intervention"
              sort_order: 1
            - population_group: "ALL"
              threshold_type: "EX_SMOKER"
              threshold_value: "Ex-Smoker"
              threshold_operator: "EQUALS"
              threshold_unit: "status"
              description: "Ex-smoking status - past risk requiring relapse monitoring"
              sort_order: 2
            - population_group: "ALL"
              threshold_type: "NEVER_SMOKER"
              threshold_value: "Never Smoked"
              threshold_operator: "EQUALS"
              threshold_unit: "status"
              description: "Never smoking status - lowest risk"
              sort_order: 3

        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

      - name: age
        description: Person's current age

      - name: smoking_status
        description: Current smoking status (Never Smoked, Ex-Smoker, Current Smoker, Non-Smoker (History Unknown), Unknown)
        data_tests:
          - accepted_values:
              arguments:
                values: ['Never Smoked', 'Ex-Smoker', 'Current Smoker', 'Non-Smoker (History Unknown)', 'Unknown']
      - name: smoking_risk_sort_key
        description: Smoking risk level (1=Never, 2=Ex-smoker, 3=Current smoker, 0=Unknown)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 3
      - name: latest_smoking_date
        description: Date of most recent smoking status observation

      - name: earliest_smoking_date
        description: Date of earliest smoking status observation

      - name: latest_concept_code
        description: SNOMED concept code for most recent smoking observation

      - name: latest_code_description
        description: Description of most recent smoking concept code

      - name: latest_cluster_id
        description: Code cluster ID for most recent smoking observation

      - name: all_smoking_concept_codes
        description: Array of all smoking concept codes for this person

      - name: all_smoking_concept_displays
        description: Array of all smoking concept display terms for this person
