models:
  - name: dim_person_active_patients
    description: >-
      Currently registered people in NCL OLIDS who are not recorded as deceased or test
      patients, one row per person. Where several registrations are current, the latest
      start date determines the patient and practice record.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

      - name: is_active
        description: Flag indicating if person is an active patient
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true] # This table only contains active patients