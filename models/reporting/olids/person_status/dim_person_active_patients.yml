models:
  - name: dim_person_active_patients
    description: >-
      Currently registered OLIDS people who are not recorded as deceased or test patients,
      one row per person. Current registration follows int_patient_registrations. If several
      registrations are current, the latest start date determines the selected patient and
      practice record. Includes registration history counts and the patient record's owning
      organisation code.

    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

      - name: is_active
        description: Flag indicating if person is an active patient
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true] # This table only contains active patients