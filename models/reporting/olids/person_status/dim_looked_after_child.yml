models:
  - name: dim_looked_after_child
    description: >-
      People aged under 25 with a recorded code in the LOOKED_AFTER_CHILD
      cluster, one row per person with a matching dim_person_demographics
      record. The OLIDS population comes from NCL GP records. Includes
      inactive and deceased people. No observation-date, resolution or
      current-registration rule is applied, so membership describes recorded
      evidence rather than confirmed current looked-after status.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique


