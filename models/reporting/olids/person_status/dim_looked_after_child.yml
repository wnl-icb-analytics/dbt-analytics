models:
  - name: dim_looked_after_child
    description: >-
      Recorded looked-after-child evidence per person aged under 25 in NCL OLIDS with a
      demographic record. Uses LOOKED_AFTER_CHILD codes, without date, resolution or
      current-registration restrictions. Inactive and deceased people remain included. A
      record does not confirm current looked-after status.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique


