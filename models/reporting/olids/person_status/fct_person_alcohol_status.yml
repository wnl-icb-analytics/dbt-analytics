
models:
  - name: fct_person_alcohol_status
    description: 'Combined alcohol risk assessment from screening and diagnoses.

      One row per person with any alcohol-related data, integrating AUDIT/AUDIT-C
      scores with alcohol disorder diagnoses. Any disorder record takes precedence
      over AUDIT, regardless of age. There is no 12-month conflict window.
      Valid AUDIT records use the latest clinical date. Same-day records
      prefer full AUDIT over AUDIT-C, then the highest total, latest recorded date
      and observation id.'
    config:
      meta:
        indicator:
          id: "BRF_ALCOHOL_STATUS"
          type: "RISK_FACTOR"
          category: "BEHAVIOURAL_RISK_FACTOR"
          clinical_domain: "Lifestyle"
          name_short: "Alcohol Status"
          description_short: "Population alcohol status combining AUDIT screening
            and clinical diagnoses"
          description_long: >
            Population alcohol status combining AUDIT/AUDIT-C screening scores with
            clinical diagnoses of alcohol misuse disorders. Includes non-drinkers
            through
            to alcohol dependence, integrating screening tools and formal diagnoses.
            Any disorder record takes precedence over AUDIT, regardless of age.
            There is no 12-month conflict window. Supports population health monitoring, intervention
            planning, and clinical care pathways.
          is_qof: false
          source_column: "alcohol_status"
          sort_order: "BRF_3_ALCOHOL_STATUS"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
          code_clusters:
            - cluster_id: "ALCOHOL_AUDIT_COD"
              category: "INCLUSION"
            - cluster_id: "ALCOHOL_DISORDER_COD"
              category: "INCLUSION"
          thresholds:
            # AUDIT-C Risk Categories
            - population_group: "ALL"
              threshold_type: "AUDIT_C_NON_DRINKER"
              threshold_value: "0"
              threshold_operator: "EQUALS"
              threshold_unit: "score"
              description: "AUDIT-C non-drinker"
              sort_order: 1
            - population_group: "ALL"
              threshold_type: "AUDIT_C_OCCASIONAL"
              threshold_value: "1-2"
              threshold_operator: "BETWEEN"
              threshold_unit: "score"
              description: "AUDIT-C occasional drinker"
              sort_order: 2
            - population_group: "ALL"
              threshold_type: "AUDIT_C_LOWER_RISK"
              threshold_value: "3-4"
              threshold_operator: "BETWEEN"
              threshold_unit: "score"
              description: "AUDIT-C lower risk drinking"
              sort_order: 3
            - population_group: "ALL"
              threshold_type: "AUDIT_C_INCREASING_RISK"
              threshold_value: "5-7"
              threshold_operator: "BETWEEN"
              threshold_unit: "score"
              description: "AUDIT-C increasing risk drinking"
              sort_order: 4
            - population_group: "ALL"
              threshold_type: "AUDIT_C_HIGHER_RISK"
              threshold_value: "8-10"
              threshold_operator: "BETWEEN"
              threshold_unit: "score"
              description: "AUDIT-C higher risk drinking"
              sort_order: 5
            - population_group: "ALL"
              threshold_type: "AUDIT_C_DEPENDENCE"
              threshold_value: "11-12"
              threshold_operator: "BETWEEN"
              threshold_unit: "score"
              description: "AUDIT-C possible dependence"
              sort_order: 6
            # Full AUDIT Risk Categories
            - population_group: "ALL"
              threshold_type: "AUDIT_NON_DRINKER"
              threshold_value: "0"
              threshold_operator: "EQUALS"
              threshold_unit: "score"
              description: "Full AUDIT non-drinker"
              sort_order: 7
            - population_group: "ALL"
              threshold_type: "AUDIT_OCCASIONAL"
              threshold_value: "1-3"
              threshold_operator: "BETWEEN"
              threshold_unit: "score"
              description: "Full AUDIT occasional drinker"
              sort_order: 8
            - population_group: "ALL"
              threshold_type: "AUDIT_LOWER_RISK"
              threshold_value: "4-7"
              threshold_operator: "BETWEEN"
              threshold_unit: "score"
              description: "Full AUDIT lower risk drinking"
              sort_order: 9
            - population_group: "ALL"
              threshold_type: "AUDIT_INCREASING_RISK"
              threshold_value: "8-15"
              threshold_operator: "BETWEEN"
              threshold_unit: "score"
              description: "Full AUDIT increasing risk drinking"
              sort_order: 10
            - population_group: "ALL"
              threshold_type: "AUDIT_HIGHER_RISK"
              threshold_value: "16-19"
              threshold_operator: "BETWEEN"
              threshold_unit: "score"
              description: "Full AUDIT higher risk drinking"
              sort_order: 11
            - population_group: "ALL"
              threshold_type: "AUDIT_DEPENDENCE"
              threshold_value: "20+"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "score"
              description: "Full AUDIT possible dependence"
              sort_order: 12
            # Clinical Intervention Thresholds
            - population_group: "ALL"
              threshold_type: "BRIEF_INTERVENTION_AUDIT_C"
              threshold_value: "5"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "score"
              description: "AUDIT-C brief intervention threshold"
              sort_order: 13
            - population_group: "ALL"
              threshold_type: "BRIEF_INTERVENTION_AUDIT"
              threshold_value: "8"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "score"
              description: "Full AUDIT brief intervention threshold"
              sort_order: 14
            - population_group: "ALL"
              threshold_type: "SPECIALIST_REFERRAL_AUDIT_C"
              threshold_value: "8"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "score"
              description: "AUDIT-C specialist intervention threshold"
              sort_order: 15
            - population_group: "ALL"
              threshold_type: "SPECIALIST_REFERRAL_AUDIT"
              threshold_value: "16"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "score"
              description: "Full AUDIT specialist intervention threshold"
              sort_order: 16

        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique identifier for the person
        data_tests:
          - not_null
          - unique

      - name: latest_assessment_date
        description: Most recent date of any alcohol assessment (AUDIT or 
          disorder diagnosis)

      - name: alcohol_status
        description: Combined alcohol status considering both AUDIT scores and 
          disorder diagnoses

      - name: alcohol_risk_sort_key
        description: >-
          Numeric risk sort key: 7 active disorder, 6 possible dependence, 5 higher risk,
          4 historical disorder, 3 increasing risk, 2 lower risk or occasional drinker,
          1 non-drinker, 0 no data.

      - name: audit_score
        description: Most recent AUDIT or AUDIT-C score

      - name: audit_type
        description: Type of most recent AUDIT assessment (AUDIT-C or Full 
          AUDIT)

      - name: audit_risk_category
        description: Risk category from most recent AUDIT assessment

      - name: has_active_disorder
        description: Flag for currently active alcohol disorder

      - name: disorder_record_count
        description: Distinct disorder readings by concept, clinical calendar date and recorded value, including null results.

      - name: requires_intervention
        description: Flag for persons requiring clinical intervention

      - name: brief_intervention_indicated
        description: Flag indicating brief intervention threshold met

      - name: audit_data_recency
        description: Recency classification of AUDIT data (Current, Recent, 
          Historical, No AUDIT)

      - name: disorder_data_recency
        description: Recency classification of disorder data (Current, Recent, 
          Historical, No Disorder Record)

unit_tests:
  - name: alcohol_status_selects_instrument_total
    model: fct_person_alcohol_status
    given:
      - input: ref('int_alcohol_audit_scores')
        format: sql
        rows: |
          -- Synthetic item answers and totals. Later recording must not override the total.
          SELECT column1::VARCHAR AS id, column2::NUMBER AS person_id,
                 column3::TIMESTAMP_NTZ AS clinical_effective_date, column4::VARCHAR AS audit_type,
                 column5::NUMBER(10,2) AS audit_score, column6::TIMESTAMP_NTZ AS date_recorded,
                 column7::VARCHAR AS risk_category, 'SYN_risk'::VARCHAR AS simplified_risk_level,
                 FALSE AS auditc_positive_screen, FALSE AS requires_specialist_intervention,
                 FALSE AS brief_intervention_indicated, 'Male'::VARCHAR AS gender, column8::BOOLEAN AS is_valid_score
          FROM VALUES
              ('SYN_item_1', -9601, '2024-03-01', 'AUDIT-C', 1, '2024-03-02', 'SYN_risk', TRUE),
              ('SYN_item_2', -9601, '2024-03-01', 'AUDIT-C', 2, '2024-03-02', 'SYN_risk', TRUE),
              ('SYN_item_3', -9601, '2024-03-01', 'AUDIT-C', 1, '2024-03-02', 'SYN_risk', TRUE),
              ('SYN_total', -9601, '2024-03-01', 'AUDIT-C', 4, '2024-03-01', 'SYN_risk', TRUE),
              ('SYN_full', -9602, '2024-03-01 09:00:00', 'Full AUDIT', 9, '2024-03-01', 'SYN_risk', TRUE),
              ('SYN_screen', -9602, '2024-03-01 15:00:00', 'AUDIT-C', 6, '2024-03-02', 'SYN_risk', TRUE),
              ('SYN_older_full', -9603, '2024-02-01', 'Full AUDIT', 20, '2024-03-02', 'SYN_risk', TRUE),
              ('SYN_newer_screen', -9603, '2024-03-01', 'AUDIT-C', 2, '2024-03-01', 'SYN_risk', TRUE),
              ('SYN_INVALID_TOTAL', -9601, '2024-03-15', 'Full AUDIT', 99, '2024-03-16', 'SYN_INVALID_RISK', FALSE),
              ('SYN_FULL', -18202, '2024-03-01', 'Full AUDIT', 9, '2024-03-02', 'SYN_FULL_RISK', TRUE),
              ('SYN_C', -18202, '2024-03-01', 'AUDIT-C', 12, '2024-03-02', 'SYN_C_RISK', TRUE),
              ('SYN_OLD', -18203, '2024-03-01', 'Full AUDIT', 9, '2024-03-01', 'SYN_OLD', TRUE),
              ('SYN_NEW', -18203, '2024-03-01', 'Full AUDIT', 9, '2024-03-02', 'SYN_NEW', TRUE),
              ('SYN_NULL', -18203, '2024-03-01', 'Full AUDIT', 9, NULL, 'SYN_NULL', TRUE),
              ('SYN_A', -18204, '2024-03-01', 'Full AUDIT', 9, '2024-03-02', 'SYN_A_RISK', TRUE),
              ('SYN_Z', -18204, '2024-03-01', 'Full AUDIT', 9, '2024-03-02', 'SYN_Z_RISK', TRUE)
      - input: ref('int_alcohol_misuse_disorders')
        format: sql
        rows: |
          SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id,
                 NULL::DATE AS clinical_effective_date, NULL::BOOLEAN AS is_problem,
                 NULL::DATE AS problem_end_date, NULL::VARCHAR AS concept_code, NULL::FLOAT AS result_value WHERE FALSE
    expect:
      rows:
        - {person_id: -9601, audit_score: 4, audit_type: AUDIT-C, audit_risk_category: SYN_risk}
        - {person_id: -9602, audit_score: 9, audit_type: Full AUDIT, audit_risk_category: SYN_risk}
        - {person_id: -9603, audit_score: 2, audit_type: AUDIT-C, audit_risk_category: SYN_risk}
        - {person_id: -18202, audit_score: 9, audit_type: Full AUDIT, audit_risk_category: SYN_FULL_RISK}
        - {person_id: -18203, audit_score: 9, audit_type: Full AUDIT, audit_risk_category: SYN_NEW}
        - {person_id: -18204, audit_score: 9, audit_type: Full AUDIT, audit_risk_category: SYN_A_RISK}

  - name: alcohol_disorder_counts_distinct_readings
    model: fct_person_alcohol_status
    given:
    - input: ref('int_alcohol_misuse_disorders')
      format: sql
      rows: |-
        SELECT column1::VARCHAR AS id, column2::NUMBER AS person_id,
            column3::TIMESTAMP_NTZ AS clinical_effective_date, column4::VARCHAR AS concept_code,
            column5::FLOAT AS result_value, TRUE::BOOLEAN AS is_problem, NULL::DATE AS problem_end_date
        FROM VALUES ('SYN_A', -145401, '2024-01-01 09:00:00', 'SYN_C', NULL),
        ('SYN_B', -145401, '2024-01-01 18:00:00', 'SYN_C', NULL),
        ('SYN_C', -145401, '2024-01-01', 'SYN_OTHER', NULL),
        ('SYN_D', -145401, '2024-01-02', 'SYN_C', NULL),
        ('SYN_E', -145401, '2024-01-01', 'SYN_C', 0),
        ('SYN_F', -145401, '2024-01-01', 'SYN_C', 1),
        ('SYN_G', -145402, '2024-01-01', 'SYN_C', NULL)
    - input: ref('int_alcohol_audit_scores')
      format: sql
      rows: SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::TIMESTAMP_NTZ AS clinical_effective_date,
        NULL::VARCHAR AS audit_type, NULL::FLOAT AS audit_score, NULL::TIMESTAMP_NTZ AS date_recorded, NULL::VARCHAR
        AS risk_category, NULL::VARCHAR AS simplified_risk_level, NULL::BOOLEAN AS auditc_positive_screen,
        NULL::BOOLEAN AS requires_specialist_intervention, NULL::BOOLEAN AS brief_intervention_indicated,
        NULL::VARCHAR AS gender, NULL::BOOLEAN AS is_valid_score WHERE FALSE
    expect:
      rows:
      - person_id: -145401
        disorder_record_count: 5
      - person_id: -145402
        disorder_record_count: 1
