models:
  - name: fct_person_pregnancy_status
    description: >-
      People not recorded as male who are currently pregnant on the build date, one row
      per person. Currently pregnant means a pregnancy code (PREG_COD) in the last 9
      months that is later than any delivery or outcome code (PREGDEL_COD). Codes dated
      after the build date are ignored. No age restriction; the child-bearing age columns
      are flags only.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Unique person identifier - primary key'
        tests:
          - unique
          - not_null
