models:
  - name: dim_person_inactive_patients
    description: >-
      People flagged inactive in dim_person_demographics with a recorded
      inactive_reason, one row per person. The OLIDS population comes from NCL
      GP records. Excludes test-patient records. Includes available
      demographic, registration and organisational details from the latest
      retained demographic period. Inactivity follows the upstream
      registration and death rules; this model does not independently classify
      practice closure.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Unique person identifier - primary key'
        data_tests:
          - unique
          - not_null
