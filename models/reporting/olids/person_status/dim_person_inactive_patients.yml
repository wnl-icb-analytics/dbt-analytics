models:
  - name: dim_person_inactive_patients
    description: >-
      Inactive people in OLIDS with a recorded inactive_reason, one row per person.
      Excludes test patients. Demographics and practice details describe the latest
      retained period. Inactivity follows registration and death rules, without a
      separate practice-closure check.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Unique person identifier - primary key'
        data_tests:
          - unique
          - not_null
