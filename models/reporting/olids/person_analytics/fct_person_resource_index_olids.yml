version: 2
models:
  - name: fct_person_resource_index_olids
    description: >-
      Resource index for patients attributed to NCL (registered sub-ICB 93C), one row
      per patient over a rolling 12-month cost window. Includes deceased and deducted
      patients, with available OLIDS clinical measures. Whole-person cost adds GP
      appointment costs to recorded service costs; OLIDS prescribing costs are a
      separate estimate and are not added.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: sk_patient_id
        description: DMIC pseudonymised NHS number (primary key; fan-out tripwire).
        data_tests:
          - not_null
          - unique
      - name: has_olids_record
        description: TRUE when the patient bridges to an OLIDS person record.
      - name: cambridge_comorbidity_score
        description: Cambridge Multimorbidity Score; null when no OLIDS score.
      - name: ltc_count
        description: Distinct LTC registers (0 when no OLIDS record).
      - name: frailty_severity
        description: Mild / Moderate / Severe; null when not on the frailty register.
      - name: gp_appointment_cost_12m
        description: >-
          Attended GP appointment cost over the 12-month window, in GBP at nominal PSSRU
          prices.
      - name: olids_prescribing_cost_12m_modelled
        description: Full-window prescribing from OLIDS estimated_cost (GBP, validated vs EPD to 0.4%). Cross-check only; EPD in actual_cost_12m is the counted prescribing cost.
      - name: olids_prescription_orders_12m
        description: OLIDS medication orders in the window.
      - name: total_cost_whole_person_12m
        description: >-
          Whole-person cost in GBP: actual_cost_12m (SLAM, EPD, MHSDS and CSDS) plus GP
          appointment cost. The separate OLIDS prescribing estimate is not added.
        data_tests:
          - not_null
