version: 2
models:
  - name: fct_person_resource_index_olids
    description: >-
      Resource index and primary-care measures for the NCL exposure population, one row per
      patient in fct_person_resource_index attributed to registered sub-ICB 93C. Retains the
      base model's rolling 12-month cost window, including deceased and deducted patients.
      Adds available OLIDS comorbidity, long-term condition and frailty measures, GP
      appointment costs at nominal PSSRU prices, and estimated prescribing costs.
      actual_cost_12m includes SLAM, EPD, MHSDS and CSDS costs; total_cost_whole_person_12m
      adds GP appointment costs only. OLIDS prescribing is a comparison estimate and is not
      added again. has_olids_record identifies a linked OLIDS profile.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: sk_patient_id
        description: DMIC pseudonymised NHS number (primary key; fan-out tripwire).
        data_tests:
          - not_null
          - unique
      - name: has_olids_record
        description: TRUE when the patient bridges to an OLIDS person record.
      - name: cambridge_comorbidity_score
        description: Cambridge Multimorbidity Score; null when no OLIDS score.
      - name: ltc_count
        description: Distinct LTC registers (0 when no OLIDS record).
      - name: frailty_severity
        description: Mild / Moderate / Severe; null when not on the frailty register.
      - name: gp_appointment_cost_12m
        description: Attended GP appointment cost over the window (PSSRU nominal GBP). Additive.
      - name: olids_prescribing_cost_12m_modelled
        description: Full-window prescribing from OLIDS estimated_cost (GBP, validated vs EPD to 0.4%). Cross-check only; EPD in actual_cost_12m is the counted prescribing cost.
      - name: olids_prescription_orders_12m
        description: OLIDS medication orders in the window.
      - name: total_cost_whole_person_12m
        description: actual_cost_12m + GP appointment cost (GBP). The whole-person headline.
        data_tests:
          - not_null
