models:
  - name: fct_person_cyp_asthma_register
    description: 'Children and young people asthma register for paediatric asthma
      management.

      One row per person under 18 years with an AST_COD diagnosis and no ASTRES_COD
      on or after that date. Evidence is dated on or before today. ASTTRT_COD medication
      must be prescribed after the date 12 months before today and on or before today.'

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    config:
      meta:
        indicator:
          id: "CYP_AST"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Respiratory"
          name_short: "CYP Asthma"
          description_short: "Children and young people asthma register (non-QOF)"
          description_long: >
            Asthma register for children and young people under 18 years. Includes
            persons with an AST_COD diagnosis and no ASTRES_COD on or after that date.
            Treatment must be prescribed after the date 12 months before today and
            on or before today. This local register uses an under-18 age threshold.
            Uses AST_COD (diagnosis), ASTRES_COD (resolution) and ASTTRT_COD (treatment).
          is_qof: false
          source_column: "is_on_register"
          sort_order: "COND_RESP_CYP_AST"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
          code_clusters:
            - cluster_id: "AST_COD"
              category: "INCLUSION"
            - cluster_id: "ASTRES_COD"
              category: "RESOLUTION"
            - cluster_id: "ASTTRT_COD"
              category: "INCLUSION"

        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null
