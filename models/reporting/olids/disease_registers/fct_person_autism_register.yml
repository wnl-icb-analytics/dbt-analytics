models:
  - name: fct_person_autism_register
    description: >-
      Coded autism register (NICE IND175). One row per register member.


      Registration status is not filtered. People with a coded autism diagnosis qualify at any
      age, without a resolution rule. Future-dated diagnoses can qualify. Coded records do not
      verify assessment against ICD-10 or DSM-V criteria or assessment by an autism team. For
      NICE counts, select people registered on the build date. Based on NICE CG142 and CG128.
      Code lists: AUTISM_COD (PCD).
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    config:
      meta:
        indicator:
          id: "AUTISM"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Neurodevelopmental"
          name_short: "Autism Spectrum Disorder"
          description_short: "Autism register (non-QOF)"
          description_long: >
            Autism spectrum disorder register for persons with autism diagnosis.  Includes
            active patients with autism diagnosis using AUTISM_COD cluster codes.  No
            age restrictions or resolution codes applied. Used for neurodevelopmental
            care  pathway monitoring, complex needs identification, care coordination,
            mental health  co-morbidity monitoring, and healthcare access support.
            Lifelong neurodevelopmental  condition requiring ongoing support and care
            coordination. Distinct from learning  disability though can co-occur.
          is_qof: false
          source_column: "is_on_register"
          sort_order: "COND_NEURODEV_AUTISM"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
          code_clusters:
            - cluster_id: "AUTISM_COD"
              category: "INCLUSION"

        indicators:
          - id: "IND175"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Neurodevelopmental"
            name_short: >-
              Autism register
            description_short: >-
              People of any age with a recorded autism diagnosis.
            description_long: >-
              People with a coded autism diagnosis qualify at any age, without a resolution
              rule. Future-dated diagnoses can qualify. Coded records do not verify assessment
              against ICD-10 or DSM-V criteria or assessment by an autism team. For NICE counts,
              select people registered on the build date. Based on NICE CG142 and CG128. Code
              lists: AUTISM_COD (PCD).
            source_column: "is_on_register"
            is_qof: false
            qof_indicator: null
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: Eddie Davison
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null
