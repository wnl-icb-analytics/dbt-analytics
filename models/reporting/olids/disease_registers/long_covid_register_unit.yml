unit_tests:
- name: long_covid_register_resolution_rules
  description: >-
    A resolved code later than the latest diagnosis removes the person; a later
    re-diagnosis restores them; a resolution at the same time as the diagnosis removes them.
  model: fct_person_long_covid_register
  given:
  - input: ref('int_long_covid_diagnoses_all')
    format: sql
    rows: |
      SELECT
          column1::VARCHAR AS id,
          column2::NUMBER AS person_id,
          column3::TIMESTAMP_NTZ AS clinical_effective_date,
          column3::TIMESTAMP_NTZ AS date_recorded,
          column4::VARCHAR AS concept_code,
          'SYN_VALUE'::VARCHAR AS concept_display,
          column5::VARCHAR AS source_cluster_id,
          column5 = 'LONGCOVID_COD' AS is_diagnosis_code,
          column5 = 'LONGCOVIDRES_COD' AS is_resolved_code
      FROM VALUES
          ('SYN_A1', -145451, '2021-06-01', 'SYN_DX', 'LONGCOVID_COD'),
          ('SYN_A2', -145451, '2022-06-01', 'SYN_RES', 'LONGCOVIDRES_COD'),
          ('SYN_B1', -145452, '2021-06-01', 'SYN_DX', 'LONGCOVID_COD'),
          ('SYN_B2', -145452, '2022-06-01', 'SYN_RES', 'LONGCOVIDRES_COD'),
          ('SYN_B3', -145452, '2023-06-01', 'SYN_DX', 'LONGCOVID_COD'),
          ('SYN_C1', -145453, '2021-06-01', 'SYN_DX', 'LONGCOVID_COD'),
          ('SYN_C2', -145453, '2021-06-01', 'SYN_RES', 'LONGCOVIDRES_COD'),
          ('SYN_D1', -145454, '2021-06-01', 'SYN_DX', 'LONGCOVID_COD')
  - input: ref('dim_person')
    format: sql
    rows: SELECT column1::NUMBER AS person_id FROM VALUES (-145451), (-145452), (-145453), (-145454)
  - input: ref('dim_person_age')
    format: sql
    rows: SELECT column1::NUMBER AS person_id, 40::NUMBER AS age FROM VALUES (-145451), (-145452), (-145453), (-145454)
  expect:
    rows:
    - person_id: -145452
      latest_resolved_date: '2022-06-01 00:00:00'
    - person_id: -145454
      latest_resolved_date: null
