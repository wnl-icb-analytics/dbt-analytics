models:
  - name: fct_person_palliative_care_register
    description: >
      Disease Registers (QOF v51) palliative care register. One row per person
      with PALCARE_COD from 1 April 2008 and no later PALCARENI_COD. PC001 is
      retired; register extraction continues through the Disease Registers service.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "PC001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Palliative Care"
          name_short: "Palliative Care"
          description_short: "QOF palliative care register"
          description_long: >
            Disease Registers (QOF v51) palliative care register. Requires
            PALCARE_COD from 1 April 2008 with no later PALCARENI_COD. PC001 is
            retired, but extraction continues.
          is_qof: true
          qof_indicator: "PC001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "PALCARE_COD"
              category: "INCLUSION"
            - cluster_id: "PALCARENI_COD"
              category: "EXCLUSION"
        owner:
          name: EddieDavison92
