models:
  - name: fct_person_palliative_care_register
    description: >
      Disease Registers (QOF v51) palliative care register. One row per person
      with PALCARE_COD from 1 April 2008 and no PALCARENI_COD on a later calendar
      date than the latest care code. Same-day codes retain membership. Evidence
      is dated on or before today. PC001 is
      retired; register extraction continues through the Disease Registers service.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "PC001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Palliative Care"
          name_short: "Palliative Care"
          description_short: "QOF 2025/26 palliative care register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. Disease Registers (QOF v51)
            palliative care register. Requires PALCARE_COD from 1 April 2008 with no PALCARENI_COD
            on a later calendar date than the latest care code; same-day codes retain membership.
            Evidence is dated on or before today. PC001 is retired, but extraction continues.
          is_qof: true
          qof_indicator: "PC001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "PALCARE_COD"
              category: "INCLUSION"
            - cluster_id: "PALCARENI_COD"
              category: "EXCLUSION"
        indicators:
          - id: "IND258"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Palliative Care"
            name_short: "GP services: palliative care register"
            description_short: "NICE GP services: palliative care register"
            description_long: >
              NICE register of people in need of palliative care or support, with no exclusions or
              date floor. The model requires PALCARE_COD on or after 1 April 2008, following QOF
              v51, and removes people with a later PALCARENI_COD indicating care is no longer
              needed. Same-day codes retain membership. The date floor is absent from NICE. QOF
              2025/26 correspondence is PC001; the QOF v51 register-establishment indicator is
              retired, while the register extraction continues.
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "PC001"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
