models:
  - name: fct_person_ckd_register
    description: >
      Disease Registers (QOF v51) chronic kidney disease register. One row per
      person aged 18 or over with a CKD stage 3-5 diagnosis that has not been
      superseded by stage 1-2 or resolved. CKD005 is retired; register extraction
      continues through the Disease Registers service.
      
      Membership criteria:
      - Has CKD Stage 3-5 diagnosis (CKD_COD)
      - NOT downstaged to Stage 1-2 (no CKD1AND2_COD after latest CKD_COD)
      - NOT resolved (no CKDRES_COD after latest CKD_COD)
      A stage 1-2 or resolved code on the same date as the latest CKD_COD does
      not remove the diagnosis. Evidence is dated on or before today.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

      - name: latest_stage_1_2_date
        description: Date of most recent CKD Stage 1-2 code (for downstaging tracking)

      - name: all_stage_1_2_concept_codes
        description: Array of all CKD Stage 1-2 concept codes for traceability

      - name: was_downstaged
        description: Flag indicating patient has Stage 1-2 code after latest Stage 3-5 (excluded from register)

    config:
      meta:
        indicator:
          id: "CKD005"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Nephrology"
          name_short: "Chronic Kidney Disease"
          description_short: "QOF 2025/26 chronic kidney disease register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. Disease Registers (QOF v51) CKD
            register for patients aged 18 or over with CKD stage 3-5 that has not been superseded
            by stage 1-2 or resolved on a later date. Evidence is dated on or before today. CKD005
            is retired, but extraction continues.
          is_qof: true
          qof_indicator: "CKD005"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "CKD_COD"
              category: "INCLUSION"
            - cluster_id: "CKD1AND2_COD"
              category: "EXCLUSION"
            - cluster_id: "CKDRES_COD"
              category: "RESOLUTION"
        indicators:
          - id: "IND129"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Nephrology"
            name_short: "Kidney conditions: CKD register (3a to 5)"
            description_short: "NICE Kidney conditions: CKD register (3a to 5)"
            description_long: >
              NICE register of people aged 18 or over with CKD categories G3a to G5. The model uses
              CKD_COD and removes people whose diagnosis is followed by CKD1AND2_COD or CKDRES_COD.
              NICE lists no exclusions; the model uses these codes to maintain the current G3a-G5
              population. No additional filter is needed. QOF 2025/26 correspondence is CKD005; the
              QOF v51 register-establishment indicator is retired, while the register extraction
              continues.
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "CKD005"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
