models:
  - name: fct_person_obesity_register
    description: 'Obesity register for people aged 18+, using the QOF BMI thresholds.

      One row per person whose latest valid BMI (5 to 400, recorded at any date) is 30 or
      more, or 27.5 or more for South Asian, Chinese, other Asian, Middle Eastern, Black
      African or African-Caribbean ethnicity. Unlike QOF OBES_REG there is no 12-month
      window: a person who has not been weighed recently keeps their last valid BMI, so
      counts are higher than published QOF.'

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    config:
      meta:
        indicator:
          id: "OB001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Cardiometabolic"
          name_short: "Obesity"
          description_short: "QOF obesity register"
          description_long: >
            Aged 18 or over with a latest valid BMI (any date) of 30 or more, or 27.5
            or more for ethnic groups at higher cardiometabolic risk. Uses the QOF
            thresholds and BMI clusters (BMIVAL_COD, BMI30_COD) but not the QOF
            12-month window, so it counts people with obesity rather than recent
            recording.
          is_qof: true
          qof_indicator: "OB001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "BMI_COD"
              category: "INCLUSION"
            - cluster_id: "ETH2016AI_COD"
              category: "REFINEMENT"
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
