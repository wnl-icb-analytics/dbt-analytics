models:
  - name: fct_person_hypertension_register
    description: 'QOF v51 hypertension register (HYP_REG) for people of any age with
      an unresolved hypertension diagnosis.

      One row per person with a diagnosis and no resolution code, or whose latest
      HTN_COD is on or after their latest HTNRES_COD, so a same-day resolution does
      not remove them. Diagnosis, resolution and BP evidence is dated on or before today.

      Project-specific, NICE-informed staging uses the latest paired BP reading,
      not the NG136 diagnostic definition based on a confirmed ABPM/HBPM average.
      Thresholds in mmHg (systolic or diastolic): Home/ABPM stage 1 >= 135 or >= 85,
      stage 2 >= 155 or >= 95; clinic stage 1 >= 140 or >= 90, stage 2 >= 160 or >= 100.
      Severe HTN in either context: systolic >= 180 or diastolic >= 120, assessed first;
      stage 2 takes precedence over stage 1.'

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    config:
      meta:
        indicator:
          id: "HYP001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Cardiometabolic"
          name_short: "Hypertension"
          description_short: "QOF 2025/26 hypertension register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. Hypertension diagnosed using QOF
            v51 criteria: unresolved hypertension diagnosis at any age, with no resolution code or
            where the latest HTN code is on or after the latest resolution code. Project-specific,
            NICE-informed staging uses the latest paired BP reading, not the NG136 diagnostic
            definition based on a confirmed ABPM/HBPM average. Thresholds in mmHg (systolic or
            diastolic): Home/ABPM stage 1 >= 135 or >= 85, stage 2 >= 155 or >= 95; clinic stage 1
            >= 140 or >= 90, stage 2 >= 160 or >= 100. Severe HTN in either context: systolic >=
            180 or diastolic >= 120, assessed first; stage 2 takes precedence over stage 1. QOF
            2025/26 correspondence: HYP001 (Hypertension Register). Uses HTN_COD for diagnosis
            codes and HTNRES_COD for resolution codes.
          is_qof: true
          qof_indicator: "HYP001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "HTN_COD"
              category: "INCLUSION"
            - cluster_id: "HTNRES_COD"
              category: "RESOLUTION"

        indicators:
          - id: "IND255"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Cardiometabolic"
            name_short: >-
              Hypertension register
            description_short: >-
              People of any age with unresolved hypertension.
            description_long: >-
              Hypertension diagnoses qualify at any age when on or after the latest
              resolved code. Blood pressure stage does not determine membership. Based
              on NICE NG136. Code lists: HTN_COD and HTNRES_COD.
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "HYP001"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Patient identifier'
        tests:
          - unique
          - not_null

      - name: age
        description: 'Current age of the patient'

      - name: is_on_register
        description: 'Flag indicating patient is on the hypertension QOF register'

      - name: earliest_diagnosis_date
        description: 'Date of earliest hypertension diagnosis'

      - name: latest_diagnosis_date
        description: 'Date of most recent hypertension diagnosis'

      - name: latest_resolved_date
        description: 'Date of most recent hypertension resolution code (if any)'

      - name: all_hypertension_concept_codes
        description: 'Array of all hypertension concept codes for this patient'

      - name: all_hypertension_concept_displays
        description: 'Array of all hypertension concept displays for this patient'

      - name: meets_age_criteria
        description: 'Age 18 or over. Informational only; the register has no age restriction.'

      - name: has_active_htn_diagnosis
        description: 'TRUE when there is no resolution code (latest_resolved_date is null)
          or the latest diagnosis is after the latest resolution. FALSE when the latest
          resolution is on the same day as the latest diagnosis; those people stay on the register.'
