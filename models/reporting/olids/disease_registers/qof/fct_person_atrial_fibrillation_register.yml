models:
  - name: fct_person_atrial_fibrillation_register
    description: >-
      Unresolved atrial fibrillation register (NICE IND185). One row per register member.


      Registration status is not filtered. An atrial fibrillation diagnosis qualifies at any
      age. A resolved code on or after the latest diagnosis removes membership. NICE includes
      people with resolved atrial fibrillation, so this flag supplies a narrower population.
      Clinical evidence is dated by the build date. For NICE counts, select people registered on
      the build date. Based on NICE NG196. Code lists: AFIB_COD and AFIBRES_COD (PCD).
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    config:
      meta:
        indicator:
          id: "AF001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Cardiovascular"
          name_short: "Atrial Fibrillation"
          description_short: "QOF 2025/26 atrial fibrillation register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. Atrial fibrillation diagnosed
            using QOF criteria: Active AF diagnosis with no resolution on or after the latest
            AFIB_COD diagnosis date. Evidence is dated on or before today; a same-date resolution
            removes membership. No age restrictions apply. QOF 2025/26 correspondence:  AF001
            (Atrial Fibrillation Register). Uses AFIB_COD for diagnosis codes and  AFIBRES_COD for
            resolution codes.
          is_qof: true
          qof_indicator: "AF001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "AFIB_COD"
              category: "INCLUSION"
            - cluster_id: "AFIBRES_COD"
              category: "RESOLUTION"

        indicators:
          - id: "IND185"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Cardiovascular"
            name_short: >-
              Atrial fibrillation register
            description_short: >-
              People with atrial fibrillation whose latest diagnosis has not been
              resolved.
            description_long: >-
              An atrial fibrillation diagnosis qualifies at any age. A resolved code on or after
              the latest diagnosis removes membership. NICE includes people with resolved atrial
              fibrillation, so this flag supplies a narrower population. Clinical evidence is
              dated by the build date. For NICE counts, select people registered on the build
              date. Based on NICE NG196. Code lists: AFIB_COD and AFIBRES_COD (PCD).
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "AF001"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Patient identifier'
        tests:
          - unique
          - not_null

      - name: age
        description: >-
          Age in years from the approximate birth month, at the build date or at death for
          deceased people; null when birth date is missing.

      - name: is_on_register
        description: 'Flag indicating patient is on the AF QOF register'

      - name: earliest_diagnosis_date
        description: 'Date of earliest AF diagnosis'

      - name: latest_diagnosis_date
        description: 'Date of most recent AF diagnosis'

      - name: latest_resolved_date
        description: 'Date of most recent AF resolution code (if any)'

      - name: all_af_concept_codes
        description: 'Array of all AF concept codes for this patient'

      - name: all_af_concept_displays
        description: 'Array of all AF concept displays for this patient'

      - name: meets_age_criteria
        description: 'Flag indicating patient meets age criteria (always true for
          AF register)'

      - name: has_active_diagnosis
        description: 'Flag indicating patient has an active AF diagnosis'
