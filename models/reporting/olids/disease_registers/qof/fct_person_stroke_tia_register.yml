models:
  - name: fct_person_stroke_tia_register
    description: >
      QOF v51 stroke and TIA register. One row per person with a STRK_COD or
      TIA_COD diagnosis dated on or before today. No age or resolution exclusion.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "STIA001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Cardiovascular"
          name_short: "Stroke and TIA"
          description_short: "QOF stroke and TIA register"
          description_long: >
            QOF v51 stroke and TIA register for secondary prevention. Any STRK_COD
            or TIA_COD diagnosis dated on or before today qualifies, with no age
            or resolution exclusion.
          is_qof: true
          qof_indicator: "STIA001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "STRK_COD"
              category: "INCLUSION"
            - cluster_id: "TIA_COD"
              category: "INCLUSION"
        owner:
          name: EddieDavison92
