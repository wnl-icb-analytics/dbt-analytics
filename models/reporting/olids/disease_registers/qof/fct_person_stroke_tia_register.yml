models:
  - name: fct_person_stroke_tia_register
    description: >-
      Stroke and transient ischaemic attack register (NICE IND259). One row per register member.


      Registration status is not filtered. A stroke or transient ischaemic attack diagnosis
      qualifies at any age, without a resolution rule or exclusions. Clinical evidence is dated
      by the build date. For NICE counts, select people registered on the build date. Based on
      NICE NG128. Code lists: STRK_COD and TIA_COD (PCD).
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "STIA001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Cardiovascular"
          name_short: "Stroke and TIA"
          description_short: "QOF 2025/26 stroke and TIA register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. QOF v51 stroke and TIA register
            for secondary prevention. Any STRK_COD or TIA_COD diagnosis dated on or before today
            qualifies, with no age or resolution exclusion.
          is_qof: true
          qof_indicator: "STIA001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "STRK_COD"
              category: "INCLUSION"
            - cluster_id: "TIA_COD"
              category: "INCLUSION"
        indicators:
          - id: "IND259"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Cardiovascular"
            name_short: >-
              Stroke or transient ischaemic attack
            description_short: >-
              People of any age with stroke or transient ischaemic attack.
            description_long: >-
              A stroke or transient ischaemic attack diagnosis qualifies at any age, without a
              resolution rule or exclusions. Clinical evidence is dated by the build date. For
              NICE counts, select people registered on the build date. Based on NICE NG128. Code
              lists: STRK_COD and TIA_COD (PCD).
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "STIA001"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
