models:
  - name: fct_person_stroke_tia_register
    description: >
      QOF v51 stroke and TIA register. One row per person with a STRK_COD or
      TIA_COD diagnosis dated on or before today. No age or resolution exclusion.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "STIA001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Cardiovascular"
          name_short: "Stroke and TIA"
          description_short: "QOF 2025/26 stroke and TIA register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. QOF v51 stroke and TIA register
            for secondary prevention. Any STRK_COD or TIA_COD diagnosis dated on or before today
            qualifies, with no age or resolution exclusion.
          is_qof: true
          qof_indicator: "STIA001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "STRK_COD"
              category: "INCLUSION"
            - cluster_id: "TIA_COD"
              category: "INCLUSION"
        indicators:
          - id: "IND259"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Cardiovascular"
            name_short: "Stroke and ischaemic attack: register"
            description_short: "NICE Stroke and ischaemic attack: register"
            description_long: >
              NICE register of people with stroke or transient ischaemic attack, with no exclusions.
              The model uses any STRK_COD or TIA_COD diagnosis, with no age or resolution rule. No
              additional filter is needed. QOF 2025/26 correspondence is STIA001; the QOF v51
              register-establishment indicator is retired, while the register extraction continues.
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "STIA001"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
