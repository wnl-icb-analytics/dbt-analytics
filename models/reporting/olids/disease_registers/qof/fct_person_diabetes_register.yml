models:
  - name: fct_person_diabetes_register
    description: >-
      Diabetes register with type classification (NICE IND100). One row per register member.


      Registration status is not filtered. People aged 17 or over with a diabetes diagnosis
      qualify unless a resolution is recorded on a later date. A same-day resolution retains
      membership. NICE also starts at age 17 but has no resolution exclusion. Type is Type 1,
      Type 2 or Unknown; Unknown includes untyped and other diabetes types. The latest type code
      determines classification; Type 1 takes precedence on a shared date. Clinical evidence is
      dated by the build date. For NICE counts, select people registered on the build date.
      Based on NICE NG28. Code lists: DM_COD, DMTYPE1_COD, DMTYPE2_COD, DMRES_COD (PCD).
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    config:
      meta:
        indicator:
          id: "DM017"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Cardiometabolic"
          name_short: "Diabetes"
          description_short: "QOF 2025/26 diabetes register (all types)"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. Diabetes mellitus diagnosed using
            QOF criteria: Age ≥17 years with active diagnosis where no resolution code is dated
            after the latest diabetes code. Includes all diabetes types - Type 1, Type 2, and
            unspecified diabetes codes. Evidence is dated on or before today. Type classification
            uses the latest type code, with Type 1 taking precedence on the same date. QOF 2025/26
            correspondence: DM017 (Diabetes Register). Uses DM_COD (general),  DMTYPE1_COD (Type
            1), and DMTYPE2_COD (Type 2) cluster codes.
          is_qof: true
          qof_indicator: "DM017"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "DM_COD"
              category: "INCLUSION"
            - cluster_id: "DMTYPE1_COD"
              category: "INCLUSION"
            - cluster_id: "DMTYPE2_COD"
              category: "INCLUSION"
            - cluster_id: "DMRES_COD"
              category: "RESOLUTION"
        indicators:
          - id: "IND100"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Cardiometabolic"
            name_short: >-
              Diabetes register including type
            description_short: "People aged 17 or over with unresolved diabetes, classified by type."
            description_long: >-
              People aged 17 or over with a diabetes diagnosis qualify unless a resolution is
              recorded on a later date. A same-day resolution retains membership. NICE also
              starts at age 17 but has no resolution exclusion. Type is Type 1, Type 2 or
              Unknown; Unknown includes untyped and other diabetes types. The latest type code
              determines classification; Type 1 takes precedence on a shared date. Clinical
              evidence is dated by the build date. For NICE counts, select people registered on
              the build date. Based on NICE NG28. Code lists: DM_COD, DMTYPE1_COD, DMTYPE2_COD,
              DMRES_COD (PCD).
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "DM017"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique person identifier
        tests:
          - unique
          - not_null

      - name: is_on_register
        description: Whether person meets QOF diabetes register criteria

      - name: age
        description: >-
          Age in years from the approximate birth month, at the build date or at death for
          deceased people; null when birth date is missing.

      - name: diabetes_type
        description: >-
          Type 1, Type 2 or Unknown, from the latest type code. Type 1 wins on a shared date;
          Unknown includes untyped and other diabetes types.

      - name: earliest_diagnosis_date
        description: Date of earliest diabetes diagnosis

      - name: latest_diagnosis_date
        description: Date of most recent diabetes diagnosis

      - name: earliest_type1_date
        description: Date of earliest Type 1 diabetes diagnosis

      - name: latest_type1_date
        description: Date of most recent Type 1 diabetes diagnosis

      - name: earliest_type2_date
        description: Date of earliest Type 2 diabetes diagnosis

      - name: latest_type2_date
        description: Date of most recent Type 2 diabetes diagnosis

      - name: latest_resolved_date
        description: Date of most recent diabetes resolution code

      - name: all_diabetes_concept_codes
        description: All diabetes concept codes for this person

      - name: all_diabetes_concept_displays
        description: All diabetes concept display names for this person
