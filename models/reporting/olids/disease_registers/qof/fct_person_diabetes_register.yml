models:
  - name: fct_person_diabetes_register
    description: 'QOF diabetes register with type classification for patients aged
      17+ with active diabetes. One row per qualifying person, using clinical
      evidence dated on or before today.

      QOF Criteria:

      • Age ≥17 years

      • Active diabetes diagnosis (DM_COD codes)

      • No resolution code (DMRES_COD) after the latest diabetes code; a
      resolution on the same date does not remove the diagnosis

      • Type classification: Type 1, Type 2, or Unknown (Type 1 takes precedence)

      Purpose: Supports QOF reporting and diabetes care management with accurate type
      classification for treatment planning.'

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    config:
      meta:
        indicator:
          id: "DM017"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Cardiometabolic"
          name_short: "Diabetes"
          description_short: "QOF 2025/26 diabetes register (all types)"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. Diabetes mellitus diagnosed using
            QOF criteria: Age ≥17 years with active diagnosis where no resolution code is dated
            after the latest diabetes code. Includes all diabetes types - Type 1, Type 2, and
            unspecified diabetes codes. Evidence is dated on or before today. Type classification
            uses the latest type code, with Type 1 taking precedence on the same date. QOF 2025/26
            correspondence: DM017 (Diabetes Register). Uses DM_COD (general),  DMTYPE1_COD (Type
            1), and DMTYPE2_COD (Type 2) cluster codes.
          is_qof: true
          qof_indicator: "DM017"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "DM_COD"
              category: "INCLUSION"
            - cluster_id: "DMTYPE1_COD"
              category: "INCLUSION"
            - cluster_id: "DMTYPE2_COD"
              category: "INCLUSION"
            - cluster_id: "DMRES_COD"
              category: "RESOLUTION"
        indicators:
          - id: "IND100"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Cardiometabolic"
            name_short: "Diabetes: register including type"
            description_short: "NICE Diabetes: register including type"
            description_long: >
              NICE register of people aged 17 or over with diabetes mellitus, specifying the type
              where confirmed. The model uses unresolved DM_COD diagnoses and exposes diabetes_type
              as Type 1, Type 2 or Unknown. Unknown includes untyped diabetes and other types such
              as MODY or secondary diabetes; those types are not distinguished. Type classification
              uses the latest type code, with Type 1 winning a same-day tie. No additional age
              filter is needed. QOF 2025/26 correspondence is DM017; the QOF v51
              register-establishment indicator is retired, while the register extraction continues.
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "DM017"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique person identifier
        tests:
          - unique
          - not_null

      - name: is_on_register
        description: Whether person meets QOF diabetes register criteria

      - name: age
        description: Person's current age

      - name: diabetes_type
        description: Diabetes type classification (Type 1, Type 2, Unknown)

      - name: earliest_diagnosis_date
        description: Date of earliest diabetes diagnosis

      - name: latest_diagnosis_date
        description: Date of most recent diabetes diagnosis

      - name: earliest_type1_date
        description: Date of earliest Type 1 diabetes diagnosis

      - name: latest_type1_date
        description: Date of most recent Type 1 diabetes diagnosis

      - name: earliest_type2_date
        description: Date of earliest Type 2 diabetes diagnosis

      - name: latest_type2_date
        description: Date of most recent Type 2 diabetes diagnosis

      - name: latest_resolved_date
        description: Date of most recent diabetes resolution code

      - name: all_diabetes_concept_codes
        description: All diabetes concept codes for this person

      - name: all_diabetes_concept_displays
        description: All diabetes concept display names for this person
