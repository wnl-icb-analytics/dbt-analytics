models:
  - name: fct_person_heart_failure_register
    description: >-
      Heart failure register (NICE IND254). One row per register member.


      Registration status is not filtered. For NICE counts, select people registered on the
      build date, aged 18 or over, on the full heart failure register. The model includes
      younger people. A resolved code on a later date than the latest diagnosis removes
      membership; same-day resolution retains it. NICE lists no resolution exclusion. Reduced-ejection- fraction membership is a subset and is not required. Based on NICE NG106. Code
      lists: HF_COD, HFRES_COD (PCD).
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

      - name: is_on_register
        description: Whether the person is on the unresolved heart failure register (HF1)

      - name: is_on_hfref_register
        description: Whether the person is also on the reduced-ejection-fraction-only register (HF3)

    config:
      meta:
        indicator:
          id: "HF001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Cardiovascular"
          name_short: "Heart Failure"
          description_short: "QOF 2025/26 heart failure register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. QOF v51 HF1 contains patients with
            unresolved heart failure, using evidence dated on or before today. HF3 is its
            reduced-ejection-fraction-only subset and replaces the former HF2 LVSD-or-reduced-EF
            register. Uses HF_COD, HFRES_COD and REDEJCFRAC_COD.
          is_qof: true
          qof_indicator: "HF001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "HF_COD"
              category: "INCLUSION"
            - cluster_id: "HFRES_COD"
              category: "RESOLUTION"
            - cluster_id: "REDEJCFRAC_COD"
              category: "INCLUSION"
        indicators:
          - id: "IND254"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Cardiovascular"
            name_short: >-
              Adult heart failure register
            description_short: >-
              Adults with heart failure whose latest diagnosis has not been followed
              by resolution.
            description_long: >-
              For NICE counts, select people registered on the build date, aged 18 or over, on
              the full heart failure register. The model includes younger people. A resolved
              code on a later date than the latest diagnosis removes membership; same-day
              resolution retains it. NICE lists no resolution exclusion. Reduced-ejection-fraction membership is a subset and is not required. Based on NICE NG106. Code
              lists: HF_COD, HFRES_COD (PCD).
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "HF001"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
