models:
  - name: fct_person_dementia_register
    description: 'QOF dementia register for patients with dementia diagnosis.

      One row per person with DEM_COD dated on or before today (dementia is a permanent condition).'

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "DEM001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Mental Health"
          name_short: "Dementia"
          description_short: "QOF 2025/26 dementia register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. Dementia diagnosed using QOF
            criteria: Any dementia diagnosis dated on or before today qualifies for register
            inclusion. Dementia is considered a permanent condition with no  resolution codes. No
            age restrictions apply. Used for dementia care pathway  monitoring, cognitive health
            assessment, and memory service referral tracking.  QOF 2025/26 correspondence: DEM001
            (Dementia Register). Uses DEM_COD for diagnosis codes.
          is_qof: true
          qof_indicator: "DEM001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "DEM_COD"
              category: "INCLUSION"
        indicators:
          - id: "IND252"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Mental Health"
            name_short: "Dementia: register"
            description_short: "NICE Dementia: register"
            description_long: >
              NICE register of people diagnosed with dementia, with no exclusions. The model uses
              any DEM_COD diagnosis, at all ages and with no resolution rule. No additional filter
              is needed. QOF 2025/26 correspondence is DEM001; the QOF v51 register-establishment
              indicator is retired, while the register extraction continues.
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "DEM001"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
