models:
  - name: fct_person_smi_register
    description: >
      QOF v51 serious mental illness register. One row per person with an MH_COD
      diagnosis dated on or before today, including codes also in MHREM_COD.
      Remission does not exclude them and remission-only records do not
      qualify. The retired MH2 lithium route is removed, so counts are not comparable
      with the former combined register. Lithium fields remain informational for
      diagnosis-qualified people.

    data_tests:
      - dbt_utils.at_least_one:
          column_name: person_id
      - cluster_ids_exist:
          arguments:
            cluster_ids: LITSTP_COD
            source: PCD

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "MH001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Mental Health"
          name_short: "Serious Mental Illness"
          description_short: "QOF 2025/26 serious mental illness register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. QOF v51 MH1 register for patients
            with an MH_COD diagnosis covering bipolar disorder, schizophrenia and other psychoses.
            Remission does not remove a diagnosed person. Codes in both MH_COD and MHREM_COD
            qualify; records only in MHREM_COD do not. Evidence is dated on or before today. The
            former MH2 lithium route is retired. No age restriction.
          is_qof: true
          qof_indicator: "MH001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "MH_COD"
              category: "INCLUSION"
            - cluster_id: "MHREM_COD"
              category: "RESOLUTION"
        indicators:
          - id: "IND257"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Mental Health"
            name_short: >-
              Psychosis and bipolar disorder register
            description_short: >-
              People with schizophrenia, bipolar disorder or other psychoses,
              including remission.
            description_long: >-
              Schizophrenia, bipolar affective disorder or other psychoses qualify at
              any age. People with a diagnosis remain included during remission;
              remission-only records do not qualify. Based on NICE CG178. Code list:
              MH_COD.
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "MH001"
            usage_contexts: ["NICE_GUIDANCE"]
          - id: "IND256"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Mental Health"
            name_short: >-
              Psychosis, bipolar disorder or lithium
            description_short: >-
              People with schizophrenia, bipolar disorder or other psychoses, or
              active lithium treatment.
            description_long: >-
              For NICE counts, include this diagnosis register and people with active
              lithium treatment from the long-term condition population, counting each
              person once. The diagnosis register alone omits lithium-only people.
              Lithium needs treatment in the six months before the build date with no
              later stop; diagnosis-qualified people do not need lithium treatment.
              Based on NICE CG178. Code lists: MH_COD and LITSTP_COD; lithium
              prescriptions come from the shared medication records.
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "MH001"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
