models:
  - name: fct_person_smi_register
    description: 'QOF v50 MH001 serious mental illness register. One row per person on
      the register: MH1_REG — has an MH_COD diagnosis (remission does not exclude;
      remission-only does not qualify); or MH2_REG — LIT_COD lithium in the last 6 months,
      not subsequently stopped (LITSTP_COD). Aligned with the calculate_smi_register macro.'

    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: LITSTP_COD
            source: PCD
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "MH003"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Mental Health"
          name_short: "Serious Mental Illness"
          description_short: "QOF serious mental illness register"
          description_long: >
            Serious mental illness register (QOF v50 MH001). Included if the patient has
            an MH_COD diagnosis (bipolar disorder, schizophrenia and other psychoses);
            remission (MHREM_COD) does not remove them from the register, but a
            remission-only record does not qualify. Also included on lithium therapy: a
            LIT_COD order in the last 6 months not subsequently stopped (LITSTP_COD).
            No age restriction.
          is_qof: true
          qof_indicator: "MH003"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "MH_COD"
              category: "INCLUSION"
            - cluster_id: "MHREM_COD"
              category: "RESOLUTION"
            - cluster_id: "LIT_COD"
              category: "INCLUSION"
            - cluster_id: "LITSTP_COD"
              category: "RESOLUTION"
        owner:
          name: EddieDavison92
