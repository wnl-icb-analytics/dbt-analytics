models:
  - name: fct_person_smi_register
    description: >-
      Psychosis and bipolar disorder register (NICE IND257). One row per register member.


      Registration status is not filtered. Schizophrenia, bipolar affective disorder or other
      psychoses qualify at any age. People with a diagnosis remain included during remission;
      remission-only records do not qualify. The model does not include lithium-only people;
      NICE IND256 needs the additional lithium population. Lithium fields describe treatment
      only for diagnosis-qualified people. For NICE counts, select people registered on the
      build date. Based on NICE CG178. Code lists: MH_COD (PCD).
    data_tests:
      - dbt_utils.at_least_one:
          column_name: person_id
      - cluster_ids_exist:
          arguments:
            cluster_ids: LITSTP_COD
            source: PCD

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "MH001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Mental Health"
          name_short: "Serious Mental Illness"
          description_short: "QOF 2025/26 serious mental illness register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. QOF v51 MH1 register for patients
            with an MH_COD diagnosis covering bipolar disorder, schizophrenia and other psychoses.
            Remission does not remove a diagnosed person. Codes in both MH_COD and MHREM_COD
            qualify; records only in MHREM_COD do not. Evidence is dated on or before today. The
            former MH2 lithium route is retired. No age restriction.
          is_qof: true
          qof_indicator: "MH001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "MH_COD"
              category: "INCLUSION"
            - cluster_id: "MHREM_COD"
              category: "RESOLUTION"
        indicators:
          - id: "IND257"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Mental Health"
            name_short: >-
              Psychosis and bipolar disorder register
            description_short: >-
              People with schizophrenia, bipolar disorder or other psychoses,
              including remission.
            description_long: >-
              Schizophrenia, bipolar affective disorder or other psychoses qualify at any age.
              People with a diagnosis remain included during remission; remission-only records
              do not qualify. Clinical evidence is dated by the build date. For NICE counts,
              select people registered on the build date. Based on NICE CG178. Code lists:
              MH_COD (PCD).
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "MH001"
            usage_contexts: ["NICE_GUIDANCE"]
          - id: "IND256"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Mental Health"
            name_short: >-
              Psychosis, bipolar disorder or lithium
            description_short: "NICE counts require this diagnosis register plus people on active lithium therapy."
            description_long: >-
              The NICE population includes people with schizophrenia, bipolar disorder or other
              psychoses, and people on lithium therapy. For NICE counts, combine this diagnosis
              register with people on active lithium treatment from the long-term condition
              population and count each person once. The register alone omits lithium-only
              people. Lithium requires a prescription in the 6 months before the build date with
              no stop on a later date; a same-day stop retains treatment. Diagnosis-qualified
              people do not need lithium. Select people registered on the build date. Based on
              NICE CG178. Code lists: MH_COD, LITSTP_COD, LIT_COD (PCD).
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "MH001"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
