models:
  - name: fct_person_smi_register
    description: >
      QOF v51 serious mental illness register. One row per person with an MH_COD
      diagnosis; remission does not exclude them and remission-only records do not
      qualify. The retired MH2 lithium route is removed, so counts are not comparable
      with the former combined register. Lithium fields remain informational for
      diagnosis-qualified people.

    data_tests:
      - dbt_utils.at_least_one:
          column_name: person_id
      - cluster_ids_exist:
          arguments:
            cluster_ids: LITSTP_COD

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "MH003"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Mental Health"
          name_short: "Serious Mental Illness"
          description_short: "QOF serious mental illness register"
          description_long: >
            QOF v51 MH1 register for patients with an MH_COD diagnosis covering bipolar
            disorder, schizophrenia and other psychoses. Remission does not remove a
            diagnosed person, but a remission-only record does not qualify. The former
            MH2 lithium route is retired. No age restriction.
          is_qof: true
          qof_indicator: "MH003"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "MH_COD"
              category: "INCLUSION"
            - cluster_id: "MHREM_COD"
              category: "RESOLUTION"
        owner:
          name: EddieDavison92
