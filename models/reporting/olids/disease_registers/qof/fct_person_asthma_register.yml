models:
  - name: fct_person_asthma_register
    description: 'QOF v51 asthma register for patients aged 5+ with active asthma diagnosis.

      One row per person with an AST_COD diagnosis and no ASTRES_COD on or after that date.
      Evidence is dated on or before today. ASTTRT_COD medication must be prescribed
      after the date 12 months before today and on or before today.'

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "AST006"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Respiratory"
          name_short: "Asthma"
          description_short: "QOF asthma register"
          description_long: >
            Asthma diagnosed using QOF v51 criteria: Age ≥5 years with an asthma diagnosis
            and no resolution dated after the latest diagnosis. Treatment must be
            prescribed after the date 12 months before today and on or before today. Maps to QOF
            indicator AST006 (Asthma Register). Uses AST_COD for diagnosis codes and  ASTRES_COD
            for resolution codes.
          is_qof: true
          qof_indicator: "AST006"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "AST_COD"
              category: "INCLUSION"
            - cluster_id: "ASTRES_COD"
              category: "RESOLUTION"
        owner:
          name: EddieDavison92
