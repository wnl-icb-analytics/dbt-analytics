models:
  - name: fct_person_cancer_register
    description: >
      Disease Registers (QOF v51) cancer register. One row per person with a
      first or new CAN_COD episode on or after 1 April 2003. CAN001 is retired;
      register extraction continues through the Disease Registers service.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "CAN001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Oncology"
          name_short: "Cancer"
          description_short: "QOF cancer register"
          description_long: >
            Disease Registers (QOF v51) cancer register. Includes a first or new
            CAN_COD episode on or after 1 April 2003. The CAN001
            register-establishment indicator is retired, but extraction continues.
          is_qof: true
          qof_indicator: "CAN001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "CAN_COD"
              category: "INCLUSION"
        owner:
          name: EddieDavison92
