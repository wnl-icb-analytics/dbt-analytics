models:
  - name: fct_person_depression_register
    description: >
      Disease Registers (QOF v51) depression register. One row per person aged 18
      or over whose latest first or new depression episode is on or after 1 April
      2006 and is not followed by DEPRES_COD. V51 activates extraction of this
      previously dormant register.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "DEP001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Mental Health"
          name_short: "Depression"
          description_short: "QOF depression register"
          description_long: >
            Disease Registers (QOF v51) depression register for patients aged 18 or
            over with an unresolved first or new episode on or after 1 April 2006.
            V51 activates register extraction; it does not change membership logic.
          is_qof: true
          qof_indicator: "DEP001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "DEPR_COD"
              category: "INCLUSION"
            - cluster_id: "DEPRES_COD"
              category: "RESOLUTION"
        owner:
          name: EddieDavison92
