models:
  - name: fct_person_rheumatoid_arthritis_register
    description: >
      Disease Registers (QOF v51) rheumatoid arthritis register. One row per
      person aged 16 or over with RARTH_COD dated on or before today. RA001 is
      retired; register extraction continues through the Disease Registers service.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "RA001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Rheumatology"
          name_short: "Rheumatoid Arthritis"
          description_short: "QOF 2025/26 rheumatoid arthritis register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. Disease Registers (QOF v51)
            rheumatoid arthritis register. Requires age 16 or over and RARTH_COD dated on or
            before today. RA001 is retired, but extraction continues.
          is_qof: true
          qof_indicator: "RA001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "RARTH_COD"
              category: "INCLUSION"
        indicators:
          - id: "IND107"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Rheumatology"
            name_short: >-
              Rheumatoid arthritis register
            description_short: >-
              People aged 16 or over with a rheumatoid arthritis diagnosis.
            description_long: >-
              Rheumatoid arthritis diagnoses qualify from age 16, without a resolution
              rule. Based on NICE NG100. Code list: RARTH_COD.
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "RA001"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
