models:
  - name: fct_person_rheumatoid_arthritis_register
    description: >
      Disease Registers (QOF v51) rheumatoid arthritis register. One row per
      person aged 16 or over with RARTH_COD. RA001 is retired; register extraction
      continues through the Disease Registers service.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "RA002"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Rheumatology"
          name_short: "Rheumatoid Arthritis"
          description_short: "QOF rheumatoid arthritis register"
          description_long: >
            Disease Registers (QOF v51) rheumatoid arthritis register. Requires
            age 16 or over and RARTH_COD. RA001 is retired, but extraction continues.
          is_qof: true
          qof_indicator: "RA002"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "RARTH_COD"
              category: "INCLUSION"
        owner:
          name: EddieDavison92
