models:
  - name: fct_person_epilepsy_register
    description: >
      Disease Registers (QOF v51) epilepsy register. One row per person aged 18 or
      over with unresolved EPIL_COD and epilepsy treatment in the preceding six
      months. EP001 is retired; register extraction continues through the Disease
      Registers service.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "EPIL001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Neurology"
          name_short: "Epilepsy"
          description_short: "QOF epilepsy register"
          description_long: >
            Disease Registers (QOF v51) epilepsy register for patients aged 18 or
            over with an unresolved EPIL_COD and EPILDRUG_COD in the preceding six
            months. EP001 is retired, but extraction continues.
          is_qof: true
          qof_indicator: "EPIL001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "EPIL_COD"
              category: "INCLUSION"
            - cluster_id: "EPILRES_COD"
              category: "RESOLUTION"
            - cluster_id: "EPILDRUG_COD"
              category: "INCLUSION"
        owner:
          name: EddieDavison92
