models:
  - name: fct_person_epilepsy_register
    description: >
      Disease Registers (QOF v51) epilepsy register. One row per person aged 18 or
      over with EPIL_COD and no EPILRES_COD on or after the latest EPIL_COD
      date; a same-day resolution removes membership. Diagnosis evidence is dated on or before
      today. EPILDRUG_COD treatment must be after today minus six months and on
      or before today. EP001 is retired; register extraction continues through the Disease
      Registers service.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "EP001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Neurology"
          name_short: "Epilepsy"
          description_short: "QOF 2025/26 epilepsy register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. Disease Registers (QOF v51)
            epilepsy register for patients aged 18 or over with EPIL_COD dated on or before today
            and no EPILRES_COD on or after the latest EPIL_COD date. A same-day resolution removes
            membership. EPILDRUG_COD treatment must be after today minus six months and on or
            before today. EP001 is retired, but extraction continues.
          is_qof: true
          qof_indicator: "EP001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "EPIL_COD"
              category: "INCLUSION"
            - cluster_id: "EPILRES_COD"
              category: "RESOLUTION"
            - cluster_id: "EPILDRUG_COD"
              category: "INCLUSION"
        indicators:
          - id: "IND253"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Neurology"
            name_short: "Epilepsy: register"
            description_short: "NICE Epilepsy: register"
            description_long: >
              NICE register of people aged 18 or over receiving drug treatment for epilepsy,
              excluding resolved diagnoses and people without treatment in the last six months. The
              model uses EPIL_COD, removes people with EPILRES_COD on or after the latest diagnosis
              and requires EPILDRUG_COD treatment after the six-month boundary and on or before
              today. A same-day resolution removes membership, whereas NICE specifies a resolution
              after the diagnosis. No additional filter is needed. QOF 2025/26 correspondence is
              EP001; the QOF v51 register-establishment indicator is retired, while the register
              extraction continues.
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "EP001"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
