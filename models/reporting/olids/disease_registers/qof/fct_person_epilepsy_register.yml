models:
  - name: fct_person_epilepsy_register
    description: >-
      Treated epilepsy register for adults (NICE IND253). One row per register member.


      Registration status is not filtered. People aged 18 or over need an epilepsy diagnosis and
      drug treatment in the 6 months before the build date. A resolved code on or after the
      latest diagnosis date removes membership; NICE excludes resolution after diagnosis, so
      same-day resolution is an extra exclusion here. Clinical evidence is dated by the build
      date. For NICE counts, select people registered on the build date. Based on NICE NG217.
      Code lists: EPIL_COD, EPILRES_COD, EPILDRUG_COD (PCD).
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "EP001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Neurology"
          name_short: "Epilepsy"
          description_short: "QOF 2025/26 epilepsy register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. Disease Registers (QOF v51)
            epilepsy register for patients aged 18 or over with EPIL_COD dated on or before today
            and no EPILRES_COD on or after the latest EPIL_COD date. A same-day resolution removes
            membership. EPILDRUG_COD treatment must be after today minus six months and on or
            before today. EP001 is retired, but extraction continues.
          is_qof: true
          qof_indicator: "EP001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "EPIL_COD"
              category: "INCLUSION"
            - cluster_id: "EPILRES_COD"
              category: "RESOLUTION"
            - cluster_id: "EPILDRUG_COD"
              category: "INCLUSION"
        indicators:
          - id: "IND253"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Neurology"
            name_short: >-
              Treated epilepsy register
            description_short: >-
              Adults with unresolved epilepsy and drug treatment in the preceding six
              months.
            description_long: >-
              People aged 18 or over need an epilepsy diagnosis and drug treatment in the 6
              months before the build date. A resolved code on or after the latest diagnosis
              date removes membership; NICE excludes resolution after diagnosis, so same-day
              resolution is an extra exclusion here. Clinical evidence is dated by the build
              date. For NICE counts, select people registered on the build date. Based on NICE
              NG217. Code lists: EPIL_COD, EPILRES_COD, EPILDRUG_COD (PCD).
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "EP001"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
