models:
  - name: fct_person_learning_disability_register
    description: >
      Disease Registers (QOF v51) learning disability register. One row per person
      with LD_COD and no LDREM_COD on or after the latest diagnosis. There is no
      age restriction. Evidence is dated on or before today; comparisons use
      calendar dates. LD005 is retired; register extraction continues through the
      Disease Registers service.
      
      Membership criteria:
      - Has LD diagnosis (LD_COD)
      - NOT excluded (no LDREM_COD on or after latest LD_COD)
      - No age restriction (includes all ages per QOF spec)
      
      Use is_age_14_or_over column to filter for annual health check eligibility.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

      - name: is_age_14_or_over
        description: Flag indicating patient is 14+ (for annual health check eligibility)

    config:
      meta:
        indicator:
          id: "LD005"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Neurodevelopmental"
          name_short: "Learning Disability"
          description_short: "QOF 2025/26 learning disability register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. Disease Registers (QOF v51)
            learning disability register for patients with LD_COD and no LDREM_COD on or after the
            latest diagnosis date. Evidence is dated on or before today. There is no age
            restriction. LD005 is retired, but extraction continues.
          is_qof: true
          qof_indicator: "LD005"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "LD_COD"
              category: "INCLUSION"
            - cluster_id: "LDREM_COD"
              category: "EXCLUSION"
        indicators:
          - id: "IND119"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Neurodevelopmental"
            name_short: "Learning disabilities: register"
            description_short: "NICE Learning disabilities: register"
            description_long: >
              NICE register of people with a learning disability diagnosis, excluding those without
              such a diagnosis. The model uses LD_COD and removes people with LDREM_COD on or after
              the latest diagnosis. There is no age restriction. No additional filter is needed. QOF
              2025/26 correspondence is LD005; the QOF v51 register-establishment indicator is
              retired, while the register extraction continues.
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "LD005"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
