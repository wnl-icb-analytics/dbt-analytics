models:
  - name: fct_person_learning_disability_register
    description: >
      Disease Registers (QOF v51) learning disability register. One row per person
      with LD_COD and no LDREM_COD on or after the latest diagnosis. There is no
      age restriction. LD005 is retired; register extraction continues through the
      Disease Registers service.
      
      Membership criteria:
      - Has LD diagnosis (LD_COD)
      - NOT excluded (no LDREM_COD after latest LD_COD)
      - No age restriction (includes all ages per QOF spec)
      
      Use is_age_14_or_over column to filter for annual health check eligibility.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

      - name: is_age_14_or_over
        description: Flag indicating patient is 14+ (for annual health check eligibility)

    config:
      meta:
        indicator:
          id: "LD005"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Neurodevelopmental"
          name_short: "Learning Disability"
          description_short: "QOF learning disability register"
          description_long: >
            Disease Registers (QOF v51) learning disability register for patients
            with LD_COD and no later LDREM_COD. There is no age restriction. LD005
            is retired, but extraction continues.
          is_qof: true
          qof_indicator: "LD005"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "LD_COD"
              category: "INCLUSION"
            - cluster_id: "LDREM_COD"
              category: "EXCLUSION"
        owner:
          name: EddieDavison92
