models:
  - name: fct_person_pad_register
    description: >
      Disease Registers (QOF v51) peripheral arterial disease register. One row
      per person with PAD_COD dated on or before today. PAD001 is retired; register extraction continues
      through the Disease Registers service.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "PAD001"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Cardiovascular"
          name_short: "Peripheral Arterial Disease"
          description_short: "QOF 2025/26 peripheral arterial disease register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. Disease Registers (QOF v51) PAD
            register. Any PAD_COD dated on or before today qualifies, with no age or resolution
            rule. PAD001 is retired, but extraction continues.
          is_qof: true
          qof_indicator: "PAD001"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "PAD_COD"
              category: "INCLUSION"
        indicators:
          - id: "IND93"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Cardiovascular"
            name_short: "Peripheral arterial disease: register"
            description_short: "NICE Peripheral arterial disease: register"
            description_long: >
              NICE register of people diagnosed with peripheral arterial disease, with no
              exclusions. The model uses any PAD_COD diagnosis, with no age or resolution rule. No
              additional filter is needed. QOF 2025/26 correspondence is PAD001; the QOF v51
              register-establishment indicator is retired, while the register extraction continues.
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "PAD001"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
