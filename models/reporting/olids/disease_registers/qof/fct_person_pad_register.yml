models:
  - name: fct_person_pad_register
    description: >
      Disease Registers (QOF v51) peripheral arterial disease register. One row
      per person with PAD_COD. PAD001 is retired; register extraction continues
      through the Disease Registers service.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "PAD002"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Cardiovascular"
          name_short: "Peripheral Arterial Disease"
          description_short: "QOF peripheral arterial disease register"
          description_long: >
            Disease Registers (QOF v51) PAD register. Any PAD_COD qualifies, with
            no age or resolution rule. PAD001 is retired, but extraction continues.
          is_qof: true
          qof_indicator: "PAD002"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "PAD_COD"
              category: "INCLUSION"
        owner:
          name: EddieDavison92
