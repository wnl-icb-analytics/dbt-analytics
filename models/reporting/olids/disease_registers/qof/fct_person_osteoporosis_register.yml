models:
  - name: fct_person_osteoporosis_register
    description: >
      Disease Registers (QOF v51) osteoporosis register. One row per person on
      OSTEO1_REG or OSTEO2_REG. OSTEO1 covers ages 50-74 with a fragility fracture
      from 1 April 2012, OSTEO_COD and DXA confirmation. OSTEO2 covers ages 75 or
      over with a fragility fracture from 1 April 2014 and OSTEO_COD. OST004 is
      retired; register extraction continues through the Disease Registers service.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "OST004"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Musculoskeletal"
          name_short: "Osteoporosis"
          description_short: "QOF osteoporosis register"
          description_long: >
            Disease Registers (QOF v51) OSTEO1 and OSTEO2 registers. OSTEO1 requires
            age 50-74, a fragility fracture from 1 April 2012, OSTEO_COD and DXA
            confirmation. OSTEO2 requires age 75 or over, a fragility fracture from
            1 April 2014 and OSTEO_COD. OST004 is retired, but extraction continues.
          is_qof: true
          qof_indicator: "OST004"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "OSTEO_COD"
              category: "INCLUSION"
            - cluster_id: "FF_COD"
              category: "INCLUSION"
            - cluster_id: "DXA_COD"
              category: "INCLUSION"
            - cluster_id: "DXA2_COD"
              category: "INCLUSION"
        owner:
          name: EddieDavison92
