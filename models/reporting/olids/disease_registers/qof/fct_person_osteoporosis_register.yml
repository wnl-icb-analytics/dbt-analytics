models:
  - name: fct_person_osteoporosis_register
    description: >-
      Osteoporosis with fragility fracture register (NICE IND90). One row per register member.


      Registration status is not filtered. People aged 50 to 74 need osteoporosis, a fragility
      fracture on or after 1 April 2012 and DXA confirmation. Confirmation is a DXA procedure or
      an unrounded T-score of -2.5 or less, without a lower validity limit. People aged 75 or
      over need osteoporosis and a fragility fracture on or after 1 April 2014; no scan is
      required. These age and fracture rules match NICE IND90. A procedure code alone does not
      prove osteoporosis on the scan. Clinical evidence is dated by the build date. For NICE
      counts, select people registered on the build date. Based on NICE CG146. Code lists:
      OSTEO_COD, FF_COD, DXA_COD, DXA2_COD (PCD).
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "OST004"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Musculoskeletal"
          name_short: "Osteoporosis"
          description_short: "QOF 2025/26 osteoporosis register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. Disease Registers (QOF v51) OSTEO1
            and OSTEO2 registers. OSTEO1 requires age 50-74, a fragility fracture from 1 April
            2012, OSTEO_COD and DXA confirmation (DXA_COD or an unrounded DXA2_COD T-score <=
            -2.5, with no lower limit). OSTEO2 requires age 75 or over, a fragility fracture from
            1 April 2014 and OSTEO_COD, with no DXA requirement. Evidence is dated on or before
            today. OST004 is retired, but extraction continues.
          is_qof: true
          qof_indicator: "OST004"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "OSTEO_COD"
              category: "INCLUSION"
            - cluster_id: "FF_COD"
              category: "INCLUSION"
            - cluster_id: "DXA_COD"
              category: "INCLUSION"
            - cluster_id: "DXA2_COD"
              category: "INCLUSION"
        indicators:
          - id: "IND90"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Musculoskeletal"
            name_short: >-
              Osteoporosis register
            description_short: "People aged 50 or over with osteoporosis and a qualifying fragility fracture."
            description_long: >-
              People aged 50 to 74 need osteoporosis, a fragility fracture on or after 1 April
              2012 and DXA confirmation. Confirmation is a DXA procedure or an unrounded T-score
              of -2.5 or less, without a lower validity limit. People aged 75 or over need
              osteoporosis and a fragility fracture on or after 1 April 2014; no scan is
              required. These age and fracture rules match NICE IND90. A procedure code alone
              does not prove osteoporosis on the scan. Clinical evidence is dated by the build
              date. For NICE counts, select people registered on the build date. Based on NICE
              CG146. Code lists: OSTEO_COD, FF_COD, DXA_COD, DXA2_COD (PCD).
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "OST004"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
