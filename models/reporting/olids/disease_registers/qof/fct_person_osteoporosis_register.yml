models:
  - name: fct_person_osteoporosis_register
    description: >
      Disease Registers (QOF v51) osteoporosis register. One row per person on
      OSTEO1_REG or OSTEO2_REG. OSTEO1 covers ages 50-74 with a fragility fracture
      from 1 April 2012, OSTEO_COD and DXA confirmation (DXA_COD or an unrounded
      DXA2_COD T-score <= -2.5, with no lower limit). Evidence is dated on or
      before today. OSTEO2 covers ages 75 or
      over with a fragility fracture from 1 April 2014 and OSTEO_COD. OST004 is
      retired; register extraction continues through the Disease Registers service.
      OSTEO2 has no DXA requirement.

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "OST004"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Musculoskeletal"
          name_short: "Osteoporosis"
          description_short: "QOF 2025/26 osteoporosis register"
          description_long: >
            QOF 2025/26 register correspondence; register-establishment indicators are retired
            under QOF v51, while register extraction continues. Disease Registers (QOF v51) OSTEO1
            and OSTEO2 registers. OSTEO1 requires age 50-74, a fragility fracture from 1 April
            2012, OSTEO_COD and DXA confirmation (DXA_COD or an unrounded DXA2_COD T-score <=
            -2.5, with no lower limit). OSTEO2 requires age 75 or over, a fragility fracture from
            1 April 2014 and OSTEO_COD, with no DXA requirement. Evidence is dated on or before
            today. OST004 is retired, but extraction continues.
          is_qof: true
          qof_indicator: "OST004"
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "QOF"
          code_clusters:
            - cluster_id: "OSTEO_COD"
              category: "INCLUSION"
            - cluster_id: "FF_COD"
              category: "INCLUSION"
            - cluster_id: "DXA_COD"
              category: "INCLUSION"
            - cluster_id: "DXA2_COD"
              category: "INCLUSION"
        indicators:
          - id: "IND90"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Musculoskeletal"
            name_short: "Osteoporosis: register"
            description_short: "NICE Osteoporosis: register"
            description_long: >
              NICE register of people aged 50-74 with a fragility fracture on or after 1 April 2012
              and DXA-confirmed osteoporosis, plus people aged 75 or over with a fragility fracture
              on or after 1 April 2014 and osteoporosis. The model follows those age and date rules
              using OSTEO_COD and FF_COD. DXA confirmation uses DXA_COD or an unrounded DXA2_COD
              T-score <= -2.5. No additional filter is needed. QOF 2025/26 correspondence is OST004;
              the QOF v51 register-establishment indicator is retired, while the register extraction
              continues.
            source_column: "is_on_register"
            is_qof: true
            qof_indicator: "OST004"
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
