models:
  - name: fct_person_familial_hypercholesterolaemia_register
    description: 'Familial hypercholesterolaemia register: active patients with an FH
      diagnosis code (FHYP_COD) at any age.

      One row per person. FH is genetic and lifelong, so there are no resolution codes
      and no age rule; QOF v51 and the NICE indicators that exclude FH read FHYP_COD
      the same way. Not a QOF register.'

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    config:
      meta:
        indicator:
          id: "FH"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Cardiovascular"
          name_short: "Familial Hypercholesterolaemia"
          description_short: "Familial hypercholesterolaemia register for genetic
            lipid disorder (non-QOF)"
          description_long: >
            Familial hypercholesterolaemia register for persons with genetic lipid
            disorder diagnosis. Includes active patients with an FH diagnosis code
            (FHYP_COD) at any age. No resolution codes as FH is a genetic condition.  Used for cascade family screening programmes, high-intensity
            statin therapy  monitoring, and genetic cardiovascular risk management.
            Critical for identifying  families requiring lipid screening and specialist
            cardiovascular care.
          is_qof: false
          source_column: "is_on_register"
          sort_order: "COND_CARDIO_FH"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
          code_clusters:
            - cluster_id: "FHYP_COD"
              category: "INCLUSION"

        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null
