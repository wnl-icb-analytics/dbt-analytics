models:
  - name: fct_person_ms_register
    description: >
      Multiple sclerosis register for patients with MS diagnosis. One row per person with
      MS_COD present (non-QOF).

      Observation counts include each person, concept, clinical calendar date and recorded
      value once, including value-free entries. Register membership and first/last dates use
      the full evidence history. Missing clinical days keep separate observation ids.


    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    config:
      meta:
        indicator:
          id: "MS"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Neurology"
          name_short: "Multiple Sclerosis"
          description_short: "Multiple sclerosis register (non-QOF)"
          description_long: >
            Multiple sclerosis register for persons with MS diagnosis.  Includes active
            patients with MS diagnosis using MS_COD cluster codes.  No age restrictions
            or resolution codes applied. Used for neurological care  pathway monitoring,
            disease-modifying therapy monitoring, multidisciplinary  team coordination,
            and symptom management. Chronic neurological condition  requiring ongoing
            care and support.
          is_qof: false
          source_column: "is_on_register"
          sort_order: "COND_NEURO_MS"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
          code_clusters:
            - cluster_id: "MS_COD"
              category: "INCLUSION"

        owner:
          name: Eddie Davison
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null
