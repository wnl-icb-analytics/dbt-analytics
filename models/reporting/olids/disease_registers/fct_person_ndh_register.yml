models:
  - name: fct_person_ndh_register
    description: >-
      Coded non-diabetic hyperglycaemia register (NICE IND170). One row per register member.


      Registration status is not filtered. People aged 18 or over with coded non-diabetic
      hyperglycaemia, pre-diabetes or impaired glucose tolerance qualify; unresolved diabetes is
      excluded. Diabetes is resolved only when its latest resolution timestamp is later than its
      latest diagnosis. Gestational diabetes alone does not qualify. NICE also accepts two
      consecutive HbA1c results of 42 to 47 mmol/mol or fasting glucose results of 5.5 to 6.9
      mmol/L within 3 months; this register uses diagnosis codes only. Future-dated records can
      affect membership. For NICE counts, select people registered on the build date. Based on
      NICE PH38. Code lists: NDH_COD, IGT_COD, PRD_COD, DM_COD, DMRES_COD (PCD).
    config:
      meta:
        indicator:
          id: "NDH_CLINICAL"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Cardiometabolic"
          name_short: "Non-Diabetic Hyperglycaemia"
          description_short: "Clinical NDH register"
          description_long: >
            People aged 18 or over with NDH, impaired glucose tolerance or
            pre-diabetes evidence who meet the diabetes-history rules. This
            population-health cohort excludes the QOF gestational-diabetes route.
          is_qof: false
          source_column: "is_on_register"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
          code_clusters:
            - cluster_id: "NDH_COD"
              category: "INCLUSION"
            - cluster_id: "IGT_COD"
              category: "INCLUSION"
            - cluster_id: "PRD_COD"
              category: "INCLUSION"
        indicators:
          - id: "IND170"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Cardiometabolic"
            name_short: >-
              Non-diabetic hyperglycaemia register
            description_short: >-
              Adults with coded non-diabetic hyperglycaemia, pre-diabetes or impaired
              glucose tolerance.
            description_long: >-
              People aged 18 or over with coded non-diabetic hyperglycaemia, pre-diabetes or
              impaired glucose tolerance qualify; unresolved diabetes is excluded. Diabetes is
              resolved only when its latest resolution timestamp is later than its latest
              diagnosis. Gestational diabetes alone does not qualify. NICE also accepts two
              consecutive HbA1c results of 42 to 47 mmol/mol or fasting glucose results of 5.5
              to 6.9 mmol/L within 3 months; this register uses diagnosis codes only. Records dated
              after the build date can affect membership. For NICE counts, select people registered on
              the build date. Based on NICE PH38. Code lists: NDH_COD, IGT_COD, PRD_COD, DM_COD,
              DMRES_COD (PCD).
            source_column: "is_on_register"
            is_qof: false
            qof_indicator: null
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.at_least_one:
          column_name: person_id
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              has_ndh_diagnosis OR has_igt_diagnosis OR has_prd_diagnosis
    columns:
      - name: person_id
        description: Unique identifier for the person
        data_tests:
          - unique
          - not_null
      - name: is_on_register
        description: Always true because this fact contains register members only
        data_tests:
          - accepted_values:
              arguments:
                values: [true]
      - name: earliest_diagnosis_date
        description: Earliest NDH, impaired glucose tolerance or pre-diabetes date
      - name: latest_diagnosis_date
        description: Latest NDH, impaired glucose tolerance or pre-diabetes date
      - name: has_ndh_route
        description: Always true because every row has age-eligible NDH evidence
        data_tests:
          - accepted_values:
              arguments:
                values: [true]
