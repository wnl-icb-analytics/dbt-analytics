models:
  - name: fct_person_frailty_register
    description: >-
      Coded frailty register (NICE IND206). One row per register member.


      Registration status is not filtered. The model includes all ages and coded mild, moderate
      or severe frailty. Latest clinical timestamps determine severity; equal timestamps prefer
      greater severity. No resolution rule applies. Future-dated findings can affect membership.
      For NICE IND206, select people registered on the build date, aged 65 or over, with latest
      severity Moderate or Severe. Calculated
      electronic frailty index scores do not determine membership. Based on NICE NG56. Code
      lists: MILDFRAIL_COD, MODFRAIL_COD, SEVFRAIL_COD (PCD).
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    config:
      meta:
        indicator:
          id: "FRAILTY"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Geriatric"
          name_short: "Frailty"
          description_short: "Frailty register with severity stratification (non-QOF)"
          description_long: >
            Frailty register for persons with a coded frailty severity from the PCD
            clusters MILDFRAIL_COD, MODFRAIL_COD and SEVFRAIL_COD. Latest coded
            severity takes precedence. No age restriction and no resolution codes.
            Used for comprehensive geriatric assessment, falls prevention, medication
            review, care coordination and frailty-stratified NICE measures.
          is_qof: false
          source_column: "is_on_register"
          sort_order: "COND_GERIAT_FRAILTY"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
          code_clusters:
            - cluster_id: "MILDFRAIL_COD"
              category: "INCLUSION"
            - cluster_id: "MODFRAIL_COD"
              category: "INCLUSION"
            - cluster_id: "SEVFRAIL_COD"
              category: "INCLUSION"

        indicators:
          - id: "IND206"
            type: "NICE_REGISTER"
            category: "LTC"
            clinical_domain: "Geriatric"
            name_short: >-
              Moderate or severe frailty register
            description_short: "NICE counts require age 65 or over and latest coded frailty Moderate or Severe."
            description_long: >-
              For NICE counts, select people registered on the build date, aged 65 or over,
              whose latest coded frailty is Moderate or Severe. The model also contains younger
              people and mild frailty. Severity is coded, including Clinical Frailty Scale
              levels 6 to 8, rather than calculated from the electronic frailty index. Latest
              clinical timestamps determine severity; equal timestamps prefer greater severity.
              Future-dated findings can affect the live register. Based on NICE NG56. Code
              lists: MILDFRAIL_COD, MODFRAIL_COD, SEVFRAIL_COD (PCD).
            source_column: "is_on_register"
            is_qof: false
            qof_indicator: null
            usage_contexts: ["NICE_GUIDANCE"]
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null
      - name: age
        description: >-
          Age in years from the approximate birth month, at the build date or at death for
          deceased people; null when birth date is missing.

      - name: is_on_register
        description: Always true; every row is a person with a coded frailty severity.
      - name: latest_frailty_severity
        description: >-
          Severity of the latest coded finding by clinical timestamp. Equal timestamps prefer
          greater severity, then the higher observation ID.

        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Mild', 'Moderate', 'Severe']
      - name: earliest_diagnosis_date
        description: Earliest coded frailty severity date.
      - name: latest_diagnosis_date
        description: Latest coded frailty severity date.
      - name: mild_frailty_count
        description: Count of mild frailty codes ever recorded.
      - name: moderate_frailty_count
        description: Count of moderate frailty codes ever recorded.
      - name: severe_frailty_count
        description: Count of severe frailty codes ever recorded.
      - name: total_frailty_diagnoses
        description: Count of coded frailty severity observations ever recorded.
      - name: all_frailty_concept_codes
        description: Distinct SNOMED codes recorded, for traceability.
      - name: all_frailty_concept_displays
        description: Descriptions of the distinct codes recorded.
