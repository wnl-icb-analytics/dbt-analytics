models:
  - name: pit_smi_register
    description: >
      QOF v51 serious mental illness register calculated as of {{ var('qof_reference_date')
      }}. Membership requires an MH_COD diagnosis. The retired lithium route is
      excluded, so counts are not comparable with the former combined register.
      Override with: dbt build --vars '{"qof_reference_date": "YYYY-MM-DD"}'
    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        description: Person identifier
        tests:
          - unique
          - not_null
      - name: register_name
        description: Register name (e.g., 'Serious Mental Illness')
      - name: is_on_register
        description: Whether person qualifies for register at reference date
      - name: reference_date
        description: Date at which register status was calculated
