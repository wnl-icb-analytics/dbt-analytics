models:
  - name: pit_asthma_register
    description: >
      QOF v51 asthma register for patients aged 5 or over with an unresolved
      diagnosis and asthma medication in the preceding 12 months, calculated as
      of {{ var('qof_reference_date') }}.
      Override with: dbt build --vars '{"qof_reference_date": "YYYY-MM-DD"}'
    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        description: Person identifier
        tests:
          - unique
          - not_null
      - name: register_name
        description: Register name (e.g., 'Asthma')
      - name: is_on_register
        description: Whether the person meets the age, diagnosis and medication criteria
      - name: reference_date
        description: Date at which register status was calculated
