models:
  - name: pit_obesity2_register
    description: >
      QOF v51 OBES2 eligibility evaluated at qof_reference_date. One row
      represents a person with a qualifying BMI candidate in the preceding 12
      months and records whether all remaining rules were met.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Person identifier
        data_tests:
          - not_null
          - unique
      - name: register_name
        description: Register name, Obesity2
        data_tests:
          - accepted_values:
              arguments:
                values: [Obesity2]
      - name: is_on_register
        description: Whether the person qualifies at the reference date
        data_tests:
          - not_null
      - name: reference_date
        description: Date at which eligibility was evaluated
        data_tests:
          - not_null
