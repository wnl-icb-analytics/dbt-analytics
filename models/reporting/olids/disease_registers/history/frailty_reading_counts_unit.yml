unit_tests:
  - name: monthly_frailty_counts_distinct_readings
    model: fct_person_frailty_register_by_month
    overrides:
      macros:
        ltc_register_history_month_ends: "SELECT '2022-01-31'::DATE AS reference_date"
        get_empty_subquery_sql: "SELECT NULL::NUMBER AS person_id, NULL::DATE AS month_end_date, NULL::NUMBER AS mild_frailty_count, NULL::NUMBER AS moderate_frailty_count, NULL::NUMBER AS severe_frailty_count WHERE FALSE"
    given:
      - input: ref('int_frailty_diagnoses_all')
        format: sql
        fixture: value_free_reentered_observation_readings
      - input: ref('int_segmentation_person_month_spine')
        format: sql
        rows: |
          SELECT column1::NUMBER AS person_id, '2022-01-31'::DATE AS month_end_date,
              'SYN_PRACTICE'::VARCHAR AS practice_code, TRUE::BOOLEAN AS is_active
          FROM VALUES (-145441), (-145442)
    expect:
      rows:
        - {person_id: -145441, month_end_date: '2022-01-31', mild_frailty_count: 3, moderate_frailty_count: 0, severe_frailty_count: 0}
        - {person_id: -145442, month_end_date: '2022-01-31', mild_frailty_count: 1, moderate_frailty_count: 0, severe_frailty_count: 0}
