models:
  - name: fct_person_diabetes_register_by_month
    description: >
      Diabetes register at each completed month-end, on the QOF rules of
      fct_person_diabetes_register: aged 17 or over, with a diabetes code and no
      later resolution code (a same-day resolution does not remove it). The
      type comes from the later of the latest Type 1 and Type 2 codes; Type 1
      wins when both have the same timestamp.
      {{ doc('ltc_register_by_month_scope') }}
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - month_end_date
    columns:
      - name: person_id
        data_tests:
          - not_null
      - name: month_end_date
        description: "{{ doc('ltc_register_by_month_month_end_date') }}"
        data_tests:
          - not_null
      - name: practice_code
        description: "{{ doc('ltc_register_by_month_practice_code') }}"
      - name: diabetes_type
        description: Type 1, Type 2 or Unknown, from the latest type-specific code known by the month-end.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Type 1', 'Type 2', 'Unknown']
      - name: earliest_diagnosis_date
        description: Earliest diabetes code known by the month-end.
      - name: latest_diagnosis_date
        description: Latest diabetes code known by the month-end.
      - name: latest_resolved_date
        description: Latest diabetes resolved code known by the month-end; on or before the latest diagnosis.
      - name: earliest_type1_date
        description: Earliest Type 1 code known by the month-end.
      - name: latest_type1_date
        description: Latest Type 1 code known by the month-end.
      - name: earliest_type2_date
        description: Earliest Type 2 code known by the month-end.
      - name: latest_type2_date
        description: Latest Type 2 code known by the month-end.
