models:
  - name: fct_person_learning_disability_register_by_month
    description: >
      Learning disability register at each completed month-end, on the QOF rules
      of fct_person_learning_disability_register: an LD_COD diagnosis later than
      any LDREM_COD exclusion. There is no age restriction.
      {{ doc('ltc_register_by_month_scope') }}
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - month_end_date
    columns:
      - name: person_id
        data_tests:
          - not_null
      - name: month_end_date
        description: "{{ doc('ltc_register_by_month_month_end_date') }}"
        data_tests:
          - not_null
      - name: practice_code
        description: "{{ doc('ltc_register_by_month_practice_code') }}"
      - name: earliest_diagnosis_date
        description: Earliest learning disability diagnosis known by the month-end.
      - name: latest_diagnosis_date
        description: Latest learning disability diagnosis known by the month-end.
