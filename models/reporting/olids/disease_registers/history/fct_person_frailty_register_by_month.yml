models:
  - name: fct_person_frailty_register_by_month
    description: >
      Frailty register at each completed month-end, on the rules of
      fct_person_frailty_register: a MILDFRAIL_COD, MODFRAIL_COD or SEVFRAIL_COD
      finding, with no age restriction or resolution codes. Latest coded severity
      takes precedence; same-date ties prefer greater severity, then the higher
      observation ID; calculated frailty scores are excluded.
      {{ doc('ltc_register_by_month_scope') }}
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - month_end_date
    columns:
      - name: person_id
        data_tests:
          - not_null
      - name: month_end_date
        description: "{{ doc('ltc_register_by_month_month_end_date') }}"
        data_tests:
          - not_null
      - name: practice_code
        description: "{{ doc('ltc_register_by_month_practice_code') }}"
      - name: latest_frailty_severity
        description: Severity of the latest coded frailty finding known by the month-end; same-date ties prefer greater severity, then the higher observation ID.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Mild', 'Moderate', 'Severe']
      - name: earliest_diagnosis_date
        description: Earliest frailty diagnosis known by the month-end.
      - name: latest_diagnosis_date
        description: Latest frailty diagnosis known by the month-end.
      - name: mild_frailty_count
        description: Count of mild frailty findings known by the month-end.
      - name: moderate_frailty_count
        description: Count of moderate frailty findings known by the month-end.
      - name: severe_frailty_count
        description: Count of severe frailty findings known by the month-end.
