models:
  - name: fct_person_depression_register_by_month
    description: >
      Depression register at each completed month-end, on the QOF rules of
      fct_person_depression_register: aged 18 or over whose latest first or new
      episode is on or after 1 April 2006 and later than any resolution code.
      {{ doc('ltc_register_by_month_scope') }}
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - month_end_date
    columns:
      - name: person_id
        data_tests:
          - not_null
      - name: month_end_date
        description: "{{ doc('ltc_register_by_month_month_end_date') }}"
        data_tests:
          - not_null
      - name: practice_code
        description: "{{ doc('ltc_register_by_month_practice_code') }}"
      - name: earliest_diagnosis_date
        description: Earliest first or new depression episode known by the month-end.
      - name: latest_diagnosis_date
        description: Latest first or new depression episode known by the month-end.
      - name: latest_resolved_date
        description: Latest depression resolved code known by the month-end.
