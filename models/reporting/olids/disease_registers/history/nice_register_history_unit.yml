unit_tests:
- name: aki_known_dates_age_and_multiplicity
  model: fct_person_aki_register_by_month
  overrides:
    macros:
      ltc_register_history_month_ends: SELECT column1::DATE AS reference_date FROM VALUES ('2026-09-30'), ('2026-10-31')
  given:
  - input: ref('int_nice_reference_population_by_month')
    format: sql
    rows: |-
      SELECT people.column1::NUMBER AS person_id, dates.column1::DATE AS reporting_date,
          CASE WHEN people.column1 = -602 AND dates.column1 = '2026-09-30' THEN 17 ELSE 18 END AS age,
          '2008-10-01'::DATE AS birth_date_approx, 'Female'::VARCHAR AS gender,
          'SYNTHETIC'::VARCHAR AS practice_code, 'Synthetic practice'::VARCHAR AS practice_name
      FROM VALUES (-601), (-602), (-603), (-604), (-605), (-606), (-607), (-608), (-609) AS people
      CROSS JOIN (VALUES ('2026-09-30'), ('2026-10-31')) AS dates
      WHERE NOT (people.column1 = -608 AND dates.column1 = '2026-10-31')
  - input: ref('int_aki_diagnoses_all')
    format: sql
    rows: |-
      SELECT column1::NUMBER AS person_id, column2::TIMESTAMP_NTZ AS clinical_effective_date,
          column3::TIMESTAMP_NTZ AS date_recorded
      FROM VALUES (-601, '2026-09-30', '2026-10-01'), (-602, '2020-01-01', NULL),
          (-603, '2026-10-01', NULL), (-604, '2020-01-01', NULL), (-605, '2027-01-01', NULL),
          (-606, '2020-01-01', NULL), (-606, '2020-01-01', NULL), (-607, '2026-09-30', '2026-09-30'),
          (-608, '2020-01-01', NULL), (-609, '2020-01-01', '2026-10-01'), (-609, '2026-09-01', NULL)
  expect:
    rows:
    - person_id: -604
      month_end_date: '2026-09-30'
      earliest_diagnosis_date: '2020-01-01'
      latest_diagnosis_date: '2020-01-01'
    - person_id: -606
      month_end_date: '2026-09-30'
      earliest_diagnosis_date: '2020-01-01'
      latest_diagnosis_date: '2020-01-01'
    - person_id: -607
      month_end_date: '2026-09-30'
      earliest_diagnosis_date: '2026-09-30'
      latest_diagnosis_date: '2026-09-30'
    - person_id: -608
      month_end_date: '2026-09-30'
      earliest_diagnosis_date: '2020-01-01'
      latest_diagnosis_date: '2020-01-01'
    - person_id: -609
      month_end_date: '2026-09-30'
      earliest_diagnosis_date: '2026-09-01'
      latest_diagnosis_date: '2026-09-01'
    - person_id: -601
      month_end_date: '2026-10-31'
      earliest_diagnosis_date: '2026-09-30'
      latest_diagnosis_date: '2026-09-30'
    - person_id: -602
      month_end_date: '2026-10-31'
      earliest_diagnosis_date: '2020-01-01'
      latest_diagnosis_date: '2020-01-01'
    - person_id: -603
      month_end_date: '2026-10-31'
      earliest_diagnosis_date: '2026-10-01'
      latest_diagnosis_date: '2026-10-01'
    - person_id: -604
      month_end_date: '2026-10-31'
      earliest_diagnosis_date: '2020-01-01'
      latest_diagnosis_date: '2020-01-01'
    - person_id: -606
      month_end_date: '2026-10-31'
      earliest_diagnosis_date: '2020-01-01'
      latest_diagnosis_date: '2020-01-01'
    - person_id: -607
      month_end_date: '2026-10-31'
      earliest_diagnosis_date: '2026-09-30'
      latest_diagnosis_date: '2026-09-30'
    - person_id: -609
      month_end_date: '2026-10-31'
      earliest_diagnosis_date: '2020-01-01'
      latest_diagnosis_date: '2026-09-01'
  config:
    tags:
    - monthly-full
    - nice-history
- name: hypothyroidism_treatment_expiry_latest_diagnosis_and_known_dates
  model: fct_person_nice_hypothyroidism_register_by_month
