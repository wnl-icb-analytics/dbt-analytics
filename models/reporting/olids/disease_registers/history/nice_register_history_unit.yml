  given:
  - input: ref('int_nice_reference_population_by_month')
    format: sql
    rows: "SELECT people.column1::NUMBER AS person_id, dates.column1::DATE AS reporting_date,\n    IFF(people.column1\
      \ = -700 AND dates.column1 = '2026-09-30', 17, 18)::NUMBER AS age,\n    '2008-10-01'::DATE AS birth_date_approx,\
      \ 'Female'::VARCHAR AS gender,\n    'SYNTHETIC'::VARCHAR AS practice_code, 'Synthetic practice'::VARCHAR\
      \ AS practice_name\nFROM VALUES (-730), (-729), (-728), (-727), (-726), (-725), (-724), (-723),\
      \ (-722), (-721), (-720), (-719), (-718), (-717), (-716), (-715), (-714), (-713), (-712), (-711),\
      \ (-710), (-709), (-708), (-707), (-706), (-705), (-704), (-703), (-702), (-701), (-700) AS people\n\
      CROSS JOIN (VALUES ('2026-09-30'), ('2026-10-31')) AS dates"
