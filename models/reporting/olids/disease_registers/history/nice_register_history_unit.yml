      \ 'recorded'),\n    (-706, 'A', '2026-09-30', NULL, 30, 'recorded'),\n    (-707, 'A', '2026-09-30',\
      \ NULL, 24.9, 'recorded'),\n    (-708, 'A', '2026-08-01', NULL, 30, 'recorded'),\n    (-708, 'Z',\
      \ '2026-09-30', NULL, 151, 'recorded'),\n    (-709, 'A', '2026-09-30', NULL, 9.9, 'recorded'),\n\
