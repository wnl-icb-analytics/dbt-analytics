models:
  - name: fct_person_anxiety_register_by_month
    description: >
      Anxiety register at each completed month-end, on the rules of
      fct_person_anxiety_register: an anxiety diagnosis whose latest code is later
      than any resolution code. No age restriction.
      {{ doc('ltc_register_by_month_scope') }}
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - month_end_date
    columns:
      - name: person_id
        data_tests:
          - not_null
      - name: month_end_date
        description: "{{ doc('ltc_register_by_month_month_end_date') }}"
        data_tests:
          - not_null
      - name: practice_code
        description: "{{ doc('ltc_register_by_month_practice_code') }}"
      - name: earliest_diagnosis_date
        description: Earliest anxiety diagnosis known by the month-end.
      - name: latest_diagnosis_date
        description: Latest anxiety diagnosis known by the month-end.
      - name: latest_resolved_date
        description: Latest anxiety resolved code known by the month-end; earlier than the latest diagnosis.
