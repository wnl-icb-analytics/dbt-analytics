models:
  - name: fct_person_chd_register_by_month
    description: >
      CHD register at each completed month-end, on the rules of fct_person_chd_register:
      a CHD_COD diagnosis, with no age restriction or resolution.
      {{ doc('ltc_register_by_month_scope') }}
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - month_end_date
    columns:
      - name: person_id
        data_tests:
          - not_null
      - name: month_end_date
        description: "{{ doc('ltc_register_by_month_month_end_date') }}"
        data_tests:
          - not_null
      - name: practice_code
        description: "{{ doc('ltc_register_by_month_practice_code') }}"
      - name: earliest_diagnosis_date
        description: Earliest chd diagnosis known by the month-end.
      - name: latest_diagnosis_date
        description: Latest chd diagnosis known by the month-end.
