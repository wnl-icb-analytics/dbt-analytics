models:
- name: fct_person_nice_obesity_register_by_month
  description: NICE obesity, one row per registered, living, non-test adult register member at each completed
    month-end. Latest measured BMIVAL_COD BMI in (R - 12 months, R] must be 27.5 kg/m^2 or above, or 30
    kg/m^2 or above if ethnicity is recorded as White. Unknown or missing ethnicity uses 27.5. Ethnicity
    follows the demographic interval containing R. Numeric validity is 5 to 400 kg/m^2 inclusive. An invalid
    latest value is unassessable; no fallback to an older valid value. BMI30_COD alone does not provide
    a measured value. BMI evidence uses clinical dates through R. This is separate from the shared QOF
    obesity register. Recalculated for the last 60 completed month-ends using current rules, code lists
    and retained records. Registration and practice follow the monthly spine. Birth and death dates are
    approximate; current test flags apply retrospectively. Later corrections can change earlier membership.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - month_end_date
  columns:
  - name: person_id
    description: Person identifier.
    data_tests:
    - not_null
  - name: month_end_date
    description: Reference date R used to assess membership.
    data_tests:
    - not_null
  - name: age
    description: Age in completed years at R, derived from approximate birth date.
  - name: practice_code
    description: Practice at R using the established active population or historical spine attribution.
  - name: is_on_register
    description: True for every row; only eligible register members are retained.
  - name: latest_bmi_date
    description: Clinical date of the latest measured BMI in (R - 12 months, R].
  - name: bmi_value
    description: Latest measured BMI in kg/m^2. Invalid latest values exclude membership.
  - name: is_recorded_white
    description: True when ethnicity is White in the demographic interval containing R. False includes
      unknown and missing ethnicity.
  - name: bmi_threshold
    description: Ethnicity-specific inclusion threshold in kg/m^2.
