models:
  - name: fct_person_palliative_care_register_by_month
    description: >
      Palliative care register at each completed month-end, on the rules of
      fct_person_palliative_care_register: a PALCARE_COD on or after 1 April 2008 and no
      later PALCARENI_COD, with no age restriction.
      {{ doc('ltc_register_by_month_scope') }}
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - month_end_date
    columns:
      - name: person_id
        data_tests:
          - not_null
      - name: month_end_date
        description: "{{ doc('ltc_register_by_month_month_end_date') }}"
        data_tests:
          - not_null
      - name: practice_code
        description: "{{ doc('ltc_register_by_month_practice_code') }}"
      - name: earliest_diagnosis_date
        description: Earliest palliative care code on or after 1 April 2008 known by the month-end.
      - name: latest_diagnosis_date
        description: Latest palliative care code on or after 1 April 2008 known by the month-end.
      - name: latest_resolved_date
        description: Latest PALCARENI_COD marking palliative care as no longer indicated known by the month-end.
