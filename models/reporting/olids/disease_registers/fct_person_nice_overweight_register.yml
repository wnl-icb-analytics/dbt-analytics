models:
- name: fct_person_nice_overweight_register
  description: >-
    Overweight or obesity register (NICE IND237). One row per register member on the build date.


    People registered on the build date, aged 18 or over, qualify when their latest numeric
    recorded or calculated BMI in the 12 months before the build date indicates overweight or
    obesity. Valid BMI is 10 to 150 kg/m^2 inclusive; an invalid latest result excludes
    membership without an older valid fallback. Calculated BMI uses adult weight and the latest
    prior adult height; recorded BMI takes precedence on the weight date. Calculated BMI counts
    only once both weight and height are known. BMI30_COD without a number does not qualify.
    Overweight starts at 23 kg/m^2 for NG246 higher-risk ethnic groups and 25 otherwise; obesity
    starts at 27.5 and 30 respectively. Any higher-risk ethnicity known by the build date takes
    precedence; unknown ethnicity uses standard thresholds. NICE lowers thresholds for everyone
    not recorded as White. BMI and ethnicity require clinical and recorded dates by the build
    date; missing recorded dates use clinical dates. Based on NICE NG246. Code lists:
    BMIVAL_COD, HEIGHT, WEIGHT.
  config:
    meta:
      owner:
        name: EddieDavison92
      indicators:
      - id: IND237
        type: NICE_REGISTER
        category: LTC
        clinical_domain: Metabolic
        name_short: >-
          Overweight register
        description_short: >-
          Adults whose latest numeric BMI in the past 12 months indicates overweight or obesity.
        description_long: >-
          People registered on the build date, aged 18 or over, qualify when their latest
          numeric recorded or calculated BMI in the 12 months before the build date indicates
          overweight or obesity. Valid BMI is 10 to 150 kg/m^2 inclusive; an invalid latest
          result excludes membership without an older valid fallback. Calculated BMI uses adult
          weight and the latest prior adult height; recorded BMI takes precedence on the weight
          date. Calculated BMI counts only once both weight and height are known. BMI30_COD
          without a number does not qualify. Overweight starts at 23 kg/m^2 for NG246 higher-risk ethnic groups and 25 otherwise; obesity starts at 27.5 and 30 respectively. Any
          higher-risk ethnicity known by the build date takes precedence; unknown ethnicity uses
          standard thresholds. NICE lowers thresholds for everyone not recorded as White. BMI
          and ethnicity require clinical and recorded dates by the build date; missing recorded
          dates use clinical dates. Based on NICE NG246. Code lists: BMIVAL_COD, HEIGHT, WEIGHT.
        source_column: is_on_register
        is_qof: false
        qof_indicator: null
        usage_contexts:
        - NICE_GUIDANCE
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: person_id
    description: Person identifier.
    data_tests:
    - not_null
  - name: reporting_date
    description: >-
      Build date used to assess register membership.
    data_tests:
    - not_null
  - name: age
    description: >-
      Age in completed years on the build date, derived from approximate birth date.
  - name: practice_code
    description: >-
      Current practice attributed to the registered person on the build date.
  - name: is_on_register
    description: >-
      True for every row; only eligible register members are included. Deceased people and test
      records are excluded.
  - name: latest_bmi_date
    description: >-
      Clinical date of the latest numeric recorded or calculated BMI known by the build date, in
      the preceding 12 months. The date exactly 12 months earlier is excluded; the build date is
      included. Clinical and recorded dates must both be on or before the build date; missing
      recorded dates use clinical dates. Calculated BMI counts only once both weight and
      contributing height are known.
  - name: bmi_value
    description: >-
      Selected BMI in kg/m^2, between 10 and 150 inclusive. An invalid latest numeric result
      excludes membership; records without a value or with an unparseable value are not results.
      BMI30_COD alone does not supply a numeric value.
  - name: bmi_source
    description: >-
      Recorded BMI or calculated BMI on the weight date using the latest prior adult height,
      from the shared BMI records. Recorded BMI takes precedence on that date.
  - name: requires_lower_bmi_thresholds
    description: >-
      True when any NG246 higher-risk ethnicity record is known by the build date, even if a
      later record gives another ethnicity. Clinical and recorded dates must both be on or
      before the build date; missing recorded dates use clinical dates. False includes unknown
      ethnicity and uses standard thresholds.
  - name: bmi_category
    description: >-
      Shared NG246 adult BMI category on the build date, using BMI and higher-risk ethnicity
      known by the build date. Overweight starts at 23 kg/m^2 for higher-risk groups and 25
      otherwise; obesity starts at 27.5 and 30 respectively.
  - name: bmi_risk_sort_key
    description: 'Shared category risk order: overweight 3, obese class I 4, class II 5, class III 6.'
