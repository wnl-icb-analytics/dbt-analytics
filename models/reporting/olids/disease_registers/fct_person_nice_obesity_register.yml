models:
- name: fct_person_nice_obesity_register
  description: NICE obesity, one row per registered, living, non-test adult register member on the build
    date. Latest measured BMIVAL_COD BMI in (R - 12 months, R] must be 27.5 kg/m^2 or above, or 30 kg/m^2
    or above if ethnicity is recorded as White. Unknown or missing ethnicity uses 27.5. Ethnicity follows
    the demographic interval containing R. Numeric validity is 5 to 400 kg/m^2 inclusive. An invalid latest
    value is unassessable; no fallback to an older valid value. BMI30_COD alone does not provide a measured
    value. BMI evidence uses clinical dates through R. This is separate from the shared QOF obesity register.
  config:
    meta:
      owner:
        name: EddieDavison92
      indicators:
      - id: IND238
        type: NICE_REGISTER
        category: LTC
        clinical_domain: Metabolic
        name_short: 'Weight management: obesity register'
        description_short: 'Weight management: obesity register'
        description_long: Latest measured BMIVAL_COD BMI in (R - 12 months, R] must be 27.5 kg/m^2 or
          above, or 30 kg/m^2 or above if ethnicity is recorded as White. Unknown or missing ethnicity
          uses 27.5. Ethnicity follows the demographic interval containing R. Numeric validity is 5 to
          400 kg/m^2 inclusive. An invalid latest value is unassessable; no fallback to an older valid
          value. BMI30_COD alone does not provide a measured value. BMI evidence uses clinical dates through
          R. This is separate from the shared QOF obesity register.
        source_column: is_on_register
        is_qof: false
        qof_indicator: null
        usage_contexts:
        - NICE_GUIDANCE
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: person_id
    description: Person identifier.
    data_tests:
    - not_null
  - name: reporting_date
    description: Reference date R used to assess membership.
    data_tests:
    - not_null
  - name: age
    description: Age in completed years at R, derived from approximate birth date.
  - name: practice_code
    description: Practice at R using the established active population or historical spine attribution.
  - name: is_on_register
    description: True for every row; only eligible register members are retained.
  - name: latest_bmi_date
    description: Clinical date of the latest measured BMI in (R - 12 months, R].
  - name: bmi_value
    description: Latest measured BMI in kg/m^2. Invalid latest values exclude membership.
  - name: is_recorded_white
    description: True when ethnicity is White in the demographic interval containing R. False includes
      unknown and missing ethnicity.
  - name: bmi_threshold
    description: Ethnicity-specific inclusion threshold in kg/m^2.
