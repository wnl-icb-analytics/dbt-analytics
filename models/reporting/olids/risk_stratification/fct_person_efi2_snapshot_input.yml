models:
  - name: fct_person_efi2_snapshot_input
    description: >-
      Current eFI2 score and category for change-history capture, one row per living
      OLIDS person with a mapped patient record who could be 65 or older. Age
      eligibility uses the first day of the recorded birth month, so some people may
      still be 64. No current-registration or opt-out filter applies. Age and scoring
      date are not stored in this input.
    config:
      meta:
        owner:
          name: Thomas Shallcross
    columns:
      - name: person_id
        description: "Person identifier; one row per person (snapshot unique_key)."
        data_tests:
          - unique
          - not_null
      - name: efi_score
        description: "Electronic Frailty Index 2 score (0-1 scale)."
      - name: category
        description: >-
          ROBUST below 0.0857; MILD FRAILTY from 0.0857 to below 0.1624; MODERATE
          FRAILTY from 0.1624 to 0.2391 inclusive; SEVERE FRAILTY above 0.2391.
