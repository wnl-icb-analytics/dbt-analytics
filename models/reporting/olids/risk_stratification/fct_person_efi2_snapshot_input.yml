models:
  - name: fct_person_efi2_snapshot_input
    description: >-
      Current eFI2 score and category for change-history capture, one row per
      person in fct_person_efi2. Includes living NCL OLIDS people with a
      mapped patient record whose 65th birthday could have occurred by the
      scoring date, using the first day of the recorded birth month. No
      current-registration or opt-out filter is applied. Contains the person
      identifier, score and frailty category; scoring-date age and date fields
      are not included. Historical score versions are held in
      fct_person_efi2_snapshot.
    config:
      meta:
        owner:
          name: Thomas Shallcross
    columns:
      - name: person_id
        description: "Person identifier; one row per person (snapshot unique_key)."
        data_tests:
          - unique
          - not_null
      - name: efi_score
        description: "Electronic Frailty Index 2 score (0-1 scale)."
      - name: category
        description: "eFI2 frailty category (ROBUST / MILD / MODERATE / SEVERE FRAILTY)."
