models:
  - name: fct_person_efi2
    description: >-
      Electronic Frailty Index 2 (eFI2) score and category at the build date, one row per
      living OLIDS person aged at least 65 with a mapped patient record. No
      current-registration or opt-out filter is applied. The in-house score follows
      int_efi2_scores, including its deficit definitions, missing-data defaults and
      documented differences from the retired AIC score. Categories are ROBUST below 0.0857,
      MILD FRAILTY from 0.0857 to below 0.1624, MODERATE FRAILTY from 0.1624 to 0.2391
      inclusive, and SEVERE FRAILTY above 0.2391. Secondary-use consumers must apply
      dim_person_secondary_use_allowed.
    config:
      meta:
        owner:
          name: em-baldwin
    columns:
      - name: person_id
        description: Person identifier; one row per person.
        tests:
          - unique
          - not_null
      - name: end_date
        description: As-at date for the scoring run.
      - name: efi_score
        description: Electronic Frailty Index 2 score (0-1 scale), defaults to 0 if not available.
      - name: category
        description: Frailty category (ROBUST / MILD / MODERATE / SEVERE FRAILTY).
      - name: age_at_end
        description: Patient age at the end date.
      - name: gender
        description: Normalised gender.
      - name: date_of_death
        description: Approximate date of death where present.
