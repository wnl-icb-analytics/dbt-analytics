models:
  - name: dim_person_ccms_snapshot_input
    description: >-
      Current Cambridge Comorbidity Score for change-history capture, one row
      per person in dim_person_ccms. Contains the person identifier and the
      in-house score using the 2022 modified CCMS coefficients. Includes
      scored people with a mapped NCL OLIDS patient record, without an opt-out
      filter. Historical score versions are held in dim_person_ccms_snapshot.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: person_id
        description: "Person identifier; one row per person (snapshot unique_key)."
        data_tests:
          - unique
          - not_null

      - name: cambridge_comorbidity_score
        description: "Cambridge multimorbidity score."
