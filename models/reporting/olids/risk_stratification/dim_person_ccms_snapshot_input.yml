models:
  - name: dim_person_ccms_snapshot_input
    description: >-
      Current Cambridge Comorbidity Score for OLIDS people with a mapped patient
      record, one row per scored person. Uses the in-house 2022 modified CCMS
      coefficients, without an opt-out filter. This is the input used to capture score
      changes over time.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: person_id
        description: "Person identifier; one row per person (snapshot unique_key)."
        data_tests:
          - unique
          - not_null

      - name: cambridge_comorbidity_score
        description: "Cambridge multimorbidity score."
