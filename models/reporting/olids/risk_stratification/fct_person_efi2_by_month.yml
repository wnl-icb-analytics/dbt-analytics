models:
  - name: fct_person_efi2_by_month
    description: >-
      Reconstructed monthly eFI2 score and frailty category for people aged at
      least 65 who were alive and GP registered in NCL at the scoring date. One
      row represents one person at a retained completed month-end.
      Unlike fct_person_efi2, registration is required and no current dim_person
      link is applied, so the two populations must be aligned before combining
      current and historical results. History uses clinical effective dates in
      the data available at build time; it does not show when records first
      became available to the warehouse. No opt-out filter is applied. For
      secondary use, join to DIM_PERSON_SECONDARY_USE_ALLOWED on person_id.
      The newest month can be incomplete because OLIDS arrives after the
      reference date. An ad-hoc incremental run can replace the latest
      completed month atomically, but does not remove months that have aged
      out, so the model holds at least the last 60 completed month-ends. Each
      scheduled monthly full refresh recalculates the rolling 60-month window,
      trims the extra months and incorporates records received since the
      previous build.
    config:
      meta:
        owner:
          name: em-baldwin
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [person_id, end_date]
    columns:
      - name: person_id
        description: Person identifier.
        data_tests:
          - not_null
      - name: end_date
        description: Completed month-end used as the scoring date.
        data_tests:
          - not_null
      - name: efi_score
        description: Electronic Frailty Index 2 score.
        data_tests:
          - not_null
      - name: category
        description: >-
          Frailty category: ROBUST, MILD FRAILTY, MODERATE FRAILTY or SEVERE
          FRAILTY.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ROBUST
                  - MILD FRAILTY
                  - MODERATE FRAILTY
                  - SEVERE FRAILTY
      - name: age_at_end
        description: >-
          Age in completed months divided by 12 and rounded down at the scoring
          month-end. This avoids the year-boundary overstatement possible with
          DATEDIFF(year) in the current score path.
      - name: gender
        description: Gender normalised for eFI2 rules.
      - name: date_of_death
        description: Approximate death date where recorded.
