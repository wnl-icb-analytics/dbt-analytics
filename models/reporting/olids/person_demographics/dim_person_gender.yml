models:
  - name: dim_person_gender
    description: 'Gender demographics for all persons with standardised classification.

      Key Features:

      • One row per person derived from gender_source_concept_id mappings

      • Standardised categories: Male, Female, Indeterminate sex, Unknown

      • Patient selection prioritises records with gender data

      • Fallback to current registration patient for coverage

      • Deduplication ensures single row per person

      Purpose: Supports demographic analysis, clinical safety screening, and population health assessment.'
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        tests:
          - not_null
          - unique

      - name: gender
        description: 'Persons gender derived from gender concept mappings'
        tests:
          - not_null
          # screening, child-bearing-age and valproate cohorts filter on these
          # literals; a feed display change must fail here, not zero cohorts
          - accepted_values:
              arguments:
                values: ['Female', 'Male', 'Indeterminate sex', 'Unknown']
              config:
                severity: error
          - accepted_values:
              arguments:
                values: ['Male', 'Female', 'Indeterminate sex', 'Unknown']
