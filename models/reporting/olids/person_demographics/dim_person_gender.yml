models:
  - name: dim_person_gender
    description: >-
      Recorded gender per person in NCL OLIDS, including active and inactive people.
      Uses mapped or source labels, with Unknown for missing gender.
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        tests:
          - not_null
          - unique

      - name: gender
        description: >-
          Recorded gender label, prioritising mapped labels over source labels. Within
          each label type, the selected patient record takes precedence over the current
          registration record. Unknown when neither has a label.
        tests:
          - not_null
          # screening, child-bearing-age and valproate cohorts filter on these
          # literals; a feed display change must fail here, not zero cohorts
          - accepted_values:
              arguments:
                values: ['Female', 'Male', 'Indeterminate sex', 'Unknown']
              config:
                severity: error
          - accepted_values:
              arguments:
                values: ['Male', 'Female', 'Indeterminate sex', 'Unknown']
