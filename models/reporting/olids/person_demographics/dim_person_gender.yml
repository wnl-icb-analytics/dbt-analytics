models:
  - name: dim_person_gender
    description: >-
      Recorded gender for every person in dim_person, one row per person. Uses mapped gender
      labels, with source labels as a fallback and Unknown when neither is available. The
      selected mapped patient record takes precedence over the current registration record.
      Includes active and inactive people.
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        tests:
          - not_null
          - unique

      - name: gender
        description: 'Persons gender derived from gender concept mappings'
        tests:
          - not_null
          # screening, child-bearing-age and valproate cohorts filter on these
          # literals; a feed display change must fail here, not zero cohorts
          - accepted_values:
              arguments:
                values: ['Female', 'Male', 'Indeterminate sex', 'Unknown']
              config:
                severity: error
          - accepted_values:
              arguments:
                values: ['Male', 'Female', 'Indeterminate sex', 'Unknown']
