models:
  - name: dim_person_pseudo
    description: >-
      HxFlake pseudonyms for people in dim_person_birth_death with a non-null sk_patient_id,
      one row per person. hx_flake is a reversible representation of sk_patient_id in
      XX-XXX-XXX format for direct-care re-identification. People who share a sk_patient_id
      can share the same hx_flake.

    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Unique person identifier'
        tests:
          - not_null
          - unique

      - name: sk_patient_id
        description: 'Primary surrogate key for patient record used in pseudonym generation'
        tests:
          - not_null

      - name: hx_flake
        description: 'Pseudonymized hex key in format XX-XXX-XXX for patient re-identification'
        tests:
          - not_null
