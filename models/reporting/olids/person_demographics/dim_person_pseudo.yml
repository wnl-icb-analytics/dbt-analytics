models:
  - name: dim_person_pseudo
    description: >-
      HxFlake pseudonyms per person with a non-null sk_patient_id in OLIDS. hx_flake
      reversibly represents sk_patient_id in XX-XXX-XXX format for direct-care
      re-identification. People who share a patient ID can share a pseudonym.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Unique person identifier'
        tests:
          - not_null
          - unique

      - name: sk_patient_id
        description: 'Primary surrogate key for patient record used in pseudonym generation'
        tests:
          - not_null

      - name: hx_flake
        description: 'Pseudonymized hex key in format XX-XXX-XXX for patient re-identification'
        tests:
          - not_null
