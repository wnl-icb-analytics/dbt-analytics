models:
  - name: dim_person_birth_death
    description: >-
      Birth and death details per person with a mapped NCL OLIDS patient record,
      including people without a recorded birth date. Birth dates use the midpoint of
      the recorded month; death details use OLIDS, PDS and registry evidence. Death
      dates before birth are cleared and the person is treated as living.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        tests:
          - not_null
          - unique

      - name: sk_patient_id
        description: >-
          Patient key from the current registration when available, otherwise the
          selected mapped patient record.
        data_tests:
          - is_canonical_numeric_key

      - name: birth_year
        description: 'Year of birth'
        tests:
          - not_null

      - name: birth_month
        description: 'Month of birth (1-12)'
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
      - name: birth_date_approx
        description: 'Approximate birth date using statistical midpoint of birth month'
        tests:
          - not_null

      - name: death_year
        description: 'Year of death (NULL if still living)'

      - name: death_month
        description: 'Month of death (NULL if still living)'
      - name: death_date_approx
        description: 'Approximate death date using statistical midpoint of death month (NULL if still living)'
      - name: is_deceased
        description: 'Flag indicating if person is deceased'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: death_source_flag
        description: 'Flag indicating the source of death information'
      - name: is_test_patient
        description: 'Flag indicating if the record is a test patient (post-2026 OLIDS rename — was is_dummy_patient)'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]