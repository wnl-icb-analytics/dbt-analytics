models:
  - name: dim_person_birth_death
    description: >-
      Birth and death details for people with mapped OLIDS patient records, one row per
      person. Includes living and deceased people and people without a recorded birth date.
      Birth dates use the midpoint of the recorded month; death dates and status follow
      int_patient_deceased_status. A death date earlier than the approximate birth date is
      cleared and is_deceased is set to false. sk_patient_id comes from the current
      registration when available, otherwise the selected mapped patient record.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        tests:
          - not_null
          - unique

      - name: sk_patient_id
        description: 'Surrogate key from current registration or best mapped patient'
        data_tests:
          - is_canonical_numeric_key

      - name: birth_year
        description: 'Year of birth'
        tests:
          - not_null

      - name: birth_month
        description: 'Month of birth (1-12)'
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
      - name: birth_date_approx
        description: 'Approximate birth date using statistical midpoint of birth month'
        tests:
          - not_null

      - name: death_year
        description: 'Year of death (NULL if still living)'

      - name: death_month
        description: 'Month of death (NULL if still living)'
      - name: death_date_approx
        description: 'Approximate death date using statistical midpoint of death month (NULL if still living)'
      - name: is_deceased
        description: 'Flag indicating if person is deceased'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: death_source_flag
        description: 'Flag indicating the source of death information'
      - name: is_test_patient
        description: 'Flag indicating if the record is a test patient (post-2026 OLIDS rename — was is_dummy_patient)'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]