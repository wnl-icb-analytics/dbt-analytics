models:
  - name: fct_person_months_active
    description: >-
      People with a practice registration overlapping a completed calendar month, one row
      per person and month across the latest 60 completed months. Registration end dates
      account for death and deregistration. People who have since left a practice remain in
      months where their registration overlaps. When several registrations overlap a month,
      the selected practice prefers a registration currently marked current, then the latest
      start date.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - analysis_month

    columns:
      - name: analysis_month
        description: First day of the analysis month
        tests:
          - not_null

      - name: person_id
        description: Unique person identifier
        tests:
          - not_null

      - name: current_practice_id
        description: Practice where person was registered this month (most recent if multiple)
        tests:
          - not_null

      - name: current_practice_name
        description: Name of practice where person was registered this month
        tests:
          - not_null