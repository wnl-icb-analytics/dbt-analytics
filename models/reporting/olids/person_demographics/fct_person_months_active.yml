models:
  - name: fct_person_months_active
    description: >-
      Registered population per completed calendar month in OLIDS, one row per person
      and month for the last 60 completed months. Includes anyone whose registration
      overlaps the month, including people who have since left or died. Registration
      end dates account for death and deregistration.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - analysis_month

    columns:
      - name: analysis_month
        description: First day of the analysis month
        tests:
          - not_null

      - name: person_id
        description: Unique person identifier
        tests:
          - not_null

      - name: current_practice_id
        description: >-
          Practice selected for the month. If registrations overlap, prefers one
          currently marked current, then the latest registration start date.
        tests:
          - not_null

      - name: current_practice_name
        description: Name of practice where person was registered this month
        tests:
          - not_null