models:
  - name: dim_person_main_language
    description: >-
      Latest recorded language or communication method for every person in
      dim_person, one row per person. The OLIDS population comes from NCL GP
      records. Language comes from PREFLANG_COD preferences or
      language-specific REQINTERPRETER_COD records, whichever is most recent.
      Interpreter and communication support details describe the latest
      REQINTERPRETER_COD record where a language record is available. Spoken
      languages, sign languages and other communication methods remain
      distinct. Missing language is shown as Not Recorded; missing interpreter
      evidence remains null. Includes active and inactive people.
    config:
      meta:
        indicator:
          id: "DEMO_LANGUAGE"
          type: "DEMOGRAPHIC_ATTRIBUTE"
          category: "DEMOGRAPHICS"
          clinical_domain: "Demographics"
          name_short: "Main Language"
          description_short: "Preferred language and interpreter needs from latest clinical recording"
          description_long: >
            Main language preference and interpreter requirements based on most recent
            clinical
            observations from PREFLANG_COD (language preference) and REQINTERPRETER_COD
            (interpreter
            needs). Includes language type classification (Spoken, Sign, Other Communication
            Method),
            interpreter requirements, and communication support needs. Supports accessibility
            planning,
            interpreter service allocation, and communication needs assessment.
          is_qof: false
          source_column: "language"
          sort_order: "DEMO_2_LANGUAGE"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "DEMOGRAPHICS"
            - "ACCESSIBILITY"
          code_clusters:
            - cluster_id: "PREFLANG_COD"
              category: "INCLUSION"
            - cluster_id: "REQINTERPRETER_COD"
              category: "INCLUSION"

        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        tests:
          - not_null
          - unique

      - name: sk_patient_id
        description: 'Surrogate key for patient record (NULL if no language recorded)'

      - name: latest_language_date
        description: 'Clinical effective date of latest language recording'

      - name: concept_id
        description: 'OLIDS concept UUID for language preference. NULL when the person has no recorded language (consumers should treat NULL as "Not Recorded" and use the term / language text columns for display).'

      - name: concept_code
        description: 'SNOMED concept code for language preference ("Not Recorded" if none available)'
        tests:
          - not_null

      - name: term
        description: 'SNOMED term description for language preference ("Not Recorded" if none available)'
        tests:
          - not_null

      - name: language
        description: 'Clean language name extracted from clinical terms ("Not Recorded" if none available)'
        tests:
          - not_null

      - name: language_type
        description: 'Type classification: Spoken, Sign, Other Communication Method ("Not Recorded" if none available)'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Spoken', 'Sign', 'Other Communication Method', 'Not Recorded']

      - name: language_source
        description: 'Source of language data: PREFLANG_COD (preference) or REQINTERPRETER_COD (interpreter requirement)'

      - name: interpreter_needed
        description: 'Flag indicating if interpreter services are needed'

      - name: interpreter_type
        description: 'Specific type of interpreter required (e.g., British Sign Language, Arabic)'

      - name: communication_support_needed
        description: 'Flag indicating if additional communication support is needed (lipspeaker, note taker, etc.)'

      - name: communication_support_type
        description: 'Type of communication support needed (e.g., Lipspeaker, Note Taker, Speech to Text)'

    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: PREFLANG_COD, REQINTERPRETER_COD