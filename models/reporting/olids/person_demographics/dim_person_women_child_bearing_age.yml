models:
  - name: dim_person_women_child_bearing_age
    description: >-
      Programme child-bearing-age groups per person in NCL OLIDS aged 0 to 55 whose
      recorded gender is not Male. Includes unknown gender, inactive and deceased
      people. Age is assessed at the build date or at death, with flags for ages 12 to
      55 and 0 to 55. These rules do not establish pregnancy potential.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        tests:
          - not_null
          - unique

      - name: age
        description: 'Current age (or age at death) in years'
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 55
      - name: gender
        description: 'Gender (Female or Unknown - excludes Male by definition)'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Female', 'Unknown', 'Indeterminate sex']

      - name: is_child_bearing_age_12_55
        description: 'Flag for standard demographic child-bearing age (12-55 years inclusive)'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: is_child_bearing_age_0_55
        description: 'Flag for clinical safety child-bearing age (0-55 years inclusive) - always TRUE for records in this table'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true]