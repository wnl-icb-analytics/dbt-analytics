models:
  - name: dim_person_demographics_snapshot_input
    description: >-
      Current demographic attributes for change-history capture, one row per
      person in dim_person_demographics. The OLIDS population comes from NCL
      GP records. Includes people with registration history and a valid
      approximate birth date, including inactive, deceased and test-patient
      records. Contains gender, ethnicity, language, registered practice, PCN,
      neighbourhood and death details. Age is not included. Historical
      versions of these attributes are held in
      dim_person_demographics_snapshot.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: person_id
        description: "Person identifier; one row per person (snapshot unique_key)."
        data_tests:
          - unique
          - not_null
