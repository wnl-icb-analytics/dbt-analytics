models:
  - name: dim_person_demographics_snapshot_input
    description: >-
      Demographics for capturing changes over time, one row per person in
      dim_person_demographics. Covers NCL OLIDS people with registration history and a
      valid approximate birth date, including inactive, deceased and test patients. Age
      is excluded; previous versions are held in dim_person_demographics_snapshot.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: person_id
        description: "Person identifier; one row per person (snapshot unique_key)."
        data_tests:
          - unique
          - not_null
