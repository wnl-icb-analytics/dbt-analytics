models:
  - name: dim_person_age_historical
    description: >-
      Age at five-year birthday milestones in OLIDS, one row per person and retained
      milestone from age 0 to 100. Covers the window from the start of the build month
      five years ago to the build date or death. People without a milestone in that
      window are excluded. Age stays fixed within each period. End dates are
      exclusive; null marks the last retained period, including for deceased people.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Unique person identifier'
        tests:
          - not_null

      - name: effective_start_date
        description: 'SCD2: Period start date for temporal tracking'
        tests:
          - not_null

      - name: effective_end_date
        description: >-
          Exclusive end of the retained age period. Null marks the last retained period,
          including for deceased people.
      - name: period_sequence
        description: 'SCD2: Sequential number for each temporal period per person'
        tests:
          - not_null

      - name: age
        description: >-
          Age at the birthday milestone starting this period. It stays fixed during the
          period.
      - name: age_band_5y
        description: 'SCD2: 5-year age band as of effective_start_date (temporal)'

      - name: age_band_10y
        description: 'SCD2: 10-year age band as of effective_start_date (temporal)'

      - name: age_band_nhs
        description: 'SCD2: NHS age band as of effective_start_date (temporal)'

      - name: age_band_ons
        description: 'SCD2: ONS age band as of effective_start_date (temporal)'

      - name: age_life_stage
        description: 'SCD2: Life stage as of effective_start_date (temporal)'

      - name: is_current_period
        description: >-
          True for the last retained age period, including for deceased people; it does
          not establish current registration or living status.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

    tests:
      # SCD2 integrity tests
      - dbt_utils.unique_combination_of_columns:
          name: dim_person_age_historical_unique_person_period
          arguments:
            combination_of_columns:
              - person_id
              - effective_start_date

      # Basic data quality tests
      - dbt_utils.expression_is_true:
          name: dim_person_age_historical_valid_date_ranges
          arguments:
            expression: "effective_end_date IS NULL OR effective_start_date <= effective_end_date"
      - dbt_utils.expression_is_true:
          name: dim_person_age_historical_current_period_consistency
          arguments:
            expression: "(effective_end_date IS NULL AND is_current_period = true) OR (effective_end_date IS NOT NULL)"