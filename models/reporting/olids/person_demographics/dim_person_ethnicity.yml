models:
  - name: dim_person_ethnicity
    description: >-
      Selected ethnicity for every person in dim_person, with one row per person.
      Prefers non-deprioritised and more specific observations, then the latest
      clinical date and observation identifier. The existing three-level
      classification and the NHS Census 2001 fields use the same observation.
      Existing text fields default to Not Recorded when no observation exists;
      the 2001 fields are null and mapping status is no_ethnicity_record.
    config:
      meta:
        indicator:
          id: "DEMO_ETHNICITY"
          type: "DEMOGRAPHIC_ATTRIBUTE"
          category: "DEMOGRAPHICS"
          clinical_domain: "Demographics"
          name_short: "Ethnicity"
          description_short: "Three-tier ethnicity classification from latest clinical
            recording"
          description_long: >
            Ethnicity classification based on most recent clinical observations with
            three-tier
            hierarchy: Category > Subcategory > Granular detail. Uses ETHNICITY_CODES
            reference
            table mapping to NHS Digital 2016+ ethnicity categories. Prioritises non-deprioritised
            records and higher specificity, then most recent date. Supports health
            equity monitoring,
            population analysis, and demographic profiling.
          is_qof: false
          source_column: "ethnicity_category"
          sort_order: "DEMO_1_ETHNICITY"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
            - "DEMOGRAPHICS"
            - "HEALTH_EQUITY"
          code_clusters:
            - cluster_id: "ETH2016AI_COD"
              category: "INCLUSION"
            - cluster_id: "ETH2016AP_COD"
              category: "INCLUSION"
            - cluster_id: "ETH2016AB_COD"
              category: "INCLUSION"
            - cluster_id: "ETH2016AC_COD"
              category: "INCLUSION"
            - cluster_id: "ETH2016AO_COD"
              category: "INCLUSION"
            - cluster_id: "ETH2016MWA_COD"
              category: "INCLUSION"
            - cluster_id: "ETH2016OA_COD"
              category: "INCLUSION"
            - cluster_id: "ETH2016BA_COD"
              category: "INCLUSION"
            - cluster_id: "ETH2016MWBA_COD"
              category: "INCLUSION"
            - cluster_id: "ETH2016BC_COD"
              category: "INCLUSION"
            - cluster_id: "ETH2016MWBC_COD"
              category: "INCLUSION"
            - cluster_id: "ETH2016BO_COD"
              category: "INCLUSION"

        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        tests:
          - not_null
          - unique

      - name: sk_patient_id
        description: 'Surrogate key for patient record (NULL if no ethnicity recorded)'
      - name: latest_ethnicity_date
        description: 'Clinical effective date of latest ethnicity recording'

      - name: concept_id
        description: 'OLIDS concept UUID for ethnicity. NULL when the person has no recorded ethnicity (consumers should treat NULL as "Not Recorded" and use the term / ethnicity_* text columns for display).'

      - name: snomed_code
        description: 'SNOMED code for ethnicity ("Not Recorded" if none available)'
        tests:
          - not_null

      - name: term
        description: 'SNOMED term description for ethnicity ("Not Recorded" if none
          available)'
        tests:
          - not_null

      - name: ethnicity_category
        description: 'Main ethnicity category (e.g., White, Asian, Black, Mixed, Other)'
        tests:
          - not_null

      - name: ethnicity_subcategory
        description: 'Ethnicity subcategory within main category'
        tests:
          - not_null

      - name: ethnicity_granular
        description: 'Most detailed ethnicity classification available'
        tests:
          - not_null

      - name: ethnicity_2001_code
        description: >-
          NHS Census 2001 code for the same selected observation as the existing
          ethnicity fields. Uses the locally maintained SNOMED bridge, with code
          validity checked against the warehouse dictionary. Z means Not stated
          or Refused; 99 means recorded unknown or missing ethnicity. Null means
          no selected observation, no valid mapping, or conflicting mappings.
          Use ethnicity_2001_mapping_status to distinguish these cases.
      - name: ethnicity_2001_detailed_description
        description: 'Detailed NHS Census 2001 description from `snomed_ethnicity_2001_bridge` and `nhs_ethnicity_2001`. Z is Not stated and 99 is Not known. NULL when ethnicity_2001_code is NULL.'

      - name: ethnicity_2001_broad_group
        description: >-
          NHS Census 2001 broad group. Chinese maps to Other Ethnic Groups.
          Not stated and Not known are separate recording statuses. Null when
          ethnicity_2001_code is null.
      - name: ethnicity_2001_mapping_status
        description: 'Mapping provenance for the 2001 fields. `mapped` means one unambiguous SNOMED-to-2001 code mapping in `snomed_ethnicity_2001_bridge`. `ambiguous_seed_mapping` means conflicting candidate mappings exist for the selected SNOMED code. `unmapped_seed_code` means no valid 2001 code was available for the selected SNOMED code. `no_ethnicity_record` means no selected ethnicity observation for the person.'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - mapped
                  - ambiguous_seed_mapping
                  - unmapped_seed_code
                  - no_ethnicity_record

      - name: deprioritise_flag
        description: 'Flag indicating if this ethnicity record should be deprioritised
          in selection'

      - name: preference_rank
        description: 'Preference ranking for ethnicity record selection (lower = higher
          priority)'

      - name: category_sort
        description: 'Sort order for ethnicity category display'

      - name: display_sort_key
        description: 'Combined sort key for consistent ethnicity display ordering'

