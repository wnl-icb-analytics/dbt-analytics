version: 2

models:
  - name: source_content_freshness_snapshot_input
    description: >
      Current consensus content date at one row per profiled logical source.
      This view excludes freshness policy and status fields from the snapshot.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: source_schema
        description: Logical source identifier shown in freshness reporting.
        data_tests:
          - not_null
          - unique
      - name: content_date
        description: Consensus date represented by the source content.
        data_tests:
          - not_null
