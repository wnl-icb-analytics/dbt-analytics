version: 2

models:
  - name: dq_monitoring_provider_current
    description: >
      Latest provider-level DQ assessment for each configured core provider
      and monitored dataset. Intended as the primary provider-level datasource
      for Streamlit reporting and subsequent alert generation.
    config:
      meta:
        owner:
          name: Jonathan Linney

    columns:
      - name: measurement_date
        description: Date of the latest provider assessment.
        tests:
          - not_null

      - name: table_id
        description: Identifier of the monitored dataset.
        tests:
          - not_null

      - name: dataset_group
        description: Dataset family controlling the provider assessment logic.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SUS', 'SLAM']

      - name: provider_code
        description: Provider organisation code.
        tests:
          - not_null

      - name: provider_name
        description: Provider organisation name.
        tests:
          - not_null

      - name: provider_scope
        description: Operational provider monitoring classification.
        tests:
          - not_null

      - name: row_count
        description: Latest provider-level row count.

      - name: row_count_change
        description: Latest absolute provider row-count movement.

      - name: row_count_change_pct
        description: Latest provider row-count percentage movement.

      - name: latest_refresh_date
        description: Latest valid source dataset-created date observed for the provider.

      - name: latest_actual_financial_year
        description: Latest financial year containing actual provider activity where applicable.

      - name: latest_actual_financial_month
        description: Latest financial month containing actual provider activity where applicable.

      - name: latest_update_date
        description: Latest provider source processing or update date.

      - name: expected_financial_year
        description: Expected SLAM actual financial year for the latest assessment.

      - name: expected_financial_month
        description: Expected SLAM actual financial month for the latest assessment.

      - name: provider_status
        description: Latest provider traffic-light assessment.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['GREEN', 'AMBER', 'RED', 'GREY']

      - name: status_rank
        description: Numeric severity rank used for sorting.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]

      - name: status_reason
        description: Human-readable explanation of the latest provider status.
        tests:
          - not_null

      - name: provider_shorthand
        description: Short reporting name for the provider from the governed submission model.

      - name: submitted_financial_year
        description: Financial year associated with the provider's latest submission.

      - name: fy_month_submitted
        description: Latest financial month submitted by the provider.

      - name: submitted_meta_file_id
        description: SDL metadata file identifier for the latest selected submission.

      - name: submitted_file_version
        description: File version associated with the latest selected submission.

      - name: submission_due_date
        description: Required submission date for the latest submitted financial month.

      - name: date_submitted
        description: Date on which the latest selected file was submitted.

      - name: submitted_row_count
        description: >
          Row count recorded in SDL metadata for the latest submitted file.
          This is distinct from the provider row count observed in the
          resulting downstream dataset.

      - name: latest_month_received
        description: >
          Indicates whether the provider's latest submission matches
          the latest financial month received across the monitored
          SLAM provider population.

      - name: submission_status
        description: Governed submission status from the contract dataset submission model.
        tests:
          - accepted_values:
              arguments:
                values:
                  - Submitted on time
                  - Submitted late
                  - Not Submitted
                  - Exempt
                  - Not onboarded

      - name: submission_completeness_status
        description: >
          Current completeness assessment of the expected SLAM submission.
          Kept separate from provider output health and submission timeliness.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - GREEN
                  - RED
                  - GREY
                  - NOT_APPLICABLE

      - name: submission_timeliness_status
        description: >
          Timeliness assessment derived from the latest submission date
          and required due date.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - GREEN
                  - AMBER
                  - RED
                  - GREY
                  - NOT_APPLICABLE

      - name: submission_status_reason
        description: Human-readable explanation of submission completeness and timeliness.