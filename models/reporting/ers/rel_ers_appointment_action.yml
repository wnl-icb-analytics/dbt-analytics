models:
- name: rel_ers_appointment_action
  description: One active action with a recorded appointment timestamp and its consolidated appointment
    ID. All contributing actions remain individually accessible, including repeated bookings and administrative
    updates. Each action belongs to at most one appointment under the UBRN, service and timestamp grain.
  config:
    meta:
      owner:
        name: Jonathan Linney
  columns:
  - name: appointment_id
    description: Consolidated planned appointment key in fct_ers_appointment.
  - name: action_id
    description: Source action ID in fct_ers_referral_action.
    data_tests:
    - unique
    - not_null
