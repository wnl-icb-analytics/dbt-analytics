models:
  - name: fct_cwt_pathway__performance
    description: >
      Performance table for the CWT pathway level dataset. 
      Covers main cancer performance standard metrics as well as additional 
      metrics that can be modelled with this structure.

      Note that the rows are 1 per performance allocation rather than 1 per 
      metric so in the case of 62 Day performance there can be 2 rows for a 
      record (1 for the investigating trust, 1 for the treatment trust). 
    config:
      meta:
        owner:
          name: Jake Kealey
    columns:
      - name: record_id
        description: CWT Record ID
        data_tests:
          - not_null

      - name: performance__metric
        description: Performance metric name.

      - name: performance__date_full
        description: Date for the clock end.

      - name: performance__date_year
        description: Year of the performance for reporting purposes.

      - name: performance__date_month
        description: Month of the performance for reporting purposes.

      - name: performance__trust_code
        description: The trust allocated the patient.

      - name: performance__site_code
        description: The site the activity took place (Note this doesn't imply allocation to site level).

      - name: performance__geo_wnl
        description: True when the performance is being allocated to a WNL trust.

      - name: performance__geo_ncl
        description: True when the performance is being allocated to a NCL trust.

      - name: performance__geo_nwl
        description: True when the performance is being allocated to a NWL trust.

      - name: performance__pathway_length_days
        description: Number of days between the clock start and end date.

      - name: performance__numerator
        description: Indicative of a breach (non-zero) and proportion of blame.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                strictly: false

      - name: performance__denominator
        description: Denominator for the performance metric, represents the patient allocation/blame.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                strictly: false

      - name: performance__breach
        description: For performance metrics, the amount of blame for a breach.

    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - record_id
              - performance__metric
              - performance__trust_code