models:
  - name: obt_cwt_pathway
    description: >
      One Big Table for the CWT Pathway dataset. 
    config:
      meta:
        owner:
          name: Jake Kealey
    columns:
      - name: record_id
        description: CWT Record ID
        data_tests:
          - not_null
          - unique
      - name: sk_patient_id
        description: Pseudo NHS Number
      - name: wnl_geo_flag__trust
        description: True if any 'org' field contains a WNL trust.
      - name: wnl_geo_flag__registered_at_event
        description: True if the patient was registered to a WNL practice at the time of the latest event for a record.
      - name: wnl_geo_flag__residence_at_event
        description: True if the patient resided in WNL at the time of the latest event for a record.
      - name: wnl_geo_flag__any
        description: True if any of the trust, registered_at_event, or residence_at_event for WNL is True.
      - name: ncl_geo_flag__trust
        description: True if any 'org' field contains an NCL trust.
      - name: ncl_geo_flag__registered_at_event
        description: True if the patient was registered to an NCL practice at the time of the latest event for a record.
      - name: ncl_geo_flag__residence_at_event
        description: True if the patient resided in NCL at the time of the latest event for a record.
      - name: ncl_geo_flag__any
        description: True if any of the trust, registered_at_event, or residence_at_event for NCL is True.
      - name: nwl_geo_flag__trust
        description: True if any 'org' field contains an NWL trust.
      - name: nwl_geo_flag__registered_at_event
        description: True if the patient was registered to an NWL practice at the time of the latest event for a record.
      - name: nwl_geo_flag__residence_at_event
        description: True if the patient resided in NWL at the time of the latest event for a record.
      - name: nwl_geo_flag__any
        description: True if any of the trust, registered_at_event, or residence_at_event for NWL is True.
      - name: date__consultant_upgrade_date
        description: Date of the consultant upgrade event.
      - name: date__decision_to_refer_date
        description: Date the decision to refer was made.
      - name: date__cancer_referral_to_treatment_period_start_date
        description: Date the cancer referral to treatment period started.
      - name: date__date_first_seen
        description: Date the patient was first seen.
      - name: date__fds_pathway_end_date
        description: Date the FDS pathway ended.
      - name: date__transfer_to_treatment_date
        description: Date the patient transferred to treatment.
      - name: date__cancer_treatment_period_date
        description: Date the cancer treatment period started.
      - name: date__treatment_start_date
        description: Date treatment started.
      - name: org__first_seen_trust_name
        description: Organisation name of the trust where the patient was first seen following a USC, Breast Symptomatic or Screening referral.
      - name: org__first_seen_site_name
        description: Organisation name of the site where the patient was first seen following a USC, Breast Symptomatic or Screening referral.
      - name: org__first_seen_trust_code
        description: ODS trust code for the trust where the patient was first seen following a USC, Breast Symptomatic or Screening referral.
      - name: org__first_seen_site_code
        description: ODS site code for the site where the patient was first seen following a USC, Breast Symptomatic or Screening referral.
      - name: wnl_geo_flag__first_seen_trust
        description: True if the trust where the patient was first seen is a WNL trust.
      - name: ncl_geo_flag__first_seen_trust
        description: True if the trust where the patient was first seen is an NCL trust.
      - name: nwl_geo_flag__first_seen_trust
        description: True if the trust where the patient was first seen is an NWL trust.
      - name: org__faster_diagnosis_pathway_end_trust_name
        description: Organisation name of the trust at the end of the FDS pathway.
      - name: org__faster_diagnosis_pathway_end_site_name
        description: Organisation name of the site at the end of the FDS pathway.
      - name: org__faster_diagnosis_pathway_end_trust_code
        description: ODS trust code for the trust at the end of the FDS pathway.
      - name: org__faster_diagnosis_pathway_end_site_code
        description: ODS site code for the site at the end of the FDS pathway.
      - name: wnl_geo_flag__faster_diagnosis_pathway_end_trust
        description: True if the trust at the end of the FDS pathway is a WNL trust.
      - name: ncl_geo_flag__faster_diagnosis_pathway_end_trust
        description: True if the trust at the end of the FDS pathway is an NCL trust.
      - name: nwl_geo_flag__faster_diagnosis_pathway_end_trust
        description: True if the trust at the end of the FDS pathway is an NWL trust.
      - name: org__patient_pathway_identifier_issuer_trust_name
        description: Organisation name of the trust issuing the patient pathway identifier.
      - name: org__patient_pathway_identifier_issuer_trust_code
        description: ODS trust code of the trust issuing the patient pathway identifier.
      - name: wnl_geo_flag__patient_pathway_identifier_issuer_trust
        description: True if the trust issuing the patient pathway identifier is a WNL trust.
      - name: ncl_geo_flag__patient_pathway_identifier_issuer_trust
        description: True if the trust issuing the patient pathway identifier is an NCL trust.
      - name: nwl_geo_flag__patient_pathway_identifier_issuer_trust
        description: True if the trust issuing the patient pathway identifier is an NWL trust.
      - name: org__consultant_upgrade_trust_name
        description: Organisation name of the trust where the consultant upgrade occurred.
      - name: org__consultant_upgrade_site_name
        description: Organisation name of the site where the consultant upgrade occurred.
      - name: org__consultant_upgrade_trust_code
        description: ODS trust code for the trust where the consultant upgrade occurred.
      - name: org__consultant_upgrade_site_code
        description: ODS site code for the site where the consultant upgrade occurred.
      - name: wnl_geo_flag__consultant_upgrade_trust
        description: True if the trust where the consultant upgrade occurred is a WNL trust.
      - name: ncl_geo_flag__consultant_upgrade_trust
        description: True if the trust where the consultant upgrade occurred is an NCL trust.
      - name: nwl_geo_flag__consultant_upgrade_trust
        description: True if the trust where the consultant upgrade occurred is an NWL trust.
      - name: org__accountable_investigating_trust_name
        description: Organisation name of the accountable investigating trust.
      - name: org__accountable_investigating_trust_code
        description: ODS trust code of the accountable investigating trust.
      - name: wnl_geo_flag__accountable_investigating_trust
        description: True if the accountable investigating trust is a WNL trust.
      - name: ncl_geo_flag__accountable_investigating_trust
        description: True if the accountable investigating trust is an NCL trust.
      - name: nwl_geo_flag__accountable_investigating_trust
        description: True if the accountable investigating trust is an NWL trust.
      - name: org__accountable_treating_trust_name
        description: Organisation name of the accountable treating trust.
      - name: org__accountable_treating_site_name
        description: Organisation name of the accountable treating site.
      - name: org__accountable_treating_trust_code
        description: ODS trust code of the accountable treating trust.
      - name: org__accountable_treating_site_code
        description: ODS site code of the accountable treating site.
      - name: wnl_geo_flag__accountable_treating_trust
        description: True if the accountable treating trust is a WNL trust.
      - name: ncl_geo_flag__accountable_treating_trust
        description: True if the accountable treating trust is an NCL trust.
      - name: nwl_geo_flag__accountable_treating_trust
        description: True if the accountable treating trust is an NWL trust.
      - name: pathway_entry_point
        description: Route of entry into the pathway for patients (USC, Breast Symptomatic, Screening, Consultant Upgrade, Treatment)
      - name: referral__cancer_referral_type_code
        description: Code for the tumour type associated with the referral.
      - name: referral__cancer_referral_type_desc
        description: Description for the tumour type associated with the referral.
      - name: referral__cancer_referral_short
        description: Short label for the tumour type associated with the referral.
      - name: referral__source_of_referral_for_outpatient_code
        description: Code for the source of the referral for diagnosis or patients from a consultant upgrade.
      - name: referral__source_of_referral_for_outpatient_desc
        description: Description for the source of the referral for diagnosis or consultant upgrade.
      - name: referral__priority_type_code
        description: Code for the priority type of the referral (Urgent or Routine).
      - name: referral__priority_type_desc
        description: Description for the priority type of the referral.
      - name: diagnosis__fds_suspected_cancer_type_code
        description: Code for the suspected cancer type following a positive diagnosis in the FDS pathway (Note may differ from the referral cancer type and treatment cancer type).
      - name: diagnosis__fds_suspected_cancer_type_desc
        description: Description for the suspected cancer type following a positive diagnosis in the FDS pathway.
      - name: diagnosis__fds_end_reason_code
        description: Code signifying the end reason for the FDS pathway including diagnosis outcome.
      - name: diagnosis__fds_end_reason_desc
        description: Description of the FDS pathway end reason including diagnosis outcome.
      - name: diagnosis__fds_end_reason_exclusion_code
        description: Code signifying the reason for excluding this record from FDS performance metrics in the event of the FDS ending due to an exclusion reason.
      - name: diagnosis__fds_end_reason_exclusion_desc
        description: Description of the reason for excluding this record from FDS performance metrics.
      - name: diagnosis__fds_outcome_method_of_communication_code
        description: Code for the method of communication used to inform the patient on their cancer diagnosis result (positive or negative).
      - name: diagnosis__fds_outcome_method_of_communication_desc
        description: Description for the method of communication used to inform the patient of their cancer diagnosis result.
      - name: diagnosis__fds_outcome_profession_type_code
        description: Code for the profession responsible for informing the patient of their cancer diagnosis result (positive or negative).
      - name: diagnosis__fds_outcome_profession_type_desc
        description: Description for the profession responsible for informing the patient of their cancer diagnosis result.
      - name: treatment__primary_icd10_code
        description: ICD10 code for the cancer being treated.
      - name: treatment__primary_icd10_group
        description: The tumour type category (HG Cancer Type and LG Cancer Type combined) the primary ICD10 code corresponds to according to the mapping used by CWT datasets.
      - name: treatment__primary_icd10_desc
        description: The ICD10 description the primary ICD10 code corresponds to.
      - name: treatment__primary_icd10_cancer_type_hg
        description: The higher granularity tumour type the ICD10 code corresponds to according to the mapping used by CWT datasets.
      - name: treatment__primary_icd10_cancer_type_lg
        description: The lower granularity tumour type the ICD10 code corresponds to according to the mapping used by CWT datasets.
      - name: treatment__primary_icd10_stageable_cosd
        description: True if the ICD10 is a stageable cancer type in the COSD dataset.
      - name: treatment__primary_icd10_stageable_rcrd
        description: True if the ICD10 is a stageable cancer type in the RCRD/NDRS dataset.
      - name: treatment__modality_code
        description: Code for the modality (type of treatment) of the treatment being delivered.
      - name: treatment__modality_desc
        description: Description for the treatment modality.
      - name: treatment__modality_group
        description: Higher granularity description for the treatment modality.
      - name: treatment__flag_first_treatment
        description: True if the treatment is a First Treatment as opposed to a Subsequent Treatment.
      - name: treatment__event_type_code
        description: Code for the treatment event type covering First Treatment, Subsequent Treatment, Recurrence, and Progression categories.
      - name: treatment__event_type_desc
        description: Description for the treatment event type.
      - name: treatment__care_setting_code
        description: Code for the care setting the treatment was carried out in.
      - name: treatment__care_setting_desc
        description: Description of the care setting where treatment was carried out.
      - name: performance__wta_first_seen_date_adjustment
        description: The number of days to adjust performance metrics relating to delays in the first seen appointment.
      - name: performance__wta_first_seen_date_reason_code
        description: Code for the reason of delay in the first seen appointment.
      - name: performance__wta_first_seen_date_reason_desc
        description: Description for the reason of delay in the first seen appointment.
      - name: performance__wta_treatment_start_date_adjustment
        description: The number of days to adjust performance metrics relating to delays in the treatment start.
      - name: performance__wta_treatment_start_date_reason_code
        description: Code for the reason of delay in the treatment start.
      - name: performance__wta_treatment_start_date_reason_desc
        description: Description for the reason of delay in the treatment start.
      - name: demographics__gender
        description: Gender of the patient.
      - name: demographics__date_of_birth
        description: Date of birth of the patient (truncated to month).
      - name: demographics__date_of_death
        description: Date of death of the patient.
      - name: demographics__ethnicity_name
        description: Canonical ethnicity group name.
      - name: demographics__ethnicity_subcategory
        description: More detailed ethnicity descriptor (subcategory).
      - name: registered__practice_code
        description: Code for the practice the patient was registered to at the time of the latest event in the CWT record.
      - name: registered__practice_name
        description: Name of the practice the patient was registered to at the time of the latest event in the CWT record.
      - name: registered__practice_end_date
        description: Date that the practice closed if inactive.
      - name: registered__pcn_code
        description: Code of the PCN the registered practice corresponds to.
      - name: registered__pcn_name
        description: Name of the PCN the registered practice corresponds to.
      - name: registered__subicb_code
        description: Code of the Sub-ICB the registered practice corresponds to.
      - name: registered__icb_code
        description: Code of the ICB the registered practice corresponds to.
      - name: registered__icb_name
        description: Name of the ICB the registered practice corresponds to.
      - name: registered__borough
        description: Name of the borough the registered practice corresponds to.
      - name: registered__imd_decile
        description: The IMD decile of the registered practice.
      - name: registered__cancer_alliance_code
        description: Code of the cancer alliance the registered practice corresponds to.
      - name: registered__cancer_alliance_name
        description: Name of the cancer alliance the registered practice corresponds to.
      - name: residence__lsoa_code
        description: LSOA code (2021) where the patient resided at the time of the latest event in the CWT record.
      - name: residence__subicb_code
        description: Code of the Sub-ICB the patient resided in at the time of the latest event in the CWT record.
      - name: residence__icb_code
        description: Code of the ICB the patient resided in at the time of the latest event in the CWT record.
      - name: residence__icb_name
        description: Name of the ICB the patient resided in at the time of the latest event in the CWT record.
      - name: residence__borough
        description: Name of the borough the patient resided in at the time of the latest event in the CWT record.
      - name: residence__imd_decile
        description: The IMD decile of the patient’s residence.
      - name: residence__neighbourhood_name
        description: Name of the neighbourhood where the patient resided at the time of the latest event in the CWT record.
      - name: residence__cancer_alliance_code
        description: Code of the cancer alliance the patient’s residence corresponds to.
      - name: residence__cancer_alliance_name
        description: Name of the cancer alliance the patient’s residence corresponds to.
