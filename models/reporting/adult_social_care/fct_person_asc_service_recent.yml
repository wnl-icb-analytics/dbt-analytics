models:
  - name: fct_person_asc_service_recent
    description: |
      Adult Social Care Client Level Dataset (CLD) services from the most recent
      submission period per local authority. One row per patient with primary
      support reason categories and boolean flags aggregated from deduplicated
      service records. AWAITING REVIEW BY LOCAL AUTHORITY COLLEAGUES.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: sk_patient_id
        description: Pseudonymised NHS number (surrogate key for patient)
        data_tests:
          - not_null
          - unique

      - name: primary_support_reason_category
        description: |
          Array of distinct high-level primary support reason categories for the
          patient (Physical, Learning disability, Mental Health, Sensory, Social,
          Memory/cognition, Other, Unknown).

      - name: has_physical_support_personal_care
        description: Patient has at least one service with personal care physical support.

      - name: has_physical_support_access_mobility
        description: Patient has at least one service with access and mobility physical support.

      - name: has_learning_disability_support
        description: Patient has at least one service with learning disability support.

      - name: has_mental_health_support
        description: Patient has at least one service with mental health support.

      - name: has_unknown_primary_support_reason
        description: Patient has at least one service with an unknown primary support reason.

      - name: has_memory_cognition_support
        description: Patient has at least one service with memory and cognition support.

      - name: has_social_support_unpaid_carer
        description: Patient has at least one service with social support for an unpaid carer.

      - name: has_social_support_social_isolation
        description: Patient has at least one service with social support for social isolation or other.

      - name: has_sensory_support_visual_impairment
        description: Patient has at least one service with sensory support for visual impairment.

      - name: has_sensory_support_hearing_impairment
        description: Patient has at least one service with sensory support for hearing impairment.

      - name: has_social_support_substance_misuse
        description: Patient has at least one service with social support for substance misuse.

      - name: has_sensory_support_dual_impairment
        description: Patient has at least one service with sensory support for dual impairment.

      - name: has_social_support_asylum_seeker
        description: Patient has at least one service with social support for asylum seekers.
