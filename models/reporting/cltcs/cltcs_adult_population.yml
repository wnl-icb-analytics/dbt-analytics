models:
  - name: cltcs_adult_population
    description: >
      Living adults actively registered in C-LTCS neighbourhoods, one row per sk_patient_id.
      Use is_case_finding_eligible for case finding: applicable_cohort selects
      meets_original_criteria (over 2 conditions and a complexity marker) at legacy practices
      and meets_adults_with_complexity elsewhere. Feeds
      cltcs_patient_list and the C-LTCS sub-score models. People must map to an OLIDS
      person_id, be active current registrants at a practice in the C-LTCS neighbourhood
      mapping and have turned 18 before the start of the current month. A person is excluded
      as deceased only when OLIDS marks them deceased and PDS also records a date of death.
      Conditions are counted from dim_person_conditions. Complexity markers are: Cambridge
      comorbidity score above 1.5, LTC LCS overall risk group HRC or HR, moderate or severe
      frailty by eFI2 category or frailty register, more than 3 A&E attendances in the last
      12 months, or more than 1 non-elective admission for an ambulatory care sensitive
      condition in the last 12 months. The sk_patient_id to person_id mapping is a local
      stopgap, see the model header. has_fragmented_sk_patient_id and
      has_fragmented_person_id mark identifiers that map to more than one OLIDS person or
      patient.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: sk_patient_id
        data_type: number
        description: "Unique patient identifier (sk_patient_id from PDS via dim_person_demographics_basic)."
        data_tests:
          - unique
          - not_null

      - name: person_id
        description: "OLIDS person key (via dim_person_pseudo, deduped to one per sk_patient_id). Always populated; unmapped people are excluded."
        data_tests:
          - unique
          - not_null

      - name: neighbourhood_code
        data_type: varchar
        description: "C-LTCS neighbourhood code from cltcs_practice_neighbourhood (z-score scaling group). Always populated; practices without a neighbourhood in that mapping are excluded."

      - name: practice_code
        data_type: varchar
        description: "Registered GP practice ODS code."
