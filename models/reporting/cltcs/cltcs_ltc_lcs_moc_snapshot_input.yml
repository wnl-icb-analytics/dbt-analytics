models:
  - name: cltcs_ltc_lcs_moc_snapshot_input
    description: >
      Thin snapshot-input projection of the LTC LCS Model of Care (MoC) fields from
      fct_person_ltc_lcs_risk_summary: one row per person on the MoC base population, with the
      furthest stage reached and the pathway status (plus table_refresh_date). Feeds
      cltcs_ltc_lcs_moc_snapshot, which C-LTCS uses to read MoC status as-at past dates for
      matched-control evaluation.
    config:
      meta:
        owner:
          name: Thomas Shallcross
    columns:
      - name: person_id
        description: "Unique person identifier; one row per person (snapshot unique_key)."
        data_tests:
          - unique
          - not_null

      - name: moc_stage_completed_label
        description: >
          Furthest MoC pathway stage reached in the last 12 months ('Not started',
          'Check & Test', 'Remote Desktop Review', 'MDT Review', 'Care Plan Sharing',
          'Discussion' or 'Follow-up'), from fct_person_ltc_lcs_risk_summary.

      - name: moc_pathway_status
        description: >
          State of the person's current MoC cycle ('Not started', 'In progress',
          'Cycle complete' or 'Declined'), from fct_person_ltc_lcs_risk_summary.

      - name: table_refresh_date
        description: "Timestamp the view was read; the snapshot's updated_at column."
