models:
  - name: cltcs_gap_summary
    description: >
      Person-level summary of C-LTCS care pathway gaps: one row per person in
      cltcs_adult_population who meets the original C-LTCS criteria or the Adults with
      Complexity cohort, keyed on the OLIDS person_id. Built from cltcs_gap_items, so it
      shares that model's items, evidence and build-date assessment.

      Each item has an is_gap_ column (true gap, false achieved, null not assessable). Each
      condition or measured concept within a domain has a has_gap_<domain>_<group> column
      (true when any of its assessable items is a gap, null when none is assessable). Each
      of the three domains (disease control, monitoring, treatment optimisation) has counts
      of groups and items assessed and with a gap, and a gap score: the sum over groups with
      a gap of 1 plus 0.5 x the share of the group's items that are gaps.
      cltcs_score_treatment_pathway reads the gap scores and group counts from here, so the
      0.5 depth weight is set only in this model. The item and group column lists are held
      in the cltcs_gap_item_ids and cltcs_gap_domains macros.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: person_id
        description: "OLIDS person identifier."
        data_tests:
          - unique
          - not_null
      - name: disease_control_groups_with_gap
        data_type: number
        description: >
          Number of groups in the disease control (result out of target or uncontrolled
          respiratory disease) domain with at least one gap item.
      - name: disease_control_groups_assessed
        data_type: number
        description: >
          Number of groups in the disease control (result out of target or uncontrolled
          respiratory disease) domain with at least one assessable item; 0 separates
          nothing assessable from assessed with no gaps.
      - name: disease_control_items_with_gap
        data_type: number
        description: >
          Number of assessable items in the disease control (result out of target or
          uncontrolled respiratory disease) domain that are gaps.
      - name: disease_control_items_assessed
        data_type: number
        description: >
          Number of assessable items in the disease control (result out of target or
          uncontrolled respiratory disease) domain.
      - name: disease_control_gap_score
        data_type: float
        description: >
          Gap score for the disease_control domain used by
          cltcs_score_treatment_pathway: the sum over groups with a gap of 1 plus 0.5 x
          the share of the group's items that are gaps. 0 when no group has a gap.
      - name: has_gap_disease_control_diabetes
        data_type: boolean
        description: >
          True when any assessable item in the diabetes group of the disease_control
          domain is a gap, false when all are achieved, null when none is assessable.
      - name: has_gap_disease_control_blood_pressure
        data_type: boolean
        description: >
          True when any assessable item in the blood_pressure group of the
          disease_control domain is a gap, false when all are achieved, null when none
          is assessable.
      - name: has_gap_disease_control_lipids
        data_type: boolean
        description: >
          True when any assessable item in the lipids group of the disease_control
          domain is a gap, false when all are achieved, null when none is assessable.
      - name: has_gap_disease_control_lithium
        data_type: boolean
        description: >
          True when any assessable item in the lithium group of the disease_control
          domain is a gap, false when all are achieved, null when none is assessable.
      - name: has_gap_disease_control_respiratory
        data_type: boolean
        description: >
          True when any assessable item in the respiratory group of the disease_control
          domain is a gap, false when all are achieved, null when none is assessable.
      - name: monitoring_groups_with_gap
        data_type: number
        description: >
          Number of groups in the monitoring (test, review or care process not done,
          including a missing disease control result) domain with at least one gap item.
      - name: monitoring_groups_assessed
        data_type: number
        description: >
          Number of groups in the monitoring (test, review or care process not done,
          including a missing disease control result) domain with at least one
          assessable item; 0 separates nothing assessable from assessed with no gaps.
      - name: monitoring_items_with_gap
        data_type: number
        description: >
          Number of assessable items in the monitoring (test, review or care process not
          done, including a missing disease control result) domain that are gaps.
      - name: monitoring_items_assessed
        data_type: number
        description: >
          Number of assessable items in the monitoring (test, review or care process not
          done, including a missing disease control result) domain.
      - name: monitoring_gap_score
        data_type: float
        description: >
          Gap score for the monitoring_gaps domain used by
