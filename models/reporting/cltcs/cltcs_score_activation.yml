models:
  - name: cltcs_score_activation
    description: "Activation sub-score for C-LTCS case-finding-eligible adults. One row per patient. Combines 12-month A&E and GP attendance, non-English main language, and SMI, learning disability and musculoskeletal flags."
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: sk_patient_id
        data_type: number
        description: "Unique patient identifier (sk_patient_id from PDS via dim_person_demographics_basic)"
        data_tests:
          - unique
          - not_null

      - name: score_activation
        data_type: number
        description: "Activation sub-score (higher indicates higher activation-related risk)"
