models:
  - name: cltcs_score_activation_snapshot_input
    description: >-
      Current C-LTCS activation score for change-history capture, one row per patient
      eligible for case finding in cltcs_adult_population. Includes the final score from
      cltcs_score_activation and the build timestamp. The score reflects language, condition
      flags and recent GP, outpatient and A&E activity; historical score versions are held
      in cltcs_score_activation_snapshot.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: sk_patient_id
        data_type: number
        description: "Unique patient identifier; one row per patient (snapshot unique_key)."
        data_tests:
          - unique
          - not_null

      - name: score_activation
        data_type: number
        description: "Final activation sub-score."
