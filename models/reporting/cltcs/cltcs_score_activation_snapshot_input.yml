models:
  - name: cltcs_score_activation_snapshot_input
    description: >-
      Current C-LTCS activation score for each patient eligible for case finding, one
      row per patient. The score reflects language, conditions and recent GP and A&E
      activity. This is the input used to capture score changes over time.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: sk_patient_id
        data_type: number
        description: "Unique patient identifier; one row per patient (snapshot unique_key)."
        data_tests:
          - unique
          - not_null

      - name: score_activation
        data_type: number
        description: "Final activation sub-score."
