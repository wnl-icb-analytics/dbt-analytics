models:
  - name: cltcs_score_coordination_snapshot_input
    description: >-
      Current C-LTCS coordination score for each patient eligible for case finding, one
      row per patient. The score reflects waiting lists, GP and hospital activity,
      length of stay and care across multiple providers. This is the input used to
      capture score changes over time.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: sk_patient_id
        data_type: number
        description: "Unique patient identifier; one row per patient (snapshot unique_key)."
        data_tests:
          - unique
          - not_null

      - name: score_coordination
        data_type: number
        description: "Final coordination sub-score."
