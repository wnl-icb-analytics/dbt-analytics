models:
  - name: cltcs_score_coordination_snapshot_input
    description: >-
      Current C-LTCS coordination score for change-history capture, one row per patient
      eligible for case finding in cltcs_adult_population. Includes the final score from
      cltcs_score_coordination and the build timestamp. The score reflects waiting lists,
      recent outpatient, GP, A&E and inpatient activity, length of stay and multiple
      providers. Historical score versions are held in cltcs_score_coordination_snapshot.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: sk_patient_id
        data_type: number
        description: "Unique patient identifier; one row per patient (snapshot unique_key)."
        data_tests:
          - unique
          - not_null

      - name: score_coordination
        data_type: number
        description: "Final coordination sub-score."
