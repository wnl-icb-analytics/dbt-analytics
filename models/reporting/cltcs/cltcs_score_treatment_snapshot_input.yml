models:
  - name: cltcs_score_treatment_snapshot_input
    description: >
      Thin snapshot-input projection of cltcs_score_treatment: sk_patient_id, the
      scaled treatment subdomain scores and the final score_treatment (plus
      table_refresh_date). Feeds cltcs_score_treatment_snapshot; kept narrow so the
      SCD2 snapshot stores only the score state needed for control-cohort matching.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: sk_patient_id
        data_type: number
        description: "Unique patient identifier; one row per patient (snapshot unique_key)."
        data_tests:
          - unique
          - not_null

      - name: score_treatment
        data_type: number
        description: "Final age-adjusted treatment score."
