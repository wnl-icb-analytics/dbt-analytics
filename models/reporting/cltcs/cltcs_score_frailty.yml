models:
  - name: cltcs_score_frailty
    description: >-
      C-LTCS frailty score, one row per patient and qualifying inclusion_rule. Includes
      people in cltcs_adult_population meeting the original criteria, the Adults with
      Complexity criteria, or both. A person meeting both has two rows. Clinical complexity,
      coded and measured frailty, medicines, emergency use and wider-care measures are
      standardised within each neighbourhood and cohort. The final score ranges from 0 to
      100, with a separate within-group percentile. Filter is_applicable_rule for the cohort
      used in the patient's case finding. These programme scores are distinct from the eFI2
      score and frailty-register severity.
    config:
      meta:
        owner:
          name: Emily Baldwin
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_patient_id
              - inclusion_rule
    columns:
      - name: sk_patient_id
        data_type: number
        description: "Unique patient identifier (sk_patient_id from PDS via dim_person_demographics_basic)"
        data_tests:
          - not_null
      
      - name: inclusion_rule
        data_type: varchar
        description: >
          Cohort this row is scored in. 'original_criteria' is the original C-LTCS
          inclusion criteria; 'adults_with_complexity' is the Adults with Complexity
          cohort from fct_person_complex_adults, including people on the palliative care
          register. The z-scores on this row are calculated against other patients in
          the same cohort and neighbourhood.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - original_criteria
                  - adults_with_complexity

      - name: is_applicable_rule
        data_type: boolean
        description: >
          True when inclusion_rule is the cohort that applies at the patient's practice:
          the original criteria at legacy practices (cltcs_legacy_organisations) and
          Adults with Complexity everywhere else. At most one row per patient is true. False rows are
          scores for the other cohort, kept for comparison between cohorts.
      - name: neighbourhood_code
        data_type: varchar
        description: "Neighbourhood code (from stg_cltcs_emis_cltcs_local_mapping_nh_gp) used as the z-score scaling group. Null for practices outside the Haringey/Camden local mapping."

      - name: score_frailty
        data_type: number
        description: "Frailty sub-score (higher indicates higher frailty and complexity risk)"
