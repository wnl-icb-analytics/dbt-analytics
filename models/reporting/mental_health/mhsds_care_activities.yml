version: 2

models:
  - name: fct_mhsds_care_activity
    description: >-
      Accepted MHSDS care activities. One row represents one MHS202 activity
      in one provider reporting period. Contact date, service and commissioner
      context comes from the linked care contact. Missing parents remain in
      the fact and are identified by is_care_contact_linked.
    config: &owner
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: source_record_id
        description: Stable identifier for the provider, reporting period and care activity.
        data_tests: [not_null, unique]
      - name: source_dataset
        description: Source dataset, always MHSDS.
        data_tests: [not_null]
      - name: mhs202_uniq_id
        description: Identifier of the accepted MHS202 source row.
        data_tests: [not_null, unique]
      - name: uniq_care_act_id
        description: MHSDS-derived care activity identifier, unique within the reporting period.
        data_tests: [not_null]
      - name: care_act_id
        description: Provider-local care activity identifier.
      - name: referral_source_record_id
        description: MHSDS unique service request identifier; joins to fct_mhsds_referral.
      - name: uniq_care_cont_id
        description: MHSDS-derived care contact identifier.
      - name: care_contact_id
        description: Provider-local care contact identifier.
      - name: person_id
        description: MHSDS person identifier.
      - name: sk_patient_id
        description: Shared pseudonymised patient identifier where the bridge contains the person.
      - name: care_activity_date
        description: Date of the linked care contact; null when the contact is missing.
      - name: care_activity_time
        description: Time of the linked care contact where submitted.
      - name: care_activity_at
        description: Timestamp of the linked care contact, using midnight when only a date was submitted.
      - name: care_activity_time_precision
        description: Whether care_activity_at has date or timestamp precision.
      - name: care_activity_time_basis
        description: same_submission_care_contact when timing came from the accepted MHS201 parent.
      - name: clinical_contact_duration_minutes
        description: Clinical contact duration for the activity in minutes.
      - name: is_clinical_contact_duration_over_24_hours
        description: >-
          TRUE when the submitted duration exceeds 1,440 minutes. This exposes
          an implausible-duration check and is not an ETOS rejection rule.
        data_tests: [not_null]
      - name: procedure_code
        description: >-
          Submitted SNOMED CT procedure code or expression, selected from the
          field defined for the record's MHSDS version.
      - name: procedure_description
        description: SNOMED CT preferred term when the procedure is a single recognised concept.
      - name: procedure_label_status
        description: Whether the procedure is missing, labelled or an unmatched code or expression.
      - name: finding_scheme_code
        description: Submitted finding coding scheme code.
      - name: finding_scheme_description
        description: Published description for the finding coding scheme, including retired schemes.
      - name: finding_code
        description: Submitted finding code, selected from the field defined for the MHSDS version.
      - name: finding_description
        description: ICD-10 or SNOMED CT description where the submitted scheme supports a direct lookup.
      - name: finding_label_status
        description: >-
          Whether the finding is missing, labelled, mapped to SNOMED CT,
          unmatched or uses a coding system without a local reference.
      - name: standardised_snomed_finding_code
        description: Source-pipeline SNOMED CT code derived from the submitted finding where available.
      - name: standardised_snomed_finding_description
        description: SNOMED CT preferred term for the standardised finding code.
      - name: is_observation_scheme_inferred
        description: TRUE when the observation scheme comes from the SNOMED-only specification rule rather than a submitted scheme field.
      - name: observation_scheme_code
        description: >-
          Submitted observation coding scheme through v4.0; 03 (SNOMED CT)
          for a populated observation code from v4.1, where the specification
          fixes the coding system.
      - name: observation_scheme_description
        description: Published description for the observation coding scheme, including retired schemes.
      - name: observation_code
        description: Submitted observation code selected for the MHSDS version.
      - name: observation_description
        description: >-
          SNOMED CT preferred term when the observation code is recognised,
          including records where the submitted scheme is missing.
      - name: observation_label_status
        description: >-
          Whether the observation is missing, labelled, mapped to SNOMED CT or
          unmatched. A separate status identifies a recognised SNOMED CT code
          whose required pre-v6 scheme is missing.
      - name: standardised_snomed_observation_code
        description: Source-pipeline SNOMED CT code derived from the submitted observation where available.
      - name: standardised_snomed_observation_description
        description: SNOMED CT preferred term for the standardised observation code.
      - name: observation_value
        description: Submitted numeric observation value, retained as source text.
      - name: unit_of_measurement_code
        description: Submitted UCUM unit code selected from the field defined for the MHSDS version.
      - name: unit_of_measurement_description
        description: Exact-case UKHFD UCUM or warehouse dictionary label for the submitted symbol or recognised alias.
      - name: unit_of_measurement_label_status
        description: Whether the unit code is missing, unmatched or labelled.
      - name: unit_of_measurement_symbol
        description: Reference unit symbol. No numeric conversion is applied.
      - name: unit_of_measurement_match_type
        description: ucum_code, dictionary_symbol or known_alias. Dictionary and alias matches do not certify UCUM conformance.
      - name: unit_of_measurement_definition_source
        description: UKHFD UCUM or the named warehouse dictionary supplying the unit label.
      - name: has_procedure
        description: TRUE when MHS202 contains a procedure code.
      - name: has_finding
        description: TRUE when MHS202 contains a finding code.
      - name: has_observation
        description: TRUE when MHS202 contains an observation code or value.
      - name: clinical_item_count
        description: Number of populated procedure, finding and observation components, from zero to three.
      - name: provider_organisation_code
        description: Organisation code of the provider submitting the activity.
      - name: provider_organisation_name
        description: Current organisation name for the provider code.
      - name: commissioner_organisation_code
        description: Commissioner code inherited from the linked care contact.
      - name: commissioner_organisation_name
        description: Current organisation name for the contact commissioner.
      - name: derived_icb_commissioner_code
        description: ICB commissioner derived for the linked care contact.
      - name: derived_icb_commissioner_name
        description: Current organisation name for the derived ICB commissioner.
      - name: derived_sub_icb_commissioner_code
        description: Sub-ICB commissioner derived for the linked care contact.
      - name: derived_sub_icb_commissioner_name
        description: Current organisation name for the derived sub-ICB commissioner.
      - name: treatment_site_code
        description: Treatment site code inherited from the linked care contact.
      - name: treatment_site_name
        description: Current name for the treatment site.
      - name: service_or_team_id
        description: MHSDS-derived identifier for the team linked to the care contact.
      - name: service_or_team_local_id
        description: Provider-local identifier for the team linked to the care contact.
      - name: service_or_team_type_code
        description: MHS902 service or team type code.
      - name: service_or_team_type_description
        description: Published description for the service or team type, including retired codes.
      - name: source_service_or_team_type_name
        description: Service or team name supplied by the provider.
      - name: service_or_team_intended_age_group_code
        description: Intended patient age group recorded for the service or team.
      - name: service_or_team_intended_age_group_description
        description: Published description for the intended age group.
      - name: is_care_contact_linked
        description: TRUE when MHS202 resolves to an MHS201 parent in the same accepted submission.
        data_tests: [not_null]
      - name: is_care_contact_person_consistent
        description: >-
          TRUE when linked MHS202 and MHS201 rows have the same person; null
          when the care contact is missing.
      - name: uniq_submission_id
        description: Accepted submission containing the activity.
        data_tests: [not_null]
      - name: uniq_month_id
        description: MHSDS reporting month number, where April 1900 is month 1.
      - name: reporting_period_start_date
        description: Start date of the accepted reporting period.
      - name: reporting_period_end_date
        description: End date of the accepted reporting period; part of the activity grain.
        data_tests: [not_null]
      - name: mhsds_version
        description: MHSDS version assigned by the source pipeline.
      - name: source_file_received_at
        description: Timestamp when the source file was received.
      - name: source_loaded_at
        description: Timestamp when the source row was loaded.

  - name: dim_mhsds_care_professional_period
    description: >-
      MHSDS care professional details by accepted provider reporting period.
      One row represents one MHS901 professional snapshot. It does not carry
      the newest staff details backwards into historic activity. All published
      codes have authoritative labels where the source code is valid.
    config: *owner
    columns:
      - name: care_professional_period_id
        description: Stable identifier for the provider, reporting period and professional.
        data_tests: [not_null, unique]
      - name: source_dataset
        description: Source dataset, always MHSDS.
        data_tests: [not_null]
      - name: mhs901_uniq_id
        description: Identifier of the retained MHS901 source row.
        data_tests: [not_null, unique]
      - name: uniq_care_prof_local_id
        description: MHSDS-derived care professional identifier.
        data_tests: [not_null]
      - name: care_prof_local_id
        description: Provider-local care professional identifier.
      - name: professional_identifier_organisation_code
        description: Organisation that issued the local professional identifier, mandatory from v6.
      - name: professional_identifier_organisation_name
        description: Current organisation name for the identifier-issuing organisation.
      - name: professional_registration_body_code
        description: Submitted professional registration body code.
      - name: professional_registration_body_description
        description: Published registration body description, including retired codes.
      - name: professional_registration_body_label_status
        description: Whether the registration body code is missing, unmatched or labelled.
      - name: staff_group_code
        description: Submitted mental health care professional staff group code.
      - name: staff_group_description
        description: Published mental health staff group description, including retired codes.
      - name: staff_group_label_status
        description: Whether the staff group code is missing, unmatched or labelled.
      - name: main_specialty_code
        description: Submitted main specialty code.
      - name: main_specialty_description
        description: Published main specialty description, including retired codes.
      - name: main_specialty_label_status
        description: Whether the main specialty code is missing, unmatched or labelled.
      - name: occupation_code
        description: Submitted NHS Occupation Code.
      - name: occupation_description
        description: Description from NHS Occupation Code Manual v22.1, including retired codes.
      - name: occupation_main_staff_group
        description: Main staff group from the NHS Occupation Code Manual.
      - name: occupation_broad_staff_group
        description: Broad staff group from the NHS Occupation Code Manual.
      - name: occupation_detailed_staff_group
        description: Detailed staff group from the NHS Occupation Code Manual.
      - name: occupation_level
        description: Occupation level from the NHS Occupation Code Manual.
      - name: occupation_care_setting_or_specialty
        description: Care setting or specialty from the NHS Occupation Code Manual.
      - name: is_occupation_code_currently_valid
        description: TRUE when v22.1 marks the occupation code as valid; null when unmatched.
      - name: occupation_label_status
        description: Whether the occupation code is missing, unmatched, current or retired.
      - name: job_role_code
        description: Submitted care professional job role code.
      - name: job_role_description
        description: Published job role description, including retired codes.
      - name: job_role_label_status
        description: Whether the job role code is missing, unmatched or labelled.
      - name: provider_organisation_code
        description: Organisation code of the provider submitting the snapshot.
      - name: provider_organisation_name
        description: Current organisation name for the provider.
      - name: source_record_count
        description: Number of MHS901 rows in the accepted submission for the professional.
      - name: has_duplicate_source_records
        description: TRUE when several MHS901 rows were submitted for the professional.
        data_tests: [not_null]
      - name: uniq_submission_id
        description: Accepted submission containing the professional snapshot.
        data_tests: [not_null]
      - name: uniq_month_id
        description: MHSDS reporting month number, where April 1900 is month 1.
      - name: reporting_period_start_date
        description: Start date of the accepted reporting period.
      - name: reporting_period_end_date
        description: End date of the accepted reporting period.
        data_tests: [not_null]
      - name: mhsds_version
        description: MHSDS version assigned by the source pipeline.
      - name: source_file_received_at
        description: Timestamp when the source file was received.
      - name: source_loaded_at
        description: Timestamp when the source row was loaded.

  - name: rel_mhsds_care_activity_staff
    description: >-
      Care activity to professional relationships across MHSDS versions. One
      row represents one professional linked directly on pre-v6 MHS202 or
      through v6 MHS206. Orphan MHS206 relationships remain visible and link
      flags distinguish missing activity and professional parents.
    config: *owner
    columns:
      - name: care_activity_staff_relationship_id
        description: Stable identifier for the source relationship row.
        data_tests: [not_null, unique]
      - name: care_activity_source_record_id
        description: Expected fct_mhsds_care_activity identifier, retained for orphan relationships.
        data_tests: [not_null]
      - name: care_professional_period_id
        description: Expected dim_mhsds_care_professional_period identifier.
        data_tests: [not_null]
      - name: source_dataset
        description: Source dataset, always MHSDS.
        data_tests: [not_null]
      - name: source_relationship_id
        description: MHS202 or MHS206 unique source row identifier.
        data_tests: [not_null]
      - name: source_table
        description: MHS202 for legacy direct relationships or MHS206 for v6 relationships.
        data_tests:
          - accepted_values:
              arguments:
                values: [MHS202, MHS206]
      - name: relationship_source
        description: Whether the professional was held directly on MHS202 or in MHS206.
      - name: uniq_care_act_id
        description: MHSDS-derived care activity identifier.
        data_tests: [not_null]
      - name: uniq_care_prof_local_id
        description: MHSDS-derived care professional identifier.
        data_tests: [not_null]
      - name: referral_source_record_id
        description: MHSDS unique service request identifier where supplied.
      - name: uniq_care_cont_id
        description: MHSDS-derived care contact identifier where supplied.
      - name: person_id
        description: MHSDS person identifier where supplied.
      - name: staff_group_code
        description: Staff group from the same accepted professional snapshot.
      - name: staff_group_description
        description: Published staff group description, including retired codes.
      - name: staff_group_label_status
        description: Whether the staff group code is missing, unmatched or labelled.
      - name: main_specialty_code
        description: Main specialty from the same accepted professional snapshot.
      - name: main_specialty_description
        description: Published main specialty description, including retired codes.
      - name: main_specialty_label_status
        description: Whether the main specialty code is missing, unmatched or labelled.
      - name: occupation_code
        description: NHS Occupation Code from the same accepted professional snapshot.
      - name: occupation_description
        description: NHS Occupation Code Manual v22.1 description, including retired codes.
      - name: occupation_label_status
        description: Whether the occupation code is missing, unmatched, current or retired.
      - name: job_role_code
        description: Job role from the same accepted professional snapshot.
      - name: job_role_description
        description: Published job role description, including retired codes.
      - name: job_role_label_status
        description: Whether the job role code is missing, unmatched or labelled.
      - name: provider_organisation_code
        description: Organisation code of the provider submitting the relationship.
      - name: provider_organisation_name
        description: Current organisation name for the provider.
      - name: is_care_activity_linked
        description: TRUE when the relationship resolves to fct_mhsds_care_activity.
        data_tests: [not_null]
      - name: is_professional_detail_linked
        description: TRUE when it resolves to the same submission's professional snapshot.
        data_tests: [not_null]
      - name: uniq_submission_id
        description: Accepted submission containing the relationship.
        data_tests: [not_null]
      - name: uniq_month_id
        description: MHSDS reporting month number, where April 1900 is month 1.
      - name: reporting_period_start_date
        description: Start date of the accepted reporting period.
      - name: reporting_period_end_date
        description: End date of the accepted reporting period.
        data_tests: [not_null]
      - name: mhsds_version
        description: MHSDS version assigned by the source pipeline.
      - name: source_file_received_at
        description: Timestamp when the source file was received.
      - name: source_loaded_at
        description: Timestamp when the source row was loaded.
