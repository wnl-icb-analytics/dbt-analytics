version: 2

models:
  - name: fct_mhsds_currency_contacts
    description: >
      Costed MHSDS care contact currencies. Grain: one row per uniq_serv_req_id
      and uniq_care_cont_id (providers reuse local contact ids across
      referrals). Population: classified care contacts outside inpatient spells.
      Time semantics: each contact is allocated to the fiscal year containing
      care_contact_date.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - uniq_serv_req_id
              - uniq_care_cont_id
    columns:
      - name: uniq_care_cont_id
        description: Care contact identifier.
        data_tests:
          - not_null
      - name: uniq_serv_req_id
        description: Unique service request identifier.
        data_tests:
          - not_null
      - name: sk_patient_id
        description: Pseudonymised patient identifier.
      - name: person_id
        description: MHSDS person identifier.
      - name: provider_organisation_code
        description: Provider organisation code.
      - name: provider_organisation_name
        description: Current organisation name for the provider code.
      - name: source_derived_icb_commissioner_code
        description: ICB commissioner code derived in the source feed.
      - name: source_derived_icb_commissioner_name
        description: Current organisation name for the derived ICB commissioner code.
      - name: commissioner_icb_code
        description: Commissioner ICB code resolved for currency reporting.
      - name: commissioner_icb_name
        description: Current organisation name for the currency commissioner code.
      - name: is_wnl_commissioner
        description: TRUE for a recognised current or predecessor WNL commissioner; otherwise FALSE.
      - name: care_contact_date
        description: Care contact date.
      - name: fiscal_year_start
        description: Fiscal year containing the contact date.
      - name: attendance_status_code
        description: Care contact attendance status code.
      - name: attendance_status_description
        description: Published description for the attendance status.
      - name: is_costed_attendance
        description: Whether the attendance is priced.
      - name: currency_group
        description: Currency population group.
      - name: currency_code
        description: Contact currency code.
      - name: unit_price_2627_gbp
        description: Resolved 2026/27 price in GBP.
        data_tests:
          - not_null
      - name: price_source
        description: Price resolution attempt that supplied the price.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['exact', 'population_family', 'unclassified_setting', 'unclassified_family']
      - name: mff_factor
        description: Provider Market Forces Factor.
      - name: proxy_cost
        description: Price multiplied by MFF and GDP deflator ratio, or zero for uncosted attendance.
      - name: is_cyp
        description: >-
          Whether age at contact is under 18. A contact with no recorded age is
          classified as adult, so read this with has_known_age_at_contact.
      - name: has_known_age_at_contact
        description: >-
          Whether an age at the contact date was recorded. False identifies the
          contacts classified as adult through the fallback rather than a known
          age.
      - name: is_crisis_referral
        description: Resolved crisis referral flag.
      - name: winning_tier
        description: Classification tier that ended the cascade.
