version: 2

models:
  - name: fct_mhsds_currency_bed_days
    description: >
      Costed MHSDS hospital-provider spell bed days. Grain: one row per
      uniq_hosp_prov_spell_num and fiscal_year_start. Population: all
      classified MHSDS spells. Time semantics: each spell is split across fiscal
      years, with each night allocated to the fiscal year in which it starts.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: uniq_hosp_prov_spell_num
        description: Hospital provider spell identifier.
        data_tests:
          - not_null
      - name: fiscal_year_start
        description: Fiscal year start.
        data_tests:
          - not_null
      - name: uniq_serv_req_id
        description: Unique service request identifier.
      - name: sk_patient_id
        description: Pseudonymised patient identifier.
      - name: person_id
        description: MHSDS person identifier.
      - name: provider_organisation_code
        description: Provider organisation code.
        data_tests:
          - not_null
      - name: provider_organisation_name
        description: Current organisation name for the provider code.
      - name: source_derived_icb_commissioner_code
        description: ICB commissioner code derived in the source feed.
      - name: source_derived_icb_commissioner_name
        description: Current organisation name for the derived ICB commissioner code.
      - name: commissioner_icb_code
        description: Commissioner ICB code resolved for currency reporting.
      - name: commissioner_icb_name
        description: Current organisation name for the currency commissioner code.
      - name: is_wnl_commissioner
        description: TRUE for a recognised current or predecessor WNL commissioner; otherwise FALSE.
      - name: currency_group
        description: Currency population group.
        data_tests:
          - not_null
      - name: currency_code
        description: NHSE inpatient currency code.
        data_tests:
          - not_null
      - name: pricing_currency_code
        description: >-
          Code used to resolve a bed-day price. MAZ99 spells use the matching
          MBU98 setting because MAZ99 has no published bed-day price.
      - name: hospital_provider_spell_start_date
        description: Hospital provider spell start date.
        data_tests:
          - not_null
      - name: hospital_provider_spell_end_date
        description: Derived hospital provider spell end date; null while open.
      - name: bed_days_from_date
        description: First night counted in this row's bed_days.
        data_tests:
          - not_null
      - name: bed_days_to_date
        description: >
          Day after the last night counted in this row's bed_days (exclusive,
          so bed_days = bed_days_to_date - bed_days_from_date).
        data_tests:
          - not_null
      - name: bed_days
        description: Bed days allocated to the fiscal year.
        data_tests:
          - not_null
      - name: unit_price_2627_gbp
        description: Resolved 2026/27 price in GBP.
        data_tests:
          - not_null
      - name: price_source
        description: Price fallback that supplied the bed-day price.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['exact', 'population_family', 'unclassified_setting', 'unclassified_family']
      - name: mff_factor
        description: Provider Market Forces Factor.
        data_tests:
          - not_null
      - name: gdp_deflator_ratio_applied
        description: Activity-year GDP deflator divided by the 2026/27 deflator.
        data_tests:
          - not_null
      - name: proxy_cost
        description: Price multiplied by bed days, MFF, and GDP deflator ratio.
        data_tests:
          - not_null
      - name: hospital_provider_spell_end_date_source
        description: Source of the hospital provider spell end date.
      - name: is_cyp
        description: Whether age at admission is under 18.
      - name: winning_tier
        description: Classification tier that ended the cascade.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - uniq_hosp_prov_spell_num
              - fiscal_year_start
