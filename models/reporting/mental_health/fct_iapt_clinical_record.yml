version: 2
models:
  - name: fct_iapt_clinical_record
    description: >-
      NHS Talking Therapies (IAPT data set) clinical items in one list: one row
      per scored assessment item, recorded condition, and care activity
      procedure, finding or observation. The only inclusion union for IAPT
      clinical items, used by analysts and the person clinical-record adapter.
      A view that selects from fct_iapt_assessment_score,
      fct_iapt_health_condition and fct_iapt_care_activity; use those facts for
      type-specific detail and provenance. Items are not encounters, and
      assessment rows are not whole questionnaires.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: source_record_id
        description: Hash of source model, originating record id and clinical record type.
        data_tests: [not_null, unique]
      - name: originating_source_record_id
        description: source_record_id in source_model_name. One activity yields up to three items.
      - name: source_model_name
        description: Typed fact supplying the item.
      - name: source_table
        description: IAPT table supplying the item (IDS202, IDS601, IDS602, IDS603, IDS606 or IDS607).
      - name: clinical_record_type
        description: assessment_score, previous_diagnosis, long_term_condition, presenting_complaint, procedure, finding or observation.
      - name: person_id
        description: IAPT Person_ID. IAPT-scoped; use sk_patient_id across datasets.
      - name: parent_record_id
        description: Parent key, populated only when the parent exists and every recorded link agrees on referral, contact and person.
      - name: parent_record_type
        description: care_contact, care_activity or referral.
      - name: parent_model_name
        description: Fact holding the parent.
      - name: clinical_date
        description: Date from the source fact, null unless clinical_date_status is recorded.
      - name: clinical_at
        description: Date and time, or midnight on the date when only a date exists. Null when unknown.
      - name: clinical_time_precision
        description: timestamp, date or unknown.
      - name: clinical_date_status
        description: recorded, missing, source_sentinel, parent_not_linked, parent_inconsistent or not_collected.
      - name: is_source_date_inconsistent
        description: True when the clinical date differs from the processing office's derived date. Null for conditions and IDS606.
      - name: coding_system
        description: SNOMED CT or ICD-10; null when the submitted scheme is missing or invalid.
      - name: clinical_code
        description: Submitted code or SNOMED CT expression.
      - name: clinical_description
        description: Label of the code. Procedures include their context, such as "(context - Offered)", or "(unrecognised refinement)".
      - name: clinical_label_status
        description: Label status from the source fact.
      - name: clinical_qualifier_code
        description: Procedure context value, for example 410527000 Offered. Null for other items.
      - name: clinical_qualifier_description
        description: Label of the procedure context.
      - name: snomed_code
        description: Atomic SNOMED CT code the item supports - assessment observable, SNOMED-coded condition or finding, observation, or an asserted procedure. Null for ICD-10 items and for procedures that are offered, planned or otherwise refined.
      - name: clinical_value
        description: Assessment score or observation value as submitted.
      - name: clinical_value_description
        description: Published meaning of an enumerated assessment response.
      - name: clinical_value_numeric
        description: Technical numeric parse. Use assessment_score_numeric for comparable scores.
      - name: clinical_value_parse_status
        description: value_missing, numeric or not_numeric for assessments and observations.
      - name: unit_of_measurement_symbol
        description: UCUM symbol for an observation unit.
      - name: assessment_score_numeric
        description: Comparable assessment score on the latest definition's scale; null for non-score, historical-format, text and out-of-range values.
      - name: assessment_response_status
        description: Assessment interpretation status from fct_iapt_assessment_score.
      - name: is_assessment_response_non_score
        description: True for Not Applicable and Score not available responses.
      - name: source_loaded_at
        description: Time the retained source row was loaded into the warehouse.
