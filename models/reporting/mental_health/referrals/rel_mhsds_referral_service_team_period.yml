version: 2
models:
- name: rel_mhsds_referral_service_team_period
  description: >-
    Teams associated with a referral in each accepted submission. Each row is one submission,
    referral, team and role, using team details from that same submission. Repeated versions within
    a submission use the latest received source record. Open or closed relationship state follows
    the submitted dates; it does not establish active treatment. Join to referral-period tables on
    both submission and referral. Several teams can match one referral.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: referral_service_team_period_id
    description: Key for submission, referral, role and team.
    data_tests:
    - unique
    - not_null
  - name: reporting_period_end_date
    description: Accepted provider period represented by this relationship.
