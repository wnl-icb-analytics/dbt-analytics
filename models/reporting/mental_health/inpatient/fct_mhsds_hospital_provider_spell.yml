version: 2
models:
- name: fct_mhsds_hospital_provider_spell
  description: >-
    Admissions and discharges as recorded by providers. Each row is the latest submitted version of
    one provider-qualified hospital spell. A missing discharge date means no discharge was recorded;
    it does not prove current occupancy. This table retains recorded spells before overlap removal
    or inferred closure, and does not apply currency or costing rules. If a provider reuses a spell
    identifier, the earlier record is treated as a version of that spell rather than a separate
    admission.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: source_record_id
    description: Stable spell join key; the MHSDS provider-qualified hospital provider spell identifier.
    data_tests:
    - not_null
    - unique
  - name: source_dataset
    description: Source data set; always MHSDS.
  - name: mhs501_uniq_id
    description: Submitted MHS501 row selected as the newest version of the spell.
  - name: hosp_prov_spell_id
    description: Provider-local hospital provider spell identifier.
  - name: service_request_id
    description: Provider-local service request identifier linked to the spell.
  - name: referral_source_record_id
    description: MHSDS unique service request identifier linked to the spell.
  - name: has_matching_referral
    description: Whether the recorded referral exists in fct_mhsds_referral.
  - name: referral_service_or_team_id
    description: Primary referral service or team identifier; this is not a ward team.
  - name: referral_service_or_team_type_code
    description: Primary referral service or team type code.
  - name: referral_service_or_team_type_description
    description: Published description of the primary referral service or team type.
  - name: referral_service_or_team_name
    description: Service or team name supplied with the referral.
  - name: person_id
    description: MHSDS person identifier.
  - name: sk_patient_id
    description: Pseudonymised cross-system patient key; null where bridging is unavailable.
  - name: admission_date
    description: Recorded hospital provider spell start date; source dates before 1901 are null.
  - name: admission_time
    description: Recorded hospital provider spell start time.
  - name: admitted_at
    description: Recorded admission timestamp; date-only records use midnight.
  - name: admission_time_precision
    description: Precision of admitted_at.
    data_tests: &id001
    - accepted_values:
        arguments:
          values:
          - date
          - timestamp
  - name: decided_to_admit_date
    description: Recorded date of the decision to admit.
  - name: decided_to_admit_time
    description: Recorded time of the decision to admit.
  - name: decided_to_admit_at
    description: Recorded decision-to-admit timestamp; date-only records use midnight.
  - name: decided_to_admit_time_precision
    description: Precision of decided_to_admit_at.
    data_tests: *id001
  - name: admission_source_code
    description: Version-defined MHS501 admission source code recorded by the provider.
  - name: admission_source_description
    description: Published NHS Data Model and Dictionary description for the admission source.
  - name: admission_method_code
    description: Version-defined MHS501 admission method code recorded by the provider.
  - name: admission_method_description
    description: Published NHS Data Model and Dictionary description for the admission method.
  - name: estimated_discharge_date
    description: Estimated discharge date recorded by the provider; it is not used to close the spell.
  - name: planned_discharge_date
    description: Planned discharge date recorded by the provider; it is not used to close the spell.
  - name: planned_discharge_destination_code
    description: Version-defined MHS501 planned discharge destination code recorded by the provider.
  - name: planned_discharge_destination_description
    description: Published description for the planned discharge destination.
  - name: discharge_date
    description: Recorded discharge date; source dates before 1901 are null.
  - name: discharge_time
    description: Recorded discharge time.
  - name: discharged_at
    description: Recorded discharge timestamp; date-only records use midnight.
  - name: discharge_time_precision
    description: Precision of discharged_at.
    data_tests: *id001
  - name: discharge_method_code
    description: Version-defined MHS501 discharge method code recorded by the provider.
  - name: discharge_method_description
    description: Published NHS Data Model and Dictionary description for the discharge method.
  - name: discharge_destination_code
    description: Version-defined MHS501 discharge destination code recorded by the provider.
  - name: discharge_destination_description
    description: Published NHS Data Model and Dictionary description for the discharge destination.
  - name: has_recorded_discharge
    description: Whether the retained source version contains a discharge date.
  - name: source_spell_status
    description: Discharged or no recorded discharge, based only on retained source state.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - discharged
          - no_recorded_discharge
  - name: recorded_length_of_stay_days
    description: Calendar days from recorded admission to recorded discharge; negative values identify
      source errors.
  - name: has_invalid_recorded_date_order
    description: Whether the recorded discharge date is before the admission date.
  - name: has_invalid_recorded_time_order
    description: Whether complete recorded discharge and admission timestamps are in reverse order.
  - name: has_decision_to_admit_after_admission
    description: Whether the recorded decision-to-admit date is after admission.
  - name: has_decision_to_admit_after_admission_time
    description: Whether complete recorded decision-to-admit and admission timestamps are in reverse clinical
      order.
  - name: has_estimated_discharge_before_admission
    description: Whether the recorded estimated discharge date predates admission.
  - name: has_planned_discharge_before_admission
    description: Whether the recorded planned discharge date predates admission.
  - name: age_at_admission
    description: Age at admission derived in the MHSDS feed.
  - name: age_at_discharge
    description: Age at discharge derived in the MHSDS feed.
  - name: provider_organisation_code
    description: Organisation code of the provider submitting the spell.
  - name: provider_organisation_name
    description: Current organisation name for the provider code.
  - name: source_derived_icb_commissioner_code
    description: ICB commissioner assigned by the source pipeline.
  - name: source_derived_icb_commissioner_name
    description: Current organisation name for the source-derived ICB commissioner.
  - name: is_wnl_commissioner
    description: Whether the source-derived commissioner belongs to current WNL or a predecessor commissioner.
  - name: record_start_date
    description: Source record start date where supplied.
  - name: record_end_date
    description: Source record end date where supplied.
  - name: uniq_submission_id
    description: Accepted submission containing the retained MHS501 row.
  - name: uniq_month_id
    description: MHSDS reporting month number, where April 1900 is month 1.
  - name: reporting_period_start_date
    description: Start date of the retained submission period.
  - name: reporting_period_end_date
    description: End date of the newest accepted reporting period containing the spell.
  - name: mhsds_specification_version
    description: MHSDS specification version declared in the retained submission header. Null means the
      retained submission has no usable declared version, so version-dependent fields report unknown provenance.
  - name: source_pipeline_dataset
    description: MHSDS dataset family assigned by the source pipeline.
  - name: source_file_received_at
    description: Timestamp when the selected source file was received by the submission portal.
  - name: source_loaded_at
    description: Timestamp when the source pipeline loaded the selected row.
