models:
  - name: int_tat_turnaround_times
    description: |
      Supported analyst table for imaging diagnostic Turnaround Times. One row is
      one diagnostic test event (tat_event_id) in the surviving Flex or Freeze
      submission for that trust and data period. Built from stg_tat_turnaround_times
      with TAT hours (scan, report, overall), Flex/Freeze classification, a
      standardised cancer pathway flag, and restatement to the latest file per
      trust and period. Out-of-range Flex/Freeze rows are dropped, so totals can
      differ from DATA_LAKE__NCL.ANALYST_MANAGED.TURNAROUND_TIMES_RAW. Query this
      model, not that analyst-managed copy. Keep DATA_LAKE.TAT.TURNAROUND_TIMES_RAW
      as the ingest landing table. Field mapping is in
      docs/model_documentation/tat_turnaround_times.md.
    config:
      meta:
        owner:
          name: Jonathan Linney
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: tat_event_id
        description: Surrogate key for a diagnostic test event (carried from staging). Grain of the model.
        data_tests:
          - unique
          - not_null
      - name: data_type
        description: Submission window classification.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Freeze', 'Flex']
      - name: trust_code
        description: Provider trust code.
      - name: submission_date
        description: Date the surviving file was submitted.
      - name: data_period
        description: First day of the nominal data month.
      - name: month
        description: 3-letter month abbreviation of the data period.
      - name: year
        description: 4-digit year of the data period.
      - name: ethnic_category
        description: Patient ethnic category code.
      - name: person_gender
        description: Patient gender code.
      - name: general_medical_practice
        description: GP practice ODS code.
      - name: patient_source_type
        description: Patient source/setting type code (integer).
      - name: referrer_code
        description: Referrer code.
      - name: referring_organisation
        description: Referring organisation (COALESCE of ReferringOrg / ReferringOrganisation variants).
      - name: diagnostic_test_request_date_time
        description: Datetime the diagnostic test was requested.
      - name: diagnostic_test_request_received_date_time
        description: Datetime the test request was received.
      - name: diagnostic_test_date_time
        description: Datetime the diagnostic test (scan) was performed.
      - name: service_report_issue_date_time
        description: Datetime the service report was issued.
      - name: imaging_code_nicip
        description: NICIP imaging code.
      - name: imaging_code_snomed
        description: SNOMED imaging code.
      - name: combined_imaging_code
        description: NICIP preferred, falling back to SNOMED.
      - name: provider_site_code
        description: Provider site code.
      - name: priority_type_code
        description: Priority type code (integer).
      - name: priority_type_code_routine_default
        description: Priority type code with null defaulted to 1 (routine).
      - name: cancer_pathway_flag
        description: Raw cancer pathway flag as submitted.
      - name: cancer_pathway_flag_string
        description: Standardised cancer pathway flag (Y / N / Unclassified).
      - name: tat_scan
        description: Hours from test request to test performed. Same meaning as TAT_scan on the retired analyst-managed table. Rounded half away from zero; the retired R pipeline rounded half to even, so values exactly on a half hour (under 1% of rows) can be one hour higher.
      - name: tat_report
        description: Hours from test performed to report issued. Same meaning as TAT_report on the retired analyst-managed table. Rounded half away from zero; the retired R pipeline rounded half to even, so values exactly on a half hour (under 1% of rows) can be one hour higher.
      - name: tat_overall
        description: Hours from test request to report issued. Same meaning as TAT_overall on the retired analyst-managed table. Rounded half away from zero; the retired R pipeline rounded half to even, so values exactly on a half hour (under 1% of rows) can be one hour higher.
      - name: datedifftest
        description: Whole months between the data period and the test month (drives Freeze/Flex).
      - name: file_name
        description: Source filename of the surviving submission.
      - name: source_file
        description: Full stage path (provenance).
      - name: loaded_at
        description: Timestamp the row was loaded into raw (provenance).
