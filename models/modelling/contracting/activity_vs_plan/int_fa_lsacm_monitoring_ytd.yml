models:
  - name: int_fa_lsacm_monitoring_ytd
    description: >
      Extension of int_fa_lsacm_monthly_sub_ytd to include future months as a dashboard base. Multiple entries per PROVIDER. Latest file per financial month selected.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: provider_code
        description: Provider ODS code.
      - name: provider_name
        description: Full name of the provider organisation.
      - name: provider_shorthand
        description: Shorthand acronym for the provider organisation.
      - name: meta_file_id
        description: SDL source file identifier for the selected latest submission. Joins to META_FILE_REGISTRY.
      - name: activity_month
        description: Month of actual activity in YYYY-MM format.
      - name: fy_submission_month_number
        description: Financial month number from 1 (April) to 12 (March) includes future months.
      - name: fy_month_submitted
        description: Actual submitted financial month number from 1 (April) to 12 (March).
      - name: financial_year
        description: Financial year for the submission as YY/YY format.
      - name: required_submission_date
        description: Required submission date for the selected submission from timetable.
      - name: date_submitted
        description: Date when the submission was actually made from META_FILE_REGISTRY.
      - name: file_version
        description: Version number for the selected submission file from META_FILE_REGISTRY.
      - name: submitted_row_count
        description: Row count from the selected submission metadata from META_FILE_REGISTRY.
      - name: dashboard_status
        description: Dashboard status for the submission including future status 'Awaiting submission'.
      - name: days_late
        description: Derived number of days the submission is late.
      - name: days_to_submission
        description: Derived number of days to the required submission date.
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1