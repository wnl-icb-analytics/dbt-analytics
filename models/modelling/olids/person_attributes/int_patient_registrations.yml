models:
  - name: int_patient_registrations
    description: Intermediate table containing clean patient registration periods derived from episode_of_care. Each row represents a registration period at a specific practice, with proper handling of overlapping periods and current registrations. History is complete from about October 2021. Patients who left a practice before then have no usable record in the OLIDS feed, so counts for earlier dates run low. Patients moved in a practice merger keep their original start date at the successor practice.

    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: patient_id
        tests:
          - not_null