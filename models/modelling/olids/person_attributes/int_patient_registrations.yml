models:
  - name: int_patient_registrations
    description: Intermediate table containing clean patient registration periods derived from episode_of_care. Each row represents a registration period at a specific practice, with proper handling of overlapping periods and current registrations. History is complete for the last 60 months only. OLIDS keeps Left and Deceased registrations for five years, so counts for older dates run low. Patients moved in a practice merger keep their original start date at the successor practice. EMIS also rewrites registration dates after the event. A patient removed in list cleaning and then re-registered gets a new start date and the earlier registration is dropped, and leaving dates can be backdated. Counts rebuilt for a past date therefore fall as the data ages.

    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: patient_id
        tests:
          - not_null