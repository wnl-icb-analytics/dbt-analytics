models:
- name: int_nice_review_evidence
  description: >-
    Condition review evidence for registered, living, non-test people with relevant condition
    registers, depression, frailty or at least four multimorbidity categories. One row per
    candidate person on the build date. Includes unresolved asthma diagnoses from age 5, without
    a treatment requirement. Dates stop at the build date; indicators apply their own
    populations and windows. Null dates mean no evidence.
  config:
    meta:
      owner:
        name: EddieDavison92
  columns:
  - name: person_id
    description: Person identifier.
    data_tests:
    - unique
    - not_null
  - name: reporting_date
    description: >-
      Build date on which population and evidence are assessed.
  - name: latest_asthma_review_date
    description: Date of the latest asthma review record; null if none.
  - name: latest_complete_asthma_review_date
    description: Date of the latest asthma review with a same-day written personalised plan and an exacerbation
      count recorded within the preceding month, as QOF v51 AST015 defines; null if none.
  - name: latest_copd_review_date
    description: Date of the latest COPD review record; null if none.
  - name: latest_copd_exacerbation_count_date
    description: Date of the latest record of the number of COPD exacerbations (COPDEXACB_COD); null if
      none.
  - name: latest_heart_failure_review_date
    description: Date of the latest heart failure review record; null if none.
  - name: latest_rheumatoid_arthritis_review_date
    description: Date of the latest rheumatoid arthritis annual review record; null if none.
  - name: latest_ld_health_check_date
    description: Date of the latest learning disability health check; null if none.
  - name: latest_ld_health_action_plan_date
    description: Date of the latest learning disability health action plan; null if none.
  - name: latest_dementia_care_plan_date
    description: Date of the latest dementia care plan or care plan review; null if none.
  - name: latest_structured_medication_review_date
    description: Date of the latest structured medication review; null if none.
  - name: latest_falls_discussion_date
    description: Date of the latest record of asking about falls; null if none.
  - name: latest_mrc_dyspnoea_date
    description: Date of the latest MRC dyspnoea scale record; null if none.
  - name: latest_nyha_date
    description: Date of the latest NYHA classification record; null if none.
  - name: latest_thyroid_function_test_date
    description: Date of the latest thyroid function test; null if none.
  - name: latest_smi_care_plan_date
    description: Date of the latest mental health care plan record; null if none.
  - name: latest_medication_review_date
    description: Date of the latest medication review, heart failure medication review or structured medication
      review; null if none.
  - name: first_cancer_care_review_after_diagnosis_date
    description: Date of the first cancer care review on or after the latest first-or-new-episode cancer
      diagnosis; null if none.
