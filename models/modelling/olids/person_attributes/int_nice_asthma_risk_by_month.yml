models:
- name: int_nice_asthma_risk_by_month
  description: Asthma higher-risk profile, one row per active, living, non-test IND186 diagnosis member
    aged 6+ and reporting date. Counts SABA inhalers, distinct prednisolone order days and GP asthma admissions
    in (R minus 24 months, R minus 12 months]. No SUS evidence. Recalculated at monthly refresh for the last 60 completed
    month-ends with current rules and code lists. Monthly spine registration start is inclusive; registration
    end and death dates are exclusive. Approximate birth/death dates, overlap priority and current test/gender
    flags constrain history. Diagnosis and resolution use clinical and recorded known dates; other evidence
    uses clinical/order dates through R. Later corrections can change earlier results.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: person_id
    description: Person aged 6+ with an unresolved IND186 diagnosis.
  - name: reporting_date
    description: Date at which eligibility and prior-year risk are assessed.
  - name: risk_period_start
    description: Exclusive start of the prior-year risk window.
  - name: risk_period_end
    description: Inclusive end of the prior-year risk window.
  - name: saba_inhaler_count
    description: Inhaler devices in the risk window. Doses divided by 60 for Accuhaler, 100 for Turbohaler,
      otherwise 200, rounded to whole devices with a minimum of one per matched order.
  - name: oral_steroid_course_count
    description: Distinct prednisolone order days in the risk window, used as a proxy for oral steroid
      courses.
  - name: latest_asthma_admission_date
    description: Latest GP-coded ASTADMSN_COD admission in the risk window; null when none.
  - name: has_high_saba_use
    description: At least six SABA inhalers in the risk window.
  - name: has_repeated_oral_steroids
    description: At least two distinct prednisolone order days in the risk window.
  - name: has_asthma_admission
    description: A GP-coded asthma admission in the risk window.
  - name: is_higher_risk
    description: At least one of the three GP risk factors is present.
