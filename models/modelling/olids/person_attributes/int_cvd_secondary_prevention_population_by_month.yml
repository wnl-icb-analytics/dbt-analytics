models:
- name: int_cvd_secondary_prevention_population_by_month
  description: Secondary-prevention CVD population. One row per active register member and completed month-end
    on CHD, stroke/TIA or PAD registers with a diagnosis by that date. All three diagnosis anchors and
    both lifelong exclusion flags are retained. Undated FH and haemorrhagic-stroke evidence count as history.
    Recalculated at monthly refresh for the last 60 completed month-ends using today's rules and code
    lists. Registration and practice come from the existing monthly spine. Registration start is inclusive,
    end and death dates exclusive. Overlapping registrations retain the spine's current-registration priority.
    Birth and death dates are approximate; missing birth dates prevent historical active rows.
    Test patients remain in this input; indicators exclude them through the common population.
    Register diagnosis state uses both clinical and recorded dates.
    FH and haemorrhagic-stroke history use clinical dates, with undated evidence retained. Later corrections and current
    code-list changes can alter earlier results.
  config:
    meta:
      owner:
        name: EddieDavison92
  columns:
  - name: person_id
    description: Person on at least one CVD register.
  - name: reporting_date
    description: Completed month-end at which eligibility and evidence are assessed. DATE; no current-day
      row.
  - name: has_chd
    description: On the CHD register with a diagnosis by the month-end.
  - name: has_stroke_tia
    description: On the stroke/TIA register with a diagnosis by the month-end.
  - name: has_pad
    description: On the PAD register with a diagnosis by the month-end.
  - name: earliest_chd_diagnosis_date
    description: Earliest CHD register diagnosis date; null if not on that register.
  - name: earliest_stroke_tia_diagnosis_date
    description: Earliest stroke/TIA register diagnosis date; null if not on that register.
  - name: earliest_pad_diagnosis_date
    description: Earliest PAD register diagnosis date; null if not on that register.
  - name: earliest_cvd_diagnosis_date
    description: Earliest diagnosis date across the qualifying registers.
  - name: has_familial_hypercholesterolaemia
    description: Any FH diagnosis code recorded, undated or dated by the month-end.
  - name: has_haemorrhagic_stroke
    description: Any haemorrhagic stroke code recorded, undated or dated by the month-end.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
