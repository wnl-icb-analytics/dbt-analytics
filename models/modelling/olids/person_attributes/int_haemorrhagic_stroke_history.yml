models:
  - name: int_haemorrhagic_stroke_history
    description: >
      People with any recorded history of haemorrhagic stroke from the PCD cluster
      HSTRK_COD, one row per person including inactive and deceased people. Undated
      records count as history; records with an original date after the build date
      do not. Shared exclusion for secondary-prevention measures where bleeding
      risk may outweigh vascular benefit.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Person with haemorrhagic stroke history.
        data_tests:
          - unique
          - not_null
      - name: earliest_recorded_date
        description: Earliest dated record; null when every record is undated.
      - name: has_undated_record
        description: Whether any record has no original date.
      - name: record_count
        description: Distinct qualifying readings by concept, corrected clinical calendar date and recorded value, including null results. Unknown clinical days keep separate observation ids.

unit_tests:
- name: stroke_history_counts_distinct_readings
  model: int_haemorrhagic_stroke_history
  overrides:
    macros:
      get_empty_subquery_sql: SELECT NULL::NUMBER AS person_id, NULL::NUMBER AS record_count, NULL::BOOLEAN AS has_undated_record, NULL::DATE AS earliest_recorded_date WHERE FALSE
  given:
  - input: ref('int_haemorrhagic_stroke_diagnoses_all')
    format: sql
    rows: |-
      SELECT column1::VARCHAR AS id, column2::NUMBER AS person_id,
          column3::TIMESTAMP_NTZ AS clinical_effective_date, column4::VARCHAR AS concept_code,
          column5::FLOAT AS result_value, column3::TIMESTAMP_NTZ AS clinical_effective_date_raw
      FROM VALUES ('SYN_A', -145401, '2024-01-01 09:00:00', 'SYN_C', NULL),
      ('SYN_B', -145401, '2024-01-01 18:00:00', 'SYN_C', NULL),
      ('SYN_C', -145401, '2024-01-01', 'SYN_OTHER', NULL),
      ('SYN_D', -145401, '2024-01-02', 'SYN_C', NULL),
      ('SYN_E', -145401, '2024-01-01', 'SYN_C', 0),
      ('SYN_F', -145401, '2024-01-01', 'SYN_C', 1),
      ('SYN_G', -145402, '2024-01-01', 'SYN_C', NULL)
      UNION ALL
      SELECT column1::VARCHAR, -145403::NUMBER, '1900-01-01'::TIMESTAMP_NTZ,
          'SYN_UNDATED'::VARCHAR, NULL::FLOAT, NULL::TIMESTAMP_NTZ
      FROM VALUES ('SYN_UNDATED_A'), ('SYN_UNDATED_B')
  expect:
    rows:
    - person_id: -145401
      record_count: 3
      has_undated_record: false
      earliest_recorded_date: '2024-01-01'
    - person_id: -145402
      record_count: 1
      has_undated_record: false
      earliest_recorded_date: '2024-01-01'
    - person_id: -145403
      record_count: 2
      has_undated_record: true
      earliest_recorded_date: null
