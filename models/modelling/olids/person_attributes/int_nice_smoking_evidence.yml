models:
- name: int_nice_smoking_evidence
  description: NICE smoking evidence, one row per candidate person and current evaluation date. Any LTC
    register member or a person aged 43 to 84 at reporting_date. Current smokers are not preselected before
    smoking state is assessed. Candidates use the common active, living, non-test NICE population. Clinical
    evidence is capped at reporting_date. Dates remain available outside indicator windows; null dates
    mean no qualifying evidence by that date.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: person_id
    description: Candidate person with potential NICE evidence uses.
  - name: reporting_date
    description: DATE at which candidate selection and evidence are assessed. Current stored dates are
      relabelled by nice_ref on read.
  - name: latest_smoking_status
    description: Selected smoking state. LSMOK precedes EXSMOK, NSMOK and other status on the same calendar
      day, then highest observation id wins. Null when never recorded.
  - name: latest_smoking_status_date
    description: Clinical calendar date of the selected smoking state, retaining the age-at-event 11+
      source rule.
  - name: latest_never_smoked_date
    description: Latest explicit NSMOK recording; a non-smoker with unknown history does not qualify.
  - name: latest_smoking_intervention_date
    description: Latest QOF SMOK004 referral or pharmacotherapy observation or medication order. Advice
      alone does not qualify.
