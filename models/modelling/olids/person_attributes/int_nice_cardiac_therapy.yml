models:
- name: int_nice_cardiac_therapy
  description: >-
    Cardiac prescriptions for registered, living, non-test people with heart failure register
    membership or a recorded myocardial infarction. One row per person on the build date. Each
    drug class retains its latest order from 1 January 1990 through the build date, including
    older treatment outside indicator windows. Mineralocorticoid receptor antagonists include
    spironolactone and eplerenone, excluding finerenone. Angiotensin receptor blockers include
    sacubitril/valsartan.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: latest_ace_inhibitor_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_arb_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_beta_blocker_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_hf_licensed_beta_blocker_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_mra_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_sglt2_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_aspirin_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_p2y12_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_clopidogrel_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_antiplatelet_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_statin_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_anticoagulant_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_ras_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: antiplatelet_chemical_count_in_period
    description: >-
      Number of distinct nine-character BNF chemical prefixes ordered in the inclusive six
      months to assessment. Strengths and products of one chemical count once. The IND125
      alternative result also counts recorded over-the-counter aspirin when no aspirin
      prescription is current.
