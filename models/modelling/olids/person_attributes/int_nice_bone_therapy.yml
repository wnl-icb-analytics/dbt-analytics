models:
- name: int_nice_bone_therapy
  description: Bone-sparing order evidence for registered, living, non-test people aged 50 or over. One
    row per person on the build date.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: person_id
    description: Person identifier.
  - name: reporting_date
    description: Date R used to cap evidence.
  - name: latest_bone_sparing_order_date
    description: Latest BSADRUG_COD order through R; null means no order.
