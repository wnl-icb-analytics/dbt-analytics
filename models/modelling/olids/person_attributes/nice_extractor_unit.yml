      SELECT NULL::NUMBER AS person_id, NULL::DATE AS month_end_date, NULL::TIMESTAMP_NTZ AS earliest_diagnosis_date, NULL::TIMESTAMP_NTZ AS latest_diagnosis_date, NULL::VARCHAR AS diabetes_type, NULL::TIMESTAMP_NTZ AS earliest_type1_date, NULL::TIMESTAMP_NTZ AS latest_type1_date, NULL::TIMESTAMP_NTZ AS earliest_type2_date, NULL::TIMESTAMP_NTZ AS latest_type2_date, NULL::TIMESTAMP_NTZ AS latest_resolved_date WHERE FALSE
