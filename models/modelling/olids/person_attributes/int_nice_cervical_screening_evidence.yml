models:
- name: int_nice_cervical_screening_evidence
  description: >-
    Cervical screening and pregnancy evidence for registered, living, non-test women aged 25 to
    64. One row per person on the build date. No screening, cervix-removal or pregnancy
    exclusion removes a candidate. Completed screening remains available after later declines or
    unsuitable records. Pregnancy evidence stops at midnight at the start of the build date;
    indicators apply their own exclusions and screening windows.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: person_id
    description: Female person aged 25-64 in the common active, living, non-test NICE population.
  - name: reporting_date
    description: >-
      Build date on which population and evidence are assessed.
  - name: latest_completed_date
    description: >-
      Latest completed screen by the reporting date, independently of later declined or
      unsuitable records. Null means none.
  - name: latest_screening_date
    description: >-
      Latest clinical screening record of any type by the reporting date. Null means none.
  - name: programme_status
    description: >-
      Screening programme status. Unsuitable records take precedence; screening intervals are
      1,277 days for ages 25 to 49 or 2,007 days for ages 50 to 64. NICE indicators apply
      their own windows in calendar months.
  - name: latest_unsuitable_date
    description: >-
      Latest unsuitable-screening record by the reporting date. Null means none.
  - name: latest_declined_date
    description: >-
      Latest declined-screening record by the reporting date. Null means none.
  - name: latest_non_response_date
    description: >-
      Latest non-response-to-three-invitations record by the reporting date. Consumers apply
      their own strict lower screening-window boundary. Null means none.
  - name: first_cervix_removal_date
    description: >-
      First complete cervix removal by the reporting date. Null means no removal yet.
  - name: latest_pregnancy_date
    description: >-
      Latest pregnancy-code timestamp at or before midnight on the reporting date. Null means
      none.
  - name: latest_delivery_date
    description: >-
      Latest delivery or pregnancy-outcome timestamp at or before midnight on the reporting
      date. Null means none.
  - name: is_currently_pregnant
    description: Pregnancy record in the preceding nine calendar months and strictly later than any delivery/outcome
      record, matching the point-date pregnancy_status_history rule.
