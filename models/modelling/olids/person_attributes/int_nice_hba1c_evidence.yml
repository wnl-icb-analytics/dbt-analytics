models:
- name: int_nice_hba1c_evidence
  description: NICE hba1c evidence. One row per active, living, non-test person and current build date, restricted
    to DM, NDH, gestational diabetes or SMI members. Evidence uses clinical or order dates through the reference
    date. Null dates mean no evidence; stale dates remain available and indicators apply their own windows
    and exclusions. Use nice_ref when reading this stored input so its build date does not filter current membership
    after midnight.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  - dbt_utils.expression_is_true:
      arguments:
        expression: (latest_hba1c_date is null or latest_hba1c_date::date <= reporting_date) and (latest_fructosamine_date
          is null or latest_fructosamine_date::date <= reporting_date) and (latest_dmmax_date is null or latest_dmmax_date::date
          <= reporting_date)
  columns:
  - name: person_id
    description: Person on a DM, NDH, gestational diabetes or SMI register at the reference date.
    data_tests:
    - not_null
  - name: reporting_date
    description: Date at which candidate membership and evidence are assessed.
    data_tests:
    - not_null
  - name: latest_hba1c_observation_id
    description: Selected HbA1c observation. Null if no test is dated by the reference date.
  - name: latest_hba1c_date
    description: Latest HbA1c clinical day, including value-free and invalid tests. Consumers apply their own
      measurement window.
  - name: latest_hba1c_value
    description: Selected standardised IFCC result in mmol/mol. A value can be present but invalid; interpret
      with is_latest_hba1c_valid.
  - name: is_latest_hba1c_valid
    description: Source validity of the selected result; false when evidence is missing. Valid results win
      same-day ties, then the highest observation id. A later invalid day prevents fallback.
  - name: latest_fructosamine_date
    description: Latest fructosamine clinical day through the reference date, whether or not a numeric result
      exists. Null means no evidence.
  - name: latest_dmmax_date
    description: Latest DMMAX maximum-tolerated-diabetes-treatment clinical day through the reference date.
      Null means no evidence. Indicators decide whether it excludes a person in their window.
