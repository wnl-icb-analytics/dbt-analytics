models:
- name: int_nice_mi_profile
  description: >-
    Myocardial infarction evidence for registered, living, non-test people with a recorded
    diagnosis by the build date. One row per person on the build date. Includes left ventricular
    dysfunction, prescriptions, intolerance and over-the-counter aspirin. Persistent intolerance
    continues from its first date; temporary intolerance lasts 12 calendar months, inclusive.
    Null treatment dates mean no evidence.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: earliest_mi_date
    description: Earliest MI clinical date known by the reporting date; repeat MI does not remove older history.
  - name: latest_mi_in_financial_year_date
    description: Latest MI in the financial year to date; null when none.
  - name: has_lvsd
    description: HFLVSD_COD or REDEJCFRAC_COD diagnosis known by the reporting date.
  - name: has_ace_inhibitor_intolerance
    description: XACE_COD persistent or TXACE_COD in 12 months, used for ARB substitution, without removing denominator
      members.
  - name: has_aspirin_intolerance
    description: XSAL_COD persistent or TXSAL_COD in 12 months, used for clopidogrel substitution.
  - name: antiplatelet_chemical_count_in_period
    description: >-
      Number of distinct nine-character BNF chemical prefixes ordered in the inclusive six
      months to assessment. Strengths and products of one chemical count once. The IND125
      alternative result also counts recorded over-the-counter aspirin when no aspirin
      prescription is current.
