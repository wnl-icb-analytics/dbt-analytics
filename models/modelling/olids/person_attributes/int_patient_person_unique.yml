models:
  - name: int_patient_person_unique
    description: >-
      OLIDS patient-person links, one row per distinct mapping with matching patient
      and person records, a commissioning patient key and a recorded birth year.
      Includes inactive and deceased people. Orphaned links are excluded, but several
      patient records can remain linked to the same person.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: patient_id
        description: 'OLIDS patient record identifier'
        tests:
          - unique
          - not_null
      - name: person_id
        description: 'Person identifier (may have multiple patient_ids per person)'
        tests:
          - not_null