models:
  - name: int_patient_person_unique
    description: >-
      Distinct links between NCL OLIDS patient records and people, with
      patient_id, person_id, person_uuid and the commissioning patient key.
      One row per patient-person mapping with a matching patient and person
      record, a non-null commissioning patient key and a recorded birth year.
      Includes inactive and deceased people. Orphaned links are excluded.
      Multiple patient records for the same person remain separate mappings.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: patient_id
        description: 'OLIDS patient record identifier'
        tests:
          - unique
          - not_null
      - name: person_id
        description: 'Person identifier (may have multiple patient_ids per person)'
        tests:
          - not_null