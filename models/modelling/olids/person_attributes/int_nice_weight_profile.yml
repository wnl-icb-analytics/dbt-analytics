models:
- name: int_nice_weight_profile
  description: >-
    Measured BMI, ethnicity and weight advice, one row per registered, living, non-test person aged 18
    to 39 on the build date. Ethnicity is assessed at the reporting date; advice follows the BMI record.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
  columns:
  - name: person_id
    description: Person identifier.
  - name: reporting_date
    description: Date R used to cap evidence.
  - name: bmi_date
    description: Latest BMIVAL_COD measurement through R; null means none.
  - name: bmi_value
    description: Latest recorded numeric BMI in kg/m^2, including invalid values. IND319 excludes an invalid
      latest value without falling back to an older result.
  - name: is_recorded_white
    description: Ethnicity is White in the demographic interval containing R, start inclusive and end
      exclusive. False includes missing and unknown ethnicity.
  - name: latest_weight_advice_date
    description: Latest WTMGINT_COD advice within 90 days after BMI inclusive, capped at R; null means
      none.
