models:
  - name: int_nice_flu_season_vaccination
    description: >-
      Flu vaccinations in the most recently completed season. One row per person with
      evidence, including inactive and deceased people. Seasons run from 1 August to 31 March,
      inclusive; the selected season changes on 1 April. Includes administrations and vaccine
      orders. People without vaccination evidence in the season have no row.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Person vaccinated in the season window.
        data_tests:
          - unique
          - not_null
      - name: season_start_date
        description: 1 August starting the season.
      - name: season_end_date
        description: 31 March ending the season.
      - name: latest_vaccination_date
        description: Latest vaccination or vaccine order date in the window.
      - name: is_laiv
        description: Whether any vaccination in the window was the live attenuated nasal vaccine.
