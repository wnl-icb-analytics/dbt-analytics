models:
  - name: int_ltc_review_profile
    description: |
      Clinical evidence for NICE long-term condition reviews and physical health
      checks. One row per person in dim_person, including inactive and deceased
      people. The indicator models select their eligible registered populations
      and apply their own measurement windows.

      Holds condition register membership, relevant diagnosis dates, frailty and
      multimorbidity categories. Dated evidence covers smoking, alcohol, BMI,
      medication reviews, falls, condition reviews, care plans, health checks,
      laboratory tests and SMI care. Asthma completion requires a same-day review
      and action plan with an exacerbation count in the preceding month.

      Smoking support includes QOF v51 referral and pharmacotherapy evidence from
      observations and prescriptions. Pharmacotherapy drugs use active membership
      of SNOMED CT refset 12465801000001106. Multimorbidity category coverage is
      incomplete; the count column documents the conditions not yet modelled.

      Alcohol indicators also include first or new depression episodes at ages
      10 to 17, using diagnosis history outside the adult depression register.
      Their diagnosis and resolution ordering matches the existing register.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: REFERSSSA_COD, PHARM_COD
            source: PCD
    columns:
      - name: person_id
        description: Person identifier.
        data_tests:
          - unique
          - not_null
      - name: birth_date_approx
        description: Approximate birth date from dim_person_age, for age-at-date rules.
      - name: ltc_count
        description: Number of distinct project LTC registers the person is on.
      - name: multimorbidity_cluster_count
        description: Number of NICE IND205 condition clusters the person has a condition in (cancer, circulatory, diabetes, digestive, learning disability, mental health including alcohol problems, musculoskeletal, neurological, renal, respiratory), from the project registers. Lithium therapy without an SMI diagnosis does not count as a mental health condition. Chronic pain, constipation, diverticular disease, inflammatory bowel disease, eating disorders, substance misuse, other inflammatory polyarthropathies, systemic connective tissue disorders and bronchiectasis are not modelled, so the count is conservative.
      - name: has_chd
        description: On the CHD register.
      - name: has_pad
        description: On the PAD register.
      - name: has_stroke_tia
        description: On the stroke/TIA register.
      - name: has_hypertension
        description: On the hypertension register.
      - name: has_diabetes
        description: On the diabetes register.
      - name: has_ndh
        description: On the non-diabetic hyperglycaemia register.
      - name: has_copd
        description: On the COPD register.
      - name: has_ckd
        description: On the CKD register.
      - name: has_asthma
        description: On the asthma or CYP asthma register.
      - name: has_atrial_fibrillation
        description: On the atrial fibrillation register.
      - name: has_heart_failure
        description: On the heart failure register.
      - name: has_dementia
        description: On the dementia register.
      - name: has_depression
        description: On the depression register.
      - name: has_anxiety
        description: On the anxiety register.
      - name: has_smi
        description: On the SMI register.
      - name: has_learning_disability
        description: On the learning disability register, including under 14s.
      - name: has_dyslipidaemia
        description: Any dyslipidaemia diagnosis code from the local ECL cluster.
      - name: has_obstructive_sleep_apnoea
        description: Any obstructive sleep apnoea diagnosis code.
      - name: earliest_smoking_ltc_diagnosis_date
        description: Earliest diagnosis date across the CHD, PAD, stroke/TIA, hypertension, diabetes, COPD, CKD and asthma registers; null if none.
      - name: earliest_smoking_smi_ltc_diagnosis_date
        description: Earliest diagnosis date across the IND156 registers plus severe mental illness; null if none.
      - name: earliest_hypertension_date
        description: Earliest hypertension diagnosis date; null if none.
      - name: earliest_depression_anxiety_date
        description: Earliest qualifying depression or anxiety diagnosis date; null if none. Uses current register membership for adults and anxiety, plus unresolved first or new depression episodes at ages 10 to 17 for NICE IND198/199. An older diagnosis remains the anchor after a later new episode.
      - name: latest_frailty_severity
        description: Latest coded frailty severity; null if none.
      - name: latest_smoking_status
        description: Latest recorded smoking status; null if none.
      - name: latest_smoking_status_date
        description: Date of the latest smoking status record.
      - name: latest_never_smoked_date
        description: Date of the latest never-smoked record; null if none.
      - name: latest_smoking_intervention_date
        description: Date of the latest stop-smoking referral or pharmacotherapy record or prescription, using QOF v51 REFERSSSA_COD, PHARM_COD and PHARMDRUG_COD; null if none. PHARMDRUG_COD uses active membership of SNOMED CT refset 12465801000001106. Generic advice and declined-care codes alone do not qualify.
      - name: latest_bmi_date
        description: Date of the latest BMI with a value; null if none.
      - name: latest_structured_medication_review_date
        description: Date of the latest structured medication review; null if none.
      - name: latest_falls_discussion_date
        description: Date of the latest record of asking about falls; null if none.
      - name: latest_alcohol_screen_date
        description: Date of the latest FAST, AUDIT-C or AUDIT screen; null if none.
      - name: latest_alcohol_screen_tool
        description: Tool used for the latest screen.
      - name: latest_alcohol_screen_score
        description: Score of the latest screen; null when unscored.
      - name: is_latest_alcohol_screen_positive
        description: Whether the latest screen met the hazardous-drinking threshold.
      - name: latest_positive_alcohol_screen_date
        description: Date of the latest FAST score of at least 3 or AUDIT-C score of at least 5; null if none. Full AUDIT does not qualify for the NICE brief intervention indicators.
      - name: latest_intervention_after_positive_screen_date
        description: Date of the latest alcohol brief intervention within 3 months after the latest positive screen; null if none.
      - name: has_alcohol_disorder
        description: Any alcohol-related disease or disorder code recorded.
      - name: has_rheumatoid_arthritis
        description: On the rheumatoid arthritis register.
      - name: has_hypothyroidism
        description: On the hypothyroidism register.
      - name: has_cancer
        description: On the cancer register, which excludes non-melanoma skin cancer.
      - name: latest_cancer_diagnosis_date
        description: Latest first-or-new-episode cancer diagnosis date from the register; null if none.
      - name: latest_asthma_review_date
        description: Date of the latest asthma review record; null if none.
      - name: latest_complete_asthma_review_date
        description: Date of the latest asthma review with a same-day written personalised plan and an exacerbation count recorded within the preceding month, as QOF v51 AST015 defines; null if none.
      - name: latest_copd_review_date
        description: Date of the latest COPD review record; null if none.
      - name: latest_copd_exacerbation_count_date
        description: Date of the latest record of the number of COPD exacerbations (COPDEXACB_COD); null if none.
      - name: latest_mrc_dyspnoea_date
        description: Date of the latest MRC dyspnoea scale record; null if none.
      - name: latest_heart_failure_review_date
        description: Date of the latest heart failure review record; null if none.
      - name: latest_nyha_date
        description: Date of the latest NYHA classification record; null if none.
      - name: latest_medication_review_date
        description: Date of the latest medication review, heart failure medication review or structured medication review; null if none.
      - name: latest_rheumatoid_arthritis_review_date
        description: Date of the latest rheumatoid arthritis annual review record; null if none.
      - name: latest_thyroid_function_test_date
        description: Date of the latest thyroid function test; null if none.
      - name: latest_ld_health_check_date
        description: Date of the latest learning disability health check; null if none.
      - name: latest_ld_health_action_plan_date
        description: Date of the latest learning disability health action plan; null if none.
      - name: latest_dementia_care_plan_date
        description: Date of the latest dementia care plan or care plan review; null if none.
      - name: first_cancer_care_review_after_diagnosis_date
        description: Date of the first cancer care review on or after the latest first-or-new-episode cancer diagnosis; null if none.
      - name: latest_new_depression_diagnosis_date
        description: Date of the latest first or new episode depression diagnosis; null if none.
      - name: first_depression_review_10_to_35_days_date
        description: Date of the first depression review 10 to 35 days after the latest new depression diagnosis; null if none.
      - name: has_ethnicity_recorded
        description: Whether an ethnicity category other than Unknown is recorded.
      - name: earliest_smi_diagnosis_date
        description: Earliest severe mental illness register diagnosis date; null if none.
      - name: earliest_dementia_diagnosis_date
        description: Earliest dementia register diagnosis date; null if none.
      - name: earliest_diabetes_diagnosis_date
        description: Earliest diabetes register diagnosis date; null if none.
      - name: earliest_cvd_diagnosis_date
        description: Earliest CHD, stroke/TIA or PAD register diagnosis date; null if none.
      - name: has_active_smi_diagnosis
        description: On the SMI register with a schizophrenia, bipolar or psychosis diagnosis not in remission; false for lithium-only or remitted people.
      - name: is_on_lithium
        description: Lithium prescribed in the preceding 6 months without a stopped code, per the SMI register.
      - name: latest_smi_diagnosis_date
        description: Latest SMI diagnosis code date from the register; after a remission this is the relapse date.
      - name: latest_smi_remission_date
        description: Latest SMI remission code date from the register; null if never in remission.
      - name: latest_blood_pressure_date
        description: Date of the latest blood pressure reading; null if none.
      - name: latest_total_cholesterol_date
        description: Date of the latest total cholesterol with a value; null if none.
      - name: latest_cholesterol_hdl_ratio_date
        description: Date of the latest total cholesterol to HDL ratio with a value; null if none.
      - name: latest_lipid_date
        description: Date of the latest total cholesterol or cholesterol to HDL ratio; null if none.
      - name: latest_glucose_or_hba1c_date
        description: Date of the latest HbA1c or blood glucose with a value; null if none.
      - name: latest_alcohol_record_date
        description: Date of the latest alcohol consumption record of any kind (units, usage status or screening tool); null if none.
      - name: latest_smi_care_plan_date
        description: Date of the latest mental health care plan record; null if none.
      - name: latest_lithium_level_date
        description: Date of the latest serum lithium record; null if none.
      - name: latest_lithium_level
        description: Latest serum lithium in mmol/L; null when the latest record has no value.
      - name: is_latest_lithium_level_in_range
        description: Whether the latest serum lithium is 0.4 to 1.0 mmol/L; false when no value or no record.
