models:
- name: int_nice_reference_population_by_month
  description: NICE active, living, non-test population. One row per person and completed month-end. Recalculated
    at monthly refresh for the last 60 completed month-ends using today's rules and code lists. Registration
    and practice come from the existing monthly spine. Registration start is inclusive, end and death
    dates exclusive. Overlapping registrations retain the spine's current-registration priority. Birth
    and death dates are approximate; missing birth dates prevent historical active rows. Current gender
    and test flags apply retrospectively. Diagnosis state uses both clinical and recorded dates. Other
    evidence uses its clinical or order date through the month-end. Later corrections and current code-list
    changes can alter earlier results.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: person_id
    description: Person in the active non-test population.
  - name: reporting_date
    description: Completed month-end at which eligibility and evidence are assessed. DATE; no current-day
      row.
  - name: age
    description: Completed years at the month-end, calculated from the approximate birth month.
  - name: birth_date_approx
    description: Approximate birth date used by the monthly spine.
  - name: gender
    description: Currently available gender applied retrospectively by the monthly spine.
  - name: practice_code
    description: ODS practice code attributed by the monthly spine at the month-end.
  - name: practice_name
    description: Practice name attributed by the monthly spine at the month-end.
  - name: registration_start_date
    description: Start of the registration attributed at the month-end, from the same historical demographic interval as the monthly spine. Null when unavailable.
