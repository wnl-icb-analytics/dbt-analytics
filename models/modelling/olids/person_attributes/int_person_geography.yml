models:
  - name: int_person_geography
    description: >-
      Residential geography for people in int_patient_person_unique with a
      non-null hashed postcode. One row per person, using an active address
      where available, otherwise the most recent ended address. Includes
      inactive and deceased people and residents outside London. Geography
      includes 2011 and 2021 Census areas, IMD 2019, IMD 2025 and Townsend
      deprivation scores. Ward and WNL neighbourhood use the postcode ward
      where recognised, with a 2021 LSOA fallback. Local authority and London
      borough use the LSOA, so they can differ from the postcode ward's
      borough. Unmatched geography remains null.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Unique person identifier'
        tests:
          - not_null
          - unique
      - name: postcode_hash
        description: Hashed residential postcode
      - name: address_start_date
        description: 'Start date of the address record'
      - name: address_end_date
        description: 'End date of the address record (NULL if current)'
      - name: is_current_address
        description: 'Flag indicating if this is the current active address'
      - name: primary_care_organisation
        description: 'Primary care organisation (ICB) code where patient resides (from
          postcode lookup)'
      - name: icb_resident
        description: 'ICB name where patient resides (from geography mappings)'
      - name: local_authority_code
        description: 'Local Authority District 2025 code (LAD25CD) from LSOA reference,
          fallback to organisation code'
      - name: local_authority_name
        description: 'Local Authority District 2025 name (LAD25NM) from LSOA reference,
          fallback to organisation name'
      - name: ward_code
        description: '2025 ward code (WD25CD) of the postcode; the LSOA best-fit ward if the postcode ward is not in the ward lookup (every WNL ward is; a few small wards elsewhere are not)'
      - name: ward_name
        description: '2025 ward name (WD25NM), matching ward_code'
      - name: borough_resident
        description: 'Borough name where patient resides (only populated for London
          boroughs)'
      - name: lsoa_code_11
        description: '2011 Census Lower Layer Super Output Area code'
      - name: msoa_code_11
        description: '2011 Census Middle Layer Super Output Area code'
      - name: lsoa_code_21
        description: '2021 Census Lower Layer Super Output Area code'
      - name: lsoa_name_21
        description: '2021 Census Lower Layer Super Output Area name'
      - name: msoa_code_21
        description: '2021 Census Middle Layer Super Output Area code'
      - name: neighbourhood_resident
        description: 'WNL neighbourhood of residence, from the ward of the postcode (LSOA best-fit ward if the postcode ward is not in the ward lookup); null outside WNL'
      - name: imd_decile_19
        description: 'IMD 2019 decile from dedicated IMD model'
      - name: imd_quintile_19
        description: 'IMD 2019 quintile from dedicated IMD model'
      - name: imd_quintile_numeric_19
        description: 'IMD 2019 numeric quintile (1-5) from dedicated IMD model'
      - name: is_most_deprived_20pct
        description: 'Flag for most deprived 20% areas (deciles 1-2) from dedicated
          IMD model'
      - name: imd_decile_25
        description: 'IMD 2025 decile from dedicated IMD model'
      - name: imd_quintile_25
        description: 'IMD 2025 quintile from dedicated IMD model'
      - name: imd_quintile_numeric_25
        description: 'IMD 2025 numeric quintile (1-5) from dedicated IMD model'
      - name: is_most_deprived_20pct_25
        description: 'Flag for most deprived 20% areas (deciles 1-2) from dedicated
          IMD model'
      - name: townsend_score
        description: >
          Townsend Deprivation Score for the person's residential 2011 LSOA
          (lsoa_code_11), from the townsend_lsoa_2011 seed (2011 Census
          variables, UK-wide). Higher values indicate greater deprivation;
          observed range -7.03 to +13.31. NULL when the person has no 2011
          LSOA or it is not in the seed. Used for the QAdmissions `town`
          feature.
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.5
      - name: is_london_resident
        description: 'Flag indicating if person resides in London (based on LSOA reference
          data)'
      - name: london_classification
        description: 'London classification from LSOA reference (NCL, Other London,
          Outside London)'
