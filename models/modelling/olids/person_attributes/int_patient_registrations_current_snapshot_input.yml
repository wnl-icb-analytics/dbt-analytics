models:
  - name: int_patient_registrations_current_snapshot_input
    description: >
      Open Regular registrations from int_patient_registrations, one row per
      registration episode, for people who are alive. Thin projection that feeds
      int_patient_registrations_current_snapshot.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: registration_record_id
        description: Episode of care identifier; one row per open registration (snapshot unique_key).
        data_tests:
          - unique
          - not_null
      - name: person_id
        description: Person identifier.
      - name: practice_ods_code
        description: ODS code of the practice holding the registration.
      - name: registration_start_date
        description: Registration start date as currently recorded.
