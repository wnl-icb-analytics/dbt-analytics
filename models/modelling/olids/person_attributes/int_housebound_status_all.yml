models:
  - name: int_housebound_status_all
    description: 'Housebound status observations from ECL source.

      One row per housebound status observation using HOUSEBOUND and NO_LONGER_HOUSEBOUND clusters.'
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: HOUSEBOUND, NO_LONGER_HOUSEBOUND
    columns:
      - name: date_recorded
        description: >
          Date the observation was entered in the source system. Use with
          clinical_effective_date for point-in-time views, as an observation
          can be back-dated.
