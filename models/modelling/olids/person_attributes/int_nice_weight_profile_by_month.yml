models:
- name: int_nice_weight_profile_by_month
  description: >-
    Measured BMI, ethnicity and weight advice, one row per registered, living, non-test person aged 18
    or over and completed month-end. Recalculated over the last 60 completed month-ends with current rules
    and code lists. Registration and practice follow the monthly spine. Birth and death dates are
    approximate; current gender and test flags apply retrospectively. Registers use clinical and
    recorded dates; other evidence uses corrected clinical or order dates. Later corrections can change
    earlier results. Latest BMI means the latest BMIVAL_COD record with a usable numeric value, as
    defined by int_bmi_qof_all. Value-free or unparseable records are not results and do not block an
    earlier numeric result. A latest numeric value outside 5 to 400 kg/m^2 inclusive makes the person
    unassessable for IND319, IND237 and IND238; no older valid result is used. Ethnicity is assessed at
    the reporting date; advice follows the BMI record.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: person_id
    description: Person identifier.
  - name: reporting_date
    description: Date R used to cap evidence.
  - name: bmi_date
    description: Date of the latest BMIVAL_COD record with a usable numeric value through R; null means none.
  - name: bmi_value
    description: Latest usable numeric BMIVAL_COD value in kg/m^2, including values outside the valid
      range. Value-free or unparseable records do not block an earlier numeric result. A latest numeric
      value outside 5 to 400 inclusive makes the person unassessable for IND319, IND237 and IND238;
      no older valid result is used.
  - name: is_recorded_white
    description: Ethnicity is White in the demographic interval containing R, start inclusive and end
      exclusive. False includes missing and unknown ethnicity.
  - name: latest_weight_advice_date
    description: Latest WTMGINT_COD advice within 90 days after BMI inclusive, capped at R; null means
      none.
