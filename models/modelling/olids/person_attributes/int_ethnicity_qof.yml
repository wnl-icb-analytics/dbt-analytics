models:
  - name: int_ethnicity_qof
    description: Intermediate table containing ethnicity information from observations only, with BAME status flags for obesity register.

    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: ETH2016MWBC_COD,ETH2016MWBA_COD,ETH2016MWA_COD,ETH2016AI_COD,ETH2016AP_COD,ETH2016AB_COD,ETH2016AC_COD,ETH2016AO_COD,ETH2016BA_COD,ETH2016BC_COD,ETH2016BO_COD,ETH2016OA_COD
            source: PCD
    columns:
      - name: person_id
        tests:
          - unique
          - not_null