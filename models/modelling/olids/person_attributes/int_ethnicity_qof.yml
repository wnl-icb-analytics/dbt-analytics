models:
  - name: int_ethnicity_qof
    description: Latest QOF ethnicity observation per person, with BAME status flags for the obesity register. Built from int_ethnicity_qof_all.

    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null