models:
- name: int_nice_cardiac_therapy_by_month
  description: Cardiac therapy evidence, one row per registered, living, non-test person and reporting date with
    an HF register membership or MI_COD diagnosis known by that date. Last 60 completed month-ends, recalculated
    using current rules and code lists. Each therapy class is selected independently by its latest order date from
    1 January 1990 through assessment. No current-only flags are used. Null means no order; stale dates remain available
    for indicators to assess. MRA includes spironolactone and eplerenone only; finerenone is excluded. ARB includes
    ARNI. HF-licensed beta blocker uses OPENCODELISTS/NHS_DRUG_REFSETS/LBB_COD.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reporting_date
  columns:
  - name: latest_ace_inhibitor_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_arb_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_beta_blocker_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_hf_licensed_beta_blocker_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_mra_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_sglt2_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_aspirin_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_p2y12_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_clopidogrel_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_antiplatelet_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_statin_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_anticoagulant_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: latest_ras_order_date
    description: Latest independent therapy order through assessment; null when none.
  - name: antiplatelet_chemical_count_in_period
    description: Number of distinct nine-character BNF chemical prefixes ordered in the inclusive six months to
      assessment. Strengths and products of one chemical count once. The IND125 lenient result also adds OTC aspirin
      when no aspirin order is current.
