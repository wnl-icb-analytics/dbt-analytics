version: 2
models:
  - name: int_resource_index_olids_profile
    description: |
      Current OLIDS clinical profile for the NCL resource index view,
      aggregated to sk_patient_id.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: sk_patient_id
        description: Pseudonymised NHS number from dim_person_pseudo.
        data_tests:
          - not_null
          - unique
      - name: cambridge_comorbidity_score
        description: Cambridge Multimorbidity Score; null when no OLIDS score.
      - name: ltc_count
        description: Distinct LTC register conditions.
      - name: qof_ltc_count
        description: Distinct QOF LTC register conditions.
      - name: frailty_severity
        description: Worst frailty severity across sibling person_ids.
