models:
  - name: int_opt_out_type_1_all
    description: Type 1 opt-out observations for dissent from secondary use of primary care data. One row per opt-out event per person.

    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: OPT_OUT_TYPE_1_DISSENT_WITHDRAWAL, OPT_OUT_TYPE_1_DISSENT
    columns:
      - name: person_id
        tests:
          - not_null
