models:
  - name: int_copd_diagnoses_all
    description: 'COPD disorder, administrative and resolved observations.

      One row per observation using the QOF v51 COPDDIAG_COD, COPDPROC_COD and COPDRES_COD clusters. All administrative-code history is retained; the QOF register applies its two-year window downstream.'
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: id
        description: 'Unique identifier for the clinical observation'
        tests:
          - unique
          - not_null

      - name: person_id
        description: 'Patient identifier'

      - name: clinical_effective_date
        description: 'Date when COPD observation was clinically effective'

      - name: concept_code
        description: 'Clinical code for COPD disorder, administrative evidence or resolution'

      - name: concept_display
        description: 'Human-readable description of the clinical code'

      - name: source_cluster_id
        description: 'QOF cluster identifier (COPDDIAG_COD, COPDPROC_COD or COPDRES_COD)'

      - name: is_disorder_code
        description: 'Flag indicating a COPD disorder code (COPDDIAG_COD cluster)'

      - name: is_admin_code
        description: 'Flag indicating a COPD administrative code (COPDPROC_COD cluster)'

      - name: is_resolved_code
        description: 'Flag indicating COPD resolution code (COPDRES_COD cluster)'

      - name: copd_observation_type
        description: 'Categorised COPD observation type (COPD Disorder, COPD Administrative or COPD Resolved)'

    data_tests:
      - dbt_utils.at_least_one:
          column_name: id
      - cluster_ids_exist:
          arguments:
            cluster_ids: COPDRES_COD, COPDDIAG_COD, COPDPROC_COD
