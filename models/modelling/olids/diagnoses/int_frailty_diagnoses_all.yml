models:
  - name: int_frailty_diagnoses_all
    description: >
      Coded frailty severity observations, one row per observation for any person.
      Uses the PCD clusters MILDFRAIL_COD, MODFRAIL_COD and SEVFRAIL_COD, which
      cover the graded frailty findings and Clinical Frailty Scale levels 4 to 8.
      Severity is the cluster that matched the code. Generic frailty codes without
      a grade are not included. Calculated frailty scores such as eFI and eFI2 are
      not part of this model.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.at_least_one:
          column_name: id
      - cluster_ids_exist:
          arguments:
            cluster_ids: MILDFRAIL_COD, MODFRAIL_COD, SEVFRAIL_COD
            source: PCD
    columns:
      - name: id
        description: Observation identifier.
        tests:
          - unique
          - not_null
      - name: person_id
        description: Person identifier.
      - name: clinical_effective_date
        description: Date the frailty observation was recorded.
      - name: concept_code
        description: SNOMED code of the frailty observation.
      - name: concept_display
        description: Description of the frailty observation.
      - name: source_cluster_id
        description: PCD cluster that matched the code; determines frailty_severity.
      - name: is_diagnosis_code
        description: Always true; every row is a coded frailty finding.
      - name: frailty_severity
        description: Mild, Moderate or Severe, from the matching cluster.
        data_tests:
          - not_null
