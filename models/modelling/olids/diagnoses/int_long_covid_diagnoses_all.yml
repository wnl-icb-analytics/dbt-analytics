models:
  - name: int_long_covid_diagnoses_all
    description: >-
      Long COVID diagnosis and resolution observations in OLIDS GP
      records, one row per observation. Post acute infection syndromes. LONGCOVID_COD covers
      findings SNOMED CT defines as occurring after COVID-19: ongoing symptomatic COVID-19 (4 to 12 weeks), post-COVID-19 syndrome and chronic post-COVID-19 syndrome (over 12 weeks), and post-acute COVID-19 (NICE NG188). LONGCOVIDRES_COD holds the resolution code. Clusters come from the SNOMED Cluster Manager (ECL_CACHE)
      and include retired SNOMED CT predecessors. Includes inactive and deceased people
      without age or reporting-period restrictions.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: id
      - cluster_ids_exist:
          arguments:
            cluster_ids: LONGCOVID_COD, LONGCOVIDRES_COD
            source: ECL_CACHE
    columns:
      - name: id
        description: Unique identifier for the clinical observation
        data_tests:
          - unique
          - not_null
      - name: person_id
        description: Unique identifier for the person
      - name: clinical_effective_date
        description: Date the observation was clinically effective; 1900-01-01 marks a missing date
      - name: date_recorded
        description: Date the observation was entered in the record; null when the source gives none.
      - name: concept_code
        description: SNOMED CT concept code
      - name: concept_display
        description: SNOMED CT concept description
      - name: source_cluster_id
        description: Source cluster (LONGCOVID_COD or LONGCOVIDRES_COD)
      - name: is_diagnosis_code
        description: True for a long COVID diagnosis (LONGCOVID_COD)
      - name: is_resolved_code
        description: True for a Post-COVID-19 syndrome resolved code (LONGCOVIDRES_COD)
