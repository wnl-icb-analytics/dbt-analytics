models:
  - name: int_dyslipidaemia_diagnoses_all
    description: >
      Dyslipidaemia and hyperlipidaemia diagnosis records from the local ECL cluster. One row per observation from the ECL_CACHE cluster
      DYSLIPIDAEMIA_COD, for all people including inactive and deceased.
      Observations dated after the build date are excluded. The cluster is locally maintained; no PCD refset covers dyslipidaemia.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: DYSLIPIDAEMIA_COD
            source: ECL_CACHE
    columns:
      - name: id
        description: Source observation identifier.
        data_tests:
          - unique
          - not_null
      - name: person_id
        description: Person identifier.
      - name: clinical_effective_date
        description: Date of the record.
      - name: concept_code
        description: SNOMED code of the record.
      - name: concept_display
        description: Description of the record.
      - name: source_cluster_id
        description: Cluster that matched the code.
