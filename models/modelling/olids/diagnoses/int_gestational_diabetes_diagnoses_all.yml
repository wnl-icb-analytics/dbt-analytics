models:
  - name: int_gestational_diabetes_diagnoses_all
    description: >-
      Gestational diabetes diagnosis history from the PCD GESTDIAB_COD
      cluster. The OLIDS population comes from NCL GP records. One row per
      observation for all people, including inactive and deceased people. No
      age, sex, current-pregnancy or reporting-period restriction is applied.
      Resolution codes are not included, so a recorded diagnosis does not by
      itself indicate a current pregnancy or current diabetes.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.at_least_one:
          column_name: id
      - cluster_ids_exist:
          arguments:
            cluster_ids: GESTDIAB_COD
            source: PCD
    columns:
      - name: id
        description: 'Unique identifier for the clinical observation'
        tests:
          - unique
          - not_null
      - name: person_id
        description: 'Unique identifier for the person'
      - name: clinical_effective_date
        description: 'Date when the gestational diabetes observation was recorded'
      - name: date_recorded
        description: 'Date the observation was entered in the record; null when the source gives none.'
      - name: concept_code
        description: 'Clinical code for the gestational diabetes diagnosis'
      - name: concept_display
        description: 'Human-readable description of the gestational diabetes diagnosis'
      - name: source_cluster_id
        description: 'Source cluster identifier (GESTDIAB_COD for gestational diabetes diagnoses)'
      - name: is_diagnosis_code
        description: 'Boolean flag indicating if the code represents a gestational diabetes diagnosis (always TRUE for GESTDIAB_COD cluster)'