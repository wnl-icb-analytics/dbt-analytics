models:
  - name: int_bmi_all
    description: >-
      Recorded and calculated BMI in NCL OLIDS, one row per BMIVAL_COD observation or
      qualifying weight observation used for calculation, up to the build date. Includes
      inactive and deceased people aged at least 18, using age at build for living people and
      age at death otherwise. Calculated BMI uses adult height and weight and fills dates
      without recorded BMI. Invalid values remain flagged. NICE NG246 categories use lower
      thresholds for qualifying ethnicities.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: BMIVAL_COD, HEIGHT, WEIGHT
    columns:
      - name: id
        description: Unique identifier for each BMI observation (recorded or calculated)
        tests:
          - unique
          - not_null
      - name: person_id
        description: Person identifier
        tests:
          - not_null
      - name: age
        description: >-
          Age in years at the build date for living people or at death for deceased people.
          Only people aged 18 or over on that basis are included.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 18
                max_value: 150
                inclusive: true
      - name: bmi_value
        description: BMI value in kg/m²
        tests:
          - not_null
          - dbt_utils.accepted_range:
              config:
                where: "is_valid_bmi = TRUE"
              arguments:
                min_value: 10
                max_value: 150
                inclusive: true
      - name: clinical_effective_date
        description: Date of BMI observation
        tests:
          - not_null
      - name: date_recorded
        description: When the observation was entered into the clinical system; for calculated BMI, when the weight was entered
      - name: height_date_recorded
        description: When the height used to calculate BMI was entered into the clinical system; null for recorded BMI or when the contributing height has no recorded date
      - name: bmi_source
        description: >-
          Recorded for BMIVAL_COD observations. Calculated uses the most recent prior height
          with a qualifying weight, both recorded at age 18 or over, only on dates without
          recorded BMI.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['recorded', 'calculated']
      - name: requires_lower_bmi_thresholds
        description: >-
          True for South Asian, Chinese, other Asian, Middle Eastern, Black African and
          African-Caribbean ethnicities, under NICE NG246. Based on the recorded evidence
          selected by int_ethnicity_cardiometabolic_risk.
      - name: cardiometabolic_risk_ethnicity_group
        description: 'Ethnicity group classification for cardiometabolic risk assessment'
      - name: is_valid_bmi
        description: 'Flag indicating BMI value is within valid range (10-150)'
        tests:
          - not_null
      - name: bmi_category
        description: >-
          NICE NG246 BMI category. Overweight and obesity start at 25 and 30 kg/m2, or 23 and
          27.5 for qualifying cardiometabolic-risk ethnicities.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Invalid', 'Underweight', 'Normal', 'Overweight', 'Obese Class I', 'Obese Class II', 'Obese Class III']
      - name: bmi_risk_sort_key
        description: 'BMI risk sort key using ethnicity-adjusted thresholds (higher = higher risk)'
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 6
                inclusive: true
