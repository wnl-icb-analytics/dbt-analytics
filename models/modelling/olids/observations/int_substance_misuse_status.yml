models:
  - name: int_substance_misuse_status
    description: >
      Person-level substance (illicit drug) misuse status from the NHS England
      Primary Care Domain refset ILLSUB_COD, applying latest-record-wins against
      the QUALIFYING/RESOLVING classification held in the
      substance_misuse_illsub_status seed.

      One row per person with any ILLSUB_COD record. has_substance_misuse is TRUE
      when the person's most recent record is QUALIFYING, so a later negation,
      abstinence or remission code takes the person out. Same-date ties resolve
      to QUALIFYING. History counts include each person, concept, clinical
      calendar date and recorded value once, including value-free events.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique identifier for the person.
        data_tests:
          - not_null
          - unique

      - name: has_substance_misuse
        description: >
          TRUE when the person's most recent ILLSUB_COD record is QUALIFYING,
          i.e. current substance misuse or dependence.
        data_tests:
          - not_null

      - name: latest_record_date
        description: Clinical effective date of the most recent ILLSUB_COD record.
        data_tests:
          - not_null

      - name: latest_concept_code
        description: SNOMED concept code of the most recent ILLSUB_COD record.
        data_tests:
          - not_null

      - name: latest_concept_display
        description: Display term of the most recent ILLSUB_COD record.

      - name: latest_status
        description: >
          QUALIFYING or RESOLVING status of the most recent record. Drives
          has_substance_misuse.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['QUALIFYING', 'RESOLVING']

      - name: latest_category
        description: >
          Finer-grained classification of the most recent record. NULL when the
          concept is in the cluster but absent from the seed (defaulted to
          QUALIFYING); the substance_misuse_illsub_seed_coverage test fails if
          that happens.

      - name: earliest_qualifying_date
        description: Earliest date of any QUALIFYING record. NULL if the person has none.

      - name: latest_qualifying_date
        description: Latest date of any QUALIFYING record. NULL if the person has none.

      - name: qualifying_record_count
        description: Distinct QUALIFYING readings by concept, clinical calendar date and recorded value.
        data_tests:
          - not_null

      - name: resolving_record_count
        description: Distinct RESOLVING readings by concept, clinical calendar date and recorded value.
        data_tests:
          - not_null

      - name: total_record_count
        description: Distinct ILLSUB_COD readings by concept, clinical calendar date and recorded value.
        data_tests:
          - not_null

unit_tests:
- name: substance_history_counts_distinct_readings
  model: int_substance_misuse_status
  overrides:
    macros:
      get_empty_subquery_sql: SELECT NULL::NUMBER AS person_id, NULL::NUMBER AS qualifying_record_count, NULL::NUMBER AS resolving_record_count, NULL::NUMBER AS total_record_count, NULL::BOOLEAN AS has_substance_misuse WHERE FALSE
  given:
  - input: ref('int_substance_misuse_all')
    format: sql
    rows: |-
      SELECT column1::VARCHAR AS id, column2::NUMBER AS person_id,
          column3::TIMESTAMP_NTZ AS clinical_effective_date, column4::VARCHAR AS concept_code,
          column5::FLOAT AS result_value, 'SYN_DISPLAY'::VARCHAR AS concept_display, 'QUALIFYING'::VARCHAR AS status, 'SYN_CATEGORY'::VARCHAR AS category
      FROM VALUES ('SYN_A', -145401, '2024-01-01 09:00:00', 'SYN_C', NULL),
      ('SYN_B', -145401, '2024-01-01 18:00:00', 'SYN_C', NULL),
      ('SYN_C', -145401, '2024-01-01', 'SYN_OTHER', NULL),
      ('SYN_D', -145401, '2024-01-02', 'SYN_C', NULL),
      ('SYN_E', -145401, '2024-01-01', 'SYN_C', 0),
      ('SYN_F', -145401, '2024-01-01', 'SYN_C', 1),
      ('SYN_G', -145402, '2024-01-01', 'SYN_C', NULL)
      UNION ALL
      SELECT column1::VARCHAR, -145403::NUMBER, '2024-03-01'::TIMESTAMP_NTZ,
          'SYN_RESOLVING'::VARCHAR, NULL::FLOAT, 'SYN_DISPLAY'::VARCHAR,
          'RESOLVING'::VARCHAR, 'SYN_CATEGORY'::VARCHAR
      FROM VALUES ('SYN_RES_A'), ('SYN_RES_B')
  expect:
    rows:
    - person_id: -145401
      qualifying_record_count: 5
      resolving_record_count: 0
      total_record_count: 5
      has_substance_misuse: true
    - person_id: -145402
      qualifying_record_count: 1
      resolving_record_count: 0
      total_record_count: 1
      has_substance_misuse: true
    - person_id: -145403
      qualifying_record_count: 0
      resolving_record_count: 1
      total_record_count: 1
      has_substance_misuse: false
