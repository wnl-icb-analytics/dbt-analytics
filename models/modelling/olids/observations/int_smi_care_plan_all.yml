models:
  - name: int_smi_care_plan_all
    description: 'Mental Health /SMI care plan for SMI registry replacement/QOF indicator. One row per person, concept and clinical date using MHP_COD cluster with currency flag in last 12 months'
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - concept_code
              - clinical_effective_date
      - cluster_ids_exist:
          arguments:
            cluster_ids: MHP_COD
    columns:
      - name: observation_id
        description: Source observation selected within the model's event grain.
      - name: date_recorded
        description: EMIS save time of the selected observation; null when unavailable.
