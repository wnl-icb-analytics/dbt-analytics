models:
  - name: int_urine_acr_latest
    description: 'Most recent valid albumin-to-creatinine ratio measurement per person
      for kidney function assessment and CKD staging.

      One row per person with their latest ACR including clinical ACR categorisation
      and microalbuminuria/macroalbuminuria flags.
      Validity is filtered before selecting the latest result. Observation ID descending
      breaks ties on the clinical effective date.'
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Patient identifier - primary key (one row per person)'
        data_tests:
          - unique
          - not_null
      - name: acr_category
        description: NICE NG203 albuminuria category in mg/mmol, A1 below 3, A2 3-30 inclusive, A3 above 30.
      - name: is_microalbuminuria
        description: ACR from 3 to 30 mg/mmol inclusive (A2).
      - name: is_macroalbuminuria
        description: ACR above 30 mg/mmol (A3).
