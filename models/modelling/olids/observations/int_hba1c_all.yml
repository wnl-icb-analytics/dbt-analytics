models:
  - name: int_hba1c_all
    description: >
      HbA1c test history for all people, including inactive and deceased people.
      One row per observation id and source cluster, with an effective date no later
      than the build date. Includes IFCCHBAM_COD and DCCTHBA1C_COD tests without
      numeric results. Missing or non-numeric results have null standardised values
      and false validity. IFCC values use mmol/mol and DCCT values use percent. Values
      below 20 are read as percent, except unrounded values from 13 to below 20
      recorded as mmol/mol. These are invalid: below the National Diabetes Audit
      IFCC range and an extreme percent value.
      Consumers assessing control must check validity; test-presence measures may
      use every retained observation. Invalid results have category Invalid and null
      diabetes-range and QOF target flags. The original unit is retained for review.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_valid_hba1c OR (hba1c_category = 'Invalid' AND meets_qof_target IS NULL AND indicates_diabetes IS NULL)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "hba1c_original_value is not null or not is_valid_hba1c"
      - cluster_ids_exist:
          arguments:
            cluster_ids: DCCTHBA1C_COD, IFCCHBAM_COD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id
              - source_cluster_id
    columns:
      - name: id
        description: Identifier for each HbA1c observation (may not be unique if observation maps to multiple clusters)
        data_tests:
          - not_null
      - name: person_id
        description: Person identifier
        data_tests:
          - not_null
      - name: original_result_unit_code
        description: Recorded UCUM unit code before scale inference.
      - name: original_result_unit_display
        description: Recorded unit display before canonicalisation.
      - name: is_unit_conflict
        description: Inferred scale disagrees with the recorded unit or concept cluster. Review before use. Null for unknown scale.
      - name: measurement_type
        description: Type of HbA1c measurement (IFCC, DCCT, or UNKNOWN)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['IFCC', 'DCCT', 'UNKNOWN']
      - name: is_valid_hba1c
        description: >
          Whether the numeric result is within 20-200 mmol/mol for IFCC or 3-20 percent
          for DCCT. Recorded mmol/mol values from 13 to below 20 are invalid before
          rounding. False for missing or non-numeric results.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: hba1c_category
        description: >
          Invalid for any result outside the validity bands. Clinical band derived from the standardised IFCC value (mmol/mol).
          Bands align with NICE NG28 targets and the QOF DM020 threshold (<=58 mmol/mol, inclusive).
          Values: Normal (<42), Prediabetes (42–47.9, NICE non-diabetic hyperglycaemia),
          Diabetes - At NICE Target (48–53.9), Diabetes - Elevated (within QOF) (54–58.0, above NICE target but still within QOF),
          Diabetes - Above Target (>58–74.9, misses QOF), Diabetes - High Risk (75–85.9),
          Diabetes - Very High Risk (>=86), Invalid (no standardised IFCC value could be derived; other out-of-range values still receive a band, use is_valid_hba1c to exclude them).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Normal'
                  - 'Prediabetes'
                  - 'Diabetes - At NICE Target'
                  - 'Diabetes - Elevated (within QOF)'
                  - 'Diabetes - Above Target'
                  - 'Diabetes - High Risk'
                  - 'Diabetes - Very High Risk'
                  - 'Invalid'
      - name: indicates_diabetes
        description: HbA1c >=48 mmol/mol (NICE NG28 diagnostic threshold). Null when invalid.
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: meets_qof_target
        description: HbA1c <=58 mmol/mol, the QOF DM020 threshold (inclusive); not QOF eligibility or achievement. Null when invalid.
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

unit_tests:
- name: hba1c_scale_and_validity
