models:
  - name: int_hba1c_all
    description: >
      HbA1c test history for all people, including inactive and deceased people.
      One row per observation id and source cluster, with an effective date no later
      than the build date. Includes IFCCHBAM_COD and DCCTHBA1C_COD tests without
      numeric results. Missing or non-numeric results have null standardised values
      and false validity. IFCC values use mmol/mol and DCCT values use percent.
      Consumers assessing control must check validity; test-presence measures may
      use every retained observation.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "hba1c_original_value is not null or not is_valid_hba1c"
      - cluster_ids_exist:
          arguments:
            cluster_ids: DCCTHBA1C_COD, IFCCHBAM_COD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id
              - source_cluster_id
    columns:
      - name: id
        description: Identifier for each HbA1c observation (may not be unique if observation maps to multiple clusters)
        data_tests:
          - not_null
      - name: person_id
        description: Person identifier
        data_tests:
          - not_null
      - name: measurement_type
        description: Type of HbA1c measurement (IFCC, DCCT, or UNKNOWN)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['IFCC', 'DCCT', 'UNKNOWN']
      - name: is_valid_hba1c
        description: Whether the result is numeric and within 20-200 mmol/mol for IFCC or 3-20 percent for DCCT; false for missing or non-numeric results
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: hba1c_category
        description: >
          Clinical band derived from the standardised IFCC value (mmol/mol).
          Bands align with NICE NG28 targets and QOF indicator DM021 (<=58 mmol/mol, inclusive).
          Values: Normal (<42), Prediabetes (42–47.9, NICE non-diabetic hyperglycaemia),
          Diabetes - At NICE Target (48–53.9), Diabetes - Elevated (54–58.0, above NICE target but still within QOF),
          Diabetes - Above Target (>58–74.9, misses QOF), Diabetes - High Risk (75–85.9),
          Diabetes - Very High Risk (>=86), Invalid (null or out of range).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Normal'
                  - 'Prediabetes'
                  - 'Diabetes - At NICE Target'
                  - 'Diabetes - Elevated (within QOF)'
                  - 'Diabetes - Above Target'
                  - 'Diabetes - High Risk'
                  - 'Diabetes - Very High Risk'
                  - 'Invalid'
      - name: indicates_diabetes
        description: HbA1c >=48 mmol/mol (NICE NG28 diagnostic threshold for diabetes).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: meets_qof_target
        description: HbA1c <=58 mmol/mol (QOF indicator DM021 glycaemic control threshold, inclusive).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
