        column4::VARCHAR result_value, column5::VARCHAR result_unit_code,
        CASE WHEN column1 = 'SYN_HPCT' THEN 'SYN_original_percent_words'
            ELSE column5::VARCHAR END result_unit_display, 'SYN_CODE'::VARCHAR mapped_concept_code,
        'Synthetic observation'::VARCHAR mapped_concept_display, column6::VARCHAR cluster_id
        FROM VALUES ('SYN_1', -9300, '2026-01-01', 15, 'mmol/mol', 'IFCCHBAM_COD'),
        ('SYN_2', -9301, '2026-01-01', 22, 'mmol/mol', 'DCCTHBA1C_COD'),
        ('SYN_3', -9302, '2026-01-01', 22, '%', 'IFCCHBAM_COD'),
        ('SYN_4', -9303, '2026-01-01', 22, NULL, 'IFCCHBAM_COD'),
        ('SYN_5', -9304, '2026-01-01', 48, 'mmol/mol', 'IFCCHBAM_COD'),
        ('SYN_6', -9305, '2026-01-01', 0.5, '%', 'DCCTHBA1C_COD'),
        ('SYN_7', -9306, '2026-01-01', 250, 'mmol/mol', 'IFCCHBAM_COD'),
        ('SYN_8', -9307, '2026-01-01', NULL, NULL, 'IFCCHBAM_COD'),
        ('SYN_9', -9308, '2026-01-01', 22, '%{Hemoglobin}', 'IFCCHBAM_COD'),
        ('SYN_H13', -18120, '2026-01-01', 13, 'mmol/mol', 'IFCCHBAM_COD'),
