models:
  - name: int_nutrition_review_latest
    description: >-
      Latest recorded nutrition assessment or declined assessment, by clinical
      date. One row per person with evidence in int_nutrition_review dated no
      later than the build date. Includes all qualifying people, including
      inactive and deceased people; no SMI-register or age restriction is
      applied.

    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null
