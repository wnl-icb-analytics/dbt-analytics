models:
  - name: int_blood_glucose_latest
    description: >-
      Last recorded blood glucose observation per person from FASPLASGLUC_COD or
      GLUC_COD, up to the build date. Includes inactive and deceased people and
      observations without numeric results. Clinical calendar date, latest save time and
      highest observation ID determine the selected event. No value-validity filter
      applies. Fasting status follows the existing concept-code rule.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null
