models:
  - name: int_blood_pressure_declined
    description: >-
      Declined blood pressure measurements in NCL OLIDS GP records, using BPDEC_COD. One row
      per person, concept and clinical date up to the build date. Includes inactive and
      deceased people, without age or SMI-register restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: BPDEC_COD