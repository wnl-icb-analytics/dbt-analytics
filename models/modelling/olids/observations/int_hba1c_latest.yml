models:
  - name: int_hba1c_latest
    description: >-
      Latest valid HbA1c from IFCCHBAM_COD or DCCTHBA1C_COD in OLIDS, one row per
      person up to the build date. Includes inactive and deceased people of all ages.
      Valid ranges are 20-200 mmol/mol IFCC or 3-20% DCCT; both formats are retained.
      IFCC flags use at least 48 for diabetes range and at most 58 for the QOF target,
      without establishing diagnosis or register eligibility. Observation ID resolves
      date ties. A later invalid or value-free test sets has_later_unassessable_result;
      the selected row remains the latest valid result.
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: most_recent_result_date
        description: Latest date of any HbA1c test, including invalid and value-free tests.
      - name: has_later_unassessable_result
        description: A later invalid or value-free test exists after this valid result.
      - name: original_result_unit_code
        description: Recorded UCUM unit code before scale inference.
      - name: is_unit_conflict
        description: Inferred scale disagrees with the recorded unit or concept cluster. Review before use.
      - name: person_id
        tests:
          - unique
          - not_null

    config:
      meta:
        indicator:
          id: "HBA1C_LATEST"
          type: "PATHOLOGY"
          category: "LABORATORY_RESULT"
          clinical_domain: "Cardiometabolic"
          name_short: "Latest HbA1c"
          description_short: "Most recent HbA1c measurement for glycaemic control assessment"
          description_long: >
            Latest valid HbA1c measurement per person supporting diabetes management
            and care pathway
            decisions. Provides current glycaemic control status with both IFCC and
            DCCT measurement
            format support. Includes clinical categorisation for diabetes control
            assessment (≤48 mmol/mol
            excellent, ≤58 mmol/mol adequate, >75 mmol/mol poor), QOF target achievement
            flags (≤58 mmol/mol),
            and diagnostic indicators (≥48 mmol/mol diabetes, ≥42 mmol/mol prediabetes).
            Key biomarker
            for diabetes care quality monitoring and treatment optimisation.
          is_qof: false
          source_column: "hba1c_value"
          usage_contexts:
            - "LABORATORY_MONITORING"
          code_clusters:
            - cluster_id: "HBA1C_COD"
              category: "INCLUSION"
          thresholds:
            # QOF Targets
            - population_group: "DIABETES"
              threshold_type: "QOF_TARGET"
              threshold_value: "58"
              threshold_operator: "AT_OR_BELOW"
              threshold_unit: "mmol/mol"
              description: "QOF glycaemic control target for diabetes"
              sort_order: 1
            # Clinical Control Categories
            - population_group: "ALL"
              threshold_type: "GOOD_CONTROL"
              threshold_value: "48"
              threshold_operator: "AT_OR_BELOW"
              threshold_unit: "mmol/mol"
              description: "Excellent glycaemic control"
              sort_order: 2
            - population_group: "ALL"
              threshold_type: "ADEQUATE_CONTROL"
              threshold_value: "58"
              threshold_operator: "AT_OR_BELOW"
              threshold_unit: "mmol/mol"
              description: "Adequate glycaemic control"
              sort_order: 3
            - population_group: "ALL"
              threshold_type: "POOR_CONTROL"
              threshold_value: "75"
              threshold_operator: "ABOVE"
              threshold_unit: "mmol/mol"
              description: "Poor glycaemic control requiring intervention"
              sort_order: 4
            # Diagnostic Thresholds
            - population_group: "ALL"
              threshold_type: "DIABETES_DIAGNOSIS"
              threshold_value: "48"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "mmol/mol"
              description: "HbA1c threshold for diabetes diagnosis"
              sort_order: 5
            - population_group: "ALL"
              threshold_type: "PREDIABETES_LOWER"
              threshold_value: "42"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "mmol/mol"
              description: "Lower threshold for prediabetes (NDH) diagnosis"
              sort_order: 6
        owner:
          name: EddieDavison92
unit_tests:
- name: hba1c_latest_later_unassessable
  model: int_hba1c_latest
  given:
  - input: ref('int_hba1c_all')
    rows: |-
      SELECT 'SYN_OLD'::VARCHAR AS id, NULL::VARCHAR AS concept_code, NULL::VARCHAR AS concept_display, NULL::VARCHAR AS source_cluster_id, NULL::VARCHAR AS result_unit_display, NULL::VARCHAR AS hba1c_display, NULL::VARCHAR AS hba1c_category, NULL::VARCHAR AS original_result_value, NULL::VARCHAR AS original_result_unit_code, -9301::NUMBER AS person_id, '2026-01-01'::TIMESTAMP_NTZ AS clinical_effective_date, NULL::FLOAT AS hba1c_original_value, NULL::FLOAT AS hba1c_ifcc, NULL::FLOAT AS hba1c_dcct, NULL::BOOLEAN AS is_ifcc, NULL::BOOLEAN AS is_dcct, NULL::BOOLEAN AS indicates_diabetes, NULL::BOOLEAN AS meets_qof_target, NULL::BOOLEAN AS is_unit_conflict, TRUE::BOOLEAN AS is_valid_hba1c, NULL::BOOLEAN AS has_later_unassessable_result
      UNION ALL
      SELECT 'SYN_LATER'::VARCHAR AS id, NULL::VARCHAR AS concept_code, NULL::VARCHAR AS concept_display, NULL::VARCHAR AS source_cluster_id, NULL::VARCHAR AS result_unit_display, NULL::VARCHAR AS hba1c_display, NULL::VARCHAR AS hba1c_category, NULL::VARCHAR AS original_result_value, NULL::VARCHAR AS original_result_unit_code, -9301::NUMBER AS person_id, '2026-02-01'::TIMESTAMP_NTZ AS clinical_effective_date, NULL::FLOAT AS hba1c_original_value, NULL::FLOAT AS hba1c_ifcc, NULL::FLOAT AS hba1c_dcct, NULL::BOOLEAN AS is_ifcc, NULL::BOOLEAN AS is_dcct, NULL::BOOLEAN AS indicates_diabetes, NULL::BOOLEAN AS meets_qof_target, NULL::BOOLEAN AS is_unit_conflict, FALSE::BOOLEAN AS is_valid_hba1c, NULL::BOOLEAN AS has_later_unassessable_result
