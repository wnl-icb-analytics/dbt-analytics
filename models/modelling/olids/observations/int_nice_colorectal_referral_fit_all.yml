models:
- name: int_nice_colorectal_referral_fit_all
  description: >-
    Colorectal referrals and faecal immunochemical tests (FIT). One row per observation and
    code-list group, including inactive and deceased people, through the build date. FIT results
    coded as bowel screening are excluded; referral records are retained. Code lists:
    GICANREF_COD, FAECIMM_COD and COLCANSCREV_COD.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - id
        - source_cluster_id
  - cluster_ids_exist:
      arguments:
        cluster_ids: GICANREF_COD, FAECIMM_COD, COLCANSCREV_COD
        source: PCD
  columns:
  - name: event_date
    description: Corrected clinical date.
  - name: source_cluster_id
    description: >-
      Code-list group identifying the evidence.
