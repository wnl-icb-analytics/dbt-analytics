models:
  - name: int_illicit_drug_use_all
    description: >
      OLIDS illicit drug use observations in PCD refset clusters ILLSUB_COD and
      ILLSUBASSDEC_COD. One row per observation per matched cluster. The cluster is not
      output, so an observation in both clusters appears twice. Observations dated after
      today are excluded. Undated observations are kept with clinical date 1900-01-01.
      illicit_drug_assessed_last_12m is true when the clinical date is in the last 365
      days. ILLICIT_DRUG_PATTERN groups concept codes into patterns such as dependence,
      misuse, remission and overdose, and is null for unlisted codes. ILLICIT_DRUG_CLASS
      assigns a substance class from the concept display text. It is null for 'Does not
      misuse drugs' and 'Has never misused drugs', and 'Unknown Substance' where no class
      matches.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: ILLSUB_COD, ILLSUBASSDEC_COD
