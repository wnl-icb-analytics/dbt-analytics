models:
  - name: int_blood_glucose_all
    description: >
      Blood glucose test history for all people, including inactive and deceased
      people. One row per person, concept code and effective date no later than
      the build date. Includes FASPLASGLUC_COD and GLUC_COD observations with or
      without numeric results. When a code belongs to both clusters, the retained
      source cluster is FASPLASGLUC_COD so fasting evidence is preserved.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - concept_code
              - clinical_effective_date
      - cluster_ids_exist:
          arguments:
            cluster_ids: FASPLASGLUC_COD, GLUC_COD
