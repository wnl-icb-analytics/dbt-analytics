models:
- name: int_cancer_support_all
  description: Discussion of primary care cancer support. One row per observation for all people, including
    inactive and deceased people. Cancer care review alone does not qualify.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - cluster_ids_exist:
      arguments:
        cluster_ids: CANCER_SUPPORT_COD
        source: ECL_CACHE
  columns:
  - name: id
    description: Source observation identifier.
    data_tests:
    - not_null
    - unique
  - name: person_id
    description: Person with the record.
  - name: clinical_effective_date
    description: Clinical date corrected by the observation extraction; consumers bound it at their reporting
      date.
  - name: source_cluster_id
    description: Maintained code list supplying this evidence; overlapping memberships retain the first
      name alphabetically.
