models:
  - name: int_ras_contraindication_all
    description: >
      Contraindications to ACE inhibitors and angiotensin II receptor blockers
      from the PCD clusters XACE_COD and XAII_COD (persisting) and TXACE_COD
      and TXAII_COD (expiring), one row per observation and cluster, for all
      people including inactive and deceased. NICE reads a persisting
      contraindication as standing and an expiring one as current for 12
      months. Observations dated after the build date are excluded.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: XACE_COD, TXACE_COD, XAII_COD, TXAII_COD
            source: PCD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id
              - source_cluster_id
    columns:
      - name: id
        description: Source observation identifier; one row per observation and cluster.
        data_tests:
          - not_null
      - name: person_id
        description: Person identifier.
      - name: clinical_effective_date
        description: Date of the record.
      - name: drug_class
        description: ACE_INHIBITOR or ARB.
        data_tests:
          - not_null
      - name: is_persisting
        description: True for a persisting contraindication, false for an expiring one.
      - name: concept_code
        description: SNOMED code of the record.
      - name: concept_display
        description: Description of the record.
      - name: source_cluster_id
        description: Cluster that matched the code.
