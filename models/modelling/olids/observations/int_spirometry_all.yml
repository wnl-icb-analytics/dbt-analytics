models:
  - name: int_spirometry_all
    description: 'Spirometry test results (FEV1/FVC ratios) for COPD diagnosis and respiratory disease monitoring.

      One row per spirometry observation using PCD FEV1FVC_COD and FEV1FVCL70_COD clusters. COPD threshold assessment uses the unrounded FEV1/FVC ratio (<0.7); values above 1 are divided by 100.'
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: FEV1FVCL70_COD, FEV1FVC_COD
            source: PCD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id
              - source_cluster_id
