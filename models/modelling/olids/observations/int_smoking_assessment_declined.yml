models:
  - name: int_smoking_assessment_declined
    description: >-
      Declined smoking-status assessments in NCL OLIDS GP records, using SMOKSTATDEC_COD. One
      row per person, concept and clinical date up to the build date. Includes inactive and
      deceased people, without age or SMI-register restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: SMOKSTATDEC_COD