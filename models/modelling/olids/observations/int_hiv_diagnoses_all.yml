models:
- name: int_hiv_diagnoses_all
  description: HIV and AIDS diagnoses. One row per observation for all people, including inactive and
    deceased people. Clinical and recorded dates establish when a diagnosis was known.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - cluster_ids_exist:
      arguments:
        cluster_ids: HIV_COD, AIDS_COD
        source: PCD
  columns:
  - name: id
    description: Source observation identifier.
    data_tests:
    - not_null
    - unique
  - name: person_id
    description: Person with the record.
  - name: clinical_effective_date
    description: Clinical date corrected by the observation extraction; consumers bound it at their reporting
      date.
  - name: date_recorded
    description: Date the diagnosis was recorded. Null does not block known-date eligibility.
  - name: source_cluster_id
    description: Maintained code list supplying this evidence; overlapping memberships retain the first
      name alphabetically.
