      CONFIG_VERSION: null
      CONVERT_FROM_UNIT: g/L
      CONVERT_TO_UNIT: g/L
      MULTIPLY_BY: 1.0
      PRE_OFFSET: 0.0
      POST_OFFSET: 0.0
    - DEFINITION_ID: null
      DEFINITION_NAME: haemoglobin_est
      CONFIG_ID: null
      CONFIG_VERSION: null
      CONVERT_FROM_UNIT: g/dL
      CONVERT_TO_UNIT: g/L
