version: 2

models:
  - name: int_observation_events_long
    description: |
      Long-format biomarker observation history. One row per observation event
      across blood pressure (systolic + diastolic), total cholesterol, LDL, HDL, non-HDL, triglycerides, total cholesterol to HDL ratio, QRISK,
      HbA1c, BMI, waist circumference, adult waist-to-height ratio, eGFR, creatinine, urine ACR, ALT, GGT,
      bilirubin, haemoglobin, platelets, eosinophils, eFI/eFI2, and Rockwood
      frailty assessments.

      Waist Circumference includes only valid readings in the local 30 to 250 cm
      range; out-of-range readings remain in int_waist_circumference_all.

      Backs sem_olids_observations_history. Supports serial / latest-N /
      trajectory questions via window functions over (person_id,
      observation_type) ordered by clinical_effective_date.

      Full history, not capped at 60 months. OLIDS retains full history for
      currently-registered persons but only ~5 years for left/deceased, so
      pre-5-year rows are survivor-biased toward current registrants — fine for
      per-person trajectories, not for long-run population cross-sections.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: observation_event_id
        description: Surrogate key per observation event. Best-effort unique across person/type/date/source id/value.
        data_tests:
          - unique
          - not_null
      - name: person_id
        description: Person identifier (joins to dim_person_demographics).
        data_tests:
          - not_null
      - name: observation_type
        description: >
          Biomarker label (Systolic BP, Diastolic BP, Total Cholesterol,
          LDL Cholesterol, HDL Cholesterol, Non-HDL Cholesterol, Triglycerides,
          Total Cholesterol to HDL Ratio, QRISK, HbA1c, BMI, Waist Circumference, Waist-to-height Ratio, eGFR,
          Creatinine, Urine ACR, ALT, GGT, Bilirubin, Haemoglobin, Platelets,
          Eosinophils, Electronic Frailty Index (eFI), Rockwood Frailty Scale).
          Filter to a single type before aggregating value.
        data_tests:
          - not_null
      - name: observation_group
        description: Clinical group (Cardiovascular, Metabolic, Renal, Liver, Haematology, Frailty).
        data_tests:
          - not_null
      - name: clinical_effective_date
        description: Date of the observation.
        data_tests:
          - not_null
      - name: value
        description: Numeric result in the unit given by `unit`. Only comparable within a single observation_type.
      - name: unit
        description: Unit of measure for `value`.
      - name: category
        description: Type-specific clinical category label for this reading (VARCHAR; meaning varies by observation_type).
      - name: hypertension_stage
        description: NICE NG136 stage for paired BP events (Normal, Stage 1, Stage 2, Stage 3 (Severe)); NULL for other types.
      - name: source_observation_id
        description: Source observation id from the originating _all model (traceability).

unit_tests:
- name: observation_history_haemoglobin_and_waist_ratio
  model: int_observation_events_long
  overrides:
    macros:
      get_empty_subquery_sql: SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS source_observation_id, NULL::VARCHAR AS observation_type, NULL::FLOAT AS value, NULL::VARCHAR AS category WHERE FALSE
  given:
  - input: ref('int_haemoglobin_all')
    format: sql
    rows: |-
      SELECT column1::VARCHAR AS id, -18114::NUMBER AS person_id,
          column2::TIMESTAMP_NTZ AS clinical_effective_date,
          column2::TIMESTAMP_NTZ AS date_recorded, column3::FLOAT AS inferred_value,
          column4::BOOLEAN AS is_out_of_range, FALSE::BOOLEAN AS is_negative,
          FALSE::BOOLEAN AS is_extreme_outlier, 'g/L'::VARCHAR AS inferred_unit,
          'SYN_CATEGORY'::VARCHAR AS haemoglobin_category
      FROM VALUES ('SYN_VALID', '2024-01-01', 135, FALSE),
          ('SYN_BAD', '2024-02-01', 1.5, TRUE)
  - input: ref('int_blood_pressure_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::DATE AS clinical_effective_date, NULL::VARCHAR AS systolic_observation_id, NULL::VARCHAR AS diastolic_observation_id, NULL::FLOAT AS systolic_value, NULL::FLOAT AS diastolic_value, NULL::BOOLEAN AS is_home_bp_event, NULL::BOOLEAN AS is_abpm_bp_event, NULL::BOOLEAN AS is_hypertensive_range WHERE FALSE
  - input: ref('int_cholesterol_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS cholesterol_value, NULL::VARCHAR AS cholesterol_category WHERE FALSE
  - input: ref('int_cholesterol_ldl_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS cholesterol_value, NULL::VARCHAR AS ldl_cvd_target_met WHERE FALSE
  - input: ref('int_cholesterol_hdl_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS cholesterol_value, NULL::VARCHAR AS cholesterol_category WHERE FALSE
  - input: ref('int_cholesterol_non_hdl_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS cholesterol_value, NULL::VARCHAR AS cholesterol_category WHERE FALSE
  - input: ref('int_triglycerides_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS triglycerides_value, NULL::VARCHAR AS triglycerides_category WHERE FALSE
  - input: ref('int_cholesterol_hdl_ratio_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::VARCHAR AS cholesterol_hdl_ratio WHERE FALSE
  - input: ref('int_qrisk_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS qrisk_score, NULL::VARCHAR AS cvd_risk_category WHERE FALSE
  - input: ref('int_hba1c_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::VARCHAR AS hba1c_ifcc, NULL::VARCHAR AS hba1c_category WHERE FALSE
  - input: ref('int_bmi_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS bmi_value, NULL::VARCHAR AS bmi_category WHERE FALSE
  - input: ref('int_waist_circumference_all')
    format: sql
    rows: |-
      SELECT -19800::NUMBER AS person_id, id::VARCHAR AS id, '2024-03-01'::DATE AS clinical_effective_date,
          waist::FLOAT AS waist_circumference_value, ratio::FLOAT AS waist_to_height_ratio,
          band::VARCHAR AS waist_to_height_ratio_category, valid::BOOLEAN AS is_valid_waist_circumference
      FROM (VALUES ('SYN_W_RATIO',100,0.5,'Increased central adiposity',TRUE),
          ('SYN_W_NOHEIGHT',90,NULL,NULL,TRUE),
          ('SYN_W_TOO_SMALL',29,NULL,NULL,FALSE),
          ('SYN_W_TOO_LARGE',251,NULL,NULL,FALSE)) v(id,waist,ratio,band,valid)
  - input: ref('int_egfr_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS egfr_value, NULL::VARCHAR AS ckd_stage WHERE FALSE
  - input: ref('int_creatinine_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS creatinine_value, NULL::VARCHAR AS creatinine_category WHERE FALSE
  - input: ref('int_urine_acr_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS acr_value, NULL::VARCHAR AS acr_category WHERE FALSE
  - input: ref('int_alt_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS inferred_value, NULL::VARCHAR AS inferred_unit, NULL::VARCHAR AS alt_category, NULL::BOOLEAN AS is_negative, NULL::BOOLEAN AS is_extreme_outlier WHERE FALSE
  - input: ref('int_ggt_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS inferred_value, NULL::VARCHAR AS inferred_unit, NULL::VARCHAR AS ggt_category, NULL::BOOLEAN AS is_negative, NULL::BOOLEAN AS is_extreme_outlier WHERE FALSE
  - input: ref('int_bilirubin_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS inferred_value, NULL::VARCHAR AS inferred_unit, NULL::VARCHAR AS bilirubin_category, NULL::BOOLEAN AS is_negative, NULL::BOOLEAN AS is_extreme_outlier WHERE FALSE
  - input: ref('int_platelets_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS inferred_value, NULL::VARCHAR AS inferred_unit, NULL::VARCHAR AS platelets_category, NULL::BOOLEAN AS is_negative, NULL::BOOLEAN AS is_extreme_outlier WHERE FALSE
  - input: ref('int_eosinophil_count')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS inferred_value, NULL::VARCHAR AS inferred_unit, NULL::VARCHAR AS eosinophil_category, NULL::BOOLEAN AS is_negative, NULL::BOOLEAN AS is_extreme_outlier WHERE FALSE
  - input: ref('int_efi_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS efi_value, NULL::VARCHAR AS efi_category WHERE FALSE
  - input: ref('int_rockwood_all')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS rockwood_score, NULL::VARCHAR AS frailty_category WHERE FALSE
  expect:
    rows:
    - person_id: -18114
      source_observation_id: SYN_VALID
      observation_type: Haemoglobin
      value: 135
      category: SYN_CATEGORY
    - {person_id: -19800, source_observation_id: SYN_W_RATIO, observation_type: Waist Circumference, value: 100, category: null}
    - {person_id: -19800, source_observation_id: SYN_W_NOHEIGHT, observation_type: Waist Circumference, value: 90, category: null}
    - {person_id: -19800, source_observation_id: SYN_W_RATIO, observation_type: Waist-to-height Ratio, value: 0.5, category: Increased central adiposity}
