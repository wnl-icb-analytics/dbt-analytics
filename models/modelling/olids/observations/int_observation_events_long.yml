version: 2

models:
  - name: int_observation_events_long
    description: |
      Biomarker history, one row per distinct non-BP reading or existing BP row
      across blood pressure (systolic + diastolic), total cholesterol, LDL, HDL, non-HDL, triglycerides, total cholesterol to HDL ratio, QRISK,
      HbA1c, BMI, waist circumference, eGFR, creatinine, urine ACR, ALT, GGT,
      bilirubin, haemoglobin, platelets, eosinophils, eFI/eFI2, and Rockwood
      frailty assessments.

      Non-BP readings with the same person, mapped concept, clinical calendar
      date and recorded value appear once. Different standardised values or units
      remain separate. The latest clinical timestamp, recorded timestamp and
      source identifier select the retained row. BP keeps its existing grain.
      Different source patient records or publishers remain separate. Missing
      source metadata or an unknown clinical day retains the source identifier.

      Backs sem_olids_observations_history. Supports serial / latest-N /
      trajectory questions via window functions over (person_id,
      observation_type) ordered by clinical_effective_date.

      Full history, not capped at 60 months. OLIDS retains full history for
      currently-registered persons but only ~5 years for left/deceased, so
      pre-5-year rows are survivor-biased toward current registrants — fine for
      per-person trajectories, not for long-run population cross-sections.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: observation_event_id
        description: Surrogate key per observation event. Best-effort unique across person/type/date/source id/value.
        data_tests:
          - unique
          - not_null
      - name: person_id
        description: Person identifier (joins to dim_person_demographics).
        data_tests:
          - not_null
      - name: observation_type
        description: >
          Biomarker label (Systolic BP, Diastolic BP, Total Cholesterol,
          LDL Cholesterol, HDL Cholesterol, Non-HDL Cholesterol, Triglycerides,
          Total Cholesterol to HDL Ratio, QRISK, HbA1c, BMI, Waist Circumference, eGFR,
          Creatinine, Urine ACR, ALT, GGT, Bilirubin, Haemoglobin, Platelets,
          Eosinophils, Electronic Frailty Index (eFI), Rockwood Frailty Scale).
          Filter to a single type before aggregating value.
        data_tests:
          - not_null
      - name: observation_group
        description: Clinical group (Cardiovascular, Metabolic, Renal, Liver, Haematology, Frailty).
        data_tests:
          - not_null
      - name: clinical_effective_date
        description: Date of the observation.
        data_tests:
          - not_null
      - name: value
        description: Numeric result in the unit given by `unit`. Only comparable within a single observation_type.
      - name: unit
        description: Unit of measure for `value`.
      - name: category
        description: Type-specific clinical category label for this reading (VARCHAR; meaning varies by observation_type).
      - name: hypertension_stage
        description: NICE NG136 stage for paired BP events (Normal, Stage 1, Stage 2, Stage 3 (Severe)); NULL for other types.
      - name: source_observation_id
        description: Source observation id from the originating _all model (traceability).

