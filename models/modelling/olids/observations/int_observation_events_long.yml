      SELECT NULL::VARCHAR AS concept_code, column1::VARCHAR AS id, -18114::NUMBER AS person_id,
          column2::TIMESTAMP_NTZ AS clinical_effective_date,
          column2::TIMESTAMP_NTZ AS date_recorded, column3::FLOAT AS inferred_value,
          column4::BOOLEAN AS is_out_of_range, FALSE::BOOLEAN AS is_negative,
          FALSE::BOOLEAN AS is_extreme_outlier, 'g/L'::VARCHAR AS inferred_unit,
          'SYN_CATEGORY'::VARCHAR AS haemoglobin_category
      FROM VALUES ('SYN_VALID', '2024-01-01', 135, FALSE),
          ('SYN_BAD', '2024-02-01', 1.5, TRUE)
  - input: ref('int_blood_pressure_all')
