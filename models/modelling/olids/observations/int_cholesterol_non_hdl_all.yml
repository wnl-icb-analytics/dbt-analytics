models:
  - name: int_cholesterol_non_hdl_all
    description: Non-HDL cholesterol for all people, including inactive and deceased people. One row per
      observation in the PCD NONHDLCCHOL_COD cluster. Missing or future original clinical dates are excluded.
      Invalid values and unsupported units remain available for audit. Valid means a positive, finite
      value with a recognised unit. Concentrations retain source precision after unit conversion; values
      are not rounded before comparison. The general healthy-adult reference limit is below 4 mmol/L.
      NICE secondary prevention uses a separate target of 2.6 mmol/L or below.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.heartuk.org.uk/cholesterol/understanding-your-cholesterol-test-results-
        code_source: PCD
    columns:
      - name: id
        description: Source observation identifier. Used to break ties deterministically; it does not
          imply clinical priority.
        data_tests:
          - unique
          - not_null
      - name: person_id
        description: Person identifier. No active-registration or age restriction is applied.
      - name: clinical_effective_date
        description: Observation date after the shared OLIDS correction for events dated after their recording
          date.
      - name: clinical_effective_date_raw
        description: Original clinical effective date before the shared date correction.
      - name: date_recorded
        description: Date the observation was recorded in the source.
      - name: cholesterol_value
        description: Compatibility alias of converted_value_mmol_l. Check is_lipid_review_required as well as validity before analysis.
      - name: result_unit_display
        description: 'Standard unit: mmol/L. Null when the unit cannot be standardised.'
      - name: recorded_value
        description: Numeric value received from OLIDS, unchanged by this model. Not guaranteed to be the original laboratory value.
      - name: converted_value_mmol_l
        description: Candidate concentration in mmol/L calculated using the recorded unit. Preserves precision and outliers. Null when the unit cannot be converted. A plausible result does not prove the unit was correct.
      - name: source_result_unit_code
        description: Unit code from the source concept, without mapped-unit substitution. Null if unavailable.
      - name: source_result_unit_display
        description: Unit label from the source concept, without mapped-unit substitution. Null if unavailable.
      - name: mapped_result_unit_code
        description: Mapped unit code supplied by OLIDS. Null if unavailable.
      - name: mapped_result_unit_display
        description: Mapped unit label supplied by OLIDS. Null if unavailable.
      - name: conversion_unit_basis
        description: Whether the calculation selected the mapped unit, source unit or no recorded unit. Missing ratio units are inferred from the PCD observable.
      - name: conversion_factor
        description: Multiplier applied to recorded_value. One for recognised standard units and inferred dimensionless ratios. Null when the unit cannot be converted.
      - name: is_unit_metadata_conflict
        description: True when populated source and mapped unit labels disagree after recognised aliases are normalised. Unknown labels are treated as absent. Does not identify which unit is correct.
      - name: plausibility_status
        description: >
          Screening result after conversion using an inclusive local review range of 0.1 to 20 mmol/L.
          These exploratory limits are not clinical exclusion thresholds. Rare genuine results
          can lie outside them. Existing validity rules and row selection are unchanged.
      - name: is_lipid_review_required
        description: >
          True for conflicting unit metadata, every non-standard unit conversion, missing or unsupported units, missing
          or non-positive or non-finite values, or values outside the local review range.
          False means no issue detected by these checks, not verified accuracy. Inferred
          dimensionless ratio units do not alone trigger review. Does not change validity,
          clinical categories or latest-valid selection.
      - name: original_result_value
        description: Compatibility alias of recorded_value, the unchanged numeric value received from OLIDS.
      - name: original_result_unit_code
        description: Legacy combined unit field. Mapped unit code where supplied, otherwise the source unit concept code. Null if
          neither is available.
      - name: original_result_unit_display
        description: Legacy combined unit field. Mapped unit label where supplied, otherwise the source unit concept label. Null if
          neither is available.
      - name: unit_status
        description: Whether the unit was recorded in standard form, converted, missing or unsupported.
          Missing concentration units are not inferred from the value.
      - name: concept_code
        description: Recorded mapped clinical concept code matched to the PCD cluster.
      - name: concept_display
        description: Recorded mapped clinical concept label.
      - name: source_cluster_id
        description: 'Authoritative PCD observation cluster: NONHDLCCHOL_COD.'
      - name: sampling_context
        description: Fasting, non-fasting or random only when specified in the PCD code description. Otherwise
          Not specified; no sampling status is inferred from the numeric value.
      - name: is_valid_cholesterol
        description: Whether the result satisfies the documented validity rule. False includes missing
          values and unsupported units.
      - name: cholesterol_category
        description: The general healthy-adult reference limit is below 4 mmol/L. NICE secondary prevention
          uses a separate target of 2.6 mmol/L or below.
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: NONHDLCCHOL_COD
