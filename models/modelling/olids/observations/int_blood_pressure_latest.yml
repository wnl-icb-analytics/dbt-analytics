models:
  - name: int_blood_pressure_latest
    description: 'Latest blood pressure event per person with paired systolic/diastolic
      values, clinical context flags (Home/ABPM), and hypertensive range indicator.
      One row per person containing their most recent BP event (the representative
      reading of their latest BP date, selected upstream in int_blood_pressure_all).'
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Person identifier
        tests:
          - not_null
          - unique
      - name: effective_date
        description: Date of most recent blood pressure measurement
        tests:
          - not_null
      - name: clinical_effective_date
        description: Backward-compatibility alias for effective_date
      - name: systolic_value
        description: Systolic blood pressure value in mmHg (representative reading)
        tests:
          - not_null
      - name: diastolic_value
        description: Diastolic blood pressure value in mmHg (representative reading)
        tests:
          - not_null
      - name: is_home_bp_event
        description: 'Boolean flag indicating the representative reading was recorded as home blood pressure'
      - name: is_abpm_bp_event
        description: 'Boolean flag indicating the representative reading was recorded as ambulatory blood pressure monitoring'
      - name: is_hypertensive_range
        description: 'Boolean flag (date-level, any reading): ≥140/90 mmHg (clinic) or ≥135/85 mmHg (home/ABPM)'
      - name: result_unit_display
        description: 'Unit of measurement for blood pressure values (always mmHg)'
      - name: systolic_observation_id
        description: 'Observation identifier for the systolic reading of the representative paired event'
      - name: diastolic_observation_id
        description: 'Observation identifier for the diastolic reading of the representative paired event'
      - name: all_concept_codes
        description: 'Array of all clinical concept codes used in observations for the latest BP event date'
      - name: all_concept_displays
        description: 'Array of all clinical concept display names used in observations for the latest BP event date'
      - name: all_source_cluster_ids
        description: 'Array of all source cluster identifiers used in observations for the latest BP event date'
      - name: bp_context_group
        description: Representative reading setting, CLINIC, HOME or ABPM, from concept-level cluster membership.
        data_tests:
          - accepted_values:
              arguments:
                values: [CLINIC, HOME, ABPM]

unit_tests:
- name: bp_latest_preserves_selected_context
  model: int_blood_pressure_latest
  overrides:
    macros:
      get_empty_subquery_sql: SELECT NULL::NUMBER AS person_id, NULL::DATE AS effective_date, NULL::FLOAT AS systolic_value, NULL::FLOAT AS diastolic_value, NULL::VARCHAR AS bp_context_group WHERE FALSE
  given:
  - input: ref('int_blood_pressure_all')
    format: sql
    rows: |-
      SELECT -18140::NUMBER AS person_id, '2024-01-01'::DATE AS effective_date, 150::FLOAT AS systolic_value, 90::FLOAT AS diastolic_value, NULL::BOOLEAN AS is_home_bp_event, NULL::BOOLEAN AS is_abpm_bp_event, 'CLINIC'::VARCHAR AS bp_context_group, NULL::BOOLEAN AS is_hypertensive_range, NULL::VARCHAR AS result_unit_display, NULL::VARCHAR AS systolic_observation_id, NULL::VARCHAR AS diastolic_observation_id, NULL::VARCHAR AS all_concept_codes, NULL::VARCHAR AS all_concept_displays, NULL::VARCHAR AS all_source_cluster_ids
      UNION ALL
      SELECT -18140::NUMBER AS person_id, '2024-02-01'::DATE AS effective_date, 130::FLOAT AS systolic_value, 80::FLOAT AS diastolic_value, NULL::BOOLEAN AS is_home_bp_event, NULL::BOOLEAN AS is_abpm_bp_event, 'HOME'::VARCHAR AS bp_context_group, NULL::BOOLEAN AS is_hypertensive_range, NULL::VARCHAR AS result_unit_display, NULL::VARCHAR AS systolic_observation_id, NULL::VARCHAR AS diastolic_observation_id, NULL::VARCHAR AS all_concept_codes, NULL::VARCHAR AS all_concept_displays, NULL::VARCHAR AS all_source_cluster_ids
  expect:
    rows:
    - person_id: -18140
      effective_date: "2024-02-01"
      systolic_value: 130
      diastolic_value: 80
      bp_context_group: HOME
