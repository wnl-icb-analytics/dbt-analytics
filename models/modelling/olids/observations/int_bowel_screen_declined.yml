models:
  - name: int_bowel_screen_declined
    description: >-
      Bowel screening declined from COLCANSCRDEC_COD. The OLIDS population
      comes from NCL GP records. One row per observation dated no later than
      the build date, for all people including inactive and deceased people.
      No screening-age, sex or SMI-register restriction is applied. Superseded
      for screening-status analysis by int_bowel_screening_all.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: COLCANSCRDEC_COD