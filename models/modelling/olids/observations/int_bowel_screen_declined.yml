models:
  - name: int_bowel_screen_declined
    description: >-
      Declined bowel screening in OLIDS GP records from COLCANSCRDEC_COD, one row per
      observation up to the build date. Includes inactive and deceased people without
      screening-age, sex or SMI-register restrictions. Superseded for screening-status
      analysis by int_bowel_screening_all.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: COLCANSCRDEC_COD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id]
