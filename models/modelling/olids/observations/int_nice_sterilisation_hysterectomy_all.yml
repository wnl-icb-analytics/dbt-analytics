models:
- name: int_nice_sterilisation_hysterectomy_all
  description: Sterilisation hysterectomy records from NHSD_PRIMARY_CARE_DOMAIN_REFSETS/STERIL_COD, NHSD_PRIMARY_CARE_DOMAIN_REFSETS/HYST2_COD.
    One row per observation and matching source cluster for all people, including inactive and deceased
    people. Future clinical dates are excluded.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - id
        - source_cluster_id
  - cluster_ids_exist:
      arguments:
        cluster_ids: NHSD_PRIMARY_CARE_DOMAIN_REFSETS/STERIL_COD, NHSD_PRIMARY_CARE_DOMAIN_REFSETS/HYST2_COD
        source: OPENCODELISTS
  columns:
  - name: event_date
    description: Corrected clinical date.
  - name: source_cluster_id
    description: Existing cluster identifying the evidence.
