models:
- name: int_nice_sterilisation_hysterectomy_all
  description: >-
    Sterilisation and hysterectomy records. One row per observation and code-list group,
    including inactive and deceased people, through the build date. Code lists: OPENCODELISTS
    NHSD_PRIMARY_CARE_DOMAIN_REFSETS/STERIL_COD and HYST2_COD.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - id
        - source_cluster_id
  - cluster_ids_exist:
      arguments:
        cluster_ids: NHSD_PRIMARY_CARE_DOMAIN_REFSETS/STERIL_COD, NHSD_PRIMARY_CARE_DOMAIN_REFSETS/HYST2_COD
        source: OPENCODELISTS
  columns:
  - name: event_date
    description: Corrected clinical date.
  - name: source_cluster_id
    description: >-
      Code-list group identifying the evidence.
