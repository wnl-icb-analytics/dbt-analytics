models:
  - name: int_cholesterol_declined
    description: >-
      Declined cholesterol tests in OLIDS GP records, using CHOLDEC_COD. One row per
      person, concept and clinical date up to the build date. Includes inactive and
      deceased people, without age or SMI-register restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: CHOLDEC_COD