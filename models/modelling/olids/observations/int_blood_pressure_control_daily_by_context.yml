        NULL::BOOLEAN AS is_systolic_row, NULL::BOOLEAN AS is_diastolic_row, NULL::VARCHAR AS bp_context_group,
        NULL::VARCHAR AS bp_context, NULL::DATE AS reading_date, NULL::FLOAT AS systolic_value, NULL::FLOAT
        AS diastolic_value, NULL::BOOLEAN AS is_valid_bp, NULL::BOOLEAN AS is_home_bp_event, NULL::BOOLEAN
