models:
- name: int_blood_pressure_control_daily_by_context
  description: Blood pressure control minima, one row per person, clinical date and measurement
    context. Includes all people with eligible complete numeric evidence through the build date.
    Validity requires systolic
    40 to 350 mmHg, diastolic 20 to 200 mmHg, inclusive, and systolic above diastolic.
    {{ doc('bp_control_evidence_rule') }}
    Used by NICE BP control indicators, general BP control and the diabetes triple target,
    including their C-LTCS, SMI and semantic consumers. Recording-only indicators and LTC LCS
    use separate evidence.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - reading_date
        - bp_context_group
  columns:
  - name: person_id
    description: Person with complete numeric blood pressure evidence, regardless of registration or death.
  - name: reading_date
    description: Corrected clinical date of the contributing measurements.
  - name: bp_context_group
    description: CLINIC, HOME or ABPM. Components never cross these groups.
  - name: systolic_value
    description: Independent minimum valid systolic in mmHg; latest complete reading value on an invalid-only
      date.
  - name: diastolic_value
    description: Independent minimum valid diastolic in mmHg; latest complete reading value on an invalid-only
      date.
  - name: is_valid_bp
    description: Both daily values are plausible and systolic exceeds diastolic.
  - name: is_home_bp_event
    description: The context is HOME.
  - name: is_abpm_bp_event
    description: The context is ABPM.
  - name: applied_measurement_context
    description: CLINIC or HBPM_ABPM for the applicable indicator threshold.
  - name: date_recorded
    description: Latest save time among contributing readings. Used only to select metadata or invalid-only
      evidence.
  - name: observation_id
    description: Deterministic source identifier from the latest contributing reading, not an identifier
      for the synthetic minima pair.
