- name: rockwood_terminal_illness_is_separate
  model: int_rockwood_all
  overrides:
    macros:
      get_observations: |-
        SELECT column1::VARCHAR id, -251440::NUMBER person_id,
         CURRENT_DATE()::TIMESTAMP_NTZ clinical_effective_date,
         column2::VARCHAR mapped_concept_code, 'Synthetic CFS'::VARCHAR mapped_concept_display,
         'ROCKWOOD_SCORES'::VARCHAR cluster_id
        FROM VALUES
         ('SYN_CFS6', '1129381000000102'), ('SYN_CFS7', '1129391000000100'),
         ('SYN_CFS8', '1129401000000102'), ('SYN_CFS9', '1129411000000100')
  given: []
  expect:
    rows:
    - id: SYN_CFS6
      rockwood_score: 6
      frailty_category: Moderate Frailty
      is_frail: true
      is_severely_frail: false
    - id: SYN_CFS7
      rockwood_score: 7
      frailty_category: Severe Frailty
      is_frail: true
      is_severely_frail: true
    - id: SYN_CFS8
      rockwood_score: 8
      frailty_category: Severe Frailty
      is_frail: true
      is_severely_frail: true
    - id: SYN_CFS9
      rockwood_score: 9
      frailty_category: Terminally Ill
      is_frail: false
      is_severely_frail: false
