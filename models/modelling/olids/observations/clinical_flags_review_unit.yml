unit_tests:
- name: int_alcohol_audit_scores_auditpc_boundaries
  model: int_alcohol_audit_scores
  overrides:
    macros:
      get_observations: |-
        SELECT column1::VARCHAR id, -251439::NUMBER person_id,
         CURRENT_DATE()::TIMESTAMP_NTZ clinical_effective_date,
         CURRENT_DATE()::TIMESTAMP_NTZ date_recorded,
         column2::VARCHAR result_value, 'score'::VARCHAR result_unit_display,
         '774089008'::VARCHAR mapped_concept_code, 'Synthetic AUDIT-PC'::VARCHAR mapped_concept_display,
         'AUDIT_COD'::VARCHAR cluster_id, 40::NUMBER age_at_event
        FROM VALUES
        ('SYN_PC_ZERO', '0'),
        ('SYN_PC_NEGATIVE', '-1'),
        ('SYN_PC_BELOW', '4'),
        ('SYN_PC_POSITIVE', '5'),
        ('SYN_PC_SEVEN', '7'),
        ('SYN_PC_MAX', '20'),
        ('SYN_PC_OVER', '21'),
        ('SYN_PC_FRACTION', '5.001'),
        ('SYN_PC_DECIMAL', '5.0'),
        ('SYN_PC_NULL', NULL)
  given:
  - input: ref('dim_person_demographics')
    format: sql
    rows: SELECT NULL::NUMBER person_id, NULL::VARCHAR gender WHERE FALSE
  expect:
    rows:
    - id: SYN_PC_ZERO
      audit_type: AUDIT-PC
      is_valid_score: true
      risk_category: Lower Risk
      simplified_risk_level: Lower Risk
      auditc_positive_screen: false
      brief_intervention_indicated: false
      requires_specialist_intervention: false
    - id: SYN_PC_NEGATIVE
      audit_type: AUDIT-PC
      is_valid_score: false
      risk_category: Invalid
      simplified_risk_level: null
      auditc_positive_screen: false
      brief_intervention_indicated: false
      requires_specialist_intervention: false
    - id: SYN_PC_BELOW
      audit_type: AUDIT-PC
      is_valid_score: true
      risk_category: Lower Risk
      simplified_risk_level: Lower Risk
      auditc_positive_screen: false
      brief_intervention_indicated: false
      requires_specialist_intervention: false
    - id: SYN_PC_POSITIVE
      audit_type: AUDIT-PC
      is_valid_score: true
      risk_category: Increasing Risk
      simplified_risk_level: Increasing Risk
      auditc_positive_screen: false
      brief_intervention_indicated: true
      requires_specialist_intervention: false
    - id: SYN_PC_SEVEN
      audit_type: AUDIT-PC
      is_valid_score: true
      risk_category: Increasing Risk
      simplified_risk_level: Increasing Risk
      auditc_positive_screen: false
      brief_intervention_indicated: true
      requires_specialist_intervention: false
    - id: SYN_PC_MAX
      audit_type: AUDIT-PC
      is_valid_score: true
      risk_category: Increasing Risk
      simplified_risk_level: Increasing Risk
      auditc_positive_screen: false
      brief_intervention_indicated: true
      requires_specialist_intervention: false
    - id: SYN_PC_OVER
      audit_type: AUDIT-PC
      is_valid_score: false
      risk_category: Invalid
      simplified_risk_level: null
      auditc_positive_screen: false
      brief_intervention_indicated: false
      requires_specialist_intervention: false
    - id: SYN_PC_FRACTION
      audit_type: AUDIT-PC
      is_valid_score: false
      risk_category: Invalid
      simplified_risk_level: null
      auditc_positive_screen: false
      brief_intervention_indicated: false
      requires_specialist_intervention: false
    - id: SYN_PC_DECIMAL
      audit_type: AUDIT-PC
      is_valid_score: true
      risk_category: Increasing Risk
      simplified_risk_level: Increasing Risk
      auditc_positive_screen: false
      brief_intervention_indicated: true
      requires_specialist_intervention: false
