models:
  - name: int_nice_alcohol_screen_intervention
    description: >-
      Alcohol brief interventions following a positive screen. One row per screening
      observation and code-list group, including inactive and deceased people. FAST scores of
      at least 3 or AUDIT-C scores of at least 5 qualify; full AUDIT does not. Interventions
      must occur from the screen date to three calendar months later, inclusive, by the build
      date. Null intervention dates mean none was recorded; declines do not count.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - screening_observation_id
              - source_cluster_id
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              (first_intervention_date IS NULL AND latest_intervention_date IS NULL)
              OR (first_intervention_date BETWEEN screen_date AND latest_intervention_date
                  AND latest_intervention_date <= DATEADD(month, 3, screen_date))
    columns:
      - name: screening_observation_id
        description: Source observation identifier; part of the observation and cluster key.
        data_tests:
          - not_null
      - name: source_cluster_id
        description: FAST_COD or AUDITC_COD cluster identifying the screening tool.
      - name: person_id
        description: Person who received the positive screen.
      - name: screen_date
        description: Date of the qualifying positive screen, on or before the build date.
      - name: screening_tool
        description: FAST or AUDIT-C.
      - name: score_value
        description: Valid score from the named tool, at least 3 for FAST or 5 for AUDIT-C.
      - name: latest_intervention_date
        description: Latest recorded intervention within zero to three calendar months after this screen; null if none by the build date.
      - name: first_intervention_date
        description: First recorded intervention within zero to three calendar months after this screen; null if none by the build date. A pair has completed by a historical date when this date is on or before it. The latest historical intervention must still be selected from events capped at that date.
