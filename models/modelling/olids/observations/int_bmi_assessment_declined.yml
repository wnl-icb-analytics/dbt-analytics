models:
  - name: int_bmi_assessment_declined
    description: >-
      BMI assessment declined from BMIDEC_COD. One row per person, concept and
      clinical date up to the build date. Includes all people with a matching
      record, including inactive and deceased people; no SMI-register or age
      restriction is applied.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: BMIDEC_COD