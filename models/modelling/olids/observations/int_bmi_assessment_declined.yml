models:
  - name: int_bmi_assessment_declined
    description: >-
      Declined BMI assessments in OLIDS GP records, using BMIDEC_COD. One row per
      person, concept and clinical date up to the build date. Includes inactive and
      deceased people, without age or SMI-register restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: BMIDEC_COD