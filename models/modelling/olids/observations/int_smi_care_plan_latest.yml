models:
  - name: int_smi_care_plan_latest
    description: >-
      Mental Health /SMI care pan for SMI registry replacement/QOF indicator MH002.
      Latest value for Mental Health /SMI care pan observation using MHP_COD cluster
      with currency flag in last 12 months
      Ties use the latest save time, then the highest observation ID.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: MHP_COD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [person_id]
