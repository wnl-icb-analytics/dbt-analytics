models:
  - name: int_fragility_fractures_all
    description: 'Fragility fracture observations for QOF osteoporosis register data collection and bone health monitoring.

      One row per PCD FF_COD observation for all persons, with fracture site classification. Includes fractures on or after 1 April 2012.'
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: FF_COD
            source: PCD
    columns:
      - name: id
        description: Unique identifier for each fragility fracture observation
        tests:
          - unique
          - not_null
