models:
  - name: int_csf_leak_latest
    description: >-
      Latest recorded cerebrospinal fluid leak record, by clinical date. One
      row per person with evidence in int_csf_leak_all dated no later than the
      build date. Includes all qualifying people, including inactive and
      deceased people; no SMI-register or age restriction is applied.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: PPV_CLINICAL_RISK_CSF_COD, CSFLATRISK1_COD