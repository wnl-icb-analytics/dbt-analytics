models:
  - name: int_csf_leak_latest
    description: >-
      Latest recorded cerebrospinal fluid leak evidence per person in NCL OLIDS, by clinical
      date up to the build date. Includes inactive and deceased people with qualifying
      evidence, without age or SMI-register restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: PPV_CLINICAL_RISK_CSF_COD, CSFLATRISK1_COD