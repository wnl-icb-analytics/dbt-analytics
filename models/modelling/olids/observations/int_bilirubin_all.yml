version: 2
models:
  - name: int_bilirubin_all
    description: >
      Total bilirubin results from the BILIRUBIN_LEVEL cluster, with unit standardisation
      and data quality flags. One row per distinct result: where the same result (person,
      clinical date, value, unit and concept) was entered more than once, only the earliest
      entry is kept (earliest date_recorded, then lowest id), so date_recorded is when the
      result was first entered. Applies a value-first standardisation workflow via the standardise_count_observation macro to infer
      correct units and values, then categorises by clinical severity. Standard unit: umol/L.
    config:
      meta:
        owner:
          name: ThomasShallcross
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - clinical_effective_date
              - original_result_value
              - original_result_unit_code
              - concept_code
      - cluster_ids_exist:
          arguments:
            cluster_ids: BILIRUBIN_LEVEL
    columns:
      - name: id
        description: Unique observation identifier
        data_tests:
          - not_null
          - unique
      - name: person_id
        description: Person identifier
        data_tests:
          - not_null
      - name: clinical_effective_date
        description: Date of observation
        data_tests:
          - not_null
      - name: date_recorded
        description: >
          Date the result was first entered in the source system. Where the
          same result was entered more than once, the earliest dated entry is
          kept. Use with clinical_effective_date for point-in-time views, as a
          result can be back-dated. NULL when no entry has a recorded date.
      - name: concept_code
        description: SNOMED code for the observation
      - name: code_description
        description: SNOMED code description
      - name: source_cluster_id
        description: Cluster ID from get_observations
      - name: original_result_value
        description: Raw value from source data before any conversion
      - name: original_result_unit_display
        description: Raw unit display text from source data
      - name: original_result_unit_code
        description: Raw unit code from source data
      - name: expected_measurement_type
        description: Always COUNT for this model
      - name: inferred_unit
        description: Standardised unit after inference (umol/L)
      - name: inferred_value
        description: Standardised numeric value after any conversion
      - name: value_was_converted
        description: TRUE if the numeric value was mathematically converted
      - name: unit_was_changed
        description: TRUE if inferred_unit differs from original_result_unit_code, NULL if inference failed
      - name: conversion_reason
        description: Human-readable explanation of standardisation action taken
      - name: confidence
        description: Confidence flag in the inferred value
        data_tests:
          - accepted_values:
              arguments:
                values: ['HIGH', 'MEDIUM', 'LOW']
      - name: is_negative
        description: TRUE if inferred value is negative
      - name: is_extreme_outlier
        description: TRUE if inferred value exceeds the BIOLOGICAL_UPPER bound from the observation_value_bounds seed
      - name: bilirubin_category
        description: Clinical severity category based on inferred value
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'Abnormal'
                  - 'Normal'
                  - 'Mildly Elevated'
                  - 'Moderately Elevated'
                  - 'Severely Elevated'

unit_tests:
- name: bilirubin_units_unchanged
  model: int_bilirubin_all
  overrides:
    macros:
      get_observations: |-
        SELECT column1::VARCHAR id, column2::NUMBER person_id,
        column3::TIMESTAMP_NTZ clinical_effective_date, column3::TIMESTAMP_NTZ date_recorded,
        column4::VARCHAR result_value, column5::VARCHAR result_unit_code,
        column5::VARCHAR result_unit_display, 'SYN_CODE'::VARCHAR mapped_concept_code,
        'Synthetic observation'::VARCHAR mapped_concept_display, 'BILIRUBIN_LEVEL'::VARCHAR cluster_id
        FROM VALUES ('SYN_BILI_1', -9300, '2026-01-01', 10, 'mg/dL'),
        ('SYN_BILI_2', -9301, '2026-01-01', -5, 'umol/L'),
        ('SYN_BILI_3', -9302, '2026-01-01', 2000, 'mg/dL'),
        ('SYN_BILI_CONVERT', -18113, '2026-01-01', 100000, 'pmol/L'),
        ('SYN_BILI_PREC', -18115, '2026-01-01', 123456.7, 'pmol/L')
  given:
  - input: ref('observation_unit_rules')
    rows:
    - DEFINITION_ID: null
      DEFINITION_NAME: bilirubin_level
      CONFIG_ID: null
      CONFIG_VERSION: null
      CONVERT_FROM_UNIT: umol/L
      CONVERT_TO_UNIT: umol/L
      MULTIPLY_BY: 1.0
      PRE_OFFSET: 0.0
      POST_OFFSET: 0.0
    - DEFINITION_ID: null
      DEFINITION_NAME: bilirubin_level
      CONFIG_ID: null
      CONFIG_VERSION: null
      CONVERT_FROM_UNIT: mg/dL
      CONVERT_TO_UNIT: umol/L
      MULTIPLY_BY: 17.1
      PRE_OFFSET: 0.0
      POST_OFFSET: 0.0
    - DEFINITION_ID: null
      DEFINITION_NAME: bilirubin_level
      CONFIG_ID: null
      CONFIG_VERSION: null
      CONVERT_FROM_UNIT: pmol/L
      CONVERT_TO_UNIT: umol/L
      MULTIPLY_BY: 1.0e-06
      PRE_OFFSET: 0.0
      POST_OFFSET: 0.0
    - DEFINITION_ID: null
      DEFINITION_NAME: bilirubin_level
      CONFIG_ID: null
      CONFIG_VERSION: null
      CONVERT_FROM_UNIT: mmol/L
      CONVERT_TO_UNIT: umol/L
      MULTIPLY_BY: 1000.0
      PRE_OFFSET: 0.0
      POST_OFFSET: 0.0
  - input: ref('observation_standard_units')
    rows:
    - DEFINITION_ID: null
      DEFINITION_NAME: bilirubin_level
      CONFIG_ID: null
      CONFIG_VERSION: null
      UNIT: umol/L
      PRIMARY_UNIT: true
  - input: ref('observation_value_bounds')
    rows:
    - DEFINITION_ID: null
      DEFINITION_NAME: bilirubin_level
      CONFIG_ID: null
      CONFIG_VERSION: null
      ABSOLUTE_LOWER: 0.0
      ABSOLUTE_UPPER: 1500.0
      CANONICAL_EXPONENT: null
      BIOLOGICAL_LOWER: null
      BIOLOGICAL_UPPER: 1000.0
  expect:
    rows:
    - id: SYN_BILI_1
      value_was_converted: false
      inferred_value: 10
      is_negative: false
      conversion_reason: No value conversion, unit was assumed to be incorrect
    - id: SYN_BILI_2
      value_was_converted: false
      conversion_reason: Value out of plausible range, kept unchanged
      inferred_value: -5
      is_negative: true
    - id: SYN_BILI_3
      value_was_converted: false
      conversion_reason: Value out of plausible range, kept unchanged
      inferred_value: 2000
      is_negative: false
    - id: SYN_BILI_CONVERT
      is_negative: false
      conversion_reason: Value converted using known unit factor (x1e-06)
      inferred_value: 0.1
      value_was_converted: true
    - id: SYN_BILI_PREC
      is_negative: false
      conversion_reason: Value converted using known unit factor (x1e-06)
      inferred_value: 0.123457
      value_was_converted: true
