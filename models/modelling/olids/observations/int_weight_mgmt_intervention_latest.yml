models:
- name: int_weight_mgmt_intervention_latest
  description: Latest recorded weight management, exercise intervention or decline per person in OLIDS,
    by clinical date up to the build date. Includes inactive and deceased people with a non-null intervention or decline outcome,
    without age or SMI-register restrictions. Same-day ties use clinical priority where relevant, save
    time and observation identifier.
  config:
    meta:
      owner:
        name: KateHomer55
  columns:
  - name: person_id
    data_tests:
    - unique
    - not_null
  data_tests:
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 1
