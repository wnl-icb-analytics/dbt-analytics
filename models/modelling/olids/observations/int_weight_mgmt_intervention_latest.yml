models:
  - name: int_weight_mgmt_intervention_latest
    description: >-
      Latest recorded weight management, exercise intervention or decline per person
      in OLIDS, by clinical date up to the build date. Includes inactive and deceased
      people with qualifying evidence, without age or SMI-register restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null
