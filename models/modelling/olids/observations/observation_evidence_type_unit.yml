      source: ECL_CACHE
      cluster_description: Synthetic list
      code_description: SYN_ADVICE
    - code: '226074007'
      cluster_id: NUTRIASS_COD
      source: PCD
      cluster_description: Synthetic list
      code_description: Dietary intake assessment using food frequency questionnaire
