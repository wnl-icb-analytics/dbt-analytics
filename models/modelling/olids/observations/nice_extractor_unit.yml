unit_tests:
- name: nice_port_egfr_reporting_day_and_value_free_test
  model: int_egfr_test_all
  given:
  - input: ref('stg_reference_combined_codesets')
    format: sql
    rows: |-
      SELECT column1::VARCHAR AS code, column2::VARCHAR AS cluster_id, column3::VARCHAR AS source, column4::VARCHAR AS cluster_description, column5::VARCHAR AS code_description
      FROM VALUES
          ('SYN_EGFR', 'EGFR_COD', 'PCD', 'Synthetic', 'Synthetic'),
          ('SYN_CREAT', 'CREAT_COD', 'PCD', 'Synthetic', 'Synthetic')
  - input: ref('stg_olids_observation')
    format: sql
    rows: |-
      SELECT column1::VARCHAR AS id, column2::VARCHAR AS patient_id, column3::NUMBER AS person_id, column4::TIMESTAMP_NTZ AS clinical_effective_date, column5::TIMESTAMP_NTZ AS date_recorded, column6::VARCHAR AS result_value, column7::VARCHAR AS mapped_concept_code, column8::VARCHAR AS mapped_concept_display, column9::VARCHAR AS result_units_source_concept_id, column10::VARCHAR AS result_unit_code, column11::VARCHAR AS result_unit_display, column12::VARCHAR AS result_text, column13::VARCHAR AS allergy_medication_name, column14::VARCHAR AS mapped_concept_id, column15::VARCHAR AS episodicity_source_concept_id, column16::BOOLEAN AS is_problem, column17::BOOLEAN AS is_review, column18::TIMESTAMP_NTZ AS problem_end_date, column19::TIMESTAMP_NTZ AS lds_transform_datetime, column20::NUMBER AS age_at_event
      FROM VALUES
          ('SYN_OLD', 'SYN_P', -98001, '2024-01-01', '2024-01-02', '80', 'SYN_EGFR', 'Synthetic eGFR', NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL),
          ('SYN_NO_VALUE', 'SYN_P', -98001, '2024-01-02', '2024-01-03', NULL, 'SYN_EGFR', 'Synthetic eGFR', NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL),
          ('SYN_NOON', 'SYN_P', -98001, DATEADD(hour, 12, DATEADD(day, 0, CURRENT_DATE()::TIMESTAMP_NTZ)), DATEADD(hour, 18, DATEADD(day, 0, CURRENT_DATE()::TIMESTAMP_NTZ)), '80', 'SYN_EGFR', 'Synthetic eGFR', NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL),
          ('SYN_FUTURE', 'SYN_P', -98001, DATEADD(hour, 12, DATEADD(day, 1, CURRENT_DATE()::TIMESTAMP_NTZ)), DATEADD(hour, 18, DATEADD(day, 1, CURRENT_DATE()::TIMESTAMP_NTZ)), '80', 'SYN_EGFR', 'Synthetic eGFR', NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL),
          ('SYN_CREAT', 'SYN_P', -98001, '2024-01-01', '2024-01-02', '80', 'SYN_CREAT', 'Synthetic creatinine', NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL)
  expect:
    rows:
    - clinical_effective_date: '2024-01-01 00:00:00'
      is_result_recorded: true
    - clinical_effective_date: '2024-01-02 00:00:00'
      is_result_recorded: false
    - clinical_effective_date: '{{ run_started_at.strftime(''%Y-%m-%d'') }} 12:00:00'
      is_result_recorded: true
  overrides:
    macros:
      # Fusion 2.0.6 probes unmocked SQL and cannot parse UUID columns.
      # Supply types for the empty schema probe; actual SQL still uses mocked inputs.
      get_empty_subquery_sql: |-
        SELECT NULL::VARCHAR AS id, NULL::NUMBER AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::VARCHAR AS concept_code, NULL::VARCHAR AS concept_display, NULL::VARCHAR AS source_cluster_id, NULL::BOOLEAN AS is_result_recorded WHERE FALSE
- name: nice_port_alcohol_pair_requires_positive_fast_or_auditc_by_reporting_day
  model: int_nice_alcohol_screen_intervention
  given:
  - input: ref('int_alcohol_screening_all')
    format: sql
    rows: |-
      SELECT column1::VARCHAR AS id, column2::VARCHAR AS source_cluster_id, column3::NUMBER AS person_id, column4::TIMESTAMP_NTZ AS clinical_effective_date, column5::VARCHAR AS screening_tool, column6::FLOAT AS score_value
      FROM VALUES
          ('SYN_FAST', 'FAST_COD', -98001, '2024-01-01', 'FAST', 3),
          ('SYN_AUDITC', 'AUDITC_COD', -98001, '2024-01-02', 'AUDIT-C', 5),
          ('SYN_FAST_LOW', 'FAST_COD', -98001, '2024-01-03', 'FAST', 2),
          ('SYN_AUDITC_LOW', 'AUDITC_COD', -98001, '2024-01-04', 'AUDIT-C', 4),
          ('SYN_AUDIT', 'AUDIT_COD', -98001, '2024-01-05', 'AUDIT', 20),
          ('SYN_FUTURE', 'FAST_COD', -98001, '2999-01-01', 'FAST', 3)
  - input: ref('int_alcohol_intervention')
    format: sql
    rows: |-
      SELECT NULL::NUMBER AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::VARCHAR AS alcohol_advice_services WHERE FALSE
  expect:
    rows:
    - source_cluster_id: FAST_COD
    - source_cluster_id: AUDITC_COD
  overrides:
    macros:
      # Fusion 2.0.6 probes unmocked SQL and cannot parse UUID columns.
      # Supply types for the empty schema probe; actual SQL still uses mocked inputs.
      get_empty_subquery_sql: |-
        SELECT NULL::VARCHAR AS screening_observation_id, NULL::VARCHAR AS source_cluster_id, NULL::NUMBER AS person_id, NULL::DATE AS screen_date, NULL::VARCHAR AS screening_tool, NULL::FLOAT AS score_value, NULL::DATE AS latest_intervention_date, NULL::DATE AS first_intervention_date WHERE FALSE
