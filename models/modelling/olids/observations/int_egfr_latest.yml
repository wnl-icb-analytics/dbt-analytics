models:
  - name: int_egfr_latest
    description: >-
      Latest eligible eGFR, one row per person with a valid result dated on or before
      the build date, excluding the 1900-01-01 missing-date sentinel. Includes all
      people regardless of diagnosis, registration or death. Results are ordered by
      clinical calendar day descending, then source save time descending with nulls
      last, then observation ID descending. CKD stage labels and indicator flags
      describe the selected result; they do not establish persistence.

    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        data_tests:
          - unique
          - not_null
