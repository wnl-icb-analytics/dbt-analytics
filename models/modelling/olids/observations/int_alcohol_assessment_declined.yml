models:
  - name: int_alcohol_assessment_declined
    description: >-
      Alcohol assessment declined from ALCSCRNDEC_COD. One row per person,
      concept and clinical date up to the build date. Includes all people with
      a matching record, including inactive and deceased people; no
      SMI-register or age restriction is applied.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: ALCSCRNDEC_COD