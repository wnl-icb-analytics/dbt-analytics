models:
  - name: int_alcohol_assessment_declined
    description: >-
      Declined alcohol assessments in OLIDS GP records, using ALCSCRNDEC_COD. One row
      per person, concept and clinical date up to the build date. Includes inactive
      and deceased people, without age or SMI-register restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: ALCSCRNDEC_COD