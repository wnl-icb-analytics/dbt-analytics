models:
  - name: int_cholesterol_hdl_latest
    description: HDL cholesterol for all people, including inactive and deceased people. One row per person
      with a valid recorded result. Validity is filtered before ranking by clinical effective date descending,
      then observation ID descending for ties. People without valid results are absent. Valid means a
      positive, finite value with a recognised unit. Concentrations retain source precision after unit
      conversion; values are not rounded before comparison. Numeric bands support the HEART UK reference
      levels above 1.0 mmol/L for men and above 1.2 for women. No sex is inferred from the observation,
      and higher HDL is not necessarily protective.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://www.heartuk.org.uk/cholesterol/understanding-your-cholesterol-test-results-
        code_source: PCD
    columns:
      - name: id
        description: Source observation identifier. Used to break ties deterministically; it does not
          imply clinical priority.
      - name: person_id
        description: Person identifier. No active-registration or age restriction is applied.
        tests:
          - unique
          - not_null
      - name: clinical_effective_date
        description: Observation date after the shared OLIDS correction for events dated after their recording
          date.
      - name: clinical_effective_date_raw
        description: Original clinical effective date before the shared date correction.
      - name: date_recorded
        description: Date the observation was recorded in the source.
      - name: cholesterol_value
        description: Concentration in mmol/L, without display rounding. Null when a recorded unit is missing
          or unsupported. Consult the validity flag before using the value.
      - name: result_unit_display
        description: 'Standard unit: mmol/L. Null when the unit cannot be standardised.'
      - name: original_result_value
        description: Numeric result before unit conversion.
      - name: original_result_unit_code
        description: Mapped unit code where supplied, otherwise the source unit concept code. Null if
          neither is available.
      - name: original_result_unit_display
        description: Mapped unit label where supplied, otherwise the source unit concept label. Null if
          neither is available.
      - name: unit_status
        description: Whether the unit was recorded in standard form, converted, missing or unsupported.
          Missing concentration units are not inferred from the value.
      - name: concept_code
        description: Recorded mapped clinical concept code matched to the PCD cluster.
      - name: concept_display
        description: Recorded mapped clinical concept label.
      - name: source_cluster_id
        description: 'Authoritative PCD observation cluster: HDLCCHOL_COD.'
      - name: sampling_context
        description: Fasting, non-fasting or random only when specified in the PCD code description. Otherwise
          Not specified; no sampling status is inferred from the numeric value.
      - name: is_valid_cholesterol
        description: Whether the result satisfies the documented validity rule. False includes missing
          values and unsupported units.
      - name: cholesterol_category
        description: Numeric bands support the HEART UK reference levels above 1.0 mmol/L for men and
          above 1.2 for women. No sex is inferred from the observation, and higher HDL is not necessarily
          protective.
