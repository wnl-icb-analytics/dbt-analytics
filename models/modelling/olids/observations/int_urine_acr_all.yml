      is_valid_acr: true
      acr_category: A2 moderately increased (3-30)
      is_acr_elevated: true
      is_microalbuminuria: true
      is_macroalbuminuria: false
    - id: SYN_ABOVE_3
      acr_value: 3.01
      is_valid_acr: true
      acr_category: A2 moderately increased (3-30)
      is_acr_elevated: true
