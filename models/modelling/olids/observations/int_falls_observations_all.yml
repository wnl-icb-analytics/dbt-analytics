models:
  - name: int_falls_observations_all
    description: >
      All coded falls observations from the clinical record, used as the
      source for the QAdmissions feature `b_falls`. Falls are events rather
      than chronic diagnoses, so this model lives in the observations folder
      and produces one row per coded event (not per person). The wide
      feature row aggregates to person grain in int_qadmissions_features.

      Cluster source: QAdmissions 2023 paper-faithful codelist
      `FALLS_COD_Q`, ingested via DEFINITION_STORE.
    config:
      meta:
        owner:
          name: Thomas Shallcross
    data_tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: id
      - cluster_ids_exist:
          arguments:
            cluster_ids: FALLS_COD_Q
    columns:
      - name: id
        description: 'Unique identifier for the clinical observation.'
        data_tests:
          - unique
          - not_null
      - name: person_id
        description: 'Patient identifier.'
        data_tests:
          - not_null
      - name: clinical_effective_date
        description: 'Date the fall was clinically effective. Filtered to non-null and not in the future.'
        data_tests:
          - not_null
      - name: date_recorded
        description: >
          Date the observation was entered in the source system. Use with
          clinical_effective_date for point-in-time views, as an observation
          can be back-dated. May be NULL.
      - name: concept_code
        description: 'SNOMED concept code for the falls observation.'
      - name: concept_display
        description: 'Human-readable description of the SNOMED concept.'
      - name: source_cluster_id
        description: 'Source cluster identifier (FALLS_COD_Q for the QAdmissions falls codelist).'
