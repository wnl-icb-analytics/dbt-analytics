models:
  - name: int_lithium_level_all
    description: >
      Serum lithium level results from the PINCER lithium level codelist
      (OpenCodelists), one row per observation, for all people including
      inactive and deceased. lithium_level is the numeric result in mmol/L;
      about a quarter of records carry no value. is_in_therapeutic_range
      applies the 0.4 to 1.0 mmol/L range from NICE CG185 and the BNF, false
      when no value is recorded. Observations dated after the build date are
      excluded.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: PINCER/LITH_LEV
            source: OPENCODELISTS
    columns:
      - name: id
        description: Source observation identifier.
        data_tests:
          - not_null
          - unique
      - name: person_id
        description: Person identifier.
      - name: clinical_effective_date
        description: Date of the result.
      - name: lithium_level
        description: Serum lithium in mmol/L; null when the record carries no numeric value.
      - name: result_unit_display
        description: Unit as recorded; usually absent.
      - name: is_result_recorded
        description: Whether a numeric level is present.
      - name: is_in_therapeutic_range
        description: Level between 0.4 and 1.0 mmol/L inclusive; false when no value.
      - name: concept_code
        description: SNOMED code of the record.
      - name: concept_display
        description: Description of the record.
      - name: source_cluster_id
        description: Codelist that matched the code.
