models:
  - name: int_blood_pressure_all
    description: >-
      Blood pressure in mmHg, with one representative paired reading per
      person and clinical date up to the build date. The OLIDS population
      comes from NCL GP records. Includes all people with a complete reading
      in the ranges 40-350 mmHg systolic and 20-200 mmHg diastolic. The
      representative reading has the lowest systolic value that day, then the
      lowest diastolic value. Systolic and diastolic observations share a
      parent where available; unparented observations form one date-level pair
      using their maximum values. Home and ambulatory flags describe the
      representative reading. The hypertensive-range flag covers any
      qualifying reading that day, using 135/85 mmHg for home or ambulatory
      readings and 140/90 mmHg for other readings. Evidence comes from BP_COD,
      SYSBP_COD, DIASBP_COD, HOMEAMBBP_COD, ABPM_COD and HOMEBP_COD.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - effective_date
    columns:
      - name: person_id
        description: Person identifier
        tests:
          - not_null
      - name: effective_date
        description: |
          Date of blood pressure measurement. Uses clinical_effective_date unless
          it was in the future, in which case date_recorded is used as fallback.
        tests:
          - not_null
      - name: clinical_effective_date
        description: Backward-compatibility alias for effective_date
      - name: systolic_value
        description: Systolic blood pressure value in mmHg
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 40
                max_value: 350
                inclusive: true
      - name: diastolic_value
        description: Diastolic blood pressure value in mmHg
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 20
                max_value: 200
                inclusive: true
      - name: is_home_bp_event
        description: 'Boolean flag indicating the representative reading was recorded as home blood pressure (HOMEBP_COD, HOMEAMBBP_COD)'
      - name: is_abpm_bp_event
        description: 'Boolean flag indicating the representative reading was recorded as ambulatory blood pressure monitoring (ABPM_COD)'
      - name: is_hypertensive_range
        description: 'Boolean flag (date-level, any reading): ≥140/90 mmHg (clinic) or ≥135/85 mmHg (home/ABPM)'
      - name: result_unit_display
        description: 'Unit of measurement for blood pressure values (always mmHg)'
      - name: systolic_observation_id
        description: 'Observation identifier for the systolic reading of the representative paired event'
      - name: diastolic_observation_id
        description: 'Observation identifier for the diastolic reading of the representative paired event'
      - name: all_concept_codes
        description: 'Array of all clinical concept codes used in observations for this BP event date'
      - name: all_concept_displays
        description: 'Array of all clinical concept display names used in observations for this BP event date'
      - name: all_source_cluster_ids
        description: 'Array of all source cluster identifiers used in observations for this BP event date'