models:
  - name: int_blood_pressure_all
    description: >-
      Blood pressure in OLIDS GP records, one representative paired reading per person
      and clinical date up to the build date. Includes complete readings within 40-350
      mmHg systolic and 20-200 mmHg diastolic, with systolic above diastolic.
      Unparented components pair only within the same date and context group.
      The representative is the lowest
      systolic, then diastolic reading. Its home or ambulatory setting can differ from
      the reading that triggered the daily hypertensive-range flag.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: systolic_value > diastolic_value
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - effective_date
    columns:
      - name: person_id
        description: Person identifier
        tests:
          - not_null
      - name: effective_date
        description: |
          Date of blood pressure measurement. Uses clinical_effective_date unless
          it was in the future, in which case date_recorded is used as fallback.
        tests:
          - not_null
      - name: clinical_effective_date
        description: Backward-compatibility alias for effective_date
      - name: systolic_value
        description: >-
          Representative systolic blood pressure in mmHg, within 40-350. Paired observations
          share a parent where available. Unparented observations form one pair per date and context group
          using the maximum systolic and maximum diastolic values. The lowest systolic pair,
          then lowest diastolic, represents the date.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 40
                max_value: 350
                inclusive: true
      - name: diastolic_value
        description: >-
          Diastolic blood pressure in mmHg for the representative paired reading, within
          20-200. Pairing and representative selection are described on systolic_value.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 20
                max_value: 200
                inclusive: true
      - name: is_home_bp_event
        description: True for HOME and ABPM readings through HOMEAMBBP_COD. Use bp_context_group for an unambiguous setting.
      - name: is_abpm_bp_event
        description: 'Boolean flag indicating the representative reading was recorded as ambulatory blood pressure monitoring (ABPM_COD)'
      - name: is_hypertensive_range
        description: >-
          True if any qualifying paired reading that day has systolic at least 135 or
          diastolic at least 85 mmHg for home or ambulatory readings, or systolic at least 140
          or diastolic at least 90 for clinic readings. Can differ from the representative
          reading.
      - name: result_unit_display
        description: 'Unit of measurement for blood pressure values (always mmHg)'
      - name: systolic_observation_id
        description: 'Observation identifier for the systolic reading of the representative paired event'
      - name: diastolic_observation_id
        description: 'Observation identifier for the diastolic reading of the representative paired event'
      - name: all_concept_codes
        description: 'Array of all clinical concept codes used in observations for this BP event date'
      - name: all_concept_displays
        description: 'Array of all clinical concept display names used in observations for this BP event date'
      - name: all_source_cluster_ids
        description: >-
          All source clusters contributing that day: BP_COD, SYSBP_COD, DIASBP_COD,
          HOMEAMBBP_COD, ABPM_COD and HOMEBP_COD.
      - name: bp_context_group
        description: Representative reading setting, CLINIC, HOME or ABPM, from concept-level cluster membership.
        data_tests:
          - accepted_values:
              arguments:
                values: [CLINIC, HOME, ABPM]

unit_tests:
- name: bp_context_pairing_and_validity
  model: int_blood_pressure_all
  given:
  - input: ref('int_blood_pressure_observations_base')
    format: sql
    rows: |-
      SELECT 'SYN_BP_0'::VARCHAR AS id, -9301::NUMBER AS person_id, '2026-08-06'::DATE AS effective_date, NULL::VARCHAR AS parent_observation_id, 150::FLOAT AS result_value, 'SYN_CODE'::VARCHAR AS concept_code, 'Synthetic BP'::VARCHAR AS concept_display, 'SYSBP_COD'::VARCHAR AS source_cluster_id, 'CLINIC'::VARCHAR AS bp_context_group, TRUE::BOOLEAN AS is_systolic_row, FALSE::BOOLEAN AS is_diastolic_row, FALSE::BOOLEAN AS is_home_bp_row, FALSE::BOOLEAN AS is_abpm_bp_row
      UNION ALL
      SELECT 'SYN_BP_1'::VARCHAR AS id, -9301::NUMBER AS person_id, '2026-08-06'::DATE AS effective_date, NULL::VARCHAR AS parent_observation_id, 130::FLOAT AS result_value, 'SYN_CODE'::VARCHAR AS concept_code, 'Synthetic BP'::VARCHAR AS concept_display, 'SYSBP_COD'::VARCHAR AS source_cluster_id, 'HOME'::VARCHAR AS bp_context_group, TRUE::BOOLEAN AS is_systolic_row, FALSE::BOOLEAN AS is_diastolic_row, TRUE::BOOLEAN AS is_home_bp_row, FALSE::BOOLEAN AS is_abpm_bp_row
      UNION ALL
      SELECT 'SYN_BP_2'::VARCHAR AS id, -9301::NUMBER AS person_id, '2026-08-06'::DATE AS effective_date, NULL::VARCHAR AS parent_observation_id, 80::FLOAT AS result_value, 'SYN_CODE'::VARCHAR AS concept_code, 'Synthetic BP'::VARCHAR AS concept_display, 'DIASBP_COD'::VARCHAR AS source_cluster_id, 'HOME'::VARCHAR AS bp_context_group, FALSE::BOOLEAN AS is_systolic_row, TRUE::BOOLEAN AS is_diastolic_row, TRUE::BOOLEAN AS is_home_bp_row, FALSE::BOOLEAN AS is_abpm_bp_row
      UNION ALL
      SELECT 'SYN_BP_3'::VARCHAR AS id, -9301::NUMBER AS person_id, '2026-08-07'::DATE AS effective_date, 'SYN_INVERTED'::VARCHAR AS parent_observation_id, 120::FLOAT AS result_value, 'SYN_CODE'::VARCHAR AS concept_code, 'Synthetic BP'::VARCHAR AS concept_display, 'SYSBP_COD'::VARCHAR AS source_cluster_id, 'CLINIC'::VARCHAR AS bp_context_group, TRUE::BOOLEAN AS is_systolic_row, FALSE::BOOLEAN AS is_diastolic_row, FALSE::BOOLEAN AS is_home_bp_row, FALSE::BOOLEAN AS is_abpm_bp_row
      UNION ALL
      SELECT 'SYN_BP_4'::VARCHAR AS id, -9301::NUMBER AS person_id, '2026-08-07'::DATE AS effective_date, 'SYN_INVERTED'::VARCHAR AS parent_observation_id, 130::FLOAT AS result_value, 'SYN_CODE'::VARCHAR AS concept_code, 'Synthetic BP'::VARCHAR AS concept_display, 'DIASBP_COD'::VARCHAR AS source_cluster_id, 'CLINIC'::VARCHAR AS bp_context_group, FALSE::BOOLEAN AS is_systolic_row, TRUE::BOOLEAN AS is_diastolic_row, FALSE::BOOLEAN AS is_home_bp_row, FALSE::BOOLEAN AS is_abpm_bp_row
      UNION ALL
      SELECT 'SYN_BP_5'::VARCHAR AS id, -9301::NUMBER AS person_id, '2026-08-07'::DATE AS effective_date, 'SYN_OK'::VARCHAR AS parent_observation_id, 150::FLOAT AS result_value, 'SYN_CODE'::VARCHAR AS concept_code, 'Synthetic BP'::VARCHAR AS concept_display, 'SYSBP_COD'::VARCHAR AS source_cluster_id, 'CLINIC'::VARCHAR AS bp_context_group, TRUE::BOOLEAN AS is_systolic_row, FALSE::BOOLEAN AS is_diastolic_row, FALSE::BOOLEAN AS is_home_bp_row, FALSE::BOOLEAN AS is_abpm_bp_row
      UNION ALL
      SELECT 'SYN_BP_6'::VARCHAR AS id, -9301::NUMBER AS person_id, '2026-08-07'::DATE AS effective_date, 'SYN_OK'::VARCHAR AS parent_observation_id, 85::FLOAT AS result_value, 'SYN_CODE'::VARCHAR AS concept_code, 'Synthetic BP'::VARCHAR AS concept_display, 'DIASBP_COD'::VARCHAR AS source_cluster_id, 'CLINIC'::VARCHAR AS bp_context_group, FALSE::BOOLEAN AS is_systolic_row, TRUE::BOOLEAN AS is_diastolic_row, FALSE::BOOLEAN AS is_home_bp_row, FALSE::BOOLEAN AS is_abpm_bp_row
      UNION ALL
      SELECT 'SYN_BP_7'::VARCHAR AS id, -9301::NUMBER AS person_id, '2026-08-08'::DATE AS effective_date, 'SYN_INV_ONLY'::VARCHAR AS parent_observation_id, 100::FLOAT AS result_value, 'SYN_CODE'::VARCHAR AS concept_code, 'Synthetic BP'::VARCHAR AS concept_display, 'SYSBP_COD'::VARCHAR AS source_cluster_id, 'CLINIC'::VARCHAR AS bp_context_group, TRUE::BOOLEAN AS is_systolic_row, FALSE::BOOLEAN AS is_diastolic_row, FALSE::BOOLEAN AS is_home_bp_row, FALSE::BOOLEAN AS is_abpm_bp_row
      UNION ALL
      SELECT 'SYN_BP_8'::VARCHAR AS id, -9301::NUMBER AS person_id, '2026-08-08'::DATE AS effective_date, 'SYN_INV_ONLY'::VARCHAR AS parent_observation_id, 100::FLOAT AS result_value, 'SYN_CODE'::VARCHAR AS concept_code, 'Synthetic BP'::VARCHAR AS concept_display, 'DIASBP_COD'::VARCHAR AS source_cluster_id, 'CLINIC'::VARCHAR AS bp_context_group, FALSE::BOOLEAN AS is_systolic_row, TRUE::BOOLEAN AS is_diastolic_row, FALSE::BOOLEAN AS is_home_bp_row, FALSE::BOOLEAN AS is_abpm_bp_row
  overrides:
    macros:
      get_empty_subquery_sql: SELECT NULL::VARCHAR AS id, NULL::NUMBER AS person_id, NULL::DATE AS effective_date,
        NULL::VARCHAR AS parent_observation_id, NULL::FLOAT AS result_value, NULL::VARCHAR AS concept_code, NULL::VARCHAR
        AS concept_display, NULL::VARCHAR AS source_cluster_id, NULL::VARCHAR AS bp_context_group, NULL::BOOLEAN
        AS is_systolic_row, NULL::BOOLEAN AS is_diastolic_row, NULL::BOOLEAN AS is_home_bp_row, NULL::BOOLEAN AS
        is_abpm_bp_row, NULL::FLOAT AS systolic_value, NULL::FLOAT AS diastolic_value WHERE FALSE
  expect:
    rows:
    - person_id: -9301
      effective_date: '2026-08-06'
      systolic_value: 130
      diastolic_value: 80
      bp_context_group: HOME
    - person_id: -9301
      effective_date: '2026-08-07'
      systolic_value: 150
      diastolic_value: 85
      bp_context_group: CLINIC
