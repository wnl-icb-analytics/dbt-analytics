models:
- name: int_cancer_care_review_invitations_all
  description: Cancer care review invitations from PCD CANINVITE_COD. One row per observation for all
    people, including inactive and deceased people. Consumers bound clinical invitation dates at their
    reporting date.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - cluster_ids_exist:
      arguments:
        cluster_ids: CANINVITE_COD
        source: PCD
  columns:
  - name: id
    description: Source observation identifier.
    data_tests:
    - not_null
    - unique
  - name: person_id
    description: Person with the record.
  - name: clinical_effective_date
    description: Corrected clinical evidence date.
  - name: source_cluster_id
    description: PCD code list identifying the evidence.
