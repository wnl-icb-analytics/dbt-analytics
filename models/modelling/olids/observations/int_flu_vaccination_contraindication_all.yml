models:
  - name: int_flu_vaccination_contraindication_all
    description: >
      Seasonal influenza vaccination contraindication records from the PCD
      cluster FLUEXPCON_COD, one row per observation for all people including
      inactive and deceased. Observations dated after the build date are
      excluded. The NICE flu indicators treat a record in the preceding 12
      months as an exclusion.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: FLUEXPCON_COD
            source: PCD
    columns:
      - name: id
        description: Source observation identifier.
        data_tests:
          - unique
          - not_null
      - name: person_id
        description: Person identifier.
      - name: clinical_effective_date
        description: Date of the record.
      - name: concept_code
        description: SNOMED code of the record.
      - name: concept_display
        description: Description of the record.
      - name: source_cluster_id
        description: Always FLUEXPCON_COD.
