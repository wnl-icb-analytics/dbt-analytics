models:
- name: int_smoke_exposure_all
  description: Passive tobacco exposure status, one row per observation for all people. SMOKE_EXPOSURE_COD
    includes positive and negative exposure status, including history of second-hand smoke exposure and
    household smoking status. Advice, risk and family smoking alone do not count. Corrected
    clinical dates through today; inactive and deceased people are retained.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - observation_id
  - cluster_ids_exist:
      arguments:
        cluster_ids: SMOKE_EXPOSURE_COD
        source: ECL_CACHE
  columns:
  - name: person_id
    description: Person with the evidence.
  - name: observation_id
    description: Source event identifier.
  - name: event_date
    description: Clinical calendar date; observations use the shared source-date correction.
