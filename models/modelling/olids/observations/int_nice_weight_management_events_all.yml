models:
- name: int_nice_weight_management_events_all
  description: Weight management events. One row per observation, source and matching cluster for all
    people, including inactive and deceased people. ECL_CACHE WEIGHT_MGMT_REFERRAL_COD excludes NDPP and
    total diet replacement referrals. WEIGHT_MGMT_ATTENDING_COD includes total diet replacement commencement;
    WEIGHT_MGMT_ENDED_COD includes completion or non-completion, but excludes never-commenced programmes.
    ECL_CACHE WEIGHT_MGMT_OFFERED and PCD WTMGREFDEC_COD identify offers and declined referrals. Offers
    and declines are not referrals. Future clinical dates are excluded.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - id
        - source
        - source_cluster_id
  - cluster_ids_exist:
      arguments:
        cluster_ids: WEIGHT_MGMT_REFERRAL_COD, WEIGHT_MGMT_ATTENDING_COD, WEIGHT_MGMT_ENDED_COD, WEIGHT_MGMT_OFFERED
        source: ECL_CACHE
  - cluster_ids_exist:
      arguments:
        cluster_ids: WTMGREFDEC_COD
        source: PCD
  columns:
  - name: event_date
    description: Corrected clinical date.
  - name: is_referral
    description: Referral to a named weight management programme or service.
  - name: is_offer
    description: Offer of a weight management referral.
  - name: is_decline
    description: Declined referral, which demonstrates an offer.
  - name: is_attendance
    description: Started or attended a programme.
  - name: is_end
    description: Programme ended, completed or not completed.
