models:
  - name: int_weight_mgmt_intervention
    description: 'WEIGHT MANAGEMENT INTERVENTIONS. EXERCISE AND DIET. Built for SMI Longer Lives campaign using SMI_LONGER_LIVES_WEIGHT_MANAGEMENT , EXERCISEINT_COD , WTMGINT_COD , WTMGINTDEC_COD. Includes Declined'

    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: SMI_LONGER_LIVES_WEIGHT_MANAGEMENT, EXERCISEINT_COD, WTMGINT_COD, WTMGINTDEC_COD
    columns:
      - name: person_id
        tests:
          - not_null
