models:
  - name: int_referral_pulmonary_rehab
    description: 'Determine referral to pulmonary rehabilitation including declined, attendance and not suitable using PCD REFSET: PULRHBPU_COD - patient not suitable, PULRHBATT_COD attended, PULRHBOFF_COD offered, PULRHBDEC_COD declined. One row per person, concept and calendar date, from all four clusters; includes inactive and deceased people. Events dated after today are excluded; undated events are kept with the 1900-01-01 placeholder date. Same-day evidence uses the latest save time, then the highest observation ID. The selected source timestamp is retained separately from the calendar date.'
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - concept_code
              - clinical_effective_date
      - cluster_ids_exist:
          arguments:
            cluster_ids: PULRHBPU_COD, PULRHBATT_COD, PULRHBOFF_COD, PULRHBDEC_COD
    columns:
      - name: clinical_effective_at
        description: Selected clinical timestamp before conversion to the calendar date.
      - name: observation_id
        description: Source observation selected within the model's event grain.
      - name: date_recorded
        description: EMIS save time of the selected observation; null when unavailable.

unit_tests:
  - name: pulmonary_rehab_deduplicates_calendar_dates
    model: int_referral_pulmonary_rehab
    given: []
    overrides:
      macros:
        get_observations: |
          SELECT column3::TIMESTAMP_NTZ AS date_recorded, -18007::NUMBER AS person_id, column1::VARCHAR AS id,
            column2::TIMESTAMP_NTZ AS clinical_effective_date,
            'SYN_REF'::VARCHAR AS mapped_concept_code,
            'Synthetic referral'::VARCHAR AS mapped_concept_display,
            'PULRHBOFF_COD'::VARCHAR AS cluster_id
          FROM VALUES ('SYN_A', '2024-03-01 09:00:00', '2024-03-04'),
            ('SYN_B', '2024-03-01 15:00:00', '2024-03-02'), ('SYN_C', '2024-03-02 09:00:00', '2024-03-03')
    expect:
      rows:
        - person_id: -18007
          concept_code: SYN_REF
          observation_id: SYN_A
          clinical_effective_date: '2024-03-01'
          clinical_effective_at: '2024-03-01 09:00:00'
          pr_obs_type: Pulmonary Rehab Offered
        - person_id: -18007
          concept_code: SYN_REF
          observation_id: SYN_C
          clinical_effective_date: '2024-03-02'
          clinical_effective_at: '2024-03-02 09:00:00'
          pr_obs_type: Pulmonary Rehab Offered
