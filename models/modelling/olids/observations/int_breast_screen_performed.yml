models:
  - name: int_breast_screen_performed
    description: >-
      Recorded breast screening in OLIDS GP records from BRCANSCR_COD, one row per
      observation up to the build date. Includes inactive and deceased people without
      screening-age, sex or SMI-register restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: BRCANSCR_COD