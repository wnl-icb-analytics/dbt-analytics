models:
- name: int_nice_epilepsy_pregnancy_advice_all
  description: Epilepsy pregnancy advice records from EPILCC_COD, EPILPA_COD, EPILPCA_COD. One row per
    observation and matching source cluster for all people, including inactive and deceased people. Future
    clinical dates are excluded.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - id
        - source_cluster_id
  - cluster_ids_exist:
      arguments:
        cluster_ids: EPILCC_COD, EPILPA_COD, EPILPCA_COD
        source: PCD
  columns:
  - name: event_date
    description: Corrected clinical date.
  - name: source_cluster_id
    description: Existing cluster identifying the evidence.
