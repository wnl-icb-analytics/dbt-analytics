version: 2
models:
  - name: int_haemoglobin_latest
    description: >
      Latest valid haemoglobin observation per person. Filters to observations with a non-null inferred
      value in the plausible g/L range after conversion, excluding negative values and extreme outliers.
    config:
      meta:
        owner:
          name: ThomasShallcross
    columns:
      - name: id
        description: Unique observation identifier
        data_tests:
          - not_null
          - unique
      - name: person_id
        description: Person identifier
        data_tests:
          - not_null
          - unique
      - name: clinical_effective_date
        description: Date of the most recent valid haemoglobin observation
      - name: concept_code
        description: SNOMED code for the observation
      - name: code_description
        description: SNOMED code description
      - name: source_cluster_id
        description: Cluster ID from get_observations
      - name: original_result_value
        description: Raw value from source data before any conversion
      - name: original_result_unit_display
        description: Raw unit display text from source data
      - name: original_result_unit_code
        description: Raw unit code from source data
      - name: expected_measurement_type
        description: Always COUNT for this model
      - name: inferred_unit
        description: Standardised unit (g/L)
      - name: inferred_value
        description: Standardised numeric value after any conversion
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 25
                max_value: 300
                inclusive: true
      - name: value_was_converted
        description: TRUE if the numeric value was mathematically converted
      - name: unit_was_changed
        description: TRUE if inferred_unit differs from original_result_unit_code
      - name: conversion_reason
        description: Human-readable explanation of standardisation action taken
      - name: confidence
        description: Confidence level in the inferred value
      - name: haemoglobin_category
        description: Clinical severity category based on inferred value

unit_tests:
- name: haemoglobin_latest_skips_out_of_range
  model: int_haemoglobin_latest
  given:
  - input: ref('int_haemoglobin_all')
    format: sql
    rows: |-
      SELECT 'SYN_VALID'::VARCHAR AS id, -9301::FLOAT AS person_id, '2026-01-01'::TIMESTAMP_NTZ AS clinical_effective_date, NULL::VARCHAR AS concept_code, NULL::VARCHAR AS code_description, NULL::VARCHAR AS source_cluster_id, NULL::FLOAT AS original_result_value, NULL::VARCHAR AS original_result_unit_display, NULL::VARCHAR AS original_result_unit_code, NULL::VARCHAR AS expected_measurement_type, NULL::VARCHAR AS inferred_unit, 120::FLOAT AS inferred_value, NULL::BOOLEAN AS value_was_converted, NULL::BOOLEAN AS unit_was_changed, NULL::VARCHAR AS conversion_reason, NULL::VARCHAR AS confidence, NULL::VARCHAR AS haemoglobin_category, FALSE::BOOLEAN AS is_negative, FALSE::BOOLEAN AS is_extreme_outlier, FALSE::BOOLEAN AS is_out_of_range
      UNION ALL
      SELECT 'SYN_INVALID'::VARCHAR AS id, -9301::FLOAT AS person_id, '2026-02-01'::TIMESTAMP_NTZ AS clinical_effective_date, NULL::VARCHAR AS concept_code, NULL::VARCHAR AS code_description, NULL::VARCHAR AS source_cluster_id, NULL::FLOAT AS original_result_value, NULL::VARCHAR AS original_result_unit_display, NULL::VARCHAR AS original_result_unit_code, NULL::VARCHAR AS expected_measurement_type, NULL::VARCHAR AS inferred_unit, 1.5::FLOAT AS inferred_value, NULL::BOOLEAN AS value_was_converted, NULL::BOOLEAN AS unit_was_changed, NULL::VARCHAR AS conversion_reason, NULL::VARCHAR AS confidence, NULL::VARCHAR AS haemoglobin_category, FALSE::BOOLEAN AS is_negative, FALSE::BOOLEAN AS is_extreme_outlier, TRUE::BOOLEAN AS is_out_of_range
  expect:
    rows:
    - id: SYN_VALID
      person_id: -9301
      inferred_value: 120
  overrides:
    macros:
      get_empty_subquery_sql: SELECT NULL::VARCHAR AS id, NULL::VARCHAR AS concept_code, NULL::VARCHAR AS code_description,
        NULL::VARCHAR AS source_cluster_id, NULL::VARCHAR AS original_result_unit_display, NULL::VARCHAR AS original_result_unit_code,
        NULL::VARCHAR AS expected_measurement_type, NULL::VARCHAR AS inferred_unit, NULL::VARCHAR AS conversion_reason,
        NULL::VARCHAR AS confidence, NULL::VARCHAR AS haemoglobin_category, NULL::NUMBER AS person_id, NULL::TIMESTAMP_NTZ
        AS clinical_effective_date, NULL::FLOAT AS inferred_value, NULL::VARCHAR AS original_result_value, NULL::BOOLEAN
        AS value_was_converted, NULL::BOOLEAN AS unit_was_changed, NULL::BOOLEAN AS is_negative, NULL::BOOLEAN AS
        is_extreme_outlier, NULL::BOOLEAN AS is_out_of_range WHERE FALSE
