models:
  - name: int_medication_review
    description: >-
      Medication reviews against the SMI Longer Lives definition in OLIDS GP records,
      using ECL_CACHE SMI_LONGER_LIVES_MEDICINES_REVIEW. One row per person, concept
      and clinical date up to the build date. Includes inactive and deceased people,
      without age or SMI-register restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: SMI_LONGER_LIVES_MEDICINES_REVIEW
            source: ECL_CACHE
    columns:
      - name: person_id
        tests:
          - not_null
