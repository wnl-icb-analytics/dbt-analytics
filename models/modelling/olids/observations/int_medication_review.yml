models:
  - name: int_medication_review
    description: >-
      Medication reviews recorded against the SMI Longer Lives definition from
      SMI_LONGER_LIVES_MEDICINES_REVIEW in ECL_CACHE. The OLIDS population
      comes from NCL GP records. One row per person, concept and clinical date
      up to the build date. Includes all people with a matching record,
      including inactive and deceased people; no SMI-register or age
      restriction is applied.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: SMI_LONGER_LIVES_MEDICINES_REVIEW
            source: ECL_CACHE
    columns:
      - name: person_id
        tests:
          - not_null
