models:
  - name: int_alcohol_intervention_latest
    description: >-
      Latest recorded alcohol education, intervention or declined-intervention
      record, by clinical date. The OLIDS population comes from NCL GP
      records. One row per person with evidence in int_alcohol_intervention
      dated no later than the build date. Includes all qualifying people,
      including inactive and deceased people; no SMI-register or age
      restriction is applied.
    config:
      meta:
        owner:
          name: KateHomer55

          columns:
    columns:
      - name: person_id
        description: Person identifier
        tests:
          - not_null
          - unique
   


    
