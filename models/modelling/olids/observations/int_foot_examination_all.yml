models:
  - name: int_foot_examination_all
    description: >
      Diabetic foot examination events, one row per person and examination
      date, for all people including inactive and deceased. Examination
      evidence is the PCD FOOTEXAM_COD cluster (neuropathy, monofilament,
      pedal pulses, ABPI, diabetic foot screen, Townson scale and laterality
      risk findings) plus the FRC_COD foot risk classification findings.
      FEPU_COD and FEDEC_COD mark unsuitable and declined checks; AMPL_COD,
      AMPR_COD, CONABL_COD and CONABR_COD mark an amputated or absent foot as a
      permanent exemption. Codes with no left or right keyword that are not
      Townson are treated as bilateral. The FOOTEXAM_COD referral to the
      diabetic foot screener records a referral rather than an examination,
      so it never sets a checked flag; it is kept as has_screening_referral
      and in the code arrays for traceability. Feeds QOF DM012 style foot
      checks and NICE IND81 and IND160. has_monofilament_test distinguishes
      the monofilament foot sensation subset needed by IND160.
      First absent/amputated dates use the same corrected clinical dates,
      including the shared 1900 fallback for a missing clinical date. History
      compares these dates with its reference date. Existing all-time flags and
      examination statuses retain their current meaning.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: AMPL_COD, AMPR_COD, CONABL_COD, CONABR_COD, FEDEC_COD, FEPU_COD, FOOTEXAM_COD, FRC_COD
            source: PCD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - clinical_effective_date
    columns:
      - name: person_id
        description: Person identifier.
        data_tests:
          - not_null
      - name: clinical_effective_date
        description: Date of the records aggregated into the row.
      - name: is_unsuitable
        description: An unsuitable-for-examination code on the date.
      - name: is_declined
        description: A declined code on the date.
      - name: has_monofilament_test
        description: A FOOTEXAM_COD record whose maintained term names monofilament testing on the date; general foot examinations and risk classifications do not set this flag.
      - name: left_foot_checked
        description: Examination evidence for the left foot on the date; never set by a referral alone.
      - name: right_foot_checked
        description: Examination evidence for the right foot on the date; never set by a referral alone.
      - name: both_feet_checked
        description: A bilateral examination code, a Townson scale record, or left and right evidence on the same date.
      - name: left_foot_absent
        description: Congenital absence of the left foot recorded at any time.
      - name: right_foot_absent
        description: Congenital absence of the right foot recorded at any time.
      - name: left_foot_amputated
        description: Left foot amputation recorded at any time.
      - name: right_foot_amputated
        description: Right foot amputation recorded at any time.
      - name: left_foot_risk_level
        description: "Highest severity in the left foot codes on the date: Low, Moderate, High or Ulcerated (NICE NG19 order); null when none."
      - name: right_foot_risk_level
        description: "Highest severity in the right foot codes on the date: Low, Moderate, High or Ulcerated (NICE NG19 order); null when none."
      - name: townson_scale_level
        description: Townson scale level recorded on the date; null when none.
      - name: has_screening_referral
        description: A referral to the diabetic foot screener recorded on the date.
      - name: has_risk_classification
        description: A foot risk classification finding (FRC_COD) or an examination code carrying a risk descriptor on the date.
      - name: all_concept_codes
        description: All matched codes on the date, including any referral.
      - name: all_concept_displays
        description: Descriptions of all matched codes on the date.
      - name: all_source_cluster_ids
        description: Clusters matched on the date.
      - name: examination_status
        description: "Unsuitable, Declined, Complete - Both Feet, Complete with the other foot missing, Partial, Referred - Not Examined, or Not Done."
      - name: diabetes_foot_risk_category
        description: "Combined risk category from the foot risk levels: Ulcerated (High Risk), High Risk, Moderate Risk, Low Risk, Risk Not Specified or No Valid Examination."
      - name: first_left_foot_absent_date
        description: First corrected clinical date of CONABL_COD evidence; null without a matched record. History applies the absence only on or after this date.
      - name: first_right_foot_absent_date
        description: First corrected clinical date of CONABR_COD evidence; null without a matched record. History applies the absence only on or after this date.
      - name: first_left_foot_amputated_date
        description: First corrected clinical date of AMPL_COD evidence; null without a matched record. History applies the amputation only on or after this date.
      - name: first_right_foot_amputated_date
        description: First corrected clinical date of AMPR_COD evidence; null without a matched record. History applies the amputation only on or after this date.

unit_tests:
  - name: nice_foot_first_state_dates
    model: int_foot_examination_all
    overrides:
      macros:
        get_observations: |
          SELECT
              column1::VARCHAR AS id,
              column2::NUMBER AS person_id,
              column3::TIMESTAMP_NTZ AS clinical_effective_date,
              column4::VARCHAR AS cluster_id,
              column5::VARCHAR AS code_description,
              column4::VARCHAR AS mapped_concept_code,
              column5::VARCHAR AS mapped_concept_display
          FROM VALUES
              ('SYNTHETIC1', -9901, '2024-03-01', 'FOOTEXAM_COD', 'Monofilament examination left foot'),
              ('SYNTHETIC2', -9901, '2024-04-01', 'AMPR_COD', 'Amputation right foot'),
              ('SYNTHETIC3', -9901, '2024-05-01', 'AMPR_COD', 'Amputation right foot'),
              ('SYNTHETIC4', -9902, '2024-03-01', 'FOOTEXAM_COD', 'Monofilament examination left foot')
    given: []
    expect:
      rows:
        - person_id: -9901
          clinical_effective_date: '2024-03-01 00:00:00'
          first_right_foot_amputated_date: '2024-04-01'
          first_left_foot_amputated_date: null
          first_left_foot_absent_date: null
          first_right_foot_absent_date: null
        - person_id: -9901
          clinical_effective_date: '2024-04-01 00:00:00'
          first_right_foot_amputated_date: '2024-04-01'
          first_left_foot_amputated_date: null
          first_left_foot_absent_date: null
          first_right_foot_absent_date: null
        - person_id: -9901
          clinical_effective_date: '2024-05-01 00:00:00'
          first_right_foot_amputated_date: '2024-04-01'
          first_left_foot_amputated_date: null
          first_left_foot_absent_date: null
          first_right_foot_absent_date: null
        - person_id: -9902
          clinical_effective_date: '2024-03-01 00:00:00'
          first_right_foot_amputated_date: null
          first_left_foot_amputated_date: null
          first_left_foot_absent_date: null
          first_right_foot_absent_date: null
    config:
      tags: [monthly-full, nice-history]

  - name: foot_risk_uses_severity_order
    model: int_foot_examination_all
    overrides:
      macros:
        get_observations: |
          SELECT column1::VARCHAR AS id, column2::NUMBER AS person_id,
                 '2024-03-01'::TIMESTAMP_NTZ AS clinical_effective_date,
                 'FRC_COD'::VARCHAR AS cluster_id,
                 column3::VARCHAR AS code_description,
                 column1::VARCHAR AS mapped_concept_code,
                 column3::VARCHAR AS mapped_concept_display
          FROM VALUES
              ('SYN_1', -9911, 'Left diabetic foot at low risk'),
              ('SYN_2', -9911, 'Left diabetic foot at high risk'),
              ('SYN_3', -9912, 'Left diabetic foot at moderate risk'),
              ('SYN_4', -9912, 'Left diabetic foot ulcerated'),
              ('SYN_5', -9913, 'Townson scale level 1'),
              ('SYN_6', -9913, 'Right diabetic foot at high risk')
    given: []
    expect:
      rows:
        - {person_id: -9911, left_foot_risk_level: High, diabetes_foot_risk_category: High Risk}
        - {person_id: -9912, left_foot_risk_level: Ulcerated, diabetes_foot_risk_category: Ulcerated (High Risk)}
        - {person_id: -9913, left_foot_risk_level: Low, right_foot_risk_level: High, diabetes_foot_risk_category: High Risk}
