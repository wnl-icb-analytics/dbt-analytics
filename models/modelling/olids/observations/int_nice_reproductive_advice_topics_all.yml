models:
- name: int_nice_reproductive_advice_topics_all
  description: Reproductive counselling topics. One row per observation, source and matching cluster for
    all people, including inactive and deceased people. ECL_CACHE CONTRACEPTION_ADVICE_TOPIC_COD supplies
    contraception advice; PREGNANCY_ADVICE_TOPIC_COD supplies conception and pregnancy advice. PCD EPILCC_COD
    supplies contraception; EPILPA_COD and EPILPCA_COD supply conception and pregnancy. A code in both
    topic lists can meet both topics. Referrals, declines, uncompleted forms, isotretinoin risk forms
    and generic programme status do not count. Future clinical dates are excluded. Codes establish topic
    evidence, not tailoring to the individual.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - id
        - source
        - source_cluster_id
  - cluster_ids_exist:
      arguments:
        cluster_ids: CONTRACEPTION_ADVICE_TOPIC_COD, PREGNANCY_ADVICE_TOPIC_COD
        source: ECL_CACHE
  columns:
  - name: event_date
    description: Corrected clinical date.
  - name: is_contraception_topic
    description: Record supplies contraception information or counselling.
  - name: is_pregnancy_topic
    description: Record supplies conception or pregnancy information or counselling.
