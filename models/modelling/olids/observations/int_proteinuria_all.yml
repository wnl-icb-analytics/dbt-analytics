models:
  - name: int_proteinuria_all
    description: >
      Proteinuria, microalbuminuria and diabetic nephropathy records from the
      PCD clusters PRT_COD, CKDPRT_COD, NDAPRT_COD, MAL_COD and
      DIABNEPHROP_COD, one row per observation and cluster, for all people
      including inactive and deceased. record_type names the finding from its
      cluster. Observations dated after the build date are excluded. Feeds the
      NICE renin-angiotensin therapy indicators.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: PRT_COD, CKDPRT_COD, NDAPRT_COD, MAL_COD, DIABNEPHROP_COD
            source: PCD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id
              - source_cluster_id
    columns:
      - name: id
        description: Source observation identifier; one row per observation and cluster.
        data_tests:
          - not_null
      - name: person_id
        description: Person identifier.
      - name: clinical_effective_date
        description: Date of the record.
      - name: record_type
        description: "PROTEINURIA, CKD_PROTEINURIA, PERSISTENT_PROTEINURIA, MICROALBUMINURIA or DIABETIC_NEPHROPATHY."
        data_tests:
          - not_null
      - name: concept_code
        description: SNOMED code of the record.
      - name: concept_display
        description: Description of the record.
      - name: source_cluster_id
        description: Cluster that matched the code.
