models:
  - name: int_waist_circumference_all
    description: 'Waist circumference measurements for cardiovascular and metabolic risk assessment.

      One row per waist circumference observation using WAIST_COD cluster with a numeric result. Values outside 30-250 cm are kept and flagged is_valid_waist_circumference = FALSE with risk category Invalid; includes clinical risk categorisation.'
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: WAIST_COD
    columns:
      - name: id
        description: Unique identifier for each waist circumference observation
        tests:
          - unique
          - not_null