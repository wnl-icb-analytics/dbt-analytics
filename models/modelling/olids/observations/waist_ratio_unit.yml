- name: waist_latest_keeps_missing_ratio_and_resolves_same_day
  model: int_waist_circumference_latest
  overrides:
    macros:
      get_empty_subquery_sql: select null::number person_id,null::varchar id,null::float waist_to_height_ratio where
        false
  given:
  - input: ref('int_waist_circumference_all')
    format: sql
    rows: |-
      select person::number person_id,id::varchar id,dateadd(day,days,'2024-03-01'::date)::timestamp_ntz clinical_effective_date,
       saved::timestamp_ntz date_recorded,100::number(10,2) waist_circumference_value,
       'SYN_CODE'::varchar concept_code,'Synthetic waist'::varchar concept_display,'WAIST_COD'::varchar source_cluster_id,
       100::varchar original_result_value,'cm'::varchar original_result_unit_display,valid::boolean is_valid_waist_circumference,
       iff(ratio is null,null,200)::float height_cm,clinical_effective_date height_measurement_date,25::float bmi_value_at_waist,
       clinical_effective_date bmi_measurement_date,ratio::float waist_to_height_ratio,
       iff(ratio is null,null,'Increased central adiposity')::varchar waist_to_height_ratio_category
      from (values
      (-19600,'SYN_OLD',1,'2024-03-01 12:00:00',0.6,true),
      (-19600,'SYN_NEW_NO_HEIGHT',2,'2024-03-02 12:00:00',null,true),
      (-19601,'SYN_Z_EARLY',2,'2024-03-02 09:00:00',0.6,true),
      (-19601,'SYN_A_LATE',2,'2024-03-02 12:00:00',0.5,true),
      (-19602,'SYN_ID_A',2,'2024-03-02 12:00:00',0.6,true),
      (-19602,'SYN_ID_Z',2,'2024-03-02 12:00:00',0.5,true),
      (-19603,'SYN_INVALID',3,'2024-03-03 12:00:00',null,false),
      (-19603,'SYN_VALID_PRIOR',2,'2024-03-02 12:00:00',0.5,true)
      ) v(person,id,days,saved,ratio,valid)
  expect:
    rows:
    - person_id: -19600
      id: SYN_NEW_NO_HEIGHT
      waist_to_height_ratio: null
    - person_id: -19601
      id: SYN_A_LATE
      waist_to_height_ratio: 0.5
    - person_id: -19602
      id: SYN_ID_Z
      waist_to_height_ratio: 0.5
    - person_id: -19603
      id: SYN_VALID_PRIOR
      waist_to_height_ratio: 0.5
