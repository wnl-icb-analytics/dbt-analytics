models:
  - name: int_creatinine_all
    description: 'Serum creatinine measurements for kidney function assessment and CKD monitoring.

      One row per creatinine observation using CRE_COD cluster and clinical creatinine categorisation. Values outside 20-1000 µmol/L are kept and flagged is_valid_creatinine = false.'
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: CRE_COD
    columns:
      - name: id
        description: Unique identifier for each creatinine observation
        tests:
          - unique
          - not_null