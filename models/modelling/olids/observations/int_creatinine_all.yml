models:
  - name: int_creatinine_all
    description: 'Serum creatinine measurements for kidney function assessment and CKD monitoring.

      One row per creatinine observation using CRE_COD cluster with validity assessed at 20-1000 µmol/L and clinical creatinine categorisation.
      Values are interpreted on the µmol/L scale regardless of the source unit label. Accepted mg/dL-labelled results have µmol/L-scale values and are treated as mislabelled, without conversion. True mg/dL-scale values below 20 remain invalid.'
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: CRE_COD
    columns:
      - name: id
        description: Unique identifier for each creatinine observation
        tests:
          - unique
          - not_null