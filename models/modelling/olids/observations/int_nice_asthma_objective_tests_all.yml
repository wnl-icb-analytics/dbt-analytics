models:
- name: int_nice_asthma_objective_tests_all
  description: Asthma objective test evidence, one row per observation and test cluster for all people,
    including inactive and deceased people. FENO_COD, ASTSPIR_COD, PEFRVAR_COD, SKINTEST_COD, IGE_COD,
    BRONCCHALENG_COD, EOS_COUNT and FBC_COD. Corrected clinical dates through today; tests without numeric
    results are retained.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - observation_id
        - test_type
  - cluster_ids_exist:
      arguments:
        cluster_ids: FENO_COD, ASTSPIR_COD, PEFRVAR_COD, SKINTEST_COD, IGE_COD, BRONCCHALENG_COD, EOS_COUNT,
          FBC_COD
  columns:
  - name: person_id
    description: Person with the test record.
  - name: observation_id
    description: Source observation identifier.
  - name: event_date
    description: Corrected clinical calendar date.
  - name: test_type
    description: Maintained cluster identifier; one observation may match several clusters.
