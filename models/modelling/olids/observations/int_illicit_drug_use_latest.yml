models:
  - name: int_illicit_drug_use_latest
    description: >-
      Latest illicit-drug use or declined-assessment record from ILLSUB_COD
      and ILLSUBASSDEC_COD, by clinical date. The OLIDS population comes from
      NCL GP records. One row per person with qualifying evidence dated no
      later than the build date, including inactive and deceased people.
      Includes dependence, misuse, remission, overdose and negation records;
      presence here does not establish current substance misuse. Undated
      evidence has clinical date 1900-01-01.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: ILLSUB_COD