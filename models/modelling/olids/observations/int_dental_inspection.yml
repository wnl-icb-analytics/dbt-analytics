models:
  - name: int_dental_inspection
    description: 'Determine dental or mouth inspection. Built for SMI Longer Lives campaign using SMI_LONGER_LIVES_DENTAL, ORALHEALTHREV_COD, ORALHEALTHINT_COD'

    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - concept_code
              - clinical_effective_date
      - cluster_ids_exist:
          arguments:
            cluster_ids: SMI_LONGER_LIVES_DENTAL, ORALHEALTHREV_COD, ORALHEALTHINT_COD

    columns:
      - name: person_id
        tests:
          - not_null
      - name: concept_code
        tests:
          - not_null
      - name: clinical_effective_date
        tests:
          - not_null
