models:
  - name: int_cochlear_implant_latest
    description: >-
      Latest recorded cochlear implant evidence per person in OLIDS, by clinical date
      up to the build date. Includes inactive and deceased people with qualifying
      evidence, without age or SMI-register restrictions.
      Ties use the latest save time, then the highest observation ID.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: PPV_CLINICAL_RISK_COCHLEAR_IMPLANT_COD, COCIMPATRISK1_COD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [person_id]
