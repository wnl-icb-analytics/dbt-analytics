models:
  - name: int_cochlear_implant_latest
    description: >-
      Latest recorded cochlear implant record, by clinical date. One row per
      person with evidence in int_cochlear_implant_all dated no later than the
      build date. Includes all qualifying people, including inactive and
      deceased people; no SMI-register or age restriction is applied.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: PPV_CLINICAL_RISK_COCHLEAR_IMPLANT_COD, COCIMPATRISK1_COD