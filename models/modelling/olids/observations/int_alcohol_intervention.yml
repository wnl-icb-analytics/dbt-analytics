models:
  - name: int_alcohol_intervention
    description: >-
      Alcohol education, intervention and declined-intervention records from
      SMI_LONGER_LIVES_ALCOHOL_EDUCATION, ALCOHOLINT_COD, ALCSPADVDEC_COD and
      ALCBRINTDEC_COD. One row per person, concept and clinical date up to the
      build date. Includes all people with a matching record, including
      inactive and deceased people; no SMI-register or age restriction is
      applied.

    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: ALCBRINTDEC_COD, ALCOHOLINT_COD, ALCSPADVDEC_COD, SMI_LONGER_LIVES_ALCOHOL_EDUCATION
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - not_null
