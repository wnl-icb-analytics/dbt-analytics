models:
- name: int_nice_mart_all
  description: >-
    Recorded maintenance and reliever therapy (MART) regimens. One row per observation,
    including inactive and deceased people, through the build date. MART_COD includes recorded
    or started regimens. Anti-inflammatory reliever therapy alone, offers, declines and stopped
    regimens are excluded.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - observation_id
  - cluster_ids_exist:
      arguments:
        cluster_ids: MART_COD
        source: ECL_CACHE
  columns:
  - name: person_id
    description: Person with the evidence.
  - name: observation_id
    description: Source event identifier.
  - name: event_date
    description: Clinical calendar date; observations use the shared source-date correction.
