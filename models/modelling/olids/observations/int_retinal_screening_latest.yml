models:
  - name: int_retinal_screening_latest
    description: >-
      Last recorded completed retinal screening per person from RETSCREN_COD or
      CVDRETSCRN_COD. Includes inactive and deceased people with completion evidence.
      Clinical calendar date, latest save time and highest observation ID determine the
      selected event. The completion input does not exclude future clinical dates.
      Declines, referrals and unsuitable codes are outside this input.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null
