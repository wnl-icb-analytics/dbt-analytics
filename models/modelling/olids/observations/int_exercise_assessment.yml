models:
  - name: int_exercise_assessment
    description: 'EXERCISE ASSESSMENT patterns. Built for SMI Longer Lives campaign using clusters: SMI_LONGER_LIVES_EXERCISE_ASSESSMENT, EXERASS_COD, EXERASSDEC_COD. Includes Declined codes'

    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: SMI_LONGER_LIVES_EXERCISE_ASSESSMENT, EXERASS_COD, EXERASSDEC_COD
    columns:
      - name: person_id
        tests:
          - not_null
