models:
  - name: int_exercise_assessment
    description: >-
      Exercise assessments and declined assessments in OLIDS GP records, using
      SMI_LONGER_LIVES_EXERCISE_ASSESSMENT, EXERASS_COD and EXERASSDEC_COD. One row
      per person, concept and clinical date up to the build date. Includes inactive
      and deceased people, without age or SMI-register restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: SMI_LONGER_LIVES_EXERCISE_ASSESSMENT, EXERASS_COD, EXERASSDEC_COD
    columns:
      - name: person_id
        tests:
          - not_null
