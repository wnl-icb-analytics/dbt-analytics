models:
  - name: int_exercise_assessment
    description: >-
      Exercise assessments, including declined assessments from
      SMI_LONGER_LIVES_EXERCISE_ASSESSMENT, EXERASS_COD and EXERASSDEC_COD.
      One row per person, concept and clinical date up to the build date.
      Includes all people with a matching record, including inactive and
      deceased people; no SMI-register or age restriction is applied.

    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: SMI_LONGER_LIVES_EXERCISE_ASSESSMENT, EXERASS_COD, EXERASSDEC_COD
    columns:
      - name: person_id
        tests:
          - not_null
