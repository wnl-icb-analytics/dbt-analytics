models:
  - name: int_alcohol_units_all
    description: >-
      Alcohol consumption records from ALC_COD, one row per person and
      clinical date up to the build date. The OLIDS population comes from NCL
      GP records. Includes inactive and deceased people without an
      SMI-register or age restriction. Same-date records with a known risk
      category take priority over Unclear records. Recognised weekly-unit
      variants are labelled U/week; other units remain as supplied. Risk
      categories use coded drinking status or weekly consumption, with
      increasing risk from 15 units and higher risk from 35 units for women or
      50 for men. Gender is current, rather than historical.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: ALC_COD