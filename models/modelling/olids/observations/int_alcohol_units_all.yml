models:
  - name: int_alcohol_units_all
    description: >-
      Alcohol consumption from ALC_COD in NCL OLIDS GP records, one row per person and
      clinical date up to the build date. Includes inactive and deceased people
      without age or SMI-register restrictions. Known risk categories take priority on
      the same date. Weekly-unit variants use U/week; other units stay as recorded.
      Risk uses coded status or weekly units: increasing from 15, higher from 35 for
      women or 50 for men, using current gender.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: ALC_COD