models:
  - name: int_smoking_intervention_latest
    description: >-
      Latest recorded smoking cessation intervention or decline per person in OLIDS,
      by clinical date up to the build date. Includes inactive and deceased people
      with qualifying evidence, without age or SMI-register restrictions.
      Same-day records prefer completion, then other assistance, then decline,
      then the lowest concept code.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null




unit_tests:
- name: smoking_intervention_latest_same_day_precedence
  model: int_smoking_intervention_latest
  given:
  - input: ref('int_smoking_intervention')
    format: sql
    rows: |
      SELECT column1::NUMBER AS person_id, column2::TIMESTAMP_NTZ AS clinical_effective_date,
          column3::VARCHAR AS concept_code, column4::VARCHAR AS smoking_cessation_services
      FROM VALUES
          (-9601, '2024-03-01 15:00:00'::TIMESTAMP_NTZ, 'SYN_B', 'Declined'),
          (-9601, '2024-03-01 09:00:00'::TIMESTAMP_NTZ, 'SYN_C', 'Yes'),
          (-9601, '2024-02-01'::DATE, 'SYN_A', 'Yes'),
          (-9602, '2024-03-01'::DATE, 'SYN_A', 'Declined'),
          (-9602, '2024-03-01 15:00:00'::TIMESTAMP_NTZ, 'SYN_B', 'Other assistance'),
          (-9603, '2024-03-01 15:00:00'::TIMESTAMP_NTZ, 'SYN_B', 'Yes'),
          (-9603, '2024-03-01'::DATE, 'SYN_A', 'Yes'),
          (-18210, DATEADD(day, -2, CURRENT_DATE()), 'SYN_A', 'Yes'),
          (-18210, DATEADD(day, -1, CURRENT_DATE()), 'SYN_Z', 'Declined'),
          (-18211, DATEADD(day, -1, CURRENT_DATE()), 'SYN_Z', 'Yes'),
          (-18211, DATEADD(day, -1, CURRENT_DATE()), 'SYN_A', 'Other assistance')
  expect:
    rows:
    - person_id: -9601
      concept_code: SYN_C
      smoking_cessation_services: 'Yes'
    - person_id: -9602
      concept_code: SYN_B
      smoking_cessation_services: Other assistance
    - person_id: -9603
      concept_code: SYN_A
      smoking_cessation_services: 'Yes'
    - person_id: -18210
      concept_code: SYN_Z
      smoking_cessation_services: 'Declined'
    - person_id: -18211
      concept_code: SYN_Z
      smoking_cessation_services: 'Yes'
