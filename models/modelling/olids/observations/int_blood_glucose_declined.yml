models:
  - name: int_blood_glucose_declined
    description: >-
      Declined blood glucose tests in OLIDS GP records, using GLUCDEC_COD. One row per
      person, concept and clinical date up to the build date. Includes inactive and
      deceased people, without age or SMI-register restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: GLUCDEC_COD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - concept_code
              - clinical_effective_date
