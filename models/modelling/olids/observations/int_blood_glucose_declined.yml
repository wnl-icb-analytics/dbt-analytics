models:
  - name: int_blood_glucose_declined
    description: >-
      Blood glucose testing declined from GLUCDEC_COD. One row per person,
      concept and clinical date up to the build date. Includes all people with
      a matching record, including inactive and deceased people; no
      SMI-register or age restriction is applied.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: GLUCDEC_COD