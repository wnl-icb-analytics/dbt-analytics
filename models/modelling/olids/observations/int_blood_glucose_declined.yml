models:
  - name: int_blood_glucose_declined
    description: >-
      Declined blood glucose tests in NCL OLIDS GP records, using GLUCDEC_COD. One row per
      person, concept and clinical date up to the build date. Includes inactive and deceased
      people, without age or SMI-register restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: GLUCDEC_COD