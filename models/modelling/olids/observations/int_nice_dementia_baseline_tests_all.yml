models:
- name: int_nice_dementia_baseline_tests_all
  description: Dementia baseline blood tests, one row per observation and test type for all people, including
    inactive and deceased people. FBC_COD or HB_COD supplies FBC; CALC_COD calcium; GLUC_COD, IFCCHBAM_COD
    or DCCTHBA1C_COD glucose; UE_COD, CRE_COD or EGFR_COD renal function; LFT_COD liver function; TFT_COD
    thyroid function; ARDENS/B12_LEVEL and ARDENS/FOLATE_LEVEL B12 and folate. HbA1c counts in place of
    glucose. Coded tests need no numeric result. Future clinical dates are excluded.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - id
        - test_type
  - cluster_ids_exist:
      arguments:
        cluster_ids: FBC_COD, HB_COD, CALC_COD, GLUC_COD, IFCCHBAM_COD, DCCTHBA1C_COD, UE_COD, CRE_COD,
          EGFR_COD, LFT_COD, TFT_COD
        source: PCD
  - cluster_ids_exist:
      arguments:
        cluster_ids: ARDENS/B12_LEVEL, ARDENS/FOLATE_LEVEL
        source: OPENCODELISTS
  columns:
  - name: id
    description: Source observation identifier.
  - name: person_id
    description: Person identifier.
  - name: event_date
    description: Corrected clinical date of the test.
  - name: test_type
    description: One of fbc, calcium, glucose, renal, liver, thyroid, b12 or folate.
