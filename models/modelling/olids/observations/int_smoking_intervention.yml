models:
  - name: int_smoking_intervention
    description: >-
      Smoking cessation interventions and declined interventions from
      SMOKINGINT_COD. The OLIDS population comes from NCL GP records. One row
      per person, concept and clinical date up to the build date. Includes all
      people with a matching record, including inactive and deceased people;
      no SMI-register or age restriction is applied.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: SMOKINGINT_COD
    columns:
      - name: person_id
        tests:
          - not_null
