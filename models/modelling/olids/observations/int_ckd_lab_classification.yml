models:
  - name: int_ckd_lab_classification
    description: >-
      Laboratory evidence of CKD in OLIDS, one row per person with a valid latest eGFR
      or urine ACR result, regardless of diagnosis. Includes inactive and deceased
      people. Latest laboratory criteria and G/A stages use the latest valid tests,
      which may have different dates. Confirmation reflects historical abnormal pairs
      and need not describe the latest result.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        tests:
          - unique
          - not_null
      - name: latest_egfr_value
        description: 'Most recent estimated glomerular filtration rate value (mL/min/1.73m²)'
      - name: latest_egfr_date
        description: 'Date of the most recent eGFR measurement'
      - name: latest_egfr_stage
        description: 'CKD G-stage classification based on latest eGFR (G1-G5)'
      - name: latest_acr_value
        description: 'Most recent albumin-to-creatinine ratio value (mg/mmol)'
      - name: latest_acr_date
        description: 'Date of the most recent ACR measurement'
      - name: latest_acr_stage
        description: 'CKD A-stage classification based on latest ACR (A1-A3)'
      - name: has_confirmed_low_egfr
        description: >-
          True for successive abnormal eGFR results below 60 mL/min/1.73m2, 90-730 days apart.
          Normal results do not break the pair. Low eGFR records flagged invalid or dated
          after build can contribute. Confirmation can be historical.
      - name: has_confirmed_high_acr
        description: >-
          True for successive abnormal ACR results at least 3 mg/mmol, 90-730 days apart.
          Normal results do not break the pair. Confirmation can be historical.
      - name: latest_ckd_stage_inferred
        description: >-
          Combined G and A stages from the latest valid eGFR and ACR. The two tests may have
          different dates.
      - name: latest_labs_meet_ckd_criteria
        description: >-
          True for latest eGFR below 60 mL/min/1.73m2, or eGFR at least 60 with latest ACR at
          least 3 mg/mmol.
      - name: has_confirmed_ckd_by_labs
        description: >-
          True if either historical low-eGFR or high-ACR confirmation is present. Uses the
          pair rules on has_confirmed_low_egfr and has_confirmed_high_acr, not necessarily the
          latest test results.
