models:
  - name: int_ckd_lab_classification
    description: >-
      CKD laboratory evidence, one row per person with an eligible eGFR or latest valid
      urine ACR, regardless of diagnosis, registration or death. Eligible eGFRs are valid
      results dated on or before the build date, excluding the 1900-01-01 missing-date
      sentinel. Low-eGFR confirmation uses the last two eligible clinical days, both below
      60 mL/min/1.73m2 and more than three calendar months apart. The separate local flag
      caps their interval at 730 days. ACR confirmation checks for any historical
      abnormal pair 90-730 days apart. Stage fields use existing descriptive labels,
      not G1-G5 or A1-A3 codes, and the latest eGFR and ACR may have different dates.
      This is laboratory evidence, not the CVDPREVENT uncoded-CKD indicator population.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        data_tests:
          - unique
          - not_null
      - name: latest_egfr_value
        description: 'Latest eligible eGFR in mL/min/1.73m2; null for people with only valid ACR evidence.'
      - name: latest_egfr_date
        description: >-
          Clinical date of the latest eligible eGFR. Same-day results are ordered by
          date_recorded descending with nulls last, then observation ID descending.
          Comes from int_egfr_latest. Persistence compares with an earlier clinical day.
      - name: latest_egfr_stage
        description: 'CKD stage label from the latest eligible eGFR, from Normal/High (>=90) to CKD Stage 5 (<15); not G1-G5 codes'
      - name: latest_acr_value
        description: 'Most recent albumin-to-creatinine ratio value (mg/mmol)'
      - name: latest_acr_date
        description: 'Date of the most recent ACR measurement'
      - name: latest_acr_stage
        description: 'Albuminuria category label from the latest valid ACR (Normal to Severely Increased); not A1-A3 codes'
      - name: has_confirmed_low_egfr
        description: >-
          True when the last two eligible eGFR clinical days are both below 60 mL/min/1.73m2
          and more than three calendar months apart, following the CVDPREVENT
          CVDP002CKD persistence approach. No upper interval. A normal result in the
          latest pair prevents confirmation. Each day uses the result with the latest
          save time, nulls last, then highest observation ID. False when fewer than two
          eligible days exist. Does not apply CVDPREVENT's audit delay or indicator population.
      - name: has_confirmed_low_egfr_within_2_years_local
        description: >-
          Local capped variant of has_confirmed_low_egfr, requiring the same selected
          pair to be at most 730 days apart. The cap is not a CVDPREVENT requirement.
      - name: has_confirmed_high_acr
        description: >-
          True when any two abnormal ACR results at least 3 mg/mmol are 90-730 days apart.
          Intervening results do not break the pair. Confirmation can be historical and
          can include future-dated results. Retained local rule, not the CVDPREVENT
          eGFR persistence definition.
      - name: latest_ckd_stage_inferred
        description: >-
          Combined stage labels from the latest eligible eGFR and latest valid ACR. The two tests may have
          different dates.
      - name: latest_labs_meet_ckd_criteria
        description: >-
          True for latest eGFR below 60 mL/min/1.73m2, or eGFR at least 60 with latest ACR at
          least 3 mg/mmol.
      - name: has_confirmed_ckd_by_labs
        description: >-
          True if has_confirmed_low_egfr or has_confirmed_high_acr is true. Combines
          last-two eligible eGFR confirmation with historical ACR confirmation, so a
          true flag does not require both latest laboratory results to be abnormal.
