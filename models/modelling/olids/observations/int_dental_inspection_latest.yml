models:
  - name: int_dental_inspection_latest
    description: >-
      Latest recorded dental or oral-health review or intervention record, by
      clinical date. The OLIDS population comes from NCL GP records. One row
      per person with evidence in int_dental_inspection dated no later than
      the build date. Includes all qualifying people, including inactive and
      deceased people; no SMI-register or age restriction is applied.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null
