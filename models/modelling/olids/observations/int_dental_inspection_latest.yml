models:
  - name: int_dental_inspection_latest
    description: >-
      Latest recorded dental or oral-health review or intervention per person in NCL OLIDS, by
      clinical date up to the build date. Includes inactive and deceased people with
      qualifying evidence, without age or SMI-register restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null
