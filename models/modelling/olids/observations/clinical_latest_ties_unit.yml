unit_tests:
- name: alt_latest_valid_uses_save_time_then_id
  model: int_alt_latest
  given:
  - input: ref('int_alt_all')
    format: sql
    rows: |-
      SELECT
          column1::VARCHAR AS id,
          column2::NUMBER AS person_id,
          column3::TIMESTAMP_NTZ AS clinical_effective_date,
          column4::TIMESTAMP_NTZ AS date_recorded,
          NULL::VARCHAR AS concept_code,
          NULL::VARCHAR AS code_description,
          NULL::VARCHAR AS source_cluster_id,
          NULL::FLOAT AS original_result_value,
          NULL::VARCHAR AS original_result_unit_display,
          NULL::VARCHAR AS original_result_unit_code,
          NULL::VARCHAR AS expected_measurement_type,
          NULL::VARCHAR AS inferred_unit,
          column5::FLOAT AS inferred_value,
          NULL::BOOLEAN AS value_was_converted,
          NULL::BOOLEAN AS unit_was_changed,
          NULL::VARCHAR AS conversion_reason,
          NULL::VARCHAR AS confidence,
          NOT column6::BOOLEAN AS is_negative,
          FALSE::BOOLEAN AS is_extreme_outlier,
          NULL::VARCHAR AS alt_category,
          FALSE::BOOLEAN AS is_out_of_range
      FROM VALUES
          ('SYN_Z', -144501, '2024-03-01 15:00', '2024-03-02', 10, TRUE),
          ('SYN_A', -144501, '2024-03-01 09:00', '2024-03-03', 20, TRUE),
          ('SYN_A', -144502, '2024-03-01', '2024-03-02', 10, TRUE),
          ('SYN_Z', -144502, '2024-03-01', '2024-03-02', 20, TRUE),
          ('SYN_Z', -144503, '2024-03-01', NULL, 10, TRUE),
          ('SYN_A', -144503, '2024-03-01', '2024-03-02', 20, TRUE),
          ('SYN_OLD', -144504, '2024-03-01', '2024-03-05', 10, TRUE),
          ('SYN_NEW', -144504, '2024-03-02', '2024-03-03', 20, TRUE),
          ('SYN_VALID', -144505, '2024-03-01', '2024-03-02', 10, TRUE),
          ('SYN_INVALID', -144505, '2024-03-02', '2024-03-03', 20, FALSE)
  expect:
    rows:
    - person_id: -144501
      id: SYN_A
    - person_id: -144502
      id: SYN_Z
    - person_id: -144503
      id: SYN_A
    - person_id: -144504
      id: SYN_NEW
    - person_id: -144505
      id: SYN_VALID
  overrides:
    macros:
      get_empty_subquery_sql: SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS id WHERE FALSE
