models:
  - name: int_falls_discussion_all
    description: >
      Records that a person was asked about falls. One row per observation from the PCD cluster
      FALLSDISC_COD, for all people including inactive and deceased.
      Observations dated after the build date are excluded.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: FALLSDISC_COD
            source: PCD
    columns:
      - name: id
        description: Source observation identifier.
        data_tests:
          - unique
          - not_null
      - name: person_id
        description: Person identifier.
      - name: clinical_effective_date
        description: Date of the record.
      - name: concept_code
        description: SNOMED code of the record.
      - name: concept_display
        description: Description of the record.
      - name: source_cluster_id
        description: Cluster that matched the code.
