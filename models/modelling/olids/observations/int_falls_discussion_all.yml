models:
  - name: int_falls_discussion_all
    description: >
      Records that a person was asked about falls: a discussion about falls
      (FALLSDISC_COD) or a falls risk assessment (FALRISKASS_COD), which cannot be
      done without asking. The discussion code alone is rarely used. One row per
      observation from the PCD clusters, for all people including inactive and deceased.
      Observations dated after the build date are excluded.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: FALLSDISC_COD, FALRISKASS_COD
            source: PCD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id
              - source_cluster_id
    columns:
      - name: id
        description: Source observation identifier; one row per observation and cluster.
        data_tests:
          - not_null
      - name: record_type
        description: FALLS_DISCUSSION or FALLS_RISK_ASSESSMENT, from the matching cluster.
      - name: person_id
        description: Person identifier.
      - name: clinical_effective_date
        description: Date of the record.
      - name: concept_code
        description: SNOMED code of the record.
      - name: concept_display
        description: Description of the record.
      - name: source_cluster_id
        description: Cluster that matched the code.
