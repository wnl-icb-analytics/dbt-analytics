models:
  - name: int_alcohol_audit_scores
    description: 'AUDIT and AUDIT-C alcohol screening assessments with UK-specific risk thresholds.

      One row per AUDIT/AUDIT-C observation using AUDITC_COD and AUDIT_COD clusters with detailed categorisation and intervention flags.'

    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: AUDITC_COD, AUDIT_COD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id
              - source_cluster_id

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

      - name: id
        description: Identifier for the observation (may not be unique due to multiple concept mappings)
        tests:
          - not_null

      - name: clinical_effective_date
        description: Date when the AUDIT assessment was performed
        tests:
          - not_null

      - name: date_recorded
        description: >
          Date the observation was entered in the source system. Use with
          clinical_effective_date for point-in-time views, as an observation
          can be back-dated. May be NULL.

      - name: audit_score
        description: Numeric AUDIT or AUDIT-C score value

      - name: audit_type
        description: Type of AUDIT assessment (AUDIT-C or Full AUDIT)

      - name: is_valid_score
        description: >-
          Whole-number total within the instrument range (AUDIT-C 0-12, AUDIT 0-40).
          All risk fields and flags are null, Invalid or false when this is false.

      - name: risk_category
        description: Clinical risk category based on score thresholds

      - name: auditc_positive_screen
        description: Flag for AUDIT-C scores ≥5 indicating positive screen for potential harm

      - name: requires_specialist_intervention
        description: Flag for scores indicating need for specialist clinical intervention

      - name: brief_intervention_indicated
        description: Flag for scores meeting threshold for brief intervention

      - name: simplified_risk_level
        description: Simplified risk categorisation for aggregation. Null for invalid scores.

      - name: gender
        description: Person's gender used for risk stratification (where applicable)

unit_tests:
  - name: audit_scores_validity_gates_flags
    model: int_alcohol_audit_scores
    overrides:
      macros:
        get_observations: |
          SELECT column1::VARCHAR AS id, column2::NUMBER AS person_id,
                 '2024-03-01'::TIMESTAMP_NTZ AS clinical_effective_date,
                 '2024-03-02'::TIMESTAMP_NTZ AS date_recorded,
                 column3::NUMBER(10,3) AS result_value,
                 'SYN_score'::VARCHAR AS result_unit_display,
                 'SYN_AUDIT'::VARCHAR AS mapped_concept_code,
                 'SYN_AUDIT assessment'::VARCHAR AS mapped_concept_display,
                 column4::VARCHAR AS cluster_id, 40::NUMBER AS age_at_event
          FROM VALUES
              ('SYN_1', -9401, 5, 'AUDITC_COD'),
              ('SYN_2', -9402, 5.5, 'AUDITC_COD'),
              ('SYN_3', -9403, 13, 'AUDITC_COD'),
              ('SYN_4', -9404, 40, 'AUDIT_COD'),
              ('SYN_5', -9405, 5.001, 'AUDITC_COD')
    given:
      - input: ref('dim_person_demographics')
        format: sql
        rows: |
          SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS gender WHERE FALSE
    expect:
      rows:
        - {person_id: -9401, is_valid_score: true, risk_category: Increasing Risk, auditc_positive_screen: true, brief_intervention_indicated: true, requires_specialist_intervention: false}
        - {person_id: -9402, is_valid_score: false, risk_category: Invalid, simplified_risk_level: null, auditc_positive_screen: false, brief_intervention_indicated: false, requires_specialist_intervention: false}
        - {person_id: -9403, is_valid_score: false, risk_category: Invalid, simplified_risk_level: null, auditc_positive_screen: false, brief_intervention_indicated: false, requires_specialist_intervention: false}
        - {person_id: -9404, is_valid_score: true, risk_category: Possible Dependence, auditc_positive_screen: false, brief_intervention_indicated: true, requires_specialist_intervention: true}
        - {person_id: -9405, is_valid_score: false, risk_category: Invalid, simplified_risk_level: null, auditc_positive_screen: false, brief_intervention_indicated: false, requires_specialist_intervention: false}
