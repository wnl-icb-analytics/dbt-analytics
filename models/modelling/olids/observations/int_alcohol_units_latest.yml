models:
  - name: int_alcohol_units_latest
    description: >-
      Latest alcohol consumption record from ALC_COD, one row per person with
      evidence dated no later than the build date. Includes inactive and
      deceased people without an SMI-register or age restriction. Same-date
      records favour a non-null result. Values retain their recorded units
      unless recognised as weekly alcohol units. The risk category follows the
      code and weekly-unit rules in int_alcohol_units_all; a numeric result is
      not required for every coded status.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: ALC_COD