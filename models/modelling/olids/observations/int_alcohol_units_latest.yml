models:
  - name: int_alcohol_units_latest
    description: >-
      Latest alcohol consumption from ALC_COD in NCL OLIDS GP records, one row per person with
      evidence up to the build date. Includes inactive and deceased people without age or
      SMI-register restrictions. Same-date records favour a non-null result, but coded
      statuses need no numeric value. Units and risk categories follow int_alcohol_units_all.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: ALC_COD