models:
  - name: int_csf_leak_all
    description: >-
      Cerebrospinal fluid leak evidence for pneumococcal vaccination risk assessment
      in OLIDS GP records, using PPV_CLINICAL_RISK_CSF_COD and CSFLATRISK1_COD. One
      row per person, concept and clinical date up to the build date. Includes
      inactive and deceased people, without age or SMI-register restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: PPV_CLINICAL_RISK_CSF_COD, CSFLATRISK1_COD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - concept_code
              - clinical_effective_date
    columns:
      - name: observation_id
        description: Source observation selected within the model's event grain.
      - name: date_recorded
        description: EMIS save time of the selected observation; null when unavailable.
