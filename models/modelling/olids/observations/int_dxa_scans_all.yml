models:
  - name: int_dxa_scans_all
    description: >
      One row per PCD DXA_COD osteoporotic result or DXA2_COD T-score observation,
      for all persons. QOF v51 confirmation uses the unrounded DXA2 result <= -2.5
      with no lower limit. Validated T-scores and their interpretation retain the
      rounded -6 to 6 clinical range.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: DXA2_COD, DXA_COD
            source: PCD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id
              - source_cluster_id
