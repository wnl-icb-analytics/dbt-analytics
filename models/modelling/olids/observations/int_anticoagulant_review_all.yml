models:
  - name: int_anticoagulant_review_all
    description: >
      Anticoagulant medication review (ORANTICOAGREVW_COD) and atrial
      fibrillation annual review or monitoring (AFMON_COD) records from PCD, one
      row per observation for all people including inactive and deceased.
      Observations dated after the build date are excluded. Feeds the NICE
      anticoagulation review indicator, which takes either as evidence of review.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: ORANTICOAGREVW_COD, AFMON_COD
            source: PCD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id
              - source_cluster_id
    columns:
      - name: id
        description: Source observation identifier; one row per observation and cluster.
        data_tests:
          - not_null
      - name: person_id
        description: Person identifier.
      - name: clinical_effective_date
        description: Date of the review record.
      - name: review_type
        description: ANTICOAGULANT_REVIEW or AF_ANNUAL_REVIEW, from the matching cluster.
        data_tests:
          - accepted_values:
              arguments:
                values: ['ANTICOAGULANT_REVIEW', 'AF_ANNUAL_REVIEW']
      - name: concept_code
        description: SNOMED code of the record.
      - name: concept_display
        description: Description of the record.
      - name: source_cluster_id
        description: ORANTICOAGREVW_COD or AFMON_COD.
