models:
- name: int_nice_asthma_admissions_all
  description: GP-coded asthma admissions from PCD ASTADMSN_COD, one row per observation for all people,
    including inactive and deceased people. Corrected clinical dates through today; no SUS admissions.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - observation_id
  - cluster_ids_exist:
      arguments:
        cluster_ids: ASTADMSN_COD
        source: PCD
  columns:
  - name: person_id
    description: Person with the admission record.
  - name: observation_id
    description: Unique source observation.
  - name: event_date
    description: Corrected clinical calendar date.
