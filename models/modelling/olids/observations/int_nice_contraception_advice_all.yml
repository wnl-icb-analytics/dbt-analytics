models:
- name: int_nice_contraception_advice_all
  description: Contraception, conception and pregnancy advice. One row per observation, source and matching
    cluster for all people, including inactive and deceased people. Uses CONTRACEP_ADV_COD and LARC_ADV_COD
    plus PCD SEXHEALTHINT_COD and the epilepsy advice input. Future clinical dates are excluded. The PCD
    sexual-health list includes referrals and declines, so this combined evidence is a broad recorded-advice
    proxy. A single record counts; codes cannot establish coverage of all topics or tailoring to intentions.
    Unmapped local legacy advice codes remain outside the lists.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - id
        - source
        - source_cluster_id
  - cluster_ids_exist:
      arguments:
        cluster_ids: CONTRACEP_ADV_COD, LARC_ADV_COD
        source: ECL_CACHE
  - cluster_ids_exist:
      arguments:
        cluster_ids: SEXHEALTHINT_COD
        source: PCD
  columns:
  - name: event_date
    description: Corrected clinical date.
