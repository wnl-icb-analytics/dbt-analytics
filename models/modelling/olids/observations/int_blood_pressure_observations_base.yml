models:
  - name: int_blood_pressure_observations_base
    description: >-
      Blood pressure evidence in OLIDS GP records, one row per observation and
      matching cluster with a non-null person and result. Includes inactive and
      deceased people without age or date restrictions, including future dates. Values
      are labelled mmHg without plausibility or complete-pair checks. Original dates
      and correction flags remain available.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: ABPM_COD, BP_COD, DIASBP_COD, HOMEAMBBP_COD, HOMEBP_COD, SYSBP_COD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id
              - source_cluster_id
    columns:
      - name: id
        description: Observation identifier (unique per cluster)
        tests:
          - not_null
      - name: person_id
        description: Person identifier
        tests:
          - not_null
      - name: effective_date
        description: >-
          Clinical date, replaced by date_recorded when later than recording, or by 1900-01-01
          when missing. Future effective dates remain included.
      - name: clinical_effective_date_raw
        description: Original clinical_effective_date before future date correction
      - name: date_recorded
        description: Date the observation was recorded in the clinical system
      - name: result_value
        description: Blood pressure reading value
        tests:
          - not_null
      - name: result_unit_display
        description: Unit of measurement (always mmHg)
      - name: concept_code
        description: Clinical concept code for the observation
      - name: concept_display
        description: Human-readable display name for the concept
      - name: source_cluster_id
        description: >-
          Matching cluster: BP_COD, SYSBP_COD, DIASBP_COD, HOMEAMBBP_COD, ABPM_COD or
          HOMEBP_COD.
      - name: parent_observation_id
        description: >-
          Supplied parent observation linking systolic and diastolic readings. Null when no
          link is supplied.
      - name: is_systolic_row
        description: True if this observation is a systolic BP reading
      - name: is_diastolic_row
        description: True if this observation is a diastolic BP reading
      - name: is_home_bp_row
        description: True if observation is from home BP monitoring
      - name: is_abpm_bp_row
        description: True if observation is from ambulatory BP monitoring
      - name: had_future_date
        description: True if clinical_effective_date was after date_recorded (corrected)
      - name: had_null_date
        description: True if clinical_effective_date was null
      - name: bp_context_group
        description: Concept-level setting from PCD cluster membership, ABPM before HOME, otherwise CLINIC. Identical across all cluster rows of an observation.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [CLINIC, HOME, ABPM]
      - name: bp_context
        description: Concept-level detail within bp_context_group, descriptive only. ABPM maximum concepts present only in SYSBP_COD or DIASBP_COD are CLINIC_UNSPECIFIED under PCD membership.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ABPM_24H, ABPM_DAY, ABPM_NIGHT, ABPM_MIN_MAX, ABPM_UNSPECIFIED, HOME_AVERAGE, HOME_SELF_REPORTED, HOME_UNSPECIFIED, CLINIC_SITTING, CLINIC_STANDING, CLINIC_LYING, CLINIC_UNSPECIFIED]

