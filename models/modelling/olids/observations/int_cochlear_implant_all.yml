models:
  - name: int_cochlear_implant_all
    description: >-
      Cochlear implant evidence for pneumococcal vaccination risk assessment
      from PPV_CLINICAL_RISK_COCHLEAR_IMPLANT_COD and COCIMPATRISK1_COD. The
      OLIDS population comes from NCL GP records. One row per person, concept
      and clinical date up to the build date. Includes all people with a
      matching record, including inactive and deceased people; no SMI-register
      or age restriction is applied.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: PPV_CLINICAL_RISK_COCHLEAR_IMPLANT_COD, COCIMPATRISK1_COD