models:
  - name: int_cochlear_implant_all
    description: >-
      Cochlear implant evidence for pneumococcal vaccination risk assessment in NCL OLIDS GP
      records, using PPV_CLINICAL_RISK_COCHLEAR_IMPLANT_COD and COCIMPATRISK1_COD. One row per
      person, concept and clinical date up to the build date. Includes inactive and deceased
      people, without age or SMI-register restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: PPV_CLINICAL_RISK_COCHLEAR_IMPLANT_COD, COCIMPATRISK1_COD