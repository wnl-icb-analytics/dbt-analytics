models:
  - name: int_nutrition_review
    description: >
      OLIDS nutrition and diet observations for the SMI Longer Lives campaign. One row per
      person, concept code and clinical date. Clusters:
      SMI_LONGER_LIVES_NUTRITION_ACTIVITY, NUTRIASS_COD and NUTRIASSDEC_COD, which records
      declined assessments. poor_diet_flag is 'Yes' or 'No' for listed diet concept codes,
      'Declined' for NUTRIASSDEC_COD rows and null otherwise. Observations dated after
      today are excluded. Undated observations are kept with clinical date 1900-01-01.
      Overlapping clusters retain decline membership first, then the latest save time
      and highest ID.

    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - concept_code
              - clinical_effective_date
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: SMI_LONGER_LIVES_NUTRITION_ACTIVITY, NUTRIASSDEC_COD, NUTRIASS_COD
    columns:
      - name: observation_id
        description: Source observation selected within the model's event grain.
      - name: date_recorded
        description: EMIS save time of the selected observation; null when unavailable.
      - name: person_id
        tests:
          - not_null
