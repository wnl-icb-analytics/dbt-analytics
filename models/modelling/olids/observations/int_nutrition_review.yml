models:
  - name: int_nutrition_review
    description: >
      OLIDS nutrition and diet observations for the SMI Longer Lives campaign. One row per
      person, concept code and clinical date. Clusters:
      SMI_LONGER_LIVES_NUTRITION_ACTIVITY, NUTRIASS_COD and NUTRIASSDEC_COD, which records
      declined assessments. poor_diet_flag is 'Yes' or 'No' for listed diet concept codes,
      'Declined' for NUTRIASSDEC_COD rows and null otherwise. Observations dated after
      today are excluded. Undated observations are kept with clinical date 1900-01-01.
      Where duplicates exist one row is kept arbitrarily, so source_cluster_id may name
      any matching cluster.

    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: SMI_LONGER_LIVES_NUTRITION_ACTIVITY, NUTRIASSDEC_COD, NUTRIASS_COD
    columns:
      - name: person_id
        tests:
          - not_null
