models:
  - name: int_bowel_screen_performed
    description: >-
      Recorded bowel screening in OLIDS GP records from COLCANSCREV_COD, one row per
      observation up to the build date. Includes inactive and deceased people without
      screening-age, sex or SMI-register restrictions. Superseded for screening-status
      analysis by int_bowel_screening_all.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: COLCANSCREV_COD