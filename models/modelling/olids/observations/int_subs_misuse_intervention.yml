models:
  - name: int_subs_misuse_intervention
    description: >-
      Substance misuse interventions and declined interventions in OLIDS GP records,
      using ILLSUBINT_COD. One row per person, concept and clinical date up to the
      build date. Includes inactive and deceased people, without age or SMI-register
      restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - concept_code
              - clinical_effective_date
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: ILLSUBINT_COD
    columns:
      - name: observation_id
        description: Source observation selected within the model's event grain.
      - name: date_recorded
        description: EMIS save time of the selected observation; null when unavailable.
      - name: person_id
        tests:
          - not_null
