models:
  - name: int_breast_screen_declined
    description: >-
      Breast screening declined from BRCANSCRDEC_COD. The OLIDS population
      comes from NCL GP records. One row per observation dated no later than
      the build date, for all people including inactive and deceased people.
      No screening-age, sex or SMI-register restriction is applied.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: BRCANSCRDEC_COD