models:
  - name: int_breast_screen_declined
    description: >-
      Declined breast screening in NCL OLIDS GP records from BRCANSCRDEC_COD, one row per
      observation up to the build date. Includes inactive and deceased people without
      screening-age, sex or SMI-register restrictions.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: BRCANSCRDEC_COD