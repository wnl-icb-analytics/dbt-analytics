models:
  - name: int_mrc_dyspnoea_all
    description: >
      Medical Research Council dyspnoea scale records from the PCD MRC_COD
      cluster, one row per observation, for all people including inactive and
      deceased. mrc_grade is the grade 1 to 5 carried by the code. Observations
      dated after the build date are excluded.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: MRC_COD
            source: PCD
    columns:
      - name: id
        description: Source observation identifier.
        data_tests:
          - not_null
          - unique
      - name: person_id
        description: Person identifier.
      - name: clinical_effective_date
        description: Date of the record.
      - name: mrc_grade
        description: MRC dyspnoea grade 1 (breathless only on strenuous exercise) to 5 (too breathless to leave the house); null when the code carries no grade.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: concept_code
        description: SNOMED code of the record.
      - name: concept_display
        description: Description of the record.
      - name: source_cluster_id
        description: Cluster that matched the code.
