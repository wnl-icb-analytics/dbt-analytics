models:
  - name: int_foot_examination_latest
    description: >-
      Last recorded diabetic foot-examination timestamp per person, with statuses
      combined per clinical timestamp by int_foot_examination_all. Includes incomplete,
      declined and unsuitable examinations. One row per person with evidence, including
      inactive and deceased people. The latest clinical timestamp wins; statuses at
      other timestamps on the same calendar day are not combined.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null