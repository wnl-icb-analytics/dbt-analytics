models:
  - name: int_retinal_screening_all
    description: 'Completed diabetes retinal screening procedures for eye care monitoring and QOF reporting.

      One row per retinal screening observation using PCD RETSCREN_COD or CVDRETSCRN_COD screening evidence (retinal photography, digital screening and screener attendance), with result categorisation and diabetic retinopathy risk assessment.'
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: RETSCREN_COD, CVDRETSCRN_COD
            source: PCD
    columns:
      - name: date_recorded
        description: EMIS save time of the screening observation; null when unavailable.
      - name: id
        description: Unique identifier for each retinal screening observation
        tests:
          - unique
          - not_null
