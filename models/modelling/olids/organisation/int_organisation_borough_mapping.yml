models:
  - name: int_organisation_borough_mapping
    description: 'Organisation borough and legacy sub-ICB mapping for London practices and PCNs.

      Key features:

      • Borough derived from historic CCG relationships in OrganisationDescendent (contractual
      view of how practices were commissioned through NHSE, not strict geography).

      • One row per practice. Multiple historic CCG paths are resolved by preferring the
      most recent relationship (active first, then latest end date, then latest start date).

      • Sub-ICB = the live RO98/RO319 sub-ICB location the practice is commissioned
      through (93C = North Central London, W2U3Z = North West London) — the codes
      national datasets (SLAM/SUS/EPD) carry. Names curated for the WNL pair.

      • Legacy ICB (pre-merger NCL / NWL system identity) from the
      sub_icb_to_legacy_icb seed. ODS purged the RO261 parent edges after the
      2026-04 merger, so the dissolved hierarchy is pinned as static reference
      data. Non-merged ICBs resolve to themselves.

      • PCN borough from majority member borough; PCN sub-ICB from the PCN''s single
      commissioner (verified one-to-one).

      • Special handling: Medicus Select Care (Y03103) pinned to Enfield.

      Purpose: single source of truth for borough and legacy sub-ICB context consumed by
      dim_practice and dim_pcn.'
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      # Every in-scope practice should resolve to a sub-ICB via its commissioner.
      - dbt_utils.expression_is_true:
          arguments:
            expression: sub_icb_code IS NOT NULL
    columns:
      - name: practice_code
        description: 'GP practice identifier. Unique after the practice-grain dedup.'
        data_tests:
          - not_null
          - unique
      - name: borough_registered
        description: 'Borough assignment for the practice based on historic CCG relationships.
          Contractual view — boundary practices stay with the CCG that contracted them.'
      - name: practice_historic_ccg
        description: 'Historic CCG code used for the borough assignment.'
      - name: commissioner_code
        description: 'Current RO98 sub-ICB / place-based partnership commissioner code from
          OrganisationMatrixPracticeView (e.g. 93C, W2U3Z, A3A8R, 72Q, 36L).'
      - name: sub_icb_code
        description: 'Live RO98/RO319 sub-ICB location code — the commissioner itself.
          93C = North Central London, W2U3Z = North West London (both re-parented to
          Z9B2Z at the 2026-04 merger). Matches the commissioner codes in national
          datasets (SLAM/SUS/EPD).'
        data_tests:
          - not_null
      - name: sub_icb_name
        description: 'Sub-ICB display name. Curated for the WNL pair (NHS North Central
          London / NHS North West London — the post-merger ODS names are unreadable);
          dictionary commissioner name otherwise.'
        data_tests:
          - not_null
      - name: legacy_icb_code
        description: 'Pre-merger ICB ODS code from the sub_icb_to_legacy_icb seed:
          QMJ (NCL) or QRV (NWL) — legally dissolved 2026-03-31 and since purged
          from ODS. For ICBs that have not merged: the ICB code itself (QMF, QKK,
          QWE).'
        data_tests:
          - not_null
      - name: legacy_icb_name
        description: 'Pre-merger ICB display name from the sub_icb_to_legacy_icb seed.'
      - name: network_code
        description: 'Primary Care Network (PCN) identifier that the practice belongs to.'
      - name: pcn_borough
        description: 'Borough assignment for the PCN based on majority member borough.'
      - name: pcn_borough_practice_count
        description: 'Number of practices within the PCN assigned to this borough.'
      - name: pcn_sub_icb_code
        description: 'Live sub-ICB location code at the PCN grain — the PCN''s
          commissioner (same logic as sub_icb_code).'
      - name: pcn_sub_icb_name
        description: 'Sub-ICB display name at the PCN grain (curated for the WNL pair).'
      - name: pcn_legacy_icb_code
        description: 'Pre-merger ICB code at the PCN grain (same logic as legacy_icb_code).'
      - name: pcn_legacy_icb_name
        description: 'Pre-merger ICB display name at the PCN grain.'
