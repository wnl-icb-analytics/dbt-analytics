models:
- name: int_oral_nsaid_medications_all
  description: >-
    Oral NSAID prescriptions from NHS_DRUG_REFSETS ORALNSAIDDRUG_COD. One row per
    medication order for all people, including inactive and deceased people.
    No date restriction applies; consumers bound issue dates to their reporting date.
    This list excludes non-oral preparations present in the broader BNF NSAID input.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - cluster_ids_exist:
      arguments:
        cluster_ids: NHS_DRUG_REFSETS/ORALNSAIDDRUG_COD
        source: OPENCODELISTS
  columns:
  - name: medication_order_id
    description: Source medication order identifier.
    data_tests: [unique]
  - name: person_id
    description: Person receiving the prescription.
  - name: order_date
    description: Clinical issue timestamp; future orders are retained for consumers to exclude.
