models:
  - name: int_obesity2_lipid_lowering_medications_all
    description: >
      Statin, bempedoic acid, ezetimibe, inclisiran and PCSK9 inhibitor orders
      used to derive dyslipidaemia for QOF OBES2. One row represents an order
      and matched drug cluster.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [medication_order_id, source_cluster_id]
      - cluster_ids_exist:
          arguments:
            cluster_ids: STAT_COD, BEMPACID_COD, EZETIMIBE_COD, INCLISIRAN_COD, PCSK9I_COD
    columns:
      - name: medication_order_id
        description: Medication order identifier
        data_tests:
          - not_null
      - name: person_id
        description: Person identifier
        data_tests:
          - not_null
      - name: order_date
        description: Date the medication was ordered
        data_tests:
          - not_null
      - name: date_recorded
        description: Date recorded in the source system
      - name: source_cluster_id
        description: Lipid-lowering drug cluster identifier
