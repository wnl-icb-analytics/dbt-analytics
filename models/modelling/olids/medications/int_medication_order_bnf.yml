version: 2

models:
  - name: int_medication_order_bnf
    description: >-
      OLIDS medication issues with BNF classification and linked prescription
      details. One row per medication order linked to a patient-person
      mapping, dated from 1 January 1990 to the build date. Includes inactive
      and deceased people. Unmapped BNF classifications and missing
      prescription statements remain null. The BNF hierarchy has two-digit
      chapters, four-digit sections, six-digit paragraphs and full product
      codes. Prescription fields distinguish acute, repeat, repeat-dispensing
      and automatic authorisation and carry the linked statement's active
      status and dates; these do not establish historical authorisation status
      at the issue date.
    config:
      meta:
        owner:
          name: Eddie Davison

    data_tests:
      - not_null:
          column_name: medication_order_id
      - unique:
          column_name: medication_order_id
