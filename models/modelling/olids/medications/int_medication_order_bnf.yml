version: 2

models:
  - name: int_medication_order_bnf
    description: >-
      NCL OLIDS medication issues with BNF classification, one row per order dated from 1
      January 1990 to the build date. Includes linked inactive and deceased people. BNF
      chapters, sections and paragraphs use two, four and six digits respectively. Unmapped
      BNF codes and missing prescription statements remain null. Linked statement details
      describe authorisation type and current status, not historical authorisation at issue.
    config:
      meta:
        owner:
          name: Eddie Davison

    data_tests:
      - not_null:
          column_name: medication_order_id
      - unique:
          column_name: medication_order_id
