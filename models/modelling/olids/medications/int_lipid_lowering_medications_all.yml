models:
- name: int_lipid_lowering_medications_all
  description: 'Lipid-regulating medication orders, BNF section 2.12. One row per medication order for
    any person, including inactive and deceased people. Covers statins, ezetimibe, bempedoic acid, PCSK9
    inhibitors, inclisiran, fibrates, bile acid sequestrants, nicotinic acid derivatives and omega-3 products.
    lipid_lowering_class splits the section by chemical substance so consumers can select the products
    that count as lipid-lowering therapy for their purpose. Orders dated before 1990 or after the build
    date are excluded. Previously named int_statin_medications_all; that name described only part of the
    section it selected.

    '
  config:
    meta:
      owner:
        name: EddieDavison92
  columns:
  - name: person_id
    description: Person identifier.
    data_tests:
    - not_null
  - name: medication_order_id
    description: Medication order identifier; one row per order.
    data_tests:
    - unique
    - not_null
  - name: medication_statement_id
    description: Related medication statement identifier.
  - name: order_date
    description: Date the medication was ordered. Between 1990-01-01 and the build date.
    data_tests:
    - not_null
  - name: order_medication_name
    description: Name of medication as ordered.
  - name: order_dose
    description: Prescribed dose.
  - name: order_quantity_value
    description: Quantity ordered.
  - name: order_quantity_unit
    description: Unit of quantity ordered.
  - name: order_duration_days
    description: Duration in days.
  - name: statement_medication_name
    description: Name from medication statement.
  - name: mapped_concept_code
    description: Mapped SNOMED concept code.
  - name: mapped_concept_display
    description: Mapped SNOMED concept display name.
  - name: bnf_code
    description: BNF product code.
  - name: bnf_name
    description: BNF product name.
  - name: bnf_chemical_code
    description: First nine characters of the BNF code, identifying the chemical substance.
  - name: lipid_lowering_class
    description: 'Product class by chemical substance. STATIN, STATIN_COMBINATION (statin with ezetimibe
      or fenofibrate), EZETIMIBE, BEMPEDOIC_ACID (including with ezetimibe), PCSK9_INHIBITOR, INCLISIRAN,
      FIBRATE, BILE_ACID_SEQUESTRANT, NICOTINIC_ACID, OMEGA_3, or OTHER for remaining section 2.12 products
      such as ispaghula husk.

      '
    data_tests:
    - accepted_values:
        arguments:
          values:
          - STATIN
          - STATIN_COMBINATION
          - EZETIMIBE
          - BEMPEDOIC_ACID
          - PCSK9_INHIBITOR
          - INCLISIRAN
          - FIBRATE
          - BILE_ACID_SEQUESTRANT
          - NICOTINIC_ACID
          - OMEGA_3
          - OTHER
  - name: is_statin
    description: Whether the product contains a statin, alone or in combination.
  - name: statin_intensity
    description: Legacy statin intensity labels retained for published consumers pending approval. Use
      statin_intensity_national for the national high-intensity classification.
  - name: is_combination_therapy
    description: Fixed-dose combination product (statin with ezetimibe or fenofibrate, bempedoic acid
      with ezetimibe).
  - name: is_recent_3m
    description: Order in the 3 calendar months up to and including the build date; lower bound excluded.
  - name: is_recent_6m
    description: Order in the 6 calendar months up to and including the build date; lower bound excluded.
  - name: is_recent_12m
    description: Order in the 12 calendar months up to and including the build date; lower bound excluded.
  - name: is_high_intensity_statin
    description: Product belongs to a national HIATORVASTAT_COD, HIROSUVASTAT_COD or HISIMVASTAT_COD refset
      (NHS_DRUG_REFSETS, OPENCODELISTS). NICE NG238 high intensity means more than 40% LDL-C reduction;
      product strength is not a validated daily dose.
  - name: statin_intensity_national
    description: 'NICE NG238 national high-intensity product-list classification: HIGH_INTENSITY, UNKNOWN
      for other statins, null for non-statins. Medium and low intensity await reviewed code lists. https://www.nice.org.uk/guidance/ng238/chapter/Recommendations#terms-used-in-this-guideline'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - HIGH_INTENSITY
          - UNKNOWN
  data_tests:
  - cluster_ids_exist:
      arguments:
        cluster_ids: NHS_DRUG_REFSETS/HIATORVASTAT_COD,NHS_DRUG_REFSETS/HIROSUVASTAT_COD,NHS_DRUG_REFSETS/HISIMVASTAT_COD
        source: OPENCODELISTS
