models:
- name: int_metformin_medications_all
  description: All metformin medication orders using the METFORMIN_RX cluster, including fixed-dose combinations
    (with a DPP-4 inhibitor, SGLT2 inhibitor or thiazolidinedione). Single ingredient (no per-drug categorisation);
    captures combination products that BNF codes under 6.1.2.3 and so miss. Membership is cluster-driven
    and date-independent; date filtering applied by consumers.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.at_least_one:
      column_name: person_id
  - cluster_ids_exist:
      arguments:
        cluster_ids: METFORMIN_RX
  columns:
  - name: person_id
    description: Person identifier
    data_tests:
    - not_null
  - name: medication_order_id
    description: Unique medication order identifier
    data_tests:
    - not_null
    - unique
  - name: medication_statement_id
    description: Related medication statement identifier
  - name: order_date
    description: Date medication was ordered
    data_tests:
    - not_null
  - name: order_medication_name
    description: Name of medication as ordered
  - name: order_dose
    description: Prescribed dose
  - name: order_quantity_value
    description: Quantity ordered
  - name: order_quantity_unit
    description: Unit of quantity ordered
  - name: order_duration_days
    description: Duration in days
  - name: statement_medication_name
    description: Name from medication statement
  - name: mapped_concept_code
    description: Mapped SNOMED concept code
  - name: mapped_concept_display
    description: Mapped SNOMED concept display name
  - name: bnf_chapter
    description: BNF chapter (06 = endocrine/diabetes)
  - name: bnf_code
    description: BNF classification code
  - name: bnf_name
    description: BNF classification name
  - name: cluster_id
    description: Cluster identifier (METFORMIN_RX)
  - name: is_combination
    description: Fixed-dose combination product (metformin + another antidiabetic); FALSE for plain metformin
      (BNF 6.1.2.2)
  - name: is_recent_3m
    description: Order in the 3 calendar months up to and including the build date; lower bound excluded.
  - name: is_recent_6m
    description: Order in the 6 calendar months up to and including the build date; lower bound excluded.
  - name: is_recent_12m
    description: Order in the 12 calendar months up to and including the build date; lower bound excluded.
  - name: rolling_order_count_12m
    description: Count of metformin orders per person in the 12 months up to each order date
  - name: current_practice_id
    description: Current practice identifier
  - name: total_patients
    description: Total patients count
  - name: is_future_dated
    description: Order dated after the build date; kept as source evidence, never recent.
