unit_tests:
- name: lipid_statin_intensity_national_lists
  model: int_lipid_lowering_medications_all
  given:
  - input: ref('stg_olids_medication_order')
    format: sql
    rows: |-
      select v.id::varchar id, 'SYN_PAT'::varchar patient_id, -9200::number person_id,
       current_date()::date clinical_effective_date, '02'::varchar bnf_chapter, '0212'::varchar bnf_section,
       v.bnf::varchar bnf_code, null::varchar bnf_name, null::varchar medication_statement_id,
       null::varchar medication_name, null::timestamp_ntz date_recorded, null::varchar dose,
       null::number quantity_value, null::varchar quantity_unit, null::number duration_days,
       null::number estimated_cost, null::varchar statement_medication_name,
       v.code::varchar mapped_concept_code, null::varchar mapped_concept_display
       from (values ('SYN_HI','SYN_ATORVA80','0212000B0SYN'),
       ('SYN_NONHI','SYN_ATORVA10','0212000B0SYN'),('SYN_EZET','SYN_EZET','0212000L0SYN'),('SYN_COMBO','SYN_COMBO','0212000SYN'),('SYN_HICOMBO','SYN_HICOMBO','0212000SYN'),('SYN_OLDMOD','SYN_OLDMOD','0212000Y0SYN'),('SYN_OMEGA','SYN_OMEGA','0212000ABSYN'),('SYN_MISSING','SYN_MISSING','0212000F0SYN'),('SYN_LARO','SYN_LARO','0212000AESYN'),
       ('SYN_ROSU','SYN_ROSU','0212000SYN'),('SYN_SIMVA','SYN_SIMVA','0212000SYN'),
       ('SYN_BEMP','SYN_BEMP','0212000SYN'),('SYN_PCSK9','SYN_PCSK9','0212000SYN'),
       ('SYN_INCL','SYN_INCL','0212000SYN'),('SYN_WRONG_SOURCE','SYN_WRONG_SOURCE','0212000SYN')) v(id,code,bnf)
  - input: ref('stg_olids_patient')
    format: sql
    rows: select 'SYN_PAT'::varchar id,-9200::number person_id,null::number sk_patient_id
  - input: ref('stg_reference_combined_codesets')
    format: sql
    rows: |-
      select code::varchar code, cluster::varchar cluster_id, src::varchar source,
       'Synthetic list'::varchar cluster_description from (values
       ('SYN_ATORVA80','STAT_COD','ECL_CACHE'),('SYN_ATORVA10','STAT_COD','ECL_CACHE'),
       ('SYN_EZET','EZETIMIBE_COD','ECL_CACHE'),('SYN_COMBO','STAT_COD','ECL_CACHE'),('SYN_HICOMBO','STAT_COD','ECL_CACHE'),('SYN_OLDMOD','STAT_COD','ECL_CACHE'),('SYN_HICOMBO','NHS_DRUG_REFSETS/HIATORVASTAT_COD','OPENCODELISTS'),
       ('SYN_ATORVA80','NHS_DRUG_REFSETS/HIATORVASTAT_COD','OPENCODELISTS'),
       ('SYN_ROSU','STAT_COD','ECL_CACHE'),('SYN_ROSU','NHS_DRUG_REFSETS/HIROSUVASTAT_COD','OPENCODELISTS'),
       ('SYN_SIMVA','STAT_COD','ECL_CACHE'),('SYN_SIMVA','NHS_DRUG_REFSETS/HISIMVASTAT_COD','OPENCODELISTS'),
       ('SYN_BEMP','BEMPACID_COD','ECL_CACHE'),('SYN_PCSK9','PCSK9I_COD','ECL_CACHE'),
       ('SYN_INCL','INCLISIRAN_COD','ECL_CACHE'),('SYN_EZET','EZETIMIBE_COD','ECL_CACHE'),
       ('SYN_WRONG_SOURCE','STAT_COD','OPENCODELISTS')) v(code,cluster,src)
  - input: ref('dmd_product')
    format: sql
    rows: >-
      select code::varchar product_code, ingredients::number ingredient_count,
      iff(code='SYN_LARO','15926311000001102','SYN_VTM')::varchar vtm_id from (values
      ('SYN_ATORVA80',1),('SYN_ATORVA10',1),('SYN_EZET',1),('SYN_COMBO',2),('SYN_HICOMBO',2),('SYN_OLDMOD',1),('SYN_OMEGA',2),('SYN_LARO',2))
      v(code,ingredients)
  expect:
    rows:
    - medication_order_id: SYN_HI
      is_statin: true
      lipid_lowering_class: STATIN
      is_high_intensity_statin: true
      statin_intensity: HIGH_INTENSITY
      is_combination_therapy: false
    - medication_order_id: SYN_NONHI
      is_statin: true
      lipid_lowering_class: STATIN
      is_high_intensity_statin: false
      statin_intensity: OTHER_STATIN
      is_combination_therapy: false
    - medication_order_id: SYN_EZET
      is_statin: false
      lipid_lowering_class: EZETIMIBE
      is_high_intensity_statin: false
      statin_intensity: null
      is_combination_therapy: false
    - medication_order_id: SYN_COMBO
      is_statin: true
      lipid_lowering_class: STATIN_COMBINATION
      statin_intensity: COMBINATION
      is_high_intensity_statin: false
      is_combination_therapy: true
    - medication_order_id: SYN_HICOMBO
      is_statin: true
      lipid_lowering_class: STATIN_COMBINATION
      statin_intensity: HIGH_INTENSITY
      is_high_intensity_statin: true
      is_combination_therapy: true
    - medication_order_id: SYN_OLDMOD
      is_statin: true
      lipid_lowering_class: STATIN
      statin_intensity: OTHER_STATIN
      is_high_intensity_statin: false
      is_combination_therapy: false
    - medication_order_id: SYN_OMEGA
      is_statin: false
      lipid_lowering_class: OMEGA_3
      statin_intensity: null
      is_high_intensity_statin: false
      is_combination_therapy: false
    - medication_order_id: SYN_MISSING
      is_statin: false
      lipid_lowering_class: BILE_ACID_SEQUESTRANT
      statin_intensity: null
      is_high_intensity_statin: false
      is_combination_therapy: false
    - medication_order_id: SYN_LARO
      is_statin: false
      lipid_lowering_class: NICOTINIC_ACID
      statin_intensity: null
      is_high_intensity_statin: false
      is_combination_therapy: false
    - medication_order_id: SYN_ROSU
      is_statin: true
      lipid_lowering_class: STATIN
      statin_intensity: HIGH_INTENSITY
      is_high_intensity_statin: true
      is_combination_therapy: false
    - medication_order_id: SYN_SIMVA
      is_statin: true
      lipid_lowering_class: STATIN
      statin_intensity: HIGH_INTENSITY
      is_high_intensity_statin: true
      is_combination_therapy: false
    - medication_order_id: SYN_BEMP
      is_statin: false
      lipid_lowering_class: BEMPEDOIC_ACID
      statin_intensity: null
      is_high_intensity_statin: false
      is_combination_therapy: false
    - medication_order_id: SYN_PCSK9
      is_statin: false
      lipid_lowering_class: PCSK9_INHIBITOR
      statin_intensity: null
      is_high_intensity_statin: false
      is_combination_therapy: false
    - medication_order_id: SYN_INCL
      is_statin: false
      lipid_lowering_class: INCLISIRAN
      statin_intensity: null
      is_high_intensity_statin: false
      is_combination_therapy: false
    - medication_order_id: SYN_WRONG_SOURCE
      is_statin: false
      lipid_lowering_class: OTHER
      statin_intensity: null
      is_high_intensity_statin: false
      is_combination_therapy: false
  overrides:
    macros:
      get_empty_subquery_sql: >-
        select null::varchar medication_order_id,null::boolean is_statin,null::varchar lipid_lowering_class,null::varchar statin_intensity,null::boolean
        is_high_intensity_statin,null::boolean is_combination_therapy where false
- name: nsaid_cox2_by_ingredient
  model: int_nsaid_medications_all
  given:
  - input: ref('stg_olids_medication_order')
    format: sql
    rows: |-
      select v.id::varchar id, 'SYN_PAT'::varchar patient_id, -9200::number person_id,
       current_date()::date clinical_effective_date, left(v.bnf,2)::varchar bnf_chapter, left(v.bnf,4)::varchar bnf_section,
       v.bnf::varchar bnf_code, null::varchar bnf_name, null::varchar medication_statement_id,
       null::varchar medication_name, null::timestamp_ntz date_recorded, null::varchar dose,
       null::number quantity_value, null::varchar quantity_unit, null::number duration_days,
       null::number estimated_cost, null::varchar statement_medication_name,
       v.code::varchar mapped_concept_code, null::varchar mapped_concept_display
       from (values ('SYN_ONE','SYN_ONE','100101SYN'),('SYN_TWO','SYN_TWO','1001010ASYN'),
       ('SYN_THREE','SYN_THREE','100101SYN'),('SYN_FOUR','SYN_FOUR','100101SYN'),
       ('SYN_IBUPROFEN_LYSINE','SYN_IBUPROFEN_LYSINE','1001010ASYN'),
       ('SYN_DICLOFENAC','SYN_DICLOFENAC','1001010ASYN'),
       ('SYN_TOPICAL','SYN_TOPICAL','100302SYN'),
       ('SYN_OTHER_RHEUM','SYN_OTHER_RHEUM','100103SYN')) v(id,code,bnf)
  - input: ref('stg_olids_patient')
    format: sql
    rows: select 'SYN_PAT'::varchar id,-9200::number person_id,null::number sk_patient_id
  - input: ref('dmd_product')
    format: sql
    rows: >-
      select code::varchar product_code,vtm::varchar vtm_id from (values
      ('SYN_ONE','775123001'),('SYN_TWO','SYN_MELOXICAM'),('SYN_FOUR','370187009'),
      ('SYN_IBUPROFEN_LYSINE','SYN_IBUPROFEN_LYSINE'),
      ('SYN_DICLOFENAC','SYN_DICLOFENAC')) v(code,vtm)
  expect:
    rows:
    - medication_order_id: SYN_ONE
      is_non_selective: false
      nsaid_type: COX2_SELECTIVE
      is_cox2_selective: true
    - medication_order_id: SYN_TWO
      is_non_selective: true
      nsaid_type: NON_SELECTIVE
      is_cox2_selective: false
    - medication_order_id: SYN_THREE
      is_non_selective: null
      nsaid_type: OTHER_NSAID
      is_cox2_selective: null
    - medication_order_id: SYN_FOUR
      nsaid_type: COX2_SELECTIVE
      is_cox2_selective: true
      is_non_selective: false
    - medication_order_id: SYN_IBUPROFEN_LYSINE
      nsaid_type: NON_SELECTIVE
      is_cox2_selective: false
      is_non_selective: true
    - medication_order_id: SYN_DICLOFENAC
      nsaid_type: NON_SELECTIVE
      is_cox2_selective: false
      is_non_selective: true
  overrides:
    macros:
      get_empty_subquery_sql: >-
        select null::varchar medication_order_id,null::boolean is_non_selective,null::varchar nsaid_type,null::boolean
        is_cox2_selective where false
