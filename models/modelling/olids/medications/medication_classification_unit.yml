  - input: ref('stg_reference_valproate_prog_codes')
    format: sql
    rows: >-
      select null::varchar code,null::varchar code_category,null::varchar valproate_product_term
      where false
  - input: ref('stg_reference_combined_codesets')
    format: sql
    rows: >-
      select code::varchar code,'VALPROATE'::varchar cluster_id,'ECL_CACHE'::varchar
      source,'Synthetic valproate'::varchar cluster_description from (values
      ('SYN_MR'),('SYN_GR'),('SYN_SOL'),('SYN_MISSING'),('SYN_CAP'),('SYN_PRO'),('SYN_GRAN')) v(code)
  - input: ref('dim_person')
    format: sql
