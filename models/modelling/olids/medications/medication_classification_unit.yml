      dmd_formulation_type: Oral solution
      is_modified_release: false
    - medication_order_id: SYN_MISSING
      formulation_type: UNKNOWN_FORMULATION
      dmd_formulation_type: UNKNOWN
      is_modified_release: null
    - medication_order_id: SYN_CAP
      formulation_type: CAPSULE
      dmd_formulation_type: Capsule
      is_modified_release: false
    - medication_order_id: SYN_PRO
      formulation_type: MODIFIED_RELEASE
      dmd_formulation_type: Prolonged-release granules
      is_modified_release: true
    - medication_order_id: SYN_GRAN
      formulation_type: UNKNOWN_FORMULATION
      dmd_formulation_type: Granules
      is_modified_release: false
  overrides:
    macros:
      get_empty_subquery_sql: >-
        select null::varchar medication_order_id,null::varchar formulation_type,null::varchar
        dmd_formulation_type,null::boolean is_modified_release where false

