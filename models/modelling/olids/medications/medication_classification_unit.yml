- name: valproate_formulation_from_dmd
  model: int_valproate_medications_all
  given:
  - input: ref('stg_olids_medication_order')
    format: sql
    rows: |-
      select null::varchar mapped_concept_id, v.id::varchar id, 'SYN_PAT'::varchar patient_id, -9200::number person_id,
       current_date()::date clinical_effective_date, '04'::varchar bnf_chapter, '0408'::varchar bnf_section,
       v.bnf::varchar bnf_code, null::varchar bnf_name, null::varchar medication_statement_id,
       null::varchar medication_name, null::timestamp_ntz date_recorded, null::varchar dose,
       null::number quantity_value, null::varchar quantity_unit, null::number duration_days,
       null::number estimated_cost, null::varchar statement_medication_name,
       v.code::varchar mapped_concept_code, null::varchar mapped_concept_display
       from (values ('SYN_MR','SYN_MR','040801SYN'),('SYN_GR','SYN_GR','040801SYN'),('SYN_SOL','SYN_SOL','040801SYN'),('SYN_MISSING','SYN_MISSING','040801SYN'),('SYN_CAP','SYN_CAP','040801SYN'),('SYN_PRO','SYN_PRO','040801SYN'),('SYN_GRAN','SYN_GRAN','040801SYN')) v(id,code,bnf)
  - input: ref('stg_olids_patient')
