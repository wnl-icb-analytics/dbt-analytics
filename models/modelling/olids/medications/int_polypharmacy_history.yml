models:
  - name: int_polypharmacy_history
    description: |
      Estimated repeat chemical-count periods, one row per person and valid_from
      date over issues in the last five years. Counts distinct nine-character BNF
      chemicals in chapters 01 to 04 and 06 to 10, including each fixed combination
      as one chemical code. Overlapping products of one chemical count once.
      Supply duration, fallback, grace and cancellation cap follow the
      medication_supply_columns macro.
      Selects one issue per person, product and clinical date by recorded time
      (nulls last), then higher order ID, before checking expiry or cancellation.
      Each later issue replaces the product's previous supply across authorisations.
      Cancellation of the latest issue's authorisation ends supply from that date,
      even if an older authorisation's issue has supply left; cancellations of other
      authorisations are ignored; a later issue from an uncancelled authorisation
      restarts supply. Future issues are excluded, although
      expiry of existing issues can create future periods. Changes lasting under
      three days are smoothed, except the final point; adjacent equal counts merge.
      Zero-count periods are omitted. Five or more is local; ten or more supports
      medication review prioritisation. GP-issued repeat supply differs from NHSBSA
      monthly acute and repeat dispensing. Use int_polypharmacy_current for current
      status. History uses the same product selection and supply rules within its
      five-year issue window, then applies smoothing and projects future expiry periods.

    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Person identifier
        data_tests:
          - not_null
      - name: medication_count
        description: Count of distinct nine-character BNF chemicals during this period
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: valid_from
        description: Start of medication-count period. No period starts from a future-dated issue; expiry of a
          current issue can create future periods.
        data_tests:
          - not_null

      - name: valid_to
        description: End date of this smoothed medication count period (inclusive). Always populated, as the
          count falls to zero after the last issues run out; that zero period is not output.

      - name: is_polypharmacy_5plus
        description: Local flag for at least five BNF chemicals during this period
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: is_polypharmacy_10plus
        description: Flag for at least ten BNF chemicals during this period
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: is_current
        description: Whether this period overlaps with today (valid_from <= today AND valid_to >= today)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: period_duration_days
        description: Duration of this period in days (up to current date if ongoing)
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - valid_from
      - dbt_utils.at_least_one:
          column_name: person_id
      - cluster_ids_exist:
          arguments:
            cluster_ids: REPEAT_PRESCRIPTION
            source: ECL_CACHE

unit_tests:
- name: polypharmacy_history_unlinked_current_issue_excludes_future
  model: int_polypharmacy_history
  given:
  - input: ref('stg_reference_combined_codesets')
    format: sql
    rows: |-
      select 'SYN_REPEAT'::varchar code,'REPEAT_PRESCRIPTION'::varchar cluster_id
  - input: ref('stg_olids_medication_statement')
    format: sql
    rows: |-
      select 'SYN_STATEMENT'::varchar id,'SYN_REPEAT'::varchar authorisation_type_code,null::date cancellation_date
  - input: ref('stg_olids_medication_order')
    format: sql
    rows: |-
      select 'SYN_' || code::varchar as id,current_date()::timestamp_ntz date_recorded,
       -18314::number person_id,'SYN_UNMAPPED'::varchar patient_id,'SYN_STATEMENT'::varchar medication_statement_id,
       code::varchar mapped_concept_code,dateadd(day,days,current_date())::date clinical_effective_date,28::number duration_days
       from (values ('SYN_PRODUCT_A',-10),('SYN_PRODUCT_B',5)) v(code,days)
  - input: ref('int_polypharmacy_medications_list')
    format: sql
    rows: |-
      select column1::varchar snomed_code,'0201000AA'::varchar bnf_chemical_code from values ('SYN_PRODUCT_A'),('SYN_PRODUCT_B')
  expect:
    format: sql
    rows: |-
      select -18314::number person_id,1::number medication_count,dateadd(day,-10,current_date())::date valid_from,dateadd(day,18,current_date())::date valid_to,true::boolean is_current
  overrides:
    macros:
      get_empty_subquery_sql: >-
        select null::number as person_id, null::number as medication_count, null::date as valid_from, null::date as valid_to, null::boolean as is_current where false
