unit_tests:
- name: nice_asthma_saba_quantity_conversion
  model: int_nice_asthma_risk_medications_all
  given:
  - input: ref('int_medication_order_bnf')
    format: sql
    rows: SELECT -CAST(9650 AS DECIMAL(38, 0)) AS person_id, CAST(column1 AS VARCHAR) AS medication_order_id,
      CAST('2025-01-01' AS DATE) AS order_date, CAST(column2 AS VARCHAR) AS medication_name, CAST(column3
      AS DECIMAL(38, 0)) AS quantity_value, CAST(column4 AS VARCHAR) AS mapped_concept_code, CAST(column5
      AS VARCHAR) AS bnf_code FROM (VALUES ('SYN_A', 'Synthetic Accuhaler', 120, 'SYN_SABA', '0301011R0'),
      ('SYN_B', 'Synthetic Turbohaler', 200, 'SYN_SABA', '0301011V0'), ('SYN_C', 'Synthetic MDI', 400,
      'SYN_SABA', '0301011R0'), ('SYN_D', 'Synthetic MDI', NULL, 'SYN_SABA', '0301011R0'), ('SYN_E', 'Synthetic
      prednisolone', 30, 'SYN_OCS', '0603020T0'))
  - input: ref('stg_olids_medication_order')
    format: sql
    rows: "SELECT column1::VARCHAR AS id, 'SYN_PATIENT'::VARCHAR AS patient_id,\n column2::VARCHAR AS\
      \ mapped_concept_code, '2025-01-01'::DATE AS clinical_effective_date,\n NULL::VARCHAR AS medication_statement_id,\
      \ NULL::VARCHAR AS medication_name,\n NULL::DATE AS date_recorded, NULL::VARCHAR AS dose, NULL::NUMBER\
      \ AS quantity_value,\n NULL::VARCHAR AS quantity_unit, NULL::NUMBER AS duration_days, NULL::NUMBER\
      \ AS estimated_cost,\n NULL::VARCHAR AS statement_medication_name, NULL::VARCHAR AS mapped_concept_display,\n\
      \ NULL::VARCHAR AS bnf_chapter, NULL::VARCHAR AS bnf_section, NULL::VARCHAR AS bnf_code,\n NULL::VARCHAR\
      \ AS bnf_name\n FROM VALUES ('SYN_A','SYN_SABA'),('SYN_B','SYN_SABA'),('SYN_C','SYN_SABA'),('SYN_D','SYN_SABA'),('SYN_E','SYN_OCS')"
  - input: ref('int_patient_person_unique')
    format: sql
    rows: SELECT 'SYN_PATIENT'::VARCHAR AS patient_id, -9650::NUMBER AS person_id, -9650::NUMBER AS sk_patient_id
  - input: ref('stg_reference_combined_codesets')
    format: sql
    rows: SELECT 'SYN_SABA'::VARCHAR AS code, 'OPENCODELISTS'::VARCHAR AS source, 'OPENSAFELY/SABA_INHALER_MEDICATIONS'::VARCHAR
      AS cluster_id, 'Synthetic SABA'::VARCHAR AS cluster_description FROM VALUES (1),(2)
  expect:
    format: sql
    rows: SELECT -9650::NUMBER AS person_id, column1::VARCHAR AS medication_order_id, '2025-01-01'::DATE
      AS order_date, column3::BOOLEAN AS is_prednisolone, column2::NUMBER AS saba_inhaler_count FROM VALUES
      ('SYN_A',2,FALSE),('SYN_B',2,FALSE),('SYN_C',2,FALSE),('SYN_D',1,FALSE),('SYN_E',0,TRUE)
  config:
    tags:
    - monthly-full
    - nice-history
  overrides:
    macros:
      get_empty_subquery_sql: SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS medication_order_id,
        NULL::DATE AS order_date, NULL::BOOLEAN AS is_prednisolone, NULL::NUMBER AS saba_inhaler_count
        WHERE FALSE
