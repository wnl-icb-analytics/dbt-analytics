models:
  - name: int_glp1_medications_all
    description: 'All GLP-1 receptor agonist medication orders using the GLP1RA_RX umbrella cluster, categorised to active ingredient via per-drug sub-clusters (SEMAGLUTIDE_RX, DULAGLUTIDE_RX, LIRAGLUTIDE_RX, EXENATIDE_RX, LIXISENATIDE_RX, ALBIGLUTIDE_RX, TIRZEPATIDE_RX). Captures orders regardless of indication; bnf fields retained to split diabetes (6.1) from obesity (4.5). Date filtering applied by consumers.'
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.at_least_one:
          column_name: person_id
      - cluster_ids_exist:
          arguments:
            cluster_ids: GLP1RA_RX,SEMAGLUTIDE_RX,DULAGLUTIDE_RX,LIRAGLUTIDE_RX,EXENATIDE_RX,LIXISENATIDE_RX,ALBIGLUTIDE_RX,TIRZEPATIDE_RX
    columns:
      - name: person_id
        description: 'Person identifier'
        data_tests:
          - not_null
      - name: medication_order_id
        description: 'Unique medication order identifier'
        data_tests:
          - not_null
          - unique
      - name: medication_statement_id
        description: 'Related medication statement identifier'
      - name: order_date
        description: 'Date medication was ordered'
        data_tests:
          - not_null
      - name: order_medication_name
        description: 'Name of medication as ordered'
      - name: order_dose
        description: 'Prescribed dose'
      - name: order_quantity_value
        description: 'Quantity ordered'
      - name: order_quantity_unit
        description: 'Unit of quantity ordered'
      - name: order_duration_days
        description: 'Duration in days'
      - name: statement_medication_name
        description: 'Name from medication statement'
      - name: mapped_concept_code
        description: 'Mapped SNOMED concept code'
      - name: mapped_concept_display
        description: 'Mapped SNOMED concept display name'
      - name: bnf_chapter
        description: 'BNF chapter (06 = diabetes, 04 = obesity/CNS)'
      - name: bnf_code
        description: 'BNF classification code'
      - name: bnf_name
        description: 'BNF classification name'
      - name: cluster_id
        description: 'Umbrella cluster identifier (GLP1RA_RX)'
      - name: sub_cluster_id
        description: 'Per-ingredient sub-cluster matched (e.g. SEMAGLUTIDE_RX); null if no ingredient sub-cluster matched'
      - name: glp1_drug
        description: 'GLP-1 RA active ingredient (SEMAGLUTIDE, DULAGLUTIDE, LIRAGLUTIDE, EXENATIDE, LIXISENATIDE, ALBIGLUTIDE, TIRZEPATIDE, OTHER_GLP1RA)'
      - name: is_dual_gip_glp1
        description: 'Flag for tirzepatide (dual GIP/GLP-1 receptor agonist)'
      - name: is_diabetes_indication
        description: 'Flag for orders under BNF 6.1 (diabetes); false for obesity/other indications'
      - name: is_recent_3m
        description: 'Order dated in the last 3 months up to today; false for future-dated orders'
      - name: is_recent_6m
        description: 'Order dated in the last 6 months up to today; false for future-dated orders'
      - name: is_recent_12m
        description: 'Order dated in the last 12 months up to today; false for future-dated orders'
      - name: rolling_order_count_12m
        description: 'Count of GLP-1 orders per person in the 12 months up to each order date'
      - name: current_practice_id
        description: 'Current practice identifier'
      - name: total_patients
        description: 'Total patients count'
