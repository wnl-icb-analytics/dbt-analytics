models:
  - name: int_polypharmacy_current
    description: |
      Estimated current repeat chemical count, one row per person with at least one
      in-scope supply. Counts distinct nine-character BNF chemicals across chapters
      01 to 04 and 06 to 10. Brands, strengths and formulations of the same chemical
      count once. A fixed combination counts once under its BNF chemical code,
      separately from an individual component with a different chemical code.
      Five or more is a local threshold; ten or more supports medication review
      prioritisation. These are GP-issued repeat supplies, not the NHSBSA comparator,
      which counts acute and repeat dispensing in a month at 8, 10, 15 and 20.
      Product BNF/name arrays retain product details and can exceed the chemical count.

    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Person identifier
        data_tests:
          - not_null
          - unique
      - name: medication_count
        description: Count of distinct current nine-character BNF chemicals in scope
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: medication_bnf_list
        description: Array of BNF codes for current medications
        data_tests:
          - not_null

      - name: medication_name_list
        description: Array of BNF medication names for current medications
        data_tests:
          - not_null

      - name: is_polypharmacy_5plus
        description: Local flag for at least five current BNF chemicals
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: is_polypharmacy_10plus
        description: Flag for at least ten current BNF chemicals, supporting medication review prioritisation
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: polypharmacy_status_date
        description: Earliest order date among current medications
        data_tests:
          - not_null
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id