models:
- name: int_mra_medications_all
  description: Mineralocorticoid receptor antagonist orders for all people, one row per medication order. BNF
    prefixes 0202030S0 (spironolactone) and 0202030X0 (eplerenone) only. Finerenone is excluded because it
    is not an HFrEF MRA in NICE NG106. No build-relative window is applied.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - medication_order_id
  columns: []
