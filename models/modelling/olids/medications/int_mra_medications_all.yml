models:
- name: int_mra_medications_all
  description: Mineralocorticoid receptor antagonist orders for all people, one row per medication order. BNF
    prefixes 0202030S0 (spironolactone), 0202030X0 (eplerenone) and 0202030Y0 (finerenone) cover the full
    class. No build-relative window is applied.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - medication_order_id
  columns:
  - name: is_steroidal_mra
    description: True for spironolactone or eplerenone orders; false for finerenone orders.
