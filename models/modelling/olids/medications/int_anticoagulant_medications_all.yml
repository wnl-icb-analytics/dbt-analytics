models:
  - name: int_anticoagulant_medications_all
    description: >-
      Oral anticoagulant orders for all people, one row per dated order. Selection uses
      national DIRECTORANTICOAGDRUG_COD and VITKANTAGDRUG_COD lists, plus the existing BNF
      chemicals for apixaban, dabigatran, edoxaban, rivaroxaban, warfarin, acenocoumarol,
      phenindione and phenprocoumon when a code does not match the lists. This includes pack codes whose parent product is listed
      and genuine list omissions such as phenprocoumon. INR testing strips
      and pentosan are excluded. Combinations qualify when nationally listed.
      Type and class flags use national membership first, then the retained BNF chemical.
      National-membership fields remain false or null for unmatched codes.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: NHS_DRUG_REFSETS/DIRECTORANTICOAGDRUG_COD,NHS_DRUG_REFSETS/VITKANTAGDRUG_COD
            source: OPENCODELISTS
    columns:
      - name: person_id
        description: 'Person identifier'
      - name: medication_order_id
        description: 'Unique medication order identifier'
        data_tests:
          - unique
      - name: medication_statement_id
        description: 'Related medication statement identifier'
      - name: order_date
        description: 'Date medication was ordered'
        tests:
          - not_null
      - name: order_medication_name
        description: 'Name of medication as ordered'
      - name: order_dose
        description: 'Prescribed dose'
      - name: order_quantity_value
        description: 'Quantity ordered'
      - name: order_quantity_unit
        description: 'Unit of quantity ordered'
      - name: order_duration_days
        description: 'Duration in days'
      - name: statement_medication_name
        description: 'Name from medication statement'
      - name: mapped_concept_code
        description: 'Mapped SNOMED concept code'
      - name: mapped_concept_display
        description: 'Mapped SNOMED concept display name'
      - name: bnf_code
        description: 'BNF classification code'
      - name: bnf_name
        description: 'BNF classification name'
      - name: anticoagulant_type
        description: 'DOAC or VKA from national refsets, then the retained BNF chemical when the code is unmatched.'
      - name: is_doac
        description: 'DOAC by national membership, or by retained BNF chemical when the code is unmatched.'
      - name: is_vka
        description: 'VKA by national membership, or by retained BNF chemical when the code is unmatched.'
      - name: is_recent_3m
        description: 'Order in the 3 calendar months up to and including the build date; lower bound excluded.'
      - name: is_recent_6m
        description: 'Order in the 6 calendar months up to and including the build date; lower bound excluded.'
      - name: is_recent_12m
        description: 'Order in the 12 calendar months up to and including the build date; lower bound excluded.'
      - name: is_future_dated
        description: Order dated after the build date; kept as source evidence, never recent.
      - name: is_in_national_anticoagulant_list
        description: >-
          Product belongs to the national DOAC or vitamin K antagonist drug refset; excludes INR
          strips and pentosan.
      - name: anticoagulant_type_national
        description: DOAC or VKA from national drug-refset membership; null outside these lists.
