
models:
  - name: int_polypharmacy_medications_current
    description: |
      Estimated current repeat products in the NHSBSA chapter scope, one row per
      person and SNOMED product. Uses int_medication_orders_repeat_current supply
      and cancellation rules and int_polypharmacy_medications_list chapter membership.
      Products sharing a nine-character BNF chemical remain separate here; consumers
      count each chemical once. Supply is estimated from GP issues, not dispensing.

    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Person identifier
        data_tests:
          - not_null

      - name: mapped_concept_code
        description: SNOMED CT code for the medication
        data_tests:
          - not_null

      - name: bnf_code
        description: BNF code for the medication
        data_tests:
          - not_null

      - name: bnf_chapter
        description: Two-character BNF chapter code within 01 to 04 or 06 to 10
        data_tests:
          - not_null

      - name: bnf_chemical_code
        description: Nine-character BNF chemical code used for counting; each fixed combination has its own code.

      - name: bnf_name
        description: BNF name/description of the medication

      - name: latest_order_date
        description: Date of most recent medication order
        data_tests:
          - not_null

      - name: latest_duration
        description: Duration in days for most recent order
      - name: effective_duration_days
        description: Local supply estimate in days, recorded duration when 1 to 365 inclusive, otherwise 28.
      - name: is_duration_imputed
        description: True when the local 28-day fallback replaces a missing or implausible duration.
      - name: supply_end_date
        description: Issue date plus effective duration, inclusive, giving one day's grace. Capped at the day before authorisation cancellation.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [person_id, mapped_concept_code]
      - dbt_utils.at_least_one:
          column_name: person_id
