models:
  - name: int_sglt2_therapy_latest
    description: >
      Latest SGLT2 inhibitor order per person, one row per person with any
      order from int_sglt2_medications_all between 1990 and the build date.
      Consumers apply their own window to latest_order_date; the NICE
      indicators treat an order in the preceding six calendar months as
      current treatment.
      Order date, latest save time and highest medication order ID determine the
      selected order. This is the last recorded eligible order, with no validity filter.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Person with at least one order.
        data_tests:
          - unique
          - not_null
      - name: latest_order_date
        description: Date of the latest order.
      - name: latest_order_id
        description: Medication order identifier of the latest order.
      - name: latest_sglt2_drug
        description: Drug of the latest order (DAPAGLIFLOZIN, EMPAGLIFLOZIN, CANAGLIFLOZIN, ERTUGLIFLOZIN or OTHER_SGLT2I).
      - name: latest_product_name
        description: BNF name of the latest product.
      - name: first_order_date
        description: Earliest order.
      - name: order_count
        description: Orders since 1990.

unit_tests:
  - name: sglt2_latest_uses_save_time_then_order_id
    model: int_sglt2_therapy_latest
    overrides:
      macros:
        get_empty_subquery_sql: SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS latest_order_id, NULL::NUMBER AS order_count WHERE FALSE
    given:
      - input: ref('int_sglt2_medications_all')
        format: sql
        rows: |
          SELECT column1::VARCHAR AS medication_order_id, column2::NUMBER AS person_id,
              column3::DATE AS order_date, column4::TIMESTAMP_NTZ AS date_recorded,
              'SYN_DRUG'::VARCHAR AS sglt2_drug, 'Synthetic product'::VARCHAR AS bnf_name
          FROM VALUES ('SYN_Z', -144561, '2024-03-01', '2024-03-02'),
              ('SYN_A', -144561, '2024-03-01', '2024-03-03'),
              ('SYN_A', -144562, '2024-03-01', '2024-03-02'),
              ('SYN_Z', -144562, '2024-03-01', '2024-03-02'),
              ('SYN_FUTURE', -144561, '2999-01-01', NULL)
    expect:
      rows:
        - {person_id: -144561, latest_order_id: SYN_A, order_count: 2}
        - {person_id: -144562, latest_order_id: SYN_Z, order_count: 2}
