models:
  - name: int_systemic_corticosteroid_medications_all
    description: >-
      Systemic corticosteroid orders in BNF 0603 for all people, one row per dated order.
      dm+d therapeutic moiety identifies fludrocortisone as mineralocorticoid. Products do
      not establish replacement or anti-inflammatory indication. The retained
      is_anti_inflammatory flag identifies dm+d glucocorticoids for C-LTCS course evidence.
      Combinations are included only within BNF 0603; corticosteroid ingredients in
      products outside that section do not qualify them.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - medication_order_id
    columns:
      - name: person_id
        description: 'Person identifier'
      - name: medication_order_id
        description: 'Unique medication order identifier'
      - name: medication_statement_id
        description: 'Related medication statement identifier'
      - name: order_date
        description: 'Date medication was ordered'
        tests:
          - not_null
      - name: order_medication_name
        description: 'Name of medication as ordered'
      - name: order_dose
        description: 'Prescribed dose'
      - name: order_quantity_value
        description: 'Quantity ordered'
      - name: order_quantity_unit
        description: 'Unit of quantity ordered'
      - name: order_duration_days
        description: 'Duration in days'
      - name: statement_medication_name
        description: 'Name from medication statement'
      - name: mapped_concept_code
        description: 'Mapped SNOMED concept code'
      - name: mapped_concept_display
        description: 'Mapped SNOMED concept display name'
      - name: bnf_code
        description: 'BNF classification code'
      - name: bnf_name
        description: 'BNF classification name'
      - name: corticosteroid_type
        description: 'dm+d class: MINERALOCORTICOID for fludrocortisone, GLUCOCORTICOID for other known VTMs, UNKNOWN when no VTM is available. Equal to corticosteroid_type_dmd.'
      - name: is_anti_inflammatory
        description: 'dm+d glucocorticoid product for C-LTCS course evidence, not prescribed indication. False for fludrocortisone; null when no VTM is available.'
      - name: is_mineralocorticoid
        description: 'Fludrocortisone by current or previous dm+d VTM; null when no VTM is available.'
      - name: is_recent_1m
        description: 'Order in the 1 calendar months up to and including the build date; lower bound excluded.'
      - name: is_recent_3m
        description: 'Order in the 3 calendar months up to and including the build date; lower bound excluded.'
      - name: is_recent_6m
        description: 'Order in the 6 calendar months up to and including the build date; lower bound excluded.'
      - name: is_future_dated
        description: Order dated after the build date; kept as source evidence, never recent.
      - name: corticosteroid_type_dmd
        description: >-
          Equal to corticosteroid_type. Retained name for the dm+d class, including UNKNOWN when
          no VTM is available.
