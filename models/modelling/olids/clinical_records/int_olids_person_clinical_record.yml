version: 2
models:
- name: int_olids_person_clinical_record
  description: OLIDS clinical records, one row per source clinical item. Retains missing linkage and unsupported
    dates. Prepared source facts retain domain-specific interpretation and all additional relationships. A thin
    view over the person-clustered dbt-OLIDS output.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: clinical_record_id
    description: '{{ doc(''navigation_clinical_record_id'') }}'
    data_tests:
    - unique
  - name: sk_patient_id
    description: '{{ doc(''navigation_sk_patient_id'') }}'
  - name: source_person_id
    description: '{{ doc(''navigation_source_person_id'') }}'
  - name: source_dataset
    description: '{{ doc(''navigation_source_dataset'') }}'
  - name: source_record_type
    description: '{{ doc(''navigation_source_record_type'') }}'
  - name: source_record_id
    description: '{{ doc(''navigation_source_record_id'') }}'
  - name: source_model_name
    description: '{{ doc(''navigation_source_model_name'') }}'
  - name: clinical_record_type
    description: '{{ doc(''navigation_clinical_record_type'') }}'
  - name: clinical_record_date
    description: '{{ doc(''navigation_clinical_record_date'') }}'
  - name: clinical_time_precision
    description: '{{ doc(''navigation_clinical_time_precision'') }}'
  - name: clinical_time_basis
    description: '{{ doc(''navigation_clinical_time_basis'') }}'
  - name: source_code
    description: '{{ doc(''navigation_source_code'') }}'
  - name: source_code_name
    description: '{{ doc(''navigation_source_code_name'') }}'
  - name: source_coding_system
    description: '{{ doc(''navigation_source_coding_system'') }}'
  - name: mapped_code
    description: '{{ doc(''navigation_mapped_code'') }}'
  - name: mapped_code_name
    description: '{{ doc(''navigation_mapped_code_name'') }}'
  - name: mapped_coding_system
    description: '{{ doc(''navigation_mapped_coding_system'') }}'
  - name: result_value
    description: '{{ doc(''navigation_result_value'') }}'
  - name: result_value_numeric
    description: '{{ doc(''navigation_result_value_numeric'') }}'
  - name: result_value_parse_status
    description: '{{ doc(''navigation_result_value_parse_status'') }}'
  - name: result_date
    description: '{{ doc(''navigation_result_date'') }}'
  - name: result_unit_code
    description: '{{ doc(''navigation_result_unit_code'') }}'
  - name: result_unit_name
    description: '{{ doc(''navigation_result_unit_name'') }}'
  - name: medication_name
    description: '{{ doc(''navigation_medication_name'') }}'
  - name: medication_dose
    description: '{{ doc(''navigation_medication_dose'') }}'
  - name: medication_quantity_value
    description: '{{ doc(''navigation_medication_quantity_value'') }}'
  - name: medication_quantity_unit
    description: '{{ doc(''navigation_medication_quantity_unit'') }}'
  - name: medication_duration_days
    description: '{{ doc(''navigation_medication_duration_days'') }}'
  - name: medication_authorisation_type_code
    description: '{{ doc(''navigation_medication_authorisation_type_code'') }}'
  - name: medication_authorisation_type_name
    description: '{{ doc(''navigation_medication_authorisation_type_name'') }}'
  - name: provider_organisation_code
    description: '{{ doc(''navigation_provider_organisation_code'') }}'
  - name: provider_organisation_name
    description: '{{ doc(''navigation_provider_organisation_name'') }}'
  - name: provider_code_authority
    description: '{{ doc(''navigation_provider_code_authority'') }}'
  - name: parent_record_id
    description: '{{ doc(''navigation_parent_record_id'') }}'
  - name: parent_record_type
    description: '{{ doc(''navigation_parent_record_type'') }}'
  - name: parent_model_name
    description: '{{ doc(''navigation_parent_model_name'') }}'
  - name: relationship_type
    description: '{{ doc(''navigation_relationship_type'') }}'
  - name: source_received_at
    description: '{{ doc(''navigation_source_received_at'') }}'
  - name: recorded_at
    description: OLIDS recording timestamp. It describes entry into the clinical system, not when the clinical condition
      began. Never substituted for clinical_record_at.
  - name: parent_start_date_precision
    description: 'Precision of parent_start_date: date, month, year or unknown. OLIDS retains its encounter precision;
      an encounter context date is never substituted for the clinical date.'
  - name: parent_start_date
    description: Clinical effective date of the recorded, non-deleted encounter for the same person. It is care
      context, not a replacement for the clinical record date or diagnosis onset. Null without positive person agreement.
  - name: is_parent_person_consistent
    description: Whether the recorded encounter and clinical record have the same person_id. False identifies a
      conflicting link; null means no non-deleted encounter or no comparable person key.
