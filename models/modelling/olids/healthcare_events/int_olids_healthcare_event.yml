version: 2
models:
- name: int_olids_healthcare_event
  description: OLIDS recorded healthcare milestones, one row per source record and milestone type. Primary milestones
    remain when undated; optional milestones require a recorded date. Contacts do not imply attendance. A thin view
    over the person-clustered dbt-OLIDS output.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: event_id
    description: '{{ doc(''navigation_event_id'') }}'
    data_tests:
    - unique
  - name: sk_patient_id
    description: '{{ doc(''navigation_sk_patient_id'') }}'
  - name: source_person_id
    description: '{{ doc(''navigation_source_person_id'') }}'
  - name: source_dataset
    description: '{{ doc(''navigation_source_dataset'') }}'
  - name: source_record_type
    description: '{{ doc(''navigation_source_record_type'') }}'
  - name: source_record_id
    description: '{{ doc(''navigation_source_record_id'') }}'
  - name: source_model_name
    description: '{{ doc(''navigation_source_model_name'') }}'
  - name: event_date
    description: '{{ doc(''navigation_event_date'') }}'
  - name: event_at
    description: '{{ doc(''navigation_adapter_event_at'') }}'
  - name: event_time_precision
    description: '{{ doc(''navigation_event_time_precision'') }}'
  - name: event_time_basis
    description: '{{ doc(''navigation_event_time_basis'') }}'
  - name: event_type
    description: '{{ doc(''navigation_event_type'') }}'
  - name: event_name
    description: '{{ doc(''navigation_event_name'') }}'
  - name: care_setting
    description: '{{ doc(''navigation_care_setting'') }}'
  - name: status_code
    description: Original appointment source status code. Null for booking and referral milestones where no
      status is supplied. Distinct source states can share one mapped attendance code.
  - name: status_name
    description: Original appointment source status label, including recorded arrival, call and completion states.
  - name: attendance_code
    description: National attendance code mapped by OLIDS. A mapped DNA category can include incomplete written
      work or an unanswered telephone call; it does not prove literal non-attendance.
  - name: attendance_name
    description: National label for the mapped attendance code. Interpret alongside the original source status.
  - name: event_code
    description: '{{ doc(''navigation_event_code'') }}'
  - name: event_code_name
    description: '{{ doc(''navigation_event_code_name'') }}'
  - name: event_coding_system
    description: '{{ doc(''navigation_event_coding_system'') }}'
  - name: clinical_record_id
    description: '{{ doc(''navigation_clinical_record_id'') }}'
  - name: provider_organisation_code
    description: '{{ doc(''navigation_provider_organisation_code'') }}'
  - name: provider_organisation_name
    description: '{{ doc(''navigation_provider_organisation_name'') }}'
  - name: provider_code_authority
    description: '{{ doc(''navigation_provider_code_authority'') }}'
  - name: source_received_at
    description: '{{ doc(''navigation_source_received_at'') }}'
