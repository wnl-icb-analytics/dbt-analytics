models:
  - name: int_qmul_gp_bp_registry_bp_spacing
    description: 'Per-person BP spacing assessment for the QMUL GP BP Registry cohort inclusion rule.

      Greedy chain walk over each person''s distinct eligible BP reading dates: takes the earliest date, then the next date at least min_reading_gap_weeks later, and so on.
      A person meets the criterion when they have min_qualifying_readings (default 4) dates at least min_reading_gap_weeks apart, the last at least min_span_months (default 36) calendar months after the first.
      The chain supplies the earliest possible dates for all but the last reading; the last can be any eligible date after both limits, so it need not be on the chain.
      One row per person in the base population with at least one eligible reading.'
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        data_tests:
          - not_null
          - unique
      - name: qualifying_reading_count
        description: 'Number of readings in the greedy chain (each >= min_reading_gap_weeks apart)'
        data_tests:
          - not_null
      - name: span_start
        description: 'Date of the first reading in the chain'
        data_tests:
          - not_null
      - name: span_end
        description: 'Date of the last reading in the chain'
        data_tests:
          - not_null
      - name: span_days
        description: 'Days from span_start to span_end'
        data_tests:
          - not_null
      - name: inclusion_first_met_date
        description: 'Earliest eligible reading date that completes the rule: on or after both the first reading + min_span_months calendar months and the chain''s reading min_qualifying_readings - 1 + min_reading_gap_weeks. Can be a date not on the greedy chain. NULL if never satisfied.'
      - name: meets_bp_criteria
        description: 'TRUE if inclusion_first_met_date IS NOT NULL'
        data_tests:
          - not_null
