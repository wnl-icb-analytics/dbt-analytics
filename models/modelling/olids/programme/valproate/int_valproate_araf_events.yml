models:
  - name: int_valproate_araf_events
    description: >-
      Annual risk acknowledgement form (ARAF) records in OLIDS, one row per
      observation linked to a person. Uses the valproate code list's ARAF category,
      with code-specific lookbacks where configured and no upper date limit. Includes
      inactive and deceased people of any age or sex, whether or not they take
      valproate.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - araf_ID
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - not_null
      - name: araf_ID
        tests:
          - not_null