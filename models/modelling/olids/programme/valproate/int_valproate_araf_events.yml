models:
  - name: int_valproate_araf_events
    description: >-
      Recorded annual risk acknowledgement form (ARAF) events. One row per observation matching the
      ARAF category of the valproate programme code list, with a person mapping. Each code's
      lookback limit applies where configured. There is no restriction to valproate users, sex, age,
      registration or death, and no upper event-date limit.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - araf_ID
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - not_null
      - name: araf_ID
        tests:
          - not_null