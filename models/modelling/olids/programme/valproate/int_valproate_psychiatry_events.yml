models:
  - name: int_valproate_psychiatry_events
    description: >-
      Recorded psychiatry events identified by the valproate programme code list's PSYCH category.
      One row per matching observation with a person mapping. There is no restriction to valproate
      users, sex, age, registration, death or event date; dashboard population restrictions apply
      downstream.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - psych_ID
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - not_null
      - name: psych_ID
        tests:
          - not_null