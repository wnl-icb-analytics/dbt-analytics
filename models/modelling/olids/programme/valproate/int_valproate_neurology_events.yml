models:
  - name: int_valproate_neurology_events
    description: >-
      Recorded neurology events identified by the valproate programme code list's NEUROLOGY
      category. One row per matching observation with a person mapping. There is no restriction to
      valproate users, sex, age, registration, death or event date; dashboard population
      restrictions apply downstream.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - neurology_ID
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - not_null
      - name: neurology_ID
        tests:
          - not_null