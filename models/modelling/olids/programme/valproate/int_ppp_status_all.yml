models:
  - name: int_ppp_status_all
    description: >-
      Recorded Pregnancy Prevention Programme (PPP) status events. One row per observation matching
      a PPP_ENROLLED, PPP_DISCONTINUED, PPP_NOT_NEEDED or PPP_DECLINED category in the valproate
      programme code list, with a person mapping. There is no restriction to valproate users, sex,
      age, registration, death or event date; the valproate dashboard population is applied
      downstream.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - ppp_ID
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - not_null
      - name: ppp_ID
        tests:
          - not_null