models:
  - name: int_ppp_status_all
    description: >-
      Pregnancy Prevention Programme (PPP) records in NCL OLIDS, one row per observation linked to a
      person. Uses the valproate code list's PPP_ENROLLED, PPP_DISCONTINUED, PPP_NOT_NEEDED and
      PPP_DECLINED categories. Includes inactive and deceased people of any age or sex, whether or
      not they take valproate. Event dates are unrestricted; the dashboard applies its population
      rules separately.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - ppp_ID
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - not_null
      - name: ppp_ID
        tests:
          - not_null