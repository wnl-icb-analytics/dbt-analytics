models:
  - name: int_valproate_araf_referral_events
    description: >-
      Annual risk acknowledgement form (ARAF) referrals in NCL OLIDS, one row per referral request
      or observation linked to a person. Uses the valproate code list's REFERRAL category; a linked
      observation and request appear only as the request. Includes inactive and deceased people of
      any age or sex, whether or not they take valproate. Event dates are unrestricted.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - araf_referral_ID
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - not_null
      - name: araf_referral_ID
        tests:
          - not_null
