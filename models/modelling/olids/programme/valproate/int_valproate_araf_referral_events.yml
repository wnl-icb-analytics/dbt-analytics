models:
  - name: int_valproate_araf_referral_events
    description: >-
      Recorded annual risk acknowledgement form (ARAF) referrals. One row per referral-request or
      observation record in the REFERRAL category of the valproate programme code list, with a
      person mapping. An observation explicitly linked from a referral request is represented by
      that referral request only. There is no restriction to valproate users, sex, age,
      registration, death or event date.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - araf_referral_ID
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - not_null
      - name: araf_referral_ID
        tests:
          - not_null
