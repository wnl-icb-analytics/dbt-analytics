models:
  - name: int_valproate_base
    description: >
      Valproate dashboard base, one row per non-male person aged 0 to 55 with a valproate
      order in the last 6 months, type 1 opt-outs flagged not filtered. Non-male means
      Female or Unknown gender. Scope comes from dim_valproate_db_scope. Registration and
      death are not filtered, so use is_active and is_deceased. Adds the latest valproate
      order date, Pregnancy Prevention Programme status, ARAF records, pregnancy, learning
      disability register, neurology and psychiatry involvement, a derived risk group and
      action order.

    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null
