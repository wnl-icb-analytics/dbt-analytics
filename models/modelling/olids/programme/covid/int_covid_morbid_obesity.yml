models:
  - name: int_covid_morbid_obesity
    description: 'COVID vaccination eligibility for people with morbid obesity using their latest BMI and BMI stage evidence.

      Key Features:

      • BMI threshold: latest BMI ≥40 when not superseded by a later BMI stage

      • Severe obesity codes qualify only when they are the latest BMI stage

      • Age restriction: minimum 18 years

      • Applies only to campaigns configured to include morbid obesity

      Purpose: Identify adults eligible for COVID vaccination due to morbid obesity.'
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: BMI_COD,BMI_STAGE_COD,SEV_OBESITY_COD
            source: UKHSA_COVID
    config:
      meta:
        indicator:
          id: "COVID_MORBID_OBESITY"
          type: "PROGRAMME"
          category: "COVID"
          clinical_domain: "Endocrinology"
          name_short: "COVID Eligible Morbid Obesity"
          description_short: "People with morbid obesity eligible for COVID vaccination"
          description_long: >
            COVID vaccination eligibility for people with morbid obesity. Uses the latest
            BMI value and latest BMI stage. A severe obesity code qualifies only when
            it is the latest BMI stage and is later than the latest BMI value. The
            minimum age is 18 years.
          is_qof: false
          source_column: "person_id"
          sort_order: "COVID_3_MORBID_OBESITY"
          usage_contexts:
            - "COVID_AND_FLU_DASHBOARD"
            - "COVID_REPORTING"
          code_clusters:
            - cluster_id: "BMI_COD"
              category: "INCLUSION"
            - cluster_id: "BMI_STAGE_COD"
              category: "INCLUSION"
            - cluster_id: "SEV_OBESITY_COD"
              category: "INCLUSION"
          thresholds:
            - population_group: "ALL"
              threshold_type: "AGE_ELIGIBILITY"
              threshold_value: "18"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "years"
              description: "Minimum age for morbid obesity eligibility"
              sort_order: 1

        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        description: 'COVID campaign identifier (e.g., covid_2025_autumn, covid_2024_autumn)'
        data_tests:
          - not_null
      - name: campaign_category
        description: 'Category of eligibility criteria (always "CLINICAL_CONDITION")'
      - name: risk_group
        description: 'Risk group classification (always "Morbid Obesity")'
      - name: person_id
        description: 'Unique identifier for the person'
        data_tests:
          - not_null
      - name: qualifying_event_date
        description: 'Date of the qualifying BMI value or severe obesity stage'
      - name: reference_date
        description: 'Campaign reference date used for eligibility assessment'
      - name: description
        description: 'Description of eligibility criteria'
      - name: birth_date_approx
        description: 'Approximate birth date used for age calculation'
      - name: age_months_at_ref_date
        description: 'Age in months at campaign reference date'
      - name: age_years_at_ref_date
        description: 'Age in years at campaign reference date (minimum 18 years required)'
      - name: created_at
        description: 'Record creation timestamp'
