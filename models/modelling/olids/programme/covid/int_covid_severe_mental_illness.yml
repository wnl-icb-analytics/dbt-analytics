models:
  - name: int_covid_severe_mental_illness
    description: >
      COVID severe mental illness risk group, one row per person and campaign, built for
      every reported campaign whether or not it offered this group. A person qualifies where
      their latest SEV_MENTAL_COD record is later than their latest SMHRES_COD resolved
      record, or no resolved record exists. Records must be on or before the campaign audit
      end date, using the campaign's pinned terminology version. Minimum age is 5 at the
      campaign reference date. int_covid_under_65_at_risk applies the campaign offer,
      currently COVID Autumn 2024 only.
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: SEV_MENTAL_COD,SMHRES_COD
            source: UKHSA_COVID
    config:
      meta:
        indicator:
          id: "COVID_SEVERE_MENTAL_ILLNESS"
          type: "PROGRAMME"
          category: "COVID"
          clinical_domain: "Psychiatry"
          name_short: "COVID Eligible Severe Mental Illness"
          description_short: "People with severe mental illness eligible for COVID vaccination"
          description_long: >
            COVID vaccination eligibility for people with severe mental illness using
            SMI_COV_COD
            cluster codes with earliest occurrence qualifying. Includes severe mental
            illness
            and psychiatric conditions that increase COVID risk requiring immunisation
            protection. Minimum age requirement of 5 years for COVID vaccination.
          is_qof: false
          source_column: "person_id"
          sort_order: "COVID_16_SEVERE_MENTAL_ILLNESS"
          usage_contexts:
            - "COVID_AND_FLU_DASHBOARD"
            - "COVID_REPORTING"
          code_clusters:
            - cluster_id: "SEV_MENTAL_COD"
              category: "INCLUSION"
            - cluster_id: "SMHRES_COD"
              category: "INCLUSION"
          thresholds:
            - population_group: "ALL"
              threshold_type: "AGE_ELIGIBILITY"
              threshold_value: "5"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "years"
              description: "Minimum age for COVID vaccination"
              sort_order: 1

        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        description: 'COVID campaign identifier (e.g., covid_2025_autumn, covid_2024_autumn)'
        data_tests:
          - not_null
      - name: campaign_category
        description: 'Category of eligibility criteria (always "CLINICAL_CONDITION")'
      - name: risk_group
        description: 'Risk group classification (always "Severe Mental Illness")'
      - name: person_id
        description: 'Unique identifier for the person'
        data_tests:
          - not_null
      - name: qualifying_event_date
        description: 'Latest SEV_MENTAL_COD record date'
      - name: reference_date
        description: 'Campaign reference date used for eligibility assessment'
      - name: description
        description: 'Description of eligibility criteria'
      - name: birth_date_approx
        description: 'Approximate birth date used for age calculation'
      - name: age_months_at_ref_date
        description: 'Age in months at campaign reference date'
      - name: age_years_at_ref_date
        description: 'Age in years at campaign reference date (minimum 5 years required)'
      - name: created_at
        description: 'Audit timestamp for record creation (campaign audit end date)'