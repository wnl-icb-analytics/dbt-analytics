models:
  - name: int_covid_chronic_kidney_disease
    description: >
      COVID clinical risk group: chronic kidney disease. One row per person and campaign
      for every campaign in covid_reported_campaign_ids(). A person qualifies with any
      CKD_COV_COD record, or where their latest CKD15_COD (any stage) record is also a
      CKD35_COD (stage 3 to 5) record. Only records on or before the campaign audit end
      date count, using the terminology version pinned for the campaign, and the person
      must be aged 5 or over at the campaign reference date. Rows are built for every
      campaign whether or not it offered this group; the offer is applied in
      int_covid_under_65_at_risk (currently COVID Autumn 2024 only).
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: CKD15_COD,CKD35_COD,CKD_COV_COD
            source: UKHSA_COVID
            versioned: true
    config:
      meta:
        indicator:
          id: "COVID_CHRONIC_KIDNEY_DISEASE"
          type: "PROGRAMME"
          category: "COVID"
          clinical_domain: "Renal"
          name_short: "COVID Eligible Kidney Disease"
          description_short: "People with chronic kidney disease eligible for COVID vaccination"
          description_long: >
            COVID vaccination eligibility for people with chronic kidney disease using
            CKD_COV_COD
            cluster codes with earliest occurrence qualifying. Includes chronic renal
            conditions
            and kidney dysfunction that increase COVID risk requiring immunisation
            protection. Minimum age requirement of 5 years for COVID vaccination.
          is_qof: false
          source_column: "person_id"
          sort_order: "COVID_7_KIDNEY_DISEASE"
          usage_contexts:
            - "COVID_AND_FLU_DASHBOARD"
            - "COVID_REPORTING"
          code_clusters:
            - cluster_id: "CKD_COV_COD"
              category: "INCLUSION"
            - cluster_id: "CKD15_COD"
              category: "INCLUSION"
            - cluster_id: "CKD35_COD"
              category: "INCLUSION"
          thresholds:
            - population_group: "ALL"
              threshold_type: "AGE_ELIGIBILITY"
              threshold_value: "5"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "years"
              description: "Minimum age for COVID vaccination"
              sort_order: 1

        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        description: 'COVID campaign identifier (e.g., covid_2025_autumn, covid_2024_autumn)'
        data_tests:
          - not_null
      - name: campaign_category
        description: 'Category of eligibility criteria (always "CLINICAL_CONDITION")'
      - name: risk_group
        description: 'Risk group classification (always "Chronic Kidney Disease")'
      - name: person_id
        description: 'Unique identifier for the person'
        data_tests:
          - not_null
      - name: qualifying_event_date
        description: 'Latest CKD stage 3 to 5 record date if any, otherwise latest CKD stage record date, otherwise earliest CKD_COV_COD date'
      - name: reference_date
        description: 'Campaign reference date used for eligibility assessment'
      - name: description
        description: 'Description of eligibility criteria'
      - name: birth_date_approx
        description: 'Approximate birth date used for age calculation'
      - name: age_months_at_ref_date
        description: 'Age in months at campaign reference date'
      - name: age_years_at_ref_date
        description: 'Age in years at campaign reference date (minimum 5 years required)'
      - name: created_at
        description: 'Audit timestamp for record creation (campaign audit end date)'
