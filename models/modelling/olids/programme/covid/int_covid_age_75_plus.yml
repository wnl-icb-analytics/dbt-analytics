models:
  - name: int_covid_age_75_plus
    description: 'COVID age-based eligibility determination.

      Grain: One row per person per campaign who meets age criteria

      Identifies people: • At or over the campaign''s age threshold at campaign reference
      date (65 for COVID Autumn 2024, 75 for later campaigns) • No clinical requirements
      - purely demographic

      Used by: Mart models for eligibility determination'
    config:
      meta:
        indicator:
          id: "COVID_AGE_75_PLUS"
          type: "PROGRAMME"
          category: "COVID"
          clinical_domain: "Demographics"
          name_short: "COVID Eligible Age-Based"
          description_short: "People at or over the campaign age threshold eligible for COVID vaccination"
          description_long: >
            COVID vaccination eligibility on age alone at campaign reference date.
            The threshold is campaign-specific: 65 and over for COVID Autumn 2024,
            75 and over for COVID Spring 2025 onwards. Simple demographic threshold
            with no additional clinical requirements.
          is_qof: false
          source_column: "person_id"
          sort_order: "COVID_1_AGE75"
          usage_contexts:
            - "COVID_AND_FLU_DASHBOARD"
            - "COVID_REPORTING"
          thresholds:
            - population_group: "COVID Autumn 2024"
              threshold_type: "AGE_ELIGIBILITY"
              threshold_value: "65"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "years"
              description: "Minimum age for the COVID Autumn 2024 age-based offer"
              sort_order: 1
            - population_group: "COVID Spring 2025 onwards"
              threshold_type: "AGE_ELIGIBILITY"
              threshold_value: "75"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "years"
              description: "Minimum age for the age-based offer from COVID Spring 2025"
              sort_order: 2

        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        description: 'COVID campaign identifier (e.g., covid_2025_autumn, covid_2024_autumn)'
        data_tests:
          - not_null
      - name: campaign_category
        description: 'Category of eligibility criteria (always "AGE_BASED")'
      - name: risk_group
        description: 'Risk group classification ("Age 65 and Over" for COVID Autumn 2024,
          "Age 75+" for later campaigns)'
      - name: person_id
        description: 'Unique identifier for the person'
        data_tests:
          - not_null
      - name: qualifying_event_date
        description: 'Date qualifying for eligibility (campaign reference date)'
      - name: reference_date
        description: 'Campaign reference date used for eligibility assessment'
      - name: description
        description: 'Description of eligibility criteria'
      - name: birth_date_approx
        description: 'Approximate birth date used for age calculation'
      - name: age_months_at_ref_date
        description: 'Age in months at campaign reference date'
      - name: age_years_at_ref_date
        description: 'Age in years at campaign reference date (calendar-year difference;
          eligibility itself is tested on birth date against the campaign threshold)'
      - name: created_at
        description: 'Audit timestamp for record creation (campaign audit end date)'
