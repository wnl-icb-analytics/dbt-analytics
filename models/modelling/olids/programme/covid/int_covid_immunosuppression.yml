models:
  - name: int_covid_immunosuppression
    description: 'COVID immunosuppression eligibility determination.

      Grain: One row per person per campaign who meets immunosuppression criteria

      Identifies people: • Diagnosed with immunosuppression (any time) • Recent immunosuppressant medication (6 months before RUN_DAT) • Recent immunosuppression admin code (3 years before RUN_DAT) • Recent chemotherapy/radiotherapy (6 months before RUN_DAT) • Aged 6 months or over, any upper age. Computed for every campaign.

      The offer''s under-75 cap (immuno_max_age_years, Spring 2025 onward) is applied by fct_covid_eligibility, tested on birth date, so this model can also feed int_covid_flu_risk_group_flags with immunosuppression status at any age.

      Used by: fct_covid_eligibility, int_covid_under_65_at_risk, int_covid_flu_risk_group_flags, adult immunisation population models'
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: DXT_CHEMO_COD,IMMDX_COV_COD,IMMRX_COD,IMM_ADM_COD
            source: UKHSA_COVID
            versioned: true
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - campaign_id
              - person_id
    config:
      meta:
        indicator:
          id: "COVID_IMMUNOSUPPRESSION"
          type: "PROGRAMME"
          category: "COVID"
          clinical_domain: "Immunology"
          name_short: "COVID Eligible Immunosuppression"
          description_short: "People with immunosuppression eligible for COVID vaccination"
          description_long: >
            COVID vaccination eligibility for people with immunosuppression from any
            cause including
            diagnosis codes (IMMDX_COV_COD), recent immunosuppressant medications
            (IMMRX_COD within 6 months),
            recent admin codes indicating immunosuppression (IMMADM_COD within 3 years),
            or
            recent chemotherapy/radiotherapy (DXT_CHEMO_COD within 6 months). Uses
            different
            lookback periods for medication/treatment pathways to capture currently
            immunosuppressed patients.
            Age eligibility varies by campaign type.
          is_qof: false
          source_column: "person_id"
          sort_order: "COVID_5_IMMUNOSUPPRESSION"
          usage_contexts:
            - "COVID_AND_FLU_DASHBOARD"
            - "COVID_REPORTING"
          code_clusters:
            - cluster_id: "IMMDX_COV_COD"
              category: "INCLUSION"
            - cluster_id: "IMMRX_COD"
              category: "INCLUSION"
            - cluster_id: "IMM_ADM_COD"
              category: "INCLUSION"
            - cluster_id: "DXT_CHEMO_COD"
              category: "INCLUSION"
          thresholds:
            - population_group: "BROADER_ELIGIBILITY"
              threshold_type: "AGE_ELIGIBILITY"
              threshold_value: "0"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "years"
              description: "Any age eligible for 2024/25 campaigns"
              sort_order: 1
            - population_group: "RESTRICTED_ELIGIBILITY"
              threshold_type: "AGE_ELIGIBILITY"
              threshold_value: "6"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "months"
              description: "Minimum age from Spring 2025 campaigns"
              sort_order: 2
            - population_group: "RESTRICTED_ELIGIBILITY"
              threshold_type: "AGE_ELIGIBILITY"
              threshold_value: "75"
              threshold_operator: "BELOW"
              threshold_unit: "years"
              description: "Upper age bound of the offer from Spring 2025, applied in fct_covid_eligibility; people aged 75 and over are covered by the age-based cohort"
              sort_order: 3
            - population_group: "MEDICATION_TREATMENT"
              threshold_type: "RECENCY_PERIOD"
              threshold_value: "6"
              threshold_operator: "WITHIN"
              threshold_unit: "months"
              description: "Lookback period for medication and chemotherapy codes"
              sort_order: 4
            - population_group: "ADMINISTRATION"
              threshold_type: "RECENCY_PERIOD"
              threshold_value: "3"
              threshold_operator: "WITHIN"
              threshold_unit: "years"
              description: "Lookback period for administration codes"
              sort_order: 5

        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        description: 'COVID campaign identifier (e.g., covid_2025_autumn, covid_2024_autumn)'
        data_tests:
          - not_null
      - name: campaign_category
        description: 'Category of eligibility criteria (always "CLINICAL_CONDITION")'
      - name: risk_group
        description: 'Risk group classification (always "Immunosuppression")'
      - name: person_id
        description: 'Unique identifier for the person'
        data_tests:
          - not_null
      - name: qualifying_event_date
        description: 'Date of qualifying immunosuppression event (diagnosis, medication, admin, or treatment)'
      - name: reference_date
        description: 'Campaign reference date used for eligibility assessment'
      - name: description
        description: 'Description of eligibility criteria including evidence types'
      - name: birth_date_approx
        description: 'Approximate birth date used for age calculation'
      - name: age_months_at_ref_date
        description: 'Completed months of age at the campaign reference date, consistent with the
          six-month lower bound applied to the cohort.'
      - name: age_years_at_ref_date
        description: 'Completed years of age at the campaign reference date. No upper bound is
          applied in this model; fct_covid_eligibility applies the offer cap on birth date.'
      - name: created_at
        description: 'Audit timestamp for record creation (campaign audit end date)'