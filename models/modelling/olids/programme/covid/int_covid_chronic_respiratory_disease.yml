models:
  - name: int_covid_chronic_respiratory_disease
    description: >
      COVID chronic respiratory disease risk group, one row per person and campaign, built
      for every reported campaign whether or not it offered this group. A person qualifies
      through int_covid_asthma for the campaign, or with any RESP_COV_COD record on or
      before the campaign audit end date and age 5 or over at the campaign reference date.
      RESP_COV_COD uses the campaign's pinned terminology version. Asthma takes precedence,
      and the description column shows which pathway applied. int_covid_under_65_at_risk
      applies the campaign offer, currently COVID Autumn 2024 only.
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: RESP_COV_COD
            source: UKHSA_COVID
    config:
      meta:
        indicator:
          id: "COVID_CHRONIC_RESPIRATORY_DISEASE"
          type: "PROGRAMME"
          category: "COVID"
          clinical_domain: "Respiratory"
          name_short: "COVID Eligible Respiratory Disease"
          description_short: "People with chronic respiratory disease eligible for COVID vaccination"
          description_long: >
            COVID vaccination eligibility for people with chronic respiratory disease
            using CRD_COV_COD
            cluster codes with earliest occurrence qualifying. Includes chronic pulmonary
            conditions
            and respiratory dysfunction that increase COVID risk requiring immunisation
            protection. Minimum age requirement of 5 years for COVID vaccination.
          is_qof: false
          source_column: "person_id"
          sort_order: "COVID_11_RESPIRATORY_DISEASE"
          usage_contexts:
            - "COVID_AND_FLU_DASHBOARD"
            - "COVID_REPORTING"
          code_clusters:
            - cluster_id: "RESP_COV_COD"
              category: "INCLUSION"
          thresholds:
            - population_group: "ALL"
              threshold_type: "AGE_ELIGIBILITY"
              threshold_value: "5"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "years"
              description: "Minimum age for COVID vaccination"
              sort_order: 1

        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        description: 'COVID campaign identifier (e.g., covid_2025_autumn, covid_2024_autumn)'
        data_tests:
          - not_null
      - name: campaign_category
        description: 'Category of eligibility criteria (always "CLINICAL_CONDITION")'
      - name: risk_group
        description: 'Risk group classification (always "Chronic Respiratory Disease")'
      - name: person_id
        description: 'Unique identifier for the person'
        data_tests:
          - not_null
      - name: qualifying_event_date
        description: 'Asthma qualifying date from int_covid_asthma, otherwise earliest RESP_COV_COD record date'
      - name: reference_date
        description: 'Campaign reference date used for eligibility assessment'
      - name: description
        description: 'Description of eligibility criteria'
      - name: birth_date_approx
        description: 'Approximate birth date used for age calculation'
      - name: age_months_at_ref_date
        description: 'Age in months at campaign reference date'
      - name: age_years_at_ref_date
        description: 'Age in years at campaign reference date (minimum 5 years required)'
      - name: created_at
        description: 'Audit timestamp for record creation (campaign audit end date)'