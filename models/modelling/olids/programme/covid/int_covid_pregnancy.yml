models:
  - name: int_covid_pregnancy
    description: >
      Pregnant people aged 12+ in COVID campaigns offering pregnancy, currently COVID Autumn
      2024 only. One row per person and campaign. Campaigns must have eligible_pregnancy
      set. A person qualifies with a PREGDEL_COD pregnancy or delivery record between
      pregnancy_current_start and pregnancy_current_end. A PREG_COD record from
      pregnancy_lookback_start up to the period start also qualifies when no later delivery
      code is recorded before the period starts. Delivery codes are those in PREGDEL_COD but
      not PREG_COD. Age is tested at the campaign reference date.
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: PREGDEL_COD,PREG_COD
            source: UKHSA_COVID
    config:
      meta:
        indicator:
          id: "COVID_PREGNANCY"
          type: "PROGRAMME"
          category: "COVID"
          clinical_domain: "Obstetrics"
          name_short: "COVID Eligible Pregnancy"
          description_short: "Pregnant people eligible for COVID vaccination"
          description_long: >
            COVID vaccination eligibility for people who are pregnant using PREG_COV_COD
            cluster codes with recent occurrence qualifying. Includes pregnancy status
            and antenatal care codes that increase COVID risk requiring immunisation
            protection. Minimum age requirement of 5 years for COVID vaccination.
          is_qof: false
          source_column: "person_id"
          sort_order: "COVID_2_PREGNANCY"
          usage_contexts:
            - "COVID_AND_FLU_DASHBOARD"
            - "COVID_REPORTING"
          code_clusters:
            - cluster_id: "PREG_COD"
              category: "INCLUSION"
            - cluster_id: "PREGDEL_COD"
              category: "INCLUSION"
          thresholds:
            - population_group: "ALL"
              threshold_type: "AGE_ELIGIBILITY"
              threshold_value: "5"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "years"
              description: "Minimum age for COVID vaccination"
              sort_order: 1

        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        description: 'COVID campaign identifier (e.g., covid_2025_autumn, covid_2024_autumn)'
        data_tests:
          - not_null
      - name: campaign_category
        description: 'Category of eligibility criteria (always "CLINICAL_CONDITION")'
      - name: risk_group
        description: 'Risk group classification (always "Pregnancy")'
      - name: person_id
        description: 'Unique identifier for the person'
        data_tests:
          - not_null
      - name: qualifying_event_date
        description: 'Date of the latest qualifying pregnancy or delivery record'
      - name: reference_date
        description: 'Campaign reference date used for eligibility assessment'
      - name: description
        description: 'Description of eligibility criteria'
      - name: birth_date_approx
        description: 'Approximate birth date used for age calculation'
      - name: age_months_at_ref_date
        description: 'Age in months at campaign reference date'
      - name: age_years_at_ref_date
        description: 'Age in years at campaign reference date. Minimum 12'
      - name: created_at
        description: 'Audit timestamp for record creation (campaign audit end date)'