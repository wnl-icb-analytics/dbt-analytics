models:
  - name: int_covid_gestational_diabetes
    description: 'COVID GDIAB_GROUP: people in the campaign pregnancy group (int_covid_pregnancy) with a gestational diabetes code (GDIAB_COD) between gestational_diabetes_start (14 January of the campaign year) and RUN_DAT. One row per person per campaign; qualifying_event_date is the latest gestational diabetes code. Only computed for campaigns with eligible_gestational_diabetes. Feeds int_covid_diabetes, because DIAB_GROUP selects this group.'
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - campaign_id
              - person_id
      - cluster_ids_exist:
          arguments:
            cluster_ids: GDIAB_COD
            source: UKHSA_COVID
            versioned: true
    config:
      meta:
        indicator:
          id: "COVID_GESTATIONAL_DIABETES"
          type: "PROGRAMME"
          category: "COVID"
          clinical_domain: "Obstetrics"
          name_short: "COVID Eligible Gestational Diabetes"
          description_short: "People with gestational diabetes eligible for COVID vaccination"
          description_long: >
            COVID gestational diabetes group (UKHSA GDIAB_GROUP): a gestational
            diabetes code (GDIAB_COD) between 14 January of the campaign year and
            RUN_DAT, in someone in the campaign pregnancy group. The latest code is
            the qualifying event. Minimum age 12 years, inherited from the pregnancy
            group.
          is_qof: false
          source_column: "person_id"
          sort_order: "COVID_18_GESTATIONAL_DIABETES"
          usage_contexts:
            - "COVID_AND_FLU_DASHBOARD"
            - "COVID_REPORTING"
          code_clusters:
            - cluster_id: "GDIAB_COD"
              category: "INCLUSION"
          thresholds:
            - population_group: "ALL"
              threshold_type: "AGE_ELIGIBILITY"
              threshold_value: "12"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "years"
              description: "Minimum age, inherited from the pregnancy group"
              sort_order: 1

        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        description: 'COVID campaign identifier (e.g., covid_2025_autumn, covid_2024_autumn)'
        data_tests:
          - not_null
      - name: campaign_category
        description: 'Category of eligibility criteria (always "CLINICAL_CONDITION")'
      - name: risk_group
        description: 'Risk group classification (always "Gestational Diabetes")'
      - name: person_id
        description: 'Unique identifier for the person'
        data_tests:
          - not_null
      - name: qualifying_event_date
        description: 'Latest GDIAB_COD record date in the window'
      - name: reference_date
        description: 'Campaign reference date used for eligibility assessment'
      - name: description
        description: 'Description of eligibility criteria'
      - name: birth_date_approx
        description: 'Approximate birth date used for age calculation'
      - name: age_months_at_ref_date
        description: 'Age in months at campaign reference date'
      - name: age_years_at_ref_date
        description: 'Age in years at campaign reference date. Minimum 12, inherited from int_covid_pregnancy'
      - name: created_at
        description: 'Audit timestamp for record creation (campaign audit end date)'
