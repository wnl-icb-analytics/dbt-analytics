models:
  - name: int_ltc_lcs_moc_careplan_sharing
    description: LTC LCS careplan sharing activity, one row per person with an event in the inclusive trailing 12
      months. Pathway-specific completion is defined in the risk summary.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        data_tests:
          - unique
          - not_null
      - name: latest_completed_date
        description: Latest non-future event date in the inclusive trailing 12 months.
      - name: careplan_sharing_completed
        description: True when a qualifying activity event exists; does not imply pathway stage completion.
