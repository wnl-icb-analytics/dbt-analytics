models:
  - name: int_ltc_lcs_moc_cyp_review
    description: CYP asthma review evidence, one row per person with annual or desktop review history on or before
      today. Pathway population is applied in the risk summary.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        data_tests:
          - unique
          - not_null
      - name: annual_review_date
        description: Latest asthma annual review date; null if absent.
      - name: desktop_review_date
        description: Latest at-risk asthma review date; null if absent.
      - name: annual_review_completed
        description: Annual review strictly after the one-year anniversary.
      - name: desktop_review_completed
        description: Latest desktop review or latest annual review after the anniversary with another AR/DTR in
          [review minus 3 months, review minus 1 day). Requires desktop review is derived in the risk summary.
      - name: desktop_review_completed_date
        description: Date of the qualifying linked desktop or annual review; null without completion.
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - b7780aad-7443-896e-ebf6-1e3c3800226d
              - fd4dd2f3-c33a-e7d2-3556-448b9e23662b
