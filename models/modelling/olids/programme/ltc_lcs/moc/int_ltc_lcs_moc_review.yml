models:
  - name: int_ltc_lcs_moc_review
    description: |
      LTC LCS Model of Care review activity.

      Flags persons with a Chronic disease management annual review completed event
      (<< 888461000000107) recorded in the last 12 months. One row per person.
      The reporting model names this MDT Review for HRCS/HRS pathways and Remote
      Desktop Review for MRS/LRS pathways.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - mdt_review_completed_vs1
    columns:
      - name: person_id
        description: Unique person identifier
        data_tests:
          - not_null
          - unique
      - name: latest_completed_date
        description: Most recent review date within the last 12 months
        data_tests:
          - not_null
      - name: review_completed
        description: Always true; row presence indicates a review event in the last 12 months
        data_tests:
          - not_null
