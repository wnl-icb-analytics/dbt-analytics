models:
  - name: int_ltc_lcs_moc_events
    description: LTC LCS programme events, one row per person, event code and date on or before today. Local codes match
      by source; MDT and sharing include SNOMED descendants.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        data_tests:
          - not_null
      - name: event_code
        description: C check and test; M MDT; S sharing; A agreed; R review; D declined; O offered.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - C
                  - M
                  - S
                  - A
                  - R
                  - D
                  - O
      - name: event_date
        description: Clinical effective date; future and undated events are excluded.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - event_code
              - event_date
      - valuesets_have_codes:
          arguments:
            valuesets:
              - f8fbb54b-fbab-4b5e-b668-24c33d8067e6
              - 674aa965-f721-4ce8-9b59-571b36db0676
              - d433bbf0-cb5c-4e9f-b7c9-d1d0a1f2e29d
