models:
  - name: int_ltc_lcs_cf_exclusions
    description: >
      LTC LCS case-finding exclusions, one row per person with at least one relevant
      condition. The metabolic flag combines AF, CKD, CHD, hypertension, heart failure,
      stroke/TIA, PAD, NAFLD and diabetes register membership with any hyperlipidaemia
      record ever, including descendants in metabolic_conditions_vs1. Hyperlipidaemia
      is broader than familial hypercholesterolaemia. The respiratory flag combines
      COPD, adult asthma (age 18+) and CYP asthma register membership.
      COPD and NAFLD use the programme LTC LCS register models. Both implement the
      exported EMIS searches, but their aggregate counts differ from EMIS register counts.
      Other conditions use QOF or clinical register proxies for EMIS library items that
      are not in the export. The QOF CKD register is known to differ materially from
      the EMIS LTC LCS CKD register. The diabetes register requires age 17+ and an active
      DM_COD diagnosis, rather than any historic diabetes or gestational diabetes code.
      Provides per-condition flags and a combined flag for existing consumers. Each
      case-finding base chooses which exclusion flags to apply.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 3b4d5851-8dbb-2c24-7899-5ac257a8e478
      - cluster_ids_exist:
          arguments:
            cluster_ids: COPD_COD,SLD_DX_CODES
    columns:
      - name: person_id
        data_tests:
          - not_null
          - unique
      - name: has_hyperlipidaemia
        description: Any hyperlipidaemia record ever in metabolic_conditions_vs1, including descendants.
      - name: earliest_excluding_condition_date
        description: >
          Earliest known diagnosis or hyperlipidaemia record date among the person's
          qualifying conditions. Null when no dated diagnosis evidence is available.
