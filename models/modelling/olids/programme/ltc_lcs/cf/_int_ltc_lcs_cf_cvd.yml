version: 2

models:
  - name: int_ltc_lcs_cf_cvd_61_base
    description: >
      One row per registered living person aged 40 to under 84 in the shared CVD_61/62
      population, assessed today. Excludes the shared metabolic population and an NHS health
      check in the last two years. Excludes a statin-product issue or STAT_COD event strictly
      after 12 months ago, or statin decline strictly after five years ago, using the latest
      matching record on or before today. Excludes persistent statin adverse reactions at
      any date and statin contraindication, not indicated or not tolerated on or before today.
      EMIS-local adverse codes match exactly; public originals retain their SNOMED meaning.
      Excludes current QOF palliative care register membership (ea06414e).
      Library 3de35e4f lacks a complete exported definition and remains omitted.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 476ee994-f9a6-21f8-16ac-bcd937a23da5
              - 64531256-e997-1a46-caf9-45de4bd95bbe
              - 38fdc3b5-7de4-b15c-6577-3f3142bb313e
              - 312c880f-3b26-2eef-48ff-7f2795ed33ef
              - 49465e07-b9f2-275e-293a-61c00c62a4a0
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_cvd_63_base
    description: >
      One row per registered living person aged 40 to under 84 in the shared CVD_63/64/65
      population, assessed today. Requires the latest QRISK numeric value >=10, with no date
      window, and excludes the shared metabolic population. Excludes persistent statin adverse
      reactions at any date and statin contraindication, not indicated or not tolerated on or
      before today. EMIS-local adverse codes match exactly; public originals retain their
      SNOMED meaning. Permits statin treatment and recent NHS health checks. Excludes current
      QOF palliative care register membership (ea06414e). Library 3de35e4f lacks a complete
      exported definition and remains omitted.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - a06baf8e-f9c8-30ab-cee1-c2ba3af35902
              - cd58c9a2-0e17-f7fe-30d3-effd2a7ec9aa
              - bc214a50-595d-7b11-b391-6f3d8ef2aa96
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_cvd_61_woEX
    description: >
      ICB_CF_CVD_61_woEX: CVD_61_BASE with QRISK refset latest numeric value >= 20. Pre-Rule-1
      cohort consumed by CVD_61 and as a mutual-exclusion set by 62-66.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 89e5bfaa-b61e-92e0-8e4d-00d41f703b64  # people_at_high_risk_cvd_eligible_pop_with_qrisk20_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_cvd_62_woEX
    description: >
      ICB_CF_CVD_62_woEX: CVD_61_BASE, excluding the CVD_61_woEX cohort, with QRISK refset latest
      numeric value >= 15 and < 20. Pre-Rule-1 cohort.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 61b18223-5ea9-7e25-e497-f81bde391db3  # people_at_high_risk_cvd_eligible_population_with_qr15_20_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_cvd_63_woEX
    description: >
      One row per person in CVD_63_BASE with latest non-HDL cholesterol >2.5 mmol/L,
      matching EMIS-local non-HDL codes exactly before selecting the latest result,
      excluding CVD_61/62_woEX, before the high-risk-review-decline exclusion. Includes a
      statin-product issue, STAT_COD issue or STAT_COD clinical event strictly after 12 months
      ago, selecting the latest record on or before today in each arm. The non-HDL result
      has no date window. Dated non-HDL records take precedence over undated records.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 23f72268-d2d1-6fb0-9fe5-19eeb497790e  # qrisk2_10_on_a_statin_and_a_non_hdl_25_vs1
              - ebb22ff5-788c-4989-66a7-aaf7a68ebb62
              - 624085a5-e1b3-e962-99f1-e7a6270a20e5
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_cvd_64_woEX
    description: >
      One row per person in CVD_63_BASE, excluding CVD_61/62/63_woEX, before the
      high-risk-review-decline exclusion. Excludes STAT_COD issues or clinical events strictly
      after 12 months ago and statin decline strictly after five years ago, selecting the
      latest matching record on or before today in each arm. There is no QRISK upper limit.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 73a1adb2-031d-ffa6-1c8a-e0662ddbc9b4  # with_a_qrisk2_10_and_not_on_a_statin_vs1
              - 4ff4b3d4-c379-00dd-3603-bcdb169589c0
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_cvd_65_woEX
    description: >
      One row per currently registered, living person aged 40 to under 84 at build date
      with latest QRISK >= 10 on a current repeat statin course. Uses national statin
      refset ^12464001000001103 (STAT_COD, cached in ECL_CACHE), as agreed by the technical
      lead, instead of the XML's five-ingredient list. Retains the XML's 19 product
      exceptions and their descendants, including 80 mg atorvastatin, simvastatin and
      fluvastatin and rosuvastatin 10-40 mg. The same medication statement must be active
      with source authorisation Automatic, Repeat or Repeat Dispensing; no recent issue
      or course-start lookback is required. Excludes CVD_61-64_woEX, the shared metabolic
      population, inherited CVD_63_BASE therapy exclusions and ever-recorded lipid-lowering
      therapy exceptions such as decline or maximum tolerated dose. Before the final
      review-decline exclusion. The LTC LCS reference data is unchanged.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - ed40f2e7-f9f3-1a17-104a-42af018aaf32  # with_qrisk210_amd_not_on_a_high_intensity_statin_vs1
              - fdead4de-c567-b1c4-15af-7e6a88bfb587  # with_qrisk210_amd_not_on_a_high_intensity_statin_vs2
      - cluster_ids_exist:
          arguments:
            cluster_ids: STAT_COD
            source: ECL_CACHE
            versioned: false
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_cvd_66_woEX
    description: >
      One row per registered living person aged 75 to under 84, assessed today, before
      the high-risk-review-decline exclusion. Excludes the shared metabolic population, NHS
      health checks in the last two years and CVD_61-65_woEX. Excludes STAT_COD issues or
      clinical events strictly after 12 months ago and statin decline strictly after five years
      ago, selecting the latest record on or before today in each arm. Excludes persistent
      statin adverse reactions at any date and contraindication, not indicated or not tolerated
      on or before today. EMIS-local adverse codes match exactly. Requires no QRISK event on
      or after the five-year anniversary, regardless of its numeric value; there is no upper
      event-date limit. Excludes current QOF palliative care register membership (ea06414e).
      Library 3de35e4f lacks a complete exported definition and remains omitted.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 6cf0e193-860f-4b76-9d06-09a3037d09eb
              - 75140610-d834-c931-9efa-3f47eaf12f5a
              - 4b0f96a0-5505-e71e-1db3-09f5f557ce99
              - c2aa42c9-1dc5-ef51-69f1-80caa1d29cd5
              - a1c6f038-fa5a-8265-93aa-1a1eecf71007  # aged_75_84_years_who_are_not_on_a_statin_and_no_qriskin_l5y_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_cvd_61
    description: >
      ICB_CF_CVD_61: CVD_61_woEX excluding anyone with a "Cardiovascular disease high risk review
      declined" code in the last 3 years. One row per included person.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 685fbf55-eda4-0f70-9bfc-3a0b55508944  # people_at_high_risk_cvd_eligible_pop_with_qrisk20_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_cvd_62
    description: >
      ICB_CF_CVD_62: CVD_62_woEX excluding "Cardiovascular disease high risk review declined" in
      the last 3 years. One row per included person.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 68d3e80c-08d3-7134-0eb7-4b53b0a59b4b  # people_at_high_risk_cvd_eligible_population_with_qrisk_15_20_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_cvd_63
    description: >
      ICB_CF_CVD_63: CVD_63_woEX excluding "Cardiovascular disease high risk review declined" in
      the last 3 years. One row per included person.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - a318069f-408c-4436-fbaa-070018f2db3a  # qrisk2_10_on_a_statin_and_a_non_hdl_25_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_cvd_64
    description: >
      ICB_CF_CVD_64: CVD_64_woEX excluding "Cardiovascular disease high risk review declined" in
      the last 3 years. One row per included person.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 20072ac6-a53f-00e5-6e47-a40a38a59995  # with_a_qrisk2_10_and_not_on_a_statin_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_cvd_65
    description: >
      CVD_65_woEX people without a "Cardiovascular disease high risk review declined"
      record in the last three years. One row per person. Current repeat statin courses
      use national refset ^12464001000001103 (STAT_COD, cached in ECL_CACHE), as agreed
      by the technical lead, with the XML's 19 product exceptions and their descendants.
      The active status and source authorisation Automatic, Repeat or Repeat Dispensing
      must belong to the same statement. The LTC LCS reference data is unchanged.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - e291831b-466c-ed7a-bba4-eeef6449a8f6  # with_qrisk210_amd_not_on_a_high_intensity_statin_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_cvd_66
    description: >
      ICB_CF_CVD_66: CVD_66_woEX excluding "Cardiovascular disease high risk review declined" in
      the last 3 years. One row per included person.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - ae5b5d5d-a74a-a1b1-38db-071db479f3ca  # aged_75_84_years_who_are_not_on_a_statin_and_no_qrisk_in_l5y_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]
