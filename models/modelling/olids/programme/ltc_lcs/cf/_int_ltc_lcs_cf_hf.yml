version: 2

models:
  - name: int_ltc_lcs_cf_hf_61_base_woEX
    description: >
      One row per currently registered, living person outside the metabolic LTC
      population, not on the AF/HF register and without an HF-evidence code.
      Includes HF-specific medication, SGLT2/digoxin-group or digoxin orders
      strictly within three months; latest pro-BNP > 400 without a cardiology
      referral, HF-excluded or normal/diastolic-dysfunction LV echo code on or
      after its date; or latest pro-BNP strictly within two years > 2000 without
      HF excluded on or after its date. Also includes people whose latest record
      in each cardiomyopathy/HF-excluded and breathlessness/HF-excluded pool is
      not HF excluded. Otherwise includes spironolactone orders strictly within
      three months, except females aged under 40 with hirsutism, acne or alopecia.
      This carve-out applies only to the spironolactone route. HF_61 applies the
      final three-year HF-excluded rule. NHS Health Check exclusions do not apply.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - eligible_for_hf_casefinding_vs1
              - 299f9e3b-bbab-c65e-c19e-9c531f91755a  # hf_case_finding_eligible_patients_vs1 (woEX)
              - hf_case_finding_eligible_patients_vs2
              - hf_case_finding_eligible_patients_vs3
              - hf_case_finding_eligible_patients_vs4
              - hf_case_finding_eligible_patients_vs5
              - hf_case_finding_eligible_patients_vs6
              - hf_case_finding_eligible_patients_vs7
              - hf_case_finding_eligible_patients_vs8
              - hf_case_finding_eligible_patients_vs9
              - hf_case_finding_eligible_patients_vs10
              - hf_case_finding_eligible_patients_vs11
              - hf_case_finding_eligible_patients_vs12
              - hf_case_finding_eligible_patients_vs13
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_hf_61
    description: >
      ICB_CF_HF_61: HF case-finding eligible patients (base_woEX) excluding anyone
      with a "Heart failure excluded" code in the last 3 years. One row per included
      person.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 9228a15e-e6cb-1dd2-6074-0c306c800c1b  # hf_case_finding_eligible_patients_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]
