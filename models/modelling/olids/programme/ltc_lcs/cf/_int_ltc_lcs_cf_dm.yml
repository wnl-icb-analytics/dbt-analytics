version: 2

models:
  - name: int_ltc_lcs_cf_dm_61_woEX
    description: >
      One row per currently registered, living person aged at least 17, outside the
      metabolic LTC population and with no NHS Health Check in the last 24 months.
      Selects the latest positive HbA1c from the three-code IFCC set, in mmol/mol.
      Valueless and non-positive records do not replace an older positive result.
      Requires HbA1c >= 48. Excludes a person only if their latest record across the
      seven-code remission/HbA1c pool belongs to the four-code remission/resolution set.
      A later HbA1c overrides an older remission marker.
      Pre-Rule-1 population used by DM_61 and excluded by DM_62-66.
      Local list roots match exactly; local descriptions of listed public concepts still match.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - b7ce1049-b4c0-1477-ec22-7696854f03ed  # latest_hba1c_48_and_no_diagnosis_of_dm_vs1 (woEX pool)
              - 919fb132-083e-bba0-d8b6-d21e9846dcae
              - 68968843-a4fb-1a67-29d0-bfe7f33b241e  # latest_hba1c_48_and_no_diagnosis_of_dm_vs2
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_dm_61
    description: >
      One row per included person in DM_61_woEX, whose latest positive HbA1c is >= 48
      mmol/mol, excluding annual review declined strictly within three years.
      Local list roots match exactly; local descriptions of listed public concepts still match.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 877b18f5-9756-23a8-7a41-1900d12e70fa  # latest_hba1c_48_and_no_diagnosis_of_dm_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_dm_62_woEX
    description: >
      One row per currently registered, living person aged at least 17, outside the
      metabolic LTC population and with no NHS Health Check in the last 24 months.
      Requires gestational diabetes evidence, no DM_61_woEX membership and no HbA1c
      record strictly after one year before the build date, regardless of its value.
      Subtracted by DM_63-66.
      Local list roots match exactly; local descriptions of listed public concepts still match.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 8827e417-8374-c4e2-a76b-d1b6f2c1ee5d
              - 56fd73ba-981e-cab3-0404-8c26b02afb36  # gestational_dm_and_no_hba1c_in_the_last_year_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_dm_62
    description: >
      One row per included person in DM_62_woEX with gestational diabetes and no HbA1c
      strictly within one year, excluding annual review declined strictly within three years.
      Local list roots match exactly; local descriptions of listed public concepts still match.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 5d6cf960-e4cd-9015-fd93-5105d7bf219a  # gestational_dm_and_no_hba1c_in_the_last_year_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_dm_63_woEX
    description: >
      One row per currently registered, living person aged at least 17, outside the
      metabolic LTC population and with no NHS Health Check in the last 24 months.
      Selects the latest positive HbA1c from the three-code IFCC set, in mmol/mol.
      Valueless and non-positive records do not replace an older positive result.
      Requires HbA1c >= 46 and < 48, dated on or before one year before the build date.
      Excludes DM_61/62_woEX and is subtracted by DM_64-66.
      Local list roots match exactly; local descriptions of listed public concepts still match.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 160ec384-bb4f-915b-9a8e-66d118eefe0c  # latest_hba1c_46_47_and_no_hba1c_in_the_last_year_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_dm_63
    description: >
      One row per included person in DM_63_woEX, whose latest positive HbA1c is >= 46
      and < 48 mmol/mol and dated on or before one year before the build date.
      Excludes annual review declined strictly within three years.
      Local list roots match exactly; local descriptions of listed public concepts still match.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 776f1587-24f9-1d71-a7ff-6ff4e2a1c27d  # latest_hba1c_46_47_and_no_hba1c_in_the_last_year_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_dm_64_base
    description: >
      One row per currently registered, living person aged at least 17, outside the
      metabolic LTC population and with no NHS Health Check in the last 24 months.
      Requires latest BMI >= 35 kg/m2, or >= 32.5 with qualifying BAME ethnicity.
      The ethnicity route requires at least one record in the ethnicity pool; every
      record among the latest 999 must pass the non-BAME exclusion test, with BAME
      exception children removed. Used by DM_64_woEX and excluded by DM_65_BASE.
      Local list roots match exactly; local descriptions of listed public concepts still match.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 631c11e6-1a77-2cd0-0dd3-3ef61868842c
              - 55c83e52-63f7-477c-82c8-9b172815352c  # obesity_with_latest_bmi_35_325_bame_population_vs2
              - f0c4af8c-f818-da47-ba29-600c2f13e09f
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_dm_64_woEX
    description: >
      One row per person in DM_64_BASE outside DM_61/62/63_woEX, with no HbA1c record
      strictly after two years before the build date, regardless of its value.
      Subtracted by DM_65-66.
      Local list roots match exactly; local descriptions of listed public concepts still match.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 5bf8f69d-5b7e-b917-f3bf-4dcda11c8b6f  # with_latest_bmi_35325bame_populationand_no_hba1c_in_l2y_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_dm_64
    description: >
      One row per included person in DM_64_woEX with latest BMI >= 35 kg/m2
      (>= 32.5 with qualifying BAME ethnicity), and no HbA1c strictly within two years.
      Excludes annual review declined strictly within three years.
      Local list roots match exactly; local descriptions of listed public concepts still match.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 4ed7513e-8c5c-68c8-3850-f4bff1387f79  # with_latest_bmi_35325bame_populationand_no_hba1c_in_l2y_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_dm_65_woEX
    description: >
      One row per currently registered, living person aged at least 17, outside the
      metabolic LTC population and with no NHS Health Check in the last 24 months.
      Excludes DM_64_BASE. Requires latest BMI >= 30 and < 35 kg/m2, or >= 27.5 and
      < 32.5 with qualifying BAME ethnicity. The ethnicity route requires at least one
      record in the ethnicity pool; every record among the latest 999 must pass the
      non-BAME exclusion test, with BAME exception children removed. Excludes
      DM_61/62/63/64_woEX and any HbA1c record strictly after two years before the build
      date, regardless of its value. Subtracted by DM_66.
      Local list roots match exactly; local descriptions of listed public concepts still match.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 75b5fe04-32b9-cb6b-1d1d-79b8183e75c4
              - 2e9a5dbb-a1f2-19ff-d657-bf70de2d2c43  # obesity_with_latest_bmi_30_35_275_325_bame_population_vs2
              - 396f1048-e18e-908e-b0d3-958d23d46607
              - dd384e6e-92e2-04b5-f1f9-17c119852411  # with_latest_bmi_30275bame_pop_no_hba1c_in_l2y_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_dm_65
    description: >
      One row per included person in DM_65_woEX with latest BMI >= 30 and < 35 kg/m2
      (>= 27.5 and < 32.5 with qualifying BAME ethnicity), and no HbA1c strictly within
      two years. Excludes annual review declined strictly within three years.
      Local list roots match exactly; local descriptions of listed public concepts still match.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 49bd264d-50de-3a1f-09e3-c06db976f89b  # with_latest_bmi_30275bame_populationand_no_hba1c_in_l2y_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_dm_66
    description: >
      One row per currently registered, living person aged at least 17, outside the
      metabolic LTC population and with no NHS Health Check in the last 24 months.
      Selects the latest positive HbA1c from the three-code IFCC set, in mmol/mol.
      Valueless and non-positive records do not replace an older positive result.
      Requires HbA1c >= 42 and < 46, dated on or before one year before the build date.
      Excludes higher-priority DM_61-65_woEX and annual review declined strictly within
      three years.
      Local list roots match exactly; local descriptions of listed public concepts still match.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - a4dfc336-6ec7-4cec-21fa-c7d3e7842f2d  # latest_hba1c_42_45_and_no_hba1c_in_the_last_year_vs1
              - 343c45e1-2edb-f252-16d1-d6e1955659ea  # latest_hba1c_42_45_and_no_hba1c_in_the_last_year_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]
