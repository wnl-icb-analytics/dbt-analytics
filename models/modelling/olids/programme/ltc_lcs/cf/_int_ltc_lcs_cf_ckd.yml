version: 2

models:
  - name: int_ltc_lcs_cf_ckd_61_base
    description: >
      One row per currently registered, living person aged at least 17 in the CKD_61
      base, excluding the shared metabolic population and any recorded CKD-stage code.
      Equivalent local roots also permit mapped concepts and requested descendants.
      The XML also rejects EMIS library items 3de35e4f and c913f5a7, which are not in the export and are not implemented.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - d83d89d4-dfed-6717-12ce-15a4002c9167
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_ckd_64_base
    description: >
      One row per currently registered, living person aged at least 17 outside the shared
      metabolic population with no eGFR code dated strictly after one year before the
      build date. Uses the shared LTC LCS equivalence rule, regardless of numeric result.
      The XML also rejects EMIS library items 3de35e4f and c913f5a7, which are not
      in the export and are not implemented.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - a491afe2-cbfe-8024-0c9b-09749af1c569
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_ckd_61_woEX
    description: >
      One row per person in the CKD_61 base with at least two positive eGFR observations
      in the eight-code pool. The latest positive result in the six-code pool and the
      latest positive result on an earlier calendar date must both be < 60 mL/min/1.73 m2.
      There is no recency window or minimum interval beyond the earlier date.
      Matching follows the shared LTC LCS equivalence rule. Supplies CKD_61 and
      exclusions for the later CKD helpers.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - cc380a59-cc4c-ee42-4a2e-30ab9286dc71  # with_most_recent_2_egfr60_and_not_on_ckd_reg_vs1
              - c9896ca5-15c8-0009-a57a-bd6f5067dcad
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_ckd_62_woEX
    description: >
      One row per person in the CKD_61 base outside the CKD_61 helper, with at least two
      positive UACR observations. The latest positive UACR and the latest
      positive UACR on an earlier calendar date must both be > 4 mg/mmol.
      There is no recency window or minimum interval beyond the earlier date. EMIS-local UACR
      codes mapped as equivalent to a public concept also match that concept; other local
      codes match their exact code only. Supplies CKD_62 and exclusions for the later CKD helpers.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - c75746ce-5d7b-1647-f08a-ef5b10445f4c
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_ckd_63_woEX
    description: >
      One row per person in the CKD_61 base outside the CKD_61 and CKD_62 helpers, whose
      latest positive UACR is > 70 mg/mmol (local UACR codes follow the same equivalence rule). There is no date window or second
      result requirement. Supplies CKD_63 and the CKD_64 helper exclusion.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 6bfbf92c-3c89-cc89-f541-a7dcaa945562
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_ckd_64_woEX
    description: >
      One row per person in the CKD_64 base outside the CKD_61/62/63 helpers, with AKI
      on or after three years before the build date, an at-risk condition ever recorded,
      or specified medication issued strictly after six months before the build date.
      Also includes the latest microscopic haematuria or red-cell microscopy record
      without a negative urine blood test or red-cell microscopy on or after its calendar
      date, or the latest microscopic haematuria diagnosis with any UACR
      > 30 mg/mmol on or after its date.
      A microscopy record cancels itself; no numeric test applies to cancellation.
      Haematuria links do not restrict the other arms. Public and equivalent local roots
      permit mapped concepts and requested descendants. Other local roots match source codes exactly. Lithium salts use the national
      ECL_CACHE LIT_COD refset alongside the explicit XML lithium ingredients. The tacrolimus
      arm excludes Protopic 0.03%/0.1% ointment, tacrolimus 0.005% mouthwash and
      tacrolimus 0.03%/0.1% ointment, including descendants. Any permitted recent issue
      qualifies; medication is not restricted to the latest issue.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: LIT_COD
            source: ECL_CACHE
            versioned: false
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 4fad1128-518d-aab7-8bb8-ed51bd35c7b6  # at_risk_of_ckd_who_are_not_on_ckd_reg_vs1
              - a30e0c52-efd9-9ce9-c56a-6d1469fc64d4
              - 7d11f002-bdf4-e22d-4aa4-5e1de14bb3af
              - 67b57e4a-b4c4-f213-726c-bcead7df9e1a
              - 37f2f047-d4b2-bf56-5c7b-2a9788936448
              - 5bf47b55-ccf0-9e25-d7d1-0a7f4b5f3dac
              - 63bf0d9b-589c-905a-abd2-e59190e02053
              - 3b7a55b7-b9a6-f23b-60d6-1015949622d2
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_ckd_61
    description: >
      One row per eligible, currently registered, living person aged at least 17 in the
      CKD_61 helper, excluding screening dated strictly after three years before the build
      date and current CKD register membership. Both the latest positive six-code eGFR and the latest positive result on an earlier
      date are < 60 mL/min/1.73 m2; at least two eight-code positive observations exist.
      Register membership uses the QOF CKD register (fct_person_ckd_register)
      as a proxy for the EMIS LTC LCS CKD register.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 6e168908-5577-8967-f124-d109c66126e1  # with_most_recent_2_egfr60_and_not_on_ckd_reg_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_ckd_62
    description: >
      One row per eligible, currently registered, living person aged at least 17 in the
      CKD_62 helper, excluding screening dated strictly after three years before the build
      date and current CKD register membership. Both the latest positive UACR and the latest positive result on an earlier
      date are > 4 mg/mmol; at least two positive observations exist. Excludes CKD_61 helper.
      Register membership uses the QOF CKD register (fct_person_ckd_register)
      as a proxy for the EMIS LTC LCS CKD register.
      The register exclusion is not in the CKD_62 XML. It is retained for consistency
      with the 1N searches; the base already excludes CKD-stage codes.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 1daf7ba0-0a74-840c-3af3-83affee70a7f
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_ckd_63
    description: >
      One row per eligible, currently registered, living person aged at least 17 in the
      CKD_63 helper, excluding screening dated strictly after three years before the build
      date and current CKD register membership. The latest positive UACR is > 70 mg/mmol. Excludes CKD_61 and CKD_62 helpers.
      Register membership uses the QOF CKD register (fct_person_ckd_register)
      as a proxy for the EMIS LTC LCS CKD register.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 21ca7a93-5261-c6d6-0e7d-29f497aeb753
    columns:
      - name: person_id
        data_tests: [not_null, unique]

  - name: int_ltc_lcs_cf_ckd_64
    description: >
      One row per eligible, currently registered, living person aged at least 17 in the
      CKD_64 helper, excluding screening dated strictly after three years before the build
      date and current CKD register membership. Inherits the CKD_64 base and at-risk arms, including both linked haematuria routes,
      after excluding CKD_61/62/63 helpers.
      Register membership uses the QOF CKD register (fct_person_ckd_register)
      as a proxy for the EMIS LTC LCS CKD register.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 7b63b8f0-5846-9636-b5b0-7c2e2f177f30  # at_risk_of_ckd_who_are_not_on_ckd_reg_vs1
    columns:
      - name: person_id
        data_tests: [not_null, unique]
