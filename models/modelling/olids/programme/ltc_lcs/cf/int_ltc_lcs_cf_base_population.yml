models:
  - name: int_ltc_lcs_cf_base_population
    description: >
      Currently registered, living people with age and exclusion flags for LTC LCS case
      finding, one row per person. No condition or health-check exclusions are applied here.
      Each case-finding base applies the flags its EMIS search requires.
      has_metabolic_excluding_condition flags the ICS_METABOLIC_LTC conditions: AF, CKD,
      CHD, hypertension, heart failure, stroke/TIA, PAD, NAFLD and diabetes register
      membership, or any hyperlipidaemia record ever, including descendants. Uses the
      programme COPD and NAFLD registers; other register proxies and their limitations
      are documented in int_ltc_lcs_cf_exclusions. has_respiratory_excluding_condition
      flags the ICS_RESP_LTC conditions: COPD, adult asthma (age 18+) and CYP asthma.
      had_nhs_health_check_24m flags a completed NHS Health Check, HEALTH_CHECK_COMP, on
      or after the date 24 months before the build date.
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id
    columns:
      - name: person_id
        data_tests:
          - not_null
          - unique
    config:
      meta:
        indicator:
          id: "LTC_LCS_CF_BASE_POPULATION"
          type: "POPULATION"
          category: "CASE_FINDING"
          clinical_domain: "Population Health Management"
          name_short: "LTC/LCS base population"
          description_short: "Registered, living population with case-finding exclusion flags"
          description_long: >
            Currently registered, living people with metabolic, respiratory and NHS Health
            Check exclusion flags. No exclusions are applied in this model. AF, CKD, CVD,
            diabetes, HF and hypertension bases apply the metabolic flag; CYP asthma uses
            the respiratory flag. Each base applies the health-check flag where EMIS does.
          is_qof: false
          source_column: "person_id"
          sort_order: "LTC_LCS_BASE_001"
          usage_contexts:
            - "LTC_LCS_DASHBOARD"
            - "CASE_FINDING_PROGRAMME"
          code_clusters:
            - cluster_id: "HEALTH_CHECK_COMP"
              category: "EXCLUSION"
            - cluster_id: "CKD_COD"
              category: "EXCLUSION"
            - cluster_id: "AFIB_COD"
              category: "EXCLUSION"
            - cluster_id: "HTN_COD"
              category: "EXCLUSION"
            - cluster_id: "CHD_COD"
              category: "EXCLUSION"
            - cluster_id: "STIA_COD"
              category: "EXCLUSION"
            - cluster_id: "PAD_COD"
              category: "EXCLUSION"
            - cluster_id: "HF_COD"
              category: "EXCLUSION"
            - cluster_id: "DM_COD"
              category: "EXCLUSION"
            - cluster_id: "SLD_DX_CODES"
              category: "EXCLUSION"
          thresholds:
            - population_group: "ALL_ADULTS"
              threshold_type: "NHS_HEALTH_CHECK_EXCLUSION"
              threshold_value: "24"
              threshold_operator: "WITHIN"
              threshold_unit: "months"
              description: "Flag completed NHS health checks in the last 24 months"
              sort_order: 1
        owner:
          name: EddieDavison92
