models:
  - name: int_ltc_lcs_rs_dm_pg3a_mra
    description: |-
      Diabetes MRa membership, one row per register member. Excludes PG1/PG2; HbA1c >58 and <=75 plus recent CHD/stroke/TIA, low eGFR, high ACR or BP >=140/90. BP uses the latest reading of any type; the EMIS date-linked BP chain is not reproduced.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_dm_reg_priority_group_3a_mra_vs1
              - on_dm_reg_priority_group_3a_mra_vs2
              - on_dm_reg_priority_group_3a_mra_vs3
              - on_dm_reg_priority_group_3a_mra_vs4
              - on_dm_reg_priority_group_3a_mra_vs5
              - on_dm_reg_priority_group_3a_mra_vs6
    columns:
      - name: person_id
        tests:
          - not_null
          - unique
