models:
  - name: int_ltc_lcs_rs_dm_pg3a_mra
    description: >
      Diabetes MRa membership, one row per register member outside PG1/PG2. HbA1c >58 and <=75 plus recent CHD/stroke/TIA, low eGFR, high ACR or BP >=140 systolic or >=90 diastolic. BP uses the shared selector with the diabetes XML code pools, raw clinical dates and same-date BP_COD links. Each component ranks only among dates with BP_COD and linked systolic evidence, by date, save time and observation ID. No plausibility fallback applies.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_dm_reg_priority_group_3a_mra_vs1
              - on_dm_reg_priority_group_3a_mra_vs2
              - on_dm_reg_priority_group_3a_mra_vs3
              - on_dm_reg_priority_group_3a_mra_vs4
              - on_dm_reg_priority_group_3a_mra_vs5
              - on_dm_reg_priority_group_3a_mra_vs6
    columns:
      - name: person_id
        tests:
          - not_null
          - unique
