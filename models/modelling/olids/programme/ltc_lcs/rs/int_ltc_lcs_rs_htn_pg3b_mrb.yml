models:
  - name: int_ltc_lcs_rs_htn_pg3b_mrb
    description: >
      Hypertension MRb membership, one row per register member outside PG1/PG2/PG3A with BP monitoring in 12 months. Excludes control at clinic <=140/90 or home/ABPM <=135/85, relaxed above age 80 to <=150/90 or <=145/85. Unresolved chains remain included. BP components link by calendar date to the XML setting markers before ranking by clinical date, save time and observation ID. Only the home-setting wrapper ranks before linking. Values need only be >=1; there is no plausibility fallback.
    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_htn_reg_priority_group_3b_mrb_v3_vs1
              - on_htn_reg_priority_group_3b_mrb_v3_vs2
    columns:
      - name: person_id
        tests:
          - not_null
          - unique
