version: 2
models:
  - name: int_ltc_lcs_rs_copd_pg3_mr
    description: |-
      COPD MR membership, one row per register member outside PG1/PG2.
      Includes FEV1 >=50 and <80%, MRC grades 1-3, the EMIS-local one-exacerbation
      code, at least two antibiotic issues, any prednisolone or azithromycin issue
      in the inclusive last 12 months, or a Trimbow or Trelegy Ellipta issue in the
      inclusive last 6 months.
      Local exacerbation codes use the shared equivalence rule.
    config:
      meta:
        owner:
          name: Peter Shakeshaft
    columns:
      - name: person_id
        tests:
          - not_null
          - unique
    data_tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
      - cluster_ids_exist:
          arguments:
            cluster_ids: COPD_TRIPLE_THERAPY_INHALERS
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_copd_reg_pg3_mr_vs1
              - on_copd_reg_pg3_mr_vs2
              - on_copd_reg_pg3_mr_vs4
              - on_copd_reg_pg3_mr_vs5
              - on_copd_reg_pg3_mr_vs6
              - on_copd_reg_pg3_mr_vs8
              - on_copd_reg_pg3_mr_vs9
              - on_copd_reg_pg3_mr_vs10
              - on_copd_reg_pg3_mr_vs11
              - on_copd_reg_pg3_mr_vs12
              - on_copd_reg_pg3_mr_vs13
              - on_copd_reg_pg3_mr_vs14
              - on_copd_reg_pg3_mr_vs15
              - be744271-2fb5-7e10-18f6-041df010ebf7
