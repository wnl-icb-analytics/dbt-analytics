version: 2
models:
  - name: int_ltc_lcs_rs_nafld_pg3_mr
    description: |
      NAFLD Register Priority Group 3 - Medium Risk.
      NB: NAFLD has no PG1/PG2; PG3 is its only priority group.

      Patients on the LTC LCS NAFLD register (int_ltc_lcs_nafld_register,
      the EMIS NAFLD Register v2 definition) meeting (latest = latest reading
      in last 3 years):
      - Rule 1: latest NAFLD fibrosis score > 3.25 (include on pass)
      - Rule 2: latest NAFLD fibrosis score > 1.3 and <= 3.25 with latest
        ELF score >= 9.8 (include on pass)
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - nafld_reg_v2_vs1
              - nafld_reg_v2_vs2
              - on_nafld_reg_pg3_mr_vs1
              - on_nafld_reg_pg3_mr_vs2
    columns:
      - name: person_id
        data_tests:
          - not_null
          - unique
