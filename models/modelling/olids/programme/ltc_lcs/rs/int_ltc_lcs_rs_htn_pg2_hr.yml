models:
  - name: int_ltc_lcs_rs_htn_pg2_hr
    description: >
      Hypertension HR membership, one row per register member outside PG1 with BP monitoring in 12 months. Includes uncontrolled stage 2 BP (clinic <=160/100; home <=150/95 defines control), or ethnicity plus comorbidity without stage 1 control (clinic <=140/90; home <=135/85). Unresolved chains remain included. BP components link by calendar date to the XML setting markers before ranking by clinical date, save time and observation ID. Only the home-setting wrapper ranks before linking. Values need only be >=1; there is no plausibility fallback.
    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_htn_reg_pg2_hr_v3_vs1
              - on_htn_reg_pg2_hr_v3_vs2
              - priority_group_2b_icb_v3_vs3
              - priority_group_2b_icb_v3_vs4
              - priority_group_2b_icb_v3_vs5
              - priority_group_2b_icb_v3_vs6
              - priority_group_2b_icb_v3_vs7
              - priority_group_2b_icb_v3_vs8
              - priority_group_2b_icb_v3_vs9
              - priority_group_2b_icb_v3_vs10
              - priority_group_2b_icb_v3_vs11
    columns:
      - name: person_id
        tests:
          - not_null
          - unique
