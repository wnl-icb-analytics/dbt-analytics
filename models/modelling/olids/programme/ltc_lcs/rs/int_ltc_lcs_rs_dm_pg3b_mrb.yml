models:
  - name: int_ltc_lcs_rs_dm_pg3b_mrb
    description: >
      Diabetes MRb membership, one row per register member outside PG1/PG2/PG3A. HbA1c >58 and <=75, or >48 and <=58 with a qualifying complication, treatment, renal result or BP >=140 systolic or >=90 diastolic. BP uses the shared selector with the diabetes XML code pools, raw clinical dates and same-date BP_COD links. Latest components rank by date, save time and observation ID, with no plausibility fallback.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_dm_reg_priority_group_3b_mrb_vs1
              - on_dm_reg_priority_group_3b_mrb_vs2
              - on_dm_reg_priority_group_3b_mrb_vs3
              - on_dm_reg_priority_group_3b_mrb_vs4
              - on_dm_reg_priority_group_3b_mrb_vs5
              - on_dm_reg_priority_group_3b_mrb_vs6
              - on_dm_reg_priority_group_3b_mrb_vs7
            # vs8 excluded - Insulins drug group has no SNOMED mapping, using BNF 060101 fallback
              - on_dm_reg_priority_group_3b_mrb_vs9
              - on_dm_reg_priority_group_3b_mrb_vs10
              - on_dm_reg_priority_group_3b_mrb_vs11
              - on_dm_reg_priority_group_3b_mrb_vs12
    columns:
      - name: person_id
        tests:
          - not_null
          - unique
