models:
  - name: int_ltc_lcs_rs_htn_pg3a_mra
    description: |
      Hypertension Register Priority Group 3A - Medium Risk (a).
      Exclusion-shaped per the EMIS v3 search: patients with a BP monitoring
      code in the last 12 months, not in PG1 or PG2, with a qualifying
      comorbidity, are included unless their latest paired BP reading is
      controlled at stage 1 (clinic <= 140/90, home/ABPM <= 135/85).
      Patients whose monitoring codes have no resolvable paired reading
      are included, mirroring the EMIS exclude-the-controlled structure.

      Comorbidities (any one):
      - vs3: CHD (episode type not Review or Ended)
      - vs4+vs5: Stroke/TIA (episode type not Review or Ended)
      - vs6: PAD (episode type not Review or Ended)
      - vs7: CKD
      - vs8: eGFR < 60
      - vs9: Diabetes
      - vs10: Ethnicity (EMIS-defined valueset)
    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_htn_reg_priority_group_3a_mra_v3_vs1
              - on_htn_reg_priority_group_3a_mra_v3_vs2
              - on_htn_reg_priority_group_3a_mra_v3_vs3
              - on_htn_reg_priority_group_3a_mra_v3_vs4
              - on_htn_reg_priority_group_3a_mra_v3_vs5
              - on_htn_reg_priority_group_3a_mra_v3_vs6
              - on_htn_reg_priority_group_3a_mra_v3_vs7
              - on_htn_reg_priority_group_3a_mra_v3_vs8
              - on_htn_reg_priority_group_3a_mra_v3_vs9
              - on_htn_reg_priority_group_3a_mra_v3_vs10
    columns:
      - name: person_id
        tests:
          - not_null
          - unique
