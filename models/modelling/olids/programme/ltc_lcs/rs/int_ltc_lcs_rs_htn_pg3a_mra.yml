models:
  - name: int_ltc_lcs_rs_htn_pg3a_mra
    description: >
      Hypertension MRa membership, one row per register member outside PG1/PG2 with BP monitoring in 12 months and a qualifying comorbidity or ethnicity. Excludes latest clinic BP <=140/90 or home/ABPM <=135/85; unresolved chains remain included. BP components rank by clinical date, save time and observation ID, then link by calendar date to the XML setting markers. Values need only be >=1; there is no plausibility fallback.
    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_htn_reg_priority_group_3a_mra_v3_vs1
              - on_htn_reg_priority_group_3a_mra_v3_vs2
              - on_htn_reg_priority_group_3a_mra_v3_vs3
              - on_htn_reg_priority_group_3a_mra_v3_vs4
              - on_htn_reg_priority_group_3a_mra_v3_vs5
              - on_htn_reg_priority_group_3a_mra_v3_vs6
              - on_htn_reg_priority_group_3a_mra_v3_vs7
              - on_htn_reg_priority_group_3a_mra_v3_vs8
              - on_htn_reg_priority_group_3a_mra_v3_vs9
              - on_htn_reg_priority_group_3a_mra_v3_vs10
    columns:
      - name: person_id
        tests:
          - not_null
          - unique
