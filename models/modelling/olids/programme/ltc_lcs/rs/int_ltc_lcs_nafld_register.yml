version: 2
models:
  - name: int_ltc_lcs_nafld_register
    description: |
      One row per currently registered, living, non-test person with any diagnosis
      in the two exported EMIS 'LTC LCS: NAFLD Register v2*' code lists, ever recorded.
      Includes fatty liver, steatosis, steatohepatitis and MASLD/MASH records.
      Alcoholic steatosis and alcoholic steatohepatitis records and their descendants
      are excluded, as in the XML. Any other qualifying record retains the person.
      No age or recency restriction. Public and equivalent local roots permit mapped
      concepts and requested descendants; other local roots match source codes exactly.
      Uses the XML lists rather than the broader SLD_DX_CODES cluster. Parent for NAFLD
      risk stratification and the LTC LCS base population. Aggregate agreement with EMIS remains incomplete.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - 08654d02-552a-7784-076c-e7fcc941d284
              - f0bfa8e2-972c-1cba-326f-573ef42e6124
    columns:
      - name: person_id
        data_tests:
          - not_null
          - unique
