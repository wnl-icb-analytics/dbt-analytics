models:
  - name: int_ltc_lcs_rs_htn_pg1_hrc
    description: >
      Hypertension HRC membership, one row per register member with BP monitoring in 12 months and no controlled latest clinic/home chain. Clinic control is <=180/120; home/ABPM is <=170/115. Unresolved chains remain included. BP components link by calendar date to the XML setting markers before ranking by clinical date, save time and observation ID. Only the home-setting wrapper ranks before linking. Values need only be >=1; there is no plausibility fallback.
    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_utils.at_least_one:
          column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_htn_reg_pg1_hrc_v3_vs1
              - on_htn_reg_pg1_hrc_v3_vs2
    columns:
      - name: person_id
        tests:
          - not_null
          - unique
