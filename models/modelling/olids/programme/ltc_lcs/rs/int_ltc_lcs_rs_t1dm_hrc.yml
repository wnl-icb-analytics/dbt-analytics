models:
  - name: int_ltc_lcs_rs_t1dm_hrc
    description: >-
      Type 1 diabetes HRC membership, one row per person. Latest DM_COD/DMRES_COD
      on or before today must be in the EMIS Type 1 list. Uses PCD Type 1 flags
      only if that value set is absent; EMIS-local codes match by source only.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets: ['ef11a6f5-a7c5-4531-bf71-38f764df0270']
    columns:
      - name: person_id
        data_tests: [unique, not_null]
      - name: condition
        description: Type 1 Diabetes; separate from the diabetes risk-group column.
      - name: risk_group
        description: HRC.
