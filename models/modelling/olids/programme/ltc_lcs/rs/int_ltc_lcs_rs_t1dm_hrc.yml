models:
  - name: int_ltc_lcs_rs_t1dm_hrc
    description: >
      Type 1 diabetes HRC membership, one row per person whose latest diabetes/resolution record
      matches the XML Type 1 value set. Uses raw clinical dates, then save time and observation ID.
      Equivalent EMIS-local roots permit mapped concepts under the shared LTC LCS matching rule.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - valuesets_have_codes:
          arguments:
            valuesets: ['0dd187c0-35b5-10be-2837-4a1ad771a6e8']
    columns:
      - name: person_id
        data_tests: [unique, not_null]
      - name: condition
        description: Type 1 Diabetes; separate from the diabetes risk-group column.
      - name: risk_group
        description: HRC.
