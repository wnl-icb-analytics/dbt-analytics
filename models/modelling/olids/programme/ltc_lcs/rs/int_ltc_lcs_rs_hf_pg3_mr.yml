version: 2
models:
  - name: int_ltc_lcs_rs_hf_pg3_mr
    description: |
      Heart Failure Register Priority Group 3 - Medium Risk.
      Excludes PG2 (HR) patients.

      Patients on Heart Failure register meeting:
      - Rule 2: earliest HF code (episode excluding Review/End) in last
        6 months - first diagnosis within 6 months (include on pass)
      - Rule 3: latest NYHA classification is Class II (include on pass)
      - Rule 4: latest oedema code is ankle/feet oedema (include on pass)
      - Rule 5 (gate): latest LVEF < 50 (exclude on fail)
      - Rules 6-8: on SGLT2 / MRA / beta-blocker (include on fail - therapy gap)
      - Rule 9: on the ACE inhibitor pathway, including persistent ACEi
        contraindications (XACE_COD cluster, resolved from the EMIS library
        item via the issue #400 screenshots) - exclude on pass, include on fail

      Rule actions verified against the EMIS search screenshots in issue #400.
    config:
      meta:
        owner:
          name: Peter Shakeshaft
    data_tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
      - cluster_ids_exist:
          arguments:
            cluster_ids: XACE_COD
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_hf_reg_pg3_mr_vs1
              - on_hf_reg_pg3_mr_vs2
              - on_hf_reg_pg3_mr_vs3
              - on_hf_reg_pg3_mr_vs4
              - on_hf_reg_pg3_mr_vs5
              - on_hf_reg_pg3_mr_vs6
              - on_hf_reg_pg3_mr_vs7
              - on_hf_reg_pg3_mr_vs8
              - on_hf_reg_pg3_mr_vs9
              - on_hf_reg_pg3_mr_vs10
              - on_hf_reg_pg3_mr_vs11
              - on_hf_reg_pg3_mr_vs12
              - on_hf_reg_pg3_mr_vs13
              - on_hf_reg_pg3_mr_vs14
              - on_hf_reg_pg3_mr_vs15
              - on_hf_reg_pg3_mr_vs16
              - on_hf_reg_pg3_mr_vs17
              - on_hf_reg_pg3_mr_vs18
              - on_hf_reg_pg3_mr_vs19
              - on_hf_reg_pg3_mr_vs20
    columns:
      - name: person_id
        data_tests:
          - not_null
          - unique
