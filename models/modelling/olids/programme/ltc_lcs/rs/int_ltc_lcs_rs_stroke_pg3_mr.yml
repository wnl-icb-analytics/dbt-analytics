version: 2
models:
  - name: int_ltc_lcs_rs_stroke_pg3_mr
    description: |
      Stroke/TIA Register Priority Group 3 - Medium Risk.
      Excludes PG1 (HRC) and PG2 (HR) patients.

      Patients on Stroke/TIA register meeting:
      - Rule 2 (gate): stroke/TIA code before 1 year ago (exclude on fail)
      - Rule 3: latest non-HDL cholesterol > 2.5 (include on pass)
      - Rule 4 (gate): high-intensity statin order in last 6 months or current
        repeat course of any statin (exclude on pass - on optimal therapy)
      - Rule 5: no statin order/code in last 12 months and no statin declined
        in last year (include on pass - statin review needed)
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_stroketia_reg_pg3_mr_vs1
              - on_stroketia_reg_pg3_mr_vs2
              - on_stroketia_reg_pg3_mr_vs3
              - on_stroketia_reg_pg3_mr_vs4
              - on_stroketia_reg_pg3_mr_vs5
              - on_stroketia_reg_pg3_mr_vs6
              - on_stroketia_reg_pg3_mr_vs7
    columns:
      - name: person_id
        data_tests:
          - not_null
          - unique
