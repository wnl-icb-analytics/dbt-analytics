version: 2
models:
  - name: int_ltc_lcs_rs_hf_pg2_hr
    description: |
      Heart Failure Register Priority Group 2 - High Risk.
      NB: There is no PG1 for HF.

      Patients on Heart Failure register meeting:
      - Rule 1: latest NYHA classification is Class III or IV (include on pass)
      - Rule 2: latest oedema code is significant oedema, or metolazone in
        last year (include on pass)
      - Rule 3 (gate): latest HbA1c > 48 and <= 75 (exclude on fail)
      - Rule 4 (gate): latest LVEF < 50 or HFLVSD/REDEJCFRAC code with episode
        excluding Review/End (exclude on fail)
      - Rules 5-7: on SGLT2 / MRA / beta-blocker (include on fail - therapy gap)
      - Rule 8: on the ACE inhibitor pathway, including persistent ACEi
        contraindications (XACE_COD cluster, resolved from the EMIS library
        item via the issue #400 screenshots) - exclude on pass, include on fail

      Rule actions verified against the EMIS search screenshots in issue #400.
    config:
      meta:
        owner:
          name: Peter Shakeshaft
    data_tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
      - cluster_ids_exist:
          arguments:
            cluster_ids: XACE_COD
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_hf_reg_pg2_hr_vs1
              - on_hf_reg_pg2_hr_vs2
              - on_hf_reg_pg2_hr_vs3
              - on_hf_reg_pg2_hr_vs4
              - on_hf_reg_pg2_hr_vs5
              - on_hf_reg_pg2_hr_vs6
              - on_hf_reg_pg2_hr_vs7
              - on_hf_reg_pg2_hr_vs8
              - on_hf_reg_pg2_hr_vs9
              - on_hf_reg_pg2_hr_vs10
              - on_hf_reg_pg2_hr_vs11
              - on_hf_reg_pg2_hr_vs12
              - on_hf_reg_pg2_hr_vs13
              - on_hf_reg_pg2_hr_vs14
              - on_hf_reg_pg2_hr_vs15
              - on_hf_reg_pg2_hr_vs16
              - on_hf_reg_pg2_hr_vs17
              - on_hf_reg_pg2_hr_vs18
              - on_hf_reg_pg2_hr_vs19
              - on_hf_reg_pg2_hr_vs20
              - on_hf_reg_pg2_hr_vs21
              - on_hf_reg_pg2_hr_vs22
              - on_hf_reg_pg2_hr_vs23
    columns:
      - name: person_id
        data_tests:
          - not_null
          - unique
