version: 2
models:
  - name: int_ltc_lcs_rs_pad_pg2_hr
    description: >
      PAD HR membership, one row per register member outside PG1. Includes ischaemia 90-365 days ago, or older ischaemia without controlled BP in 12 months. Control is clinic <=140/90 or home/ABPM <=135/85, relaxed above age 80 to <=150/90 or <=145/85. Missing or unresolved BP remains included. BP components link by calendar date to the XML setting markers before ranking by clinical date, save time and observation ID. Only the home-setting wrapper ranks before linking. Values need only be >=1; there is no plausibility fallback.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_pad_reg_pg2_hr_vs1
    columns:
      - name: person_id
        data_tests:
          - not_null
          - unique
