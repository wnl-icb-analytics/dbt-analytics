version: 2
models:
  - name: int_ltc_lcs_rs_ast_pg1_hrc
    description: |
      Asthma Adult Register Priority Group 1 - High Risk & Complex.
      Parent population is the asthma register restricted to age >= 18
      (EMIS 'LTC LCS: Asthma Adult Register*').

      Patients meeting:
      - Rule 1: biologic order (omalizumab, mepolizumab, reslizumab,
        benralizumab) in last 12 months (include on pass)
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
          config:
            severity: warn
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_asthma_adult_reg_pg1_hrc_vs1
    columns:
      - name: person_id
        data_tests:
          - not_null
          - unique
