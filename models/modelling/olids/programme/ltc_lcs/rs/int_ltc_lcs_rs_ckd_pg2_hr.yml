models:
  - name: int_ltc_lcs_rs_ckd_pg2_hr
    description: >
      One row per person on the CKD register, excluding Priority Group 1, with
      latest eGFR 45-59 and ACR > 30, eGFR 30-44 and ACR > 3, eGFR 15-29, or
      ACR >= 70 and < 250.
      Otherwise, rule 6 requires at least three repeat antihypertensive issues
      strictly within three months before the latest clinic or home/ambulatory
      BP strictly within 12 months can qualify: its setting must pass the clinic
      or latest complete home BP check, all retained markers for that setting must
      be within 12 months, and diastolic must be > 90 mmHg with systolic >= 1,
      or systolic > 150 mmHg with diastolic >= 1.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.at_least_one:
          column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_ckd_reg_pg2_hr_vs1
              - on_ckd_reg_pg2_hr_vs2
              - on_ckd_reg_pg2_hr_vs4
              - on_ckd_reg_pg2_hr_vs5
              - on_ckd_reg_pg2_hr_vs6
              - on_ckd_reg_pg2_hr_vs7
              - on_ckd_reg_pg2_hr_vs8
              - on_ckd_reg_pg2_hr_vs9
              - on_ckd_reg_pg2_hr_vs10
              - on_ckd_reg_pg2_hr_vs11
    columns:
      - name: person_id
        tests:
          - not_null
          - unique
