models:
  - name: int_ltc_lcs_rs_ckd_pg2_hr
    description: >
      One row per person on the CKD register, excluding Priority Group 1, with
      latest eGFR 45-59 and ACR > 30, eGFR 30-44 and ACR > 3, eGFR 15-29, or
      ACR >= 70 and < 250.
      Otherwise, people with at least three distinct repeat issues strictly within
      three months from BNF section 2.5 qualify on blood pressure. This is EMIS
      group 2011000033113, XML legacyValue 2.5, and includes renin-angiotensin
      drugs. Diastolic must be > 90 or systolic > 150 mmHg, with the other
      component >= 1, on the latest clinic or home reading within 12 months,
      using the shared LTC LCS BP selector.
      Orders without a BNF code can qualify through dm+d products with the same
      VTM and form, complete ingredient set and form, or SNOMED descent from a
      mapped product. This reconstructs the section; it is not an exported EMIS
      product list and does not override known BNF mappings.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.at_least_one:
          column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_ckd_reg_pg2_hr_vs1
              - on_ckd_reg_pg2_hr_vs2
    columns:
      - name: person_id
        tests:
          - not_null
          - unique
