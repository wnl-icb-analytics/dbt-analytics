version: 2
models:
  - name: int_ltc_lcs_rs_person_risk_summary
    description: |-
      Adult MoC risk groups, one row per eligible person with a condition risk result at the build date. Covers the adult MoC base and the LR hypertension-only and LR adult-asthma-only Check & Test-only people. CYP-only people are excluded; Type 1 diabetes contributes HRC separately.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
    columns:
      - name: person_id
        description: Unique person identifier
        data_tests:
          - not_null
          - unique
      - name: af_risk_group
        description: Highest AF risk group the person is in (HR/MR); null if not stratified
        data_tests:
          - accepted_values:
              arguments:
                values: ['HR', 'MR']
      - name: asthma_adult_risk_group
        description: Highest Asthma Adult risk group the person is in (HRC/HR/MR/LR); null if not stratified
        data_tests:
          - accepted_values:
              arguments:
                values: ['HRC', 'HR', 'MR', 'LR']
      - name: asthma_cyp_risk_group
        description: Highest Asthma CYP risk group the person is in (HR/LR); null if not stratified
        data_tests:
          - accepted_values:
              arguments:
                values: ['HR', 'LR']
      - name: chd_risk_group
        description: Highest CHD risk group the person is in (HRC/HR/MR); null if not stratified
        data_tests:
          - accepted_values:
              arguments:
                values: ['HRC', 'HR', 'MR']
      - name: ckd_risk_group
        description: Highest CKD risk group the person is in (HRC/HR/MR); null if not stratified
        data_tests:
          - accepted_values:
              arguments:
                values: ['HRC', 'HR', 'MR']
      - name: copd_risk_group
        description: Highest COPD risk group the person is in (HRC/HR/MR); null if not stratified
        data_tests:
          - accepted_values:
              arguments:
                values: ['HRC', 'HR', 'MR']
      - name: diabetes_risk_group
        description: Highest Diabetes risk group the person is in (HRC/HR/MR/MRa/MRb/LR); null if not
          stratified
        data_tests:
          - accepted_values:
              arguments:
                values: ['HRC', 'HR', 'MR', 'MRa', 'MRb', 'LR']
      - name: hf_risk_group
        description: Highest Heart Failure risk group the person is in (HR/MR); null if not stratified
        data_tests:
          - accepted_values:
              arguments:
                values: ['HR', 'MR']
      - name: hypertension_risk_group
        description: Highest Hypertension risk group the person is in (HRC/HR/MRa/MRb/LR); null if not
          stratified
        data_tests:
          - accepted_values:
              arguments:
                values: ['HRC', 'HR', 'MRa', 'MRb', 'LR']
      - name: nafld_risk_group
        description: Highest NAFLD risk group the person is in (MR only); null if not stratified
        data_tests:
          - accepted_values:
              arguments:
                values: ['MR']
      - name: pad_risk_group
        description: Highest PAD risk group the person is in (HRC/HR/MR); null if not stratified
        data_tests:
          - accepted_values:
              arguments:
                values: ['HRC', 'HR', 'MR']
      - name: stroke_tia_risk_group
        description: Highest Stroke/TIA risk group the person is in (HRC/HR/MR); null if not stratified
        data_tests:
          - accepted_values:
              arguments:
                values: ['HRC', 'HR', 'MR']
      - name: overall_risk_group
        description: Highest risk group the person is in across all conditions (HRC/HR/MR/LR); MRa/MRb
          collapse to MR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['HRC', 'HR', 'MR', 'LR']
      - name: overall_risk_rank
        description: Numeric rank of overall_risk_group (1=HRC highest, 5=LR lowest)
        data_tests:
          - not_null
      - name: is_type_1_diabetes_hrc
        description: Latest diabetes diagnosis/resolution qualifies for the separate EMIS Type 1 HRC rule.
