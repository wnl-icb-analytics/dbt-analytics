version: 2
models:
  - name: int_ltc_lcs_copd_register
    description: |
      LTC LCS COPD register per the EMIS R6 'LTC LCS: COPD Register*' definition, one row
      per currently registered person on the register. Differs from QOF by also keeping
      COPD_COD-coded patients whose earliest COPD code is a diagnosis (rules 2 and 6).
      Rules 2 and 6 carry the active-COPD group requirement: no COPD resolved code, or a
      diagnosis dated after the latest resolved code. Rule 1 relies on the QOF register's
      own resolved-code test. Parent for the COPD risk stratification models and
      the LTC LCS base population.

      - Rule 1: QOF v51 COPD register. R6 replaced the unexported library item ee5b135f
        with inline QOF v51 evidence: a COPD diagnosis code at any date, or a COPD
        monitoring, review or invitation code in the last two years, with no spirometry
        test.
      - Rule 2: earliest COPD-family code before 1 year ago is a diagnosis,
        and COPD is active
      - Rule 6: earliest family code within the last year is a diagnosis,
        and COPD is active
      - Rule 3 (spirometry-confirmed evidence since 1 April 2023) selects no one rule 1
        misses in R6, and rules 4-5 (new-registration variants) are subsumed by rule 6

      Active patients only.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
      - cluster_ids_exist:
          arguments:
            cluster_ids: COPD_COD, COPDRES_COD
    columns:
      - name: person_id
        data_tests:
          - not_null
          - unique
