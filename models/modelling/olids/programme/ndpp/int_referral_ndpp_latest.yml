models:
  - name: int_referral_ndpp_latest
    description: 'Latest NDPP outcome per person. One row per person with most recent NDPP event.
      On the latest date, decline is preferred over invitation, then referral.
      This preserves the existing SMI summary priority; use int_referral_ndpp_all
      when each event type matters.'
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: 'Patient identifier - primary key (one row per person)'
        tests:
          - unique
          - not_null
