models:
  - name: int_adult_imms_ts_ppv
    description: >-
      Monthly PPV dose 1 completion counts for the preceding 24 months. One row per vaccine, cohort,
      analysis month, practice, age band, ethnicity and deprivation quintile. Population and
      completion follow int_adult_imms_ts_historical_ppv; numerator counts people with a retained
      administration by that month end, and denominator counts people in the cohort. No separate
      active-registration or death filter applies. Cohorts must be kept separate when they overlap.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1