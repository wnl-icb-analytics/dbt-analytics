models:
  - name: int_adult_imms_ts_ppv
    description: >-
      Monthly PPV dose 1 counts in OLIDS over 24 months, one row per vaccine, cohort,
      month, practice, age band, ethnicity and deprivation quintile. Uses the same
      population as the monthly completion records, without further registration or
      death restrictions. Numerator counts people with completion recorded by month
      end; denominator counts cohort members. Keep overlapping cohorts separate.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1