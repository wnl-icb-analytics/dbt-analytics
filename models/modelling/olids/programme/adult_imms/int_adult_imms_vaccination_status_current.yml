models:
  - name: int_adult_imms_vaccination_status_current
    description: >-
      PPV, shingles and RSV status in OLIDS, one row per registered, living adult aged
      at least 18 and currently eligible schedule vaccine ID. Includes vaccination,
      decline, contraindication and missing-record outcomes; several variants can
      apply to one vaccine. Date and age at event are null when no event is recorded.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Person identifier
        data_tests:
          - not_null
      - name: vaccine_id
        description: Vaccine identifier
        
      - name: vaccination_status
        description: Status of vaccination (Completed, Overdue, Not due yet, 
          etc.)
        

