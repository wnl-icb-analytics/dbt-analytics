models:
  - name: int_adult_imms_vaccination_status_current
    description: >-
      Current adult immunisation status. One row per currently registered, living adult aged at
      least 18 and currently eligible schedule vaccine ID, from int_adult_imms_currently_eligible.
      Includes PPV, shingles and RSV evidence classified as Completed, OutofSchedule, Declined or
      Contraindicated, plus missing-record and cohort-applicability statuses. An adult can have
      several schedule variants for the same vaccine. Status dates and age at event are null when no
      vaccination event is recorded.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Person identifier
        data_tests:
          - not_null
      - name: vaccine_id
        description: Vaccine identifier
        
      - name: vaccination_status
        description: Status of vaccination (Completed, Overdue, Not due yet, 
          etc.)
        

