models:
  - name: int_adult_imms_code_dose
    description: >
      Adult immunisation codes matched to adult schedule doses. One row per schedule vaccine
      ID, code, code cluster and matched dose. A code matches when its cluster is the
      schedule's administered, drug, declined or contraindicated cluster and its vaccine and
      dose match the schedule. Shingles codes recorded for dose '1,2' match doses 1 and 2.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1