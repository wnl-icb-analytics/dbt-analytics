models:
  - name: int_adult_imms_historical_shingles_dose2
    description: >-
      Shingles dose 2 administrations in OLIDS adults aged at least 18, including
      inactive and deceased people. One row per person, using the latest retained date
      across SHING_2 and SHING_2B. Each vaccine ID retains its second administration,
      so this need not be the latest administration. Includes practice, month and
      fiscal year.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        data_tests:
              - not_null
              - unique