models:
  - name: int_adult_imms_ts_historical_shingles_dose_1
    description: >-
      Monthly shingles dose 1 completion for the preceding 24 months. One row per person, analysis
      month and cohort in person_month_analysis_base. Cohorts are born 2 September 1957 to 1
      September 1958, age 70 to 79 catch-up, or campaign-specific immunosuppression. The
      immunosuppressed cohort has no separate age filter, and people may appear in more than one
      cohort. Completion is 1 from the month of the retained dose 1 administration onwards, using
      SHING_1 and SHING_1B only. No separate active-registration or death filter applies.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1