models:
  - name: int_adult_imms_ts_historical_shingles_dose_1
    description: >-
      Shingles dose 1 completion by month in NCL OLIDS over 24 months, one row per person, month and
      cohort. Cohorts are people born between 2 September 1957 and 1 September 1958, age 70 to 79
      catch-up, or flu-campaign immunosuppression without an age limit. People can belong to several
      cohorts. Completion starts in the retained SHING_1/SHING_1B administration month. Registration
      must overlap the month; no further status or death restrictions apply.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1