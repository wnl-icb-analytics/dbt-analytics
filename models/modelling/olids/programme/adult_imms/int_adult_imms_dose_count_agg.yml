models:
  - name: int_adult_imms_dose_count_agg
    description: >-
      Monthly PPV dose 1, shingles doses 1 and 2 and RSV dose 1 counts in NCL OLIDS adults aged at
      least 18, including inactive and deceased people. One row per combination of dose, month,
      fiscal year, practice and the demographic/risk breakdowns shown. Covers this fiscal year and
      four preceding years. Each person contributes at most one month per dose; these are not counts
      of every administration.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1