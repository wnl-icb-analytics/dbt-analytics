models:
  - name: int_adult_imms_dose_count_agg
    description: >-
      Monthly counts of retained administered PPV dose 1, shingles doses 1 and 2, and RSV dose 1 for
      the population aged at least 18 in int_adult_imms_dose_count. One row per vaccine dose, month,
      fiscal year, practice and combination of age band, age-65 and age-75 flags, clinical and
      demographic groups. Includes the current fiscal year and the preceding four, without a
      separate age-60 restriction. Inactive and deceased people are included. Each person
      contributes at most one retained month per dose, so these are not counts of every
      administration.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1