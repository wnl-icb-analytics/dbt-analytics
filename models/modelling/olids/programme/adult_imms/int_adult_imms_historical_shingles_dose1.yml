models:
  - name: int_adult_imms_historical_shingles_dose1
    description: >-
      Retained administered shingles dose 1 for adults in int_adult_imms_dose_base. One row per
      person with an administration under schedule IDs SHING_1 and SHING_1B; the latest retained
      date across those IDs is used. The population is aged at least 18, including inactive and
      deceased people, without a separate age-60 restriction. Includes month, fiscal year, practice
      and demographic and risk fields. Historical shingles events retain the first administration
      for dose 1 and the second for dose 2 per vaccine ID, so the retained date need not be the
      latest administration.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
       - name: person_id
         description: Unique identifier for the person
         data_tests:
          - not_null
          - unique