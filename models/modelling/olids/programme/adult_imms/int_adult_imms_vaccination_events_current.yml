models:
  - name: int_adult_imms_vaccination_events_current
    description: >
      Adult immunisation events and status for the current adult immunisation population.
      One row per person and schedule vaccine ID. Events are GP observation and medication
      order records dated up to today, mapped through int_adult_imms_code_dose. A medication
      record is used only when no observation exists for the same person, vaccine ID, date
      and dose. Events must match one of the person's schedule rows in
      int_adult_imms_currently_eligible, whether or not currently eligible, and fall after
      the first day of the birth month. Administration outranks contraindication, which
      outranks decline, on the same day or when the higher-ranked event is later. Dose 2
      uses the second dated event. Status is Completed, OutofSchedule if more than 15 days
      outside the schedule age window, Declined, Contraindicated, or Not applicable where
      the vaccine ID belongs to another cohort, such as RSV_1B for someone not in a care
      home.

    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

