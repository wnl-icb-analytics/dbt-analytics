models:
  - name: int_adult_imms_historical_rsv_dose1
    description: >-
      RSV dose 1 administrations in OLIDS adults aged at least 18, one row per person
      with retained RSV_1 evidence. Uses the latest retained date, with practice,
      month and fiscal year. Inactive and deceased people remain included.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique