models:
  - name: int_adult_imms_historical_rsv_dose1
    description: >-
      Retained administered RSV dose 1 for adults in int_adult_imms_dose_base.
      The OLIDS population comes from NCL GP records. One row per person with
      an administration under schedule IDs RSV_1; the latest retained date
      across those IDs is used. The population is aged at least 18, including
      inactive and deceased people, without a separate age-60 restriction.
      Includes month, fiscal year, practice and demographic and risk fields.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique