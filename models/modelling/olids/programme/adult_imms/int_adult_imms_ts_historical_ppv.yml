models:
  - name: int_adult_imms_ts_historical_ppv
    description: >-
      Monthly PPV dose 1 completion for the preceding 24 months. The OLIDS
      population comes from NCL GP records. One row per person, analysis month
      and cohort in person_month_analysis_base. Cohorts are age 65 and over,
      or age 18 to 64 with campaign-specific chronic respiratory, heart,
      kidney or liver disease, asplenia, diabetes or immunosuppression flags.
      Cochlear implant and CSF leak are not included in this clinical-risk
      definition. Completion is 1 from the month of the retained PPV_1
      administration onwards. No separate active-registration or death filter
      applies.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1