models:
  - name: int_adult_imms_ts_historical_ppv
    description: >-
      PPV dose 1 completion by month in OLIDS over the last 24 months, one row per
      person, month and cohort. Cohorts are age 65+, or 18 to 64 with flu-campaign
      chronic respiratory, heart, kidney or liver disease, asplenia, diabetes or
      immunosuppression. Cochlear implant and CSF leak do not qualify. Completion
      starts in the retained PPV_1 administration month. Registration must overlap the
      month; no further status or death restrictions apply.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1