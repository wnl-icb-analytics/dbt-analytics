models:
  - name: int_adult_imms_dose_base
    description: >
      Historical adult immunisation events for people aged 18 or over, with
      demographic and clinical-risk flags. One row per person per vaccination
      event.

      IN_RSV_CLINICAL_RISK_GROUP is chronic respiratory disease or
      immunosuppression on the latest flu campaign in
      int_covid_flu_risk_group_flags, at any age. It does not use the flu
      under-65 at-risk offer. RSV_1D eligibility applies the 65 to 74 band
      separately.

    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Identifier for the person. There may be > 1 person if registered at multiple practices
        data_tests:
         - not_null
      - name: in_rsv_clinical_risk_group
        description: >
          True when the person has chronic respiratory disease or
          immunosuppression on the latest flu campaign, at any age. RSV_1D
          eligibility then restricts the offer to ages 65 to 74.
