models:
  - name: int_adult_imms_dose_base
    description: >
      People aged 18+, registered or not, with their adult immunisation events.
      One row per person and event; people with no event appear once. The PPV clinical risk
      group flag reflects only cochlear implant and CSF leak records, because it filters
      fct_covid_eligibility on risk_group values that model does not produce. Events come
      from int_adult_imms_vaccination_events_historical, at most one per person and vaccine
      ID, dated up to today. practice_code is the current or last registered practice. Adds
      demographic and risk flags and the April-to-March fiscal year of the event.
      Deceased people are included; their demographic age is age at death when known.
      People with no event have null event columns. in_rsv_clinical_risk_group is chronic
      respiratory disease or immunosuppression on the current flu campaign,
      flu_current_campaign(), in int_covid_flu_risk_group_flags, without an age gate on the
      flag. It does not use the flu under-65 at-risk offer. RSV_1D eligibility applies the
      schedule's 65 to 74 proxy separately.

    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Identifier for the person. There may be > 1 person if registered at multiple practices
        data_tests:
         - not_null
      - name: in_rsv_clinical_risk_group
        description: >
          True when the person has chronic respiratory disease or
          immunosuppression on the current flu campaign, at any age. RSV_1D
          eligibility then restricts the offer to ages 65 to 74.
