models:
  - name: int_adult_imms_dose_base
    description: >
      People currently aged 18+, registered or not, with their adult immunisation events.
      One row per person and event; people with no event appear once. The PPV clinical risk
      group flag reflects only cochlear implant and CSF leak records, because it filters
      fct_covid_eligibility on risk_group values that model does not produce. Events come
      from int_adult_imms_vaccination_events_historical, at most one per person and vaccine
      ID, any date. practice_code is the current or last registered practice. Adds
      demographic and risk flags and the April-to-March fiscal year of the event.

    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Identifier for the person. There may be > 1 person if registered at multiple practices
        data_tests:
         - not_null