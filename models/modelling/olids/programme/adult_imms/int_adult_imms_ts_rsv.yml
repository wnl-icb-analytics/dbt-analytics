models:
  - name: int_adult_imms_ts_rsv
    description: >-
      Monthly RSV dose 1 completion counts for the preceding 24 months. The
      OLIDS population comes from NCL GP records. One row per vaccine, cohort,
      analysis month, practice, age band, ethnicity and deprivation quintile.
      Population and completion follow int_adult_imms_ts_historical_rsv;
      numerator counts people with a retained administration by that month
      end, and denominator counts people in the cohort. No separate
      active-registration or death filter applies. Cohorts must be kept
      separate when they overlap.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1