models:
  - name: int_adult_imms_shingles_vaccination_given
    description: >-
      Recorded shingles vaccinations classified as Completed or OutofSchedule. One row per currently
      registered, living adult aged at least 18 with a dose 1 record in routine SHING_1, catch-up
      SHING_1B or immunosuppressed SHING_1C. Completed takes precedence over OutofSchedule, then the
      latest date within each dose. Dose 2 is included only when its selected date is later than
      dose 1. People with dose 2 alone are excluded. Schedule eligibility follows
      int_adult_imms_currently_eligible.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

