models:
  - name: int_adult_imms_shingles_vaccination_given
    description: >-
      Shingles vaccinations marked Completed or OutofSchedule in NCL OLIDS, one row per registered,
      living adult aged at least 18 with dose 1 under current routine SHING_1, catch-up SHING_1B or
      immunosuppressed SHING_1C eligibility. Completed takes precedence, then latest date within
      each dose. Dose 2 appears only when later than dose 1; people with dose 2 alone are excluded.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

