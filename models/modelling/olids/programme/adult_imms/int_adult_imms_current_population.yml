models:
  - name: int_adult_imms_current_population
    description: >
      Currently registered, living people aged 18+ with demographics and adult immunisation
      programme flags. One row per person. Flags cover care home residence,
      immunosuppression from any COVID campaign, PPV and RSV clinical risk groups and
      current pregnancy. The PPV risk group uses fct_flu_eligibility subcohorts for chronic
      respiratory, heart, kidney and liver disease, asplenia, diabetes and
      immunosuppression, plus cochlear implant and CSF leak records. The RSV risk group is
      chronic respiratory disease or immunosuppression. Pregnancy covers ages 12 to 55, but
      the 18+ filter removes under-18s. Birth-date cohort flags use these ranges:
      turn_65_after_sep_2023 is born 2 September 1957 to 1 September 1958,
      turn_75_after_sep_2024 is born 2 September 1944 to 1 September 1949 and
      turn_80_after_sep_2024 is born 2 September 1943 to 1 September 1944.

    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

