models:
  - name: int_adult_imms_current_population
    description: >
      Current adult immunisation population with demographics and programme flags. One row
      per person in dim_person_demographics who is currently registered, not deceased and
      aged 18 or over. Flags cover care home residence (dim_person_care_home),
      immunosuppression (int_covid_immunosuppression, any campaign), PPV clinical risk
      group (fct_flu_eligibility subcohorts for chronic respiratory, heart, kidney and
      liver disease, asplenia, diabetes and immunosuppression, plus
      int_cochlear_implant_latest and int_csf_leak_latest), RSV clinical risk group
      (fct_flu_eligibility chronic respiratory disease or immunosuppression) and current
      pregnancy (fct_person_pregnancy_status, aged 12 to 55; under-18s are removed by the
      age filter). Birth-date cohort flags cover one birth year each:
      turn_65_after_sep_2023 is born 2 September 1957 to 1 September 1958,
      turn_75_after_sep_2024 is born 2 September 1944 to 1 September 1949 and
      turn_80_after_sep_2024 is born 2 September 1943 to 1 September 1944. Practice fields
      show the current registration.

    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

