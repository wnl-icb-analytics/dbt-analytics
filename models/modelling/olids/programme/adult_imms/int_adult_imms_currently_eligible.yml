models:
  - name: int_adult_imms_currently_eligible
    description: >-
      Adult immunisation schedule eligibility at the build date. One row per currently registered,
      living adult aged at least 18 and schedule vaccine ID that meets the applicable age,
      birth-cohort and clinical-risk rules. Covers PPV, shingles and RSV. Only currently eligible
      schedule rows are included. RSV_1D applies the programme's 65 to 74 proxy for chronic
      respiratory disease or immunosuppression, documented from 1 September 2026; the clinical-risk
      flag itself has no age restriction.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
