models:
  - name: int_adult_imms_currently_eligible
    description: >-
      PPV, shingles and RSV eligibility in NCL OLIDS, one row per registered, living adult aged at
      least 18 and eligible schedule vaccine ID. Applies age, birth-cohort and clinical-risk rules.
      RSV_1D uses the programme's 65 to 74 proxy for chronic respiratory disease or
      immunosuppression, documented from 1 September 2026; the risk flag itself has no age limit.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
