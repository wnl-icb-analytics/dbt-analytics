models:
  - name: int_adult_imms_currently_eligible
    description: >
      Current adult immunisation population crossed with the adult imms
      schedule. One row per person per vaccine they are currently eligible for.

      RSV_1D is people with IN_RSV_CLINICAL_RISK_GROUP whose age falls in the
      schedule window. The adult imms models treat that window as ages 65 to 74
      from 1 September 2026.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
