models:
  - name: int_adult_imms_rsv_vaccination_given
    description: >
      Latest RSV vaccination given to registered adults aged 18+, with status Completed or
      OutofSchedule. One row per person. Completed is preferred, then the latest date.
      Records must match a currently eligible schedule row. Cohorts include routine aged
      75+ (RSV_1), older-adult care home residents from 1 April 2026 (RSV_1B), pregnant
      people (RSV_1C), and clinical risk from 1 September 2026 (RSV_1D). Adult imms documents
      RSV_1D as a 65 to 74 proxy. The clinical-risk flag itself has no age gate. Records
      marked Not applicable upstream are excluded.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
