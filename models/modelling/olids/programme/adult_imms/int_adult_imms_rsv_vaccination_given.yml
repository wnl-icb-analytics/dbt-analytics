models:
  - name: int_adult_imms_rsv_vaccination_given
    description: >
      Latest RSV vaccination given, by person. One row per person with an RSV_1 (routine
      by age), RSV_1B (care home) or RSV_1C (pregnancy) record in
      int_adult_imms_vaccination_status_current with status Completed or OutofSchedule;
      Completed is preferred, then the latest vaccination date. The population is
      int_adult_imms_current_population (currently registered, aged 18 or over) with no
      further age filter. Records for a variant that does not match the person's care home
      or pregnancy status are marked Not applicable upstream and are not included.

    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

