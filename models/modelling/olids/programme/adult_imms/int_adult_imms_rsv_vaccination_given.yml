models:
  - name: int_adult_imms_rsv_vaccination_given
    description: >
      Latest completed or out-of-schedule RSV vaccination per currently
      registered adult. One row per person.

      Cohorts include routine aged 75+ (RSV_1), older-adult care home residents
      from 1 April 2026 (RSV_1B), pregnant people (RSV_1C), and clinical risk
      from 1 September 2026 (RSV_1D). Adult imms documents RSV_1D as a 65 to 74
      proxy. The clinical-risk flag itself is not age-gated.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
