models:
  - name: int_adult_imms_rsv_vaccination_given
    description: >
      Latest RSV vaccination given to registered adults aged 18+, with status Completed or
      OutofSchedule. One row per person. Covers RSV_1 routine by age, RSV_1B care home and
      RSV_1C pregnancy, with no further age filter. Completed is preferred, then the latest
      date. Records for a variant that does not match the person's care home or pregnancy
      status are Not applicable upstream and are excluded.

    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

