models:
  - name: int_adult_imms_ppv_vaccination_given
    description: >-
      PPV vaccination records classified as Completed or OutofSchedule. One row per currently
      registered, living adult aged at least 18 with a matching status for PPV_1 routine or PPV_1B
      clinical risk. Schedule eligibility follows int_adult_imms_currently_eligible. Where both
      variants qualify, the earliest retained vaccination date is used. This includes clinical-risk
      adults under 65.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
