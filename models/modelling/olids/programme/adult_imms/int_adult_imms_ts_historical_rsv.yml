models:
  - name: int_adult_imms_ts_historical_rsv
    description: >
      Person-level RSV completion at each analysis month for the last 24 months.
      Two cohorts: Aged 75+, and Clinical Risk 65-74 (chronic respiratory
      disease or immunosuppression, age 65 to 74). The 65-74 band is the RSV_1D
      proxy documented in the adult imms models from 1 September 2026.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
