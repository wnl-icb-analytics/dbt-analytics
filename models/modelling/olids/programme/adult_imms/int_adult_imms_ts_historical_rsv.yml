models:
  - name: int_adult_imms_ts_historical_rsv
    description: >-
      Monthly RSV dose 1 completion for the preceding 24 months. One row per person, analysis month
      and cohort in person_month_analysis_base. Cohorts are age 75 and over, or age 65 to 74 with
      campaign-specific chronic respiratory disease or immunosuppression. The risk age band is the
      RSV_1D proxy documented by the adult programme from 1 September 2026, but this series applies
      it across the retained history. Completion is 1 from the month of the retained RSV_1
      administration onwards. No separate active-registration or death filter applies.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
