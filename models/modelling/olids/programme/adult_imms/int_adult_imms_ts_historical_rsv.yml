models:
  - name: int_adult_imms_ts_historical_rsv
    description: >-
      RSV dose 1 completion by month in NCL OLIDS over the last 24 months, one row per person, month
      and cohort. Cohorts are age 75+, or 65 to 74 with flu-campaign chronic respiratory disease or
      immunosuppression. The 65 to 74 proxy, documented from September 2026, applies across this
      history. Completion starts in the retained RSV_1 administration month. Registration must
      overlap the month; no further status or death restrictions apply.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
