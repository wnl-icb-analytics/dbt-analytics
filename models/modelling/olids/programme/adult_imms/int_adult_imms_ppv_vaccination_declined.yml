models:
  - name: int_adult_imms_ppv_vaccination_declined
    description: >-
      PPV records marked Declined in NCL OLIDS, one row per registered, living adult aged at least
      18 with PPV_1 routine or PPV_1B clinical-risk evidence. Adults must meet the current schedule
      rules, including clinical-risk adults under 65. If both variants qualify, the earliest
      retained date is used.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
