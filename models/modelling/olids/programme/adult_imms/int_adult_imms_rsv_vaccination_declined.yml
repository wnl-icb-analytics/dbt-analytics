models:
  - name: int_adult_imms_rsv_vaccination_declined
    description: >
      Earliest declined RSV vaccination per currently registered adult. One row
      per person.

      Cohorts match int_adult_imms_rsv_vaccination_given, including RSV_1D
      clinical risk from 1 September 2026. Adult imms documents RSV_1D as a 65
      to 74 proxy. The clinical-risk flag itself is not age-gated.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
