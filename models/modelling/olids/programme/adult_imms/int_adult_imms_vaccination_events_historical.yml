models:
  - name: int_adult_imms_vaccination_events_historical
    description: >-
      Adult immunisation events in NCL OLIDS, one row per person and schedule vaccine ID with GP
      observation or medication evidence through today. Codes and doses follow
      int_adult_imms_code_dose. Administration outranks contraindication and decline, including
      later higher-priority events. PPV/RSV use the latest event; shingles dose 1 uses the first
      event of its type and dose 2 the second. Requires demographics, but not current eligibility;
      includes all ages, inactive and deceased people.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        data_tests:
          - not_null