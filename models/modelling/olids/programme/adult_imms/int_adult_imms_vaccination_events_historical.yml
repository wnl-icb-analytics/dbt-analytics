models:
  - name: int_adult_imms_vaccination_events_historical
    description: >-
      Retained adult immunisation events for historical analysis. One row per person and adult
      schedule vaccine ID with a mapped GP observation or medication record through the build date.
      Codes and dose assignments follow int_adult_imms_code_dose. Administration takes precedence
      over contraindication and decline, including when a higher-priority event is later. PPV and
      RSV retain the latest event; shingles dose 1 uses the first retained event of its type and
      dose 2 the second. A demographic record is required, but current eligibility, age,
      registration and death are not filtered here.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        data_tests:
          - not_null