models:
  - name: int_adult_imms_shingles_vaccination_declined
    description: >
      Declined shingles vaccinations by person. One row per person with a declined
      shingles dose 1 record (SHING_1 routine, SHING_1B catch-up or SHING_1C
      immunosuppressed) in int_adult_imms_vaccination_status_current, using the latest
      such record. Second-dose fields show the latest declined dose 2 record only when it
      is dated after the dose 1 record; a person with only a declined dose 2 is not
      included. The population is int_adult_imms_current_population (currently registered,
      aged 18 or over), so immunosuppressed adults under 65 are included.

    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

