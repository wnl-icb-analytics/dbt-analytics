models:
  - name: int_adult_imms_shingles_vaccination_declined
    description: >
      Registered adults aged 18+ who declined shingles dose 1, including immunosuppressed
      adults under 65. One row per person. Dose 1 covers SHING_1 routine, SHING_1B catch-up
      and SHING_1C immunosuppressed, using the latest record. Dose 2 fields show the latest
      declined dose 2 only when it is dated after dose 1. People with only a declined dose 2
      are excluded.

    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

