models:
  - name: int_flu_immunosuppression
    description: >-
      Flu immunosuppression risk group. The OLIDS population comes from NCL GP
      records. One row per person and reported campaign, aged at least 6
      months at the campaign run date. People qualify through an IMMDX_COD
      diagnosis at any time, or IMMRX_COD medication, IMM_ADM_COD
      administration or DXT_CHEMO_COD chemotherapy or radiotherapy within the
      campaign's evidence windows. Medication and treatment windows start on 1
      March before the campaign; administration windows start 6 months before
      campaign start for 2024-25 and 2025-26, and 3 years before the rolling
      audit end for 2026-27. Evidence ends at the campaign audit end and uses
      its UKHSA_FLU terminology version. There is no upper age limit.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - campaign_id
              - person_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: DXT_CHEMO_COD,IMMDX_COD,IMMRX_COD,IMM_ADM_COD
            source: UKHSA_FLU
            versioned: true
    config:
      meta:
        indicator:
          id: "FLU_IMMUNOSUPPRESSION"
          type: "PROGRAMME"
          category: "FLU"
          clinical_domain: "Immunology"
          name_short: "Flu Eligible Immunosuppression"
          description_short: "People with immunosuppression eligible for flu vaccination"
          description_long: >
            Flu vaccination eligibility for people with immunosuppression from any
            cause including
            diagnosis codes (IMMDX_COD), recent immunosuppressant medications (IMMRX_COD
            within 6 months), recent admin codes indicating immunosuppression
            (IMMADM_COD), or recent chemotherapy/radiotherapy (DXT_CHEMO_COD within 6
            months). The medication and chemotherapy pathways use a six-month lookback to
            capture currently immunosuppressed patients. Spec v16.0 widened the admin code
            pathway from six months to three years before the audit end date, so campaigns
            up to 2025-26 keep the six-month rule they were reported under and 2026-27
            onward uses three years.
          is_qof: false
          source_column: "person_id"
          sort_order: "FLU_5_IMMUNOSUPPRESSION"
          usage_contexts:
            - "COVID_AND_FLU_DASHBOARD"
            - "FLU_REPORTING"
          code_clusters:
            - cluster_id: "IMMDX_COD"
              category: "INCLUSION"
            - cluster_id: "IMMRX_COD"
              category: "INCLUSION"
            - cluster_id: "IMMADM_COD"
              category: "INCLUSION"
            - cluster_id: "DXT_CHEMO_COD"
              category: "INCLUSION"
          thresholds:
            - population_group: "ALL"
              threshold_type: "AGE_ELIGIBILITY"
              threshold_value: "6"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "months"
              description: "Minimum age for flu vaccination"
              sort_order: 1
            - population_group: "MEDICATION_TREATMENT"
              threshold_type: "RECENCY_PERIOD"
              threshold_value: "6"
              threshold_operator: "WITHIN"
              threshold_unit: "months"
              description: "Lookback period for medication and chemotherapy codes"
              sort_order: 2
            - population_group: "ADMIN_CODE_FROM_2026_27"
              threshold_type: "RECENCY_PERIOD"
              threshold_value: "3"
              threshold_operator: "WITHIN"
              threshold_unit: "years"
              description: "Lookback period for immunosuppression admin codes from 2026-27 (six months up to 2025-26)"
              sort_order: 3

        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        description: 'Flu campaign identifier, for example Flu 2025-26 or Flu 2026-27'
        data_tests:
          - not_null
      - name: campaign_category
        description: 'Category of eligibility criteria (always "Clinical Condition")'
      - name: risk_group
        description: 'Risk group classification (always "Immunosuppression")'
      - name: person_id
        description: 'Unique identifier for the person'
        data_tests:
          - not_null
      - name: qualifying_event_date
        description: 'Date of qualifying immunosuppression event (diagnosis, medication, or treatment)'
      - name: reference_date
        description: 'Campaign reference date used for eligibility assessment'
      - name: description
        description: 'Description of eligibility criteria'
      - name: birth_date_approx
        description: 'Approximate birth date used for age calculation'
      - name: age_months_at_ref_date
        description: 'Age in months at campaign reference date (minimum 6 months required)'
      - name: age_years_at_ref_date
        description: 'Age in years at campaign reference date'
      - name: created_at
        description: 'Audit timestamp for record creation (campaign audit end date)'