models:
  - name: int_flu_vaccination_given
    description: >-
      Recorded flu vaccination by campaign. The OLIDS population comes from
      NCL GP records. One row per person and reported campaign with FLUVAX_COD
      or LAIV_COD administration evidence, or FLURX_COD or LAIVRX_COD
      medication orders. Evidence must be after the campaign's applicable flu
      or LAIV tracking start and on or before its audit end. The qualifying
      date is the latest evidence. Codes use the campaign's UKHSA_FLU
      terminology version. There is no age or vaccination-eligibility
      restriction.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - campaign_id
              - person_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: FLURX_COD,FLUVAX_COD,LAIVRX_COD,LAIV_COD
            source: UKHSA_FLU
            versioned: true
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        data_tests:
          - not_null
      - name: person_id
        data_tests:
          - not_null
