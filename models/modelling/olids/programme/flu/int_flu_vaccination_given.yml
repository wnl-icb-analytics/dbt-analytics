models:
  - name: int_flu_vaccination_given
    description: >-
      Recorded flu vaccination in OLIDS, one row per person and campaign with
      FLUVAX_COD or LAIV_COD observations, or FLURX_COD or LAIVRX_COD orders. Evidence
      falls after the applicable flu or LAIV tracking start through audit end. Uses
      the latest evidence and campaign-specific UKHSA_FLU codes, without age or
      vaccination-eligibility restrictions.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - campaign_id
              - person_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: FLURX_COD,FLUVAX_COD,LAIVRX_COD,LAIV_COD
            source: UKHSA_FLU
            versioned: true
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        data_tests:
          - not_null
      - name: person_id
        data_tests:
          - not_null
