models:
  - name: int_flu_laiv_vaccination
    description: >-
      Recorded live attenuated influenza vaccine (LAIV) in OLIDS, one row per person
      and campaign with LAIV_COD observations or LAIVRX_COD orders after its LAIV
      tracking start through audit end. Uses the latest evidence and the campaign's
      UKHSA_FLU code version, without age or vaccination-eligibility restrictions.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - campaign_id
              - person_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: LAIVRX_COD,LAIV_COD
            source: UKHSA_FLU
            versioned: true
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        data_tests:
          - not_null
      - name: person_id
        data_tests:
          - not_null
