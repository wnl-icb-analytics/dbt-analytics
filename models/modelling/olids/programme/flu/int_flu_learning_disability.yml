models:
  - name: int_flu_learning_disability
    description: >
      Flu clinical risk group: learning disability. One row per person and campaign for
      every campaign in flu_reported_campaign_ids(). A person qualifies with any
      LEARNDIS_COD record on or before the campaign audit end date (terminology version
      pinned per campaign) and must be aged at least 6 months at the campaign run date.
      qualifying_event_date is the latest LEARNDIS_COD record. No upper age limit is
      applied, although the description column reads 6 months to 64 years.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - campaign_id
              - person_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: LEARNDIS_COD
            source: UKHSA_FLU
            versioned: true
    config:
      meta:
        indicator:
          id: "FLU_LEARNING_DISABILITY"
          type: "PROGRAMME"
          category: "FLU"
          clinical_domain: "Neurodevelopmental"
          name_short: "Flu Eligible Learning Disability"
          description_short: "People with learning disabilities eligible for flu vaccination"
          description_long: >
            Flu vaccination eligibility for people with learning disabilities of any
            severity.
            Uses both severe learning disability codes (SEV_LRNDIS_COD) and general
            learning
            disability codes (LEARNDIS_COD) with earliest occurrence qualifying. Minimum
            age
            requirement of 6 months for flu vaccination. Supports vulnerable population
            protection.
          is_qof: false
          source_column: "person_id"
          sort_order: "FLU_12_LEARNING_DISABILITY"
          usage_contexts:
            - "COVID_AND_FLU_DASHBOARD"
            - "FLU_REPORTING"
          code_clusters:
            - cluster_id: "LEARNDIS_COD"
              category: "INCLUSION"
            - cluster_id: "SEV_LRNDIS_COD"
              category: "INCLUSION"
          thresholds:
            - population_group: "ALL"
              threshold_type: "AGE_ELIGIBILITY"
              threshold_value: "6"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "months"
              description: "Minimum age for flu vaccination"
              sort_order: 1

        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        description: 'Flu campaign identifier, for example Flu 2025-26 or Flu 2026-27'
        data_tests:
          - not_null
      - name: campaign_category
        description: 'Category of eligibility criteria (always "Clinical Condition")'
      - name: risk_group
        description: 'Risk group classification (always "Learning Disability")'
      - name: person_id
        description: 'Unique identifier for the person'
        data_tests:
          - not_null
      - name: qualifying_event_date
        description: 'Latest LEARNDIS_COD record date'
      - name: reference_date
        description: 'Campaign reference date used for eligibility assessment'
      - name: description
        description: 'Description of eligibility criteria'
      - name: birth_date_approx
        description: 'Approximate birth date used for age calculation'
      - name: age_months_at_ref_date
        description: 'Age in months at campaign reference date (minimum 6 months required)'
      - name: age_years_at_ref_date
        description: 'Age in years at campaign reference date'
      - name: created_at
        description: 'Audit timestamp for record creation (campaign audit end date)'