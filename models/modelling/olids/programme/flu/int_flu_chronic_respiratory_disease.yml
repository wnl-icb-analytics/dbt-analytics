models:
  - name: int_flu_chronic_respiratory_disease
    description: >-
      Flu respiratory disease group in NCL OLIDS, one row per person and campaign. Includes the flu
      asthma group or people with RESP_COD evidence through the audit end, using the campaign's
      UKHSA_FLU code version. People must be at least 6 months at the run date, with no upper age
      limit.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - campaign_id
              - person_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: RESP_COD
            source: UKHSA_FLU
            versioned: true
    config:
      meta:
        indicator:
          id: "FLU_CHRONIC_RESPIRATORY"
          type: "PROGRAMME"
          category: "FLU"
          clinical_domain: "Respiratory"
          name_short: "Flu Eligible Chronic Respiratory"
          description_short: "People with chronic respiratory disease eligible for flu vaccination"
          description_long: >
            Flu vaccination eligibility for people with chronic respiratory conditions
            including
            asthma, COPD, cystic fibrosis and other chronic lung diseases. Combines
            two pathways: asthma (AST_GROUP) or chronic respiratory disease diagnosis
            (RESP_COD). Minimum age requirement
            of 6 months.
          is_qof: false
          source_column: "person_id"
          sort_order: "FLU_8_CHRONIC_RESPIRATORY"
          usage_contexts:
            - "COVID_AND_FLU_DASHBOARD"
            - "FLU_REPORTING"
          code_clusters:
            - cluster_id: "RESP_COD"
              category: "INCLUSION"
            - cluster_id: "AST_COD"
              category: "INCLUSION"
            - cluster_id: "ASTMED_COD"
              category: "INCLUSION"
            - cluster_id: "ASTRX_COD"
              category: "INCLUSION"
            - cluster_id: "ASTADM_COD"
              category: "INCLUSION"
          thresholds:
            - population_group: "ALL"
              threshold_type: "AGE_ELIGIBILITY"
              threshold_value: "6"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "months"
              description: "Minimum age for flu vaccination"
              sort_order: 1

        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        description: 'Flu campaign identifier, for example Flu 2025-26 or Flu 2026-27'
        data_tests:
          - not_null
      - name: campaign_category
        description: 'Category of eligibility criteria (always "Clinical Condition")'
      - name: risk_group
        description: 'Risk group classification (always "Chronic Respiratory Disease")'
      - name: person_id
        description: 'Unique identifier for the person'
        data_tests:
          - not_null
      - name: qualifying_event_date
        description: >-
          Latest qualifying date across the asthma route and first RESP_COD occurrence.
      - name: reference_date
        description: 'Campaign reference date used for eligibility assessment'
      - name: description
        description: 'Description of eligibility criteria'
      - name: birth_date_approx
        description: 'Approximate birth date used for age calculation'
      - name: age_months_at_ref_date
        description: 'Age in months at campaign reference date (minimum 6 months required)'
      - name: age_years_at_ref_date
        description: 'Age in years at campaign reference date'
      - name: created_at
        description: 'Audit timestamp for record creation (campaign audit end date)'
