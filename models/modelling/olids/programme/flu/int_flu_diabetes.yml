models:
  - name: int_flu_diabetes
    description: >-
      Flu diabetes group in NCL OLIDS, one row per person and campaign, aged at least 6 months at
      its run date, with no upper limit. Requires any ADDIS_COD Addison disease record, or a latest
      DIAB_COD diagnosis later than any DMRES_COD resolution. Evidence uses campaign-specific
      UKHSA_FLU codes through the audit end.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - campaign_id
              - person_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: ADDIS_COD,DIAB_COD,DMRES_COD
            source: UKHSA_FLU
            versioned: true
    config:
      meta:
        indicator:
          id: "FLU_DIABETES"
          type: "PROGRAMME"
          category: "FLU"
          clinical_domain: "Cardiometabolic"
          name_short: "Flu Eligible Diabetes"
          description_short: "People with diabetes or Addisons disease eligible for flu vaccination"
          description_long: >
            Flu vaccination eligibility for people with diabetes mellitus or Addisons
            disease.
            Includes active diabetes (DIAB_COD) where latest diabetes code is more
            recent than
            any resolved code (DMRES_COD), or Addisons disease (ADDIS_COD) regardless
            of resolution.
            Minimum age requirement of 6 months. Uses latest diabetes vs resolution
            code comparison logic.
          is_qof: false
          source_column: "person_id"
          sort_order: "FLU_10_DIABETES"
          usage_contexts:
            - "COVID_AND_FLU_DASHBOARD"
            - "FLU_REPORTING"
          code_clusters:
            - cluster_id: "DIAB_COD"
              category: "INCLUSION"
            - cluster_id: "DMRES_COD"
              category: "EXCLUSION"
            - cluster_id: "ADDIS_COD"
              category: "INCLUSION"
          thresholds:
            - population_group: "ALL"
              threshold_type: "AGE_ELIGIBILITY"
              threshold_value: "6"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "months"
              description: "Minimum age for flu vaccination"
              sort_order: 1
        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        description: 'Flu campaign identifier, for example Flu 2025-26 or Flu 2026-27'
        data_tests:
          - not_null
      - name: campaign_category
        description: 'Category of eligibility criteria (always "Clinical Condition")'
      - name: risk_group
        description: 'Risk group classification (always "Diabetes")'
      - name: person_id
        description: 'Unique identifier for the person'
        data_tests:
          - not_null
      - name: qualifying_event_date
        description: 'Date of qualifying diagnosis (earliest Addisons or latest active diabetes)'
      - name: reference_date
        description: 'Campaign reference date used for eligibility assessment'
      - name: description
        description: 'Description of eligibility criteria'
      - name: birth_date_approx
        description: 'Approximate birth date used for age calculation'
      - name: age_months_at_ref_date
        description: 'Age in months at campaign reference date (minimum 6 months required)'
      - name: age_years_at_ref_date
        description: 'Age in years at campaign reference date'
      - name: created_at
        description: 'Audit timestamp for record creation (campaign audit end date)'