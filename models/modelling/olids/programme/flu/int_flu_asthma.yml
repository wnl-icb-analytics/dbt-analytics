models:
  - name: int_flu_asthma
    description: >
      Flu vaccination eligibility for people with an emergency asthma admission,
      or an asthma diagnosis and recent medication evidence. An admission qualifies
      without a separate diagnosis or medication entry. The minimum age is 6 months.
    config:
      meta:
        indicator:
          id: "FLU_ASTHMA"
          type: "PROGRAMME"
          category: "FLU"
          clinical_domain: "Respiratory"
          name_short: "Flu Eligible Asthma"
          description_short: "People with qualifying asthma evidence eligible for flu vaccination"
          description_long: >
            Flu vaccination eligibility based on an emergency asthma admission, or
            an asthma diagnosis with a recent prescription or medication administration.
            The minimum age is 6 months.
          is_qof: false
          source_column: "person_id"
          sort_order: "FLU_13_ASTHMA"
          usage_contexts:
            - "COVID_AND_FLU_DASHBOARD"
            - "FLU_REPORTING"
          code_clusters:
            - cluster_id: "AST_COD"
              category: "INCLUSION"
            - cluster_id: "ASTMED_COD"
              category: "INCLUSION"
            - cluster_id: "ASTRX_COD"
              category: "INCLUSION"
            - cluster_id: "ASTADM_COD"
              category: "INCLUSION"
          thresholds:
            - population_group: "ALL"
              threshold_type: "AGE_ELIGIBILITY"
              threshold_value: "6"
              threshold_operator: "AT_OR_ABOVE"
              threshold_unit: "months"
              description: "Minimum age for flu vaccination"
              sort_order: 1
            - population_group: "MEDICATION_EVIDENCE"
              threshold_type: "RECENCY_PERIOD"
              threshold_value: "12"
              threshold_operator: "WITHIN"
              threshold_unit: "months"
              description: "Campaign medication lookback period"
              sort_order: 2
        owner:
          name: EddieDavison92
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: ASTADM_COD,ASTMED_COD,ASTRX_COD,AST_COD
            source: UKHSA_FLU
            versioned: true
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - campaign_id
              - person_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: campaign_id
        description: 'Flu campaign identifier'
        data_tests:
          - not_null
      - name: campaign_category
        description: 'Eligibility category, always "Clinical Condition"'
      - name: risk_group
        description: 'Risk group, always "Asthma"'
      - name: person_id
        description: 'Unique person identifier'
        data_tests:
          - not_null
      - name: qualifying_event_date
        description: 'Latest qualifying medication or admission date'
      - name: reference_date
        description: 'Campaign reference date'
      - name: description
        description: 'Eligibility reason'
      - name: birth_date_approx
        description: 'Approximate birth date used for age calculation'
      - name: age_months_at_ref_date
        description: 'Age in months at the campaign reference date'
      - name: age_years_at_ref_date
        description: 'Age in years at the campaign reference date'
      - name: created_at
        description: 'Campaign audit end date'
