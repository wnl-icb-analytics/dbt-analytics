models:
  - name: int_flu_vaccination_declined
    description: >-
      Recorded flu declines and lack of consent in NCL OLIDS, one row per person and campaign with
      DECL_COD or NOCONS_COD after its flu tracking start through audit end. Anyone vaccinated in
      that campaign is excluded. Uses the latest evidence and campaign-specific UKHSA_FLU codes,
      without age restrictions.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - campaign_id
              - person_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: DECL_COD,NOCONS_COD
            source: UKHSA_FLU
            versioned: true
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        data_tests:
          - not_null
      - name: person_id
        data_tests:
          - not_null
