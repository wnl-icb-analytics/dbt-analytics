models:
  - name: int_flu_vaccination_declined
    description: >-
      Recorded flu vaccination declines or lack of consent by campaign. The
      OLIDS population comes from NCL GP records. One row per person and
      reported campaign with a DECL_COD or NOCONS_COD observation after the
      campaign's flu tracking start and on or before its audit end, excluding
      anyone with recorded flu vaccination in that campaign. The qualifying
      date is the latest decline or no-consent evidence. Codes use the
      campaign's UKHSA_FLU terminology version. There is no age restriction.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - campaign_id
              - person_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - cluster_ids_exist:
          arguments:
            cluster_ids: DECL_COD,NOCONS_COD
            source: UKHSA_FLU
            versioned: true
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: campaign_id
        data_tests:
          - not_null
      - name: person_id
        data_tests:
          - not_null
