models:
  - name: int_tirzepatide_eligible_population
    description: >
      Current tirzepatide candidate population drawn from the QOF v51 OBES2
      register. One row represents a living adult with a current registration
      and at least four of the five OBES2 comorbidities. Membership,
      comorbidities and QOF journal ethnicity come from
      fct_person_obesity2_register. Numeric BMI and NICE NG246 class come from
      int_bmi_latest. The programme maps Obese Class III to Cohort 1 and Obese
      Class II to Cohort 2 when that latest valid BMI is in the preceding 12
      months. Missing, older or out-of-band numeric BMI is labelled BMI
      assessment needed, with both cohort flags false. These are candidates
      for clinical assessment, not confirmed prescribing eligibility. The
      hypertension flag does not confirm a need for blood pressure treatment;
      the sleep apnoea flag does not confirm sleep-clinic assessment or an
      indication for CPAP or equivalent. This current population does not
      retain everyone who qualified before treatment. See
      docs/model_documentation/tirzepatide.md for the national specifications
      and remaining assessment requirements.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
    columns:
      - name: person_id
        description: Person identifier
        data_tests:
          - unique
          - not_null
      - name: age
        description: Current age in full years
      - name: latest_bmi_value
        description: Latest valid numeric BMI from int_bmi_latest when dated in the preceding 12 months
      - name: latest_bmi_date
        description: Date of that latest valid numeric BMI
      - name: latest_bmi_source_cluster_id
        description: Shared BMI cluster or calculated-BMI marker from int_bmi_latest
      - name: bmi_category
        description: Programme rollout band mapped from the shared NICE NG246 class, or BMI assessment needed
        data_tests:
          - accepted_values:
              arguments:
                values: ['Obese Class II', 'Obese Class III', 'BMI assessment needed']
      - name: has_lower_bmi_threshold_ethnicity
        description: Whether the latest QOF ethnicity evidence qualifies for lower BMI thresholds
      - name: has_unresolved_hypertension
        description: Whether unresolved hypertension meets the OBES2 definition
      - name: has_dyslipidaemia
        description: Whether recent lipid therapy or lipid results meet the OBES2 definition
      - name: has_obstructive_sleep_apnoea
        description: Whether an obstructive sleep apnoea diagnosis meets the OBES2 definition
      - name: has_ascvd
        description: Whether an ASCVD diagnosis meets the OBES2 definition
      - name: has_unresolved_type2_diabetes
        description: Whether unresolved type 2 diabetes meets the OBES2 definition
      - name: qualifying_comorbidity_count
        description: Number of the five OBES2 comorbidities met
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 4
                max_value: 5
                inclusive: true
      - name: bmi_meets_cohort_1
        description: Whether the latest valid numeric BMI in 12 months is NICE Obese Class III
      - name: bmi_meets_cohort_2
        description: Whether the latest valid numeric BMI in 12 months is NICE Obese Class II
      - name: is_eligible_cohort_1
        description: Whether the person is assigned to Cohort 1
      - name: is_eligible_cohort_2
        description: Whether the person is assigned to Cohort 2
