models:
  - name: int_bowel_screening_prompt_all
    description: >-
      Recorded bowel screening prompts from the SMI Longer Lives cancer
      screening prompt code set (SMI_LONGER_LIVES_CANCER_SCREEN_PROMPTS in
      ECL_CACHE), restricted to SNOMED CT 382161000000102. The OLIDS
      population comes from NCL GP records. One row per person and clinical
      date. Includes prompts through the build date, without an SMI
      membership, age, sex, registration or death restriction. Missing
      clinical dates are retained as 1900-01-01.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: SMI_LONGER_LIVES_CANCER_SCREEN_PROMPTS
            source: ECL_CACHE
    # tests:
    #   - dbt_expectations.expect_table_row_count_to_be_between:
    #       arguments:
    #         min_value: 1

    columns:
      - name: person_id
        tests:
          - not_null
