models:
  - name: int_bowel_screening_prompt_latest
    description: >-
      Recorded bowel screening prompts from the SMI Longer Lives cancer screening prompt code
      set (SMI_LONGER_LIVES_CANCER_SCREEN_PROMPTS in ECL_CACHE), restricted to SNOMED CT
      382161000000102. One row per person with a recorded prompt. Includes prompts through the
      build date, without an SMI membership, age, sex, registration or death restriction. The
      latest prompt date is retained. Missing clinical dates are retained as 1900-01-01.
    config:
      meta:
        owner:
          name: KateHomer55
    # tests:
    #   - dbt_expectations.expect_table_row_count_to_be_between:
    #       arguments:
    #         min_value: 1

    columns:
      - name: person_id
        tests:
          - not_null