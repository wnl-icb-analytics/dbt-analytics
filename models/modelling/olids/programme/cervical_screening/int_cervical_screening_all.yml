models:
  - name: int_cervical_screening_all
    description: >-
      Recorded cervical screening events classified as completion,
      unsuitability, decline, non-response and cervix removal. The OLIDS
      population comes from NCL GP records. One row per observation and
      matching PCD code cluster, using SMEAR_COD, CSPU_COD, CSDEC_COD,
      CSPCAINVITE_COD and NOCX_COD. Observations through the build date are
      included. No age, sex, registration or death restriction applies.
      Missing clinical dates are retained as 1900-01-01.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: SMEAR_COD,CSPU_COD,CSDEC_COD,CSPCAINVITE_COD,NOCX_COD
            source: PCD
    columns:
      - name: id
        description: 'Unique identifier for the observation'
        data_tests:
          - unique
          - not_null
      - name: person_id
        description: 'Unique identifier for the person'
      - name: clinical_effective_date
        description: 'Date when the screening observation was recorded'
      - name: concept_code
        description: 'Mapped clinical concept code'
      - name: concept_display
        description: 'Mapped clinical concept display text'
      - name: source_cluster_id
        description: 'QOF cluster identifier (SMEAR_COD, CSPU_COD, CSDEC_COD, CSPCAINVITE_COD, NOCX_COD)'
      - name: screening_observation_type
        description: 'Type of screening observation based on cluster'
      - name: is_completed_screening
        description: 'Flag indicating if this is a completed screening (SMEAR_COD)'
      - name: is_unsuitable_screening
        description: 'Flag indicating if person is unsuitable for screening (CSPU_COD or cervix removal NOCX_COD)'
      - name: is_declined_screening
        description: 'Flag indicating if screening was declined (CSDEC_COD)'
      - name: is_non_response_screening
        description: 'Flag indicating non-response to invitations (CSPCAINVITE_COD)'
      - name: is_cervix_removal
        description: 'Flag indicating complete removal of the cervix (NOCX_COD)'