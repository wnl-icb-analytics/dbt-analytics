models:
  - name: int_cervical_screening_prompt_latest
    description: >-
      Recorded cervical screening prompts from the SMI Longer Lives cancer
      screening prompt code set (SMI_LONGER_LIVES_CANCER_SCREEN_PROMPTS in
      ECL_CACHE), restricted to SNOMED CT 851141000000101. The OLIDS
      population comes from NCL GP records. One row per person with a recorded
      prompt. Includes prompts through the build date, without an SMI
      membership, age, sex, registration or death restriction. The latest
      prompt date is retained. Missing clinical dates are retained as
      1900-01-01.
    config:
      meta:
        owner:
          name: KateHomer55
    # tests:
    #   - dbt_expectations.expect_table_row_count_to_be_between:
    #       arguments:
    #         min_value: 1

    columns:
      - name: person_id
        tests:
          - not_null