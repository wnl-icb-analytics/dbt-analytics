models:
  - name: int_cervical_screening_prompt_all
    description: >-
      Cervical screening prompts in NCL OLIDS, one row per person and clinical date. Uses SNOMED CT
      851141000000101 from SMI_LONGER_LIVES_CANCER_SCREEN_PROMPTS in ECL_CACHE. People need not have
      SMI; age, sex, registration and death are unrestricted. Future prompts are excluded; missing
      dates appear as 1900-01-01.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: SMI_LONGER_LIVES_CANCER_SCREEN_PROMPTS
            source: ECL_CACHE
    # tests:
    #   - dbt_expectations.expect_table_row_count_to_be_between:
    #       arguments:
    #         min_value: 1

    columns:
      - name: person_id
        tests:
          - not_null
