models:
  - name: int_covid_flu_risk_group_flags
    description: >-
      COVID and flu clinical-risk flags in OLIDS, one row per programme, campaign and
      person with at least one group. Flags use each campaign's codes, evidence
      windows and minimum ages, including people outside the vaccination offer's age
      bands. in_clinical_risk_group means UKHSA ATRISK_GROUP: nine shared groups,
      plus learning disability and SMI for COVID. Flu learning disability is separate;
      membership alone does not confirm vaccination eligibility.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - programme_type
              - campaign_id
              - person_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: programme_type
        description: 'COVID or FLU'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['COVID', 'FLU']
      - name: campaign_id
        description: 'Campaign identifier, matching covid_reported_campaign_ids() and flu_reported_campaign_ids()'
        data_tests:
          - not_null
      - name: person_id
        description: 'Person in at least one clinical group for the campaign'
        data_tests:
          - not_null
      - name: has_asthma
        description: '1 if in the asthma group (AST_GROUP) for the campaign'
      - name: has_asplenia
        description: '1 if in the asplenia or spleen dysfunction group'
      - name: has_chd
        description: '1 if in the chronic heart disease group'
      - name: has_ckd
        description: '1 if in the chronic kidney disease group (CKD_GROUP)'
      - name: has_cld
        description: '1 if in the chronic liver disease group'
      - name: has_cnd
        description: '1 if in the chronic neurological disease group (CNS_GROUP)'
      - name: has_crd
        description: '1 if in the chronic respiratory disease group (RESP_GROUP)'
      - name: has_diabetes
        description: '1 if in the diabetes group (DIAB_GROUP)'
      - name: is_immunosuppressed
        description: '1 if in the immunosuppression group for the campaign'
      - name: has_ld
        description: '1 if in the learning disability group'
      - name: has_smi
        description: '1 if in the severe mental illness group (COVID only; always 0 for flu)'
      - name: in_clinical_risk_group
        description: '1 if in the spec ATRISK_GROUP for the programme'
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
