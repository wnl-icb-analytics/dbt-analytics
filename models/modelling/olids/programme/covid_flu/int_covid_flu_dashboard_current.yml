models:
  - name: int_covid_flu_dashboard_current
    description: >-
      COVID and flu vaccination uptake for the current dashboard, with current demographics,
      practice, geography and campaign-specific clinical risk flags. One row per person, programme,
      campaign, risk group and subcohort. Includes uptake records for campaigns starting on or after
      1 September 2025 where the person has a demographic record. Registration eligibility follows
      the campaign population; demographic fields describe the current record, so people who have
      since left or died remain represented. People may appear in several risk groups, so rows must
      not be counted as distinct people.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null