models:
  - name: int_covid_flu_dashboard_current
    description: >-
      NCL OLIDS COVID and flu uptake for campaigns starting from 1 September 2025, one row per
      person, programme, campaign, risk group and subcohort. Requires a demographic record and
      follows each campaign's population. Demographics and practice describe current records,
      including people who later left or died. Clinical flags are campaign-specific; people in
      several risk groups have several rows.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null