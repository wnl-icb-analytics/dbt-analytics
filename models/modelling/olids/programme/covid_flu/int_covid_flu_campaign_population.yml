models:
  - name: int_covid_flu_campaign_population
    description: >-
      Registered, living population for each reported COVID and flu campaign. One row per person and
      campaign, based on the month-end population at the campaign run date, or the latest available
      month if that date is later. COVID run dates are 31 March or 30 June; flu uses the extraction
      date capped at the final 28 February audit end. Closed-campaign membership therefore includes
      people who have since left registration or died. A missing deceased flag is treated as living.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - campaign_id
              - person_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: campaign_id
        description: 'Campaign identifier, matching covid_reported_campaign_ids() and flu_reported_campaign_ids()'
        data_tests:
          - not_null
      - name: campaign_run_date
        description: 'RUN_DAT for the campaign (audit_end_date in the campaign config), used to choose the snapshot'
      - name: population_month
        description: >
          Month end of the population snapshot used. Equals the month of the campaign run
          date for a closed campaign, and the latest available snapshot for a season in
          flight.
      - name: person_id
        description: 'Person registered and alive at population_month'
        data_tests:
          - not_null
