version: 2

models:
  - name: int_qadmissions_features
    description: >
      Input feature set for the QAdmissions 1-year emergency-admission risk
      model registered in Snowflake's model registry. One row per active,
      non-deceased person in dim_person_demographics aged 18-100 (inclusive)
      with a recorded gender of Male or Female.

      This model does NOT compute a risk score - it only assembles the
      input features that the registered model consumes. See the file
      header for the required ClinRisk disclaimer.

      Documentation available: https://github.com/ncl-icb-analytics/dbt-ncl-analytics/blob/main/docs/model_documentation/int_qadmissions_features.md
    config:
      meta:
        owner:
          name: Thomas Shallcross
    columns:
      - name: person_id
        data_type: varchar
        description: "OLIDS-native unique person identifier. Primary key of this model."
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        data_type: varchar
        description: >
          Commissioning-side patient identifier. Join key expected by the
          Snowflake-registered QAdmissions model. Note that a small number of
          sk_patient_id values can appear on more than one row because
          upstream dim_person_demographics can map several person_ids to the
          same sk_patient_id in identity-reconciliation edge cases.
        data_tests:
          - not_null

      - name: age
        data_type: number
        description: "Current age in years. Restricted to 18-100 inclusive (QAdmissions eligibility)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 18
                max_value: 100
                inclusive: true

      - name: sex
        data_type: varchar
        description: "Sex for QAdmissions."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['male', 'female']

      - name: bmi
        data_type: float
        description: "Latest recorded BMI (kg/m^2) from int_bmi_latest. Raw value - not clipped; NULL when no BMI has been recorded for the person."

      - name: sha1
        data_type: number
        description: "Strategic Health Authority code. Constant 5 (London) for all NCL patients."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [5]

      - name: surv
        data_type: number
        description: "Survival horizon in years for the QAdmissions prediction. Defaults to 1 via var('qadmissions_horizon_years')."
        data_tests:
          - not_null

      - name: b_AF
        data_type: boolean
        description: "Atrial fibrillation. Sourced from dim_person_conditions.has_atrial_fibrillation."

      - name: b_CCF
        data_type: boolean
        description: "Congestive cardiac failure. Sourced from dim_person_conditions.has_heart_failure."

      - name: b_anycancer
        data_type: boolean
        description: "Any cancer diagnosis. Sourced from dim_person_conditions.has_cancer."

      - name: b_asthmacopd
        data_type: boolean
        description: "Asthma or COPD. Sourced from dim_person_conditions.has_asthma OR has_copd."

      - name: b_epilepsy
        data_type: boolean
        description: "Epilepsy. Sourced from dim_person_conditions.has_epilepsy."

      - name: b_renal
        data_type: boolean
        description: "Chronic kidney disease. Sourced from dim_person_conditions.has_chronic_kidney_disease."

      - name: b_manicschiz
        data_type: boolean
        description: "Severe mental illness (mania / schizophrenia). Sourced from dim_person_conditions.has_severe_mental_illness."

      - name: b_cvd
        data_type: boolean
        description: "Cardiovascular disease composite: coronary heart disease OR stroke/TIA OR peripheral arterial disease."

      - name: b_type1
        data_type: boolean
        description: "Type 1 diabetes, from fct_person_diabetes_register. 'Unknown' diabetes type maps to FALSE."

      - name: b_type2
        data_type: boolean
        description: "Type 2 diabetes, from fct_person_diabetes_register. 'Unknown' diabetes type maps to FALSE."

      - name: smoke_cat
        data_type: number
        description: >
          Smoking category. 0 = never smoked, 1 = ex-smoker, 3 = current smoker.
          Category 2 (light smoker with CPD) and categories 4-5 (moderate/heavy
          smokers) cannot be produced from the available data - CPD is not
          captured. Current smokers therefore map to category 3. 
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 3]

      - name: b_anticoagulant
        data_type: boolean
        description: "One or more anticoagulant prescriptions in the prior 6 months. Uses int_anticoagulant_medications_all.is_recent_6m."

      - name: b_antidepressant
        data_type: boolean
        description: "One or more antidepressant prescriptions in the prior 6 months. Uses int_antidepressant_medications_all.is_recent_6m."

      - name: b_antipsychotic
        data_type: boolean
        description: "One or more antipsychotic prescriptions in the prior 6 months. Uses int_antipsychotic_medications_all.is_recent_6m."

      - name: b_corticosteroids
        data_type: boolean
        description: "One or more systemic corticosteroid prescriptions in the prior 6 months. Uses int_systemic_corticosteroid_medications_all.is_recent_6m."

      - name: b_nsaid
        data_type: boolean
        description: "One or more NSAID prescriptions in the prior 6 months. Uses int_nsaid_medications_all.is_recent_6m."

      - name: hes_admitprior_cat
        data_type: number
        description: >
          Number of emergency inpatient spells in the prior 12 months, capped
          at 3 (so possible values are 0, 1, 2, 3+). Sourced from
          fct_person_sus_apc_recent.apc_nel_12mo (non-elective emergency spells,
          admission_method codes 21-28 / 2A-2D). Joined on sk_patient_id.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]

      - name: c_hb
        data_type: boolean
        description: "Low-haemoglobin flag. TRUE if latest haemoglobin value is below the threshold from qadmissions_lab_thresholds seed, FALSE otherwise (including NULL haemoglobin)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: high_lft
        data_type: boolean
        description: "High liver-function-test flag. TRUE if any of ALT, GGT, or bilirubin exceeds its threshold from qadmissions_lab_thresholds seed, FALSE otherwise."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: high_platelet
        data_type: boolean
        description: "High platelet flag. TRUE if latest platelet count exceeds the threshold from qadmissions_lab_thresholds seed, FALSE otherwise (including NULL platelets)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: b_falls
        data_type: boolean
        description: "TRUE if the person has any coded falls observation (history of falls). Sourced from int_falls_observations_all using the QAdmissions FALLS_COD_Q codelist."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: b_malabsorption
        data_type: boolean
        description: "TRUE if the person has any coded malabsorption diagnosis (coeliac disease, IBD, or post-resection). Sourced from int_malabsorption_diagnoses_all using the QAdmissions MALABSORPTION_COD_Q codelist."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: b_vte
        data_type: boolean
        description: "TRUE if the person has any coded venous thromboembolism diagnosis (DVT or PE). Sourced from int_vte_diagnoses_all using the QAdmissions VENOUS_THROMBOEMBOLISM_COD_Q codelist."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: b_liverpancreas
        data_type: boolean
        description: "TRUE if the person has any coded chronic liver disease or chronic pancreatitis diagnosis. Sourced from int_liver_pancreatitis_diagnoses_all using the QAdmissions LIVER_DISEASE_OR_CHRONIC_PANCREATITIS_COD_Q codelist (a single combined cluster per the QAdmissions paper)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: town
        data_type: float
        description: >
          Townsend Deprivation Score for the person's residential LSOA
          (higher = more deprived). Sourced from int_qadmissions_townsend,
          which bridges dim_person_demographics.lsoa_code_21 to the
          qadmissions_townsend_lsoa_2011 seed via stg_reference_lsoa2011_lsoa2021.
          NULL when no LSOA recorded or when the LSOA does not match the
          England-and-Wales bridge (e.g. Scottish or NI residence) - NULL
          is passed through to the registered QAdmissions model.

      - name: alcohol_cat6
        data_type: number
        description: >
          QAdmissions alcohol category (0..5: NonDrinker, Trivial, Light,
          Moderate, Heavy, VeryHeavy). Sourced from int_qadmissions_alcohol_category,
          which derives cat6 from int_alcohol_audit_scores filtered to
          Full AUDIT and takes the highest cat6 ever recorded per person.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5]
              config:
                where: "alcohol_cat6 IS NOT NULL"

      - name: ethrisk
        data_type: number
        description: >
          QAdmissions ethnicity risk group (1..9: 1=White/NotRecorded,
          2=Indian, 3=Pakistani, 4=Bangladeshi, 5=OtherAsian,
          6=BlackCaribbean, 7=BlackAfrican, 8=Chinese, 9=OtherEthnicGroup).
          Sourced from int_qadmissions_ethrisk, which joins
          dim_person_ethnicity to the qadmissions_eth2016_to_ethrisk9
          seed on `ethnicity_subcategory` text. The seed includes
          explicit "Not Recorded" / "Not Stated" / "Refused" /
          "Recorded Not Known" rows mapping to 1, so every person -
          including those without a usable ethnicity record - is
          matched.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7, 8, 9]
