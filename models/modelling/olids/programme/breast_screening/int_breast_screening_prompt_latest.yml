models:
  - name: int_breast_screening_prompt_latest
    description: >-
      Last recorded breast screening prompt per person in OLIDS. Uses SNOMED CT
      710871000000104 from SMI_LONGER_LIVES_CANCER_SCREEN_PROMPTS in ECL_CACHE. People
      need not have SMI; age, sex, registration and death are unrestricted. Future
      prompts are excluded; missing dates appear as 1900-01-01. No further validity
      filter applies. Ties use the latest save time, then the highest observation ID.
    config:
      meta:
        owner:
          name: KateHomer55
    # tests:
    #   - dbt_expectations.expect_table_row_count_to_be_between:
    #       arguments:
    #         min_value: 1

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [person_id]
    columns:
      - name: person_id
        tests:
          - not_null
