models:
  - name: int_breast_screening_prompt_latest
    description: >-
      Latest breast screening prompt per person in NCL OLIDS. Uses SNOMED CT 710871000000104 from
      SMI_LONGER_LIVES_CANCER_SCREEN_PROMPTS in ECL_CACHE. People need not have SMI; age, sex,
      registration and death are unrestricted. Future prompts are excluded; missing dates appear as
      1900-01-01.
    config:
      meta:
        owner:
          name: KateHomer55
    # tests:
    #   - dbt_expectations.expect_table_row_count_to_be_between:
    #       arguments:
    #         min_value: 1

    columns:
      - name: person_id
        tests:
          - not_null