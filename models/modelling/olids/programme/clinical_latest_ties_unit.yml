unit_tests:
- name: breast_screening_latest_uses_save_time_then_id
  model: int_breast_screening_latest
  overrides:
    macros:
      get_empty_subquery_sql: SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS concept_display WHERE FALSE
  given:
  - input: ref('int_breast_screening_all')
    format: sql
    rows: |-
      SELECT
          column1::VARCHAR AS id,
          column2::NUMBER AS person_id,
          column3::TIMESTAMP_NTZ AS clinical_effective_date,
          'SYN_CODE'::VARCHAR AS concept_code,
          column5::VARCHAR AS concept_display,
          'LSMOK_COD'::VARCHAR AS source_cluster_id,
          NULL::VARCHAR AS screening_observation_type,
          NULL::BOOLEAN AS is_completed_screening,
          NULL::BOOLEAN AS is_declined_screening,
          column4::TIMESTAMP_NTZ AS date_recorded
      FROM VALUES
          ('SYN_Z', -144581, '2024-03-01 15:00', '2024-03-02', 'SYN_OTHER'),
          ('SYN_A', -144581, '2024-03-01 09:00', '2024-03-03', 'SYN_WINNER'),
          ('SYN_A', -144582, '2024-03-01', '2024-03-02', 'SYN_OTHER'),
          ('SYN_Z', -144582, '2024-03-01', '2024-03-02', 'SYN_WINNER'),
          ('SYN_Z', -144583, '2024-03-01', NULL, 'SYN_OTHER'),
          ('SYN_A', -144583, '2024-03-01', '2024-03-02', 'SYN_WINNER')
  expect:
    rows:
    - person_id: -144581
      concept_display: SYN_WINNER
    - person_id: -144582
      concept_display: SYN_WINNER
    - person_id: -144583
      concept_display: SYN_WINNER
