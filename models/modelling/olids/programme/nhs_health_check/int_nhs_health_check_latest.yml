models:
  - name: int_nhs_health_check_latest
    description: >-
      Latest recorded NHS Health Check completion. The OLIDS population comes
      from NCL GP records. One row per person with a HEALTH_CHECK_COMP
      observation, without an age, registration or death restriction. Includes
      the latest date and flags for records within 365, 730 and 1,825 days of
      the build date. Future-dated records can be selected and satisfy these
      flags. This model does not assess programme eligibility. Missing
      clinical dates are retained as 1900-01-01.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Patient identifier - primary key (one row per person)'
        tests:
          - unique
          - not_null
