models:
  - name: int_nhs_health_check_latest
    description: >-
      Last recorded OLIDS NHS Health Check completion, one row per person with
      HEALTH_CHECK_COMP evidence. There are no age, registration or death restrictions,
      and programme eligibility is not assessed. Currency flags use 365, 730 and 1,825
      days from today; future records also count as current. Missing clinical dates
      appear as 1900-01-01. Selects the last recorded event in the input without a
      further validity filter. Ties use the latest save time, then the highest
      observation ID.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Patient identifier - primary key (one row per person)'
        tests:
          - unique
          - not_null
