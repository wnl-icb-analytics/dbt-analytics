models:
  - name: int_nhs_health_check_all
    description: >-
      OLIDS NHS Health Check completions, one row per HEALTH_CHECK_COMP observation.
      There are no age, registration or death restrictions, and programme eligibility
      is not assessed. Currency flags use 365, 730 and 1,825 days from today; future
      records also count as current. Missing clinical dates appear as 1900-01-01.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id]
      - cluster_ids_exist:
          arguments:
            cluster_ids: HEALTH_CHECK_COMP
    columns:
      - name: date_recorded
        description: EMIS save time of the selected observation; null when unavailable.
