models:
  - name: int_nhs_health_check_all
    description: >-
      Recorded NHS Health Check completions. One row per HEALTH_CHECK_COMP observation, without
      an age, registration or death restriction. Includes concept details and flags for records
      within 365, 730 and 1,825 days of the build date. Future-dated records are retained and
      also satisfy these flags. This model does not assess the programme's age or five-year
      eligibility rules. Missing clinical dates are retained as 1900-01-01.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: HEALTH_CHECK_COMP