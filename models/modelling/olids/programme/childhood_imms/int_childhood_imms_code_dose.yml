models:
  - name: int_childhood_imms_code_dose
    description: >
      Childhood immunisation codes matched to childhood schedule doses. One row per schedule
      vaccine ID, code, code cluster and matched dose. A code matches when its cluster is
      the schedule's administered, drug, declined or contraindicated cluster and its dose
      matches the schedule dose. Codes covering several doses match each schedule dose they
      cover: 6-in-1 '1,2,3,4', MenB '1,2,3', HPV '1,2,3' to doses 1 and 2, and MMR, MMRV,
      PCV and rotavirus '1,2'. Hib/MenC '1,2' codes match dose 1 only.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1