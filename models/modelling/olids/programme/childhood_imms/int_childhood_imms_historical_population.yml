models:
  - name: int_childhood_imms_historical_population
    description: >-
      Historical childhood immunisation population at reporting ages 1, 2, 5,
      11 and 16. The OLIDS population comes from NCL GP records. One row per
      person and analysis month in the preceding 48 months, using
      person_month_analysis_base. Registration must overlap the month; people
      need not be active or living at month end because this model applies no
      separate registration-status or death filter. Includes demographics,
      practice, residential geography and birth-cohort flags for interpreting
      schedule changes.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - analysis_month
    columns:
      - name: person_id
        description: Person included in the childhood immunisation reporting population.
      - name: analysis_month
        description: Month-end date used to determine age and registration status.

      - name: is_fiscal_year_end
        description: Flag to identify the 31st March of each year as FISCAL year

