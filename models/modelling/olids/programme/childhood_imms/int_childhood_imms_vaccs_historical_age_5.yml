models:
  - name: int_childhood_imms_vaccs_historical_age_5
    description: >
      Vaccination completion flags for children aged 5, one row per person and analysis
      month. Flags use all events recorded to date, not only earlier ones. Covers the last
      48 analysis months, using registrations overlapping each month. No separate deceased
      filter applies. Unmet rules return 0 when the person and practice match back to the
      calculation; an unmatched practice name leaves the calculated fields null. Flags
      cover 6-in-1 doses 1 to 3, 4-in-1 pre-school booster, Hib/MenC and MMR doses 1 and 2.
      Completion uses recorded age at event and rounded month intervals, with upper
      limits of age 5 and 60 months for the final dose in each course. MMR dose 1 requires
      recorded age 1 or 2 and a non-negative rounded interval from the first birthday.
      Dose 2 must be on or after dose 1. all_comp_by_5 is 1 when all five flags are 1.
      Declined and contraindicated records do not count.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

