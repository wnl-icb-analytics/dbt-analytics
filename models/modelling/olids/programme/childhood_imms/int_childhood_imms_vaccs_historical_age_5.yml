models:
  - name: int_childhood_imms_vaccs_historical_age_5
    description: >
      Vaccination completion flags for children aged 5, one row per person and analysis
      month. Flags use all events recorded to date, not only earlier ones. Covers the last
      48 analysis months; children must be registered in the month and not deceased. Those
      with no qualifying administration stay in with 0 flags. Flags are 1 when administered
      events were given by age 5: 6-in-1 doses 1 to 3, 4-in-1 pre-school booster, Hib/MenC,
      MMR dose 1 at age 1 or 2 and on or after the first birthday, and MMR dose 2 on or
      after dose 1. all_comp_by_5 is 1 when all five are met. Declined and contraindicated
      records do not count.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

