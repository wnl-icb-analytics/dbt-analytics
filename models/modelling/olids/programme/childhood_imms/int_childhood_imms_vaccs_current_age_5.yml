models:
  - name: int_childhood_imms_vaccs_current_age_5
    description: >-
      Vaccination completion for OLIDS children aged 5, one row per registered, living
      person with a schedule status record, including incomplete courses. Covers
      6-in-1 doses 1 to 3, 4-in-1, Hib/MenC and both MMR doses. Flags are 1 when
      recorded vaccination ages and dose intervals meet the rules, using rounded
      months from approximate birth date; otherwise 0. Overall completion is 1 only
      when the 6-in-1, 4-in-1, Hib/MenC, MMR dose 1 and MMR dose 2 flags are all 1,
      for every child.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

