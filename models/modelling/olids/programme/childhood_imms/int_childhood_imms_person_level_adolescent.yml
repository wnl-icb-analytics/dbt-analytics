models:
  - name: int_childhood_imms_person_level_adolescent
    description: >-
      Vaccination status and demographics for OLIDS people aged 11 to 18 inclusive,
      one row per registered, living person with a schedule status record. Covers
      6-in-1, Hib/MenC, MMR, 4-in-1, 3-in-1, HPV and MenACWY, including declines,
      contraindications and missing-record outcomes. Birth-cohort rules determine
      which schedule variants apply.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

