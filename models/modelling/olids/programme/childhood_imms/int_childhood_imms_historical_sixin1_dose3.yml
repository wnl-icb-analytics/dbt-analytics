models:
  - name: int_childhood_imms_historical_sixin1_dose3
    description: >-
      6-in-1 dose 3 administrations in NCL OLIDS people whose demographic age is under 11, including
      inactive and deceased people. One row per person with a retained administration. Uses 6IN1_3,
      with current or last practice, month and fiscal year; this does not list every administration.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
