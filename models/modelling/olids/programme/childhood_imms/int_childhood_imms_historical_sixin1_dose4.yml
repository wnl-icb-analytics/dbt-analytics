models:
  - name: int_childhood_imms_historical_sixin1_dose4
    description: >-
      Retained administered 6-in-1 dose 4 for people whose demographic age is under 11, including
      inactive and deceased people. One row per person with a retained administration, using 6IN1_4.
      Dates follow the retained events in int_childhood_imms_vaccination_events_historical, rather
      than every administration. Includes current or last practice, month and fiscal year. Only
      events on or after 1 January 2026 are included.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
