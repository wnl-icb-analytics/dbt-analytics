models:
  - name: int_childhood_imms_historical_sixin1_dose4
    description: >
      Children currently under 11, registered now or previously, with an administered 6-in-1
      dose 4 on or after 1 January 2026. One row per person. Dose 4 is the 18-month dose
      introduced on 1 January 2026. Adds current practice, event date, month label, YYYYMM
      sort key and April-to-March fiscal year.

    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
