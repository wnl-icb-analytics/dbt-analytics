models:
  - name: int_childhood_imms_historical_sixin1_dose4
    description: >
      Administered 6-in-1 dose 4 (18-month dose) for the historical childhood population.
      One row per person in int_childhood_imms_dose_base_child (currently aged under 11,
      registered now or previously) with a 6IN1_4 administration dated on or after 1
      January 2026, when the dose was introduced. Upstream event rules keep at most one
      event per person and vaccine ID. Adds current practice, event date, month label,
      YYYYMM sort key and April-to-March fiscal year.

    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
