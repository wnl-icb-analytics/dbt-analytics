models:
  - name: int_childhood_imms_ts_agg_age_2
    description: >-
      Historical vaccination completion counts for people aged 2. The OLIDS
      population comes from NCL GP records. One row per vaccination measure,
      analysis month and combination of practice name and code, ethnicity and
      deprivation quintile. Population and completion rules follow
      int_childhood_imms_vaccs_historical_age_2 for the preceding 48 months.
      Numerator sums completion flags and denominator counts person-month
      rows, including people without completed vaccinations. Completion can
      use events after the analysis month, so this series is not a snapshot of
      evidence available at that month end.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1