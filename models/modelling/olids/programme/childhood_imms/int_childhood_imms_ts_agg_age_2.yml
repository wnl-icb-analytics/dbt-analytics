models:
  - name: int_childhood_imms_ts_agg_age_2
    description: >-
      Vaccination completion counts for NCL OLIDS children aged 2 in each historical month, covering
      48 months. One row per measure, month and practice name and code, ethnicity and deprivation
      quintile. Includes registrations overlapping each month; numerator counts recorded completions
      and denominator counts person-months, including incomplete courses. Later events can count
      towards earlier months, so this does not show only evidence available at each month end.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1