models:
  - name: int_childhood_imms_current_population
    description: >-
      Current childhood immunisation population. The OLIDS population comes
      from NCL GP records. One row per currently registered, living person
      under 20, with demographics, practice, residential geography and
      looked-after-child status. Age and vaccine birth-cohort flags use
      approximate birth date. Cohort dates distinguish births from 1 September
      2022, 1 July 2024 and 1 January 2025 for schedule changes.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique


