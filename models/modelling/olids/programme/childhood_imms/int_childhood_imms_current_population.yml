models:
  - name: int_childhood_imms_current_population
    description: >-
      Children and young people in the OLIDS immunisation programme, one row per
      registered, living person under 20. Includes demographics, practice, residence
      and looked-after-child status. Age and schedule flags use approximate birth
      date; birth cohorts from 1 September 2022, 1 July 2024 and 1 January 2025
      distinguish schedule changes.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique


