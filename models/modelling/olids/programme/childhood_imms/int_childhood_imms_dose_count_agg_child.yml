models:
  - name: int_childhood_imms_dose_count_agg_child
    description: >-
      Monthly counts of retained childhood vaccine doses for people whose demographic age is under
      11 in int_childhood_imms_dose_count_child, including inactive and deceased people. One row per
      dose, month, fiscal year, practice, registered and residential geography, age, ethnicity and
      deprivation group. Includes the current fiscal year and preceding four. Counts reflect
      retained dose-month rows rather than every administration; distinct retained schedule-variant
      months can give a person more than one contribution.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1