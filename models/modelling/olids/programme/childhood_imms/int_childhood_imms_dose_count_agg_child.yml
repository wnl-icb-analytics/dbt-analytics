models:
  - name: int_childhood_imms_dose_count_agg_child
    description: >-
      Monthly retained childhood-dose counts for NCL OLIDS people whose demographic age is under 11,
      including inactive and deceased people. One row per dose, month, fiscal year, practice,
      registered/residential geography, age, ethnicity and deprivation group, covering this fiscal
      year and four preceding years. Counts follow int_childhood_imms_dose_count_child; schedule
      variants can give a person several contributions. These are not counts of every
      administration.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1