models:
  - name: int_childhood_imms_historical_mmr_dose2
    description: >-
      MMR dose 2 administrations in NCL OLIDS people whose demographic age is under 11, including
      inactive and deceased people. One row per person with a retained administration. Uses MMR_2,
      with current or last practice, month and fiscal year; this does not list every administration.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
