models:
  - name: int_childhood_imms_vaccs_current_age_2
    description: >-
      Vaccination completion for OLIDS children aged 2, one row per registered, living
      person with a schedule status record, including incomplete courses. Covers
      6-in-1, Hib/MenC, MMR/MMRV, MenB and PCV, with July 2024 and January 2025
      birth-cohort pathways. Flags are 1 when recorded vaccination ages and dose
      intervals meet the rules, using rounded months from approximate birth date;
      otherwise 0. Overall completion follows the required course for the child's
      birth cohort.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

