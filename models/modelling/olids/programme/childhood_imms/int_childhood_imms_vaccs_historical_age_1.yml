models:
  - name: int_childhood_imms_vaccs_historical_age_1
    description: >-
      Historical vaccination completion measures for people aged 1. One row per person and
      analysis month in int_childhood_imms_historical_population, covering the preceding 48
      months with registrations overlapping each month. Includes people who have not completed
      vaccination and applies no separate death filter. Covers 6-in-1 doses 1 to 3, rotavirus
      doses 1 and 2, MenB doses 1 and 2, and PCV dose 1. Flags use retained events recorded
      through the build date, including events after the analysis month, with recorded age and
      rounded-month limits. Unmet rules give 0 when a calculation exists. Completion fields,
      person_id, age and practice_name can be null when no person-and-practice calculation
      matches.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

