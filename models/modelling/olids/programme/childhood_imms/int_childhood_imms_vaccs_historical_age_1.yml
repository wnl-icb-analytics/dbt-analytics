models:
  - name: int_childhood_imms_vaccs_historical_age_1
    description: >-
      Vaccination completion for OLIDS children aged 1 in each historical month, one
      row per person and month over 48 months. Registration must overlap the month,
      without a separate death filter. Covers 6-in-1 doses 1 to 3, two rotavirus
      doses, two MenB doses and PCV dose 1. Completion uses recorded vaccination ages
      and rounded-month limits, including later events. Unmet rules give 0;
      completion, person_id, age and practice_name can be null without a matching
      person/practice calculation.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

