models:
  - name: int_childhood_imms_overview_adolescent
    description: >-
      Vaccination completion counts for OLIDS children aged 11 and 16, one row per
      measure, age, run date and demographic, practice and residential group shown.
      Uses the current age-cohort completion rules. Numerator counts recorded
      completions; denominator includes all registered, living people in each source
      cohort, including those with incomplete courses.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1