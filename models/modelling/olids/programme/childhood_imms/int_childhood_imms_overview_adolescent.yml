models:
  - name: int_childhood_imms_overview_adolescent
    description: >-
      Current vaccination completion counts at reporting ages 11 and 16. One row per vaccination
      measure, reporting age, run date and combination of sex, ethnicity, language, deprivation,
      practice, residential geography and looked-after-child status. Population and completion rules
      follow the corresponding int_childhood_imms_vaccs_current_age models. Numerator sums
      completion flags; denominator includes all currently registered, living people in each source
      age cohort, including those without completed vaccinations.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1