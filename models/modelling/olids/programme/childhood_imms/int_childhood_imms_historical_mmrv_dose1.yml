models:
  - name: int_childhood_imms_historical_mmrv_dose1
    description: >-
      Retained administered MMRV dose 1 for people whose demographic age is under 11, including
      inactive and deceased people. One row per person and distinct retained administration date
      across schedule variants, using MMRV_1, MMRV_1B, MMRV_1C. Dates follow the retained events in
      int_childhood_imms_vaccination_events_historical, rather than every administration. Includes
      current or last practice, month and fiscal year. Only events on or after 1 January 2026 are
      included.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
