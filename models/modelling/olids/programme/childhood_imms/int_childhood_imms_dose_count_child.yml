models:
  - name: int_childhood_imms_dose_count_child
    description: >-
      Monthly labels and fiscal years for retained childhood vaccine doses
      among people whose demographic age is under 11, including inactive and
      deceased people. The OLIDS population comes from NCL GP records. One row
      per person and combination of retained dose months, with current or last
      practice, residential geography, age, ethnicity and deprivation. People
      without an administered dose remain included with null dose fields. More
      than one retained month for a schedule variant can produce several rows
      per person; this is not a record of every administration.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Identifier for the person. There may be > 1 person if 
          registered at multiple practices
        tests:
          - not_null

