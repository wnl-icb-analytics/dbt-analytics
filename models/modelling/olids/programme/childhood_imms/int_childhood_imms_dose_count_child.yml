models:
  - name: int_childhood_imms_dose_count_child
    description: >-
      Retained OLIDS childhood dose months for people whose demographic age is under
      11, including inactive and deceased people. One row per person and combination
      of dose months, with current or last practice and demographics. People without
      administrations have null dose fields. Different retained months across schedule
      variants can give several rows per person; this does not list every
      administration.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Identifier for the person. There may be > 1 person if 
          registered at multiple practices
        tests:
          - not_null

