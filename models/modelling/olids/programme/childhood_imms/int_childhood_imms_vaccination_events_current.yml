models:
  - name: int_childhood_imms_vaccination_events_current
    description: >
      Childhood immunisation events and status for children currently under 19. One row per
      person and schedule vaccine ID. Events are GP observation and medication order records
      dated up to today, mapped through int_childhood_imms_code_dose. A medication record is
      used only when no observation exists for the same person, vaccine ID, date and dose.
      Events must match one of the person's schedule rows in
      int_childhood_imms_currently_eligible and fall after the first day of the birth month.
      On the same date an administration is kept over a decline or contraindication. Dose n
      uses the nth dated event for the vaccine ID, whatever its type. Status is Completed,
      OutofSchedule if more than 15 days outside the schedule age window, Declined,
      Contraindicated, or Not applicable where the vaccine ID does not apply to the child's
      birth cohort. Cohorts are born before September 2022, from 1 September 2022, from 1
      July 2024 and from 1 January 2025.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
