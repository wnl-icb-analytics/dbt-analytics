models:
  - name: int_childhood_imms_vaccination_events_current
    description: >
      Childhood immunisation events for the current childhood population. One row per
      person and schedule vaccine ID, for people currently aged under 19. Events are GP
      observation and medication order records dated on or before today whose code maps to
      the vaccine and dose through int_childhood_imms_code_dose; a medication record is
      added only where no observation exists for the same person, vaccine ID, date and
      dose. Events must match one of the person's schedule rows in
      int_childhood_imms_currently_eligible and be dated after the first day of the birth
      month. On the same date an administration is kept over a decline or
      contraindication; for dose n the nth dated event for that vaccine ID is kept,
      whatever its type. Status is Completed, OutofSchedule (more than 15 days outside the
      schedule age window), Declined, Contraindicated, or Not applicable where the vaccine
      ID does not apply to the child's birth cohort (before September 2022, from 1
      September 2022, from 1 July 2024 or from 1 January 2025).
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
