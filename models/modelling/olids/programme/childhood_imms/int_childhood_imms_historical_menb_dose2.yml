models:
  - name: int_childhood_imms_historical_menb_dose2
    description: >-
      Retained administered MenB dose 2 for people whose demographic age is
      under 11, including inactive and deceased people. The OLIDS population
      comes from NCL GP records. One row per person and distinct retained
      administration date across schedule variants, using MENB_2, MENB_2B.
      Dates follow the retained events in
      int_childhood_imms_vaccination_events_historical, rather than every
      administration. Includes current or last practice, month and fiscal
      year.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
