models:
  - name: int_childhood_imms_historical_menb_dose2
    description: >-
      MenB dose 2 administrations in OLIDS people whose demographic age is under 11,
      including inactive and deceased people. One row per person and retained
      administration date; schedule variants can give several rows per person. Uses
      MENB_2, MENB_2B, with current or last practice, month and fiscal year; this does
      not list every administration.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
