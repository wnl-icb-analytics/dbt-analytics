models:
  - name: int_childhood_imms_historical_menb_dose1
    description: >-
      MenB dose 1 administrations in NCL OLIDS people whose demographic age is under 11, including
      inactive and deceased people. One row per person with a retained administration. Uses MENB_1,
      with current or last practice, month and fiscal year; this does not list every administration.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
