models:
  - name: int_childhood_imms_historical_rota_dose1
    description: >-
      Retained administered rotavirus dose 1 for people whose demographic age is under 11, including
      inactive and deceased people. One row per person with a retained administration, using ROTA_1.
      Dates follow the retained events in int_childhood_imms_vaccination_events_historical, rather
      than every administration. Includes current or last practice, month and fiscal year.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
