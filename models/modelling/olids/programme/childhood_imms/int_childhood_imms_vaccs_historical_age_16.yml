models:
  - name: int_childhood_imms_vaccs_historical_age_16
    description: >-
      Historical vaccination completion measures for people aged 16. The OLIDS
      population comes from NCL GP records. One row per person and analysis
      month in int_childhood_imms_historical_population, covering the
      preceding 48 months with registrations overlapping each month. Includes
      people who have not completed vaccination and applies no separate death
      filter. Covers 6-in-1 doses 1 to 3, the 4-in-1 and 3-in-1 boosters, MMR,
      HPV and MenACWY. Flags use retained events recorded through the build
      date, including events after the analysis month, with recorded age and
      rounded-month limits. Unmet rules give 0 when a calculation exists.
      Completion fields, person_id, age and practice_name can be null when no
      person-and-practice calculation matches. HPV dose 1 age evidence can
      count without an administration event type.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

