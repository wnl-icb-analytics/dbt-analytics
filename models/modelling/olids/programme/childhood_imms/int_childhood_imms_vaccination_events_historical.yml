models:
  - name: int_childhood_imms_vaccination_events_historical
    description: >-
      Retained childhood immunisation events for historical analysis. The
      OLIDS population comes from NCL GP records. One row per person and
      childhood schedule vaccine ID, using GP observation and medication
      records mapped by int_childhood_imms_code_dose. Events must be dated
      through the build date, after the first day of the person's birth month,
      with recorded age at event under 19. Administration takes precedence
      over decline or contraindication on the same date. Dose n is the nth
      retained dated event for that vaccine ID, regardless of event type.
      Current age, registration, death and schedule eligibility are not
      filtered here.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

