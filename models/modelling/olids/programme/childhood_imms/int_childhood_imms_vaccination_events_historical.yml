models:
  - name: int_childhood_imms_vaccination_events_historical
    description: >-
      Retained OLIDS childhood immunisation events, one row per person and schedule
      vaccine ID, mapped by int_childhood_imms_code_dose. GP observations/orders must
      be dated through today, after the first day of the birth month, with recorded
      event age under 19. Administration wins same-day conflicts. Dose n uses the nth
      dated event regardless of type. Current age, registration, death and schedule
      eligibility are not restricted.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

