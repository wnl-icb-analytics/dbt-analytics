models:
  - name: int_childhood_imms_historical_pcv_dose1
    description: >-
      Retained administered PCV dose 1 for people whose demographic age is under 11, including
      inactive and deceased people. One row per person and distinct retained administration date
      across schedule variants, using PCV_1, PCV_1B. Dates follow the retained events in
      int_childhood_imms_vaccination_events_historical, rather than every administration. Includes
      current or last practice, month and fiscal year.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
