models:
  - name: int_childhood_imms_historical_pcv_dose1
    description: >-
      PCV dose 1 administrations in NCL OLIDS people whose demographic age is under 11, including
      inactive and deceased people. One row per person and retained administration date; schedule
      variants can give several rows per person. Uses PCV_1, PCV_1B, with current or last practice,
      month and fiscal year; this does not list every administration.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
