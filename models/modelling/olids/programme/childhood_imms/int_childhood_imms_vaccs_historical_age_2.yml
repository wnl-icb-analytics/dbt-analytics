models:
  - name: int_childhood_imms_vaccs_historical_age_2
    description: >
      Vaccination completion flags for children aged 2, one row per person and analysis
      month. Flags use all events recorded to date, not only earlier ones. Covers the last
      48 analysis months; children must be registered in the month and not deceased. Those
      with no qualifying administration stay in with 0 flags. Flags apply age-at-event and
      interval rules by birth cohort. Born before 1 July 2024 counts 6-in-1 doses 1 to 3,
      Hib/MenC and MMR dose 1 by age 2. Born on or after 1 July 2024 counts 6-in-1 dose 4 at
      18 to 24 months and MMRV. Born on or after 1 January 2025 adds MMRV dose 2 at 18 to 24
      months. MenB 3 doses and PCV dose 2 on or after the first birthday apply to all.
      Declined and contraindicated records do not count.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

