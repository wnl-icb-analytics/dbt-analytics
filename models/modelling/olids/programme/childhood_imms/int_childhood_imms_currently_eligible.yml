models:
  - name: int_childhood_imms_currently_eligible
    description: >-
      Childhood immunisation schedule and eligibility dates for the current
      registered, living population under 20. The OLIDS population comes from
      NCL GP records. One row per person and schedule vaccine ID, once the
      person has reached the earliest age in the childhood schedule. Rows are
      retained whether currently_eligible is true or false. Eligibility dates
      use approximate birth date and the latest childhood schedule.
      Applicability flags reflect the September 2022, July 2024 and January
      2025 birth cohorts and changes to MMR, MMRV, Hib/MenC, PCV, MenB and
      6-in-1.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

