models:
  - name: int_childhood_imms_currently_eligible
    description: >-
      Childhood immunisation schedule in NCL OLIDS, one row per registered, living person under 20
      and vaccine ID once the earliest schedule age is reached. Includes both currently eligible and
      ineligible rows. Dates use approximate birth date and the latest schedule; birth cohorts from
      September 2022, July 2024 and January 2025 determine which changed vaccines apply.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

