models:
  - name: int_childhood_imms_dose_base_child
    description: >-
      Retained NCL OLIDS childhood vaccination events for people whose demographic age is under 11,
      one row per person and event. People without events appear once with null vaccination fields.
      Uses int_childhood_imms_vaccination_events_historical with current or last practice and
      April-to-March fiscal year. Includes inactive and deceased people, with age at death where
      known.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Identifier for the person. There may be > 1 person if 
          registered at multiple practices
        tests:
          - not_null

