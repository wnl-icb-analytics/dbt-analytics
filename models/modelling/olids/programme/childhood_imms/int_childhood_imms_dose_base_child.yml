models:
  - name: int_childhood_imms_dose_base_child
    description: >-
      Retained childhood immunisation events with current demographics and practice for people whose
      demographic age is under 11. One row per person and retained vaccine event; people without an
      event appear once with null vaccination fields. Events follow
      int_childhood_imms_vaccination_events_historical. Inactive and deceased people are included,
      with age at death where known. The fiscal year is April to March.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Identifier for the person. There may be > 1 person if 
          registered at multiple practices
        tests:
          - not_null

