models:
  - name: int_childhood_imms_ts_agg_res_age_11
    description: >-
      Vaccination completion counts for OLIDS children aged 11 in each historical
      month, covering 48 months. One row per measure, month and residential borough,
      neighbourhood, ward, ethnicity and deprivation quintile. Includes registrations
      overlapping each month; numerator counts recorded completions and denominator
      counts person-months, including incomplete courses. Later events can count
      towards earlier months, so this does not show only evidence available at each
      month end.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1