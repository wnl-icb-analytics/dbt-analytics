models:
  - name: int_childhood_imms_vaccination_status_current
    description: >-
      Current childhood immunisation status. The OLIDS population comes from
      NCL GP records. One row per currently registered, living person under 19
      and schedule vaccine ID from int_childhood_imms_currently_eligible,
      whether currently eligible or not. Recorded events can be Completed,
      OutofSchedule, Declined or Contraindicated. Missing events are
      classified as Not applicable, Not due yet, Overdue or No longer eligible
      according to birth cohort and schedule dates. Vaccination date and age
      at event are null without a matching event.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

