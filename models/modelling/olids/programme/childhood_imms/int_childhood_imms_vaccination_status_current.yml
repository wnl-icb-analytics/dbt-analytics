models:
  - name: int_childhood_imms_vaccination_status_current
    description: >-
      Current OLIDS childhood immunisation status, one row per registered, living
      person under 19 and schedule vaccine ID, whether currently eligible or not.
      Includes Completed, OutofSchedule, Declined and Contraindicated events. Missing
      events become Not applicable, Not due yet, Overdue or No longer eligible under
      birth-cohort and schedule rules. Date and age at event are null without a match.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

