models:
  - name: int_childhood_imms_person_level_child
    description: >-
      Vaccination status and demographics for NCL OLIDS people aged under 11, one row per
      registered, living person with a schedule status record. Covers 6-in-1, rotavirus, MenB, PCV,
      Hib/MenC, MMR, MMRV and 4-in-1, including declines, contraindications and missing-record
      outcomes. Birth-cohort rules determine which schedule variants apply.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

