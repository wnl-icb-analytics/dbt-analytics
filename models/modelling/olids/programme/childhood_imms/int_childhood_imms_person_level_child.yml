models:
  - name: int_childhood_imms_person_level_child
    description: >-
      Current childhood vaccination status and demographics for people aged under 11. One row per
      currently registered, living person with at least one schedule status record in
      int_childhood_imms_vaccination_status_current. Covers 6-in-1, rotavirus, MenB, PCV, Hib/MenC,
      MMR, MMRV and the 4-in-1 booster. Statuses include completed, declined, contraindicated and
      missing-record outcomes, with birth-cohort rules determining applicable schedule variants.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

