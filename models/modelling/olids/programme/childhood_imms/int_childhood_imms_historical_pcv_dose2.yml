models:
  - name: int_childhood_imms_historical_pcv_dose2
    description: >-
      Retained administered PCV dose 2 for people whose demographic age is
      under 11, including inactive and deceased people. The OLIDS population
      comes from NCL GP records. One row per person with a retained
      administration, using PCV_2. Dates follow the retained events in
      int_childhood_imms_vaccination_events_historical, rather than every
      administration. Includes current or last practice, month and fiscal
      year.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique
