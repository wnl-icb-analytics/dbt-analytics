models:
  - name: int_childhood_imms_vaccs_current_age_1
    description: >-
      Vaccination completion for NCL OLIDS children aged 1, one row per registered, living person
      with a schedule status record, including incomplete courses. Covers 6-in-1 doses 1 to 3, two
      rotavirus doses, two MenB doses and PCV dose 1. Flags are 1 when recorded vaccination ages and
      dose intervals meet the rules, using rounded months from approximate birth date; otherwise 0.
      Overall completion follows the required course for the child's birth cohort.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

