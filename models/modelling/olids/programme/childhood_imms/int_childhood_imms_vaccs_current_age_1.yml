models:
  - name: int_childhood_imms_vaccs_current_age_1
    description: >-
      Current vaccination completion measures for people aged 1. The OLIDS
      population comes from NCL GP records. One row per currently registered,
      living person of that age with a childhood schedule status record,
      including people who have not completed vaccination. Covers 6-in-1 doses
      1 to 3, rotavirus doses 1 and 2, MenB doses 1 and 2, and PCV dose 1.
      Flags use retained event dates, recorded age at event and dose-specific
      age and interval rules, including rounded months from approximate birth
      date. A flag is 1 when its rule is met and otherwise 0. The combined
      flag requires the model's full course pathway, rather than every
      available schedule dose.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

