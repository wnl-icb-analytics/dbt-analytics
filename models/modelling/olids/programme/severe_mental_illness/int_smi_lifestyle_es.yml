models:
  - name: int_smi_lifestyle_es
    description: >-
      Lifestyle measures for the OLIDS SMI enhanced service, one row per registered,
      living person with an active SMI diagnosis. Excludes people with lithium alone
      or resolved diagnoses. Shows the latest lifestyle assessments, reviews and
      interventions, with 12-month flags and current demographics.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null