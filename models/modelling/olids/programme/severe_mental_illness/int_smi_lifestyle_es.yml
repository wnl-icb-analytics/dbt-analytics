models:
  - name: int_smi_lifestyle_es
    description: >-
      Lifestyle measures for the SMI enhanced service. One row per currently registered, living
      person in int_smi_population_base with an active SMI diagnosis; lithium-only and
      resolved-diagnosis members are excluded. Includes the latest smoking, alcohol and illicit drug
      assessments, nutrition, exercise, dental reviews and related interventions from
      int_smi_lifestyle, with preceding-12-month flags and current demographics.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null