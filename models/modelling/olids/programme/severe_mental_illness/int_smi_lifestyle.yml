models:
  - name: int_smi_lifestyle
    description: >-
      Latest lifestyle assessments and interventions for people in the NCL OLIDS SMI programme, one
      row per registered, living person with an active SMI diagnosis. Excludes people with lithium
      alone or resolved diagnoses. Covers smoking, alcohol, drugs, BMI, nutrition, exercise, dental
      reviews and referrals, with 12-month flags. Recorded declines remain distinct from completed
      assessments.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

