models:
  - name: int_smi_lifestyle
    description: >-
      Latest lifestyle assessments and interventions for people in the OLIDS SMI
      programme, one row per registered, living person with an active SMI diagnosis.
      Excludes people with lithium alone or resolved diagnoses. Covers smoking,
      alcohol, drugs, BMI, nutrition, exercise, dental reviews and referrals, with
      12-month flags. Recorded declines remain distinct from completed assessments.
      Valid same-day AUDIT records prefer the full instrument, then the highest
      total, latest recorded date and observation id. Same-day classified alcohol
      sources prefer AUDIT, then weekly units, then disorders.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        data_tests:
          - not_null
          - unique

      - name: smok_int_last_12m
        description: >-
          Yes when a non-declined intervention is recorded in the 12 months to the
          build date. A later decline does not remove it. The smok_int_date,
          smok_int_type and smoking_cessation_services columns describe the latest record ever,
          which may be a decline.
      - name: alc_int_last_12m
        description: >-
          Yes when a non-declined intervention is recorded in the 12 months to the
          build date. A later decline does not remove it. The alc_int_date,
          alc_int_type and alcohol_advice_services columns describe the latest record ever,
          which may be a decline.
      - name: sm_int_last_12m
        description: >-
          Yes when a non-declined intervention is recorded in the 12 months to the
          build date. A later decline does not remove it. The sm_int_date,
          sm_int_type and subs_misuse_services columns describe the latest record ever,
          which may be a decline.

