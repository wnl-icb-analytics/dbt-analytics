models:
  - name: int_smi_lifestyle
    description: >-
      Latest recorded lifestyle assessments and interventions for the SMI
      programme. The OLIDS population comes from NCL GP records. One row per
      currently registered, living person in int_smi_population_base with an
      active SMI diagnosis; lithium-only and resolved-diagnosis members are
      excluded. Includes smoking, alcohol and illicit drug use, BMI,
      nutrition, exercise, dental reviews and referrals, with flags for
      evidence in the preceding 12 months. Declines are retained separately
      from recorded assessments.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

