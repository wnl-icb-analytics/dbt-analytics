models:
  - name: int_smi_lifestyle
    description: >-
      Latest lifestyle assessments and interventions for people in the OLIDS SMI
      programme, one row per registered, living person with an active SMI diagnosis.
      Excludes people with lithium alone or resolved diagnoses. Covers smoking,
      alcohol, drugs, BMI, nutrition, exercise, dental reviews and referrals, with
      12-month flags. Recorded declines remain distinct from completed assessments.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        data_tests:
          - not_null
          - unique

      - name: smok_int_last_12m
        description: >-
          Yes when a non-declined intervention is recorded in the 12 months to the
          build date. A later decline does not remove it. The smok_int_date,
          smok_int_type and smoking_cessation_services columns describe the latest record ever,
          which may be a decline.
      - name: alc_int_last_12m
        description: >-
          Yes when a non-declined intervention is recorded in the 12 months to the
          build date. A later decline does not remove it. The alc_int_date,
          alc_int_type and alcohol_advice_services columns describe the latest record ever,
          which may be a decline.
      - name: sm_int_last_12m
        description: >-
          Yes when a non-declined intervention is recorded in the 12 months to the
          build date. A later decline does not remove it. The sm_int_date,
          sm_int_type and subs_misuse_services columns describe the latest record ever,
          which may be a decline.

unit_tests:
- name: smi_lifestyle_intervention_flag_ignores_declines
  model: int_smi_lifestyle
  given:
  - input: ref('int_illicit_drug_use_latest')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::BOOLEAN AS illicit_drug_assessed_last_12m, NULL::TEXT AS illicit_drug_pattern, NULL::TEXT AS illicit_drug_class WHERE FALSE
    format: sql
  - input: ref('int_smi_population_base')
    rows: |-
      SELECT -9801::NUMBER(38,0) AS person_id, NULL::TEXT AS hx_flake, NULL::NUMBER(16,0) AS age, NULL::TEXT AS gender, TRUE::BOOLEAN AS has_active_smi_diagnosis
      UNION ALL
      SELECT -9802::NUMBER(38,0) AS person_id, NULL::TEXT AS hx_flake, NULL::NUMBER(16,0) AS age, NULL::TEXT AS gender, TRUE::BOOLEAN AS has_active_smi_diagnosis
      UNION ALL
      SELECT -9803::NUMBER(38,0) AS person_id, NULL::TEXT AS hx_flake, NULL::NUMBER(16,0) AS age, NULL::TEXT AS gender, TRUE::BOOLEAN AS has_active_smi_diagnosis
    format: sql
  - input: ref('int_subs_misuse_intervention_latest')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::TEXT AS concept_display, NULL::TEXT AS subs_misuse_services WHERE FALSE
    format: sql
  - input: ref('fct_person_smoking_status')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::TEXT AS smoking_status, NULL::TIMESTAMP_NTZ AS latest_smoking_date WHERE FALSE
    format: sql
  - input: ref('int_smoking_assessment_declined')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::TEXT AS concept_display WHERE FALSE
    format: sql
  - input: ref('int_smoking_intervention_latest')
    rows: |-
      SELECT -9801::NUMBER(38,0) AS person_id, '{{ (run_started_at - modules.datetime.timedelta(days=10)).strftime('%Y-%m-%d') }}'::TIMESTAMP_NTZ AS clinical_effective_date, NULL::TEXT AS concept_display, 'Declined'::TEXT AS smoking_cessation_services
      UNION ALL
      SELECT -9802::NUMBER(38,0) AS person_id, '{{ (run_started_at - modules.datetime.timedelta(days=10)).strftime('%Y-%m-%d') }}'::TIMESTAMP_NTZ AS clinical_effective_date, NULL::TEXT AS concept_display, 'Declined'::TEXT AS smoking_cessation_services
      UNION ALL
      SELECT -9803::NUMBER(38,0) AS person_id, '{{ (run_started_at - modules.datetime.timedelta(days=400)).strftime('%Y-%m-%d') }}'::TIMESTAMP_NTZ AS clinical_effective_date, NULL::TEXT AS concept_display, 'Yes'::TEXT AS smoking_cessation_services
    format: sql
  - input: ref('int_alcohol_misuse_disorders')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::TEXT AS concept_display WHERE FALSE
    format: sql
  - input: ref('int_alcohol_audit_scores')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::TEXT AS risk_category WHERE FALSE
    format: sql
  - input: ref('int_alcohol_units_latest')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::DATE AS clinical_effective_date, NULL::FLOAT AS result_value, NULL::TEXT AS result_unit_display, NULL::TEXT AS alcohol_risk_category, NULL::TEXT AS high_alcohol_use_flag WHERE FALSE
    format: sql
  - input: ref('int_alcohol_assessment_declined')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::TEXT AS concept_display WHERE FALSE
    format: sql
  - input: ref('int_alcohol_intervention_latest')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::TEXT AS concept_display, NULL::TEXT AS alcohol_advice_services WHERE FALSE
    format: sql
  - input: ref('int_bmi_latest')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::FLOAT AS bmi_value, NULL::TEXT AS bmi_category, NULL::NUMBER(1,0) AS bmi_risk_sort_key WHERE FALSE
    format: sql
  - input: ref('int_bmi_assessment_declined')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date WHERE FALSE
    format: sql
  - input: ref('int_nutrition_review_latest')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::TEXT AS concept_display, NULL::TEXT AS poor_diet_flag WHERE FALSE
    format: sql
  - input: ref('int_weight_mgmt_intervention_latest')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::TEXT AS concept_display, NULL::TEXT AS referral_diet_advice, NULL::TEXT AS referral_exercise_advice WHERE FALSE
    format: sql
  - input: ref('int_dental_inspection_latest')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::TEXT AS concept_display, NULL::BOOLEAN AS dental_last_12m WHERE FALSE
    format: sql
  - input: ref('int_exercise_assessment_latest')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::TEXT AS concept_display, NULL::TEXT AS low_exercise_flag WHERE FALSE
    format: sql
  - input: ref('int_smoking_intervention')
    rows: |-
      SELECT -9801::NUMBER(38,0) AS person_id, '{{ (run_started_at - modules.datetime.timedelta(days=60)).strftime('%Y-%m-%d') }}'::TIMESTAMP_NTZ AS clinical_effective_date, 'Yes'::TEXT AS smoking_cessation_services
      UNION ALL
      SELECT -9801::NUMBER(38,0) AS person_id, '{{ (run_started_at - modules.datetime.timedelta(days=10)).strftime('%Y-%m-%d') }}'::TIMESTAMP_NTZ AS clinical_effective_date, 'Declined'::TEXT AS smoking_cessation_services
      UNION ALL
      SELECT -9802::NUMBER(38,0) AS person_id, '{{ (run_started_at - modules.datetime.timedelta(days=10)).strftime('%Y-%m-%d') }}'::TIMESTAMP_NTZ AS clinical_effective_date, 'Declined'::TEXT AS smoking_cessation_services
      UNION ALL
      SELECT -9803::NUMBER(38,0) AS person_id, '{{ (run_started_at - modules.datetime.timedelta(days=400)).strftime('%Y-%m-%d') }}'::TIMESTAMP_NTZ AS clinical_effective_date, 'Yes'::TEXT AS smoking_cessation_services
    format: sql
  - input: ref('int_alcohol_intervention')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::TEXT AS alcohol_advice_services WHERE FALSE
    format: sql
  - input: ref('int_subs_misuse_intervention')
    rows: |-
      SELECT NULL::NUMBER(38,0) AS person_id, NULL::TIMESTAMP_NTZ AS clinical_effective_date, NULL::TEXT AS subs_misuse_services WHERE FALSE
    format: sql
  expect:
    rows:
    - person_id: -9801
      smok_int_last_12m: 'Yes'
    - person_id: -9802
      smok_int_last_12m: 'No'
    - person_id: -9803
      smok_int_last_12m: 'No'
