models:
  - name: int_smi_cf_secondary_care
    description: >-
      SMI casefinding profile for NLFT inpatients. One row per cross-system patient with an active
      SMI diagnosis in the current registered, living programme population and an NLFT spell
      admitted in the preceding 6 months or with no recorded discharge. Requires an NLFT identifier,
      commissioner code 93C in both patient and spell records, and no recorded MHSDS death date. The
      latest qualifying admission and latest ward stay within it are retained, with health-check
      gaps and vulnerability measures. MHSDS submission lag means recent admissions may be absent;
      the model's source notes describe an approximate six-week lag.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique