models:
  - name: int_smi_cf_secondary_care
    description: >-
      Casefinding profile for OLIDS people with SMI and an NLFT admission in the last
      6 months or no recorded discharge, one row per cross-system patient. Requires
      current living registration, active SMI diagnosis, an NLFT identifier,
      commissioner 93C in patient and spell records, and no MHSDS death date. Shows
      the latest qualifying admission and ward stay, check gaps and vulnerabilities.
      Recent admissions may be absent because MHSDS submissions lag by about six
      weeks.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        data_tests:
          - not_null
          - unique
