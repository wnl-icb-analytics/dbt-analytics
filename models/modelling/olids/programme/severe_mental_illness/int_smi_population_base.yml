models:
  - name: int_smi_population_base
    description: >-
      People in the OLIDS SMI programme, one row per registered, living person with an
      SMI diagnosis outside the remission code set, or lithium prescribed in 6 months
      without a later LITSTP_COD stop. Later resolution does not remove a person.
      Evidence is capped at today; missing recording dates remain included.
      has_active_smi_diagnosis identifies unresolved diagnoses, so this population is
      wider than the diagnosis-only QOF register.
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: LITSTP_COD
            source: PCD

    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

