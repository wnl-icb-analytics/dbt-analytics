models:
  - name: int_smi_population_base
    description: >
      Intermediate table holding demographics and core metrics for people in
      the SMI programme. Programme casefinding retains diagnosis and active
      lithium routes independently of the diagnosis-only QOF v51 register.

    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: LITSTP_COD

    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null
          - unique

