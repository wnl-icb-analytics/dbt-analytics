models:
  - name: int_smi_six_health_check
    description: >-
      Physical health checks for people with active SMI in OLIDS, one row per person
      and check type. People must be registered and alive; lithium alone and resolved
      diagnoses do not qualify. Covers BMI, HbA1c or glucose, cholesterol or QRISK,
      blood pressure, smoking and alcohol. Met, Declined and Not Met reflect evidence
      in 12 months; Met means completion, not clinical control. Includes latest
      exception in that period and checks met. A completion in the 12 months wins
      over a decline in the same period.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [person_id, check_type]
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

      - name: exception_category
        description: >-
          Patient unsuitable or informed dissent, from the QOF PCD cluster.
          Null when no exception is recorded in the window.
        data_tests:
          - accepted_values:
              arguments:
                values: [Patient Unsuitable, Informed dissent]

unit_tests:
- name: smi_six_health_check_completion_overrides_decline
