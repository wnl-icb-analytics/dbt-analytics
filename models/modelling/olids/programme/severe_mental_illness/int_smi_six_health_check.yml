models:
  - name: int_smi_six_health_check
    description: >-
      Six core physical health checks for the SMI programme. The OLIDS
      population comes from NCL GP records. One row per person and check type
      for currently registered, living people in int_smi_population_base with
      an active SMI diagnosis; lithium-only and resolved-diagnosis members are
      excluded. Checks cover BMI, HbA1c or blood glucose, cholesterol or
      QRISK, blood pressure, smoking and alcohol. Each check is Met, Declined
      or Not Met according to evidence in the preceding 12 months. Met records
      completion evidence rather than clinical control. Includes the latest
      recorded exception in that period and the person's count of checks met.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

