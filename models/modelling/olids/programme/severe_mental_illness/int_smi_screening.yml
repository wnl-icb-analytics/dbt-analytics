models:
  - name: int_smi_screening
    description: >-
      Cancer screening status for registered, living people in the OLIDS SMI
      programme, including those with lithium alone or resolved diagnoses. One row per
      person and available screening type; people without a match appear once with
      null screening fields. Cervical and breast records require female gender and
      screening eligibility; bowel records follow the bowel-screening population.
      Shows latest outcome, last completion and whether screening has ever been
      recorded.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

