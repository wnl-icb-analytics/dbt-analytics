models:
  - name: int_smi_screening
    description: >-
      Cancer screening status for the current registered, living SMI programme
      population in int_smi_population_base, including lithium-only and
      resolved-diagnosis members. The OLIDS population comes from NCL GP
      records. One row per person and available screening type; people without
      a matching screening status appear once with null screening fields.
      Cervical and breast status are limited to recorded female gender and
      their upstream screening populations. Bowel status follows its upstream
      screening population. Includes latest outcome, last completed date and
      whether a screen has ever been recorded.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

