models:
  - name: int_smi_population_historical
    description: >-
      Historical SMI population with demographics and registration status. One row per person and
      analysis month in person_month_analysis_base with has_smi true, covering months in the
      preceding 48 months. The monthly has_smi definition determines membership. This model does not
      apply a separate active-registration or death restriction, so it differs from the current SMI
      programme population.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

