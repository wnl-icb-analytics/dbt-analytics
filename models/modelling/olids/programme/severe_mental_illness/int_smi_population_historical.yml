models:
  - name: int_smi_population_historical
    description: >-
      People with SMI recorded in each historical NCL OLIDS month, one row per person and month over
      the preceding 48 months. Membership uses the monthly has_smi definition. There is no further
      active-registration or death restriction, so membership differs from the current SMI programme
      population.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

