models:
  - name: int_smi_vaccination
    description: >-
      Vaccination status for registered, living people with active SMI in OLIDS,
      excluding lithium alone and resolved diagnoses. Each row is a person's status
      and date for Flu 2025-26, COVID Autumn 2025, PPV, RSV or shingles; several rows
      can occur per vaccine. People without matches appear once with null vaccination
      fields. Flu/COVID require active dashboard registration; eligible means a
      matching source record, not a separate eligibility assessment.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

