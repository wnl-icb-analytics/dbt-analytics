models:
  - name: int_smi_vaccination
    description: >-
      Vaccination status for currently registered, living SMI programme
      members with an active SMI diagnosis; lithium-only and
      resolved-diagnosis members are excluded. The OLIDS population comes from
      NCL GP records. One row per person and available vaccination status,
      covering Flu 2025-26, COVID Autumn 2025, pneumococcal, RSV and shingles.
      Distinct status and date combinations can produce more than one row for
      a vaccination type. People without a matching status appear once with
      null vaccination fields. Flu and COVID rows require an active
      registration in the dashboard. The eligible flag indicates a matching
      vaccination source record rather than an independent eligibility
      assessment.
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

