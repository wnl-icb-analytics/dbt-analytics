models:
  - name: int_smi_casefinding
    description: >-
      SMI casefinding profile. One row per currently registered, living person in
      int_smi_population_base with an active SMI diagnosis; lithium-only and resolved-diagnosis
      members are excluded. Includes counts and lists of six health checks not met or declined in
      the preceding 12 months, recorded exceptions, smoking, alcohol, illicit drug use,
      homelessness, deprivation and long-term condition burden. People remain included without
      health-check records; absent summaries appear as zero incomplete checks and "All checks met".
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

