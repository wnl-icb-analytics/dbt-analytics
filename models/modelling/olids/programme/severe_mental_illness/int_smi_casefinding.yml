models:
  - name: int_smi_casefinding
    description: >-
      Casefinding profile for people in the OLIDS SMI programme, one row per
      registered, living person with an active SMI diagnosis. Excludes people with
      lithium alone or resolved diagnoses. Summarises six health checks not met or
      declined in 12 months, exceptions and recorded vulnerabilities. People without
      check records remain included; missing summaries show zero incomplete checks and
      "All checks met".
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - not_null

