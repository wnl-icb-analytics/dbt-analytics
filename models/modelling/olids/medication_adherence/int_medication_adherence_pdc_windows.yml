models:
  - name: int_medication_adherence_pdc_windows
    description: >
      Long windowed PDC table: rolling 12-month PDC and overall chain PDC per
      person and drug (VTM), restricted to persons with a linked patient
      record (dim_person) and presented with the readable VTM name via a
      deduplicated 1:1 code-to-name map. Drill-down table behind
      fct_person_medication_adherence. One row per (person_id, vtm_code,
      window_start); windows with no qualifying orders carry NULL
      exposure / covered_days / pdc.
    config:
      meta:
        owner:
          name: em-baldwin
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - vtm_code
              - window_start
    columns:
      - name: person_id
        description: Person identifier; joins to dim_person.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: person_id
      - name: vtm_code
        description: >
          Drug grouping key — the VTM code the refill chain was computed on
          (a concept display string for rows that never resolved to a VTM).
          Part of the unique grain; distinct codes could in principle share a
          name, so uniqueness is tested here, not on drug_name.
        tests:
          - not_null
      - name: drug_name
        description: >
          Readable drug name — the VTM name for the chain's vtm_code via a
          deduplicated 1:1 map (one name per code), falling back to the
          concept display string for unresolved chains. Matches the original
          pipeline's drug_name presentation.
        tests:
          - not_null
      - name: drug_class
        description: Adherence drug class label.
        tests:
          - not_null
      - name: window_start
        description: Rolling window start (person-anchored monthly).
        tests:
          - not_null
      - name: window_end
        description: Window end (window_start + 12 months).
      - name: exposure_start
        description: First order date within the window; NULL for windows with no qualifying orders.
      - name: exposure_end
        description: Last order end date within the window; NULL for windows with no qualifying orders.
      - name: covered_days
        description: Net covered days in the window (faithful variant, with the last-order quirk).
      - name: covered_days_corrected
        description: Net covered days with the last-order quirk fixed and supply right-censored at as_at_date.
      - name: window_days
        description: Exposure span in days — the faithful pdc_type=2 denominator (can extend beyond the window frame and past as_at_date).
      - name: window_days_corrected
        description: Exposure span truncated at as_at_date — the denominator for pdc_corrected.
      - name: pdc
        description: Faithful rolling PDC (AIC measure, uncapped; NULL when no positive coverage).
      - name: pdc_corrected
        description: Rolling PDC2 — last-order quirk fixed and right-censored at as_at_date (exposure not bounded to the window frame).
      - name: overall_start
        description: First order date of the (person, drug) chain.
      - name: overall_end
        description: Last order end date of the (person, drug) chain.
      - name: total_exposure_days
        description: Days from overall_start to overall_end — the faithful overall denominator.
      - name: total_exposure_days_corrected
        description: Days from overall_start to overall_end truncated at as_at_date — denominator for overall_pdc_corrected.
      - name: overall_pdc
        description: Faithful overall PDC across the chain span.
      - name: overall_pdc_corrected
        description: Overall PDC2 across the chain span — quirk fixed and right-censored at as_at_date.
      - name: as_at_date
        description: Observation cutoff applied to the corrected family (data-derived; see int_medication_adherence_pdc).
      - name: pdc_type
        description: Constant 2 (dynamic exposure-window denominator).
      - name: exclusive
        description: Constant TRUE (early-refill overlap subtracted; strict window upper bound).
      - name: window_length_months
        description: Constant 12.
