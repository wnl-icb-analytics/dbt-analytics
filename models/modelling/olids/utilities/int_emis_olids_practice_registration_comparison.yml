
models:
  - name: int_emis_olids_practice_registration_comparison
    description: |
      Compares OLIDS Regular registration counts against EMIS list size per practice.

      Acceptance Criteria:
      - Aggregate: <1% variance across all practices
      - Per-practice: <2% variance OR fewer than 5 persons difference (whichever is greater)

      Categorisation:
      - Meets Criteria: <2% variance OR <5 persons difference
      - 2-5% Variance: Between 2-5% variance
      - 5-20% Variance: Between 5-20% variance
      - 20%+ Variance: 20% or greater variance
      - Missing Data: No EMIS or OLIDS data available

      Data Sources:
      - EMIS: Static extract (date from seed file)
      - OLIDS: Regular registrations open on the EMIS extract date (see olids_count_basis)

      OLIDS registrations come from EMIS, so this is the authoritative check. EMIS
      rewrites some registration dates after the event: a patient removed in list
      cleaning and then re-registered gets a new start date, and leaving dates can
      be backdated. A count rebuilt later from current history therefore drifts down
      as the extract ages. When the daily registration snapshot covers the extract
      date, OLIDS is counted as recorded on that date instead. The June 2026 extract
      predates the snapshot; rebuilt from a mid-July 2026 copy of the feed, it matched
      within about 0.1%.

    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: practice_code
        description: 'GP practice ODS code - primary key'
        tests:
          - unique
          - not_null

      - name: practice_name
        description: GP practice name from dim_practice; falls back to the EMIS
          seed value for merged/closed practices no longer in the OLIDS feed.

      - name: borough
        description: Registered borough from dim_practice; falls back to the EMIS
          seed value for merged/closed practices no longer in the OLIDS feed.

      - name: emis_list_size
        description: Number of registered patients from EMIS extract

      - name: olids_regular_count
        description: Number of patients with Regular registration episodes in 
          OLIDS

      - name: olids_count_basis
        description: As recorded when the OLIDS count comes from the daily
          registration snapshot for the extract date; Rebuilt when the extract
          predates the snapshot and the count is rebuilt from current history.
          NULL for practices with no OLIDS registrations.

      - name: difference
        description: Difference between OLIDS and EMIS (signed, can be negative)

      - name: absolute_difference
        description: Absolute difference between OLIDS and EMIS

      - name: percent_difference
        description: Percentage difference (signed, can be negative)

      - name: absolute_percent_difference
        description: Absolute percentage difference

      - name: extract_date
        description: Date of EMIS extract (from seed file)

      - name: meets_acceptance_criteria
        description: Boolean flag indicating if practice meets acceptance 
          criteria (<2% variance OR <5 persons difference)

      - name: variance_category
        description: Categorisation of variance (Meets Criteria, 2-5% Variance, 
          5-20% Variance, 20%+ Variance, Missing Data)

      - name: validation_methodology
        description: Description of the validation test applied (EMIS Regular 
          Registration Comparison with thresholds)
