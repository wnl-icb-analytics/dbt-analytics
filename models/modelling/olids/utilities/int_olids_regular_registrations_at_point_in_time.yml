models:
  - name: int_olids_regular_registrations_at_point_in_time
    description: |
      One row per practice: people with an open Regular registration on the EMIS
      list size extract date, for comparison with the EMIS extract. A person
      registered at two practices counts at both, as each practice's EMIS list
      would. People who had died by that date are excluded.

      When int_patient_registrations_current_snapshot covers the extract date, the
      count is the registered list as OLIDS recorded it that day. Otherwise it is
      rebuilt from int_patient_registrations, which runs low for older extracts
      because EMIS later rewrites some registration dates.

    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: practice_ods_code
        description: GP practice ODS code
        tests:
          - not_null
          - unique

      - name: regular_registered_patients
        description: Count of distinct persons with Regular registration episodes active on snapshot date
        tests:
          - not_null

      - name: olids_count_basis
        description: As recorded (from the daily registration snapshot) or Rebuilt (from current registration history).
        data_tests:
          - accepted_values:
              arguments:
                values: ['As recorded', 'Rebuilt']

      - name: snapshot_date
        description: Reference date for point-in-time calculation (from EMIS extract_date)
        tests:
          - not_null