version: 2
models:
- name: int_sus_person_clinical_record
  description: SUS clinical records, one row per source clinical item. Retains missing linkage and unsupported dates.
    Prepared source facts retain domain-specific interpretation and all additional relationships. Incremental loads
    process newly received deliveries and replay the boundary delivery. Withdrawn source keys are removed on each
    run. Monthly full refreshes reconcile earlier corrections and reference changes.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: clinical_record_id
    description: '{{ doc(''navigation_clinical_record_id'') }}'
    data_tests:
    - unique
  - name: sk_patient_id
    description: '{{ doc(''navigation_sk_patient_id'') }}'
  - name: source_dataset
    description: '{{ doc(''navigation_source_dataset'') }}'
  - name: source_record_type
    description: '{{ doc(''navigation_source_record_type'') }}'
  - name: source_record_id
    description: '{{ doc(''navigation_source_record_id'') }}'
  - name: source_model_name
    description: '{{ doc(''navigation_source_model_name'') }}'
  - name: clinical_record_type
    description: '{{ doc(''navigation_clinical_record_type'') }}'
  - name: clinical_record_date
    description: '{{ doc(''navigation_clinical_record_date'') }}'
  - name: clinical_time_precision
    description: '{{ doc(''navigation_clinical_time_precision'') }}'
  - name: clinical_time_basis
    description: '{{ doc(''navigation_clinical_time_basis'') }}'
  - name: source_code
    description: '{{ doc(''navigation_source_code'') }}'
  - name: source_code_name
    description: '{{ doc(''navigation_source_code_name'') }}'
