  - name: parent_model_name
    description: '{{ doc(''navigation_parent_model_name'') }}'
  - name: relationship_type
    description: '{{ doc(''navigation_relationship_type'') }}'
  - name: referring_organisation_code
    description: '{{ doc(''navigation_referring_organisation_code'') }}'
  - name: referring_organisation_name
    description: '{{ doc(''navigation_referring_organisation_name'') }}'
  - name: source_received_at
    description: '{{ doc(''navigation_source_received_at'') }}'
  - name: consultation_mechanism_code
    description: SUS OP Consultation Medium Used code, a separate NHS DD list from MHSDS/CSDS Consultation
      Mechanism. Null for APC and ECDS milestones.
  - name: consultation_mechanism_name
    description: Authoritative NHS DD Consultation Medium Used label for SUS OP, retained from UKHFD.
  - name: priority_code
