version: 2
models:
- name: int_sus_healthcare_event
  description: SUS recorded healthcare milestones, one row per source record and milestone type. Primary milestones
    remain when undated; optional milestones require a recorded date. Contacts do not imply attendance. Incremental
    loads process newly received deliveries and replay the boundary delivery. Withdrawn source keys are removed
    on each run. Monthly full refreshes reconcile earlier corrections and reference changes.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: event_id
    description: '{{ doc(''navigation_event_id'') }}'
    data_tests:
    - unique
  - name: source_dataset
    description: '{{ doc(''navigation_source_dataset'') }}'
  - name: source_record_type
    description: '{{ doc(''navigation_source_record_type'') }}'
  - name: source_record_id
    description: '{{ doc(''navigation_source_record_id'') }}'
  - name: source_model_name
    description: '{{ doc(''navigation_source_model_name'') }}'
  - name: sk_patient_id
    description: '{{ doc(''navigation_sk_patient_id'') }}'
  - name: care_setting
    description: '{{ doc(''navigation_care_setting'') }}'
  - name: provider_organisation_code
    description: '{{ doc(''navigation_provider_organisation_code'') }}'
  - name: provider_organisation_name
    description: '{{ doc(''navigation_provider_organisation_name'') }}'
  - name: site_code
    description: '{{ doc(''navigation_site_code'') }}'
  - name: site_name
    description: '{{ doc(''navigation_site_name'') }}'
  - name: specialty_code
    description: '{{ doc(''navigation_specialty_code'') }}'
  - name: specialty_name
    description: '{{ doc(''navigation_specialty_name'') }}'
  - name: attendance_code
    description: '{{ doc(''navigation_attendance_code'') }}'
  - name: attendance_name
    description: '{{ doc(''navigation_attendance_name'') }}'
  - name: outcome_code
    description: '{{ doc(''navigation_outcome_code'') }}'
  - name: outcome_name
    description: '{{ doc(''navigation_outcome_name'') }}'
  - name: source_received_at
    description: '{{ doc(''navigation_source_received_at'') }}'
  - name: event_type
    description: '{{ doc(''navigation_event_type'') }}'
  - name: event_name
    description: '{{ doc(''navigation_event_name'') }}'
  - name: event_date
    description: '{{ doc(''navigation_event_date'') }}'
  - name: event_at
    description: '{{ doc(''navigation_event_at'') }}'
  - name: event_time_precision
    description: '{{ doc(''navigation_event_time_precision'') }}'
  - name: event_time_basis
    description: '{{ doc(''navigation_event_time_basis'') }}'
  - name: provider_code_authority
    description: '{{ doc(''navigation_provider_code_authority'') }}'
