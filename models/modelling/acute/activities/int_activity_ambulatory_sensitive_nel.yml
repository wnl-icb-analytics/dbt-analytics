version: 2

models:
  - name: int_activity_ambulatory_sensitive_nel
    description: > 
      Warning: In development. Incomplete logic.
      Activities considered as Ambulatory care sensitive according to open codelist indicated as primary diagnosis reason.
      Covers non-elective admitted patient care spells only (admission method 2*, excluding 2C).
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: visit_occurrence_id
        data_type: number
        description: "Unique identifier for the visit occurrence."
        data_tests:
          - unique
          - not_null

      - name: ambulatory_sensitive_nel
        data_type: boolean
        description: "Flag indicating whether the encounter is related to non-elective admissions associated withambulatory care sensitive conditions. Always true for records in this table."

      - name: primary_diagnosis_term
        data_type: varchar
        description: "Term for the primary diagnosis reason."
