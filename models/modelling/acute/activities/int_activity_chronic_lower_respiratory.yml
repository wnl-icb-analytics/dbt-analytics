version: 2

models:
  - name: int_activity_chronic_lower_respiratory
    description: > 
      Warning: In development. Incomplete logic.
      Activities considered as chronic lower respiratory disease-related for commissioning analysis. Based on an exclusion based approach from respiratory.
      Includes encounters from A&E, admitted patient care, and outpatient settings that match respiratory-related diagnoses, procedures, or HRG codes. 
      Notable exclusions: influenza, pneumonia and upper respiratory infections (ICD-10 J0*, J1*, J3*, J5*-J9*) in some datasets but not all. Other acute lower respiratory infections (J2*) are kept.
    config:
      meta:
        owner:
          name: Emily Baldwin
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: LOWER_RESP_COND,TOT_RESP_COND
            source: ECL_CACHE
    columns:
      - name: visit_occurrence_id
        data_type: number
        description: "Unique identifier for the visit occurrence."
        data_tests:
          - unique
          - not_null

      - name: lower_respiratory_encounter
        data_type: boolean
        description: "Flag indicating whether the encounter is related to chronic lower respiratory disease. Always true for records in this table."
