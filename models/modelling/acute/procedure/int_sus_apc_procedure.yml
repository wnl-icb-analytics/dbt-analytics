
models:
  - name: int_sus_apc_procedure
    description: >-
      Distinct OPCS-4 procedure codes submitted for SUS admitted patient spells.
      One row represents one distinct procedure code per spell and
      observation_count records repeated submissions of that code. Retains
      clinical activity when the spell has no linked patient key; patient fields
      are null in those rows.
    config:
      tags: ["daily"]
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: procedure_id
        data_type: varchar
        description: "Unique identifier for the procedure record"
        data_tests:
          - unique
          - not_null

      - name: date
        data_type: date
        description: "Date of the appointment associated with the procedure"

      - name: visit_occurrence_id
        data_type: number
        description: "Unique identifier for the visit occurrence"

      - name: visit_occurrence_type
        data_type: varchar
        description: "Source of the visit occurrence (e.g., IP_ATTENDANCE = inpatient
          attendance)"

      - name: problem_order
        data_type: number
        description: "Order of the procedure within the visit"

      - name: sk_patient_id
        data_type: varchar
        description: >-
          Pseudonymised patient identifier. Null when the spell cannot be linked
          to a patient; this does not remove the procedure activity.

      - name: organisation_id
        data_type: varchar
        description: "Unique identifier for the provider organisation providing the
          service"

      - name: organisation_name
        data_type: varchar
        description: "Provider organisation name"

      - name: site_id
        data_type: varchar
        description: "Unique identifier for the site where the service was provided"

      - name: site_name
        data_type: varchar
        description: "Site name where the service was provided"

      - name: source_concept_code
        data_type: varchar
        description: "OPCS-4 code of the procedure"

      - name: concept_code
        data_type: varchar
        description: "OPCS-4 code of the procedure mapped to a standard concept via
          athena concept table"

      - name: concept_name
        data_type: varchar
        description: "OPCS-4 description of the procedure mapped to a standard concept
          via athena concept table"

      - name: concept_vocabulary
        data_type: varchar
        description: ""
