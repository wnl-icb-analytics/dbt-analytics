version: 2

models:
  - name: int_sus_uec_encounter_clinical_codes
    description: >
      ECDS clinical codes per A&E attendance as ordered arrays. One row per
      attendance (visit_occurrence_id) that has at least one coded secondary
      diagnosis, investigation, treatment, comorbidity or Coded Clinical
      Finding. Each feed has a plain
      code array for filtering (array_contains) and an array of objects for
      reading, both in source sequence order; nothing is truncated. Objects
      carry seq, code and desc, plus at (recorded timestamp) for investigations
      and treatments and qualifier_code/qualifier (confirmed or suspected) for
      diagnoses. ECDS carries no investigation result values. desc is the ECDS dictionary preferred term, falling back to the
      SNOMED concept term, or null where neither has the code. Join to
      int_sus_uec_encounter on visit_occurrence_id; attendances with no codes
      are absent here. For descriptions and one-row-per-code analysis use
      int_sus_uec_diagnosis and int_sus_uec_procedure.
    config:
      tags: ["daily"]
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: visit_occurrence_id
        description: ECDS attendance identifier (PRIMARYKEY_ID). Grain of the model.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_sus_uec_encounter')
                field: visit_occurrence_id
      - name: secondary_diagnosis_codes
        description: >
          All secondary diagnosis SNOMED codes (source positions 2 onward) in
          sequence order. The primary diagnosis is on int_sus_uec_encounter.
          Descriptions and ICD-10 mapping: int_sus_uec_diagnosis.
      - name: secondary_diagnoses
        description: Array of objects {seq, code, desc, qualifier_code, qualifier} per secondary diagnosis in source sequence order; qualifier is confirmed present or suspected.
      - name: n_secondary_diagnoses
        description: Number of secondary diagnosis codes; 0 when none.
      - name: investigation_codes
        description: >
          All investigation SNOMED codes in sequence order. Descriptions:
          int_sus_uec_procedure where observation_type = 'investigation'.
      - name: investigations
        description: Array of objects {seq, code, desc, at} per investigation in source sequence order; at is the recorded timestamp where present (about 80% of records).
      - name: n_investigations
        description: Number of investigation codes; 0 when none.
      - name: treatment_codes
        description: >
          All treatment SNOMED codes in sequence order. Descriptions:
          int_sus_uec_procedure where observation_type = 'treatment'.
      - name: treatments
        description: Array of objects {seq, code, desc, at} per treatment in source sequence order; at is the recorded timestamp where present (about 94% of records).
      - name: n_treatments
        description: Number of treatment codes; 0 when none.
      - name: comorbidity_codes
        description: >
          All comorbidity SNOMED codes in sequence order. Descriptions:
          int_sus_uec_procedure where observation_type = 'comorbs'.
      - name: comorbidities
        description: Array of objects {seq, code, desc} for each comorbidity code in source sequence order.
      - name: n_comorbidities
        description: Number of comorbidity codes; 0 when none.
      - name: finding_codes
        description: >-
          All SNOMED CT codes from the separate ECDS Coded Clinical Findings
          list, in source sequence order. These are not diagnosis records.
      - name: findings
        description: Array of objects {seq, code, desc} for each ECDS Coded Clinical Finding in source sequence order.
      - name: n_findings
        description: Number of Coded Clinical Finding records; 0 when none.
