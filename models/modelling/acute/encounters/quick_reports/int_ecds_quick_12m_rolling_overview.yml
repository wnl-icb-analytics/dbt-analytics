models:
  - name: int_ecds_quick_12m_rolling_overview
    description: >
      Submission dates for contract activity, taking into account bank holidays and adjusting for weekends.
    columns:
      - name: financial_year_label
        description: Financial year label for the attendance period, such as 2024/25.
      - name: attendance_month_label
        description: Human-readable month label for the attendance period, such as January-2025.
      - name: attendance_month_sort
        description: Numeric month key used to sort the attendance period in YYYYMM format.
      - name: comm_group
        description: Commissioner grouping for the attendance records included in the aggregation.
      - name: is_wnl_registered
        description: Flag showing whether the patient was registered to a WNL health borough.
      - name: practice_code
        description: Registered GP practice code for the patient at the event date.
      - name: practice_name
        description: Registered GP practice name for the patient at the event date.
      - name: practice_neighbourhood
        description: Neighbourhood name linked to the registered GP practice at the event date.
      - name: is_wnl_resident
        description: Flag describing borough of residence for the event.
      - name: age_band_nhs
        description: NHS age band assigned to the patient for the attendance.
      - name: provider_shorthand
        description: Short provider name for the acute provider delivering the attendance.
      - name: site_name
        description: Site name for the attendance.
      - name: dept_type_desc
        description: Department type description for the attendance.
      - name: arrival_mode_desc
        description: Description of the patient's arrival mode for the attendance.
      - name: admission_status
        description: Discharge destination group mapped to an admission status category.
      - name: is_duration_missing
        description: Flag showing whether the attendance duration is missing.
      - name: total_attendance_count
        description: Total number of attendances in the aggregated row.
      - name: attendances_4hr_breach
        description: Count of attendances breaching the four-hour standard in the aggregated row.
      - name: attendances_12hr_breach
        description: Count of attendances breaching the 12-hour threshold in the aggregated row.
      - name: attendances_72hr_breach
        description: Count of attendances breaching the 72-hour threshold in the aggregated row.
      - name: attendances_missing_duration
        description: Count of attendances with a missing duration in the aggregated row.
    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1