
models:
  - name: int_sus_op_diagnosis
    description: >
      One row per outpatient appointment and non-null ICD-10 diagnosis code.
      Repeated occurrences of the same code are represented by
      observation_count. Includes activity without a linked patient key; use
      visit_occurrence_id to join to the appointment.
    config:
      meta:
        owner:
          name: Emily Baldwin
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - visit_occurrence_id
              - source_concept_code
    
    columns:
      - name: diagnosis_id
        data_type: number
        description: "Unique ID for each outpatient diagnosis record"

      - name: sk_patient_id
        data_type: varchar
        description: >
          Common commissioning patient identifier. Null when the appointment
          cannot be linked to a person; the diagnosis remains valid activity.

      - name: visit_occurrence_id
        data_type: number
        description: "Primary key for appointment within SUS"

      - name: visit_occurrence_type
        data_type: varchar
        description: ""

      - name: organisation_id
        data_type: varchar
        description: ""

      - name: organisation_name
        data_type: varchar
        description: ""

      - name: site_id
        data_type: varchar
        description: ""

      - name: site_name
        data_type: varchar
        description: ""

      - name: activity_date
        data_type: timestamp_ntz
        description: ""

      - name: source_concept_code
        data_type: varchar
        description: ""

      - name: concept_code
        data_type: varchar
        description: ""

      - name: concept_name
        data_type: varchar
        description: ""

      - name: concept_vocabulary
        data_type: varchar
        description: ""
