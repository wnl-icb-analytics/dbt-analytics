version: 2
models:
- name: int_csds_person_clinical_record
  description: CSDS clinical records, one row per source clinical item. Retains missing linkage and unsupported
    dates. Prepared source facts retain domain-specific interpretation and all additional relationships. Incremental
    loads process newly received deliveries and replay the boundary delivery. Withdrawn source keys are removed
    on each run. Monthly full refreshes reconcile earlier corrections and reference changes.
  config:
    meta:
      owner:
        name: Eddie Davison
  data_tests:
  - navigation_snomed_mapping
  columns:
  - name: clinical_record_id
    description: '{{ doc(''navigation_clinical_record_id'') }}'
    data_tests:
    - unique
