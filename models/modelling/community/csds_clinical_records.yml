version: 2
models:
- name: int_csds_coded_immunisation
  description: One retained coded immunisation per identified person, provider, scheme, procedure and
    administration date. Latest accepted reporting evidence is selected; incomplete keys, including missing
    national person identifiers, retain each source occurrence. Provider-local identifiers can change
    across reports and do not define a new immunisation.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: source_record_id
    description: Guarded clinical revision key. Missing person, scheme, code or usable date retains the
      source occurrence.
    data_tests:
    - not_null
    - unique
  - name: accepted_source_record_count
    description: Number of accepted source occurrences represented by the retained immunisation.
  - name: first_reported_period_end_date
    description: Earliest accepted period containing this immunisation key.
  - name: last_reported_period_end_date
    description: Latest accepted period containing this immunisation key.
- name: int_csds_clinical_record
  description: One retained immunisation, diagnosis, child health screening result, accepted assessment occurrence,
    activity-linked breastfeeding status or growth measurement, or populated care-activity component before
    clinical labelling. Screening sections with several coded fields give one row per populated field. Referral and activity assessments retain repeated scores, including different
    dates. Activity items inherit time through the explicit same-submission activity/contact relationship
    unless populated person identities conflict. Missing person identities remain unknown and do not suppress
    the linked date. No person identity is inferred.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: originating_source_record_id
    description: Retained record key, accepted assessment or activity-linked occurrence, or activity occurrence key.
  - name: clinical_record_type
    description: Clinical item type; see fct_csds_clinical_record.
  - name: source_clinical_date
    description: Submitted administration, diagnosis, screening, examination or assessment completion date;
      no time-of-day precision is inferred.
  - name: source_derived_date
    description: Warehouse-added observation date for activity-linked items, kept separately from inherited
      contact time.
  - name: code_set_name
    description: CSDS code-lookup category for NHS Data Dictionary code-list values; null for terminology codes.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - source_table
        - originating_source_record_id
        - clinical_record_type
