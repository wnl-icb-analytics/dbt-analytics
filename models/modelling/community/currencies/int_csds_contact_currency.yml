version: 2

models:
  - name: int_csds_contact_currency
    description: >
      CSDS care contacts classified to NHSE 2025/26 community contact currencies. One row
      per service request and care contact, for all latest submitted CYP201 contacts. The
      key is unique_service_request_identifier with unique_care_contact_identifier,
      because providers reuse contact identifiers across referrals. Age category is CYP
      for ages 0-17 at referral received date and Adult otherwise, including missing or
      negative ages. Team type is the latest submitted CYP102 service type. currency_code
      comes from the nhse_community_currency_team_types_2526 seed, or from
      nhse_community_currency_referral_reasons_2526 for reason-split teams, falling back
      to the team currency. Unmapped teams get CCO99Z for CYP or CAO99Z for Adult.
      currency_source records which rule applied. is_costed_attendance is true for
      attendance status 05 or 06, attended, and for a missing status. Practice is the
      registration active on the contact date, else the latest known registration;
      practice_attribution records which applied.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - unique_service_request_identifier
              - unique_care_contact_identifier
    columns:
      - name: unique_service_request_identifier
        description: Unique service request identifier.
        data_tests:
          - not_null
      - name: unique_care_contact_identifier
        description: Unique care contact identifier.
        data_tests:
          - not_null
      - name: person_id
        description: CSDS person identifier.
      - name: sk_patient_id
        description: Pseudonymised patient identifier.
      - name: org_id_prov
        description: Provider organisation code.
      - name: care_contact_date
        description: Care contact date.
      - name: ic_age_at_service_referral_received_date
        description: CSDS-derived age in years at referral received.
      - name: age_category
        description: Adult or CYP currency age category.
      - name: attendance_status
        description: Care contact attendance status.
      - name: is_costed_attendance
        description: Whether the attendance is priced.
      - name: team_type_code
        description: Service or team type referred to code.
      - name: team_type_name
        description: Mapped service or team type name.
      - name: primary_referral_reason
        description: Primary referral reason code.
      - name: currency_code
        description: Community contact currency code.
      - name: currency_source
        description: Currency classification source.
        data_tests:
          - accepted_values:
              arguments:
                values: ['reason_split', 'team_type', 'team_fallback', 'unmapped_team']
