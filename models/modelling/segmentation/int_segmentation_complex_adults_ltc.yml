models:
  - name: int_segmentation_complex_adults_ltc
    description: >
      LTC flags for the complex adults cohort. One row per person on at
      least one of the 16 included registers - AF, asthma, CHD, CKD, COPD,
      dementia, depression, diabetes, epilepsy, heart failure, hypertension,
      SMI, stroke/TIA, Parkinson's, anxiety, and learning disability counted
      only at age >= 65. No NAFLD, unlike the wider segmentation list in
      int_segmentation_ltc_count.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique identifier for the person
        data_tests:
          - unique
          - not_null
      - name: ltc_count
        description: Count of included registers the person is on (learning
          disability counted only at 65+)
        data_tests:
          - not_null
      - name: has_learning_disability
        description: On the learning disability register AND aged 65+
