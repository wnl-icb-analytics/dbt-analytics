models:
  - name: int_segmentation_children_dx
    description: >
      Coded complexity diagnosis evidence for the children with complexity
      criterion. One row per person with at least one observation matching
      the NWL CLDCHN code list (children_complexity_diagnosis_codes seed),
      ever recorded.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique identifier for the person
        data_tests:
          - unique
          - not_null
      - name: complexity_diagnosis_codes
        description: Distinct matching diagnosis codes ever recorded
        data_tests:
          - not_null
      - name: latest_complexity_diagnosis_date
        description: Date of the most recent matching record
