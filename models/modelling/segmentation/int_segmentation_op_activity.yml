models:
  - name: int_segmentation_op_activity
    description: >
      Outpatient activity blocks for segmentation, 12 months ending on the
      segmentation reporting date (last completed month-end unless the
      segmentation_reporting_date var is set). One row per sk_patient_id with
      any attended appointment in the window.

      outpatient_treatment_functions_12mo counts distinct treatment functions
      for the complex adults outpatient breadth criterion.
      paediatric_op_appointments_12mo counts attended appointments under a
      paediatric treatment function (paediatric_treatment_function_codes
      seed). outpatient_specialties_12mo counts distinct main specialties,
      excluding trauma & orthopaedics (110), ENT (120), ophthalmology (130)
      and A&E (180), aligned to the previously clinically agreed NWL cohort.
      outpatient_specialties_excluding_maternity_12mo additionally excludes
      records coded to obstetrics (501) or midwifery (560) in either main
      specialty or treatment function for use by the child complexity
      criterion.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: sk_patient_id
        description: Pseudonymised patient key
        data_tests:
          - unique
          - not_null
      - name: outpatient_treatment_functions_12mo
        description: Distinct treatment functions with an attended appointment
          in the window, no exclusions
        data_tests:
          - not_null
      - name: paediatric_op_appointments_12mo
        description: Attended paediatric outpatient appointments in the window
        data_tests:
          - not_null
      - name: outpatient_specialties_12mo
        description: Distinct main specialties with an attended appointment in
          the window, after exclusions
        data_tests:
          - not_null
      - name: outpatient_specialties_excluding_maternity_12mo
        description: Distinct main specialties after also excluding records
          coded to obstetrics (501) or midwifery (560) in either main specialty
          or treatment function
        data_tests:
          - not_null
