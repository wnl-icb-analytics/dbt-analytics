      - name: org__faster_diagnosis_pathway_end_site_code
        description: Site code for the faster diagnosis pathway end organisation.
      - name: org__patient_pathway_identifier_issuer_trust_code
        description: Trust code for the issuer of the patient pathway identifier, using a mapped trust where available.
      - name: org__accountable_investigating_trust_code_preset
