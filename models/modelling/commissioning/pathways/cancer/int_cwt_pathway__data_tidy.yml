models:
  - name: int_cwt_pathway__data_tidy
    description: >
      Cancer pathway-level intermediate table for CWT pathway records. 
      Due to the size and complexity of the base data table, this intermediate table seeks to accomplish a number of transformations that allows further development of the pipeline.
      These include:
        - Grouping columns into ordered categories with a hierarchical naming convention
        - Convert datetime columns to dates
        - Mapping all site level codes to include the parent organisation as standalone columns
        - Maps NMUH to RFL pre-merger for retroactive analysis
        - Converted field code fields to varchar for consistency in how they appear in documentation ('01' instead of 1)
        - Deciated logic is used for the pathway identifier field as this contains a mix of site and trust codes in the raw data
        - Uses the active system ID table to remove inactive rows
    config:
      meta:
        owner:
          name: Jake Kealey
    columns:
      - name: record_id
        description: Source record identifier from the raw CWT pathway table.
        data_tests:
          - unique
          - not_null
      - name: sk_patient_id
        description: Pseudo NHS number converted to a numeric surrogate patient key.
      - name: date__consultant_upgrade_date
        description: Date of consultant upgrade.
      - name: date__decision_to_refer_date
        description: Decision to refer date.
      - name: date__cancer_referral_to_treatment_period_start_date
        description: Start date of the cancer referral to treatment period.
      - name: date__date_first_seen
        description: Date first seen at a trust.
      - name: date__fds_pathway_end_date
        description: Faster diagnosis pathway clock end date.
      - name: date__transfer_to_treatment_date
        description: Date of the patient transferred to treatment.
      - name: date__cancer_treatment_period_date
        description: Cancer treatment period start date.
      - name: date__treatment_start_date
        description: Date treatment started.
      - name: org__consultant_upgrade_trust_code
        description: Trust code for the consultant upgrade site.
      - name: org__consultant_upgrade_site_code
        description: Site code for the consultant upgrade organisation.
      - name: org__first_seen_trust_code
        description: Trust code for the first seen organisation.
      - name: org__first_seen_site_code
        description: Site code for the first seen organisation.
      - name: org__faster_diagnosis_pathway_end_trust_code
