      - name: org__accountable_treating_site_code
        description: Site code for the accountable treating organisation.
      - name: referral__cancer_referral_type_code
        description: Cancer referral type code.
      - name: referral__source_of_referral_for_outpatient_code
        description: Source of referral for outpatient code.
      - name: referral__priority_type_code
