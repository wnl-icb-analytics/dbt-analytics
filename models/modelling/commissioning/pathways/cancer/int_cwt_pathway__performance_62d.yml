models:
  - name: int_cwt_pathway__performance_62d
    description: >
      62 Day performance records for CWT cancer pathways. Note that unlike other
      performance tables a record_id can appear multiple times. This is due to
      situations where performance blame is split between two organisations.
      
    config:
      meta:
        owner:
          name: Jake Kealey
    columns:
      - name: record_id
        description: CWT Record ID
        data_tests:
          - not_null

      - name: performance__date_full
        description: Date for the clock end.

      - name: performance__trust_code
        description: The trust allocated the patient for treatment.

      - name: performance__site_code
        description: Not populated (always null); site is not assigned for 62 Day performance records.

      - name: performance__metric
        description: Performance metric name.

      - name: performance__pathway_length_days
        description: Number of days between the clock start and end date.

      - name: performance__numerator
        description: Indicative of a breach (non-zero) and proportion of blame.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                strictly: false

      - name: performance__denominator
        description: Denominator for the performance metric, represents the patient allocation/blame.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                strictly: false

      - name: performance__breach
        description: For performance metrics, the amount of blame for a breach.

    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - record_id
              - performance__trust_code