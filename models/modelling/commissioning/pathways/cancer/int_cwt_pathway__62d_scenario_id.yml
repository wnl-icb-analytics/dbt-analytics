models:
  - name: int_cwt_pathway__62d_scenario_id
    description: >
      Scenario classification for 62-day cases (6-scenario allocation) and
      associated accountability factors for investigation and treatment.
    config:
      meta:
        owner:
          name: Jake Kealey
    columns:
      - name: record_id
        description: CWT Record ID
        data_tests:
          - unique
          - not_null

      - name: performance__date_full
        description: Date for the clock end (treatment start date).

      - name: d62__investigating_trust_code
        description: Trust code assigned as accountable for investigation.

      - name: d62__treating_trust_code
        description: Trust code assigned as accountable for treatment.

      - name: d62__treating_site_code
        description: Site code for the accountable treating organisation.

      - name: performance__pathway_length_days
        description: Number of days between the clock start and end date for the 62-day measure.

      - name: performance__numerator_base
        description: Base numerator for the 62-day measure. 1 when the pathway length is 62 days or fewer (within standard), otherwise 0 (breach).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                strictly: false

      - name: performance__denominator_base
        description: Base denominator for the 62-day measure.

      - name: scenario_id
        description: 6 Scenario identifier for allocation logic.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6]

      - name: performance_investigating_accountability_factor
        description: Accountability factor applied to investigation for the scenario (range 0-1).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                strictly: false

      - name: performance_treating_accountability_factor
        description: Accountability factor applied to treatment for the scenario (range 0-1).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                strictly: false

    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
