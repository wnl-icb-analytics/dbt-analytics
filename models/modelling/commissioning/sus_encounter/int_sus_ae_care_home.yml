version: 2

models:
  - name: int_sus_ae_care_home
    description: >-
      Care-home organisation active on the SUS urgent care appointment date.
      Grain: one row per sk_encounter_id with a matching care-home period.
    config:
      meta:
        owner:
          name: Commissioning Analytics
    columns:
      - name: sk_encounter_id
        description: SUS urgent care encounter identifier.
        data_tests:
          - not_null
          - unique
      - name: care_home_code
        description: Organisation code for the care home active on the appointment date.
