version: 2
models:
- name: int_iapt_referral_transfer
  description: NHS Talking Therapies (IAPT data set) referrals resubmitted under another provider code, one row
    per successor referral with the referral it continues. Referral identifiers are provider-qualified, so a
    provider code change, such as a trust merger, resubmits open referrals under new identifiers without their
    earlier contacts. A pair is the same Person_ID and referral received date under different provider codes, where
    the predecessor has no recorded discharge and the successor is first reported in the month after the
    predecessor was last reported. A referral with more than one candidate on either side is left unlinked. The
    rule uses no provider list, so a few pairs outside known code changes are included; they are under 1% of
    pairs.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: successor_referral_id
    description: Referral in fct_iapt_referral that continues the predecessor under the new provider code.
    data_tests:
    - unique
    - not_null
  - name: predecessor_referral_id
    description: Referral in fct_iapt_referral that stopped being reported the month before. A predecessor has one
      successor.
    data_tests:
    - unique
    - not_null
  - name: original_referral_id
    description: First referral of the chain. Equals predecessor_referral_id unless the referral transferred more
      than once.
    data_tests:
    - not_null
  - name: transfer_number
    description: Position of this transfer in the chain, starting at 1.
  - name: successor_provider_organisation_code
    description: Provider ODS code of the successor.
  - name: predecessor_provider_organisation_code
    description: Provider ODS code of the predecessor.
  - name: successor_first_reported_period_end_date
    description: First accepted reporting month containing the successor.
  - name: predecessor_last_reported_period_end_date
    description: Last accepted reporting month containing the predecessor.
