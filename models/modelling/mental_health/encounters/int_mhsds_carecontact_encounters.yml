
models:
  - name: int_mhsds_carecontact_encounters
    description: >-
      MHSDS patient contacts prepared for the cross-system monthly activity table. Each row is one
      referral/contact pair after shared latest-version selection. It provides the mental-health
      contact contribution to activity reporting across datasets.
    config:
      meta:
        owner:
          name: Jessica Roberts
    columns:
      - name: encounter_id
        description: Stable key generated from the service request and care contact identifiers.
        data_tests: [not_null, unique]
      - name: sk_patient_id
        description: pseudo NHS number
      - name: org_id_prov
        description: Provider organisation ID
      - name: attend_status
        description: Attendance or Did Not Attend code for the care contact
      - name: attendance_status
        description: Description of the attendance status for the care contact
      - name: provider_name
        description: Name of the provider organisation
      - name: provider_short_name
      - name: start_date
        description: Date of the care contact
      - name: proxy_cost
        description: Proxy cost of the care contact based on national cost 
          collection average cost per Mental Health Care Contact (£302), 
          adjusted by +15.7% for NCL
      - name: source
        description: Source system of the data (MHSDS)
