version: 2

models:
  - name: int_mhsds_currency_referral_service_type
    description: >-
      The service type selected for each referral's costing classification. Each row is one MHS101
      referral. Where several service types were submitted, the newest reporting period and then
      latest received submission are used. The type comes first from the MHS102 source-derived
      value, then matching MHS902 team details in that submission, then the version 6 MHS101 service
      type. This selected costing category can differ from the full set of recorded referral teams.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: uniq_serv_req_id
        description: Unique service request identifier.
        data_tests:
          - not_null
          - unique
      - name: person_id
        description: MHSDS person identifier.
      - name: serv_team_type_ref_to_mh
        description: Service team type referred to code.
      - name: serv_team_int_age_group
        description: Service team intended age group.
      - name: service_type_name
        description: Service type name.
      - name: org_id_prov
        description: Provider organisation code.
      - name: uniq_submission_id
        description: MHSDS submission identifier.
