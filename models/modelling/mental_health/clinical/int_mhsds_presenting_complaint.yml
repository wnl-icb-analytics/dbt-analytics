version: 2
models:
- name: int_mhsds_presenting_complaint
  description: >-
    Recorded presenting complaints with repeated versions resolved. Each row is the latest accepted
    record for a provider, referral, person, finding scheme, code and recorded date. Records with
    missing identifying details or dates remain separate. A complaint can describe a symptom and
    does not establish a formal diagnosis.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: source_record_id
    description: Unique retained evidence key.
    data_tests:
    - unique
    - not_null
