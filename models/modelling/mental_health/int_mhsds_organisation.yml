version: 2

models:
  - name: int_mhsds_organisation
    description: >-
      Current organisation names and ICB roles used by MHSDS reporting models.
      One row per normalised organisation code, selected from the newest source record.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: organisation_code
        description: Organisation code.
        data_tests: [not_null, unique]
      - name: organisation_name
        description: Current organisation name.
      - name: organisation_primary_role
        description: Current primary ODS role code.
      - name: is_integrated_care_board
        description: Whether the current primary ODS role is integrated care board.
      - name: is_wnl_commissioner
        description: Whether the code belongs to current WNL or a predecessor commissioner.
