version: 2

models:
  - name: int_mhsds_latest_care_contact
    description: >-
      The newest accepted version of each patient contact. Each row is one service request and care
      contact. It supplies a common record selection for contact reporting, cross-system encounters
      and costing classifications.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [uniq_serv_req_id, uniq_care_cont_id]
    columns:
      - name: mhs201_uniq_id
        description: Identifier of the newest accepted MHS201 source row.
        data_tests: [not_null, unique]
      - name: uniq_serv_req_id
        description: MHSDS unique service request identifier.
        data_tests: [not_null]
      - name: uniq_care_cont_id
        description: MHSDS unique care contact identifier within the referral.
        data_tests: [not_null]
