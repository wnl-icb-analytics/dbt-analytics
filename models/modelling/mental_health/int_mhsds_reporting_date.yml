version: 2
models:
- name: int_mhsds_reporting_date
  description: >-
    The latest accepted reporting period in the MHSDS dataset. This table has one row and supplies
    the observation date used by current summaries. It is not the build date and does not mean every
    provider has submitted through that period.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: as_of_date
    description: Maximum reporting-period end date in accepted submissions.
    data_tests:
    - not_null
    - unique
