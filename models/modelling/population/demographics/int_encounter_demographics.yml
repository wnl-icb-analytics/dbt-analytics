
models:
  - name: int_encounter_demographics
    description: Patient demographics captured at time of healthcare event. 
      Combines OP, APC, AE, and waiting list data. One row per person per event.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: visit_occurrence_id
        description: Source event identifier.
        data_tests:
          - not_null
      - name: sk_patient_id
        description: Pseudo NHS number.
        data_tests:
          - not_null
      - name: lsoa_11_at_event
        description: Patient LSOA 2011 of residence on the SUS record. Populated across
          the full history. Null for waiting list events.
      - name: lsoa_21_at_event
        description: Patient LSOA 2021 of residence on the SUS record. Reliable for
          activity from 1 April 2024; mostly null before then. Null for waiting list
          events.
