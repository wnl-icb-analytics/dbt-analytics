
models:
  - name: int_encounter_demographics
    description: Patient demographics captured at time of healthcare event. 
      Combines OP, APC, AE, and waiting list data. One row per person per event.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: visit_occurrence_id
        description: Source event identifier.
        data_tests:
          - not_null
      - name: sk_patient_id
        description: Pseudo NHS number.
        data_tests:
          - not_null
      - name: lsoa_11_at_event
        description: Patient LSOA 2011 of residence on the SUS record. Populated across
          the full history. Null for waiting list events.
      - name: lsoa_21_at_event
        description: Patient LSOA 2021 of residence on the SUS record. Populated from
          1 April 2024 by appointment date for OP, arrival date for UEC and discharge date
          for APC (code_date is the APC admission date); mostly null before then. About 2%
          of APC and OP values from April 2024 lie in a different local authority from
          lsoa_11_at_event. Null for waiting list events.
