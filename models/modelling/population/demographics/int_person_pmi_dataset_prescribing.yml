version: 2
models:
  - name: int_person_pmi_dataset_prescribing
    description: >
      PMI feeder from EPD prescribing (WNL). One row per sk_patient_id with
      gender / dob (from age) / residence LSOA / registered practice, in the
      shared PMI feeder schema for union by name in int_person_pmi_combined.
      No ethnicity in EPD (NULL). Each attribute takes the most recent
      processing month with a valid value; when one month holds several
      values, the highest wins (gender source value, age, 2021 LSOA and
      practice code, each descending). The highest age gives the earliest
      estimated date of birth.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: sk_patient_id
        description: DMIC pseudonymised NHS number.
        data_tests:
          - not_null
          - unique
      - name: dataset_source
        description: Constant 'epd'.
