models:
  - name: int_efi2_patient_list
    description: >-
      Population for current eFI2 scoring, one row per living OLIDS person
      aged at least 65 on the build date. No GP-registration restriction is
      applied. Age eligibility uses the first day of the approximate birth
      month, so people whose 65th birthday could fall in that month are
      included. Gender is normalised to FEMALE, MALE or OTHER/UNKNOWN.
    config:
      meta:
        owner:
          name: em-baldwin
    columns:
      - name: person_id
        description: Person identifier.
        tests:
          - unique
          - not_null
      - name: end_date
        description: As-at date for the scoring run (current_date()).
      - name: gender
        description: Normalised gender — FEMALE / MALE / OTHER/UNKNOWN.
      - name: date_of_birth
        description: Approximate date of birth (from dim_person_birth_death).
      - name: date_of_death
        description: Approximate date of death where present; null for the living.
