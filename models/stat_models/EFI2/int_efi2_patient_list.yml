models:
  - name: int_efi2_patient_list
    description: >
      Living-patient spine and single as-at date (current_date()) for the eFI2
      scoring run. One row per person, with normalised gender, DOB and DOD.
      Includes every living OLIDS person aged at least 65; no GP registration
      filter is applied. Port of lds-pipelines stg_efi2__patient_list
      (int_person -> OLIDS person
      dimensions).
    config:
      meta:
        owner:
          name: em-baldwin
    columns:
      - name: person_id
        description: Person identifier.
        tests:
          - unique
          - not_null
      - name: end_date
        description: As-at date for the scoring run (current_date()).
      - name: gender
        description: Normalised gender — FEMALE / MALE / OTHER/UNKNOWN.
      - name: date_of_birth
        description: Approximate date of birth (from dim_person_birth_death).
      - name: date_of_death
        description: Approximate date of death where present; null for the living.
