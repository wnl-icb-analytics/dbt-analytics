models:
  - name: int_efi2_rules_history
    description: >-
      eFI2 deficit rules evaluated at each historical month-end. One row
      represents one distinct deficit result for a person and scoring month.
      BMI and haemoglobin use the latest eligible reading at that month-end.
      Same-day BMI ties use the latest save time, then the highest observation ID.
      Repeated month-expanded rule results are removed before storage; this is
      score-neutral because chronology uses the same distinct score keys.
    config:
      meta:
        owner:
          name: em-baldwin
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - end_date
              - deficit
              - other_instructions
              - has_deficit
              - sub_deficit
              - last_date
    columns:
      - name: person_id
        description: Person identifier.
        data_tests:
          - not_null
      - name: deficit
        description: Frailty deficit.
      - name: other_instructions
        description: Rule instruction evaluated.
      - name: has_deficit
        description: Person meets the deficit rule at the month-end.
      - name: sub_deficit
        description: Deficit sub-classification.
      - name: end_date
        description: Completed month-end used as the scoring date.
        data_tests:
          - not_null
      - name: last_date
        description: Most recent qualifying observation date.

unit_tests:
- name: efi2_history_rejects_out_of_range_haemoglobin
  model: int_efi2_rules_history
  overrides:
    macros:
      get_empty_subquery_sql: SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS sub_deficit, NULL::BOOLEAN AS has_deficit, NULL::DATE AS end_date WHERE FALSE
      is_incremental: false
  given:
  - input: ref('int_efi2_cohort_snomed_codes_history')
    format: sql
    rows: |-
      SELECT 'SYN_HB'::VARCHAR AS observation_id, NULL::TIMESTAMP_NTZ AS date_recorded, -18114::NUMBER AS person_id, 'MALE'::VARCHAR AS gender,
          '2024-03-31'::DATE AS end_date, 'Anaemia & haematinic deficiency'::VARCHAR AS deficit,
          'SYN_RULE'::VARCHAR AS other_instructions, 1::FLOAT AS result_value,
          '2024-01-01'::TIMESTAMP_NTZ AS clinical_effective_date,
          'SYN_EVIDENCE'::VARCHAR AS evidence_id, 70::NUMBER AS age_at_event
  - input: ref('int_haemoglobin_all')
    format: sql
    rows: |-
      SELECT column1::VARCHAR AS id, -18114::NUMBER AS person_id,
          column2::TIMESTAMP_NTZ AS clinical_effective_date,
          column5::TIMESTAMP_NTZ AS date_recorded, column3::FLOAT AS inferred_value,
          column4::BOOLEAN AS is_out_of_range, FALSE::BOOLEAN AS is_negative,
          FALSE::BOOLEAN AS is_extreme_outlier, 'g/L'::VARCHAR AS inferred_unit,
          'SYN_CATEGORY'::VARCHAR AS haemoglobin_category
      FROM VALUES ('SYN_VALID', '2024-01-01 09:00', 135, FALSE, '2024-01-04'),
          ('SYN_EARLIER_SAVE', '2024-01-01 15:00', 80, FALSE, '2024-01-02'),
          ('SYN_BAD', '2024-02-01', 1.5, TRUE, '2024-02-02')
  expect:
    rows:
    - person_id: -18114
      sub_deficit: ANAEMIA
      has_deficit: false
      end_date: "2024-03-31"
