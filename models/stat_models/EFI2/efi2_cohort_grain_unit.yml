unit_tests:
- name: efi2_cohort_preserves_evidence_grain
  model: int_efi2_cohort_snomed_codes
  overrides:
    macros:
      is_incremental: false
      get_empty_subquery_sql: SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS observation_id, NULL::DATE AS end_date
        WHERE FALSE
  given:
  - input: ref('int_efi2_patient_list')
    format: sql
    rows: |-
      SELECT column1::NUMBER AS person_id,
              '1940-01-01'::DATE AS date_of_birth, NULL::DATE AS date_of_death,
              'MALE'::VARCHAR AS gender, column2::DATE AS end_date
              FROM VALUES (-144551, '2024-03-31'), (-144551, '2024-04-30'), (-144552, '2024-03-31')
  - input: ref('stg_common_efi2_codelists')
    format: sql
    rows: |-
      SELECT 'BMI'::VARCHAR AS deficit, NULL::VARCHAR AS other_instructions,
              'SYN_BMI'::VARCHAR AS snomedct_conceptid, 'Synthetic BMI'::VARCHAR AS code_description,
              NULL::NUMBER AS time_constraint_years, NULL::NUMBER AS age_limit
  - input: ref('stg_olids_observation')
    format: sql
    rows: |-
      SELECT column1::VARCHAR AS id, column2::NUMBER AS person_id,
              22::FLOAT AS result_value, 'kg/m2'::VARCHAR AS result_unit_display,
              '2024-03-01'::TIMESTAMP_NTZ AS clinical_effective_date,
              column3::TIMESTAMP_NTZ AS date_recorded, 'SYN_BMI'::VARCHAR AS mapped_concept_code
              FROM VALUES ('SYN_Z', -144551, '2024-03-02'), ('SYN_A', -144551, '2024-03-03'),
                  ('SYN_A', -144552, '2024-03-02'), ('SYN_Z', -144552, '2024-03-02')
  expect:
    rows:
    - person_id: -144551
      observation_id: SYN_A
      end_date: '2024-03-31'
    - person_id: -144551
      observation_id: SYN_A
      end_date: '2024-04-30'
    - person_id: -144552
      observation_id: SYN_Z
      end_date: '2024-03-31'
- name: efi2_cohort_history_preserves_evidence_grain
  model: int_efi2_cohort_snomed_codes_history
  overrides:
    macros:
      is_incremental: false
      get_empty_subquery_sql: SELECT NULL::NUMBER AS person_id, NULL::VARCHAR AS observation_id, NULL::TIMESTAMP_NTZ AS date_recorded, NULL::DATE AS end_date
        WHERE FALSE
  given:
  - input: ref('int_efi2_patient_list_history')
    format: sql
    rows: |-
      SELECT column1::NUMBER AS person_id,
              '1940-01-01'::DATE AS date_of_birth, NULL::DATE AS date_of_death,
              'MALE'::VARCHAR AS gender, column2::DATE AS end_date
              FROM VALUES (-144551, '2024-03-31'), (-144551, '2024-04-30'), (-144552, '2024-03-31')
  - input: ref('stg_common_efi2_codelists')
    format: sql
    rows: |-
      SELECT 'BMI'::VARCHAR AS deficit, NULL::VARCHAR AS other_instructions,
              'SYN_BMI'::VARCHAR AS snomedct_conceptid, 'Synthetic BMI'::VARCHAR AS code_description,
              NULL::NUMBER AS time_constraint_years, NULL::NUMBER AS age_limit
      UNION ALL
      SELECT 'Activity limitation', NULL, 'SYN_ACTIVITY', 'Synthetic activity', NULL, NULL
  - input: ref('stg_olids_observation')
    format: sql
    rows: |-
      SELECT column1::VARCHAR AS id, column2::NUMBER AS person_id,
              22::FLOAT AS result_value, 'kg/m2'::VARCHAR AS result_unit_display,
              '2024-03-01'::TIMESTAMP_NTZ AS clinical_effective_date,
              column3::TIMESTAMP_NTZ AS date_recorded, 'SYN_BMI'::VARCHAR AS mapped_concept_code
              FROM VALUES ('SYN_Z', -144551, '2024-03-02'), ('SYN_A', -144551, '2024-03-03'),
                  ('SYN_A', -144552, '2024-03-02'), ('SYN_Z', -144552, '2024-03-02')
      UNION ALL
      SELECT 'SYN_ACTIVITY', -144552, NULL, NULL, '2024-03-01'::TIMESTAMP_NTZ,
              '2024-03-03'::TIMESTAMP_NTZ, 'SYN_ACTIVITY'
  - input: ref('stg_common_efi2_weights')
    format: sql
    rows: |-
      SELECT 'BMI'::VARCHAR AS deficit, 1::FLOAT AS weight
      UNION ALL
      SELECT 'Activity limitation', 1::FLOAT
  expect:
    rows:
    - person_id: -144551
      observation_id: SYN_A
      date_recorded: '2024-03-03 00:00:00'
      end_date: '2024-03-31'
    - person_id: -144551
      observation_id: SYN_A
      date_recorded: '2024-03-03 00:00:00'
      end_date: '2024-04-30'
    - person_id: -144552
      observation_id: SYN_Z
      date_recorded: '2024-03-02 00:00:00'
      end_date: '2024-03-31'
    - person_id: -144552
      observation_id: null
      date_recorded: null
      end_date: '2024-03-31'
