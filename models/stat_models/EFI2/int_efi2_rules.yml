models:
  - name: int_efi2_rules
    description: >
      eFI2 rules engine — per-person deficit flags (has_deficit / sub_deficit)
      after applying the deficit-specific threshold logic. Port of lds-pipelines
      stg_efi2__rules. The anaemia rule reuses int_haemoglobin_latest (g/L,
      thresholds 130 male / 120 female) in place of the lds phenolab haemoglobin
      measurement. Note - could be ported onto our cleaned measurements in future - not now to minimise
      divergence. One deliberate paper-alignment deviation: BMI uses the most recent
      reading rather than the earliest.
    config:
      meta:
        owner:
          name: em-baldwin
    columns:
      - name: person_id
        description: Person identifier.
        tests:
          - not_null
      - name: deficit
        description: Frailty deficit.
      - name: other_instructions
        description: Rule instruction the flag was evaluated under.
      - name: has_deficit
        description: Whether the person meets the deficit rule.
      - name: sub_deficit
        description: Sub-classification of the deficit (e.g. CLINIC_SYSTOLIC_HTN, Obese).
      - name: end_date
        description: As-at date for the scoring run.
      - name: last_date
        description: Most recent qualifying observation date for the deficit.
