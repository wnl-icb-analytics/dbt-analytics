models:
  - name: int_efi2_rules
    description: >-
      eFI2 deficit-rule results for the current scoring date, with the person,
      deficit, sub-deficit, rule instructions and latest evidence date. The
      OLIDS population comes from NCL GP records. A person can have several
      results for a deficit, including repeated dated evidence where no
      additional threshold rule applies. Covers qualifying evidence for living
      people whose 65th birthday could have occurred by the scoring date,
      using the first day of the approximate birth month. Anaemia uses the
      latest valid haemoglobin in g/L, with thresholds of 130 for males and
      120 for females. BMI uses the latest eligible reading, which differs
      from the earliest-reading choice in the legacy AIC implementation.
    config:
      meta:
        owner:
          name: em-baldwin
    columns:
      - name: person_id
        description: Person identifier.
        tests:
          - not_null
      - name: deficit
        description: Frailty deficit.
      - name: other_instructions
        description: Rule instruction the flag was evaluated under.
      - name: has_deficit
        description: Whether the person meets the deficit rule.
      - name: sub_deficit
        description: Sub-classification of the deficit (e.g. CLINIC_SYSTOLIC_HTN, Obese).
      - name: end_date
        description: As-at date for the scoring run.
      - name: last_date
        description: Most recent qualifying observation date for the deficit.
