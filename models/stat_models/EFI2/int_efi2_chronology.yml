models:
  - name: int_efi2_chronology
    description: >-
      Weighted eFI2 score for the current scoring date, one row per living
      person with an applicable weighted deficit. The OLIDS population comes
      from NCL GP records. People qualify when their 65th birthday could have
      occurred by the scoring date, using the first day of the approximate
      birth month. Dementia-related evidence contributes its maximum weight.
      Smoking uses the latest qualifying status. Alcohol distinguishes current
      harmful drinking from earlier higher-risk or harmful records within its
      lookback window, with the earlier-history state taking priority. Missing
      BMI and alcohol evidence carry the defined default weights across the
      scored population. Polypharmacy counts distinct six-character BNF
      sub-subchapter prefixes among orders in the 90 days ending on the
      scoring date, without the chapter exclusions used by int_polypharmacy_*
      models.
    config:
      meta:
        owner:
          name: em-baldwin
    columns:
      - name: person_id
        description: Person identifier.
        tests:
          - unique
          - not_null
      - name: end_date
        description: As-at date for the scoring run.
      - name: efi
        description: Raw eFI2 score (sum of the weights of the deficits the person has).
