models:
  - name: int_efi2_chronology
    description: >-
      Current weighted eFI2 score, one row per living NCL OLIDS person with an applicable
      weighted deficit. Eligibility uses the first day of the approximate birth month: the
      65th birthday could have occurred by scoring. Scores sum published weights, including
      missing-BMI and missing-alcohol defaults across the scoring population. Deficit-specific
      weighting and polypharmacy rules are documented on efi.
    config:
      meta:
        owner:
          name: em-baldwin
    columns:
      - name: person_id
        description: Person identifier.
        tests:
          - unique
          - not_null
      - name: end_date
        description: As-at date for the scoring run.
      - name: efi
        description: >-
          Sum of applicable deficit weights. Dementia uses its maximum weight and smoking the
          latest qualifying status. Earlier higher-risk or harmful alcohol history within
          lookback takes priority over current harmful drinking. Missing BMI and alcohol carry
          default weights. Polypharmacy counts distinct six-character BNF prefixes in the 90
          days ending on scoring, without int_polypharmacy_* chapter exclusions.
