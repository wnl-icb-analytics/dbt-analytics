models:
  - name: int_efi2_chronology
    description: >-
      Weighted eFI2 score for the current scoring date, one row per living
      person aged at least 65 with an applicable weighted deficit.
      Dementia-related evidence contributes its maximum weight; alcohol and
      smoking use their latest qualifying evidence. Missing BMI and alcohol
      evidence carry the defined default weights across the scored population.
      Polypharmacy counts distinct six-character BNF sub-subchapter prefixes
      among orders in the 90 days ending on the scoring date, without the
      chapter exclusions used by int_polypharmacy_* models.
    config:
      meta:
        owner:
          name: em-baldwin
    columns:
      - name: person_id
        description: Person identifier.
        tests:
          - unique
          - not_null
      - name: end_date
        description: As-at date for the scoring run.
      - name: efi
        description: Raw eFI2 score (sum of the weights of the deficits the person has).
