models:
  - name: int_efi2_cohort_snomed_codes
    description: >-
      Recorded observations eligible for the eFI2 deficit rules at the current
      scoring date. The OLIDS population comes from NCL GP records. One row
      per distinct person, matched code-rule entry and retained observation
      values. Includes living people in int_efi2_patient_list with matching
      SNOMED CT evidence. People qualify when their 65th birthday could have
      occurred by the scoring date, using the first day of the approximate
      birth month. Each code's minimum event age and lookback apply, and
      clinical dates after the scoring date are excluded. Identical
      observation values can collapse into one row; a code may contribute to
      several deficits.
    config:
      meta:
        owner:
          name: em-baldwin
    columns:
      - name: person_id
        description: Person identifier.
        tests:
          - not_null
      - name: deficit
        description: Frailty deficit the code contributes to.
      - name: other_instructions
        description: Free-text rule the code is subject to (drives the rules engine).
      - name: snomed_code
        description: SNOMED concept id of the matched observation.
      - name: result_value
        description: Numeric result value of the observation, where present.
      - name: clinical_effective_date
        description: Date of the observation.
      - name: age_at_event
        description: Age in years at the observation date.
      - name: age_at_end
        description: Age in years at the end (as-at) date.
      - name: gender
        description: Normalised gender carried from the patient list.
      - name: end_date
        description: As-at date for the scoring run.
