models:
  - name: int_efi2_scores
    description: >
      eFI2 (electronic Frailty Index 2) score and frailty category per person —
      native OLIDS-built equivalent of the AI Centre INT_EFI2_SCORES, ported from
      lds-pipelines. Built in parallel to the AIC import (stg_aic_int_efi2_scores),
      which has since been retired with the rest of the raw_aic pipeline — this is
      now the only eFI2 score in the project.

      Known divergences from the AIC output to validate before any cutover. Items
      1-3 are deliberate paper-alignment choices (the paper takes priority over AIC
      fidelity):
        1. Population is restricted to age >= 65 (the paper's development and
           validation population); AIC/lds scored all living adults.
        2. BMI uses the most recent reading; lds/AIC used the earliest.
        3. Missing-lifestyle deficits (BMI, alcohol) and polypharmacy are evaluated
           across the whole scored population, not only patients with >= 1 eFI2 code.
        4. Anaemia uses int_haemoglobin_latest (g/L, thresholds 130/120 by sex) in
           place of the lds phenolab haemoglobin measurement (g/dL, 13/12) — the
           thresholds are clinically equivalent, but the underlying observation set
           and unit-standardisation differ.
        5. OLIDS-vs-LDS staging differences (observation/medication coverage) and
           refresh cadence, as with dim_person_ccms.
      Polypharmacy counts distinct BNF sub-subchapters (level 3 = first 6 chars of
      the BNF code) among meds in the 90 days before end_date, per the eFI2 paper.
      The deprecated phenolab definition store is removed and no BNF code exclusions
      are applied (unlike this repo's int_polypharmacy_* pipeline, which scopes to
      NHSBSA in-scope chapters) - the paper counts across all sub-subchapters. This
      may differ from the AIC output if its phenolab definitions were at a different
      BNF granularity - validate on cutover.
      The category cut points match lds but are expressed as contiguous ordered
      thresholds, closing the (0.1623, 0.1624) gap that lds's paired BETWEEN ranges
      left as a NULL category (the sliver resolves to MILD).
    config:
      meta:
        owner:
          name: em-baldwin
    columns:
      - name: person_id
        description: Person identifier; one row per person.
        tests:
          - unique
          - not_null
      - name: end_date
        description: As-at date for the scoring run (current_date()).
      - name: efi_score
        description: Electronic Frailty Index 2 score (0-1 scale), defaults to 0 if not available.
      - name: category
        description: >
          Frailty category based on eFI2 score (contiguous bands, no NULLs):
          `ROBUST` (< 0.0857), `MILD FRAILTY` (>= 0.0857 and < 0.1624),
          `MODERATE FRAILTY` (>= 0.1624 and <= 0.2391), `SEVERE FRAILTY` (> 0.2391).
      - name: age_at_end
        description: Patient age at the end date (null for persons with no eFI2-coded observation).
      - name: gender
        description: Normalised gender (FEMALE / MALE / OTHER-UNKNOWN).
      - name: date_of_death
        description: Approximate date of death where present.
