models:
  - name: int_efi2_scores
    description: >-
      Electronic Frailty Index 2 (eFI2) score and frailty category at the
      current build date. One row per living OLIDS person aged at least 65,
      without a GP-registration restriction. Age eligibility uses the first
      day of the approximate birth month. Scores sum the applicable published
      deficit weights, including the missing-BMI and missing-alcohol defaults
      across the whole scoring population. Polypharmacy counts distinct
      six-character BNF sub-subchapter prefixes in the preceding 90 days,
      without the chapter exclusions used by int_polypharmacy_* models.
      Categories are ROBUST below 0.0857, MILD FRAILTY from 0.0857 to below
      0.1624, MODERATE FRAILTY from 0.1624 to 0.2391 inclusive, and SEVERE
      FRAILTY above 0.2391. This OLIDS score replaces the retired AIC import.
      Comparability with legacy AIC scores requires validation: AIC included
      younger adults, used the earliest BMI and applied some defaults only to
      people with eFI2 codes. Anaemia now uses the latest valid OLIDS
      haemoglobin in g/L at equivalent sex-specific thresholds of 130/120,
      with different observation coverage and unit standardisation. Source
      coverage and refresh timing can also differ. Contiguous category
      thresholds classify the legacy gap between 0.1623 and 0.1624 as mild
      frailty.
    config:
      meta:
        owner:
          name: em-baldwin
    columns:
      - name: person_id
        description: Person identifier; one row per person.
        tests:
          - unique
          - not_null
      - name: end_date
        description: As-at date for the scoring run (current_date()).
      - name: efi_score
        description: Electronic Frailty Index 2 score (0-1 scale), defaults to 0 if not available.
      - name: category
        description: >
          Frailty category based on eFI2 score (contiguous bands, no NULLs):
          `ROBUST` (< 0.0857), `MILD FRAILTY` (>= 0.0857 and < 0.1624),
          `MODERATE FRAILTY` (>= 0.1624 and <= 0.2391), `SEVERE FRAILTY` (> 0.2391).
      - name: age_at_end
        description: Patient age at the end date (null for persons with no eFI2-coded observation).
      - name: gender
        description: Normalised gender (FEMALE / MALE / OTHER-UNKNOWN).
      - name: date_of_death
        description: Approximate date of death where present.
