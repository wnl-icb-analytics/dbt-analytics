models:
  - name: int_ccms_final_flags
    description: |
      The 20 Cambridge Comorbidity Score condition categories per person,
      derived by collapsing the 35 raw flags in int_ccms_intermediate_flags
      per Payne et al. 2020 / 2022 modified CCMS combination rules.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Person identifier.
        tests:
          - unique
          - not_null
      - name: alcoholproblems
        description: Alcohol problems (any of three alcohol observation flags).
        tests: &flag_test
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: anxietyordepression
        description: Anxiety or depression (observation OR antidepressant / anxiolytic).
        tests: *flag_test
      - name: atrialfibrillation
        description: Atrial fibrillation observation.
        tests: *flag_test
      - name: cancerinthelast5years
        description: Cancer in the last 5 years (malignant neoplasm OR melanoma).
        tests: *flag_test
      - name: chronickidneydisease
        description: Chronic kidney disease (eGFR rule).
        tests: *flag_test
      - name: chronicliverdiseaseandviralhepatitis
        description: Chronic liver disease or viral hepatitis.
        tests: *flag_test
      - name: constipation
        description: Constipation (laxatives proxy).
        tests: *flag_test
      - name: copd
        description: COPD observation.
        tests: *flag_test
      - name: dementia
        description: Dementia observation.
        tests: *flag_test
      - name: diabetes
        description: Diabetes type 1 or type 2.
        tests: *flag_test
      - name: disorderofprostate
        description: Disorder of prostate observation.
        tests: *flag_test
      - name: epilepsy
        description: Epilepsy observation AND antiepileptic medication.
        tests: *flag_test
      - name: heartfailure
        description: Congestive cardiac failure observation.
        tests: *flag_test
      - name: irritablebowelsyndrome
        description: IBS observation OR antispasmodic medication.
        tests: *flag_test
      - name: learningdisability
        description: Developmental academic disorder, intellectual disability, or trisomy 21.
        tests: *flag_test
      - name: multiplesclerosis
        description: Multiple sclerosis observation.
        tests: *flag_test
      - name: painfulcondition
        description: Non-migraine analgesics/opioids OR antiepileptic (excl. benzo) without epilepsy diagnosis.
        tests: *flag_test
      - name: parkinsonism
        description: Parkinsonism observation.
        tests: *flag_test
      - name: periphvascdiseaseleg
        description: Peripheral vascular disease of leg observation.
        tests: *flag_test
      - name: psychoactivesubstancemisuse
        description: Substance misuse observation.
        tests: *flag_test
      - name: schizophreniaorbipolardisorder
        description: Schizophrenia, bipolar, or lithium prescription.
        tests: *flag_test
