version: 2

models:
  - name: qadmissions_input_features_history
    description: >
      QAdmissions input features rebuilt as they stood at historical index
      dates, for validating the QAdmissions model registered in Snowflake's
      model registry against later emergency admissions. The historical
      counterpart of qadmissions_input_features: this model does NOT compute a
      risk score, and a score produced from it requires the ClinRisk
      disclaimer in the file header.

      Grain: one row per person per index date. Index dates are every
      month-end from January 2023 to December 2024, listed in the
      qadmissions_history_index_dates macro. The table is rebuilt each month,
      so these months can change as records are added or corrected. Only
      months with a full
      outcome horizon of complete SUS follow-up can be used for outcome
      validation.

      Population at each index date: people registered and alive at that
      month-end, recorded as Male or Female, and aged 18-100 inclusive at
      that month-end, taken from int_segmentation_person_month_spine. People
      who later died or deregistered are kept.

      Time basis: every feature uses only evidence with a clinical date on
      or before the index date and, where a recording date is held, entered
      on or before the index date, so codes entered retrospectively are not
      visible at earlier index dates. Disease register flags come from the
      monthly register histories (fct_person_*_register_by_month), built with
      the QOF register macros (macros/qof_registers), the as-at pairs of the
      live fct_person_*_register models behind dim_person_conditions.

      Two features take today's value at every index date: town (current
      LSOA, as address history is not held) and ethrisk (latest recorded
      ethnicity, as the QAdmissions paper did).

      Differences from qadmissions_input_features: lab features (c_hb,
      high_platelet, high_lft) keep extreme outliers, while the live model
      reads the int_*_latest models, which exclude them. These flags can
      therefore differ between the two models even at the same date. Prior
      admissions (hes_admitprior_cat) come from
      int_segmentation_acute_activity_history rather than
      fct_person_sus_apc_recent, whose spell source covers only two years;
      see that column for the small differences this causes.
    config:
      meta:
        owner:
          name: Thomas Shallcross
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - end_date
              - person_id
    columns:
      - name: end_date
        data_type: date
        description: "Index date (a month-end). All features describe the person as at this date."
        data_tests:
          - not_null

      - name: person_id
        data_type: varchar
        description: "OLIDS-native unique person identifier. Unique together with end_date."
        data_tests:
          - not_null

      - name: sk_patient_id
        data_type: varchar
        description: >
          Commissioning-side patient identifier. Join key expected by the
          Snowflake-registered QAdmissions model and for linking SUS
          admissions. A small number of sk_patient_id values map to more than
          one person_id in identity-reconciliation edge cases.

      - name: age
        data_type: number
        description: "Age in completed years at the index date, capped at death. Restricted to 18-100 inclusive."

      - name: sex
        data_type: varchar
        description: "Sex for QAdmissions ('male' or 'female'), from the gender recorded at the index date."

      - name: bmi
        data_type: float
        description: >
          Latest valid BMI (kg/m^2) known by the index date, from int_bmi_all,
          chosen as int_bmi_latest chooses it. Valid means 10-150 kg/m^2;
          includes BMI calculated from weight and the most recent prior
          height. Raw value, not clipped. NULL when the person has no valid
          BMI by the index date. For calculated BMI only the weight's
          recording date is checked, so a height entered after the index date
          but dated before it can still contribute.

      - name: sha1
        data_type: number
        description: "Strategic Health Authority code. Constant 5 (London) for all NCL patients, as in qadmissions_input_features."

      - name: surv
        data_type: number
        description: >
          Prediction horizon in years passed to the registered QAdmissions
          model. Set by var('qadmissions_horizon_years'), default 1, shared
          with qadmissions_input_features. The same value applies to every
          index date; set it to match the validation horizon.

      - name: b_af
        data_type: boolean
        description: "On the atrial fibrillation QOF register at the index date (fct_person_atrial_fibrillation_register_by_month)."

      - name: b_ccf
        data_type: boolean
        description: "On the heart failure QOF register at the index date (fct_person_heart_failure_register_by_month)."

      - name: b_anycancer
        data_type: boolean
        description: "On the cancer QOF register at the index date (fct_person_cancer_register_by_month)."

      - name: b_asthmacopd
        data_type: boolean
        description: >
          On the asthma OR COPD QOF register at the index date
          (fct_person_asthma_register_by_month, fct_person_copd_register_by_month). Asthma
          membership requires asthma medication in the 12 months before the
          index date.

      - name: b_epilepsy
        data_type: boolean
        description: "On the epilepsy QOF register at the index date (fct_person_epilepsy_register_by_month)."

      - name: b_renal
        data_type: boolean
        description: "On the chronic kidney disease QOF register at the index date (fct_person_ckd_register_by_month)."

      - name: b_manicschiz
        data_type: boolean
        description: "On the severe mental illness QOF register at the index date (fct_person_smi_register_by_month)."

      - name: b_cvd
        data_type: boolean
        description: >
          Cardiovascular disease composite: on the coronary heart disease,
          stroke/TIA OR peripheral arterial disease QOF register at the index
          date. Broader than the QOF CVD register, which excludes PAD.

      - name: b_type1
        data_type: boolean
        description: "On the diabetes QOF register at the index date with type classified as Type 1 (fct_person_diabetes_register_by_month). 'Unknown' type maps to FALSE."

      - name: b_type2
        data_type: boolean
        description: "On the diabetes QOF register at the index date with type classified as Type 2 (fct_person_diabetes_register_by_month). 'Unknown' type maps to FALSE."

      - name: smoke_cat
        data_type: number
        description: >
          QAdmissions smoking category from the latest current, ex- or
          never-smoker code (LSMOK_COD, EXSMOK_COD, NSMOK_COD via
          int_smoking_status_all) known by the index date: 3 = current smoker,
          1 = ex-smoker, 0 = never smoked or no record. Cigarettes per day are
          not captured, so categories 2, 4 and 5 are not produced and every
          current smoker maps to 3, as in qadmissions_input_features. Same-day
          codes are separated by observation id, where the live model's
          choice is arbitrary.

      - name: b_anticoagulant
        data_type: boolean
        description: >
          One or more anticoagulant orders (int_anticoagulant_medications_all)
          in the 180 days up to and including the index date. Orders entered
          after the index date but dated before it cannot be excluded, as the
          medication models hold no recording date.

      - name: b_antidepressant
        data_type: boolean
        description: "One or more antidepressant orders (int_antidepressant_medications_all) in the 180 days up to and including the index date."

      - name: b_antipsychotic
        data_type: boolean
        description: "One or more antipsychotic orders (int_antipsychotic_medications_all) in the 180 days up to and including the index date."

      - name: b_corticosteroids
        data_type: boolean
        description: "One or more systemic corticosteroid orders (int_systemic_corticosteroid_medications_all) in the 180 days up to and including the index date."

      - name: b_nsaid
        data_type: boolean
        description: "One or more NSAID orders (int_nsaid_medications_all) in the 180 days up to and including the index date."

      - name: hes_admitprior_cat
        data_type: number
        description: >
          Non-elective hospital admissions in the 12 months up to and
          including the index date, capped at 3 (0, 1, 2, 3 = three or more).
          From int_segmentation_acute_activity_history.nel_admissions_12mo:
          SUS admitted patient care spells with an admission method starting
          2 except 2C (baby born at home as intended), deduplicated as in
          fct_person_sus_apc_recent, which the live model reads. Unlike that
          mart, spells with no admission date are not recovered by
          imputation, which affects under 0.1% of spells. SUS holds no
          submission date, so admissions submitted after the index date are
          still counted. 0 when there are none.

      - name: c_hb
        data_type: boolean
        description: >
          Latest valid haemoglobin result (int_haemoglobin_all) known by the
          index date is below the qadmissions_lab_thresholds 'haemoglobin' low
          threshold (g/L). Valid means not negative; extreme outliers are
          kept, unlike int_haemoglobin_latest. FALSE when there is no valid
          result.

      - name: high_lft
        data_type: boolean
        description: >
          The latest valid ALT, GGT or bilirubin result known by the index date
          (int_alt_all, int_ggt_all, int_bilirubin_all, each taken separately)
          is above its qadmissions_lab_thresholds high threshold, as in
          int_lft_latest. Valid means not negative; extreme outliers are kept,
          unlike int_lft_latest. FALSE when none is above or there is no valid
          result.

      - name: high_platelet
        data_type: boolean
        description: >
          Latest valid platelet count (int_platelets_all) known by the index
          date is above the qadmissions_lab_thresholds 'platelets' high
          threshold (10*9/L). Valid means not negative; extreme outliers are
          kept, unlike int_platelets_latest. FALSE when there is no valid
          result.

      - name: b_falls
        data_type: boolean
        description: "Any coded fall (QAdmissions FALLS_COD_Q codelist, int_falls_observations_all) known by the index date."

      - name: b_malabsorption
        data_type: boolean
        description: "Any coded malabsorption diagnosis - coeliac disease, IBD or post-resection (QAdmissions MALABSORPTION_COD_Q codelist, int_malabsorption_diagnoses_all) - known by the index date."

      - name: b_vte
        data_type: boolean
        description: "Any coded venous thromboembolism diagnosis - DVT or PE (QAdmissions VENOUS_THROMBOEMBOLISM_COD_Q codelist, int_vte_diagnoses_all) - known by the index date."

      - name: b_liverpancreas
        data_type: boolean
        description: "Any coded chronic liver disease or chronic pancreatitis diagnosis (QAdmissions LIVER_DISEASE_OR_CHRONIC_PANCREATITIS_COD_Q codelist, int_liver_pancreatitis_diagnoses_all) known by the index date."

      - name: town
        data_type: float
        description: >
          Townsend Deprivation Score (higher = more deprived) for the person's
          current residential 2011 LSOA, from int_person_geography.townsend_score.
          Not as at the index date: address history is not held, so people who
          have moved since the index date get their current area's score. NULL
          when the person has no 2011 LSOA or it has no Townsend score, as in
          qadmissions_input_features.

      - name: alcohol_cat6
        data_type: number
        description: >
          QAdmissions alcohol category (0 = NonDrinker, 1 = Trivial, 2 = Light,
          3 = Moderate, 4 = Heavy, 5 = VeryHeavy): the highest category from
          any valid Full AUDIT score (int_alcohol_audit_scores) known by the
          index date, banded by the qadmissions_alcohol_cat6 macro shared with
          qadmissions_alcohol_category. AUDIT-C scores are not used. NULL
          when the person has no Full AUDIT score by the index date, as in
          qadmissions_input_features, so it can be handled at scoring.

      - name: ethrisk
        data_type: number
        description: >
          QAdmissions ethnicity risk group (1 = White / NotRecorded, 2 =
          Indian, 3 = Pakistani, 4 = Bangladeshi, 5 = Other Asian, 6 = Black
          Caribbean, 7 = Black African, 8 = Chinese, 9 = Other Ethnic Group)
          from the person's latest recorded ethnicity, via
          qadmissions_ethrisk. Not as at the index date: the QAdmissions
          paper also used the latest recorded ethnicity, including records
          made after baseline. 1 when there is no mapped ethnicity.
