        select null::date as end_date, null::number as person_id, null::boolean as b_antidepressant where false
      qadmissions_history_index_dates: "select '2024-03-31'::date reference_date"
# Ethnicity as at each index date, chosen as dim_person_ethnicity chooses it
# from the records known by then. All people and records are synthetic.
#   -18401 record dated before 2024-01-31 but entered after it: 1, then 2
#   -18402 specific record beats a newer 'Not stated' one: 2 at both dates
#   -18403 an older record entered late doesn't displace a later one: 7, 7
#   -18404 two specific records on one date: the higher id wins: 8, 8
#   -18405 no record: 1 at both dates
#   -18406 no recorded date, dated between the index dates: 1, then 7
# The BMI imputation groups by the same as-at ethnicity. -18407 (Asian, BMI
# 30), -18408 (Black, BMI 26) and -18409 (no ethnicity, BMI 22) are the only
# recorded BMIs, and the minimum group size is 1, so each person without a BMI
# gets their as-at group's donor value: -18401 22 then 30, -18406 22 then 26.
# Using today's ethnicity would give -18401 30 at 2024-01-31.
# Age is 51, not a multiple of 10: with one constant age, Snowflake fails the
# BMI imputation's FLOOR(age / 10) * 10 with "Numeric value is out of range"
# when 10 divides the age exactly (50 and 40 fail; 39 and 51 pass). Real ages
# vary, so the models are not affected.
- name: qadmissions_history_ethnicity_as_at
  model: qadmissions_input_features_validation
  given:
  - input: ref('int_segmentation_person_month_spine')
    format: sql
    rows: |-
      select d.column1::date month_end_date,p.column1::number person_id,'SYN_SK'::varchar sk_patient_id,51::number(3,0) age,'Male'::varchar gender,true::boolean is_active from values ('2024-01-31'),('2024-03-31') d cross join (select column1 from values (-18401),(-18402),(-18403),(-18404),(-18405),(-18406),(-18407),(-18408),(-18409)) p
  - input: ref('int_ethnicity_all')
    format: sql
    rows: |-
      select column1::number person_id,column2::timestamp_ntz clinical_effective_date,column3::timestamp_ntz date_recorded,column4::varchar observation_lds_id,column5::boolean deprioritise_flag,column6::number preference_rank,column7::varchar ethnicity_category,column8::varchar ethnicity_subcategory from values
        (-18401,'2023-06-01','2024-02-15','SYN_01',false,1,'Asian','Asian: Indian'),
        (-18402,'2020-01-01','2020-01-01','SYN_02',false,1,'Asian','Asian: Indian'),
        (-18402,'2023-12-01','2023-12-01','SYN_03',true,3,'Unknown','Not stated'),
        (-18403,'2023-01-01','2023-01-01','SYN_04',false,1,'Black','Black: African'),
        (-18403,'2022-01-01','2024-02-01','SYN_05',false,1,'Asian','Asian: Chinese'),
        (-18404,'2023-01-01','2023-01-01','SYN_06',false,1,'Asian','Asian: Indian'),
        (-18404,'2023-01-01','2023-01-01','SYN_07',false,1,'Asian','Asian: Chinese'),
        (-18406,'2024-02-10',null,'SYN_08',false,1,'Black','Black: African'),
        (-18407,'2020-01-01','2020-01-01','SYN_09',false,1,'Asian','Asian: Indian'),
        (-18408,'2020-01-01','2020-01-01','SYN_10',false,1,'Black','Black: African')
  - input: ref('qadmissions_eth2016_to_ethrisk9')
    format: sql
    rows: |-
      select column1::varchar ethnicity_subcategory,column2::number ethrisk from values ('Asian: Indian',2),('Asian: Chinese',8),('Black: African',7),('Not stated',1)
