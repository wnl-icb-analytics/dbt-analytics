version: 2

models:
  - name: int_qadmissions_predictions_history
    description: >
      QAdmissions 1-year emergency-admission risk scores produced by the
      Snowflake-registered QAdmissions model, with the input features each
      score was calculated from. One row per person per scoring date: each
      scoring run appends a new set of rows, so a person has one row for every
      date they were scored. The input features are the values of
      int_qadmissions_features at the time of the run; see that model for
      their derivation and eligibility rules (active, non-deceased, aged
      18-100, recorded sex of male or female).
    config:
      meta:
        owner:
          name: Thomas Shallcross
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - to_date(scored_at)

    columns:
      - name: person_id
        data_type: number
        description: "OLIDS person identifier. With the scoring date, identifies a row."
        data_tests:
          - not_null

      - name: sk_patient_id
        data_type: number
        description: "Commissioning-side patient identifier used by the registered model."

      - name: scored_at
        data_type: timestamp_ltz
        description: >
          When the scoring run produced this row. A person has at most one row
          per calendar date of scored_at; the date is taken in the session
          time zone.
        data_tests:
          - not_null

      - name: model_version
        data_type: varchar
        description: "Version of the registered QAdmissions model that produced the score."

      - name: score_percent
        data_type: float
        description: "Predicted risk of emergency admission within the surv horizon, as a percentage (0-100)."

      - name: ok
        data_type: boolean
        description: "Scorer status flag for the row; see errors when FALSE."

      - name: errors
        data_type: varchar
        description: "Error messages returned by the scorer for this row, if any."

      - name: engine
        data_type: varchar
        description: "Scoring engine reported by the registered model."

      - name: surv
        data_type: number
        description: "Prediction horizon in years."

      - name: age
        data_type: number
        description: "Age in years at scoring. Input feature; see int_qadmissions_features."

      - name: sex
        data_type: varchar
        description: "Sex (male / female). Input feature; see int_qadmissions_features."

      - name: bmi
        data_type: float
        description: "Latest recorded BMI (kg/m^2); NULL when none recorded. Input feature."

      - name: town
        data_type: float
        description: "Townsend deprivation score for the residential LSOA (higher = more deprived); NULL when unmatched. Input feature."

      - name: sha1
        data_type: number
        description: "Strategic Health Authority code (5 = London). Input feature."

      - name: ethrisk
        data_type: number
        description: "QAdmissions ethnicity risk group (1-9). Input feature; see int_qadmissions_features for the code meanings."

      - name: smoke_cat
        data_type: number
        description: "Smoking category (0 = never, 1 = ex-smoker, 3 = current). Input feature."

      - name: alcohol_cat6
        data_type: number
        description: "QAdmissions alcohol category (0-5, NonDrinker to VeryHeavy); NULL when no Full AUDIT recorded. Input feature."

      - name: hes_admitprior_cat
        data_type: number
        description: "Emergency inpatient spells in the prior 12 months, capped at 3. Input feature."

      - name: b_af
        data_type: boolean
        description: "Atrial fibrillation. Input feature."

      - name: b_ccf
        data_type: boolean
        description: "Congestive cardiac failure. Input feature."

      - name: b_anycancer
        data_type: boolean
        description: "Any cancer diagnosis. Input feature."

      - name: b_asthmacopd
        data_type: boolean
        description: "Asthma or COPD. Input feature."

      - name: b_cvd
        data_type: boolean
        description: "Cardiovascular disease (CHD, stroke/TIA or PAD). Input feature."

      - name: b_epilepsy
        data_type: boolean
        description: "Epilepsy. Input feature."

      - name: b_falls
        data_type: boolean
        description: "History of falls. Input feature."

      - name: b_liverpancreas
        data_type: boolean
        description: "Chronic liver disease or chronic pancreatitis. Input feature."

      - name: b_malabsorption
        data_type: boolean
        description: "Malabsorption (coeliac disease, IBD or post-resection). Input feature."

      - name: b_manicschiz
        data_type: boolean
        description: "Severe mental illness (mania / schizophrenia). Input feature."

      - name: b_renal
        data_type: boolean
        description: "Chronic kidney disease. Input feature."

      - name: b_type1
        data_type: boolean
        description: "Type 1 diabetes. Input feature."

      - name: b_type2
        data_type: boolean
        description: "Type 2 diabetes. Input feature."

      - name: b_vte
        data_type: boolean
        description: "Venous thromboembolism (DVT or PE). Input feature."

      - name: b_anticoagulant
        data_type: boolean
        description: "Anticoagulant prescribed in the prior 6 months. Input feature."

      - name: b_antidepressant
        data_type: boolean
        description: "Antidepressant prescribed in the prior 6 months. Input feature."

      - name: b_antipsychotic
        data_type: boolean
        description: "Antipsychotic prescribed in the prior 6 months. Input feature."

      - name: b_corticosteroids
        data_type: boolean
        description: "Systemic corticosteroid prescribed in the prior 6 months. Input feature."

      - name: b_nsaid
        data_type: boolean
        description: "NSAID prescribed in the prior 6 months. Input feature."

      - name: c_hb
        data_type: boolean
        description: "Latest haemoglobin below the qadmissions_lab_thresholds threshold. Input feature."

      - name: high_lft
        data_type: boolean
        description: "ALT, GGT or bilirubin above its qadmissions_lab_thresholds threshold. Input feature."

      - name: high_platelet
        data_type: boolean
        description: "Latest platelet count above the qadmissions_lab_thresholds threshold. Input feature."
