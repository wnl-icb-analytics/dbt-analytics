version: 2

models:
  - name: qadmissions_alcohol_category
    description: >-
      QAdmissions alcohol category from OLIDS, one row per person with a valid Full
      AUDIT score. The highest recorded category wins, then the latest clinical date;
      it does not represent only recent consumption. AUDIT-C is excluded. People
      without valid evidence are absent here and receive category 0 in
      qadmissions_input_features.
    config:
      meta:
        owner:
          name: Thomas Shallcross
    columns:
      - name: person_id
        description: 'OLIDS-native unique person identifier. Primary key of this model.'
        data_tests:
          - unique
          - not_null
      - name: alcohol_cat6
        description: >-
          QAdmissions categories from Full AUDIT: 0 for score 0 (NonDrinker), 1 above 0-3
          (Trivial), 2 above 3-7 (Light), 3 above 7-15 (Moderate), 4 above 15-19 (Heavy), and
          5 above 19 (VeryHeavy). Highest category across recorded history takes priority.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5]
      - name: audit_score
        description: 'The Full AUDIT score (0..40) that produced the retained cat6.'
        data_tests:
          - not_null
      - name: clinical_effective_date
        description: 'Clinical effective date of the retained Full AUDIT observation.'
        data_tests:
          - not_null
