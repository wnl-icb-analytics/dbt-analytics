version: 2

models:
  - name: qadmissions_alcohol_category
    description: >-
      Alcohol category for the QAdmissions alcohol_cat6 feature, one row per
      person with at least one valid Full AUDIT score. The OLIDS population
      comes from NCL GP records. Categories use AUDIT scores 0, above 0-3,
      above 3-7, above 7-15, above 15-19 and above 19 for levels 0-5
      respectively. These correspond to the model's non-drinker, trivial,
      light, moderate, heavy and very-heavy labels. The highest recorded
      category takes priority over the latest record, so prior high
      consumption remains represented. Clinical date resolves ties within a
      category. AUDIT-C scores are excluded. People without valid Full AUDIT
      evidence are absent here and receive category 0 in
      qadmissions_input_features.
    config:
      meta:
        owner:
          name: Thomas Shallcross
    columns:
      - name: person_id
        description: 'OLIDS-native unique person identifier. Primary key of this model.'
        data_tests:
          - unique
          - not_null
      - name: alcohol_cat6
        description: 'QAdmissions alcohol category 0..5 (0 = NonDrinker, 1 = Trivial, 2 = Light, 3 = Moderate, 4 = Heavy, 5 = VeryHeavy). Derived from the highest Full AUDIT score the person has ever recorded.'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5]
      - name: audit_score
        description: 'The Full AUDIT score (0..40) that produced the retained cat6.'
        data_tests:
          - not_null
      - name: clinical_effective_date
        description: 'Clinical effective date of the retained Full AUDIT observation.'
        data_tests:
          - not_null
