version: 2

models:
  - name: qadmissions_ethrisk
    description: >-
      QAdmissions ethnicity group, one row per NCL OLIDS person in dim_person_ethnicity using
      its selected subcategory. Non-deprioritised, more specific records take priority over
      recency. The qadmissions_eth2016_to_ethrisk9 mapping assigns nine groups; missing,
      refused, unknown or unmatched subcategories default to group 1, alongside White
      ethnicity.
    config:
      meta:
        owner:
          name: Thomas Shallcross
    columns:
      - name: person_id
        description: 'OLIDS-native unique person identifier. Primary key of this model.'
        data_tests:
          - unique
          - not_null
      - name: ethnicity_subcategory
        description: 'Subcategory text from dim_person_ethnicity (e.g. "White: British", "Asian: Indian", "Not Recorded").'
        data_tests:
          - not_null
      - name: latest_ethnicity_date
        description: >-
          Clinical date of the ethnicity selected by dim_person_ethnicity. Specificity and
          non-deprioritised status take priority over recency, so this need not be the latest
          overall. Null without usable evidence.
      - name: ethrisk
        description: >-
          QAdmissions groups: 1 White or not recorded, 2 Indian, 3 Pakistani, 4 Bangladeshi, 5
          Other Asian, 6 Black Caribbean, 7 Black African, 8 Chinese, 9 Other Ethnic Group.
          Not stated, refused, recorded-not-known and unmatched subcategories also default to
          1.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7, 8, 9]
      - name: qadmissions_label
        description: 'Human-readable QAdmissions group label corresponding to ethrisk.'
        data_tests:
          - not_null
