version: 2

models:
  - name: qadmissions_ethrisk
    description: >-
      QAdmissions ethnicity risk group, one row per person in
      dim_person_ethnicity using its selected ethnicity subcategory. The OLIDS
      population comes from NCL GP records. Non-deprioritised, more specific
      records take priority over recency. Codes are 1 White or not recorded, 2
      Indian, 3 Pakistani, 4 Bangladeshi, 5 Other Asian, 6 Black Caribbean, 7
      Black African, 8 Chinese and 9 Other Ethnic Group. Not recorded, not
      stated, refused and recorded-not-known categories share group 1.
      Unmatched subcategories also default to 1. Mapping definitions are held
      in qadmissions_eth2016_to_ethrisk9.
    config:
      meta:
        owner:
          name: Thomas Shallcross
    columns:
      - name: person_id
        description: 'OLIDS-native unique person identifier. Primary key of this model.'
        data_tests:
          - unique
          - not_null
      - name: ethnicity_subcategory
        description: 'Subcategory text from dim_person_ethnicity (e.g. "White: British", "Asian: Indian", "Not Recorded").'
        data_tests:
          - not_null
      - name: latest_ethnicity_date
        description: 'Clinical effective date of the latest ethnicity record. NULL for persons with no usable record.'
      - name: ethrisk
        description: 'QAdmissions ethrisk integer (1..9). Defaults to 1 for any subcategory not present in the seed.'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7, 8, 9]
      - name: qadmissions_label
        description: 'Human-readable QAdmissions group label corresponding to ethrisk.'
        data_tests:
          - not_null
