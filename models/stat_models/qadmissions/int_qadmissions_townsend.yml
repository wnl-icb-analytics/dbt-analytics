version: 2

models:
  - name: int_qadmissions_townsend
    description: >
      Townsend Deprivation Score per person, used as the source for the
      QAdmissions feature `town`. Higher score = more deprived.

      Built by bridging each person's residential LSOA 2021 code (from
      dim_person_demographics) to LSOA 2011 codes via
      stg_reference_lsoa2011_lsoa2021, then looking up the score in the
      qadmissions_townsend_lsoa_2011 seed.

      Persons whose LSOA does not match the bridge (e.g. Scottish or NI
      codes outside the England-and-Wales lookup, or a NULL recorded LSOA)
      receive NULL townsend_score. NULL is passed through to the
      registered QAdmissions model rather than substituted with a
      national-mean default.

      Grain: one row per person_id in dim_person_demographics.
    config:
      meta:
        owner:
          name: Thomas Shallcross
    columns:
      - name: person_id
        description: 'OLIDS-native unique person identifier. Primary key of this model.'
        data_tests:
          - unique
          - not_null
      - name: townsend_score
        description: >
          Townsend Deprivation Score for the person's residential LSOA.
          Higher values indicate greater deprivation. NULL when no LSOA
          recorded or when no bridge / Townsend match (e.g. non-English
          residence). For persons whose LSOA is a 2021 merger of multiple
          2011 LSOAs, the score is the unweighted mean of the predecessor
          2011 LSOAs' Townsend scores.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -10
                max_value: 15
                inclusive: true
              config:
                where: "townsend_score IS NOT NULL"
          - dbt_utils.not_null_proportion: 
              arguments:
                at_least: 0.5
