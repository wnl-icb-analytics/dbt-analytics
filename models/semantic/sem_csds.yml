version: 2
models:
- name: sem_csds
  description: >-
    Aggregate analysis of CSDS community referrals, contacts, activities, clinical records, recorded
    caseload and provider submission freshness. The semantic view connects the reporting tables at
    their defined row meanings and supplies named measures. Current person summaries do not describe
    historical state; use referral periods and period demographics for that. Assessment rows are
    responses, not completed questionnaires. Costing classifications are held separately.
  config:
    materialized: semantic_view
    schema: SEMANTIC
    meta:
      owner:
        name: Eddie Davison
  data_tests:
  - csds_semantic_counts
