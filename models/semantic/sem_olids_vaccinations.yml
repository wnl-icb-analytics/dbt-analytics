version: 2

models:
  - name: sem_olids_vaccinations
    description: |
      OLIDS Vaccinations semantic view. COVID and flu uptake is one row per
      person x campaign x risk group, so all headcounts use distinct people.
      eligible_patients counts only people whose upstream is_eligible flag is
      true. vaccinated_patients also includes people without recorded
      eligibility. Filter programme_type, campaign_id and is_eligible = TRUE
      when calculating uptake so the numerator uses the eligible population.
      The adult immunisation tables are pneumococcal person status, shingles
      person x dose status, and RSV person status.

      COVID and flu contain campaign history. Pneumococcal, shingles, and RSV
      are current-state single-programme cohorts. Programme tables include
      inactive and deceased people; filter is_active for current coverage.

      Exposes person_id for aggregate-only CTE joins to other sem_olids_*
      views. Never return person_id in final results.

      Tables: fct_covid_flu_uptake, fct_pneumococcal_vaccination_status,
      fct_shingles_vaccination_status, fct_rsv_vaccination_status, and
      dim_person_demographics.
    config:
      materialized: semantic_view
      schema: SEMANTIC
      meta:
        owner:
          name: Eddie Davison
