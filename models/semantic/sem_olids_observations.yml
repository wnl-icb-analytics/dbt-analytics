version: 2

models:
  - name: sem_olids_observations
    description: >-
      Latest recorded clinical measurements and classifications for people in
      dim_person_demographics, with one row per person in each linked
      measurement table. The OLIDS population comes from NCL GP records.
      Covers blood pressure and its person-specific control assessment; HbA1c;
      lipids; BMI and waist circumference; blood glucose; kidney, liver and
      blood tests; QRISK; smoking status; and frailty. People without a
      qualifying measurement remain in the demographic population and have no
      matching measurement row. Measurements can have different dates. BMI
      applies to people aged at least 18 at the build date or at death, with
      lower thresholds for qualifying ethnicities. Blood glucose units are not
      standardised. The recorded cholesterol-to-HDL ratio has no derived
      treatment target. Recorded eFI or eFI2 scores differ from calculated
      eFI2, which includes living people whose 65th birthday could have
      occurred by the scoring date, using the first day of the approximate
      birth month. Smoking status uses observations recorded at age 11 or
      older and excludes status-free pack-years and unknown-consumption
      records. ESP 2013 weights are available for age-standardised rates.
      Current demographics describe today's population, rather than the person
      at each measurement date. person_id supports cohort linkage; final
      results must be aggregate-only. Diabetes care processes and NICE blood
      pressure indicators have separate semantic views.
    config:
      materialized: semantic_view
      schema: SEMANTIC
      meta:
        owner:
          name: Eddie Davison
