version: 2
models:
- name: sem_iapt
  description: >-
    Aggregate analysis of NHS Talking Therapies (IAPT data set) referrals, contacts, care activities, assessment
    items, recorded conditions, monthly referral state and provider submission quality. The semantic view connects
    the reporting tables at their defined row meanings and supplies named measures, including NHS England finished
    courses, reliable recovery and waits. Unprefixed waits use each referral's own supplied dates, including
    transfer successors only when the event is on or after the start of their first reported month. Repeated
    pre-transfer course dates stay supplied but cannot contribute a successor wait. For monthly M024 to M027,
    select referral_first_assessment_month; for M036, M037 and M049, select referral_first_treatment_month; for monthly M046 and M047, select referral_second_treatment_month.
    Group by the selected month and filter referrals_is_nhse_use_pathway true. The first-treatment population
    includes open and discharged referrals first treated in the period; it is not the finished-course waiting-time KPI.
    Separately named pathway measures count each confirmed transfer chain once on its original referral,
    attributed to that provider and its dimensions. Select and group them by pathway_first_assessment_month,
    pathway_first_treatment_month or pathway_second_treatment_month for the corresponding wait. A referral
    without its own supplied date cannot acquire an unprefixed wait from its chain. Ended-referral and recovery
    measures keep the referral's own supplied counts, flags and scores. Referral-period waiting lists retain
    predecessor care across transfers and are local chain-aware measures.
    Procedure breakdowns retain offered, planned and done context; the asserted procedure code is populated
    only for bare concepts or expressions refined only by Done.
    Child facts and referral periods relate to the latest referral only when referral_id and non-null person_id
    agree. Unmatched children remain in counts with null referral dimensions. Contacts and referral periods
    relate to provider submissions by provider and month. Assessment rows are items, not questionnaires.
  config:
    materialized: semantic_view
    schema: SEMANTIC
    meta:
      owner:
        name: Eddie Davison
  data_tests:
  - iapt_semantic_counts
  - iapt_semantic_waits
