version: 2
models:
- name: sem_iapt
  description: >-
    Aggregate analysis of NHS Talking Therapies (IAPT data set) referrals, contacts, care activities, assessment
    items, recorded conditions, monthly referral state and provider submission quality. The semantic view connects
    the reporting tables at their defined row meanings and supplies named measures, including NHS England finished
    courses, reliable recovery and waits. Child facts relate to referrals by referral_id; contacts and referral
    periods relate to provider submissions by provider and month. Assessment rows are items, not questionnaires.
  config:
    materialized: semantic_view
    schema: SEMANTIC
    meta:
      owner:
        name: Eddie Davison
  data_tests:
  - iapt_semantic_counts
