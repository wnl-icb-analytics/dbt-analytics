version: 2

models:
  - name: sem_olids_population
    description: >-
      Current population health measures for NCL OLIDS, one row per person in
      dim_person_demographics with linked conditions, statuses and Cambridge Comorbidity
      Scores. Includes inactive and deceased people; is_active identifies current registrants.
      Conditions use QOF v51 and project non-QOF definitions. Cambridge scores apply from age
      16; ESP 2013 groups and weights support standardisation. person_id supports cohort
      linkage; final results must be aggregate-only.
    config:
      materialized: semantic_view
      schema: SEMANTIC
      meta:
        owner:
          name: Eddie Davison
