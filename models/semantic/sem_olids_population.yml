version: 2

models:
  - name: sem_olids_population
    description: >-
      Current NCL OLIDS population health measures, with one row per person in
      dim_person_demographics and linked current condition, status and
      Cambridge Comorbidity Score records. Includes inactive and deceased
      people; filter is_active for current registered-population analysis.
      Condition flags cover QOF v51 registers and the project's non-QOF
      conditions, including childhood registers and diabetes type.
      Vulnerability, risk-behaviour, polypharmacy and data-sharing fields
      describe the person's current recorded state. Cambridge scores apply
      from age 16. ESP 2013 age groups and weights are available for
      age-standardised rates. person_id is available for cohort linkage across
      semantic views; final results must be aggregate-only.
    config:
      materialized: semantic_view
      schema: SEMANTIC
      meta:
        owner:
          name: Eddie Davison
