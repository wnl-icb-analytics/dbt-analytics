version: 2

models:
  - name: sem_olids_trends
    description: >-
      Monthly NCL OLIDS population demographics and condition episodes over
      the rolling 60-month window in person_month_analysis_base. One row per
      person and analysis month, including inactive and deceased rows;
      is_active identifies the active population for that month. Monthly
      condition flags follow clinical episodes and do not apply QOF register
      rules. ESP 2013 age groups are available, but this view has no ESP
      weights; age-standardised rates use sem_olids_population. Clinical
      biomarker measurements are available in sem_olids_observations rather
      than this view. person_id supports cohort linkage; final results must be
      aggregate-only.
    config:
      materialized: semantic_view
      schema: SEMANTIC
      meta:
        owner:
          name: Eddie Davison
