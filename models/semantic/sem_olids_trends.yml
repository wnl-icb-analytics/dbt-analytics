version: 2

models:
  - name: sem_olids_trends
    description: >-
      NCL OLIDS demographics and condition episodes over the rolling 60-month window in
      person_month_analysis_base, one row per person and month. Inactive and deceased rows
      remain; is_active identifies that month's active population. Condition flags follow
      episodes rather than QOF register rules. ESP age groups are available; weights use
      sem_olids_population and biomarkers use sem_olids_observations. person_id supports
      cohort linkage; final results must be aggregate-only.
    config:
      materialized: semantic_view
      schema: SEMANTIC
      meta:
        owner:
          name: Eddie Davison
