version: 2

models:
  - name: sem_olids_observations_history
    description: >-
      Historical OLIDS clinical measurements, with one row per observation
      event from int_observation_events_long. A person can have several
      readings of the same biomarker on the same date; observation_event_id
      distinguishes events. observation_type defines the meaning of value,
      unit and category. Current demographic, geography and deprivation fields
      accompany the measurements. History has no 60-month cap. OLIDS retains
      full history for current registrants but about five years for people who
      left or died, so older population comparisons are biased towards current
      registrants. person_id supports serial-reading analysis and cohort
      linkage; final results must be aggregate-only.
    config:
      materialized: semantic_view
      schema: SEMANTIC
      meta:
        owner:
          name: Eddie Davison
