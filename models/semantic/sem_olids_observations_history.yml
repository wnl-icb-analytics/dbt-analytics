version: 2

models:
  - name: sem_olids_observations_history
    description: >-
      Historical NCL OLIDS clinical measurements, one row per observation event from
      int_observation_events_long. Multiple same-day readings remain distinct;
      observation_type defines value, unit and category. Demographic and geography fields are
      current. History has no 60-month cap, but leavers and deceased people have about five
      years of retained records, so older comparisons favour current registrants. person_id
      supports serial-reading analysis and cohort linkage; final results must be
      aggregate-only.
    config:
      materialized: semantic_view
      schema: SEMANTIC
      meta:
        owner:
          name: Eddie Davison
