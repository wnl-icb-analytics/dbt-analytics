version: 2

models:
  - name: sem_olids_observations_history
    description: >-
      Historical OLIDS clinical measurements from int_observation_events_long.
      Non-BP re-entries with the same person, observation type, concept, calendar
      date and recorded value within one source patient record and publisher appear
      once. BP rows and differing concepts, standardised values, units, source patient
      records or publishers stay distinct. Unknown clinical days retain separate
      source entries; observation_count counts distinct readings. observation_type
      defines value, unit and category. Demographic and geography fields are current.
      History has no 60-month cap, but leavers and deceased people
      have about five years of retained records, so older comparisons favour current
      registrants. person_id supports serial-reading analysis and cohort linkage;
      final results must be aggregate-only.
    config:
      materialized: semantic_view
      schema: SEMANTIC
      meta:
        owner:
          name: Eddie Davison
