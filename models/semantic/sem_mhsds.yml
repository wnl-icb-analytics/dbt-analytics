version: 2
models:
- name: sem_mhsds
  description: >-
    Aggregate analysis of MHSDS referrals, care, clinical evidence, current caseload and inpatient
    capacity. The semantic view connects reporting tables at their defined row meanings and supplies
    named measures. Use clinical dates for events and submission periods for reported state and
    freshness. Current person summaries do not describe historical state. Diagnoses are recorded
    evidence, assessment rows are responses rather than completed questionnaires, and score changes
    do not establish improvement. Anonymous activity cannot be linked to people. Capacity is monthly
    reported evidence, not live bed availability. Costing classifications are held separately.
  config:
    materialized: semantic_view
    schema: SEMANTIC
    meta:
      owner:
        name: Eddie Davison
  data_tests:
  - mhsds_semantic_counts
