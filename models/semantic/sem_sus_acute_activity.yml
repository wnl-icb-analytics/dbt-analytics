version: 2

models:
  - name: sem_sus_acute_activity
    description: |
      SUS Acute Activity semantic view. APC is admission-spell grain, UEC is
      A&E-attendance grain, and OP is attended-outpatient-appointment grain.
      Do not combine settings in one query.

      Costs are SUS listed/national prices, not actual provider costs. Use
      sem_cost_index for SLAM actual costs. REVIEW: the SUS coverage window
      has not yet been validated.

      Exposes setting-specific sk_patient_id linkage dimensions for
      aggregate-only CTE joins to sem_olids_population. Never return the key.

      APC spells include the administrative category at the start of the
      spell. apc_admission_administrative_category_code is the code supplied
      by SUS+. apc_admission_administrative_category_name is the NHS Data
      Dictionary description, and is null when the code is missing or
      unmatched.

      UEC rows include uec_is_four_hour_breach. It is true when
      arrival-to-departure time is over 240 minutes, false at 240 minutes or
      less, and null when duration is missing. uec_four_hour_breach_count
      counts the true flags.

      Tables: obt_encounter_apc, obt_encounter_uec, and obt_encounter_op.

      UEC residence filters use uec_residence_health_borough_name, the
      legacy CCG-based WNL or NCL health borough of residence at the
      attendance. Null means outside WNL/NCL or no usable LSOA.

      Commissioner filters use apc_commissioner_code,
      apc_commissioner_name and apc_commissioner_source, and the same
      three names with uec_ and op_ prefixes. CAM is preferred when
      supplied; otherwise the DSCRO service-agreement commissioner. The
      name is the latest available organisation name for that code, not
      the name at the activity date. For UEC, CAM starts in 2024, so
      earlier attendances use DSCRO.
    config:
      materialized: semantic_view
      schema: SEMANTIC
      meta:
        owner:
          name: Eddie Davison
