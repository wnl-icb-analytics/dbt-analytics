version: 2

models:
  - name: sem_sus_acute_activity
    description: |
      SUS Acute Activity semantic view. APC is admission-spell grain, UEC is
      A&E-attendance grain, and OP is attended-outpatient-appointment grain.
      Do not combine settings in one query.

      Costs are SUS listed/national prices, not actual provider costs. Use
      sem_cost_index for SLAM actual costs. REVIEW: the SUS coverage window
      has not yet been validated.

      Exposes setting-specific sk_patient_id linkage dimensions for
      aggregate-only CTE joins to sem_olids_population. Never return the key.

      APC dimensions apc_admission_administrative_category_code and
      apc_admission_administrative_category_name give the SUS+ administrative
      category at the start of the spell and the newest published NHS Data
      Dictionary name. The code is null when SUS+ supplied none; the name is
      null when the code is missing or unmatched. UEC dimension
      uec_is_four_hour_breach is true when arrival-to-departure duration is
      more than 240 minutes, and null when duration is missing. Exactly 240
      minutes is within the four-hour standard. The flag does not select an
      attendance population.

      Tables: obt_encounter_apc, obt_encounter_uec, and obt_encounter_op.
    config:
      materialized: semantic_view
      schema: SEMANTIC
      meta:
        owner:
          name: Eddie Davison
