version: 2

models:
  - name: sem_olids_ltc_lcs
    description: |-
      OLIDS LTC LCS semantic view over person-grain case-finding candidates, and adult MoC (including Check & Test-only LR) and CYP-only asthma members. Query the two populations separately. Use person_id only for aggregate joins, never in final results. Risk and MoC fields follow the observation-based EMIS work lists. CYP-only high-risk children can have next action Desktop Review (DTR) when the annual review is done, the desktop review is not complete, and the latest review was three or more months ago.
    config:
      materialized: semantic_view
      schema: SEMANTIC
      meta:
        owner:
          name: Eddie Davison
