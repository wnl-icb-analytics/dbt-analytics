version: 2

models:
  - name: sem_olids_prescribing
    description: >-
      NCL OLIDS medication issues, one row per linked order dated from 1 January 1990 to
      build. Includes inactive and deceased people. BNF codes, drug-class flags and
      prescription details describe each issue; demographics and practice context are current.
      An order does not establish indication or confirm use. sem_olids_population supplies
      condition cohorts. person_id supports cohort linkage; final results must be
      aggregate-only.
    config:
      materialized: semantic_view
      schema: SEMANTIC
      meta:
        owner:
          name: Eddie Davison
