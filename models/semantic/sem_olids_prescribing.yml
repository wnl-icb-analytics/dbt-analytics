version: 2

models:
  - name: sem_olids_prescribing
    description: >-
      OLIDS medication issues, one row per medication order dated from 1
      January 1990 to the build date and linked to a patient-person mapping.
      Includes inactive and deceased people. Each issue has BNF classification
      where available, prescription authorisation type, quantity, dose,
      duration and the issuing practice's current PCN and borough details.
      Patient demographics are current, rather than as recorded at issue time.
      Linked drug-class records identify statins, antihypertensives,
      anticoagulants, antiplatelets, antipsychotics, antidepressants, lithium,
      epilepsy medicines, valproate, diabetes medicines, inhaled
      corticosteroids, antibacterials, NSAIDs and PPIs. BNF codes support
      filtering by class. An order does not confirm that a medicine was taken
      or establish its clinical indication. Condition and vulnerability
      cohorts are available through sem_olids_population. person_id supports
      cohort linkage; final results must be aggregate-only.
    config:
      materialized: semantic_view
      schema: SEMANTIC
      meta:
        owner:
          name: Eddie Davison
