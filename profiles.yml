# dbt profiles for WNL ICB Analytics project
#
# This file is tracked in git (uses env_var() with defaults - no secrets stored).
# Set required environment variables in your .env file (see env.example).
#
# Targets:
#   dev            - Client dev: local (SSO/PAT/password) or GitHub Actions (key-pair)
#   prod           - Client prod: local (SSO/PAT/password) or GitHub Actions (key-pair)
#   snowflake-dev  - Snowflake native execution (empty credentials)
#   snowflake-prod - Snowflake native execution (empty credentials)

wnl_analytics:
  target: dev  # Default target for local dev
  outputs:
    # Local development targets (require env vars)
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'placeholder') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'placeholder') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      token: "{{ env_var('SNOWFLAKE_PAT', '') }}"
      # Key-pair auth (GitHub Actions). Takes precedence in the adapter when set.
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      # Authenticator: snowflake_jwt (key-pair) | externalbrowser (SSO) |
      # username_password_mfa (uses password) | programmatic_access_token (uses token = PAT).
      # Auto-picked from whichever secret is set.
      authenticator: "{{ env_var('SNOWFLAKE_AUTHENTICATOR', 'snowflake_jwt' if env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') else ('programmatic_access_token' if env_var('SNOWFLAKE_PAT', '') else ('username_password_mfa' if env_var('SNOWFLAKE_PASSWORD', '') else 'externalbrowser'))) }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'DBT_ADMIN') }}"
      database: MODELLING
      schema: DBT_DEV
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'WH_WNL_ENGINEERING_M') }}"
      threads: 16
      client_session_keep_alive: true
      query_tag: dbt_analytics_dev
      # Retry transient connection failures (see snowflake-dev note).
      connect_retries: 3
      connect_timeout: 10
      retry_all: true

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'placeholder') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'placeholder') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      token: "{{ env_var('SNOWFLAKE_PAT', '') }}"
      # Key-pair auth (GitHub Actions). Takes precedence in the adapter when set.
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      # Authenticator: snowflake_jwt (key-pair) | externalbrowser (SSO) |
      # username_password_mfa (uses password) | programmatic_access_token (uses token = PAT).
      # Auto-picked from whichever secret is set.
      authenticator: "{{ env_var('SNOWFLAKE_AUTHENTICATOR', 'snowflake_jwt' if env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') else ('programmatic_access_token' if env_var('SNOWFLAKE_PAT', '') else ('username_password_mfa' if env_var('SNOWFLAKE_PASSWORD', '') else 'externalbrowser'))) }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'DBT_ADMIN') }}"
      database: MODELLING
      schema: DBT_PROD
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'WH_WNL_ENGINEERING_M') }}"
      threads: 16
      client_session_keep_alive: true
      query_tag: dbt_analytics_prod
      # Retry transient connection failures (see snowflake-dev note).
      connect_retries: 3
      connect_timeout: 10
      retry_all: true

    # Snowflake native execution targets (runs in the Snowflake session context).
    # account/user are placeholders, NOT real credentials: native execution uses
    # the in-session connection and ignores their values, but Fusion's compile-time
    # metadata introspection rejects an empty account ("260000: account is empty"),
    # so they must be non-empty.
    snowflake-dev:
      type: snowflake
      account: placeholder
      user: placeholder
      role: DBT_ADMIN
      database: MODELLING
      schema: DBT_DEV
      warehouse: WH_WNL_ENGINEERING_M
      threads: 16
      client_session_keep_alive: false
      query_tag: dbt_analytics_dev
      # Retry transient connection failures. A single Fusion bridge login stall
      # ("context deadline exceeded" on localhost) failed 36 models in one 90ms
      # window; retry_all covers timeouts (not just DatabaseErrors).
      connect_retries: 3
      connect_timeout: 10
      retry_all: true

    snowflake-prod:
      type: snowflake
      account: placeholder
      user: placeholder
      role: DBT_ADMIN
      database: MODELLING
      schema: DBT_PROD
      warehouse: WH_WNL_ENGINEERING_M
      threads: 16
      client_session_keep_alive: false
      query_tag: dbt_analytics_prod
      # Retry transient connection failures (see snowflake-dev note).
      connect_retries: 3
      connect_timeout: 10
      retry_all: true

    # CI compile gate (key-pair auth, read-only metadata introspection).
    # ci-dev introspects the DEV__ catalog (PR validation); ci-prod the prod
    # catalog (merge queue, pre-deploy). Prefixing is handled by generate_database_name.
    ci-dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'placeholder') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'placeholder') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'DBT_ADMIN') }}"
      database: MODELLING
      schema: DBT_DEV
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'WH_NCL_ENGINEERING_XS') }}"
      threads: 16
      client_session_keep_alive: false
      query_tag: dbt_analytics_ci

    ci-prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'placeholder') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'placeholder') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'DBT_ADMIN') }}"
      database: MODELLING
      schema: DBT_PROD
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'WH_NCL_ENGINEERING_XS') }}"
      threads: 16
      client_session_keep_alive: false
      query_tag: dbt_analytics_ci
