snapshots:
  - name: cltcs_score_treatment_snapshot
    relation: ref('cltcs_score_treatment_snapshot_input')
    description: >
      SCD2 history of the C-LTCS treatment sub-score and its scaled subdomain
      components, keyed on `sk_patient_id` and `inclusion_rule`: one history per
      patient per C-LTCS cohort ('original_criteria' or 'adults_with_complexity').
      Built to support matching cohort patients against a control cohort by
      comparing score state as-at a given date.

      The snapshot also holds closed 'segment_7' histories. The second cohort was
      first defined as segment 7 of fct_person_segment, then replaced in October
      2026 by the Adults with Complexity cohort (fct_person_complex_adults, which
      also includes people on the palliative care register). 'segment_7' rows were
      scored against the segment 7 comparison group and keep that label; they were
      closed when the cohort was replaced. 'adults_with_complexity' history starts
      from that change.

      `check_cols` is `score_treatment` only, so a new version opens when the
      final score changes. The scaled subdomain scores are carried in the
      snapshot and captured as-at each version open, but do not themselves
      trigger a version. The score is cohort-relative (z-scored per neighbourhood, then
      age adjusted) and so can drift between builds without an underlying
      feature change; because it is rounded to 1dp, sub-0.1 drift will not
      version, which limits churn.

      Rows removed from `cltcs_score_treatment_snapshot_input` (patient leaves
      the scored population) are closed via `hard_deletes: invalidate`
      (`dbt_valid_to` set). Re-entry opens a new row.

    config:
      strategy: check
      unique_key: [sk_patient_id, inclusion_rule]
      updated_at: table_refresh_date
      hard_deletes: invalidate
      check_cols:
        - score_treatment

    columns:
      - name: sk_patient_id
        description: "Unique patient identifier; snapshot unique_key."
        data_tests:
          - not_null

      - name: inclusion_rule
        description: "C-LTCS cohort the score belongs to: 'original_criteria', 'adults_with_complexity', or 'segment_7' (closed history from before October 2026). Part of the snapshot unique_key."
        data_tests:
          - not_null

      - name: dbt_valid_from
        description: "When this snapshot version became active (SCD2)."
        data_tests:
          - not_null
