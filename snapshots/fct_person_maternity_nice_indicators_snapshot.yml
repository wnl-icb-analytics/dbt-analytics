snapshots:
- name: fct_person_maternity_nice_indicators_snapshot
  relation: ref('fct_person_maternity_nice_indicators_snapshot_input')
  description: "NICE maternity outcome changes. One version per woman and indicator when delivery, enquiry evidence, practice or outcome changes. Advancing build dates are excluded; rows leaving the denominator are closed. Labels join from def_indicator or the measure tables by indicator_id."
  config:
    strategy: check
    unique_key:
    - person_id
    - indicator_id
    check_cols: all
    hard_deletes: invalidate
  columns:
  - name: person_id
    description: Woman identifier; part of the snapshot key.
    data_tests:
    - not_null
  - name: indicator_id
    description: NICE indicator identifier; part of the snapshot key.
    data_tests:
    - not_null
  - name: dbt_valid_from
    description: Date and time this version became active.
    data_tests:
    - not_null
