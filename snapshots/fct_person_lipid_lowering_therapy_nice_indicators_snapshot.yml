snapshots:
  - name: fct_person_lipid_lowering_therapy_nice_indicators_snapshot
    relation: ref('fct_person_lipid_lowering_therapy_nice_indicators_snapshot_input')
    description: >
      SCD2 history of the NICE lipid-lowering therapy indicators (IND230, IND231, IND276, IND277, IND229, IND274, IND275, IND287) per person and indicator: current practice, the latest
      counted order and the indicator outcome. Sources the thin snapshot-input
      view rather than the union directly, because the union's CURRENT_DATE()
      derived reporting columns change every run. check_cols: all over the thin
      projection; a new order, a practice move or an order ageing out of the
      six-month window opens a version. Rows leaving an indicator population are
      closed via hard_deletes: invalidate.
    config:
      strategy: check
      unique_key: [person_id, indicator_id]
      check_cols: all
      hard_deletes: invalidate
    columns:
      - name: person_id
        description: "Person identifier; part of the snapshot unique_key."
        data_tests:
          - not_null
      - name: indicator_id
        description: "NICE indicator identifier; part of the snapshot unique_key."
        data_tests:
          - not_null
      - name: dbt_valid_from
        description: "When this snapshot version became active (SCD2)."
        data_tests:
          - not_null
