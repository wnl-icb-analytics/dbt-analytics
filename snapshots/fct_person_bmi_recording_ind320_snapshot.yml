snapshots:
  - name: fct_person_bmi_recording_ind320_snapshot
    relation: ref('fct_person_bmi_recording_ind320_snapshot_input')
    description: >
      SCD2 history of NICE IND320 BMI recording per person: current practice,
      latest BMI in the window and outcome. Sources the thin snapshot-input
      view rather than the measure, because CURRENT_DATE() derived columns
      change every run. check_cols: all over the thin projection. Rows leaving
      the population are closed via hard_deletes: invalidate.
    config:
      strategy: check
      unique_key: [person_id]
      check_cols: all
      hard_deletes: invalidate
    columns:
      - name: person_id
        description: "Person identifier; snapshot unique_key."
        data_tests:
          - not_null
      - name: dbt_valid_from
        description: "When this snapshot version became active (SCD2)."
        data_tests:
          - not_null
