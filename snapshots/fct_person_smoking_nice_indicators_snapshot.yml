snapshots:
  - name: fct_person_smoking_nice_indicators_snapshot
    relation: ref('fct_person_smoking_nice_indicators_snapshot_input')
    description: >
      SCD2 history of the NICE smoking indicators (IND97, IND156, IND157) per person
      and indicator: current practice, latest status, latest qualifying record
      and outcome. Sources the thin snapshot-input view rather than the
      measure, because CURRENT_DATE() derived columns change every run.
      check_cols: all over the thin projection. Rows leaving the population
      are closed via hard_deletes: invalidate.
    config:
      strategy: check
      unique_key: [person_id, indicator_id]
      check_cols: all
      hard_deletes: invalidate
    columns:
      - name: person_id
        description: "Person identifier; part of the snapshot unique_key."
        data_tests:
          - not_null
      - name: indicator_id
        description: "NICE indicator identifier; part of the snapshot unique_key."
        data_tests:
          - not_null
      - name: dbt_valid_from
        description: "When this snapshot version became active (SCD2)."
        data_tests:
          - not_null
