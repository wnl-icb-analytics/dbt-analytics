snapshots:
  - name: fct_person_smi_nice_indicators_snapshot
    relation: ref('fct_person_smi_nice_indicators_snapshot_input')
    description: >
      SCD2 history of the NICE severe mental illness indicators (IND82 to
      IND85, IND87, IND143, IND150, IND154, IND155, IND158, IND159, IND213,
      IND214, IND248) per person and indicator: current practice, latest
      qualifying record and outcome. Sources the thin snapshot-input view rather
      than the measure, because CURRENT_DATE() derived columns change every run.
      check_cols: all over the thin projection. Rows leaving the population are
      closed via hard_deletes: invalidate.
    config:
      strategy: check
      unique_key: [person_id, indicator_id]
      check_cols: all
      hard_deletes: invalidate
    columns:
      - name: person_id
        description: "Person identifier; part of the snapshot unique_key."
        data_tests:
          - not_null
      - name: indicator_id
        description: "NICE indicator identifier; part of the snapshot unique_key."
        data_tests:
          - not_null
      - name: dbt_valid_from
        description: "When this snapshot version became active (SCD2)."
        data_tests:
          - not_null
