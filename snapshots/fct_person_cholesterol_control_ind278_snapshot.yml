snapshots:
  - name: fct_person_cholesterol_control_ind278_snapshot
    relation: ref('fct_person_cholesterol_control_ind278_snapshot_input')
    description: >
      SCD2 history of NICE IND278 cholesterol control per person: qualifying CVD registers,
      current practice, the selected LDL or non-HDL result with its provenance flags, and
      the indicator outcome. Supports
      indicator trends and as-at reads for cohort matching. Sources the thin
      fct_person_cholesterol_control_ind278_snapshot_input view rather than the measure
      directly, because the measure's CURRENT_DATE()-derived reporting_date and
      measurement_period_start change every run and would version every person on every
      build. check_cols: all over the thin projection; a new result, a practice move, a
      register change or a result ageing out of the 12-month window opens a version. Rows
      leaving the source (leaving the CVD registers, deregistration, or a new FH or
      haemorrhagic stroke exclusion) are closed via hard_deletes: invalidate.
    config:
      strategy: check
      unique_key: [person_id]
      check_cols: all
      hard_deletes: invalidate
    columns:
      - name: person_id
        description: "Person identifier; snapshot unique_key."
        data_tests:
          - not_null
      - name: dbt_valid_from
        description: "When this snapshot version became active (SCD2)."
        data_tests:
          - not_null
