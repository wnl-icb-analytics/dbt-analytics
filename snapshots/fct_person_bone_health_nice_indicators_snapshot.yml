snapshots:
- name: fct_person_bone_health_nice_indicators_snapshot
  relation: ref('fct_person_bone_health_nice_indicators_snapshot_input')
  description: SCD2 history of NICE bone health evidence and outcomes, one row per
    person, indicator and snapshot version. Departures invalidate the open version.
  config:
    strategy: check
    unique_key:
    - person_id
    - indicator_id
    check_cols: all
    hard_deletes: invalidate
    meta:
      owner:
        name: EddieDavison92
  columns:
  - name: dbt_valid_from
    description: Start of this snapshot version.
    data_tests:
    - not_null
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - indicator_id
        - dbt_valid_from
