snapshots:
- name: fct_person_copd_nice_indicators_snapshot
  relation: ref('fct_person_copd_nice_indicators_snapshot_input')
  description: "SCD2 history of NICE COPD outcomes, one version per eligible COPD register member and indicator. Rows leaving the population close the current version. Labels join from def_indicator or the measure tables by indicator_id."
  config:
    strategy: check
    unique_key:
    - person_id
    - indicator_id
    check_cols: all
    hard_deletes: invalidate
    meta:
      owner:
        name: EddieDavison92
  columns:
  - name: person_id
    data_tests:
    - not_null
  - name: indicator_id
    data_tests:
    - not_null
  - name: dbt_valid_from
    data_tests:
    - not_null
