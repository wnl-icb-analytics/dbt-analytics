snapshots:
  - name: fct_person_childhood_immunisation_nice_indicators_snapshot
    relation: ref('fct_person_childhood_immunisation_nice_indicators_snapshot_input')
    description: >
      SCD2 history of the NICE childhood immunisation indicators (IND215 to
      IND218, IND224 to IND226) per child and indicator. Sources the thin
      snapshot-input view rather than the measure, because CURRENT_DATE()
      derived columns change every run. check_cols: all over the thin
      projection. Rows leaving the population are closed via hard_deletes:
      invalidate.
    config:
      strategy: check
      unique_key: [person_id, indicator_id]
      check_cols: all
      hard_deletes: invalidate
    columns:
      - name: person_id
        description: "Person identifier; part of the snapshot unique_key."
        data_tests:
          - not_null
      - name: indicator_id
        description: "NICE indicator identifier; part of the snapshot unique_key."
        data_tests:
          - not_null
      - name: dbt_valid_from
        description: "When this snapshot version became active (SCD2)."
        data_tests:
          - not_null
