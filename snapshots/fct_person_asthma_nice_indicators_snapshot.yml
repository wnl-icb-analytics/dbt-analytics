snapshots:
- name: fct_person_asthma_nice_indicators_snapshot
  relation: ref('fct_person_asthma_nice_indicators_snapshot_input')
  description: SCD2 history of NICE asthma eligibility, evidence and outcomes, one
    version per person and indicator. Rows leaving the population close the current
    version.
  config:
    strategy: check
    unique_key:
    - person_id
    - indicator_id
    check_cols: all
    hard_deletes: invalidate
    meta:
      owner:
        name: EddieDavison92
  columns:
  - name: person_id
    data_tests:
    - not_null
  - name: indicator_id
    data_tests:
    - not_null
  - name: dbt_valid_from
    data_tests:
    - not_null
