snapshots:
- name: fct_person_contraception_nice_indicators_snapshot
  relation: ref('fct_person_contraception_nice_indicators_snapshot_input')
  description: NICE contraception outcome history, one row per person, indicator and
    version. Evidence, practice and outcome changes open a version. People leaving
    eligibility close their version.
  config:
    strategy: check
    unique_key:
    - person_id
    - indicator_id
    check_cols: all
    hard_deletes: invalidate
  columns:
  - name: person_id
    data_tests:
    - not_null
  - name: indicator_id
    data_tests:
    - not_null
  - name: dbt_valid_from
    data_tests:
    - not_null
