snapshots:
  - name: fct_person_antithrombotic_therapy_nice_indicators_snapshot
    relation: ref('fct_person_antithrombotic_therapy_nice_indicators_snapshot_input')
    description: >
      SCD2 history of the NICE antiplatelet and anticoagulant indicators (IND132,
      IND133, IND94) per person and indicator: current practice, the latest
      orders and the outcome. Sources the thin snapshot-input view rather than
      the union, because the union's CURRENT_DATE() derived columns change every
      run. check_cols: all over the thin projection. Rows leaving an indicator
      population are closed via hard_deletes: invalidate.
    config:
      strategy: check
      unique_key: [person_id, indicator_id]
      check_cols: all
      hard_deletes: invalidate
    columns:
      - name: person_id
        description: "Person identifier; part of the snapshot unique_key."
        data_tests:
          - not_null
      - name: indicator_id
        description: "NICE indicator identifier; part of the snapshot unique_key."
        data_tests:
          - not_null
      - name: dbt_valid_from
        description: "When this snapshot version became active (SCD2)."
        data_tests:
          - not_null
