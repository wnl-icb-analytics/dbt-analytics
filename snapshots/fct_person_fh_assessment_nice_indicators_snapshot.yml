snapshots:
- name: fct_person_fh_assessment_nice_indicators_snapshot
  relation: ref('fct_person_fh_assessment_nice_indicators_snapshot_input')
  description: "Changes in familial hypercholesterolaemia assessment per person and indicator. Evidence, practice and outcome changes open a new version. Labels join from def_indicator or the measure tables by indicator_id."
  config:
    strategy: check
    unique_key:
    - person_id
    - indicator_id
    check_cols: all
    hard_deletes: invalidate
  columns:
  - name: person_id
    data_tests:
    - not_null
  - name: indicator_id
    data_tests:
    - not_null
  - name: dbt_valid_from
    data_tests:
    - not_null
