snapshots:
  - name: cltcs_score_frailty_snapshot
    relation: ref('cltcs_score_frailty_snapshot_input')
    description: >
      SCD2 history of the C-LTCS frailty sub-score and its scaled subdomain
      components, keyed on `sk_patient_id`. Built to support matching cohort
      patients against a control cohort by comparing score state as-at a given
      date.

      `check_cols` is `score_frailty` only, so a new version opens when the
      final score changes. The scaled subdomain scores and `score_exclusions`
      are carried in the snapshot and captured as-at each version open, but do
      not themselves trigger a version. The score is cohort-relative (z-scored
      per neighbourhood) and so can drift between builds without an underlying feature
      change; because it is rounded to 1dp, sub-0.1 drift will not version,
      which limits churn.

      Rows removed from `cltcs_score_frailty_snapshot_input` (patient leaves the
      scored population) are closed via `hard_deletes: invalidate`
      (`dbt_valid_to` set). Re-entry opens a new row.

    config:
      strategy: check
      unique_key: [sk_patient_id]
      updated_at: table_refresh_date
      hard_deletes: invalidate
      check_cols:
        - score_frailty

    columns:
      - name: sk_patient_id
        description: "Unique patient identifier; snapshot unique_key."
        data_tests:
          - not_null

      - name: dbt_valid_from
        description: "When this snapshot version became active (SCD2)."
        data_tests:
          - not_null
