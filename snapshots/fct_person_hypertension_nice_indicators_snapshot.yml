snapshots:
- name: fct_person_hypertension_nice_indicators_snapshot
  relation: ref('fct_person_hypertension_nice_indicators_snapshot_input')
  description: SCD2 history of IND121 and IND115 at person and indicator grain. Tracks current practice,
    diagnosis and qualifying evidence dates and outcomes. Advancing dates are omitted; rows leaving the
    population are invalidated.
  config:
    strategy: check
    unique_key:
    - person_id
    - indicator_id
    check_cols: all
    hard_deletes: invalidate
  columns:
  - name: person_id
    description: Person identifier.
    data_tests:
    - not_null
  - name: indicator_id
    description: NICE indicator identifier.
    data_tests:
    - not_null
  - name: dbt_valid_from
    description: Timestamp when this version became active.
    data_tests:
    - not_null
