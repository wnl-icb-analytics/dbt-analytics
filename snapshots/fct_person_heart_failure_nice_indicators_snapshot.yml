snapshots:
- name: fct_person_heart_failure_nice_indicators_snapshot
  relation: ref('fct_person_heart_failure_nice_indicators_snapshot_input')
  description: Changes in NICE heart failure indicators per person and indicator. Assessment and rolling period
    dates are omitted; evidence, practice and outcome changes open a new version.
  config:
    strategy: check
    unique_key:
    - person_id
    - indicator_id
    check_cols: all
    hard_deletes: invalidate
  columns:
  - name: person_id
    data_tests:
    - not_null
  - name: indicator_id
    data_tests:
    - not_null
  - name: dbt_valid_from
    data_tests:
    - not_null
