snapshots:
  - name: fct_person_efi2_snapshot
    relation: ref('fct_person_efi2_snapshot_input')
    description: >
      SCD2 history of each person's eFI2 score and frailty category, for control-cohort
      matching (read as-at an index date). Sources the thin fct_person_efi2_snapshot_input view
      rather than fct_person_efi2 directly, because that model's CURRENT_DATE()-derived end_date
      / age_at_end advance every build and would version every person on every run. check_cols:
      all over the thin projection; a new score or band opens a version. Rows leaving the source
      are closed via hard_deletes: invalidate.
    config:
      strategy: check
      unique_key: [person_id]
      check_cols: all
      hard_deletes: invalidate
    columns:
      - name: person_id
        description: "Person identifier; snapshot unique_key."
        data_tests:
          - not_null
      - name: dbt_valid_from
        description: "When this snapshot version became active (SCD2)."
        data_tests:
          - not_null
