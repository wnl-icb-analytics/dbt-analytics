# Source Database and Schema Mappings for WNL ICB Analytics
# This file defines how source databases/schemas map to dbt sources
# Supports both OLIDS and Commissioning data sources
#
# Structure:
#   - source_name: Name used in dbt source() references
#     database: Source database name
#     schema: Source schema name (optional - if omitted, all schemas in database)
#     description: What this data source contains
#     raw_prefix: Prefix for raw layer models (optional, defaults to raw_{source_name})
#     domain: Which domain folder to create raw models in (commissioning, olids, shared)


sources:
  # ========================================
  # COMMISSIONING DATA SOURCES [DSCRO, national]
  # ========================================
  
  # Personal Demographics Service
  - source_name: pds
    database: DATA_LAKE
    schema: PDS
    description: Personal Demographics Service data
    staging_prefix: stg_pds
    domain: shared
  
  # Community services dataset
  - source_name: csds
    database: DATA_LAKE
    schema: CSDS
    description: Community services dataset
    raw_prefix: raw_csds
    domain: commissioning
  
  # Waiting Lists Data
  - source_name: wl
    database: DATA_LAKE
    schema: WL
    description: Waiting lists and patient pathway data
    raw_prefix: raw_wl
    domain: commissioning
    
  # SUS Unified - Outpatient
  - source_name: sus_op
    database: DATA_LAKE
    schema: SUS_UNIFIED_OP
    description: SUS outpatient appointments and activity
    raw_prefix: raw_sus_op
    domain: commissioning
    
  # SUS Unified - Admitted Patient Care
  - source_name: sus_apc
    database: DATA_LAKE
    schema: SUS_UNIFIED_APC
    description: SUS admitted patient care episodes and procedures
    raw_prefix: raw_sus_apc
    domain: commissioning
  
   # SUS Unified - Emergency Care
  - source_name: sus_ecds
    database: DATA_LAKE
    schema: SUS_UNIFIED_ECDS
    description: SUS emergency care attendances and activity
    raw_prefix: raw_sus_ecds
    domain: commissioning

  # eRS referrals
  - source_name: eRS_primary_care
    database: DATA_LAKE
    schema: ERS
    description: Primary care referrals data
    raw_prefix: raw_ers_pc
    domain: commissioning

  # EPD Primary Care
  - source_name: epd_primary_care
    database: DATA_LAKE
    schema: EPD_PRIMARY_CARE
    description: Primary care medications and prescribing data
    raw_prefix: raw_epd_pc
    domain: commissioning

  # Mental Health Services Data Set (MHSDS)
  - source_name: mhsds
    database: DATA_LAKE
    schema: MHSDS
    description: Mental Health Services Data Set (MHSDS)
    raw_prefix: raw_mhsds
    domain: commissioning

  # Registry Data (Births/Deaths)
  - source_name: registries_deaths
    database: DATA_LAKE
    schema: DEATHS
    description: Register of deaths
    raw_prefix: raw_registries_deaths
    domain: shared

  - source_name: registries_births
    database: DATA_LAKE
    schema: BIRTHS
    description: Register of births
    raw_prefix: raw_registries_births
    domain: shared

    # Adult social care (CLD)
  - source_name: adult_social_care_cld
    database: DATA_LAKE
    schema: SOCIAL_CARE
    description: National submission from local authorities for adult social care (client level dataset)
    raw_prefix: raw_asc_cld
    domain: shared

    # TERMINOLOGY schema in DATA_LAKE
  - source_name: reference_trud_terminology
    database: DATA_LAKE
    schema: TERMINOLOGY
    description: SNOMED CT cross-map and terminology reference data. Sourced by NHS TRUD.
    raw_prefix: raw_reference
    domain: shared


  # ========================================
  # COMMISSIONING DICTIONARIES [DSCRO, national]
  # ========================================
    
  # Dictionary/Reference Data dbo
  - source_name: dictionary_dbo
    database: Dictionary
    schema: dbo
    description: Reference data including PDS and lookup tables
    raw_prefix: raw_dictionary_dbo
    domain: shared

  # Dictionary/Reference Data ECDS_ETOS
  - source_name: dictionary_ecds
    database: Dictionary
    schema: ECDS_ETOS
    description: Reference data for ECDS
    raw_prefix: raw_dictionary_ecds
    domain: shared

  # Dictionary/Reference Data OP
  - source_name: dictionary_op
    database: Dictionary
    schema: OP
    description: Reference data for outpatient procedures and treatments
    raw_prefix: raw_dictionary_op
    domain: shared

    # Dictionary/Reference Data IP
  - source_name: dictionary_ip
    database: Dictionary
    schema: IP
    description: Reference data for inpatient procedures and treatments
    raw_prefix: raw_dictionary_ip
    domain: shared

    # eRS dictionary
  - source_name: dictionary_eRS
    database: Dictionary
    schema: E-Referral
    description: Primary care referrals lookups
    raw_prefix: raw_dictionary_ers
    domain: shared


  # ========================================
  # OLIDS DATA SOURCES
  # ========================================

  # OLIDS Core Tables
  - source_name: olids
    database: DATA_LAKE
    schema: OLIDS
    description: OLIDS stable layer - cleaned and filtered patient records
    raw_prefix: raw_olids
    domain: olids

  # Dictionary/Reference Data SNOMED
  - source_name: dictionary_snomed
    database: Dictionary
    schema: Snomed
    description: Reference data for snomed
    raw_prefix: raw_dictionary_snomed
    domain: shared

  # NHSD SNOMED Reporting Model
  - source_name: nhsd_snomed
    database: Dictionary
    schema: NHSD_SnomedReportingModel
    description: NHS Digital SNOMED CT reporting model with concept status and history
    raw_prefix: raw_nhsd_snomed
    domain: shared

  # ========================================
  # DATA_LAKE__NCL [NCL locally managed data sources]
  # ========================================

  # TERMINOLOGY schema in DATA_LAKE__NCL
  - source_name: reference_terminology
    database: DATA_LAKE__NCL
    schema: TERMINOLOGY
    description: Reference terminology data including SNOMED, BNF, and other code sets
    raw_prefix: raw_reference
    domain: shared

    # PTL
  - source_name: ptl
    database: DATA_LAKE__NCL
    schema: PTL
    description: ptl data
    raw_prefix: raw_ptl
    domain: commissioning

  # DATA_MANAGEMENT schema in DATA_LAKE__NCL
  - source_name: reference_data_management
    database: DATA_LAKE__NCL
    schema: DATA_MANAGEMENT
    description: Data management reference datasets
    raw_prefix: raw_reference
    domain: shared
    exclude_tables:
      - WNL  # Broken view retained upstream; unused by dbt.

  # CANCER schemas in DATA_LAKE__NCL
  - source_name: reference_cancer_cwt_alliance
    database: DATA_LAKE__NCL
    schema: CANCER__CWT_ALLIANCE
    description: Cancer waiting times alliance data
    raw_prefix: raw_reference
    domain: shared

  - source_name: reference_cancer_emis
    database: DATA_LAKE__NCL
    schema: CANCER__EMIS
    description: Cancer EMIS data
    raw_prefix: raw_reference
    domain: shared

  - source_name: reference_cancer_screening
    database: DATA_LAKE__NCL
    schema: CANCER__SCREENING
    description: Cancer screening data
    raw_prefix: raw_reference
    domain: shared

  # Fingertips schema in DATA_LAKE__NCL
  - source_name: reference_fingertips
    database: DATA_LAKE__NCL
    schema: FINGERTIPS
    description: Fingertips indicator data
    raw_prefix: raw_reference
    domain: shared
  
  # Phenolab schema in DATA_LAKE__NCL
  - source_name: phenolab
    database: DATA_LAKE__NCL
    schema: PHENOLAB_DEV
    description: Phenolab supporting data
    raw_prefix: raw_phenolab
    domain: shared

  # ========================================
  # ADDITIONAL OLIDS DATA SOURCES
  # ========================================
  # Additional OLIDS sources can be added here if needed

  # ========================================
  # REFERENCE [curated reference database]
  # ========================================
  # Curated practice/PCN/neighbourhood and geography reference data.
  # Replaces MODELLING.LOOKUP_NCL and DATA_LAKE__NCL.ANALYST_MANAGED for
  # these domains. Table lists are explicit: the schemas also hold geometry,
  # export views and app-internal tables that dbt should not pull.

  - source_name: reference_primary_care
    database: REFERENCE
    schema: PRIMARY_CARE
    description: Curated primary care organisation reference - practices, PCNs, neighbourhoods and memberships
    raw_prefix: raw_reference_primary_care
    domain: shared
    tables:
      - PRACTICE_ACTIVE
      - PRACTICE_ALL
      - PCN_CURRENT
      - PCN_MEMBERSHIP_ALL
      - NEIGHBOURHOOD_CURRENT
      - PRACTICE_SUCCESSION

  - source_name: reference_geo
    database: REFERENCE
    schema: GEO
    description: Curated geography lookups - LSOA to neighbourhood, ward, MSOA and ICB hierarchies
    raw_prefix: raw_reference_geo
    domain: shared
    tables:
      - NEIGHBOURHOOD_LSOA
      - LSOA_WARD_EW
      - LSOA_WIDER_LOOKUP
      - LSOA21_SICBL26_ICB26_NHSER26_LAD26

  - source_name: reference_terminology_curated
    database: REFERENCE
    schema: TERMINOLOGY
    description: Curated Primary Care Domain terminology releases
    raw_prefix: raw_reference_terminology
    domain: shared
    manual: true

  # ========================================
  # MESH IN-FLOW Via PID Environment
  # ========================================

  # Local Providers Flows
  - source_name: local_provider_flows
    database: DATA_LAKE
    schema: LOCAL_PROVIDER_FLOWS
    description: Providers submissions from PID environment via MESH
    raw_prefix: raw_lpf
    domain: pid_env

    # CLTCS EMIS extract
  - source_name: cltcs_emis_extract
    database: DATA_LAKE__NCL
    schema: CLTCS
    description: EMIS extract for c-ltcs pipeline from PID environment via MESH and other local lookups
    raw_prefix: raw_cltcs_emis
    domain: pid_env

  # ========================================
  # FACT SCHEMAS IN DATA_LAKE
  # ========================================

  # Fact Patient Schema
  - source_name: fact_patient
    database: DATA_LAKE
    schema: FACT_PATIENT
    description: Patient fact tables
    raw_prefix: raw_fact_patient
    domain: shared

  # Fact Practice Schema
  - source_name: fact_practice
    database: DATA_LAKE
    schema: FACT_PRACTICE
    description: Practice fact tables
    raw_prefix: raw_fact_practice
    domain: shared

  # ========================================
  # MANUAL SOURCES (not auto-generated)
  # ========================================
  # Manual sources are defined either in models/sources/sources.yml or a
  # models/sources/manual_*.yml file. They are listed here so scripts know
  # the raw_prefix and domain to use when generating raw models. Entries
  # tagged `manual: true` are skipped by the metadata query and source YAML
  # generation steps; their column lists come from the manual YAML instead.

  # ServicesDataLocal remapped feeds (CNWL et al. spreadsheet submissions)
  # See https://github.com/.../servicesdatalocal-remapping
  # Many tables in this schema; only MHCORL is currently consumed downstream
  # so we declare it manually to avoid auto-pulling 30+ unused feeds.
  - source_name: sdl
    database: DATA_LAKE__NCL
    schema: SDL
    description: ServicesDataLocal canonical-named feeds (mental health, community, 111, etc.)
    raw_prefix: raw_sdl
    domain: commissioning
    manual: true

  # ServicesDataLocal WNL-footprint feeds (permanent home; DATA_LAKE__NCL.SDL
  # and WNL_SDL copies will be retired). Only the SLAM contract-monitoring
  # feeds + the pipeline META observability objects are pulled; the schema
  # holds 20+ other feeds (CONTROL_* tables stay in DATA_LAKE only).
  - source_name: sdl_wnl
    database: DATA_LAKE
    schema: SDL
    description: ServicesDataLocal canonical-named feeds, WNL footprint (SLAM contract monitoring)
    raw_prefix: raw_sdl_wnl
    domain: commissioning
    tables:
      - LSACM
      - LSPLCM
      - LSDRPLCM
      - LSDEPLCM
      - COMOPL
      - REF
      - MH
      - META_FILE_REGISTRY
      - META_SCHEMA_VERSIONS
      - META_FILE_VERSIONS
      - META_EXCEPTIONS
      - META_BUILD_STATE
      - META_REFRESH_LOG
      - META_NULL_RATE_PROFILE
      - META_UNMAPPED_FILES
      - META_ROW_COUNT_COMPARE

  # ANALYST_MANAGED - volatile schema; only explicitly listed tables are used
  - source_name: reference_analyst_managed
    database: DATA_LAKE__NCL
    schema: ANALYST_MANAGED
    description: Analyst-managed reference datasets and business rules
    raw_prefix: raw_reference
    domain: shared
    manual: true

  # POD_GROUP_MANAGER - governed POD group mappings maintained by the
  # Streamlit-in-Snowflake POD Group Manager app (audited writes). Manual so
  # only the mapping table is used; app-internal tables/views are excluded.
  # raw_prefix 'raw' -> raw_pod_group_mapping (table names carry the domain).
  - source_name: pod_group_manager
    database: DATA_LAKE__NCL
    schema: POD_GROUP_MANAGER
    description: POD Group Manager app - governed POD group mappings
    raw_prefix: raw
    domain: shared
    manual: true

  # MYRIA - Project Myria (BEVC) canonical inputs. Two tables (ENROLLED_PATIENTS,
  # MATCHED_PATIENTS) loaded by DATA_LAKE__NCL.MYRIA.LOAD_NEW_FILES(). Manual so the
  # column list is controlled; FILE_DATE versions each upload.
  - source_name: myria
    database: DATA_LAKE__NCL
    schema: MYRIA
    description: Project Myria (BEVC) canonical inputs - enrolled and propensity-matched patients
    raw_prefix: raw_myria
    domain: shared
    manual: true

  # NHS PAYMENTS GP - annual practice-level NHS Payments to General Practice
  # file (national): registered + Carr-Hill weighted list sizes, FY 2015/16
  # onwards. Loaded by DATA_LAKE__NCL.NHS_PAYMENTS_GP.INGEST_NHS_PAYMENTS_GP()
  # (Snowflake-Deployment repo). Manual so the column list is controlled.
  - source_name: nhs_payments_gp
    database: DATA_LAKE__NCL
    schema: NHS_PAYMENTS_GP
    description: NHS Payments to General Practice - annual practice-level registered and Carr-Hill weighted list sizes
    raw_prefix: raw_nhs_payments_gp
    domain: shared
    manual: true

  # Reference Lookup NCL - Analyst-managed reference datasets
  - source_name: reference_lookup_ncl
    database: MODELLING
    schema: LOOKUP_NCL
    description: Analyst-managed reference datasets and business rules in the MODELLING environment
    raw_prefix: raw_reference_lookup_ncl
    domain: shared

  # C-LTCS tables
  - source_name: c_ltcs
    database: PUBLISHED_REPORTING__DIRECT_CARE
    schema: C_LTCS
    description: C-LTCS tables
    raw_prefix: raw_c_ltcs
    domain: commissioning
    manual: true
  
  # NOTE: the AIC_DEV pipeline (source_name: aic) was retired and is superseded
  # by DATA_LAKE__NCL.COMMON, declared manually in models/sources/manual_common.yml.
  # Manual-only sources (common, ukhfd_*) set their raw domain/prefix via `meta`
  # in their own YAML rather than here.

  # Central Performance Analytics Team (CPAT PMCT)
  - source_name: pmct
    database: DATA_LAKE
    schema: PMCT
    description: Central Performance Analytics Team (PMCT)
    raw_prefix: raw_pmct
    domain: commissioning

  # Imaging diagnostic Turnaround Times (TAT) provider submissions
  # Loaded by the tat_provider_ingest pipeline (Snowflake-Deployment repo).
  # Only the raw landing table is a source; TAT_INGEST_LOG is operational, not consumed.
  - source_name: tat
    database: DATA_LAKE
    schema: TAT
    description: Imaging diagnostic turnaround-time provider submissions (raw landing)
    raw_prefix: raw_tat
    domain: commissioning
    tables:
      - TURNAROUND_TIMES_RAW
