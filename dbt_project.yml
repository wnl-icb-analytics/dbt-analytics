name: 'wnl_analytics'
version: '2.0.0'
config-version: 2

profile: 'wnl_analytics'

flags:
  partial_parse: true

# Display connection info when dbt runs start
  require_generic_test_arguments_property: true
on-run-start:
  - "{% if execute %}{{ log('🔗 DBT CONNECTION: Role=' ~ target.role ~ ', Warehouse=' ~ target.warehouse ~ ', Database=' ~ target.database ~ ', Schema=' ~ target.schema ~ ', Target=' ~ target.name, info=True) }}{% endif %}"
  - "{% if flags.WHICH in ['run', 'build'] %}{{ create_row_count_log_table() }}{% endif %}"

on-run-end:
  - "{{ trigger_cltcs_secure_view_rebuild() }}"
  
clean-targets:
  - "target"
  - "dbt_modules"

model-paths: ["models"]

# Configuration moved to macros/config/ - see macros/config/README.md
vars:
  dbt_audit_schema: "test_audit"
  auto_schema_domains: ['olids']
  qof_reference_date: "2025-11-04"  # EMIS QOF extract date, override via --vars
  # Elementary observability
  disable_dbt_artifacts_autoupload: "{{ target.name not in ['prod', 'snowflake-prod'] }}"
  disable_run_results: "{{ target.name not in ['prod', 'snowflake-prod'] }}"
  disable_tests_results: "{{ target.name not in ['prod', 'snowflake-prod'] }}"
  disable_dbt_invocation_autoupload: "{{ target.name not in ['prod', 'snowflake-prod'] }}"
  #ICB definitions
  wnl_ods_codes: ['Z9B2Z', 'QMJ', 'QRV']   # merged + legacy NCL/NWL
  #Sub ICB definitions
  ncl_sub_icb: "93C"
  ncl_trust_codes_acute: ['RP4', 'RP6', 'RAL', 'RAN', 'RRV', 'RKE']
  ncl_trust_codes_full: ['RP4', 'RP6', 'RAL', 'RAN', 'RRV', 'RKE', 'G6V2S', 'RNK']
  ncl_borough_names: ['Barnet', 'Camden', 'Enfield', 'Islington', 'Haringey']
  ncl_borough_codes: ['E09000003', 'E09000007', 'E09000010', 'E09000014', 'E09000019']
  nwl_sub_icb: "W2U3Z"
  nwl_trust_codes_acute: ['RAS', 'RYJ', 'RQM', 'R1K']
  nwl_trust_codes_full: ['RAS', 'RYJ', 'RQM', 'R1K', 'RKL', 'RV3', 'RYX']
  ##Provisional: not clear if 'West London' should be included, there is no borough code for 'West London'
  nwl_borough_names: ['Brent', 'Ealing', 'Hammersmith and Fulham', 'Harrow', 'Hillingdon', 'Hounslow', 'Kensington and Chelsea', 'Westminster', 'West London']
  nwl_borough_codes: ['E09000005', 'E09000009', 'E09000013', 'E09000015', 'E09000017', 'E09000018', 'E09000020', 'E09000033']

# Configure test failure storage (only for failures)
tests:
  +store_failures: false
  +schema: "test_audit"

# Analyses are ad-hoc QA SQL: compiled for manual execution, never built.
# They reference relations by constructed name across environments, so skip
# static analysis (Fusion otherwise errors on relations absent from the catalog).
analyses:
  wnl_analytics:
    +static_analysis: "off"

models:
  wnl_analytics:
    +materialized: table
    +persist_docs:
      columns: true
    +post-hook: ["{{ grant_ownership_with_copy() }}"]
    +enabled: true

    # Raw layer - source data with minimal transformation
    raw:
      +materialized: view
      +database: "STAGING"
      +schema: "DBT_RAW"
      # No 'daily' tag: raw views build as ancestors of the staging/daily models
      # that ref them (+tag:daily pulls them in). Tagging all ~660 raw views
      # 'daily' fired every view at once, exhausting the connection pool inside
      # EXECUTE DBT PROJECT (Fusion ignores threads).
      +tags: ["raw"]
      +post-hook: ["{{ add_model_comment() }}"]

    # Staging layer - cleaned and standardised source data
    # Schema derived per source-system folder via generate_schema_name macro
    staging:
      +materialized: view
      +database: "STAGING"
      +tags: ["staging", "daily"]
      +post-hook: ["{{ add_model_comment() }}"]
      olids:
        +meta:
          custom_message: "Includes OLIDS data - for secondary use, INNER JOIN to REPORTING.OLIDS_PERSON_STATUS.DIM_PERSON_SECONDARY_USE_ALLOWED ON person_id to apply National Data Opt-Out and Type 1 opt-out filtering."

    # Reference layer - derived reference datasets
    # Schema = subfolder name: models/reference/organisation -> REFERENCE.ORGANISATION
    reference:
      +enabled: true
      +materialized: table
      +database: "REFERENCE"
      +tags: ["reference"]
      +post-hook:
        - "{{ add_model_comment() }}"
        - "{{ log_row_count() }}"

    # Modelling layer - business logic and transformations
    modelling:
      +enabled: true
      +materialized: table
      +database: "MODELLING"
      +tags: ["modelling"]
      +post-hook:
        - "{{ add_model_comment() }}"
        - "{{ log_row_count() }}"
      olids:
        +meta:
          custom_message: "Includes OLIDS data - for secondary use, INNER JOIN to REPORTING.OLIDS_PERSON_STATUS.DIM_PERSON_SECONDARY_USE_ALLOWED ON person_id to apply National Data Opt-Out and Type 1 opt-out filtering."
        risk_stratification:
          +schema: "RISK_STRATIFICATION"

    # Reporting layer - aggregated and analytical models
    reporting:
      +enabled: true
      +materialized: table
      +database: "REPORTING"
      +tags: ["reporting"]
      +post-hook:
        - "{{ add_model_comment() }}"
        - "{{ log_row_count() }}"
      olids:
        +meta:
          custom_message: "Includes OLIDS data - for secondary use, INNER JOIN to REPORTING.OLIDS_PERSON_STATUS.DIM_PERSON_SECONDARY_USE_ALLOWED ON person_id to apply National Data Opt-Out and Type 1 opt-out filtering."
        # Schema names automatically derived from subdomain folder names via generate_schema_name macro
        definitions:
          +database: "{{ target.database.replace('MODELLING', 'REPORTING') }}"
        risk_stratification:
          +schema: "RISK_STRATIFICATION"

    # Semantic layer - Snowflake Semantic Views for Cortex Analyst
    semantic:
      +enabled: true
      +materialized: semantic_view
      # Semantic-view DDL is not standard SELECT SQL; skip Fusion static analysis.
      +static_analysis: "off"
      +database: "REPORTING"
      +schema: "SEMANTIC"
      +tags: ["semantic"]
      +meta:
        custom_message: "Snowflake semantic view for aggregate analysis. Use the view definition for available dimensions, facts and metrics."

    # Partner layer - production-ready datasets for partner users
    partner:
      +enabled: true
      +materialized: table
      +database: "PUBLISHED_REPORTING__PARTNER"
      +tags: ["partner"]
      +post-hook:
        - "{{ add_model_comment() }}"
        - "{{ log_row_count() }}"
      published_data:
        +database: "PUBLISHED_REPORTING__PARTNER"
        +schema: "PUBLISHED_DATA"
        # Row access policy on published data only. NOT on security/: the policy
        # body queries PARTNER_MAPPING, so attaching it to the mapping table
        # would be self-referential.
        +row_access_policy: >-
          {%- if target.name in ['prod', 'snowflake-prod'] -%}
          PUBLISHED_REPORTING__PARTNER.SECURITY.PARTNER_POLICY on (sk_patient_id)
          {%- else -%}
          DEV__PUBLISHED_REPORTING__PARTNER.SECURITY.PARTNER_POLICY on (sk_patient_id)
          {%- endif -%}
        olids:
          +meta:
            custom_message: "Includes OLIDS data already filtered via REPORTING.OLIDS_PERSON_STATUS.DIM_PERSON_SECONDARY_USE_ALLOWED (National Data Opt-Out and Type 1 opt-outs excluded). Safe to use for secondary purposes."
          # Schema names automatically derived from subdomain folder names via generate_schema_name macro
          +post-hook:
            - "{{ add_model_comment() }}"
            - "{{ log_row_count() }}"

    # Published layer - production-ready datasets for end users
    published:
      +enabled: true
      +materialized: table
      +tags: ["published_reporting"]
      +post-hook:
        - "{{ add_model_comment() }}"
        - "{{ log_row_count() }}"
      direct_care:
        +database: "PUBLISHED_REPORTING__DIRECT_CARE"
        olids:
          +meta:
            custom_message: "Includes OLIDS data - direct care use; opt-out filtering NOT applied. For secondary use, INNER JOIN to REPORTING.OLIDS_PERSON_STATUS.DIM_PERSON_SECONDARY_USE_ALLOWED ON person_id."
          # Schema names automatically derived from subdomain folder names via generate_schema_name macro
        C_LTCS:
          +meta:
            custom_message: "Requires access via application role - clinical programme team only."
          +schema: "C_LTCS"
      secondary_use:
        +database: "PUBLISHED_REPORTING__SECONDARY_USE"
        olids:
          +meta:
            custom_message: "Includes OLIDS data already filtered via REPORTING.OLIDS_PERSON_STATUS.DIM_PERSON_SECONDARY_USE_ALLOWED (National Data Opt-Out and Type 1 opt-outs excluded). Safe to use for secondary purposes."
          # Schema names automatically derived from subdomain folder names via generate_schema_name macro
          +post-hook:
            - "{{ add_model_comment() }}"
            - "{{ log_row_count() }}"

  # Elementary observability configuration
  elementary:
    +enabled: "{{ target.name in ['prod', 'snowflake-prod'] }}"  # Only run Elementary in prod
    +database: "DATA_LAKE__NCL"
    +schema: "DBT_OBSERVABILITY"

seeds:
  wnl_analytics:
    +database: "DATA_LAKE__NCL"
    +schema: "DBT_SEEDS"
    +quote_columns: false
    +post-hook: ["{{ add_model_comment() }}"]

    uec_site_label:
      +column_types:
        site_code: varchar(10)
        department_type: varchar(2)
        uec_site_label: varchar(50)
        provider_code: varchar(10)
        icb_footprint: varchar(3)
        effective_from: date
        effective_to: date
        note: varchar(200)

    practice_merges:
      +column_types:
        predecessor_code: varchar(10)
        successor_code: varchar(10)
        predecessor_name: varchar(200)
        successor_name: varchar(200)
        note: varchar(500)

    bnf_polypharmacy_exclusions:
      +column_types:
        bnf_chapter_code: varchar(10)
        chapter_name: varchar(200)
        is_excluded: boolean

    ethnicity_snomed_ONS_NHS:
      +column_types:
        SNOMED_CODE: varchar
        SNOMED_TERM: varchar
        CATEGORY: varchar
        SUBCATEGORY: varchar
        GRANULAR: varchar
        ONS_BRIDGE_CODE: varchar
        ONS_BRIDGE_LABEL: varchar
        BK_ETHNICITY_CODE: varchar
        ETHNICITY_DESC: varchar

    emis_list_size:
      +column_types:
        BOROUGH: varchar(50)
        CODE: varchar(10)
        GP_PRACTICE: varchar(200)
        LIST_SIZE: integer
        EXTRACT_DATE: varchar(10)

    observation_unit_rules:
      +column_types:
        DEFINITION_ID: varchar(50)
        DEFINITION_NAME: varchar(50)
        CONFIG_ID: varchar(50)
        CONFIG_VERSION: varchar(20)
        CONVERT_FROM_UNIT: varchar(50)
        CONVERT_TO_UNIT: varchar(20)
        MULTIPLY_BY: float
        PRE_OFFSET: float
        POST_OFFSET: float

    observation_standard_units:
      +column_types:
        DEFINITION_ID: varchar(50)
        DEFINITION_NAME: varchar(50)
        CONFIG_ID: varchar(50)
        CONFIG_VERSION: varchar(20)
        UNIT: varchar(20)
        PRIMARY_UNIT: boolean

    observation_value_bounds:
      +column_types:
        DEFINITION_ID: varchar(50)
        DEFINITION_NAME: varchar(50)
        CONFIG_ID: varchar(50)
        CONFIG_VERSION: varchar(20)
        ABSOLUTE_LOWER: float
        ABSOLUTE_UPPER: float
        CANONICAL_EXPONENT: integer
        BIOLOGICAL_LOWER: float
        BIOLOGICAL_UPPER: float

    qadmissions_lab_thresholds:
      +column_types:
        measurement: varchar(50)
        sex: varchar(10)
        direction: varchar(10)
        threshold: float
        unit: varchar(20)
        source_reference: varchar(100)

    qadmissions_townsend_lsoa_2011:
      +column_types:
        lsoa_2011_code: varchar(9)
        lsoa_2011_label: varchar(100)
        townsend_score: float
        townsend_quintile: integer

    qadmissions_eth2016_to_ethrisk9:
      +column_types:
        ethnicity_subcategory: varchar(60)
        ethrisk: integer
        qadmissions_label: varchar(30)

snapshots:
  wnl_analytics:
    +database: "MODELLING"
    +target_schema: "DBT_SNAPSHOTS"
    +post-hook: ["{{ add_model_comment() }}"]
